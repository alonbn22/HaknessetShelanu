    title:
      he: "הוצב במקום ה-18 ברשימת \"ביחד\" (בנט–לפיד) לכנסת ה-26"
      en: "Placed 18th on the Bennett–Lapid \"Beyachad\" list for the 26th Knesset"
    description:
      he: "ברשימת יש עתיד שהציג יאיר לפיד ב-5 בספטמבר 2026 שובץ להב-הרצנו בעשירייה השנייה, וברשימה המשותפת \"ביחד\" בראשות נפתלי בנט ולפיד, שהוצגה ב-6 בספטמבר והוגשה לוועדת הבחירות המרכזית למחרת, הוצב במקום ה-18. יש עתיד הסבירה כי במקומות הריאליים שובצו מי שהצטיינו בעבודת ועדות הכנסת בקדנציה החולפת."
      en: "On the Yesh Atid slate presented by Yair Lapid on 5 September 2026 Lahav-Hertzanu was placed in the second ten, and on the joint \"Beyachad\" list headed by Naftali Bennett and Lapid, unveiled on 6 September and submitted to the Central Elections Committee the next day, he was placed 18th. Yesh Atid said the realistic slots went to MKs who had excelled in Knesset committee work in the outgoing term."
