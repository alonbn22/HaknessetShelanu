        title: "MK Naama Lazimi wins No. 2 spot after Yair Golan in left-wing Democrats' primary"
        publisher: "The Times of Israel"
  - kind: neutral
    category: news
    date: "2026-08-05"
    title:
      he: "עתרה לבג\"ץ נגד העברות תקציביות בוועדת הכספים; בית המשפט הקפיא את הכספים"
      en: "Petitioned the High Court against Finance Committee fund transfers; the court froze the funds"
    description:
      he: "באוגוסט 2026 עתרה לזימי, יחד עם עמותת חדו\"ש, לבג\"ץ נגד כינוס ועדת הכספים בפגרה לאישור העברות תקציביות, בהן כספים למוסדות חינוך חרדיים ולמשרד ההתיישבות, בטענה שהכינוס נעשה ללא ההתראה הנדרשת. בית המשפט העליון הורה על הקפאת הכספים עד להכרעה."
      en: "In August 2026 Lazimi, together with the Hiddush organization, petitioned the High Court of Justice against the Finance Committee's recess session approving budget transfers, including funds for Haredi schools and the Settlements Ministry, arguing that the session was convened without the required notice. The Supreme Court ordered the funds frozen pending a ruling."
    sources:
