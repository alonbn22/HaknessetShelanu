    date: "2026-08-12"
    title:
      he: עתירתו נגד בית הדין של הליכוד בעניין התמודדות ח"כים במחוזות נדחתה
      en: His petition against the Likud tribunal over MKs running in district slots was rejected
    description:
      he: >-
        לקראת הפריימריז בליכוד עתר עבד לבית המשפט המחוזי בתל אביב, בהצטרפות
        המפלגה, נגד החלטת בית הדין של הליכוד שלא לאפשר לשרים ולחברי כנסת מכהנים
        להתמודד במשבצות המחוזות. ב-10 באוגוסט 2026 דחה בית המשפט המחוזי את
        העתירה; עבד אמר כי "ההחלטה מבטלת את קביעת חברי הליכוד, שהם הריבון בתהליך
        הזה" והודיע על ערעור לעליון. ב-12 באוגוסט 2026, לאחר שהשופטים בבית המשפט
        העליון אותתו כי לא יתערבו, משך עבד את ערעורו וההחלטה הפכה סופית.
      en: >-
        Ahead of the Likud primary, Abed petitioned the Tel Aviv District Court,
        joined by the party, against the Likud tribunal's decision not to let
        sitting ministers and MKs compete in the district slots. On 10 August
        2026 the District Court rejected the petition; Abed said the ruling
        "overturns the decision of Likud members, who are the sovereign in this
        process" and announced an appeal to the Supreme Court. On 12 August 2026,
        after the Supreme Court justices signalled they would not intervene, Abed
        withdrew his appeal and the decision became final.
