    title:
      he: "הודיעה כי לא תתמודד בפריימריז ולא תרוץ לכנסת ה-26"
      en: "Announced she would not run in the Likud primary or for the 26th Knesset"
    description:
      he: "ב-25 במאי 2026 הודיעה דיסטל אטבריאן כי לא תתמודד בפריימריז הליכוד ותפרוש מהכנסת בתום כהונתה, ושיבחה את השר שלמה קרעי. בדיווחים צוינו יחסיה המתוחים עם ראש הממשלה ולשכתו. ברשימת הליכוד שהוגשה לוועדת הבחירות ב-8 בספטמבר 2026 היא אינה מופיעה."
      en: "On 25 May 2026 Distel Atbaryan announced she would not run in the Likud primary and would leave the Knesset at the end of its term, praising Minister Shlomo Karhi. Reports noted her strained relations with the prime minister and his office. She does not appear on the Likud list filed with the Central Elections Committee on 8 September 2026."
