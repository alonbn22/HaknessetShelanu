  - kind: negative
    category: investigation
    status: unconfirmed
    date: "2026-05-19"
    title:
      he: "לדבריו, תובע בית הדין הפלילי הבינלאומי ביקש נגדו צו מעצר חסוי; בית הדין סירב להגיב"
      en: "Says the ICC prosecutor has requested a sealed arrest warrant against him; the court declined to comment"
    description:
      he: "ב-19 במאי 2026 אמר סמוטריץ' כי נמסר לו שתובע בית הדין הפלילי הבינלאומי בהאג הגיש בקשה לצו מעצר חסוי נגדו, מבלי לפרט את החשדות. הבקשה לא אושרה רשמית: היא נשענת על דבריו שלו ועל דיווחים בתקשורת שציטטו מקורות אנונימיים. בית הדין סירב להגיב; לפי ה-BBC, הליך בקשת הצווים חסוי וטעון אישור שופטי בית הדין, ולא אושר כי הוצא צו. סמוטריץ' כינה את המהלך \"הכרזת מלחמה\", האשים את הרשות הפלסטינית והורה על פינוי הכפר הבדואי ח'אן אל-אחמר."
      en: "On 19 May 2026 Smotrich said he had been told that the prosecutor of the International Criminal Court in The Hague had filed a request for a sealed arrest warrant against him, without specifying the accusations. The request has not been officially confirmed: it rests on his own statement and on press reports citing unnamed sources. The court declined to comment; according to the BBC the warrant process is confidential and requires approval by ICC judges, and no warrant was confirmed to have been issued. Smotrich called the move \"a declaration of war\", blamed the Palestinian Authority and ordered the evacuation of the Bedouin village of Khan al-Ahmar."
      ar: "في 19 أيار/مايو 2026 قال سموتريتش إنه أُبلغ بأن المدعي العام للمحكمة الجنائية الدولية في لاهاي قدّم طلبًا لإصدار مذكرة اعتقال سرية بحقه، من دون تحديد التهم. لم يُؤكَّد الطلب رسميًا: فهو يستند إلى تصريحه هو وإلى تقارير صحفية نقلت عن مصادر لم تُسمِّها. ورفضت المحكمة التعليق؛ ووفقًا لـBBC فإن إجراءات طلب المذكرات سرية وتتطلب موافقة قضاة المحكمة، ولم يُؤكَّد صدور أي مذكرة. ووصف سموتريتش الخطوة بأنها «إعلان حرب»، واتهم السلطة الفلسطينية، وأمر بإخلاء قرية الخان الأحمر البدوية."
      ru: "19 мая 2026 года Смотрич заявил, что ему сообщили: прокурор Международного уголовного суда в Гааге подал запрос о выдаче секретного ордера на его арест, не уточнив, в чём его обвиняют. Официально запрос не подтверждён: он известен из заявления самого Смотрича и из сообщений СМИ со ссылкой на неназванные источники. Суд отказался от комментариев; по данным BBC, процедура запроса ордеров конфиденциальна и требует одобрения судей МУС, а выдача ордера подтверждена не была. Смотрич назвал этот шаг «объявлением войны», обвинил Палестинскую администрацию и распорядился выселить бедуинскую деревню Хан-эль-Ахмар."
      es: "El 19 de mayo de 2026 Smotrich dijo que le habían informado de que el fiscal de la Corte Penal Internacional de La Haya había presentado una solicitud de orden de detención secreta contra él, sin precisar las acusaciones. La solicitud no ha sido confirmada oficialmente: se basa en su propia declaración y en informaciones de prensa que citaban fuentes anónimas. La Corte declinó hacer comentarios; según la BBC, el procedimiento para solicitar órdenes es confidencial y requiere la aprobación de los jueces de la CPI, y no se confirmó que se hubiera emitido ninguna orden. Smotrich calificó la medida de «declaración de guerra», culpó a la Autoridad Palestina y ordenó el desalojo de la aldea beduina de Jan al Ahmar."
      fr: "Le 19 mai 2026, Smotrich a déclaré avoir été informé que le procureur de la Cour pénale internationale de La Haye avait déposé contre lui une demande de mandat d’arrêt secret, sans préciser les accusations. La demande n’a pas été confirmée officiellement : elle repose sur ses propres déclarations et sur des informations de presse citant des sources anonymes. La Cour s’est refusée à tout commentaire ; selon la BBC, la procédure de demande de mandats est confidentielle et doit être approuvée par les juges de la CPI, et l’émission d’un mandat n’a pas été confirmée. Smotrich a qualifié cette démarche de « déclaration de guerre », a accusé l’Autorité palestinienne et a ordonné l’évacuation du village bédouin de Khan al-Ahmar."
    sources:
