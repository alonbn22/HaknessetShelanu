  - id: netanyahu-government
    topic: government
    lean: right
    text:
      he: "הממשלה הבאה צריכה להיות בראשות בנימין נתניהו."
      en: "The next government should be led by Benjamin Netanyahu."
      ar: "يجب أن تكون الحكومة القادمة برئاسة بنيامين نتنياهو."
      ru: "Следующее правительство должно возглавить Биньямин Нетаньяху."
    stances:
      likud:
        value: 2
        basis: statement
        source: { url: "https://www.mako.co.il/news-israel-elections/2026/liveblog-5bc9483b18b70a1026.htm", title: "כל העדכונים מסגירת הרשימות לכנסת ה-26 (8.9.2026)", publisher: "N12" }
        quote:
          he: "רשימת הליכוד הוגשה לוועדת הבחירות בראשות ראש הממשלה בנימין נתניהו (8.9.2026)."
          en: "The Likud list was submitted to the Elections Committee headed by Prime Minister Benjamin Netanyahu (8 Sep 2026)."
      shas:
        value: 1
        basis: statement
        source: { url: "https://www.bhol.co.il/news/1738747", title: "מי עם נתניהו, מי פוסל אותו ומי פתוח לכולם? המדריך למפלגות בבחירות 2026 (9.9.2026)", publisher: "בחדרי חרדים" }
        quote:
          he: "לפי המדריך: בעלת בריתו המסורתית של נתניהו, אך משבר חוק הגיוס יצר ריחוק; פתוחה לחלופות, כולל איזנקוט."
          en: "Per the guide: Netanyahu's traditional ally, but the draft-law crisis created distance; open to alternatives including Eisenkot."
      utj:
        value: 1
        basis: statement
        source: { url: "https://www.bhol.co.il/news/1738747", title: "מי עם נתניהו, מי פוסל אותו ומי פתוח לכולם? המדריך למפלגות בבחירות 2026 (9.9.2026)", publisher: "בחדרי חרדים" }
        quote:
          he: "לפי המדריך: שמרה על מגעים עם איזנקוט (כולל פגישות של משה גפני), אך דרישת השירות היא מכשול."
          en: "Per the guide: kept contacts with Eisenkot (including Moshe Gafni meetings), but the service requirement is an obstacle."
