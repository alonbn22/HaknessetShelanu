    description:
      he: "לפי ויקיפדיה העברית, פסל לא הגיש מועמדות לפריימריז של הליכוד ב-2026. רשימת הליכוד שהוגשה לוועדת הבחירות המרכזית לקראת הבחירות לכנסת ה-26, כפי שפורסמה ב-9 בספטמבר 2026, אינה כוללת את שמו, וכהונתו צפויה להסתיים עם כינוס הכנסת ה-26."
      en: "According to Hebrew Wikipedia, Passal did not submit his candidacy for the 2026 Likud primaries. The Likud list submitted to the Central Elections Committee for the election to the 26th Knesset, as published on 9 September 2026, does not include his name, and his term is expected to end when the 26th Knesset convenes."
