    date: "1999-01-01"
    title:
      he: "מנכ\"ל משרד הפנים ומנכ\"ל משרד הבינוי והשיכון לפני כניסתו לפוליטיקה"
      en: "Director-general of the Interior Ministry and of the Construction and Housing Ministry before entering politics"
    description:
      he: "מעוז, יליד 1956, התגייס לצה\"ל ב-1975 והיה ב-1977 שותף בהקמת קיבוץ מגדל עוז בגוש עציון. ב-1999 מונה על ידי השר נתן שרנסקי למנכ\"ל משרד הפנים, ובשנים 2001–2004 כיהן כמנכ\"ל משרד הבינוי והשיכון תחת השרים שרנסקי ואפי איתם."
      en: "Born in 1956, Maoz enlisted in the IDF in 1975 and in 1977 was a co-founder of Kibbutz Migdal Oz in Gush Etzion. In 1999 minister Natan Sharansky appointed him director-general of the Interior Ministry, and from 2001 to 2004 he served as director-general of the Construction and Housing Ministry under ministers Sharansky and Effi Eitam."
    sources:
