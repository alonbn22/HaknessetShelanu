  - kind: neutral
    category: news
    date: "2026-01-05"
    title:
      he: יזמה פגישה בין ראש הממשלה למשפחת הילדה הנעדרת היימנות קסאו
      en: Arranged a meeting between the prime minister and the family of missing girl Haymanot Kasau
    description:
      he: >-
        ב-5 בינואר 2026 יזמה מלקו פגישה בין ראש הממשלה בנימין נתניהו למשפחתה של
        היימנות קסאו, ילדה בת תשע מצפת שנעלמה בפברואר 2024. לדבריה בריאיון ל"ג'רוזלם
        פוסט", המקרה לא זכה לתשומת לב תקשורתית וציבורית מספקת, והיא פועלת לסיווגו
        כחטיפה ולהגברת המאמצים לאיתור הילדה.
      en: >-
        On 5 January 2026 Melaku arranged a meeting between Prime Minister Benjamin
        Netanyahu and the family of Haymanot Kasau, a nine-year-old girl from Safed
        who disappeared in February 2024. In an interview with The Jerusalem Post
        she said the case had received too little media and public attention, and
        that she was pressing for it to be classified as a kidnapping and for
        greater efforts to find the girl.
    sources:
      - url: https://www.jpost.com/israel-news/article-883026
        title: "MK Tsega Melaku: Missing girl Haymanut Kasau ignored for nearly two years - interview"
        publisher: The Jerusalem Post
  - kind: neutral
    category: news
    date: "2026-08-14"
    title:
      he: פרשה מהפריימריז של הליכוד לכנסת ה-26 ולא נכללה ברשימת הליכוד
      en: Withdrew from the Likud primary for the 26th Knesset and was not included on the Likud list
    description:
      he: >-
        ב-14 באוגוסט 2026 הודיעה מלקו כי לא תתמודד בפריימריז של הליכוד שנערכו ב-17
        באוגוסט, לאחר שלא קיבלה שריון ברשימה חרף פניות של מנהיגים רוחניים של יוצאי
        אתיופיה, ובהם מכתב של 32 קייסים לנתניהו. לדבריה, "לא נשארה שום קונסטלציה
        פוליטית סבירה מבחינתי להיבחר... ציפיתי לשריון אחרי העבודה הקשה בכנסת
        הנוכחית אבל זה לא קרה". ברשימת הליכוד הסופית שפורסמה ב-8 בספטמבר 2026 היא
        אינה מופיעה.
      en: >-
        On 14 August 2026 Melaku announced she would not run in the Likud primary held
        on 17 August, after not receiving a reserved slot despite appeals by
        Ethiopian-Israeli spiritual leaders, including a letter from 32 kessim to
        Netanyahu. She said that "no reasonable political constellation remained for
        me to be elected... I expected a reserved slot after the hard work in the
        current Knesset, but it did not happen". She does not appear on the final
        Likud list published on 8 September 2026.
    sources:
