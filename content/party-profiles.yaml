  - id: 1105 # Religious Zionism
    verified: "2026-09-19"
    updates:
      - date: "2023-02-07"
        text:
          he: "(רקע) בצלאל סמוטריץ' התפטר מהכנסת לפי החוק הנורבגי עם מינויו לשר האוצר; צבי סוכות נכנס במקומו ב-7 בפברואר 2023."
          en: "(Background) Bezalel Smotrich resigned his Knesset seat under the Norwegian law on becoming finance minister; Zvi Sukkot entered in his place on 7 February 2023."
          ar: "(خلفية) استقال بتسلئيل سموتريتش من مقعده في الكنيست بموجب «القانون النرويجي» عند تعيينه وزيرًا للمالية؛ ودخل تسفي سوكوت مكانه في 7 شباط/فبراير 2023."
          ru: "(Справка) Бецалель Смотрич сложил депутатский мандат по «норвежскому закону», став министром финансов; 7 февраля 2023 года его место занял Цви Суккот."
          es: "(Antecedente) Bezalel Smotrich renunció a su escaño en la Knéset según la Ley Noruega al convertirse en ministro de Finanzas; Zvi Sukkot entró en su lugar el 7 de febrero de 2023."
          fr: "(Contexte) Bezalel Smotrich a démissionné de son siège à la Knesset en vertu de la « loi norvégienne » en devenant ministre des Finances ; Zvi Sukkot est entré à sa place le 7 février 2023."
        sources:
          - { url: "https://www.haaretz.com/israel-news/2023-02-05/ty-article/.premium/far-right-settler-leader-becomes-mk-under-law-to-expand-size-of-government/00000186-213a-d442-a18f-afbbb1ac0000", title: "Far-right Settler Leader Becomes MK Under Law to Expand Size of Government (2023-02-05)", publisher: "Haaretz" }
          - { url: "https://knesset.gov.il/OdataV4/ParliamentInfo/KNS_PersonToPosition?$filter=FactionID%20eq%201105%20and%20KnessetNum%20eq%2025", title: "KNS_PersonToPosition — FactionID 1105, Knesset 25 (Smotrich member to 2023-02-07; Sukkot from 2023-02-07) (2026-09-19)", publisher: "Knesset OData" }
      - date: "2024-11-11"
        text:
          he: "(רקע) אוהד טל החליף את שמחה רוטמן כיו\"ר סיעת הציונות הדתית בכנסת."
          en: "(Background) Ohad Tal replaced Simcha Rothman as chair of the Religious Zionism faction in the Knesset."
          ar: "(خلفية) حلّ أوهاد طال محل سيمحا روتمان رئيسًا لكتلة الصهيونية الدينية في الكنيست."
          ru: "(Справка) Охад Таль сменил Симху Ротмана на посту председателя фракции «Религиозный сионизм» в Кнессете."
          es: "(Antecedente) Ohad Tal sustituyó a Simcha Rothman como presidente de la facción Sionismo Religioso en la Knéset."
          fr: "(Contexte) Ohad Tal a remplacé Simcha Rothman à la présidence de la faction Sionisme religieux à la Knesset."
        sources:
          - { url: "https://knesset.gov.il/OdataV4/ParliamentInfo/KNS_PersonToPosition?$filter=FactionID%20eq%201105%20and%20KnessetNum%20eq%2025", title: "KNS_PersonToPosition — FactionID 1105, Knesset 25 (PositionID 48: Rothman 2022-12-15 → 2024-11-11; Tal from 2024-11-11) (2026-09-19)", publisher: "Knesset OData" }
      - date: "2025-01-21"
        text:
          he: "כהונתו של צבי סוכות בכנסת הסתיימה ב-21 בינואר 2025 — היום שבו נכנסו לתוקף התפטרויות שרי עוצמה יהודית מהממשלה ועמיחי אליהו שב לכנסת (השניים נבחרו ברשימה המשותפת של 2022, שממנה נקבעים המחליפים לפי החוק הנורבגי). הסיעה מנתה 6 חברים עד אפריל 2025."
          en: "Zvi Sukkot’s Knesset term ended on 21 January 2025 — the day the Otzma Yehudit ministers’ resignations took effect and Amichai Eliyahu returned to the Knesset (both were elected on the 2022 joint list, from which Norwegian-law replacements are drawn). The faction had 6 members until April 2025."
          ar: "انتهت ولاية تسفي سوكوت في الكنيست في 21 كانون الثاني/يناير 2025 — اليوم الذي دخلت فيه استقالات وزراء عوتسما يهوديت حيّز التنفيذ وعاد عميحاي إلياهو إلى الكنيست (انتُخب الاثنان في قائمة «الصهيونية الدينية» المشتركة لعام 2022، التي يُحدَّد منها البدلاء وفق «القانون النرويجي»). وضمّت الكتلة 6 أعضاء حتى نيسان/أبريل 2025."
          ru: "Полномочия Цви Суккота в Кнессете прекратились 21 января 2025 года — в день, когда вступили в силу отставки министров «Оцма Иегудит» и Амихай Элияху вернулся в Кнессет (оба были избраны по совместному списку 2022 года, из которого определяются замены по «норвежскому закону»). До апреля 2025 года во фракции было 6 депутатов."
          es: "El mandato de Zvi Sukkot en la Knéset terminó el 21 de enero de 2025 — el día en que se hicieron efectivas las renuncias de los ministros de Otzma Yehudit y Amichai Eliyahu volvió a la Knéset (ambos fueron elegidos en la lista conjunta de 2022, de la que salen los sustitutos según la Ley Noruega). La facción tuvo 6 miembros hasta abril de 2025."
          fr: "Le mandat de Zvi Sukkot à la Knesset a pris fin le 21 janvier 2025 — le jour où les démissions des ministres d’Otzma Yehoudit ont pris effet et où Amichai Eliyahu est revenu à la Knesset (tous deux avaient été élus sur la liste commune de 2022, d’où sont tirés les remplaçants selon la « loi norvégienne »). La faction a compté 6 membres jusqu’en avril 2025."
        sources:
          - { url: "https://knesset.gov.il/OdataV4/ParliamentInfo/KNS_PersonToPosition?$filter=FactionID%20eq%201105%20and%20KnessetNum%20eq%2025", title: "KNS_PersonToPosition — FactionID 1105 (Sukkot member 2023-02-07 → 2025-01-21) and FactionID 1106 (Eliyahu member from 2025-01-21) (2026-09-19)", publisher: "Knesset OData" }
          - { url: "https://www.timesofisrael.com/with-otzma-yehudit-out-of-government-netanyahu-set-to-appoint-replacement-ministers/", title: "With Otzma Yehudit out of government, Netanyahu set to appoint replacement ministers (2025-01-19)", publisher: "The Times of Israel" }
          - { url: "https://www.timesofisrael.com/utjs-goldknopf-resigns-from-cabinet-after-knesset-fails-to-pass-dissolution-bill/", title: "UTJ's Goldknopf resigns from cabinet after Knesset fails to pass dissolution bill (explains the Norwegian-law displacement mechanism) (2025-06-12)", publisher: "The Times of Israel" }
      - date: "2025-04-06"
        text:
          he: "אלמוג כהן (נבחר ברשימה המשותפת מטעם עוצמה יהודית) מונה לסגן שר במשרד ראש הממשלה ב-2 באפריל 2025 והתפטר מהכנסת לפי החוק הנורבגי; צבי סוכות שב לכנסת ב-6 באפריל 2025 והסיעה חזרה ל-7 חברים."
          en: "Almog Cohen (elected on the joint list for Otzma Yehudit) was appointed deputy minister in the Prime Minister’s Office on 2 April 2025 and resigned from the Knesset under the Norwegian law; Zvi Sukkot returned to the Knesset on 6 April 2025 and the faction was back to 7 members."
          ar: "عُيّن ألموغ كوهين (المنتخب في قائمة «الصهيونية الدينية» المشتركة عن عوتسما يهوديت) نائبًا للوزير في مكتب رئيس الحكومة في 2 نيسان/أبريل 2025 واستقال من الكنيست بموجب «القانون النرويجي»؛ وعاد تسفي سوكوت إلى الكنيست في 6 نيسان/أبريل 2025 وعادت الكتلة إلى 7 أعضاء."
          ru: "Альмог Коэн (избранный по совместному списку от «Оцма Иегудит») 2 апреля 2025 года был назначен заместителем министра в канцелярии премьер-министра и сложил мандат по «норвежскому закону»; 6 апреля 2025 года Цви Суккот вернулся в Кнессет, и во фракции снова стало 7 депутатов."
          es: "Almog Cohen (elegido en la lista conjunta por Otzma Yehudit) fue nombrado viceministro en la Oficina del Primer Ministro el 2 de abril de 2025 y renunció a la Knéset según la Ley Noruega; Zvi Sukkot volvió a la Knéset el 6 de abril de 2025 y la facción recuperó los 7 miembros."
          fr: "Almog Cohen (élu sur la liste commune au titre d’Otzma Yehoudit) a été nommé vice-ministre au bureau du Premier ministre le 2 avril 2025 et a démissionné de la Knesset en vertu de la « loi norvégienne » ; Zvi Sukkot est revenu à la Knesset le 6 avril 2025 et la faction est repassée à 7 membres."
        sources:
          - { url: "https://knesset.gov.il/OdataV4/ParliamentInfo/KNS_PersonToPosition?$filter=KnessetNum%20eq%2025%20and%20GovMinistryID%20ne%20null%20and%20IsCurrent%20eq%20true", title: "KNS_PersonToPosition — current government positions (Almog Cohen, deputy minister, PMO, from 2025-04-02); FactionID 1106 query: Cohen member to 2025-04-06; FactionID 1105 query: Sukkot member from 2025-04-06 (2026-09-19)", publisher: "Knesset OData" }
          - { url: "https://www.timesofisrael.com/former-otzma-yehudit-mk-to-run-in-likud-primary-after-netanyahu-opens-door/", title: "Former Otzma Yehudit MK to run in Likud primary after Netanyahu opens door (2026-08-12)", publisher: "The Times of Israel" }
      - date: "2026-08-13"
        text:
          he: "סמוטריץ' הודיע שהציונות הדתית תרוץ בנפרד מעוצמה יהודית: 'הציבור הדתי-לאומי יכול וצריך לרוץ בכוחות עצמו כמפלגה גדולה, חזקה ומשמעותית'. בן גביר שלל ריצה משותפת (27 ביולי) ודחה את דרישת נתניהו להתאחד (28 באוגוסט)."
          en: "Smotrich said Religious Zionism would run separately from Otzma Yehudit: ‘the Religious Zionist public can and should run on its own as a big, strong, significant party.’ Ben Gvir ruled out a joint run (27 July) and rejected Netanyahu’s demand to merge (28 August)."
          ar: "أعلن سموتريتش أن الصهيونية الدينية ستترشح منفصلة عن عوتسما يهوديت: «الجمهور الديني القومي يستطيع، بل يجب عليه، أن يترشح بقواه الذاتية حزبًا كبيرًا وقويًا ومؤثرًا». واستبعد بن غفير الترشح المشترك (27 تموز/يوليو) ورفض مطلب نتنياهو بالاتحاد (28 آب/أغسطس)."
          ru: "Смотрич заявил, что «Религиозный сионизм» пойдёт на выборы отдельно от «Оцма Иегудит»: «Религиозно-сионистская общественность может и должна идти самостоятельно — как большая, сильная и значимая партия». Бен-Гвир исключил совместное участие (27 июля) и отверг требование Нетаньяху объединиться (28 августа)."
          es: "Smotrich dijo que Sionismo Religioso se presentaría por separado de Otzma Yehudit: «el público sionista religioso puede y debe presentarse por su cuenta como un partido grande, fuerte y significativo». Ben Gvir descartó una candidatura conjunta (27 de julio) y rechazó la exigencia de Netanyahu de fusionarse (28 de agosto)."
          fr: "Smotrich a déclaré que le Sionisme religieux se présenterait séparément d’Otzma Yehoudit : « le public sioniste religieux peut et doit se présenter seul comme un grand parti, fort et significatif ». Ben Gvir a exclu une candidature commune (27 juillet) et rejeté l’exigence de fusion de Netanyahou (28 août)."
        sources:
          - { url: "https://www.jpost.com/israel-election-2026/article-905489", title: "WATCH: 'I know how to act responsibly': Smotrich outlines election strategy, plan to draft haredim (2026-08-13)", publisher: "The Jerusalem Post" }
          - { url: "https://www.jpost.com/israel-news/politics-and-diplomacy/article-903791", title: "Ben-Gvir rules out running with Smotrich for elections, says parties are 'fundamentally different' (2026-07-27)", publisher: "The Jerusalem Post" }
          - { url: "https://www.timesofisrael.com/ben-gvir-rejects-pms-demand-to-merge-with-smotrich-drawing-scathing-response-from-likud/", title: "Ben Gvir refuses Netanyahu's demand to merge with Smotrich; Likud: He's crowning Eisenkot (2026-08-28)", publisher: "The Times of Israel" }
      - date: "2026-09-01"
        text:
          he: "הציונות הדתית וזהות בראשות משה פייגלין הודיעו על ריצה משותפת (גוש טכני); סמוטריץ' קרא למפלגות ימין נוספות להצטרף. פייגלין שובץ במקום השני."
          en: "Religious Zionism and Moshe Feiglin’s Zehut announced a joint run as a technical bloc; Smotrich urged other right-wing parties to join. Feiglin was placed second."
          ar: "أعلنت الصهيونية الدينية وحزب زهوت بزعامة موشيه فيغلين ترشحًا مشتركًا (كتلة تقنية)؛ ودعا سموتريتش أحزاب يمين أخرى إلى الانضمام. ووُضع فيغلين في الموقع الثاني."
          ru: "«Религиозный сионизм» и партия «Зеут» Моше Фейглина объявили о совместном участии в выборах (технический блок); Смотрич призвал присоединиться другие правые партии. Фейглин получил второе место."
          es: "Sionismo Religioso y Zehut de Moshe Feiglin anunciaron una candidatura conjunta como bloque técnico; Smotrich instó a otros partidos de derecha a unirse. Feiglin quedó en segundo lugar."
          fr: "Le Sionisme religieux et Zehut de Moshe Feiglin ont annoncé une candidature commune sous forme de bloc technique ; Smotrich a appelé d’autres partis de droite à les rejoindre. Feiglin a été placé deuxième."
        sources:
          - { url: "https://www.timesofisrael.com/smotrich-feiglin-announce-joint-election-run-urge-other-right-wing-parties-to-join/", title: "Smotrich, Feiglin announce joint election run, urge other right-wing parties to join (2026-09-01)", publisher: "The Times of Israel" }
      - date: "2026-09-08"
        text:
          he: "הרשימה המשותפת הוגשה (רשימה 31, אות מבוקשת ט) בידי האיחוד הלאומי-תקומה, זהות ועתיד אחד: 1 בצלאל סמוטריץ', 2 משה פייגלין (זהות), 3 אורית סטרוק (עתיד אחד), 4 שמחה רוטמן, 5 צבי מור, 6 איתמר איתם, 7 צבי סוכות, 8 יצחק זאגא (זהות), 9 רעות בן חיים, 10 עומר וולדמן (זהות), 11 ארקדי מוטר (זהות), 12 אוהד טל."
          en: "The joint list was submitted (list 31, requested letter ט) by National Union–Tkuma, Zehut and Atid Echad: 1 Bezalel Smotrich, 2 Moshe Feiglin (Zehut), 3 Orit Strook (Atid Echad), 4 Simcha Rothman, 5 Zvi Mor, 6 Itamar Eitam, 7 Zvi Sukkot, 8 Yitzhak Zaga (Zehut), 9 Reut Ben Haim, 10 Omer Waldman (Zehut), 11 Arkadi Muter (Zehut), 12 Ohad Tal."
          ar: "قُدّمت قائمة الصهيونية الدينية–زهوت (القائمة 31، الحرف المطلوب ט) من قِبل الاتحاد الوطني – تكوما وزهوت و«مستقبل واحد»: 1 بتسلئيل سموتريتش، 2 موشيه فيغلين (زهوت)، 3 أوريت ستروك («مستقبل واحد»)، 4 سيمحا روتمان، 5 تسفي مور، 6 إيتمار إيتام، 7 تسفي سوكوت، 8 يتسحاق زاغا (زهوت)، 9 رعوت بن حاييم، 10 عومر فالدمان (زهوت)، 11 أركادي موتر (زهوت)، 12 أوهاد طال."
          ru: "Совместный список подан (список 31, запрошенная буква ט) партиями «Национальный союз — Ткума», «Зеут» и «Единое будущее»: 1 Бецалель Смотрич, 2 Моше Фейглин («Зеут»), 3 Орит Струк («Единое будущее»), 4 Симха Ротман, 5 Цви Мор, 6 Итамар Эйтам, 7 Цви Суккот, 8 Ицхак Зага («Зеут»), 9 Реут Бен-Хаим, 10 Омер Вальдман («Зеут»), 11 Аркадий Мутер («Зеут»), 12 Охад Таль."
          es: "La lista conjunta fue presentada (lista 31, letra solicitada ט) por Unión Nacional–Tkuma, Zehut y Atid Echad: 1 Bezalel Smotrich, 2 Moshe Feiglin (Zehut), 3 Orit Strook (Atid Echad), 4 Simcha Rothman, 5 Zvi Mor, 6 Itamar Eitam, 7 Zvi Sukkot, 8 Yitzhak Zaga (Zehut), 9 Reut Ben Haim, 10 Omer Waldman (Zehut), 11 Arkadi Muter (Zehut), 12 Ohad Tal."
          fr: "La liste commune a été déposée (liste 31, lettre demandée ט) par Union nationale–Tkuma, Zehut et Atid Echad : 1 Bezalel Smotrich, 2 Moshe Feiglin (Zehut), 3 Orit Strook (Atid Echad), 4 Simcha Rothman, 5 Zvi Mor, 6 Itamar Eitam, 7 Zvi Sukkot, 8 Yitzhak Zaga (Zehut), 9 Reut Ben Haim, 10 Omer Waldman (Zehut), 11 Arkadi Muter (Zehut), 12 Ohad Tal."
        sources:
          - { url: "https://www.gov.il/he/pages/tzionutdatit-zehut_list31", title: "רשימת המועמדים — הציונות הדתית בראשות בצלאל סמוטריץ' וזהות בראשות משה פייגלין (רשימה 31) (2026-09-08)", publisher: "ועדת הבחירות המרכזית / gov.il" }
          - { url: "https://www.timesofisrael.com/israels-election-takes-shape-as-38-parties-submit-slates-from-likud-to-joint-list/", title: "Israel's election takes shape as 38 parties submit slates, in battle between pro- and anti-Netanyahu blocs (2026-09-09)", publisher: "The Times of Israel" }
      - date: "2026-09-24"
        text:
          he: "ב-24 בספטמבר 2026 דחתה ועדת הבחירות המרכזית את שלוש הבקשות שנדונו באותו יום: לפסול את רשימת עוצמה יהודית (10 בעד, 19 נגד, נמנע אחד; הגישו הדמוקרטים, ובנפרד עמותת זולת עם כמה אישי ציבור), את רשימת הציונות הדתית וזהות (3 בעד, 21 נגד; הגישו זולת ואותם אישי ציבור) ואת רשימת הדמוקרטים (2 בעד, 14 נגד; הגישו עוצמה יהודית ואיתמר בן גביר). המבקשים טענו לשלילת קיומה של ישראל כמדינה יהודית ודמוקרטית ולהסתה לגזענות; היועצת המשפטית לממשלה התנגדה לפסילת שלוש הרשימות. בקשות לפסול אישית מועמדים ברשימות אלה, ובהם בן גביר, טלי גוטליב, בצלאל סמוטריץ' ויאיר גולן, נמחקו כבר ב-14–15 בספטמבר, משום שלא צורפו להן חתימות של שליש מחברי הוועדה כנדרש בחוק."
          en: "On 24 September 2026 the Central Elections Committee rejected all three requests heard that day: to disqualify the Otzma Yehudit list (10 for, 19 against, one abstention; filed by the Democrats and, separately, by the Zulat institute with several public figures), the Religious Zionism–Zehut list (3 for, 21 against; filed by Zulat and the same public figures) and the Democrats list (2 for, 14 against; filed by Otzma Yehudit and Itamar Ben Gvir). The petitioners alleged rejection of Israel's existence as a Jewish and democratic state and incitement to racism; the Attorney General opposed disqualifying all three lists. Requests to bar individual candidates on these lists, among them Ben Gvir, Tally Gotliv, Bezalel Smotrich and Yair Golan, had been struck on 14–15 September because they lacked the signatures of a third of the committee's members, as the law requires."
          ar: "في 24 أيلول/سبتمبر 2026 رفضت لجنة الانتخابات المركزية الطلبات الثلاثة التي نظرت فيها ذلك اليوم: شطب قائمة عوتسما يهوديت (10 مع، 19 ضد، وامتناع واحد؛ قدّمه الديمقراطيون، وبشكل منفصل معهد «زولات» مع عدد من الشخصيات العامة)، وقائمة الصهيونية الدينية–زهوت (3 مع، 21 ضد؛ قدّمه «زولات» والشخصيات العامة نفسها)، وقائمة الديمقراطيين (2 مع، 14 ضد؛ قدّمته عوتسما يهوديت وإيتمار بن غفير). وادّعى مقدّمو الطلبات إنكار وجود إسرائيل دولةً يهودية وديمقراطية والتحريض على العنصرية؛ وعارضت المستشارة القضائية للحكومة شطب القوائم الثلاث. أما طلبات شطب مرشحين أفراد في هذه القوائم، ومنهم بن غفير وطالي غوتليف وبتسلئيل سموتريتش ويائير غولان، فقد أُسقطت منذ 14–15 أيلول/سبتمبر لعدم إرفاق تواقيع ثلث أعضاء اللجنة كما يشترط القانون."
          ru: "24 сентября 2026 года Центральная избирательная комиссия отклонила все три ходатайства, рассмотренные в тот день: об отстранении списка «Оцма Иегудит» (10 за, 19 против, 1 воздержался; подали «Демократы» и отдельно институт «Зулат» вместе с рядом общественных деятелей), списка «Религиозный сионизм — Зеут» (3 за, 21 против; подали «Зулат» и те же общественные деятели) и списка «Демократов» (2 за, 14 против; подали «Оцма Иегудит» и Итамар Бен-Гвир). Заявители ссылались на отрицание существования Израиля как еврейского и демократического государства и подстрекательство к расизму; юридический советник правительства выступила против отстранения всех трёх списков. Ходатайства об отстранении отдельных кандидатов этих списков, в том числе Бен-Гвира, Тали Готлив, Бецалеля Смотрича и Яира Голана, были оставлены без рассмотрения ещё 14–15 сентября, поскольку к ним не приложили подписи трети членов комиссии, как того требует закон."
          es: "El 24 de septiembre de 2026 la Comisión Electoral Central rechazó las tres solicitudes que examinó ese día: inhabilitar la lista de Otzma Yehudit (10 a favor, 19 en contra y una abstención; presentada por Los Demócratas y, por separado, por el instituto Zulat con varias figuras públicas), la de Sionismo Religioso–Zehut (3 a favor, 21 en contra; presentada por Zulat y las mismas figuras públicas) y la de Los Demócratas (2 a favor, 14 en contra; presentada por Otzma Yehudit e Itamar Ben Gvir). Los solicitantes alegaban negación de la existencia de Israel como Estado judío y democrático e incitación al racismo; la asesora jurídica del Gobierno se opuso a inhabilitar las tres listas. Las solicitudes para inhabilitar a candidatos concretos de esas listas, entre ellos Ben Gvir, Tally Gotliv, Bezalel Smotrich y Yair Golan, ya se habían archivado el 14 y 15 de septiembre por no llevar las firmas de un tercio de los miembros de la comisión, como exige la ley."
          fr: "Le 24 septembre 2026, la Commission électorale centrale a rejeté les trois demandes examinées ce jour-là : l’invalidation de la liste d’Otzma Yehoudit (10 pour, 19 contre, une abstention ; déposée par les Démocrates et, séparément, par l’institut Zulat avec plusieurs personnalités publiques), de celle du Sionisme religieux–Zehut (3 pour, 21 contre ; déposée par Zulat et les mêmes personnalités) et de celle des Démocrates (2 pour, 14 contre ; déposée par Otzma Yehoudit et Itamar Ben Gvir). Les requérants invoquaient le rejet de l’existence d’Israël en tant qu’État juif et démocratique et l’incitation au racisme ; la conseillère juridique du gouvernement s’est opposée à l’invalidation des trois listes. Les demandes visant personnellement des candidats de ces listes, dont Ben Gvir, Tally Gotliv, Bezalel Smotrich et Yair Golan, avaient été radiées dès les 14 et 15 septembre, faute des signatures d’un tiers des membres de la commission exigées par la loi."
        sources:
          - { url: "https://www.timesofisrael.com/liveblog_entry/election-panel-rejects-bid-to-disqualify-ben-gvirs-far-right-otzma-yehudit/", title: "Election panel vote on the Otzma Yehudit list (24 Sep 2026)", publisher: "The Times of Israel" }
          - { url: "https://www.timesofisrael.com/liveblog_entry/election-panel-rejects-bid-to-disqualify-smotrichs-religious-zionism-party", title: "Election panel vote on the Religious Zionism–Zehut list (24 Sep 2026)", publisher: "The Times of Israel" }
          - { url: "https://www.timesofisrael.com/liveblog_entry/election-panel-rejects-bid-to-disqualify-democrats-concluding-hearings-on-election-bans/", title: "Election panel vote on the Democrats list (24 Sep 2026)", publisher: "The Times of Israel" }
          - { url: "https://www.gov.il/BlobFolder/guide/candidates-lists-26/he/pr6_26_decision.pdf", title: "פ\"ר 6/26 — החלטה (14.9.2026)", publisher: "ועדת הבחירות המרכזית" }
          - { url: "https://www.gov.il/BlobFolder/guide/candidates-lists-26/he/pr9_26_decision.pdf", title: "פ\"ר 9/26 — החלטה (15.9.2026)", publisher: "ועדת הבחירות המרכזית" }
          - { url: "https://www.gov.il/BlobFolder/guide/candidates-lists-26/he/pm3_26_decision.pdf", title: "פ\"מ 3/26 — החלטה (14.9.2026)", publisher: "ועדת הבחירות המרכזית" }
