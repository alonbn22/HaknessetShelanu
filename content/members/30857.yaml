  - kind: negative
    category: controversy
    title:
      he: הושעה מישיבות הממשלה לאחר אמירה על פצצה גרעינית בעזה
      en: Suspended from cabinet meetings after remark about a nuclear bomb on Gaza
    description:
      he: >-
        בריאיון לרדיו "קול ברמה" ב-5 בנובמבר 2023, כשנשאל אם הטלת פצצה גרעינית על
        רצועת עזה היא אופציה, השיב אליהו "זו אחת הדרכים". ראש הממשלה בנימין נתניהו
        אמר שדבריו "מנותקים מהמציאות" והשעה אותו מישיבות הממשלה עד להודעה חדשה.
        אליהו טען מאוחר יותר כי "ברור לכל בר דעת שהאמירה על האטום היא מטאפורית".
        ההתבטאות גררה גינויים בינלאומיים.
      en: >-
        In an interview with the Kol Barama radio station on 5 November 2023, asked
        whether dropping a nuclear bomb on the Gaza Strip was an option, Eliyahu
        replied that it was "one way". Prime Minister Benjamin Netanyahu said the
        remarks were "detached from reality" and suspended him from cabinet meetings
        until further notice. Eliyahu later said it was "clear to all sensible
        people that the statement about the atom is metaphorical". The statement
        drew international condemnation.
    date: "2023-11-05"
    sources:
      - url: https://www.timesofisrael.com/far-right-minister-says-nuking-gaza-an-option-pm-suspends-him-from-cabinet-meetings/
        title: Far-right minister says nuking Gaza an option, PM suspends him from cabinet meetings
        publisher: The Times of Israel
      - url: https://www.haaretz.com/israel-news/2023-11-14/ty-article/china-iran-arab-nations-condemn-israeli-ministers-nuclear-bomb-statement/0000018b-cce6-df9a-ab8b-deeeb98f0000
        title: China, Iran, Arab Nations Condemn Israeli Minister's Statement About Dropping a Nuclear Bomb on Gaza
        publisher: Haaretz
  - kind: negative
    category: controversy
    title:
      he: אמר כי הממשלה "רצה למחוק את עזה" וכי "אין רעב בעזה"; נתניהו הבהיר שאינו מדבר בשם הממשלה
      en: Said the government was "racing ahead for Gaza to be wiped out" and that "there's no hunger in Gaza"; Netanyahu said he does not speak for the government
    description:
      he: >-
        בריאיון לרדיו "קול ברמה" ב-24 ביולי 2025 אמר אליהו כי "הממשלה רצה למחוק את
        עזה", כי "כל עזה תהיה יהודית" וכי "אין רעב בעזה". ראש הממשלה נתניהו פרסם
        הודעה באנגלית ולפיה אליהו "אינו מדבר בשם הממשלה שאני עומד בראשה" ואינו חבר
        בקבינט הביטחוני, אך לא נקט צעד משמעתי; שגריר ישראל בארה"ב יחיאל לייטר כינה
        את הציטוטים "שגויים, טיפשיים ולא מייצגים". ראש האופוזיציה יאיר לפיד כינה את
        הדברים "אסון הסברתי".
      en: >-
        In a Kol Barama radio interview on 24 July 2025 Eliyahu said "the government
        is racing ahead for Gaza to be wiped out", that "all Gaza will be Jewish" and
        that "there's no hunger in Gaza". Prime Minister Netanyahu posted in English
        that Eliyahu "does not speak for the government I lead" and is not a member
        of the security cabinet, but took no disciplinary step; Israel's ambassador
        to the US, Yechiel Leiter, called the quotes "wrong, foolish and totally
        unrepresentative". Opposition leader Yair Lapid called the remarks a "public
        relations disaster".
    date: "2025-07-24"
    sources:
      - url: https://www.timesofisrael.com/far-right-minister-says-israel-pushing-to-wipe-out-gaza-will-make-it-jewish/
        title: Far-right minister says Israel pushing to 'wipe out' Gaza, will make it Jewish
        publisher: The Times of Israel
      - url: https://www.jpost.com/israel-news/article-862117
        title: "'All of Gaza will be Jewish': Heritage minister claims Israel working to resettle Gaza"
        publisher: The Jerusalem Post
      - url: https://www.jns.org/israel-news/netanyahu-eliyahus-remarks-on-gaza-being-wiped-out-not-govt-policy
        title: Netanyahu - Eliyahu's remarks on Gaza being 'wiped out' not gov't policy
        publisher: JNS
  - kind: negative
    category: controversy
    title:
      he: שלח הודעת וואטסאפ לשופט העליון יחיאל כשר בעניין עתירה תלויה ועומדת - וננזף
      en: Sent a WhatsApp message to Justice Yechiel Kasher about a pending petition against his nominee, and was rebuked
    description:
      he: >-
        ב-1 ביוני 2026 חשף השופט יחיאל כשר בהחלטתו כי קיבל הודעת וואטסאפ ממי שהזדהה
        כשר המורשת, ובה ביקש אליהו שלא לעכב את מינוי אסתי שרייבר למנכ"לית רשות
        העתיקות, שנגדו עתרו עשרות ארכיאולוגים. השופט כתב כי "פנייה באופן המתואר
        לעיל אינה הדרך הנאותה להגשת עמדה לבית המשפט ומשכך בכוונתי להתעלם ממנה",
        ודחה את הבקשה לצו ארעי. לפי הדיווחים, אליהו אישר לאחר נחיתתו מניו יורק כי
        אכן פנה לשופט.
      en: >-
        On 1 June 2026 Justice Yechiel Kasher disclosed in a ruling that he had
        received a WhatsApp message from someone identifying himself as the heritage
        minister, in which Eliyahu asked that the appointment of Esther Schreiber as
        director-general of the Israel Antiquities Authority - challenged in a
        petition by dozens of archaeologists - not be delayed. The justice wrote
        that this "is not the proper way to present a position to the court" and
        that he would disregard it, and declined to issue an interim order. According
        to the reports, Eliyahu confirmed after landing from New York that he had
        contacted the justice.
    date: "2026-06-01"
    sources:
      - url: https://www.ynet.co.il/environment-science/article/skxsnr5emg
        title: '"זו לא הדרך": השר אליהו שלח הודעת וואטסאפ לשופט העליון - וננזף'
        publisher: Ynet
      - url: https://news.walla.co.il/item/3842374
        title: '"זה לא נאות - ועל כן אתעלם": שר המורשת פנה לשופט בוואטסאפ - וננזף'
        publisher: Walla
      - url: https://www.haaretz.co.il/news/law/2026-06-01/ty-article/.premium/0000019e-82ba-d0a9-a7df-b3ba442b0000
        title: השר אליהו ניסה לשכנע את השופט כשר שלא לפסול מינוי שלו
        publisher: Haaretz
      - url: https://www.inn.co.il/news/698076
        title: השופט יחיאל כשר חשף - קיבלתי הודעת וואטסאפ ממי שהזדהה כשר אליהו
        publisher: Arutz 7
  - kind: negative
    category: controversy
    title:
      he: פרסומים ממומנים של משרד המורשת בערוץ 14 שקידמו את השר בתקופת הבחירות הוסרו לאחר פניית "הארץ"
      en: Heritage Ministry sponsored posts on Channel 14 promoting the minister during the election period were removed after a Haaretz inquiry
    description:
      he: >-
        ב-19 באוגוסט 2026 דיווח "הארץ" כי משרד המורשת מימן פרסומים ממומנים באתר ערוץ
        14 על אתרי ארכיאולוגיה ביהודה ושומרון, שכללו תמונות וציטוטים של השר אליהו,
        וזאת לאחר 29 ביולי - תחילת 90 הימים שלפני הבחירות שבהם חוק הבחירות אוסר
        שימוש בנכסי משרדי ממשלה לתעמולה. הפרסומים הוסרו לאחר פניית העיתון ומכתב
        התרעה של ארגון "עמק שווה". ב-22 באוגוסט דווח כי הארגון פנה ליועצת המשפטית
        לממשלה בדרישה לבדוק את העניין; לא דווח על תגובה מהמשרד או על החלטה של
        היועצת.
      en: >-
        On 19 August 2026 Haaretz reported that the Heritage Ministry had funded
        sponsored posts on the Channel 14 website about archaeological sites in the
        West Bank that included photos and quotes of Minister Eliyahu, published
        after 29 July - the start of the 90-day pre-election period in which the
        Elections Law bars the use of government-ministry assets for campaigning.
        The posts were taken down after the newspaper's inquiry and a warning letter
        from the NGO Emek Shaveh. On 22 August it was reported that the NGO had asked
        the Attorney General to examine the matter; no response from the ministry
        and no decision by the Attorney General have been reported.
    date: "2026-08-19"
    sources:
      - url: https://www.haaretz.co.il/news/elections/2026-08-19/ty-article/.premium/000001a0-1918-dfad-a3a1-bdbfb97b0000
        title: משרד המורשת קידם את השר עמיחי אליהו בפרסומים ממומנים בערוץ 14
        publisher: Haaretz
      - url: https://www.haaretz.com/israel-news/elections/2026-08-19/ty-article/.premium/channel-14-ran-govt-funded-articles-promoting-likud-minister-before-election/000001a0-1a4b-dd2f-a1b6-7bcbd1270000
        title: Channel 14 Ran Government-funded Articles Promoting Likud Minister Before Election (the article concerns Heritage Minister Eliyahu)
        publisher: Haaretz (English)
      - url: https://www.zman.co.il/719372/
        title: מיליון שקל ציבורי, שתי "חשיפות" פוליטיות - ומנגנון ציות שלא עצר אף אחת מהן
        publisher: Zman Yisrael
  - kind: neutral
    category: news
    date: "2026-06-26"
    title:
      he: ועדת המינויים פסלה את מועמדתו לתפקיד מנכ"לית רשות העתיקות
      en: Appointments committee disqualified his nominee for director-general of the Antiquities Authority
    description:
      he: >-
        ב-12 במאי 2026 הודיע אליהו על בחירת אסתי שרייבר, מנכ"לית ארגון "הדור הבא"
        (INEXTG) ללא רקע בארכיאולוגיה, למנכ"לית רשות העתיקות. ב-26 ביוני 2026 פסלה
        ועדת המינויים בראשות השופטת בדימוס שולמית דותן את המינוי, בקביעה שתנאי הסף
        במכרז נקבעו נמוך מהנדרש בחוק ושהמועמדת אינה עומדת בדרישת חמש שנות ניסיון
        ניהולי בכיר. השר איתמר בן גביר, חברו למפלגה, טען כי הסיבה האמיתית היא
        התנגדות "הדיפ סטייט" למנכ"לית דתייה.
      en: >-
        On 12 May 2026 Eliyahu announced the selection of Esther Schreiber, CEO of
        the INEXTG organization and without an archaeology background, as
        director-general of the Israel Antiquities Authority. On 26 June 2026 the
        governmental appointments committee, headed by retired judge Shulamit Dotan,
        disqualified the appointment, finding that the tender's threshold
        requirements were set lower than the law requires and that the nominee
        lacked the mandated five years of senior managerial experience. His party
        colleague, Minister Itamar Ben Gvir, said the real reason was "deep state"
        opposition to a religious director-general.
    sources:
      - url: https://www.timesofisrael.com/vetting-panel-disqualifies-heritage-ministers-nominee-for-antiquities-authority-chief/
        title: Vetting panel disqualifies heritage minister's nominee for Antiquities Authority chief
        publisher: The Times of Israel
      - url: https://www.ynetnews.com/article/iyk45526v
        title: Esther Schreiber's appointment as CEO of Israel Antiquities Authority disqualified
        publisher: Ynetnews
      - url: https://www.timesofisrael.com/liveblog_entry/heritage-minister-taps-new-antiquities-authority-head-with-no-archaeological-experience/
        title: Heritage Minister taps new Antiquities Authority head with no archaeological experience
        publisher: The Times of Israel
