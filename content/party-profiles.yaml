  - id: 1108 # New Hope – The National Right
    verified: "2026-09-19"
    logo: { src: "https://upload.wikimedia.org/wikipedia/commons/thumb/2/2e/Yamin_Mamlakhti.png/500px-Yamin_Mamlakhti.png", source: { url: "https://commons.wikimedia.org/wiki/File:Yamin_Mamlakhti.png", title: "File:Yamin_Mamlakhti.png — the National Right's logo from March 2024 (CC BY 4.0)", publisher: "Wikimedia Commons" } }
    updates:
      - date: "2024-03-12"
        text:
          he: "גדעון סער הודיע על פירוק רשימת המחנה הממלכתי; תקווה חדשה הפכה לסיעה עצמאית בשם \"הימין הממלכתי\" (מ-13 במרץ 2024 לפי הכנסת), וב-25 במרץ 2024 פרשה מהממשלה לאחר שסער לא צורף לקבינט המלחמה."
          en: "Gideon Sa’ar announced the break-up of the National Unity list; New Hope became a separate faction named “HaYamin HaMamlachti” (from 13 March 2024 per the Knesset), and on 25 March 2024 it left the government after Sa’ar was not added to the war cabinet."
          ar: "أعلن جدعون ساعر تفكيك قائمة المعسكر الرسمي؛ وأصبح «أمل جديد» كتلة مستقلة باسم «اليمين الرسمي» (اعتبارًا من 13 آذار/مارس 2024 بحسب الكنيست)، وفي 25 آذار/مارس 2024 انسحب من الحكومة بعدما لم يُضمّ ساعر إلى كابينت الحرب."
          ru: "Гидеон Саар объявил о распаде списка «Государственный лагерь»; «Новая надежда» стала самостоятельной фракцией под названием «Государственные правые» (с 13 марта 2024 года, по данным Кнессета), а 25 марта 2024 года вышла из правительства после того, как Саара не включили в военный кабинет."
          es: "Gideon Sa’ar anunció la ruptura de la lista Unidad Nacional; Nueva Esperanza pasó a ser una facción separada llamada «HaYamin HaMamlachti» (desde el 13 de marzo de 2024 según la Knéset), y el 25 de marzo de 2024 dejó el Gobierno después de que Sa’ar no fuera incorporado al gabinete de guerra."
          fr: "Gideon Sa’ar a annoncé la rupture de la liste Unité nationale ; Nouvel Espoir est devenu une faction distincte nommée « HaYamin HaMamlachti » (à partir du 13 mars 2024 selon la Knesset), et le 25 mars 2024 il a quitté le gouvernement après que Sa’ar n’a pas été intégré au cabinet de guerre."
        sources:
          - { url: "https://www.timesofisrael.com/saar-splits-from-gantzs-national-unity-party-demands-seat-in-war-cabinet/", title: "Sa’ar splits from Gantz’s National Unity party, demands seat in war cabinet (2024-03-12)", publisher: "The Times of Israel" }
          - { url: "https://www.ynet.co.il/news/article/bjexbmkyc", title: "לאחר שלא צורף לקבינט המלחמה, סער פורש מהממשלה: \"לא באנו לחמם כיסאות\" (2024-03-25)", publisher: "ynet" }
          - { url: "https://knesset.gov.il/OdataV4/ParliamentInfo/KNS_Faction?$filter=KnessetNum%20eq%2025", title: "KNS_Faction — הימין הממלכתי, StartDate 2024-03-13 (2026-09-19)", publisher: "הכנסת (OData)" }
      - date: "2024-09-30"
        text:
          he: "הסיעה חזרה לממשלה: הכנסת אישרה (57–40) את מינוי סער לשר בלי תיק; הקואליציה גדלה ל-68 חברי כנסת. ב-7 בנובמבר 2024 אושר מינויו לשר החוץ."
          en: "The faction rejoined the government: the Knesset approved (57–40) Sa’ar’s appointment as minister without portfolio, taking the coalition to 68 MKs; on 7 November 2024 his appointment as Foreign Minister was approved."
          ar: "عادت الكتلة إلى الحكومة: صادق الكنيست (57 مقابل 40) على تعيين ساعر وزيرًا بلا حقيبة، فارتفع الائتلاف إلى 68 عضو كنيست؛ وفي 7 تشرين الثاني/نوفمبر 2024 صودق على تعيينه وزيرًا للخارجية."
          ru: "Фракция вернулась в правительство: Кнессет 57 голосами против 40 утвердил назначение Саара министром без портфеля, и коалиция выросла до 68 депутатов; 7 ноября 2024 года было утверждено его назначение министром иностранных дел."
          es: "La facción volvió al Gobierno: la Knéset aprobó (57–40) el nombramiento de Sa’ar como ministro sin cartera, elevando la coalición a 68 diputados; el 7 de noviembre de 2024 se aprobó su nombramiento como ministro de Asuntos Exteriores."
          fr: "La faction a rejoint le gouvernement : la Knesset a approuvé (57–40) la nomination de Sa’ar comme ministre sans portefeuille, portant la coalition à 68 députés ; le 7 novembre 2024, sa nomination comme ministre des Affaires étrangères a été approuvée."
        sources:
          - { url: "https://www.timesofisrael.com/as-he-officially-rejoins-government-saar-blasts-opposition-for-living-in-oct-6/", title: "As he officially rejoins government, Sa’ar blasts opposition for ‘living in Oct. 6’ (2024-09-30)", publisher: "The Times of Israel" }
      - date: "2025-03-13"
        text:
          he: "הימין הממלכתי והליכוד חתמו על הסכם מיזוג: ריצה ברשימה משותפת מטעם הליכוד, שריון שיבחר סער במקום שאינו נמוך מ-15, צירוף כ-2,400 מתפקדים ו-100 חברי מרכז; מרכז הליכוד אישר את ההסכם ב-13 באוגוסט 2025."
          en: "The National Right and Likud signed a merger agreement: a joint run on the Likud list, a reserved slot chosen by Sa’ar no lower than 15th, about 2,400 members and 100 central-committee members joining Likud; the Likud Central Committee approved it on 13 August 2025."
          ar: "وقّع «اليمين الرسمي» والليكود اتفاق اندماج: الترشح في قائمة مشتركة باسم الليكود، وموقع محجوز يختاره ساعر لا يتجاوز الموقع الـ15، وانضمام نحو 2,400 عضو و100 عضو في المركز إلى الليكود؛ وصادقت اللجنة المركزية لليكود على الاتفاق في 13 آب/أغسطس 2025."
          ru: "«Государственные правые» и Ликуд подписали соглашение о слиянии: совместное участие в выборах в списке Ликуда, зарезервированное место по выбору Саара не ниже 15-го, вступление в Ликуд около 2400 членов партии и 100 членов центрального комитета; ЦК Ликуда утвердил соглашение 13 августа 2025 года."
          es: "Nueva Esperanza – Derecha Nacional y el Likud firmaron un acuerdo de fusión: una candidatura conjunta en la lista del Likud, un puesto reservado a elección de Sa’ar no inferior al 15.º, unos 2 400 afiliados y 100 miembros del comité central que se incorporan al Likud; el Comité Central del Likud lo aprobó el 13 de agosto de 2025."
          fr: "Nouvel Espoir – Droite étatique et le Likoud ont signé un accord de fusion : une candidature commune sur la liste du Likoud, une place réservée, choisie par Sa’ar, au plus tard à la 15e position, environ 2 400 adhérents et 100 membres du comité central rejoignant le Likoud ; le Comité central du Likoud l’a approuvé le 13 août 2025."
        sources:
          - { url: "https://www.ynet.co.il/news/article/r12iadxh1l", title: "המהפך הושלם: סיעת גדעון סער מתמזגת עם הליכוד, בן גביר קרוב לחזרה לממשלה (2025-03-13)", publisher: "ynet" }
          - { url: "https://www.maariv.co.il/news/politics/article-1179992", title: "גדעון סער חוזר לליכוד: אלו פרטי ההסכם בין שתי המפלגות (2025-03-13)", publisher: "מעריב" }
          - { url: "https://www.timesofisrael.com/ruling-likud-party-approves-merger-with-gideon-saars-new-hope/", title: "Ruling Likud party approves merger with Gideon Sa’ar’s New Hope (2025-08-13)", publisher: "The Times of Israel" }
      - date: "2025-07-10"
        text:
          he: "גדעון סער התפטר מהכנסת במסגרת החוק הנורווגי (ההודעה ב-8 ביולי, בתוקף מ-10 ביולי 2025); במקומו נכנס אכרם חסון."
          en: "Gideon Sa’ar resigned from the Knesset under the Norwegian Law (announced 8 July, effective 10 July 2025); Akram Hasson took his seat."
          ar: "استقال جدعون ساعر من الكنيست في إطار «القانون النرويجي» (أُعلن ذلك في 8 تموز/يوليو، وسرى اعتبارًا من 10 تموز/يوليو 2025)؛ ودخل أكرم حسون مكانه."
          ru: "Гидеон Саар сложил депутатский мандат по «норвежскому закону» (объявлено 8 июля, вступило в силу 10 июля 2025 года); его место занял Акрам Хасон."
          es: "Gideon Sa’ar renunció a la Knéset según la Ley Noruega (anunciado el 8 de julio, efectivo el 10 de julio de 2025); Akram Hasson ocupó su escaño."
          fr: "Gideon Sa’ar a démissionné de la Knesset en vertu de la « loi norvégienne » (annoncé le 8 juillet, effectif le 10 juillet 2025) ; Akram Hasson a pris son siège."
        sources:
          - { url: "https://www.mako.co.il/news-politics/2025_q3/Article-a4715af69e9e791026.htm", title: "גדעון סער התפטר מהכנסת במסגרת החוק הנורווגי (2025-07-08)", publisher: "N12 (mako)" }
          - { url: "https://knesset.gov.il/OdataV4/ParliamentInfo/KNS_PersonToPosition?$filter=KnessetNum%20eq%2025%20and%20FactionID%20eq%201108", title: "KNS_PersonToPosition — סער FinishDate 2025-07-10; חסון StartDate 2025-07-10 (2026-09-19)", publisher: "הכנסת (OData)" }
      - date: "2026-07-14"
        text:
          he: "ח\"כ שרן השכל התפטרה מתפקיד סגנית שר החוץ ומהמפלגה בעקבות חקיקה שהקפיאה מעצרים של חרדים שלא התייצבו לגיוס; למחרת הכריזה על הקמת מפלגת \"ישראל תחילה\". היא נותרה חברת הכנסת בסיעת הימין הממלכתי."
          en: "MK Sharren Haskel resigned as Deputy Foreign Minister and from the party after legislation freezing arrests of Haredi men who did not report for the draft; the next day she announced a new party, “Israel First”. She remains an MK in the National Right faction."
          ar: "استقالت عضوة الكنيست شارين هسكل من منصب نائبة وزير الخارجية ومن الحزب في أعقاب تشريع جمّد اعتقال الحريديم الذين لم يمتثلوا للتجنيد؛ وفي اليوم التالي أعلنت تأسيس حزب «إسرائيل أولًا». ولا تزال عضوة كنيست في كتلة «اليمين الرسمي»."
          ru: "Депутат Шарен Хаскель ушла с поста заместителя министра иностранных дел и из партии после принятия закона, заморозившего аресты харедим, не явившихся на призыв; на следующий день она объявила о создании партии «Израиль прежде всего». Она остаётся депутатом во фракции «Государственные правые»."
          es: "La diputada Sharren Haskel renunció como viceministra de Asuntos Exteriores y del partido tras la legislación que congela las detenciones de jaredíes que no se presentaron al reclutamiento; al día siguiente anunció un nuevo partido, «Israel Primero». Sigue siendo diputada en la facción Nueva Esperanza – Derecha Nacional."
          fr: "La députée Sharren Haskel a démissionné de son poste de vice-ministre des Affaires étrangères et du parti après la législation gelant les arrestations de haredim ne s’étant pas présentés à la conscription ; le lendemain, elle a annoncé un nouveau parti, « Israël d’abord ». Elle reste députée au sein de la faction Nouvel Espoir – Droite étatique."
        sources:
          - { url: "https://www.jpost.com/israel-news/politics-and-diplomacy/article-902514", title: "Sharren Haskel resigns as Israel’s deputy FM over bill halting arrests of haredi draft dodgers (2026-07-14)", publisher: "The Jerusalem Post" }
          - { url: "https://www.jpost.com/israel-news/politics-and-diplomacy/article-902631", title: "Former deputy FM Haskel announces launch of new Israel First political party (2026-07-15)", publisher: "The Jerusalem Post" }
      - date: "2026-07-19"
        text:
          he: "השכל עתרה לבג\"ץ בדרישה שהליכוד והימין הממלכתי ישלימו את מיזוג הסיעות בוועדת הכנסת; לטענתה המיזוג לא הוגש לאישור כדי למנוע ממנה להתפלג כסיעת יחיד. נכון ל-19 בספטמבר 2026 הסיעה עדיין רשומה בכנסת כסיעה נפרדת (4 חברים)."
          en: "Haskel petitioned the High Court to compel Likud and the National Right to complete the faction merger in the Knesset House Committee, alleging it was withheld to stop her splitting off as a one-member faction. As of 19 September 2026 the Knesset still lists the faction separately (4 members)."
          ar: "قدّمت هسكل التماسًا إلى محكمة العدل العليا مطالبةً بإلزام الليكود و«اليمين الرسمي» باستكمال دمج الكتلتين في لجنة الكنيست؛ وبحسب ادعائها لم يُقدَّم الدمج للمصادقة كي تُمنع من الانشقاق ككتلة من عضو واحد. وحتى 19 أيلول/سبتمبر 2026 لا تزال الكتلة مسجّلة في الكنيست كتلةً منفصلة (4 أعضاء)."
          ru: "Хаскель подала петицию в Высший суд справедливости (БАГАЦ), требуя обязать Ликуд и «Государственных правых» завершить слияние фракций в Комиссии Кнессета; по её словам, слияние не было представлено на утверждение, чтобы помешать ей выйти и образовать фракцию из одного депутата. На 19 сентября 2026 года фракция по-прежнему значится в Кнессете отдельной (4 депутата)."
          es: "Haskel recurrió al Tribunal Superior de Justicia (Bagatz) para obligar al Likud y a Nueva Esperanza – Derecha Nacional a completar la fusión de las facciones en la Comisión de la Knéset (House Committee), alegando que la fusión se estaba demorando para impedir que se escindiera como facción unipersonal. A 19 de septiembre de 2026 la Knéset sigue registrando la facción por separado (4 miembros)."
          fr: "Haskel a saisi la Haute Cour de justice (Bagatz) pour contraindre le Likoud et Nouvel Espoir – Droite étatique à achever la fusion des factions devant la Commission de la Knesset, affirmant que la fusion était bloquée pour l’empêcher de se constituer en faction à un seul membre. Au 19 septembre 2026, la Knesset enregistre toujours la faction séparément (4 membres)."
        sources:
          - { url: "https://www.timesofisrael.com/liveblog_entry/disgruntled-new-hope-mk-petitions-high-court-over-stalled-merger-with-likud-says-parties-trying-to-deny-her-legal-rights/", title: "Disgruntled New Hope MK petitions High Court over stalled merger with Likud, says parties trying to deny her legal rights (2026-07-19)", publisher: "The Times of Israel" }
          - { url: "https://main.knesset.gov.il/mk/apps/faction/faction-lobby?KnessetID=25&FactionID=1108", title: "סיעת הימין הממלכתי — 4 חברים (2026-09-19)", publisher: "הכנסת" }
      - date: "2026-09-03"
        text:
          he: "\"ישראל תחילה\" של ח\"כ שרן השכל הודיעה על ריצה משותפת עם עלה ירוק; הרשימה \"ישראל תחילה - בראשות שרן השכל\" הוגשה לוועדת הבחירות כרשימה מס' 7 (אותיות מבוקשות י / ר)."
          en: "MK Sharren Haskel’s “Israel First” announced a joint run with Ale Yarok; the list “Israel First – headed by Sharren Haskel” was submitted to the CEC as list no. 7 (requested letters י / ר)."
          ar: "أعلن حزب «إسرائيل أولًا» بزعامة عضوة الكنيست شارين هسكل ترشحًا مشتركًا مع «عاليه يروك» (الورقة الخضراء)؛ وقُدّمت قائمة «إسرائيل أولًا – برئاسة شارين هسكل» إلى لجنة الانتخابات بوصفها القائمة رقم 7 (الأحرف المطلوبة י / ר)."
          ru: "Партия депутата Шарен Хаскель «Израиль прежде всего» объявила о совместном участии в выборах с «Алэ Ярок» («Зелёный лист»); список «Израиль прежде всего — во главе с Шарен Хаскель» подан в ЦИК под номером 7 (запрошенные буквы י / ר)."
          es: "«Israel Primero» de la diputada Sharren Haskel anunció una candidatura conjunta con Ale Yarok; la lista «Israel Primero – encabezada por Sharren Haskel» fue presentada ante la Comisión Electoral como lista n.º 7 (letras solicitadas י / ר)."
          fr: "« Israël d’abord » de la députée Sharren Haskel a annoncé une candidature commune avec Ale Yarok ; la liste « Israël d’abord – menée par Sharren Haskel » a été déposée auprès de la Commission électorale comme liste n° 7 (lettres demandées י / ר)."
        sources:
          - { url: "https://www.ynet.co.il/news/elections2026/article/bjpcwrddge", title: "שרן השכל ועלה ירוק ירוצו יחד בבחירות: \"חיבור טבעי וסגירת מעגל\" (2026-09-03)", publisher: "ynet" }
          - { url: "https://www.gov.il/he/pages/israel-tchila_list7", title: "רשימה 7 — ישראל תחילה - בראשות שרן השכל (2026-09-18)", publisher: "ועדת הבחירות המרכזית לכנסת (gov.il)" }
      - date: "2026-09-08"
        text:
          he: "המפלגה רצה ב-2026 בתוך רשימת הליכוד (רשימה 29, מחל), המוגשת במשותף על ידי הליכוד ותקווה חדשה הימין הממלכתי: גדעון סער במקום 7 (שריון מכוח הסכם המיזוג), טלי גואילי במקום 9 רשומה מטעם המפלגה, והשר זאב אלקין במקום 32."
          en: "In 2026 the party runs inside the Likud list (list 29, מחל), submitted jointly by Likud and New Hope–National Right: Gideon Sa’ar 7th (reserved under the merger agreement), Tali Gvili 9th recorded under the party, and Minister Ze’ev Elkin 32nd."
          ar: "يترشح الحزب في 2026 ضمن قائمة الليكود (القائمة 29، מחל)، التي قدّمها الليكود و«أمل جديد – اليمين الرسمي» معًا: جدعون ساعر في الموقع 7 (محجوز بموجب اتفاق الاندماج)، وطالي غفيلي في الموقع 9 مسجّلة باسم الحزب، والوزير زئيف إلكين في الموقع 32."
          ru: "В 2026 году партия идёт в списке Ликуда (список 29, מחל), поданном совместно Ликудом и «Новой надеждой — Государственными правыми»: Гидеон Саар — 7-е место (зарезервировано по соглашению о слиянии), Тали Гвили — 9-е, записана от партии, министр Зеэв Элькин — 32-е."
          es: "En 2026 el partido se presenta dentro de la lista del Likud (lista 29, מחל), presentada conjuntamente por el Likud y Nueva Esperanza – Derecha Nacional: Gideon Sa’ar 7.º (puesto reservado por el acuerdo de fusión), Tali Gvili 9.ª inscrita por el partido, y el ministro Ze’ev Elkin 32.º."
          fr: "En 2026, le parti se présente au sein de la liste du Likoud (liste 29, מחל), déposée conjointement par le Likoud et Nouvel Espoir – Droite étatique : Gideon Sa’ar 7e (place réservée par l’accord de fusion), Tali Gvili 9e, inscrite au titre du parti, et le ministre Ze’ev Elkin 32e."
        sources:
          - { url: "https://www.gov.il/he/pages/halikud-tikvahadasha_iist29", title: "רשימה 29 — הליכוד עם בנימין נתניהו לראשות הממשלה (מוגשת ע\"י הליכוד; תקווה חדשה הימין הממלכתי) (2026-09-09)", publisher: "ועדת הבחירות המרכזית לכנסת (gov.il)" }
          - { url: "https://www.timesofisrael.com/likud-approves-reserved-spots-for-israel-katz-and-saar-freezes-vote-on-haim-katz/", title: "Likud approves reserved spots for Israel Katz and Sa’ar, freezes vote on Haim Katz (2026-08-11)", publisher: "The Times of Israel" }
          - { url: "https://www.jpost.com/israel-election-2026/article-906578", title: "Netanyahu appoints sole Russian-speaking Likud candidate Elkin to lead party’s immigrant outreach (2026-08-25)", publisher: "The Jerusalem Post" }
          - { url: "https://www.timesofisrael.com/liveblog_entry/likud-submits-35-person-knesset-slate-featuring-9-netanyahu-appointees-just-4-women/", title: "Likud submits 35-person Knesset slate featuring 9 Netanyahu appointees, just 4 women (2026-09-08)", publisher: "The Times of Israel" }
    election2026:
      runsAs: within
      slug: likud
      note:
        he: "תקווה חדשה - הימין הממלכתי הגישה את רשימת הליכוד במשותף עם הליכוד; גדעון סער במקום השביעי. מיזוג הסיעות בכנסת לא הושלם, וח\"כ שרן השכל, שפרשה מהמפלגה ביולי 2026, מתמודדת בנפרד בראש \"ישראל תחילה\" (רשימה 7)."
        en: "New Hope – The National Right submitted the Likud list jointly with Likud; Gideon Sa’ar is seventh. The factions’ merger in the Knesset was not completed, and MK Sharren Haskel, who left the party in July 2026, runs separately at the head of “Israel First” (list 7)."
        ar: "قدّم «أمل جديد – اليمين الرسمي» قائمة الليكود بالاشتراك مع الليكود؛ جدعون ساعر في الموقع السابع. لم يكتمل اندماج الكتلتين في الكنيست، وعضوة الكنيست شارين هسكل، التي غادرت الحزب في تموز/يوليو 2026، تترشح منفردة على رأس «إسرائيل أولًا» (القائمة 7)."
        ru: "«Новая надежда — Государственные правые» подала список Ликуда совместно с Ликудом; Гидеон Саар — седьмой. Слияние фракций в Кнессете не завершено, а депутат Шарен Хаскель, покинувшая партию в июле 2026 года, идёт отдельно во главе списка «Израиль прежде всего» (список 7)."
        es: "Nueva Esperanza – Derecha Nacional presentó la lista del Likud conjuntamente con el Likud; Gideon Sa’ar es séptimo. La fusión de las facciones en la Knéset no se completó, y la diputada Sharren Haskel, que dejó el partido en julio de 2026, se presenta por separado al frente de «Israel Primero» (lista 7)."
        fr: "Nouvel Espoir – Droite étatique a déposé la liste du Likoud conjointement avec le Likoud ; Gideon Sa’ar est septième. La fusion des factions à la Knesset n’a pas été achevée, et la députée Sharren Haskel, qui a quitté le parti en juillet 2026, se présente séparément en tête de « Israël d’abord » (liste 7)."
      sources:
        - { url: "https://www.gov.il/he/pages/halikud-tikvahadasha_iist29", title: "הליכוד עם בנימין נתניהו לראשות הממשלה — רשימת המועמדים", publisher: "ועדת הבחירות המרכזית לכנסת" }
        - { url: "https://www.gov.il/he/pages/israel-tchila_list7", title: "ישראל תחילה - בראשות שרן השכל — רשימת המועמדים", publisher: "ועדת הבחירות המרכזית לכנסת" }
    spectrum: right
    ballotLetters: "כן"
    ballotNote:
      he: רצה במסגרת "המחנה הממלכתי" (כן) ב-2022. באוגוסט 2025 אישר מרכז הליכוד את מיזוג המפלגה לתוכו, אך בכנסת נותרה הסיעה נפרדת (4 חברים); ב-2026 רצה בתוך רשימת הליכוד, גדעון סער במקום השביעי.
      en: Ran within 'National Unity' (כן) in 2022. In August 2025 the Likud Central Committee approved the party’s merger into Likud, but in the Knesset the faction stayed separate (4 members); in 2026 it runs inside the Likud list, with Gideon Sa'ar seventh.
      ar: "ترشّح ضمن «المعسكر الرسمي» (כן) في 2022. في آب/أغسطس 2025 صادقت اللجنة المركزية لليكود على اندماج الحزب في الليكود، لكن الكتلة بقيت منفصلة في الكنيست (4 أعضاء)؛ وفي 2026 يترشح ضمن قائمة الليكود، وجدعون ساعر في الموقع السابع."
      ru: "В 2022 году шла в составе «Государственного лагеря» (כן). В августе 2025 года ЦК Ликуда одобрил слияние партии с Ликудом, но в Кнессете фракция осталась отдельной (4 депутата); в 2026 году она идёт в списке Ликуда, Гидеон Саар — седьмой."
      es: "Se presentó dentro de «Unidad Nacional» (כן) en 2022. En agosto de 2025 el Comité Central del Likud aprobó la fusión del partido en el Likud, pero en la Knéset la facción siguió separada (4 miembros); en 2026 se presenta dentro de la lista del Likud, con Gideon Sa'ar séptimo."
      fr: "S’est présenté au sein d’« Unité nationale » (כן) en 2022. En août 2025, le Comité central du Likoud a approuvé la fusion du parti dans le Likoud, mais à la Knesset la faction est restée distincte (4 membres) ; en 2026, il se présente au sein de la liste du Likoud, avec Gideon Sa'ar septième."
    sources:
      - { url: "https://www.timesofisrael.com/ruling-likud-party-approves-merger-with-gideon-saars-new-hope/", title: "Ruling Likud party approves merger with Gideon Sa'ar's New Hope (13 Aug 2025)", publisher: "The Times of Israel" }
      - { url: "https://www.gov.il/he/pages/halikud-tikvahadasha_iist29", title: "הליכוד עם בנימין נתניהו לראשות הממשלה — רשימת המועמדים, הוגשה על ידי הליכוד ותקווה חדשה הימין הממלכתי", publisher: "ועדת הבחירות המרכזית לכנסת" }
    leaderHe: גדעון סער
    leaderEn: Gideon Sa'ar
