claims:
  - kind: positive
    category: achievement
    title:
      he: "טייס קרב וסגן אלוף בחיל האוויר"
      en: "Fighter pilot and Lieutenant Colonel in the Israeli Air Force"
    description:
      he: "קיש התנדב לקורס טיס בחיל האוויר לאחר לימודיו בתיכון ושירת כטייס קרב; הוא סגן-אלוף במילואים. לאחר שחרורו עסק ביזמות, ועד הצטרפותו לפוליטיקה היה טייס בצי מטוסי בואינג 777 של אל על."
      en: "Kisch volunteered for the Air Force pilots' course after high school and served as a fighter pilot; he is a lieutenant colonel in the reserves. After his discharge he worked on start-up ventures, and until he entered politics he flew Boeing 777s for El Al."
      ar: "تطوّع كيش لدورة الطيران في سلاح الجو بعد إنهاء دراسته الثانوية، وخدم طيارًا حربيًا؛ وهو برتبة مقدّم في الاحتياط. بعد تسريحه عمل في ريادة الأعمال، وحتى دخوله السياسة كان طيارًا على طائرات بوينغ 777 في شركة «إل عال»."
      ru: "После окончания школы Киш добровольно поступил на курс лётчиков ВВС и служил боевым лётчиком; он подполковник запаса. После демобилизации занимался стартапами, а до прихода в политику летал на «Боинге-777» авиакомпании «Эль-Аль»."
      es: "Kisch se presentó voluntario al curso de pilotos de la Fuerza Aérea al terminar el bachillerato y sirvió como piloto de combate; es teniente coronel en la reserva. Tras su licenciamiento se dedicó a emprendimientos tecnológicos, y hasta que entró en política pilotó Boeing 777 de El Al."
      fr: "Après le lycée, Kisch s’est porté volontaire pour le cours de pilotage de l’armée de l’air et a servi comme pilote de chasse ; il est lieutenant-colonel de réserve. Après sa démobilisation, il a lancé des start-up, et jusqu’à son entrée en politique, il a piloté des Boeing 777 pour El Al."
