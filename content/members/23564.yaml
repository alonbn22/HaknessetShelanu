  - kind: positive
    category: achievement
    title:
      he: כיהן כשר התקשורת (2019–2020)
      en: Served as Minister of Communications (2019-2020)
    description:
      he: אמסלם כיהן כשר התקשורת מיולי 2019 עד שנת 2020, ולאחר מכן כשר במשרד הדיגיטל
        הלאומי. בעת מינויו לשר התקשורת שימש כיושב ראש הקואליציה בכנסת.
      en: Amsalem served as Minister of Communications from July 2019 to 2020, and
        subsequently as minister for national digital matters. At the time of
        his appointment as communications minister he was serving as chairman of
        the coalition in the Knesset.
    date: 2019-07-01
