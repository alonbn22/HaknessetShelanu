      he: "מנהל מינהל החינוך של עיריית ירושלים ומחנך ותיק"
      en: "Director of Education for the Jerusalem Municipality and veteran educator"
    description:
      he: "לפני כניסתו לפוליטיקה היה טור-פז איש חינוך: ניהל את בית הספר התיכון 'שקד' בשדה אליהו (2007–2012), כיהן כמנהל מינהל החינוך של עיריית ירושלים (2012–2017), ובהמשך הוביל את מערך החינוך של התנועה הקיבוצית הדתית."
      en: "Before entering politics, Tur-Paz built a career in education: he managed the Shaked secondary school in Sde Eliyahu (2007–2012), served as Director of Education for the Jerusalem Municipality (2012–2017), and later led the education network of the Religious Kibbutz Movement."
