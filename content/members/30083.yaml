    date: 2026-09-03
    title:
      he: הצהיר כי הוא שואף לכהן כשר האוצר בממשלה הבאה
      en: Said he aims to serve as Finance Minister in the next government
    description:
      he: בריאיון ב-3 בספטמבר 2026, לאחר זכייתו במקום הראשון בפריימריז, אמר כהן כי הוא מבקש לכהן כשר האוצר בממשלה הבאה, וכי תפקידו העיקרי של שר אוצר הוא "יצירת מנועי צמיחה". בריאיון קרא גם להפחתת המס על הדלק והציע להעביר את בתי הזיקוק מחיפה לנגב.
      en: In an interview on 3 September 2026, after winning first place in the primary, Cohen said he wants to serve as Finance Minister in the next government, describing a finance minister's main task as "creating growth engines". He also called for lowering fuel tax and proposed relocating the Haifa refineries to the Negev.
    sources:
      - url: https://finance.walla.co.il/item/3865219
        title: 'אחרי המקום הראשון בפריימריז, אלי כהן מכוון לתפקיד הבא: "רוצה להיות שר האוצר"'
        publisher: Walla
