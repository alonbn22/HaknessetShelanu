# Keeps the site's data fresh: once a day it pulls the latest Knesset open data
# into the database and publishes it for the site to deploy.
#
# The database isn't in git (GitHub's 100 MiB file limit, and history bloat).
# It lives in the `data-latest` release: this job downloads it, syncs (vote sync
# is incremental: its cursor is stored inside the DB), checks and compacts it,
# uploads it back, then calls the Vercel deploy hook so the site rebuilds with
# the new data. A failed run leaves the published DB untouched, and GitHub
# emails the repo owner.
#
# Secrets: VERCEL_DEPLOY_HOOK (optional; Vercel → Project → Settings → Git →
# Deploy Hooks). New Hebrew text isn't translated here: it shows, marked as
# Hebrew, until a reviewed translation batch is imported.
name: Sync Knesset data

on:
  schedule:
    # Every day at 02:30 UTC (05:30 in Israel in summer, 04:30 in winter).
    - cron: "30 2 * * *"
  workflow_dispatch: {} # allow manual runs from the Actions tab

# Two runs must never publish over each other.
concurrency:
  group: sync-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write # needed to upload the release asset
    steps:
      # Actions pinned to a commit SHA (not a mutable tag): this job holds a
      # contents:write token, so a hijacked tag must not be able to run code here.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      # `npm ci` only — the lockfile is authoritative. If it fails, fix the
      # lockfile rather than bypass it.
      - run: npm ci

      - name: Download the published database
        run: npm run db:pull
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Run incremental sync
        run: npm run sync
        # A hung OData pagination would otherwise run for hours, blocking the
        # concurrency slot for the next day's sync.
        timeout-minutes: 45

      # Never publish a damaged DB: folds and removes the WAL, runs PRAGMA
      # integrity_check (exits non-zero on corruption), then switches to a
      # rollback journal and VACUUMs — the site opens the file read-only.
      - name: Check and compact the database
        run: node scripts/db-clean.mjs

      - name: Publish the database
        run: npm run db:publish
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Deploy the site
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -n "$HOOK" ]; then
            curl -fsS -X POST "$HOOK" > /dev/null && echo "Deploy triggered."
          else
            echo "No VERCEL_DEPLOY_HOOK secret; skipping the deploy."
          fi
