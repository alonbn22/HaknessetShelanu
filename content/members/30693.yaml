    title:
      he: "הצטרף לרשימת 'ביחד' של נפתלי בנט לבחירות 2026"
      en: "Joined Naftali Bennett's 'Yachad' list for the 2026 election"
    description:
      he: "ב-5 באוגוסט 2026 הודיע נפתלי בנט כי גינזבורג מצטרף לרשימת 'ביחד' לבחירות לכנסת ה-26. בנט תיאר אותו כאיש ציבור מנוסה ומקצועי, וגינזבורג אמר כי לממשלה הבאה לא יהיו רגעי חסד והיא תצטרך לפעול מיד לתיקון הנזקים. מיקומו ברשימה לא פורסם בהודעה."
      en: "On 5 August 2026 Naftali Bennett announced that Ginzburg was joining the 'Yachad' list for the election to the 26th Knesset. Bennett described him as an experienced, professional public servant, and Ginzburg said the next government would have no grace period and would have to act immediately to repair the damage. His placement on the list was not announced."
