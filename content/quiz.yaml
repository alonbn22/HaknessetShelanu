        source: { url: "https://yasharwitheisenkot.com/wp-content/uploads/2026/06/Yashar_10_Steps_Brochure.pdf", title: "10 הצעדים לשגשוגה של מדינת ישראל — מצע ישר!", publisher: "ישר!" }
        quote:
          he: "\"נעביר את חוק 'שירות ממלכתי לכל' שיביא לשילוב הציבור החרדי והערבי במסגרות המתאימות, בראש ובראשונה לצה\"ל… מי שמשרת, מתוגמל\" (צעד 3)."
          en: "\"We will pass the 'National Service for All' law, integrating the haredi and Arab publics, first and foremost into the IDF… whoever serves is rewarded\" (step 3)."
          ar: "«سنمرّر قانون ‹الخدمة الرسمية للجميع› الذي سيدمج الجمهورين الحريدي والعربي في الأطر المناسبة، وفي مقدمتها الجيش… من يخدم يُكافأ» (الخطوة 3)."
          ru: "«Мы примем закон „Государственная служба для всех“, который интегрирует харедимную и арабскую общественность в соответствующие рамки, прежде всего в ЦАХАЛ… кто служит — получает вознаграждение» (шаг 3)."
          es: "«Aprobaremos la ley de “Servicio nacional para todos”, que integra a los públicos jaredí y árabe, ante todo en las FDI… quien sirve es recompensado» (punto 3)."
          fr: "« Nous ferons adopter la loi “Service national pour tous”, qui intègre les publics haredi et arabe, d’abord et avant tout dans Tsahal… celui qui sert est récompensé » (point 3)."
      reservists:
        value: -2
        basis: platform
        source: { url: "https://www.themiluimnikim.org.il/platform/", title: "עקרונות — המילואימניקים (עיקרי המצע)", publisher: "המילואימניקים" }
        quote:
          he: "\"חוק גיוס לכולם: כל אזרח ישראלי, יהודי, ערבי, חילוני חרדי צריך לעשות משהו למען המדינה… מי שלא ישרת – לא יקבל כלום מהמדינה.\""
          en: "\"A draft law for all: every Israeli citizen, Jewish, Arab, secular, haredi, must do something for the state… whoever does not serve gets nothing from the state.\""
          ar: "«قانون تجنيد للجميع: كل مواطن إسرائيلي، يهوديًا كان أو عربيًا، علمانيًا أو حريديًا، يجب أن يفعل شيئًا من أجل الدولة… ومن لا يخدم لن يحصل على شيء من الدولة.»"
          ru: "«Закон о призыве для всех: каждый гражданин Израиля — еврей, араб, светский, харедим — должен что-то сделать для государства… кто не служит, ничего не получит от государства»."
          es: "«Una ley de reclutamiento para todos: todo ciudadano israelí, judío, árabe, laico, jaredí, debe hacer algo por el Estado… quien no sirve no recibe nada del Estado.»"
          fr: "« Une loi de conscription pour tous : chaque citoyen israélien, juif, arabe, laïque, haredi, doit faire quelque chose pour l’État… celui qui ne sert pas ne reçoit rien de l’État. »"
      haredi-public:
        value: 1
        basis: platform
        source: { url: "https://hatzibur-haharedi.org/%D7%9E%D7%A6%D7%A2", title: "המצע — הציבור החרדי", publisher: "הציבור החרדי" }
        quote:
          he: "\"עלינו להגן על מי שבאמת מקדיש את חייו ללימוד התורה, ולאפשר לו ללמוד בשקט, בלי איום במעצר, בלי סנקציות… כל צעיר חרדי שאינו מקדיש את חייו ללימוד תורה, צריך לשרת.\""
          en: "\"We must protect whoever truly devotes his life to Torah study and let him study in peace, without threat of arrest or sanctions… every haredi youth who does not devote his life to Torah study must serve.\""
          ar: "«علينا أن نحمي من يكرّس حياته حقًا لدراسة التوراة وأن نتيح له الدراسة بهدوء، دون تهديد بالاعتقال ودون عقوبات… وكل شاب حريدي لا يكرّس حياته لدراسة التوراة يجب أن يخدم.»"
          ru: "«Мы должны защитить того, кто действительно посвящает жизнь изучению Торы, и дать ему учиться спокойно, без угрозы ареста и санкций… каждый молодой харедим, который не посвящает жизнь изучению Торы, должен служить»."
          es: "«Debemos proteger a quien de verdad consagra su vida al estudio de la Torá y dejarle estudiar en paz, sin amenaza de detención ni sanciones… todo joven jaredí que no consagre su vida al estudio de la Torá debe servir.»"
          fr: "« Nous devons protéger celui qui consacre vraiment sa vie à l’étude de la Torah et le laisser étudier en paix, sans menace d’arrestation ni de sanctions… tout jeune haredi qui ne consacre pas sa vie à l’étude de la Torah doit servir. »"
      amkha:
        value: -1
        basis: platform
        source: { url: "https://amchaisrael.co.il/foundations", title: "מסמך אבני היסוד של התנועה — עמך ישראל (צעד 02 ופרק השירות)", publisher: "עמך ישראל" }
        quote:
          he: "\"נחוקק חוק יסוד: השירות, לפיו כל אזרח במדינת ישראל ישרת את המדינה… לרבות הפרמטרים לבחינה אובייקטיבית של מכסות לומדי התורה.\" ובהמשך: \"תישמר האפשרות למסלולים ייחודיים למצוינות תורנית, אך האחריות המשותפת והשירות תהיה הכלל ולא החריג.\""
          en: "\"We will enact Basic Law: Service, under which every citizen of Israel will serve the state… including the parameters for an objective review of quotas of Torah learners.\" And: \"The option of special tracks for Torah excellence will be preserved, but shared responsibility and service will be the rule, not the exception.\""
          ar: "«سنسنّ قانون أساس: الخدمة، الذي بموجبه يخدم كل مواطن في دولة إسرائيل الدولة… بما في ذلك معايير الفحص الموضوعي لحصص طلاب التوراة.» وفي البرنامج أيضًا: «سيُحافَظ على إمكانية مسارات خاصة للتميّز التوراتي، لكن المسؤولية المشتركة والخدمة ستكونان القاعدة لا الاستثناء.»"
          ru: "«Мы примем Основной закон: служба, по которому каждый гражданин Государства Израиль будет служить государству… включая параметры объективной оценки квот изучающих Тору». И в программе: «Сохранится возможность особых треков для выдающихся знатоков Торы, но общая ответственность и служба будут правилом, а не исключением»."
          es: "«Promulgaremos la Ley Fundamental: El Servicio, según la cual todo ciudadano del Estado de Israel servirá al Estado… incluidos los parámetros para un examen objetivo de los cupos de estudiantes de Torá.» Y también: «Se mantendrá la opción de vías especiales para la excelencia en la Torá, pero la responsabilidad compartida y el servicio serán la regla y no la excepción.»"
          fr: "« Nous adopterons la Loi fondamentale : le Service, selon laquelle tout citoyen de l’État d’Israël servira l’État… y compris les paramètres d’un examen objectif des quotas d’étudiants de la Torah. » Et aussi : « La possibilité de filières spéciales pour l’excellence en Torah sera préservée, mais la responsabilité partagée et le service seront la règle et non l’exception. »"

  - id: core-curriculum
    topic: education
    lean: left
    text:
      he: "יש להתנות מימון ממשלתי לבתי ספר חרדיים בלימודי ליבה מלאים (מתמטיקה, אנגלית)."
      en: "State funding for haredi schools should be conditional on teaching the full core curriculum (maths, English)."
      ar: "يجب أن يكون تمويل الدولة للمدارس الحريدية مشروطًا بتدريس المنهاج الأساسي الكامل (رياضيات، إنجليزية)."
      ru: "Государственное финансирование харедимных школ должно быть обусловлено преподаванием полной базовой программы (математика, английский)."
      es: "La financiación estatal de las escuelas jaredíes debería condicionarse a enseñar el currículo básico completo (matemáticas, inglés)."
      fr: "Le financement public des écoles haredi devrait être conditionné à l’enseignement du programme de base complet (mathématiques, anglais)."
    short:
      he: "לימודי ליבה בחינוך החרדי"
      en: "Core studies in haredi schools"
      ar: "المناهج الأساسية في المدارس الحريدية"
      ru: "Базовая программа в харедимных школах"
      es: "Estudios básicos en las escuelas jaredíes"
      fr: "Tronc commun dans les écoles haredi"
    explainer:
      he: "רבים מבתי הספר החרדיים לבנים אינם מלמדים מתמטיקה ואנגלית ברמה מלאה, ומקבלים מימון ציבורי, חלקי או מלא לפי סוג בית הספר. התומכים אומרים שבלי לימודי ליבה הבוגרים מתקשים להתפרנס ושהמדינה לא צריכה לממן זאת; המתנגדים אומרים שזו זכות הקהילה לחנך לפי דרכה ושהתניית המימון היא כפייה."
      en: "Many haredi boys' schools do not teach maths and English fully, and receive public funding, partial or full depending on the type of school. Supporters say that without core studies graduates struggle to earn a living and the state should not fund it; opponents say the community has the right to educate its own way and conditioning funds is coercion."
      ar: "كثير من مدارس البنين الحريدية لا تدرّس الرياضيات والإنجليزية بشكل كامل، وتتلقى تمويلًا عامًا، جزئيًا أو كاملًا بحسب نوع المدرسة. يقول المؤيدون إنه من دون المناهج الأساسية يصعب على الخرّيجين كسب الرزق وإن الدولة يجب ألا تموّل ذلك؛ ويقول المعارضون إن من حق المجتمع أن يعلّم أبناءه على طريقته وإن ربط التمويل بشروط إكراه."
      ru: "Многие харедимные школы для мальчиков не преподают математику и английский в полном объёме и получают государственное финансирование — частичное или полное, в зависимости от типа школы. Сторонники говорят, что без базовой программы выпускникам трудно зарабатывать и государство не должно это финансировать; противники — что община вправе учить по-своему, а условия финансирования — принуждение."
      es: "Muchas escuelas jaredíes de varones no enseñan matemáticas e inglés de forma completa y reciben financiación pública, parcial o total según el tipo de escuela. Los partidarios dicen que sin estudios básicos los graduados tienen dificultades para ganarse la vida y que el Estado no debería financiarlo; los opositores dicen que la comunidad tiene derecho a educar a su manera y que condicionar los fondos es coacción."
      fr: "Beaucoup d’écoles haredi de garçons n’enseignent pas pleinement les mathématiques et l’anglais et reçoivent un financement public, partiel ou total selon le type d’école. Les partisans disent que sans tronc commun, les diplômés peinent à gagner leur vie et que l’État ne devrait pas le financer ; les opposants disent que la communauté a le droit d’éduquer à sa manière et que conditionner les fonds est une contrainte."
    explainerSources:
      - { url: "https://en.idi.org.il/articles/49956", title: "On the Haredi Educational System", publisher: "המכון הישראלי לדמוקרטיה" }
      - { url: "https://en.idi.org.il/articles/59980", title: "Executive Summary: (Non-)Enforcement of the Core Curriculum Requirement in ultra-Orthodox Boys' Education", publisher: "המכון הישראלי לדמוקרטיה" }
    stances:
      together:
        value: 2
        basis: platform
