    description:
      he: "ב-19 באוגוסט 2026, לאחר משא ומתן ממושך שבמהלכו דחה טיבי הצעה קודמת לחלוקת המקומות, סיכמו חד\"ש, תע\"ל ובל\"ד על ריצה ברשימה משותפת לכנסת ה-26. בראש הרשימה יו\"ר חד\"ש יוסף ג'בארין, טיבי במקום השני וסאמי אבו שחאדה מבל\"ד במקום השלישי; רע\"ם אינה חלק מההסכם ומתמודדת בנפרד."
      en: "On 19 August 2026, after prolonged negotiations in which Tibi had rejected an earlier proposed slate, Hadash, Ta'al and Balad agreed to run together on a joint list for the 26th Knesset. Hadash chairman Yousef Jabareen heads the list, Tibi is second and Balad's Sami Abou Shahadeh third; Ra'am is not part of the agreement and is running separately."
