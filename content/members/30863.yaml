claims:
  - kind: positive
    category: achievement
    title:
      he: חברת הכנסת ה-25 מטעם ישראל ביתנו
      en: Member of the 25th Knesset for Yisrael Beiteinu
    description:
      he: שרון ניר הצטרפה למפלגת ישראל ביתנו, שובצה במקום הרביעי ברשימה לבחירות לכנסת
        ה-25, נבחרה והושבעה כחברת הכנסת ב-15 בנובמבר 2022. בין היתר היא חברה
        בוועדת החוץ והביטחון ובוועדת האתיקה.
      en: Sharon Nir joined the Yisrael Beiteinu party, was placed fourth on its list
        for the 2022 election to the 25th Knesset, was elected, and was sworn in
        as a Member of Knesset on 15 November 2022. She serves on Knesset
        committees including the Foreign Affairs and Defense Committee and the
        Ethics Committee.
    date: 2022-11-15
