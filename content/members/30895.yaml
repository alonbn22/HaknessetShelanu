      en: Azuz served as CEO of "The Women's Courtyard," a nonprofit serving young
        women in distress (from 2021), and previously led the rights-advancement
        department at ALUT (the national association for children and adults
        with autism). After Yair Lapid became Prime Minister in 2022, she was
        appointed an adviser on people with disabilities.
