    date: "2026-05-16"
    title:
      he: לא התמודדה על מקום ברשימת חד"ש לכנסת ה-26 ותסיים את כהונתה בכנסת
      en: Did not seek a place on the Hadash list for the 26th Knesset and will end her Knesset service
    description:
      he: בוועידת חד"ש שהתכנסה ב-16 במאי 2026 בדיר חנא, שבה נבחר ד"ר יוסף ג'בארין לעמוד בראש רשימת המפלגה במקומו של איימן עודה, לא התמודדה תומא-סלימאן על מקום ברשימה, לאחר 11 שנות כהונה בכנסת מאז 2015. לפי הדיווח, על פי תקנון המפלגה המעודד תחלופה היא הייתה נדרשת לרוב של שני שלישים כדי להיבחר שוב; במקומה במקום השני נבחר ג'עפר פרח.
      en: At the Hadash conference held on 16 May 2026 in Deir Hanna, where Dr. Yousef Jabareen was elected to head the party's list in place of Ayman Odeh, Touma-Sliman did not seek a place on the list, after 11 years in the Knesset since 2015. According to the report, under party rules that encourage turnover she would have needed a two-thirds majority to be elected again; Jafar Farah was chosen for the second slot in her place.
