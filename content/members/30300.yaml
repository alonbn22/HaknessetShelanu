    description:
      he: לפני כניסתו לפוליטיקה שירת אוחנה כשוטר צבאי בצה"ל, ולאחר מכן בשירות הביטחון
        הכללי (שב"כ). הוא למד משפטים, התמחה בפרקליטות המדינה ועסק בעריכת דין
        פלילית במשך כעשור. הוא נכנס לכנסת מטעם הליכוד בדצמבר 2015.
      en: Before entering politics, Ohana served as a military police officer in the
        IDF and then in the Shin Bet security service. He studied law, interned
        at the State Prosecutor's Office, and worked as a criminal-defence
        lawyer for roughly a decade. He entered the Knesset for Likud in
        December 2015.
