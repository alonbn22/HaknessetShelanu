      en: Orit Farkash-Hacohen served as chairwoman of Israel's Electricity Authority
        (appointed temporarily in September 2011 and permanently in March 2012),
        one of the senior regulators in the Israeli energy sector. In 2015 she
        was dismissed by order of Prime Minister Benjamin Netanyahu after she
        publicly opposed the natural gas framework agreement and the monopoly in
        the natural gas market.
