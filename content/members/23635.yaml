      en: "First Ethiopian-born cabinet minister in Israel"
    description:
      he: "ב-2020 מונתה תמנו-שטה לשרת העלייה והקליטה והפכה לחברת הממשלה הראשונה ילידת אתיופיה בתולדות ישראל. היא כיהנה בתפקיד בממשלה ה-35 ובממשלה ה-36 עד דצמבר 2022."
      en: "In 2020 Tamano-Shata was appointed Minister of Aliyah and Integration, becoming the first Ethiopian-born cabinet member in Israel's history. She held the post in the 35th and 36th governments until December 2022."
    date: "2020-05-17"
