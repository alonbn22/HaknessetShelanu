  - kind: positive
    category: achievement
    title:
      he: חבר הכנסת ה-25 מטעם הליכוד
      en: Member of the 25th Knesset for Likud
    description:
      he: אושר שקלים נכנס לכנסת ה-25 ב-15 בפברואר 2023 כחבר כנסת מטעם הליכוד, במסגרת
        'החוק הנורבגי', במקומו של אלי כהן שהתפטר עם מינויו לשר. כיהן במספר
        ועדות, ובהן ועדת ביקורת המדינה וועדת החוץ והביטחון, ועמד בראש השדולה
        לעסקים קטנים ובינוניים.
      en: Osher Shekalim entered the 25th Knesset on 15 February 2023 as a Likud
        member of parliament under the 'Norwegian Law', replacing Eli Cohen, who
        resigned upon his appointment as a minister. He has served on several
        committees, including the State Control Committee and the Foreign
        Affairs and Defense Committee, and chaired the Knesset caucus for small
        and medium-sized businesses.
    date: 2023-02-15
