# Coalition membership is not published as data by the Knesset — it is
# maintained by hand here from the factions' own announcements as reported by
# major outlets (and the Knesset's government page for ministers). Faction IDs
# are KNS_Faction Ids for the given Knesset. PLEASE REVIEW after political
# changes (resignations, new agreements).
#
# Knesset 25 faction IDs for reference:
#   1095 ש"ס                     1102 יש עתיד
#   1096 הליכוד                  1103 חד"ש-תע"ל
#   1099 רע"ם                    1104 ישראל ביתנו
#   1100 העבודה                  1105 הציונות הדתית (סמוטריץ')
#   1101 יהדות התורה             1106 עוצמה יהודית (בן גביר)
#                                1107 נעם (אבי מעוז)
#                                1108 הימין הממלכתי (סער)
#                                1110 כחול לבן - המחנה הממלכתי
#
# Status held below (verified 19 Sep 2026):
# - The 37th government was sworn in on 29 Dec 2022 with Likud, Shas, UTJ,
#   Religious Zionism, Otzma Yehudit and Noam (64 seats).
# - New Hope (הימין הממלכתי) joined the government on 30 Sep 2024.
# - Otzma Yehudit left the government on 19–21 Jan 2025 and returned on
#   19–20 Mar 2025.
# - UTJ (Degel HaTorah and Agudat Yisrael) left the government AND the
#   coalition on 14 Jul 2025 over the draft law; as of May 2026 it was still
#   "formally" outside both (Times of Israel, 12 May 2026).
# - Shas ministers resigned on 16–17 Jul 2025, but Shas announced it remains in
#   the coalition.
# - Noam's Avi Maoz announced on 16 Jul 2025 that he is not a member of the
#   coalition ("there are only 60 MKs in the coalition").
# - The 25th Knesset dispersed on 17 Jul 2026 (dissolution law, second and
#   third readings); the government continues as a caretaker (ממשלת מעבר)
#   until the 26th Knesset's government is sworn in, so membership is held as
#   it stood at dissolution: 60 seats.
# - 60 is below 61 on purpose, not a counting error: since 14 Jul 2025 this
#   has been a minority government. Basic Law: The Government asks the
#   Knesset for confidence to install a government (s. 13(d)) and for a
#   majority of all its members — 61 — only to replace it with another one
#   (s. 28(b)); nothing requires 61 to stay in office. The `majority` block
#   below carries the sources, and the pages show the explanation next to the
#   count whenever the timeline's last step is under 61.

knesset: 25
asOf: "2026-09-19"
caretakerSince: "2026-07-17"
governmentSince: "2022-12-29"
sourceUrl: "https://main.knesset.gov.il/mk/government/pages/governments.aspx?govId=37"
sourceLabel: "הממשלה ה-37 — אתר הכנסת"
coalitionFactionIds:
  - 1096 # הליכוד
  - 1095 # ש"ס
  - 1105 # הציונות הדתית
  - 1106 # עוצמה יהודית
  - 1108 # הימין הממלכתי

# Why a coalition of 60 is a real state and not a bug — the law itself.
majority:
  needed: 61
  sources:
    - { url: "https://main.knesset.gov.il/Activity/Legislation/Documents/yesod6.pdf", title: "חוק-יסוד: הממשלה — סעיף 3 (הממשלה מכהנת מכוח אמון הכנסת), סעיף 13(ד) (כינון הממשלה) וסעיף 28(ב) (אי-אמון ברוב חברי הכנסת בממשלה אחרת); נוסח מעודכן ליום 13.5.2025", publisher: "חוק-יסוד: הממשלה (הכנסת)" }
    - { url: "https://main.knesset.gov.il/About/Lexicon/Pages/NoConfidence.aspx", title: "הבעת אי-אמון בממשלה — לקסיקון הכנסת", publisher: "לקסיקון הכנסת" }
    - { url: "https://www.timesofisrael.com/far-right-lawmaker-avi-maoz-quits-coalition-leaving-pm-with-a-minority-government/", title: "Far-right MK Avi Maoz quits coalition, leaving Netanyahu without Knesset majority (17 Jul 2025)", publisher: "The Times of Israel" }

