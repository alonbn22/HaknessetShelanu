    title:
      he: "רקע מקצועי בשירות הציבורי ובתחום הרווחה"
      en: "Professional background in public service and welfare"
    description:
      he: "טרם כניסתה לפוליטיקה ניהלה עטייה את לשכת מזכיר הארגון הארצי של עובדי התעשייה האווירית (1993–2015), ובשנים 2015–2018 שימשה ראש לשכת שר העבודה, הרווחה והשירותים החברתיים, שם עסקה בסוגיות רווחה וביטוח לאומי. היא בעלת תואר במשפטים מהקריה האקדמית אונו ותארים במדעי החברה מאוניברסיטת בר-אילן."
      en: "Before entering politics, Atia ran the office of the secretary of the national union of Israel Aerospace Industries workers (1993–2015), and from 2015 to 2018 was chief of staff to the Minister of Labor, Social Affairs and Social Services, handling welfare and national-insurance matters. She holds a law degree from Ono Academic College and social-science degrees from Bar-Ilan University."
