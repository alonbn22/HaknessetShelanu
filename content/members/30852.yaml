    title:
      he: הודח מתפקידיו בוועדות הכנסת לאחר שהצביע נגד חוק לימוד התורה
      en: Removed from Knesset committee roles after voting against the Torah Study
        Basic Law
    description:
      he: ביוני 2026 הצביע ח"כ משה סולומון נגד הקריאה הטרומית של הצעת חוק יסוד שביקשה
        לעגן את לימוד התורה כערך יסוד, בניגוד לעמדת סיעתו; הצעת החוק עברה ברוב
        של 56 מול 43. סולומון נימק את הצבעתו בעמדתו בדבר שילוב לימוד תורה ושירות
        צבאי. בעקבות ההצבעה הודיע יו"ר הציונות הדתית בצלאל סמוטריץ' על הדחתו
        מתפקידיו בוועדות הכנסת מטעם הסיעה. מדובר בצעד משמעתי מפלגתי פנימי ולא
        בהליך פלילי או משפטי.
      en: In June 2026, MK Moshe Solomon voted against the preliminary reading of a
        Basic Law bill seeking to enshrine Torah study as a foundational value,
        against his faction's position; the bill passed 56-43. Solomon cited his
        views on the integration of Torah study and military service. Following
        the vote, Religious Zionism leader Bezalel Smotrich announced he was
        removing Solomon from his roles on Knesset committees on behalf of the
        faction. This was an internal party disciplinary measure, not a criminal
        or legal proceeding.
    date: 2026-06-10
