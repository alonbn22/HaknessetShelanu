    title:
      he: כיהן כשר במשרד החינוך בממשלה ה-37
      en: Served as a minister in the Ministry of Education
    description:
      he: חיים ביטון, מטעם ש"ס, מונה לשר במשרד החינוך בממשלה ה-37 בראשות בנימין נתניהו
        ב-29 בדצמבר 2022, ובמסגרת תפקידו היה ממונה בין היתר על החינוך החרדי
        והחברה למתנ"סים. הוא התפטר מתפקידו כשר ביולי 2025, במסגרת התפטרות שרי
        ש"ס על רקע משבר חוק הגיוס.
      en: Chaim Biton of Shas was appointed a minister in the Ministry of Education in
        the 37th government led by Benjamin Netanyahu on 29 December 2022, with
        responsibilities that included the Haredi education sector and the
        community-centers authority. He resigned from the ministerial post in
        July 2025, as part of the resignation of Shas ministers amid the dispute
        over the military-conscription (draft) law.
    date: 2022-12-29
