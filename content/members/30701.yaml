        title: Ofir Katz
        publisher: Wikipedia
      - url: https://www.wikidata.org/wiki/Q63107922
        title: Ofir Katz (Q63107922)
        publisher: Wikidata
  - kind: positive
    category: achievement
    title:
      he: יו"ר ועדת הכנסת ויושב ראש הקואליציה
      en: Chair of the Knesset House Committee and coalition chair (whip)
    description:
      he: כץ מכהן כיושב ראש הקואליציה מאז כינון הממשלה ה-37 בדצמבר 2022, וכן כיו"ר
        סיעת הליכוד וכיו"ר ועדת הכנסת (ועדת הבית) מאז 2023 — תפקידים מרכזיים בניהול
        עבודת המליאה והקואליציה.
      en: Katz has served as coalition chair (whip) since the 37th government was
        formed in December 2022, and as chair of the Likud faction and of the
        Knesset House Committee since 2023 — central roles in managing the work
        of the plenum and the governing coalition.
    date: 2022-12-29
    sources:
