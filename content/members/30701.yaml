  - kind: positive
    category: achievement
    title:
      he: יזם חוקים למען לוחמים משוחררים ונכי צה"ל
      en: Sponsored laws for discharged combat soldiers and disabled IDF veterans
    description:
      he: כץ יזם את החוק למימון מלא (100%) של תואר אקדמי ללוחמים משוחררים, שאושר סופית
        בכנסת ב-20 בדצמבר 2023, ואת החוק להכפלת המימון הממשלתי לפעילות ארגוני נכי
        צה"ל ונפגעי פעולות איבה, שאושר ב-21 באוקטובר 2025.
      en: Katz initiated the law providing full (100%) state funding of an academic
        degree for discharged combat soldiers, given final Knesset approval on 20
        December 2023, and the law doubling state funding for the activities of
        organizations serving disabled IDF veterans and victims of hostile acts,
        approved on 21 October 2025.
    date: 2025-10-21
    sources:
      - url: https://www.ynet.co.il/news/article/hjcwvwxp6
        title: "אושר סופית: המדינה תממן 100% מהתואר ללוחמים משוחררים"
        publisher: Ynet
      - url: https://www.ynet.co.il/economy/article/rk91hfrclx
