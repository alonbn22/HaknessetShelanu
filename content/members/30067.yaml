    title:
      he: האישה הערבייה הראשונה שעמדה בראש ועדת כנסת קבועה
      en: First Arab woman to chair a permanent Knesset committee
    description:
      he: ב-4 ביוני 2015 נבחרה חברת הכנסת עאידה תומא-סלימאן (הרשימה המשותפת) פה אחד
        לעמוד בראש ועדת הכנסת למעמד האישה ולשוויון מגדרי, ובכך הפכה לחברת הכנסת
        הראשונה ממפלגה ערבית שעומדת בראש ועדה קבועה של הכנסת.
      en: On 4 June 2015, MK Aida Touma-Sliman (Joint List) was elected unanimously to
        chair the Knesset Committee on the Status of Women and Gender Equality,
        becoming the first MK from an Arab party to head a permanent Knesset
        committee.
    date: 2015-06-04
