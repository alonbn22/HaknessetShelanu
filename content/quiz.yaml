      together:
        value: 1
        basis: statement
        source: { url: "https://www.ynet.co.il/news/120andone/article/s100tqclqmg", title: "בנט: \"אני עם לפיד עד הסוף, לא אשב עם נתניהו\" (3.7.2026)", publisher: "ynet" }
        quote:
          he: "בנט: \"התוכנית שלי אומרת שבשטחי C מתיישבים על פי חוק, ובשטחי A ו-B הרשות מנהלת.\""
          en: "Bennett: \"My plan says that in Area C we settle by law, and in Areas A and B the Authority administers.\""
          ar: "بينيت: «خطتي تقول إننا في المنطقة (ج) نستوطن وفق القانون، وفي المنطقتين (أ) و(ب) تدير السلطة.»"
          ru: "Беннет: «Мой план гласит: в зоне C мы селимся по закону, а в зонах A и B управляет Автономия»."
          es: "Bennett: «Mi plan dice que en el Área C nos asentamos por ley, y en las Áreas A y B administra la Autoridad.»"
          fr: "Bennett : « Mon plan dit qu’en zone C nous nous implantons par la loi, et qu’en zones A et B l’Autorité administre. »"
      reservists:
        value: 1
        basis: platform
        source: { url: "https://www.themiluimnikim.org.il/platform/", title: "עקרונות — המילואימניקים (עיקרי המצע)", publisher: "המילואימניקים" }
        quote:
          he: "\"ריבונות דרך מעשים – חיזוק ההתיישבות ביהודה ושומרון והכרעה על קרקעות בשטחי C חשובה והכרחית – נדבך קריטי מהביטחון הלאומי.\""
          en: "\"Sovereignty through deeds — strengthening settlement in Judea and Samaria and deciding on lands in Area C is important and necessary, a critical layer of national security.\""
          ar: "«السيادة من خلال الأفعال — تعزيز الاستيطان في يهودا والسامرة والحسم بشأن الأراضي في المنطقة (ج) أمر مهم وضروري، وطبقة حاسمة من الأمن القومي.»"
          ru: "«Суверенитет делами: укрепление поселений в Иудее и Самарии и решение по землям зоны C важны и необходимы — это критически важная составляющая национальной безопасности»."
          es: "«Soberanía mediante hechos: fortalecer los asentamientos en Judea y Samaria y decidir sobre las tierras del Área C es importante y necesario, una capa crítica de la seguridad nacional.»"
          fr: "« La souveraineté par les actes — renforcer l’implantation en Judée-Samarie et trancher sur les terres de la zone C est important et nécessaire, une couche critique de la sécurité nationale. »"
      yashar:
        value: 0
        basis: statement
        source: { url: "https://www.ynet.co.il/news/elections2026/article/yokra14910407", title: "פינוי או בינוי: מה התוכנית של כל מפלגה ליהודה ושומרון (28.9.2026)", publisher: "ynet" }
        quote:
          he: "תשובת ישר! ל-ynet: \"ישר! תומכת בחיזוק גושי ההתיישבות ובהקמת יישובים חדשים באופן חוקי, בהתאם לאינטרסים הלאומיים של ישראל ולהמלצות מערכת הביטחון\"; ועל ריבונות: \"ישר! מתנגדת למהלכים שמשמעותם סיכון הרוב היהודי במדינת ישראל - דבר שיוביל למדינה דו-לאומית\" — עמדה מעורבת"
          en: "Yashar's answer to ynet: \"Yashar! supports strengthening the settlement blocs and establishing new communities lawfully, in line with Israel's national interests and the security establishment's recommendations\"; and on sovereignty: \"Yashar! opposes moves that would put the Jewish majority in the State of Israel at risk — which would lead to a binational state\" — a mixed position"
          ar: "ردّ ياشار! على ynet: «ياشار! تؤيد تعزيز الكتل الاستيطانية وإقامة بلدات جديدة بشكل قانوني، وفقًا للمصالح القومية لإسرائيل ولتوصيات المؤسسة الأمنية»؛ وعن السيادة: «ياشار! تعارض الخطوات التي تعني تعريض الأغلبية اليهودية في دولة إسرائيل للخطر — وهو ما سيؤدي إلى دولة ثنائية القومية» — موقف مختلط"
          ru: "Ответ «Яшар!» для ynet: «„Яшар!“ поддерживает укрепление поселенческих блоков и создание новых населённых пунктов законным путём, в соответствии с национальными интересами Израиля и рекомендациями силовых структур»; о суверенитете: «„Яшар!“ выступает против шагов, ставящих под угрозу еврейское большинство в Государстве Израиль, — это привело бы к двунациональному государству» — неоднозначная позиция"
          es: "Respuesta de ¡Yashar! a ynet: «¡Yashar! apoya reforzar los bloques de asentamientos y establecer nuevas localidades de forma legal, conforme a los intereses nacionales de Israel y a las recomendaciones del aparato de seguridad»; y sobre la soberanía: «¡Yashar! se opone a medidas que pongan en riesgo la mayoría judía en el Estado de Israel, lo que llevaría a un Estado binacional» — una postura mixta"
          fr: "Réponse de Yashar! à ynet : « Yashar! soutient le renforcement des blocs d’implantations et la création de nouvelles localités de manière légale, conformément aux intérêts nationaux d’Israël et aux recommandations de l’appareil de sécurité » ; et sur la souveraineté : « Yashar! s’oppose aux mesures qui mettraient en danger la majorité juive dans l’État d’Israël — ce qui mènerait à un État binational » — une position mitigée"
      amkha:
        value: 2
        basis: statement
        source: { url: "https://www.ynet.co.il/news/elections2026/article/yokra14910407", title: "פינוי או בינוי: מה התוכנית של כל מפלגה ליהודה ושומרון (28.9.2026)", publisher: "ynet" }
        quote:
          he: "תשובת עמך ישראל ל-ynet: \"אנו מאמינים בזכותו של עם ישראל בארצו ותומכים בהקמת יישובים ביהודה ושומרון ובכל חבלי הארץ\"; ועל ריבונות: \"…על המדינה להעמיק את האחיזה בקרקע ולהחיל ריבונות ביהודה ושומרון ובכל מקום בארץ\""
          en: "Amkha Yisrael's answer to ynet: \"We believe in the right of the people of Israel to its land and support establishing communities in Judea and Samaria and in every part of the land\"; and on sovereignty: \"…the state must deepen its hold on the land and apply sovereignty in Judea and Samaria and everywhere in the land\""
          ar: "ردّ عمخا يسرائيل على ynet: «نؤمن بحق شعب إسرائيل في أرضه ونؤيد إقامة بلدات في يهودا والسامرة وفي كل أنحاء البلاد»؛ وعن السيادة: «…على الدولة أن تعمّق تمسّكها بالأرض وأن تفرض السيادة في يهودا والسامرة وفي كل مكان في البلاد»"
          ru: "Ответ «Амха Исраэль» для ynet: «Мы верим в право народа Израиля на свою землю и поддерживаем создание населённых пунктов в Иудее и Самарии и во всех частях страны»; о суверенитете: «…государство должно укрепить свою опору на земле и распространить суверенитет на Иудею и Самарию и на всю страну»"
          es: "Respuesta de Amkha Yisrael a ynet: «Creemos en el derecho del pueblo de Israel a su tierra y apoyamos establecer localidades en Judea y Samaria y en todas las regiones del país»; y sobre la soberanía: «…el Estado debe afianzar su presencia sobre el terreno y aplicar la soberanía en Judea y Samaria y en todo lugar del país»"
          fr: "Réponse d’Amkha Israël à ynet : « Nous croyons au droit du peuple d’Israël sur sa terre et soutenons la création de localités en Judée-Samarie et dans toutes les régions du pays » ; et sur la souveraineté : « …l’État doit renforcer son emprise sur le terrain et appliquer la souveraineté en Judée-Samarie et partout dans le pays »"
      blue-white:
        value: 1
        basis: statement
        source: { url: "https://www.ynet.co.il/news/elections2026/article/yokra14910407", title: "פינוי או בינוי: מה התוכנית של כל מפלגה ליהודה ושומרון (28.9.2026)", publisher: "ynet" }
        quote:
          he: "תשובת כחול לבן ל-ynet: \"המפלגה תומכת בחיזוק ההתיישבות ביהודה ושומרון בדגש על הבקעה, יישובי גב ההר, דרום הר חברון וקו התפר… אין צורך בפינוי יישובים\" (התשובה אינה עוסקת בהחלת ריבונות)"
          en: "Blue and White's answer to ynet: \"The party supports strengthening settlement in Judea and Samaria, with an emphasis on the Jordan Valley, the mountain-ridge communities, the southern Hebron Hills and the seam line… there is no need to evacuate communities\" (the answer does not address applying sovereignty)"
          ar: "ردّ أزرق أبيض على ynet: «يؤيد الحزب تعزيز الاستيطان في يهودا والسامرة مع التركيز على الغور وبلدات ظهر الجبل وجنوب جبل الخليل وخط التماس… لا حاجة إلى إخلاء بلدات» (الردّ لا يتناول فرض السيادة)"
          ru: "Ответ «Кахоль-лаван» для ynet: «Партия поддерживает укрепление поселений в Иудее и Самарии с упором на Иорданскую долину, населённые пункты горного хребта, южные Хевронские горы и линию шва… нет необходимости эвакуировать населённые пункты» (о распространении суверенитета в ответе не говорится)"
          es: "Respuesta de Azul y Blanco a ynet: «El partido apoya reforzar los asentamientos en Judea y Samaria, con énfasis en el valle del Jordán, las localidades de la cresta montañosa, el sur de las colinas de Hebrón y la línea de separación… no hay necesidad de evacuar localidades» (la respuesta no aborda la aplicación de la soberanía)"
          fr: "Réponse de Bleu et Blanc à ynet : « Le parti soutient le renforcement de l’implantation en Judée-Samarie, en particulier dans la vallée du Jourdain, les localités de la ligne de crête, le sud des collines d’Hébron et la ligne de jonction… il n’est pas nécessaire d’évacuer des localités » (la réponse ne traite pas de l’application de la souveraineté)"
  - id: econ-welfare
    topic: economy
    lean: left
    text:
      he: "המדינה צריכה להגדיל משמעותית את ההוצאה הציבורית על בריאות, חינוך ורווחה."
      en: "The state should significantly increase public spending on health, education and welfare."
      ar: "على الدولة أن تزيد الإنفاق العام على الصحة والتعليم والرفاه زيادة كبيرة."
      ru: "Государству следует значительно увеличить расходы на здравоохранение, образование и социальную сферу."
      es: "El Estado debería aumentar de forma significativa el gasto público en salud, educación y bienestar."
      fr: "L’État devrait augmenter nettement les dépenses publiques de santé, d’éducation et de protection sociale."
    short:
      he: "הוצאה על בריאות, חינוך ורווחה"
      en: "Spending on health, education, welfare"
      ar: "الإنفاق على الصحة والتعليم والرفاه"
      ru: "Расходы на здравоохранение, образование, соцсферу"
      es: "Gasto en salud, educación y bienestar"
      fr: "Dépenses de santé, d’éducation, de protection sociale"
    explainer:
      he: "השאלה היא כמה מהכסף הציבורי הולך לבתי חולים, לכיתות ולקצבאות — ומאיפה הוא יבוא. התומכים מצביעים על נתוני ה-OECD על עוני ופערים בישראל ואומרים שהתורים בבתי החולים והכיתות הצפופות דורשים עוד תקציב; המתנגדים אומרים שהבעיה היא ניהול ובזבוז ולא מחסור בכסף, ושהוצאה גדולה יותר פירושה מסים גבוהים יותר או חוב."
      en: "The question is how much public money goes to hospitals, classrooms and benefits — and where it comes from. Supporters point to OECD figures on poverty and inequality in Israel and say hospital queues and crowded classrooms need more budget; opponents say the problem is management and waste, not a lack of money, and that more spending means higher taxes or debt."
      ar: "السؤال هو كم من المال العام يذهب إلى المستشفيات والصفوف والمخصصات — ومن أين يأتي. يشير المؤيدون إلى بيانات منظمة التعاون الاقتصادي والتنمية عن الفقر والفجوات في إسرائيل ويقولون إن طوابير المستشفيات والصفوف المكتظة تحتاج إلى ميزانية أكبر؛ ويقول المعارضون إن المشكلة في الإدارة والهدر لا في نقص المال، وإن إنفاقًا أكبر يعني ضرائب أعلى أو دينًا."
      ru: "Вопрос в том, сколько государственных денег идёт на больницы, классы и пособия — и откуда они берутся. Сторонники указывают на данные ОЭСР о бедности и неравенстве в Израиле и говорят, что очереди в больницах и переполненные классы требуют большего бюджета; противники — что проблема в управлении и расточительстве, а не в нехватке денег, и что рост расходов означает более высокие налоги или больший долг."
      es: "La pregunta es cuánto dinero público va a hospitales, aulas y prestaciones — y de dónde sale. Los partidarios señalan las cifras de la OCDE sobre pobreza y desigualdad en Israel y dicen que las colas en los hospitales y las aulas abarrotadas necesitan más presupuesto; los opositores dicen que el problema es la gestión y el despilfarro, no la falta de dinero, y que gastar más significa impuestos más altos o deuda."
      fr: "La question est de savoir combien d’argent public va aux hôpitaux, aux classes et aux allocations — et d’où il vient. Les partisans citent les chiffres de l’OCDE sur la pauvreté et les inégalités en Israël et disent que les files d’attente à l’hôpital et les classes surchargées exigent plus de budget ; les opposants disent que le problème est la gestion et le gaspillage, pas le manque d’argent, et que dépenser plus signifie des impôts plus élevés ou de la dette."
    explainerSources:
      - { url: "https://www.oecd.org/content/dam/oecd/en/publications/reports/2025/04/oecd-economic-surveys-israel-2025_18e45b04/d6dd02bc-en.pdf", title: "OECD Economic Surveys: Israel 2025", publisher: "OECD" }
    stances:
      democrats:
        value: 2
        basis: platform
        source: { url: "https://democrats-media.s3.us-east-1.amazonaws.com/%D7%9B%D7%9C%D7%9B%D7%9C%D7%99+%D7%97%D7%91%D7%A8%D7%AA%D7%99.pdf", title: "התוכנית החברתית-כלכלית — מצע הדמוקרטים (PDF, מעמוד yes.democrats.org.il/topics/economy-society)", publisher: "הדמוקרטים" }
        quote:
          he: "\"נבטל את התקצוב המגזרי… ונגדיל משמעותית את ההוצאה האזרחית… נגדיל את ההשקעה בשירותים החברתיים לכלל אזרחי ישראל בחינוך, בריאות, רווחה, תחבורה ותשתיות.\""
          en: "\"We will abolish sectoral funding… and significantly increase civilian spending… we will increase investment in social services for all of Israel's citizens in education, health, welfare, transport and infrastructure.\""
          ar: "«سنلغي التمويل الفئوي… وسنزيد الإنفاق المدني زيادة كبيرة… سنزيد الاستثمار في الخدمات الاجتماعية لجميع مواطني إسرائيل في التعليم والصحة والرفاه والمواصلات والبنية التحتية.»"
          ru: "«Мы отменим секторальное финансирование… и значительно увеличим гражданские расходы… увеличим вложения в социальные услуги для всех граждан Израиля — в образование, здравоохранение, социальную сферу, транспорт и инфраструктуру»."
          es: "«Aboliremos la financiación sectorial… y aumentaremos de forma significativa el gasto civil… aumentaremos la inversión en servicios sociales para todos los ciudadanos de Israel en educación, salud, bienestar, transporte e infraestructuras.»"
          fr: "« Nous supprimerons les financements sectoriels… et augmenterons nettement les dépenses civiles… nous augmenterons l’investissement dans les services sociaux pour tous les citoyens d’Israël : éducation, santé, protection sociale, transports et infrastructures. »"
      joint-list:
        value: 2
        basis: statement
        source: { url: "https://zoha.org.il/146643/", title: "יוסף ג'בארין: הכי רחוקה מנתניהו – חד\"ש היא האלטרנטיבה למדיניות הימין (ראיון, 11.7.2026)", publisher: "זו הדרך (ביטאון חד\"ש)" }
        quote:
          he: "ג'בארין: \"בצל… ריכוז ההון בידי מיעוט קטן… והפער ההולך וגדל בין האלפיון העליון לשאר האזרחים… אנו פועלים לצמצום הפערים המעמדיים ולחיזוק שירותי הרווחה, החינוך והבריאות למען כלל האזרחים.\""
          en: "Jabareen: \"In the shadow of… the concentration of capital in a small minority… and the growing gap between the top thousandth and everyone else… we work to narrow class gaps and strengthen welfare, education and health services for all citizens.\""
          ar: "جبارين: «في ظل… تركّز رأس المال في يد أقلية صغيرة… والفجوة المتزايدة بين الواحد في الألف الأعلى وسائر المواطنين… نعمل على تقليص الفجوات الطبقية وتعزيز خدمات الرفاه والتعليم والصحة لجميع المواطنين.»"
          ru: "Джабарин: «В условиях… концентрации капитала в руках небольшого меньшинства… и растущего разрыва между верхней тысячной долей и всеми остальными… мы работаем над сокращением классового неравенства и укреплением социальных услуг, образования и здравоохранения для всех граждан»."
          es: "Jabareen: «Ante… la concentración del capital en manos de una pequeña minoría… y la brecha creciente entre la milésima más rica y el resto de los ciudadanos… trabajamos para reducir las brechas de clase y reforzar los servicios de bienestar, educación y salud para todos los ciudadanos.»"
          fr: "Jabareen : « Face à… la concentration du capital entre les mains d’une petite minorité… et au fossé grandissant entre le millième le plus riche et tous les autres… nous œuvrons à réduire les écarts de classe et à renforcer les services sociaux, d’éducation et de santé pour tous les citoyens. »"
      together:
        value: 1
        basis: platform
        source: { url: "https://be-yahad.org.il/plans/%d7%92%d7%99%d7%9c-%d7%a8%d7%9a/", title: "ביחד נדאג לגיל הרך — תוכנית ביחד לחינוך לגיל הרך", publisher: "ביחד" }
        quote:
          he: "\"כשהמדינה לא משקיעה בחינוך בגיל הרך, היא משלמת מאוחר יותר בריבית… נבנה תוכנית רב-שנתית ליצירת מערך חינוך לגיל הרך איכותי, מפוקח ומסובסד מלידה, הזמין לכל משפחה… נעלה את שכר המטפלות.\""
          en: "\"When the state does not invest in early-childhood education, it pays later with interest… we will build a multi-year plan for a quality, supervised, subsidized early-childhood system from birth, available to every family… we will raise caregivers' pay.\""
          ar: "«عندما لا تستثمر الدولة في التعليم في الطفولة المبكرة، تدفع لاحقًا مع الفائدة… سنبني خطة متعددة السنوات لمنظومة تعليم للطفولة المبكرة عالية الجودة وخاضعة للرقابة ومدعومة منذ الولادة، متاحة لكل عائلة… وسنرفع أجور المربّيات.»"
          ru: "«Когда государство не вкладывает в образование детей раннего возраста, оно потом платит с процентами… мы создадим многолетний план качественной, контролируемой и субсидируемой системы раннего воспитания с рождения, доступной каждой семье… и повысим зарплаты воспитательниц»."
          es: "«Cuando el Estado no invierte en la educación de la primera infancia, lo paga después con intereses… construiremos un plan plurianual para un sistema de primera infancia de calidad, supervisado y subvencionado desde el nacimiento, al alcance de todas las familias… subiremos el sueldo de las cuidadoras.»"
          fr: "« Quand l’État n’investit pas dans l’éducation de la petite enfance, il le paie plus tard avec intérêts… nous bâtirons un plan pluriannuel pour un système de petite enfance de qualité, encadré et subventionné dès la naissance, accessible à chaque famille… nous augmenterons le salaire des assistantes maternelles. »"
      yashar:
        value: 1
        basis: platform
        source: { url: "https://yasharwitheisenkot.com/wp-content/uploads/2026/06/Yashar_10_Steps_Brochure.pdf", title: "10 הצעדים לשגשוגה של מדינת ישראל — מצע ישר!", publisher: "ישר!" }
        quote:
          he: "\"במסגרת תכנית לאומית למלחמה ביוקר המחיה: נפרק מוקדי ריכוזיות, נחזק תחרות… לצד זאת, נקדם השקעה אדירה בתשתיות, תחבורה, חינוך ובריאות בפריפריה\" (צעד 6)."
          en: "\"As part of a national plan against the cost of living: we will break up concentration, strengthen competition… alongside this, we will advance a huge investment in infrastructure, transport, education and health in the periphery\" (step 6)."
          ar: "«ضمن خطة وطنية لمكافحة غلاء المعيشة: سنفكّك مراكز التركّز الاقتصادي ونعزّز المنافسة… وإلى جانب ذلك، سندفع باستثمار ضخم في البنية التحتية والمواصلات والتعليم والصحة في الأطراف» (الخطوة 6)."
          ru: "«В рамках национального плана борьбы с дороговизной: мы покончим с концентрацией рынка, усилим конкуренцию… и наряду с этим продвинем огромные вложения в инфраструктуру, транспорт, образование и здравоохранение на периферии» (шаг 6)."
          es: "«En el marco de un plan nacional contra el costo de vida: desmontaremos la concentración y reforzaremos la competencia… y junto a ello impulsaremos una enorme inversión en infraestructuras, transporte, educación y salud en la periferia» (punto 6)."
          fr: "« Dans le cadre d’un plan national contre la vie chère : nous démantèlerons les concentrations, renforcerons la concurrence… et, parallèlement, nous engagerons un investissement massif dans les infrastructures, les transports, l’éducation et la santé en périphérie » (point 6)."
      blue-white:
        value: 1
        basis: statement
        source: { url: "https://www.israelhayom.co.il/news/geopolitics/article/21215389", title: "גנץ: \"צריך להקפיד על מחירים בפיקוח. ייבוא פתוח מייקר מחירים\" (17.8.2026)", publisher: "ישראל היום" }
        quote:
          he: "גנץ, על מה שחשוב לצעירים: \"ואני רוצה לעזור בזה – בדיור, במעונות לגיל הרך חינם, במיסוי יותר נמוך לצעירים שישלמו טיפה יותר אח\"כ.\""
          en: "Gantz, on what matters to young people: \"And I want to help with that – in housing, in free early-childhood daycare, in lower taxation for young people who will pay a little more later.\""
          ar: "غانتس، عمّا يهمّ الشباب: «وأريد أن أساعد في ذلك — في السكن، وفي حضانات مجانية للطفولة المبكرة، وفي ضرائب أقل للشباب الذين سيدفعون أكثر قليلًا لاحقًا.»"
          ru: "Ганц о том, что важно молодым: «И я хочу в этом помочь — жильём, бесплатными яслями, более низкими налогами для молодых, которые потом заплатят чуть больше»."
          es: "Gantz, sobre lo que importa a los jóvenes: «Y quiero ayudar en eso: en vivienda, en guarderías gratuitas para la primera infancia, en impuestos más bajos para los jóvenes, que pagarán un poco más después.»"
          fr: "Gantz, sur ce qui compte pour les jeunes : « Et je veux aider en cela — pour le logement, avec des crèches gratuites, avec une fiscalité plus légère pour les jeunes, qui paieront un peu plus plus tard. »"
      shas:
        value: 1
        basis: statement
        source: { url: "https://www.mako.co.il/news-money/2026_q2/Article-f814f4d77fabd91026.htm", title: "\"חשש להטיה לטובת החרדים\": משרד הרווחה מודה – 267 מיליון שקל למזון לנזקקים לא נוצלו (26.4.2026)", publisher: "N12" }
        quote:
          he: "ש\"ס: \"ש\"ס נאבקה בתקציב 2026 והקצתה לכך 277 מיליון שקל… נמשיך להיאבק עד שיעשה הצדק ויחולקו תלושי המזון למשפחות הנזקקות.\""
          en: "Shas: \"Shas fought in the 2026 budget and allocated 277 million shekels to this… we will keep fighting until justice is done and the food vouchers are distributed to needy families.\""
          ar: "شاس: «ناضلت شاس في ميزانية 2026 وخصّصت لذلك 277 مليون شيكل… وسنواصل النضال حتى يتحقق العدل وتُوزَّع قسائم الغذاء على العائلات المحتاجة.»"
          ru: "ШАС: «ШАС боролась в бюджете 2026 года и выделила на это 277 миллионов шекелей… мы продолжим бороться, пока не восторжествует справедливость и продуктовые карточки не будут розданы нуждающимся семьям»."
          es: "Shas: «Shas luchó en el presupuesto de 2026 y asignó a ello 277 millones de shékels… seguiremos luchando hasta que se haga justicia y los vales de alimentos se repartan a las familias necesitadas.»"
          fr: "Shas : « Shas s’est battu dans le budget 2026 et y a consacré 277 millions de shekels… nous continuerons à nous battre jusqu’à ce que justice soit faite et que les bons alimentaires soient distribués aux familles dans le besoin. »"
      yisrael-beiteinu:
        value: 0
        basis: platform
        source: { url: "https://beytenu.org.il/party-platform/", title: "המצע שלנו — ישראל ביתנו (כלכלה, רווחה, בריאות)", publisher: "ישראל ביתנו" }
        quote:
          he: "\"אנו שואפים לחזק באופן משמעותי את מערכת הבריאות הציבורית… הגדלת קצבאות הזקנה הבסיסיות… עד ל-25% מהשכר הממוצע\" — לצד \"צמצום משרדי הממשלה והמגזר הציבורי… ביטול קצבאות הילדים החל מהילד החמישי.\""
          en: "\"We aim to significantly strengthen the public health system… raising basic old-age pensions… to 25% of the average wage\" — alongside \"fewer government ministries and a smaller public sector… abolishing child allowances from the fifth child.\""
          ar: "«نسعى إلى تعزيز جهاز الصحة العامة بشكل كبير… ورفع مخصصات الشيخوخة الأساسية… إلى 25% من الأجر المتوسط» — إلى جانب «تقليص الوزارات الحكومية والقطاع العام… وإلغاء مخصصات الأطفال ابتداءً من الطفل الخامس»."
          ru: "«Мы стремимся значительно укрепить государственное здравоохранение… поднять базовые пенсии по старости… до 25% от средней зарплаты» — наряду с «меньшим числом министерств и меньшим госсектором… отменой детских пособий начиная с пятого ребёнка»."
          es: "«Aspiramos a reforzar de forma significativa el sistema público de salud… elevar las pensiones básicas de vejez… hasta el 25 % del salario medio», junto a «menos ministerios y un sector público más pequeño… la supresión de las asignaciones por hijo a partir del quinto»."
          fr: "« Nous voulons renforcer nettement le système de santé public… relever les pensions de vieillesse de base… à 25 % du salaire moyen » — parallèlement à « moins de ministères et un secteur public réduit… la suppression des allocations familiales à partir du cinquième enfant »."
      rz-zehut:
        value: 0
        basis: platform
        source: { url: "https://zionutdatit.org.il/wp-content/uploads/2021/12/%D7%9B%D7%9C%D7%9B%D7%9C%D7%94.pdf", title: "מצע הציונות הדתית — פרק כלכלה (PDF מדצמבר 2021, מעמוד \"מצע המפלגה\" באתר)", publisher: "הציונות הדתית" }
        quote:
          he: "\"נקדם הפחתת מיסים אוניברסלית רחבה… נגבש תוכניות התייעלות במגזר הציבורי שתכלול הפחתת תקנים מיותרים\" — לצד \"מפלגת הציונות הדתית תפעל לחיזוק והגברת האמון במערכת הבריאות הציבורית.\""
          en: "\"We will advance a broad universal tax reduction… draw up efficiency plans for the public sector, including cutting unnecessary posts\" — alongside \"the party will work to strengthen and boost confidence in the public health system.\""
          ar: "«سندفع باتجاه تخفيض ضريبي شامل وواسع… ونضع خطط نجاعة في القطاع العام تشمل تقليص الوظائف غير الضرورية» — إلى جانب «سيعمل الحزب على تعزيز جهاز الصحة العامة وزيادة الثقة به»."
          ru: "«Мы продвинем широкое всеобщее снижение налогов… разработаем планы повышения эффективности госсектора, включая сокращение ненужных ставок» — наряду с «партия будет работать над укреплением государственного здравоохранения и доверия к нему»."
          es: "«Impulsaremos una amplia reducción universal de impuestos… elaboraremos planes de eficiencia para el sector público, incluida la supresión de plazas innecesarias», junto a «el partido trabajará para reforzar el sistema público de salud y la confianza en él»."
          fr: "« Nous ferons avancer une large baisse d’impôts universelle… élaborerons des plans d’efficacité pour le secteur public, y compris la suppression de postes inutiles » — parallèlement à « le parti œuvrera à renforcer le système de santé public et la confiance en lui »."
      reservists:
        value: 0
        basis: platform
        source: { url: "https://www.hakalkalit.org/%D7%91%D7%A8%D7%99%D7%90%D7%95%D7%AA", title: "מדיניות הבריאות — מצע המפלגה הכלכלית (השותפה ברשימת המילואימניקים והכלכלית)", publisher: "המפלגה הכלכלית" }
        quote:
          he: "\"המחסור בתקציב הביא להרעבה שיטתית ומתמשכת של מערכת הבריאות… ישראל נותרה הרחק מאחור עם שיעור של 7.3% בלבד\" (עמוד הבריאות) — לצד \"התייעלות מאסיבית… בתקציב המדינה\" (עמוד המס): עמדה מעורבת."
          en: "\"The budget shortfall has led to a systematic, ongoing starvation of the health system… Israel remains far behind at only 7.3%\" (health page) — alongside \"massive efficiency… in the state budget\" (tax page): a mixed position."
          ar: "«أدّى نقص الميزانية إلى تجويع منهجي ومتواصل لجهاز الصحة… وبقيت إسرائيل متأخرة كثيرًا بنسبة 7.3% فقط» (صفحة الصحة) — إلى جانب «نجاعة واسعة… في ميزانية الدولة» (صفحة الضرائب): موقف مختلط."
          ru: "«Нехватка бюджета привела к систематическому и длительному обескровливанию системы здравоохранения… Израиль остался далеко позади — всего 7,3%» (страница о здравоохранении) — наряду с «масштабной экономией… в госбюджете» (страница о налогах): неоднозначная позиция."
          es: "«La falta de presupuesto ha llevado a una asfixia sistemática y continuada del sistema de salud… Israel sigue muy rezagado, con solo un 7,3 %» (página de salud), junto a «una eficiencia masiva… en el presupuesto del Estado» (página de impuestos): una postura mixta."
          fr: "« Le manque de budget a conduit à une asphyxie systématique et continue du système de santé… Israël reste loin derrière, avec seulement 7,3 % » (page santé) — parallèlement à « une efficacité massive… dans le budget de l’État » (page fiscalité) : une position mitigée."

  - id: econ-market
    topic: economy
    lean: right
    text:
      he: "יש לצמצם את מעורבות הממשלה בכלכלה: פחות רגולציה ומסים, יותר הפרטה."
      en: "The government's role in the economy should shrink: less regulation and tax, more privatization."
      ar: "يجب تقليص دور الحكومة في الاقتصاد: تنظيم وضرائب أقل، وخصخصة أكثر."
      ru: "Роль государства в экономике следует уменьшить: меньше регулирования и налогов, больше приватизации."
      es: "El papel del Gobierno en la economía debería reducirse: menos regulación e impuestos, más privatización."
      fr: "Le rôle de l’État dans l’économie devrait diminuer : moins de réglementation et d’impôts, plus de privatisations."
    short:
      he: "פחות ממשלה בכלכלה"
      en: "Less government in the economy"
      ar: "دور أقل للحكومة في الاقتصاد"
      ru: "Меньше государства в экономике"
      es: "Menos Gobierno en la economía"
      fr: "Moins d’État dans l’économie"
    explainer:
      he: "זו שאלת היסוד של ימין ושמאל כלכלי. התומכים אומרים שמסים ורגולציה חונקים יוזמה ושהממשלה מנהלת גרוע; המתנגדים אומרים שהשוק לבדו משאיר חלשים מאחור, ושבריאות, חינוך ותשתיות צריכים להישאר בידי הציבור. ישראל היום היא כלכלת שוק; לפי ה-OECD, הכנסות המדינה ממסים נמוכות מהממוצע במדינות הארגון, וגם ההוצאה הממשלתית על תחומים אזרחיים כמו בריאות ורווחה נמוכה יחסית."
      en: "This is the basic question of economic right and left. Supporters say taxes and regulation stifle enterprise and government manages badly; opponents say the market alone leaves the weak behind, and health, education and infrastructure should stay in public hands. Israel today is a market economy; according to the OECD, its tax revenue is below the OECD average, and its government spends comparatively little on civilian areas such as health and welfare."
      ar: "هذا هو السؤال الأساسي لليمين واليسار الاقتصاديين. يقول المؤيدون إن الضرائب والتنظيم يخنقان المبادرة وإن الحكومة تدير بشكل سيئ؛ ويقول المعارضون إن السوق وحده يترك الضعفاء خلفه، وإن الصحة والتعليم والبنية التحتية يجب أن تبقى بأيدٍ عامة. إسرائيل اليوم اقتصاد سوق؛ ووفق منظمة التعاون الاقتصادي والتنمية، فإن إيراداتها الضريبية أدنى من متوسط دول المنظمة، وإنفاق حكومتها على المجالات المدنية كالصحة والرعاية الاجتماعية منخفض نسبيًا."
      ru: "Это базовый вопрос экономических правых и левых. Сторонники говорят, что налоги и регулирование душат предпринимательство, а государство управляет плохо; противники — что рынок сам по себе оставляет слабых позади, а здравоохранение, образование и инфраструктура должны остаться в общественных руках. Израиль сегодня — рыночная экономика; по данным ОЭСР, его налоговые поступления ниже среднего по странам ОЭСР, а государственные расходы на гражданские сферы, такие как здравоохранение и социальная защита, сравнительно невелики."
      es: "Es la pregunta básica de la derecha y la izquierda económicas. Los partidarios dicen que los impuestos y la regulación ahogan la iniciativa y que el Gobierno gestiona mal; los opositores dicen que el mercado por sí solo deja atrás a los débiles, y que la salud, la educación y las infraestructuras deben seguir en manos públicas. Israel es hoy una economía de mercado; según la OCDE, su recaudación tributaria está por debajo de la media de la OCDE, y el gasto del Gobierno en áreas civiles como la salud y la protección social es comparativamente bajo."
      fr: "C’est la question de base de la droite et de la gauche économiques. Les partisans disent que les impôts et la réglementation étouffent l’initiative et que l’État gère mal ; les opposants disent que le marché seul laisse les faibles de côté, et que la santé, l’éducation et les infrastructures doivent rester publiques. Israël est aujourd’hui une économie de marché ; selon l’OCDE, ses recettes fiscales sont inférieures à la moyenne de l’OCDE, et les dépenses publiques consacrées aux domaines civils comme la santé et la protection sociale sont relativement faibles."
    explainerSources:
      - { url: "https://www.oecd.org/content/dam/oecd/en/publications/reports/2025/04/oecd-economic-surveys-israel-2025_18e45b04/d6dd02bc-en.pdf", title: "OECD Economic Surveys: Israel 2025", publisher: "OECD" }
    stances:
      yisrael-beiteinu:
        value: 2
        basis: platform
        source: { url: "https://beytenu.org.il/party-platform/", title: "המצע שלנו — ישראל ביתנו (קווי יסוד: כלכלה ויוקר המחיה)", publisher: "ישראל ביתנו" }
        quote:
          he: "\"קידום עסקת חבילה למשק, הכוללת הפחתת רגולציה, צמצום משרדי הממשלה והמגזר הציבורי, פירוק מונופולים והגברת התחרות… המשך מדיניות ההפרטות, לרבות הפרטת נמל אשדוד ושדה התעופה בחיפה.\""
          en: "\"A package deal for the economy: less regulation, fewer government ministries and a smaller public sector, breaking up monopolies and more competition… continuing the privatization policy, including Ashdod Port and Haifa Airport.\""
          ar: "«دفع صفقة شاملة للاقتصاد تشمل تنظيمًا أقل، وتقليص الوزارات الحكومية والقطاع العام، وتفكيك الاحتكارات وزيادة المنافسة… ومواصلة سياسة الخصخصة، بما في ذلك ميناء أسدود ومطار حيفا.»"
          ru: "«Пакетная сделка для экономики: меньше регулирования, меньше министерств и меньший госсектор, разрушение монополий и больше конкуренции… продолжение политики приватизации, включая Ашдодский порт и аэропорт Хайфы»."
          es: "«Un acuerdo global para la economía: menos regulación, menos ministerios y un sector público más pequeño, desmantelar monopolios y más competencia… continuar la política de privatizaciones, incluidos el puerto de Asdod y el aeropuerto de Haifa.»"
          fr: "« Un accord global pour l’économie : moins de réglementation, moins de ministères et un secteur public réduit, démantèlement des monopoles et plus de concurrence… poursuite de la politique de privatisation, y compris le port d’Ashdod et l’aéroport de Haïfa. »"
      rz-zehut:
        value: 2
        basis: platform
        source: { url: "https://zionutdatit.org.il/wp-content/uploads/2021/12/%D7%9B%D7%9C%D7%9B%D7%9C%D7%94.pdf", title: "מצע הציונות הדתית — פרק כלכלה (PDF מדצמבר 2021, מעמוד \"מצע המפלגה\" באתר)", publisher: "הציונות הדתית" }
        quote:
          he: "\"נפעל לצמצום פטורים והטבות מס שונות, וכנגדם נקדם הפחתת מיסים אוניברסלית רחבה… נגבש תוכניות התייעלות במגזר הציבורי… נצמצם את הרגולציה המיותרת בכל משרדי הממשלה.\""
          en: "\"We will cut the various tax exemptions and benefits and, in their place, advance a broad universal tax reduction… draw up efficiency plans for the public sector… and cut unnecessary regulation in every government ministry.\""
          ar: "«سنعمل على تقليص الإعفاءات والامتيازات الضريبية المختلفة، وفي مقابلها سندفع تخفيضًا ضريبيًا شاملًا وواسعًا… وسنضع خطط نجاعة في القطاع العام… وسنقلّص التنظيم غير الضروري في جميع الوزارات.»"
          ru: "«Мы сократим различные налоговые льготы и освобождения и взамен продвинем широкое всеобщее снижение налогов… разработаем планы повышения эффективности госсектора… и сократим ненужное регулирование во всех министерствах»."
          es: "«Recortaremos las distintas exenciones y beneficios fiscales y, a cambio, impulsaremos una amplia reducción universal de impuestos… elaboraremos planes de eficiencia para el sector público… y reduciremos la regulación innecesaria en todos los ministerios.»"
          fr: "« Nous réduirons les diverses exonérations et avantages fiscaux et, en contrepartie, ferons avancer une large baisse d’impôts universelle… élaborerons des plans d’efficacité pour le secteur public… et réduirons la réglementation inutile dans tous les ministères. »"
      reservists:
        value: 2
        basis: platform
        source: { url: "https://www.themiluimnikim.org.il/platform/", title: "עקרונות — המילואימניקים (עיקרי המצע, פרק כלכלה)", publisher: "המילואימניקים" }
        quote:
          he: "\"התעצמות מדינת ישראל מבוססת על כלכלה חופשית… עידוד תחרות ושוק חופשי הם הבסיס לכך… פתיחת חסמים… כדי להקל על עשיית עסקים בישראל… מאבק במונופולים.\""
          en: "\"Israel's strength rests on a free economy… encouraging competition and a free market is the basis… removing barriers… to make doing business in Israel easier… fighting monopolies.\""
          ar: "«تقوم قوة دولة إسرائيل على اقتصاد حر… وتشجيع المنافسة والسوق الحرة هو الأساس لذلك… إزالة العوائق… لتسهيل ممارسة الأعمال في إسرائيل… ومكافحة الاحتكارات.»"
          ru: "«Сила Израиля основана на свободной экономике… поощрение конкуренции и свободного рынка — основа этого… устранение барьеров… чтобы облегчить ведение бизнеса в Израиле… борьба с монополиями»."
          es: "«La fortaleza de Israel se basa en una economía libre… fomentar la competencia y el libre mercado es la base… eliminar barreras… para facilitar hacer negocios en Israel… luchar contra los monopolios.»"
          fr: "« La force d’Israël repose sur une économie libre… encourager la concurrence et le libre marché en est la base… lever les obstacles… pour faciliter les affaires en Israël… lutter contre les monopoles. »"
