  - id: 1106 # Otzma Yehudit
    verified: "2026-09-19"
    updates:
      - date: "2025-01-19"
        text:
          he: "עוצמה יהודית הודיעה על פרישה מהממשלה ומהקואליציה במחאה על הסכם הפסקת האש ושחרור החטופים; השרים איתמר בן גביר, עמיחי אליהו ויצחק וסרלאוף הגישו מכתבי התפטרות שנכנסו לתוקף ב-21 בינואר 2025. אליהו שב לכנסת ב-21 בינואר; ב-27 בינואר החליף צביקה פוגל את וסרלאוף כיו\"ר הסיעה."
          en: "Otzma Yehudit announced it was leaving the government and the coalition in protest at the ceasefire–hostage deal; ministers Itamar Ben Gvir, Amichai Eliyahu and Yitzhak Wasserlauf submitted resignations that took effect on 21 January 2025. Eliyahu returned to the Knesset on 21 January; on 27 January Zvika Fogel replaced Wasserlauf as faction chair."
        sources:
          - { url: "https://www.timesofisrael.com/with-otzma-yehudit-out-of-government-netanyahu-set-to-appoint-replacement-ministers/", title: "With Otzma Yehudit out of government, Netanyahu set to appoint replacement ministers (2025-01-19)", publisher: "The Times of Israel" }
          - { url: "https://www.haaretz.co.il/news/politics/2025-01-19/ty-article/00000194-7d9c-d61f-a1b5-fdbd99970000", title: "עוצמה יהודית הודיעה על פרישתה מהקואליציה, בן גביר ושרי המפלגה הגישו מכתבי התפטרות (2025-01-19)", publisher: "הארץ" }
          - { url: "https://knesset.gov.il/OdataV4/ParliamentInfo/KNS_PersonToPosition?$filter=FactionID%20eq%201106%20and%20KnessetNum%20eq%2025", title: "KNS_PersonToPosition — FactionID 1106, Knesset 25 (Eliyahu member from 2025-01-21; PositionID 48: Wasserlauf to 2025-01-27, Fogel from 2025-01-27) (2026-09-19)", publisher: "Knesset OData" }
      - date: "2025-01-21"
        text:
          he: "ח\"כ אלמוג כהן היה היחיד בסיעה שלא הגיש מכתב התפטרות; הוא אמר שאין בכוונתו לעזוב את עוצמה יהודית ולא השיב אם הוא רואה עצמו חלק מהקואליציה."
          en: "MK Almog Cohen was the only faction member not to hand in a resignation letter; he said he had no plans to leave Otzma Yehudit and deflected the question of whether he still considered himself part of the coalition."
        sources:
          - { url: "https://www.timesofisrael.com/his-far-right-party-now-in-the-opposition-rebel-mk-almog-cohen-is-in-political-limbo/", title: "His far-right party now in the opposition, rebel MK Almog Cohen is in political limbo (2025-01-21)", publisher: "The Times of Israel" }
      - date: "2025-03-19"
        text:
          he: "עוצמה יהודית שבה לממשלה עם חידוש הלחימה בעזה: הממשלה אישרה את מינוי בן גביר מחדש לשר לביטחון לאומי, והכנסת אישרה ברוב של 65 מול 46 את חזרת המפלגה ואת מינוי בן גביר, אליהו ווסרלאוף (כהונותיהם נרשמו מ-19 במרץ 2025)."
          en: "Otzma Yehudit returned to the government as fighting in Gaza resumed: the cabinet approved Ben Gvir’s reappointment as national security minister and the Knesset ratified the party’s return and the reappointment of Ben Gvir, Eliyahu and Wasserlauf by 65 to 46 (their terms are recorded from 19 March 2025)."
        sources:
          - { url: "https://www.timesofisrael.com/ben-gvir-reappointed-police-minister-as-knesset-okays-his-partys-return-to-government/", title: "Ben Gvir reappointed police minister as Knesset okays his party's return to government (2025-03-20)", publisher: "The Times of Israel" }
          - { url: "https://www.timesofisrael.com/cabinet-reappoints-ben-gvir-as-police-minister-ignoring-attorney-generals-objections/", title: "Cabinet unanimously reappoints Ben Gvir as police minister, ignoring AG's objections (2025-03-19)", publisher: "The Times of Israel" }
          - { url: "https://knesset.gov.il/OdataV4/ParliamentInfo/KNS_PersonToPosition?$filter=KnessetNum%20eq%2025%20and%20GovMinistryID%20ne%20null%20and%20IsCurrent%20eq%20true", title: "KNS_PersonToPosition — current government positions (Ben Gvir, National Security; Wasserlauf, Negev & Galilee; Eliyahu, Heritage — all from 2025-03-19) (2026-09-19)", publisher: "Knesset OData" }
      - date: "2025-04-06"
        text:
          he: "אלמוג כהן מונה לסגן שר במשרד ראש הממשלה (2 באפריל 2025) והתפטר מהכנסת לפי החוק הנורבגי; במקומו נכנס צבי סוכות (הציונות הדתית), הבא בתור ברשימה המשותפת של 2022, והסיעה ירדה ל-6 חברים. באוגוסט 2026 התמודד כהן בפריימריז של הליכוד והוא במקום ה-13 ברשימת הליכוד."
          en: "Almog Cohen was appointed deputy minister in the Prime Minister’s Office (2 April 2025) and resigned from the Knesset under the Norwegian law; Zvi Sukkot (Religious Zionism), next on the 2022 joint list, took the seat and the faction fell to 6 members. In August 2026 Cohen ran in the Likud primary and is 13th on the Likud list."
        sources:
          - { url: "https://www.timesofisrael.com/former-otzma-yehudit-mk-to-run-in-likud-primary-after-netanyahu-opens-door/", title: "Former Otzma Yehudit MK to run in Likud primary after Netanyahu opens door (2026-08-12)", publisher: "The Times of Israel" }
          - { url: "https://knesset.gov.il/OdataV4/ParliamentInfo/KNS_PersonToPosition?$filter=FactionID%20eq%201106%20and%20KnessetNum%20eq%2025", title: "KNS_PersonToPosition — FactionID 1106 (Cohen member to 2025-04-06); FactionID 1105 (Sukkot from 2025-04-06); current government positions (Cohen, deputy minister, PMO, from 2025-04-02) (2026-09-19)", publisher: "Knesset OData" }
          - { url: "https://www.gov.il/he/pages/halikud-tikvahadasha_iist29", title: "רשימת המועמדים — הליכוד (רשימה 29): 13 אלמוג כהן (2026-09-09)", publisher: "ועדת הבחירות המרכזית / gov.il" }
      - date: "2026-08-28"
        text:
          he: "בן גביר שלל ריצה משותפת עם הציונות הדתית (27 ביולי: 'אחד ועוד אחד לא תמיד שווה שניים') ודחה את דרישת נתניהו להתאחד עם סמוטריץ': 'ההחלטה סופית ומוחלטת'; הליכוד האשים אותו ב'שריפת' קולות ימין."
          en: "Ben Gvir ruled out a joint run with Religious Zionism (27 July: ‘one plus one does not always equal two’) and rejected Netanyahu’s demand to merge with Smotrich, calling the decision ‘final and complete’; Likud accused him of ‘burning’ right-wing votes."
        sources:
          - { url: "https://www.jpost.com/israel-news/politics-and-diplomacy/article-903791", title: "Ben-Gvir rules out running with Smotrich for elections, says parties are 'fundamentally different' (2026-07-27)", publisher: "The Jerusalem Post" }
          - { url: "https://www.timesofisrael.com/ben-gvir-rejects-pms-demand-to-merge-with-smotrich-drawing-scathing-response-from-likud/", title: "Ben Gvir refuses Netanyahu's demand to merge with Smotrich; Likud: He's crowning Eisenkot (2026-08-28)", publisher: "The Times of Israel" }
      - date: "2026-09-03"
        text:
          he: "הליכוד הודיע על הסכמה שח\"כ טלי גוטליב (הליכוד) תתמודד ברשימת עוצמה יהודית — במקום השני — בלי שתוכרז כפורשת; היא כפופה למשמעת הליכוד בהצבעות עד כינוס הכנסת ה-26. גוטליב סיימה במקום ה-12 בפריימריז של הליכוד ונדחקה למקום ה-20 ברשימה."
          en: "Likud announced an agreement under which MK Tally Gotliv (Likud) runs on the Otzma Yehudit list — in second place — without being declared a departing lawmaker; she remains bound by Likud voting discipline until the 26th Knesset convenes. Gotliv had placed 12th in Likud’s primary and was pushed to 20th on its slate."
        sources:
          - { url: "https://www.ynet.co.il/news/article/h1uerzwozl", title: "המעבר אושר: טלי גוטליב תתמודד ברשימת עוצמה יהודית לכנסת (2026-09-03)", publisher: "Ynet" }
          - { url: "https://www.timesofisrael.com/likud-arranges-to-have-firebrand-mk-tally-gotliv-run-with-ben-gvirs-otzma-yehudit/", title: "Likud arranges to have firebrand MK Tally Gotliv run with Ben Gvir's Otzma Yehudit (2026-09-04)", publisher: "The Times of Israel" }
      - date: "2026-09-07"
        text:
          he: "רשימת עוצמה יהודית הוגשה (רשימה 14) בידי 'חזית יהודית לאומית' ו'ארץ ישראל שלנו': 1 איתמר בן גביר, 2 טלי גוטליב, 3 יצחק וסרלאוף, 4 עמיחי אליהו, 5 לימור סון הר-מלך, 6 יצחק קרויזר, 7 חנמאל דורפמן, 8 צחי אליהו. האות המבוקשת: ב — אות שביקשה גם רשימה 1 ('ביחד בראשות נפתלי בנט', ב/רק); לעוצמה יהודית זכות קדימה על האות ט מהכנסת ה-25. האותיות ייקבעו באישור הרשימות ב-27 בספטמבר 2026."
          en: "The Otzma Yehudit list was submitted (list 14) by ‘Jewish National Front’ and ‘Eretz Yisrael Shelanu’: 1 Itamar Ben Gvir, 2 Tally Gotliv, 3 Yitzhak Wasserlauf, 4 Amichai Eliyahu, 5 Limor Son Har-Melech, 6 Yitzhak Kroizer, 7 Hanamel Dorfman, 8 Tzachi Eliyahu. Requested letter: ב — also requested by list 1 (‘Together headed by Naftali Bennett’, ב/רק); Otzma Yehudit holds a priority right to ט from the 25th Knesset. Letters are set when the lists are approved on 27 September 2026."
        sources:
          - { url: "https://www.gov.il/he/pages/yehudit-meuhedet_list14", title: "רשימת המועמדים — עוצמה יהודית (רשימה 14) (2026-09-09)", publisher: "ועדת הבחירות המרכזית / gov.il" }
          - { url: "https://www.gov.il/he/pages/candidates-lists-26", title: "רשימות המועמדים לכנסת ה-26 — טבלת האותיות התפוסות/הפנויות (2026-09-18)", publisher: "ועדת הבחירות המרכזית / gov.il" }
          - { url: "https://www.timesofisrael.com/no-last-minute-mergers-as-parties-submit-final-knesset-slates-for-election/", title: "No last-minute mergers as most parties submit final Knesset slates for election (2026-09-07)", publisher: "The Times of Israel" }
      - date: "2026-09-14"
        text:
          he: "הדמוקרטים הגישו לוועדת הבחירות המרכזית בקשה לפסול את עוצמה יהודית מהתמודדות, בטענה לפגיעה באופייה הדמוקרטי של המדינה; הבקשה מתייחסת גם להתנהלות בן גביר כשר וגם לגוטליב. הוועדה טרם הכריעה."
          en: "The Democrats asked the Central Elections Committee to bar Otzma Yehudit from running, alleging it undermines the state’s democratic character; the request also cites Ben Gvir’s conduct as minister and Gotliv. The committee has not yet ruled."
        sources:
          - { url: "https://www.timesofisrael.com/democrats-seek-to-bar-otzma-yehudit-from-election-as-polls-show-continued-deadlock/", title: "Democrats seek to bar Otzma Yehudit from election as polls show continued deadlock (2026-09-15)", publisher: "The Times of Israel" }
    election2026:
      runsAs: own
      slug: otzma
      note:
        he: "הרשימה הוגשה על ידי \"חזית יהודית לאומית\" ו\"ארץ ישראל שלנו\"; טלי גוטליב, לשעבר ח\"כית הליכוד, במקום השני. האות המבוקשת ב התבקשה גם על ידי \"ביחד\" — ההכרעה בידי ועדת הבחירות."
        en: "The list was submitted by “Jewish National Front” and “Our Land of Israel”; Tali Gottlieb, formerly a Likud MK, is second. The requested letter ב was also requested by “Together” — the CEC decides."
      sources:
        - { url: "https://www.gov.il/he/pages/yehudit-meuhedet_list14", title: "עוצמה יהודית — רשימת המועמדים", publisher: "ועדת הבחירות המרכזית לכנסת" }
        - { url: "https://www.gov.il/he/pages/candidates-lists-26", title: "רשימות המועמדים לכנסת ה-26 — אותיות מבוקשות", publisher: "ועדת הבחירות המרכזית לכנסת" }
    spectrum: far-right
