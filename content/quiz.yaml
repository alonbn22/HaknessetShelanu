          fr: "« Dans le cadre du maintien du statu quo, l’État d’Israël ne doit reconnaître que le mariage et le divorce selon la loi religieuse juive » (la question portait sur la reconnaissance du mariage civil et des couples LGBT)."
      raam:
        value: -2
        basis: statement
        source: { url: "https://www.inn.co.il/news/569074", title: "מנסור עבאס מתגאה בבלימת חקיקה לטובת הלהט\"ב — ריאיון לרדיו א-נאס (21.6.2022)", publisher: "ערוץ 7" }
        quote:
          he: "עבאס: \"עמדתנו בנוגע ללהט\"ב הוא עמדה דתית (נגד להט\"ב), לא פוליטית, והיא עדיין איתנה\"; \"גישה זו (הלהט\"ב) פסולה על ידינו לחלוטין\" (ריאיון בערבית, בתרגום ערוץ 7, שבו מופיעות המילים שבסוגריים)"
          en: "Abbas: \"Our position regarding LGBT is a religious position (against LGBT), not a political one, and it is still firm\"; \"this approach (LGBT) is utterly rejected by us\" (an interview in Arabic, in Arutz 7's Hebrew translation, which includes the words in brackets)"
          ar: "عباس: «موقفنا من مجتمع الميم موقف ديني (ضد مجتمع الميم)، وليس سياسيًا، ولا يزال ثابتًا»؛ «هذا النهج (مجتمع الميم) مرفوض عندنا تمامًا» (مقابلة بالعربية مع إذاعة الناس، مترجمة هنا عن ترجمة القناة السابعة العبرية التي ترد فيها الكلمات بين القوسين)"
          ru: "Аббас: «Наша позиция по ЛГБТ — религиозная (против ЛГБТ), а не политическая, и она по-прежнему твёрда»; «этот подход (ЛГБТ) полностью нами отвергается» (интервью на арабском в переводе 7-го канала на иврит, где и приведены слова в скобках)"
          es: "Abbas: «Nuestra posición respecto al colectivo LGBT es religiosa (en contra del colectivo LGBT), no política, y sigue siendo firme»; «ese enfoque (LGBT) lo rechazamos por completo» (entrevista en árabe, en la traducción al hebreo de Arutz 7, que incluye las palabras entre paréntesis)"
          fr: "Abbas : « Notre position sur les LGBT est une position religieuse (contre les LGBT), pas politique, et elle reste ferme » ; « cette approche (LGBT) est totalement rejetée par nous » (entretien en arabe, dans la traduction en hébreu d’Arutz 7, qui comporte les mots entre parenthèses)"
  - id: judicial-reform
    topic: institutions
    lean: right
    text:
      he: "יש להגביל בחקיקה את סמכויות בית המשפט העליון."
      en: "The Supreme Court's powers should be limited by legislation."
      ar: "يجب الحدّ من صلاحيات المحكمة العليا عبر التشريع."
      ru: "Полномочия Верховного суда следует ограничить законодательно."
      es: "Los poderes del Tribunal Supremo deberían limitarse por ley."
      fr: "Les pouvoirs de la Cour suprême devraient être limités par la loi."
    short:
      he: "סמכויות בית המשפט העליון"
      en: "Supreme Court powers"
      ar: "صلاحيات المحكمة العليا"
      ru: "Полномочия Верховного суда"
      es: "Poderes del Tribunal Supremo"
      fr: "Pouvoirs de la Cour suprême"
    explainer:
      he: "בית המשפט העליון יכול לפסול חוקים והחלטות ממשלה. תומכי ההגבלה אומרים שהכנסת הנבחרת צריכה להיות בעלת המילה האחרונה ושבית המשפט מתערב יותר מדי; המתנגדים אומרים שבלי בית משפט חזק אין מי שיגן על זכויות הפרט והמיעוט מפני הרוב. ב-2023 נחקק תיקון שאסר על בתי המשפט להפעיל את עילת הסבירות על החלטות הממשלה והשרים, ובית המשפט ביטל אותו."
      en: "The Supreme Court can strike down laws and government decisions. Supporters of limiting it say the elected Knesset should have the last word and that the court intervenes too much; opponents say that without a strong court nobody protects individual and minority rights from the majority. In 2023 an amendment barring the courts from applying the 'reasonableness' test to decisions of the government and ministers was passed, and the court struck it down."
      ar: "تستطيع المحكمة العليا إلغاء قوانين وقرارات حكومية. يقول مؤيدو تقييدها إن الكنيست المنتخب يجب أن تكون له الكلمة الأخيرة وإن المحكمة تتدخل أكثر من اللازم؛ ويقول المعارضون إنه من دون محكمة قوية لا أحد يحمي حقوق الفرد والأقلية من الأغلبية. في 2023 أُقرّ تعديل يمنع المحاكم من تطبيق ذريعة «المعقولية» على قرارات الحكومة والوزراء، فألغته المحكمة."
      ru: "Верховный суд может отменять законы и решения правительства. Сторонники ограничения говорят, что последнее слово должно быть за избранным Кнессетом и что суд вмешивается слишком часто; противники — что без сильного суда некому защитить права личности и меньшинства от большинства. В 2023 году была принята поправка, запретившая судам применять критерий «разумности» к решениям правительства и министров, и суд её отменил."
      es: "El Tribunal Supremo puede anular leyes y decisiones del Gobierno. Quienes apoyan limitarlo dicen que la Knéset electa debe tener la última palabra y que el tribunal interviene demasiado; los opositores dicen que sin un tribunal fuerte nadie protege los derechos individuales y de las minorías frente a la mayoría. En 2023 se aprobó una enmienda que prohibía a los tribunales aplicar el criterio de «razonabilidad» a las decisiones del Gobierno y de los ministros, y el tribunal la invalidó."
      fr: "La Cour suprême peut annuler des lois et des décisions du gouvernement. Les partisans de sa limitation disent que la Knesset élue doit avoir le dernier mot et que la Cour intervient trop ; les opposants disent que sans une Cour forte, personne ne protège les droits de l’individu et des minorités face à la majorité. En 2023, un amendement interdisant aux tribunaux d’appliquer le critère de « raisonnabilité » aux décisions du gouvernement et des ministres a été adopté, et la Cour l’a annulé."
    explainerSources:
      - { url: "https://en.idi.org.il/articles/48034", title: "How Often Does the Supreme Court Invalidate Legislation?", publisher: "המכון הישראלי לדמוקרטיה" }
      - { url: "https://en.idi.org.il/articles/50753", title: "The Supreme Court Hearing on the Revocation of the Reasonableness Doctrine", publisher: "המכון הישראלי לדמוקרטיה" }
      - { url: "https://en.idi.org.il/articles/52249", title: "What Was the Supreme Court's Ruling on the Revocation of the Reasonableness Doctrine? Eight Key Points", publisher: "המכון הישראלי לדמוקרטיה" }
