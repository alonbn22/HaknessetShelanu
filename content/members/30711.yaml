      en: Member of Knesset for Likud and member of the Foreign Affairs and Defense
        Committee
    description:
      he: הלוי מכהן כחבר הכנסת מטעם מפלגת הליכוד; כיהן לראשונה בכנסת ה-23 (2020-2021)
        ושב לכנסת ב-17 בינואר 2023 בכנסת ה-25. הוא כיהן כחבר ועדת החוץ והביטחון
        של הכנסת, ולפי נתוני הכנסת הוא חבר בוועדת החוקה, חוק ומשפט ובוועדת הבריאות וממלא מקום חבר בוועדת החוץ והביטחון.
      en: Halevi serves as a member of the Knesset for the Likud party; he first
        served in the 23rd Knesset (2020-2021) and returned to the Knesset on 17
        January 2023 in the 25th Knesset. He served as a member of the Foreign
        Affairs and Defense Committee, and according to Knesset records sits on the Constitution, Law and Justice Committee and the Health Committee and is a substitute member of the Foreign Affairs and Defense Committee.
