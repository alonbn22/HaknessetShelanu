facts:
  - key: surplus-agreements
    label: { he: "הסכמי עודפים — מה זה ומי חתם", en: "Surplus-vote agreements — what they are and who signed" }
    detail:
      he: "אחרי חלוקת המנדטים לפי שיטת בדר-עופר נשארים לכל רשימה קולות \"עודפים\" שלא הספיקו למנדט נוסף. שתי רשימות רשאיות להסכים מראש לאחד את עודפיהן, וכך אחת מהן עשויה לזכות במנדט הנוסף במקום שיאבד. ההסכמים מוגשים לוועדת הבחירות המרכזית עד 16 באוקטובר 2026. עד כה דווח על שלושה זוגות: ישר! והדמוקרטים, ישראל ביתנו וביחד, והרשימה המשותפת ורע\"ם — מוצג על כרטיס כל רשימה."
      en: "After seats are allocated by the Bader-Ofer method, each list is left with \"surplus\" votes that fell short of another seat. Two lists may agree in advance to pool their surpluses, so that one of them can win the extra seat instead of losing it. Agreements are filed with the Central Elections Committee by October 16, 2026. Three pairs have been reported so far: Yashar! and the Democrats, Yisrael Beiteinu and Together, and the Joint List and Ra'am — shown on each list's card."
    status: reported
    sources:
      - url: "https://www.bechirot.gov.il/home/"
        title: "ציר הזמן לבחירות לכנסת ה-26 — מועד אחרון להודעה בדבר התקשרויות (הסכמי עודפים), סעיף 67(ב)"
        publisher: "ועדת הבחירות המרכזית"
      - url: "https://m.knesset.gov.il/en/about/lexicon/pages/electoralsystem.aspx"
        title: "Electoral System in Israel (Knesset Lexicon)"
        publisher: "The Knesset"
      - url: "https://www.timesofisrael.com/liveblog_entry/joint-list-and-raam-sign-surplus-vote-deal-ahead-of-oct-27-elections/"
        title: "Joint List and Ra'am sign surplus-vote deal ahead of Oct. 27 elections"
        publisher: "The Times of Israel"
  - key: election-date
    label: { he: "מועד הבחירות", en: "Election date" }
    value: { he: "יום שלישי, ט\"ז בחשוון התשפ\"ז — 27 באוקטובר 2026", en: "Tuesday, 16 Cheshvan 5787 — October 27, 2026" }
    detail:
      he: "המועד נקבע על ידי יו\"ר ועדת הבחירות המרכזית, שופט בית המשפט העליון נעם סולברג, ועוגן גם בחקיקה במליאת הכנסת ביולי 2026."
      en: "The date was set by Central Elections Committee chair Justice Noam Sohlberg and was also anchored in legislation by the Knesset plenum in July 2026."
    status: confirmed
    sources:
      - url: "https://www.gov.il/he/departments/central-elections-committee/govil-landing-page"
        title: "ועדת הבחירות המרכזית לכנסת — הבחירות לכנסת ה-26"
        publisher: "gov.il / ועדת הבחירות"
      - url: "https://www.timesofisrael.com/judge-sets-date-for-next-scheduled-elections-for-october-2026/"
        title: "October 27, 2026: Judge sets date for next scheduled elections"
        publisher: "The Times of Israel"
      - url: "https://www.zman.co.il/live/705042/"
        title: "לוח הזמנים לבחירות לכנסת"
        publisher: "Zman Yisrael"
  - key: full-term
    label: { he: "קדנציה מלאה", en: "A full term" }
    detail:
      he: "הכנסת ה-25 (נבחרה ב-1.11.2022, הושבעה ב-15.11.2022) השלימה קדנציה מלאה והתפזרה ב-17 ביולי 2026 — על פי דיווחים, הפעם הראשונה מאז 1988 שהבחירות מתקיימות במועדן החוקי המלא."
      en: "The 25th Knesset (elected Nov 1, 2022, sworn in Nov 15, 2022) completed a full term and dispersed on July 17, 2026 — per reports, the first time since 1988 that elections are held on their full statutory date."
    status: reported
    sources:
      - url: "https://www.aljazeera.com/news/2026/7/17/knesset-dissolves-how-will-israel-vote-in-octobers-general-election"
        title: "Knesset dissolves: How will Israel vote in October's general election?"
        publisher: "Al Jazeera"
      - url: "https://www.timesofisrael.com/knesset-expected-to-dissolve-july-17-paving-way-for-october-27-election/"
        title: "Knesset expected to dissolve July 17, paving way for October 27 election"
        publisher: "The Times of Israel"
  - key: statutory-basis
    label: { he: "הבסיס החוקי למועד", en: "Statutory basis for the date" }
    detail:
      he: "לפי חוק-יסוד: הכנסת (סעיפים 8–9), בתום כהונה מלאה הבחירות מתקיימות ביום שלישי השלישי בחודש חשוון; מכאן נגזר המועד 27 באוקטובר 2026 (ט\"ז בחשוון התשפ\"ז)."
      en: "Under Basic Law: The Knesset (sections 8–9), after a full term elections are held on the third Tuesday of the Hebrew month of Cheshvan; this yields October 27, 2026 (16 Cheshvan 5787)."
    status: scheduled-by-law
    sources:
      - url: "https://m.knesset.gov.il/EN/activity/documents/BasicLawsPDF/BasicLawTheKnesset.pdf"
        title: "Basic Law: The Knesset (arts. 8–9)"
        publisher: "The Knesset"
      - url: "https://www.timesofisrael.com/judge-sets-date-for-next-scheduled-elections-for-october-2026/"
        title: "October 27, 2026: Judge sets date for next scheduled elections"
        publisher: "The Times of Israel"
  - key: list-deadline
    label: { he: "הגשת רשימות המועמדים", en: "Candidate-list submission" }
    value: { he: "הוגשו ב-7–8 בספטמבר 2026", en: "Submitted September 7–8, 2026" }
    detail:
      he: "38 רשימות הוגשו ליו\"ר ועדת הבחירות המרכזית, השופט נעם סולברג, במשכן הכנסת. ההגשה אינה אישור: הרשימות, הכינויים והאותיות נבדקים, והאישור הסופי דווח ל-27 בספטמבר."
      en: "38 lists were submitted to the chair of the Central Elections Committee, Justice Noam Sohlberg, at the Knesset. Submission is not approval: the lists, names and ballot letters are under review, with final approval reported for September 27."
    status: confirmed
    sources:
      - url: "https://ch10.co.il/news/1100694/"
        title: "הרשימות נסגרו: מי יהיו 120 הח\"כים? אלו המתמודדים בבחירות לכנסת ה-26"
        publisher: "חרדים10"
      - url: "https://www.mako.co.il/news-israel-elections/2026/liveblog-5bc9483b18b70a1026.htm"
        title: "כל העדכונים מסגירת הרשימות לכנסת ה-26"
        publisher: "N12"
      - url: "https://www.i24news.tv/he/news/israel-elections-2026/artc-8c8f593a"
        title: "הלו\"ז המלא לבחירות 2026"
        publisher: "i24NEWS"
  - key: cec-chair
    label: { he: "יו\"ר ועדת הבחירות", en: "Elections Committee chair" }
    value: { he: "השופט נעם סולברג", en: "Justice Noam Sohlberg" }
    detail:
      he: "שופט בית המשפט העליון נעם סולברג עומד בראש ועדת הבחירות המרכזית לכנסת ה-26."
      en: "Supreme Court Justice Noam Sohlberg chairs the Central Elections Committee for the 26th Knesset."
    status: reported
    sources:
      - url: "https://www.timesofisrael.com/judge-sets-date-for-next-scheduled-elections-for-october-2026/"
        title: "October 27, 2026: Judge sets date for next scheduled elections"
        publisher: "The Times of Israel"
      - url: "https://www.gov.il/he/departments/central-elections-committee/govil-landing-page"
        title: "ועדת הבחירות המרכזית לכנסת"
        publisher: "gov.il"
  - key: results-timeline
    label: { he: "תוצאות וכינוס הכנסת", en: "Results & convening" }
    detail:
      he: "לפי דיווחים, התוצאות הרשמיות צפויות עד 4 בנובמבר 2026 (שמונה ימים אחרי הבחירות), ערעורים עד 18 בנובמבר, וישיבתה הראשונה של הכנסת ה-26 צפויה ב-10 בנובמבר 2026."
      en: "Per reports, official results are expected by November 4, 2026 (eight days after the election), appeals by November 18, and the 26th Knesset's first sitting is expected on November 10, 2026."
    status: reported
    sources:
      - url: "https://www.i24news.tv/he/news/israel-elections-2026/artc-8c8f593a"
        title: "הלו\"ז המלא לבחירות 2026"
