    title:
      he: 'כינה את היועצת המשפטית לממשלה "אישה ארורה, אישה נוראה" בריאיון רדיו'
      en: 'Called the Attorney General "a cursed woman, a terrible woman" in a radio interview'
    description:
      he: 'בריאיון לרדיו "קול ברמה" ב-5 ביולי 2026, על רקע הודעת רשות המסים לישיבות שתלמידיהן לא הסדירו את מעמדם הצבאי כי לא יוכרו עוד לזיכוי מס על תרומות, אמר מילביצקי כי היועצת המשפטית לממשלה גלי בהרב-מיארה מנהלת "ציד" נגד לומדי תורה כדי להרתיעם מלהצביע, וכינה אותה "אישה ארורה, אישה נוראה" שתיתן את הדין. בדיווחים לא הובאה תגובה מלשכת היועצת המשפטית או הבהרה מצדו.'
      en: 'In an interview with the Kol Barama radio station on 5 July 2026, against the backdrop of the Tax Authority notifying yeshivas whose students had not regularised their military status that donations to them would no longer qualify for tax credits, Milwidsky said Attorney General Gali Baharav-Miara was conducting a "hunt" against Torah students to deter them from voting, and called her "a cursed woman, a terrible woman" who would be held to account. The reports carried no response from the Attorney General''s office and no clarification from him.'
