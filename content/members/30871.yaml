    title:
      he: ייסוד והובלת השדולה לנפגעות אלימות מינית במלחמה
      en: Founded and chairs the Knesset caucus for victims of wartime sexual violence
    description:
      he: טל מירון הקימה ועומדת בראש השדולה (הקאוקוס) בכנסת לנפגעות אלימות מינית
        ומגדרית במלחמת חרבות ברזל. במסגרת זו פעלה להעלאת המודעות הבינלאומית
        לאלימות המינית באירועי 7 באוקטובר, נסעה לפגוש שרים, ראשי מדינות
        ועיתונאים, העידה בפרלמנטים זרים ושותפה בייסוד קואליציה בינלאומית בנושא
        אלימות מגדרית ככלי נשק במלחמה.
      en: Tal Meron founded and chairs the Knesset caucus for female victims of sexual
        and gender-based violence in the Swords of Iron War. She has worked to
        raise international awareness of sexual violence in the 7 October
        attacks, travelling to meet ministers, heads of state and journalists,
        testifying before foreign parliaments, and co-founding an international
        coalition on gender-based violence as a weapon of war.
    sources:
