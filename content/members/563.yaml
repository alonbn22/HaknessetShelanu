    date: 2024-05-27
    title:
      he: דיווח על הכנסת בני משפחתו להר מירון בל"ג בעומר 2024 בזמן הגבלות הכניסה
      en: Report that he brought family members to Mount Meron during the restricted Lag BaOmer 2024 event
    description:
      he: כשר הממונה על הילולת ל"ג בעומר במירון בשנת 2024 — שנה שבה, בשל ירי חיזבאללה, הוגבלה הכניסה לאתר לכ-30 בעלי היתר בלבד — דווח בכאן, ב-ynet ובטיימס אוף ישראל כי רעייתו, בתו ושני בניו של פרוש הגיעו לאתר. לשכת פרוש מסרה בתגובה כי כל הפעילות נעשתה כדין ובאישור הגורמים המוסמכים, כי אשתו ובתו סייעו לו בצרכיו האישיים במהלך שהותו וכי בניו שימשו כנהגיו במשמרות, כפי שנהגו במשך שנים. מדובר בביקורת ציבורית-תקשורתית; לא נפתח הליך משפטי בעניין ככל הידוע.
      en: As the minister in charge of the 2024 Lag BaOmer event at Mount Meron — a year in which, because of Hezbollah fire, access to the site was limited to some 30 permit holders — Kan, Ynet and The Times of Israel reported that Porush's wife, daughter and two sons came to the site. Porush's office responded that all activity was lawful and approved by the relevant authorities, that his wife and daughter assisted him with personal needs during his stay, and that his sons served as his drivers in shifts, as they had for years. This was public and media criticism; no legal proceeding is known to have been opened.
    sources:
