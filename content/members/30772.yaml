    title:
      he: סגן יושב ראש הכנסת
      en: Deputy Speaker of the Knesset
    description:
      he: ניסים ואטורי, חבר כנסת מטעם הליכוד, מכהן כסגן יושב ראש הכנסת. הוא נכנס לראשונה לכנסת בדצמבר 2020 (במקומו של גדעון סער), נבחר שוב בבחירות 2022, ומכהן גם כחבר ועדת החוץ והביטחון.
      en: Nissim Vaturi, a member of the Knesset for Likud, serves as a Deputy Speaker of the Knesset. He first entered the Knesset in December 2020 (replacing Gideon Sa'ar), was re-elected in the 2022 election, and is also a member of the Knesset's Foreign Affairs and Defense Committee.
