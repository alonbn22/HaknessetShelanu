    title:
      he: "נכנסה לכנסת ב-11 באוגוסט 2026 במקום יואב סגלוביץ' (יש עתיד)"
      en: "Entered the Knesset on 11 August 2026 in place of Yoav Segalovitz (Yesh Atid)"
    description:
      he: "מיכל סלבני כבביה נכנסה לכנסת ה-25 מטעם יש עתיד ב-11 באוגוסט 2026, לאחר שיואב סגלוביץ' הודיע על פרישתו מיש עתיד (7 באוגוסט 2026) והתפטר מהכנסת; סגלוביץ' התמודד לאחר מכן במקום השני ברשימת רע\"ם. לפי אתר הכנסת, פרטי הרקע של חברת הכנסת טרם נמסרו למערכת."
      en: "Michal Salbani-Kababia entered the 25th Knesset for Yesh Atid on 11 August 2026, after Yoav Segalovitz announced he was leaving Yesh Atid (7 August 2026) and resigned from the Knesset; Segalovitz later ran second on the Ra’am list. Per the Knesset site, the member’s background details have not yet been submitted."
