# Editorial party profiles — political position and what each faction supports.
# NOT from the Knesset API. Written to be factual and neutral; PLEASE REVIEW and
# update before publishing. spectrum: left | center-left | center | center-right
# | right | far-right. Text falls back locale -> en -> he when a language is missing.
profiles:
  - id: 1096 # Likud
    verified: "2026-09-19"
    updates:
      - date: "2025-03-13"
        text:
          he: "סיעות הליכוד והימין הממלכתי (תקווה חדשה) חתמו על הסכם פוליטי הכולל מיזוג עתידי וריצה ברשימה משותפת מטעם הליכוד בבחירות הבאות; במרכז הליכוד אושר ההסכם ב-13 באוגוסט 2025."
          en: "Likud and Gideon Sa’ar’s National Right (New Hope) faction signed an agreement providing for a future merger and a joint Likud list at the next election; the Likud Central Committee approved the merger on 13 August 2025."
        sources:
          - { url: "https://www.ynet.co.il/news/article/r12iadxh1l", title: "המהפך הושלם: סיעת גדעון סער מתמזגת עם הליכוד, בן גביר קרוב לחזרה לממשלה (2025-03-13)", publisher: "ynet" }
          - { url: "https://www.maariv.co.il/news/politics/article-1179992", title: "גדעון סער חוזר לליכוד: אלו פרטי ההסכם בין שתי המפלגות (2025-03-13)", publisher: "מעריב" }
          - { url: "https://www.timesofisrael.com/ruling-likud-party-approves-merger-with-gideon-saars-new-hope/", title: "Ruling Likud party approves merger with Gideon Sa’ar’s New Hope (2025-08-13)", publisher: "The Times of Israel" }
      - date: "2025-11-06"
        text:
          he: "בנימין נתניהו הוכרז כיו\"ר תנועת הליכוד וכמועמדה לראשות הממשלה בבחירות לכנסת ה-26, לאחר שהיה המועמד היחיד בבחירות המקדימות ליו\"ר שהוכרזו ב-23 באוקטובר 2025."
          en: "Benjamin Netanyahu was declared Likud chairman and the party’s candidate for prime minister for the 26th-Knesset election, having been the sole candidate in the leadership primary called on 23 October 2025."
        sources:
          - { url: "https://www.likud.org.il/images/yor/2025/%D7%94%D7%9B%D7%A8%D7%96%D7%94_%D7%A2%D7%9C_%D7%91%D7%97%D7%99%D7%A8%D7%AA%D7%95_%D7%A9%D7%9C_%D7%91%D7%A0%D7%99%D7%9E%D7%99%D7%9F_%D7%A0%D7%AA%D7%A0%D7%99%D7%94%D7%95_%D7%9C%D7%9B%D7%94%D7%95%D7%A0%D7%AA_%D7%99%D7%95%D7%A8_%D7%94%D7%9C%D7%99%D7%9B%D7%95%D7%93_%D7%95%D7%9E%D7%95%D7%A2%D7%9E%D7%93_%D7%9C%D7%9B%D7%94%D7%95%D7%A0%D7%AA_%D7%A8%D7%90%D7%A9_%D7%9E%D7%9E%D7%A9%D7%9C%D7%AA_%D7%99%D7%A9%D7%A8%D7%90%D7%9C.pdf", title: "הכרזה על בחירתו של מר בנימין נתניהו לכהונת יושב ראש תנועת הליכוד ומועמדה לכהונת ראש ממשלת ישראל בבחירות לכנסת ה-26 (2025-11-06)", publisher: "הליכוד (ועדת הבחירות המרכזית של התנועה)" }
      - date: "2026-07-03"
        text:
          he: "ח\"כ יולי אדלשטיין הודיע על פרישה מהליכוד ועל כך שלא יתמודד בפריימריז; ב-6 באוגוסט 2026 הציג יחד עם גלעד ארדן מפלגה חדשה, ב-4 בספטמבר הודיע ארדן כי המפלגה לא תתמודד, וב-6 בספטמבר הודיעה הנהלת הליכוד על הפסקת חברותם במפלגה ודרשה מאדלשטיין להתפטר מהכנסת. אדלשטיין עדיין רשום כחבר סיעת הליכוד."
          en: "MK Yuli Edelstein announced he was leaving Likud and would not run in its primary; on 6 August 2026 he and Gilad Erdan launched a new party, on 4 September Erdan said it would not run, and on 6 September Likud’s management ended both men’s party membership and asked Edelstein to resign from the Knesset. Edelstein remains listed as a member of the Likud faction."
        sources:
          - { url: "https://www.timesofisrael.com/senior-likud-renegade-yuli-edelstein-leaving-party-to-forge-a-new-political-path/", title: "Senior Likud renegade Yuli Edelstein leaving party to forge a ‘new political path’ (2026-07-03)", publisher: "The Times of Israel" }
          - { url: "https://www.timesofisrael.com/erdan-and-edelstein-unveil-still-unnamed-party-likud-no-longer-represents-its-voters/", title: "Erdan and Edelstein unveil still-unnamed party: ‘Likud no longer represents its voters’ (2026-08-06)", publisher: "The Times of Israel" }
          - { url: "https://www.haaretz.co.il/news/politics/2026-09-04/ty-article/000001a0-6cdc-d4e3-a7b3-7dfffc3a0000", title: "גלעד ארדן: מפלגתי לא תתמודד בבחירות, החיבור למפלגות אחרות אינו מתממש (2026-09-04)", publisher: "הארץ" }
          - { url: "https://www.c14.co.il/article/1692329", title: "הליכוד מדיח רשמית את ארדן ואדלשטיין - ודורש מהח\"כ להתפטר (2026-09-06)", publisher: "ערוץ 14" }
      - date: "2026-07-15"
        text:
          he: "ח\"כ דן אילוז הודיע על פרישה מהליכוד ועל כך שלא יתמודד בפריימריז; ב-5 באוגוסט 2026 הצטרף לישראל ביתנו, ב-11 באוגוסט הגיש את התפטרותו מהכנסת, וב-13 באוגוסט נכנס במקומו שבתאי קטש."
          en: "MK Dan Illouz announced he was leaving Likud and would not run in its primary; on 5 August 2026 he joined Yisrael Beiteinu, on 11 August he submitted his resignation from the Knesset, and on 13 August Shabtai Katash took his seat."
        sources:
          - { url: "https://news.walla.co.il/item/3853837", title: "דן אילוז הודיע שלא יתמודד בפריימריז של הליכוד (2026-07-15)", publisher: "וואלה" }
          - { url: "https://www.ynet.co.il/news/article/sylfkureme", title: "דן אילוז עוזב את הליכוד: \"מפלגה שאני בעצמי לא יכול להצביע לה\" (2026-07-15)", publisher: "ynet" }
          - { url: "https://www.timesofisrael.com/rebel-likud-mk-dan-illouz-joins-yisrael-beytenu-touts-its-national-and-liberal-values/", title: "Rebel Likud MK Dan Illouz joins Yisrael Beytenu, touts its ‘national and liberal values’ (2026-08-05)", publisher: "The Times of Israel" }
          - { url: "https://www.inn.co.il/news/703704", title: "דן אילוז: \"נתניהו חייב ללכת הביתה\" (2026-08-11)", publisher: "ערוץ 7" }
          - { url: "https://main.knesset.gov.il/mk/apps/faction/faction-lobby?KnessetID=25&FactionID=1096", title: "סיעת הליכוד — חילופי גברי: 13/08/2026 שבתאי קטש נכנס במקום דן אילוז (2026-09-19)", publisher: "הכנסת" }
      - date: "2026-08-12"
        text:
          he: "אלמוג כהן, שנבחר לכנסת ב-2022 מטעם עוצמה יהודית ומכהן כסגן שר במשרד ראש הממשלה, הצטרף לליכוד והתמודד בפריימריז לאחר שנתניהו ויתר על דרישת הוותק; שובץ במקום ה-13 ברשימת הליכוד."
          en: "Almog Cohen, elected in 2022 on the Otzma Yehudit list and serving as a deputy minister in the Prime Minister’s Office, joined Likud and ran in its primary after Netanyahu waived the tenure requirement; he was placed 13th on the Likud list."
        sources:
          - { url: "https://www.timesofisrael.com/former-otzma-yehudit-mk-to-run-in-likud-primary-after-netanyahu-opens-door/", title: "Former Otzma Yehudit MK to run in Likud primary after Netanyahu opens door (2026-08-12)", publisher: "The Times of Israel" }
          - { url: "https://www.jpost.com/israel-election-2026/article-905846", title: "Netanyahu’s new list: Eli Cohen wins top slot in tense Likud primaries (2026-08-18)", publisher: "The Jerusalem Post" }
          - { url: "https://www.gov.il/he/pages/halikud-tikvahadasha_iist29", title: "רשימה 29 — הליכוד עם בנימין נתניהו לראשות הממשלה (מקום 13: אלמוג כהן) (2026-09-09)", publisher: "ועדת הבחירות המרכזית לכנסת (gov.il)" }
      - date: "2026-08-17"
        text:
          he: "בפריימריז של הליכוד (76,068 מצביעים, 53.5% הצבעה) זכה אלי כהן במקום הראשון, אחריו אמיר אוחנה, יריב לוין, מירי רגב ואופיר כץ; ב-26 באוגוסט דווח על מחלוקת סביב ספירה חוזרת במקום ה-25 (גילה גמליאל / אתי עטייה)."
          en: "In the Likud primary (76,068 voters, 53.5% turnout) Eli Cohen finished first, followed by Amir Ohana, Yariv Levin, Miri Regev and Ofir Katz; on 26 August a dispute over a recount affecting the 25th slot (Gila Gamliel / Etty Atia) was reported."
        sources:
          - { url: "https://www.jpost.com/israel-election-2026/article-905846", title: "Netanyahu’s new list: Eli Cohen wins top slot in tense Likud primaries (2026-08-18)", publisher: "The Jerusalem Post" }
          - { url: "https://www.maariv.co.il/news/politics/article-1357061", title: "הסתיימה ההצבעה בליכוד: אלי כהן המנצח הגדול, טלי גוטליב מחוץ לעשירייה הראשונה - ואלו מי שנשארו בחוץ (2026-08-18)", publisher: "מעריב" }
          - { url: "https://www.timesofisrael.com/likud-recount-could-push-veteran-minister-out-of-knesset-as-fraud-claims-roil-party/", title: "Likud recount could push veteran minister out of Knesset as fraud claims roil party (2026-08-26)", publisher: "The Times of Israel" }
      - date: "2026-09-03"
        text:
          he: "הליכוד ועוצמה יהודית סיכמו כי ח\"כ טלי גוטליב תתמודד ברשימת עוצמה יהודית (במקום השני); על פי ההסכם היא כפופה למשמעת סיעת הליכוד עד הבחירות ואינה מוגדרת פורשת."
          en: "Likud and Otzma Yehudit agreed that MK Tally Gotliv will run on the Otzma Yehudit list (second place); under the agreement she remains bound by Likud faction discipline until the election and is not declared a departing MK."
        sources:
          - { url: "https://www.ynet.co.il/news/article/h1uerzwozl", title: "המעבר אושר: טלי גוטליב תתמודד ברשימת עוצמה יהודית לכנסת (2026-09-03)", publisher: "ynet" }
          - { url: "https://www.timesofisrael.com/likud-arranges-to-have-firebrand-mk-tally-gotliv-run-with-ben-gvirs-otzma-yehudit/", title: "Likud arranges to have firebrand MK Tally Gotliv run with Ben Gvir’s Otzma Yehudit (2026-09-04)", publisher: "The Times of Israel" }
          - { url: "https://www.inn.co.il/news/705612", title: "בן גביר: טלי גוטליב תקבל את המקום השני בעוצמה יהודית (2026-09-04)", publisher: "ערוץ 7" }
      - date: "2026-09-08"
        text:
          he: "הליכוד הגיש לוועדת הבחירות את רשימתו (\"הליכוד עם בנימין נתניהו לראשות הממשלה\", אותיות מבוקשות מחל) יחד עם מפלגת תקווה חדשה הימין הממלכתי, ובה תשעה משוריינים של נתניהו: גדעון סער במקום 7, אופיר כץ 8, טלי גואילי 9 (רשומה מטעם תקווה חדשה הימין הממלכתי), יעקב ברדוגו 11, אלמוג כהן 13, אלישע מדן 15, דוד פטר 16; ארבע נשים ב-35 המקומות הראשונים."
          en: "Likud submitted its list (“Likud with Benjamin Netanyahu for Prime Minister”, requested letters מחל) jointly with the New Hope–National Right party, including nine Netanyahu appointees: Gideon Sa’ar 7th, Ofir Katz 8th, Talik Gvili 9th (recorded under New Hope–National Right), Jacob Bardugo 11th, Almog Cohen 13th, Elisha Madan 15th, David Peter 16th; four women in the first 35 places."
        sources:
          - { url: "https://www.timesofisrael.com/liveblog_entry/likud-submits-35-person-knesset-slate-featuring-9-netanyahu-appointees-just-4-women/", title: "Likud submits 35-person Knesset slate featuring 9 Netanyahu appointees, just 4 women (2026-09-08)", publisher: "The Times of Israel" }
          - { url: "https://www.timesofisrael.com/finalizing-slate-netanyahu-fills-reserved-likud-slots-with-allies-ideologues/", title: "Finalizing slate, Netanyahu fills reserved Likud slots with allies, ideologues (2026-09-08)", publisher: "The Times of Israel" }
          - { url: "https://news.walla.co.il/item/3866371", title: "פרשן ערוץ 14, ח\"כ לשעבר במפלגת העבודה ואם של חטוף: השריונים של נתניהו (2026-09-08)", publisher: "וואלה" }
          - { url: "https://www.timesofisrael.com/likud-approves-reserved-spots-for-israel-katz-and-saar-freezes-vote-on-haim-katz/", title: "Likud approves reserved spots for Israel Katz and Sa’ar, freezes vote on Haim Katz (2026-08-11)", publisher: "The Times of Israel" }
          - { url: "https://www.gov.il/he/pages/halikud-tikvahadasha_iist29", title: "רשימה 29 — הליכוד עם בנימין נתניהו לראשות הממשלה (2026-09-09)", publisher: "ועדת הבחירות המרכזית לכנסת (gov.il)" }
