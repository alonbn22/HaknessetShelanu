  - kind: negative
    category: controversy
    date: "2021-10-12"
    title:
      he: "פרש ממרוץ ליו\"ר הסוכנות היהודית לאחר דבריו על גריסת תלונות אנונימיות בצה\"ל"
      en: "Withdrew from the Jewish Agency chairmanship race after remarks about shredding anonymous complaints in the IDF"
    description:
      he: "באוקטובר 2021, בעודו המועמד המועדף של ראש הממשלה בנט ושר החוץ לפיד לראשות הסוכנות היהודית, אמר שטרן בריאיון רדיו כי בתקופתו כראש אגף כוח האדם \"גרס תלונות אנונימיות רבות\"; הדברים עוררו סערה ציבורית לאחר שהובנו כמתייחסים גם לתלונות על הטרדה מינית. שטרן הבהיר כי אף תלונה שגרס לא עסקה בפגיעה מינית, התנצל בפני מי שנפגע מדבריו, וב-12 באוקטובר 2021 הודיע על פרישתו מהמועמדות, תוך שהוא מציין כי פעל \"בידיים נקיות\". הוא נותר בתפקידו כשר וכחבר כנסת."
      en: "In October 2021, while the preferred candidate of Prime Minister Bennett and Foreign Minister Lapid to chair the Jewish Agency, Stern said in a radio interview that as head of the Manpower Directorate he had \"shredded many anonymous complaints\"; the remark drew a public outcry after it was understood to include sexual-harassment complaints. Stern clarified that none of the complaints he had shredded concerned sexual misconduct, apologised to anyone hurt by his words, and on 12 October 2021 announced he was withdrawing his candidacy, saying he had acted \"with clean hands\". He remained a minister and a member of the Knesset."
    sources:
