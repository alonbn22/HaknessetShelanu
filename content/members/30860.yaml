    date: "2026-09-24"
    title:
      he: "היועמ\"שית החליטה להגיש נגדה כתב אישום על חשיפת זהות איש שב\"כ; הכנסת העניקה לה חסינות"
      en: "Attorney General decided to indict her over exposing a Shin Bet officer's identity; the Knesset granted her immunity"
      ar: "المستشارة القضائية للحكومة قررت تقديم لائحة اتهام ضدها بكشف هوية ضابط في الشاباك؛ الكنيست منحها الحصانة"
      ru: "Юридический советник правительства решила предъявить ей обвинение в раскрытии личности сотрудника ШАБАКа; Кнессет предоставил ей иммунитет"
    description:
      he: "ב-19 במאי 2026 החליטה היועצת המשפטית לממשלה להגיש כתב אישום נגד גוטליב בגין גילוי ופרסום מידע חסוי בניגוד לחוק שירות הביטחון הכללי, לאחר פרסום ברשתות החברתיות שחשף את זהותו של איש שב\"כ, בן זוגה של הפעילה שקמה ברסלר; חוות דעת שב\"כ קבעה כי הפרסום סיכן את חייו ואת משפחתו. ב-17 ביוני 2026 העניקה מליאת הכנסת לגוטליב חסינות מפני העמדה לדין (ברוב של 61-48 ו-62-48), ואיש השב\"כ ושני ארגונים עתרו לבג\"ץ לביטול ההחלטה. לפי חוק החסינות, בתקופת כהונתה של הכנסת הזו לא יאשר היועץ המשפטי לממשלה הגשת כתב אישום בשל אותה אשמה. ב-24 בספטמבר 2026 ביטל בג\"ץ את הדיון בעתירות שנקבע ל-12 באוקטובר, משום שהחסינות פוקעת מאליה בתום כהונת הכנסת ה-25; העתירות לא נמחקו, הכנסת והממשלה יגישו הודעות עדכון בתוך 60 ימים מהשבעת הכנסת ה-26, ובית המשפט לא הביע עמדה לגוף הדברים. גוטליב מכחישה ביצוע עבירה, אומרת כי פעלה במסגרת תפקידה הפרלמנטרי ורק שיתפה פרסום שכבר היה גלוי, וטוענת כי ההליך נגדה הוא רדיפה. חזקת החפות עומדת לה."
      en: "On 19 May 2026 the Attorney General decided to indict Gotliv for disclosing and publishing classified information in violation of the General Security Service (Shin Bet) law, over a social-media post that exposed the identity of a Shin Bet officer, the partner of activist Shikma Bressler; a Shin Bet assessment found the post endangered him and his family. On 17 June 2026 the Knesset plenum granted Gotliv immunity from prosecution (by votes of 61-48 and 62-48), and the officer and two organizations petitioned the High Court of Justice to overturn the decision. Under the immunity law, the Attorney General may not approve filing the indictment during this Knesset's term. On 24 September 2026 the High Court cancelled the hearing on the petitions set for 12 October, because the immunity lapses on its own when the 25th Knesset's term ends; it did not strike out the petitions, ordered the Knesset and the government to file updates within 60 days after the 26th Knesset is sworn in, and expressed no view on the merits. Gotliv denies wrongdoing, says she acted within her parliamentary role and only reshared an already-public post, and calls the proceedings persecution. The presumption of innocence applies."
      ar: "في 19 مايو 2026 قررت المستشارة القضائية للحكومة تقديم لائحة اتهام ضد غوتليب بتهمة كشف ونشر معلومات سرية بالمخالفة لقانون الشاباك، على خلفية منشور كشف هوية ضابط في الشاباك. وفي 17 يونيو 2026 منحت الهيئة العامة للكنيست غوتليب حصانة من المحاكمة (61-48 و62-48)، وقدّم الضابط ومنظمتان التماسات إلى محكمة العدل العليا لإلغاء القرار. ووفق قانون الحصانة، لا يُصادق المستشار القضائي للحكومة على تقديم لائحة الاتهام خلال ولاية هذا الكنيست. وفي 24 سبتمبر 2026 ألغت محكمة العدل العليا جلسة الالتماسات المقررة في 12 أكتوبر، لأن الحصانة تنقضي تلقائيًا بانتهاء ولاية الكنيست الـ25؛ ولم تشطب الالتماسات، وأمرت الكنيست والحكومة بتقديم تحديثات خلال 60 يومًا من أداء الكنيست الـ26 اليمين، ولم تُبدِ رأيًا في جوهر القضية. تنفي غوتليب ارتكاب أي مخالفة وتقول إنها تصرفت ضمن دورها البرلماني. وتُطبَّق قرينة البراءة."
      ru: "19 мая 2026 года юридический советник правительства решила предъявить Готлив обвинение в раскрытии и публикации секретной информации в нарушение закона о ШАБАКе из-за поста, раскрывшего личность сотрудника ШАБАКа. 17 июня 2026 года пленум Кнессета предоставил Готлив иммунитет от преследования (61-48 и 62-48), а сотрудник и две организации подали петиции в Высший суд справедливости об отмене решения. По закону об иммунитете юридический советник правительства не утверждает подачу обвинительного заключения в период полномочий этого Кнессета. 24 сентября 2026 года Высший суд справедливости отменил назначенное на 12 октября слушание по петициям, поскольку иммунитет истекает сам собой с окончанием полномочий Кнессета 25-го созыва; петиции не исключены из производства, Кнессет и правительство должны представить обновления в течение 60 дней после присяги Кнессета 26-го созыва, а суд не высказался по существу. Готлив отрицает вину и заявляет, что действовала в рамках депутатских полномочий. Действует презумпция невиновности."
