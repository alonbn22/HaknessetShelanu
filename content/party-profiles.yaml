      - date: "2026-09-08"
        text:
          he: "הליכוד הגיש לוועדת הבחירות את רשימתו (\"הליכוד עם בנימין נתניהו לראשות הממשלה\", אותיות מבוקשות מחל) יחד עם מפלגת תקווה חדשה הימין הממלכתי. תשעה מקומות שמורים מילא נתניהו (לפי טיימס אוף ישראל ודף הרשימה בוועדת הבחירות): ישראל כץ 6, גדעון סער 7, טלי גואילי 9 (רשומה מטעם תקווה חדשה הימין הממלכתי), יעקב ברדוגו 11, אלישע מדן 15, דוד פטר 16, חיים כץ 18, אלי גולדשמידט 26, יצחק בונצל 29."
          en: "Likud submitted its list (“Likud with Benjamin Netanyahu for Prime Minister”, requested letters מחל) jointly with the New Hope–National Right party. Nine reserved slots were filled by Netanyahu (per The Times of Israel and the CEC list page): Israel Katz 6th, Gideon Sa’ar 7th, Tali Gvili 9th (recorded under New Hope–National Right), Jacob Bardugo 11th, Elisha Madan 15th, David Peter 16th, Haim Katz 18th, Eli Goldschmidt 26th, Yitzhak Bonzel 29th."
          ar: "قدّم الليكود قائمته إلى لجنة الانتخابات («الليكود مع بنيامين نتنياهو لرئاسة الحكومة»، الأحرف المطلوبة מחל) بالاشتراك مع حزب «أمل جديد – اليمين الرسمي». وملأ نتنياهو تسعة مواقع محجوزة (بحسب تايمز أوف إسرائيل وصفحة القائمة في لجنة الانتخابات): يسرائيل كاتس 6، جدعون ساعر 7، طالي غفيلي 9 (مسجّلة باسم «أمل جديد – اليمين الرسمي»)، يعقوب بردوغو 11، إليشع مدان 15، دافيد بيتر 16، حاييم كاتس 18، إيلي غولدشميدت 26، يتسحاق بونتسل 29."
          ru: "Ликуд подал свой список в избирательную комиссию («Ликуд с Биньямином Нетаньяху на пост премьер-министра», запрошенные буквы מחל) совместно с партией «Новая надежда — Государственные правые». Девять зарезервированных мест заполнил Нетаньяху (по данным The Times of Israel и страницы списка в ЦИК): Исраэль Кац — 6-е, Гидеон Саар — 7-е, Тали Гвили — 9-е (записана от «Новой надежды — Государственных правых»), Яаков Бардуго — 11-е, Элиша Мадан — 15-е, Давид Петер — 16-е, Хаим Кац — 18-е, Эли Гольдшмидт — 26-е, Ицхак Бонцель — 29-е."
          es: "El Likud presentó su lista («Likud con Benjamín Netanyahu para primer ministro», letras solicitadas מחל) conjuntamente con el partido Nueva Esperanza – Derecha Nacional. Netanyahu cubrió nueve puestos reservados (según The Times of Israel y la página de la lista en la Comisión Electoral): Israel Katz 6.º, Gideon Sa’ar 7.º, Tali Gvili 9.ª (inscrita por Nueva Esperanza – Derecha Nacional), Jacob Bardugo 11.º, Elisha Madan 15.º, David Peter 16.º, Haim Katz 18.º, Eli Goldschmidt 26.º, Yitzhak Bonzel 29.º."
          fr: "Le Likoud a déposé sa liste (« Likoud avec Benyamin Netanyahou pour Premier ministre », lettres demandées מחל) conjointement avec le parti Nouvel Espoir – Droite étatique. Netanyahou a pourvu neuf places réservées (selon The Times of Israel et la page de la liste à la Commission électorale) : Israël Katz 6e, Gideon Sa’ar 7e, Tali Gvili 9e (inscrite au titre de Nouvel Espoir – Droite étatique), Jacob Bardugo 11e, Elisha Madan 15e, David Peter 16e, Haim Katz 18e, Eli Goldschmidt 26e, Yitzhak Bonzel 29e."
