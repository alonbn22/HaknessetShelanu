        title: "Israeli elections 2026: Meet the parliament—MK Shelly Tal Meron"
        publisher: "JNS"
  - kind: positive
    category: achievement
    title:
      he: "השקת שדולה בין-מפלגתית למען שחרור החטופים"
      en: "Co-launched a cross-party Knesset lobby for the release of hostages"
    description:
      he: "ביחד עם ח\"כ בועז ביסמוט (הליכוד) השיקה טל מירון שדולה בין-מפלגתית בכנסת לקידום שחרורם של החטופים המוחזקים בידי חמאס ברצועת עזה. הישיבה הראשונה התקיימה ב-9 בינואר 2024 בהשתתפות כ-20 חברי כנסת ושרים ושגרירים, וכללה עדות של חטופה ששוחררה ושל בני משפחות חטופים."
      en: "Together with MK Boaz Bismuth (Likud), Tal Meron co-launched a cross-party Knesset lobby to advance the release of hostages held by Hamas in the Gaza Strip. Its first hearing was held on 9 January 2024, attended by about 20 lawmakers and ministers as well as ambassadors, and featured testimony from a freed hostage and from hostage families."
    date: "2024-01-09"
    sources:
      - url: "https://www.jns.org/nonpartisan-knesset-lobby-turns-up-the-pressure-to-release-hostages/"
        title: "Nonpartisan Knesset lobby turns up the pressure to release hostages"
        publisher: "JNS"
  - kind: negative
    category: controversy
    status: ethics
    title:
      he: "נזיפה חמורה מוועדת האתיקה על התנהגותה בדיון ועדת החוקה (מרץ 2023)"
      en: "Severe reprimand from the Ethics Committee over her conduct at a Constitution Committee hearing (March 2023)"
    description:
      he: "ב-5 במרץ 2023 קבעה ועדת האתיקה של הכנסת פה אחד כי טל מירון, יחד עם חברי הכנסת יוראי להב הרצנו וולדימיר בליאק, הפרה את כללי האתיקה כשעברה אל מרכז שולחן ועדת החוקה ב-13 בפברואר 2023, במהלך הצבעות על חקיקת הרפורמה המשפטית. הוועדה הטילה עליה נזיפה חמורה בלבד, לאחר ששקלה את התנצלותה ואת העובדה שנכנסה לכנסת פחות משבועיים לפני האירוע; טל מירון אמרה לוועדה כי התנהגותה הייתה חריגה ולא תחזור על עצמה."
      en: "On 5 March 2023 the Knesset Ethics Committee unanimously found that Tal Meron, together with MKs Yorai Lahav-Hertzanu and Vladimir Beliak, had breached the ethics rules by crossing into the centre of the Constitution Committee's table on 13 February 2023, during votes on the judicial-overhaul legislation. The committee imposed only a severe reprimand on her, having weighed her apology and the fact that she had entered the Knesset less than two weeks before the incident; Tal Meron told the committee her conduct had been out of character and would not recur."
    date: "2023-03-05"
