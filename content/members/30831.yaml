    date: 2023-07-27
    title:
      he: משיכת הצעת החוק לפיצול סמכויות היועץ המשפטי לממשלה (2023)
      en: Withdrawal of bill to split the attorney general's powers (2023)
      ar: سحب مشروع قانون لتقسيم صلاحيات المستشار القضائي للحكومة (2023)
      ru: Отзыв законопроекта о разделении полномочий юридического советника правительства (2023)
    description:
      he: ב-26 ביולי 2023 הגיש דלל, יחד עם חברי כנסת נוספים מהליכוד, הצעת חוק להעברת סמכויות האכיפה הפלילית כלפי ראש הממשלה וחברי הממשלה מהיועץ המשפטי לממשלה לפרקליט המדינה. לאחר ביקורת ציבורית, ולאחר שהליכוד הבהיר כי ההצעה לא תואמה עם ראשות הקואליציה ולא תקודם ללא אישורה, הודיע דלל ב-27 ביולי על משיכת ההצעה, ומסר כי הדבר נעשה "לאור כוונתי שלא לקדם את החוק בכנסת הנוכחית ומתוך רצון אמיתי וכן לשיח, פשרות והסכמות" עם חברי האופוזיציה.
      en: On 26 July 2023 Dallal, together with other Likud MKs, submitted a bill to transfer criminal-enforcement powers over the prime minister and government members from the attorney general to the state prosecutor. Following public criticism, and after Likud stated the bill had not been coordinated with the coalition leadership and would not advance without its approval, Dallal announced on 27 July that he was withdrawing it, saying he did so "in light of my intention not to advance the law in the current Knesset and out of a genuine desire for dialogue, compromises and agreements" with opposition colleagues.
      ru: В июле 2023 года Далаль внёс законопроект о передаче полномочий уголовного преследования членов правительства от юридического советника правительства государственному прокурору. После публичной критики и заявления «Ликуда», что законопроект не был согласован с руководством коалиции, Далаль объявил об отзыве инициативы, сославшись на стремление к диалогу и договорённостям с оппозицией.
