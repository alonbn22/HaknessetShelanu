        publisher: Arutz 7 / Israel National News
  - kind: positive
    category: achievement
    title:
      he: יושב ראש ועדת הביטחון הלאומי של הכנסת
      en: Chair of the Knesset National Security Committee
    description:
      he: פוגל מונה ליושב ראש ועדת הביטחון הלאומי של הכנסת בפברואר 2023. בינואר 2025,
        עם פרישת עוצמה יהודית מהממשלה במחאה על עסקת החטופים, התפטר מהתפקיד וח"כ
        בועז ביסמוט מהליכוד החליפו; ב-5 במאי 2025, עם שובה של המפלגה לממשלה,
        אישרה הוועדה פה אחד את חזרתו לתפקיד, והוא מכהן בו גם לאחר פיזור הכנסת.
      en: Fogel was appointed chair of the Knesset's National Security Committee in
        February 2023. In January 2025, when Otzma Yehudit left the government in
        protest at the hostage deal, he resigned the post and Likud MK Boaz
        Bismuth took over; on 5 May 2025, after the party's return to the
        government, the committee unanimously reinstated him, and he continues
        in the post after the Knesset's dissolution.
    date: 2023-02
