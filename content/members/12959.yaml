claims:
  - kind: positive
    category: achievement
    title:
      he: כיהנה כדוברת צה"ל בדרגת תת-אלוף
      en: Served as IDF Spokesperson at the rank of Brigadier General
    description:
      he: מירי רגב שירתה בצה"ל למעלה מ-25 שנה (1983–2008) והגיעה לדרגת תת-אלוף. בשנים 2005–2007 כיהנה כדוברת צה"ל, ובכלל זה בתקופת ההתנתקות מרצועת עזה (2005) ומלחמת לבנון השנייה (2006).
      en: Miri Regev served in the IDF for over 25 years (1983–2008), reaching the rank of Brigadier General. From 2005 to 2007 she served as the IDF Spokesperson, including during the 2005 Gaza disengagement and the 2006 Second Lebanon War.
    date: 2005-06-01
    sources:
      - url: https://main.knesset.gov.il/mk/apps/mk/mk-personal-details/831
        title: "מירי מרים רגב — פרטים אישיים (אתר הכנסת)"
        publisher: Knesset
      - url: https://en.wikipedia.org/wiki/Miri_Regev
        title: Miri Regev
        publisher: Wikipedia
  - kind: positive
    category: achievement
    title:
      he: כיהנה כשרת התרבות והספורט (2015–2020); שרת התחבורה מאז דצמבר 2022
      en: Served as Minister of Culture and Sport (2015–2020); Minister of Transport since December 2022
    description:
      he: לאחר היבחרה לכנסת מטעם הליכוד בבחירות 2009, מונתה רגב בשנת 2015 לשרת התרבות והספורט, תפקיד בו כיהנה עד שנת 2020. מאז 29 בדצמבר 2022 היא מכהנת כשרת התחבורה והבטיחות בדרכים בממשלה ה-37 (ממשלת מעבר מאז פיזור הכנסת ה-25 ביולי 2026).
      en: After being elected to the Knesset for Likud in the 2009 elections, Regev was appointed Minister of Culture and Sport in 2015, a post she held until 2020. Since 29 December 2022 she has served as Minister of Transport and Road Safety in the 37th government (a caretaker government since the 25th Knesset dispersed in July 2026).
    date: 2022-12-29
    sources:
      - url: https://en.wikipedia.org/wiki/Miri_Regev
