    description:
      he: ב-4 במאי 2026, זמן קצר לאחר הכרזת החיבור הפוליטי בין יאיר לפיד לנפתלי בנט, הודיע לוי כי "אחרי מחשבה רבה עדכנתי את יאיר לפיד שאסיים את דרכי במפלגה בתום הקדנציה", לאחר 14 שנות פעילות ב'יש עתיד'. הוא הבהיר כי ימשיך לכהן בכנסת עד תום הקדנציה, בין היתר בתחומי בריאות הנפש ופצועי צה"ל.
      en: On 4 May 2026, shortly after the announcement of the political merger between Yair Lapid and Naftali Bennett, Levy announced that "after much thought I informed Yair Lapid that I will end my path with the party at the end of the term", after 14 years of activity in Yesh Atid. He made clear he would continue to serve in the Knesset until the end of the term, including on mental health and wounded IDF soldiers.
