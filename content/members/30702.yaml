      en: Before entering politics, Atia accumulated public-service and welfare
        experience. She served as chief of staff to the secretary of the
        national union of Israel Aerospace Industries workers, and as chief of
        staff to the Minister of Labor, Social Affairs and Social Services from
        2015 to 2018, where she handled welfare, social security and
        nursing-care matters.
