          he: "תגובת ישר! להצהרת עבאס: \"אין מדינה פלסטינית, ובממשלה שנקים לא תקום מדינה פלסטינית.\""
          en: "Yashar's response to Abbas: \"there is no Palestinian state, and in the government we form, a Palestinian state will not be established.\""
      reservists:
        value: -2
        basis: platform
        source: { url: "https://www.themiluimnikim.org.il/platform/", title: "עיקרי המצע — המילואימניקים והכלכלית", publisher: "המילואימניקים" }
        quote:
          he: "\"נפעל כדי למנוע מדינה פלסטינית בצירים הדיפלומטיים והמדיניים, לצד יצירת מציאות של הכרעה בשטח.\""
          en: "\"We will act to prevent a Palestinian state on the diplomatic and political tracks, alongside creating a decisive reality on the ground.\""
  - id: settlements-sovereignty
    topic: security
    lean: right
    text:
      he: "יש להרחיב את ההתיישבות ביהודה ושומרון (הגדה המערבית) ולהחיל שם ריבונות ישראלית."
      en: "Settlement in Judea and Samaria (the West Bank) should be expanded and Israeli sovereignty applied there."
      ar: "يجب توسيع الاستيطان في يهودا والسامرة (الضفة الغربية) وفرض السيادة الإسرائيلية هناك."
      ru: "Следует расширять поселения в Иудее и Самарии (на Западном берегу) и распространить там израильский суверенитет."
