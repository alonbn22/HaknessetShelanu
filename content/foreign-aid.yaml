# Foreign aid & funding to Israel / Israeli organizations from abroad.
# EDITORIAL (not from an API): widely-documented public figures (chiefly the
# Congressional Research Service), written to be factual and neutral. REVIEW &
# update; cite sources. Amounts are approximate fiscal-year figures.

# U.S. military aid (Foreign Military Financing + missile defense) by fiscal year.
# 2007 MOU (~$3.1B/yr) through FY2018; 2016 MOU ($3.8B/yr = $3.3B FMF + $0.5B
# missile defense) from FY2019; plus post-Oct-2023 wartime supplementals.
usMilitaryAid:
  source:
    label: { he: "Congressional Research Service (RL33222)", en: "Congressional Research Service (RL33222)", es: "Servicio de Investigación del Congreso (RL33222)", fr: "Congressional Research Service (RL33222)" }
    url: "https://www.congress.gov/crs-product/RL33222"
  note:
    he: "סיוע צבאי אמריקאי לפי שנת תקציב (מימון צבאי FMF + הגנה מפני טילים). מ-2019 לפי מזכר ההבנות 2016 (3.8 מיליארד$ לשנה). בנוסף, מאז אוקטובר 2023 הועברו לפחות 16.3 מיליארד$ סיוע צבאי ישיר במסגרת חוקי סיוע חירום."
    en: "U.S. military aid by fiscal year (FMF + missile defense). From 2019 under the 2016 MOU ($3.8B/yr). On top of this, at least $16.3B in direct military aid has been enacted since October 2023 via emergency-aid laws."
    es: "Ayuda militar de EE. UU. por año fiscal (FMF + defensa antimisiles). Desde 2019 según el memorando de 2016 (3800 millones de dólares al año). Además, desde octubre de 2023 se han aprobado al menos 16 300 millones de dólares de ayuda militar directa mediante leyes de ayuda de emergencia."
    fr: "Aide militaire américaine par exercice budgétaire (FMF + défense antimissile). Depuis 2019 selon le protocole d’accord de 2016 (3,8 Md $ par an). S’y ajoutent au moins 16,3 Md $ d’aide militaire directe votés depuis octobre 2023 par des lois d’aide d’urgence."
  years:
    - { year: 2016, billion: 3.1 }
    - { year: 2017, billion: 3.1 }
    - { year: 2018, billion: 3.1 }
    - { year: 2019, billion: 3.8 }
    - { year: 2020, billion: 3.8 }
    - { year: 2021, billion: 3.8 }
    - { year: 2022, billion: 3.8 }
    - { year: 2023, billion: 3.8 }
    - { year: 2024, billion: 12.5, note: { he: "3.8 מיליארד$ קבוע + ~8.7 מיליארד$ סיוע חירום (אפריל 2024)", en: "$3.8B base + ~$8.7B emergency supplemental (April 2024)", es: "3800 millones de dólares de base + ≈ 8700 millones de dólares de suplemento de emergencia (abril de 2024)", fr: "3,8 Md $ de base + ~8,7 Md $ de supplément d’urgence (avril 2024)" } }
    - { year: 2025, billion: 3.8, note: { he: "בסיס המזכר; בנוסף לסיוע החירום המתמשך של המלחמה", en: "MOU base; plus ongoing wartime emergency aid", es: "Base del memorando; más la ayuda de emergencia en curso por la guerra", fr: "Base du protocole d’accord ; plus l’aide d’urgence en cours liée à la guerre" } }

