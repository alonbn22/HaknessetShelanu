      en: "Doctor of genetics and cancer-genetics researcher"
    description:
      he: "לחוג'יראת תואר דוקטור בגנטיקה מהאוניברסיטה העברית בירושלים, ובתר-דוקטורט בגנטיקה של הסרטן מהטכניון וממכון המחקר הבריטי לחקר הסרטן. הוא הקים מעבדה לגנטיקה מולקולרית במרכז הרפואי העמק ולימד בטכניון ובמוסדות נוספים."
      en: "Hujeirat holds a doctorate in genetics from the Hebrew University of Jerusalem and a post-doctorate in cancer genetics from the Technion and Cancer Research UK. He established a molecular genetics laboratory at Emek Medical Center and lectured at the Technion and other institutions."
