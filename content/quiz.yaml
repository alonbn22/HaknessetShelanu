          en: "\"Public transport on Shabbat according to the decision of local authorities… civil marriage and divorce for every citizen.\""
          ar: "«تشغيل المواصلات العامة يوم السبت وفق قرار السلطات المحلية… واعتماد الزواج والطلاق المدنيين لكل مواطن.»"
          ru: "«Общественный транспорт в шаббат по решению местных властей… гражданские браки и разводы для каждого гражданина»."
          es: "«Transporte público en Shabat según la decisión de las autoridades locales… matrimonio y divorcio civiles para todos los ciudadanos.»"
          fr: "« Des transports publics le Shabbat selon la décision des collectivités locales… le mariage et le divorce civils pour chaque citoyen. »"
