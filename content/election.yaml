rules:
  - key: system
    label: { he: "שיטת הבחירות", en: "The electoral system", ar: "طريقة الانتخاب", ru: "Избирательная система", es: "El sistema electoral", fr: "Le système électoral" }
    detail:
      he: "הבחירות כלליות, ארציות, ישירות, שוות, חשאיות ויחסיות; המדינה כולה אזור בחירה אחד. מצביעים לרשימות סגורות, והמושבים מחולקים בין הרשימות שעברו את אחוז החסימה בשיטת בדר-עופר, כולל הסכמי עודפים."
      en: "Elections are general, nationwide, direct, equal, secret and proportional; the whole country is one district. Voters choose closed party lists, and seats are allocated among lists that pass the threshold by the Bader-Ofer method, including surplus-vote agreements."
      ar: "الانتخابات عامة وقُطرية ومباشرة ومتساوية وسرية ونسبية؛ البلاد كلها دائرة انتخابية واحدة. يختار الناخبون قوائم حزبية مغلقة، وتُوزَّع المقاعد بين القوائم التي تجتاز نسبة الحسم بطريقة بادر-عوفر، بما في ذلك اتفاقيات فائض الأصوات."
      ru: "Выборы всеобщие, общенациональные, прямые, равные, тайные и пропорциональные; вся страна — один округ. Избиратели выбирают закрытые партийные списки, а мандаты распределяются между списками, преодолевшими барьер, по методу Бадера — Офера, с учётом соглашений об излишках голосов."
      es: "Las elecciones son generales, nacionales, directas, iguales, secretas y proporcionales; todo el país es una sola circunscripción. Los votantes eligen listas cerradas de partido, y los escaños se reparten entre las listas que superan el umbral por el método Bader-Ofer, incluidos los acuerdos de votos sobrantes."
      fr: "Les élections sont générales, nationales, directes, égales, secrètes et proportionnelles ; le pays entier forme une seule circonscription. Les électeurs choisissent des listes fermées, et les sièges sont répartis entre les listes ayant franchi le seuil selon la méthode Bader-Ofer, y compris les accords de report des voix restantes."
    status: confirmed
    sources:
      - url: "https://m.knesset.gov.il/en/about/lexicon/pages/electoralsystem.aspx"
        title: "Electoral System in Israel (Knesset Lexicon)"
        publisher: "The Knesset"
  - key: seats
    label: { he: "מושבים", en: "Seats", ar: "المقاعد", ru: "Мандаты", es: "Escaños", fr: "Sièges" }
    value: { he: "120", en: "120", ar: "120", ru: "120", es: "120", fr: "120" }
    detail:
      he: "בכנסת 120 חברים; כל המושבים מחולקים בחלוקה ארצית-יחסית בין הרשימות שעברו את אחוז החסימה."
      en: "The Knesset has 120 members; all seats are allocated by nationwide proportional distribution among lists that passed the threshold."
      ar: "في الكنيست 120 عضوًا؛ وتُوزَّع جميع المقاعد توزيعًا نسبيًا قُطريًا بين القوائم التي اجتازت نسبة الحسم."
      ru: "В Кнессете 120 депутатов; все мандаты распределяются пропорционально по всей стране между списками, преодолевшими барьер."
      es: "La Knéset tiene 120 miembros; todos los escaños se reparten de forma proporcional a nivel nacional entre las listas que superaron el umbral."
      fr: "La Knesset compte 120 membres ; tous les sièges sont répartis proportionnellement au niveau national entre les listes ayant franchi le seuil."
    status: confirmed
    sources:
      - url: "https://m.knesset.gov.il/EN/activity/documents/BasicLawsPDF/BasicLawTheKnesset.pdf"
        title: "Basic Law: The Knesset (art. 3)"
        publisher: "The Knesset"
  - key: threshold
    label: { he: "אחוז החסימה", en: "Electoral threshold", ar: "نسبة الحسم", ru: "Электоральный барьер", es: "Umbral electoral", fr: "Seuil électoral" }
    value: { he: "3.25%", en: "3.25%", ar: "3.25%", ru: "3,25%", es: "3,25 %", fr: "3,25 %" }
    detail:
      he: "רשימה שלא הגיעה ל-3.25% מהקולות הכשרים אינה זוכה בייצוג. האחוז הועלה ל-3.25% במרץ 2014; קודם לכן — 1% עד בחירות 1992, 1.5% מבחירות 1992, ו-2% שנחקק ב-2004 והוחל מבחירות 2006."
      en: "A list below 3.25% of valid votes wins no seats. The threshold was raised to 3.25% in March 2014; previously 1% until the 1992 election, 1.5% from 1992, and 2% legislated in 2004 and first applied in the 2006 election."
      ar: "القائمة التي تحصل على أقل من 3.25% من الأصوات الصحيحة لا تفوز بأي مقعد. رُفعت نسبة الحسم إلى 3.25% في آذار/مارس 2014؛ وكانت قبل ذلك 1% حتى انتخابات 1992، و1.5% منذ 1992، و2% شُرّعت في 2004 وطُبّقت أول مرة في انتخابات 2006."
      ru: "Список, получивший меньше 3,25% действительных голосов, мандатов не получает. Барьер подняли до 3,25% в марте 2014 года; раньше он составлял 1% до выборов 1992 года, 1,5% с 1992 года и 2% — установлен в 2004 году и впервые применён на выборах 2006 года."
      es: "Una lista por debajo del 3,25 % de los votos válidos no obtiene escaños. El umbral se elevó al 3,25 % en marzo de 2014; antes era del 1 % hasta las elecciones de 1992, del 1,5 % desde 1992, y del 2 % legislado en 2004 y aplicado por primera vez en las elecciones de 2006."
      fr: "Une liste sous 3,25 % des suffrages valables n’obtient aucun siège. Le seuil a été relevé à 3,25 % en mars 2014 ; auparavant 1 % jusqu’aux élections de 1992, 1,5 % à partir de 1992, et 2 % voté en 2004 et appliqué pour la première fois aux élections de 2006."
    status: confirmed
    sources:
      - url: "https://main.knesset.gov.il/EN/About/Lexicon/Pages/ElectoralThreshold.aspx"
        title: "Electoral Threshold (Knesset Lexicon)"
        publisher: "The Knesset"
      - url: "https://m.knesset.gov.il/EN/activity/mmm/wastedvotes.pdf"
        title: "Wasted votes (Knesset Research and Information Center)"
        publisher: "The Knesset"
  - key: voting-eligibility
    label: { he: "מי רשאי להצביע", en: "Who may vote", ar: "من يحق له التصويت", ru: "Кто может голосовать", es: "Quién puede votar", fr: "Qui peut voter" }
    detail:
      he: "כל אזרח ישראלי בן 18 ומעלה הרשום במרשם האוכלוסין, אלא אם בית משפט שלל זאת לפי חוק. ההצבעה אישית ובישראל בלבד; קבוצות מוגדרות (חיילים, שליחי מדינה בחו\"ל, מאושפזים, אסירים, מלחים ועוד) מצביעות במעטפות כפולות."
      en: "Every Israeli citizen aged 18+ registered in the Population Register, unless a court has removed the right by law. Voting is in person and in Israel only; defined groups (soldiers, state emissaries abroad, hospital patients, prisoners, ship crews and more) vote by double envelope."
      ar: "كل مواطن إسرائيلي بلغ 18 عامًا فأكثر ومسجّل في سجل السكان، ما لم تسلبه المحكمة هذا الحق بموجب القانون. التصويت شخصي وفي إسرائيل فقط؛ وتصوّت فئات محددة (الجنود، مبعوثو الدولة في الخارج، المرضى في المستشفيات، السجناء، طواقم السفن وغيرهم) بالمغلّف المزدوج."
      ru: "Каждый гражданин Израиля, достигший 18 лет и внесённый в Реестр населения, если суд не лишил его этого права по закону. Голосуют лично и только в Израиле; определённые группы (солдаты, государственные посланники за рубежом, пациенты больниц, заключённые, экипажи судов и другие) голосуют двойным конвертом."
      es: "Todo ciudadano israelí de 18 años o más inscrito en el Registro de Población, salvo que un tribunal le haya retirado el derecho conforme a la ley. Se vota en persona y solo en Israel; grupos definidos (soldados, enviados del Estado en el extranjero, pacientes hospitalizados, presos, tripulaciones de barcos y otros) votan en sobre doble."
      fr: "Tout citoyen israélien de 18 ans et plus inscrit au registre de la population, sauf si un tribunal lui a retiré ce droit conformément à la loi. Le vote se fait en personne et uniquement en Israël ; des groupes définis (soldats, émissaires de l’État à l’étranger, patients hospitalisés, détenus, équipages de navires et autres) votent sous double enveloppe."
    status: confirmed
    sources:
      - url: "https://m.knesset.gov.il/EN/activity/documents/BasicLawsPDF/BasicLawTheKnesset.pdf"
        title: "Basic Law: The Knesset (art. 5)"
        publisher: "The Knesset"
      - url: "https://main.knesset.gov.il/EN/Documents/2022-10-24%20Fact%20sheet%2002%20-%2025th%20Knesset%20elections%20-%20updated.pdf"
        title: "Fact sheet: The 25th Knesset elections"
        publisher: "The Knesset"
  - key: candidacy
    label: { he: "מי רשאי להיבחר", en: "Who may run", ar: "من يحق له الترشح", ru: "Кто может баллотироваться", es: "Quién puede presentarse", fr: "Qui peut se présenter" }
    detail:
      he: "אזרח ישראלי בן 21 ומעלה ביום הגשת הרשימות, בכפוף לסייגים: מי שנידון ליותר משלושה חודשי מאסר בפועל מנוע מלהתמודד שבע שנים מתום ריצוי העונש (ובעבירת טרור/ביטחון חמורה שנגזרו עליה מעל שבע שנות מאסר — 14 שנים), אלא אם נקבע שאין קלון. נושאי משרה בכירים (שופטים, קצינים בכירים, עובדי מדינה בכירים ועוד) חייבים לפרוש מראש במועדים הקבועים בחוק. לפי סעיף 7א, רשימה או מועמד ייפסלו בשל שלילת קיומה של ישראל כמדינה יהודית ודמוקרטית, הסתה לגזענות או תמיכה במאבק מזוין נגד ישראל; פסילת מועמד טעונה אישור בית המשפט העליון."
      en: "An Israeli citizen aged 21+ on list-submission day, with restrictions: a person sentenced to over three months' actual imprisonment is barred for seven years after completing the sentence (14 years where a serious terror/security offence drew over seven years' imprisonment), unless ruled free of moral turpitude. Senior officials (judges, senior officers, senior civil servants and others) must resign by statutory deadlines. Under article 7A, a list or candidate is barred for negating Israel's existence as a Jewish and democratic state, incitement to racism, or support for armed struggle against Israel; barring a candidate requires Supreme Court approval."
      ar: "مواطن إسرائيلي بلغ 21 عامًا فأكثر في يوم تقديم القوائم، مع قيود: من حُكم عليه بالسجن الفعلي لأكثر من ثلاثة أشهر يُمنع من الترشح سبع سنوات بعد انتهاء محكوميته (14 سنة إذا صدر حكم بالسجن لأكثر من سبع سنوات على مخالفة إرهاب أو أمن خطيرة)، ما لم تُقرّ المحكمة أن المخالفة لا تنطوي على وصمة عار. على كبار الموظفين (القضاة وكبار الضباط وكبار موظفي الدولة وغيرهم) الاستقالة ضمن مواعيد قانونية. وبموجب المادة 7أ، تُمنع قائمة أو مرشح من الترشح بسبب نفي وجود إسرائيل دولةً يهودية وديمقراطية، أو التحريض على العنصرية، أو دعم الكفاح المسلح ضد إسرائيل؛ ومنع مرشح يتطلب مصادقة المحكمة العليا."
      ru: "Гражданин Израиля, которому в день подачи списков исполнился 21 год, с ограничениями: приговорённый к более чем трём месяцам реального заключения не может баллотироваться семь лет после отбытия срока (14 лет, если за тяжкое террористическое или связанное с безопасностью преступление назначено более семи лет), если только не было установлено, что в деянии нет позорящего обстоятельства. Высокопоставленные должностные лица (судьи, старшие офицеры, высшие госслужащие и другие) должны уйти в отставку в установленные законом сроки. По статье 7А список или кандидат отстраняется за отрицание существования Израиля как еврейского и демократического государства, подстрекательство к расизму или поддержку вооружённой борьбы против Израиля; отстранение кандидата требует утверждения Верховного суда."
      es: "Un ciudadano israelí de 21 años o más el día de presentación de las listas, con restricciones: quien haya sido condenado a más de tres meses de prisión efectiva queda excluido durante siete años tras cumplir la pena (14 años si un delito grave de terrorismo o seguridad conllevó más de siete años de prisión), salvo que el tribunal determine que el delito no conlleva infamia (kalón). Los altos cargos (jueces, oficiales superiores, altos funcionarios y otros) deben renunciar en los plazos legales. Según el artículo 7A, una lista o candidato queda excluido por negar la existencia de Israel como Estado judío y democrático, por incitación al racismo o por apoyo a la lucha armada contra Israel; excluir a un candidato requiere la aprobación del Tribunal Supremo."
      fr: "Un citoyen israélien de 21 ans et plus le jour du dépôt des listes, avec des restrictions : une personne condamnée à plus de trois mois de prison ferme est inéligible pendant sept ans après avoir purgé sa peine (14 ans si une infraction grave de terrorisme ou de sécurité a entraîné plus de sept ans de prison), sauf décision constatant l’absence d’infamie. Les hauts responsables (juges, officiers supérieurs, hauts fonctionnaires et autres) doivent démissionner dans les délais légaux. En vertu de l’article 7A, une liste ou un candidat est exclu pour négation de l’existence d’Israël comme État juif et démocratique, incitation au racisme ou soutien à la lutte armée contre Israël ; l’exclusion d’un candidat requiert l’approbation de la Cour suprême."
    status: confirmed
    sources:
      - url: "https://m.knesset.gov.il/EN/activity/documents/BasicLawsPDF/BasicLawTheKnesset.pdf"
        title: "Basic Law: The Knesset (arts. 6, 7, 7A)"
        publisher: "The Knesset"
  - key: election-day
    label: { he: "יום הבחירות", en: "Election day", ar: "يوم الانتخابات", ru: "День выборов", es: "Día de las elecciones", fr: "Jour des élections" }
    detail:
      he: "יום הבחירות הוא יום שבתון, אך התחבורה ושירותים ציבוריים פועלים כסדרם. הקלפיות פתוחות בדרך כלל 7:00–22:00 (ביישובים קטנים 8:00–20:00), ומי שבתור בשעת הסגירה מצביע."
      en: "Election day is a public day of rest, but transport and public services operate. Polls are generally open 7:00–22:00 (8:00–20:00 in small communities), and anyone in line at closing still votes."
      ar: "يوم الانتخابات يوم عطلة رسمية، لكن المواصلات والخدمات العامة تعمل. تفتح صناديق الاقتراع عادةً بين 7:00 و22:00 (بين 8:00 و20:00 في البلدات الصغيرة)، ومن يكون في الطابور عند الإغلاق يصوّت."
      ru: "День выборов — официальный выходной, но транспорт и общественные службы работают. Участки обычно открыты с 7:00 до 22:00 (в небольших населённых пунктах — с 8:00 до 20:00), и все, кто стоит в очереди на момент закрытия, голосуют."
      es: "El día de las elecciones es festivo, pero el transporte y los servicios públicos funcionan. Los centros de votación abren en general de 7:00 a 22:00 (de 8:00 a 20:00 en localidades pequeñas), y quien esté en la fila al cierre vota igualmente."
      fr: "Le jour des élections est férié, mais les transports et les services publics fonctionnent. Les bureaux sont en général ouverts de 7 h à 22 h (de 8 h à 20 h dans les petites localités), et quiconque fait la queue à la fermeture peut encore voter."
    status: confirmed
    sources:
      - url: "https://m.knesset.gov.il/EN/activity/documents/BasicLawsPDF/BasicLawTheKnesset.pdf"
        title: "Basic Law: The Knesset (art. 10)"
        publisher: "The Knesset"
  - key: government-formation
    label: { he: "הרכבת ממשלה אחרי הבחירות", en: "Forming a government", ar: "تشكيل الحكومة", ru: "Формирование правительства", es: "Formación del Gobierno", fr: "Formation du gouvernement" }
    detail:
      he: "הנשיא מטיל את הרכבת הממשלה על חבר כנסת בתוך שבעה ימים מפרסום התוצאות, לאחר התייעצות עם הסיעות. למוטל 28 ימים בתוספת עד 14; אם נכשל — חבר כנסת אחר (28 ימים), ואז רוב חברי הכנסת רשאים לבקש הטלה על חבר מסוים (14 ימים). מוצו השלבים — הכנסת מתפזרת ונערכות בחירות חוזרות."
      en: "Within seven days of the results, after consulting the factions, the President tasks an MK with forming a government: 28 days plus up to 14 more; failing that, another MK (28 days), then a majority of MKs may request a specific member (14 days). If all stages fail, the Knesset dissolves and new elections are held."
      ar: "خلال سبعة أيام من صدور النتائج، وبعد التشاور مع الكتل، يكلّف رئيس الدولة عضو كنيست بتشكيل الحكومة: 28 يومًا وحتى 14 يومًا إضافيًا؛ وإن فشل، يُكلَّف عضو آخر (28 يومًا)، ثم يمكن لأغلبية أعضاء الكنيست أن تطلب تكليف عضو بعينه (14 يومًا). إذا فشلت كل المراحل، يُحلّ الكنيست وتُجرى انتخابات جديدة."
      ru: "В течение семи дней после публикации результатов, посоветовавшись с фракциями, президент поручает одному из депутатов сформировать правительство: 28 дней и ещё до 14 дней; если не получилось — другому депутату (28 дней), затем большинство депутатов может попросить поручить это конкретному депутату (14 дней). Если все этапы провалились, Кнессет распускается и назначаются новые выборы."
      es: "En los siete días siguientes a los resultados, tras consultar a las facciones, el presidente del Estado encarga a un diputado formar Gobierno: 28 días más hasta 14 adicionales; si fracasa, otro diputado (28 días), y después una mayoría de diputados puede pedir que el encargo recaiga en un diputado concreto (14 días). Si fallan todas las etapas, la Knéset se disuelve y se celebran nuevas elecciones."
      fr: "Dans les sept jours suivant les résultats, après consultation des factions, le président de l’État charge un député de former un gouvernement : 28 jours, prolongeables de 14 jours au plus ; en cas d’échec, un autre député (28 jours), puis une majorité de députés peut demander que la tâche soit confiée à un député précis (14 jours). Si toutes les étapes échouent, la Knesset se dissout et de nouvelles élections ont lieu."
    status: confirmed
    sources:
      - url: "https://m.knesset.gov.il/EN/activity/documents/BasicLawsPDF/BasicLawTheGovernment.pdf"
        title: "Basic Law: The Government (arts. 7–11)"
        publisher: "The Knesset"
  - key: campaign-finance
    label: { he: "מימון ופיקוח", en: "Financing & oversight", ar: "التمويل والرقابة", ru: "Финансирование и надзор", es: "Financiación y supervisión", fr: "Financement et contrôle" }
    detail:
      he: "מימון מפלגות ובחירות מוסדר בעיקר בחוק מימון מפלגות התשל\"ג-1973; מבקר המדינה מפקח, מפרסם דוחות ורשאי לחייב החזר כספים. תעמולת הבחירות מוסדרת בחוק דרכי תעמולה התשי\"ט-1959, שאכיפתו בידי יו\"ר ועדת הבחירות."
      en: "Party and campaign financing are governed mainly by the Political Parties (Financing) Law, 1973; the State Comptroller oversees, publishes reports and can order repayment. Campaign propaganda is governed by the Elections (Modes of Propaganda) Law, 1959, enforced by the CEC chair."
      ar: "يُنظَّم تمويل الأحزاب والحملات أساسًا بموجب قانون تمويل الأحزاب، 1973؛ ويراقب مراقب الدولة وينشر تقارير ويمكنه إلزام الأحزاب بإعادة الأموال. وتُنظَّم الدعاية الانتخابية بموجب قانون الانتخابات (أساليب الدعاية)، 1959، الذي يطبّقه رئيس لجنة الانتخابات."
      ru: "Финансирование партий и кампаний регулируется в основном Законом о финансировании партий 1973 года; государственный контролёр осуществляет надзор, публикует отчёты и может обязать вернуть средства. Предвыборная агитация регулируется Законом о выборах (способы агитации) 1959 года, за соблюдением которого следит председатель ЦИК."
      es: "La financiación de partidos y campañas se rige sobre todo por la Ley de Financiación de Partidos de 1973; el Contralor del Estado supervisa, publica informes y puede ordenar devoluciones. La propaganda electoral se rige por la Ley de Modos de Propaganda Electoral de 1959, aplicada por el presidente de la Comisión Electoral."
      fr: "Le financement des partis et des campagnes est régi principalement par la loi de 1973 sur le financement des partis ; le Contrôleur de l’État supervise, publie des rapports et peut ordonner des remboursements. La propagande électorale est régie par la loi de 1959 sur les modes de propagande, appliquée par le président de la Commission électorale."
    status: confirmed
    sources:
      - url: "https://main.knesset.gov.il/EN/activity/mmm/me00636.pdf"
        title: "Party Financing and Elections Financing in Israel (Knesset RIC)"
        publisher: "The Knesset"

stats:
