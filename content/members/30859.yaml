  - kind: negative
    category: controversy
    date: "2026-04-08"
    title:
      he: 'ציוצים נגד הנשיא טראמפ — "דונלד, יצאת ברווז!" ו-"Don''t quack" — וביקורת מחברי כנסת'
      en: 'Tweets mocking President Trump — "Donald, you came out a duck!" and "Don''t quack" — drew criticism from fellow MKs'
    description:
      he: 'ב-8 באפריל 2026, לאחר שהנשיא האמריקני דונלד טראמפ הודיע על הפסקת אש, כתב פוגל ברשת X: "דונלד, יצאת ברווז!". ב-12 באפריל, על רקע הצהרות טראמפ בעניין מצר הורמוז, צייץ באנגלית: "Donald, if you have to shoot, shoot. Don''t quack". ח"כ מירב בן ארי הגיבה: "אתה מבייש כל אזרח במדינה", וח"כ גלעד קריב שאל בלעג מה יש לו ולעוזריו נגד ברווזים.'
      en: 'On 8 April 2026, after US President Donald Trump announced a ceasefire, Fogel wrote on X: "Donald, you came out a duck!" (a Hebrew idiom for backing down). On 12 April, amid Trump''s statements on the Strait of Hormuz, he tweeted: "Donald, if you have to shoot, shoot. Don''t quack." MK Meirav Ben-Ari responded "you are embarrassing every citizen of the country", and MK Gilad Kariv mockingly asked what he and his advisers had against ducks.'
    sources:
