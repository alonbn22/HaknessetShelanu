        publisher: Knesset (official)
  - kind: negative
    category: investigation
    status: ongoing
    date: 2024-06-10
    title:
      he: חקירת משטרה במשרד התחבורה (פרשת רמזור)
      en: Police investigation into the Transport Ministry ('Traffic Light' affair)
      ar: تحقيق للشرطة في وزارة المواصلات (قضية «إشارة المرور»)
      ru: Полицейское расследование в министерстве транспорта (дело «Светофор»)
    description:
      he: ביוני 2024 פתחה יחידת להב 433 בחקירה פלילית בחשד להעדפה פוליטית בהקצאת משאבי משרד התחבורה ("שיטת הרמזור"), בעקבות תחקיר "המקור" בערוץ 13. בפברואר 2026 הודיעה המשטרה כי החקירה הסתיימה מבלי שרגב זומנה לחקירה, והתיק הועבר לפרקליטות המדינה להחלטה; נכון למועד הבדיקה האחרונה לא פורסמה החלטת הפרקליטות. רגב מכחישה את החשדות וכינתה את התחקיר "מפוברק".
      en: In June 2024, the Israel Police Lahav 433 unit opened a criminal investigation into alleged politically based allocation of Transport Ministry resources (the "traffic light" method), following a Channel 13 HaMakor investigative report. In February 2026, police announced the investigation had concluded without Regev being questioned, and the file was transferred to the State Attorney's Office for a decision; as of the last review no prosecution decision had been published. Regev denies the allegations and has called the report fabricated.
      ar: في يونيو 2024 فتحت وحدة "لاهف 433" في الشرطة الإسرائيلية تحقيقًا جنائيًا في شبهات تخصيص موارد وزارة المواصلات على أساس سياسي («طريقة إشارة المرور»)، في أعقاب تحقيق صحفي لبرنامج "همكور" في القناة 13. في فبراير 2026 أعلنت الشرطة انتهاء التحقيق دون استدعاء ريغيف للاستجواب، وأُحيل الملف إلى النيابة العامة لاتخاذ قرار؛ وحتى آخر مراجعة لم يُنشر قرار النيابة. تنفي ريغيف الشبهات ووصفت التحقيق الصحفي بأنه ملفّق.
      ru: В июне 2024 года подразделение полиции «Лахав 433» начало уголовное расследование по подозрению в политически мотивированном распределении ресурсов министерства транспорта («метод светофора») после журналистского расследования программы «ха-Макор» 13-го канала. В феврале 2026 года полиция объявила о завершении расследования без допроса Регев; дело передано в государственную прокуратуру для принятия решения, и на момент последней проверки решение прокуратуры не публиковалось. Регев отрицает подозрения и назвала расследование сфабрикованным.
    sources:
