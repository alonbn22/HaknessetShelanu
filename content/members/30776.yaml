      he: "חבר כנסת מטעם יש עתיד ומרכז האופוזיציה בוועדת הכספים"
      en: "Member of Knesset for Yesh Atid and opposition coordinator on the Finance Committee"
    description:
      he: "בליאק נכנס לכנסת ה-23 ב-5 בינואר 2021 מטעם יש עתיד, ונבחר מחדש לכנסת ה-24 ולכנסת ה-25 (במקום ה-15 ברשימה). בכנסת ה-24 שימש מרכז הקואליציה בוועדת הכספים, ובכנסת ה-25 הוא מרכז האופוזיציה בוועדה ועוסק בתקציב המדינה ובפיקוח על העברות תקציביות."
      en: "Beliak entered the 23rd Knesset on 5 January 2021 for Yesh Atid and was re-elected to the 24th and 25th Knessets (15th on the list). He was the coalition coordinator on the Finance Committee in the 24th Knesset and is the opposition coordinator on the committee in the 25th, focusing on the state budget and oversight of budget transfers."
    date: "2021-01-05"
