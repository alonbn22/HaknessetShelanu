      en: "Chairman of the Israel Swimming Association and Olympic Committee member"
    description:
      he: "לפני כניסתו לפוליטיקה עסק דוידסון בחינוך גופני ובשחייה כמורה ומאמן. ביוני 2016 נבחר ליושב ראש איגוד השחייה בישראל, ומספטמבר אותה שנה החל לכהן כחבר בהנהלת הוועד האולימפי בישראל."
      en: "Before entering politics, Davidson worked in physical education and swimming as a teacher and coach. In June 2016 he was elected chairman of the Israel Swimming Association, and from September that year he began serving as a member of the board of the Olympic Committee of Israel."
