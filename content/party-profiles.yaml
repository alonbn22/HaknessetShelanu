      - date: "2025-01-21"
        text:
          he: "ח\"כ אלמוג כהן היה היחיד בסיעה שלא הגיש מכתב התפטרות; הוא אמר שאין בכוונתו לעזוב את עוצמה יהודית ולא השיב אם הוא רואה עצמו חלק מהקואליציה."
          en: "MK Almog Cohen was the only faction member not to hand in a resignation letter; he said he had no plans to leave Otzma Yehudit and did not answer whether he still considered himself part of the coalition."
          ar: "كان عضو الكنيست ألموغ كوهين العضو الوحيد في الكتلة الذي لم يقدّم كتاب استقالة؛ وقال إنه لا ينوي مغادرة عوتسما يهوديت، ولم يُجب عمّا إذا كان يعدّ نفسه جزءًا من الائتلاف."
          ru: "Депутат Альмог Коэн был единственным во фракции, кто не подал прошение об отставке; он сказал, что не собирается покидать «Оцма Иегудит», и не ответил, считает ли себя частью коалиции."
          es: "El diputado Almog Cohen fue el único miembro de la facción que no entregó carta de renuncia; dijo que no tenía previsto dejar Otzma Yehudit y no respondió si seguía considerándose parte de la coalición."
          fr: "Le député Almog Cohen a été le seul membre de la faction à ne pas remettre de lettre de démission ; il a déclaré n’avoir aucune intention de quitter Otzma Yehoudit et n’a pas répondu à la question de savoir s’il se considérait encore comme membre de la coalition."
        sources:
          - { url: "https://www.timesofisrael.com/his-far-right-party-now-in-the-opposition-rebel-mk-almog-cohen-is-in-political-limbo/", title: "Report on MK Almog Cohen’s position after Otzma Yehudit left the coalition (2025-01-21)", publisher: "The Times of Israel" }
      - date: "2025-03-19"
        text:
          he: "עוצמה יהודית שבה לממשלה עם חידוש הלחימה בעזה: הממשלה אישרה את מינוי בן גביר מחדש לשר לביטחון לאומי, והכנסת אישרה ברוב של 65 מול 46 את חזרת המפלגה ואת מינוי בן גביר, אליהו ווסרלאוף (כהונותיהם נרשמו מ-19 במרץ 2025)."
          en: "Otzma Yehudit returned to the government as fighting in Gaza resumed: the cabinet approved Ben Gvir’s reappointment as national security minister and the Knesset ratified the party’s return and the reappointment of Ben Gvir, Eliyahu and Wasserlauf by 65 to 46 (their terms are recorded from 19 March 2025)."
          ar: "عادت عوتسما يهوديت إلى الحكومة مع استئناف القتال في غزة: صادقت الحكومة على إعادة تعيين بن غفير وزيرًا للأمن القومي، وصادق الكنيست بأغلبية 65 مقابل 46 على عودة الحزب وتعيين بن غفير وإلياهو وفاسرلاوف (سُجّلت ولاياتهم اعتبارًا من 19 آذار/مارس 2025)."
          ru: "«Оцма Иегудит» вернулась в правительство с возобновлением боевых действий в Газе: правительство одобрило повторное назначение Бен-Гвира министром национальной безопасности, а Кнессет 65 голосами против 46 утвердил возвращение партии и назначение Бен-Гвира, Элияху и Вассерлауфа (их полномочия записаны с 19 марта 2025 года)."
          es: "Otzma Yehudit volvió al Gobierno al reanudarse los combates en Gaza: el Gobierno aprobó el nuevo nombramiento de Ben Gvir como ministro de Seguridad Nacional y la Knéset ratificó el regreso del partido y el nuevo nombramiento de Ben Gvir, Eliyahu y Wasserlauf por 65 votos a 46 (sus mandatos constan desde el 19 de marzo de 2025)."
          fr: "Otzma Yehoudit est revenu au gouvernement avec la reprise des combats à Gaza : le gouvernement a approuvé la nouvelle nomination de Ben Gvir comme ministre de la Sécurité nationale et la Knesset a ratifié le retour du parti et la nouvelle nomination de Ben Gvir, Eliyahu et Wasserlauf par 65 voix contre 46 (leurs mandats sont enregistrés à partir du 19 mars 2025)."
        sources:
          - { url: "https://www.timesofisrael.com/ben-gvir-reappointed-police-minister-as-knesset-okays-his-partys-return-to-government/", title: "Ben Gvir reappointed police minister as Knesset okays his party's return to government (2025-03-20)", publisher: "The Times of Israel" }
