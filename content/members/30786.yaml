    title:
      he: "אישי ציבור יהודים החרימו את כנס המאבק באנטישמיות שארגן בשל הזמנת פוליטיקאים מהימין הקיצוני באירופה"
      en: "Jewish public figures boycotted his antisemitism conference over invitations to European far-right politicians"
    description:
      he: "במרץ 2025 ארגן משרד התפוצות בראשות שיקלי כנס בינלאומי למאבק באנטישמיות בירושלים, אליו הוזמנו פוליטיקאים ממפלגות ימין קיצוני באירופה, ובהם ז'ורדן ברדלה מהאיחוד הלאומי הצרפתי ונציגי Vox הספרדית. בעקבות זאת ביטלו את השתתפותם מספר אישי ציבור יהודים ובהם הממונה על המאבק באנטישמיות בגרמניה פליקס קליין. שיקלי הגן על ההזמנות ואמר כי האנטישמיות באירופה גוברת בשל הגירה מוסלמית וכי מפלגות אלה הן בעלות ברית במאבק בה."
      en: "In March 2025 the Diaspora Affairs Ministry under Chikli organized an International Conference on Combating Antisemitism in Jerusalem, to which politicians from European far-right parties were invited, including Jordan Bardella of France's National Rally and representatives of Spain's Vox. Several Jewish public figures, including Germany's antisemitism commissioner Felix Klein, withdrew in response. Chikli defended the invitations, saying antisemitism in Europe is growing because of Muslim immigration and that these parties are allies in fighting it."
    date: "2025-03-28"
    sources:
