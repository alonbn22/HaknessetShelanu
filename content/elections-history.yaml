  - knesset: 12
    date: "1988-11-01"
    turnout: 79.7
    winner: { he: "הליכוד", en: "Likud", ar: "الليكود", ru: "Ликуд", es: "Likud", fr: "Likoud" }
    winnerSeats: 40
    pm: { he: "יצחק שמיר", en: "Yitzhak Shamir", ar: "يتسحاق شامير", ru: "Ицхак Шамир", es: "Isaac Shamir", fr: "Yitzhak Shamir" }
    summary:
      he: "תחילה ממשלת אחדות ואז ממשלה צרה בראשות שמיר. הקדנציה כללה את מלחמת המפרץ הראשונה ותחילת גל העלייה הגדול מברית המועצות."
      en: "First a unity government, then a narrow government under Shamir. The term spanned the First Gulf War and the start of the great wave of Soviet immigration."
      ar: "في البداية حكومة وحدة ثم حكومة ضيقة برئاسة شامير. وشملت الولاية حرب الخليج (1991) وبداية موجة الهجرة الكبرى من الاتحاد السوفييتي."
      ru: "Сначала правительство единства, затем узкое правительство Шамира. На эту каденцию пришлись война в Персидском заливе и начало большой волны алии из СССР."
      es: "Primero un gobierno de unidad, después un gobierno estrecho con Shamir. La legislatura abarcó la Primera Guerra del Golfo y el inicio de la gran ola de inmigración soviética."
      fr: "D’abord un gouvernement d’union, puis un gouvernement à majorité étroite sous Shamir. La législature a couvert la première guerre du Golfe et le début de la grande vague d’immigration soviétique."
    events:
      - kind: bad
        date: "1991-01-17"
        text: { he: "מלחמת המפרץ — ירי טילי סקאד על ישראל.", en: "The Gulf War — Scud missiles fired at Israel.", ar: "حرب الخليج — إطلاق صواريخ سكود على إسرائيل.", ru: "Война в Персидском заливе — обстрел Израиля ракетами «Скад».", es: "La Guerra del Golfo — misiles Scud lanzados contra Israel.", fr: "La guerre du Golfe — des missiles Scud tirés sur Israël." }
      - kind: neutral
        date: "1991-10-30"
        text: { he: "ועידת מדריד וגל עלייה המוני מברית המועצות.", en: "The Madrid Conference and mass immigration from the USSR.", ar: "مؤتمر مدريد وهجرة جماعية من الاتحاد السوفييتي.", ru: "Мадридская конференция и массовая алия из СССР.", es: "La Conferencia de Madrid y la inmigración masiva desde la URSS.", fr: "La conférence de Madrid et l’immigration massive depuis l’URSS." }
      - kind: bad
        date: "1987-12-09"
        text: { he: "האינתיפאדה הראשונה (שהחלה ב-1987) נמשכה לאורך הקדנציה.", en: "The First Intifada (begun in 1987) continued throughout the term.", ar: "استمرت الانتفاضة الأولى (التي بدأت عام 1987) طوال الولاية.", ru: "Первая интифада (начавшаяся в 1987 году) продолжалась на протяжении всей каденции.", es: "La Primera Intifada (iniciada en 1987) continuó durante toda la legislatura.", fr: "La Première Intifada (commencée en 1987) s’est poursuivie pendant toute la législature." }
      - kind: good
        date: "1991-05-24"
        text: { he: "מבצע שלמה — מבצע אווירי להעלאת יהודי אתיופיה.", en: "Operation Solomon — the airlift of Ethiopian Jews.", ar: "عملية «سليمان» — جسر جوي لنقل يهود إثيوبيا إلى إسرائيل.", ru: "Операция «Соломон» — воздушный мост для репатриации евреев Эфиопии.", es: "La operación Salomón — el puente aéreo de los judíos etíopes.", fr: "L’opération Salomon — le pont aérien des Juifs d’Éthiopie." }
    ended: { he: "הכנסת פיזרה את עצמה בחוק — בחירות מוקדמות ביוני 1992.", en: "Dissolved itself by law — early elections in June 1992.", ar: "حلّ الكنيست نفسه بقانون — انتخابات مبكرة في حزيران/يونيو 1992.", ru: "Самораспустился законом — досрочные выборы в июне 1992 года.", es: "Se disolvió por ley — elecciones anticipadas en junio de 1992.", fr: "S’est dissoute par une loi — élections anticipées en juin 1992." }
    sources:
      - { url: "https://main.knesset.gov.il/en/about/history/Pages/KnessetHistory.aspx?kns=12", title: "12th Knesset: results of the elections (1 November 1988) and its governments", publisher: "הכנסת" }
      - { url: "https://www.gov.il/apps/elections/elections-knesset-19/heb/history/PercentVotes.html", title: "אחוז המצביעים בבחירות קודמות, הכנסת ה-1 עד ה-18 (אתר ועדת הבחירות המרכזית לכנסת ה-19)", publisher: "ועדת הבחירות המרכזית (gov.il)" }
      - { url: "https://en.idi.org.il/articles/38887", title: "Dissolving the Knesset: A Historical Survey (Chen Friedberg and Assaf Shapira, 18 May 2022)", publisher: "המכון הישראלי לדמוקרטיה" }
  - knesset: 11
    date: "1984-07-23"
    turnout: 78.8
    winner: { he: "המערך", en: "Alignment", ar: "المعراخ", ru: "«Маарах»", es: "Alineamiento (Maarach)", fr: "Alignement (Maarakh)" }
    winnerSeats: 44
    pm: { he: "שמעון פרס ← יצחק שמיר (רוטציה)", en: "Shimon Peres → Yitzhak Shamir (rotation)", ar: "شمعون بيرس ← يتسحاق شامير (تناوب)", ru: "Шимон Перес → Ицхак Шамир (ротация)", es: "Shimon Peres → Isaac Shamir (rotación)", fr: "Shimon Peres → Yitzhak Shamir (rotation)" }
    summary:
      he: "ממשלת אחדות לאומית עם רוטציה בין פרס (המערך) לשמיר (הליכוד). הצליחה לבלום את האינפלציה הדוהרת ולצמצם את הנוכחות בלבנון."
      en: "A national-unity government with a rotation between Peres (Alignment) and Shamir (Likud). It tamed runaway inflation and reduced the presence in Lebanon."
      ar: "حكومة وحدة وطنية مع تناوب بين بيرس (المعراخ) وشامير (الليكود). ونجحت في كبح التضخم الجامح وتقليص الوجود في لبنان."
      ru: "Правительство национального единства с ротацией между Пересом («Маарах») и Шамиром (Ликуд). Оно обуздало галопирующую инфляцию и сократило присутствие в Ливане."
      es: "Un gobierno de unidad nacional con rotación entre Peres (Alineamiento) y Shamir (Likud). Domó la inflación desbocada y redujo la presencia en el Líbano."
      fr: "Un gouvernement d’union nationale avec une rotation entre Peres (Alignement) et Shamir (Likoud). Il a maîtrisé une inflation galopante et réduit la présence au Liban."
    events:
      - kind: neutral
        date: "1985-07-01"
        text: { he: "התוכנית הכלכלית לייצוב — בלימת ההיפר-אינפלציה.", en: "The Economic Stabilization Plan — halting hyperinflation.", ar: "خطة الاستقرار الاقتصادي — كبح التضخم المفرط.", ru: "Программа экономической стабилизации — остановка гиперинфляции.", es: "El Plan de Estabilización Económica — el freno a la hiperinflación.", fr: "Le plan de stabilisation économique — l’arrêt de l’hyperinflation." }
      - kind: good
        date: "1984-11-21"
        text: { he: "מבצע משה — עליית יהודי אתיופיה.", en: "Operation Moses — the immigration of Ethiopian Jews.", ar: "عملية «موسى» — هجرة يهود إثيوبيا.", ru: "Операция «Моисей» — алия евреев Эфиопии.", es: "La operación Moisés — la inmigración de los judíos etíopes.", fr: "L’opération Moïse — l’immigration des Juifs d’Éthiopie." }
      - kind: bad
        date: "1987-12-09"
        text: { he: "פרוץ האינתיפאדה הראשונה בשטחים בדצמבר 1987.", en: "The outbreak of the First Intifada in the territories in December 1987.", ar: "اندلاع الانتفاضة الأولى في الضفة الغربية وقطاع غزة في كانون الأول/ديسمبر 1987.", ru: "Начало Первой интифады на территориях в декабре 1987 года.", es: "El estallido de la Primera Intifada en los territorios en diciembre de 1987.", fr: "Le déclenchement de la Première Intifada dans les territoires en décembre 1987." }
    ended: { he: "השלימה כהונה — בחירות 1988.", en: "Served its term — 1988 election.", ar: "أتمّ ولايته — انتخابات 1988.", ru: "Проработал полный срок — выборы 1988 года.", es: "Cumplió su legislatura — elecciones de 1988.", fr: "A accompli sa législature — élection de 1988." }
    sources:
      - { url: "https://main.knesset.gov.il/en/about/history/Pages/KnessetHistory.aspx?kns=11", title: "11th Knesset: results of the elections (23 July 1984) and its governments", publisher: "הכנסת" }
      - { url: "https://www.gov.il/apps/elections/elections-knesset-19/heb/history/PercentVotes.html", title: "אחוז המצביעים בבחירות קודמות, הכנסת ה-1 עד ה-18 (אתר ועדת הבחירות המרכזית לכנסת ה-19)", publisher: "ועדת הבחירות המרכזית (gov.il)" }
  - knesset: 10
    date: "1981-06-30"
    turnout: 78.5
    winner: { he: "הליכוד", en: "Likud", ar: "الليكود", ru: "Ликуд", es: "Likud", fr: "Likoud" }
    winnerSeats: 48
    pm: { he: "מנחם בגין", en: "Menachem Begin", ar: "مناحيم بيغن", ru: "Менахем Бегин", es: "Menájem Beguin", fr: "Menahem Begin" }
    summary:
      he: "ממשלתו השנייה של בגין. כללה את השלמת הנסיגה מסיני ואת מלחמת לבנון הראשונה."
      en: "Begin's second government. It included the completion of the Sinai withdrawal and the First Lebanon War."
      ar: "حكومة بيغن الثانية. وشملت استكمال الانسحاب من سيناء وحرب لبنان الأولى."
      ru: "Второе правительство Бегина. На него пришлись завершение ухода из Синая и Первая ливанская война."
      es: "El segundo gobierno de Beguin. Incluyó la finalización de la retirada del Sinaí y la Primera Guerra del Líbano."
      fr: "Le deuxième gouvernement Begin. Il a connu l’achèvement du retrait du Sinaï et la Première Guerre du Liban."
    events:
      - kind: bad
        date: "1982-06-06"
        text: { he: "מלחמת לבנון הראשונה.", en: "The First Lebanon War.", ar: "حرب لبنان الأولى.", ru: "Первая ливанская война.", es: "La Primera Guerra del Líbano.", fr: "La Première Guerre du Liban." }
      - kind: neutral
        date: "1981-12-14"
        text: { he: "החלת החוק הישראלי על רמת הגולן.", en: "Application of Israeli law to the Golan Heights.", ar: "تطبيق القانون الإسرائيلي على هضبة الجولان.", ru: "Распространение израильского законодательства на Голанские высоты.", es: "Aplicación de la ley israelí a los Altos del Golán.", fr: "Application de la loi israélienne au plateau du Golan." }
      - kind: bad
        date: "1982-09-16"
        text: { he: "טבח סברה ושתילה וועדת כהן בעקבותיו.", en: "The Sabra and Shatila massacre and the ensuing Kahan Commission.", ar: "مجزرة صبرا وشاتيلا ولجنة كاهان التي أعقبتها.", ru: "Резня в Сабре и Шатиле и созданная после неё комиссия Кахана.", es: "La masacre de Sabra y Chatila y la posterior Comisión Kahan.", fr: "Le massacre de Sabra et Chatila et la commission Kahan qui a suivi." }
    ended: { he: "בגין התפטר ב-1983 (שמיר החליפו) — בחירות מוקדמות 1984.", en: "Begin resigned in 1983 (Shamir succeeded) — early elections in 1984.", ar: "استقال بيغن في 1983 (وخلفه شامير) — انتخابات مبكرة في 1984.", ru: "Бегин ушёл в отставку в 1983 году (его сменил Шамир) — досрочные выборы в 1984 году.", es: "Beguin renunció en 1983 (lo sucedió Shamir) — elecciones anticipadas en 1984.", fr: "Begin a démissionné en 1983 (Shamir lui a succédé) — élections anticipées en 1984." }
    sources:
      - { url: "https://main.knesset.gov.il/en/about/history/Pages/KnessetHistory.aspx?kns=10", title: "10th Knesset: results of the elections (30 June 1981) and its governments", publisher: "הכנסת" }
