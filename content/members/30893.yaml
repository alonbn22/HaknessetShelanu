    title:
      he: חצה לסוריה כדי לסייע בהשבת צעירים דרוזים לישראל
      en: Crossed into Syria to help bring Israeli Druze youths back
    description:
      he: >-
        ב-16 ביולי 2025, לאחר שאלפי צעירים דרוזים חצו מישראל לסוריה על רקע הלחימה
        בדרוזים בסוריה, חצו עבד וח"כ חמד עמאר (ישראל ביתנו) את הגבול לשטח סוריה,
        לפי הדיווחים בליווי כוחות הביטחון, במטרה לשכנע את הצעירים לשוב לישראל.
        עבד אמר כי הוא "בקשר רציף עם ראש הממשלה" בעניין.
      en: >-
        On 16 July 2025, after thousands of young Israeli Druze had crossed from
        Israel into Syria amid the fighting against Druze in Syria, Abed and MK
        Hamad Amar (Yisrael Beytenu) crossed the border into Syrian territory,
        reportedly accompanied by security forces, to persuade the youths to
        return to Israel. Abed said he was "in continuous contact with the Prime
        Minister" on the matter.
    date: "2025-07-16"
