  - id: 1095 # Shas
    verified: "2026-09-19"
    updates:
      - date: "2025-07-16"
        text:
          he: "מועצת חכמי התורה של ש\"ס הורתה לשרי המפלגה להתפטר מהממשלה בשל אי-חקיקת חוק הפטור מגיוס לבני ישיבות; ש\"ס נשארה בקואליציה והודיעה שלא תצטרף לאופוזיציה כדי להפיל את הממשלה."
          en: "Shas’s Council of Torah Sages ordered the party’s ministers to resign from the government over the failure to pass a draft-exemption law for yeshiva students; Shas stayed in the coalition and said it would not join the opposition to topple the government."
        sources:
          - { url: "https://www.ynet.co.il/news/article/rknlxehlgg", title: "המשבר הפוליטי: ש\"ס פורשת מהממשלה (2025-07-16)", publisher: "Ynet" }
          - { url: "https://www.jpost.com/israel-news/article-861246", title: "Shas spiritual leaders order party members to quit government (2025-07-16)", publisher: "The Jerusalem Post" }
      - date: "2025-07-17"
        text:
          he: "שרי ש\"ס הגישו את התפטרותם: משה ארבל (פנים), יעקב מרגי (רווחה), מיכאל מלכיאלי (שירותי דת), אוריאל בוסו (בריאות) ויואב בן צור (עבודה), וכן סגני השרים חיים ביטון ומשה אבוטבול; כהונת ארבל כשר הפנים הסתיימה ב-22 ביולי 2025."
          en: "Shas’s ministers filed their resignations: Moshe Arbel (Interior), Yaakov Margi (Welfare), Michael Malkieli (Religious Services), Uriel Busso (Health) and Yoav Ben Tzur (Labor), plus deputy ministers Haim Biton and Moshe Abutbul; Arbel’s term as interior minister ended on 22 July 2025."
        sources:
          - { url: "https://www.timesofisrael.com/liveblog_entry/shas-ministers-file-resignations-as-party-withdraws-from-government/", title: "Shas ministers file resignations as party withdraws from government (2025-07-17)", publisher: "The Times of Israel" }
          - { url: "https://www.ynet.co.il/news/article/rknlxehlgg", title: "המשבר הפוליטי: ש\"ס פורשת מהממשלה (2025-07-16)", publisher: "Ynet" }
          - { url: "https://knesset.gov.il/OdataV4/ParliamentInfo/KNS_PersonToPosition?$filter=PersonID%20eq%2030660%20and%20KnessetNum%20eq%2025", title: "KNS_PersonToPosition — Moshe Arbel (PersonID 30660), Knesset 25 (2026-09-19)", publisher: "Knesset OData" }
      - date: "2025-07-20"
        text:
          he: "בעקבות ההתפטרות מהממשלה שבו לכנסת לפי החוק הנורבגי יעקב מרגי, יואב בן צור וחיים ביטון; חדלו לכהן אברהם בצלאל, סימיון מושיאשוילי וארז מלול."
          en: "Following the ministers’ resignations, Yaakov Margi, Yoav Ben Tzur and Haim Biton returned to the Knesset under the Norwegian law; Avraham Betzalel, Simion Mushiashvili and Erez Malul ceased to serve."
        sources:
          - { url: "https://knesset.gov.il/OdataV4/ParliamentInfo/KNS_PersonToPosition?$filter=FactionID%20eq%201095%20and%20KnessetNum%20eq%2025", title: "KNS_PersonToPosition — FactionID 1095, Knesset 25 (member records with start/finish dates) (2026-09-19)", publisher: "Knesset OData" }
      - date: "2025-07-29"
        text:
          he: "הממשלה העבירה את תיקי ש\"ס לשני שרי ליכוד כממלאי מקום: יריב לוין — פנים, שירותי דת ועבודה; חיים כץ — רווחה ובריאות. ב-24 בנובמבר 2025 נרשמו לוין כשר העבודה, שירותי הדת וירושלים ומסורת ישראל וכץ כשר הבריאות והרווחה; משרד הפנים נותר ללא שר."
          en: "The cabinet transferred the Shas-held portfolios to two Likud ministers in an acting capacity: Yariv Levin — Interior, Religious Services and Labor; Haim Katz — Welfare and Health. On 24 November 2025 Levin was recorded as Minister of Labor, Religious Services, and Jerusalem and Jewish Heritage, and Katz as Minister of Health and of Welfare; the Interior Ministry was left without a minister."
        sources:
          - { url: "https://www.timesofisrael.com/ministries-previously-held-by-shas-transferred-to-pair-of-likud-ministers/", title: "Ministries previously held by Shas transferred to pair of Likud ministers (2025-07-29)", publisher: "The Times of Israel" }
          - { url: "https://knesset.gov.il/OdataV4/ParliamentInfo/KNS_PersonToPosition?$filter=KnessetNum%20eq%2025%20and%20GovMinistryID%20ne%20null%20and%20IsCurrent%20eq%20true", title: "KNS_PersonToPosition — current government positions, Knesset 25 (Levin: Labor, Religious Services, Jerusalem & Heritage from 2025-11-24; Katz: Health, Welfare from 2025-11-24) (2026-09-19)", publisher: "Knesset OData" }
          - { url: "https://main.knesset.gov.il/mk/government/pages/governments.aspx?govId=37", title: "הממשלה ה-37 — הרכב הממשלה (2026-09-19)", publisher: "Knesset" }
          - { url: "https://www.timesofisrael.com/netanyahu-under-legal-duress-agrees-to-tap-interior-minister-after-year-long-vacancy/", title: "Netanyahu, under legal duress, agrees to tap interior minister after year-long vacancy (Interior vacant since Arbel’s resignation; Levin’s acting role expired October 2025) (2026-08-03)", publisher: "The Times of Israel" }
      - date: "2026-05-17"
        text:
          he: "משה ארבל, שר הפנים לשעבר, הגיש את התפטרותו מהכנסת; במכתבו לדרעי כתב שימשיך לפעול לאור ערכי תנועת ש\"ס. ב-19 במאי 2026 נכנס במקומו ארז מלול."
          en: "Former interior minister Moshe Arbel submitted his resignation from the Knesset; in his letter to Deri he wrote that he would carry on in the light of the Shas movement’s values. Erez Malul took his seat on 19 May 2026."
        sources:
          - { url: "https://www.timesofisrael.com/former-shas-minister-moshe-arbel-resigns-from-knesset-ahead-of-election/", title: "Former Shas minister Moshe Arbel resigns from Knesset; defied party line on key issues (2026-05-17)", publisher: "The Times of Israel" }
          - { url: "https://main.knesset.gov.il/mk/apps/faction/faction-lobby?KnessetID=25&FactionID=1095", title: "סיעת התאחדות הספרדים שומרי תורה — חילופי גברי: 19/05/2026 ארז מלול נכנס במקום משה ארבל (2026-09-19)", publisher: "Knesset" }
      - date: "2026-06-16"
        text:
          he: "ש\"ס ויהדות התורה החרימו יום שני ברציפות את ההצבעות במליאה בדרישה להעביר את \"חוק המעונות\" (החזרת סבסוד מעונות היום לילדי אברכים)."
          en: "Shas and United Torah Judaism boycotted Knesset votes for a second consecutive day, demanding passage of the ‘Daycare Law’ restoring daycare subsidies for the children of yeshiva students."
        sources:
          - { url: "https://www.timesofisrael.com/haredi-knesset-boycott-continues-putting-coalitions-legislative-blitz-at-risk/", title: "Haredi Knesset boycott continues, putting coalition's legislative blitz at risk (2026-06-16)", publisher: "The Times of Israel" }
      - date: "2026-07-16"
        text:
          he: "הכנסת ה-25 התפזרה בהצבעה 62–0; הבחירות נקבעו ל-27 באוקטובר 2026. דרעי איים תחילה לעכב את חוק הפיזור ולאחר מכן חזר בו."
          en: "The 25th Knesset dissolved itself by a 62–0 vote; the election was set for 27 October 2026. Deri initially threatened to hold up the dissolution bill and then backed down."
        sources:
          - { url: "https://www.timesofisrael.com/knesset-votes-on-official-dispersal-of-parliament-wrapping-up-final-legislative-blitz/", title: "Knesset officially disperses, after coalition completes its drastic legislative blitz (2026-07-17)", publisher: "The Times of Israel" }
      - date: "2026-09-08"
        text:
          he: "ש\"ס הגישה את רשימתה לכנסת ה-26 (רשימה 19, אותיות מבוקשות שס): אריה דרעי, ינון אזולאי, מיכאל מלכיאלי, יואב בן צור, חיים ביטון, דרור עמוס (יו\"ר המועצה הדתית חיפה), משה אבוטבול, אוריאל בוסו, יוסף טייב, יונתן מישרקי, יוסי אילנתנוב, ארז מלול, סימיון מושיאשוילי; משה ארבל אינו ברשימה."
          en: "Shas submitted its list for the 26th Knesset (list 19, requested letters שס): Aryeh Deri, Yinon Azulai, Michael Malkieli, Yoav Ben Tzur, Haim Biton, Dror Amos (chair of the Haifa religious council), Moshe Abutbul, Uriel Busso, Yosef Taieb, Yonatan Mishriki, Yossi Ilantanov, Erez Malul, Simion Mushiashvili; Moshe Arbel is not on the list."
        sources:
