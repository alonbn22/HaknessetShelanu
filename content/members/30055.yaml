      he: "נעצר על ידי השב\"כ ב-2005 במחאה נגד ההתנתקות ושוחרר ללא כתב אישום"
      en: "Detained by the Shin Bet in 2005 during the disengagement protests and released without charges"
    description:
      he: "ביולי 2005 נעצר סמוטריץ' עם ארבעה פעילי ימין נוספים בחשד לקשירת קשר לחסימות כבישים ופגיעה בתשתיות במסגרת המחאה נגד תוכנית ההתנתקות. הוא הוחזק כשלושה שבועות ושוחרר מבלי שהוגש נגדו כתב אישום. ב-2019 טען סגן ראש השב\"כ לשעבר יצחק אילן בכנס פוליטי כי החשד היה חמור יותר; סמוטריץ' הכחיש זאת מכל וכל ואמר כי שחרורו ללא אישום מוכיח את חפותו."
      en: "In July 2005 Smotrich was detained with four other right-wing activists on suspicion of conspiring to block roads and damage infrastructure as part of the protest against the disengagement plan. He was held for about three weeks and released without any indictment. In 2019 former Shin Bet deputy chief Yitzhak Ilan claimed at a political rally that the suspicion had been graver; Smotrich flatly denied this and said his release without charges vindicated him."
    sources:
