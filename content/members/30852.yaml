    title:
      he: קידום תוכנית ממשלתית לקליטת יוצאי אתיופיה
      en: Led a government plan for the integration of Ethiopian-Israelis
    description:
      he: ב-15 ביולי 2025 אישרה ממשלת ישראל הארכה של תוכנית "דרך חדשה" לקליטת יוצאי
        אתיופיה בהיקף של כ-214 מיליון ש"ח (כ-58 מיליון דולר), המכסה תחומי חינוך,
        תרבות, רווחה, תעסוקה, ביטחון ובריאות. לפי הדיווח, ח"כ משה סולומון, בעצמו
        יוצא אתיופיה, הוביל את קידום התוכנית לצד משרד ראש הממשלה ושר האוצר.
      en: On 15 July 2025 the Israeli government approved an extension of the "New
        Way" plan for the integration of Ethiopian immigrants, worth roughly NIS
        214 million (about $58 million), covering education, culture, welfare,
        employment, security and health. According to reporting, MK Moshe
        Solomon, himself an Ethiopian immigrant, led the effort to advance the
        plan alongside the Prime Minister's Office and the Finance Minister.
    date: 2025-07-15
    sources:
