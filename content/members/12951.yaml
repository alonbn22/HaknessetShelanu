        title: Yariv Levin
        publisher: Jewish Virtual Library
  - kind: positive
    category: achievement
    title:
      he: תפקידי הנהגה בלשכת עורכי הדין בישראל
      en: Leadership roles in the Israel Bar Association
    description:
      he: לפני כניסתו לפוליטיקה עסק לוין במשפט אזרחי-מסחרי. הוא היה ממקימי סיעת עורכי הדין הצעירים החדשה ונבחר לסגן יושב ראש לשכת עורכי הדין בישראל, תפקיד בו כיהן בשנים 2003-2005.
      en: Before entering politics, Levin practiced civil-commercial law. He co-founded the New Young Lawyers Faction and was elected Deputy Chairman (Vice Chairman) of the Israel Bar Association, a role he held in 2003-2005.
    sources:
      - url: https://en.wikipedia.org/wiki/Yariv_Levin
        title: Yariv Levin
