        title: Coalition braces for instability after Haredi ministers quit
        publisher: Ynetnews
  - kind: negative
    category: investigation
    status: ongoing
    date: 2024-08-18
    title:
      he: נחקר בחשד למעורבות בהשתקת תלונות נגד אביו
      en: Under investigation over alleged role in silencing complaints against his father
      ar: قيد التحقيق بشبهة التورط في إسكات شكاوى ضد والده
      ru: Под следствием по подозрению в причастности к сокрытию жалоб против его отца
    description:
      he: על פי דיווחי "הארץ", טסלר נחקר בחשד למעורבות בהסכם להשתקת מתלוננים שטענו כי אביו, הרב אפרים טסלר, תקף אותם מינית בעת שעמד בראש ישיבה בירושלים. ב-18 באוגוסט 2024 הורה פרקליט המדינה עמית איסמן על חידוש החקירה, לאחר שהמשטרה המליצה שלא לחקור אותו בחשד לשיבוש הליכים. טסלר הכחיש וטען כי "לדברים אין שחר". נכון ליולי 2026 לא הוגש כתב אישום וההליך פתוח, וחלה חזקת החפות.
      en: According to reporting by Haaretz, Tessler is under investigation over alleged involvement in an agreement to silence complainants who said his father, Rabbi Efraim Tessler, sexually assaulted them while heading a Jerusalem yeshiva. On 18 August 2024, State Prosecutor Amit Aisman ordered the investigation reopened after police had recommended against investigating him for obstruction. Tessler denied the allegations, saying they "have no basis." As of July 2026 no indictment has been filed, the proceeding is open, and the presumption of innocence applies.
      ar: وفقًا لتقارير صحيفة هآرتس، يخضع تسلر للتحقيق بشبهة التورط في اتفاق لإسكات مشتكين قالوا إن والده، الحاخام إفرايم تسلر، اعتدى عليهم جنسيًا أثناء ترؤسه معهدًا دينيًا في القدس. في 18 آب/أغسطس 2024، أمر المدعي العام للدولة عميت أيسمان بإعادة فتح التحقيق بعد أن أوصت الشرطة بعدم التحقيق معه بشبهة عرقلة الإجراءات. نفى تسلر الاتهامات قائلًا إنها "لا أساس لها". حتى تموز/يوليو 2026 لم تُقدَّم لائحة اتهام والإجراء مفتوح، وتنطبق قرينة البراءة.
      ru: По сообщениям газеты Haaretz, Теслер находится под следствием по подозрению в причастности к соглашению о сокрытии жалоб лиц, заявивших, что его отец, раввин Эфраим Теслер, совершал в отношении них сексуальное насилие в период, когда он возглавлял иешиву в Иерусалиме. 18 августа 2024 года государственный прокурор Амит Айсман распорядился возобновить расследование после того, как полиция рекомендовала не расследовать его по подозрению в воспрепятствовании правосудию. Теслер отверг обвинения, заявив, что они "безосновательны". По состоянию на июль 2026 года обвинительное заключение не предъявлено, производство открыто, и действует презумпция невиновности.
    sources:
