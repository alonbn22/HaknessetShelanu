  - id: arab-parties-coalition
    topic: government
    lean: left
    text:
      he: "ראוי שמפלגות ערביות יוכלו להיות שותפות בקואליציה."
      en: "Arab parties should be able to be partners in a governing coalition."
      ar: "ينبغي أن تتمكن الأحزاب العربية من أن تكون شريكة في الائتلاف الحاكم."
      ru: "Арабские партии должны иметь возможность быть партнёрами по правящей коалиции."
      es: "Los partidos árabes deberían poder ser socios de una coalición de gobierno."
      fr: "Les partis arabes devraient pouvoir être partenaires d’une coalition gouvernementale."
    short:
      he: "מפלגות ערביות בקואליציה"
      en: "Arab parties in a coalition"
      ar: "الأحزاب العربية في الائتلاف"
      ru: "Арабские партии в коалиции"
      es: "Partidos árabes en la coalición"
      fr: "Partis arabes dans une coalition"
    explainer:
      he: "ב-2021 הייתה רע\"ם למפלגה הערבית הראשונה שהצטרפה באופן רשמי לקואליציה. התומכים אומרים שאזרחים ערבים הם חמישית מהאוכלוסייה ונציגיהם צריכים להיות שותפים כמו כולם; המתנגדים אומרים שאי אפשר לסמוך על מפלגות שאינן ציוניות בעניינים של ביטחון ושל אופי המדינה."
      en: "In 2021 Ra'am became the first Arab party to formally join the governing coalition. Supporters say Arab citizens are a fifth of the population and their representatives should be partners like everyone else; opponents say non-Zionist parties cannot be relied on in matters of security and the state's character."
      ar: "في 2021 أصبحت القائمة الموحدة (راعم) أول حزب عربي ينضم رسميًا إلى الائتلاف الحاكم. يقول المؤيدون إن المواطنين العرب خُمس السكان ويجب أن يكون ممثلوهم شركاء كغيرهم؛ ويقول المعارضون إنه لا يمكن الاعتماد على أحزاب غير صهيونية في شؤون الأمن وطابع الدولة."
      ru: "В 2021 году РААМ стала первой арабской партией, официально вошедшей в правящую коалицию. Сторонники говорят, что арабские граждане — пятая часть населения и их представители должны быть партнёрами, как все; противники — что на несионистские партии нельзя полагаться в вопросах безопасности и характера государства."
      es: "En 2021 Ra'am se convirtió en el primer partido árabe en entrar formalmente en la coalición de gobierno. Los partidarios dicen que los ciudadanos árabes son una quinta parte de la población y sus representantes deben ser socios como todos; los opositores dicen que no se puede confiar en partidos no sionistas en asuntos de seguridad y del carácter del Estado."
      fr: "En 2021, Ra’am est devenu le premier parti arabe à entrer officiellement dans la coalition gouvernementale. Les partisans disent que les citoyens arabes représentent un cinquième de la population et que leurs représentants doivent être des partenaires comme les autres ; les opposants disent qu’on ne peut pas compter sur des partis non sionistes pour les questions de sécurité et de caractère de l’État."
    explainerSources:
      - { url: "https://en.idi.org.il/israeli-elections-and-parties/parties/raam/", title: "Ra'am", publisher: "המכון הישראלי לדמוקרטיה" }
      - { url: "https://www.cbs.gov.il/he/mediarelease/DocLib/2025/304/11_25_304e.pdf", title: "Israel in Figures – Eve of Rosh Hashana: Selected Annual Data 2025", publisher: "הלשכה המרכזית לסטטיסטיקה" }
    stances:
      raam:
        value: 2
        basis: statement
        source: { url: "https://www.timesofisrael.com/jewish-former-mk-yoav-segalovitz-announces-unprecedented-run-with-arab-raam-party/", title: "In unprecedented move, Abbas and Segalovitz announce joint run, bringing Jewish lawmaker to Arab party's slate (31 Aug 2026)", publisher: "The Times of Israel" }
        quote:
          he: "יואב סגלוביץ', מספר 2 ברשימת רע\"ם, בהשקת הריצה המשותפת: \"הטענה הרווחת שאחרי 7 באוקטובר אי אפשר לקיים שותפות פוליטית עם מפלגות ערביות היא חסרת בסיס ושקרית.\""
          en: "Yoav Segalovitz, no. 2 on the Ra'am list, at the joint-run launch: \"The common assertion that after October 7 it is impossible to maintain a political partnership with Arab parties is baseless and false.\""
          ar: "يوآف سيغالوفيتش، الثاني في قائمة الموحدة، في إطلاق الترشح المشترك: «الادعاء الشائع بأنه بعد 7 تشرين الأول/أكتوبر لا يمكن إقامة شراكة سياسية مع الأحزاب العربية لا أساس له وكاذب.»"
          ru: "Йоав Сегалович, № 2 в списке РААМ, на презентации совместного выдвижения: «Распространённое утверждение, что после 7 октября политическое партнёрство с арабскими партиями невозможно, беспочвенно и ложно»."
          es: "Yoav Segalovitz, número 2 de la lista de Ra’am, en el lanzamiento de la candidatura conjunta: «La afirmación extendida de que después del 7 de octubre es imposible mantener una alianza política con partidos árabes carece de fundamento y es falsa.»"
          fr: "Yoav Segalovitz, numéro 2 de la liste Ra’am, au lancement de la candidature commune : « L’affirmation répandue selon laquelle, après le 7 octobre, il est impossible d’avoir un partenariat politique avec des partis arabes est infondée et fausse. »"
      joint-list:
        value: 0
        basis: statement
        source: { url: "https://www.israelnationalnews.com/news/432244", title: "Hadash sets conditions for supporting Eisenkot bloc (26 Aug 2026; quoting Jabareen's interviews with Al-Jarmak and Al-Nas Radio)", publisher: "Israel National News" }
        quote:
          he: "ג'בארין (כפי שדווח): לא שלל \"רשת ביטחון\" מבחוץ לגוש איזנקוט, בתנאי \"עקרונות יסוד המבטיחים שוויון וזכויות לחברה הערבית\"; \"מפלגה שמצטרפת לקואליציה כפופה לקווי היסוד שלה\" — תמיכה מבחוץ, לא שותפות"
          en: "Jabareen (as reported): did not rule out a \"safety net\" from outside for the Eisenkot bloc, conditioned on \"basic principles guaranteeing equality and rights for Arab society\"; a \"party that joins a coalition becomes bound by its guiding principles\" — outside support, not partnership"
          ar: "جبارين (كما نُقل): لم يستبعد «شبكة أمان» من الخارج لكتلة آيزنكوت، مشروطة بـ«مبادئ أساسية تضمن المساواة والحقوق للمجتمع العربي»؛ «الحزب الذي ينضم إلى ائتلاف يصبح ملزمًا بخطوطه العريضة» — دعم من الخارج لا شراكة"
          ru: "Джабарин (в изложении СМИ): не исключил «страховочную сеть» извне для блока Айзенкота при условии «основных принципов, гарантирующих равенство и права арабского общества»; «партия, вступившая в коалицию, связана её основными принципами» — поддержка извне, а не партнёрство"
          es: "Jabareen (según se informó): no descartó una «red de seguridad» desde fuera para el bloque de Eisenkot, condicionada a «principios básicos que garanticen la igualdad y los derechos de la sociedad árabe»; un «partido que entra en una coalición queda vinculado por sus principios rectores» — apoyo desde fuera, no alianza"
          fr: "Jabareen (tel que rapporté) : n’a pas exclu un « filet de sécurité » de l’extérieur pour le bloc Eisenkot, sous condition de « principes de base garantissant l’égalité et les droits de la société arabe » ; un « parti qui rejoint une coalition est lié par ses principes directeurs » — un soutien extérieur, pas un partenariat"
      democrats:
        value: 2
        basis: statement
        source: { url: "https://www.kan.org.il/content/kan-news/politic/1103282/", title: "יאיר גולן: \"מפלגה ערבית יכולה להיות בממשלה הבאה וזה נכון וראוי\" (27.9.2026)", publisher: "כאן חדשות" }
        quote:
          he: "גולן: \"אנחנו שוקדים בתוכנו לייצוג ערבי הולם, וגם חושבים שמפלגה ערבית יכולה להיות בממשלה. זה טבעי, נכון, ראוי, דמוקרטי\""
          en: "Golan: \"We are working within our own ranks for fair Arab representation, and we also think an Arab party can be in the government. It is natural, right, proper, democratic\""
          ar: "غولان: «نعمل داخل صفوفنا على تمثيل عربي لائق، ونعتقد أيضًا أن حزبًا عربيًا يمكن أن يكون في الحكومة. هذا طبيعي وصحيح ولائق وديمقراطي»"
          ru: "Голан: «Мы работаем внутри своей партии над достойным арабским представительством и также считаем, что арабская партия может быть в правительстве. Это естественно, правильно, достойно, демократично»"
          es: "Golan: «Trabajamos dentro de nuestras filas por una representación árabe adecuada, y también creemos que un partido árabe puede estar en el Gobierno. Es natural, correcto, apropiado, democrático»"
          fr: "Golan : « Nous œuvrons en notre sein pour une représentation arabe adéquate, et nous pensons aussi qu’un parti arabe peut être au gouvernement. C’est naturel, juste, légitime, démocratique »"
      yisrael-beiteinu:
        value: -2
        basis: platform
        source: { url: "https://beytenu.org.il/party-platform/", title: "המצע שלנו — ישראל ביתנו", publisher: "ישראל ביתנו" }
        quote:
          he: "\"הממשלה הבאה… תורכב אך ורק ממפלגות ציוניות.\""
          en: "\"The next government… will be composed solely of Zionist parties.\""
          ar: "«الحكومة القادمة… ستتألف من أحزاب صهيونية فقط.»"
          ru: "«Следующее правительство… будет состоять только из сионистских партий»."
          es: "«El próximo Gobierno… estará compuesto únicamente por partidos sionistas.»"
          fr: "« Le prochain gouvernement… sera composé uniquement de partis sionistes. »"
      reservists:
        value: -2
        basis: platform
        source: { url: "https://www.themiluimnikim.org.il/platform/", title: "עקרונות — המילואימניקים (עיקרי המצע)", publisher: "המילואימניקים" }
        quote:
          he: "\"ממשלה ציונית: למדנו כי ממשלה שמסתמכת על מפלגות לא ציוניות (חרדיות או ערביות) נסחטת לקבל החלטות לא ציוניות.\""
          en: "\"A Zionist government: we learned that a government relying on non-Zionist parties (haredi or Arab) is extorted into non-Zionist decisions.\""
          ar: "«حكومة صهيونية: تعلّمنا أن الحكومة التي تعتمد على أحزاب غير صهيونية (حريدية أو عربية) تُبتزّ لاتخاذ قرارات غير صهيونية.»"
          ru: "«Сионистское правительство: мы усвоили, что правительство, опирающееся на несионистские партии (харедимные или арабские), шантажом вынуждают принимать несионистские решения»."
          es: "«Un Gobierno sionista: aprendimos que un Gobierno que depende de partidos no sionistas (jaredíes o árabes) es extorsionado hacia decisiones no sionistas.»"
          fr: "« Un gouvernement sioniste : nous avons appris qu’un gouvernement qui dépend de partis non sionistes (haredim ou arabes) est contraint à des décisions non sionistes. »"
      together:
        value: -2
        basis: statement
        source: { url: "https://www.ynet.co.il/news/120andone/article/s100tqclqmg", title: "בנט: \"אני עם לפיד עד הסוף, לא אשב עם נתניהו\" — ריאיון (3.7.2026)", publisher: "ynet" }
        quote:
          he: "בנט, על כך שרע\"ם הייתה חלק מהקואליציה שלו: \"לא היה שום דבר שרציתי לעשות ולא עשיתי בגלל זה. אבל זה בוודאי לא המצב הנכון למדינת ישראל פוסט 7 באוקטובר.\""
          en: "Bennett, on Ra'am having been part of his coalition: \"There was nothing I wanted to do and did not do because of it. But it is certainly not the right situation for the State of Israel post-7 October.\""
          ar: "بينيت، عن كون القائمة الموحدة جزءًا من ائتلافه: «لم يكن هناك أي شيء أردت فعله ولم أفعله بسبب ذلك. لكن هذا بالتأكيد ليس الوضع الصحيح لدولة إسرائيل بعد 7 تشرين الأول/أكتوبر.»"
          ru: "Беннет о том, что РААМ входила в его коалицию: «Не было ничего, что я хотел сделать и не сделал из-за этого. Но это точно не правильная ситуация для Государства Израиль после 7 октября»."
          es: "Bennett, sobre el hecho de que Ra’am formara parte de su coalición: «No hubo nada que quisiera hacer y no hiciera por eso. Pero sin duda no es la situación adecuada para el Estado de Israel después del 7 de octubre.»"
          fr: "Bennett, sur le fait que Ra’am ait fait partie de sa coalition : « Il n’y a rien que je voulais faire et que je n’ai pas fait à cause de cela. Mais ce n’est certainement pas la bonne situation pour l’État d’Israël après le 7 octobre. »"
      blue-white:
        value: -1
        basis: statement
        source: { url: "https://www.mako.co.il/news-israel-elections/2026/liveblog-5bc9483b18b70a1026.htm", title: "כל העדכונים מסגירת הרשימות לכנסת ה-26 — תגובת כחול לבן (7.9.2026)", publisher: "N12" }
        quote:
          he: "\"כל מי שמצביע לישר מצביע לממשלת מיעוט שנשענת על המפלגות הערביות… רק הצבעה לכחול לבן תאפשר להקים ממשלה ציונית חוצה גושים.\""
          en: "\"Whoever votes Yashar votes for a minority government leaning on the Arab parties… only a vote for Blue and White will allow a Zionist government that crosses the blocs.\""
          ar: "«كل من يصوّت لياشار يصوّت لحكومة أقلية تستند إلى الأحزاب العربية… فقط التصويت لأزرق أبيض سيتيح إقامة حكومة صهيونية عابرة للكتل.»"
          ru: "«Кто голосует за „Яшар!“, голосует за правительство меньшинства, опирающееся на арабские партии… только голос за „Кахоль-лаван“ позволит создать сионистское правительство из партий обоих блоков»."
          es: "«Quien vota a ¡Yashar! vota por un Gobierno en minoría apoyado en los partidos árabes… solo el voto a Azul y Blanco permitirá formar un Gobierno sionista que cruce los bloques.»"
          fr: "« Quiconque vote Yashar! vote pour un gouvernement minoritaire s’appuyant sur les partis arabes… seul un vote pour Bleu et Blanc permettra un gouvernement sioniste qui dépasse les blocs. »"
      likud:
        value: -2
        basis: statement
        source: { url: "https://www.timesofisrael.com/netanyahus-party-says-it-will-petition-election-panel-to-ban-arab-majority-parties/", title: "Netanyahu's Likud says it will petition election panel to ban Arab-majority parties (14 Sep 2026)", publisher: "The Times of Israel" }
        quote:
          he: "הליכוד עתר לוועדת הבחירות לפסול את רע\"ם ואת הרשימה המשותפת: \"אין מקום בכנסת למי שפוגעים בחיילי צה\"ל ואינם מסוגלים לומר שחמאס וחיזבאללה הם ארגוני טרור.\""
          en: "Likud petitioned the Elections Committee to ban Ra'am and the Joint List: \"There is no room in the Knesset for those who harm IDF soldiers and are unable to say that Hamas and Hezbollah are terrorist organizations.\""
          ar: "قدّم الليكود طلبًا إلى لجنة الانتخابات لشطب القائمة الموحدة والقائمة المشتركة: «لا مكان في الكنيست لمن يمسّون بجنود الجيش الإسرائيلي ولا يستطيعون القول إن حماس وحزب الله منظمتان إرهابيتان.»"
          ru: "Ликуд обратился в Центризбирком с требованием отстранить РААМ и Объединённый список: «Нет места в Кнессете тем, кто вредит солдатам ЦАХАЛа и не может сказать, что ХАМАС и „Хизбалла“ — террористические организации»."
          es: "El Likud pidió a la Comisión Electoral que inhabilite a Ra’am y a la Lista Conjunta: «No hay lugar en la Knéset para quienes dañan a los soldados de las FDI y son incapaces de decir que Hamás y Hezbolá son organizaciones terroristas.»"
          fr: "Le Likoud a demandé à la Commission électorale d’interdire Ra’am et la Liste commune : « Il n’y a pas de place à la Knesset pour ceux qui nuisent aux soldats de Tsahal et sont incapables de dire que le Hamas et le Hezbollah sont des organisations terroristes. »"
      otzma:
        value: -2
        basis: statement
        source: { url: "https://www.timesofisrael.com/netanyahus-party-says-it-will-petition-election-panel-to-ban-arab-majority-parties/", title: "Netanyahu's Likud says it will petition election panel to ban Arab-majority parties (14 Sep 2026)", publisher: "The Times of Israel" }
        quote:
          he: "עוצמה יהודית עתרה קודם לכן לפסילת רע\"ם, בטענה שהמפלגה תומכת במאבק מזוין נגד ישראל."
          en: "Otzma Yehudit previously petitioned to disqualify Ra'am, alleging the party supported armed struggle against Israel."
          ar: "قدّمت عوتسما يهوديت قبل ذلك طلبًا لشطب القائمة الموحدة، بادعاء أن الحزب يدعم الكفاح المسلح ضد إسرائيل."
          ru: "«Оцма Иегудит» ранее потребовала отстранить РААМ, утверждая, что партия поддерживает вооружённую борьбу против Израиля."
          es: "Otzma Yehudit ya había pedido la inhabilitación de Ra’am, alegando que el partido apoyó la lucha armada contra Israel."
          fr: "Otzma Yehoudit avait déjà demandé l’invalidation de Ra’am, alléguant que le parti avait soutenu la lutte armée contre Israël."
      rz-zehut:
        value: -2
        basis: statement
        source: { url: "https://www.ynet.co.il/news/120andone/article/ryfakwwqfe", title: "בצלאל סמוטריץ': \"צריך לצאת למלחמה ביהודה ושומרון\" (27.9.2026)", publisher: "ynet" }
        quote:
          he: "סמוטריץ', כשנשאל מה אמר לנתניהו כשניסה אחרי בחירות 2021 לשכנעו להקים ממשלה עם עבאס: \"צייצתי שלא יקום ולא יהיה\""
          en: "Smotrich, asked what he told Netanyahu when, after the 2021 election, Netanyahu tried to persuade him to form a government with Abbas: \"I tweeted that it will never happen\""
          ar: "سموتريتش، عندما سُئل عمّا قاله لنتنياهو حين حاول بعد انتخابات 2021 إقناعه بتشكيل حكومة مع عباس: «غرّدتُ أن ذلك لن يكون أبدًا»"
          ru: "Смотрич на вопрос, что он ответил Нетаньяху, когда тот после выборов 2021 года пытался убедить его сформировать правительство с Аббасом: «Я написал в твиттере, что этого не будет никогда»"
          es: "Smotrich, preguntado por lo que le dijo a Netanyahu cuando, tras las elecciones de 2021, este intentó convencerlo de formar un Gobierno con Abbas: «Tuiteé que eso no ocurrirá jamás»"
          fr: "Smotrich, interrogé sur ce qu’il a répondu à Netanyahu lorsque celui-ci a tenté, après les élections de 2021, de le convaincre de former un gouvernement avec Abbas : « J’ai tweeté que cela n’arriverait jamais »"
      yashar:
        value: -1
        basis: statement
        source: { url: "https://www.mako.co.il/news-israel-elections/2026_q4/Article-195ef5f365ad0a1026.htm", title: "איזנקוט מצהיר ב\"פגוש את העיתונות\": רע\"ם לא תהיה חלק מהממשלה הבאה (26.9.2026)", publisher: "N12" }
        quote:
          he: "איזנקוט: \"לגבי כל המפלגות האחרות, חרדיות או ערביות, אני קבעתי שלושה כללים ועוד אחד… אני לא רואה כרגע אף מפלגה ערבית או חרדית שמקבלת את הכללים האלה, כולל מנסור עבאס. לכן, הוא לא יהיה חלק מהממשלה הבאה.\" (אותם כללים חלים על כל מפלגה)"
          en: "Eisenkot: \"For all the other parties, haredi or Arab, I set three rules plus one… At the moment I see no Arab or haredi party that accepts these rules, including Mansour Abbas. So he will not be part of the next government.\" (the same rules apply to every party)"
          ar: "آيزنكوت: «بالنسبة لكل الأحزاب الأخرى، حريدية كانت أو عربية، وضعتُ ثلاث قواعد وقاعدة أخرى… لا أرى حاليًا أي حزب عربي أو حريدي يقبل هذه القواعد، بما في ذلك منصور عباس. لذلك لن يكون جزءًا من الحكومة القادمة.» (القواعد نفسها تسري على كل حزب)"
          ru: "Айзенкот: «Для всех остальных партий, харедимных или арабских, я установил три правила и ещё одно… Сейчас я не вижу ни одной арабской или харедимной партии, которая принимала бы эти правила, включая Мансура Аббаса. Поэтому он не будет частью следующего правительства». (Те же правила действуют для любой партии.)"
          es: "Eisenkot: «Para todos los demás partidos, jaredíes o árabes, fijé tres reglas y una más… Por ahora no veo ningún partido árabe o jaredí que acepte estas reglas, incluido Mansour Abbas. Por lo tanto, no formará parte del próximo Gobierno.» (las mismas reglas valen para todos los partidos)"
          fr: "Eisenkot : « Pour tous les autres partis, haredim ou arabes, j’ai fixé trois règles plus une… Pour l’instant, je ne vois aucun parti arabe ou haredi qui accepte ces règles, y compris Mansour Abbas. Il ne fera donc pas partie du prochain gouvernement. » (les mêmes règles valent pour tout parti)"
      amkha:
        value: -2
