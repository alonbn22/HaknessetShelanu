    institute: { he: "מאגר מוחות (יצחק כץ)", en: "Maagar Mochot (Yitzhak Katz)", ar: "مأغار موحوت (يتسحاق كاتس)", ru: "«Маагар Мохот» (Ицхак Кац)", es: "Maagar Mochot (Yitzhak Katz)", fr: "Maagar Mochot (Yitzhak Katz)" }
