  - kind: neutral
    category: news
    date: "2026-08-22"
    title:
      he: דורג במקום השלישי בפריימריז של רע"ם לבחירות 2026
      en: Ranked third in the Ra'am primary for the 2026 election
    description:
      he: >-
        ב-22 באוגוסט 2026, בוועידה הארצית ה-28 של רע"ם בטייבה, נבחרו חמשת המקומות
        הראשונים ברשימת המפלגה לכנסת ה-26: מנסור עבאס בראש, ואליד טאהא שני,
        אלהואשלה שלישי, אימאן ח'טיב-יאסין במקום השמור לאישה ויאסר חוג'יראת חמישי.
        ב-31 באוגוסט 2026 דווח כי חבר הכנסת לשעבר יואב סגלוביץ' יצטרף לרשימה
        וצפוי לקבל את המקום השני.
      en: >-
        On 22 August 2026, at Ra'am's 28th national conference in Tayibe, the first
        five places on the party's list for the 26th Knesset were chosen: Mansour
        Abbas first, Walid Taha second, al-Huashla third, Iman Khatib-Yasin in the
        slot reserved for a woman and Yasser Hujirat fifth. On 31 August 2026 it
        was reported that former MK Yoav Segalovitz would join the list and was
        expected to receive the second slot.
