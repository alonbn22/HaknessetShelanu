      he: כיהנה כיושבת ראש הקואליציה ויושבת ראש ועדת הבריאות
      en: Served as coalition whip and chair of the Health Committee
    description:
      he: בכנסת ה-24 כיהנה סילמן כיושבת ראש הקואליציה וכיושבת ראש ועדת הבריאות, ולקחה
        חלק מרכזי בהעברת תקציב המדינה הראשון של ישראל מזה למעלה משלוש שנים.
      en: In the 24th Knesset, Silman served as coalition whip and chair of the Health
        Committee, and played a central role in the passage of Israel's first
        state budget in more than three years.
