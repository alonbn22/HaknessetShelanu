# Upcoming Knesset election (EDITORIAL). Every claim below was researched and
# re-verified against its cited sources on lastReviewed; statuses are honest:
#   confirmed        = an official source states it
#   scheduled-by-law = the statutory default
#   reported         = media reports (may change)
# The lists were submitted on 7–8 September 2026 and are final subject to the
# CEC's approval (reported for 27 September). Every list carries a stable
# `slug` — the identity polls.yaml and quiz.yaml key on. Hebrew is the source;
# every string is in all six languages. UPDATE as the campaign moves: re-verify each item, bump
# lastReviewed, and prune anything that changed. Rule: every datum verified,
# from a trusted primary source — never an aggregator or a paraphrase.
knesset: 26
expectedDate: "2026-10-27"
dateStatus: set
lastReviewed: "2026-09-18"

headline:
  he: "הבחירות לכנסת ה-26 יתקיימו ביום שלישי, 27 באוקטובר 2026."
  en: "The 26th Knesset election is set for Tuesday, October 27, 2026."
  ar: "انتخابات الكنيست الـ26 ستُجرى يوم الثلاثاء، 27 تشرين الأول/أكتوبر 2026."
  ru: "Выборы в Кнессет 26-го созыва назначены на вторник, 27 октября 2026 года."
  es: "Las elecciones a la 26.ª Knéset se celebrarán el martes 27 de octubre de 2026."
  fr: "Les élections à la 26e Knesset auront lieu le mardi 27 octobre 2026."

intro:
  he: "הכנסת ה-25 השלימה קדנציה מלאה והתפזרה ב-17 ביולי 2026, והבחירות יתקיימו במועד הקבוע בחוק. הרשימות הוגשו ב-7–8 בספטמבר 2026. בעמוד זה: המועדים, מי מתמודד ועם מי, כללי הבחירות והנתונים — כל פריט עם מקור."
  en: "The 25th Knesset completed a full term and dispersed on July 17, 2026; the election will be held on its statutory date. The lists were submitted on September 7–8, 2026. This page covers the timeline, who is running and with whom, the rules, and the numbers — every item with a source."
  ar: "أكمل الكنيست الـ25 ولاية كاملة وحُلّ في 17 تموز/يوليو 2026؛ وستُجرى الانتخابات في موعدها القانوني. قُدّمت القوائم في 7–8 أيلول/سبتمبر 2026. تعرض هذه الصفحة الجدول الزمني، ومن يترشح ومع من، والقواعد، والأرقام — كل بند مع مصدره."
  ru: "Кнессет 25-го созыва отработал полный срок и был распущен 17 июля 2026 года; выборы пройдут в установленный законом срок. Списки были поданы 7–8 сентября 2026 года. На этой странице — график, кто идёт на выборы и с кем, правила и цифры; у каждого пункта указан источник."
  es: "La 25.ª Knéset completó una legislatura entera y se disolvió el 17 de julio de 2026; las elecciones se celebran en su fecha legal. Las listas se presentaron el 7 y 8 de septiembre de 2026. Esta página recoge el calendario, quién se presenta y con quién, las reglas y las cifras — cada dato con su fuente."
  fr: "La 25e Knesset a achevé une législature complète et s’est dissoute le 17 juillet 2026 ; les élections se tiennent à leur date légale. Les listes ont été déposées les 7 et 8 septembre 2026. Cette page couvre le calendrier, qui se présente et avec qui, les règles et les chiffres — chaque élément avec sa source."

# The road to the 26th Knesset — when each thing becomes known/final.
keyDates:
  - key: kd-lists
    date: "2026-09-08"
    label: { he: "הגשת רשימות המועמדים — ההרכבים סופיים", en: "Candidate lists submitted — line-ups are final", ar: "قُدّمت قوائم المرشحين — التشكيلات نهائية", ru: "Списки кандидатов поданы — составы окончательные", es: "Listas de candidatos presentadas — la composición de las listas es definitiva", fr: "Listes de candidats déposées — les compositions sont définitives" }
    detail:
      he: "38 רשימות הוגשו ליו\"ר ועדת הבחירות המרכזית, השופט נעם סולברג, במשכן הכנסת ב-7–8 בספטמבר 2026. ההגשה אינה אישור: הרשימות, הכינויים והאותיות נבדקים כעת."
      en: "38 lists were submitted to the chair of the Central Elections Committee, Justice Noam Sohlberg, at the Knesset on September 7–8, 2026. Submission is not approval: the lists, names and ballot letters are now under review."
      ar: "قُدّمت 38 قائمة إلى رئيس لجنة الانتخابات المركزية، القاضي نوعم سولبرغ، في الكنيست في 7–8 أيلول/سبتمبر 2026. التقديم ليس مصادقة: القوائم والأسماء وأحرف بطاقات الاقتراع قيد الفحص الآن."
      ru: "38 списков были поданы председателю Центральной избирательной комиссии судье Ноаму Сольбергу в Кнессете 7–8 сентября 2026 года. Подача — ещё не утверждение: списки, их названия и буквы бюллетеней сейчас проверяются."
      es: "Se presentaron 38 listas ante el presidente de la Comisión Electoral Central, el juez Noam Sohlberg, en la Knéset los días 7 y 8 de septiembre de 2026. Presentar no es aprobar: las listas, los nombres y las letras de papeleta están ahora en revisión."
      fr: "38 listes ont été déposées auprès du président de la Commission électorale centrale, le juge Noam Sohlberg, à la Knesset les 7 et 8 septembre 2026. Le dépôt ne vaut pas approbation : les listes, les noms et les lettres de bulletin sont en cours d’examen."
    status: confirmed
    sources:
      - url: "https://ch10.co.il/news/1100694/"
        title: "הרשימות נסגרו: מי יהיו 120 הח\"כים? אלו המתמודדים בבחירות לכנסת ה-26"
        publisher: "חרדים10"
      - url: "https://www.emess.co.il/radio/1927478"
        title: "תם המרוץ: 38 רשימות הגישו מועמדות לכנסת ה-26"
        publisher: "אמס"
      - url: "https://www.mako.co.il/news-israel-elections/2026/liveblog-5bc9483b18b70a1026.htm"
        title: "כל העדכונים מסגירת הרשימות לכנסת ה-26"
        publisher: "N12"
  - key: kd-approval
    date: "2026-09-27"
    label: { he: "אישור הרשימות הסופי", en: "Final approval of the lists", ar: "المصادقة النهائية على القوائم", ru: "Окончательное утверждение списков", es: "Aprobación definitiva de las listas", fr: "Approbation définitive des listes" }
    detail:
      he: "לפי ציר הזמן של ועדת הבחירות המרכזית: ב-27 בספטמבר 2026 מתפרסמות ההודעות על אישור רשימות המועמדים (סעיף 63 לחוק) או על סירוב לאשרן."
      en: "Per the Central Elections Committee's timeline: on September 27, 2026 the notices approving the candidate lists (section 63 of the law) — or refusing to — are published."
      ar: "وفق الجدول الزمني للجنة الانتخابات المركزية: في 27 أيلول/سبتمبر 2026 تُنشر إعلانات المصادقة على قوائم المرشحين (المادة 63 من القانون) — أو رفضها."
      ru: "По графику Центральной избирательной комиссии: 27 сентября 2026 года публикуются уведомления об утверждении списков кандидатов (статья 63 закона) — или об отказе."
      es: "Según el calendario de la Comisión Electoral Central: el 27 de septiembre de 2026 se publican los avisos de aprobación de las listas de candidatos (artículo 63 de la ley) — o de rechazo."
      fr: "Selon le calendrier de la Commission électorale centrale : le 27 septembre 2026 sont publiés les avis d’approbation des listes de candidats (article 63 de la loi) — ou de refus."
    status: confirmed
    sources:
      - url: "https://www.bechirot.gov.il/home/"
        title: "ציר הזמן לבחירות לכנסת ה-26 — אתר ועדת הבחירות המרכזית"
        publisher: "ועדת הבחירות המרכזית"
      - url: "https://ch10.co.il/news/1100694/"
        title: "הרשימות נסגרו: מי יהיו 120 הח\"כים?"
        publisher: "חרדים10"
  - key: kd-appeals
    date: "2026-09-29"
    label: { he: "מועד אחרון לערעור על פסילת רשימה", en: "Last day to appeal a list's disqualification", ar: "آخر موعد للاستئناف على شطب قائمة", ru: "Последний день обжалования отстранения списка", es: "Último día para recurrir la inhabilitación de una lista", fr: "Dernier jour pour contester l’invalidation d’une liste" }
    detail:
      he: "רשימה שוועדת הבחירות המרכזית פסלה רשאית לערער לבית המשפט העליון עד 29 בספטמבר 2026; פסילת מועמד מועברת לאישור בית המשפט. פסיקת בית המשפט סופית, והרשימות המאושרות הסופיות מתפרסמות עד 18 באוקטובר 2026."
      en: "A list the Central Elections Committee disqualified may appeal to the Supreme Court until September 29, 2026; a candidate's disqualification goes to the court for approval. The court's ruling is final, and the final approved lists are published by October 18, 2026."
      ar: "يحق للقائمة التي شطبتها لجنة الانتخابات المركزية الاستئناف إلى المحكمة العليا حتى 29 أيلول/سبتمبر 2026؛ ويُحال شطب المرشح إلى المحكمة للمصادقة. وقرار المحكمة نهائي، وتُنشر القوائم المصادَق عليها النهائية حتى 18 تشرين الأول/أكتوبر 2026."
      ru: "Список, отстранённый Центральной избирательной комиссией, может обжаловать решение в Верховном суде до 29 сентября 2026 года; отстранение кандидата передаётся суду на утверждение. Решение суда окончательно, а итоговые утверждённые списки публикуются до 18 октября 2026 года."
      es: "Una lista inhabilitada por la Comisión Electoral Central puede recurrir ante el Tribunal Supremo hasta el 29 de septiembre de 2026; la inhabilitación de un candidato pasa al tribunal para su aprobación. El fallo del tribunal es definitivo, y las listas aprobadas definitivas se publican a más tardar el 18 de octubre de 2026."
      fr: "Une liste invalidée par la Commission électorale centrale peut faire appel devant la Cour suprême jusqu’au 29 septembre 2026 ; l’invalidation d’un candidat est soumise à l’approbation de la Cour. La décision de la Cour est définitive, et les listes définitivement approuvées sont publiées au plus tard le 18 octobre 2026."
    status: confirmed
    sources:
      - url: "https://www.gov.il/en/pages/candidates-lists-26"
        title: "Lists of Candidates — disqualification and appeal timetable (updated 3 Sep 2026)"
        publisher: "ועדת הבחירות המרכזית"
