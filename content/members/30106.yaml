    title:
      he: חברת הכנסת מטעם מפלגת העבודה ולאחר מכן 'הדמוקרטים'
      en: Member of the Knesset for Labor and later The Democrats
    description:
      he: נעמה לזימי, ילידת מגדל העמק (11 בינואר 1986), נכנסה לכנסת ה-24 ב-2021 מטעם
        מפלגת העבודה לאחר התפטרותו של עמר בר-לב במסגרת החוק הנורווגי. בבחירות
        לכנסת ה-25 (2022) דורגה במקום השני ברשימת העבודה, אחרי יושבת ראש המפלגה
        מרב מיכאלי. ביוני 2024 המשיכה לכהן כחברת כנסת מטעם מפלגת 'הדמוקרטים'
        שהוקמה באיחוד העבודה ומרצ.
      en: Naama Lazimi, born in Migdal HaEmek (11 January 1986), entered the 24th
        Knesset in 2021 for the Labor Party following Omer Bar-Lev's resignation
        under the Norwegian Law. In the 2022 election for the 25th Knesset she
        was ranked second on the Labor list, behind party leader Merav Michaeli.
        In June 2024 she continued as a Knesset member for The Democrats, formed
        by the merger of Labor and Meretz.
