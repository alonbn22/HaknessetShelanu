    title:
      he: יושב ראש סיעת יהדות התורה
      en: Leader of United Torah Judaism
    description:
      he: בפברואר 2021 משה גפני, ראש סיעת דגל התורה, התמנה ליושב ראש סיעת יהדות התורה
        והחליף את יעקב ליצמן, במסגרת הסכם רוטציה שלפיו ראשות הרשימה מתחלפת בין
        ראשי דגל התורה ואגודת ישראל.
      en: In February 2021 Moshe Gafni, head of the Degel HaTorah faction, became
        leader of the United Torah Judaism slate, replacing Yaakov Litzman,
        under a rotation agreement whereby chairmanship of the joint list
        alternates between the heads of Degel HaTorah and Agudat Yisrael.
