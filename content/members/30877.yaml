  - kind: positive
    category: achievement
    title:
      he: "חבר הכנסת ה-25 מטעם הליכוד"
      en: "Member of the 25th Knesset for Likud"
    description:
      he: "משה (מושיקו) פסל נכנס לכנסת ב-12 במרץ 2023 כחבר כנסת מטעם הליכוד, לאחר שדורג במקום ה-40 ברשימת המפלגה, במקומה של השרה גלית דיסטל אטבריאן שהתפטרה מהכנסת מכוח 'החוק הנורווגי'. הוא חבר בוועדת הכלכלה, ובפברואר 2026 דווח כי יזם יחד עם ח\"כ איתן גינזבורג הצעת חוק להסדרת שירותי הסעה שיתופיים ('חוק אובר') במטרה להגביר תחרות ולהוזיל את יוקר המחיה."
      en: "Moshe (Moshiko) Passal entered the Knesset on 12 March 2023 as a Likud member, after placing 40th on the party list, replacing Minister Galit Distel-Atbaryan, who resigned from the Knesset under the Norwegian Law. He sits on the Economic Affairs Committee, and in February 2026 it was reported that he co-sponsored with MK Eitan Ginzburg a bill to regulate ride-sharing services (the 'Uber law') to increase competition and reduce the cost of living."
    date: "2023-03-12"
