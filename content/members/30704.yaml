    title:
      he: "חוק התקשורת (שידורים) שקידם אושר בכנסת; בג\"ץ הקפיא חלקים מרכזיים ממנו"
      en: "His broadcasting law passed the Knesset; the High Court froze key parts"
    description:
      he: "ב-16–17 ביולי 2026 אישרה הכנסת בקריאה שנייה ושלישית, ברוב של 53 מול 48, את חוק התקשורת (שידורים) שקידם קרעי, המקים רגולטור שידורים חדש במקום הרשות השנייה ומועצת הכבלים והלוויין ומבטל מגבלות על בעלויות צולבות; קרעי אמר כי השלים את 'הרפורמה הימנית בתקשורת'. ב-19 ביולי הקפיא בג\"ץ באופן זמני סעיפים מרכזיים בחוק עד להכרעה, וקרעי טען כי לבית המשפט אין סמכות להשעות חוקים."
      en: "On 16–17 July 2026 the Knesset passed, in its second and third readings by 53 votes to 48, the Communications (Broadcasting) Law promoted by Karhi, which establishes a new broadcasting regulator replacing the Second Authority and the Cable and Satellite Council and removes cross-ownership restrictions; Karhi said he had completed the 'right-wing reform of the media'. On 19 July the High Court temporarily froze key provisions pending a ruling, and Karhi asserted that the court had no authority to suspend laws."
    sources:
