    title:
      he: "שר בממשלת החירום (2023–2024)"
      en: "Minister in the emergency government (2023–2024)"
    description:
      he: "ב-12 באוקטובר 2023, לאחר מתקפת ה-7 באוקטובר ופרוץ המלחמה בעזה, הושבע טרופר כשר ללא תיק בממשלה ה-37 במסגרת הצטרפות המחנה הממלכתי לממשלת החירום. הוא כיהן בתפקיד עד התפטרות שרי המחנה הממלכתי ביוני 2024."
      en: "On 12 October 2023, following the 7 October attack and the outbreak of the Gaza war, Tropper was sworn in as a minister without portfolio in the 37th government as part of National Unity's entry into an emergency government. He held the post until the National Unity ministers resigned in June 2024."
