      he: "בן צור: ש\"ס תדרוש חוק גיוס לפני השבעת הממשלה הבאה"
      en: "Ben-Tzur: Shas will demand a draft law before the next government is sworn in"
    description:
      he: בריאיון לפודקאסט של ynet ב-27 באוגוסט 2026 אמר בן צור כי כתנאי להצטרפות
        ש"ס לממשלה הבאה תדרוש המפלגה העברת חוק גיוס עוד לפני ההשבעה, כי ש"ס
        "הולכת עם הגוש הימני", וכי הייתה זו טעות שלא לעגן זאת בהסכם הקואליציוני
        הקודם.
      en: In an interview with a ynet podcast on 27 August 2026, Ben-Tzur said that
        as a condition for joining the next government Shas would demand that a
        draft law be passed before the swearing-in, that Shas "is going with the
        right-wing bloc", and that not anchoring this in the previous coalition
        agreement had been a mistake.
