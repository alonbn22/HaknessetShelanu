    title:
      he: "תיקון לחוק זכויות הסטודנט האוסר במפורש אפליה על רקע נטייה מינית וזהות מגדרית (2026)"
      en: "Student Rights Law amendment explicitly banning discrimination on grounds of sexual orientation and gender identity (2026)"
    description:
      he: "ב-17 ביולי 2026 דווח כי הכנסת אישרה תיקון לחוק זכויות הסטודנט שיזם להב-הרצנו, המעגן לראשונה בחוק איסור מפורש על אפליה של מועמדים ללימודים וסטודנטים על רקע נטייה מינית או זהות מגדרית, בקבלה ללימודים, במהלכם ובמימוש זכויותיהם. על פי הדיווח, התיקון שולב במסגרת הצעת חוק רחבה יותר שקודמה בוועדת החינוך."
      en: "On 17 July 2026 it was reported that the Knesset approved an amendment to the Student Rights Law initiated by Lahav-Hertzanu, anchoring in law for the first time an explicit prohibition on discriminating against applicants and students on grounds of sexual orientation or gender identity, in admissions, during studies and in exercising their rights. According to the report, the amendment was folded into a broader bill advanced in the Education Committee."
