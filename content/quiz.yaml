        value: 0
        basis: statement
        source: { url: "https://www.timesofisrael.com/eisenkot-denies-claim-he-promised-bedouin-leaders-hed-bring-raam-into-government/", title: "Eisenkot denies claim he promised Bedouin leaders he'd bring Ra'am into government — Yashar statement (16 Sep 2026)", publisher: "The Times of Israel" }
        quote:
          he: "ישר!: שותפים לקואליציה יצטרכו לעמוד ב\"שלושת עקרונות היסוד המוכרים לציבור\" — \"הכרה בישראל כמדינה יהודית ודמוקרטית\", \"קבלת ערכי מגילת העצמאות\", \"שירות צבאי או אזרחי לכולם\" ו\"הכרה בחמאס כארגון טרור\" — בלי לומר אם מפלגות ערביות עומדות בהם"
          en: "Yashar: coalition partners must meet \"the three fundamental principles that are well known to the public\" — \"recognition of Israel as a Jewish and democratic state\", \"acceptance of the values of the Declaration of Independence\", \"universal military or civil national service\" and \"recognition of Hamas as a terrorist organization\" — without saying whether Arab parties qualify"

  - id: gaza-emigration
    topic: security
    lean: right
    text:
      he: "ישראל צריכה לעודד הגירה מרצון של תושבי רצועת עזה למדינות אחרות."
      en: "Israel should encourage voluntary emigration of Gaza's residents to other countries."
      ar: "على إسرائيل أن تشجّع الهجرة الطوعية لسكان قطاع غزة إلى دول أخرى."
      ru: "Израилю следует поощрять добровольную эмиграцию жителей сектора Газа в другие страны."
      es: "Israel debería fomentar la emigración voluntaria de los habitantes de la Franja de Gaza a otros países."
      fr: "Israël devrait encourager l’émigration volontaire des habitants de la bande de Gaza vers d’autres pays."
    short:
      he: "הגירה מרצון מעזה"
      en: "Voluntary emigration from Gaza"
      ar: "الهجرة الطوعية من غزة"
      ru: "Добровольная эмиграция из Газы"
      es: "Emigración voluntaria de Gaza"
      fr: "Émigration volontaire de Gaza"
    explainer:
      he: "מאז המלחמה עלתה תוכנית לעודד תושבי עזה לעבור למדינות אחרות, ובממשלה הוקם גוף לטיפול בכך. התומכים אומרים שזה פתרון הומניטרי לרצועה הרוסה ושמי שרוצה לעזוב צריך לקבל אפשרות; המתנגדים אומרים שאין 'מרצון' תחת מלחמה ומצור, שזה נוגד את המשפט הבינלאומי ושזה יבודד את ישראל בעולם."
      en: "Since the war, a plan to encourage Gaza's residents to move to other countries has been raised, and the government set up a body to handle it. Supporters say it is a humanitarian answer for a destroyed strip and that whoever wants to leave should be able to; opponents say there is no 'voluntary' under war and siege, that it violates international law and would isolate Israel in the world."
      ar: "منذ الحرب طُرحت خطة لتشجيع سكان غزة على الانتقال إلى دول أخرى، وأنشأت الحكومة هيئة لمعالجة ذلك. يقول المؤيدون إنه حل إنساني لقطاع مدمَّر وإن من يريد المغادرة يجب أن يُتاح له ذلك؛ ويقول المعارضون إنه لا «طوعية» في ظل الحرب والحصار، وإن ذلك يخالف القانون الدولي وسيعزل إسرائيل في العالم."
      ru: "После войны был выдвинут план поощрять жителей Газы переселяться в другие страны, и правительство создало орган для этого. Сторонники говорят, что это гуманитарный ответ для разрушенного сектора и что желающие уехать должны иметь такую возможность; противники — что под войной и блокадой нет ничего «добровольного», что это нарушает международное право и изолирует Израиль в мире."
      es: "Desde la guerra se ha planteado un plan para fomentar que los habitantes de Gaza se trasladen a otros países, y el Gobierno creó un organismo para gestionarlo. Los partidarios dicen que es una respuesta humanitaria para una franja destruida y que quien quiera irse debería poder hacerlo; los opositores dicen que no hay nada «voluntario» bajo guerra y asedio, que viola el derecho internacional y aislaría a Israel en el mundo."
      fr: "Depuis la guerre, un plan visant à encourager les habitants de Gaza à partir vers d’autres pays a été avancé, et le gouvernement a créé un organisme pour s’en occuper. Les partisans disent que c’est une réponse humanitaire pour une bande détruite et que quiconque veut partir devrait le pouvoir ; les opposants disent qu’il n’y a rien de « volontaire » sous la guerre et le siège, que cela viole le droit international et isolerait Israël dans le monde."
    stances:
      otzma:
        value: 2
        basis: platform
        source: { url: "https://ozma-yeudit.co.il/%d7%99%d7%95%d7%b4%d7%a8-%d7%a2%d7%95%d7%a6%d7%9e%d7%94-%d7%99%d7%94%d7%95%d7%93%d7%99%d7%aa-%d7%94%d7%a9%d7%a8-%d7%91%d7%9f-%d7%92%d7%91%d7%99%d7%a8-%d7%9e%d7%a6%d7%99%d7%92-%d7%90%d7%aa-%d7%aa%d7%95/", title: "בן גביר מציג את תוכנית הדגל של עוצמה יהודית לקראת הבחירות ״התנתקות 710״ (2026-09-04)", publisher: "עוצמה יהודית" }
        quote:
          he: "\"תוכנית מדיניות להגירה מרצון של תושבי רצועת עזה למדינות שיסכימו לקלוט אותם… בממשלה הבאה, הקמת משרד הגירה, עם שר בראשו, תקציבים וסמכויות, תהיה בראש הדרישות הקואליציוניות שלנו.\""
          en: "\"A policy plan for the voluntary emigration of Gaza Strip residents to countries that agree to absorb them… In the next government, establishing an Emigration Ministry, with a minister, budgets and powers, will top our coalition demands.\""
      rz-zehut:
        value: 2
        basis: statement
        source: { url: "https://www.timesofisrael.com/smotrich-and-ben-gvir-rally-behind-trumps-gaza-emigration-idea/", title: "Smotrich and Ben Gvir rally behind Trump's Gaza emigration idea — Bezalel Smotrich (2025-01-27)", publisher: "The Times of Israel" }
        quote:
          he: "\"אין ספק שבטווח הארוך עידוד הגירה הוא הפתרון היחיד שיביא שלום וביטחון לתושבי ישראל ויקל גם על סבלם של תושבי עזה הערבים.\""
          en: "\"There is no doubt that, in the long term, encouraging emigration is the only solution that will bring peace and security to the residents of Israel and also ease the suffering of the Arab residents of Gaza.\""
      yisrael-beiteinu:
        value: 2
        basis: statement
        source: { url: "https://www.timesofisrael.com/liveblog_entry/liberman-welcomes-trump-proposal-to-relocate-gazans-backs-saudi-normalization-but-not-at-the-price-they-are-demanding/", title: "Liberman welcomes Trump proposal to relocate Gazans, backs Saudi normalization 'but not at the price they are demanding' (2025-02-03)", publisher: "The Times of Israel" }
        quote:
          he: "\"אני רוצה להודות לנשיא ארצות הברית על היוזמה שלו להעביר את אוכלוסיית עזה לחצי האי סיני.\""
          en: "\"I want to thank the US president for his initiative to transfer the population of Gaza to the Sinai Peninsula.\""
      amkha:
        value: 2
        basis: statement
        source: { url: "https://www.ynet.co.il/news/article/b13ajnsvml", title: "עופר וינטר: הפתרון בעזה הוא אחד - הגירה — נאום השקת עמך ישראל (2026-08-25)", publisher: "ynet" }
        quote:
          he: "\"הפיתרון בעזה הוא אחד: הגירה. אויב שיפתח נגדנו במלחמה ישלם מחיר טריטוריאלי כבד.\""
          en: "\"The solution in Gaza is one: emigration. An enemy that opens a war against us will pay a heavy territorial price.\""
      reservists:
        value: 1
        basis: platform
        source: { url: "https://www.themiluimnikim.org.il/platform/", title: "עיקרי המצע — המילואימניקים והכלכלית, פרק ביטחון ומשילות: עזה", publisher: "המילואימניקים" }
        quote:
          he: "\"הקמת מנהלת הגירה מרצון – לאפשר לתושבי עזה המעוניינים בכך להגר למדינות אחרות.\""
          en: "\"Establishing a voluntary-emigration directorate – to allow Gaza residents who wish to do so to emigrate to other countries.\""
      likud:
        value: 1
        basis: statement
        source: { url: "https://www.timesofisrael.com/liveblog_entry/netanyahu-says-several-countries-close-to-agreeing-to-take-in-gazans-trump-something-good-will-happen/", title: "Netanyahu says several countries close to agreeing to take in Gazans; Trump: 'Something good will happen' — Benjamin Netanyahu at the White House (2025-07-08)", publisher: "The Times of Israel" }
        quote:
          he: "\"…לנשיא טראמפ היה חזון מבריק. קוראים לזה בחירה חופשית. מי שרוצה להישאר יכול להישאר, אבל מי שרוצה לעזוב צריך שיוכל לעזוב… אנחנו עובדים עם ארצות הברית… כדי למצוא מדינות.\""
          en: "\"…President Trump had a brilliant vision. It's called free choice. If people want to stay, they can stay; but if they want to leave, they should be able to leave… We're working with the United States… [to] find countries.\""
      blue-white:
        value: 1
        basis: statement
        source: { url: "https://www.timesofisrael.com/liveblog_entry/gantz-israel-has-nothing-to-lose-from-trumps-gaza-plan/", title: "Gantz: 'Israel has nothing to lose' from Trump's Gaza plan — Benny Gantz (2025-02-05)", publisher: "The Times of Israel" }
        quote:
          he: "\"הרעיון להקים אזורים בטוחים ומשגשגים לתושבי עזה מחוץ לרצועה ולאפשר למי שמעוניין בכך לעבור אליהם הוא ראוי להערכה… לישראל אין מה להפסיד מזה.\""
          en: "\"The idea of building safe and prosperous areas for the residents of Gaza outside the Strip and allowing those who wish to do so to move to them is admirable… Israel has nothing to lose from it.\""
      together:
        value: 0
        basis: statement
        source: { url: "https://www.maariv.co.il/news/politics/article-1367889", title: "בנט מעלה הילוך מול סמוטריץ' ותוקף: \"לא קרעת מספיק את העם?\" — ריאיון ל-103FM (2026-09-16)", publisher: "מעריב" }
        quote:
          he: "\"קודם כל אנחנו צריכים לפעול לפי החוק הבין-לאומי… זה הכול דיבורים… הלוואי שיצאו מרצונם שני מיליון עזתים לסקוטלנד ולאירלנד… ככל שמדברים יותר על משהו, הסבירות שזה יקרה היא פחותה.\" — לא בעד ולא נגד"
          en: "\"First of all we must act according to international law… it's all talk… I wish two million Gazans would voluntarily leave for Scotland and Ireland… the more something is talked about, the less likely it is to happen.\" — neither for nor against"
      democrats:
        value: -2
        basis: statement
        source: { url: "https://news.walla.co.il/item/3708826", title: "יאיר גולן על התיישבות בעזה: \"נתנגד לזה בכל הכוח ונעמיד גייסות\" — ישיבת סיעה (2024-12-02)", publisher: "וואלה" }
        quote:
          he: "\"הבעיה היא ששרים מתבטאים באופן בלתי מתקבל על הדעת כמו עידוד הגירה מרצון או דילול האוכלוסייה. שרי ממשלת ישראל מפלילים אותנו יותר מכל אחד אחר.\""
          en: "\"The problem is that ministers speak in an unacceptable way, such as encouraging voluntary emigration or thinning out the population. Israel's government ministers incriminate us more than anyone else.\""
      raam:
        value: -2
        basis: statement
        source: { url: "https://www.ynet.co.il/news/article/hjsjp8w0kx", title: "עבאס: \"תוכנית להגירה מרצון מעזה? זה משחק מילים שתואם אג'נדה כהניסטית\" — ועידת האנשים של המדינה (2025-04-07)", publisher: "ynet" }
        quote:
          he: "\"התוכנית הזאת תואמת את האג'נדה של הכהניזם… לבוא ולהפוך את זה לתוכנית מדינית זה לא נכון ולא ראוי ומעמיד את ישראל בעמדה מאוד בעייתית גם ביחס לחוק הבינלאומי.\""
          en: "\"This plan matches the agenda of Kahanism… To come and turn this into a policy plan is wrong and improper, and puts Israel in a very problematic position, also with respect to international law.\""
      joint-list:
        value: -2
        basis: statement
        source: { url: "https://www.mako.co.il/news-politics/2025_q1/Article-b8925cb55a4d491026.htm", title: "\"ועוד יותר טוב\": התגובות במערכת הפוליטית על נאום טראמפ — ח\"כ אחמד טיבי, חד\"ש-תע\"ל (2025-02-05)", publisher: "N12" }
        quote:
          he: "\"ההזיות המסוכנות של טראמפ לגבי הטרנספר. העם הפלסטיני יישאר במולדתו, טראמפ, כמו כל נשיא, לא יישאר בסופו של דבר בבית הלבן.\""
          en: "\"Trump's dangerous delusions about the transfer. The Palestinian people will remain in their homeland; Trump, like every president, will not remain in the White House in the end.\""
  - id: climate-law
    topic: society
    lean: left
    text:
      he: "יש לקבוע בחוק יעדים מחייבים להפחתת פליטות גזי חממה (חוק אקלים)."
      en: "Binding greenhouse-gas reduction targets should be set in law (a climate law)."
      ar: "يجب تحديد أهداف ملزمة في القانون لخفض انبعاثات غازات الدفيئة (قانون مناخ)."
      ru: "Обязательные цели по сокращению выбросов парниковых газов следует закрепить в законе (закон о климате)."
      es: "Deberían fijarse por ley objetivos vinculantes de reducción de gases de efecto invernadero (una ley del clima)."
      fr: "Des objectifs contraignants de réduction des gaz à effet de serre devraient être fixés par la loi (une loi climat)."
    short:
      he: "חוק אקלים"
      en: "A climate law"
      ar: "قانون مناخ"
      ru: "Закон о климате"
      es: "Una ley del clima"
      fr: "Une loi climat"
    explainer:
      he: "ישראל התחייבה ביעדי הפחתת פליטות, אבל בניגוד לרוב המדינות המפותחות עדיין אין לה חוק אקלים שהופך אותם למחייבים. התומכים אומרים שבלי חוק היעדים נשארים על הנייר; המתנגדים אומרים שיעדים מחייבים יפגעו בתעשייה וביוקר המחיה ושעדיף לקדם זאת בהחלטות ממשלה."
      en: "Israel has committed to emission-reduction targets, but unlike most developed countries it still has no climate law making them binding. Supporters say without a law the targets stay on paper; opponents say binding targets would hurt industry and the cost of living and that government decisions are the better route."
      ar: "التزمت إسرائيل بأهداف لخفض الانبعاثات، لكن على خلاف معظم الدول المتقدمة ليس لديها بعد قانون مناخ يجعلها ملزمة. يقول المؤيدون إنه من دون قانون تبقى الأهداف حبرًا على ورق؛ ويقول المعارضون إن الأهداف الملزمة ستضرّ بالصناعة وغلاء المعيشة وإن قرارات الحكومة طريق أفضل."
      ru: "Израиль взял на себя цели по сокращению выбросов, но, в отличие от большинства развитых стран, у него до сих пор нет закона о климате, который сделал бы их обязательными. Сторонники говорят, что без закона цели остаются на бумаге; противники — что обязательные цели ударят по промышленности и стоимости жизни и что лучше действовать решениями правительства."
      es: "Israel se ha comprometido con objetivos de reducción de emisiones, pero a diferencia de la mayoría de los países desarrollados todavía no tiene una ley del clima que los haga vinculantes. Los partidarios dicen que sin ley los objetivos se quedan en el papel; los opositores dicen que los objetivos vinculantes dañarían la industria y el costo de vida y que las decisiones del Gobierno son la mejor vía."
      fr: "Israël s’est engagé sur des objectifs de réduction des émissions, mais, contrairement à la plupart des pays développés, il n’a toujours pas de loi climat qui les rende contraignants. Les partisans disent que sans loi, les objectifs restent sur le papier ; les opposants disent que des objectifs contraignants nuiraient à l’industrie et au coût de la vie et que les décisions gouvernementales sont la meilleure voie."
    stances:
      together:
        value: 2
        basis: platform
        source: { url: "https://be-yahad.org.il/plans/enviroment/", title: "תכנית ביחד להגנה על הסביבה בישראל — חוק אקלים והקמת מערך לאומי לניהול סיכוני אקלים", publisher: "ביחד" }
        quote:
          he: "\"ביחד תחוקק חוק אקלים מחייב ומתוקצב, שיעגן יעדים ענפיים ויקים מערך לאומי לניהול סיכוני אקלים.\""
          en: "\"Together will legislate a binding, budgeted climate law that anchors sectoral targets and sets up a national climate-risk management system.\""
      democrats:
        value: 2
        basis: platform
        source: { url: "https://democrats-media.s3.us-east-1.amazonaws.com/%D7%9E%D7%A6%D7%A2+%D7%A1%D7%91%D7%99%D7%91%D7%94.pdf", title: "תוכנית סביבה ואקלים — תוכניות העבודה של הדמוקרטים (המסמך המלא, מקושר מ-yes.democrats.org.il/topics/environment-animals)", publisher: "הדמוקרטים" }
        quote:
          he: "\"נחוקק את חוק האקלים אשר יכלול יעדי הפחתה ברורים של 50% מפליטות גזי החממה עד 2030 ו־100% עד 2050\""
          en: "\"We will legislate the Climate Law, which will include clear reduction targets of 50% of greenhouse-gas emissions by 2030 and 100% by 2050\""
      yisrael-beiteinu:
        value: 2
        basis: vote
        voteId: 44605
        source: { url: "https://knesset.gov.il/OdataV4/ParliamentInfo/KNS_PlenumVote(44605)", title: "הצעת חוק האקלים, התשפ\"ג-2023 — הצבעה במליאה (קריאה טרומית), 2025-10-29", publisher: "הכנסת" }
        quote:
          he: "הצבעה בעד הצעת חוק האקלים (ההצעה נדחתה 31–41): 3 בעד, 0 נגד, 3 נעדרו"
          en: "a vote for the Climate Bill (the bill was rejected 31–41): 3 for, 0 against, 3 absent"
      blue-white:
        value: 1
        basis: vote
        voteId: 44605
        source: { url: "https://knesset.gov.il/OdataV4/ParliamentInfo/KNS_PlenumVote(44605)", title: "הצעת חוק האקלים, התשפ\"ג-2023 — הצבעה במליאה (קריאה טרומית), 2025-10-29", publisher: "הכנסת" }
        quote:
          he: "הצבעה בעד הצעת חוק האקלים (ההצעה נדחתה 31–41): 3 בעד, 0 נגד, 5 נעדרו — פחות ממחצית הסיעה הצביעה, לכן העוצמה הוגבלה"
          en: "a vote for the Climate Bill (the bill was rejected 31–41): 3 for, 0 against, 5 absent — fewer than half the faction voted, so the strength is capped"
      raam:
        value: 1
        basis: vote
        voteId: 44605
        source: { url: "https://knesset.gov.il/OdataV4/ParliamentInfo/KNS_PlenumVote(44605)", title: "הצעת חוק האקלים, התשפ\"ג-2023 — הצבעה במליאה (קריאה טרומית), 2025-10-29", publisher: "הכנסת" }
        quote:
          he: "הצבעה בעד הצעת חוק האקלים (ההצעה נדחתה 31–41): 1 בעד, 0 נגד, 4 נעדרו — פחות ממחצית הסיעה הצביעה, לכן העוצמה הוגבלה"
          en: "a vote for the Climate Bill (the bill was rejected 31–41): 1 for, 0 against, 4 absent — fewer than half the faction voted, so the strength is capped"
      utj:
        value: 0
