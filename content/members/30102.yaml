    title:
      he: חברת כנסת מכהנת שהפכה לאם יחידנית מתוך בחירה
      en: Sitting MK who became a single mother by choice
    description:
      he: במרץ 2017 ילדה בן ארי, אז חברת כנסת מטעם כולנו, את בתה והפכה לאם יחידנית
        מתוך בחירה, לאחר שהרתה בהסכם הורות משותפת בכתב עם חבר קרוב. על פי
        הדיווחים הייתה חברת הכנסת היחידנית הראשונה שעשתה כן.
      en: In March 2017 Ben-Ari, then a Kulanu MK, gave birth to her daughter and
        became a single mother by choice, having conceived under a written
        co-parenting agreement with a close friend. She was reported to be the
        first single Knesset member to pursue shared parenting out of wedlock in
        this way.
    date: 2017-03
