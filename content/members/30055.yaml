  - kind: neutral
    category: news
    date: "2026-09-03"
    title:
      he: "היועצת המשפטית לממשלה אישרה את הפחתת הבלו על הדלק שיזם"
      en: "Attorney General cleared his cut to the fuel excise tax"
    description:
      he: "ב-3 בספטמבר 2026 דווח כי היועצת המשפטית לממשלה גלי בהרב-מיארה אישרה את הפחתת הבלו על הבנזין שיזם סמוטריץ', שצפויה להוריד את מחיר הליטר מ-8.25 ל-7.75 ש\"ח בעלות של כ-300 מיליון ש\"ח לחודש לקופת המדינה, זאת על רקע זינוק מחירי הדלק בעולם. האישור ניתן חרף ההערכות שהמהלך עלול להיחשב תעמולת בחירות."
      en: "On 3 September 2026 it was reported that Attorney General Gali Baharav-Miara approved Smotrich's cut to the excise tax on gasoline, expected to lower the price per litre from NIS 8.25 to NIS 7.75 at a cost of about NIS 300 million a month to the treasury, against the backdrop of a global spike in fuel prices. The approval came despite speculation that the step could be deemed improper electioneering."
    sources:
