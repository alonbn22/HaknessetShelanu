      he: "חבר הכנסת מטעם יש עתיד"
      en: "Member of Knesset for Yesh Atid"
    description:
      he: "סימון דוידסון הושבע לכנסת ה-24 ב-9 ביולי 2021 מטעם סיעת יש עתיד, כמחליף לאחר התפטרותו של עידן רול במסגרת החוק הנורווגי עם מינויו לסגן שר החוץ. הוא נבחר שוב לכנסת ה-25 ומכהן כחבר כנסת מאז."
      en: "Simon Davidson was sworn into the 24th Knesset on 9 July 2021 as a member of the Yesh Atid faction, replacing Idan Roll, who resigned his seat under the Norwegian Law upon his appointment as Deputy Foreign Minister. He was re-elected to the 25th Knesset and has served since."
