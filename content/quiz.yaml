          en: "\"We will pass the 'National Service for All' law, integrating the haredi and Arab publics, first and foremost into the IDF… whoever serves is rewarded\" (step 3)."
          es: "«Aprobaremos la ley de “Servicio nacional para todos”, que integra a los públicos jaredí y árabe, ante todo en las FDI… quien sirve es recompensado» (punto 3)."
          fr: "« Nous ferons adopter la loi “Service national pour tous”, qui intègre les publics haredi et arabe, d’abord et avant tout dans Tsahal… celui qui sert est récompensé » (point 3)."
      reservists:
        value: -2
        basis: platform
        source: { url: "https://www.themiluimnikim.org.il/platform/", title: "עיקרי המצע — המילואימניקים והכלכלית", publisher: "המילואימניקים" }
        quote:
          he: "\"חוק גיוס לכולם: כל אזרח ישראלי, יהודי, ערבי, חילוני חרדי צריך לעשות משהו למען המדינה… מי שלא ישרת – לא יקבל כלום מהמדינה.\""
          en: "\"A draft law for all: every Israeli citizen, Jewish, Arab, secular, haredi, must do something for the state… whoever does not serve gets nothing from the state.\""
          es: "«Una ley de reclutamiento para todos: todo ciudadano israelí, judío, árabe, laico, jaredí, debe hacer algo por el Estado… quien no sirve no recibe nada del Estado.»"
          fr: "« Une loi de conscription pour tous : chaque citoyen israélien, juif, arabe, laïque, haredi, doit faire quelque chose pour l’État… celui qui ne sert pas ne reçoit rien de l’État. »"
      haredi-public:
        value: 1
        basis: platform
        source: { url: "https://hatzibur-haharedi.org/%D7%9E%D7%A6%D7%A2", title: "המצע — הציבור החרדי", publisher: "הציבור החרדי" }
        quote:
          he: "\"עלינו להגן על מי שבאמת מקדיש את חייו ללימוד התורה, ולאפשר לו ללמוד בשקט, בלי איום במעצר, בלי סנקציות… כל צעיר חרדי שאינו מקדיש את חייו ללימוד תורה, צריך לשרת.\""
          en: "\"We must protect whoever truly devotes his life to Torah study and let him study in peace, without threat of arrest or sanctions… every haredi youth who does not devote his life to Torah study must serve.\""
          es: "«Debemos proteger a quien de verdad consagra su vida al estudio de la Torá y dejarle estudiar en paz, sin amenaza de detención ni sanciones… todo joven jaredí que no consagre su vida al estudio de la Torá debe servir.»"
          fr: "« Nous devons protéger celui qui consacre vraiment sa vie à l’étude de la Torah et le laisser étudier en paix, sans menace d’arrestation ni de sanctions… tout jeune haredi qui ne consacre pas sa vie à l’étude de la Torah doit servir. »"
  - id: core-curriculum
    topic: education
    lean: left
    text:
      he: "יש להתנות מימון ממשלתי לבתי ספר חרדיים בלימודי ליבה מלאים (מתמטיקה, אנגלית)."
      en: "State funding for haredi schools should be conditional on teaching the full core curriculum (maths, English)."
      ar: "يجب أن يكون تمويل الدولة للمدارس الحريدية مشروطًا بتدريس المنهاج الأساسي الكامل (رياضيات، إنجليزية)."
      ru: "Государственное финансирование харедимских школ должно быть обусловлено преподаванием полной базовой программы (математика, английский)."
      es: "La financiación estatal de las escuelas jaredíes debería condicionarse a enseñar el currículo básico completo (matemáticas, inglés)."
      fr: "Le financement public des écoles haredi devrait être conditionné à l’enseignement du programme de base complet (mathématiques, anglais)."
    short:
      he: "לימודי ליבה בחינוך החרדי"
      en: "Core studies in haredi schools"
      ar: "المناهج الأساسية في المدارس الحريدية"
      ru: "Базовая программа в харедимных школах"
      es: "Estudios básicos en las escuelas jaredíes"
      fr: "Tronc commun dans les écoles haredi"
    explainer:
      he: "רבים מבתי הספר החרדיים לבנים אינם מלמדים מתמטיקה ואנגלית ברמה מלאה, ומקבלים מימון ציבורי חלקי. התומכים אומרים שבלי לימודי ליבה הבוגרים מתקשים להתפרנס ושהמדינה לא צריכה לממן זאת; המתנגדים אומרים שזו זכות הקהילה לחנך לפי דרכה ושהתניית המימון היא כפייה."
      en: "Many haredi boys' schools do not teach maths and English fully, and receive partial public funding. Supporters say that without core studies graduates struggle to earn a living and the state should not fund it; opponents say the community has the right to educate its own way and conditioning funds is coercion."
      ar: "كثير من مدارس البنين الحريدية لا تدرّس الرياضيات والإنجليزية بشكل كامل، وتتلقى تمويلًا عامًا جزئيًا. يقول المؤيدون إنه من دون المناهج الأساسية يصعب على الخرّيجين كسب الرزق وإن الدولة يجب ألا تموّل ذلك؛ ويقول المعارضون إن من حق المجتمع أن يعلّم أبناءه على طريقته وإن ربط التمويل بشروط إكراه."
      ru: "Многие харедимные школы для мальчиков не преподают математику и английский в полном объёме и получают частичное государственное финансирование. Сторонники говорят, что без базовой программы выпускникам трудно зарабатывать и государство не должно это финансировать; противники — что община вправе учить по-своему, а условия финансирования — принуждение."
      es: "Muchas escuelas jaredíes de varones no enseñan matemáticas e inglés de forma completa y reciben financiación pública parcial. Los partidarios dicen que sin estudios básicos los graduados tienen dificultades para ganarse la vida y que el Estado no debería financiarlo; los opositores dicen que la comunidad tiene derecho a educar a su manera y que condicionar los fondos es coacción."
      fr: "Beaucoup d’écoles haredi de garçons n’enseignent pas pleinement les mathématiques et l’anglais et reçoivent un financement public partiel. Les partisans disent que sans tronc commun, les diplômés peinent à gagner leur vie et que l’État ne devrait pas le financer ; les opposants disent que la communauté a le droit d’éduquer à sa manière et que conditionner les fonds est une contrainte."
    stances:
      together:
        value: 2
        basis: platform
        source: { url: "https://be-yahad.org.il/plans/education/", title: "ביחד נתקן את מערכת החינוך", publisher: "ביחד" }
        quote:
          he: "\"או 100% ליבה, או 0% תקצוב… מימון ציבורי יינתן רק למוסדות המלמדים 100% לימודי ליבה.\""
          en: "\"Either 100% core studies, or 0% funding… public funding will be given only to institutions that teach 100% core studies.\""
          es: "«O el 100 % de estudios básicos, o el 0 % de financiación… La financiación pública se dará solo a las instituciones que enseñen el 100 % de los estudios básicos.»"
          fr: "« Soit 100 % de tronc commun, soit 0 % de financement… Le financement public ne sera accordé qu’aux établissements qui enseignent 100 % du tronc commun. »"
