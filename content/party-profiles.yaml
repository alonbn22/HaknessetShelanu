      ru: Объединённая партия Аводы и Мереца (с 2024 года), социал-демократическая и сионистская; на выборах 2026 года идёт как «Демократы» во главе с Яиром Голаном.
      es: "El partido surgido de la fusión del Partido Laborista y Meretz (desde 2024), socialdemócrata y sionista; se presenta en 2026 como Los Demócratas con Yair Golan."
      fr: "Le parti issu de la fusion Travaillistes–Meretz (depuis 2024), social-démocrate et sioniste ; se présente en 2026 comme Les Démocrates sous la direction de Yaïr Golan."
