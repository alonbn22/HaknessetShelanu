  - key: polling-stations
    label: { he: "קלפיות", en: "Polling stations", ar: "صناديق الاقتراع", ru: "Избирательные участки", es: "Colegios electorales", fr: "Bureaux de vote" }
    value: { he: "12,018", en: "12,018", ar: "12,018", ru: "12 018", es: "12 018", fr: "12 018" }
    detail:
      he: "קלפיות רגילות ברחבי הארץ לכנסת ה-26 (מפת הקלפיות הסופית), מהן 6,208 נגישות ו-3,620 נגישות מיוחדות; בנוסף 250 קלפיות בבתי חולים, 55 בבתי סוהר ומעצר ו-102 ב-100 נציגויות ישראל בחו\"ל. ב-2022: 11,707 קלפיות."
      en: "Regular polling stations nationwide for the 26th Knesset (final station map), of which 6,208 accessible and 3,620 special accessible; plus 250 in hospitals, 55 in prisons and detention facilities and 102 at 100 Israeli missions abroad. In 2022: 11,707."
      ar: "صناديق اقتراع عادية في أنحاء البلاد لانتخابات الكنيست الـ26 (خريطة الصناديق النهائية)، منها 6,208 مُتاحة لذوي الإعاقة و3,620 مُتاحة خاصة؛ إضافة إلى 250 في المستشفيات، و55 في السجون ومرافق الاحتجاز، و102 في 100 ممثلية إسرائيلية في الخارج. في 2022: 11,707."
      ru: "Обычные избирательные участки по всей стране на выборах в Кнессет 26-го созыва (окончательная карта участков), из них 6 208 доступных для людей с ограниченной подвижностью и 3 620 специальных доступных; плюс 250 в больницах, 55 в тюрьмах и местах заключения и 102 в 100 израильских представительствах за рубежом. В 2022 году: 11 707."
      es: "Colegios electorales ordinarios en todo el país para la 26.ª Knéset (mapa definitivo), de los cuales 6 208 accesibles y 3 620 de accesibilidad especial; más 250 en hospitales, 55 en prisiones y centros de detención y 102 en 100 misiones israelíes en el extranjero. En 2022: 11 707."
      fr: "Bureaux de vote ordinaires dans tout le pays pour la 26e Knesset (carte définitive), dont 6 208 accessibles et 3 620 à accessibilité spéciale ; plus 250 dans les hôpitaux, 55 dans les prisons et centres de détention et 102 dans 100 missions israéliennes à l’étranger. En 2022 : 11 707."
    status: confirmed
    sources:
      - url: "https://www.gov.il/he/pages/26elections-info"
