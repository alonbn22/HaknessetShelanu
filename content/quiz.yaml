  - id: core-curriculum
    topic: education
    lean: left
    text:
      he: "בית ספר שמקבל מימון מהמדינה חייב ללמד לימודי ליבה (מתמטיקה, אנגלית)."
      en: "A school that receives state funding must teach the core curriculum (maths, English)."
      ar: "المدرسة التي تتلقى تمويلًا من الدولة يجب أن تدرّس المنهاج الأساسي (رياضيات، إنجليزية)."
      ru: "Школа, получающая государственное финансирование, обязана преподавать базовую программу (математика, английский)."
    stances:
      together:
        value: 2
        basis: platform
        source: { url: "https://be-yahad.org.il/plans/education/", title: "ביחד נתקן את מערכת החינוך", publisher: "ביחד" }
        quote:
          he: "\"נדרוש 100% ליבה תמורת תקצוב ציבורי.\""
          en: "\"We will demand 100% core curriculum in return for public funding.\""
      yisrael-beiteinu:
        value: 2
        basis: platform
        source: { url: "https://beytenu.org.il/party-platform/", title: "המצע שלנו — ישראל ביתנו", publisher: "ישראל ביתנו" }
        quote:
          he: "\"חובת לימודי ליבה לכל תלמיד… מוסדות שלא יעמדו בדרישות הליבה לא יהיו זכאים לתקצוב.\""
          en: "\"Mandatory core studies for every pupil… institutions that do not meet the core requirements will not be entitled to funding.\""
      yashar:
        value: 2
        basis: platform
        source: { url: "https://yasharwitheisenkot.com/wp-content/uploads/2026/06/Yashar_10_Steps_Brochure.pdf", title: "10 הצעדים לשגשוגה של מדינת ישראל — מצע ישר!", publisher: "ישר!" }
        quote:
          he: "\"ננהיג לימודי ליבה לכל\" (צעד 4)."
          en: "\"We will institute core studies for all\" (step 4)."
      democrats:
        value: 2
        basis: vote
        voteId: 39288
        source: { url: "https://knesset.gov.il/OdataV4/ParliamentInfo/KNS_PlenumVote(39288)", title: "הצעת חוק חובת לימודי ליבה וביטול מוסדות הפטור (תיקוני חקיקה), התשפ\"ג-2023 — הצבעה במליאה, 2023-05-31", publisher: "הכנסת" }
