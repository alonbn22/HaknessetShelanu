# Seat polls for the 26th Knesset election (27 October 2026).
#
# The rule (AGENTS.md, extended to polls): every figure is verified against the
# publishing outlet's OWN article, fetched at the cited URL — never from an
# aggregator (Wikipedia and themadad.com are used only as indexes of what
# exists) and never from a summary. Hebrew list names were read verbatim from
# each outlet; the seat keys below are the registry slugs of
# content/election.yaml. Seats must sum to 120; blocs are recorded exactly as
# the outlet counted them (the site never assigns a list to a bloc — see the
# labels). `verification` records how each poll was checked so the next review
# can repeat it. `instituteId` is the key the poll-of-polls dedupes on (latest
# poll per institute), so one frequent pollster cannot dominate the average.
#
# Scope: polls published from the day the candidate lists closed (8 September
# 2026) onward — earlier polls scored lists that no longer exist. Review weekly
# until the vote and bump lastReviewed.
#
# `filing` is the pollster's own filing with the Central Elections Committee —
# the disclosure the Elections (Propaganda Methods) Law §16ה(ב)–(ג) asks of a
# published poll: who commissioned and who conducted it, the population, how
# many were asked and answered, the margin of error and the questions. Every
# value was read from the committee's PDF at `url` (names without their street
# addresses; the vote question verbatim in Hebrew). It is shown beside the
# article's figures and never replaces them: sample, marginOfError, fieldwork
# and seats stay the article's, and `filing.note` says, neutrally, where the two
# differ. No filing date: the committee's list runs a day off. A poll without
# `filing` shows "no filing found as of filingsCheckedAt" when it was published
# by then — re-check the committee's list and bump the date on each review.
#
# A poll the outlet only broadcast is entered from the pollster's own filing
# with the committee (a written publication by the institute that can be linked
# and re-read — the rule `notEntered` already applies): the filing is then the
# source, and `verification` says so. Channel 16's poll of 16 Sep 2026 is the
# first (added 28 Sep 2026, filing 4151).
lastReviewed: "2026-10-02"
cutoff: "2026-09-08"
filingsCheckedAt: "2026-10-02"
# The legal electoral threshold: 3.25% of valid votes (Knesset Elections Law,
# amendment of 2014) — ≈4 seats of 120.
threshold: 3.25
thresholdSources:
  - { url: "https://main.knesset.gov.il/EN/activity/mmm/The%20NationalElectoralThreshold.pdf", title: "The National Electoral Threshold: A Comparative Review (Knesset Research and Information Center, 2019)", publisher: "The Knesset" }
