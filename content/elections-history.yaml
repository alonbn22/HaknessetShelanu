# History of Israeli Knesset elections. Editorial/curated (not from the Knesset
# API). Figures are widely-documented results; review before publishing.
# turnout = % of eligible voters; winnerSeats = seats won by the largest list.
# date is ISO. "pm" = who ultimately formed/led the government after the election.
elections:
  - knesset: 25
    date: "2022-11-01"
    turnout: 70.6
    winner: { he: "הליכוד", en: "Likud", es: "Likud", fr: "Likoud" }
    winnerSeats: 32
    pm: { he: "בנימין נתניהו", en: "Benjamin Netanyahu", es: "Benjamín Netanyahu", fr: "Benyamin Netanyahou" }
    note: { he: "הקואליציה הימנית-דתית בראשות נתניהו זכתה ב-64 מושבים.", en: "The right-religious bloc led by Netanyahu won 64 seats.", es: "El bloque de derecha y religioso encabezado por Netanyahu obtuvo 64 escaños.", fr: "Le bloc de droite et religieux mené par Netanyahou a remporté 64 sièges." }
    summary:
      he: "הכנסת ה-25 נבחרה לאחר חמש מערכות בחירות בארבע שנים, והקימה קואליציה ימנית-דתית בת 64 מושבים. כהונתה התאפיינה ברפורמה המשפטית השנויה במחלוקת ובמלחמת חרבות ברזל שפרצה ב-7 באוקטובר 2023."
      en: "The 25th Knesset was elected after five elections in four years and formed a right-religious coalition of 64 seats. Its term has been shaped by the contested judicial reform and the Swords of Iron war that began on 7 October 2023."
      es: "La 25.ª Knéset fue elegida tras cinco elecciones en cuatro años y formó una coalición de derecha y religiosa de 64 escaños. Su legislatura estuvo marcada por la polémica reforma judicial y por la guerra de Espadas de Hierro, que comenzó el 7 de octubre de 2023."
      fr: "La 25e Knesset a été élue après cinq élections en quatre ans et a formé une coalition de droite et religieuse de 64 sièges. Sa législature a été marquée par la réforme judiciaire contestée et par la guerre des Épées de fer, qui a commencé le 7 octobre 2023."
    events:
      - kind: bad
        date: "2023-01-04"
        text: { he: "השקת הרפורמה המשפטית עוררה גל מחאות המוני שנמשך חודשים.", en: "The launch of the judicial overhaul triggered months of mass protests.", es: "El lanzamiento de la reforma judicial desató meses de protestas masivas.", fr: "Le lancement de la réforme judiciaire a déclenché des mois de manifestations massives." }
      - kind: bad
        date: "2023-10-07"
        text: { he: "מתקפת הפתע של חמאס וגרירת המדינה למלחמת חרבות ברזל.", en: "Hamas's surprise attack and the start of the Swords of Iron war.", es: "El ataque sorpresa de Hamás y el inicio de la guerra de Espadas de Hierro.", fr: "L’attaque surprise du Hamas et le début de la guerre des Épées de fer." }
      - kind: neutral
        date: "2023-03-27"
        text: { he: "השעיית חקיקת הרפורמה והקמת ממשלת חירום בעת המלחמה.", en: "Suspension of the reform legislation and formation of an emergency wartime government.", es: "Suspensión de la legislación de la reforma y formación de un gobierno de emergencia en tiempo de guerra.", fr: "Suspension de la législation de réforme et formation d’un gouvernement d’urgence en temps de guerre." }
      - kind: bad
        date: "2024-09-17"
        text: { he: "הסלמה בחזית הצפון מול חיזבאללה, מבצע הביפרים והתקיפות בלבנון.", en: "Escalation on the northern front with Hezbollah, the pager operation and strikes in Lebanon.", es: "Escalada en el frente norte con Hezbolá, la operación de los buscapersonas y los ataques en Líbano.", fr: "Escalade sur le front nord avec le Hezbollah, l’opération des bipeurs et les frappes au Liban." }
      - kind: good
        date: "2025-01-19"
        text: { he: "עסקאות לשחרור חטופים והפסקות אש לסירוגין בעזה.", en: "Hostage-release deals and intermittent ceasefires in Gaza.", es: "Acuerdos de liberación de rehenes y altos el fuego intermitentes en Gaza.", fr: "Accords de libération d’otages et cessez-le-feu intermittents à Gaza." }
    ended: { he: "הכנסת ה-25 השלימה קדנציה מלאה והתפזרה ב-17 ביולי 2026; הבחירות לכנסת ה-26 — 27 באוקטובר 2026.", en: "The 25th Knesset completed a full term and dispersed on July 17, 2026; the 26th Knesset election is on October 27, 2026.", es: "La 25.ª Knéset completó una legislatura entera y se disolvió el 17 de julio de 2026; las elecciones a la 26.ª Knéset son el 27 de octubre de 2026.", fr: "La 25e Knesset a achevé une législature complète et s’est dissoute le 17 juillet 2026 ; les élections à la 26e Knesset ont lieu le 27 octobre 2026." }
  - knesset: 24
    date: "2021-03-23"
    turnout: 67.4
    winner: { he: "הליכוד", en: "Likud", es: "Likud", fr: "Likoud" }
    winnerSeats: 30
    pm: { he: "נפתלי בנט ← יאיר לפיד", en: "Naftali Bennett → Yair Lapid", es: "Naftali Bennett → Yair Lapid", fr: "Naftali Bennett → Yaïr Lapid" }
    note: { he: "ממשלת השינוי (בנט-לפיד) קמה למרות שהליכוד היה הגדול ביותר.", en: "The \"change government\" (Bennett-Lapid) formed despite Likud being largest.", es: "El «gobierno del cambio» (Bennett-Lapid) se formó pese a que el Likud era el partido más grande.", fr: "Le « gouvernement du changement » (Bennett-Lapid) s’est formé bien que le Likoud fût le plus grand parti." }
    summary:
      he: "ממשלת השינוי איחדה שמונה מפלגות מימין, ממרכז ומשמאל כדי להחליף את נתניהו, עם רוטציה מתוכננת בין בנט ללפיד."
      en: "The \"change government\" united eight parties from right, centre and left to replace Netanyahu, with a planned rotation between Bennett and Lapid."
      es: "El «gobierno del cambio» unió a ocho partidos de derecha, centro e izquierda para sustituir a Netanyahu, con una rotación prevista entre Bennett y Lapid."
      fr: "Le « gouvernement du changement » a réuni huit partis de droite, du centre et de gauche pour remplacer Netanyahou, avec une rotation prévue entre Bennett et Lapid."
    events:
      - kind: good
        date: "2021-06-13"
        text: { he: "לראשונה מפלגה ערבית (רע\"ם) הצטרפה לקואליציה שלטת.", en: "For the first time an Arab party (Ra'am) joined a governing coalition.", es: "Por primera vez un partido árabe (Ra'am) se unió a una coalición de gobierno.", fr: "Pour la première fois, un parti arabe (Ra'am) a rejoint une coalition gouvernementale." }
      - kind: good
        date: "2021-11-04"
        text: { he: "אישור תקציב מדינה ראשון מזה למעלה משלוש שנים.", en: "Passage of the first state budget in over three years.", es: "Aprobación del primer presupuesto del Estado en más de tres años.", fr: "Adoption du premier budget de l’État en plus de trois ans." }
      - kind: bad
        date: "2022-04-06"
        text: { he: "איבוד הרוב בכנסת לאחר פרישת חברי קואליציה.", en: "Loss of the Knesset majority after coalition members defected.", es: "Pérdida de la mayoría en la Knéset tras la deserción de miembros de la coalición.", fr: "Perte de la majorité à la Knesset après la défection de membres de la coalition." }
      - kind: bad
        date: "2021-05-10"
        text: { he: "מבצע \"שומר החומות\" מול חמאס בעזה ומהומות בערים מעורבות.", en: "Operation Guardian of the Walls against Hamas in Gaza and unrest in mixed cities.", es: "La operación Guardián de los Muros contra Hamás en Gaza y los disturbios en las ciudades mixtas.", fr: "L’opération Gardien des murailles contre le Hamas à Gaza et les troubles dans les villes mixtes." }
    ended: { he: "הכנסת התפזרה ביוני 2022 לאחר שאיבדה את הרוב; לפיד הפך לראש ממשלה מעבר.", en: "Dissolved in June 2022 after losing its majority; Lapid became caretaker PM.", es: "Disuelta en junio de 2022 tras perder la mayoría; Lapid pasó a ser primer ministro en funciones.", fr: "Dissoute en juin 2022 après la perte de sa majorité ; Lapid est devenu Premier ministre de transition." }
  - knesset: 23
    date: "2020-03-02"
    turnout: 71.5
    winner: { he: "הליכוד", en: "Likud", es: "Likud", fr: "Likoud" }
    winnerSeats: 36
    pm: { he: "בנימין נתניהו", en: "Benjamin Netanyahu", es: "Benjamín Netanyahu", fr: "Benyamin Netanyahou" }
    note: { he: "הבחירות השלישיות בתוך שנה; ממשלת אחדות נתניהו-גנץ.", en: "The third election within a year; a Netanyahu-Gantz unity government.", es: "Las terceras elecciones en un año; un gobierno de unidad Netanyahu-Gantz.", fr: "La troisième élection en un an ; un gouvernement d’union Netanyahou-Gantz." }
    summary:
      he: "לאחר שלוש מערכות בחירות הוקמה ממשלת אחדות-חירום בצל מגפת הקורונה, עם הסכם רוטציה בין נתניהו לגנץ שלא מומש."
      en: "After three elections, a unity emergency government formed amid the COVID-19 pandemic, with a Netanyahu-Gantz rotation deal that was never fulfilled."
      es: "Tras tres elecciones se formó un gobierno de emergencia de unidad en plena pandemia de COVID-19, con un acuerdo de rotación Netanyahu-Gantz que nunca se cumplió."
      fr: "Après trois élections, un gouvernement d’union d’urgence s’est formé en pleine pandémie de COVID-19, avec un accord de rotation Netanyahou-Gantz jamais appliqué."
    events:
      - kind: bad
        date: "2020-03-19"
        text: { he: "ניהול משבר מגפת הקורונה וסגרים חוזרים ונשנים.", en: "Managing the COVID-19 crisis and repeated lockdowns.", es: "La gestión de la crisis de la COVID-19 y los confinamientos repetidos.", fr: "La gestion de la crise de la COVID-19 et les confinements répétés." }
      - kind: bad
        date: "2020-12-22"
        text: { he: "אי-העברת תקציב מדינה הביאה לפיזור אוטומטי של הכנסת.", en: "Failure to pass a state budget triggered the Knesset's automatic dissolution.", es: "La no aprobación de un presupuesto del Estado provocó la disolución automática de la Knéset.", fr: "L’échec de l’adoption d’un budget de l’État a entraîné la dissolution automatique de la Knesset." }
      - kind: good
        date: "2020-09-15"
        text: { he: "הסכמי אברהם — נורמליזציה עם איחוד האמירויות, בחריין, מרוקו וסודאן.", en: "The Abraham Accords — normalization with the UAE, Bahrain, Morocco and Sudan.", es: "Los Acuerdos de Abraham — normalización con Emiratos Árabes Unidos, Baréin, Marruecos y Sudán.", fr: "Les accords d’Abraham — normalisation avec les Émirats arabes unis, Bahreïn, le Maroc et le Soudan." }
    ended: { he: "פוזרה בדצמבר 2020 כי לא אושר תקציב מדינה במועד.", en: "Dissolved in December 2020 because no state budget was passed in time.", es: "Disuelta en diciembre de 2020 porque no se aprobó a tiempo un presupuesto del Estado.", fr: "Dissoute en décembre 2020 faute d’adoption à temps d’un budget de l’État." }
  - knesset: 22
    date: "2019-09-17"
    turnout: 69.8
    winner: { he: "כחול לבן", en: "Blue & White", es: "Azul y Blanco", fr: "Bleu et Blanc" }
    winnerSeats: 33
    pm: { he: "לא הוקמה ממשלה", en: "No government formed", es: "No se formó gobierno", fr: "Aucun gouvernement formé" }
    note: { he: "אף גוש לא הצליח להרכיב ממשלה — הובלה לבחירות חוזרות.", en: "Neither bloc could form a government — led to another election.", es: "Ninguno de los dos bloques pudo formar gobierno — llevó a otras elecciones.", fr: "Aucun des deux blocs n’a pu former un gouvernement — ce qui a conduit à une nouvelle élection." }
    summary:
      he: "בבחירות החוזרות כחול לבן הפכה לסיעה הגדולה ביותר, אך שוב אף מחנה לא הגיע לרוב של 61 ולא הצליח להרכיב ממשלה."
      en: "In the repeat election Blue & White became the largest party, but again neither camp reached a 61-seat majority or managed to form a government."
      es: "En la repetición electoral Azul y Blanco pasó a ser el partido más grande, pero de nuevo ningún bando alcanzó una mayoría de 61 escaños ni logró formar gobierno."
      fr: "Lors de l’élection répétée, Bleu et Blanc est devenu le plus grand parti, mais de nouveau aucun camp n’a atteint la majorité de 61 sièges ni réussi à former un gouvernement."
    events:
      - kind: bad
        date: "2019-11-21"
        text: { he: "גם גנץ וגם נתניהו נכשלו בהרכבת ממשלה.", en: "Both Gantz and Netanyahu failed to form a government.", es: "Tanto Gantz como Netanyahu fracasaron en formar gobierno.", fr: "Gantz comme Netanyahou ont échoué à former un gouvernement." }
    ended: { he: "פוזרה בדצמבר 2019 לאחר שלא הורכבה ממשלה — בחירות שלישיות.", en: "Dissolved in December 2019 after no government formed — a third election.", es: "Disuelta en diciembre de 2019 al no formarse gobierno — unas terceras elecciones.", fr: "Dissoute en décembre 2019 faute de gouvernement — une troisième élection." }
  - knesset: 21
    date: "2019-04-09"
    turnout: 68.5
    winner: { he: "הליכוד", en: "Likud", es: "Likud", fr: "Likoud" }
    winnerSeats: 35
    pm: { he: "לא הוקמה ממשלה", en: "No government formed", es: "No se formó gobierno", fr: "Aucun gouvernement formé" }
    note: { he: "הכנסת פיזרה את עצמה לראשונה בהיסטוריה במקום להקים ממשלה.", en: "The Knesset dissolved itself for the first time ever instead of forming a government.", es: "La Knéset se disolvió a sí misma por primera vez en la historia en lugar de formar gobierno.", fr: "La Knesset s’est dissoute elle-même pour la première fois de son histoire au lieu de former un gouvernement." }
    summary:
      he: "אף שהליכוד והגוש הימני זכו ברוב, המשא ומתן הקואליציוני נכשל סביב חוק הגיוס, והכנסת בחרה להתפזר במקום לאפשר למישהו אחר להרכיב ממשלה."
      en: "Although Likud and the right won a majority, coalition talks collapsed over the conscription law, and the Knesset chose to dissolve itself rather than let anyone else try to form a government."
      es: "Aunque el Likud y la derecha obtuvieron mayoría, las negociaciones de coalición fracasaron por la ley del servicio militar, y la Knéset optó por disolverse antes que permitir que otro intentara formar gobierno."
      fr: "Bien que le Likoud et la droite aient obtenu la majorité, les négociations de coalition ont échoué sur la loi sur la conscription, et la Knesset a choisi de se dissoudre plutôt que de laisser quelqu’un d’autre tenter de former un gouvernement."
    events:
      - kind: bad
        date: "2019-05-30"
        text: { he: "כישלון המו\"מ הקואליציוני בעיקר סביב חוק הגיוס.", en: "Collapse of coalition talks, chiefly over the conscription law.", es: "Fracaso de las negociaciones de coalición, sobre todo por la ley del servicio militar.", fr: "Échec des négociations de coalition, principalement sur la loi sur la conscription." }
    ended: { he: "פוזרה במאי 2019 — לראשונה בהיסטוריה הכנסת פיזרה את עצמה במקום להקים ממשלה.", en: "Dissolved in May 2019 — the first time the Knesset dissolved itself instead of forming a government.", es: "Disuelta en mayo de 2019 — la primera vez que la Knéset se disolvió a sí misma en lugar de formar gobierno.", fr: "Dissoute en mai 2019 — la première fois que la Knesset s’est dissoute elle-même au lieu de former un gouvernement." }
  - knesset: 20
    date: "2015-03-17"
    turnout: 72.3
    winner: { he: "הליכוד", en: "Likud", es: "Likud", fr: "Likoud" }
    winnerSeats: 30
    pm: { he: "בנימין נתניהו", en: "Benjamin Netanyahu", es: "Benjamín Netanyahu", fr: "Benyamin Netanyahou" }
    summary:
      he: "נתניהו הקים תחילה קואליציה ימנית-דתית צרה של 61 מושבים בלבד, שהורחבה מאוחר יותר. בכהונה זו התחילו חקירות פליליות נגד ראש הממשלה."
      en: "Netanyahu first formed a narrow right-religious coalition of just 61 seats, later broadened. Criminal investigations into the prime minister opened during this term."
      es: "Netanyahu formó primero una estrecha coalición de derecha y religiosa de solo 61 escaños, ampliada después. Durante esta legislatura se abrieron investigaciones penales contra el primer ministro."
      fr: "Netanyahou a d’abord formé une étroite coalition de droite et religieuse de seulement 61 sièges, élargie ensuite. Des enquêtes pénales visant le Premier ministre ont été ouvertes au cours de cette législature."
    events:
      - kind: bad
        date: "2016-12-01"
        text: { he: "פתיחת חקירות פליליות נגד נתניהו (תיקים 1000, 2000, 4000).", en: "Criminal investigations into Netanyahu opened (Cases 1000, 2000, 4000).", es: "Se abrieron investigaciones penales contra Netanyahu (casos 1000, 2000 y 4000).", fr: "Ouverture d’enquêtes pénales visant Netanyahou (affaires 1000, 2000 et 4000)." }
      - kind: neutral
        date: "2017-01-01"
        text: { he: "יציבות כלכלית והמשך צמיחה.", en: "Economic stability and continued growth.", es: "Estabilidad económica y crecimiento continuado.", fr: "Stabilité économique et poursuite de la croissance." }
      - kind: neutral
        date: "2018-07-19"
        text: { he: "חקיקת חוק יסוד: ישראל — מדינת הלאום של העם היהודי.", en: "Passage of Basic Law: Israel as the Nation-State of the Jewish People.", es: "Aprobación de la Ley Fundamental: Israel como Estado-nación del pueblo judío.", fr: "Adoption de la Loi fondamentale : Israël, État-nation du peuple juif." }
    ended: { he: "פוזרה בדצמבר 2018 על רקע המחלוקת על חוק הגיוס — לבחירות מוקדמות.", en: "Dissolved in December 2018 amid the conscription-law dispute — to early elections.", es: "Disuelta en diciembre de 2018 en medio de la disputa por la ley del servicio militar — hacia elecciones anticipadas.", fr: "Dissoute en décembre 2018 au milieu du conflit sur la loi sur la conscription — vers des élections anticipées." }
  - knesset: 19
    date: "2013-01-22"
    turnout: 67.8
    winner: { he: "הליכוד ישראל ביתנו", en: "Likud Yisrael Beiteinu", es: "Likud Yisrael Beiteinu", fr: "Likoud Israël Beiteinou" }
