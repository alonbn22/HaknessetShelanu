      joint-list:
        value: 1
        basis: platform
        recordOf:
          he: "תכנית הרשימה המשותפת לכנסת ה-24 (2021), שבה רצו יחד אותן שלוש מפלגות — חד\"ש, תע\"ל ובל\"ד; לרשימה של 2026 לא נמצא מצע בנושא האקלים"
          en: "the Joint List's plan for the 24th Knesset (2021), when the same three parties — Hadash, Ta'al and Balad — ran together; no climate platform was found for the 2026 list"
          ar: "برنامج القائمة المشتركة للكنيست الـ24 (2021)، حين خاضت الانتخابات معًا الأحزاب الثلاثة نفسها — الجبهة والعربية للتغيير والتجمع؛ ولم يُعثر على برنامج مناخي لقائمة 2026"
          ru: "программа «Объединённого списка» к выборам в Кнессет 24-го созыва (2021), когда вместе шли те же три партии — «Хадаш», «Тааль» и «Балад»; климатической программы списка 2026 года найти не удалось"
          es: "el plan de la Lista Conjunta para la 24.ª Knéset (2021), cuando se presentaron juntos los mismos tres partidos —Hadash, Ta'al y Balad—; no se encontró un programa climático de la lista de 2026"
          fr: "le programme de la Liste commune pour la 24e Knesset (2021), quand les trois mêmes partis — Hadash, Ta'al et Balad — se présentaient ensemble ; aucun programme climatique de la liste de 2026 n’a été trouvé"
        source: { url: "https://www.facebook.com/JointListHebrew/photos/a.1565477193705252/2830717877181171/?type=3&theater", title: "תכנית הרשימה המשותפת לכנסת ה-24 בנושא אקלים וסביבה (21.3.2021)", publisher: "הרשימה המשותפת" }
        quote:
          he: "\"בכנסת הבאה הרשימה המשותפת מתחייבת לפעול למען… חקיקת חוק אקלים והקמת מנהלה ארצית לטיפול בנושא עם מסגרת תקציבית, תכנית עבודה… הצבת יעד של מעבר ל-50% אנרגיה מתחדשת עד 2030 לפחות\""
          en: "\"In the next Knesset the Joint List commits to act for… enacting a climate law and establishing a national administration for the issue with a budget framework, a work plan… setting a target of moving to at least 50% renewable energy by 2030\""
          ar: "«في الكنيست القادم تتعهّد القائمة المشتركة بالعمل من أجل… سنّ قانون مناخ وإنشاء إدارة قُطرية لمعالجة القضية بإطار ميزانية وخطة عمل… ووضع هدف للانتقال إلى 50% على الأقل من الطاقة المتجددة بحلول 2030»"
          ru: "«В следующем Кнессете „Объединённый список“ обязуется добиваться… принятия закона о климате и создания общенационального управления по этому вопросу с бюджетной рамкой и планом работы… постановки цели перейти не менее чем на 50% возобновляемой энергии к 2030 году»"
          es: "«En la próxima Knéset la Lista Conjunta se compromete a trabajar por… la aprobación de una ley del clima y la creación de una administración nacional para el tema con un marco presupuestario, un plan de trabajo… la fijación de un objetivo de pasar al menos a un 50 % de energía renovable para 2030»"
          fr: "« Dans la prochaine Knesset, la Liste commune s’engage à agir pour… l’adoption d’une loi climat et la création d’une administration nationale dédiée, dotée d’un cadre budgétaire et d’un plan de travail… la fixation d’un objectif d’au moins 50 % d’énergies renouvelables d’ici 2030 »"

  - id: public-broadcasting
    topic: institutions
    lean: right
    text:
      he: "יש להפריט או לסגור את תאגיד השידור הציבורי (כאן)."
      en: "The public broadcaster (Kan) should be privatized or closed."
      ar: "يجب خصخصة هيئة البث العامة (كان) أو إغلاقها."
      ru: "Общественную вещательную корпорацию («Кан») следует приватизировать или закрыть."
      es: "La corporación pública de radiodifusión (Kan) debería privatizarse o cerrarse."
      fr: "L’audiovisuel public (Kan) devrait être privatisé ou fermé."
    short:
      he: "הפרטת השידור הציבורי"
      en: "Privatizing public broadcasting"
      ar: "خصخصة البث العام"
      ru: "Приватизация общественного вещания"
      es: "Privatizar la radiotelevisión pública"
      fr: "Privatiser l’audiovisuel public"
    explainer:
      he: "תאגיד השידור 'כאן' ממומן מכספי ציבור (לפי החוק, מאגרות רישוי הרכב) ומשדר טלוויזיה, רדיו וחדשות. התומכים בהפרטה אומרים שאין סיבה שהמדינה תממן תקשורת שמתחרה בשוק, ושהתאגיד מוטה; המתנגדים אומרים ששידור ציבורי עצמאי הוא חלק מדמוקרטיה, ושסגירתו נועדה להשתיק ביקורת. הצעות חוק להפרטת התאגיד הוגשו מאז 2021, ואף אחת מהן לא נחקקה."
      en: "The 'Kan' broadcasting corporation is publicly funded (by law, from vehicle licence fees) and broadcasts television, radio and news. Supporters of privatization say there is no reason for the state to fund media that competes in the market, and that the corporation is biased; opponents say independent public broadcasting is part of democracy and that closing it is meant to silence criticism. Bills to privatize it have been tabled since 2021, and none has been enacted."
      ar: "تُموَّل هيئة البث «كان» من المال العام (بحسب القانون، من رسوم ترخيص المركبات) وتبث التلفزيون والراديو والأخبار. يقول مؤيدو الخصخصة إنه لا سبب لأن تموّل الدولة إعلامًا ينافس في السوق، وإن الهيئة منحازة؛ ويقول المعارضون إن البث العام المستقل جزء من الديمقراطية وإن إغلاقه يهدف إلى إسكات النقد. قُدّمت منذ 2021 مشاريع قوانين لخصخصة الهيئة، ولم يُقَرّ أيٌّ منها."
      ru: "Вещательная корпорация «Кан» финансируется из общественных средств (по закону — из сборов за лицензии на транспортные средства) и ведёт теле-, радио- и новостное вещание. Сторонники приватизации говорят, что государству незачем финансировать СМИ, конкурирующие на рынке, и что корпорация предвзята; противники — что независимое общественное вещание — часть демократии, а его закрытие призвано заглушить критику. Законопроекты о её приватизации вносятся с 2021 года, и ни один из них не был принят."
      es: "La corporación de radiodifusión «Kan» se financia con fondos públicos (por ley, con las tasas de licencia de vehículos) y emite televisión, radio y noticias. Quienes apoyan la privatización dicen que no hay razón para que el Estado financie medios que compiten en el mercado, y que la corporación es sesgada; los opositores dicen que una radiodifusión pública independiente es parte de la democracia y que cerrarla busca silenciar la crítica. Desde 2021 se han presentado proyectos de ley para privatizarla, y ninguno se ha aprobado."
      fr: "La société de diffusion « Kan » est financée par des fonds publics (selon la loi, par la redevance annuelle sur les véhicules) et diffuse télévision, radio et informations. Les partisans de la privatisation disent que l’État n’a aucune raison de financer des médias qui concurrencent le marché, et que la société est partiale ; les opposants disent qu’un audiovisuel public indépendant fait partie de la démocratie et que le fermer vise à faire taire la critique. Des projets de loi de privatisation ont été déposés depuis 2021, et aucun n’a été adopté."
