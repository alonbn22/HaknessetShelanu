    title:
      he: "יו\"ר השדולה הגאה וקידום הכרה בבני זוג של חללי צה\"ל"
      en: "LGBTQ+ caucus chair advancing recognition of same-sex partners of fallen soldiers"
    description:
      he: "כיו\"ר השדולה הגאה בכנסת, להב-הרצנו פעל לקידום חקיקה שמכירה רשמית בבני זוג מאותו מין של חיילי צה\"ל שנפלו ומעניקה להם מעמד של בן/בת זוג. החקיקה אושרה בקריאה ראשונה בנובמבר 2023 בעקבות נפילתו של סרן סגי גולן, שנהרג בקיבוץ בארי באוקטובר 2023."
      en: "As chair of the Knesset's LGBTQ+ caucus, Lahav-Hertzanu helped advance legislation formally recognizing same-sex partners of fallen IDF soldiers, granting them spousal status. The bill passed its first reading in November 2023, following the death of Capt. Sagi Golan, killed at Kibbutz Be'eri in October 2023."
    date: "2023-11-01"
    sources:
      - url: "https://www.i24news.tv/en/news/israel/society/1698845508-knesset-approves-formal-recognition-of-same-sex-partners-of-idf-fallen-soldiers"
        title: "Israeli government advances legislation for same-sex partners of fallen soldiers"
