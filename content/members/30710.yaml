    title:
      he: "הצעת החוק שלו להקמת ועדת חקירה לאירועי 7 באוקטובר אושרה בקריאה ראשונה"
      en: "His bill to establish an October 7 inquiry commission passed its first reading"
    description:
      he: "קלנר יזם הצעת חוק להקמת ועדת חקירה לאירועי 7 באוקטובר שחבריה ימונו על ידי הקואליציה והאופוזיציה (שלושה מכל צד) במקום ועדת חקירה ממלכתית. ועדת החוקה אישרה את ההצעה לקריאה ראשונה ב-2 ביוני 2026, והמליאה אישרה אותה בקריאה ראשונה ב-6 ביולי 2026 ברוב של 59 ללא מתנגדים, לאחר שהאופוזיציה החרימה את ההצבעה. האופוזיציה ו'מועצת אוקטובר' של משפחות שכולות תיארו את ההצעה כוועדה פוליטית שנועדה לטייח; קלנר טען שהיא תביא לחקירה מלאה ובלתי תלויה."
      en: "Kallner initiated a bill to establish an inquiry commission into the events of 7 October whose members would be appointed by the coalition and the opposition (three from each side) instead of a state commission of inquiry. The Constitution Committee approved it for first reading on 2 June 2026, and the plenum passed the first reading on 6 July 2026 by 59 votes with none opposed, after the opposition boycotted the vote. The opposition and the 'October Council' of bereaved families described the bill as a political commission meant to whitewash; Kallner argued it would bring about a full and independent investigation."
