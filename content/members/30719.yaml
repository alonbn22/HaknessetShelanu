    title:
      he: השעיה נוספת של חודשיים על ידי ועדת האתיקה (יולי 2025)
      en: Further two-month suspension by the Ethics Committee (July 2025)
    description:
      he: ב-9 ביולי 2025 החליטה ועדת האתיקה של הכנסת להשעות את כסיף לחודשיים נוספים
        (19 באוקטובר עד 19 בדצמבר 2025) מדיוני המליאה והוועדות, למעט הצבעות,
        ולעכב את שכרו לשבועיים, בעקבות 12 תלונות על התבטאויותיו נגד צה"ל
        והממשלה במהלך המלחמה. כסיף כינה את ההחלטה "צנזורה ורדיפה פוליטית". ערעורו
        למליאת הכנסת נדחה ב-21 ביולי 2025 ברוב של 85 מול 10, וב-21 באוקטובר 2025
        דחה בג"ץ את עתירתו על הסף בשל שיהוי, בלי להכריע לגופו של עניין.
      en: On 9 July 2025 the Knesset Ethics Committee suspended Cassif for a further
        two months (19 October to 19 December 2025) from plenary and committee
        sessions, except for votes, and docked two weeks' pay, following 12
        complaints over his wartime statements against the IDF and the
        government. Cassif called the decision "political censorship and
        persecution". His appeal to the Knesset plenum was rejected on 21 July 2025
        by 85 votes to 10, and on 21 October 2025 the High Court dismissed his
        petition at the threshold because of delay, without ruling on the merits.
    date: 2025-07-09
