    title:
      he: מקום רביעי בפריימריז הליכוד לקראת בחירות 2026
      en: Fourth place in the Likud primary ahead of the 2026 election
    description:
      he: בפריימריז הליכוד לרשימה לכנסת ה-26, שתוצאותיו פורסמו ב-17 באוגוסט 2026, דורגה רגב במקום הרביעי (אחרי אלי כהן, אמיר אוחנה ויריב לוין) — הגבוה מבין הנשים ברשימה.
      en: In the Likud primary for the 26th Knesset list, whose results were published on 17 August 2026, Regev was ranked fourth (after Eli Cohen, Amir Ohana and Yariv Levin), the highest-placed woman on the list.
