      he: עורך דין ופעיל ציבור ברישון לציון
      en: Lawyer and local public servant in Rishon LeZion
    description:
      he: ביטן, יליד מרוקו שעלה לישראל בגיל חמש, סיים תואר במשפטים באוניברסיטת תל אביב
