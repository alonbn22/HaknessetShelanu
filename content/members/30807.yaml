claims:
  - kind: positive
    category: achievement
    title:
      he: הרב הרפורמי הראשון שנבחר לכנסת
      en: First Reform rabbi elected to the Knesset
    description:
      he: בבחירות מרץ 2021 נבחר גלעד קריב לכנסת מטעם מפלגת העבודה, ובכך הפך לרב הרפורמי הראשון שמכהן בכנסת ישראל.
      en: In the March 2021 election Gilad Kariv was elected to the Knesset on the Labor party slate, becoming the first Reform rabbi to serve in Israel's parliament.
    date: 2021-03-23
    sources:
      - url: https://www.haaretz.com/israel-news/elections/2021-04-11/ty-article/.premium/where-the-first-reform-rabbi-to-serve-in-the-knesset-gilad-kariv-draws-the-line/0000017f-e19b-d804-ad7f-f1fb27b00002
        title: Where the First Reform Rabbi to Serve in the Knesset, Gilad Kariv, Draws the Line
        publisher: Haaretz
      - url: https://www.jta.org/2021/03/24/israel/its-official-gilad-kariv-will-be-the-first-reform-rabbi-in-israels-parliament
        title: "It's official: Gilad Kariv will be the first Reform rabbi in Israel's parliament"
        publisher: Jewish Telegraphic Agency
  - kind: positive
    category: achievement
    title:
      he: יושב ראש ועדת החוקה, חוק ומשפט
      en: Chaired the Constitution, Law and Justice Committee
    description:
      he: ביוני 2021 נבחר קריב לעמוד בראש ועדת החוקה, חוק ומשפט של הכנסת, אחת הוועדות המרכזיות בכנסת, בתקופת הממשלה ה-36.
      en: In June 2021 Kariv was elected to head the Knesset's Constitution, Law and Justice Committee, one of the parliament's most influential committees, during the 36th government.
    date: 2021-06-29
    sources:
      - url: https://www.jpost.com/breaking-news/labor-mk-gilad-kariv-elected-to-constitution-law-and-justice-committee-672326
        title: Labor MK Gilad Kariv elected to head Constitution, Law and Justice Committee
        publisher: The Jerusalem Post
      - url: https://www.timesofisrael.com/ultra-orthodox-vow-to-boycott-new-knesset-committee-over-reform-rabbi-chairman/
        title: Ultra-Orthodox to boycott Knesset committee because its chair is a Reform rabbi
        publisher: The Times of Israel
  - kind: positive
    category: achievement
    title:
      he: 'רקע מקצועי: עורך דין, רב ומנכ"ל התנועה הרפורמית'
      en: "Professional background: attorney, rabbi and head of the Reform movement"
    description:
      he: קריב הוא עורך דין ורב רפורמי, בעל תואר במשפטים ובמדעי היהדות מהאוניברסיטה העברית והסמכה לרבנות מהיברו יוניון קולג'. בין 2009 ל-2021 כיהן כמנכ"ל התנועה ליהדות מתקדמת בישראל, ושירת בעבר בחיל המודיעין של צה"ל.
      en: Kariv is an attorney and Reform rabbi with a degree in law and Jewish studies from the Hebrew University and rabbinic ordination from Hebrew Union College. From 2009 to 2021 he served as executive director of the Israel Movement for Reform and Progressive Judaism, and earlier served in the IDF Intelligence Corps.
    sources:
      - url: https://en.wikipedia.org/wiki/Gilad_Kariv
        title: Gilad Kariv
        publisher: Wikipedia
  - kind: negative
    category: investigation
    status: ongoing
    date: 2025-04-07
    title:
      he: נחקר במשטרה בחשד להדלפת פרוטוקול חסוי מוועדת החוץ והביטחון; התיק הועבר לפרקליטות
      en: Questioned by police over alleged leak of a classified Foreign Affairs and Defense Committee protocol; case transferred to the prosecution
      ar: جرى استجوابه من قبل الشرطة للاشتباه بتسريب محضر سري من لجنة الخارجية والأمن؛ وأُحيل الملف إلى النيابة
      ru: Допрошен полицией по подозрению в утечке секретного протокола Комиссии по иностранным делам и обороне; дело передано в прокуратуру
    description:
      he: ב-7 באפריל 2025 נחקר ח"כ גלעד קריב תחת אזהרה ביחידת להב 433 בחשד להדלפת פרוטוקול מדיון חסוי של ועדת החוץ והביטחון מיוני 2023, בעקבות תלונה של יו"ר הכנסת אמיר אוחנה. קריב הכחיש כל עוולה, מסר כי "מעולם לא פגעתי בביטחון המדינה" וכי הציטוטים אושרו לפרסום בצנזורה, וטען שהתלונה פוליטית ופוגעת בחסינות הפרלמנטרית. ביולי 2025 הסתיימה החקירה והתיק הועבר למחלקה הכלכלית בפרקליטות המדינה לבחינת הגשת כתב אישום; נכון למאי 2026 לא הוגש כתב אישום ולא התקבלה החלטה סופית. חלה חזקת החפות.
      en: On 7 April 2025, MK Gilad Kariv was questioned under caution by the Lahav 433 unit on suspicion of leaking a protocol from a June 2023 classified session of the Knesset Foreign Affairs and Defense Committee, following a complaint by Knesset Speaker Amir Ohana. Kariv denied any wrongdoing, stating he "never harmed Israel's security" and that the quoted material had been cleared by military censors, and called the complaint political and a breach of parliamentary immunity. In July 2025 the investigation concluded and the file was transferred to the State Attorney's Economic Department to decide on an indictment; as of May 2026 no indictment had been filed and no final decision had been reached. The presumption of innocence applies.
      ar: في 7 نيسان/أبريل 2025، جرى استجواب عضو الكنيست جلعاد كاريف تحت التحذير من قبل وحدة لاهف 433 للاشتباه بتسريب محضر من جلسة سرية للجنة الخارجية والأمن في الكنيست عُقدت في حزيران/يونيو 2023، إثر شكوى تقدّم بها رئيس الكنيست أمير أوحانا. نفى كاريف أي مخالفة وقال إنه "لم يمسّ قط بأمن الدولة" وإن الاقتباسات أُجيزت للنشر من الرقابة، واعتبر الشكوى سياسية وماسّة بالحصانة البرلمانية. في تموز/يوليو 2025 انتهى التحقيق وأُحيل الملف إلى القسم الاقتصادي في نيابة الدولة للبتّ في تقديم لائحة اتهام؛ وحتى أيار/مايو 2026 لم تُقدّم لائحة اتهام ولم يُتّخذ قرار نهائي. تسري قرينة البراءة.
      ru: 7 апреля 2025 года депутат Кнессета Гилад Карив был допрошен с предупреждением подразделением «Лахав 433» по подозрению в утечке протокола закрытого заседания Комиссии Кнессета по иностранным делам и обороне, состоявшегося в июне 2023 года, после жалобы спикера Кнессета Амира Оханы. Карив отверг какие-либо нарушения, заявив, что он «никогда не наносил ущерба безопасности государства» и что цитаты были одобрены военной цензурой, и назвал жалобу политической и нарушающей парламентскую неприкосновенность. В июле 2025 года расследование завершилось, и дело было передано в экономический отдел Государственной прокуратуры для решения о предъявлении обвинения; по состоянию на май 2026 года обвинение не предъявлено и окончательное решение не принято. Действует презумпция невиновности.
