    description:
      he: במרץ 2016 נזפה ועדת האתיקה של הכנסת בפרוש בעקבות התבטאות שאמר בנוגע לקבוצת
        'נשות הכותל'. הוועדה קבעה כי דבריו 'חרגו באופן קיצוני ובוטה' מדרך
        ההתבטאות המקובלת בכנסת. מדובר בנזיפה אתית פרלמנטרית ולא בהליך פלילי.
      en: In March 2016 the Knesset Ethics Committee reprimanded Porush over remarks
        he made concerning the 'Women of the Wall' group. The committee found
