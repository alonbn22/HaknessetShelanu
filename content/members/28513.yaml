  - kind: negative
    category: investigation
    status: closed
    title:
      he: חקירה משטרתית (2007) ודוח מבקר המדינה (2008) על תקופתו כמנכ"ל "המשקם"; לא הוגש כתב אישום
      en: Police investigation (2007) and State Comptroller report (2008) on his tenure as CEO of HaMeshakem; no indictment was filed
    description:
      he: בדצמבר 2007, בעת שכיהן כמנכ"ל החברה הממשלתית "המשקם", נעצר בן צור לחקירה
        בחשד לעבירות שוחד, מרמה ורישום כוזב במסמכי תאגיד, על בסיס מידע שהעביר
        משרד מבקר המדינה למשטרה. בדוח שפרסם מבקר המדינה במאי 2008 נמתחה ביקורת
        חריפה על התנהלות החברה בתקופת כהונתו, ובכלל זה תנאי שכר והטבות חריגים
        לבכירים, ניגודי עניינים והעדפת מקורבים. לפי הדיווחים (אתר "המקום הכי חם
        בגיהנום", דצמבר 2022, והוויקיפדיה העברית), התיק נסגר בידי הפרקליטות מחוסר
        ראיות; כתב אישום לא הוגש נגדו, והוא כיהן מאז כסגן שר וכשר.
      en: In December 2007, while CEO of the government company HaMeshakem, Ben-Tzur
        was arrested for questioning on suspicion of bribery, fraud and false
        entries in corporate records, following information the State
        Comptroller's office passed to the police. A State Comptroller report
        published in May 2008 sharply criticized the company's conduct during
        his tenure, including irregular pay and benefits for senior staff,
        conflicts of interest and favoritism toward associates. According to
        reports (the Ha-Makom news site, December 2022, and Hebrew Wikipedia), the
        prosecution closed the case for lack of evidence; no indictment was ever
        filed against him, and he has since served as a deputy minister and
        minister.
