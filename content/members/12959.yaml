personId: 12959
claims:
  - kind: positive
    category: achievement
    title:
      he: כיהנה כדוברת צה"ל בדרגת תת-אלוף
      en: Served as IDF Spokesperson at the rank of Brigadier General
    description:
      he: מירי רגב שירתה בצה"ל למעלה מ-25 שנה (1983–2008) והגיעה לדרגת תת-אלוף. בשנים 2005–2007 כיהנה כדוברת צה"ל, ובכלל זה בתקופת ההתנתקות מרצועת עזה (2005) ומלחמת לבנון השנייה (2006).
      en: Miri Regev served in the IDF for over 25 years (1983–2008), reaching the rank of Brigadier General. From 2005 to 2007 she served as the IDF Spokesperson, including during the 2005 Gaza disengagement and the 2006 Second Lebanon War.
    date: 2005-06-01
    sources:
      - url: https://en.wikipedia.org/wiki/Miri_Regev
        title: Miri Regev
        publisher: Wikipedia
  - kind: positive
    category: achievement
    title:
      he: כיהנה כשרת התרבות והספורט (2015–2020)
      en: Served as Minister of Culture and Sport (2015–2020)
    description:
      he: לאחר היבחרה לכנסת מטעם הליכוד בבחירות 2009, מונתה רגב בשנת 2015 על ידי ראש הממשלה בנימין נתניהו לשרת התרבות והספורט בממשלת ישראל, תפקיד בו כיהנה עד שנת 2020.
      en: After being elected to the Knesset for Likud in the 2009 elections, Regev was appointed Minister of Culture and Sport by Prime Minister Benjamin Netanyahu in 2015, a post she held until 2020.
    date: 2015-05-14
    sources:
      - url: https://en.wikipedia.org/wiki/Miri_Regev
        title: Miri Regev
        publisher: Wikipedia
  - kind: negative
    category: investigation
    status: ongoing
    date: 2024-06-10
    title:
      he: חקירת משטרה במשרד התחבורה (פרשת רמזור)
      en: Police investigation into the Transport Ministry ('Traffic Light' affair)
      ar: تحقيق للشرطة في وزارة المواصلات (قضية «إشارة المرور»)
      ru: Полицейское расследование в министерстве транспорта (дело «Светофор»)
    description:
      he: ביוני 2024 פתחה יחידת להב 433 בחקירה פלילית בחשד להעדפה פוליטית בהקצאת משאבי משרד התחבורה ("שיטת הרמזור"), בעקבות תחקיר "המקור" בערוץ 13. בפברואר 2026 הודיעה המשטרה כי החקירה הסתיימה מבלי שרגב זומנה לחקירה, והתיק הועבר לפרקליטות המדינה להחלטה. רגב מכחישה את החשדות וכינתה את התחקיר "מפוברק".
      en: In June 2024, the Israel Police Lahav 433 unit opened a criminal investigation into alleged politically based allocation of Transport Ministry resources (the "traffic light" method), following a Channel 13 HaMakor investigative report. In February 2026, police announced the investigation had concluded without Regev being questioned, and the file was transferred to the State Attorney's Office for a decision. Regev denies the allegations and has called the report fabricated.
      ar: في يونيو 2024 فتحت وحدة "لاهف 433" في الشرطة الإسرائيلية تحقيقًا جنائيًا في شبهات تخصيص موارد وزارة المواصلات على أساس سياسي («طريقة إشارة المرور»)، في أعقاب تحقيق صحفي لبرنامج "همكور" في القناة 13. في فبراير 2026 أعلنت الشرطة انتهاء التحقيق دون استدعاء ريغيف للاستجواب، وأُحيل الملف إلى النيابة العامة لاتخاذ قرار. تنفي ريغيف الشبهات ووصفت التحقيق الصحفي بأنه ملفّق.
      ru: В июне 2024 года подразделение полиции «Лахав 433» начало уголовное расследование по подозрению в политически мотивированном распределении ресурсов министерства транспорта («метод светофора») после журналистского расследования программы «ха-Макор» 13-го канала. В феврале 2026 года полиция объявила о завершении расследования без допроса Регев; дело передано в государственную прокуратуру для принятия решения. Регев отрицает подозрения и назвала расследование сфабрикованным.
    sources:
