      - date: "2026-09-07"
        text:
          he: "רע\"ם הגישה לוועדת הבחירות את רשימתה לכנסת ה-26 (\"רע\"ם - הרשימה הערבית המאוחדת\", אותיות מבוקשות עם): 1 מנסור עבאס, 2 יואב סגלוביץ, 3 ווליד טאהא, 4 ואליד אל הואשלה, 5 אימאן ח'טיב יאסין, 6 יאסר חוג'יראת, 7 איברהים אל טורי. ב-12 בספטמבר נחתם הסכם עודפים עם הרשימה המשותפת."
          en: "Ra’am submitted its list for the 26th Knesset to the CEC (“Ra’am – United Arab List”, requested letters עם): 1 Mansour Abbas, 2 Yoav Segalovitz, 3 Walid Taha, 4 Walid Alhwashla, 5 Iman Khatib Yasin, 6 Yasser Hujirat, 7 Ibrahim al-Turi. On 12 September it signed a surplus-vote agreement with the Joint List."
          ar: "قدّمت القائمة الموحدة إلى لجنة الانتخابات قائمتها للكنيست الـ26 («راعم – القائمة العربية الموحدة»، الأحرف المطلوبة עם): 1 منصور عباس، 2 يوآف سيغالوفيتش، 3 وليد طه، 4 وليد الهواشلة، 5 إيمان خطيب ياسين، 6 ياسر حجيرات، 7 إبراهيم الطوري. وفي 12 أيلول/سبتمبر وُقّعت اتفاقية فائض أصوات مع القائمة المشتركة."
          ru: "РААМ подала в ЦИК список в Кнессет 26-го созыва («РААМ — Объединённый арабский список», запрошенные буквы עם): 1 Мансур Аббас, 2 Йоав Сегалович, 3 Валид Таха, 4 Валид аль-Хавашла, 5 Иман Хатиб-Ясин, 6 Ясер Худжейрат, 7 Ибрагим ат-Тури. 12 сентября подписано соглашение об излишках голосов с «Объединённым списком»."
          es: "Ra’am presentó su lista para la 26.ª Knéset ante la Comisión Electoral («Ra’am – Lista Árabe Unida», letras solicitadas עם): 1 Mansour Abbas, 2 Yoav Segalovitz, 3 Walid Taha, 4 Walid Alhwashla, 5 Iman Khatib Yasin, 6 Yasser Hujirat, 7 Ibrahim al-Turi. El 12 de septiembre firmó un acuerdo de votos sobrantes con la Lista Conjunta."
          fr: "Ra’am a déposé sa liste pour la 26e Knesset auprès de la Commission électorale (« Ra’am – Liste arabe unie », lettres demandées עם) : 1 Mansour Abbas, 2 Yoav Segalovitz, 3 Walid Taha, 4 Walid Alhwashla, 5 Iman Khatib Yasin, 6 Yasser Hujirat, 7 Ibrahim al-Turi. Le 12 septembre, il a signé un accord de report des voix restantes avec la Liste commune."
        sources:
          - { url: "https://www.gov.il/he/pages/raam_list18", title: "רע\"ם - הרשימה הערבית המאוחדת — רשימת המועמדים לכנסת ה-26 (ועדת הבחירות המרכזית) (2026-09-09)", publisher: "gov.il / ועדת הבחירות המרכזית" }
          - { url: "https://www.timesofisrael.com/israels-election-takes-shape-as-38-parties-submit-slates-from-likud-to-joint-list/", title: "Israel's election takes shape as 38 parties submit slates, in battle between pro- and anti-Netanyahu blocs (2026-09-09)", publisher: "The Times of Israel" }
          - { url: "https://www.timesofisrael.com/liveblog_entry/joint-list-and-raam-sign-surplus-vote-deal-ahead-of-oct-27-elections/", title: "Joint List and Ra'am sign surplus-vote deal ahead of Oct. 27 elections (2026-09-12)", publisher: "The Times of Israel" }
      - date: "2026-09-13"
        text:
          he: "הליכוד הודיע כי יגיש לוועדת הבחירות המרכזית בקשה לפסול את רע\"ם ואת הרשימה המשותפת; שבוע קודם לכן הגישה עוצמה יהודית בקשה לפסילת רע\"ם. ההכרעה בוועדה נתונה לביקורת בית המשפט העליון."
          en: "Likud said it would petition the Central Elections Committee to disqualify Ra’am and the Joint List; Otzma Yehudit had filed a petition against Ra’am the week before. CEC decisions are subject to Supreme Court review."
          ar: "أعلن الليكود أنه سيقدّم إلى لجنة الانتخابات المركزية طلبًا لشطب القائمة الموحدة (راعم) والقائمة المشتركة؛ وقبل ذلك بأسبوع قدّمت عوتسما يهوديت طلبًا لشطب القائمة الموحدة. قرارات اللجنة خاضعة لرقابة المحكمة العليا."
          ru: "Ликуд заявил, что подаст в Центральную избирательную комиссию ходатайство об отстранении РААМ и «Объединённого списка»; неделей ранее «Оцма Иегудит» подала ходатайство об отстранении РААМ. Решения комиссии подлежат рассмотрению Верховным судом."
          es: "El Likud dijo que pediría a la Comisión Electoral Central la inhabilitación de Ra’am y de la Lista Conjunta; Otzma Yehudit había presentado una petición contra Ra’am la semana anterior. Las decisiones de la Comisión están sujetas a revisión del Tribunal Supremo."
          fr: "Le Likoud a déclaré qu’il demanderait à la Commission électorale centrale d’invalider Ra’am et la Liste commune ; Otzma Yehoudit avait déposé une requête contre Ra’am la semaine précédente. Les décisions de la Commission sont soumises au contrôle de la Cour suprême."
        sources:
          - { url: "https://www.timesofisrael.com/netanyahus-party-says-it-will-petition-election-panel-to-ban-arab-majority-parties/", title: "Netanyahu's Likud says it will petition election panel to ban Arab-majority parties (2026-09-14)", publisher: "The Times of Israel" }
      - date: "2026-10-01"
        text:
          he: "ב-1 באוקטובר 2026 דן הרכב של תשעה שופטי בית המשפט העליון בערעורי רע\"ם והרשימה המשותפת ובפסילת המועמדים עופר כסיף וסאמי אבו שחאדה. בעניין אבו שחאדה אמר נשיא בית המשפט העליון יצחק עמית כי בקרב השופטים יש רוב לאישור הפסילה, וכל השופטים המליצו לו לשקול להסיר את מועמדותו – דבר שיפטור ממתן פסק דין מנומק; השר בן גביר התנגד להמלצה וביקש פסק דין. באותו ערב הודיעה בל\"ד כי אבו שחאדה לא יתמודד; הרשימה המשותפת כינתה את ההמלצה \"פסילה בפועל\". פסקי הדין בעניין רע\"ם, הרשימה המשותפת וכסיף צפויים עד 4 באוקטובר."
          en: "On 1 October 2026 a panel of nine Supreme Court justices heard the appeals of Ra’am and the Joint List and the disqualifications of the candidates Ofer Cassif and Sami Abu Shehadeh. On Abu Shehadeh, Supreme Court President Yitzhak Amit said a majority of the justices favoured approving the disqualification, and all nine recommended that he consider withdrawing – which would make a reasoned judgment unnecessary; Minister Ben Gvir opposed the recommendation and asked for a ruling. That evening Balad announced that Abu Shehadeh would not run; the Joint List called the recommendation “disqualification in practice”. The rulings on Ra’am, the Joint List and Cassif are due by 4 October."
          ar: "في 1 تشرين الأول/أكتوبر 2026 نظرت هيئة من تسعة قضاة في المحكمة العليا في استئنافَي القائمة الموحدة والقائمة المشتركة وفي شطب المرشحَين عوفر كسيف وسامي أبو شحادة. وبشأن أبو شحادة قال رئيس المحكمة العليا يتسحاق عميت إن أغلبية القضاة تميل إلى المصادقة على الشطب، وأوصاه القضاة التسعة جميعًا بأن يدرس سحب ترشحه – ما يُغني عن إصدار حكم مُعلَّل؛ وعارض الوزير بن غفير التوصية وطلب إصدار حكم. وفي المساء نفسه أعلن التجمع أن أبو شحادة لن يترشح؛ ووصفت القائمة المشتركة التوصية بأنها «شطب فعلي». ويُتوقع صدور الأحكام بشأن القائمة الموحدة والقائمة المشتركة وكسيف حتى 4 تشرين الأول/أكتوبر."
          ru: "1 октября 2026 года коллегия из девяти судей Верховного суда рассмотрела апелляции РААМ и «Объединённого списка» и отстранение кандидатов Офера Касифа и Сами Абу Шехаде. По делу Абу Шехаде председатель Верховного суда Ицхак Амит сказал, что большинство судей склоняется к утверждению отстранения, и все девять рекомендовали ему рассмотреть снятие кандидатуры — тогда мотивированное решение не понадобится; министр Бен-Гвир выступил против рекомендации и потребовал решения. В тот же вечер «Балад» объявил, что Абу Шехаде не будет баллотироваться; «Объединённый список» назвал рекомендацию «фактическим отстранением». Решения по РААМ, «Объединённому списку» и Касифу ожидаются до 4 октября."
          es: "El 1 de octubre de 2026 un tribunal de nueve jueces del Tribunal Supremo examinó los recursos de Ra’am y de la Lista Conjunta y la inhabilitación de los candidatos Ofer Cassif y Sami Abu Shehadeh. Sobre Abu Shehadeh, el presidente del Tribunal Supremo, Yitzhak Amit, dijo que una mayoría de los jueces se inclinaba por aprobar la inhabilitación, y los nueve le recomendaron que considerara retirar su candidatura, lo que haría innecesaria una sentencia motivada; el ministro Ben Gvir se opuso a la recomendación y pidió un fallo. Esa misma noche Balad anunció que Abu Shehadeh no se presentaría; la Lista Conjunta calificó la recomendación de «inhabilitación de facto». Los fallos sobre Ra’am, la Lista Conjunta y Cassif se esperan antes del 4 de octubre."
          fr: "Le 1er octobre 2026, une formation de neuf juges de la Cour suprême a examiné les appels de Ra’am et de la Liste commune et l’invalidation des candidats Ofer Cassif et Sami Abu Shehadeh. Concernant Abu Shehadeh, le président de la Cour suprême, Yitzhak Amit, a déclaré qu’une majorité des juges penchait pour approuver l’invalidation, et les neuf juges lui ont recommandé d’envisager de retirer sa candidature, ce qui rendrait inutile un jugement motivé ; le ministre Ben Gvir s’est opposé à cette recommandation et a demandé une décision. Le soir même, Balad a annoncé qu’Abu Shehadeh ne se présenterait pas ; la Liste commune a qualifié la recommandation d’« invalidation de fait ». Les décisions sur Ra’am, la Liste commune et Cassif sont attendues au plus tard le 4 octobre."
        sources:
          - { url: "https://www.jpost.com/israel-news/politics-and-diplomacy/article-910271", title: "Abu Shehadeh to withdraw election bid on Supreme Court recommendation (1 Oct 2026)", publisher: "The Jerusalem Post" }
          - { url: "https://www.ynet.co.il/news/elections2026/article/sj00kfs2cge", title: "יו\"ר בל\"ד פורש מההתמודדות לכנסת (1.10.2026)", publisher: "ynet" }
          - { url: "https://www.ynet.co.il/news/blogs/article/skc6ftiqfe", title: "הדיון בבית המשפט העליון בפסילות — עדכונים (1.10.2026)", publisher: "ynet" }
      - date: "2026-09-23"
        text:
          he: "ב-23 בספטמבר 2026 החליטה ועדת הבחירות המרכזית, ברוב של 18 נגד 5 ונמנע אחד, לפסול את רשימות רע\"ם והרשימה המשותפת, ובהצבעות נפרדות את המועמדים עופר כסיף (19 נגד 5, שניים נמנעו) וסאמי אבו שחאדה (30 נגד 4 בעילת שלילת קיומה של ישראל כמדינה יהודית ודמוקרטית, ו-31 נגד 4 – בהם יו\"ר הוועדה, השופט נעם סולברג – בעילת תמיכה במאבק מזוין). את הבקשות נגד רע\"ם הגישו עוצמה יהודית, הליכוד ופורום \"בוחרים בחיים\" של משפחות שכולות; נגד הרשימה המשותפת וכסיף – הליכוד; ונגד אבו שחאדה – עוצמה יהודית והשר איתמר בן גביר. המבקשים טענו לתמיכה במאבק מזוין נגד ישראל ולשלילת קיומה כמדינה יהודית ודמוקרטית, ובעניין רע\"ם גם להסתה לגזענות. היועצת המשפטית לממשלה התנגדה לפסילת שתי הרשימות ולפסילת כסיף; לגבי אבו שחאדה עמדתה הייתה שעל הוועדה לבחון בכובד ראש את עילת התמיכה במאבק מזוין. הרשימות וכסיף דוחים את הטענות וכינו את ההחלטות פוליטיות; אבו שחאדה אמר שהוא מתנגד למאבק מזוין ומעולם לא קרא לאלימות, ושהמאמר שבמרכז הבקשה לא היה צריך להתפרסם בנוסחו. רשימה שנפסלה רשאית לערער לבית המשפט העליון עד 29 בספטמבר, ופסילת מועמד טעונה את אישורו; פסיקתו תוגש לוועדה עד 4 באוקטובר והיא סופית."
          en: "On 23 September 2026 the Central Elections Committee voted 18–5, with one abstention, to disqualify the Ra’am and Joint List slates and, in separate votes, the candidates Ofer Cassif (19–5, two abstentions) and Sami Abu Shehadeh (30–4 on the ground of rejecting Israel as a Jewish and democratic state, and 31–4 – including the committee chair, Justice Noam Sohlberg – on the ground of supporting armed struggle). The requests against Ra’am were filed by Otzma Yehudit, Likud and the “Choosing Life” forum of bereaved families; against the Joint List and Cassif by Likud; and against Abu Shehadeh by Otzma Yehudit and Minister Itamar Ben Gvir. They alleged support for armed struggle against Israel and rejection of its existence as a Jewish and democratic state – and, for Ra’am, also incitement to racism. The Attorney General opposed disqualifying the two lists and Cassif; on Abu Shehadeh, her position was that the committee must weigh the armed-struggle ground seriously. The lists and Cassif reject the allegations and called the decisions political; Abu Shehadeh said he opposes armed struggle, has never called for violence, and that the article at the centre of the request should not have been published in that form. A disqualified list may appeal to the Supreme Court until 29 September, and a candidate’s disqualification needs the court’s approval; its ruling reaches the committee by 4 October and is final."
          ar: "في 23 أيلول/سبتمبر 2026 قرّرت لجنة الانتخابات المركزية، بأغلبية 18 مقابل 5 وامتناع عضو واحد، شطب قائمتي القائمة الموحدة والقائمة المشتركة، وفي تصويتات منفصلة شطب المرشحَين عوفر كسيف (19 مقابل 5، وامتناع اثنين) وسامي أبو شحادة (30 مقابل 4 بذريعة إنكار وجود إسرائيل دولةً يهودية وديمقراطية، و31 مقابل 4 – بينهم رئيس اللجنة القاضي نوعم سولبرغ – بذريعة دعم الكفاح المسلح). قدّمت الطلبات ضد القائمة الموحدة عوتسما يهوديت والليكود ومنتدى «نختار الحياة» لعائلات ثكلى؛ وضد القائمة المشتركة وكسيف الليكود؛ وضد أبو شحادة عوتسما يهوديت والوزير إيتمار بن غفير. وادّعى مقدّمو الطلبات دعم الكفاح المسلح ضد إسرائيل وإنكار وجودها دولةً يهودية وديمقراطية، وفي حالة القائمة الموحدة أيضًا التحريض على العنصرية. وعارضت المستشارة القضائية للحكومة شطب القائمتين وشطب كسيف؛ أما بشأن أبو شحادة فكان موقفها أن على اللجنة أن تنظر بجدية في ذريعة دعم الكفاح المسلح. وترفض القائمتان وكسيف الادعاءات ووصفوا القرارات بأنها سياسية؛ وقال أبو شحادة إنه يعارض الكفاح المسلح ولم يدعُ قط إلى العنف، وإن المقال الذي يتمحور حوله الطلب ما كان ينبغي أن يُنشر بصيغته تلك. ويحق للقائمة المشطوبة الاستئناف إلى المحكمة العليا حتى 29 أيلول/سبتمبر، ويتطلب شطب المرشح مصادقة المحكمة؛ ويُقدَّم قرارها إلى اللجنة حتى 4 تشرين الأول/أكتوبر وهو نهائي."
          ru: "23 сентября 2026 года Центральная избирательная комиссия 18 голосами против 5 при одном воздержавшемся проголосовала за отстранение от выборов списков РААМ и «Объединённого списка», а отдельными голосованиями — кандидатов Офера Касифа (19 против 5, двое воздержались) и Сами Абу Шехаде (30 против 4 по основанию отрицания Израиля как еврейского и демократического государства и 31 против 4 — в том числе голосом председателя комиссии судьи Ноама Сольберга — по основанию поддержки вооружённой борьбы). Ходатайства против РААМ подали «Оцма Иегудит», Ликуд и форум семей погибших «Выбираем жизнь»; против «Объединённого списка» и Касифа — Ликуд; против Абу Шехаде — «Оцма Иегудит» и министр Итамар Бен-Гвир. Заявители ссылались на поддержку вооружённой борьбы против Израиля и отрицание его существования как еврейского и демократического государства, а в случае РААМ — также на подстрекательство к расизму. Юридический советник правительства выступила против отстранения обоих списков и Касифа; по делу Абу Шехаде её позиция состояла в том, что комиссия должна серьёзно рассмотреть основание поддержки вооружённой борьбы. Списки и Касиф отвергают обвинения и назвали решения политическими; Абу Шехаде заявил, что выступает против вооружённой борьбы, никогда не призывал к насилию и что статью, ставшую центром ходатайства, не следовало публиковать в таком виде. Отстранённый список может обжаловать решение в Верховном суде до 29 сентября, а отстранение кандидата требует утверждения суда; его решение поступает в комиссию до 4 октября и является окончательным."
          es: "El 23 de septiembre de 2026 la Comisión Electoral Central votó 18 a 5, con una abstención, inhabilitar las listas de Ra’am y de la Lista Conjunta y, en votaciones separadas, a los candidatos Ofer Cassif (19 a 5, dos abstenciones) y Sami Abu Shehadeh (30 a 4 por el motivo de negar a Israel como Estado judío y democrático, y 31 a 4 —incluido el presidente de la comisión, el juez Noam Sohlberg— por el motivo de apoyo a la lucha armada). Las solicitudes contra Ra’am las presentaron Otzma Yehudit, el Likud y el foro de familias en duelo «Elegimos la vida»; contra la Lista Conjunta y Cassif, el Likud; y contra Abu Shehadeh, Otzma Yehudit y el ministro Itamar Ben Gvir. Alegaban apoyo a la lucha armada contra Israel y negación de su existencia como Estado judío y democrático y, en el caso de Ra’am, también incitación al racismo. La asesora jurídica del Gobierno se opuso a inhabilitar las dos listas y a Cassif; sobre Abu Shehadeh, su postura fue que la comisión debía examinar con seriedad el motivo del apoyo a la lucha armada. Las listas y Cassif rechazan las acusaciones y calificaron las decisiones de políticas; Abu Shehadeh dijo que se opone a la lucha armada, que nunca llamó a la violencia y que el artículo en el centro de la solicitud no debió publicarse en esa forma. Una lista inhabilitada puede recurrir ante el Tribunal Supremo hasta el 29 de septiembre, y la inhabilitación de un candidato requiere la aprobación del tribunal; su fallo llega a la comisión a más tardar el 4 de octubre y es definitivo."
          fr: "Le 23 septembre 2026, la Commission électorale centrale a voté par 18 voix contre 5, avec une abstention, l’invalidation des listes de Ra’am et de la Liste commune et, par des votes distincts, celle des candidats Ofer Cassif (19 contre 5, deux abstentions) et Sami Abu Shehadeh (30 contre 4 pour le motif du rejet d’Israël en tant qu’État juif et démocratique, et 31 contre 4 — dont le président de la commission, le juge Noam Sohlberg — pour le motif du soutien à la lutte armée). Les demandes contre Ra’am avaient été déposées par Otzma Yehoudit, le Likoud et le forum de familles endeuillées « Choisir la vie » ; contre la Liste commune et Cassif, par le Likoud ; et contre Abu Shehadeh, par Otzma Yehoudit et le ministre Itamar Ben Gvir. Elles invoquaient un soutien à la lutte armée contre Israël et le rejet de son existence en tant qu’État juif et démocratique — et, pour Ra’am, également l’incitation au racisme. La conseillère juridique du gouvernement s’est opposée à l’invalidation des deux listes et de Cassif ; au sujet d’Abu Shehadeh, sa position était que la commission devait examiner sérieusement le motif du soutien à la lutte armée. Les listes et Cassif rejettent ces accusations et ont qualifié les décisions de politiques ; Abu Shehadeh a déclaré s’opposer à la lutte armée, n’avoir jamais appelé à la violence et que l’article au cœur de la demande n’aurait pas dû être publié sous cette forme. Une liste invalidée peut faire appel devant la Cour suprême jusqu’au 29 septembre, et l’invalidation d’un candidat doit être approuvée par la Cour ; sa décision parvient à la commission au plus tard le 4 octobre et est définitive."
        sources:
          - { url: "https://www.timesofisrael.com/election-panel-votes-to-bar-balad-chief-abu-shehadeh-over-alleged-support-for-terror/", title: "Election panel votes on the Ra'am and Joint List slates and on Abu Shehadeh and Cassif (23 Sep 2026)", publisher: "The Times of Israel" }
          - { url: "https://www.jpost.com/israel-news/politics-and-diplomacy/article-909454", title: "Central Elections Committee decision on Ra'am and the Joint List (23 Sep 2026)", publisher: "The Jerusalem Post" }
          - { url: "https://www.gov.il/en/pages/candidates-lists-26", title: "Lists of Candidates — disqualification and appeal timetable (updated 3 Sep 2026)", publisher: "ועדת הבחירות המרכזית" }
          - { url: "https://www.gov.il/BlobFolder/guide/candidates-lists-26/he/pm6_26_fdCassif.cleaned.pdf", title: "פ\"מ 6/26 הליכוד נ' הרשימה המשותפת וכסיף — החלטה סופית (24.9.2026)", publisher: "ועדת הבחירות המרכזית" }
          - { url: "https://www.gov.il/BlobFolder/guide/candidates-lists-26/he/pm8_26_fdAbuShehadeh.cleaned.pdf", title: "פ\"מ 8/26 עוצמה יהודית ובן גביר נ' אבו שחאדה — החלטה סופית (24.9.2026)", publisher: "ועדת הבחירות המרכזית" }
          - { url: "https://www.jpost.com/israel-election-2026/article-909460", title: "The committee's vote on Abu Shehadeh and his response (23 Sep 2026)", publisher: "The Jerusalem Post" }
