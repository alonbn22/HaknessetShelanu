    title:
      he: "כיהן כראש ממשלת ישראל (2022)"
      en: "Served as Prime Minister of Israel (2022)"
    description:
      he: "ייסד את מפלגת יש עתיד (2012). כיהן כשר האוצר (2013–2014) וכשר החוץ (2021–2022), ובמסגרת הסכם רוטציה כיהן כראש הממשלה ה-14 של ישראל מ-1 ביולי 2022 עד 29 בדצמבר 2022."
      en: "Founded the Yesh Atid party (2012). Served as Finance Minister (2013–2014) and Foreign Minister (2021–2022), and under a rotation agreement served as Israel's 14th Prime Minister from 1 July 2022 until 29 December 2022."
