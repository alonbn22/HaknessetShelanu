      - date: "2025-11-06"
        text:
          he: "בנימין נתניהו הוכרז כיו\"ר תנועת הליכוד וכמועמדה לראשות הממשלה בבחירות לכנסת ה-26, לאחר שהיה המועמד היחיד בבחירות המקדימות ליו\"ר שהוכרזו ב-23 באוקטובר 2025."
          en: "Benjamin Netanyahu was declared Likud chairman and the party’s candidate for prime minister for the 26th-Knesset election, having been the sole candidate in the leadership primary called on 23 October 2025."
          ar: "أُعلن بنيامين نتنياهو رئيسًا لحركة الليكود ومرشّحها لرئاسة الحكومة في انتخابات الكنيست الـ26، بعدما كان المرشّح الوحيد في الانتخابات التمهيدية على رئاسة الحزب التي أُعلن عنها في 23 تشرين الأول/أكتوبر 2025."
          ru: "Биньямин Нетаньяху объявлен председателем движения «Ликуд» и его кандидатом на пост премьер-министра на выборах в Кнессет 26-го созыва: он был единственным кандидатом на праймериз на пост председателя, объявленных 23 октября 2025 года."
          es: "Benjamín Netanyahu fue proclamado presidente del Likud y candidato del partido a primer ministro para las elecciones a la 26.ª Knéset, tras ser el único candidato en las primarias de liderazgo convocadas el 23 de octubre de 2025."
          fr: "Benyamin Netanyahou a été proclamé président du Likoud et candidat du parti au poste de Premier ministre pour les élections à la 26e Knesset, ayant été le seul candidat à la primaire pour la présidence du parti convoquée le 23 octobre 2025."
        sources:
          - { url: "https://www.likud.org.il/images/yor/2025/%D7%94%D7%9B%D7%A8%D7%96%D7%94_%D7%A2%D7%9C_%D7%91%D7%97%D7%99%D7%A8%D7%AA%D7%95_%D7%A9%D7%9C_%D7%91%D7%A0%D7%99%D7%9E%D7%99%D7%9F_%D7%A0%D7%AA%D7%A0%D7%99%D7%94%D7%95_%D7%9C%D7%9B%D7%94%D7%95%D7%A0%D7%AA_%D7%99%D7%95%D7%A8_%D7%94%D7%9C%D7%99%D7%9B%D7%95%D7%93_%D7%95%D7%9E%D7%95%D7%A2%D7%9E%D7%93_%D7%9C%D7%9B%D7%94%D7%95%D7%A0%D7%AA_%D7%A8%D7%90%D7%A9_%D7%9E%D7%9E%D7%A9%D7%9C%D7%AA_%D7%99%D7%A9%D7%A8%D7%90%D7%9C.pdf", title: "הכרזה על בחירתו של מר בנימין נתניהו לכהונת יושב ראש תנועת הליכוד ומועמדה לכהונת ראש ממשלת ישראל בבחירות לכנסת ה-26 (2025-11-06)", publisher: "הליכוד (ועדת הבחירות המרכזית של התנועה)" }
      - date: "2026-07-03"
        text:
          he: "ח\"כ יולי אדלשטיין הודיע על פרישה מהליכוד ועל כך שלא יתמודד בפריימריז; ב-6 באוגוסט 2026 הציג יחד עם גלעד ארדן מפלגה חדשה, ב-4 בספטמבר הודיע ארדן כי המפלגה לא תתמודד, וב-6 בספטמבר הודיעה הנהלת הליכוד על הפסקת חברותם במפלגה וקראה לאדלשטיין להתפטר מהכנסת. אדלשטיין עדיין רשום כחבר סיעת הליכוד."
          en: "MK Yuli Edelstein announced he was leaving Likud and would not run in its primary; on 6 August 2026 he and Gilad Erdan launched a new party, on 4 September Erdan said it would not run, and on 6 September Likud’s management ended both men’s party membership and called on Edelstein to resign from the Knesset. Edelstein remains listed as a member of the Likud faction."
          ar: "أعلن عضو الكنيست يولي إدلشتاين انسحابه من الليكود وأنه لن يخوض انتخاباته التمهيدية؛ وفي 6 آب/أغسطس 2026 قدّم مع غلعاد إردان حزبًا جديدًا، وفي 4 أيلول/سبتمبر أعلن إردان أن الحزب لن يخوض الانتخابات، وفي 6 أيلول/سبتمبر أعلنت إدارة الليكود إنهاء عضويتهما في الحزب ودعت إدلشتاين إلى الاستقالة من الكنيست. لا يزال إدلشتاين مسجّلًا عضوًا في كتلة الليكود."
          ru: "Депутат Юлий Эдельштейн объявил о выходе из Ликуда и о том, что не будет участвовать в праймериз; 6 августа 2026 года он вместе с Гиладом Эрданом представил новую партию, 4 сентября Эрдан заявил, что партия не пойдёт на выборы, а 6 сентября руководство Ликуда объявило о прекращении членства обоих в партии и призвало Эдельштейна сложить депутатский мандат. Эдельштейн по-прежнему числится членом фракции Ликуда."
          es: "El diputado Yuli Edelstein anunció que dejaba el Likud y que no se presentaría a sus primarias; el 6 de agosto de 2026 presentó junto a Gilad Erdan un nuevo partido, el 4 de septiembre Erdan dijo que no se presentaría, y el 6 de septiembre la dirección del Likud dio por terminada la afiliación de ambos e instó a Edelstein a renunciar a la Knéset. Edelstein sigue figurando como miembro de la facción del Likud."
          fr: "Le député Yuli Edelstein a annoncé qu’il quittait le Likoud et ne se présenterait pas à sa primaire ; le 6 août 2026, il a lancé avec Gilad Erdan un nouveau parti, le 4 septembre Erdan a déclaré qu’il ne se présenterait pas, et le 6 septembre la direction du Likoud a mis fin à l’adhésion des deux hommes et appelé Edelstein à démissionner de la Knesset. Edelstein reste inscrit comme membre de la faction du Likoud."
