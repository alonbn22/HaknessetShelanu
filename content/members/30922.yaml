      he: "שבתאי קטש נכנס לכנסת ה-25 מטעם הליכוד ב-13 באוגוסט 2026, לאחר שח\"כ דן אילוז פרש מהליכוד (יולי 2026), הצטרף לישראל ביתנו והגיש את התפטרותו מהכנסת ב-11 באוגוסט 2026. לפי אתר הכנסת, פרטי הרקע של חבר הכנסת טרם נמסרו למערכת."
