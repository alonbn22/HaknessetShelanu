claims:
  - kind: positive
    category: achievement
    title:
      he: מכהן כשר התרבות והספורט
      en: Serving as Minister of Culture and Sport
    description:
      he: מיקי זוהר, חבר מפלגת הליכוד, מונה לשר התרבות והספורט בממשלה ה-37 ב-29 בדצמבר 2022. קודם לכן כיהן כחבר הכנסת מטעם הליכוד החל משנת 2015, ובין היתר שימש כסגן יושב ראש הכנסת ויושב ראש הקואליציה.
      en: Miki Zohar, a member of the Likud party, was appointed Minister of Culture and Sport in Israel's 37th government on 29 December 2022. He previously served as a Likud member of the Knesset from 2015, including roles as Deputy Speaker of the Knesset and coalition whip.
    date: 2022-12-29
    sources:
      - url: https://en.wikipedia.org/wiki/Miki_Zohar
        title: Miki Zohar
        publisher: Wikipedia
  - kind: positive
    category: achievement
    title:
      he: יזם את חוק יום העלייה
      en: Initiated the Yom HaAliyah (Aliyah Day) law
    description:
      he: כחבר כנסת, זוהר היה בין יוזמי החוק שקבע את יום העלייה כחג לאומי בלוח השנה הישראלי. הכנסת אישרה את החוק ב-21 ביוני 2016, וזוהי דוגמה לחקיקה שזכתה לתמיכה חוצת מפלגות מהקואליציה והאופוזיציה.
      en: As a member of the Knesset, Zohar was among the initiators of the law adding Yom HaAliyah (Aliyah Day) as a national holiday to the Israeli calendar. The Knesset approved the law on 21 June 2016, in a cross-party effort supported by both coalition and opposition members.
    date: 2016-06-21
    sources:
      - url: https://en.wikipedia.org/wiki/Miki_Zohar
        title: Miki Zohar
        publisher: Wikipedia
      - url: https://en.wikipedia.org/wiki/Yom_HaAliyah
        title: Yom HaAliyah
        publisher: Wikipedia
  - kind: positive
    category: achievement
    title:
      he: שירות צבאי בצה"ל
      en: Military service in the IDF
    description:
      he: זוהר שירת בצבא ההגנה לישראל והשתחרר בדרגת סמל.
      en: Zohar served in the Israel Defense Forces, reaching the rank of sergeant.
    sources:
