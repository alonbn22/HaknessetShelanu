claims:
  - kind: positive
    category: achievement
    title:
      he: תת-אלוף (מיל') בצה"ל
      en: IDF Brigadier General (reserve)
    description:
      he: צביקה פוגל שירת בצה"ל ופרש בשנת 2003 בדרגת תת-אלוף. במהלך שירותו פיקד על
        סוללת תותחים במלחמת לבנון הראשונה (1982), על גדוד התותחנים 334 במבצע דין
        וחשבון (1993) ועל חטיבת התותחנים 282 במבצע ענבי זעם (1996), וכיהן כראש
        מטה פיקוד הדרום.
      en: Zvika Fogel served in the Israel Defense Forces and retired in 2003 with the
        rank of brigadier general (tat aluf). During his career he commanded an
        artillery battery in the 1982 Lebanon War, the 334th Artillery Battalion
        during Operation Accountability (1993) and the 282nd Artillery Brigade
        during Operation Grapes of Wrath (1996), and served as chief of staff of
        Southern Command.
    date: "2003"
    sources:
