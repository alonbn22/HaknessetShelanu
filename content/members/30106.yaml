    title:
      he: "זכתה במקום השני בפריימריז של הדמוקרטים"
      en: "Won second place in The Democrats' primary"
    description:
      he: "ב-20 ביולי 2026 זכתה לזימי במקום השני ברשימת הדמוקרטים לכנסת ה-26, מיד אחרי יו\"ר המפלגה יאיר גולן, בפריימריז הראשונים של המפלגה, שבהם הצביעו כ-97 אלף מתוך כ-112 אלף חברי המפלגה. במקום השלישי דורג גלעד קריב."
      en: "On 20 July 2026 Lazimi won the second spot on The Democrats' list for the 26th Knesset, directly after party chairman Yair Golan, in the party's first primary, in which about 97,000 of roughly 112,000 members voted. Gilad Kariv was placed third."
    sources:
