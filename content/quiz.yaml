# The election compass — statements and each running list's stance on them.
#
# Rules (the site's, and the user's standing rule): a stance exists only where a
# trusted source states it — a roll-call vote in the Knesset (the strongest
# record: the faction's own votes, cited to the Knesset's OData record), the
# list's published platform, or a leader's statement in a major outlet. Where a
# list has no sourced position the key is absent and the page shows "no stated
# position" — never a default, never an inference from ideology.
#
# `value` is on the same scale as the reader's answers: 2 strongly agree,
# 1 agree, 0 neither, -1 disagree, -2 strongly disagree. Vote-based values:
# ±2 when the faction's net vote (for minus against, over those who voted) is
# at least 0.8 — nine in ten or more one way; ±1 for any other split of at
# least 0.2; 0 for an even split; absent = no stance. When fewer than half the
# faction voted, the value is capped at ±1 and the quote says so. A vote cast
# by a predecessor faction (Yesh Atid for Together, National Unity for Blue and
# White, Labor for the Democrats) is disclosed in `recordOf`. "statement"
# means the leader's or the list's own words as reported by a major outlet;
# a reporter's characterisation is never a stance.
# `lean` says which side of the aisle agrees with the statement; the set is
# balanced 8/8 and alternates, so an "agree" bias cannot tilt results (a test
# asserts it). Together has no faction of its own in the 25th Knesset — where
# a vote is cited for it, it is Yesh Atid's, and `recordOf` says so. A vote
# on an opposition bill counts against a coalition faction only where the
# coalition did not advance its own version of the measure; where it did
# (the 2024 climate bill), the record is mixed and the value is 0. Quotes for
# the 20 Sep 2026 statements are he+en; es/fr readers see the English with
# lang="en" until translated. Each
# statement also carries a `short` label (for the result summaries) and a
# plain-words `explainer` (what it is about, what each side argues — no
# verdict), both in six languages.
#
# A statement enters only with sourced stances for at least 8 of the 15 lists
# (tests/qa/quiz.test.ts). Dropped on 20 Sep 2026 for that reason: direct
# state intervention in housing and prices (5 of 15 — most platforms name
# competition as the tool and say nothing about supervision or public
# building, which is not a stance). Removed on 20 Sep 2026 at the user's
# request: "the next government should be led by Netanyahu" — the compass is
# about what the lists want, not whom they crown. Research notes for the
# 20 Sep statements: scratchpad review/compass/*.yaml (one file per statement,
# with what was tried for every list left out).
lastReviewed: "2026-09-20"
questions:
  - id: palestinian-state
    topic: security
    lean: left
    text:
      he: "ישראל צריכה לתמוך בהקמת מדינה פלסטינית במסגרת הסכם שלום."
      en: "Israel should support the establishment of a Palestinian state as part of a peace agreement."
      ar: "يجب أن تدعم إسرائيل إقامة دولة فلسطينية في إطار اتفاق سلام."
      ru: "Израиль должен поддержать создание палестинского государства в рамках мирного соглашения."
      es: "Israel debería apoyar la creación de un Estado palestino como parte de un acuerdo de paz."
      fr: "Israël devrait soutenir la création d’un État palestinien dans le cadre d’un accord de paix."
    short:
      he: "מדינה פלסטינית"
      en: "A Palestinian state"
      ar: "دولة فلسطينية"
      ru: "Палестинское государство"
      es: "Un Estado palestino"
      fr: "Un État palestinien"
    explainer:
      he: "השאלה היא אם הפתרון לסכסוך הוא שתי מדינות — ישראל ומדינה פלסטינית זו לצד זו — או לא. התומכים אומרים שזו הדרך היחידה לשלום ולשמירה על רוב יהודי ודמוקרטי; המתנגדים אומרים שמדינה פלסטינית תהיה סכנה ביטחונית, במיוחד אחרי 7 באוקטובר, ושאין שותף."
      en: "The question is whether the solution to the conflict is two states — Israel and a Palestinian state side by side — or not. Supporters say it is the only path to peace and to keeping a Jewish and democratic majority; opponents say a Palestinian state would be a security danger, especially after 7 October, and that there is no partner."
      ar: "السؤال هو ما إذا كان حل الصراع هو دولتان — إسرائيل ودولة فلسطينية جنبًا إلى جنب — أم لا. يقول المؤيدون إنه الطريق الوحيد إلى السلام وإلى الحفاظ على أغلبية يهودية وديمقراطية؛ ويقول المعارضون إن دولة فلسطينية ستكون خطرًا أمنيًا، خصوصًا بعد 7 أكتوبر، وإنه لا يوجد شريك."
      ru: "Вопрос в том, является ли решением конфликта два государства — Израиль и палестинское государство рядом — или нет. Сторонники говорят, что это единственный путь к миру и к сохранению еврейского демократического большинства; противники — что палестинское государство станет угрозой безопасности, особенно после 7 октября, и что партнёра нет."
      es: "La cuestión es si la solución al conflicto son dos Estados — Israel y un Estado palestino uno junto al otro — o no. Los partidarios dicen que es el único camino hacia la paz y para mantener una mayoría judía y democrática; los opositores dicen que un Estado palestino sería un peligro para la seguridad, sobre todo después del 7 de octubre, y que no hay socio."
      fr: "La question est de savoir si la solution du conflit est deux États — Israël et un État palestinien côte à côte — ou non. Les partisans disent que c’est la seule voie vers la paix et vers le maintien d’une majorité juive et démocratique ; les opposants disent qu’un État palestinien serait un danger pour la sécurité, surtout après le 7 octobre, et qu’il n’y a pas de partenaire."
