  - kind: negative
    category: controversy
    status: closed
    title:
      he: הפרת סגר הקורונה ביום כיפור 2020; היועץ המשפטי לא פתח בחקירה
      en: COVID-19 lockdown breach on Yom Kippur 2020; no criminal probe opened
    description:
      he: באוקטובר 2020, בעת כהונתה כשרה להגנת הסביבה, נסעה גמליאל מביתה בתל אביב
        לטבריה לתפילות יום כיפור בעת הסגר הארצי השני, ולאחר מכן אובחנה כחיובית
        לקורונה. גמליאל אמרה כי פעלה לפי ההנחיות אך "ייתכן שטעיתי בשיקול הדעת".
        בעקבות דיווחים שלפיהם מסרה מידע שגוי לחוקרים האפידמיולוגיים, נבחנה
        האפשרות לפתוח בחקירה פלילית; היועץ המשפטי לממשלה אביחי מנדלבליט החליט
        ב-19 באוקטובר 2020 שלא לפתוח בחקירה, קבע כי "אין בסיס" לטענה שמסרה מידע
        כוזב, והפער יוחס לתקלה במערכת המחשוב של משרד הבריאות.
      en: In October 2020, while serving as Minister of Environmental Protection,
        Gamliel travelled from her Tel Aviv home to Tiberias for Yom Kippur
        prayers during Israel's second national lockdown, and was subsequently
        diagnosed with COVID-19. Gamliel said she had acted in line with the
        guidelines but "may have erred in judgment". Following reports that she
        had given incorrect information to contact tracers, a criminal
        investigation was considered; on 19 October 2020 Attorney General
        Avichai Mandelblit decided not to open a probe, finding "no basis" for
        the allegation that she misled tracers, and the discrepancy was
        attributed to a Health Ministry computer glitch.
    date: 2020-10-05
