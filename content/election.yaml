      es: "Último día para comunicar a la Comisión Central los acuerdos de votos sobrantes entre listas (artículo 67(b) de la ley)."
      fr: "Dernier jour pour notifier à la Commission centrale les accords de report des voix restantes entre listes (article 67(b) de la loi)."
