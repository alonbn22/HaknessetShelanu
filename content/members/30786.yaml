    description:
      he: "ב-29 בדצמבר 2022 מונה שיקלי, מטעם הליכוד, לשר התפוצות ולשר לשוויון חברתי. עם כניסתו לתפקיד הודיע על שינוי שם המשרד כך שיכלול את המאבק באנטישמיות."
