    title:
      he: ועדת האתיקה של הכנסת השעתה אותו לשישה חודשים
      en: Knesset Ethics Committee suspended him for six months
    description:
      he: ב-11 בנובמבר 2024 החליטה ועדת האתיקה של הכנסת פה אחד להשעות את חבר הכנסת
        עופר כסיף למשך שישה חודשים מהשתתפות במליאה ובוועדות (למעט הצבעות), וכן
        לעכב את שכרו לשבועיים. ההחלטה התקבלה בעקבות תלונות על אמירותיו בנוגע
        לצה"ל ולמלחמה בעזה. כסיף טען שדבריו הם התבטאות פוליטית המוגנת בחופש
        הביטוי. בנפרד, בפברואר 2024 נכשלה בכנסת הצעה להדיחו לאחר שזכתה ל-85
        קולות בלבד מתוך 90 הנדרשים.
      en: On 11 November 2024 the Knesset Ethics Committee voted unanimously to
        suspend MK Ofer Cassif for six months from participating in plenary and
        committee sessions (except to vote), and to withhold two weeks' salary.
        The decision followed complaints over his remarks concerning the IDF and
        the Gaza war. Cassif said his statements were political speech
        protected by freedom of expression. Separately, a February 2024 motion
        to expel him from the Knesset failed, securing only 85 of the 90 votes
        required.
    date: 2024-11-11
