    title:
      he: "רקע מקצועי כעורך דין ובשירות הציבורי הדתי"
      en: "Professional background as a lawyer and in religious public service"
    description:
      he: "מלול הוא עורך דין בעל תארי בוגר ומוסמך במשפטים מהקריה האקדמית אונו. בשנת 2015 שימש כיועץ השר לשירותי דת דוד אזולאי, ובהמשך אותה שנה כראש מטה לשכת מנכ״ל המשרד לשירותי דת. כן שימש כמנהל מכון 'יחוה דעת'."
      en: "Malul is a licensed attorney who earned bachelor's and master's degrees in law from Ono Academic College. In 2015 he was an adviser to Minister of Religious Services David Azulai, and later that year head of the director-general's bureau at the Ministry of Religious Services. He also directed the Yechaveh Da'at institute."
      ar: "ملول محامٍ حاصل على البكالوريوس والماجستير في الحقوق من الكلية الأكاديمية أونو. في عام 2015 عمل مستشارًا لوزير الخدمات الدينية دافيد أزولاي، ثم في العام نفسه رئيسًا لطاقم مكتب المدير العام لوزارة الخدمات الدينية. كما أدار معهد «يحوِّه دعات»."
      ru: "Малуль — адвокат, получивший степени бакалавра и магистра права в Академическом колледже Оно. В 2015 году он был советником министра по делам религий Давида Азулая, а позднее в том же году — руководителем канцелярии генерального директора Министерства по делам религий. Он также руководил институтом «Йехаве Даат»."
      es: "Malul es abogado, con licenciatura y máster en Derecho por el Colegio Académico Ono. En 2015 fue asesor del ministro de Servicios Religiosos, David Azulai, y ese mismo año, más tarde, jefe de gabinete de la dirección general del Ministerio de Servicios Religiosos. También dirigió el instituto Yejavé Daat."
      fr: "Malul est avocat, titulaire d’une licence et d’un master en droit du Collège académique Ono. En 2015, il a été conseiller du ministre des Services religieux, David Azoulay, puis, la même année, chef de cabinet du directeur général du ministère des Services religieux. Il a également dirigé l’institut Yehavé Daat."
