      he: "חבר הכנסת מטעם ש\"ס"
      en: "Member of Knesset for Shas"
    description:
      he: "מיכאל מלכיאלי מכהן כחבר הכנסת מטעם מפלגת ש\"ס החרדית-הספרדית. הוא נכנס לכנסת לראשונה ב-2 בנובמבר 2016, כמחליפו של יו\"ר ש\"ס אריה דרעי שהתפטר מהכנסת, ומאז כיהן ברציפות בכנסות ה-20 עד ה-25."
      en: "Michael Malchieli serves as a member of the Knesset for the Sephardi ultra-Orthodox Shas party. He first entered the Knesset on 2 November 2016 as a replacement for Shas leader Aryeh Deri, who had resigned from the Knesset, and has since served continuously from the 20th through the 25th Knesset."
