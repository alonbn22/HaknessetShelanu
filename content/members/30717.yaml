    title:
      he: מונה לשר העלייה והקליטה
      en: Appointed Minister of Aliyah and Integration
    description:
      he: אופיר סופר, חבר הכנסת מטעם הציונות הדתית, מונה לשר העלייה והקליטה ב-29
        בדצמבר 2022 עם השבעת הממשלה השלושים ושבע, ומכהן בתפקיד מאז.
      en: Ofir Sofer, a Knesset member for the Religious Zionism party, was appointed
        Minister of Aliyah and Integration on 29 December 2022 upon the
        formation of Israel's thirty-seventh government, and has held the office
        since.
