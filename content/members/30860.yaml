    title:
      he: "חברת הכנסת ה-25 מטעם הליכוד"
      en: "Member of the 25th Knesset for Likud"
    description:
      he: "טלי גוטליב (רויטל גוטליב), עורכת דין במקצועה, נבחרה לכנסת ה-25 במסגרת רשימת הליכוד בבחירות 2022. היא מכהנת בכמה ועדות, ובהן ועדת החוקה, חוק ומשפט, וביום 29 באוקטובר 2025 הצטרפה לוועדת החוץ והביטחון במקום ח\"כ יולי אדלשטיין."
      en: "Tally Gotliv (Revital Gotliv), a lawyer by profession, was elected to the 25th Knesset on the Likud list in the 2022 election. She serves on several committees, including the Constitution, Law and Justice Committee, and on 29 October 2025 joined the Foreign Affairs and Defense Committee, replacing MK Yuli Edelstein."
    date: "2022-11-15"
