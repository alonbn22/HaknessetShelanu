        en: "\"We founded the Amkha Yisrael party – a new national right-wing movement.\""
        ar: "«أسّسنا حزب عمخا يسرائيل – حركة قومية يمينية جديدة.»"
        ru: "«Мы создали партию „Амха Исраэль“ — новое национальное правое движение»."
