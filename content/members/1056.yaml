    title:
      he: "כיהן כשר השירותים הדתיים וכשר הרווחה והביטחון החברתי"
      en: "Served as Minister of Religious Services and Minister of Welfare and Social Affairs"
    description:
      he: "יעקב מרגי, חבר כנסת מטעם ש\"ס, כיהן כשר השירותים הדתיים בין השנים 2009 ל-2013, וכשר הרווחה והביטחון החברתי מדצמבר 2022 ועד התפטרותו ב-17 ביולי 2025, עם פרישת ש\"ס מהממשלה על רקע אי-חקיקת חוק הפטור לבני הישיבות."
      en: "Yaakov Margi, a Shas Knesset member, served as Minister of Religious Services from 2009 to 2013, and as Minister of Welfare and Social Affairs from December 2022 until his resignation on 17 July 2025, when Shas withdrew from the government over the failure to pass a yeshiva-student draft-exemption law."
