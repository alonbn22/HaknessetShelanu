    title:
      he: שר שיתוף פעולה אזורי ושר נוסף במשרד המשפטים
      en: Minister of Regional Cooperation and additional minister in the Justice
        Ministry
    description:
      he: בפברואר 2023 החליטה ממשלת נתניהו לצרף את אמסלם כשר שיתוף הפעולה האזורי, שר
        נוסף במשרד המשפטים והשר המקשר בין הממשלה לכנסת, והכנסת אישרה את המינוי ב-28 במרץ 2023 ברוב של 37 מול 25. בין תחומי אחריותו נכללה
        גם רשות החברות הממשלתיות.
      en: In February 2023, the Netanyahu government decided to add Amsalem as
        Minister of Regional Cooperation, an additional minister in the Justice
        Ministry, and the minister liaising between the government and the
        Knesset; the Knesset approved the appointment on 28 March 2023 by 37 votes to 25. His portfolios included oversight of the Government Companies
        Authority.
    date: 2023-03-28
