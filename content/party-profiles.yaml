    summary:
      he: מפלגת ימין ממלכתית בראשות גדעון סער.
      en: A right-wing party (“The National Right”) led by Gideon Sa’ar.
      ar: حزب يميني («اليمين الرسمي») بقيادة جدعون ساعر.
      ru: Государственническая правая партия во главе с Гидеоном Сааром.
      es: "Un partido de derecha («Derecha Nacional») encabezado por Gideon Sa’ar."
      fr: "Un parti de droite (« Droite nationale ») dirigé par Gideon Sa’ar."
    positions:
      he:
        - קו ימני ביטחוני לצד שמירה על מוסדות המדינה
        - שלטון החוק וממלכתיות
        - כלכלה ליברלית
      en:
        - A security-minded right-wing line alongside respect for state institutions
        - Rule of law and statesmanship
        - Liberal economics
      ar:
        - "خط يميني أمني إلى جانب احترام مؤسسات الدولة"
        - "سيادة القانون وتغليب مصلحة الدولة"
        - "اقتصاد ليبرالي"
      ru:
        - "Правая линия с упором на безопасность наряду с уважением к государственным институтам"
        - "Верховенство закона и государственный подход"
        - "Либеральная экономика"
      es:
        - Una línea de derecha centrada en la seguridad junto al respeto de las instituciones del Estado
        - Estado de derecho y sentido de Estado
        - Economía liberal
