  - kind: positive
    category: achievement
    title:
      he: מנכ"לית אשכול הרשויות הראשון בישראל ורקע בשירות הציבורי
      en: CEO of Israel's first regional authorities cluster and public-service
        background
    description:
      he: לפני כניסתה לפוליטיקה ניהלה רון בן משה תוכניות תעסוקה בג'וינט ישראל, ובשנת
        2015 מונתה למנכ"לית אשכול רשויות מקומיות בגליל המערבי, שתואר כאשכול
        האזורי הראשון מסוגו בישראל. כן עבדה בעברה בשירות הביטחון הכללי (שב"כ).
      en: Before entering politics, Ron Ben-Moshe managed employment programs at JDC
        Israel (the Joint Distribution Committee) and, in 2015, was appointed
        CEO of the Western Galilee regional authorities cluster, described as
        the first such cluster in Israel. She had also previously worked for the
        Shin Bet (Israel Security Agency).
