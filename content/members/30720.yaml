      en: Yorai Lahav-Hertzanu, a Yesh Atid lawmaker, is openly gay. When he was sworn
        in in June 2020 he became the sixth openly gay member in the history of
        the 120-seat Knesset, publicly affirming his identity and pledging to
        advance equal rights for the LGBTQ+ community.
