    title:
      he: סגן ראש עיריית ירושלים וממלא מקום ראש העיר
      en: Deputy Mayor of Jerusalem and acting mayor
    description:
      he: פינדרוס נבחר למועצת עיריית ירושלים בשנת 2008 וכיהן כסגן ראש העיר ומחזיק תיק
        התברואה ושיפור פני העיר. בשנת 2016 שימש כממלא מקום ראש עיריית ירושלים.
      en: Pindrus became a member of the Jerusalem City Council in 2008 and served as
        deputy mayor with the portfolio for sanitation and city improvements. In
        2016 he served as acting mayor of Jerusalem.
