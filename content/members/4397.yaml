    title:
      he: "הודיע על שובו לליכוד ועל התמודדות בפריימריז"
      en: "Announced his return to Likud and a run in its primaries"
    description:
      he: "ב-11 במאי 2026 הודיע אלקין, שהגיע לממשלה מטעם תקווה חדשה של גדעון סער, כי חזר סופית לליכוד ויתמודד בפריימריז של המפלגה לקראת בחירות 2026, לאחר שמרכז הליכוד אישר את הסכם המיזוג עם תקווה חדשה. ביוני 2026 דווח כי ההסכם, שהבטיח לסיעת סער שני מקומות ריאליים, עומד בסימן שאלה."
      en: "On 11 May 2026 Elkin, who had entered the government on behalf of Gideon Sa'ar's New Hope, announced that he had returned to Likud for good and would run in the party's primaries ahead of the 2026 election, after the Likud Central Committee approved the merger agreement with New Hope. In June 2026 it was reported that the agreement, which had guaranteed Sa'ar's faction two realistic slots, was in doubt."
