  - kind: negative
    category: investigation
    status: ongoing
    date: "2025-12-28"
    title:
      he: "בדיקת משטרה בחשד לעבירות טוהר המידות במשרד החינוך"
      en: "Police examination over suspected integrity offenses at the Education Ministry"
      ar: "فحص شرطي في شبهات مخالفات نزاهة في وزارة التربية والتعليم"
      ru: "Полицейская проверка по подозрению в нарушениях добросовестности в Министерстве образования"
    description:
      he: "בעקבות תחקירי תקשורת (כאן 11 / ערוץ 12) פנתה התנועה לאיכות השלטון למשטרה בדרישה לחקירה פלילית, בטענה שקיש הקצה משאבי משרד החינוך לרשויות מקומיות ולמקורבים משיקולים פוליטיים ואישיים, ופירטה שש פרשיות. ב-28 בדצמבר 2025 הודיעה המשטרה כי הבקשה לפתוח בחקירה נגד קיש ואחרים בחשד לעבירות טוהר המידות (מרמה, הפרת אמונים ושימוש במשאבי המשרד) נבחנת באגף החקירות והמודיעין, וכי מדובר בשלב בדיקה מקדים. קיש דחה את הטענות. נכון לספטמבר 2026 לא דווח על החלטה לפתוח בחקירה פלילית מלאה ולא הוגש כתב אישום; חזקת החפות עומדת לו."
      en: "Following media investigations (KAN 11 / Channel 12), the Movement for Quality Government asked the police to open a criminal investigation, alleging that Kisch allocated Education Ministry resources to local authorities and associates on political and personal grounds, and listing six cases. On 28 December 2025 the police said the request to investigate Kisch and others on suspicion of integrity offenses (fraud, breach of trust and misuse of ministry resources) was under examination by the Investigations and Intelligence Division, at a preliminary stage. Kisch rejected the allegations. As of September 2026 no decision to open a full criminal investigation has been reported and no indictment has been filed; the presumption of innocence applies."
      ar: "في أعقاب تحقيقات إعلامية (كان 11 / القناة 12)، طلبت حركة جودة الحكم من الشرطة فتح تحقيق جنائي، مدعيةً أن كيش خصّص موارد وزارة التربية لاعتبارات سياسية وشخصية. وفي 28 كانون الأول/ديسمبر 2025 أفادت الشرطة بأن الطلب قيد الفحص الأولي. نفى كيش الادعاءات. حتى أيلول/سبتمبر 2026 لم يُعلن عن فتح تحقيق جنائي كامل ولم تُقدَّم لائحة اتهام؛ وتُطبَّق قرينة البراءة."
      ru: "После журналистских расследований (KAN 11 / 12-й канал) Движение за качество власти потребовало уголовного расследования, утверждая, что Киш распределял ресурсы Министерства образования по политическим и личным соображениям. 28 декабря 2025 года полиция сообщила, что запрос находится на предварительном рассмотрении. Киш отверг обвинения. По состоянию на сентябрь 2026 года о возбуждении полного уголовного дела не сообщалось, обвинение не предъявлено; действует презумпция невиновности."
