  - id: 1107 # Noam
    verified: "2026-09-19"
    logo: { src: "/assets/logos/noam.png", plate: "dark", source: { url: "https://he.wikipedia.org/wiki/%D7%A7%D7%95%D7%91%D7%A5:%D7%A1%D7%9E%D7%9C_%D7%9E%D7%A4%D7%9C%D7%92%D7%AA_%D7%A0%D7%A2%D7%9D.jpeg", title: "קובץ:סמל מפלגת נעם.jpeg — הלוגו של נעם לישראל (2026)", publisher: "Hebrew Wikipedia" } }
    updates:
      - date: "2025-03-24"
        text:
          he: "סגן השר אבי מעוז הגיש את התפטרותו מהממשלה (סגן שר במשרד ראש הממשלה, אחראי על הרשות לזהות יהודית לאומית), בטענה שההסכם הקואליציוני עם הליכוד לא מומש."
          en: "Deputy Minister Avi Maoz submitted his resignation from the government (deputy minister in the Prime Minister’s Office, in charge of the Jewish National Identity office), saying his coalition agreement with Likud had not been implemented."
          ar: "قدّم نائب الوزير آفي ماعوز استقالته من الحكومة (نائب وزير في مكتب رئيس الحكومة، مسؤول عن سلطة الهوية القومية اليهودية)، بدعوى أن الاتفاق الائتلافي مع الليكود لم يُنفَّذ."
          ru: "Заместитель министра Ави Маоз подал в отставку из правительства (заместитель министра в канцелярии премьер-министра, отвечал за Управление по еврейской национальной идентичности), заявив, что коалиционное соглашение с Ликудом не выполнено."
          es: "El viceministro Avi Maoz presentó su renuncia del Gobierno (viceministro en la Oficina del Primer Ministro, a cargo de la oficina de Identidad Nacional Judía), afirmando que su acuerdo de coalición con el Likud no se había cumplido."
          fr: "Le vice-ministre Avi Maoz a remis sa démission du gouvernement (vice-ministre au bureau du Premier ministre, chargé du bureau de l’Identité nationale juive), affirmant que son accord de coalition avec le Likoud n’avait pas été appliqué."
        sources:
          - { url: "https://www.timesofisrael.com/liveblog_entry/deputy-minister-avi-maoz-quits-government-railing-against-pressure-of-deep-state/", title: "Deputy Minister Avi Maoz quits government, railing against pressure of ‘deep state’ (2025-03-24)", publisher: "The Times of Israel" }
          - { url: "https://news.walla.co.il/item/3737021", title: "סגן השר אבי מעוז התפטר מהממשלה: \"כמעט כל ההבטחות לא מומשו\" (2025-03-24)", publisher: "וואלה" }
      - date: "2025-07-16"
        text:
          he: "אבי מעוז הודיע כי אינו רואה את עצמו חבר בקואליציה; לפי חשבונו נותרו בקואליציה 60 חברי כנסת."
          en: "Avi Maoz announced that he no longer considers himself a member of the coalition, which by his count was left with 60 MKs."
          ar: "أعلن آفي ماعوز أنه لا يعدّ نفسه عضوًا في الائتلاف؛ وبحسب حسابه بقي في الائتلاف 60 عضو كنيست."
          ru: "Ави Маоз объявил, что больше не считает себя членом коалиции; по его подсчёту, в коалиции осталось 60 депутатов."
          es: "Avi Maoz anunció que ya no se considera miembro de la coalición, que según su cuenta quedaba con 60 diputados."
          fr: "Avi Maoz a annoncé qu’il ne se considère plus comme membre de la coalition, qui, selon son décompte, ne comptait plus que 60 députés."
        sources:
          - { url: "https://www.timesofisrael.com/far-right-lawmaker-avi-maoz-quits-coalition-leaving-pm-with-a-minority-government/", title: "Far-right MK Avi Maoz quits coalition, leaving Netanyahu without Knesset majority (2025-07-17)", publisher: "The Times of Israel" }
      - date: "2026-07-21"
        text:
          he: "אליהו ליבמן, ראש מועצת קריית ארבע לשעבר, הודיע על הצטרפותו לרשימת נעם לקראת הבחירות לכנסת ה-26."
          en: "Eliyahu Libman, former head of the Kiryat Arba council, announced he was joining Noam’s list for the 26th-Knesset election."
          ar: "أعلن إلياهو ليبمان، الرئيس السابق لمجلس كريات أربع، انضمامه إلى قائمة نوعم استعدادًا لانتخابات الكنيست الـ26."
          ru: "Элияху Либман, бывший глава совета Кирьят-Арбы, объявил о вхождении в список «Ноам» на выборах в Кнессет 26-го созыва."
          es: "Eliyahu Libman, exjefe del consejo de Kiryat Arba, anunció que se unía a la lista de Noam para las elecciones a la 26.ª Knéset."
          fr: "Eliyahu Libman, ancien chef du conseil de Kiryat Arba, a annoncé qu’il rejoignait la liste de Noam pour les élections à la 26e Knesset."
        sources:
          - { url: "https://www.srugim.co.il/101006789", title: "אליהו ליבמן חוזר לפוליטיקה; זו המפלגה בה הוא יתמודד (2026-07-21)", publisher: "סרוגים" }
          - { url: "https://www.jpost.com/israel-news/politics-and-diplomacy/article-904171", title: "Noam Party rebrands itself ahead of elections, Maoz calls to ‘strengthen right-wing bloc’ (2026-07-30)", publisher: "The Jerusalem Post" }
      - date: "2026-07-29"
        text:
          he: "המפלגה השיקה את קמפיין הבחירות תחת השם החדש \"נעם לישראל\" והסיסמה \"חופשי להיות יהודי\", והציגה את סגן ראש עיריית באר שבע שמעון טבול כמועמד נוסף ברשימה."
          en: "The party launched its election campaign under the new name “Noam for Israel” and the slogan “Free to be Jewish”, presenting Beersheba deputy mayor Shimon Tobol as a further candidate on its list."
          ar: "أطلق الحزب حملته الانتخابية تحت الاسم الجديد «نوعم لإسرائيل» وشعار «حرّ في أن تكون يهوديًا»، وقدّم نائب رئيس بلدية بئر السبع شمعون طبول مرشحًا إضافيًا في القائمة."
          ru: "Партия начала предвыборную кампанию под новым названием «Ноам за Израиль» и лозунгом «Свободен быть евреем», представив заместителя мэра Беэр-Шевы Шимона Тобола как ещё одного кандидата в списке."
          es: "El partido lanzó su campaña electoral con el nuevo nombre «Noam por Israel» y el lema «Libres para ser judíos», presentando al vicealcalde de Beersheba Shimon Tobol como candidato adicional de su lista."
          fr: "Le parti a lancé sa campagne électorale sous le nouveau nom « Noam pour Israël » et le slogan « Libres d’être juifs », en présentant l’adjoint au maire de Beersheba Shimon Tobol comme nouveau candidat sur sa liste."
        sources:
          - { url: "https://www.makorrishon.co.il/news/politcal/article/355339", title: "\"נעם לישראל\" עם הפנים לציבור החרדי: אבי מעוז משיק קמפיין בחירות (2026-07-29)", publisher: "מקור ראשון" }
          - { url: "https://www.jpost.com/israel-news/politics-and-diplomacy/article-904171", title: "Noam Party rebrands itself ahead of elections, Maoz calls to ‘strengthen right-wing bloc’ (2026-07-30)", publisher: "The Jerusalem Post" }
      - date: "2026-08-23"
        text:
          he: "המפלגה הודיעה על צירופן של יסכה חיימוב וליאורה אלון לרשימתה."
          en: "The party announced that Yisca Hayimov and Liora Alon had joined its list."
          ar: "أعلن الحزب انضمام يسكا حاييموف وليئورا ألون إلى قائمته."
          ru: "Партия объявила, что в её список вошли Иска Хаимов и Лиора Алон."
          es: "El partido anunció que Yisca Hayimov y Liora Alon se habían unido a su lista."
          fr: "Le parti a annoncé que Yisca Hayimov et Liora Alon avaient rejoint sa liste."
        sources:
          - { url: "https://www.jpost.com/israel-election-2026/article-906331", title: "Yisca Hayimov, sister of Shin Bet chief David Zini, joins Avi Maoz’s far-right Noam LeYisrael party (2026-08-23)", publisher: "The Jerusalem Post" }
      - date: "2026-09-07"
        text:
          he: "הרב צבי טאו, המנהיג הרוחני של המפלגה, שלח מכתב לאבי מעוז ולפעילים ובו הבהיר כי \"נעם לישראל\" תתמודד בבחירות באופן עצמאי, עד ההצבעה בקלפי."
          en: "Rabbi Tzvi Tau, the party’s spiritual leader, sent a letter to Avi Maoz and activists stating that “Noam for Israel” would run independently, through to election day."
          ar: "بعث الحاخام تسفي تاو، الزعيم الروحي للحزب، رسالة إلى آفي ماعوز والناشطين أوضح فيها أن «نوعم لإسرائيل» ستخوض الانتخابات بشكل مستقل حتى يوم الاقتراع."
          ru: "Раввин Цви Тау, духовный лидер партии, направил Ави Маозу и активистам письмо, в котором разъяснил, что «Ноам за Израиль» пойдёт на выборы самостоятельно — вплоть до дня голосования."
          es: "El rabino Tzvi Tau, líder espiritual del partido, envió una carta a Avi Maoz y a los activistas afirmando que «Noam por Israel» se presentaría de forma independiente, hasta el día de las elecciones."
          fr: "Le rabbin Tzvi Tau, chef spirituel du parti, a adressé une lettre à Avi Maoz et aux militants affirmant que « Noam pour Israël » se présenterait de façon indépendante, jusqu’au jour des élections."
        sources:
          - { url: "https://www.inn.co.il/news/705850", title: "הרב טאו הכריע: \"נעם לישראל\" תתמודד עד הסוף (2026-09-07)", publisher: "ערוץ 7" }
      - date: "2026-09-09"
        text:
          he: "הרשימה \"נעם לישראל\" הוגשה לוועדת הבחירות המרכזית כרשימה מס' 38 (אותיות מבוקשות \"ני\") על ידי המפלגות \"לזוז\" ו\"אחריות לאומית - למען עתיד ילדינו\"; 16 מועמדים, בראשם אבי מעוז, שמעון טבול, אליהו ליבמן וליאורה אלון. הרשימות טרם אושרו (אישור: 27 בספטמבר 2026)."
          en: "The list “Noam for Israel” was submitted to the Central Elections Committee as list no. 38 (requested letters “ני”) by the parties “Lazuz” and “National Responsibility – for our children’s future”; 16 candidates, headed by Avi Maoz, Shimon Tobol, Eliyahu Libman and Liora Alon. Lists are not yet approved (approval: 27 September 2026)."
          ar: "قُدّمت قائمة «نوعم لإسرائيل» إلى لجنة الانتخابات المركزية بوصفها القائمة رقم 38 (الأحرف المطلوبة «ני») من قِبل حزبي «لازوز» و«المسؤولية الوطنية – من أجل مستقبل أولادنا»؛ 16 مرشحًا، على رأسهم آفي ماعوز وشمعون طبول وإلياهو ليبمان وليئورا ألون. ولم يُصادَق على القوائم بعد (المصادقة: 27 أيلول/سبتمبر 2026)."
          ru: "Список «Ноам за Израиль» подан в Центральную избирательную комиссию под номером 38 (запрошенные буквы «ני») партиями «Лазуз» и «Национальная ответственность — ради будущего наших детей»; 16 кандидатов во главе с Ави Маозом, Шимоном Тоболом, Элияху Либманом и Лиорой Алон. Списки ещё не утверждены (утверждение — 27 сентября 2026 года)."
          es: "La lista «Noam por Israel» fue presentada ante la Comisión Electoral Central como lista n.º 38 (letras solicitadas «ני») por los partidos «Lazuz» y «Responsabilidad Nacional – por el futuro de nuestros hijos»; 16 candidatos, encabezados por Avi Maoz, Shimon Tobol, Eliyahu Libman y Liora Alon. Las listas aún no están aprobadas (aprobación: 27 de septiembre de 2026)."
          fr: "La liste « Noam pour Israël » a été déposée auprès de la Commission électorale centrale comme liste n° 38 (lettres demandées « ני ») par les partis « Lazuz » et « Responsabilité nationale – pour l’avenir de nos enfants » ; 16 candidats, menés par Avi Maoz, Shimon Tobol, Eliyahu Libman et Liora Alon. Les listes ne sont pas encore approuvées (approbation : 27 septembre 2026)."
        sources:
          - { url: "https://www.gov.il/he/pages/noam_list38", title: "רשימה 38 — נעם לישראל (2026-09-09)", publisher: "ועדת הבחירות המרכזית לכנסת (gov.il)" }
          - { url: "https://www.gov.il/he/pages/candidates-lists-26", title: "רשימות המועמדים לכנסת ה-26 (כפי שהוגשו; טרם אושרו) (2026-09-18)", publisher: "ועדת הבחירות המרכזית לכנסת (gov.il)" }
          - { url: "https://www.noamlisrael.org.il/", title: "נעם לישראל – בראשות אבי מעוז – חופשי להיות יהודי (הנבחרת שלנו) (2026-09-19)", publisher: "נעם לישראל (אתר המפלגה)" }
    election2026:
      runsAs: own
      listNumber: 38
      note:
        he: "רצה כ\"נעם לישראל\" (אותיות מבוקשות: ני), רשימה שהוגשה על ידי המפלגות \"לזוז\" ו\"אחריות לאומית - למען עתיד ילדינו\"; אבי מעוז בראשה."
        en: "Runs as “Noam for Israel” (requested letters: ני), a list submitted by the parties “Lazuz” and “National Responsibility – for our children’s future”; Avi Maoz heads it."
        ar: "يترشح باسم «نوعم لإسرائيل» (الأحرف المطلوبة: ני)، وهي قائمة قدّمها حزبا «لازوز» و«المسؤولية الوطنية – من أجل مستقبل أولادنا»؛ يرأسها آفي ماعوز."
        ru: "Идёт как «Ноам за Израиль» (запрошенные буквы: ני) — список, поданный партиями «Лазуз» и «Национальная ответственность — ради будущего наших детей»; во главе — Ави Маоз."
        es: "Se presenta como «Noam por Israel» (letras solicitadas: ני), una lista presentada por los partidos «Lazuz» y «Responsabilidad Nacional – por el futuro de nuestros hijos»; Avi Maoz la encabeza."
        fr: "Se présente sous le nom « Noam pour Israël » (lettres demandées : ני), une liste déposée par les partis « Lazuz » et « Responsabilité nationale – pour l’avenir de nos enfants » ; Avi Maoz la mène."
      sources:
        - { url: "https://www.gov.il/he/pages/noam_list38", title: "נעם לישראל — רשימת המועמדים", publisher: "ועדת הבחירות המרכזית לכנסת" }
    spectrum: far-right
    ballotLetters: "ט"
    ballotNote:
      he: רצה במסגרת רשימת "הציונות הדתית" (ט) ב-2022. ב-2026 מתמודדת ברשימה משלה, "נעם לישראל" (רשימה 38, אותיות מבוקשות ני).
      en: Ran within the 'Religious Zionism' list (ט) in 2022. In 2026 it runs on its own list, “Noam for Israel” (list 38, requested letters ני).
      ar: "ترشّح ضمن قائمة «الصهيونية الدينية» (ט) في 2022. وفي 2026 يترشح في قائمة مستقلة، «نوعم لإسرائيل» (القائمة 38، الأحرف المطلوبة ני)."
      ru: "В 2022 году шёл в списке «Религиозный сионизм» (ט). В 2026 году идёт отдельным списком «Ноам за Израиль» (список 38, запрошенные буквы ני)."
      es: "Se presentó dentro de la lista «Sionismo Religioso» (ט) en 2022. En 2026 se presenta con lista propia, «Noam por Israel» (lista 38, letras solicitadas ני)."
      fr: "S’est présenté au sein de la liste « Sionisme religieux » (ט) en 2022. En 2026, il se présente avec sa propre liste, « Noam pour Israël » (liste 38, lettres demandées ני)."
    website: https://www.noamlisrael.org.il/
    sources:
      - { url: "https://www.gov.il/he/pages/noam_list38", title: "נעם לישראל — רשימת המועמדים (ועדת הבחירות המרכזית, 9.9.2026)", publisher: "ועדת הבחירות המרכזית לכנסת" }
    leaderHe: אבי מעוז
    leaderEn: Avi Maoz
    founded: 2019
    foundedSource: { url: "https://www.jpost.com/israel-elections/new-right-wing-religious-party-formed-to-fight-lgbt-rights-595756", title: "Anti-LGBT Noam Party set to run in September election (17 July 2019)", publisher: "The Jerusalem Post" }
    wikipediaEn: https://en.wikipedia.org/wiki/Noam_(political_party)
    tags: [religious, ultra-conservative]
    summary:
      he: מפלגה דתית אולטרה-שמרנית המתמקדת בזהות יהודית ובנושאי משפחה.
      en: An ultra-conservative religious party focused on Jewish identity and family issues.
      ar: حزب ديني محافظ جدًا يركّز على الهوية اليهودية وقضايا الأسرة.
      ru: Ультраконсервативная религиозная партия, сосредоточенная на еврейской идентичности и семейных вопросах.
      es: "Un partido religioso ultraconservador centrado en la identidad judía y los asuntos de familia."
      fr: "Un parti religieux ultraconservateur centré sur l’identité juive et les questions familiales."
    positions:
      he:
        - שמירה על "צביון יהודי" ומשפחה מסורתית
        - התנגדות לקידום זכויות להט"ב במרחב הציבורי
        - חיזוק החינוך היהודי
      en:
        - Preserving a "Jewish character" and the traditional family
        - Opposition to promoting LGBT rights in the public sphere
        - Strengthening Jewish education
      ar:
        - "الحفاظ على «الطابع اليهودي» والعائلة التقليدية"
        - "معارضة الترويج لحقوق مجتمع الميم في الحيّز العام"
        - "تعزيز التعليم اليهودي"
      ru:
        - "Сохранение «еврейского характера» и традиционной семьи"
        - "Против продвижения прав ЛГБТ в общественной сфере"
        - "Укрепление еврейского образования"
      es:
        - Preservar un «carácter judío» y la familia tradicional
        - Oposición a promover los derechos LGBT en el espacio público
        - Fortalecer la educación judía
      fr:
        - Préserver un « caractère juif » et la famille traditionnelle
        - Opposition à la promotion des droits LGBT dans l’espace public
        - Renforcer l’éducation juive
