      en: "High Court of Justice disqualified his appointment as interior and health minister (January 2023)"
    date: "2023-01-18"
    description:
      he: "ב-18 בינואר 2023 קבע בג\"ץ, בהרכב של 11 שופטים וברוב של 10 מול 1, כי מינויו של דרעי לשר הפנים ולשר הבריאות בממשלה ה-37 הוא \"בלתי סביר באופן קיצוני\" בשל עברו הפלילי ובשל הצהרתו לבית המשפט ב-2022 על פרישה מהחיים הפוליטיים, והורה לראש הממשלה להעבירו מתפקידו. ב-22 בינואר 2023 הודיע נתניהו על הדחתו; דרעי נותר חבר כנסת ויו\"ר ש\"ס."
      en: "On 18 January 2023 the High Court of Justice, sitting as an 11-justice panel, ruled 10-1 that Deri's appointment as interior and health minister in the 37th government was \"unreasonable in the extreme\" given his criminal record and his 2022 statement to a court that he was retiring from political life, and ordered the prime minister to remove him. On 22 January 2023 Netanyahu dismissed him; Deri remained a Knesset member and Shas chairman."
