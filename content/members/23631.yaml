    date: 2026-09-03
    title:
      he: הודיעה כי לא תתמודד בבחירות 2026
      en: Announced she will not run in the 2026 election
    description:
      he: ב-3 בספטמבר 2026 הודיעה אלהרר לחברי יש עתיד כי לאחר 14 שנים בכנסת ובממשלה
        לא תתמודד ברשימת המפלגה לכנסת ה-26, וכי היא פונה "לאתגר חדש". היא הדגישה
        שהיא נשארת חברה ביש עתיד ותשתתף במערכת הבחירות של המפלגה.
      en: On 3 September 2026 Elharrar informed Yesh Atid members that after 14 years
        in the Knesset and government she would not run on the party's list for
        the 26th Knesset, saying she was moving on to "a new challenge". She
        stressed that she remains a Yesh Atid member and will take part in the
        party's election campaign.
