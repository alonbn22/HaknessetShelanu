    description:
      he: "התנועה לאיכות השלטון בישראל העניקה לבליאק את אות אביר איכות השלטון לשנת 2023 בקטגוריית הרשות המחוקקת, לדבריה בהוקרה על היותו מהקולות הפרלמנטריים הבולטים נגד מהלכי החקיקה של הממשלה ובפרט על חשיפת העברות תקציביות שלטענתה נעשו בניגוד לחוקים פיסקליים."
      en: "The Movement for Quality Government in Israel awarded Beliak its Knight of Quality Government award for 2023 in the legislative-branch category, citing, in its words, his prominent parliamentary voice against the government's legislative moves and in particular his exposure of budget transfers it said breached fiscal laws."
