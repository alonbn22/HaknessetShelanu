      he: "חברת הכנסת מטעם הליכוד מאז 2019"
      en: "Member of the Knesset for Likud since 2019"
    description:
      he: "אתי (חוה) עטייה נבחרה לכנסת מטעם הליכוד באפריל 2019 וכיהנה בכנסות ה-21 עד ה-24. לפי רישומי הכנסת היא שבה לכהן בכנסת ה-25 ב-7 בינואר 2023 מכוח החוק הנורבגי, לאחר שעידית סילמן התפטרה ממושבה בכנסת."
      en: "Eti (Hava) Atia was elected to the Knesset on the Likud list in April 2019 and served in the 21st to 24th Knessets. Knesset records show she returned to the 25th Knesset on 7 January 2023 under the Norwegian Law, after Idit Silman resigned her seat."
