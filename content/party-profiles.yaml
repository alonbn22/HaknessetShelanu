  - id: 1106 # Otzma Yehudit
    verified: "2026-09-19"
    updates:
      - date: "2025-01-19"
        text:
          he: "עוצמה יהודית הודיעה על פרישה מהממשלה ומהקואליציה במחאה על הסכם הפסקת האש ושחרור החטופים; השרים איתמר בן גביר, עמיחי אליהו ויצחק וסרלאוף הגישו מכתבי התפטרות שנכנסו לתוקף ב-21 בינואר 2025. אליהו שב לכנסת ב-21 בינואר; ב-27 בינואר החליף צביקה פוגל את וסרלאוף כיו\"ר הסיעה."
          en: "Otzma Yehudit announced it was leaving the government and the coalition in protest at the ceasefire–hostage deal; ministers Itamar Ben Gvir, Amichai Eliyahu and Yitzhak Wasserlauf submitted resignations that took effect on 21 January 2025. Eliyahu returned to the Knesset on 21 January; on 27 January Zvika Fogel replaced Wasserlauf as faction chair."
          ar: "أعلنت عوتسما يهوديت انسحابها من الحكومة ومن الائتلاف احتجاجًا على اتفاق وقف إطلاق النار والإفراج عن الرهائن؛ وقدّم الوزراء إيتمار بن غفير وعميحاي إلياهو ويتسحاق فاسرلاوف كتب استقالة دخلت حيّز التنفيذ في 21 كانون الثاني/يناير 2025. وعاد إلياهو إلى الكنيست في 21 كانون الثاني/يناير؛ وفي 27 كانون الثاني/يناير حلّ تسفيكا فوغل محل فاسرلاوف رئيسًا للكتلة."
          ru: "«Оцма Иегудит» объявила о выходе из правительства и коалиции в знак протеста против соглашения о прекращении огня и освобождении заложников; министры Итамар Бен-Гвир, Амихай Элияху и Ицхак Вассерлауф подали прошения об отставке, вступившие в силу 21 января 2025 года. Элияху вернулся в Кнессет 21 января; 27 января Цвика Фогель сменил Вассерлауфа на посту председателя фракции."
          es: "Otzma Yehudit anunció que dejaba el Gobierno y la coalición en protesta por el acuerdo de alto el fuego y rehenes; los ministros Itamar Ben Gvir, Amichai Eliyahu y Yitzhak Wasserlauf presentaron renuncias que se hicieron efectivas el 21 de enero de 2025. Eliyahu volvió a la Knéset el 21 de enero; el 27 de enero Zvika Fogel sustituyó a Wasserlauf como presidente de la facción."
          fr: "Otzma Yehoudit a annoncé qu’il quittait le gouvernement et la coalition pour protester contre l’accord de cessez-le-feu et de libération d’otages ; les ministres Itamar Ben Gvir, Amichai Eliyahu et Yitzhak Wasserlauf ont remis des démissions qui ont pris effet le 21 janvier 2025. Eliyahu est revenu à la Knesset le 21 janvier ; le 27 janvier, Zvika Fogel a remplacé Wasserlauf à la présidence de la faction."
        sources:
          - { url: "https://www.timesofisrael.com/with-otzma-yehudit-out-of-government-netanyahu-set-to-appoint-replacement-ministers/", title: "With Otzma Yehudit out of government, Netanyahu set to appoint replacement ministers (2025-01-19)", publisher: "The Times of Israel" }
          - { url: "https://www.haaretz.co.il/news/politics/2025-01-19/ty-article/00000194-7d9c-d61f-a1b5-fdbd99970000", title: "עוצמה יהודית הודיעה על פרישתה מהקואליציה, בן גביר ושרי המפלגה הגישו מכתבי התפטרות (2025-01-19)", publisher: "הארץ" }
