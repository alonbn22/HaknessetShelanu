  - id: climate-law
    topic: society
    lean: left
    text:
      he: "יש לקבוע בחוק יעדים מחייבים להפחתת פליטות גזי חממה (חוק אקלים)."
      en: "Binding greenhouse-gas reduction targets should be set in law (a climate law)."
      ar: "يجب تحديد أهداف ملزمة في القانون لخفض انبعاثات غازات الدفيئة (قانون مناخ)."
      ru: "Обязательные цели по сокращению выбросов парниковых газов следует закрепить в законе (закон о климате)."
      es: "Deberían fijarse por ley objetivos vinculantes de reducción de gases de efecto invernadero (una ley del clima)."
      fr: "Des objectifs contraignants de réduction des gaz à effet de serre devraient être fixés par la loi (une loi climat)."
    short:
      he: "חוק אקלים"
      en: "A climate law"
      ar: "قانون مناخ"
      ru: "Закон о климате"
      es: "Una ley del clima"
      fr: "Une loi climat"
    explainer:
      he: "ישראל התחייבה ביעדי הפחתת פליטות, אבל בניגוד לרוב המדינות המפותחות עדיין אין לה חוק אקלים שהופך אותם למחייבים. התומכים אומרים שבלי חוק היעדים נשארים על הנייר; המתנגדים אומרים שיעדים מחייבים יפגעו בתעשייה וביוקר המחיה ושעדיף לקדם זאת בהחלטות ממשלה."
      en: "Israel has committed to emission-reduction targets, but unlike most developed countries it still has no climate law making them binding. Supporters say without a law the targets stay on paper; opponents say binding targets would hurt industry and the cost of living and that government decisions are the better route."
      ar: "التزمت إسرائيل بأهداف لخفض الانبعاثات، لكن على خلاف معظم الدول المتقدمة ليس لديها بعد قانون مناخ يجعلها ملزمة. يقول المؤيدون إنه من دون قانون تبقى الأهداف حبرًا على ورق؛ ويقول المعارضون إن الأهداف الملزمة ستضرّ بالصناعة وتزيد غلاء المعيشة وإن قرارات الحكومة طريق أفضل."
      ru: "Израиль обязался достичь целей по сокращению выбросов, но, в отличие от большинства развитых стран, у него до сих пор нет закона о климате, который сделал бы их обязательными. Сторонники говорят, что без закона цели остаются на бумаге; противники — что обязательные цели ударят по промышленности и приведут к росту стоимости жизни и что лучше действовать решениями правительства."
      es: "Israel se ha comprometido con objetivos de reducción de emisiones, pero a diferencia de la mayoría de los países desarrollados todavía no tiene una ley del clima que los haga vinculantes. Los partidarios dicen que sin ley los objetivos se quedan en el papel; los opositores dicen que los objetivos vinculantes dañarían la industria y el costo de vida y que las decisiones del Gobierno son la mejor vía."
      fr: "Israël s’est engagé sur des objectifs de réduction des émissions, mais, contrairement à la plupart des pays développés, il n’a toujours pas de loi climat qui les rende contraignants. Les partisans disent que sans loi, les objectifs restent sur le papier ; les opposants disent que des objectifs contraignants nuiraient à l’industrie et au coût de la vie et que les décisions gouvernementales sont la meilleure voie."
    stances:
      together:
        value: 2
        basis: platform
        source: { url: "https://be-yahad.org.il/plans/enviroment/", title: "תכנית ביחד להגנה על הסביבה בישראל — חוק אקלים והקמת מערך לאומי לניהול סיכוני אקלים", publisher: "ביחד" }
        quote:
          he: "\"ביחד תחוקק חוק אקלים מחייב ומתוקצב, שיעגן יעדים ענפיים ויקים מערך לאומי לניהול סיכוני אקלים.\""
          en: "\"Together will legislate a binding, budgeted climate law that anchors sectoral targets and sets up a national climate-risk management system.\""
          ar: "«ستشرّع ‹معًا› قانون مناخ ملزمًا وممولًا يرسّخ أهدافًا قطاعية وينشئ منظومة وطنية لإدارة مخاطر المناخ.»"
          ru: "«„Вместе“ примет обязательный закон о климате с бюджетом, закрепляющий отраслевые цели и создающий национальную систему управления климатическими рисками»."
          es: "«Juntos aprobará una ley del clima vinculante y dotada de presupuesto, que fije objetivos sectoriales y cree un sistema nacional de gestión de los riesgos climáticos.»"
          fr: "« Ensemble adoptera une loi climat contraignante et budgétée, qui inscrira des objectifs sectoriels et créera un dispositif national de gestion des risques climatiques. »"
      democrats:
        value: 2
        basis: platform
        source: { url: "https://democrats-media.s3.us-east-1.amazonaws.com/%D7%9E%D7%A6%D7%A2+%D7%A1%D7%91%D7%99%D7%91%D7%94.pdf", title: "תוכנית סביבה ואקלים — תוכניות העבודה של הדמוקרטים (המסמך המלא, מקושר מ-yes.democrats.org.il/topics/environment-animals)", publisher: "הדמוקרטים" }
        quote:
          he: "\"נחוקק את חוק האקלים אשר יכלול יעדי הפחתה ברורים של 50% מפליטות גזי החממה עד 2030 ו־100% עד 2050\""
          en: "\"We will legislate the Climate Law, which will include clear reduction targets of 50% of greenhouse-gas emissions by 2030 and 100% by 2050\""
          ar: "«سنشرّع قانون المناخ الذي سيتضمن أهدافًا واضحة لخفض انبعاثات غازات الدفيئة بنسبة 50% حتى 2030 و100% حتى 2050»"
          ru: "«Мы примем Закон о климате с чёткими целями сокращения выбросов парниковых газов на 50% к 2030 году и на 100% к 2050-му»"
          es: "«Aprobaremos la Ley del Clima, que incluirá objetivos claros de reducción del 50 % de las emisiones de gases de efecto invernadero para 2030 y del 100 % para 2050»"
