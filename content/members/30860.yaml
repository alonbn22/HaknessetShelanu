  - kind: negative
    category: controversy
    status: ongoing
    date: "2026-06-16"
    title:
      he: "תביעת הדיבה של שקמה ברסלר: בית המשפט קיבל את טענת החסינות לגבי רוב הפרסומים, אך לא לגבי חשיפת זהות איש השב\"כ"
      en: "Shikma Bressler's defamation suit: the court upheld her immunity for most of the posts, but not for exposing a Shin Bet officer's identity"
    description:
      he: "ב-16 ביוני 2026 הכריע בית המשפט המחוזי מרכז-לוד בבקשתה של גוטליב לסלק על הסף תביעת לשון הרע בסך 2.6 מיליון שקל שהגישה נגדה הפעילה שקמה ברסלר. השופט רמי חיימוביץ קבע כי החסינות חלה על רוב הפרסומים שבתביעה – ההאשמות וההתקפות נגד ברסלר, שהיא דמות ציבורית – וסילק אותם. לגבי הפרסומים שחשפו את זהות בן זוגה כאיש שב\"כ קבע כי לא ניתן לקבוע בשלב המקדמי שהחסינות חלה, בהסתמך על פסיקה שלפיה חשיפה מכוונת של זהות איש ביטחון אינה מוגנת וחבר כנסת אינו רשאי להפר את החוק במודע; חלק זה של התביעה ממשיך להתברר. גוטליב טענה כי יש חשיבות ציבורית בחשיפת הקשר המשפחתי וכי הפרסום הוא חלק ממילוי תפקידה."
      en: "On 16 June 2026 the Central District Court in Lod ruled on Gotliv's motion to dismiss a NIS 2.6 million defamation suit filed against her by activist Shikma Bressler. Judge Rami Haimovich upheld her parliamentary immunity for most of the posts in the suit — her accusations and attacks against Bressler, a public figure — and dismissed those parts. For the posts that identified Bressler's partner as a Shin Bet officer, he ruled that immunity could not be established at this preliminary stage, citing case law that intentionally disclosing a security official's identity is not protected and that a Knesset member may not knowingly break the law; that part of the suit continues. Gotliv argued that exposing the family connection was in the public interest and part of her parliamentary role."
