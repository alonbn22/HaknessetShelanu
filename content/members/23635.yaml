    description:
      he: "תמנו-שטה מכהנת כיושבת ראש סיעת כחול לבן – המחנה הממלכתי בכנסת (על פי רישומי הכנסת, מ-8 ביולי 2025, עם שינוי שם הסיעה), ובמהלך הכנסת ה-25 עמדה גם בראש הוועדה לקידום מעמד האישה ולשוויון מגדרי."
      en: "Tamano-Shata serves as chair of the Blue and White – National Unity faction in the Knesset (per Knesset records, since 8 July 2025, when the faction was renamed), and during the 25th Knesset also chaired the Committee on the Status of Women and Gender Equality."
