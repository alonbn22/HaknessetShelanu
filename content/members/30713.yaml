    title:
      he: "סגן יושב ראש הכנסת ויו\"ר הוועדה המיוחדת לענייני החברה הערבית בכנסת ה-24"
      en: "Deputy Speaker of the Knesset and chair of the Special Committee on Arab Society Affairs in the 24th Knesset"
    description:
      he: "לפי רישומי הכנסת כיהן עבאס כסגן יושב ראש הכנסת מ-26 באפריל 2021 עד תום הכנסת ה-24 (15 בנובמבר 2022). באותה כנסת עמד גם בראש הוועדה המיוחדת לענייני החברה הערבית. הוא חבר הכנסת מטעם רע\"מ מאז אפריל 2019 ויו\"ר המפלגה מ-2018."
      en: "According to Knesset records, Abbas served as a Deputy Speaker of the Knesset from 26 April 2021 until the end of the 24th Knesset (15 November 2022). In that Knesset he also chaired the Special Committee on Arab Society Affairs. He has been a Knesset member for Ra'am since April 2019 and the party's chairman since 2018."
    sources:
