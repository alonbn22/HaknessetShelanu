  - kind: positive
    category: achievement
    title:
      he: יוזם חוק הכפפת מח"ש למשרד המשפטים
      en: Initiated law placing police investigations unit under the Justice Ministry
    description:
      he: ב-11 ביוני 2026 אישרה הכנסת ברוב של 43 מול 39 תיקון לפקודת המשטרה שיזם סעדה, המעביר את המחלקה לחקירות שוטרים (מח"ש) מאחריות פרקליטות המדינה לאחריות ישירה של משרד המשפטים. היועצת המשפטית לממשלה ופרקליט המדינה הזהירו כי המהלך עלול לחשוף חקירות להשפעה פוליטית; סעדה טען כי הרפורמה מבטלת ניגוד עניינים בין הפרקליטות, הנסמכת על המשטרה, לבין הגוף החוקר אותה.
      en: On 11 June 2026 the Knesset passed, by 43 votes to 39, an amendment to the Police Ordinance initiated by Saada that transfers the Police Internal Investigations Department (Mahash) from the authority of the State Attorney's Office to the direct authority of the Justice Ministry. The Attorney General and the State Attorney warned the move could expose investigations to political influence; Saada argued the reform removes a conflict of interest between prosecutors, who rely on the police, and the body that investigates them.
    date: 2026-06-11
    sources:
      - url: https://www.jpost.com/israel-news/article-899033
        title: Knesset passes law placing internal police investigations under Justice Ministry's authority
        publisher: The Jerusalem Post
  - kind: negative
    category: controversy
    status: ethics
    title:
      he: ניגוד עניינים בקידום חוק מח"ש - קביעת ועדת האתיקה
      en: Conflict of interest in advancing the Mahash bill - Ethics Committee finding
    description:
      he: ביולי 2023 קבעה ועדת האתיקה של הכנסת, בעקבות פנייה, כי קידום הצעת חוק על ידי חבר כנסת המנהל הליך משפטי נגד גורם הקשור להצעה מהווה ניגוד עניינים - בהתייחס לכך שסעדה קידם את חוק מח"ש בעודו מנהל תביעה נגד אותה מחלקה בטענת התעמרות. בעקבות הקביעה הודיע סעדה כי לא ימשיך לקדם את ההצעה וכי חבר כנסת אחר יקדם אותה.
      en: In July 2023 the Knesset Ethics Committee, acting on a complaint, found that for an MK to advance a bill while pursuing legal proceedings against an entity connected to that bill constitutes a conflict of interest - referring to Saada advancing the Mahash bill while pursuing a lawsuit against that same department over a workplace-harassment claim. Following the finding, Saada announced he would no longer advance the bill and that another MK would do so instead.
    date: 2023-07-30
