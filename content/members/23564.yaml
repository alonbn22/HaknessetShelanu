  - kind: positive
    category: achievement
    title:
      he: יוזם "חוק ההמלצות" שאושר בכנסת (2017)
      en: Sponsor of the "Recommendations Law" passed by the Knesset (2017)
    description:
      he: אמסלם יזם את התיקון לחוק סדר הדין הפלילי המכונה "חוק ההמלצות", המגביל את פרסום המלצות המשטרה בדבר העמדה לדין בתום חקירה. החוק אושר בקריאה שנייה ושלישית ב-28 בדצמבר 2017 ברוב של 59 מול 54, לאחר פיליבסטר של האופוזיציה שנמשך כ-43 שעות; מתנגדיו טענו כי נועד לסייע לראש הממשלה נתניהו, ואמסלם הכחיש זאת.
      en: Amsalem sponsored the amendment to the Criminal Procedure Law known as the "Recommendations Law", which restricts publication of police recommendations on indictment at the end of an investigation. It passed its final readings on 28 December 2017 by 59 votes to 54 after a roughly 43-hour opposition filibuster; opponents argued it was meant to help Prime Minister Netanyahu, which Amsalem denied.
    date: 2017-12-28
    sources:
