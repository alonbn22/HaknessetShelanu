  - kind: positive
    category: achievement
    title:
      he: "שותף ליוזמת החוק למחיקת רישומים פליליים של יוצאי אתיופיה בעבירות הפרת סדר (2024)"
      en: "Co-initiated the law expunging Ethiopian-Israelis' records for public-order offences (2024)"
    description:
      he: "ב-16 ביולי 2024 אישרה הכנסת בקריאה שלישית חוק למחיקה אוטומטית של רישומים פליליים ומשטרתיים של יוצאי אתיופיה בעבירות הפרת הסדר הציבורי שבוצעו עד סוף 2021, על רקע דוחות ועדת פלמור ומבקר המדינה על שיטור יתר. הצעת החוק הוגשה על ידי חברי הכנסת צגה מלקו, פנינה תמנו-שטה, משה סולומון ואברהם בצלאל."
      en: "On 16 July 2024 the Knesset passed in its third reading a law automatically expunging criminal and police records of Ethiopian-Israelis for public-order offences committed up to the end of 2021, against the background of the Palmor Committee and State Comptroller reports on over-policing. The bill was submitted by MKs Tzega Melaku, Pnina Tamano-Shata, Moshe Solomon and Avraham Betzalel."
    date: "2024-07-16"
