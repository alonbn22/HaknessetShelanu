  - kind: negative
    category: controversy
    title:
      he: ועדת האתיקה הבהירה כי לא היה מוסמך למנוע מפורום קהלת להשתתף בדיוני הוועדה
      en: Ethics Committee clarified he had no authority to bar the Kohelet Forum from committee hearings
    description:
      he: ב-5 בנובמבר 2023 סילק לוי, כיו"ר הוועדה לענייני ביקורת המדינה, את נציגי
        פורום קהלת מדיון והטיח בהם כי הם אחראים לאסון 7 באוקטובר, והצהיר כי
        "כל עוד אני מנהל את הוועדה הזו פורום קהלת לא ידרוך פה". בעקבות תלונה
        הבהירה ועדת האתיקה של הכנסת כי יו"ר ועדה "אינו מוסמך לקבוע באופן גורף
        כי ארגון מסוים מנוע מלהיכנס לדיוני הוועדה", אך לא הטילה עליו סנקציות.
      en: On 5 November 2023 Levy, as chair of the State Control Committee, removed
        representatives of the Kohelet Policy Forum from a hearing, telling
        them they bore responsibility for the 7 October disaster and declaring
        that "as long as I run this committee, Kohelet Forum will not set foot
        here". Following a complaint, the Knesset Ethics Committee clarified
        that a committee chair "is not authorised to rule sweepingly that a
        particular organisation is barred from committee hearings", but
        imposed no sanction on him.
    date: 2023-11-08
    sources:
