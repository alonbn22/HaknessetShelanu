    title:
      he: "הורה על החרמת ציוד של סוכנות AP — וביטל את הצעד כעבור שעות (2024)"
      en: "Ordered seizure of Associated Press equipment, then reversed it within hours (2024)"
    description:
      he: "ב-21 במאי 2024 הורה קרעי לפקחי משרד התקשורת להחרים ציוד שידור של סוכנות הידיעות AP בשדרות, בטענה שהסוכנות סיפקה שידור חי לאל-ג'זירה בניגוד לחוק. הסוכנות דחתה את הטענה, יו\"ר האופוזיציה יאיר לפיד וארגוני עיתונאים מתחו ביקורת, והבית הלבן הביע דאגה. כעבור שעות הודיע קרעי כי הורה לבטל את הצעד ולהשיב את הציוד, 'עד להחלטה אחרת של משרד הביטחון'."
      en: "On 21 May 2024 Karhi ordered Communications Ministry inspectors to seize Associated Press broadcasting equipment in Sderot, claiming the agency was supplying a live feed to Al Jazeera in violation of the law. AP rejected the claim, Opposition Leader Yair Lapid and journalists' organizations criticized the move, and the White House expressed concern. Hours later Karhi announced he had ordered the action cancelled and the equipment returned, 'pending a different decision by the Defense Ministry'."
