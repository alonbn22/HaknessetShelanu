    title:
      he: "רקע בחינוך, עבודה סוציאלית ושירות צבאי"
      en: "Background in education, social work and military service"
    description:
      he: "לפני כניסתו לפוליטיקה עסק טרופר כשני עשורים בחינוך ובעבודה סוציאלית, שימש מנהל בית הספר ע\"ש ברנקו וייס ברמלה והקים ארגונים חברתיים, ביניהם 'במעגלי צדק' ו'שכן טוב'. בשירותו הצבאי שירת ביחידת דובדבן."
      en: "Before entering politics, Tropper spent about two decades as an educator and social worker, served as principal of the Branco Weiss school in Ramla and co-founded social NGOs, including B'Maagalei Tzedek and Shachen Tov. In his military service he served in the IDF's Duvdevan unit."
