  - kind: positive
    category: volunteering
    title:
      he: ייסד את איגוד רבני קהילות ואת ארגון "צו אחד"
      en: Founded the Union of Community Rabbis and the "Tzav Echad" organization
    description:
      he: >-
        בשנת 2014 ייסד אליהו את "איגוד רבני קהילות", המאגד מאות רבני בתי כנסת
        וקהילות ברחבי הארץ, ועמד בראשו עד 2022. כשנתיים לאחר מכן ייסד את ארגון
        "צו אחד" הפועל למען חיילים מסורתיים בצה"ל, והיה שותף בהקמת ארגון
        "שד"רים" לחיבור בין ישראל ליהדות התפוצות.
      en: >-
        In 2014 Eliyahu founded the Union of Community Rabbis, which brings together
        hundreds of synagogue and community rabbis across Israel, and led it until
        2022. About two years later he founded "Tzav Echad", an organization working
        on behalf of traditional soldiers in the IDF, and co-founded "Shadarim",
        which works on Israel-Diaspora ties.
    date: "2014"
    sources:
