    title:
      he: "חברת כנסת מטעם הליכוד (הכנסת ה-24 וה-25)"
      en: "Likud member of the 24th and 25th Knessets"
    description:
      he: "דיסטל אטבריאן, ילידת ירושלים (1971) למשפחת עולים מאיראן, שירתה בחיל האוויר ובעלת תואר בפילוסופיה מאוניברסיטת תל אביב. בפברואר 2021 שריין אותה בנימין נתניהו במקום העשירי ברשימת הליכוד לכנסת ה-24, ובפריימריז הליכוד ב-2022 נבחרה למקום ה-20. לפי רישומי הכנסת התפטרה מהכנסת במרץ 2023 לפי החוק הנורבגי ושבה אליה ב-14 באוקטובר 2023 עם סיום כהונתה כשרה."
      en: "Distel Atbaryan, born in Jerusalem (1971) to a family of immigrants from Iran, served in the Israeli Air Force and holds a degree in philosophy from Tel Aviv University. In February 2021 Benjamin Netanyahu reserved the tenth slot on the Likud list for her for the 24th Knesset, and in the 2022 Likud primary she won the 20th slot. Knesset records show she resigned her seat in March 2023 under the Norwegian Law and returned on 14 October 2023 when her ministerial term ended."
    date: "2021-02-04"
