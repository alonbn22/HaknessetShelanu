      en: "Won first place in the Religious Zionism primary; placed third on the list"
    description:
      he: "ב-26 ביולי 2026 זכתה סטרוק במספר הקולות הגבוה ביותר בבחירות הפנימיות של הציונות הדתית, שנערכו בקרב כ-170 חברי מרכז המפלגה, לפני שמחה רוטמן וצבי סוכות. ברשימה הסופית לכנסת ה-26, שהוגשה בספטמבר 2026, הוצבה במקום השלישי, אחרי בצלאל סמוטריץ' ומשה פייגלין."
      en: "On 26 July 2026 Strock received the most votes in the Religious Zionism party's internal primary, held among about 170 party-center members, ahead of Simcha Rothman and Zvi Sukkot. On the final list for the 26th Knesset, submitted in September 2026, she was placed third, after Bezalel Smotrich and Moshe Feiglin."
