# History of Israeli Knesset elections. Editorial/curated (not from the Knesset
# API). Every term's first source is the Knesset's own page for that Knesset
# (election date, results by list, governments and their prime ministers); the
# second is the turnout's source: the Central Elections Committee's table of past
# turnout (1st–18th Knessets), the Knesset Research and Information Center's fact
# sheet (21st–24th), or the Israel Democracy Institute's page for the election.
# Checked figure by figure on 2 Oct 2026. Wikipedia is never a source here; the
# page links each term's article only as further reading.
# turnout = % of eligible voters; winnerSeats = seats won by the largest list.
# date is ISO. "pm" = who ultimately formed/led the government after the election.
# Event colours: good/bad only for wars, attacks, disasters, peace agreements and
# rescue operations; a contested political event (a law, a coalition move, a
# person's legal matter) is neutral — the site doesn't grade politics.
elections:
  - knesset: 25
    date: "2022-11-01"
    turnout: 70.6
    winner: { he: "הליכוד", en: "Likud", ar: "الليكود", ru: "Ликуд", es: "Likud", fr: "Likoud" }
    winnerSeats: 32
    pm: { he: "בנימין נתניהו", en: "Benjamin Netanyahu", ar: "بنيامين نتنياهو", ru: "Биньямин Нетаньяху", es: "Benjamín Netanyahu", fr: "Benyamin Netanyahou" }
    note: { he: "הקואליציה הימנית-דתית בראשות נתניהו זכתה ב-64 מושבים.", en: "The right-religious bloc led by Netanyahu won 64 seats.", ar: "فاز الائتلاف اليميني-الديني بقيادة نتنياهو بـ64 مقعدًا.", ru: "Право-религиозный блок во главе с Нетаньяху получил 64 мандата.", es: "El bloque de derecha y religioso encabezado por Netanyahu obtuvo 64 escaños.", fr: "Le bloc de droite et religieux mené par Netanyahou a remporté 64 sièges." }
    summary:
      he: "הכנסת ה-25 נבחרה לאחר חמש מערכות בחירות בארבע שנים, והקימה קואליציה ימנית-דתית בת 64 מושבים. כהונתה התאפיינה ברפורמה המשפטית השנויה במחלוקת ובמלחמת חרבות ברזל שפרצה ב-7 באוקטובר 2023."
      en: "The 25th Knesset was elected after five elections in four years and formed a right-religious coalition of 64 seats. Its term has been shaped by the contested judicial reform and the Swords of Iron war that began on 7 October 2023."
      ar: "انتُخب الكنيست الـ25 بعد خمس جولات انتخابية في أربع سنوات، وشكّل ائتلافًا يمينيًا-دينيًا من 64 مقعدًا. وتميّزت ولايته بالإصلاح القضائي المثير للجدل وبحرب «السيوف الحديدية» التي اندلعت في 7 تشرين الأول/أكتوبر 2023."
      ru: "Кнессет 25-го созыва был избран после пяти избирательных кампаний за четыре года и сформировал право-религиозную коалицию из 64 мандатов. Его каденцию определили спорная судебная реформа и война «Железные мечи», начавшаяся 7 октября 2023 года."
      es: "La 25.ª Knéset fue elegida tras cinco elecciones en cuatro años y formó una coalición de derecha y religiosa de 64 escaños. Su legislatura estuvo marcada por la polémica reforma judicial y por la guerra de Espadas de Hierro, que comenzó el 7 de octubre de 2023."
      fr: "La 25e Knesset a été élue après cinq élections en quatre ans et a formé une coalition de droite et religieuse de 64 sièges. Sa législature a été marquée par la réforme judiciaire contestée et par la guerre des Épées de fer, qui a commencé le 7 octobre 2023."
    events:
      - kind: neutral
        date: "2023-01-04"
        text: { he: "השקת הרפורמה המשפטית עוררה גל מחאות המוני שנמשך חודשים.", en: "The launch of the judicial overhaul triggered months of mass protests.", ar: "أطلق الإعلان عن الإصلاح القضائي موجة احتجاجات جماهيرية استمرت شهورًا.", ru: "Запуск судебной реформы вызвал многомесячные массовые протесты.", es: "El lanzamiento de la reforma judicial desató meses de protestas masivas.", fr: "Le lancement de la réforme judiciaire a déclenché des mois de manifestations massives." }
      - kind: bad
        date: "2023-10-07"
        text: { he: "מתקפת הפתע של חמאס וגרירת המדינה למלחמת חרבות ברזל.", en: "Hamas's surprise attack and the start of the Swords of Iron war.", ar: "هجوم حماس المفاجئ وانجرار الدولة إلى حرب «السيوف الحديدية».", ru: "Внезапное нападение ХАМАС и начало войны «Железные мечи».", es: "El ataque sorpresa de Hamás y el inicio de la guerra de Espadas de Hierro.", fr: "L’attaque surprise du Hamas et le début de la guerre des Épées de fer." }
      - kind: neutral
        date: "2023-03-27"
        text: { he: "נתניהו הודיע על השהיית חקיקת הרפורמה המשפטית.", en: "Netanyahu announced a pause in the judicial-reform legislation.", ar: "أعلن نتنياهو تعليق تشريع الإصلاح القضائي مؤقتًا.", ru: "Нетаньяху объявил о приостановке законодательства о судебной реформе.", es: "Netanyahu anunció una pausa en la legislación de la reforma judicial.", fr: "Netanyahou a annoncé une pause dans la législation sur la réforme judiciaire." }
      - kind: neutral
        date: "2023-10-11"
        text: { he: "הקמת ממשלת חירום בעת המלחמה, שאליה הצטרף המחנה הממלכתי בראשות גנץ.", en: "Formation of an emergency wartime government, joined by Gantz's National Unity.", ar: "تشكيل حكومة طوارئ خلال الحرب، انضم إليها «المعسكر الرسمي» بزعامة غانتس.", ru: "Создание чрезвычайного правительства на время войны, в которое вошёл «Государственный лагерь» Ганца.", es: "Formación de un gobierno de emergencia en tiempo de guerra, al que se unió Unidad Nacional, de Gantz.", fr: "Formation d’un gouvernement d’urgence en temps de guerre, rejoint par Unité nationale, le parti de Gantz." }
      - kind: bad
        date: "2024-09-17"
        text: { he: "הסלמה בחזית הצפון מול חיזבאללה, מבצע הביפרים והתקיפות בלבנון.", en: "Escalation on the northern front with Hezbollah, the pager operation and strikes in Lebanon.", ar: "تصعيد على الجبهة الشمالية مع حزب الله، وعملية أجهزة النداء (البيجر)، والغارات في لبنان.", ru: "Эскалация на северном фронте с «Хизбаллой», операция с пейджерами и удары по Ливану.", es: "Escalada en el frente norte con Hezbolá, la operación de los buscapersonas y los ataques en Líbano.", fr: "Escalade sur le front nord avec le Hezbollah, l’opération des bipeurs et les frappes au Liban." }
      - kind: neutral
        date: "2025-01-19"
        text: { he: "עסקאות לשחרור חטופים והפסקות אש לסירוגין בעזה.", en: "Hostage-release deals and intermittent ceasefires in Gaza.", ar: "صفقات للإفراج عن الرهائن ووقف متقطع لإطلاق النار في غزة.", ru: "Сделки об освобождении заложников и периодические прекращения огня в Газе.", es: "Acuerdos de liberación de rehenes y altos el fuego intermitentes en Gaza.", fr: "Accords de libération d’otages et cessez-le-feu intermittents à Gaza." }
    ended: { he: "הכנסת ה-25 השלימה קדנציה מלאה והתפזרה ב-17 ביולי 2026; הבחירות לכנסת ה-26 — 27 באוקטובר 2026.", en: "The 25th Knesset completed a full term and dispersed on July 17, 2026; the 26th Knesset election is on October 27, 2026.", ar: "أتمّ الكنيست الـ25 ولاية كاملة وحُلّ في 17 تموز/يوليو 2026؛ وانتخابات الكنيست الـ26 في 27 تشرين الأول/أكتوبر 2026.", ru: "Кнессет 25-го созыва отработал полный срок и был распущен 17 июля 2026 года; выборы в Кнессет 26-го созыва — 27 октября 2026 года.", es: "La 25.ª Knéset completó una legislatura entera y se disolvió el 17 de julio de 2026; las elecciones a la 26.ª Knéset son el 27 de octubre de 2026.", fr: "La 25e Knesset a achevé une législature complète et s’est dissoute le 17 juillet 2026 ; les élections à la 26e Knesset ont lieu le 27 octobre 2026." }
    sources:
      - { url: "https://main.knesset.gov.il/en/about/history/Pages/KnessetHistory.aspx?kns=25", title: "25th Knesset: results of the elections (1 November 2022) and its governments", publisher: "הכנסת" }
      - { url: "https://en.idi.org.il/israeli-elections-and-parties/elections/2022/", title: "Elections for the 25th Knesset (1.11.2022): results and voter turnout", publisher: "המכון הישראלי לדמוקרטיה" }
      - { url: "https://en.wikipedia.org/wiki/2023_Israeli_judicial_reform", title: "2023 Israeli judicial reform", publisher: "Wikipedia" }
      - { url: "https://www.timesofisrael.com/after-days-of-indecision-netanyahu-gantz-agree-to-establish-emergency-war-government/", title: "After days of indecision, Netanyahu, Gantz agree to establish emergency war government (11 Oct 2023)", publisher: "The Times of Israel" }
  - knesset: 24
    date: "2021-03-23"
    turnout: 67.4
    winner: { he: "הליכוד", en: "Likud", ar: "الليكود", ru: "Ликуд", es: "Likud", fr: "Likoud" }
    winnerSeats: 30
    pm: { he: "נפתלי בנט ← יאיר לפיד", en: "Naftali Bennett → Yair Lapid", ar: "نفتالي بينيت ← يائير لبيد", ru: "Нафтали Беннет → Яир Лапид", es: "Naftali Bennett → Yair Lapid", fr: "Naftali Bennett → Yaïr Lapid" }
    note: { he: "ממשלת השינוי (בנט-לפיד) קמה למרות שהליכוד היה הגדול ביותר.", en: "The \"change government\" (Bennett-Lapid) formed despite Likud being largest.", ar: "تشكّلت «حكومة التغيير» (بينيت-لبيد) رغم أن الليكود كان الحزب الأكبر.", ru: "«Правительство перемен» (Беннет — Лапид) было сформировано, несмотря на то что крупнейшей партией был Ликуд.", es: "El «gobierno del cambio» (Bennett-Lapid) se formó pese a que el Likud era el partido más grande.", fr: "Le « gouvernement du changement » (Bennett-Lapid) s’est formé bien que le Likoud fût le plus grand parti." }
    summary:
      he: "ממשלת השינוי איחדה שמונה מפלגות מימין, ממרכז ומשמאל כדי להחליף את נתניהו, עם רוטציה מתוכננת בין בנט ללפיד."
      en: "The \"change government\" united eight parties from right, centre and left to replace Netanyahu, with a planned rotation between Bennett and Lapid."
      ar: "جمعت «حكومة التغيير» ثمانية أحزاب من اليمين والوسط واليسار لاستبدال نتنياهو، مع تناوب مخطط بين بينيت ولبيد."
      ru: "«Правительство перемен» объединило восемь партий правого, центристского и левого толка, чтобы сменить Нетаньяху, с запланированной ротацией между Беннетом и Лапидом."
      es: "El «gobierno del cambio» unió a ocho partidos de derecha, centro e izquierda para sustituir a Netanyahu, con una rotación prevista entre Bennett y Lapid."
      fr: "Le « gouvernement du changement » a réuni huit partis de droite, du centre et de gauche pour remplacer Netanyahou, avec une rotation prévue entre Bennett et Lapid."
    events:
      - kind: neutral
        date: "2021-06-13"
        text: { he: "לראשונה מפלגה ערבית (רע\"ם) הייתה חברה רשמית בקואליציה השלטת.", en: "For the first time an Arab party (Ra'am) was a formal member of the governing coalition.", ar: "لأول مرة كان حزب عربي (القائمة الموحدة) عضوًا رسميًا في الائتلاف الحاكم.", ru: "Впервые арабская партия (РААМ) стала официальным членом правящей коалиции.", es: "Por primera vez un partido árabe (Ra'am) fue miembro formal de la coalición de gobierno.", fr: "Pour la première fois, un parti arabe (Ra'am) a officiellement fait partie de la coalition gouvernementale." }
      - kind: neutral
        date: "2021-11-04"
        text: { he: "אישור תקציב מדינה ראשון מזה למעלה משלוש שנים.", en: "Passage of the first state budget in over three years.", ar: "إقرار أول ميزانية للدولة منذ أكثر من ثلاث سنوات.", ru: "Принятие первого государственного бюджета более чем за три года.", es: "Aprobación del primer presupuesto del Estado en más de tres años.", fr: "Adoption du premier budget de l’État en plus de trois ans." }
      - kind: neutral
        date: "2022-04-06"
        text: { he: "איבוד הרוב בכנסת לאחר פרישת חברי קואליציה.", en: "Loss of the Knesset majority after coalition members defected.", ar: "فقدان الأغلبية في الكنيست بعد انشقاق أعضاء من الائتلاف.", ru: "Потеря большинства в Кнессете после выхода депутатов из коалиции.", es: "Pérdida de la mayoría en la Knéset tras la deserción de miembros de la coalición.", fr: "Perte de la majorité à la Knesset après la défection de membres de la coalition." }
      - kind: bad
        date: "2021-05-10"
        text: { he: "מבצע \"שומר החומות\" מול חמאס בעזה ומהומות בערים מעורבות.", en: "Operation Guardian of the Walls against Hamas in Gaza and unrest in mixed cities.", ar: "عملية «حارس الأسوار» ضد حماس في غزة واضطرابات في المدن المختلطة.", ru: "Операция «Страж стен» против ХАМАС в Газе и беспорядки в смешанных городах.", es: "La operación Guardián de los Muros contra Hamás en Gaza y los disturbios en las ciudades mixtas.", fr: "L’opération Gardien des murailles contre le Hamas à Gaza et les troubles dans les villes mixtes." }
    ended: { he: "הכנסת התפזרה ביוני 2022 לאחר שאיבדה את הרוב; לפיד הפך לראש ממשלה מעבר.", en: "Dissolved in June 2022 after losing its majority; Lapid became caretaker PM.", ar: "حُلّ في حزيران/يونيو 2022 بعد فقدانه الأغلبية؛ وأصبح لبيد رئيس حكومة انتقالية.", ru: "Распущен в июне 2022 года после потери большинства; Лапид стал премьер-министром переходного правительства.", es: "Disuelta en junio de 2022 tras perder la mayoría; Lapid pasó a ser primer ministro en funciones.", fr: "Dissoute en juin 2022 après la perte de sa majorité ; Lapid est devenu Premier ministre de transition." }
    sources:
      - { url: "https://main.knesset.gov.il/en/about/history/Pages/KnessetHistory.aspx?kns=24", title: "24th Knesset: results of the elections (23 March 2021) and its governments", publisher: "הכנסת" }
      - { url: "https://main.knesset.gov.il/EN/Documents/2022-10-24%20Fact%20sheet%2002%20-%2025th%20Knesset%20elections%20-%20updated.pdf", title: "Fact sheet: The 25th Knesset elections (October 2022) — voter turnout, 21st–24th Knessets", publisher: "מרכז המחקר והמידע של הכנסת" }
      - { url: "https://en.idi.org.il/israeli-elections-and-parties/parties/raam/", title: "Ra'am", publisher: "המכון הישראלי לדמוקרטיה" }
  - knesset: 23
    date: "2020-03-02"
    turnout: 71.5
    winner: { he: "הליכוד", en: "Likud", ar: "الليكود", ru: "Ликуд", es: "Likud", fr: "Likoud" }
    winnerSeats: 36
    pm: { he: "בנימין נתניהו", en: "Benjamin Netanyahu", ar: "بنيامين نتنياهو", ru: "Биньямин Нетаньяху", es: "Benjamín Netanyahu", fr: "Benyamin Netanyahou" }
    note: { he: "הבחירות השלישיות בתוך שנה; ממשלת אחדות נתניהו-גנץ.", en: "The third election within a year; a Netanyahu-Gantz unity government.", ar: "ثالث انتخابات خلال عام؛ حكومة وحدة بين نتنياهو وغانتس.", ru: "Третьи выборы за год; правительство единства Нетаньяху — Ганца.", es: "Las terceras elecciones en un año; un gobierno de unidad Netanyahu-Gantz.", fr: "La troisième élection en un an ; un gouvernement d’union Netanyahou-Gantz." }
    summary:
      he: "לאחר שלוש מערכות בחירות הוקמה ממשלת אחדות-חירום בצל מגפת הקורונה, עם הסכם רוטציה בין נתניהו לגנץ שלא מומש."
      en: "After three elections, a unity emergency government formed amid the COVID-19 pandemic, with a Netanyahu-Gantz rotation deal that was never fulfilled."
      ar: "بعد ثلاث جولات انتخابية تشكّلت حكومة وحدة وطوارئ في ظل جائحة كورونا، مع اتفاق تناوب بين نتنياهو وغانتس لم يُنفَّذ."
      ru: "После трёх избирательных кампаний на фоне пандемии COVID-19 было сформировано чрезвычайное правительство единства с соглашением о ротации между Нетаньяху и Ганцем, которое так и не было выполнено."
      es: "Tras tres elecciones se formó un gobierno de emergencia de unidad en plena pandemia de COVID-19, con un acuerdo de rotación Netanyahu-Gantz que nunca se cumplió."
      fr: "Après trois élections, un gouvernement d’union d’urgence s’est formé en pleine pandémie de COVID-19, avec un accord de rotation Netanyahou-Gantz jamais appliqué."
    events:
      - kind: bad
        date: "2020-03-19"
        text: { he: "ניהול משבר מגפת הקורונה וסגרים חוזרים ונשנים.", en: "Managing the COVID-19 crisis and repeated lockdowns.", ar: "إدارة أزمة جائحة كورونا والإغلاقات المتكررة.", ru: "Борьба с кризисом COVID-19 и повторные локдауны.", es: "La gestión de la crisis de la COVID-19 y los confinamientos repetidos.", fr: "La gestion de la crise de la COVID-19 et les confinements répétés." }
      - kind: neutral
        date: "2020-12-22"
        text: { he: "אי-העברת תקציב מדינה הביאה לפיזור אוטומטי של הכנסת.", en: "Failure to pass a state budget triggered the Knesset's automatic dissolution.", ar: "أدى عدم إقرار ميزانية الدولة إلى حلّ الكنيست تلقائيًا.", ru: "Непринятие государственного бюджета привело к автоматическому роспуску Кнессета.", es: "La no aprobación de un presupuesto del Estado provocó la disolución automática de la Knéset.", fr: "L’échec de l’adoption d’un budget de l’État a entraîné la dissolution automatique de la Knesset." }
      - kind: good
        date: "2020-09-15"
        text: { he: "הסכמי אברהם — נחתמו עם איחוד האמירויות ובחריין; מרוקו וסודאן הצטרפו בחודשים שלאחר מכן.", en: "The Abraham Accords — signed with the UAE and Bahrain; Morocco and Sudan joined in the following months.", ar: "اتفاقيات أبراهام — وُقّعت مع الإمارات والبحرين؛ وانضم المغرب والسودان في الأشهر التالية.", ru: "«Авраамовы соглашения» — подписаны с ОАЭ и Бахрейном; Марокко и Судан присоединились в следующие месяцы.", es: "Los Acuerdos de Abraham — firmados con Emiratos Árabes Unidos y Baréin; Marruecos y Sudán se sumaron en los meses siguientes.", fr: "Les accords d’Abraham — signés avec les Émirats arabes unis et Bahreïn ; le Maroc et le Soudan les ont rejoints dans les mois suivants." }
    ended: { he: "פוזרה בדצמבר 2020 כי לא אושר תקציב מדינה במועד.", en: "Dissolved in December 2020 because no state budget was passed in time.", ar: "حُلّ في كانون الأول/ديسمبر 2020 لعدم إقرار ميزانية الدولة في موعدها.", ru: "Распущен в декабре 2020 года, так как государственный бюджет не был принят вовремя.", es: "Disuelta en diciembre de 2020 porque no se aprobó a tiempo un presupuesto del Estado.", fr: "Dissoute en décembre 2020 faute d’adoption à temps d’un budget de l’État." }
    sources:
      - { url: "https://main.knesset.gov.il/en/about/history/Pages/KnessetHistory.aspx?kns=23", title: "23rd Knesset: results of the elections (2 March 2020) and its governments", publisher: "הכנסת" }
      - { url: "https://main.knesset.gov.il/EN/Documents/2022-10-24%20Fact%20sheet%2002%20-%2025th%20Knesset%20elections%20-%20updated.pdf", title: "Fact sheet: The 25th Knesset elections (October 2022) — voter turnout, 21st–24th Knessets", publisher: "מרכז המחקר והמידע של הכנסת" }
      - { url: "https://www.state.gov/the-abraham-accords/", title: "The Abraham Accords", publisher: "U.S. Department of State" }
      - { url: "https://www.state.gov/wp-content/uploads/2020/09/Bahrain_Israel-Agreement-signed-FINAL-15-Sept-2020-508.pdf", title: "Abraham Accords: Declaration of Peace, Cooperation, and Constructive Diplomatic and Friendly Relations (Israel and Bahrain, 15 September 2020)", publisher: "U.S. Department of State" }
      - { url: "https://www.state.gov/wp-content/uploads/2021/01/Joint-Declaration-US-Morrocco-Israel.pdf", title: "Joint Declaration of the Kingdom of Morocco, the United States of America and the State of Israel (Rabat, 22 December 2020)", publisher: "U.S. Department of State" }
      - { url: "https://www.timesofisrael.com/sudan-signs-abraham-accords-with-us-paving-way-for-israel-normalization/", title: "Sudan signs 'Abraham Accords' with US, paving way for Israel normalization (6 January 2021)", publisher: "The Times of Israel" }
  - knesset: 22
    date: "2019-09-17"
    turnout: 69.8
    winner: { he: "כחול לבן", en: "Blue & White", ar: "أزرق أبيض", ru: "«Кахоль-лаван»", es: "Azul y Blanco", fr: "Bleu et Blanc" }
    winnerSeats: 33
    pm: { he: "לא הוקמה ממשלה", en: "No government formed", ar: "لم تُشكَّل حكومة", ru: "Правительство не сформировано", es: "No se formó gobierno", fr: "Aucun gouvernement formé" }
    note: { he: "אף גוש לא הצליח להרכיב ממשלה — הובלה לבחירות חוזרות.", en: "Neither bloc could form a government — led to another election.", ar: "لم تنجح أي كتلة في تشكيل حكومة — ما أدى إلى انتخابات أخرى.", ru: "Ни один блок не смог сформировать правительство — это привело к новым выборам.", es: "Ninguno de los dos bloques pudo formar gobierno — llevó a otras elecciones.", fr: "Aucun des deux blocs n’a pu former un gouvernement — ce qui a conduit à une nouvelle élection." }
    summary:
      he: "בבחירות החוזרות כחול לבן הפכה לסיעה הגדולה ביותר, אך שוב אף מחנה לא הגיע לרוב של 61 ולא הצליח להרכיב ממשלה."
      en: "In the repeat election Blue & White became the largest party, but again neither camp reached a 61-seat majority or managed to form a government."
      ar: "في الانتخابات المعادة أصبح أزرق أبيض الحزب الأكبر، لكن مجددًا لم يبلغ أي معسكر أغلبية 61 مقعدًا ولم ينجح في تشكيل حكومة."
      ru: "На повторных выборах «Кахоль-лаван» стал крупнейшей партией, но снова ни один лагерь не набрал большинства в 61 мандат и не смог сформировать правительство."
      es: "En la repetición electoral Azul y Blanco pasó a ser el partido más grande, pero de nuevo ningún bando alcanzó una mayoría de 61 escaños ni logró formar gobierno."
      fr: "Lors du nouveau scrutin, Bleu et Blanc est devenu le plus grand parti, mais de nouveau aucun camp n’a atteint la majorité de 61 sièges ni réussi à former un gouvernement."
    events:
      - kind: neutral
        date: "2019-11-21"
        text: { he: "גם גנץ וגם נתניהו נכשלו בהרכבת ממשלה.", en: "Both Gantz and Netanyahu failed to form a government.", ar: "فشل كلٌّ من غانتس ونتنياهو في تشكيل حكومة.", ru: "И Ганц, и Нетаньяху не смогли сформировать правительство.", es: "Tanto Gantz como Netanyahu fracasaron en formar gobierno.", fr: "Gantz et Netanyahou ont tous deux échoué à former un gouvernement." }
    ended: { he: "פוזרה בדצמבר 2019 לאחר שלא הורכבה ממשלה — בחירות שלישיות.", en: "Dissolved in December 2019 after no government formed — a third election.", ar: "حُلّ في كانون الأول/ديسمبر 2019 بعد عدم تشكيل حكومة — انتخابات ثالثة.", ru: "Распущен в декабре 2019 года, так как правительство не было сформировано, — третьи выборы.", es: "Disuelta en diciembre de 2019 al no formarse gobierno — unas terceras elecciones.", fr: "Dissoute en décembre 2019 faute de gouvernement — une troisième élection." }
    sources:
      - { url: "https://main.knesset.gov.il/en/about/history/Pages/KnessetHistory.aspx?kns=22", title: "22nd Knesset: results of the elections (17 September 2019) and its governments", publisher: "הכנסת" }
      - { url: "https://main.knesset.gov.il/EN/Documents/2022-10-24%20Fact%20sheet%2002%20-%2025th%20Knesset%20elections%20-%20updated.pdf", title: "Fact sheet: The 25th Knesset elections (October 2022) — voter turnout, 21st–24th Knessets", publisher: "מרכז המחקר והמידע של הכנסת" }
  - knesset: 21
    date: "2019-04-09"
    turnout: 68.5
    winner: { he: "הליכוד", en: "Likud", ar: "الليكود", ru: "Ликуд", es: "Likud", fr: "Likoud" }
    winnerSeats: 35
    pm: { he: "לא הוקמה ממשלה", en: "No government formed", ar: "لم تُشكَّل حكومة", ru: "Правительство не сформировано", es: "No se formó gobierno", fr: "Aucun gouvernement formé" }
    note: { he: "הליכוד וכחול לבן זכו כל אחת ב-35 מושבים (לליכוד היו יותר קולות). הכנסת פיזרה את עצמה לראשונה בהיסטוריה במקום להקים ממשלה.", en: "Likud and Blue & White tied at 35 seats each (Likud had more votes). The Knesset dissolved itself for the first time ever instead of forming a government.", ar: "تعادل الليكود وأزرق أبيض بـ35 مقعدًا لكلٍّ منهما (وحصل الليكود على أصوات أكثر). حلّ الكنيست نفسه لأول مرة في تاريخه بدلًا من تشكيل حكومة.", ru: "Ликуд и «Кахоль-лаван» получили по 35 мандатов (у Ликуда было больше голосов). Кнессет впервые в истории самораспустился вместо формирования правительства.", es: "El Likud y Azul y Blanco empataron a 35 escaños (el Likud obtuvo más votos). La Knéset se disolvió a sí misma por primera vez en la historia en lugar de formar gobierno.", fr: "Le Likoud et Bleu et Blanc sont arrivés à égalité avec 35 sièges chacun (le Likoud a obtenu plus de voix). La Knesset s’est dissoute elle-même pour la première fois de son histoire au lieu de former un gouvernement." }
    summary:
      he: "אף שהליכוד והגוש הימני זכו ברוב, המשא ומתן הקואליציוני נכשל סביב חוק הגיוס, והכנסת בחרה להתפזר במקום לאפשר למישהו אחר להרכיב ממשלה."
      en: "Although Likud and the right won a majority, coalition talks collapsed over the conscription law, and the Knesset chose to dissolve itself rather than let anyone else try to form a government."
      ar: "رغم فوز الليكود واليمين بأغلبية، انهارت المفاوضات الائتلافية حول قانون التجنيد، واختار الكنيست حلّ نفسه بدلًا من إتاحة الفرصة لغيره لتشكيل حكومة."
      ru: "Хотя Ликуд и правые получили большинство, коалиционные переговоры сорвались из-за закона о призыве, и Кнессет предпочёл самораспуститься, а не дать кому-то другому попытаться сформировать правительство."
      es: "Aunque el Likud y la derecha obtuvieron mayoría, las negociaciones de coalición fracasaron por la ley del servicio militar, y la Knéset optó por disolverse antes que permitir que otro intentara formar gobierno."
      fr: "Bien que le Likoud et la droite aient obtenu la majorité, les négociations de coalition ont échoué sur la loi sur la conscription, et la Knesset a choisi de se dissoudre plutôt que de laisser quelqu’un d’autre tenter de former un gouvernement."
    events:
      - kind: neutral
        date: "2019-05-30"
        text: { he: "כישלון המו\"מ הקואליציוני בעיקר סביב חוק הגיוס.", en: "Collapse of coalition talks, chiefly over the conscription law.", ar: "انهيار المفاوضات الائتلافية، ولا سيما حول قانون التجنيد.", ru: "Срыв коалиционных переговоров — прежде всего из-за закона о призыве.", es: "Fracaso de las negociaciones de coalición, sobre todo por la ley del servicio militar.", fr: "Échec des négociations de coalition, principalement sur la loi sur la conscription." }
    ended: { he: "פוזרה במאי 2019 — לראשונה בהיסטוריה הכנסת פיזרה את עצמה במקום להקים ממשלה.", en: "Dissolved in May 2019 — the first time the Knesset dissolved itself instead of forming a government.", ar: "حُلّ في أيار/مايو 2019 — المرة الأولى التي يحلّ فيها الكنيست نفسه بدلًا من تشكيل حكومة.", ru: "Распущен в мае 2019 года — впервые Кнессет самораспустился вместо формирования правительства.", es: "Disuelta en mayo de 2019 — la primera vez que la Knéset se disolvió a sí misma en lugar de formar gobierno.", fr: "Dissoute en mai 2019 — la première fois que la Knesset s’est dissoute elle-même au lieu de former un gouvernement." }
    sources:
      - { url: "https://main.knesset.gov.il/en/about/history/Pages/KnessetHistory.aspx?kns=21", title: "21st Knesset: results of the elections (9 April 2019) and its governments", publisher: "הכנסת" }
      - { url: "https://main.knesset.gov.il/EN/Documents/2022-10-24%20Fact%20sheet%2002%20-%2025th%20Knesset%20elections%20-%20updated.pdf", title: "Fact sheet: The 25th Knesset elections (October 2022) — voter turnout, 21st–24th Knessets", publisher: "מרכז המחקר והמידע של הכנסת" }
      - { url: "https://en.idi.org.il/israeli-elections-and-parties/elections/2019-1/", title: "The Elections for the 21st Knesset (9 April 2019): results", publisher: "המכון הישראלי לדמוקרטיה" }
  - knesset: 20
    date: "2015-03-17"
    turnout: 72.3
    winner: { he: "הליכוד", en: "Likud", ar: "الليكود", ru: "Ликуд", es: "Likud", fr: "Likoud" }
    winnerSeats: 30
    pm: { he: "בנימין נתניהו", en: "Benjamin Netanyahu", ar: "بنيامين نتنياهو", ru: "Биньямин Нетаньяху", es: "Benjamín Netanyahu", fr: "Benyamin Netanyahou" }
    summary:
      he: "נתניהו הקים תחילה קואליציה ימנית-דתית צרה של 61 מושבים בלבד, שהורחבה מאוחר יותר. בכהונה זו התחילו חקירות פליליות נגד ראש הממשלה."
      en: "Netanyahu first formed a narrow right-religious coalition of just 61 seats, later broadened. Criminal investigations into the prime minister opened during this term."
      ar: "شكّل نتنياهو في البداية ائتلافًا يمينيًا-دينيًا ضيقًا من 61 مقعدًا فقط، وُسِّع لاحقًا. وخلال هذه الولاية فُتحت تحقيقات جنائية ضد رئيس الحكومة."
      ru: "Нетаньяху сначала сформировал узкую право-религиозную коалицию всего из 61 мандата, позже расширенную. В этот период против премьер-министра были начаты уголовные расследования."
      es: "Netanyahu formó primero una estrecha coalición de derecha y religiosa de solo 61 escaños, ampliada después. Durante esta legislatura se abrieron investigaciones penales contra el primer ministro."
      fr: "Netanyahou a d’abord formé une étroite coalition de droite et religieuse de seulement 61 sièges, élargie ensuite. Des enquêtes pénales visant le Premier ministre ont été ouvertes au cours de cette législature."
    events:
      - kind: neutral
        text: { he: "נפתחו חקירות משטרה בעניינו של ראש הממשלה נתניהו: תיק 1000 בדצמבר 2016, תיק 2000 בינואר 2017 ותיק 4000 בפברואר 2018. ב-2020 הוגש נגדו כתב אישום; הוא מכחיש את האשמות, משפטו נמשך, וחלה חזקת החפות.", en: "Police investigations into Prime Minister Netanyahu opened: Case 1000 in December 2016, Case 2000 in January 2017 and Case 4000 in February 2018. He was indicted in 2020; he denies the charges, his trial is ongoing, and the presumption of innocence applies.", ar: "فُتحت تحقيقات شرطية بشأن رئيس الحكومة نتنياهو: الملف 1000 في كانون الأول/ديسمبر 2016، والملف 2000 في كانون الثاني/يناير 2017، والملف 4000 في شباط/فبراير 2018. وقُدّمت ضده لائحة اتهام في 2020؛ وهو ينفي التهم، ومحاكمته مستمرة، وتسري قرينة البراءة.", ru: "Полиция начала расследования в отношении премьер-министра Нетаньяху: дело 1000 — в декабре 2016 года, дело 2000 — в январе 2017 года, дело 4000 — в феврале 2018 года. В 2020 году ему предъявили обвинение; он отрицает обвинения, суд продолжается, действует презумпция невиновности.", es: "Se abrieron investigaciones policiales sobre el primer ministro Netanyahu: el caso 1000 en diciembre de 2016, el caso 2000 en enero de 2017 y el caso 4000 en febrero de 2018. Fue acusado formalmente en 2020; niega los cargos, su juicio sigue en curso y rige la presunción de inocencia.", fr: "Des enquêtes de police visant le Premier ministre Netanyahou ont été ouvertes : l’affaire 1000 en décembre 2016, l’affaire 2000 en janvier 2017 et l’affaire 4000 en février 2018. Il a été mis en accusation en 2020 ; il nie les faits, son procès est en cours et la présomption d’innocence s’applique." }
      - kind: neutral
        date: "2018-07-19"
        text: { he: "חקיקת חוק יסוד: ישראל — מדינת הלאום של העם היהודי.", en: "Passage of Basic Law: Israel as the Nation-State of the Jewish People.", ar: "سنّ قانون أساس: إسرائيل – الدولة القومية للشعب اليهودي.", ru: "Принятие Основного закона: Израиль — национальное государство еврейского народа.", es: "Aprobación de la Ley Fundamental: Israel como Estado-nación del pueblo judío.", fr: "Adoption de la Loi fondamentale : Israël, État-nation du peuple juif." }
    ended: { he: "פוזרה בדצמבר 2018 על רקע המחלוקת על חוק הגיוס — לבחירות מוקדמות.", en: "Dissolved in December 2018 amid the conscription-law dispute — to early elections.", ar: "حُلّ في كانون الأول/ديسمبر 2018 على خلفية الخلاف حول قانون التجنيد — إلى انتخابات مبكرة.", ru: "Распущен в декабре 2018 года на фоне спора о законе о призыве — досрочные выборы.", es: "Disuelta en diciembre de 2018 en medio de la disputa por la ley del servicio militar — hacia elecciones anticipadas.", fr: "Dissoute en décembre 2018 au milieu du conflit sur la loi sur la conscription — élections anticipées." }
    sources:
      - { url: "https://main.knesset.gov.il/en/about/history/Pages/KnessetHistory.aspx?kns=20", title: "20th Knesset: results of the elections (17 March 2015) and its governments", publisher: "הכנסת" }
      - { url: "https://en.idi.org.il/israeli-elections-and-parties/elections/2015/", title: "Elections for the 20th Knesset (17.3.2015): results and voter turnout", publisher: "המכון הישראלי לדמוקרטיה" }
      - { url: "https://en.wikipedia.org/wiki/Trial_of_Benjamin_Netanyahu", title: "Trial of Benjamin Netanyahu", publisher: "Wikipedia" }
      - { url: "https://www.ynetnews.com/articles/0,7340,L-5122753,00.html", title: "Two suspected of offering bribes to close case against PM's wife (20 Feb 2018)", publisher: "Ynetnews" }
  - knesset: 19
    date: "2013-01-22"
    turnout: 67.8
    winner: { he: "הליכוד ישראל ביתנו", en: "Likud Yisrael Beiteinu", ar: "الليكود بيتنا", ru: "«Ликуд Бейтейну»", es: "Likud Yisrael Beiteinu", fr: "Likoud-Israël Beiteinou" }
    winnerSeats: 31
    pm: { he: "בנימין נתניהו", en: "Benjamin Netanyahu", ar: "بنيامين نتنياهو", ru: "Биньямин Нетаньяху", es: "Benjamín Netanyahu", fr: "Benyamin Netanyahou" }
    summary:
      he: "לראשונה מזה שנים הוקמה קואליציה ללא המפלגות החרדיות, עם דגש על \"שוויון בנטל\" (גיוס חרדים) ויוקר המחיה."
      en: "For the first time in years a coalition formed without the Haredi parties, focused on \"sharing the burden\" (Haredi conscription) and the cost of living."
      ar: "لأول مرة منذ سنوات تشكّل ائتلاف من دون الأحزاب الحريدية، مع التركيز على «المساواة في العبء» (تجنيد الحريديم) وغلاء المعيشة."
      ru: "Впервые за много лет коалиция была сформирована без харедимных партий, с упором на «равное бремя» (призыв харедим) и стоимость жизни."
      es: "Por primera vez en años se formó una coalición sin los partidos jaredíes, centrada en «compartir la carga» (el reclutamiento de los jaredíes) y en el costo de la vida."
      fr: "Pour la première fois depuis des années, une coalition s’est formée sans les partis haredim, axée sur le « partage du fardeau » (conscription des haredim) et le coût de la vie."
    events:
      - kind: neutral
        date: "2014-03-12"
        text: { he: "חקיקת חוק השוויון בנטל לגיוס בני ישיבות.", en: "Passage of the 'equal burden' law on yeshiva-student conscription.", ar: "سنّ قانون «المساواة في العبء» بشأن تجنيد طلاب المعاهد الدينية.", ru: "Принятие закона о «равном бремени» о призыве учащихся ешив.", es: "Aprobación de la ley de «carga igualitaria» sobre el reclutamiento de los estudiantes de yeshivá.", fr: "Adoption de la loi sur le « partage du fardeau » concernant la conscription des étudiants de yeshiva." }
      - kind: bad
        date: "2014-07-08"
        text: { he: "מבצע \"צוק איתן\" — מלחמה בת 50 יום מול חמאס בעזה.", en: "Operation Protective Edge — a 50-day war against Hamas in Gaza.", ar: "عملية «الجرف الصامد» — حرب استمرت 50 يومًا ضد حماس في غزة.", ru: "Операция «Нерушимая скала» — 50-дневная война против ХАМАС в Газе.", es: "La operación Margen Protector — una guerra de 50 días contra Hamás en Gaza.", fr: "L’opération Bordure protectrice — une guerre de 50 jours contre le Hamas à Gaza." }
    ended: { he: "התפרקה בדצמבר 2014 כשנתניהו פיטר את לפיד ולבני — לבחירות מוקדמות.", en: "Collapsed in December 2014 when Netanyahu dismissed Lapid and Livni — to early elections.", ar: "تفكّك الائتلاف في كانون الأول/ديسمبر 2014 حين أقال نتنياهو لبيد وليفني — إلى انتخابات مبكرة.", ru: "Коалиция распалась в декабре 2014 года, когда Нетаньяху уволил Лапида и Ливни, — досрочные выборы.", es: "Se derrumbó en diciembre de 2014 cuando Netanyahu destituyó a Lapid y Livni — hacia elecciones anticipadas.", fr: "Effondrement en décembre 2014 lorsque Netanyahou a limogé Lapid et Livni — élections anticipées." }
    sources:
      - { url: "https://main.knesset.gov.il/en/about/history/Pages/KnessetHistory.aspx?kns=19", title: "19th Knesset: results of the elections (22 January 2013) and its governments", publisher: "הכנסת" }
      - { url: "https://en.idi.org.il/israeli-elections-and-parties/elections/2013/", title: "Elections for the 19th Knesset (22.1.2013): results and voter turnout", publisher: "המכון הישראלי לדמוקרטיה" }
  - knesset: 18
    date: "2009-02-10"
    turnout: 64.7
    winner: { he: "קדימה", en: "Kadima", ar: "كاديما", ru: "«Кадима»", es: "Kadima", fr: "Kadima" }
    winnerSeats: 28
    pm: { he: "בנימין נתניהו", en: "Benjamin Netanyahu", ar: "بنيامين نتنياهو", ru: "Биньямин Нетаньяху", es: "Benjamín Netanyahu", fr: "Benyamin Netanyahou" }
    note: { he: "קדימה היתה הגדולה ביותר אך נתניהו (הליכוד) הרכיב את הממשלה.", en: "Kadima was largest, but Netanyahu (Likud) formed the government.", ar: "كان كاديما الحزب الأكبر، لكن نتنياهو (الليكود) هو من شكّل الحكومة.", ru: "Крупнейшей партией была «Кадима», но правительство сформировал Нетаньяху (Ликуд).", es: "Kadima fue el partido más grande, pero Netanyahu (Likud) formó el gobierno.", fr: "Kadima était le plus grand parti, mais Netanyahou (Likoud) a formé le gouvernement." }
    summary:
      he: "אף שקדימה (לבני) היתה הסיעה הגדולה ביותר, נתניהו הצליח להרכיב קואליציה ימנית והקים את ממשלתו השנייה, שכיהנה כמעט קדנציה מלאה."
      en: "Although Kadima (Livni) was the largest party, Netanyahu assembled a right-wing coalition and formed his second government, which served nearly a full term."
      ar: "رغم أن كاديما (ليفني) كان الحزب الأكبر، نجح نتنياهو في تشكيل ائتلاف يميني وأقام حكومته الثانية، التي خدمت ولاية شبه كاملة."
      ru: "Хотя крупнейшей партией была «Кадима» (Ливни), Нетаньяху собрал правую коалицию и сформировал своё второе правительство, которое проработало почти полный срок."
      es: "Aunque Kadima (Livni) era el partido más grande, Netanyahu reunió una coalición de derecha y formó su segundo gobierno, que cumplió casi una legislatura entera."
      fr: "Bien que Kadima (Livni) fût le plus grand parti, Netanyahou a réuni une coalition de droite et formé son deuxième gouvernement, qui a accompli presque une législature complète."
    events:
      - kind: neutral
        date: "2011-07-14"
        text: { he: "מחאת קיץ 2011 (\"מחאת האוהלים\") על יוקר המחיה.", en: "The summer 2011 social-justice (\"tent\") protests over the cost of living.", ar: "احتجاجات صيف 2011 («احتجاج الخيام») على غلاء المعيشة.", ru: "Социальные протесты лета 2011 года («палаточный протест») против дороговизны жизни.", es: "Las protestas por la justicia social (las «tiendas») del verano de 2011 contra el costo de la vida.", fr: "Les manifestations pour la justice sociale (les « tentes ») de l’été 2011 contre le coût de la vie." }
      - kind: neutral
        date: "2011-10-18"
        text: { he: "עסקת שליט — שחרור גלעד שליט תמורת אסירים.", en: "The Shalit deal — Gilad Shalit released in a prisoner exchange.", ar: "صفقة شاليط — الإفراج عن جلعاد شاليط مقابل أسرى.", ru: "«Сделка Шалита» — освобождение Гилада Шалита в обмен на заключённых.", es: "El acuerdo Shalit — Gilad Shalit liberado en un intercambio de prisioneros.", fr: "L’accord Shalit — Gilad Shalit libéré dans un échange de prisonniers." }
      - kind: bad
        date: "2012-11-14"
        text: { he: "מבצע \"עמוד ענן\" מול חמאס בעזה.", en: "Operation Pillar of Defense against Hamas in Gaza.", ar: "عملية «عمود السحاب» ضد حماس في غزة.", ru: "Операция «Облачный столп» против ХАМАС в Газе.", es: "La operación Pilar Defensivo contra Hamás en Gaza.", fr: "L’opération Pilier de défense contre le Hamas à Gaza." }
    ended: { he: "הוקדמו הבחירות; הכנסת פוזרה ב-2012 על רקע אי-הסכמה על התקציב.", en: "Elections were brought forward; the Knesset dissolved in 2012 over a budget disagreement.", ar: "قُدّمت الانتخابات؛ وحُلّ الكنيست في 2012 على خلفية خلاف حول الميزانية.", ru: "Выборы были перенесены на более ранний срок; Кнессет был распущен в 2012 году из-за разногласий по бюджету.", es: "Las elecciones se adelantaron; la Knéset se disolvió en 2012 por un desacuerdo presupuestario.", fr: "Les élections ont été avancées ; la Knesset s’est dissoute en 2012 sur un désaccord budgétaire." }
    sources:
      - { url: "https://main.knesset.gov.il/en/about/history/Pages/KnessetHistory.aspx?kns=18", title: "18th Knesset: results of the elections (10 February 2009) and its governments", publisher: "הכנסת" }
      - { url: "https://www.gov.il/apps/elections/elections-knesset-19/heb/history/PercentVotes.html", title: "אחוז המצביעים בבחירות קודמות, הכנסת ה-1 עד ה-18 (אתר ועדת הבחירות המרכזית לכנסת ה-19)", publisher: "ועדת הבחירות המרכזית (gov.il)" }
  - knesset: 17
    date: "2006-03-28"
    turnout: 63.5
    winner: { he: "קדימה", en: "Kadima", ar: "كاديما", ru: "«Кадима»", es: "Kadima", fr: "Kadima" }
    winnerSeats: 29
    pm: { he: "אהוד אולמרט", en: "Ehud Olmert", ar: "إيهود أولمرت", ru: "Эхуд Ольмерт", es: "Ehud Olmert", fr: "Ehud Olmert" }
    summary:
      he: "קדימה, שהוקמה בידי שרון, הובילה את הממשלה בראשות אולמרט לאחר שבץ שעבר שרון. הקדנציה לוותה בשתי מלחמות ובחקירות שהפילו את ראש הממשלה."
      en: "Kadima, founded by Sharon, led the government under Olmert after Sharon's stroke. The term was marked by two wars and the investigations that brought down the prime minister."
      ar: "قاد كاديما، الذي أسّسه شارون، الحكومة برئاسة أولمرت بعد إصابة شارون بجلطة دماغية. وتخلّلت الولاية حربان وتحقيقات أطاحت برئيس الحكومة."
      ru: "«Кадима», основанная Шароном, возглавила правительство под руководством Ольмерта после инсульта Шарона. Каденция была отмечена двумя войнами и расследованиями, которые привели к падению премьер-министра."
      es: "Kadima, fundado por Sharon, dirigió el gobierno con Olmert tras el derrame cerebral de Sharon. La legislatura estuvo marcada por dos guerras y por las investigaciones que derribaron al primer ministro."
      fr: "Kadima, fondé par Sharon, a dirigé le gouvernement sous Olmert après l’attaque cérébrale de Sharon. La législature a été marquée par deux guerres et par les enquêtes qui ont fait chuter le Premier ministre."
    events:
      - kind: bad
        date: "2006-07-12"
        text: { he: "מלחמת לבנון השנייה.", en: "The Second Lebanon War.", ar: "حرب لبنان الثانية.", ru: "Вторая ливанская война.", es: "La Segunda Guerra del Líbano.", fr: "La Seconde Guerre du Liban." }
      - kind: neutral
        date: "2008-12-27"
        text: { he: "מבצע \"עופרת יצוקה\" ברצועת עזה.", en: "Operation Cast Lead in the Gaza Strip.", ar: "عملية «الرصاص المصبوب» في قطاع غزة.", ru: "Операция «Литой свинец» в секторе Газа.", es: "La operación Plomo Fundido en la Franja de Gaza.", fr: "L’opération Plomb durci dans la bande de Gaza." }
      - kind: neutral
        date: "2008-07-30"
        text: { he: "על רקע חקירות פליליות הודיע אולמרט שיתפטר עם בחירת יו\"ר חדש לקדימה.", en: "Amid criminal investigations, Olmert announced he would resign once Kadima chose a new leader.", ar: "على خلفية تحقيقات جنائية، أعلن أولمرت أنه سيستقيل فور انتخاب رئيس جديد لكاديما.", ru: "На фоне уголовных расследований Ольмерт объявил, что уйдёт в отставку после избрания нового лидера «Кадимы».", es: "En medio de investigaciones penales, Olmert anunció que dimitiría cuando Kadima eligiera un nuevo líder.", fr: "Sur fond d’enquêtes pénales, Olmert a annoncé qu’il démissionnerait dès que Kadima aurait choisi un nouveau dirigeant." }
    ended: { he: "אולמרט התפטר על רקע חקירות פליליות; ציפי לבני לא הצליחה להרכיב ממשלה, והבחירות הוקדמו לפברואר 2009.", en: "Olmert resigned amid criminal investigations; Tzipi Livni could not form a government, and early elections were held in February 2009.", ar: "استقال أولمرت على خلفية تحقيقات جنائية؛ ولم تنجح تسيبي ليفني في تشكيل حكومة، فجرت انتخابات مبكرة في شباط/فبراير 2009.", ru: "Ольмерт ушёл в отставку на фоне уголовных расследований; Ципи Ливни не смогла сформировать правительство, и в феврале 2009 года прошли досрочные выборы.", es: "Olmert dimitió en medio de investigaciones penales; Tzipi Livni no logró formar gobierno y en febrero de 2009 se celebraron elecciones anticipadas.", fr: "Olmert a démissionné sur fond d’enquêtes pénales ; Tzipi Livni n’a pas réussi à former un gouvernement, et des élections anticipées ont eu lieu en février 2009." }
    sources:
      - { url: "https://main.knesset.gov.il/en/about/history/Pages/KnessetHistory.aspx?kns=17", title: "17th Knesset: results of the elections (28 March 2006) and its governments", publisher: "הכנסת" }
      - { url: "https://www.gov.il/apps/elections/elections-knesset-19/heb/history/PercentVotes.html", title: "אחוז המצביעים בבחירות קודמות, הכנסת ה-1 עד ה-18 (אתר ועדת הבחירות המרכזית לכנסת ה-19)", publisher: "ועדת הבחירות המרכזית (gov.il)" }
      - { url: "https://en.idi.org.il/articles/38887", title: "Dissolving the Knesset: A Historical Survey (Chen Friedberg and Assaf Shapira, 18 May 2022)", publisher: "המכון הישראלי לדמוקרטיה" }
      - { url: "https://en.idi.org.il/israeli-elections-and-parties/elections/2009/", title: "About the 2009 Elections", publisher: "המכון הישראלי לדמוקרטיה" }
  - knesset: 16
    date: "2003-01-28"
    # IDI: 3,200,773 votes of 4,720,079 eligible, 67.8%. The CEC's table prints
    # 68.9 for 2003; shown here is the figure the votes and eligible voters give.
    turnout: 67.8
    winner: { he: "הליכוד", en: "Likud", ar: "الليكود", ru: "Ликуд", es: "Likud", fr: "Likoud" }
    winnerSeats: 38
    pm: { he: "אריאל שרון", en: "Ariel Sharon", ar: "أرييل شارون", ru: "Ариэль Шарон", es: "Ariel Sharon", fr: "Ariel Sharon" }
    summary:
      he: "ממשלת שרון החזקה ביצעה את תוכנית ההתנתקות מרצועת עזה ב-2005, צעד שפילג את הליכוד והוביל להקמת קדימה."
      en: "Sharon's strong government carried out the 2005 Disengagement from the Gaza Strip, a move that split Likud and led to the founding of Kadima."
      ar: "نفّذت حكومة شارون القوية خطة فك الارتباط عن قطاع غزة في 2005، وهي خطوة قسمت الليكود وأدت إلى تأسيس كاديما."
      ru: "Сильное правительство Шарона осуществило в 2005 году размежевание с сектором Газа — шаг, расколовший Ликуд и приведший к созданию «Кадимы»."
      es: "El sólido gobierno de Sharon llevó a cabo la Desconexión de la Franja de Gaza en 2005, un paso que dividió al Likud y llevó a la fundación de Kadima."
      fr: "Le gouvernement solide de Sharon a mené le désengagement de la bande de Gaza en 2005, une décision qui a divisé le Likoud et conduit à la fondation de Kadima."
    events:
      - kind: neutral
        date: "2005-08-15"
        text: { he: "תוכנית ההתנתקות — פינוי כל היישובים מרצועת עזה.", en: "The Disengagement — evacuation of all settlements from the Gaza Strip.", ar: "خطة فك الارتباط — إخلاء جميع المستوطنات من قطاع غزة.", ru: "Размежевание — эвакуация всех поселений из сектора Газа.", es: "La Desconexión — evacuación de todos los asentamientos de la Franja de Gaza.", fr: "Le désengagement — évacuation de toutes les implantations de la bande de Gaza." }
    ended: { he: "שרון פיזר את הכנסת ועזב להקים את קדימה; לאחר מכן לקה בשבץ — בחירות 2006.", en: "Sharon dissolved the Knesset and left to found Kadima; he then suffered a stroke — 2006 election.", ar: "حلّ شارون الكنيست وغادر لتأسيس كاديما؛ ثم أُصيب بجلطة دماغية — انتخابات 2006.", ru: "Шарон распустил Кнессет и ушёл, чтобы создать «Кадиму»; затем он перенёс инсульт — выборы 2006 года.", es: "Sharon disolvió la Knéset y se marchó para fundar Kadima; después sufrió un derrame cerebral — elecciones de 2006.", fr: "Sharon a dissous la Knesset et est parti fonder Kadima ; il a ensuite été victime d’une attaque cérébrale — élection de 2006." }
    sources:
      - { url: "https://main.knesset.gov.il/en/about/history/Pages/KnessetHistory.aspx?kns=16", title: "16th Knesset: results of the elections (28 January 2003) and its governments", publisher: "הכנסת" }
      - { url: "https://en.idi.org.il/israeli-elections-and-parties/elections/2003/", title: "Elections for the 16th Knesset (28.1.2003): results and voter turnout", publisher: "המכון הישראלי לדמוקרטיה" }
  - knesset: 15
    date: "1999-05-17"
    turnout: 78.7
    winner: { he: "ישראל אחת (העבודה)", en: "One Israel (Labor)", ar: "إسرائيل واحدة (العمل)", ru: "«Единый Израиль» («Авода»)", es: "Un Israel (Laborista)", fr: "Un seul Israël (Travailliste)" }
    winnerSeats: 26
    pm: { he: "אהוד ברק", en: "Ehud Barak", ar: "إيهود باراك", ru: "Эхуд Барак", es: "Ehud Barak", fr: "Ehud Barak" }
    summary:
      he: "ברק נבחר בבחירה ישירה והוביל מהלך מדיני נרחב, אך שיחות השלום קרסו ופרצה האינתיפאדה השנייה."
      en: "Barak was elected directly and pursued an ambitious peace push, but the talks collapsed and the Second Intifada erupted."
      ar: "انتُخب باراك بالانتخاب المباشر وقاد مسعى سياسيًا واسعًا للسلام، لكن المحادثات انهارت واندلعت الانتفاضة الثانية."
      ru: "Барак был избран прямым голосованием и предпринял масштабную мирную инициативу, но переговоры провалились и вспыхнула Вторая интифада."
      es: "Barak fue elegido directamente e impulsó una ambiciosa apuesta por la paz, pero las conversaciones fracasaron y estalló la Segunda Intifada."
      fr: "Barak a été élu au suffrage direct et a mené une ambitieuse initiative de paix, mais les pourparlers ont échoué et la Seconde Intifada a éclaté."
    events:
      - kind: neutral
        date: "2000-05-24"
        text: { he: "נסיגת צה\"ל מדרום לבנון.", en: "The IDF's withdrawal from southern Lebanon.", ar: "انسحاب الجيش الإسرائيلي من جنوب لبنان.", ru: "Вывод ЦАХАЛа из Южного Ливана.", es: "La retirada del ejército israelí del sur del Líbano.", fr: "Le retrait de l’armée israélienne du Sud-Liban." }
      - kind: neutral
        date: "2000-07-25"
        text: { he: "כישלון שיחות קמפ דייוויד.", en: "The collapse of the Camp David talks.", ar: "فشل محادثات كامب ديفيد.", ru: "Провал переговоров в Кэмп-Дэвиде.", es: "El fracaso de las conversaciones de Camp David.", fr: "L’échec des pourparlers de Camp David." }
      - kind: bad
        date: "2000-09-28"
        text: { he: "פרוץ האינתיפאדה השנייה.", en: "The outbreak of the Second Intifada.", ar: "اندلاع الانتفاضة الثانية.", ru: "Начало Второй интифады.", es: "El estallido de la Segunda Intifada.", fr: "Le déclenchement de la Seconde Intifada." }
    ended: { he: "ברק התפטר, ובבחירה מיוחדת לראשות הממשלה ב-2001 ניצח שרון. ב-2002 פיזר ראש הממשלה שרון את הכנסת — בחירות מוקדמות בינואר 2003.", en: "Barak resigned, and Sharon won a special election for prime minister in 2001. In 2002 Prime Minister Sharon dissolved the Knesset — early elections in January 2003.", ar: "استقال باراك، وفاز شارون في انتخابات خاصة لرئاسة الحكومة عام 2001. وفي 2002 حلّ رئيس الحكومة شارون الكنيست — انتخابات مبكرة في كانون الثاني/يناير 2003.", ru: "Барак ушёл в отставку, и в 2001 году Шарон победил на специальных выборах премьер-министра. В 2002 году премьер-министр Шарон распустил Кнессет — досрочные выборы в январе 2003 года.", es: "Barak dimitió y Sharon ganó en 2001 una elección especial para primer ministro. En 2002 el primer ministro Sharon disolvió la Knéset — elecciones anticipadas en enero de 2003.", fr: "Barak a démissionné, et Sharon a remporté en 2001 une élection spéciale au poste de Premier ministre. En 2002, le Premier ministre Sharon a dissous la Knesset — élections anticipées en janvier 2003." }
    sources:
      - { url: "https://main.knesset.gov.il/en/about/history/Pages/KnessetHistory.aspx?kns=15", title: "15th Knesset: results of the elections (17 May 1999) and its governments", publisher: "הכנסת" }
      - { url: "https://www.gov.il/apps/elections/elections-knesset-19/heb/history/PercentVotes.html", title: "אחוז המצביעים בבחירות קודמות, הכנסת ה-1 עד ה-18 (אתר ועדת הבחירות המרכזית לכנסת ה-19)", publisher: "ועדת הבחירות המרכזית (gov.il)" }
      - { url: "https://en.idi.org.il/articles/38887", title: "Dissolving the Knesset: A Historical Survey (Chen Friedberg and Assaf Shapira, 18 May 2022)", publisher: "המכון הישראלי לדמוקרטיה" }
      - { url: "https://en.idi.org.il/israeli-elections-and-parties/elections/1999/", title: "About the 1999 Elections", publisher: "המכון הישראלי לדמוקרטיה" }
      - { url: "https://en.idi.org.il/israeli-elections-and-parties/elections/2003/", title: "About the 2003 Elections", publisher: "המכון הישראלי לדמוקרטיה" }
  - knesset: 14
    date: "1996-05-29"
    turnout: 79.3
    winner: { he: "העבודה", en: "Labor", ar: "العمل", ru: "«Авода»", es: "Partido Laborista", fr: "Parti travailliste" }
    winnerSeats: 34
    pm: { he: "בנימין נתניהו", en: "Benjamin Netanyahu", ar: "بنيامين نتنياهو", ru: "Биньямин Нетаньяху", es: "Benjamín Netanyahu", fr: "Benyamin Netanyahou" }
    note: { he: "הבחירה הישירה הראשונה לראש ממשלה; נתניהו ניצח את פרס.", en: "First direct election for PM; Netanyahu narrowly beat Peres.", ar: "أول انتخاب مباشر لرئاسة الحكومة؛ فاز نتنياهو على بيرس بفارق ضئيل.", ru: "Первые прямые выборы премьер-министра; Нетаньяху с минимальным перевесом победил Переса.", es: "Primera elección directa del primer ministro; Netanyahu venció por poco a Peres.", fr: "Première élection directe du Premier ministre ; Netanyahou a battu Peres de justesse." }
    summary:
      he: "הבחירות הראשונות בשיטת הבחירה הישירה לראש ממשלה. נתניהו ניצח את פרס בהפרש זעום, חודשים לאחר רצח רבין."
      en: "The first elections under the direct-election-for-PM system. Netanyahu narrowly beat Peres, months after Rabin's assassination."
      ar: "أول انتخابات وفق نظام الانتخاب المباشر لرئاسة الحكومة. فاز نتنياهو على بيرس بفارق ضئيل، بعد أشهر من اغتيال رابين."
      ru: "Первые выборы по системе прямого избрания премьер-министра. Нетаньяху с минимальным перевесом победил Переса — через несколько месяцев после убийства Рабина."
      es: "Las primeras elecciones con el sistema de elección directa del primer ministro. Netanyahu venció por poco a Peres, meses después del asesinato de Rabin."
      fr: "Les premières élections sous le système d’élection directe du Premier ministre. Netanyahou a battu Peres de justesse, quelques mois après l’assassinat de Rabin."
    events:
      - kind: neutral
        date: "1997-01-17"
        text: { he: "פרוטוקול חברון — המשך תהליך אוסלו.", en: "The Hebron Protocol — continuing the Oslo process.", ar: "بروتوكول الخليل — استمرار مسار أوسلو.", ru: "Хевронский протокол — продолжение процесса Осло.", es: "El Protocolo de Hebrón — continuación del proceso de Oslo.", fr: "Le protocole de Hébron — poursuite du processus d’Oslo." }
      - kind: neutral
        date: "1998-10-23"
        text: { he: "הסכם ואי (מזכר ואי ריבר) — המשך תהליך אוסלו.", en: "The Wye River Memorandum — continuing the Oslo process.", ar: "مذكرة واي ريفر — استمرار مسار أوسلو.", ru: "Меморандум Уай-Ривер — продолжение процесса Осло.", es: "El Memorando de Wye River — continuación del proceso de Oslo.", fr: "Le mémorandum de Wye River — poursuite du processus d’Oslo." }
    ended: { he: "הכנסת פיזרה את עצמה בחוק שפורסם בינואר 1999 — בחירות מוקדמות במאי 1999.", en: "The Knesset dissolved itself by a law published in January 1999 — early elections in May 1999.", ar: "حلّ الكنيست نفسه بقانون نُشر في كانون الثاني/يناير 1999 — انتخابات مبكرة في أيار/مايو 1999.", ru: "Кнессет самораспустился законом, опубликованным в январе 1999 года, — досрочные выборы в мае 1999 года.", es: "La Knéset se disolvió mediante una ley publicada en enero de 1999 — elecciones anticipadas en mayo de 1999.", fr: "La Knesset s’est dissoute par une loi publiée en janvier 1999 — élections anticipées en mai 1999." }
    sources:
      - { url: "https://main.knesset.gov.il/en/about/history/Pages/KnessetHistory.aspx?kns=14", title: "14th Knesset: results of the elections (29 May 1996) and its governments", publisher: "הכנסת" }
