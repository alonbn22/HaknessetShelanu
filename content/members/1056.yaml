    title:
      he: "רקע בשירות ציבורי ודתי בבאר שבע"
      en: "Public and religious service background in Beersheba"
    description:
      he: "לפני כניסתו לכנסת כיהן מרגי כיושב ראש המועצה הדתית בבאר שבע בין השנים 1993 ל-2003, ושימש כמנכ\"ל תנועת ש\"ס החל משנת 2001. הוא נולד ברבאט שבמרוקו ועלה לישראל עם משפחתו ב-1962."
      en: "Before entering the Knesset, Margi chaired the Beersheba religious council from 1993 to 2003 and served as director general of the Shas movement from 2001. He was born in Rabat, Morocco, and immigrated to Israel with his family in 1962."
