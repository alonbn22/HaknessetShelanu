    title:
      he: "ייסדה והובילה ארגונים בתחום הרווחה והשירות הלאומי"
      en: "Founded and led welfare and national-service organizations"
    description:
      he: "בשנת 2014 הקימה וולדיגר את ארגון אמונת\"ך למען משפחות נפגעי תחלואה כפולה (מתמודדי נפש המתמודדים גם עם התמכרויות) ועומדת בראשו, וכן מונתה ב-2017 לראשת עמותת בת עמי לשירות לאומי לבנות הציונות הדתית, ממנה פרשה ב-2021 לקראת ריצתה לכנסת."
      en: "In 2014 Waldiger founded and now heads Emunatech, an organization for families of people coping with dual diagnosis (mental-health challenges alongside addiction). In 2017 she was appointed head of Bat Ami, a national-service organization for religious-Zionist young women, which she left in 2021 ahead of her Knesset candidacy."
