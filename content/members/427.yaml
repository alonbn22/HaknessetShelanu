    title:
      he: "הועמד לדין בחשד למרמה והפרת אמונים — וזוכה פה אחד (2013)"
      en: "Tried for fraud and breach of trust — unanimously acquitted (2013)"
    date: "2013-11-06"
    description:
      he: "הואשם במרמה והפרת אמונים בפרשת קידום מינויו של זאב בן-אריה לשגריר בלטביה. ב-6 בנובמבר 2013 זיכה אותו בית משפט השלום בירושלים פה אחד, בהרכב של שלושה שופטים, לאחר שקבע כי לא הוכח ניגוד עניינים בחומרה המצדיקה הרשעה. היועץ המשפטי לממשלה החליט בדצמבר 2013 שלא לערער על הזיכוי."
      en: "Charged with fraud and breach of trust over the promotion of Ze'ev Ben Aryeh's appointment as ambassador to Latvia. On 6 November 2013 a three-judge panel of the Jerusalem Magistrate's Court unanimously acquitted him, finding no proof of a conflict of interest severe enough to warrant a conviction. In December 2013 the Attorney General decided not to appeal."
