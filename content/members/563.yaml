    title:
      he: שלל תמיכה חרדית בממשלה בראשות גדי איזנקוט
      en: Ruled out Haredi support for a government led by Gadi Eisenkot
    description:
      he: בראיון שפורסם ב-17 בספטמבר 2026 שלל פרוש תמיכה של הסיעות החרדיות בממשלה בראשות גדי איזנקוט, ואמר, בהסתמך על דברי הרבי מליובאוויטש, כי "אסור לתמוך במפלגה שמנהלת משא ומתן עם הערבים על החזרת שטחים מארצנו הקדושה".
      en: In remarks published on 17 September 2026, Porush ruled out Haredi-faction support for a government led by Gadi Eisenkot, saying, citing the Lubavitcher Rebbe, that "one must not support a party that negotiates with the Arabs over returning territories of our holy land."
