    title:
      he: אושפז לאחר אירוע לב ושוחרר להחלמה בביתו
      en: Hospitalized after a heart attack and discharged to recover at home
    description:
      he: אמסלם לקה בהתקף לב בשבת, 13 ביוני 2026, אושפז במרכז הרפואי שערי צדק בירושלים ושוחרר ב-16 ביוני. לשכתו מסרה כי הוא במצב טוב וממשיך לנהל את פעילות משרדו מביתו.
      en: Amsalem suffered a heart attack on Saturday 13 June 2026, was treated at Shaare Zedek Medical Center in Jerusalem and discharged on 16 June. His office said he was in good condition and continued to run his ministry from home.
