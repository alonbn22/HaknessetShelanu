claims:
  - kind: positive
    category: achievement
    title:
      he: כיהן כשר הכלכלה, שר החוץ ושר האנרגיה
      en: Served as Minister of Economy, Foreign Affairs, and Energy
    description:
      he: "אלי כהן, רואה חשבון ואיש עסקים מחולון שכיהן כקצין בחיל האוויר, נכנס לכנסת ב-2015 ומילא שורה של תפקידי שר בכירים: שר הכלכלה והתעשייה (2017–2020), שר המודיעין (2020–2021), שר החוץ (דצמבר 2022 עד ינואר 2024) ושר האנרגיה והתשתיות (מ-1 בינואר 2024 ואילך; ממשלת מעבר מאז פיזור הכנסת ה-25 ביולי 2026)."
      en: "Eli Cohen, an accountant and businessman from Holon who served as an officer in the Israeli Air Force, entered the Knesset in 2015 and has held a series of senior cabinet posts: Minister of Economy and Industry (2017–2020), Minister of Intelligence (2020–2021), Minister of Foreign Affairs (December 2022 to January 2024), and Minister of Energy and Infrastructure (since 1 January 2024; a caretaker government since the 25th Knesset dispersed in July 2026)."
    date: 2024-01-01
    sources:
