  - id: public-broadcasting
    topic: institutions
    lean: right
    text:
      he: "יש להפריט או לסגור את תאגיד השידור הציבורי (כאן)."
      en: "The public broadcaster (Kan) should be privatized or closed."
      ar: "يجب خصخصة هيئة البث العامة (كان) أو إغلاقها."
      ru: "Общественную вещательную корпорацию («Кан») следует приватизировать или закрыть."
      es: "La corporación pública de radiodifusión (Kan) debería privatizarse o cerrarse."
      fr: "L’audiovisuel public (Kan) devrait être privatisé ou fermé."
    short:
      he: "הפרטת השידור הציבורי"
      en: "Privatizing public broadcasting"
      ar: "خصخصة البث العام"
      ru: "Приватизация общественного вещания"
      es: "Privatizar la radiotelevisión pública"
      fr: "Privatiser l’audiovisuel public"
    explainer:
      he: "תאגיד השידור 'כאן' ממומן מתקציב המדינה ומשדר טלוויזיה, רדיו וחדשות. התומכים בהפרטה אומרים שאין סיבה שהמדינה תממן תקשורת שמתחרה בשוק, ושהתאגיד מוטה; המתנגדים אומרים ששידור ציבורי עצמאי הוא חלק מדמוקרטיה, ושסגירתו נועדה להשתיק ביקורת. הצעות חוק להפרטה ולסגירה עלו מ-2023 ולא הושלמו."
      en: "The 'Kan' broadcasting corporation is funded from the state budget and broadcasts television, radio and news. Supporters of privatization say there is no reason for the state to fund media that competes in the market, and that the corporation is biased; opponents say independent public broadcasting is part of democracy and that closing it is meant to silence criticism. Bills to privatize or close it have come up since 2023 and were not completed."
      ar: "تُموَّل هيئة البث «كان» من ميزانية الدولة وتبث التلفزيون والراديو والأخبار. يقول مؤيدو الخصخصة إنه لا سبب لأن تموّل الدولة إعلامًا ينافس في السوق، وإن الهيئة منحازة؛ ويقول المعارضون إن البث العام المستقل جزء من الديمقراطية وإن إغلاقه يهدف إلى إسكات النقد. طُرحت مشاريع قوانين لخصخصته أو إغلاقه منذ 2023 ولم تُستكمل."
      ru: "Вещательная корпорация «Кан» финансируется из госбюджета и ведёт теле-, радио- и новостное вещание. Сторонники приватизации говорят, что государству незачем финансировать СМИ, конкурирующие на рынке, и что корпорация предвзята; противники — что независимое общественное вещание — часть демократии, а его закрытие призвано заглушить критику. Законопроекты о приватизации или закрытии выдвигались с 2023 года и не были доведены до конца."
      es: "La corporación de radiodifusión «Kan» se financia con el presupuesto del Estado y emite televisión, radio y noticias. Quienes apoyan la privatización dicen que no hay razón para que el Estado financie medios que compiten en el mercado, y que la corporación es sesgada; los opositores dicen que una radiodifusión pública independiente es parte de la democracia y que cerrarla busca silenciar la crítica. Desde 2023 se han presentado proyectos para privatizarla o cerrarla que no se completaron."
      fr: "La société de diffusion « Kan » est financée par le budget de l’État et diffuse télévision, radio et informations. Les partisans de la privatisation disent que l’État n’a aucune raison de financer des médias qui concurrencent le marché, et que la société est partiale ; les opposants disent qu’un audiovisuel public indépendant fait partie de la démocratie et que le fermer vise à faire taire la critique. Des projets de loi de privatisation ou de fermeture ont été déposés depuis 2023 sans aboutir."
