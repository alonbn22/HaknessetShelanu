    title:
      he: בג"ץ פסל פה אחד את בחירת מבקר המדינה שניהל אוחנה, בשל הפרת חשאיות ההצבעה
      en: The State Comptroller election he presided over was unanimously annulled by the HCJ justices, citing breaches of ballot secrecy
    description:
      he: 'בהצבעה לבחירת מבקר המדינה ב-3 ביוני 2026 עצר אוחנה את הסיבוב השני והתחילו מחדש לאחר בקשות של חברי כנסת מהליכוד לצלם את פתק ההצבעה, אך הבהיר כי חבר כנסת רשאי לצלם את עצמו. לפחות שישה חברי כנסת תיעדו את הצבעתם, ומיכאל ראבילו נבחר ברוב של 61 מול 57. ב-2 ביולי 2026 פסל בג"ץ פה אחד את הבחירה והורה על הצבעה חוזרת; המשנה לנשיא נעם סולברג כתב כי "נפל פגם יסודי" בחשאיות ההצבעה וכי קיימת "אפשרות ממשית" שההפרות השפיעו על התוצאה. לפי ynet, אוחנה וסביבת ראש הממשלה קיימו התייעצויות בשאלת יישום פסק הדין, ואוחנה לא הודיע מיד כיצד ינהג.'
      en: 'In the 3 June 2026 vote to elect the State Comptroller, Ohana halted and restarted the second round after Likud MKs asked to photograph their ballots, while clarifying that an MK may film themselves. At least six MKs recorded their votes, and Michael Rabello was elected 61–57. On 2 July 2026 the High Court unanimously annulled the election and ordered a new vote; Deputy President Noam Sohlberg wrote that a "fundamental flaw" had occurred regarding ballot secrecy and that there was a "real possibility" the violations affected the outcome. According to Ynet, Ohana and the Prime Minister''s circle held consultations on implementing the ruling, and Ohana did not immediately say how he would act.'
