  - kind: positive
    category: achievement
    title:
      he: יושב-ראש ועדת הבריאות של הכנסת
      en: Chairman of the Knesset Health Committee
    description:
      he: >-
        ב-12 באוקטובר 2023 מונה מישרקי ליושב-ראש ועדת הבריאות של הכנסת, לאחר שאוריאל
        בוסו מונה לשר הבריאות. ב-23 באוקטובר 2025 הגיש את התפטרותו מהתפקיד ליושב-ראש
        הכנסת, כשש"ס פרשה מכל תפקידיה הקואליציוניים בשל העיכוב בחקיקת חוק הגיוס;
        במקומו כיהנה לימור סון הר-מלך. ב-23 בפברואר 2026 אישרה הוועדה את שובו
        לתפקיד יושב-ראש הוועדה, ובו הוא מכהן גם לאחר פיזור הכנסת.
      en: >-
        On 12 October 2023 Mishriki was appointed chairman of the Knesset Health
        Committee, after Uriel Buso became Health Minister. On 23 October 2025 he
        submitted his resignation from the post to the Knesset Speaker when Shas
        withdrew from all its coalition roles over the delay in the yeshiva-draft
        legislation; Limor Son Har-Melech chaired in the interim. On 23 February
        2026 the committee approved his return as chairman, a post he still holds
        after the Knesset's dissolution.
    date: "2023-10-12"
