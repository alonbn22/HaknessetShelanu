    title:
      he: נחקר בחשד להסטת כספי חינוך ציבוריים למימון עיתון 'הדרך'; התיק הועבר לפרקליטות (2026)
      en: Under criminal investigation over alleged diversion of public education funds to the 'HaDerech' newspaper; file transferred to prosecutors (2026)
      ar: قيد التحقيق الجنائي بشبهة تحويل أموال تعليم عامة لتمويل صحيفة 'هادرَّخ'؛ أُحيل الملف إلى النيابة (2026)
      ru: Под уголовным расследованием по подозрению в перенаправлении государственных средств на образование для финансирования газеты «Га-Дерех»; дело передано в прокуратуру (2026)
    description:
      he: משטרת ישראל פתחה באוקטובר 2024 בחקירה נגד חיים ביטון ואחרים בחשד שכספי ציבור שיועדו לחינוך ברשת 'מעיין החינוך התורני' של ש"ס הופנו למימון מוסף ילדים בעיתון 'הדרך', בתקופה שבה כיהן כמנכ"ל הרשת. במרץ 2025 עברה החקירה לשלב גלוי, ביטון זומן לחקירה וארבעה חשודים עוכבו; ב-12 ביולי 2026 נחקר שוב באזהרה בלהב 433. ב-5 באוגוסט 2026 הודיעה המשטרה כי החקירה הושלמה וכי התיק הועבר לפרקליטות מיסוי וכלכלה להכרעה בשאלת הגשת כתב אישום, בחשד לעבירות קבלת דבר במרמה, מרמה והפרת אמונים, רישום כוזב במסמכי תאגיד והלבנת הון. נכון ל-18 בספטמבר 2026 לא דווח על הגשת כתב אישום או על סגירת התיק; בדיווחים שצוטטו לא הובאה תגובה מטעם ביטון. חלה חזקת החפות.
      en: "In October 2024, Israel Police opened an investigation into Haim Biton and others on suspicion that public funds earmarked for education in the Shas-affiliated 'Ma'ayan HaChinuch HaTorani' school network were diverted to finance a children's supplement in the 'HaDerech' newspaper during the period he headed the network. In March 2025 the probe moved to an overt phase: Biton was summoned for questioning and four suspects were detained; on 12 July 2026 he was questioned under caution again at Lahav 433. On 5 August 2026 police announced that the investigation was complete and the file had been transferred to the Taxation and Economics Prosecution to decide whether to file an indictment, on suspicion of obtaining by fraud, fraud and breach of trust, false corporate records, and money laundering. As of 18 September 2026 no indictment or closure of the case had been reported; the cited reports did not carry a response from Biton. The presumption of innocence applies."
