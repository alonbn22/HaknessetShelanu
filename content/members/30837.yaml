  - kind: positive
    category: achievement
    title:
      he: "פעילות למען תושבי שדרות ועוטף עזה"
      en: "Advocacy for residents of Sderot and the Gaza border communities"
    description:
      he: "כתושבת שדרות, קידמה ביטון הצעת חוק להקמת חדר מיון ממוגן בעיר, בעלות כוללת של 20 מיליון ש\"ח, ומתחה ביקורת על דחיית ההצעה בקריאה טרומית ברוב של 51 מול 42 ב-31 במאי 2023, כשבועיים לאחר מבצע 'מגן וחץ'. בכנסת היא עומדת בראש שדולות בנושאי קטינים בסיכון, זכויות נפגעי עבירה ופיתוח הנגב ויישובי עוטף עזה."
      en: "As a Sderot resident, Biton promoted a bill to build a fortified emergency room in the city at a total cost of NIS 20 million, and criticized the coalition when it rejected the bill in a preliminary reading by 51 votes to 42 on 31 May 2023, roughly two weeks after Operation Shield and Arrow. In the Knesset she chairs caucuses on at-risk minors, crime victims' rights, and development of the Negev and Gaza border communities."
    date: "2023-05-31"
