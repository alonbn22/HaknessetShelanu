    title:
      he: "הודיעה על פרישה מהחיים הפוליטיים בתום כהונת הכנסת ה-25"
      en: "Announced she will leave politics at the end of the 25th Knesset"
    description:
      he: "ב-7 בדצמבר 2023 הודיעה מיכאלי, אז יו\"ר מפלגת העבודה, כי לא תתמודד בפריימריז לראשות המפלגה ולא תתמודד על מקום ברשימה לכנסת הבאה, וכי תסיים את חייה הפוליטיים בתום כהונתה בכנסת ה-25. בהתאם לכך היא אינה מתמודדת בבחירות 27 באוקטובר 2026."
      en: "On 7 December 2023 Michaeli, then chair of the Labor party, announced that she would not run in the party leadership primary nor for a place on the list for the next Knesset, and that she would retire from political life at the end of her term in the 25th Knesset. Accordingly she is not a candidate in the 27 October 2026 election."
