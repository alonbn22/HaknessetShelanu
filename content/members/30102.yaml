    description:
      he: התנועה לאיכות השלטון העניקה לבן ארי את אות אבירת איכות השלטון לשנת 2025
        בקטגוריית הרשות המחוקקת, "בהוקרה על פעילותה הפרלמנטרית למען אזרחי
