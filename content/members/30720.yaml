    title:
      he: "מחברי הכנסת הגאים הראשונים בישראל"
      en: "Among Israel's openly gay Knesset members"
    description:
      he: "יוראי להב-הרצנו, חבר כנסת מטעם יש עתיד, הצהיר בגלוי על היותו גאה, ועם השבעתו ביוני 2020 הפך לחבר הכנסת הגאי השישי בתולדות הכנסת. הוא הכריז על מחויבותו לקדם שוויון זכויות לקהילה הגאה."
      en: "Yorai Lahav-Hertzanu, a Yesh Atid lawmaker, is openly gay. When he was sworn in in June 2020 he became the sixth openly gay member in the history of the Knesset, publicly affirming his identity and pledging to advance equal rights for the LGBTQ+ community."
    date: "2020-06-19"
    sources:
