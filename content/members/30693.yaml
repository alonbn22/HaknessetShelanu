    description:
      he: "איתן גינזבורג שירת בצה\"ל בחיל המשטרה הצבאית והשתחרר בדרגת רב-סרן ב-1999. הוא בעל תואר ראשון במשפטים ובממשל מהמרכז הבינתחומי הרצליה (אוניברסיטת רייכמן) ותואר שני במדע המדינה מאוניברסיטת תל אביב, וכיהן שנים רבות כחבר מועצת העיר וסגן ראש עיריית רעננה."
      en: "Eitan Ginzburg served in the IDF Military Police Corps and was discharged with the rank of major in 1999. He holds an LLB in law and a BA in government from the Interdisciplinary Center Herzliya (Reichman University) and an MA in political science from Tel Aviv University, and served for many years as a Ra'anana city council member and deputy mayor."
