    title:
      he: "מנכ\"לית \"החצר הנשית\" ויועצת לראש הממשלה בתחום מוגבלויות"
      en: "CEO of \"The Women's Courtyard\" and adviser to the Prime Minister on disabilities"
    description:
      he: "עזוז כיהנה כמנכ\"לית עמותת \"החצר הנשית\", המפעילה בתים חמים לנערות וצעירות בסיכון (החל מ-2021), ובעבר ניהלה את אגף קידום הזכויות ואת חטיבת הקהילה בעמותת אלו\"ט (לילדים ובוגרים עם אוטיזם). לאחר שיאיר לפיד נעשה לראש הממשלה ב-2022, מונתה ליועצת בתחום אנשים עם מוגבלות."
      en: "Azuz served as CEO of \"The Women's Courtyard,\" a nonprofit running drop-in homes for at-risk girls and young women (from 2021), and previously led the rights-advancement department and the community division at ALUT (the national association for children and adults with autism). After Yair Lapid became Prime Minister in 2022, she was appointed his adviser on people with disabilities."
