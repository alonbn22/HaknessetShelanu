    title:
      he: ראש המועצה האזורית יואב במשך כעשור
      en: Head of Yoav Regional Council for over a decade
    description:
      he: נבחרה לראשות המועצה האזורית יואב במאי 2011 ברוב של כ-54%, ונבחרה שוב ללא
        מתמודד בבחירות אוקטובר 2018. כיהנה בתפקיד עד היבחרה לכנסת ב-2022.
      en: Elected head of the Yoav Regional Council in May 2011 with about 54% of the
        vote, and re-elected unopposed in the October 2018 municipal elections.
        She served in the role until her election to the Knesset in 2022.
    date: 2011-05
