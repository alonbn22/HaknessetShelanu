        title: Eli Cohen (politician, born 1972)
        publisher: Wikipedia
  - kind: negative
    category: investigation
    status: ongoing
    date: 2026-06-17
    title:
      he: חקירה בפרשת הדרכונים הדיפלומטיים
      en: Investigation in the diplomatic passports affair
      ar: تحقيق في قضية جوازات السفر الدبلوماسية
      ru: Расследование по делу о дипломатических паспортах
    description:
      he: אלי כהן נחקר בחשד להפרת אמונים בקשר להנפקת דרכונים דיפלומטיים בתקופת כהונתו כשר החוץ. ב-17 ביוני 2026 הודיעה המשטרה שסיימה את החקירה וכי לעמדתה קיימת תשתית ראייתית להעמדתו לדין, והתיק הועבר לפרקליטות; נכון ל-5 ביולי 2026 טרם הוגש כתב אישום וההחלטה מצויה בידי הפרקליטות. כהן מכחיש עבירה ומסר כי הכל נעשה בהתאם לנהלים וכי הוא בטוח שהצדק יצא לאור.
      en: Eli Cohen was questioned on suspicion of breach of trust over the issuance of diplomatic passports during his tenure as foreign minister. On 17 June 2026 Israel Police announced they had completed the investigation and that, in their view, there was an evidentiary basis to charge him; the file was transferred to the state prosecution. As of 5 July 2026 no indictment had been filed and the decision rests with the prosecution. Cohen denies wrongdoing, saying everything was done in accordance with procedures and that he is confident justice will prevail.
      ar: تم استجواب إيلي كوهين للاشتباه في خيانة الأمانة بشأن إصدار جوازات سفر دبلوماسية خلال فترة توليه منصب وزير الخارجية. في 17 يونيو 2026 أعلنت الشرطة أنها أنهت التحقيق وأن هناك أساسًا ثبوتيًا لاتهامه، وأُحيل الملف إلى النيابة. حتى 5 يوليو 2026 لم تُقدم لائحة اتهام والقرار بيد النيابة. ينفي كوهين ارتكاب أي مخالفة ويقول إن كل شيء تم وفق الإجراءات.
      ru: Эли Коэн был допрошен по подозрению в злоупотреблении доверием в связи с выдачей дипломатических паспортов в период его работы министром иностранных дел. 17 июня 2026 года полиция заявила о завершении расследования и о наличии доказательной базы для предъявления обвинения; дело передано в прокуратуру. По состоянию на 5 июля 2026 года обвинительное заключение не предъявлено. Коэн отрицает вину, заявляя, что всё было сделано в соответствии с процедурами.
    sources:
