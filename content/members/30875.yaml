claims:
  - kind: positive
    category: achievement
    title:
      he: המנהלת הראשונה של רשת א' של קול ישראל
      en: First woman and Ethiopian immigrant to direct Reshet Aleph
    description:
      he: >-
        צגה מלקו, עיתונאית וסופרת ילידת גונדר שעלתה לישראל ב-1984, מונתה בשנת 2008
        למנהלת רשת א' של קול ישראל, והייתה האישה הראשונה והעולה הראשונה מאתיופיה
        לכהן בתפקיד זה. קודם לכן ניהלה את מחלקת השידורים באמהרית והגישה תוכניות
        רדיו וטלוויזיה באמהרית.
      en: >-
        Tsega Melaku, a journalist and author born in Gondar who immigrated to Israel
        in 1984, became director of Kol Yisrael's Reshet Aleph (Network A) radio
        station in 2008, the first woman and first Ethiopian immigrant to hold the
        post. She had earlier headed the Amharic broadcasting department and
        presented radio and television programmes in Amharic.
    date: "2008"
    sources:
      - url: https://en.wikipedia.org/wiki/Tsega_Melaku
        title: Tsega Melaku
        publisher: Wikipedia
      - url: https://he.wikipedia.org/wiki/%D7%A6%D7%92%D7%94_%D7%9E%D7%9C%D7%A7%D7%95
