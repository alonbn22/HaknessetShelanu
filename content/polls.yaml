    institute: { he: "מאגר מוחות", en: "Maagar Mochot", ar: "مأغار موحوت", ru: "«Маагар Мохот»", es: "Maagar Mochot", fr: "Maagar Mochot" }
    url: "https://www.gov.il/BlobFolder/dynamiccollectorresultitem/knesset_election62/he/Survey_4134.pdf"
    reason:
      he: "הדיווח של המכון לוועדת הבחירות המרכזית (מס' 4134) קובע שביצוע הסקר החל לפני השלמת הגשת הרשימות, ולכן אינו מקיף את כל הרשימות החדשות — הוא אינו בר השוואה לסקרים כאן. (הקישור לשידור הערוץ הוסר מאתרו.)"
      en: "The institute's filing with the Central Elections Committee (no. 4134) says the survey began before the list submission was complete, so it does not cover all the new lists — it is not comparable with the polls here. (The channel's broadcast link has been removed from its site.)"
      ar: "يذكر تقرير المعهد إلى لجنة الانتخابات المركزية (رقم 4134) أن الاستطلاع بدأ قبل اكتمال تقديم القوائم، ولذلك لا يشمل كل القوائم الجديدة — فهو غير قابل للمقارنة مع الاستطلاعات هنا. (أُزيل رابط بث القناة من موقعها.)"
      ru: "В отчёте института в Центральную избирательную комиссию (№ 4134) сказано, что опрос начался до завершения подачи списков и поэтому не охватывает все новые списки — он несопоставим с опросами здесь. (Ссылка на эфир канала удалена с его сайта.)"
      es: "El informe del instituto al Comité Central de Elecciones (n.º 4134) indica que la encuesta comenzó antes de completarse la presentación de listas, por lo que no abarca todas las listas nuevas: no es comparable con las encuestas de aquí. (El enlace a la emisión del canal se retiró de su sitio.)"
      fr: "La déclaration de l’institut au Comité central des élections (n° 4134) indique que le sondage a commencé avant la fin du dépôt des listes et ne couvre donc pas toutes les nouvelles listes — il n’est pas comparable aux sondages présentés ici. (Le lien vers l’émission de la chaîne a été retiré de son site.)"
  - published: "2026-09-24"
