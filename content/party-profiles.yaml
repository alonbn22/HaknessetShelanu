      - date: "2026-08-17"
        text:
          he: "בפריימריז של הליכוד (76,068 מצביעים, 53.5% הצבעה) זכה אלי כהן במקום הראשון, אחריו אמיר אוחנה, יריב לוין, מירי רגב ואופיר כץ; ב-26 באוגוסט דווח על מחלוקת סביב ספירה חוזרת במקום ה-25 (גילה גמליאל / אתי עטייה)."
          en: "In the Likud primary (76,068 voters, 53.5% turnout) Eli Cohen finished first, followed by Amir Ohana, Yariv Levin, Miri Regev and Ofir Katz; on 26 August a dispute over a recount affecting the 25th slot (Gila Gamliel / Etty Atia) was reported."
          ar: "في الانتخابات التمهيدية لليكود (76,068 مقترعًا، ونسبة تصويت 53.5%) حلّ إيلي كوهين أولًا، يليه أمير أوحانا وياريف ليفين وميري ريغيف وأوفير كاتس؛ وفي 26 آب/أغسطس أُفيد بخلاف حول إعادة فرز تتعلق بالموقع الـ25 (غيلا غمليئيل / إيتي عطية)."
          ru: "На праймериз Ликуда (76 068 голосовавших, явка 53,5%) первое место занял Эли Коэн, за ним — Амир Охана, Ярив Левин, Мири Регев и Офир Кац; 26 августа сообщалось о споре вокруг пересчёта голосов за 25-е место (Гила Гамлиэль / Этти Атия)."
          es: "En las primarias del Likud (76 068 votantes, 53,5 % de participación) Eli Cohen quedó primero, seguido de Amir Ohana, Yariv Levin, Miri Regev y Ofir Katz; el 26 de agosto se informó de una disputa por un recuento que afectaba al puesto 25 (Gila Gamliel / Etty Atia)."
          fr: "À la primaire du Likoud (76 068 votants, 53,5 % de participation), Eli Cohen est arrivé premier, suivi d’Amir Ohana, Yariv Levin, Miri Regev et Ofir Katz ; le 26 août, un différend sur un recomptage concernant la 25e place (Gila Gamliel / Etty Atia) a été rapporté."
        sources:
