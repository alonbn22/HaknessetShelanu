  - kind: positive
    category: achievement
    title:
      he: האישה הראשונה בראש סיעה מכהנת במועצת עיריית באר שבע
      en: First woman to head a serving faction on Beersheba city council
    description:
      he: פרידמן כיהנה כחברת מועצת עיריית באר שבע משנת 2013 (תחילה בסיעת 'אור'),
        ולקראת בחירות 2018 הקימה את סיעת 'קהילה' והייתה לאישה הראשונה בבאר שבע
        שעומדת בראש סיעה המכהנת במועצת העיר. במועצה עמדה בראש הוועדה לאיכות
        הסביבה ולבעלי חיים ויזמה את הקמת המרפאה העירונית הראשונה בישראל לחיות
        רחוב.
      en: Fridman served on the Beersheba city council from 2013 (initially with the
        'Or' faction). Ahead of the 2018 elections she founded the 'Kehila'
        faction and became the first woman in Beersheba to head a serving
        faction on the city council. On the council she chaired the committee
        for environmental quality and animal welfare and initiated the
        establishment of Israel's first municipal clinic for street animals.
    date: "2018"
    sources:
