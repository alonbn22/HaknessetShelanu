    title:
      he: חברת כנסת מטעם ישראל ביתנו, עורכת דין
      en: Member of Knesset for Yisrael Beiteinu and a lawyer
    description:
      he: יוליה מלינובסקי, ילידת לוהנסק שבאוקראינה (1975) שעלתה לישראל ב-1998, היא
        עורכת דין בהשכלתה (תואר במשפטים מאוניברסיטת דאל במזרח אוקראינה) ושירתה
        כקצינת כוח אדם בכוח משטרה מקומי באוקראינה. היא נכנסה לכנסת לראשונה ב-1
        ביוני 2016 כחברת כנסת מטעם מפלגת ישראל ביתנו, כשהחליפה את אביגדור ליברמן
        מכוח 'החוק הנורווגי' עם מינויו לשר הביטחון, ומאז כיהנה במספר כנסות.
      en: Yulia (Julia) Malinovsky, born in Luhansk, Ukraine (1975) and immigrated to
        Israel in 1998, is a lawyer by training (law degree from East Ukrainian
        Volodymyr Dahl National University) who also served as a manpower
        officer in a local police force in Ukraine. She first entered the
        Knesset on 1 June 2016 as a member for the Yisrael Beiteinu party,
        replacing Avigdor Lieberman under the 'Norwegian Law' upon his
        appointment as Defense Minister, and has since served across several
        Knesset terms.
