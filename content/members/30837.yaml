  - kind: positive
    category: achievement
    title:
      he: "חוקים שהתקבלו ביוזמתה: הגנה על עדים קטינים, הגנת תעסוקה לבני משפחות שכולות ותיקון לחוק הירושה"
      en: "Laws passed on her initiative: protecting child witnesses, job protection for bereaved families, and an Inheritance Law amendment"
    description:
      he: "על פי רישומי הכנסת, ביטון הייתה היוזמת הראשונה של שני חוקים שהתקבלו בקריאה שלישית בכנסת ה-25: חוק לתיקון סדרי הדין (חקירת עדים) (תיקון מס' 10), התשפ\"ד–2024, שנועד להקל על ילדים שנפגעו מעבירות מין או התעללות הנדרשים להעיד בהליך אזרחי לפיצויים; וחוק משפחות חיילים שנספו במערכה (תגמולים ושיקום) (תיקון מס' 46), התשפ\"ה–2025, הקובע הגנות מפני פגיעה בתעסוקתו של עובד שהוא בן משפחה של חלל צה\"ל או של נרצח בפעולת איבה. כן נמנתה עם יוזמי חוק הירושה (תיקון מס' 21), התשפ\"ד–2024 (\"הרצחת וגם ירשת\"), שנועד למנוע ממי שגרם למות בן או בת זוגו לרשת אותם ולהגן על הנכסים המשותפים כבר משלב הגשת כתב האישום."
      en: "According to Knesset records, Biton was the lead initiator of two laws passed in their third reading in the 25th Knesset: Amendment 10 to the Rules of Procedure (Examination of Witnesses) Law (2024), intended to ease the position of children harmed by sexual offenses or abuse who must testify in civil compensation proceedings; and Amendment 46 to the Families of Soldiers Who Died in Battle (Benefits and Rehabilitation) Law (2025), which protects the employment of a worker who is a family member of a fallen soldier or of a victim of a hostile act. She was also among the initiators of Amendment 21 to the Inheritance Law (2024), intended to prevent a person who caused the death of their spouse from inheriting from them and to protect the joint assets from the moment an indictment is filed."
    date: "2025-01-30"
