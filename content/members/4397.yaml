    title:
      he: "מכהן כשר במשרד האוצר האחראי על שיקום הצפון והדרום"
      en: "Serves as a minister in the Finance Ministry overseeing rehabilitation of the north and south"
    description:
      he: "ב-8 בנובמבר 2024, במסגרת הצטרפות מפלגתו של גדעון סער (תקווה חדשה) לקואליציה בראשות בנימין נתניהו, מונה זאב אלקין לשר במשרד האוצר. במסגרת תפקידו הוא אחראי על מנהלת תקומה לשיקום יישובי עוטף עזה ועל המנהלת לשיקום הצפון, והוא ממשיך בתפקיד בממשלת המעבר."
      en: "On 8 November 2024, as part of Gideon Sa'ar's party (New Hope) joining Benjamin Netanyahu's coalition, Ze'ev Elkin was appointed a minister within the Finance Ministry. In this role he is responsible for the Tkuma Directorate for rebuilding the Gaza-border communities and the Northern Rehabilitation Directorate, and he continues in the post in the caretaker government."
