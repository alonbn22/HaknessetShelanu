    date: 2025-10-21
    title:
      he: התבטאות נגד ח"כ מירב בן ארי במליאה; איגוד הדירקטורים ביטל את השתתפותו בכנס לאחר שסירב להתנצל
      en: Remarks against MK Meirav Ben-Ari in the plenum; the Directors Association cancelled his conference appearance after he refused to apologize
    description:
      he: באוקטובר 2025, בדיון במליאת הכנסת, אמר אמסלם על ח"כ מירב בן ארי כי היא "מצחצחת נעליים ללפיד" ולעג לה, ובן ארי אמרה כי מדובר בפגיעה בנשים. איגוד הדירקטורים דרש ממנו להתנצל כתנאי להופעתו בכנס האיגוד; לאחר שיועצת השר השיבה כי "לא אחנך את השר" והוא סירב להתנצל, בוטלה השתתפותו.
      en: In October 2025, during a Knesset plenum debate, Amsalem said of MK Meirav Ben-Ari that she was "shining Lapid's shoes" and mocked her, and Ben-Ari said the remarks harmed women. The Directors Association demanded an apology as a condition for his appearance at its conference; after the minister's adviser replied "I will not educate the minister" and he refused to apologize, his participation was cancelled.
    sources:
