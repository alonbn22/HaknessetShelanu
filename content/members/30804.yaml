    title:
      he: נזיפה ושלילת שכר ליומיים מוועדת האתיקה בגין היעדרויות ממליאת הכנסת (2026)
      en: Ethics Committee reprimand and two-day pay deduction over absences from Knesset plenum sessions (2026)
    description:
      he: בהחלטה 51/25 מ-12 במאי 2026 קבעה ועדת האתיקה של הכנסת כי ביטון, בעת שכיהן כשר שאינו חבר כנסת, נעדר במושב השלישי של הכנסת ה-25 מ-7 ישיבות מליאה מעבר למכסה המורחבת החלה על שרים. ביטון השיב כי חלק מההיעדרויות נבע מימי אבל על אחיו וכי עמד בראש משלחת רשמית לפולין; הוועדה הכירה בימי האבל כהסבר סביר אך לא בפעילות ציבורית, וציינה כי חרג מהמכסה גם במושבים הקודמים. הוועדה הטילה עליו נזיפה ושלילת שכר למשך יומיים. מדובר בסנקציה אתית פרלמנטרית ולא בהליך פלילי.
      en: In decision 25/51 of 12 May 2026, the Knesset Ethics Committee found that Biton, while serving as a minister who was not a Knesset member, was absent during the third session of the 25th Knesset from 7 plenum sessions beyond the extended quota that applies to ministers. Biton replied that some absences were due to mourning for his brother and that he had headed an official delegation to Poland; the committee accepted the mourning days as a reasonable explanation but not public activity, and noted he had exceeded the quota in the previous sessions as well. The committee imposed a reprimand and a two-day pay deduction. This was a parliamentary ethics sanction, not a criminal proceeding.
