    title:
      he: קצינה בכירה בצה"ל בדרגת תת-אלוף
      en: Senior IDF officer with the rank of Brigadier General (Tat Aluf)
    description:
      he: ניר התגייסה לצה"ל בשנת 1989 לחיל הקשר (לימים חיל התקשוב), שירתה כשלושים שנה
        עד 2019 והגיעה לדרגת תת-אלוף. בין תפקידיה פיקדה על בית הספר הלאומי
        לתקשוב, סייבר ותקשורת (בה"ד 7) וכיהנה כיועצת הרמטכ"ל לענייני מגדר בשנים
        2016–2019.
      en: Nir enlisted in the IDF in 1989 in the Signal/C4I Corps, served for about
        thirty years until 2019, and rose to the rank of Brigadier General (tat
        aluf). Her roles included commanding the C4I national training base
        (Bahad 7) and serving as the Chief of Staff's advisor on Gender Affairs
        from 2016 to 2019.
