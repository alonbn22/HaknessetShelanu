      he: "פרס \"הגיבור הבלתי מוכר\" על שם מרטין לותר קינג (2016)"
      en: "Martin Luther King \"Unsung Hero Award\" (2016)"
    description:
      he: "בשנת 2016 קיבלה תמנו-שטה את פרס \"הגיבור הבלתי מוכר\" על שם מרטין לותר קינג, על פעילותה למאבק בגזענות ולקידום שילובם של יוצאי אתיופיה, ובכלל זה פעולתה להקמת ועדת פלמור למיגור הגזענות (2015)."
      en: "In 2016 Tamano-Shata received the Martin Luther King \"Unsung Hero Award\" for her work against racism and for the integration of Ethiopian Israelis, including her role in the establishment of the Palmor Committee for the eradication of racism (2015)."
    date: "2016-01-01"
