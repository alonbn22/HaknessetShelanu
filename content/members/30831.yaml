  - kind: positive
    category: achievement
    date: 2022-11
    title:
      he: 'קריירה מוניציפלית בנתניה: מנכ"ל העירייה, סגן וממלא מקום ראש העיר'
      en: "Municipal career in Netanya: municipality CEO, deputy and acting mayor"
      ar: "مسيرة بلدية في نتانيا: مدير عام البلدية ونائب رئيس البلدية والقائم بأعماله"
      ru: "Муниципальная карьера в Нетании: гендиректор мэрии, заместитель и и.о. мэра"
    description:
      he: לפני היבחרו לכנסת ה-25 בבחירות 2022 (מקום 29 ברשימת הליכוד, לאחר שזכה במקום המחוזי בפריימריז) כיהן דלל כמנכ"ל עיריית נתניה והחברה לפיתוח נתניה החל מ-1999, ולאחר מכן כסגן וממלא מקום ראש העיר מרים פיירברג, עם אחריות לתחומי תחבורה, היערכות לחירום, אזורי תעשייה ופיתוח עסקי. ב-2008 היה שותף להקמת רשימה מקומית שזכתה בכשליש ממושבי מועצת העיר.
      en: Before his election to the 25th Knesset in 2022 (29th on the Likud list, via the district slot he won in the party primaries), Dallal served from 1999 as CEO of the Netanya Municipality and the Netanya Development Company, and later as deputy and acting mayor under Miriam Feirberg, responsible for transportation, emergency preparedness, industrial zones and business development. In 2008 he co-founded a local party that won roughly a third of the city council seats.
      ru: До избрания в Кнессет 25-го созыва в 2022 году (29-е место в списке «Ликуда») Далаль с 1999 года был гендиректором мэрии Нетании и городской компании развития, а затем заместителем и исполняющим обязанности мэра Мирьям Фейерберг, отвечая за транспорт, готовность к чрезвычайным ситуациям, промышленные зоны и развитие бизнеса.
