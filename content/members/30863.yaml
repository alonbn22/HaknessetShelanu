  - kind: positive
    category: achievement
    title:
      he: פורצת דרך לנשים בחיל התקשוב
      en: Trailblazer for women in the IDF's C4I Corps
    description:
      he: במהלך שירותה הצבאי הייתה ניר האישה הראשונה שהכשירה קצינים בחיל התקשוב, האישה
        הראשונה שפיקדה על גדוד תקשוב מבצעי, והאישה הראשונה שפיקדה על בית הספר
        הלאומי לתקשוב (בה"ד 7).
      en: During her military service Nir was the first woman to train officers for
        the C4I Corps, the first woman to command an operational communications
        battalion, and the first woman to command the C4I national training base
        (Bahad 7).
