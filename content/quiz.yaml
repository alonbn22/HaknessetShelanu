      democrats:
        value: 1
        basis: statement
        recordOf:
          he: "דברי גלעד קריב, מס׳ 3 ברשימת הדמוקרטים; מצע הדמוקרטים אינו מזכיר מדינה פלסטינית, ויו\"ר הרשימה יאיר גולן אמר בספטמבר 2025 כי \"בעת הזו… לדבר על מדינה פלסטינית זה דבר הרסני\""
