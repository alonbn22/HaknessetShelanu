  - kind: negative
    category: controversy
    title:
      he: "סערה סביב דבריה בוועדת החוקה על הרג ילדים בכפר טמון והשוואה ל\"נוח'בות\" (2026)"
      en: "Controversy over her Constitution Committee remarks on the killing of children in Tammun and a comparison to \"Nukhba\" operatives (2026)"
    description:
      he: "ב-23 במרץ 2026, בדיון בוועדת החוקה, חוק ומשפט לאחר אירוע שבו ירו לוחמי מג\"ב לעבר רכב בכפר טמון ונהרגו בו שני הורים ושני ילדים, אמרה עזוז כי \"נהרגו ילדים בני 5 ו-7 מאש כוחותינו\" וכי הממשלה אינה מסוגלת להביע צער, ושאלה, בהתייחס ל\"קולות שמגיעים מהממשלה\" המצדיקים זאת, \"במה אתם שונים ממחבלי הנוח'בות שקיבלו היתר לרצוח תינוקות יהודים\". יו\"ר הוועדה שמחה רוטמן הגיב בזעם והוציא אותה מהדיון, וארגון \"אמהות הלוחמים\" הגיש תלונה לוועדת האתיקה של הכנסת; לא דווח על החלטה בתלונה. עזוז טענה כי המילה \"רצח\" לא נאמרה, כי לא התייחסה כלל לחיילי צה\"ל, וכי יו\"ר הוועדה \"בחר בכוונה לסלף\" את דבריה והוציאם מהקשרם."
      en: "On 23 March 2026, in a Constitution, Law and Justice Committee debate held after Border Police troops fired at a vehicle in the village of Tammun, killing two parents and two children, Azuz said that \"children aged 5 and 7 were killed by our forces' fire\" and that the government was unable to express regret, and asked, referring to \"voices coming from the government\" that justified it, \"how are you different from the Nukhba terrorists who were given permission to murder Jewish infants\". Committee chair Simcha Rothman reacted angrily and removed her from the session, and the \"Mothers of Combat Soldiers\" organization filed a complaint with the Knesset Ethics Committee; no decision on the complaint was reported. Azuz said the word \"murder\" was never uttered, that she had not referred to IDF soldiers at all, and that the committee chair had \"deliberately chosen to distort\" her words and take them out of context."
