    date: 2025-07-29
    title:
      he: נבחר ליושב ראש ועדת הכספים של הכנסת
      en: Elected Chairman of the Knesset Finance Committee
      ar: انتُخب رئيسًا للجنة المالية في الكنيست
      ru: Избран председателем финансовой комиссии Кнессета
    description:
      he: ב-29 ביולי 2025 אישרה ועדת הכספים של הכנסת ברוב של 10 מול 7 את מינויו של מילביצקי ליושב ראש הוועדה, אחת הוועדות החזקות בכנסת המפקחת על תקציב המדינה, מיסוי ובנקאות. הוא החליף בתפקיד את ח"כ משה גפני, שפרש מהקואליציה, ומועמדותו נתמכה על ידי ראש הממשלה בנימין נתניהו; לפי הדיווחים המינוי הוא זמני ואמור לחזור לגפני אם ישוב לקואליציה. הוא מכהן בתפקיד גם לאחר פיזור הכנסת ביולי 2026.
      en: On July 29, 2025, the Knesset Finance Committee voted 10-7 to approve Milwidsky as its chairman, heading one of parliament's most powerful panels, which oversees the state budget, taxation and banking. He took over from UTJ MK Moshe Gafni, who had left the coalition, and his candidacy was backed by Prime Minister Benjamin Netanyahu; the appointment was reported to be temporary, to revert to Gafni should he rejoin the coalition. He continues in the post after the Knesset's dissolution in July 2026.
