    title:
      he: "הודיעה כי לא תכהן בכנסת הבאה"
      en: "Announced she will not serve in the next Knesset"
    description:
      he: "ב-9 בספטמבר 2026 פרסמה וולדיגר פוסט פרידה שבו הודיעה כי לא תכהן בכנסת ה-26, לאחר שלא הצליחה להתברג במקום ריאלי ברשימת הציונות הדתית. היא כתבה כי ביקשה מיו\"ר המפלגה בצלאל סמוטריץ' להציב אותה בסוף הרשימה, כי היא נשארת בציונות הדתית, וכי תמשיך את פעילותה בתחומי בריאות הנפש, הרווחה והמשפחה מחוץ לכנסת: \"הפלטפורמה שלי משתנה, אבל השליחות לא\"."
      en: "On 9 September 2026 Waldiger published a farewell post announcing that she would not serve in the 26th Knesset, after failing to secure a realistic slot on the Religious Zionism list. She wrote that she had asked party chairman Bezalel Smotrich to place her at the end of the list, that she remains in Religious Zionism, and that she would continue her work on mental health, welfare and family outside the Knesset: \"My platform is changing, but the mission is not.\""
