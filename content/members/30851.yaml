  - kind: positive
    category: award
    title:
      he: פעילות סביבתית והוקרה ציבורית
      en: Environmental leadership and public recognition
    description:
      he: כיהנה כגזברית וכסגנית יושב-ראש איגוד ערים לאיכות הסביבה נפת אשקלון. זכתה
        באות הגלובוס הירוק לשנת 2015 בקטגוריית עובד ציבור מטעם ארגון 'חיים
        וסביבה', ובאות הנגב לאיכות הסביבה לשנת 2017.
      en: Served as treasurer and deputy chair of the Ashkelon District towns
        association for environmental protection. She received the Green Globe
        award for 2015 in the public-servant category on behalf of the Life and
        Environment organization, and the Negev citation for environmental
        protection for 2017.
    date: "2015"
