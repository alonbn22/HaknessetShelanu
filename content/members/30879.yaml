    title:
      he: החלטת ועדת האתיקה בנוגע למעורבותו בחקיקה בענף הלול
      en: Knesset Ethics Committee ruling on his role in poultry-sector legislation
    description:
      he: בפברואר 2025 דיווח דה-מרקר כי גואטה הצביע בעד תיקון חקיקה בענף הלול שלטענת מגדלי עופות יחזק גורמים גדולים בענף, ובהם בן דודו, וכי הוא מקדם הצעת חוק להארכת היתרי תכנון בענף הביצים עד 2050. בעקבות פניית התנועה לאיכות השלטון בטענה לניגוד עניינים (גואטה מחזיק במכסה לייצור של יותר
        ממיליון ביצים בשנה), קבעה ועדת האתיקה של הכנסת ב-25 בפברואר 2025 כי אין מדובר בניגוד
        עניינים אסור, אך החליטה שגואטה לא יצביע על החוק בוועדת הכלכלה. התנועה לאיכות השלטון ביקרה את ההחלטה; תגובה של גואטה לא הובאה בכתבות. אין מדובר בהליך משפטי.
      en: In February 2025 TheMarker reported that Guetta had voted for a poultry-sector legislative amendment that poultry farmers said would strengthen large players in the sector, among them his cousin, and that he was sponsoring a bill to extend planning permits in the egg sector until 2050. Following a complaint by the Movement for Quality
        Government alleging a conflict of interest (Guetta holds a
        quota to produce over one million eggs a year), the Knesset Ethics
        Committee ruled on 25 February 2025 that this did not constitute a prohibited conflict of
        interest, but decided that Guetta would not vote on the bill in the
        Economics Committee. The Movement for Quality Government criticised the decision; no response from Guetta was quoted in the reports. This was not a legal proceeding.
    date: "2025-02-25"
