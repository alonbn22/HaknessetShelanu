    title:
      he: רקע של שירות צבאי ועשייה ציבורית-חברתית
      en: Military service and public-service background
    description:
      he: לזימי שירתה בצה"ל כקצינה במשרד הביטחון ולאחר מכן כקצינת מילואים בפיקוד
        העורף, ולמדה מדע המדינה והיסטוריה של עם ישראל באוניברסיטת חיפה. לפני
        כניסתה לכנסת כיהנה כחברת מועצת העיר חיפה וכמשנה ליושב ראש אגודת
        הסטודנטים. כחברת כנסת קידמה מאבקים חברתיים בתחומי הדיור וזכויות העובדים.
      en: Lazimi served in the IDF as an officer in the Ministry of Defense and later
        as a reserve officer in the Home Front Command, and studied political
        science and Jewish history at the University of Haifa. Before entering
        the Knesset she served on the Haifa City Council and as vice-chair of
        the student association. As a legislator she has promoted social
        campaigns in the areas of housing and workers' rights.
