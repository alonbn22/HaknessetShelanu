rules:
  - key: system
    label: { he: "שיטת הבחירות", en: "The electoral system" }
    detail:
      he: "הבחירות כלליות, ארציות, ישירות, שוות, חשאיות ויחסיות; המדינה כולה אזור בחירה אחד. מצביעים לרשימות סגורות, והמושבים מחולקים בין הרשימות שעברו את אחוז החסימה בשיטת בדר-עופר, כולל הסכמי עודפים."
      en: "Elections are general, nationwide, direct, equal, secret and proportional; the whole country is one district. Voters choose closed party lists, and seats are allocated among lists that pass the threshold by the Bader-Ofer method, including surplus-vote agreements."
    status: confirmed
    sources:
      - url: "https://m.knesset.gov.il/en/about/lexicon/pages/electoralsystem.aspx"
        title: "Electoral System in Israel (Knesset Lexicon)"
        publisher: "The Knesset"
  - key: seats
    label: { he: "מושבים", en: "Seats" }
    value: { he: "120", en: "120" }
    detail:
      he: "בכנסת 120 חברים; כל המושבים מחולקים בחלוקה ארצית-יחסית בין הרשימות שעברו את אחוז החסימה."
      en: "The Knesset has 120 members; all seats are allocated by nationwide proportional distribution among lists that passed the threshold."
    status: confirmed
    sources:
      - url: "https://m.knesset.gov.il/EN/activity/documents/BasicLawsPDF/BasicLawTheKnesset.pdf"
        title: "Basic Law: The Knesset (art. 3)"
        publisher: "The Knesset"
  - key: threshold
    label: { he: "אחוז החסימה", en: "Electoral threshold" }
    value: { he: "3.25%", en: "3.25%" }
    detail:
      he: "רשימה שלא הגיעה ל-3.25% מהקולות הכשרים אינה זוכה בייצוג. האחוז הועלה ל-3.25% במרץ 2014; קודם לכן — 1% עד בחירות 1992, 1.5% מבחירות 1992, ו-2% שנחקק ב-2004 והוחל מבחירות 2006."
      en: "A list below 3.25% of valid votes wins no seats. The threshold was raised to 3.25% in March 2014; previously 1% until the 1992 election, 1.5% from 1992, and 2% legislated in 2004 and first applied in the 2006 election."
    status: confirmed
    sources:
      - url: "https://main.knesset.gov.il/EN/About/Lexicon/Pages/ElectoralThreshold.aspx"
        title: "Electoral Threshold (Knesset Lexicon)"
        publisher: "The Knesset"
      - url: "https://m.knesset.gov.il/EN/activity/mmm/wastedvotes.pdf"
        title: "Wasted votes (Knesset Research and Information Center)"
        publisher: "The Knesset"
  - key: voting-eligibility
    label: { he: "מי רשאי להצביע", en: "Who may vote" }
    detail:
      he: "כל אזרח ישראלי בן 18 ומעלה הרשום במרשם האוכלוסין, אלא אם בית משפט שלל זאת לפי חוק. ההצבעה אישית ובישראל בלבד; קבוצות מוגדרות (חיילים, שליחי מדינה בחו\"ל, מאושפזים, אסירים, מלחים ועוד) מצביעות במעטפות כפולות."
      en: "Every Israeli citizen aged 18+ registered in the Population Register, unless a court has removed the right by law. Voting is in person and in Israel only; defined groups (soldiers, state emissaries abroad, hospital patients, prisoners, ship crews and more) vote by double envelope."
    status: confirmed
    sources:
      - url: "https://m.knesset.gov.il/EN/activity/documents/BasicLawsPDF/BasicLawTheKnesset.pdf"
        title: "Basic Law: The Knesset (art. 5)"
        publisher: "The Knesset"
      - url: "https://main.knesset.gov.il/EN/Documents/2022-10-24%20Fact%20sheet%2002%20-%2025th%20Knesset%20elections%20-%20updated.pdf"
        title: "Fact sheet: The 25th Knesset elections"
        publisher: "The Knesset"
  - key: candidacy
    label: { he: "מי רשאי להיבחר", en: "Who may run" }
    detail:
      he: "אזרח ישראלי בן 21 ומעלה ביום הגשת הרשימות, בכפוף לסייגים: מי שנידון ליותר משלושה חודשי מאסר בפועל מנוע מלהתמודד שבע שנים מתום ריצוי העונש (ובעבירת טרור/ביטחון חמורה שנגזרו עליה מעל שבע שנות מאסר — 14 שנים), אלא אם נקבע שאין קלון. נושאי משרה בכירים (שופטים, קצינים בכירים, עובדי מדינה בכירים ועוד) חייבים לפרוש מראש במועדים הקבועים בחוק. לפי סעיף 7א, רשימה או מועמד ייפסלו בשל שלילת קיומה של ישראל כמדינה יהודית ודמוקרטית, הסתה לגזענות או תמיכה במאבק מזוין נגד ישראל; פסילת מועמד טעונה אישור בית המשפט העליון."
      en: "An Israeli citizen aged 21+ on list-submission day, with restrictions: a person sentenced to over three months' actual imprisonment is barred for seven years after completing the sentence (14 years where a serious terror/security offence drew over seven years' imprisonment), unless ruled free of moral turpitude. Senior officials (judges, senior officers, senior civil servants and others) must resign by statutory deadlines. Under article 7A, a list or candidate is barred for negating Israel's existence as a Jewish and democratic state, incitement to racism, or support for armed struggle against Israel; barring a candidate requires Supreme Court approval."
    status: confirmed
    sources:
      - url: "https://m.knesset.gov.il/EN/activity/documents/BasicLawsPDF/BasicLawTheKnesset.pdf"
        title: "Basic Law: The Knesset (arts. 6, 7, 7A)"
        publisher: "The Knesset"
  - key: election-day
    label: { he: "יום הבחירות", en: "Election day" }
    detail:
      he: "יום הבחירות הוא יום שבתון, אך התחבורה ושירותים ציבוריים פועלים כסדרם. הקלפיות פתוחות בדרך כלל 7:00–22:00 (ביישובים קטנים 8:00–20:00), ומי שבתור בשעת הסגירה מצביע."
      en: "Election day is a public day of rest, but transport and public services operate. Polls are generally open 7:00–22:00 (8:00–20:00 in small communities), and anyone in line at closing still votes."
    status: confirmed
    sources:
      - url: "https://m.knesset.gov.il/EN/activity/documents/BasicLawsPDF/BasicLawTheKnesset.pdf"
        title: "Basic Law: The Knesset (art. 10)"
        publisher: "The Knesset"
  - key: government-formation
    label: { he: "הרכבת ממשלה אחרי הבחירות", en: "Forming a government" }
    detail:
      he: "הנשיא מטיל את הרכבת הממשלה על חבר כנסת בתוך שבעה ימים מפרסום התוצאות, לאחר התייעצות עם הסיעות. למוטל 28 ימים בתוספת עד 14; אם נכשל — חבר כנסת אחר (28 ימים), ואז רוב חברי הכנסת רשאים לבקש הטלה על חבר מסוים (14 ימים). מוצו השלבים — הכנסת מתפזרת ונערכות בחירות חוזרות."
      en: "Within seven days of the results, after consulting the factions, the President tasks an MK with forming a government: 28 days plus up to 14 more; failing that, another MK (28 days), then a majority of MKs may request a specific member (14 days). If all stages fail, the Knesset dissolves and new elections are held."
    status: confirmed
    sources:
      - url: "https://m.knesset.gov.il/EN/activity/documents/BasicLawsPDF/BasicLawTheGovernment.pdf"
        title: "Basic Law: The Government (arts. 7–11)"
        publisher: "The Knesset"
  - key: campaign-finance
    label: { he: "מימון ופיקוח", en: "Financing & oversight" }
    detail:
      he: "מימון מפלגות ובחירות מוסדר בעיקר בחוק מימון מפלגות התשל\"ג-1973; מבקר המדינה מפקח, מפרסם דוחות ורשאי לחייב החזר כספים. תעמולת הבחירות מוסדרת בחוק דרכי תעמולה התשי\"ט-1959, שאכיפתו בידי יו\"ר ועדת הבחירות."
      en: "Party and campaign financing are governed mainly by the Political Parties (Financing) Law, 1973; the State Comptroller oversees, publishes reports and can order repayment. Campaign propaganda is governed by the Elections (Modes of Propaganda) Law, 1959, enforced by the CEC chair."
    status: confirmed
    sources:
      - url: "https://main.knesset.gov.il/EN/activity/mmm/me00636.pdf"
        title: "Party Financing and Elections Financing in Israel (Knesset RIC)"
        publisher: "The Knesset"

stats:
  - key: eligible-voters
    label: { he: "בעלי זכות בחירה", en: "Eligible voters" }
    value: { he: "6,788,804 (בבחירות 2022)", en: "6,788,804 (2022 election)" }
    detail:
      he: "הנתון הרשמי העדכני ביותר; מספר בעלי זכות הבחירה לכנסת ה-26 יפורסם לאחר סגירת פנקס הבוחרים בספטמבר 2026."
      en: "The most recent official figure; the 26th-Knesset count will be published once the voter roll closes in September 2026."
    status: confirmed
    sources:
      - url: "https://main.knesset.gov.il/EN/Documents/2022-10-24%20Fact%20sheet%2002%20-%2025th%20Knesset%20elections%20-%20updated.pdf"
        title: "Fact sheet: The 25th Knesset elections (Knesset RIC)"
        publisher: "The Knesset"
  - key: turnout
    label: { he: "שיעור הצבעה אחרון", en: "Most recent turnout" }
    value: { he: "כ-70.6% (2022)", en: "~70.6% (2022)" }
    detail:
      he: "לשם השוואה: 67.4% ב-2021 (הנמוך במחזור 2019–2021), 71.5% ב-2020, 69.8% בספטמבר 2019 ו-68.5% באפריל 2019. שיעורי ההצבעה לכל מערכות הבחירות — בהיסטוריית הבחירות שבהמשך העמוד."
      en: "For comparison: 67.4% in 2021 (the lowest of the 2019–2021 cycle), 71.5% in 2020, 69.8% in September 2019 and 68.5% in April 2019. Turnout for every election appears in the history below."
    status: confirmed
    sources:
      - url: "https://main.knesset.gov.il/EN/Documents/2022-10-24%20Fact%20sheet%2002%20-%2025th%20Knesset%20elections%20-%20updated.pdf"
        title: "Fact sheet: The 25th Knesset elections (Knesset RIC)"
        publisher: "The Knesset"
      - url: "https://www.jewishvirtuallibrary.org/israeli-central-elections-committee"
        title: "Israeli Elections: Voter Turnout"
        publisher: "Jewish Virtual Library"
  - key: polling-stations
    label: { he: "קלפיות", en: "Polling stations" }
    value: { he: "11,707 (2022)", en: "11,707 (2022)" }
    detail:
      he: "מהן 5,116 נגישות לאנשים עם מוגבלות; בנוסף קלפיות מיוחדות — 222 בבתי חולים, 232 בבתי אבות ו-55 בבתי סוהר ומעצר."
      en: "Of which 5,116 accessible to people with disabilities; plus special stations — 222 in hospitals, 232 in retirement homes and 55 in prisons and detention facilities."
    status: confirmed
    sources:
      - url: "https://main.knesset.gov.il/EN/Documents/2022-10-24%20Fact%20sheet%2002%20-%2025th%20Knesset%20elections%20-%20updated.pdf"
        title: "Fact sheet: The 25th Knesset elections (Knesset RIC)"
        publisher: "The Knesset"
  - key: lists-2022
    label: { he: "רשימות בבחירות הקודמות", en: "Lists in the last election" }
    value: { he: "40 התמודדו, 10 עברו", en: "40 ran, 10 passed" }
    detail:
      he: "בבחירות 2022 התמודדו 40 רשימות ו-10 עברו את אחוז החסימה; מרצ ובל\"ד לא עברו, וכ-300 אלף קולות ירדו לטמיון."
      en: "In 2022, 40 lists ran and 10 passed the threshold; Meretz and Balad fell short, and some 300,000 votes were wasted."
    status: confirmed
    sources:
      - url: "https://main.knesset.gov.il/EN/Documents/2022-10-24%20Fact%20sheet%2002%20-%2025th%20Knesset%20elections%20-%20updated.pdf"
        title: "Fact sheet: The 25th Knesset elections (Knesset RIC)"
        publisher: "The Knesset"
      - url: "https://en.idi.org.il/articles/46229"
        title: "The 2022 Elections: Results Analysis"
        publisher: "Israel Democracy Institute"
  - key: election-cost
    label: { he: "כמה עולות בחירות", en: "What an election costs" }
    value: { he: "כ-2.7 מיליארד ש\"ח (2022, אומדן)", en: "~NIS 2.7 billion (2022, est.)" }
    detail:
      he: "מתוכם כ-1.5 מיליארד ש\"ח עלות יום השבתון; תקציב ועדת הבחירות שאושר בוועדת הכספים עמד על כ-538 מיליון ש\"ח — כ-79 ש\"ח לבוחר."
      en: "Of which ~NIS 1.5 billion was the election-day holiday; the CEC budget approved by the Finance Committee was ~NIS 538 million — roughly NIS 79 per voter."
    status: reported
    sources:
      - url: "https://www.calcalist.co.il/local_news/article/bj4w2taf9"
        title: "עלות הבחירות — לפחות 2.7 מיליארד שקל"
        publisher: "Calcalist"
      - url: "https://www.ynet.co.il/economy/article/syqde5zno"
        title: "אושר תקציב ועדת הבחירות בסך 538 מיליון שקל"
        publisher: "Ynet"

news:
  - date: "2026-07-17"
    text:
      he: "הכנסת ה-25 התפזרה רשמית בתום קדנציה מלאה; הבחירות יתקיימו במועדן החוקי, 27 באוקטובר 2026."
      en: "The 25th Knesset formally dispersed at the end of a full term; the election will be held on its statutory date, October 27, 2026."
  - date: "2026-07-05"
    text:
      he: "מליאת הכנסת עיגנה בחקיקה (בקריאה שנייה ושלישית) את מועד הבחירות — 27 באוקטובר 2026."
      en: "The Knesset plenum anchored the election date — October 27, 2026 — in legislation (second and third readings)."
  - date: "2026-04-26"
    text:
      he: "בנט ולפיד הכריזו על ריצה משותפת ('ביחד') בראשות בנט."
      en: "Bennett and Lapid announced a joint run (\"Together\") headed by Bennett."

