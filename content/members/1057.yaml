      he: הוצא מרשימת יהדות התורה לכנסת ה-26 ויוחלף באליקים שטארק
      en: Dropped from the United Torah Judaism list for the 26th Knesset, to be replaced by Elyakim Stark
    description:
      he: 'ב-7 בספטמבר 2026 דווח כי לפי החלטת האדמו"ר מבעלזא, אייכלר - נציג חסידות בעלזא ברשימה מאז 2003 - לא ייכלל ברשימת יהדות התורה לכנסת ה-26, ובמקומו ישובץ אליקים שטארק. לפי "כיכר השבת", אייכלר אמר כי "מה שהרבי מחליט - אני מקבל".'
      en: 'On 7 September 2026 it was reported that, by decision of the Belz Rebbe, Eichler - the Belz Hasidic representative on the list since 2003 - would not be included on the United Torah Judaism list for the 26th Knesset, with Elyakim Stark taking his place. According to Kikar HaShabbat, Eichler said "whatever the Rebbe decides, I accept".'
