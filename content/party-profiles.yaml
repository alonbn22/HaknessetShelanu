      - date: "2026-08-31"
        text:
          he: "עבאס ויואב סגלוביץ', חבר כנסת לשעבר מיש עתיד שפרש מהמפלגה ב-6 באוגוסט והתפטר מהכנסת (חילופין ב-11 באוגוסט), הודיעו בנצרת כי סגלוביץ' יוצב במקום השני ברשימת רע\"ם — מועמד יהודי ראשון ברשימה."
          en: "Abbas and Yoav Segalovitz — a former Yesh Atid MK who left the party on 6 August and resigned from the Knesset (replaced on 11 August) — announced in Nazareth that Segalovitz will run second on Ra’am’s list, the first Jewish candidate on it."
          ar: "أعلن عباس ويوآف سيغالوفيتش — عضو الكنيست السابق عن يش عتيد الذي انسحب من الحزب في 6 آب/أغسطس واستقال من الكنيست (استُبدل في 11 آب/أغسطس) — في الناصرة أن سيغالوفيتش سيوضع في الموقع الثاني في قائمة الموحدة، ليكون أول مرشح يهودي فيها."
          ru: "Аббас и Йоав Сегалович — бывший депутат от «Еш Атид», вышедший из партии 6 августа и сложивший мандат (замена — 11 августа), — объявили в Назарете, что Сегалович пойдёт вторым в списке РААМ: это первый еврейский кандидат в нём."
          es: "Abbas y Yoav Segalovitz — exdiputado de Yesh Atid que dejó el partido el 6 de agosto y renunció a la Knéset (sustituido el 11 de agosto) — anunciaron en Nazaret que Segalovitz será segundo en la lista de Ra’am, el primer candidato judío en ella."
          fr: "Abbas et Yoav Segalovitz — ancien député de Yesh Atid qui a quitté le parti le 6 août et démissionné de la Knesset (remplacé le 11 août) — ont annoncé à Nazareth que Segalovitz sera deuxième sur la liste de Ra’am, le premier candidat juif à y figurer."
        sources:
          - { url: "https://www.timesofisrael.com/jewish-former-mk-yoav-segalovitz-announces-unprecedented-run-with-arab-raam-party/", title: "In unprecedented move, Abbas and Segalovitz announce joint run, bringing Jewish lawmaker to Arab party's slate (2026-08-31)", publisher: "The Times of Israel" }
