    title:
      he: "האישה הראשונה ילידת אתיופיה שנבחרה לכנסת"
      en: "First Ethiopian-born woman elected to the Knesset"
    description:
      he: "פנינה תמנו-שטה נכנסה לכנסת ב-2013 מטעם מפלגת יש עתיד, והפכה לאישה הראשונה ילידת אתיופיה שנבחרה לכנסת ישראל. היא עלתה לישראל ב-1984 במבצע משה."
      en: "Pnina Tamano-Shata entered the Knesset in 2013 with the Yesh Atid party, becoming the first Ethiopian-born woman elected to the Israeli Knesset. She immigrated to Israel in 1984 in Operation Moses."
    date: "2013-01-22"
