    - dimension: religion
      value: haredi
      quote:
        he: "\"מפלגת \"הציבור החרדי\" קמה כדי להיות בית פוליטי עבור כל יהודי חרדי, מכל חוג ועדה.\""
        en: "\"The 'Haredi Public' party was founded to be a political home for every Haredi Jew, of every circle and community.\""
