  he: "עמוד זה נערך על ידי האתר על בסיס המקורות המצוינים לצד כל פריט ומתעדכן ככל שהמערכה מתקדמת. הרשימות מוצגות כפי שהוגשו ב-7–8 בספטמבר 2026, בכפוף לאישור ועדת הבחירות המרכזית. סקרים ועמדות מוצגים עם מקורם ואינם המלצה. מצאתם אי-דיוק? דווחו לנו ונתקן."
  en: "This page is edited by the site from the sources cited beside each item and is updated as the campaign develops. Lists are shown as submitted on September 7–8, 2026, subject to the Central Elections Committee's approval. Polls and positions are shown with their sources and are not a recommendation. Spotted an inaccuracy? Report it and we will fix it."
  ar: "يحرّر الموقع هذه الصفحة استنادًا إلى المصادر المذكورة بجانب كل بند، وتُحدَّث مع تطوّر الحملة. تُعرض القوائم كما قُدّمت في 7–8 أيلول/سبتمبر 2026، رهنًا بمصادقة لجنة الانتخابات المركزية. تُعرض الاستطلاعات والمواقف مع مصادرها وليست توصية. لاحظت خطأً؟ بلّغ عنه وسنصحّحه."
  ru: "Эту страницу редактирует сайт по источникам, указанным рядом с каждым пунктом, и обновляет по ходу кампании. Списки показаны в том виде, в каком были поданы 7–8 сентября 2026 года, с оговоркой об утверждении ЦИК. Опросы и позиции приведены с источниками и не являются рекомендацией. Заметили неточность? Сообщите, и мы исправим."
  es: "Esta página la edita el sitio a partir de las fuentes citadas junto a cada elemento y se actualiza a medida que avanza la campaña. Las listas se muestran tal como se presentaron el 7 y 8 de septiembre de 2026, sujetas a la aprobación de la Comisión Electoral Central. Las encuestas y las posturas se muestran con sus fuentes y no son una recomendación. ¿Ha visto un error? Infórmenos y lo corregiremos."
  fr: "Cette page est rédigée par le site à partir des sources citées à côté de chaque élément et mise à jour au fil de la campagne. Les listes sont présentées telles que déposées les 7 et 8 septembre 2026, sous réserve de l’approbation de la Commission électorale centrale. Les sondages et les positions sont présentés avec leurs sources et ne constituent pas une recommandation. Une erreur ? Signalez-la et nous la corrigerons."
