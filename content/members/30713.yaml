    status: settled
    date: 2026-05-12
    title:
      he: "הערה ושלילת שכר לשלושה ימים מוועדת האתיקה בגין היעדרויות ממליאת הכנסת (2026)"
      en: "Ethics Committee remark and three-day pay deduction over absences from Knesset plenum sessions (2026)"
    description:
      he: "בהחלטה 51/25 מ-12 במאי 2026 קבעה ועדת האתיקה של הכנסת כי עבאס נעדר במושב השלישי של הכנסת ה-25 מ-10 ישיבות מליאה מעבר למכסה הקבועה בחוק (2 בכנס החורף ו-8 בכנס הקיץ), וכי לא התקבלה תגובה מטעמו. הוועדה ציינה כי אין זו הפעם הראשונה שחרג מהמכסה (בהחלטה קודמת לא הוטלה סנקציה) והטילה עליו סנקציה של הערה ושלילת שכר למשך שלושה ימים, בהתחשב גם בהיותו יו\"ר מפלגה. מדובר בסנקציה אתית פרלמנטרית ולא בהליך פלילי."
      en: "In decision 25/51 of 12 May 2026, the Knesset Ethics Committee found that during the third session of the 25th Knesset Abbas was absent from 10 plenum sessions beyond the quota set by law (2 in the winter session and 8 in the summer session), and that no response was received from him. The committee noted this was not the first time he had exceeded the quota (no sanction was imposed in an earlier decision) and imposed a remark together with a three-day pay deduction, also taking into account that he is a party chairman. This was a parliamentary ethics sanction, not a criminal proceeding."
    sources:
      - url: "https://main.knesset.gov.il/Activity/committees/Ethics/Decisions25/Decisions25-51.pdf"
        title: "החלטה 51/25 – החלטת ועדת האתיקה בעניין היעדרויות חברי הכנסת מישיבות הכנסת במושב השלישי של הכנסת ה-25"
        publisher: "Knesset"
      - url: "https://www.inn.co.il/news/696706"
        title: "ועדת האתיקה הטילה סנקציות על שרים וחברי כנסת"
        publisher: "Arutz 7"
  - kind: neutral
