    title:
      he: פרישה מהקואליציה שהביאה לאובדן הרוב של ממשלת בנט-לפיד
      en: Coalition resignation that cost the Bennett-Lapid government its majority
    description:
      he: ב-6 באפריל 2022 הודיעה סילמן, ששימשה אז יושבת ראש הקואליציה, על פרישתה
        מהקואליציה. צעד זה הותיר את ממשלת בנט-לפיד ללא רוב בכנסת ותרם להתפרקותה
        ולפיזור הכנסת בהמשך אותה שנה. סילמן נימקה את החלטתה בחילוקי דעות בנושאי
        זהות יהודית ומדיניות דתית.
      en: On 6 April 2022, Silman, then serving as coalition whip, announced her
        resignation from the coalition. The move left the Bennett-Lapid
        government without a Knesset majority and contributed to its eventual
        collapse and the dissolution of the Knesset later that year. Silman
        cited disagreements over Jewish identity and religious policy.
    date: 2022-04-06
    sources:
