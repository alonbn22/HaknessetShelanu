  - id: 1105 # Religious Zionism
    verified: "2026-09-19"
    updates:
      - date: "2023-02-07"
        text:
          he: "(רקע) בצלאל סמוטריץ' התפטר מהכנסת לפי החוק הנורבגי עם מינויו לשר האוצר; צבי סוכות נכנס במקומו ב-7 בפברואר 2023."
          en: "(Background) Bezalel Smotrich resigned his Knesset seat under the Norwegian law on becoming finance minister; Zvi Sukkot entered in his place on 7 February 2023."
        sources:
          - { url: "https://www.haaretz.com/israel-news/2023-02-05/ty-article/.premium/far-right-settler-leader-becomes-mk-under-law-to-expand-size-of-government/00000186-213a-d442-a18f-afbbb1ac0000", title: "Far-right Settler Leader Becomes MK Under Law to Expand Size of Government (2023-02-05)", publisher: "Haaretz" }
          - { url: "https://knesset.gov.il/OdataV4/ParliamentInfo/KNS_PersonToPosition?$filter=FactionID%20eq%201105%20and%20KnessetNum%20eq%2025", title: "KNS_PersonToPosition — FactionID 1105, Knesset 25 (Smotrich member to 2023-02-07; Sukkot from 2023-02-07) (2026-09-19)", publisher: "Knesset OData" }
      - date: "2024-11-11"
        text:
          he: "(רקע) אוהד טל החליף את שמחה רוטמן כיו\"ר סיעת הציונות הדתית בכנסת."
          en: "(Background) Ohad Tal replaced Simcha Rothman as chair of the Religious Zionism faction in the Knesset."
        sources:
          - { url: "https://knesset.gov.il/OdataV4/ParliamentInfo/KNS_PersonToPosition?$filter=FactionID%20eq%201105%20and%20KnessetNum%20eq%2025", title: "KNS_PersonToPosition — FactionID 1105, Knesset 25 (PositionID 48: Rothman 2022-12-15 → 2024-11-11; Tal from 2024-11-11) (2026-09-19)", publisher: "Knesset OData" }
      - date: "2025-01-21"
        text:
          he: "כהונתו של צבי סוכות בכנסת הסתיימה ב-21 בינואר 2025 — היום שבו נכנסו לתוקף התפטרויות שרי עוצמה יהודית מהממשלה ועמיחי אליהו שב לכנסת (השניים נבחרו ברשימה המשותפת של 2022, שממנה נקבעים המחליפים לפי החוק הנורבגי). הסיעה מנתה 6 חברים עד אפריל 2025."
          en: "Zvi Sukkot’s Knesset term ended on 21 January 2025 — the day the Otzma Yehudit ministers’ resignations took effect and Amichai Eliyahu returned to the Knesset (both were elected on the 2022 joint list, from which Norwegian-law replacements are drawn). The faction had 6 members until April 2025."
        sources:
          - { url: "https://knesset.gov.il/OdataV4/ParliamentInfo/KNS_PersonToPosition?$filter=FactionID%20eq%201105%20and%20KnessetNum%20eq%2025", title: "KNS_PersonToPosition — FactionID 1105 (Sukkot member 2023-02-07 → 2025-01-21) and FactionID 1106 (Eliyahu member from 2025-01-21) (2026-09-19)", publisher: "Knesset OData" }
          - { url: "https://www.timesofisrael.com/with-otzma-yehudit-out-of-government-netanyahu-set-to-appoint-replacement-ministers/", title: "With Otzma Yehudit out of government, Netanyahu set to appoint replacement ministers (2025-01-19)", publisher: "The Times of Israel" }
          - { url: "https://www.timesofisrael.com/utjs-goldknopf-resigns-from-cabinet-after-knesset-fails-to-pass-dissolution-bill/", title: "UTJ's Goldknopf resigns from cabinet after Knesset fails to pass dissolution bill (explains the Norwegian-law displacement mechanism) (2025-06-12)", publisher: "The Times of Israel" }
      - date: "2025-04-06"
        text:
          he: "אלמוג כהן (נבחר ברשימה המשותפת מטעם עוצמה יהודית) מונה לסגן שר במשרד ראש הממשלה ב-2 באפריל 2025 והתפטר מהכנסת לפי החוק הנורבגי; צבי סוכות שב לכנסת ב-6 באפריל 2025 והסיעה חזרה ל-7 חברים."
          en: "Almog Cohen (elected on the joint list for Otzma Yehudit) was appointed deputy minister in the Prime Minister’s Office on 2 April 2025 and resigned from the Knesset under the Norwegian law; Zvi Sukkot returned to the Knesset on 6 April 2025 and the faction was back to 7 members."
        sources:
          - { url: "https://knesset.gov.il/OdataV4/ParliamentInfo/KNS_PersonToPosition?$filter=KnessetNum%20eq%2025%20and%20GovMinistryID%20ne%20null%20and%20IsCurrent%20eq%20true", title: "KNS_PersonToPosition — current government positions (Almog Cohen, deputy minister, PMO, from 2025-04-02); FactionID 1106 query: Cohen member to 2025-04-06; FactionID 1105 query: Sukkot member from 2025-04-06 (2026-09-19)", publisher: "Knesset OData" }
          - { url: "https://www.timesofisrael.com/former-otzma-yehudit-mk-to-run-in-likud-primary-after-netanyahu-opens-door/", title: "Former Otzma Yehudit MK to run in Likud primary after Netanyahu opens door (2026-08-12)", publisher: "The Times of Israel" }
      - date: "2026-08-13"
        text:
          he: "סמוטריץ' הודיע שהציונות הדתית תרוץ בנפרד מעוצמה יהודית: 'הציבור הדתי-לאומי יכול וצריך לרוץ בכוחות עצמו כמפלגה גדולה, חזקה ומשמעותית'. בן גביר שלל ריצה משותפת (27 ביולי) ודחה את דרישת נתניהו להתאחד (28 באוגוסט)."
          en: "Smotrich said Religious Zionism would run separately from Otzma Yehudit: ‘the Religious Zionist public can and should run on its own as a big, strong, significant party.’ Ben Gvir ruled out a joint run (27 July) and rejected Netanyahu’s demand to merge (28 August)."
        sources:
          - { url: "https://www.jpost.com/israel-election-2026/article-905489", title: "WATCH: 'I know how to act responsibly': Smotrich outlines election strategy, plan to draft haredim (2026-08-13)", publisher: "The Jerusalem Post" }
          - { url: "https://www.jpost.com/israel-news/politics-and-diplomacy/article-903791", title: "Ben-Gvir rules out running with Smotrich for elections, says parties are 'fundamentally different' (2026-07-27)", publisher: "The Jerusalem Post" }
          - { url: "https://www.timesofisrael.com/ben-gvir-rejects-pms-demand-to-merge-with-smotrich-drawing-scathing-response-from-likud/", title: "Ben Gvir refuses Netanyahu's demand to merge with Smotrich; Likud: He's crowning Eisenkot (2026-08-28)", publisher: "The Times of Israel" }
      - date: "2026-09-01"
        text:
          he: "הציונות הדתית וזהות בראשות משה פייגלין הודיעו על ריצה משותפת (גוש טכני); סמוטריץ' קרא למפלגות ימין נוספות להצטרף. פייגלין שובץ במקום השני."
          en: "Religious Zionism and Moshe Feiglin’s Zehut announced a joint run as a technical bloc; Smotrich urged other right-wing parties to join. Feiglin was placed second."
        sources:
          - { url: "https://www.timesofisrael.com/smotrich-feiglin-announce-joint-election-run-urge-other-right-wing-parties-to-join/", title: "Smotrich, Feiglin announce joint election run, urge other right-wing parties to join (2026-09-01)", publisher: "The Times of Israel" }
          - { url: "https://www.timesofisrael.com/how-far-right-outcast-moshe-feiglin-resurrected-his-political-career/", title: "How far-right outcast Moshe Feiglin resurrected his political career (2026-09-04)", publisher: "The Times of Israel" }
      - date: "2026-09-08"
        text:
          he: "הרשימה המשותפת הוגשה (רשימה 31, אות מבוקשת ט) בידי האיחוד הלאומי-תקומה, זהות ועתיד אחד: 1 בצלאל סמוטריץ', 2 משה פייגלין (זהות), 3 אורית סטרוק (עתיד אחד), 4 שמחה רוטמן, 5 צבי מור, 6 איתמר איתם, 7 צבי סוכות, 8 יצחק זאגא (זהות), 9 רעות בן חיים, 10 עומר וולדמן (זהות), 11 ארקדי מוטר (זהות), 12 אוהד טל."
          en: "The joint list was submitted (list 31, requested letter ט) by National Union–Tkuma, Zehut and Atid Echad: 1 Bezalel Smotrich, 2 Moshe Feiglin (Zehut), 3 Orit Strook (Atid Echad), 4 Simcha Rothman, 5 Zvi Mor, 6 Itamar Eitam, 7 Zvi Sukkot, 8 Yitzhak Zaga (Zehut), 9 Reut Ben Haim, 10 Omer Waldman (Zehut), 11 Arkadi Muter (Zehut), 12 Ohad Tal."
        sources:
          - { url: "https://www.gov.il/he/pages/tzionutdatit-zehut_list31", title: "רשימת המועמדים — הציונות הדתית בראשות בצלאל סמוטריץ' וזהות בראשות משה פייגלין (רשימה 31) (2026-09-08)", publisher: "ועדת הבחירות המרכזית / gov.il" }
