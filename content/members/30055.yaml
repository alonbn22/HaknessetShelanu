      en: "On 7 February 2023 Smotrich resigned his Knesset seat under the \"Norwegian Law\", and Zvi Sukkot was sworn in in his place. Since then he has served as Finance Minister and minister in the Defense Ministry without being a member of Knesset, and heads the Religious Zionist list for the 2026 election."
