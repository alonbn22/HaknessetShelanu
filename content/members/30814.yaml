      en: Before entering politics, Maoz had an extensive public-service career. In
        1999 he was appointed Director of the Ministry of the Interior by
        minister Natan Sharansky, and he later served as director of the
        Ministry of Construction and Housing and as director-general of Yisrael
        BaAliyah. He enlisted in the IDF in 1975 and in 1977 was a partner in
        establishing the Migdal Oz settlement in Gush Etzion.
