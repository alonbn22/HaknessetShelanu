    title:
      he: יזם את חוק ההכרה בשפת הסימנים הישראלית (2026)
      en: Initiated the law recognizing Israeli Sign Language (2026)
    description:
      he: הצעת חוק פרטית שיזם בוארון יחד עם ח"כ חילי טרופר, חוק הכרה בשפת הסימנים הישראלית, התשפ"ו-2026, התקבלה בקריאה שנייה ושלישית ופורסמה בספר החוקים ב-9 ביוני 2026, לפי מאגר החקיקה של הכנסת. החוק מכיר בשפת הסימנים הישראלית ומפקיד את שימורה, פיתוחה וקידומה בידי האקדמיה ללשון העברית.
      en: A private bill initiated by Boaron together with MK Hili Tropper, the Recognition of Israeli Sign Language Law, 5786-2026, passed its second and third readings and was published in the official law gazette on 9 June 2026, according to the Knesset's legislation database. The law recognizes Israeli Sign Language and entrusts its preservation, development and promotion to the Academy of the Hebrew Language.
    sources:
