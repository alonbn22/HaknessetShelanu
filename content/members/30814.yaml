  - kind: neutral
    category: news
    date: "2026-08-10"
    title:
      he: "פתח את מערכת הבחירות תחת השם החדש \"נעם לישראל\""
      en: "Launched the election campaign under the party's new name, \"Noam for Israel\""
    description:
      he: "ב-10 באוגוסט 2026 הציג מעוז את השם החדש של מפלגתו, \"נעם לישראל\", ואמר כי \"הגיע הזמן לחבר מחדש את מחנה הימין\" — לפנות לציבור החרדי, הציוני-דתי והמסורתי — וכי בכוונתו להיכנס לכנסת הבאה בראש סיעה של ארבעה מנדטים לפחות, כשהחינוך בראש סדר העדיפויות."
      en: "On 10 August 2026 Maoz presented his party's new name, \"Noam for Israel\", saying \"the time has come to reconnect the right-wing camp\" — appealing to Haredi, religious-Zionist and traditional voters — and that he intends to enter the next Knesset heading a faction of at least four seats, with education as his top priority."
    sources:
      - url: "https://www.inn.co.il/news/703637"
        title: "\"הגיע הזמן לחבר מחדש את מחנה הימין\": אבי מעוז יוצא לדרך חדשה"
        publisher: "Arutz 7 / Israel National News"
  - kind: neutral
    category: news
    date: "2026-09-08"
    title:
      he: "עומד בראש רשימת \"נעם לישראל\", הרצה לבדה לכנסת ה-26"
      en: "Heads the \"Noam for Israel\" list, running on its own for the 26th Knesset"
    description:
      he: "ב-8 בספטמבר 2026 הגישה נועם לוועדת הבחירות המרכזית רשימה עצמאית לבחירות 27 באוקטובר, בהנחיית הרב צבי ישראל טאו. מעוז עומד בראשה, אחריו הרב שמעון טובול, סגן ראש עיריית באר שבע, וסא\"ל (מיל') אליהו ליבמן; המפלגה ביקשה את האות \"ני\". מעוז אמר: \"הבחירות האלה הן על החינוך ועל הזהות היהודית של המדינה\"."
      en: "On 8 September 2026 Noam filed an independent list with the Central Elections Committee for the 27 October election, at the direction of Rabbi Tzvi Yisrael Tau. Maoz heads the list, followed by Rabbi Shimon Tubol, deputy mayor of Beersheba, and Lt. Col. (res.) Eliyahu Libman; the party requested the ballot letters \"ני\". Maoz said: \"These elections are about education and the Jewish identity of the state\"."
    sources:
