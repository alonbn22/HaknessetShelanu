    title:
      he: כיהן כשר במשרד החינוך בממשלה ה-37
      en: Served as a minister in the Ministry of Education
    description:
      he: חיים ביטון, מטעם ש"ס, מונה לשר במשרד החינוך בממשלה ה-37 בראשות בנימין נתניהו ב-29 בדצמבר 2022, ובמסגרת תפקידו היה ממונה בין היתר על החינוך החרדי והחברה למתנ"סים. לפי רישומי הכנסת כהונתו כשר הסתיימה ב-20 ביולי 2025, במסגרת התפטרות שרי ש"ס מהממשלה על רקע משבר חוק הגיוס, ובאותו יום שב לכהן כחבר הכנסת (לאחר שהתפטר מהכנסת בפברואר 2023 במסגרת החוק הנורבגי).
      en: Chaim Biton of Shas was appointed a minister in the Ministry of Education in the 37th government led by Benjamin Netanyahu on 29 December 2022, with responsibilities that included the Haredi education sector and the community-centers authority. According to Knesset records his ministerial term ended on 20 July 2025, as part of the resignation of Shas ministers from the government amid the dispute over the military-conscription (draft) law, and on the same day he returned to serve as a Knesset member (having resigned his seat in February 2023 under the "Norwegian Law").
    date: 2022-12-29
