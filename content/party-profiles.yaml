          - { url: "https://www.ynet.co.il/news/blogs/article/skc6ftiqfe", title: "הדיון בבית המשפט העליון בפסילות — עדכונים (1.10.2026)", publisher: "ynet" }
      - date: "2026-09-23"
        text:
          he: "ב-23 בספטמבר 2026 החליטה ועדת הבחירות המרכזית, ברוב של 18 נגד 5 ונמנע אחד, לפסול את רשימות רע\"ם והרשימה המשותפת, ובהצבעות נפרדות את המועמדים עופר כסיף (19 נגד 5, שניים נמנעו) וסאמי אבו שחאדה (30 נגד 4 בעילת שלילת קיומה של ישראל כמדינה יהודית ודמוקרטית, ו-31 נגד 4 – בהם יו\"ר הוועדה, השופט נעם סולברג – בעילת תמיכה במאבק מזוין). את הבקשות נגד רע\"ם הגישו עוצמה יהודית, הליכוד ופורום \"בוחרים בחיים\" של משפחות שכולות; נגד הרשימה המשותפת וכסיף – הליכוד; ונגד אבו שחאדה – עוצמה יהודית והשר איתמר בן גביר. המבקשים טענו לתמיכה במאבק מזוין נגד ישראל ולשלילת קיומה כמדינה יהודית ודמוקרטית, ובעניין רע\"ם גם להסתה לגזענות. היועצת המשפטית לממשלה התנגדה לפסילת שתי הרשימות ולפסילת כסיף; לגבי אבו שחאדה עמדתה הייתה שעל הוועדה לבחון בכובד ראש את עילת התמיכה במאבק מזוין. הרשימות וכסיף דוחים את הטענות וכינו את ההחלטות פוליטיות; אבו שחאדה אמר שהוא מתנגד למאבק מזוין ומעולם לא קרא לאלימות, ושהמאמר שבמרכז הבקשה לא היה צריך להתפרסם בנוסחו. רשימה שנפסלה רשאית לערער לבית המשפט העליון עד 29 בספטמבר, ופסילת מועמד טעונה את אישורו; פסיקתו תוגש לוועדה עד 4 באוקטובר והיא סופית."
          en: "On 23 September 2026 the Central Elections Committee voted 18–5, with one abstention, to disqualify the Ra’am and Joint List slates and, in separate votes, the candidates Ofer Cassif (19–5, two abstentions) and Sami Abu Shehadeh (30–4 on the ground of rejecting Israel as a Jewish and democratic state, and 31–4 – including the committee chair, Justice Noam Sohlberg – on the ground of supporting armed struggle). The requests against Ra’am were filed by Otzma Yehudit, Likud and the “Choosing Life” forum of bereaved families; against the Joint List and Cassif by Likud; and against Abu Shehadeh by Otzma Yehudit and Minister Itamar Ben Gvir. They alleged support for armed struggle against Israel and rejection of its existence as a Jewish and democratic state – and, for Ra’am, also incitement to racism. The Attorney General opposed disqualifying the two lists and Cassif; on Abu Shehadeh, her position was that the committee must weigh the armed-struggle ground seriously. The lists and Cassif reject the allegations and called the decisions political; Abu Shehadeh said he opposes armed struggle, has never called for violence, and that the article at the centre of the request should not have been published in that form. A disqualified list may appeal to the Supreme Court until 29 September, and a candidate’s disqualification needs the court’s approval; its ruling reaches the committee by 4 October and is final."
          ar: "في 23 أيلول/سبتمبر 2026 قرّرت لجنة الانتخابات المركزية، بأغلبية 18 مقابل 5 وامتناع عضو واحد، شطب قائمتي القائمة الموحدة والقائمة المشتركة، وفي تصويتات منفصلة شطب المرشحَين عوفر كسيف (19 مقابل 5، وامتناع اثنين) وسامي أبو شحادة (30 مقابل 4 بذريعة إنكار وجود إسرائيل دولةً يهودية وديمقراطية، و31 مقابل 4 – بينهم رئيس اللجنة القاضي نوعم سولبرغ – بذريعة دعم الكفاح المسلح). قدّمت الطلبات ضد القائمة الموحدة عوتسما يهوديت والليكود ومنتدى «نختار الحياة» لعائلات ثكلى؛ وضد القائمة المشتركة وكسيف الليكود؛ وضد أبو شحادة عوتسما يهوديت والوزير إيتمار بن غفير. وادّعى مقدّمو الطلبات دعم الكفاح المسلح ضد إسرائيل وإنكار وجودها دولةً يهودية وديمقراطية، وفي حالة القائمة الموحدة أيضًا التحريض على العنصرية. وعارضت المستشارة القضائية للحكومة شطب القائمتين وشطب كسيف؛ أما بشأن أبو شحادة فكان موقفها أن على اللجنة أن تنظر بجدية في ذريعة دعم الكفاح المسلح. وترفض القائمتان وكسيف الادعاءات ووصفوا القرارات بأنها سياسية؛ وقال أبو شحادة إنه يعارض الكفاح المسلح ولم يدعُ قط إلى العنف، وإن المقال الذي يتمحور حوله الطلب ما كان ينبغي أن يُنشر بصيغته تلك. ويحق للقائمة المشطوبة الاستئناف إلى المحكمة العليا حتى 29 أيلول/سبتمبر، ويتطلب شطب المرشح مصادقة المحكمة؛ ويُقدَّم قرارها إلى اللجنة حتى 4 تشرين الأول/أكتوبر وهو نهائي."
          ru: "23 сентября 2026 года Центральная избирательная комиссия 18 голосами против 5 при одном воздержавшемся проголосовала за отстранение от выборов списков РААМ и «Объединённого списка», а отдельными голосованиями — кандидатов Офера Касифа (19 против 5, двое воздержались) и Сами Абу Шехаде (30 против 4 по основанию отрицания Израиля как еврейского и демократического государства и 31 против 4 — в том числе голосом председателя комиссии судьи Ноама Сольберга — по основанию поддержки вооружённой борьбы). Ходатайства против РААМ подали «Оцма Иегудит», Ликуд и форум семей погибших «Выбираем жизнь»; против «Объединённого списка» и Касифа — Ликуд; против Абу Шехаде — «Оцма Иегудит» и министр Итамар Бен-Гвир. Заявители ссылались на поддержку вооружённой борьбы против Израиля и отрицание его существования как еврейского и демократического государства, а в случае РААМ — также на подстрекательство к расизму. Юридический советник правительства выступила против отстранения обоих списков и Касифа; по делу Абу Шехаде её позиция состояла в том, что комиссия должна серьёзно рассмотреть основание поддержки вооружённой борьбы. Списки и Касиф отвергают обвинения и назвали решения политическими; Абу Шехаде заявил, что выступает против вооружённой борьбы, никогда не призывал к насилию и что статью, ставшую центром ходатайства, не следовало публиковать в таком виде. Отстранённый список может обжаловать решение в Верховном суде до 29 сентября, а отстранение кандидата требует утверждения суда; его решение поступает в комиссию до 4 октября и является окончательным."
          es: "El 23 de septiembre de 2026 la Comisión Electoral Central votó 18 a 5, con una abstención, inhabilitar las listas de Ra’am y de la Lista Conjunta y, en votaciones separadas, a los candidatos Ofer Cassif (19 a 5, dos abstenciones) y Sami Abu Shehadeh (30 a 4 por el motivo de negar a Israel como Estado judío y democrático, y 31 a 4 —incluido el presidente de la comisión, el juez Noam Sohlberg— por el motivo de apoyo a la lucha armada). Las solicitudes contra Ra’am las presentaron Otzma Yehudit, el Likud y el foro de familias en duelo «Elegimos la vida»; contra la Lista Conjunta y Cassif, el Likud; y contra Abu Shehadeh, Otzma Yehudit y el ministro Itamar Ben Gvir. Alegaban apoyo a la lucha armada contra Israel y negación de su existencia como Estado judío y democrático y, en el caso de Ra’am, también incitación al racismo. La asesora jurídica del Gobierno se opuso a inhabilitar las dos listas y a Cassif; sobre Abu Shehadeh, su postura fue que la comisión debía examinar con seriedad el motivo del apoyo a la lucha armada. Las listas y Cassif rechazan las acusaciones y calificaron las decisiones de políticas; Abu Shehadeh dijo que se opone a la lucha armada, que nunca llamó a la violencia y que el artículo en el centro de la solicitud no debió publicarse en esa forma. Una lista inhabilitada puede recurrir ante el Tribunal Supremo hasta el 29 de septiembre, y la inhabilitación de un candidato requiere la aprobación del tribunal; su fallo llega a la comisión a más tardar el 4 de octubre y es definitivo."
          fr: "Le 23 septembre 2026, la Commission électorale centrale a voté par 18 voix contre 5, avec une abstention, l’invalidation des listes de Ra’am et de la Liste commune et, par des votes distincts, celle des candidats Ofer Cassif (19 contre 5, deux abstentions) et Sami Abu Shehadeh (30 contre 4 pour le motif du rejet d’Israël en tant qu’État juif et démocratique, et 31 contre 4 — dont le président de la commission, le juge Noam Sohlberg — pour le motif du soutien à la lutte armée). Les demandes contre Ra’am avaient été déposées par Otzma Yehoudit, le Likoud et le forum de familles endeuillées « Choisir la vie » ; contre la Liste commune et Cassif, par le Likoud ; et contre Abu Shehadeh, par Otzma Yehoudit et le ministre Itamar Ben Gvir. Elles invoquaient un soutien à la lutte armée contre Israël et le rejet de son existence en tant qu’État juif et démocratique — et, pour Ra’am, également l’incitation au racisme. La conseillère juridique du gouvernement s’est opposée à l’invalidation des deux listes et de Cassif ; au sujet d’Abu Shehadeh, sa position était que la commission devait examiner sérieusement le motif du soutien à la lutte armée. Les listes et Cassif rejettent ces accusations et ont qualifié les décisions de politiques ; Abu Shehadeh a déclaré s’opposer à la lutte armée, n’avoir jamais appelé à la violence et que l’article au cœur de la demande n’aurait pas dû être publié sous cette forme. Une liste invalidée peut faire appel devant la Cour suprême jusqu’au 29 septembre, et l’invalidation d’un candidat doit être approuvée par la Cour ; sa décision parvient à la commission au plus tard le 4 octobre et est définitive."
        sources:
          - { url: "https://www.timesofisrael.com/election-panel-votes-to-bar-balad-chief-abu-shehadeh-over-alleged-support-for-terror/", title: "Election panel votes on the Ra'am and Joint List slates and on Abu Shehadeh and Cassif (23 Sep 2026)", publisher: "The Times of Israel" }
