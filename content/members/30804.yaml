    title:
      he: נחקר בחשד להעברת כספי חינוך ציבוריים לעיתון 'הדרך'
      en: Under criminal investigation over alleged diversion of public education
        funds to the 'HaDerech' newspaper
    description:
      he: באוקטובר 2024 דווח כי ביטון זומן לחקירה במשטרה, לאחר שהיועצת המשפטית לממשלה
        אישרה פתיחת חקירה פלילית בחשד שכספי ציבור שיועדו לרשת מעיין החינוך
        התורני, בתקופת כהונתו כראש הרשת (בשנים 2018–2019 על פי הדיווח), הועברו
        למימון העיתון 'הדרך' המזוהה עם ש"ס. על פי הדיווחים נחקרים חשדות לעבירות
        מרמה והפרת אמונים. מדובר בחקירה בלבד; לא הוגש כתב אישום ולא ניתנה הרשעה,
        וחזקת החפות עומדת לזכותו.
      en: In October 2024 it was reported that Biton was summoned for police
        questioning, after the Attorney General authorized a criminal
        investigation on suspicion that public funds earmarked for the Ma'ayan
        HaChinuch HaTorani school network were diverted, during his tenure as
        head of the network (in 2018–2019 according to the reporting), to
        finance the Shas-affiliated newspaper 'HaDerech'. Reports described
        suspected offenses including fraud and breach of trust. This is an
        investigation only; no indictment has been filed and no conviction
        reached, and Biton retains the presumption of innocence.
    date: 2024-10
