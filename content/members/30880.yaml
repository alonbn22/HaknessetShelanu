      en: Boaron was an activist for settlement in Judea and Samaria, led the campaign
        headquarters against the demolition and evacuation of Amona, and was
        among the drafters of the Regularization Law. In 2017 he reached an
        agreement with Prime Minister Benjamin Netanyahu to establish the
        settlement of Amichai for Amona's evacuees, and in February 2018
        residents moved into temporary homes in the new community.
