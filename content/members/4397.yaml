      he: "חבר כנסת ושר ותיק במגוון תיקים ממשלתיים"
      en: "Veteran Knesset member who has held a range of ministerial portfolios"
    description:
      he: "אלקין מכהן כחבר הכנסת מאז 2006. לאורך השנים שימש בשורה של תפקידי שרים, ובהם שר לקליטת העלייה, השר להגנת הסביבה, השר לענייני ירושלים ומורשת, שר ההשכלה הגבוהה והמים ושר הבינוי והשיכון, וכן כיהן כסגן שר החוץ וכיו\"ר הקואליציה."
      en: "Elkin has served as a member of the Knesset since 2006. Over the years he has held a series of ministerial posts, including Minister of Immigrant Absorption, Minister of Environmental Protection, Minister of Jerusalem Affairs and Heritage, Minister of Higher Education and Water Resources, and Minister of Housing and Construction, as well as serving as Deputy Minister of Foreign Affairs and as coalition chairman."
