      en: "First Israeli cabinet minister to make a public visit to Saudi Arabia"
    description:
      he: "ב-26 בספטמבר 2023, בתפקידו כשר התיירות, הפך חיים כץ לחבר הקבינט הישראלי הראשון שביקר בפומבי בערב הסעודית, בעת שהוביל משלחת רשמית לכנס של ארגון התיירות העולמי של האו\"ם."
      en: "On 26 September 2023, in his role as Minister of Tourism, Haim Katz became the first Israeli cabinet member to make a public visit to Saudi Arabia, leading an official delegation to a UN World Tourism Organization conference."
