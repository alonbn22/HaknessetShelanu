    description:
      he: משה אבוטבול כיהן כראש עיריית בית שמש מ-11 בנובמבר 2008 ועד 20 בנובמבר 2018,
        שתי כהונות. הוא נבחר לראשונה ב-2008 כנציג ש"ס ונבחר מחדש ב-2013. לאחר
        ערעור על תוצאות הבחירות הורה בית המשפט על בחירות חוזרות, שנערכו ב-11
