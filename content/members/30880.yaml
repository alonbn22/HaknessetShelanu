    title:
      he: 'העביר את "חוק הפיקדונות": פתיחת פיקדון בנקאי ללא חשבון עו"ש באותו בנק (2025)'
      en: 'Passed the "deposits law": opening a bank deposit without a checking account at the same bank (2025)'
    description:
      he: ב-13 במאי 2025 אישרה מליאת הכנסת בקריאה שנייה ושלישית את חוק הבנקאות (שירות ללקוח) (תיקון מס' 38), שיזם בוארון, המחייב את חמשת הבנקים הגדולים לאפשר ללקוחות לפתוח פיקדון בלי לנהל אצלם חשבון עובר ושב, החל מ-1 בדצמבר 2025. בוארון אמר כי "לא סביר שמי שרוצה להפקיד כסף בבנק שמציע ריבית גבוהה יותר ייאלץ להעביר אליו את כל חשבון העו"ש שלו".
      en: On 13 May 2025 the Knesset plenum passed in its second and third readings the Banking (Service to the Customer) Law (Amendment No. 38), initiated by Boaron, which requires the five largest banks to let customers open a deposit without holding a checking account with them, from 1 December 2025. Boaron said it was "unreasonable that someone wanting to deposit funds at a bank offering higher interest would need to move their entire checking account there."
    sources:
      - url: https://www.calcalist.co.il/local_news/article/hjgpsjz11ex
        title: 'אושר סופית: הבנקים יציעו פקדונות לכלל הציבור - ולא רק ללקוחות'
        publisher: Calcalist
      - url: https://main.knesset.gov.il/apps/legislation/main/bills/2222052
