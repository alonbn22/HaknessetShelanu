      he: "יוזם החוק להפסקת פעילות אונר\"א בשטח מדינת ישראל (2024)"
      en: "Initiated the law ending UNRWA activity in Israeli territory (2024)"
    description:
      he: "ב-28 באוקטובר 2024 אישרה הכנסת ברוב של 92 מול 10 את החוק להפסקת פעילות אונר\"א בשטח מדינת ישראל, שיזמו ביסמוט (היוזם הראשון לפי רישומי הכנסת), שרן השכל, אלי דלל וחברי כנסת נוספים, חרף התנגדות אמריקנית. החוק אוסר על הסוכנות להפעיל נציגות, לספק שירותים או לקיים פעילות בשטח ישראל."
      en: "On 28 October 2024 the Knesset passed, 92 to 10, the law ending UNRWA activity in Israeli territory, initiated by Bismuth (listed first in Knesset records), Sharren Haskel, Eli Dallal and other MKs, despite US opposition. The law bars the agency from operating a mission, providing services or conducting activity in Israel's territory."
    date: "2024-10-28"
