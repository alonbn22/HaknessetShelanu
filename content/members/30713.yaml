    date: 2026-08-22
    title:
      he: "ניתק את בחירת מועמדי רע\"מ מהתנועה האסלאמית ונבחר בפריימריז לעמוד בראש הרשימה"
      en: "Separated Ra'am's candidate selection from the Islamic Movement and was chosen in primaries to head the list"
    description:
      he: "ב-27 ביולי 2026 הודיע עבאס כי ועידת רע\"מ תהיה מעתה גוף מפלגתי עצמאי ללא מעורבות מועצת השורא והתנועה האסלאמית בבחירת המועמדים. בפריימריז שנערכו ב-22 באוגוסט 2026 — הראשונים במפלגה — נבחר עבאס למקום הראשון, ואחריו וליד טאהא, וליד אלהואשלה, אימאן ח'טיב-יאסין ויאסר חוג'יראת. עבאס הבהיר כי רע\"מ לא תצטרף לרשימה משותפת עם חד\"ש, תע\"ל ובל\"ד: \"אנחנו רצים לבד\"."
      en: "On 27 July 2026 Abbas announced that Ra'am's convention would henceforth be an independent party body, with no involvement of the Shura Council or the Islamic Movement in choosing candidates. In primaries held on 22 August 2026 — the party's first — Abbas was elected to the top spot, followed by Walid Taha, Walid Alhwashla, Iman Khatib-Yasin and Yasser Hujirat. Abbas made clear that Ra'am would not join a joint list with Hadash, Ta'al and Balad: \"We are running alone.\""
    sources:
      - url: "https://www.haaretz.co.il/news/elections/2026-07-27/ty-article/.premium/0000019f-a257-df92-a7ff-a6d7e0fd0000"
        title: "רע\"מ מתנתקת מהתנועה האסלאמית ותבחר את מועמדיה לכנסת באופן עצמאי"
        publisher: "Haaretz"
      - url: "https://www.ynet.co.il/news/article/hjn9ijvbzl"
        title: "פריימריז ברע\"ם לראשונה מאז ההיפרדות ממועצת השורא, עבאס: \"אנחנו רצים לבד\""
        publisher: "Ynet"
      - url: "https://www.haaretz.co.il/news/elections/2026-08-22/ty-article/.premium/000001a0-29f3-d399-afb3-bdfb86aa0000"
        title: "עבאס אחרי הפריימריז ברע\"מ: מקווה שבימים הקרובים נצליח להציג את סגלוביץ כמועמד"
        publisher: "Haaretz"
  - kind: neutral
    category: news
    date: 2026-08-31
    title:
      he: "צירף את יואב סגלוביץ' למקום השני ברשימת רע\"מ לבחירות 2026"
      en: "Placed Yoav Segalovich second on the Ra'am list for the 2026 election"
    description:
      he: "ב-31 באוגוסט 2026 הודיע עבאס במסיבת עיתונאים משותפת כי חבר הכנסת לשעבר יואב סגלוביץ' (לשעבר יש עתיד) יוצב במקום השני ברשימת רע\"מ לבחירות 27 באוקטובר — המועמד היהודי הראשון במקום זה ברשימת המפלגה — כמועמד יחיד ולא כסיעה נפרדת. \"יש לנו עבודה לעשות ביחד\", אמר עבאס."
      en: "On 31 August 2026 Abbas announced at a joint press conference that former MK Yoav Segalovich (formerly of Yesh Atid) would be placed second on the Ra'am list for the 27 October election — the first Jewish candidate in that spot on the party's list — as an individual candidate rather than a separate faction. \"We have work to do together,\" Abbas said."
    sources:
      - url: "https://www.jpost.com/israel-election-2026/article-907172"
        title: "Ra'am's Abbas announces ex-Yesh Atid MK will join Arab party slate"
        publisher: "The Jerusalem Post"
      - url: "https://www.ynet.co.il/news/article/sjamoqq00ge"
        title: "סגלוביץ': אי אפשר לקיים שותפות עם מפלגות ערביות אחרי 7/10? זה מופרך ושקרי"
        publisher: "Ynet"
  - kind: neutral
    category: news
    date: 2026-09-13
    title:
      he: "רע\"מ חתמה על הסכם עודפים עם הרשימה המשותפת (חד\"ש-תע\"ל)"
      en: "Ra'am signed a surplus-vote agreement with the Joint List (Hadash-Ta'al)"
    description:
      he: "ב-13 בספטמבר 2026 דווח כי רע\"מ בראשות עבאס והרשימה המשותפת (חד\"ש-תע\"ל) חתמו בסוף השבוע על הסכם עודפים לקראת הבחירות לכנסת ה-26, לאחר שרע\"מ בחרה להתמודד בנפרד. בהודעה משותפת נמסר כי שיתוף הפעולה \"יבטיח שאף קול לא יתבזבז\"."
      en: "On 13 September 2026 it was reported that Ra'am, led by Abbas, and the Joint List (Hadash-Ta'al) had signed a surplus-vote agreement over the weekend ahead of the election to the 26th Knesset, after Ra'am chose to run separately. A joint statement said the cooperation \"will ensure that no vote is wasted.\""
    sources:
      - url: "https://www.jpost.com/israel-election-2026/article-908431"
        title: "Hadash-Ta'al, Ra'am sign surplus vote-sharing agreement"
        publisher: "The Jerusalem Post"
