      - date: "2026-09-13"
        text:
          he: "הליכוד הודיע כי יגיש לוועדת הבחירות המרכזית בקשה לפסול את רע\"ם ואת הרשימה המשותפת; שבוע קודם לכן הגישה עוצמה יהודית בקשה לפסילת רע\"ם. ההכרעה בוועדה נתונה לביקורת בית המשפט העליון."
          en: "Likud said it would petition the Central Elections Committee to disqualify Ra’am and the Joint List; Otzma Yehudit had filed a petition against Ra’am the week before. CEC decisions are subject to Supreme Court review."
          ar: "أعلن الليكود أنه سيقدّم إلى لجنة الانتخابات المركزية طلبًا لشطب القائمة الموحدة (راعم) والقائمة المشتركة؛ وقبل ذلك بأسبوع قدّمت عوتسما يهوديت طلبًا لشطب القائمة الموحدة. قرارات اللجنة خاضعة لرقابة المحكمة العليا."
          ru: "Ликуд заявил, что подаст в Центральную избирательную комиссию ходатайство об отстранении РААМ и «Объединённого списка»; неделей ранее «Оцма Иегудит» подала ходатайство об отстранении РААМ. Решения комиссии подлежат рассмотрению Верховным судом."
          es: "El Likud dijo que pediría a la Comisión Electoral Central la inhabilitación de Ra’am y de la Lista Conjunta; Otzma Yehudit había presentado una petición contra Ra’am la semana anterior. Las decisiones de la Comisión están sujetas a revisión del Tribunal Supremo."
          fr: "Le Likoud a déclaré qu’il demanderait à la Commission électorale centrale d’invalider Ra’am et la Liste commune ; Otzma Yehoudit avait déposé une requête contre Ra’am la semaine précédente. Les décisions de la Commission sont soumises au contrôle de la Cour suprême."
        sources:
          - { url: "https://www.timesofisrael.com/netanyahus-party-says-it-will-petition-election-panel-to-ban-arab-majority-parties/", title: "Netanyahu's Likud says it will petition election panel to ban Arab-majority parties (2026-09-14)", publisher: "The Times of Israel" }
      - date: "2026-10-01"
        text:
          he: "ב-1 באוקטובר 2026 דן הרכב של תשעה שופטי בית המשפט העליון בערעורי רע\"ם והרשימה המשותפת ובפסילת המועמדים עופר כסיף וסאמי אבו שחאדה. בעניין אבו שחאדה אמר נשיא בית המשפט העליון יצחק עמית כי בקרב השופטים יש רוב לאישור הפסילה, וכל השופטים המליצו לו לשקול להסיר את מועמדותו – דבר שיפטור ממתן פסק דין מנומק; השר בן גביר התנגד להמלצה וביקש פסק דין. באותו ערב הודיעה בל\"ד כי אבו שחאדה לא יתמודד; הרשימה המשותפת כינתה את ההמלצה \"פסילה בפועל\". פסקי הדין בעניין רע\"ם, הרשימה המשותפת וכסיף צפויים עד 4 באוקטובר."
          en: "On 1 October 2026 a panel of nine Supreme Court justices heard the appeals of Ra’am and the Joint List and the disqualifications of the candidates Ofer Cassif and Sami Abu Shehadeh. On Abu Shehadeh, Supreme Court President Yitzhak Amit said a majority of the justices favoured approving the disqualification, and all nine recommended that he consider withdrawing – which would make a reasoned judgment unnecessary; Minister Ben Gvir opposed the recommendation and asked for a ruling. That evening Balad announced that Abu Shehadeh would not run; the Joint List called the recommendation “disqualification in practice”. The rulings on Ra’am, the Joint List and Cassif are due by 4 October."
          ar: "في 1 تشرين الأول/أكتوبر 2026 نظرت هيئة من تسعة قضاة في المحكمة العليا في استئنافَي القائمة الموحدة والقائمة المشتركة وفي شطب المرشحَين عوفر كسيف وسامي أبو شحادة. وبشأن أبو شحادة قال رئيس المحكمة العليا يتسحاق عميت إن أغلبية القضاة تميل إلى المصادقة على الشطب، وأوصاه القضاة التسعة جميعًا بأن يدرس سحب ترشحه – ما يُغني عن إصدار حكم مُعلَّل؛ وعارض الوزير بن غفير التوصية وطلب إصدار حكم. وفي المساء نفسه أعلن التجمع أن أبو شحادة لن يترشح؛ ووصفت القائمة المشتركة التوصية بأنها «شطب فعلي». ويُتوقع صدور الأحكام بشأن القائمة الموحدة والقائمة المشتركة وكسيف حتى 4 تشرين الأول/أكتوبر."
          ru: "1 октября 2026 года коллегия из девяти судей Верховного суда рассмотрела апелляции РААМ и «Объединённого списка» и отстранение кандидатов Офера Касифа и Сами Абу Шехаде. По делу Абу Шехаде председатель Верховного суда Ицхак Амит сказал, что большинство судей склоняется к утверждению отстранения, и все девять рекомендовали ему рассмотреть снятие кандидатуры — тогда мотивированное решение не понадобится; министр Бен-Гвир выступил против рекомендации и потребовал решения. В тот же вечер «Балад» объявил, что Абу Шехаде не будет баллотироваться; «Объединённый список» назвал рекомендацию «фактическим отстранением». Решения по РААМ, «Объединённому списку» и Касифу ожидаются до 4 октября."
          es: "El 1 de octubre de 2026 un tribunal de nueve jueces del Tribunal Supremo examinó los recursos de Ra’am y de la Lista Conjunta y la inhabilitación de los candidatos Ofer Cassif y Sami Abu Shehadeh. Sobre Abu Shehadeh, el presidente del Tribunal Supremo, Yitzhak Amit, dijo que una mayoría de los jueces se inclinaba por aprobar la inhabilitación, y los nueve le recomendaron que considerara retirar su candidatura, lo que haría innecesaria una sentencia motivada; el ministro Ben Gvir se opuso a la recomendación y pidió un fallo. Esa misma noche Balad anunció que Abu Shehadeh no se presentaría; la Lista Conjunta calificó la recomendación de «inhabilitación de facto». Los fallos sobre Ra’am, la Lista Conjunta y Cassif se esperan antes del 4 de octubre."
          fr: "Le 1er octobre 2026, une formation de neuf juges de la Cour suprême a examiné les appels de Ra’am et de la Liste commune et l’invalidation des candidats Ofer Cassif et Sami Abu Shehadeh. Concernant Abu Shehadeh, le président de la Cour suprême, Yitzhak Amit, a déclaré qu’une majorité des juges penchait pour approuver l’invalidation, et les neuf juges lui ont recommandé d’envisager de retirer sa candidature, ce qui rendrait inutile un jugement motivé ; le ministre Ben Gvir s’est opposé à cette recommandation et a demandé une décision. Le soir même, Balad a annoncé qu’Abu Shehadeh ne se présenterait pas ; la Liste commune a qualifié la recommandation d’« invalidation de fait ». Les décisions sur Ra’am, la Liste commune et Cassif sont attendues au plus tard le 4 octobre."
        sources:
          - { url: "https://www.jpost.com/israel-news/politics-and-diplomacy/article-910271", title: "Abu Shehadeh to withdraw election bid on Supreme Court recommendation (1 Oct 2026)", publisher: "The Jerusalem Post" }
