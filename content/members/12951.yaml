      he: דורג שלישי בפריימריז הליכוד לכנסת ה-26
      en: Placed third in the Likud primary for the 26th Knesset
    description:
      he: בפריימריז הליכוד ב-17 באוגוסט 2026 דורג לוין במקום השלישי מבין המתמודדים (41,765 קולות), אחרי אלי כהן ואמיר אוחנה, ושובץ במקום גבוה ברשימת הליכוד לבחירות ב-27 באוקטובר 2026.
      en: In the Likud primary on 17 August 2026 Levin placed third among the candidates (41,765 votes), after Eli Cohen and Amir Ohana, securing a high slot on the Likud list for the 27 October 2026 election.
