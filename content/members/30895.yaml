      he: "מייסדת תנועת \"צדק צדק רודפות\" לקידום ענישה הולמת בעבירות מין"
      en: "Founder of the \"Tzedek Tzedek Rodfot\" movement promoting appropriate penalties for sex offenses"
    description:
      he: "לאחר שנגזרו עבודות שירות על אנס סדרתי, הקימה עזוז את תנועת \"צדק צדק רודפות\", המקדמת ענישה הולמת לעברייני מין. היא בוגרת תוכנית עמיתי זכויות אדם במרכז מינרבה, התנדבה במרכז סיוע לנפגעות תקיפה מינית, וכתבה עבודת תזה בנושא תלונות שווא בעבירות אינוס."
      en: "After a serial rapist was sentenced to community service, Azuz founded the \"Tzedek Tzedek Rodfot\" movement, which promotes appropriate penalties for sex offenders. She is a graduate of the Minerva Center's human-rights fellows program, volunteered at a rape crisis center, and wrote her master's thesis on false complaints in rape cases."
