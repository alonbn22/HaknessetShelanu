    description:
      he: "ב-1 בפברואר 2022 אישר בית משפט השלום בירושלים הסדר טיעון שבמסגרתו הודה דרעי בעבירות מס (אי-דיווח על הכנסה ממכירת דירה והצהרות כוזבות), והוא נדון ל-12 חודשי מאסר על תנאי ולקנס של 180 אלף ש\"ח, ללא קביעת קלון. במסגרת ההסדר התפטר מהכנסת בשבוע שקדם לגזר הדין."
      en: "On 1 February 2022 the Jerusalem Magistrate's Court approved a plea bargain in which Deri admitted tax offenses (failing to report income from an apartment sale and making false statements); he received a 12-month suspended sentence and a NIS 180,000 fine, with no finding of moral turpitude. As part of the deal he resigned from the Knesset the week before sentencing."
