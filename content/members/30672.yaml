  - kind: negative
    category: controversy
    title:
      he: התבטאות נגד הקהילה הלהט"בית בריאיון טלוויזיה (2023)
      en: Remarks against the LGBT community in a television interview (2023)
    description:
      he: בריאיון לתוכנית "אנשים" בערוץ 12 ביוני 2023 אמר פינדרוס כי "הדבר הכי מסוכן
        למדינת ישראל, יותר מדאע"ש וחיזבאללה", הוא התנועה הלהט"בית, וכי לתפיסתו יש
        למנוע לא רק את מצעד הגאווה אלא את התנועה בכלל. הדברים עוררו ביקורת
        ציבורית, ובכלל זה מלשכת ראש הממשלה. פינדרוס דחה את הטענה שהוא חסר סובלנות,
        אמר כי עמדתו נובעת מדרישות התורה וכי הוא מכבד את הזולת, וכי אינו מבקש
        להחיל הגבלות מעבר לסטטוס קוו.
      en: In a June 2023 interview on Channel 12's "Anashim" programme, Pindrus said
        that "the most dangerous thing for the State of Israel, more than ISIS
        and Hezbollah", is the LGBT movement, and that in his view not only the
        Pride parade but the movement itself should be prevented. The remarks
        drew public criticism, including from the Prime Minister's Office.
        Pindrus rejected accusations of intolerance, said his position stems
        from the Torah's requirements and that he respects others, and that he
        was not seeking restrictions beyond the status quo.
    date: 2023-06-21
