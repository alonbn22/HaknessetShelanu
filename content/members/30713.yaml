  - kind: positive
    category: achievement
    date: 2021-10-24
    title:
      he: "תוכנית החומש \"תקדום\" בהיקף 30 מיליארד ש\"ח לחברה הערבית (2021)"
      en: "The NIS 30 billion \"Takadum\" five-year plan for Arab society (2021)"
    description:
      he: "ב-24 באוקטובר 2021 אישרה הממשלה תוכנית חומש לפיתוח כלכלי-חברתי של החברה הערבית בהיקף של כ-30 מיליארד ש\"ח, לצד תוכנית של 2.5 מיליארד ש\"ח למאבק בפשיעה — תוכנית שהוסכמה כדרישה של רע\"מ בהסכם הקואליציוני. עבאס אמר כי התוכנית \"לא תמחק שנים של הזנחה, אך תתרום רבות לצמצום הפערים בין המגזר היהודי לערבי\"."
      en: "On 24 October 2021 the government approved a five-year economic and social development plan for Arab society of about NIS 30 billion, alongside a NIS 2.5 billion plan to fight crime — a plan agreed as a requirement of Ra'am in the coalition agreement. Abbas said the plan \"will not erase years of neglect but will go a long way to close the gaps between Jewish and Arab sectors.\""
    sources:
      - url: "https://www.ynetnews.com/article/rjlvknq8t"
        title: "Israel approves NIS 30 billion for development of Arab sector"
        publisher: "Ynetnews"
      - url: "https://www.haaretz.com/israel-news/2021-10-28/ty-article/.premium/five-year-plan-for-israels-arab-community-9-billion-wont-bridge-the-gap/0000017f-e224-df7c-a5ff-e27e91760000"
        title: "Five-year Plan for Israel's Arab Community: $9 Billion Won't Bridge a Gap Decades in the Making"
        publisher: "Haaretz"
  - kind: negative
    category: controversy
    date: 2020-07-22
    title:
      he: "סערה סביב התנגדותו לחוק איסור טיפולי המרה (2020)"
      en: "Controversy over his opposition to the conversion-therapy ban bill (2020)"
    description:
      he: "לאחר שהצעת החוק לאיסור טיפולי המרה עברה בקריאה טרומית ב-22 ביולי 2020 בתמיכת חברי חד\"ש ברשימה המשותפת, כתב עבאס — כפי שדווח ב-ynet — כי החוק הוא \"פשע\" נגד הלהט\"בים ו\"נגד החברה שלנו וערכינו האנושיים\", וכי \"היה טוב יותר לרשימה המשותפת לעצור את החוק ולהכריז על עמדה אחידה\". לפי ג'רוזלם פוסט, עבאס אמר כי מצביעי הרשימה כועסים על התמיכה בחוק ודורשים את פירוקה, וכי המשך קיומה תלוי בהתנהלות חבריה. ההתבטאויות עוררו ביקורת ציבורית וקרע בתוך הרשימה המשותפת; לא היה בכך הליך משמעתי או משפטי."
      en: "After the bill to ban conversion therapy passed a preliminary reading on 22 July 2020 with the support of the Joint List's Hadash members, Abbas wrote — as reported by Ynet — that the law was a \"crime\" against LGBT people and \"against our society and our human values,\" and that \"it would have been better for the Joint List to stop the law and declare a unified position.\" According to The Jerusalem Post, Abbas said the list's voters were angry at the support for the law and were demanding its dissolution, and that its continued existence depended on its members' conduct. The remarks drew public criticism and a rift within the Joint List; no disciplinary or legal proceeding was involved."
    sources:
      - url: "https://www.ynet.co.il/news/article/S1qrCTBgw"
        title: "בחברה הערבית תוקפים את המשותפת על טיפולי ההמרה: \"בגדו בנו\""
        publisher: "Ynet"
      - url: "https://www.jpost.com/israel-news/joint-list-may-break-up-due-to-division-on-conversion-therapy-report-636295"
        title: "Joint List may break up due to division on conversion therapy - report"
        publisher: "The Jerusalem Post"
  - kind: negative
