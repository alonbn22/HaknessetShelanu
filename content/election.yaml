# Upcoming Knesset election (EDITORIAL). Every claim below was researched and
# re-verified against its cited sources on lastReviewed; statuses are honest:
#   confirmed        = an official source states it
#   scheduled-by-law = the statutory default
#   reported         = media reports (may change)
# The lists were submitted on 7–8 September 2026 and are final subject to the
# CEC's approval (reported for 27 September). Every list carries a stable
# `slug` — the identity polls.yaml and quiz.yaml key on. he/en authored; ar/ru
# fall back to en. UPDATE as the campaign moves: re-verify each item, bump
# lastReviewed, and prune anything that changed. Rule: every datum verified,
# from a trusted primary source — never an aggregator or a paraphrase.
knesset: 26
expectedDate: "2026-10-27"
dateStatus: set
lastReviewed: "2026-09-18"

headline:
  he: "הבחירות לכנסת ה-26 יתקיימו ביום שלישי, 27 באוקטובר 2026."
  en: "The 26th Knesset election is set for Tuesday, October 27, 2026."

intro:
  he: "הכנסת ה-25 השלימה קדנציה מלאה והתפזרה ב-17 ביולי 2026, והבחירות יתקיימו במועד הקבוע בחוק. הרשימות הוגשו ב-7–8 בספטמבר 2026. בעמוד זה: המועדים, מי מתמודד ועם מי, כללי הבחירות והנתונים — כל פריט עם מקור."
  en: "The 25th Knesset completed a full term and dispersed on July 17, 2026; the election will be held on its statutory date. The lists were submitted on September 7–8, 2026. This page covers the timeline, who is running and with whom, the rules, and the numbers — every item with a source."

# The road to the 26th Knesset — when each thing becomes known/final.
keyDates:
  - key: kd-lists
    date: "2026-09-08"
    label: { he: "הגשת רשימות המועמדים — ההרכבים סופיים", en: "Candidate lists submitted — line-ups are final" }
    detail:
      he: "38 רשימות הוגשו ליו\"ר ועדת הבחירות המרכזית, השופט נעם סולברג, במשכן הכנסת ב-7–8 בספטמבר 2026. ההגשה אינה אישור: הרשימות, הכינויים והאותיות נבדקים כעת."
      en: "38 lists were submitted to the chair of the Central Elections Committee, Justice Noam Sohlberg, at the Knesset on September 7–8, 2026. Submission is not approval: the lists, names and ballot letters are now under review."
    status: confirmed
    sources:
