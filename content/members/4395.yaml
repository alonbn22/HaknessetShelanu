    title:
      he: שר לביטחון פנים (2006–2009)
      en: Minister of Internal Security (2006–2009)
    description:
      he: דיכטר נבחר לכנסת ברשימת קדימה בשנת 2006 ומונה לשר לביטחון פנים, תפקיד
        שבמסגרתו פיקח על משטרת ישראל ושירות בתי הסוהר. בתקופת כהונתו הוקמה
        היחידה הארצית לחקירות פשיעה חמורה ובינלאומית (להב 433).
      en: Dichter was elected to the Knesset on the Kadima list in 2006 and appointed
        Minister of Internal Security, overseeing the Israel Police and the
        Prison Service. During his tenure the national serious-crime unit Lahav
        433 was established.
