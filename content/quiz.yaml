      blue-white:
        value: 0
        basis: statement
        recordOf:
          he: "תשובת כחול לבן ל-ynet; ב-2023 הצביעה סיעת המחנה הממלכתי, שבה ישבו חברי כחול לבן עד 2025, נגד תיקון עילת הסבירות (0 בעד, 12 נגד) — עמדה מעורבת"
          en: "Blue and White's answer to ynet; in 2023 the National Unity faction, in which Blue and White's members sat until 2025, voted against the reasonableness amendment (0 for, 12 against) — a mixed record"
          ar: "ردّ أزرق أبيض على ynet؛ وفي 2023 صوّتت كتلة المعسكر الرسمي، التي كان أعضاء أزرق أبيض ضمنها حتى 2025، ضد تعديل ذريعة المعقولية (مع: 0، ضد: 12) — سجلّ مختلط"
          ru: "ответ «Кахоль-лаван» для ynet; в 2023 году фракция «Государственный лагерь», в которой члены «Кахоль-лаван» состояли до 2025 года, голосовала против поправки о критерии разумности (за: 0, против: 12) — неоднозначная позиция"
          es: "respuesta de Azul y Blanco a ynet; en 2023 la facción Unidad Nacional, en la que estuvieron los miembros de Azul y Blanco hasta 2025, votó en contra de la enmienda de la razonabilidad (0 a favor, 12 en contra) — un historial mixto"
          fr: "réponse de Bleu et Blanc à ynet ; en 2023, la faction Unité nationale, dans laquelle siégeaient les membres de Bleu et Blanc jusqu’en 2025, a voté contre l’amendement sur la raisonnabilité (0 pour, 12 contre) — un bilan mitigé"
        source: { url: "https://www.ynet.co.il/news/elections2026/article/yokra14903844", title: "\"שלא יגידו 'לא ידענו'\": מה התוכנית של כל מפלגה בנושא שהצית מחאה חסרת תקדים (22.9.2026)", publisher: "ynet" }
        moreSources:
          - { url: "https://knesset.gov.il/OdataV4/ParliamentInfo/KNS_PlenumVote(39566)", title: "חוק-יסוד: השפיטה (תיקון מס' 3) — הצבעה במליאה, 2023-07-11 — קריאה ראשונה", publisher: "הכנסת" }
        quote:
          he: "תשובת כחול לבן ל-ynet: \"נכון להיום הכוח של מערכת המשפט גדול מדי, ובעיקר בלתי-מוסדר, ומצד שני אסור להכניס פוליטיזציה לתוך החלטות משפטיות. התוכנית שלנו תסדיר מצד אחד את חוקי היסוד, ומצד שני תגביל את היכולת של בית המשפט להתערב בהחלטות הממשלה.\""
          en: "Blue and White's answer to ynet: \"As of today the power of the justice system is too great, and above all unregulated; on the other hand, politicization must not enter legal decisions. Our plan will, on the one hand, regulate the Basic Laws and, on the other, limit the court's ability to intervene in government decisions.\""
          ar: "ردّ أزرق أبيض على ynet: «حتى اليوم، قوة الجهاز القضائي كبيرة أكثر من اللازم، وخصوصًا غير منظّمة، ومن جهة أخرى يُمنع إدخال التسييس إلى القرارات القضائية. خطتنا ستنظّم من جهة قوانين الأساس، ومن جهة أخرى ستحدّ من قدرة المحكمة على التدخل في قرارات الحكومة.»"
          ru: "Ответ «Кахоль-лаван» для ynet: «На сегодня власть судебной системы слишком велика и, главное, не урегулирована; с другой стороны, нельзя привносить политизацию в судебные решения. Наш план, с одной стороны, упорядочит основные законы, а с другой — ограничит возможность суда вмешиваться в решения правительства»"
          es: "Respuesta de Azul y Blanco a ynet: «Hoy en día el poder del sistema judicial es demasiado grande y, sobre todo, no está regulado; por otro lado, no se debe introducir la politización en las decisiones judiciales. Nuestro plan, por un lado, regulará las Leyes Fundamentales y, por otro, limitará la capacidad del tribunal de intervenir en las decisiones del Gobierno.»"
          fr: "Réponse de Bleu et Blanc à ynet : « Aujourd’hui, le pouvoir du système judiciaire est trop grand, et surtout non réglementé ; d’un autre côté, il ne faut pas introduire de politisation dans les décisions judiciaires. Notre plan, d’une part, réglementera les Lois fondamentales et, d’autre part, limitera la capacité de la Cour à intervenir dans les décisions du gouvernement. »"
      yashar:
        value: 0
        basis: platform
        source: { url: "https://yasharwitheisenkot.com/wp-content/uploads/2026/06/Yashar_10_Steps_Brochure.pdf", title: "10 הצעדים לשגשוגה של מדינת ישראל — מצע ישר!", publisher: "ישר!" }
        quote:
          he: "\"נשמור על… מערכת משפט עצמאית. נחוקק את חוק יסוד החקיקה שיחזק את עצמאות וסמכות הכנסת… חוקים נוספים אשר יגדירו כללי משחק ברורים ומוסכמים למערכת הדמוקרטית\" (צעד 7) — עצמאות בית המשפט לצד חיזוק הכנסת: עמדה מעורבת"
          en: "\"We will keep… an independent justice system. We will legislate Basic Law: Legislation, which will strengthen the independence and authority of the Knesset… laws that set clear, agreed rules for the democratic system\" (step 7) — court independence alongside a stronger Knesset: a mixed position"
          ar: "«سنحافظ على… جهاز قضاء مستقل. سنشرّع قانون أساس: التشريع الذي سيعزّز استقلالية الكنيست وصلاحياته… وقوانين أخرى تحدّد قواعد لعب واضحة ومتفقًا عليها للنظام الديمقراطي» (الخطوة 7) — استقلالية المحكمة إلى جانب تعزيز الكنيست: موقف مختلط"
          ru: "«Мы сохраним… независимую судебную систему. Мы примем Основной закон о законодательстве, который укрепит независимость и полномочия Кнессета… и другие законы, устанавливающие ясные и согласованные правила игры для демократической системы» (шаг 7) — независимость суда наряду с укреплением Кнессета: неоднозначная позиция"
          es: "«Mantendremos… un sistema de justicia independiente. Legislaremos la Ley Fundamental: Legislación, que reforzará la independencia y la autoridad de la Knéset… y leyes que fijen reglas claras y consensuadas para el sistema democrático» (punto 7) — independencia del tribunal junto a una Knéset más fuerte: una postura mixta"
          fr: "« Nous préserverons… un système judiciaire indépendant. Nous adopterons la Loi fondamentale : Législation, qui renforcera l’indépendance et l’autorité de la Knesset… et des lois fixant des règles claires et consensuelles pour le système démocratique » (point 7) — indépendance de la Cour et Knesset renforcée : une position mitigée"
      reservists:
        value: 1
        basis: platform
        source: { url: "https://www.themiluimnikim.org.il/platform/", title: "עקרונות — המילואימניקים (עיקרי המצע)", publisher: "המילואימניקים" }
        quote:
          he: "\"רפורמה משפטית: ביקורת חיצונית ולא תלויה על מערכת המשפט. פיצול תפקידי היועמ\"ש. תיקון האיזונים והבלמים בין הרשויות… נפעל לקדם תיקונים במערכת המשפט תחת הסכמות רחבות.\""
          en: "\"Judicial reform: external, independent oversight of the justice system; splitting the attorney general's roles; correcting the checks and balances… we will advance corrections under broad agreement.\""
          ar: "«إصلاح قضائي: رقابة خارجية ومستقلة على جهاز القضاء؛ فصل مهام المستشار القضائي للحكومة؛ تصحيح الكوابح والتوازنات بين السلطات… سندفع بتصحيحات في جهاز القضاء في إطار توافقات واسعة.»"
          ru: "«Судебная реформа: внешний независимый надзор за судебной системой; разделение функций юридического советника правительства; исправление системы сдержек и противовесов… мы будем продвигать исправления на основе широкого согласия»."
          es: "«Reforma judicial: supervisión externa e independiente del sistema de justicia; separación de las funciones del asesor jurídico del Gobierno; corrección de los contrapesos… impulsaremos correcciones con amplio consenso.»"
          fr: "« Réforme judiciaire : un contrôle externe et indépendant du système judiciaire ; la scission des fonctions du conseiller juridique du gouvernement ; la correction des contre-pouvoirs… nous ferons avancer des corrections dans un large consensus. »"
      amkha:
        value: 2
        basis: statement
        source: { url: "https://www.ynet.co.il/news/elections2026/article/yokra14903844", title: "\"שלא יגידו 'לא ידענו'\": מה התוכנית של כל מפלגה בנושא שהצית מחאה חסרת תקדים (22.9.2026)", publisher: "ynet" }
        quote:
          he: "תשובת עמך ישראל ל-ynet: \"האיזון בין הרשויות הופר ובית המשפט לקח לעצמו סמכויות-יתר. לכן ישנו צורך בתיקון שיאפשר לרצון העם לבוא לידי ביטוי באמצעות נציגיו… אחד מהתיקונים הנדרשים… הוא צמצום עילת הסבירות\""
          en: "Amkha Yisrael's answer to ynet: \"The balance between the branches has been upset and the court has taken excessive powers for itself. So a correction is needed that lets the will of the people find expression through its representatives… one of the corrections needed… is narrowing the reasonableness standard\""
          ar: "ردّ عمخا يسرائيل على ynet: «اختلّ التوازن بين السلطات وأخذت المحكمة لنفسها صلاحيات زائدة. لذلك هناك حاجة إلى تصحيح يتيح لإرادة الشعب أن تجد تعبيرها من خلال ممثليه… أحد التصحيحات المطلوبة… هو تقليص ذريعة المعقولية»"
          ru: "Ответ «Амха Исраэль» для ynet: «Баланс между ветвями власти нарушен, и суд присвоил себе чрезмерные полномочия. Поэтому нужна поправка, которая позволит воле народа выражаться через его представителей… одна из необходимых поправок… — сужение критерия разумности»"
          es: "Respuesta de Amkha Yisrael a ynet: «El equilibrio entre los poderes se ha roto y el tribunal se ha arrogado poderes excesivos. Por eso hace falta una corrección que permita que la voluntad del pueblo se exprese a través de sus representantes… una de las correcciones necesarias… es reducir el criterio de razonabilidad»"
          fr: "Réponse d’Amkha Israël à ynet : « L’équilibre entre les pouvoirs a été rompu et la Cour s’est arrogé des pouvoirs excessifs. Il faut donc une correction qui permette à la volonté du peuple de s’exprimer par ses représentants… l’une des corrections nécessaires… est la réduction du critère de raisonnabilité »"
  - id: oct7-commission
    topic: institutions
    lean: left
    text:
      he: "החקירה של 7 באוקטובר צריכה להיות ועדת חקירה ממלכתית (שאת חבריה ממנה נשיא בית המשפט העליון), ולא ועדה שהממשלה או הכנסת ממנות."
      en: "The inquiry into 7 October should be a state commission of inquiry (whose members the Chief Justice appoints), not a commission the government or the Knesset appoints."
      ar: "يجب أن يكون التحقيق في 7 تشرين الأول/أكتوبر لجنة تحقيق رسمية (يعيّن أعضاءها رئيس المحكمة العليا)، لا لجنة تعيّنها الحكومة أو الكنيست."
      ru: "Расследование 7 октября должна вести государственная следственная комиссия (членов которой назначает председатель Верховного суда), а не комиссия, назначаемая правительством или Кнессетом."
      es: "La investigación del 7 de octubre debería encargarse a una comisión estatal (cuyos miembros nombra el presidente del Tribunal Supremo), no a una comisión nombrada por el Gobierno o la Knéset."
      fr: "L’enquête sur le 7 octobre devrait être confiée à une commission d’enquête d’État (dont les membres sont nommés par le président de la Cour suprême), et non à une commission nommée par le gouvernement ou la Knesset."
    short:
      he: "ועדת חקירה ל-7 באוקטובר"
      en: "7 October inquiry"
      ar: "لجنة تحقيق في 7 تشرين الأول/أكتوبر"
      ru: "Расследование 7 октября"
      es: "Investigación del 7 de octubre"
      fr: "Enquête sur le 7 octobre"
    explainer:
      he: "ועדת חקירה ממלכתית מוקמת לפי חוק, חבריה ממונים בידי נשיא בית המשפט העליון ויש לה סמכויות רחבות. התומכים אומרים שרק כך החקירה תהיה עצמאית ואמינה; המתנגדים אומרים שבתי המשפט אינם ניטרליים ומעדיפים ועדה שהממשלה או הכנסת מקימות."
      en: "A state commission of inquiry is set up under law, its members appointed by the Chief Justice, with broad powers. Supporters say only that makes the inquiry independent and credible; opponents say the courts are not neutral and prefer a commission set up by the government or the Knesset."
      ar: "تُشكَّل لجنة التحقيق الرسمية بموجب القانون، ويعيّن أعضاءها رئيس المحكمة العليا، ولها صلاحيات واسعة. يقول المؤيدون إن هذا وحده يجعل التحقيق مستقلًا وموثوقًا؛ ويقول المعارضون إن المحاكم ليست محايدة ويفضّلون لجنة تشكّلها الحكومة أو الكنيست."
      ru: "Государственная следственная комиссия создаётся по закону, её членов назначает председатель Верховного суда, и у неё широкие полномочия. Сторонники говорят, что только так расследование будет независимым и заслуживающим доверия; противники — что суды не нейтральны, и предпочитают комиссию, созданную правительством или Кнессетом."
      es: "Una comisión estatal de investigación se crea por ley, sus miembros los nombra el presidente del Tribunal Supremo y tiene amplios poderes. Los partidarios dicen que solo así la investigación será independiente y creíble; los opositores dicen que los tribunales no son neutrales y prefieren una comisión creada por el Gobierno o la Knéset."
      fr: "Une commission d’enquête d’État est créée en vertu de la loi, ses membres sont nommés par le président de la Cour suprême et elle dispose de larges pouvoirs. Les partisans disent que c’est la seule façon de rendre l’enquête indépendante et crédible ; les opposants disent que les tribunaux ne sont pas neutres et préfèrent une commission créée par le gouvernement ou la Knesset."
    explainerSources:
      - { url: "https://www.nevo.co.il/law_html/law00/71810.htm", title: "חוק ועדות חקירה, תשכ\"ט-1969 — סעיפים 4 ו-9", publisher: "Nevo" }
      - { url: "https://en.idi.org.il/articles/62785", title: "State Commissions of Inquiry and the Differences from the Government's Politically Appointed Commission", publisher: "המכון הישראלי לדמוקרטיה" }
