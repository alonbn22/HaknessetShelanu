      en: Served as Deputy Speaker of the Knesset
    description:
      he: טיבי כיהן במשך שנים כסגן יושב ראש הכנסת, החל משנת 2006, אחד התפקידים הבולטים
        שמילא חבר כנסת ערבי בבית המחוקקים הישראלי.
      en: Tibi served for years as a Deputy Speaker of the Knesset, beginning in 2006,
        one of the prominent parliamentary offices held by an Arab member of the
        Israeli legislature.
    date: "2006"
    sources:
