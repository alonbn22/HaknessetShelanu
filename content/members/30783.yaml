    title:
      he: במקום התשיעי בנציגות יש עתיד ברשימת "ביחד" לבחירות 2026
      en: Ninth among Yesh Atid's representatives on the "Together" slate for the 2026 election
    description:
      he: ב-26 באפריל 2026 הודיעו יאיר לפיד ונפתלי בנט על ריצה משותפת של יש עתיד ומפלגתו של בנט ברשימת "ביחד" בראשות בנט. ב-5 בספטמבר 2026 הציג לפיד את נציגי יש עתיד ברשימה המשותפת, ופרידמן שובצה במקום התשיעי מביניהם, בעוד שישה חברי כנסת של המפלגה הודיעו כי לא יתמודדו.
      en: On 26 April 2026 Yair Lapid and Naftali Bennett announced that Yesh Atid and Bennett's party would run jointly on the "Together" slate led by Bennett. On 5 September 2026 Lapid unveiled Yesh Atid's representatives on the joint slate, with Fridman placed ninth among them, while six of the party's MKs announced they would not run.
