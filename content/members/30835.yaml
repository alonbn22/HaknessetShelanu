    title:
      he: "יושב ראש ועדת החוץ והביטחון של הכנסת"
      en: "Chair of the Knesset Foreign Affairs and Defense Committee"
    description:
      he: "ב-23 ביולי 2025, על רקע סירובו של יו\"ר ועדת החוץ והביטחון יולי אדלשטיין לקדם את חוק הגיוס בנוסח שדרשו הסיעות החרדיות, בחרה סיעת הליכוד בביסמוט ליו\"ר הוועדה ברוב של 29 מול 4. ועדת הכנסת אישרה את המינוי ב-4 באוגוסט 2025, ומאז הוא עומד בראש אחת הוועדות הבכירות בכנסת."
      en: "On 23 July 2025, after Foreign Affairs and Defense Committee chair Yuli Edelstein refused to advance the conscription bill in the form demanded by the Haredi factions, the Likud faction chose Bismuth as committee chair by a vote of 29 to 4. The Knesset House Committee approved the appointment on 4 August 2025, and he has since chaired one of the Knesset's most senior committees."
    date: "2025-08-04"
