      ar: "قائمة جديدة قدّمها حزب «لمعان أحاي» في 8 أيلول/سبتمبر 2026 بالأحرف المطلوبة זך؛ 12 مرشحًا، في مقدمتهم بنحاس مردخاي (موتي) ليتنر وآشر فردي ومريم نحاما يافه (وفق صفحة القائمة في موقع لجنة الانتخابات)."
      ru: "Новый список, поданный 8 сентября 2026 года партией «Лемаан Ахай» с запрошенными буквами זך; 12 кандидатов, во главе — Пинхас Мордехай (Моти) Литнер, Ашер Фарди и Мириам Нехама Яффе (по странице списка на сайте ЦИК)."
      es: "Una lista nueva presentada el 8 de septiembre de 2026 por el partido «Lema'an Achai» con las letras solicitadas זך; 12 candidatos, encabezados por Pinchas Mordechai (Moti) Litner, Asher Fardi y Miriam Nechama Yaffe (según la página de la lista en el sitio de la Comisión Electoral)."
      fr: "Une nouvelle liste déposée le 8 septembre 2026 par le parti « Lema'an Achai » avec les lettres demandées זך ; 12 candidats, menés par Pinchas Mordechai (Moti) Litner, Asher Fardi et Miriam Nechama Yaffe (selon la page de la liste sur le site de la Commission électorale)."
    candidates:
