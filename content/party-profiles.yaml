        - Support for settlement and applying sovereignty
        - Nationalist positions on Jewish identity
      ar:
        - "سياسة متشددة في الأمن الداخلي وإنفاذ القانون"
        - "دعم الاستيطان وفرض السيادة"
        - "مواقف قومية في مسألة الهوية اليهودية"
      ru:
