    description:
      he: במאי 2025 הודח עמית הלוי על ידי הנהגת הקואליציה מוועדת החוץ והביטחון לאחר
        שהצביע נגד הארכת צווי קריאה לשירות מילואים הקשורים להרחבת הלחימה ברצועת
        עזה, והוחלף בוועדה על ידי יו"ר הקואליציה ח"כ אופיר כץ. לפי נתוני הכנסת חברותו בוועדה הסתיימה ב-19 במאי 2025, וביוני 2025 שב אליה כממלא מקום חבר. מדובר בצעד
        פרלמנטרי-פוליטי פנים-קואליציוני ולא בהליך משפטי.
      en: In May 2025, Amit Halevi was removed by the coalition leadership from the
        Foreign Affairs and Defense Committee after he voted against extending
        emergency reservist call-up orders related to the expansion of fighting
        in the Gaza Strip, and was replaced on the committee by coalition
        chairman MK Ofir Katz. Knesset records show his committee membership ended on 19 May 2025, and in June 2025 he rejoined it as a substitute member. This was an internal parliamentary-political
        action and not a legal proceeding.
