        מינית שיוחסו לאביו, הרב אפרים טסלר, ששימש בעבר ראש ישיבה בירושלים. על פי
        הדיווחים החקירה עוסקת בחשד למעורבות במניעת הליכי החקירה ובתשלום לאחד
        המתלוננים. נכון לפרסומים לא הוגש כתב אישום והוא לא הורשע, ועומדת לו חזקת
        החפות.
      en: In August 2024 it was reported that then-State Prosecutor Amit Aisman
        ordered police to reopen an investigation into Deputy Minister and MK
        Ya'akov Tessler over his alleged involvement in silencing sexual-assault
        complaints against his father, Rabbi Efraim Tessler, a former head of a
        Jerusalem yeshiva. According to the reports, the investigation concerns
        suspected involvement in obstructing the proceedings and an alleged
        payment to one of the complainants. As reported, no indictment has been
        filed and he has not been convicted; the presumption of innocence
        applies.
