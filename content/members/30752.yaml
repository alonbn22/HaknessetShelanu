  - kind: positive
    category: achievement
    title:
      he: יזם וקידם את "חוק החשמל" לחיבור בתים ערביים לרשת
      en: Sponsored the "Electricity Law" connecting Arab homes to the power grid
    description:
      he: כיו"ר ועדת הפנים, טאהא יזם וקידם את "חוק החשמל", שאיפשר חיבור לרשת החשמל של
        בתים שנבנו ללא היתר ביישובים ערביים. החוק עבר בקריאה סופית ב-5 בינואר
        2022 ברוב של 61 מול 0, לאחר שסיעות האופוזיציה פרשו מההצבעה.
      en: As chairman of the Internal Affairs Committee, Taha sponsored and advanced
        the "Electricity Law," which allowed homes built without permits in Arab
        communities to be connected to the power grid. The law passed its final
        reading on 5 January 2022 by a vote of 61-0 after opposition factions
        walked out of the vote.
    date: 2022-01-05
