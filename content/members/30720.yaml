    title:
      he: מחברי הכנסת הגאים הראשונים בישראל
      en: Among Israel's openly gay Knesset members
    description:
      he: יוראי להב-הרצנו, חבר כנסת מטעם יש עתיד, הצהיר בגלוי על היותו גאה ועם השבעתו
        ביוני 2020 הפך לחבר הכנסת הגאי השישי בתולדות הכנסת בת 120 המושבים. הוא
