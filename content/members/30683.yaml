    title:
      he: "השיק את מפלגת \"בית ציוני – המילואימניקים\" עם יועז הנדל"
      en: "Launched the \"Beit Tzioni – The Reservists\" party with Yoaz Hendel"
    description:
      he: "ב-5 באוגוסט 2026 השיק טרופר, כיו\"ר מפלגת \"בית ציוני\", את קמפיין הבחירות של הרשימה המשותפת \"בית ציוני – המילואימניקים\" יחד עם יועז הנדל, והציג את דרישת המפלגה כי הנדל יקבל את תיק הביטחון הלאומי בממשלה הבאה."
      en: "On 5 August 2026 Tropper, as chairman of the \"Beit Tzioni\" party, launched the election campaign of the joint \"Beit Tzioni – The Reservists\" list together with Yoaz Hendel, presenting the party's demand that Hendel receive the national security portfolio in the next government."
    sources:
