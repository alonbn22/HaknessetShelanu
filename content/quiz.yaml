          he: "ג'בארין: הרשימה המשותפת תפעל לחידוש המשא ומתן עם ההנהגה הפלסטינית כדי לקדם הקמת מדינה פלסטינית לצד ישראל."
          en: "\"Jabareen has stated that the Joint List would push for renewed negotiations with Palestinian leadership to advance the establishment of a Palestinian state alongside Israel.\""
