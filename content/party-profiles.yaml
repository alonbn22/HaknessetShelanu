      - date: "2026-08-11"
        text:
          he: "אילוז הגיש את התפטרותו מהכנסת והחזיר את המנדט לליכוד (במקומו נכנס ב-13 באוגוסט שבתאי קטש); סיעת ישראל ביתנו נותרה בת 6 חברים."
          en: "Illouz submitted his resignation from the Knesset, returning the seat to Likud (Shabtai Katash entered on 13 August); the Yisrael Beiteinu faction remains at 6 members."
        sources:
          - { url: "https://www.inn.co.il/news/703704", title: "דן אילוז: \"נתניהו חייב ללכת הביתה\" (2026-08-11)", publisher: "ערוץ 7" }
          - { url: "https://main.knesset.gov.il/mk/apps/faction/faction-lobby?KnessetID=25&FactionID=1096", title: "סיעת הליכוד — חילופי גברי: 13/08/2026 שבתאי קטש נכנס במקום דן אילוז (2026-09-19)", publisher: "הכנסת" }
      - date: "2026-09-06"
        text:
          he: "המפלגה הציגה את רשימתה לכנסת ה-26 (25 מועמדים): ליברמן, רפי בן שטרית (ראש עיריית בית שאן לשעבר, לשעבר בליכוד) במקום השני, טליה לנקרי, עודד פורר, יוליה מלינובסקי, שרון שרעבי, חמד עמאר, יבגני סובה, אלוירה קוליחמן, ודן אילוז במקום העשירי; ח\"כ שרון ניר אינה ברשימה. הרשימה הוגשה לוועדת הבחירות כרשימה מס' 11 (אות מבוקשת ל)."
          en: "The party unveiled its 26th-Knesset list (25 candidates): Lieberman, Rafi Ben Shitrit (former Beit She’an mayor, ex-Likud) second, Talia Lankri, Oded Forer, Yulia Malinovsky, Sharon Sharabi, Hamad Amar, Evgeny Sova, Elvira Kulikhman, and Dan Illouz tenth; MK Sharon Nir is not on the list. It was submitted to the CEC as list no. 11 (requested letter ל)."
        sources:
          - { url: "https://www.timesofisrael.com/bennett-liberman-unveil-byachad-yisrael-beytenu-knesset-slates-for-upcoming-election/", title: "Anti-Netanyahu leaders Bennett and Liberman unveil their parties’ Knesset election slates (2026-09-06)", publisher: "The Times of Israel" }
          - { url: "https://www.israelhayom.co.il/news/politics/article/21366291", title: "הפתעה במקום השני: נחשפה רשימת ישראל ביתנו; ליברמן עקץ את איזנקוט (2026-09-06)", publisher: "ישראל היום" }
          - { url: "https://beytenu.org.il/%D7%A8%D7%A9%D7%99%D7%9E%D7%AA-%D7%9E%D7%A4%D7%9C%D7%92%D7%AA-%D7%99%D7%A9%D7%A8%D7%90%D7%9C-%D7%91%D7%99%D7%AA%D7%A0%D7%95-%D7%9C%D7%9B%D7%A0%D7%A1%D7%AA-%D7%94%D7%91%D7%90%D7%94/", title: "רשימת מפלגת ישראל ביתנו לכנסת הבאה (2026-09-06)", publisher: "ישראל ביתנו (אתר המפלגה)" }
          - { url: "https://www.gov.il/he/pages/israel-beitenu_list11", title: "רשימה 11 — ישראל ביתנו בראשות אביגדור ליברמן (2026-09-07)", publisher: "ועדת הבחירות המרכזית לכנסת (gov.il)" }
      - date: "2026-09-10"
        text:
          he: "ישראל ביתנו חתמה על הסכם עודפים עם רשימת \"ביחד\" בראשות נפתלי בנט (באותו יום נחתם הסכם דומה בין ישר! לדמוקרטים)."
          en: "Yisrael Beiteinu signed a surplus-vote agreement with Naftali Bennett’s “Together” list (the same day Yashar and The Democrats signed a parallel agreement)."
        sources:
          - { url: "https://www.jpost.com/israel-election-2026/article-908296", title: "Bennett-Liberman, Eisenkot-Golan: Opposition parties sign surplus vote-sharing agreement (2026-09-10)", publisher: "The Jerusalem Post" }
