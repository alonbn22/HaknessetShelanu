facts:
  - key: election-date
    label: { he: "מועד הבחירות", en: "Election date" }
    value: { he: "יום שלישי, ט\"ז בחשוון התשפ\"ז — 27 באוקטובר 2026", en: "Tuesday, 16 Cheshvan 5787 — October 27, 2026" }
    detail:
      he: "המועד נקבע על ידי יו\"ר ועדת הבחירות המרכזית, שופט בית המשפט העליון נעם סולברג, ועוגן גם בחקיקה במליאת הכנסת ביולי 2026."
      en: "The date was set by Central Elections Committee chair Justice Noam Sohlberg and was also anchored in legislation by the Knesset plenum in July 2026."
    status: confirmed
    sources:
      - url: "https://www.gov.il/he/departments/central-elections-committee/govil-landing-page"
        title: "ועדת הבחירות המרכזית לכנסת — הבחירות לכנסת ה-26"
        publisher: "gov.il / ועדת הבחירות"
      - url: "https://www.timesofisrael.com/judge-sets-date-for-next-scheduled-elections-for-october-2026/"
        title: "October 27, 2026: Judge sets date for next scheduled elections"
        publisher: "The Times of Israel"
      - url: "https://www.zman.co.il/live/705042/"
        title: "לוח הזמנים לבחירות לכנסת"
        publisher: "Zman Yisrael"
  - key: full-term
    label: { he: "קדנציה מלאה", en: "A full term" }
    detail:
      he: "הכנסת ה-25 (נבחרה ב-1.11.2022, הושבעה ב-15.11.2022) השלימה קדנציה מלאה והתפזרה ב-17 ביולי 2026 — על פי דיווחים, הפעם הראשונה מאז 1988 שהבחירות מתקיימות במועדן החוקי המלא."
      en: "The 25th Knesset (elected Nov 1, 2022, sworn in Nov 15, 2022) completed a full term and dispersed on July 17, 2026 — per reports, the first time since 1988 that elections are held on their full statutory date."
    status: reported
    sources:
      - url: "https://www.aljazeera.com/news/2026/7/17/knesset-dissolves-how-will-israel-vote-in-octobers-general-election"
        title: "Knesset dissolves: How will Israel vote in October's general election?"
        publisher: "Al Jazeera"
      - url: "https://www.timesofisrael.com/knesset-expected-to-dissolve-july-17-paving-way-for-october-27-election/"
        title: "Knesset expected to dissolve July 17, paving way for October 27 election"
        publisher: "The Times of Israel"
  - key: statutory-basis
    label: { he: "הבסיס החוקי למועד", en: "Statutory basis for the date" }
    detail:
      he: "לפי חוק-יסוד: הכנסת (סעיפים 8–9), בתום כהונה מלאה הבחירות מתקיימות ביום שלישי בחודש חשוון; מכאן נגזר המועד 27 באוקטובר 2026 — המועד המאוחר ביותר המותר בחוק."
      en: "Under Basic Law: The Knesset (sections 8–9), after a full term elections are held on a Tuesday in the Hebrew month of Cheshvan; this yields October 27, 2026 — the latest date permitted by law."
    status: scheduled-by-law
    sources:
      - url: "https://en.wikipedia.org/wiki/2026_Israeli_legislative_election"
        title: "2026 Israeli legislative election"
        publisher: "Wikipedia"
      - url: "https://www.timesofisrael.com/judge-sets-date-for-next-scheduled-elections-for-october-2026/"
        title: "October 27, 2026: Judge sets date for next scheduled elections"
        publisher: "The Times of Israel"
  - key: list-deadline
    label: { he: "הגשת רשימות המועמדים", en: "Candidate-list submission" }
    value: { he: "צפוי בסביבות 9-10 בספטמבר 2026", en: "Expected around September 9–10, 2026" }
    detail:
      he: "הרשימות מוגשות לוועדת הבחירות המרכזית בסביבות היום ה-47 שלפני הבחירות; יש דיווח אחד (i24NEWS) על 7 בספטמבר — המועד המדויק טעון פרסום רשמי של ועדת הבחירות."
      en: "Lists are submitted to the Central Elections Committee around the 47th day before election day; one report (i24NEWS) says September 7 — the exact date awaits the CEC's official timetable."
    status: reported
    sources:
      - url: "https://www.zman.co.il/live/705042/"
        title: "לוח הזמנים לבחירות לכנסת: המועד האחרון להגשת מועמדות"
        publisher: "Zman Yisrael"
