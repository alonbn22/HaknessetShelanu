      he: "מקום 16 ברשימת \"ביחד\" (בנט–לפיד) לבחירות 2026"
      en: "Slot 16 on the \"Beyachad\" (Bennett–Lapid) list for the 2026 election"
    description:
      he: "ב-5 בספטמבר 2026 הציג יאיר לפיד את נציגי יש עתיד לריצה המשותפת עם נפתלי בנט, ובליאק שובץ במקום השביעי ברשימת יש עתיד. ברשימת \"ביחד\" המאוחדת לכנסת ה-26, שהוצגה ב-6 בספטמבר 2026, הוא מופיע במקום ה-16."
      en: "On 5 September 2026 Yair Lapid unveiled Yesh Atid's representatives for the joint run with Naftali Bennett, with Beliak placed seventh on the Yesh Atid slate. On the merged \"Beyachad\" list for the 26th Knesset, presented on 6 September 2026, he appears in 16th place."
