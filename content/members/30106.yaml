    title:
      he: "יושבת ראש הוועדה המיוחדת לצעירים בישראל"
      en: "Chair of the Special Committee on Young Israelis"
    description:
      he: "ביוני 2024 נבחרה נעמה לזימי ליושבת ראש הוועדה המיוחדת לצעירים בישראל בכנסת ה-25, ובמסגרתה עסקה בין היתר בחסמי השתלבות של צעירים. היא חברה גם בוועדת הכספים ובוועדת החינוך, התרבות והספורט."
      en: "In June 2024 Naama Lazimi was elected chair of the Knesset's Special Committee on Young Israelis in the 25th Knesset, in which capacity she addressed issues including integration barriers facing young people. She also sits on the Finance Committee and the Education, Culture and Sports Committee."
