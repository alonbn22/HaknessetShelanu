        title: Yariv Levin
        publisher: Jewish Virtual Library
  - kind: negative
    category: controversy
    status: ongoing
    date: 2023-01-04
    title:
      he: אדריכל הרפורמה המשפטית של 2023
      en: Architect of the 2023 judicial reform
      ar: مهندس الإصلاح القضائي لعام 2023
      ru: Архитектор судебной реформы 2023 года
    description:
      he: בינואר 2023, כשר המשפטים, הציג לוין תוכנית מקיפה לשינוי מערכת המשפט שעוררה מחאות נרחבות; בינואר 2024 פסל בית המשפט העליון את תיקון עילת הסבירות שנחקק במסגרתה. במרץ 2025 אישרה הכנסת את התיקון שקידם לשינוי הרכב הוועדה לבחירת שופטים, שייכנס לתוקף עם כינון הכנסת הבאה. ביוני 2026 הורה בג"ץ ללוין לכנס את הוועדה לבחירת שופטים וקבע פה אחד כי עליו לשתף פעולה עם נשיא בית המשפט העליון יצחק עמית, שבמינויו סירב לוין להכיר; בהמשך אותו חודש התכנסה הוועדה ובחרה 68 בעלי תפקידים שיפוטיים לאחר הקפאה של כשנה וחצי.
      en: In January 2023, as Justice Minister, Levin announced a sweeping program to change Israel's judicial system, prompting widespread protests; in January 2024 the Supreme Court struck down the reasonableness amendment enacted under it. In March 2025 the Knesset passed his amendment changing the composition of the Judicial Selection Committee, set to take effect when the next Knesset convenes. In June 2026 the High Court of Justice ordered Levin to convene the Judicial Selection Committee and ruled unanimously that he must cooperate with Supreme Court President Isaac Amit, whose appointment Levin had declined to recognize; later that month the committee convened and selected 68 judicial officials after a freeze of about a year and a half.
    sources:
