      he: כיהנה כסגנית שר האוצר (2022-2023)
      en: Served as Deputy Minister of Finance (2022-2023)
    description:
      he: לאחר הבחירות לכנסת ה-25 מונתה וולדיגר לסגנית שר האוצר בממשלה שבראשה עמד
        בנימין נתניהו, תחת שר האוצר בצלאל סמוטריץ' מהציונות הדתית. באוקטובר 2023
        התפטרה מתפקידה והודיעה כי היא מפנה את תקציב לשכתה ואת זמנה למאמץ המלחמתי
        ולסיוע לנפגעי הטראומה בעקבות מתקפת 7 באוקטובר.
      en: Following the 2022 election, Waldiger was appointed Deputy Minister of
        Finance in the government led by Benjamin Netanyahu, under Finance
        Minister Bezalel Smotrich of the Religious Zionist Party. In October
        2023 she resigned the post, announcing she was redirecting her office's
        budget and her own time to the war effort and to aiding those
        traumatized by the October 7 attack.
    date: 2023-10-26
