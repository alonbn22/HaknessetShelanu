  - kind: positive
    category: achievement
    title:
      he: "עורך ראשי של עיתון 'ישראל היום'"
      en: "Editor-in-chief of Israel Hayom"
    description:
      he: "לפני כניסתו לפוליטיקה היה ביסמוט עיתונאי ותיק. הוא כיהן כעורך הראשי של 'ישראל היום' מ-2017 עד ינואר 2022, ולפני כן שימש שנים רבות ככתב ועורך לענייני חוץ, בין היתר כשליח 'ידיעות אחרונות' בפריז (1990–2004), ודיווח ממדינות ערב ומאיראן."
      en: "Before entering politics, Bismuth had a long career in journalism. He was editor-in-chief of Israel Hayom from 2017 until January 2022, and earlier worked for many years as a foreign-affairs correspondent and editor, including as Yedioth Ahronoth's Paris correspondent (1990–2004), reporting from Arab countries and Iran."
      ar: "قبل دخوله السياسة كان بيسموت صحفيًا مخضرمًا. شغل منصب رئيس تحرير صحيفة «يسرائيل هيوم» من 2017 حتى كانون الثاني/يناير 2022، وقبل ذلك عمل سنوات طويلة مراسلًا ومحررًا للشؤون الخارجية، ومن ذلك مراسلًا لصحيفة «يديعوت أحرونوت» في باريس (1990–2004)، وغطّى أحداثًا من دول عربية ومن إيران."
      ru: "До прихода в политику Бисмут был опытным журналистом. С 2017 года до января 2022 года он был главным редактором газеты «Исраэль ха-Йом», а до этого много лет работал корреспондентом и редактором по международным делам, в том числе корреспондентом «Едиот ахронот» в Париже (1990–2004), и вёл репортажи из арабских стран и Ирана."
      es: "Antes de entrar en política, Bismuth fue un periodista veterano. Fue director de Israel Hayom de 2017 a enero de 2022, y antes trabajó muchos años como corresponsal y editor de asuntos exteriores, entre otros como corresponsal de Yedioth Ahronoth en París (1990–2004), e informó desde países árabes y desde Irán."
      fr: "Avant d’entrer en politique, Bismuth était un journaliste chevronné. Il a été rédacteur en chef d’Israel Hayom de 2017 à janvier 2022, et avait auparavant travaillé de nombreuses années comme correspondant et rédacteur aux affaires étrangères, notamment comme correspondant de Yedioth Ahronoth à Paris (1990-2004), et fait des reportages depuis des pays arabes et l’Iran."
    date: "2017"
