  - kind: negative
    category: controversy
    status: settled
    title:
      he: ניגוד עניינים בקידום חוק מח"ש - קביעת ועדת האתיקה
      en: Conflict of interest in advancing the Mahash bill - Ethics Committee finding
    description:
      he: ביולי 2023 קבעה ועדת האתיקה של הכנסת, בעקבות פנייה, כי קידום הצעת חוק על ידי
        חבר כנסת המנהל הליך משפטי נגד גורם הקשור להצעה מהווה ניגוד עניינים -
        בהתייחס לכך שסעדה קידם את חוק מח"ש בעודו מנהל תביעה נגד אותה מחלקה בטענת
        התעמרות. בעקבות הקביעה הודיע סעדה כי לא ימשיך לקדם את ההצעה וכי חבר כנסת
        אחר יקדם אותה.
      en: In July 2023 the Knesset Ethics Committee, acting on a complaint, found that
        for an MK to advance a bill while pursuing legal proceedings against an
        entity connected to that bill constitutes a conflict of interest -
        referring to Saada advancing the Mahash bill while pursuing a lawsuit
        against that same department over a workplace-harassment claim.
        Following the finding, Saada announced he would no longer advance the
        bill and that another MK would do so instead.
    date: 2023-07-30
