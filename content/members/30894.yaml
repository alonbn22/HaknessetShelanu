claims:
  - kind: positive
    category: achievement
    title:
      he: "כניסה לכנסת ה-25 כחבר כנסת מטעם תע\"ל (חד\"ש-תע\"ל)"
      en: "Entered the 25th Knesset as a Ta'al MK (Hadash-Ta'al)"
    description:
      he: "סמיר בן סעיד (מתועתק גם סמיר אבו סעיד), יליד עמאן (1979) ותושב שגב שלום, הוצב במקום השישי ברשימת חד\"ש-תע\"ל בבחירות 2022, שזכתה בחמישה מנדטים. לפי רישומי הכנסת החל לכהן כחבר הכנסת ה-25 ב-20 ביוני 2025, מטעם תע\"ל במסגרת סיעת חד\"ש-תע\"ל, לאחר התפטרותו של ח\"כ יוסף עטאונה במסגרת הסכם רוטציה בין נציגי הנגב ברשימה."
      en: "Samir Bin Said (also transliterated Samir Abu Said), born in Amman (1979) and a resident of Segev Shalom, was placed sixth on the Hadash-Ta'al list in the 2022 election, which won five seats. Knesset records show he began serving as a member of the 25th Knesset on 20 June 2025, representing Ta'al within the Hadash-Ta'al faction, after MK Youssef Atauna resigned under a rotation agreement between the list's Negev representatives."
    date: "2025-06-20"
