      en: In February 2025 the attorney general and state attorney ordered an
        investigation into Golan following a Channel 12 report, and in July 2025
        it was expanded into a full criminal investigation on suspicion of
        bribery, fraud and breach of trust relating to her nonprofit activity
        and ministry appointments. In June 2026 police completed the
        investigation and recommended that she be prosecuted. Golan denies the
        allegations; no indictment has been filed and she retains the
        presumption of innocence.
