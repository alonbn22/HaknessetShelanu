    title:
      he: "חברת הכנסת ה-25 מטעם יש עתיד"
      en: "Member of the 25th Knesset for Yesh Atid"
    description:
      he: "שלי טל מירון, ילידת ירושלים (1979), נכנסה לכנסת ב-1 בפברואר 2023 מטעם יש עתיד לאחר התפטרותו של יואל רזבוזוב, לאחר שהוצבה במקום ה-25 ברשימה. לפני כן שירתה כשש שנים בחיל האוויר, בין היתר כקצינת מבצעים וכדוברת חיל האוויר, והשתחררה בדרגת סרן; לאחר מכן עבדה כעשור בפיתוח עסקי בחברת הייטק. היא בעלת תואר ראשון בתקשורת ובמדע המדינה מאוניברסיטת תל אביב."
      en: "Shelly Tal Meron, born in Jerusalem (1979), entered the Knesset on 1 February 2023 for Yesh Atid after the resignation of Yoel Razvozov, having been placed 25th on the list. She previously served about six years in the Israeli Air Force, including as an operations officer and as the Air Force spokesperson, leaving with the rank of captain, and then worked for about a decade in business development at a technology company. She holds a BA in communications and political science from Tel Aviv University."
    date: "2023-02-01"
    sources:
