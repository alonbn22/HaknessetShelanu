          he: "\"נשמור על עיקרון הפרדת הרשויות וביצור שלטון החוק, תוך קידום תיקונים הכרחיים, שיגבירו את האמון במערכת המשפט… נקדם את חוק יסוד: החקיקה במתווה שיכלול הסכמה רחבה.\""
