          ru: "за: 23, против: 0, отсутствовали: 1 — и в программе «Вместе»: «Каждый муниципалитет сам решит вопрос общественного транспорта в шаббат… гражданский союз, регистрируемый в МВД»"
          es: "23 a favor, 0 en contra, 1 ausente — y en el programa de Juntos: «Cada autoridad local decidirá por sí misma sobre el transporte público en Shabat… una unión civil registrada en el Ministerio del Interior»"
