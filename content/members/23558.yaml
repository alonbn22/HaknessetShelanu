        title: David Bitan (Q18755548)
        publisher: Wikidata
  - kind: negative
    category: investigation
    status: indicted
    date: 2021-07-06
    title:
      he: כתב אישום בעבירות שוחד ומשפט מתנהל
      en: Indictment on bribery charges and ongoing trial
      ar: لائحة اتهام بجرائم رشوة ومحاكمة جارية
      ru: Обвинительное заключение о взяточничестве и продолжающийся судебный процесс
    description:
      he: 'ב-6 ביולי 2021 הוגש נגד דוד ביטן כתב אישום בעבירות שוחד, מרמה, הפרת אמונים, הלבנת הון ועבירות מס בהיקף כולל של כ-715 אלף ש"ח, והמשפט מתנהל בבית המשפט המחוזי בלוד. בספטמבר 2025 החל ביטן להעיד להגנתו והכחיש את כל האישומים, באומרו: "מעולם לא ביקשתי ולא קיבלתי שוחד". נכון ליולי 2026 טרם ניתנה הכרעת דין.'
      en: 'On July 6, 2021, an indictment was filed against David Bitan on charges of bribery, fraud, breach of trust, money laundering and tax offenses totaling approximately NIS 715,000, and the trial is being conducted at the Lod District Court. In September 2025 Bitan began testifying in his defense and denied all charges, stating: "I never asked for or received bribes in my life." As of July 2026, no verdict has been rendered.'
      ar: في 6 يوليو 2021 قُدمت لائحة اتهام ضد ديفيد بيتان بتهم الرشوة والاحتيال وخيانة الأمانة وغسل الأموال ومخالفات ضريبية بمجموع نحو 715 ألف شيكل، وتجري المحاكمة في المحكمة المركزية في اللد. في سبتمبر 2025 بدأ بيتان الإدلاء بشهادته للدفاع عن نفسه ونفى جميع التهم. حتى يوليو 2026 لم يصدر حكم في القضية.
      ru: 6 июля 2021 года против Давида Битана было выдвинуто обвинительное заключение по обвинениям во взяточничестве, мошенничестве, злоупотреблении доверием, отмывании денег и налоговых нарушениях на общую сумму около 715 тысяч шекелей; процесс проходит в окружном суде Лода. В сентябре 2025 года Битан начал давать показания в свою защиту и отверг все обвинения. По состоянию на июль 2026 года приговор не вынесен.
    sources:
