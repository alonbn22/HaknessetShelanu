    description:
      he: באוקטובר 2020, בעת כהונתה כשרה להגנת הסביבה, נסעה גמליאל מביתה בתל אביב
        לטבריה לתפילות יום כיפור בעת הסגר הארצי השני, ולאחר מכן אובחנה כחיובית
        לקורונה. בעקבות דיווחים שלפיהם מסרה מידע שגוי לחוקרים האפידמיולוגיים,
        נבחנה האפשרות לפתוח בחקירה פלילית. היועץ המשפטי לממשלה אביחי מנדלבליט
        החליט שלא לפתוח בחקירה, קבע כי 'אין בסיס' לטענה שמסרה מידע כוזב ואמר כי
        שיתפה פעולה ומסרה עובדות אמת; הפער יוחס לתקלה במערכת המחשוב של משרד
        הבריאות.
      en: In October 2020, while serving as Minister of Environmental Protection,
        Gamliel travelled from her Tel Aviv home to Tiberias for Yom Kippur
        prayers during Israel's second national lockdown, and was subsequently
        diagnosed with COVID-19. Following reports that she had given incorrect
        information to epidemiological contact tracers, the possibility of a
        criminal investigation was examined. Attorney General Avichai Mandelblit
        decided not to open a probe, finding 'no basis' for the allegation that
        she misled tracers and stating she had 'fully cooperated and provided
        true facts'; the discrepancy was attributed to a Health Ministry
        computer glitch.
