    title:
      he: נחקר באזהרה בפרשת השחיתות בהסתדרות
      en: Questioned under caution in the Histadrut corruption probe
      ar: استُجوب تحت طائلة المسؤولية في قضية الفساد في الهستدروت
      ru: Допрошен под предупреждением по делу о коррупции в Гистадруте
    description:
      he: ב-19 באפריל 2026 נחקר מיקי זוהר באזהרה בלהב 433, במשך כ-12 שעות, בחשד לשוחד, מרמה והפרת אמונים במסגרת פרשת השחיתות בהסתדרות ("יד רוחצת יד"), בקשר לזיקתו לסוכן הביטוח עזרא גבאי; לפי החשד סייע זוהר לגבאי בגיוס לקוחות בתמורה לסיוע פוליטי בפריימריז בליכוד. זוהר נחקר פעם נוספת ב-25 במאי 2026 (חקירה שלישית). זוהר מכחיש כל קשר לפרשה, ובאמצעות בא כוחו מסר כי "החקירה עוסקת בסוגיות פוליטיות טהורות" שאין להן קשר לעבירה פלילית. נכון לדיווחים האחרונים (מאי 2026) מדובר בחקירה בלבד ולא הוגש כתב אישום; חלה חזקת החפות.
      en: On 19 April 2026 Miki Zohar was questioned under caution by the Lahav 433 unit, for some 12 hours, on suspicion of bribery, fraud and breach of trust as part of the Histadrut corruption probe ("One Hand Washes the Other"), over his ties to insurance agent Ezra Gabay; the suspicion is that Zohar helped Gabay recruit clients in return for political help in the Likud primaries. Zohar was questioned again on 25 May 2026 (his third questioning). Zohar denies any connection to the affair, and through his lawyer stated that "the investigation concerns purely political matters" unrelated to any criminal offence. As of the latest reports (May 2026) the matter remains at the investigation stage with no indictment filed; the presumption of innocence applies.
      ar: في 19 أبريل 2026 استُجوب ميكي زوهر تحت طائلة المسؤولية من قبل وحدة لاهف 433 للاشتباه بالرشوة والاحتيال وخيانة الأمانة ضمن قضية الفساد في الهستدروت، على خلفية علاقته بوكيل التأمين عزرا غباي، واستُجوب مجددًا في 25 مايو 2026. ينفي زوهر أي صلة بالقضية. حتى آخر التقارير (مايو 2026) لا تزال القضية في مرحلة التحقيق دون توجيه لائحة اتهام، وتُطبَّق قرينة البراءة.
      ru: 19 апреля 2026 года Мики Зохар был допрошен под предупреждением подразделением «Лахав 433» по подозрению во взяточничестве, мошенничестве и злоупотреблении доверием в рамках дела о коррупции в Гистадруте, в связи с его связями со страховым агентом Эзрой Габаем; повторный допрос состоялся 25 мая 2026 года. Зохар отрицает какую-либо причастность. По последним сообщениям (май 2026 года) дело находится на стадии расследования, обвинительное заключение не предъявлено; действует презумпция невиновности.
