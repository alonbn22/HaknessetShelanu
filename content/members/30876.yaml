    title:
      he: שירות צבאי ורקע ציבורי
      en: Military service and public background
    description:
      he: שקלים, יליד חולון 1974 להורים שעלו מאיראן, שירת בצה"ל בחיל התותחנים בשנים
        1992–1995. בעל תואר ראשון מאוניברסיטת בר-אילן בכלכלה, מדע המדינה
        וסוציולוגיה ותואר שני בתקשורת פוליטית מבר-אילן, והיה פעיל בתחומי הפרסום
        והשיווק לפני כניסתו לכנסת.
      en: Shekalim, born in Holon in 1974 to parents who immigrated from Iran, served
        in the IDF artillery corps from 1992 to 1995. He holds a bachelor's
        degree from Bar-Ilan University in economics, political science and
        sociology and a master's degree in political communication from
        Bar-Ilan, and worked in advertising and marketing before entering the
        Knesset.
