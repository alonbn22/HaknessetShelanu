    title:
      he: יושב ראש ועדת הכלכלה של הכנסת ה-25
      en: Chairman of the Economic Affairs Committee in the 25th Knesset
    description:
      he: ב-10 בינואר 2023 נבחר ביטן פה אחד על ידי חברי ועדת הכלכלה ליושב ראש הוועדה בכנסת ה-25, תפקיד שבו הוא מכהן גם לאחר פיזור הכנסת.
      en: On 10 January 2023 Bitan was elected unanimously by the members of the Knesset Economic Affairs Committee as its chairman in the 25th Knesset, a post he continues to hold after the Knesset's dissolution.
