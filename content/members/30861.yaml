      en: "In the Likud primary held on 17 August 2026, Danino was ranked 29th in the members' vote (before reserved slots were inserted). N12 listed him among the sitting MKs \"pushed\" to places not considered realistic, and he is not among the first 35 places on the final Likud list published on 8 September 2026."
