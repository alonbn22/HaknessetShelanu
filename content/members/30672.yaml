    title:
      he: ראש עיריית ביתר עילית (2001–2007)
      en: Mayor of Beitar Illit (2001–2007)
    description:
      he: יצחק פינדרוס נבחר לראשות עיריית ביתר עילית בשנת 2001, כשהביס את ראש העירייה
        המכהן יהודה גרליץ בהפרש של 162 קולות בלבד. הוא כיהן בתפקיד עד שהפסיד
        בבחירות 2007.
      en: Yitzhak Pindrus was elected mayor of Beitar Illit in 2001, defeating the
        incumbent mayor Yehuda Gerlitz by a margin of just 162 votes. He served
        until losing the 2007 mayoral election.
    date: "2001"
