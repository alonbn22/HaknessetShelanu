  - key: kd-abroad
    date: "2026-10-15"
    label: { he: "הצבעה בכלי שיט ובנציגויות ישראל בחו\"ל", en: "Voting on ships and at Israeli missions abroad", ar: "التصويت على السفن وفي الممثليات الإسرائيلية في الخارج", ru: "Голосование на судах и в израильских представительствах за рубежом", es: "Votación en barcos y en las misiones israelíes en el extranjero", fr: "Vote sur les navires et dans les missions israéliennes à l’étranger" }
    detail:
      he: "רק מי שרשאי להצביע בנציגות (דיפלומטים, שליחים ובני משפחותיהם) ובכלי שיט ישראליים מצביע ביום זה; אין הצבעה כללית מחו\"ל."
      en: "Only those entitled to vote at a mission (diplomats, emissaries and their families) and on Israeli ships vote on this day; there is no general voting from abroad."
      ar: "يصوّت في هذا اليوم فقط أصحاب الحق في التصويت في الممثليات (الدبلوماسيون والمبعوثون وعائلاتهم) وعلى السفن الإسرائيلية؛ لا يوجد تصويت عام من الخارج."
      ru: "В этот день голосуют только те, кто имеет право голосовать в представительстве (дипломаты, посланники и их семьи), и экипажи израильских судов; общего голосования из-за рубежа нет."
      es: "Ese día votan solo quienes tienen derecho a votar en una misión (diplomáticos, enviados y sus familias) y en barcos israelíes; no hay voto general desde el extranjero."
      fr: "Ce jour-là ne votent que les personnes habilitées à voter dans une mission (diplomates, émissaires et leurs familles) et sur les navires israéliens ; il n’y a pas de vote général depuis l’étranger."
    status: confirmed
