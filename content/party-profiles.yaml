  - id: 1104 # Yisrael Beiteinu
    verified: "2026-09-19"
    updates:
      - date: "2026-08-05"
        text:
          he: "ח\"כ דן אילוז, שפרש מהליכוד ביולי 2026, הודיע על הצטרפותו לישראל ביתנו והובטח לו מקום ריאלי ברשימה."
          en: "MK Dan Illouz, who left Likud in July 2026, announced he was joining Yisrael Beiteinu and was promised a realistic slot on its list."
        sources:
          - { url: "https://www.timesofisrael.com/rebel-likud-mk-dan-illouz-joins-yisrael-beytenu-touts-its-national-and-liberal-values/", title: "Rebel Likud MK Dan Illouz joins Yisrael Beytenu, touts its ‘national and liberal values’ (2026-08-05)", publisher: "The Times of Israel" }
