        2025 התפטר מתפקידו במסגרת פרישת ש"ס מהממשלה על רקע משבר חוק הגיוס;
        כהונתו הסתיימה ב-20 ביולי 2025.
      en: With the formation of Israel's 37th government, Abutbul was appointed
        Deputy Minister of Agriculture and Food Security (per Knesset data, from
        3 January 2023), and was given responsibility for animal welfare matters
        among other areas. In July 2025 he resigned as part of Shas's withdrawal
        from the government amid the draft-law crisis; his term ended on 20 July
        2025.
