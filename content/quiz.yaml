  - id: death-penalty
    topic: security
    lean: right
    text:
      he: "יש להטיל עונש מוות על מחבלים."
      en: "Terrorists should face the death penalty."
      ar: "يجب فرض عقوبة الإعدام على الإرهابيين."
      ru: "Террористов следует приговаривать к смертной казни."
      es: "Debería aplicarse la pena de muerte a los terroristas."
      fr: "Les terroristes devraient encourir la peine de mort."
    short:
      he: "עונש מוות למחבלים"
      en: "Death penalty for terrorists"
      ar: "عقوبة الإعدام للإرهابيين"
      ru: "Смертная казнь для террористов"
      es: "Pena de muerte para terroristas"
      fr: "Peine de mort pour les terroristes"
    explainer:
      he: "עד 2026 עונש מוות היה אפשרי בישראל רק בעבירות נדירות, והוצא לפועל פעמיים בלבד, בפעם האחרונה ב-1962 (אייכמן). במרץ 2026 אישרה הכנסת בקריאה שלישית, ברוב של 62 מול 48, חוק הקובע עונש מוות למחבלים שרצחו בפיגוע. התומכים אומרים שהעונש ירתיע וימנע עסקאות שחרור; המתנגדים אומרים שהוא לא מרתיע, פוגע במעמדה של ישראל, ושטעות אי אפשר לתקן."
      en: "Until 2026 the death penalty was possible in Israel only for rare offences, and it was carried out only twice, the last time in 1962 (Eichmann). In March 2026 the Knesset passed, in its third reading and by 62 votes to 48, a law setting the death penalty for terrorists who murdered in an attack. Supporters say it will deter and prevent release deals; opponents say it does not deter, damages Israel's standing, and a mistake cannot be corrected."
      ar: "حتى 2026 كانت عقوبة الإعدام ممكنة في إسرائيل في جرائم نادرة فقط، ونُفّذت مرتين فقط، آخرهما عام 1962 (آيخمان). في آذار/مارس 2026 أقرّ الكنيست بالقراءة الثالثة، بأغلبية 62 صوتًا مقابل 48، قانونًا يفرض الإعدام على الإرهابيين الذين قتلوا في عملية. يقول المؤيدون إن العقوبة ستردع وتمنع صفقات الإفراج؛ ويقول المعارضون إنها لا تردع، وتضرّ بمكانة إسرائيل، وإن الخطأ لا يمكن تصحيحه."
      ru: "До 2026 года смертная казнь в Израиле была возможна лишь за редкие преступления и приводилась в исполнение только дважды, последний раз в 1962 году (Эйхман). В марте 2026 года Кнессет 62 голосами против 48 принял в третьем чтении закон о смертной казни для террористов, совершивших убийство в теракте. Сторонники говорят, что наказание будет сдерживать и предотвратит сделки об освобождении; противники — что оно не сдерживает, вредит положению Израиля и что ошибку нельзя исправить."
      es: "Hasta 2026 la pena de muerte era posible en Israel solo para delitos raros, y se aplicó solo dos veces, la última en 1962 (Eichmann). En marzo de 2026 la Knéset aprobó en tercera lectura, por 62 votos contra 48, una ley que fija la pena de muerte para terroristas que asesinaron en un atentado. Los partidarios dicen que disuadirá y evitará acuerdos de liberación; los opositores dicen que no disuade, daña la posición de Israel y un error no puede corregirse."
      fr: "Jusqu’en 2026, la peine de mort n’était possible en Israël que pour de rares infractions, et elle n’a été appliquée que deux fois, la dernière en 1962 (Eichmann). En mars 2026, la Knesset a adopté en troisième lecture, par 62 voix contre 48, une loi instaurant la peine de mort pour les terroristes ayant tué lors d’un attentat. Les partisans disent qu’elle dissuadera et empêchera les accords de libération ; les opposants disent qu’elle ne dissuade pas, nuit à la position d’Israël et qu’une erreur ne peut être corrigée."
    explainerSources:
      - { url: "https://en.idi.org.il/articles/20689", title: "Knesset Considers Changing Law to Apply Death Penalty to Convicted Terrorists", publisher: "המכון הישראלי לדמוקרטיה" }
      - { url: "https://en.idi.org.il/articles/48231", title: "Death Penalty for Terrorists Bill is Not Constitutional and Will Deal Grievous Harm to Israel", publisher: "המכון הישראלי לדמוקרטיה" }
      - { url: "https://www.jpost.com/israel-news/politics-and-diplomacy/article-891688", title: "Knesset approves death penalty for terrorists bill, Benjamin Netanyahu in favor", publisher: "The Jerusalem Post" }
