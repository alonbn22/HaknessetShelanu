  - kind: positive
    category: achievement
    title:
      he: "יזם את תיקון 35 לחוק מימון מפלגות"
      en: "Initiated Amendment 35 to the Party Financing Law"
    description:
      he: "קיש, יחד עם חברי כנסת נוספים, יזם את תיקון 35 לחוק מימון מפלגות (המכונה 'חוק V15'), שהתקבל במרץ 2017 ומחייב ארגונים ויחידים הפועלים בבחירות כדי לשכנע מצביעים שלא להצביע לרשימה מסוימת להירשם אצל מבקר המדינה."
      en: "Kisch, together with other Knesset members, initiated Amendment 35 to the Party Financing Law (known as the 'V15 law'), enacted in March 2017, which requires organizations and individuals campaigning during elections to persuade voters not to vote for a particular list to register with the State Comptroller."
      ar: "بادر كيش مع أعضاء كنيست آخرين إلى التعديل رقم 35 لقانون تمويل الأحزاب (المعروف باسم «قانون V15»)، الذي أُقرّ في آذار/مارس 2017 ويُلزم المنظمات والأفراد الذين يعملون خلال الانتخابات لإقناع الناخبين بعدم التصويت لقائمة معيّنة بالتسجيل لدى مراقب الدولة."
      ru: "Киш вместе с другими депутатами инициировал поправку № 35 к Закону о финансировании партий (так называемый «закон V15»), принятую в марте 2017 года; она обязывает организации и частных лиц, которые во время выборов агитируют избирателей не голосовать за определённый список, регистрироваться у Государственного контролёра."
      es: "Kisch, junto con otros diputados, impulsó la enmienda 35 a la Ley de Financiación de Partidos (conocida como «ley V15»), aprobada en marzo de 2017, que obliga a las organizaciones y personas que hacen campaña durante las elecciones para convencer a los votantes de no votar por una lista determinada a inscribirse ante el Contralor del Estado."
      fr: "Kisch a été, avec d’autres députés, à l’initiative de l’amendement 35 à la loi sur le financement des partis (dite « loi V15 »), adoptée en mars 2017, qui oblige les organisations et les particuliers faisant campagne pendant les élections pour dissuader les électeurs de voter pour une liste donnée à s’enregistrer auprès du contrôleur de l’État."
    date: "2017-03-01"
