    title:
      he: ראש המועצה המקומית ירוחם (2010–2018)
      en: Mayor of Yeruham (2010–2018)
    description:
      he: מיכאל ביטון כיהן כראש המועצה המקומית ירוחם בין השנים 2010 ל-2018. הוא נבחר
        לראשונה בנובמבר 2010 מטעם קדימה עם כ-44% מהקולות, ונבחר מחדש ב-2014 עם
        כ-70% מהקולות. ביטון היה ממובילי 'מצעד השוויון' שיצא מירוחם וקרא להקצאה
        תקציבית הוגנת יותר לפריפריה.
      en: Michael Biton served as mayor of the development town of Yeruham from 2010
        to 2018. He was first elected in November 2010 as a Kadima candidate
        with about 44% of the vote and re-elected in 2014 with about 70% of the
        vote. He was a leader of the national 'Equality March', which started in
        Yeruham and advocated for fairer budget allocation to Israel's
        periphery.
    date: 2010-11
