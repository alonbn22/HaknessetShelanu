    description:
      he: גואטה, חקלאי ובעל לול לשעבר ממושב גורן ולשעבר חבר הנהלת ארגון מגדלי העופות,
        מכהן כיושב-ראש ועדת המשנה לתחבורה ציבורית בכנסת (לפי נתוני הכנסת, מ-10 בדצמבר 2025) וחבר בוועדת הכלכלה, בוועדת הפנים והגנת הסביבה ובוועדת העלייה, הקליטה והתפוצות, ופועל בעיקר למען החקלאות
        והפריפריה.
      en: Guetta, a farmer and former poultry-farm owner from Moshav Goren and a
        former board member of the poultry breeders' association, chairs the
        Knesset Subcommittee for Public Transportation (per Knesset records, since 10 December 2025) and sits on the Economic Affairs, Interior and Environment, and Immigration and Absorption committees; he is active mainly on
        behalf of agriculture and Israel's periphery.
