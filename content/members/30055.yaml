    title:
      he: "הציונות הדתית תרוץ בבלוק טכני עם \"זהות\" של משה פייגלין"
      en: "Religious Zionism to run in a technical bloc with Moshe Feiglin's Zehut"
    description:
      he: "ב-1 בספטמבר 2026 הודיעו סמוטריץ' ומשה פייגלין על ריצה משותפת של הציונות הדתית ו\"זהות\" בבלוק טכני לבחירות 27 באוקטובר, כדי שקולות הימין לא יאבדו אם אחת המפלגות לא תעבור את אחוז החסימה. סמוטריץ' אמר כי \"הגיעה שעת האחריות\" וקרא למפלגות ימין נוספות להצטרף; לפי הדיווח, הציונות הדתית נמצאת בסקרים על סף אחוז החסימה."
      en: "On 1 September 2026 Smotrich and Moshe Feiglin announced that Religious Zionism and Zehut would run together as a technical bloc in the 27 October election, so that right-wing votes are not lost if either party fails to cross the threshold. Smotrich said \"the time for responsibility has come\" and urged other right-wing parties to join; according to the report, Religious Zionism polls on the cusp of the threshold."
    sources:
