      en: On 29 December 2022, Amir Ohana was elected Speaker of the Knesset, becoming
        the first openly gay person to hold the post in the parliament's
        history. He was elected alongside the swearing-in of Benjamin
        Netanyahu's 37th government, and continues in the post after the 25th Knesset's dissolution in July 2026.
