    date: 2026-08-31
    title:
      he: הודיע כי לא יתמודד בבחירות 2026 ויכהן כאב בית הדין של יש עתיד
      en: Announced he will not run in the 2026 election and will head the Yesh Atid party court
    description:
      he: ב-31 באוגוסט 2026, לאחר פגישה עם יאיר לפיד, הודיע לוי, ממייסדי יש עתיד, כי
        לא ייכלל ברשימת המפלגה לכנסת ה-26 וכי לבקשת לפיד יכהן כאב בית הדין של
        המפלגה. "אני לא אהיה ברשימה, אבל אני נשאר ביש עתיד", אמר. לוי היה בין
        חמישה חברי כנסת של יש עתיד שהודיעו באותו שבוע על פרישה מהמרוץ.
      en: On 31 August 2026, after meeting Yair Lapid, Levy, a founding member of
        Yesh Atid, announced he would not be on the party's list for the 26th
        Knesset and would, at Lapid's request, head the party's internal
        court. "I won't be on the list, but I'm staying with Yesh Atid," he
        said. Levy was one of five Yesh Atid MKs who announced that week that
        they were not running.
