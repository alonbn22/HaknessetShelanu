  - kind: negative
    category: investigation
    status: ongoing
    date: 2026-06-17
    title:
      he: חקירה בפרשת הדרכונים הדיפלומטיים
      en: Investigation in the diplomatic passports affair
      ar: تحقيق في قضية جوازات السفر الدبلوماسية
      ru: Расследование по делу о дипломатических паспортах
    description:
      he: אלי כהן נחקר בחשד להפרת אמונים בקשר להנפקת דרכונים דיפלומטיים בתקופת כהונתו כשר החוץ (החקירה נפתחה בינואר 2024 באישור היועצת המשפטית לממשלה). ב-17 ביוני 2026 הודיעה המשטרה שסיימה את החקירה וכי לעמדתה קיימת תשתית ראייתית להעמדתו לדין, והתיק הועבר לפרקליטות המדינה; נכון ל-18 בספטמבר 2026 לא דווח על שימוע או על כתב אישום, וההחלטה מצויה בידי הפרקליטות והיועצת המשפטית לממשלה. כהן מכחיש עבירה, מסר כי החקירה "לא הייתה צריכה להיפתח כלל", כי בתקופתו הונפקו ארבעה דרכונים דיפלומטיים בלבד על ידי מנכ"ל המשרד ובסמכות, וכי הוא בטוח שהצדק יצא לאור.
      en: Eli Cohen was questioned on suspicion of breach of trust over the issuance of diplomatic passports during his tenure as foreign minister (the investigation was opened in January 2024 with the Attorney General's approval). On 17 June 2026 Israel Police announced they had completed the investigation and that, in their view, there was an evidentiary basis to charge him; the file was transferred to the State Attorney's Office. As of 18 September 2026 no pre-indictment hearing or indictment had been reported, and the decision rests with the State Attorney and the Attorney General. Cohen denies wrongdoing, said the investigation "should not have been opened at all", that only four diplomatic passports were issued in his time, all by the ministry's director-general within his authority, and that he is confident justice will prevail.
      ar: تم استجواب إيلي كوهين للاشتباه في خيانة الأمانة بشأن إصدار جوازات سفر دبلوماسية خلال فترة توليه منصب وزير الخارجية. في 17 يونيو 2026 أعلنت الشرطة أنها أنهت التحقيق وأن هناك أساسًا ثبوتيًا لاتهامه، وأُحيل الملف إلى النيابة. حتى 18 سبتمبر 2026 لم يُبلَّغ عن جلسة استماع أو لائحة اتهام، والقرار بيد النيابة والمستشارة القضائية للحكومة. ينفي كوهين ارتكاب أي مخالفة ويقول إن التحقيق ما كان ينبغي أن يُفتح أصلًا وإن كل شيء تم وفق الصلاحيات.
      ru: Эли Коэн был допрошен по подозрению в злоупотреблении доверием в связи с выдачей дипломатических паспортов в период его работы министром иностранных дел. 17 июня 2026 года полиция заявила о завершении расследования и о наличии доказательной базы для предъявления обвинения; дело передано в прокуратуру. По состоянию на 18 сентября 2026 года о слушании или обвинительном заключении не сообщалось; решение остаётся за прокуратурой и юридическим советником правительства. Коэн отрицает вину, заявляя, что расследование вообще не следовало открывать и что всё было сделано в рамках полномочий.
