      he: "יושב ראש הכנסת (2013–2020) ושר בשלוש ממשלות"
      en: "Speaker of the Knesset (2013–2020) and minister in three governments"
    description:
      he: "אדלשטיין כיהן כשר לקליטת העלייה (1996–1999), כשר ההסברה והתפוצות (2009–2013) וכשר הבריאות (2020–2021). ב-18 במרץ 2013 נבחר ליושב ראש הכנסת, נבחר מחדש ב-2015 וב-2019 וכיהן בתפקיד עד 25 במרץ 2020."
      en: "Edelstein served as Minister of Immigrant Absorption (1996–1999), Minister of Public Diplomacy and Diaspora Affairs (2009–2013) and Minister of Health (2020–2021). On 18 March 2013 he was elected Speaker of the Knesset, was re-elected in 2015 and 2019, and held the post until 25 March 2020."
