    title:
      he: נפסלה ממועמדות לבחירות 2015 בשל אי-השלמת תקופת צינון
      en: Disqualified from 2015 candidacy over cooling-off period
    description:
      he: בינואר 2015 פסל יו"ר ועדת הבחירות המרכזית, השופט סלים ג'ובראן, את מועמדותה
        של מלקו ברשימת מפלגת כולנו לבחירות לכנסת ה-20, בקביעה שלא השלימה את
        תקופת הצינון בת 100 הימים הנדרשת לאחר סיום תפקידה כמנהלת רשת א' ברשות
        השידור. מדובר בהחלטה מנהלית של ועדת הבחירות ולא בהליך פלילי.
      en: In January 2015 the chairman of the Central Elections Committee, Judge Salim
        Joubran, disqualified Melaku's candidacy on the Kulanu party list for
        the 20th Knesset election, ruling that she had not completed the
        mandatory 100-day cooling-off period after leaving her post as director
        of Reshet Aleph at the Israeli Broadcasting Authority. This was an
        administrative elections-committee ruling, not a criminal proceeding.
