# Editorial — a curated, neutral, sourced list of especially controversial laws
# and legislative episodes in Israel. Each entry cites primary sources: the law
# as published in Reshumot (the Knesset's copy), the Supreme Court's rulings, a
# government decision, and an outlet's own report; never Wikipedia (a test).
# Describe factually what the law does AND why it was contested (both sides),
# without taking a position. Re-checked against those sources on 2 Oct 2026.
laws:
  - year: 2023
    title:
      he: "הרפורמה המשפטית והצעת חוק הסבירות (2023)"
      en: "The judicial reform and the reasonableness bill (2023)"
      ar: "الإصلاح القضائي ومشروع قانون «المعقولية» (2023)"
      ru: "Судебная реформа и законопроект о «разумности» (2023)"
      es: "La reforma judicial y la ley de razonabilidad (2023)"
      fr: "La réforme judiciaire et la loi sur le caractère raisonnable (2023)"
    summary:
      he: "חבילת שינויים שנועדה לצמצם את כוחו של בית המשפט העליון ולשנות את מאזן הכוחות בין הרשויות. היא הוצגה בינואר 2023 ועוררה חודשים של מחאות המוניות. תיקון 'עילת הסבירות' אושר ביולי 2023; תומכים ראו בו חיזוק נבחרי הציבור, מתנגדים ראו בו פגיעה באיזונים ובבלמים. בג\"ץ ביטל את התיקון בינואר 2024."
      en: "A package meant to curb the Supreme Court's power and shift the balance among the branches of government. Unveiled in January 2023, it drew months of mass protests. The 'reasonableness' amendment passed in July 2023; supporters saw it as strengthening elected officials, opponents as weakening checks and balances. The High Court struck the amendment down in January 2024."
      ar: "حزمة تعديلات هدفت إلى تقليص صلاحيات المحكمة العليا وتغيير ميزان القوى بين السلطات. عُرضت في كانون الثاني/يناير 2023 وأثارت احتجاجات جماهيرية استمرت شهورًا. أُقرّ تعديل «ذريعة المعقولية» في تموز/يوليو 2023؛ رأى المؤيدون فيه تعزيزًا لمكانة منتخَبي الجمهور، ورأى المعارضون فيه مساسًا بالضوابط والتوازنات. وألغت محكمة العدل العليا التعديل في كانون الثاني/يناير 2024."
      ru: "Пакет изменений, призванный ограничить полномочия Верховного суда и изменить баланс между ветвями власти. Представленный в январе 2023 года, он вызвал многомесячные массовые протесты. Поправка о «критерии разумности» была принята в июле 2023 года; сторонники видели в ней усиление избранных представителей, противники — ослабление системы сдержек и противовесов. В январе 2024 года БАГАЦ отменил поправку."
      es: "Un paquete destinado a limitar el poder del Tribunal Supremo y cambiar el equilibrio entre los poderes del Estado. Presentado en enero de 2023, desató meses de protestas masivas. La enmienda de la «razonabilidad» se aprobó en julio de 2023; sus partidarios la veían como un refuerzo de los cargos electos, sus detractores como un debilitamiento de los contrapesos. El Tribunal Supremo la anuló en enero de 2024."
      fr: "Un ensemble de mesures visant à limiter le pouvoir de la Cour suprême et à déplacer l’équilibre entre les pouvoirs. Présenté en janvier 2023, il a suscité des mois de manifestations massives. L’amendement sur le « caractère raisonnable » a été adopté en juillet 2023 ; ses partisans y voyaient un renforcement des élus, ses opposants un affaiblissement des contre-pouvoirs. La Haute Cour l’a annulé en janvier 2024."
    sources:
      - { url: "https://fs.knesset.gov.il/25/law/25_lsr_2997865.pdf", title: "חוק-יסוד: השפיטה (תיקון מס' 3) — ספר החוקים 3066, 26.7.2023 (התקבל בכנסת ב-24 ביולי 2023)", publisher: "הכנסת" }
      - { url: "https://supremedecisions.court.gov.il/Home/Download?path=HebrewVerdicts%2F23%2F580%2F056%2Fv31&fileName=23056580.V31&type=2", title: "בג\"ץ 5658/23 — פסק הדין (1 בינואר 2024)", publisher: "בית המשפט העליון" }
      - { url: "https://www.timesofisrael.com/justice-minister-unveils-plan-to-shackle-the-high-court-overhaul-israels-judiciary/", title: "Justice minister unveils plan to shackle the High Court, overhaul Israel’s judiciary (4 Jan 2023)", publisher: "The Times of Israel" }
      - { url: "https://www.timesofisrael.com/coalition-passes-1st-judicial-overhaul-law-limiting-review-of-government-decisions/", title: "Coalition passes 1st judicial overhaul law, limiting review of government decisions (24 Jul 2023)", publisher: "The Times of Israel" }
    # The roll-call behind the law, from the Knesset record (vote 39803 in the
    # site's own record and in the Knesset's OData). The second reading is the
    # one where every faction voted; in the third reading (vote 39785, 64–0)
    # the opposition factions did not take part, so it shows no "against".
    votes:
      - id: 39803
        stage: { he: "קריאה שנייה, 24 ביולי 2023", en: "second reading, 24 July 2023", ar: "القراءة الثانية، 24 تموز/يوليو 2023", ru: "второе чтение, 24 июля 2023 года", es: "segunda lectura, 24 de julio de 2023", fr: "deuxième lecture, 24 juillet 2023" }
        note:
          he: "בקריאה השלישית (64–0) סיעות האופוזיציה לא השתתפו בהצבעה; לכן מוצגת הקריאה השנייה, שבה הצביעו כולם."
          en: "In the third reading (64–0) the opposition factions did not take part; the second reading, in which everyone voted, is shown."
          ar: "في القراءة الثالثة (64–0) لم تشارك كتل المعارضة في التصويت؛ لذلك تُعرض القراءة الثانية التي صوّت فيها الجميع."
          ru: "В третьем чтении (64 — 0) фракции оппозиции не участвовали в голосовании, поэтому показано второе чтение, в котором голосовали все."
          es: "En la tercera lectura (64–0) las facciones de la oposición no participaron; se muestra la segunda lectura, en la que votaron todos."
          fr: "Lors de la troisième lecture (64–0), les factions de l’opposition n’ont pas pris part au vote ; la deuxième lecture, où tout le monde a voté, est affichée."
        source: { url: "https://knesset.gov.il/OdataV4/ParliamentInfo/KNS_PlenumVote(39803)", title: "חוק-יסוד: השפיטה (תיקון מס' 3) — לקבל בקריאה שנייה, 24.7.2023", publisher: "הכנסת" }
  - year: 2018
    title:
      he: "חוק הלאום (2018)"
      en: "The Nation-State Law (2018)"
      ar: "قانون القومية (2018)"
      ru: "Закон о национальном государстве (2018)"
      es: "La Ley del Estado-Nación (2018)"
      fr: "La loi sur l’État-nation (2018)"
    summary:
      he: "חוק יסוד המגדיר את ישראל כמדינת הלאום של העם היהודי. תומכים ראו בו עיגון אופייה היהודי של המדינה; מבקרים, ובהם בני העדה הדרוזית ואזרחים ערבים, טענו שהוא פוגע במעמד המיעוטים ואינו מזכיר שוויון. בג\"ץ דחה ב-2021 עתירות לביטולו."
      en: "A Basic Law defining Israel as the nation-state of the Jewish people. Supporters saw it as anchoring the state's Jewish character; critics — including Druze and Arab citizens — argued it downgrades minorities and omits any mention of equality. The High Court rejected petitions against it in 2021."
      ar: "قانون أساس يعرّف إسرائيل بوصفها الدولة القومية للشعب اليهودي. رأى فيه المؤيدون ترسيخًا للطابع اليهودي للدولة؛ أما المنتقدون، ومنهم أبناء الطائفة الدرزية والمواطنون العرب، فقالوا إنه يمسّ بمكانة الأقليات ولا يذكر المساواة. ورفضت محكمة العدل العليا في 2021 التماسات لإلغائه."
      ru: "Основной закон, определяющий Израиль как национальное государство еврейского народа. Сторонники видели в нём закрепление еврейского характера государства; критики, в том числе друзы и арабские граждане, утверждали, что он ущемляет статус меньшинств и не упоминает равенства. В 2021 году БАГАЦ отклонил петиции о его отмене."
      es: "Una Ley Fundamental que define a Israel como el Estado-nación del pueblo judío. Sus partidarios la veían como un anclaje del carácter judío del Estado; sus críticos — incluidos ciudadanos drusos y árabes — sostenían que rebaja a las minorías y omite toda mención a la igualdad. El Tribunal Supremo rechazó los recursos contra ella en 2021."
      fr: "Une Loi fondamentale définissant Israël comme l’État-nation du peuple juif. Ses partisans y voyaient l’ancrage du caractère juif de l’État ; ses détracteurs — dont des citoyens druzes et arabes — estimaient qu’elle rabaisse les minorités et omet toute mention de l’égalité. La Haute Cour a rejeté les recours en 2021."
    sources:
      - { url: "https://fs.knesset.gov.il/20/law/20_lsr_504220.pdf", title: "חוק-יסוד: ישראל – מדינת הלאום של העם היהודי — ספר החוקים 2743, 26.7.2018 (התקבל בכנסת ב-19 ביולי 2018)", publisher: "הכנסת" }
      - { url: "https://supremedecisions.court.gov.il/Home/Download?path=HebrewVerdicts%2F18%2F550%2F055%2Fv36&fileName=18055550.V36&type=2", title: "בג\"ץ 5555/18 — פסק הדין (8 ביולי 2021)", publisher: "בית המשפט העליון" }
      - { url: "https://www.timesofisrael.com/knesset-votes-contentious-jewish-nation-state-bill-into-law/", title: "Israel passes Jewish state law, enshrining ‘national home of the Jewish people’ (19 Jul 2018)", publisher: "The Times of Israel" }
      - { url: "https://www.timesofisrael.com/tens-of-thousands-gather-in-tel-aviv-to-protest-controversial-nation-state-law/", title: "Druze-led rally against nation-state law in Tel Aviv draws at least 50,000 (4 Aug 2018)", publisher: "The Times of Israel" }
  - year: 2011
    title:
      he: "חוק הנכבה (2011)"
      en: "The Nakba Law (2011)"
      ar: "قانون النكبة (2011)"
      ru: "«Закон о Накбе» (2011)"
      es: "La Ley de la Nakba (2011)"
      fr: "La loi sur la Nakba (2011)"
    summary:
      he: "תיקון המסמיך את שר האוצר להפחית מהתקציב של גופים הממומנים או הנתמכים על ידי המדינה, אם הוציאו כסף על פעילות כגון ציון יום העצמאות כיום אבל או שלילת קיומה של ישראל כמדינה יהודית ודמוקרטית (החוק מונה חמש עילות כאלה; ההפחתה לא תעלה על פי שלושה מההוצאה). מבקריו טענו שהוא פוגע בחופש הביטוי ובזיכרון ההיסטורי של המיעוט הערבי; מגיניו בבית המשפט טענו שכל שנקבע בו הוא שהמדינה לא תשתתף במימון פעילויות אלה. ב-2012 דחה בג\"ץ עתירה נגדו כמוקדמת, בלי להכריע בשאלות החוקתיות."
      en: "An amendment allowing the Finance Minister to reduce the state funding of state-funded or state-supported bodies that spend money on activity such as marking Independence Day as a day of mourning or denying Israel's existence as a Jewish and democratic state (the law lists five such grounds; a cut may not exceed three times the expense). Critics said it harms freedom of expression and the Arab minority's historical memory; its defenders in court said it only means the state will not fund such activity. In 2012 the High Court dismissed a petition against it as premature, without ruling on the constitutional questions."
      ar: "تعديل يخوّل وزير المالية تقليص تمويل الدولة لهيئات تموّلها الدولة أو تدعمها إذا أنفقت أموالًا على نشاط مثل إحياء يوم الاستقلال يومَ حداد أو إنكار وجود إسرائيل دولةً يهودية وديمقراطية (يعدّد القانون خمسة أسباب من هذا النوع، ولا يجوز أن يتجاوز التقليص ثلاثة أضعاف النفقة). قال منتقدوه إنه يمسّ بحرية التعبير وبالذاكرة التاريخية للأقلية العربية؛ وقال المدافعون عنه أمام المحكمة إن كل ما ينصّ عليه هو أن الدولة لن تموّل مثل هذا النشاط. وفي 2012 ردّت محكمة العدل العليا التماسًا ضده لأنه سابق لأوانه، من دون البتّ في المسائل الدستورية."
      ru: "Поправка, позволяющая министру финансов сокращать государственное финансирование учреждений, получающих бюджет или поддержку от государства, если они тратят средства на такую деятельность, как отмечание Дня независимости как дня траура или отрицание существования Израиля как еврейского и демократического государства (закон перечисляет пять таких оснований; сокращение не может превышать трёхкратную сумму расхода). Критики говорили, что она ущемляет свободу слова и историческую память арабского меньшинства; защитники закона в суде утверждали, что он лишь означает, что государство не будет финансировать такую деятельность. В 2012 году БАГАЦ отклонил петицию против него как преждевременную, не вынося решения по конституционным вопросам."
      es: "Una enmienda que permite al ministro de Finanzas reducir la financiación estatal de entidades financiadas o subvencionadas por el Estado que gasten dinero en actividades como conmemorar el Día de la Independencia como día de duelo o negar la existencia de Israel como Estado judío y democrático (la ley enumera cinco motivos de este tipo; la reducción no puede superar el triple del gasto). Sus críticos dijeron que vulnera la libertad de expresión y la memoria histórica de la minoría árabe; sus defensores ante el tribunal sostuvieron que solo significa que el Estado no financiará esas actividades. En 2012 el Tribunal Supremo desestimó un recurso en su contra por prematuro, sin pronunciarse sobre las cuestiones constitucionales."
      fr: "Un amendement autorisant le ministre des Finances à réduire le financement public des organismes financés ou subventionnés par l’État qui consacrent de l’argent à des activités comme marquer le jour de l’Indépendance comme un jour de deuil ou nier l’existence d’Israël en tant qu’État juif et démocratique (la loi énumère cinq motifs de ce type ; la réduction ne peut dépasser trois fois la dépense). Ses détracteurs estimaient qu’il porte atteinte à la liberté d’expression et à la mémoire historique de la minorité arabe ; ses défenseurs devant la Cour affirmaient qu’il signifie seulement que l’État ne financera pas ces activités. En 2012, la Haute Cour a rejeté un recours contre lui comme prématuré, sans trancher les questions constitutionnelles."
    sources:
      - { url: "https://fs.knesset.gov.il/18/law/18_lsr_301085.pdf", title: "חוק יסודות התקציב (תיקון מס' 40), התשע\"א-2011 — ספר החוקים 2286, 30.3.2011 (התקבל בכנסת ב-22 במרס 2011)", publisher: "הכנסת" }
      - { url: "https://www.nevo.co.il/law_html/law00/5282.htm", title: "חוק יסודות התקציב, התשמ\"ה-1985 — סעיף 3ב", publisher: "Nevo" }
      - { url: "https://supremedecisions.court.gov.il/Home/Download?fileName=11034290_c04.txt&path=HebrewVerdicts%2F11%2F290%2F034%2Fc04&type=2", title: "בג\"ץ 3429/11 — פסק הדין (5 בינואר 2012)", publisher: "בית המשפט העליון" }
      - { url: "https://www.haaretz.com/1.5159558", title: "High Court Rejects Petition Against Israel's Controversial 'Nakba Law' (5 Jan 2012)", publisher: "Haaretz" }
  - year: 2005
    title:
      he: "חוק יישום ההתנתקות (2005)"
      en: "The Gaza Disengagement Law (2005)"
      ar: "قانون تنفيذ فك الارتباط (2005)"
      ru: "Закон о размежевании (2005)"
      es: "La Ley de Desconexión de Gaza (2005)"
      fr: "La loi sur le désengagement de Gaza (2005)"
    summary:
      he: "החוק שהסדיר את פינוי הישראלים ורכושם מרצועת עזה ומשטח בצפון השומרון (ארבעה יישובים), בהתאם להחלטות הממשלה, ואת הפיצויים למפונים; נסיגת הצבא נקבעה בהחלטות הממשלה. המהלך פילג עמוקות את החברה: הממשלה טענה שהיציאה עשויה להקטין את החיכוך עם האוכלוסייה הפלסטינית, ומתנגדים — ובראשם המתיישבים — התנגדו לעקירת קהילות. ביוני 2005 אישר בג\"ץ ברוב של 10 מול 1 את חוקתיות הפינוי, וביטל כמה מהסדרי הפיצוי."
      en: "The law that set the rules for evacuating Israelis and their property from the Gaza Strip and from an area of the northern West Bank (four communities), in line with government decisions, and for compensating the evacuees; the army's withdrawal was set by government decisions. The move deeply split Israeli society: the government argued that leaving would reduce friction with the Palestinian population, while opponents — chiefly the settlers — objected to uprooting communities. In June 2005 the High Court upheld the evacuation, 10–1, and struck down some of the compensation arrangements."
      ar: "القانون الذي نظّم إخلاء الإسرائيليين وممتلكاتهم من قطاع غزة ومن منطقة في شمال الضفة الغربية (أربع مستوطنات)، وفقًا لقرارات الحكومة، وتعويض الذين أُخلوا؛ أما انسحاب الجيش فقد حُدّد في قرارات الحكومة. قسمت الخطوة المجتمع الإسرائيلي بعمق: قالت الحكومة إن الخروج قد يقلّل الاحتكاك مع السكان الفلسطينيين، وعارضها المعارضون — ولا سيما المستوطنون — رفضًا لاقتلاع مجتمعات. وفي حزيران/يونيو 2005 أقرّت محكمة العدل العليا دستورية الإخلاء بأغلبية 10 مقابل 1، وألغت بعض ترتيبات التعويض."
      ru: "Закон, установивший порядок эвакуации израильтян и их имущества из сектора Газа и с территории на севере Самарии (четыре населённых пункта) в соответствии с решениями правительства, а также компенсаций эвакуированным; вывод армии был определён решениями правительства. Этот шаг глубоко расколол общество: правительство утверждало, что уход может снизить трения с палестинским населением, а противники — прежде всего жители поселений — выступали против выселения общин. В июне 2005 года БАГАЦ большинством 10 против 1 признал эвакуацию конституционной и отменил часть положений о компенсациях."
      es: "La ley que reguló la evacuación de los israelíes y sus bienes de la Franja de Gaza y de una zona del norte de Cisjordania (cuatro comunidades), conforme a las decisiones del gobierno, y la indemnización de los evacuados; la retirada del ejército la fijaron decisiones del gobierno. La medida dividió profundamente a la sociedad israelí: el gobierno sostuvo que la salida podía reducir la fricción con la población palestina, mientras sus opositores — sobre todo los colonos — rechazaban el desarraigo de comunidades. En junio de 2005 el Tribunal Supremo avaló la evacuación por 10 votos contra 1 y anuló algunas de las disposiciones de indemnización."
      fr: "La loi qui a fixé les règles de l’évacuation des Israéliens et de leurs biens de la bande de Gaza et d’une zone du nord de la Cisjordanie (quatre localités), conformément aux décisions du gouvernement, et de l’indemnisation des évacués ; le retrait de l’armée a été fixé par des décisions du gouvernement. Cette mesure a profondément divisé la société israélienne : le gouvernement soutenait que le départ pourrait réduire les frictions avec la population palestinienne, tandis que ses opposants — surtout les habitants des implantations — refusaient le déracinement de communautés. En juin 2005, la Haute Cour a validé l’évacuation par 10 voix contre 1 et annulé certaines dispositions d’indemnisation."
    sources:
      - { url: "https://fs.knesset.gov.il/16/law/16_lsr_299869.pdf", title: "חוק יישום תכנית ההתנתקות, התשס\"ה-2005 — ספר החוקים 1982, 18.2.2005 (התקבל בכנסת ב-16 בפברואר 2005)", publisher: "הכנסת" }
