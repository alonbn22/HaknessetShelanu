  - kind: negative
    category: controversy
    date: 2024-12-10
    title:
      he: ביקורת על הצעת חוק לסגן ראש עיר נוסף, שלפי הדיווח תיטיב עם נתניה (2024)
      en: Criticism over a bill enabling an additional deputy mayor, reported to benefit Netanya (2024)
      ar: انتقادات لمشروع قانون يتيح نائب رئيس بلدية إضافيًا، قيل إنه يفيد نتانيا (2024)
      ru: Критика законопроекта о дополнительном заместителе мэра, который, по сообщениям, выгоден Нетании (2024)
    description:
      he: דלל יזם הצעת חוק פרטית לתיקון פקודת העיריות בעניין מספר סגני ראש העיר; ב-10 בדצמבר 2024 אישרה ועדת הפנים והגנת הסביבה את ההצעה לקריאה שנייה ושלישית, כמתועד בפרוטוקול הוועדה. דה-מרקר דיווח (ביולי ובדצמבר 2024) כי ההצעה מורידה את סף התושבים למינוי סגן נוסף לרשויות של 100–150 אלף תושבים וכי בפועל תאפשר דווקא לנתניה, עירו של דלל — שהצהיר על כוונתו להתמודד על ראשות העיר — לשלם שכר לסגן נוסף בעלות של מאות אלפי שקלים בשנה, והעלה טענות לניגוד עניינים. בכתבות לא הובאה תגובה מטעם דלל.
      en: Dallal initiated a private bill amending the Municipalities Ordinance on the number of deputy mayors; on 10 December 2024 the Knesset Interior and Environmental Protection Committee approved it for its second and third readings, as recorded in the committee protocol. TheMarker reported (in July and December 2024) that the bill lowers the population threshold for an additional deputy mayor to municipalities of 100,000–150,000 residents and would in practice allow Netanya specifically — Dallal's home city, where he had declared his intention to run for mayor — to pay a salary to an additional deputy at a cost of hundreds of thousands of shekels a year, and raised conflict-of-interest concerns. The reports did not include a response from Dallal.
      ru: Далаль продвигал частный законопроект о числе заместителей мэра; в декабре 2024 года комиссия Кнессета по внутренним делам одобрила его ко второму и третьему чтению. Газета TheMarker сообщила, что закон фактически выгоден Нетании — родному городу Далаля, где он заявил о намерении баллотироваться в мэры, — и указала на вопросы конфликта интересов. Ответ Далаля в публикациях не приводился.
