  - id: 1100 # The Democrats (Labor–Meretz); the Knesset faction is still registered as Labor
    verified: "2026-09-19"
    updates:
      - date: "2024-07-12"
        text:
          he: "יאיר גולן נבחר ליו\"ר העבודה (28 במאי 2024); ב-30 ביוני 2024 חתמו העבודה ומרצ על הסכם איחוד למפלגה בשם \"הדמוקרטים\", וועידה משותפת אישרה אותו ב-12 ביולי 2024."
          en: "Yair Golan was elected Labor chairman (28 May 2024); on 30 June 2024 Labor and Meretz signed a merger agreement creating “The Democrats”, approved by a joint convention on 12 July 2024."
          ar: "انتُخب يائير غولان رئيسًا لحزب العمل (28 أيار/مايو 2024)؛ وفي 30 حزيران/يونيو 2024 وقّع حزبا العمل وميرتس اتفاق وحدة لإنشاء حزب باسم «الديمقراطيون»، وصادق عليه مؤتمر مشترك في 12 تموز/يوليو 2024."
          ru: "Яир Голан был избран председателем партии «Авода» (28 мая 2024 года); 30 июня 2024 года «Авода» и «Мерец» подписали соглашение об объединении в партию «Демократы», которое 12 июля 2024 года утвердил совместный съезд."
          es: "Yair Golan fue elegido presidente del Partido Laborista (28 de mayo de 2024); el 30 de junio de 2024 el Partido Laborista y Meretz firmaron un acuerdo de fusión que creó «Los Demócratas», aprobado por una convención conjunta el 12 de julio de 2024."
          fr: "Yaïr Golan a été élu président du Parti travailliste (28 mai 2024) ; le 30 juin 2024, les Travaillistes et Meretz ont signé un accord de fusion créant « Les Démocrates », approuvé par une convention commune le 12 juillet 2024."
        sources:
          - { url: "https://www.timesofisrael.com/yair-golan-wins-landslide-victory-in-labor-primary-with-promise-to-unite-the-left/", title: "Yair Golan wins landslide victory in Labor primary with promise to unite the left (2024-05-28)", publisher: "The Times of Israel" }
          - { url: "https://www.timesofisrael.com/labor-and-meretz-merge-into-united-liberal-democratic-zionist-party-the-democrats/", title: "Labor and Meretz merge into united 'liberal-democratic Zionist party': The Democrats (2024-06-30)", publisher: "The Times of Israel" }
          - { url: "https://www.jpost.com/israel-news/politics-and-diplomacy/article-810075", title: "With an overwhelming majority, Meretz and Labor approve merge, becoming the Democrats (2024-07-12)", publisher: "The Jerusalem Post" }
      - date: "2025-02-25"
        text:
          he: "ועדת הכנסת, בראשות יו\"ר הקואליציה אופיר כץ, לא אישרה את בקשת סיעת העבודה לשנות את שמה ל\"הדמוקרטים\"; יו\"ר הסיעה אפרת רייטן מרום משכה את הבקשה, והסיעה נותרה רשומה בכנסת כ\"העבודה\"."
          en: "The Knesset House Committee, chaired by coalition whip Ofir Katz, did not approve the Labor faction’s request to rename itself “The Democrats”; faction chair Efrat Rayten Marom withdrew the request and the faction remains registered in the Knesset as “Labor”."
          ar: "لم تصادق لجنة الكنيست، برئاسة رئيس الائتلاف أوفير كاتس، على طلب كتلة العمل تغيير اسمها إلى «الديمقراطيون»؛ وسحبت رئيسة الكتلة إفرات رايتن ماروم الطلب، وبقيت الكتلة مسجّلة في الكنيست باسم «العمل»."
          ru: "Комиссия Кнессета под председательством главы коалиции Офира Каца не утвердила просьбу фракции «Авода» о переименовании в «Демократы»; председатель фракции Эфрат Райтен-Маром отозвала просьбу, и фракция осталась зарегистрированной в Кнессете как «Авода»."
          es: "La Comisión de la Knéset (House Committee), presidida por el presidente de la coalición (coordinador), Ofir Katz, no aprobó la solicitud de la facción Laborista de renombrarse «Los Demócratas»; la presidenta de la facción, Efrat Rayten Marom, retiró la solicitud y la facción sigue registrada en la Knéset como «Laborista»."
          fr: "La Commission de la Knesset, présidée par le président de la coalition Ofir Katz, n’a pas approuvé la demande de la faction travailliste de se renommer « Les Démocrates » ; la présidente de faction Efrat Rayten Marom a retiré la demande et la faction reste enregistrée à la Knesset sous le nom « Travailliste »."
        sources:
          - { url: "https://www.jpost.com/israel-news/article-843691", title: "Coalition denies Labor Party's bid to change name to The Democrats (2025-02-25)", publisher: "The Jerusalem Post" }
          - { url: "https://main.knesset.gov.il/mk/apps/faction/faction-lobby?KnessetID=25&FactionID=1100", title: "סיעת העבודה — 4 חברים, יו\"ר הסיעה אפרת רייטן מרום (2026-09-19)", publisher: "הכנסת" }
      - date: "2026-05-31"
        text:
          he: "ועידת הדמוקרטים בתל אביב אשררה את איחוד העבודה ומרצ לקראת הבחירות; למרצ הובטחו המקומות 6, 8 ו-14 ברשימה המשותפת."
          en: "The Democrats’ conference in Tel Aviv ratified the Labor–Meretz merger ahead of the election; Meretz was guaranteed slots 6, 8 and 14 on the joint list."
          ar: "صادق مؤتمر الديمقراطيين في تل أبيب على وحدة العمل وميرتس استعدادًا للانتخابات؛ وضُمنت لميرتس المواقع 6 و8 و14 في قائمة الديمقراطيين."
          ru: "Съезд «Демократов» в Тель-Авиве ратифицировал объединение «Аводы» и «Мерец» перед выборами; «Мерец» гарантированы 6-е, 8-е и 14-е места в совместном списке."
          es: "La conferencia de Los Demócratas en Tel Aviv ratificó la fusión Laborista–Meretz antes de las elecciones; a Meretz se le garantizaron los puestos 6, 8 y 14 de la lista conjunta."
          fr: "La conférence des Démocrates à Tel-Aviv a ratifié la fusion Travaillistes–Meretz avant les élections ; Meretz s’est vu garantir les places 6, 8 et 14 sur la liste commune."
        sources:
          - { url: "https://www.timesofisrael.com/liveblog_entry/left-wing-democrats-party-ratifies-merger-of-labor-and-meretz-factions-at-party-conference/", title: "Left-wing Democrats party ratifies merger of Labor and Meretz factions at party conference (2026-05-31)", publisher: "The Times of Israel" }
          - { url: "https://www.haaretz.com/israel-news/elections/2026-05-31/ty-article/.premium/democrats-party-approves-left-wing-merger-of-meretz-labor-ahead-of-elections/0000019e-7ec8-d813-a9be-ffcfd71b0000", title: "Democrats Party Approves Left-wing Merger of Meretz, Labor Ahead of Elections (2026-05-31)", publisher: "Haaretz" }
      - date: "2026-06-28"
        text:
          he: "המפלגה פרסמה 51 מועמדים לפריימריז; שלושה מארבעת חברי הכנסת של הסיעה (נעמה לזימי, גלעד קריב, אפרת רייטן מרום) התמודדו, ואילו מרב מיכאלי, שעמדה בראש העבודה בבחירות 2022, לא התמודדה."
          en: "The party published 51 primary candidates; three of the faction’s four MKs (Naama Lazimi, Gilad Kariv, Efrat Rayten Marom) ran, while Merav Michaeli, who led Labor in the 2022 election, did not run."
          ar: "نشر الحزب أسماء 51 مرشحًا للانتخابات التمهيدية؛ وخاضها ثلاثة من أعضاء الكنيست الأربعة في الكتلة (نعماه لازيمي، وغلعاد كاريف، وإفرات رايتن ماروم)، بينما لم تترشح ميراف ميخائيلي، التي قادت حزب العمل في انتخابات 2022."
          ru: "Партия опубликовала 51 кандидата на праймериз; в них участвовали трое из четырёх депутатов фракции (Наама Лазими, Гилад Карив, Эфрат Райтен-Маром), а Мерав Михаэли, возглавлявшая «Аводу» на выборах 2022 года, не баллотировалась."
          es: "El partido publicó 51 candidatos a las primarias; tres de los cuatro diputados de la facción (Naama Lazimi, Gilad Kariv, Efrat Rayten Marom) se presentaron, mientras que Merav Michaeli, que encabezó al Laborismo en las elecciones de 2022, no lo hizo."
          fr: "Le parti a publié 51 candidats à la primaire ; trois des quatre députés de la faction (Naama Lazimi, Gilad Kariv, Efrat Rayten Marom) se sont présentés, tandis que Merav Michaeli, qui menait les Travaillistes aux élections de 2022, ne s’est pas présentée."
        sources:
          - { url: "https://www.timesofisrael.com/golans-democrats-party-unveils-51-primary-candidates-touts-85000-members/", title: "Golan's Democrats party unveils 51 primary candidates, touts 85,000 members (2026-06-28)", publisher: "The Times of Israel" }
      - date: "2026-07-20"
        text:
          he: "בפריימריז מקוונים של הדמוקרטים נבחרה רשימת המועמדים: אחרי גולן — נעמה לזימי (2), גלעד קריב (3), אפרת רייטן מרום (4), יאיר פינק (5), גבי לסקי (מרצ, 6), עמרי רונן (7), מיכל רוזין (מרצ, 8), משה רדמן (9), סומייה בשיר (10), נמרוד שפר (11)."
          en: "In an online Democrats primary the list was chosen: after Golan — Naama Lazimi (2), Gilad Kariv (3), Efrat Rayten Marom (4), Yair Fink (5), Gaby Lasky (Meretz, 6), Omri Ronen (7), Michal Rozin (Meretz, 8), Moshe Radman (9), Somaya Bashir (10), Nimrod Sheffer (11)."
          ar: "في انتخابات تمهيدية إلكترونية للديمقراطيين اختيرت قائمة المرشحين: بعد غولان — نعماه لازيمي (2)، غلعاد كاريف (3)، إفرات رايتن ماروم (4)، يائير فينك (5)، غابي لاسكي (ميرتس، 6)، عومري رونين (7)، ميخال روزين (ميرتس، 8)، موشيه رادمان (9)، سمية بشير (10)، نمرود شيفر (11)."
          ru: "На онлайн-праймериз «Демократов» был определён список кандидатов: после Голана — Наама Лазими (2), Гилад Карив (3), Эфрат Райтен-Маром (4), Яир Финк (5), Габи Ласки («Мерец», 6), Омри Ронен (7), Михаль Розин («Мерец», 8), Моше Радман (9), Сумайя Башир (10), Нимрод Шеффер (11)."
          es: "En unas primarias en línea de Los Demócratas se eligió la lista: tras Golan — Naama Lazimi (2), Gilad Kariv (3), Efrat Rayten Marom (4), Yair Fink (5), Gaby Lasky (Meretz, 6), Omri Ronen (7), Michal Rozin (Meretz, 8), Moshe Radman (9), Somaya Bashir (10), Nimrod Sheffer (11)."
          fr: "Lors d’une primaire en ligne des Démocrates, la liste a été choisie : après Golan — Naama Lazimi (2), Gilad Kariv (3), Efrat Rayten Marom (4), Yaïr Fink (5), Gaby Lasky (Meretz, 6), Omri Ronen (7), Michal Rozin (Meretz, 8), Moshe Radman (9), Somaya Bashir (10), Nimrod Sheffer (11)."
        sources:
          - { url: "https://www.timesofisrael.com/naama-lazimi-wins-no-2-spot-after-yair-golan-in-left-wing-democrats-primary/", title: "MK Naama Lazimi wins No. 2 spot after Yair Golan in left-wing Democrats' primary (2026-07-20)", publisher: "The Times of Israel" }
          - { url: "https://www.jpost.com/israel-news/politics-and-diplomacy/article-903068", title: "Democrats announce Knesset slate ahead of elections, MK Lazimi takes second spot after Golan (2026-07-20)", publisher: "The Jerusalem Post" }
      - date: "2026-09-07"
        text:
          he: "הרשימה \"הדמוקרטים בראשות יאיר גולן\" הוגשה לוועדת הבחירות (רשימה 17; האותיות המבוקשות אמת) על ידי שתי מפלגות — \"הדמוקרטים מיסודה של תנועת העבודה\" ו\"מרצ\" — עם 118 מועמדים; מרב מיכאלי אינה ברשימה."
          en: "The list “The Democrats headed by Yair Golan” was submitted to the CEC (list 17; requested letters אמת) by two parties — “The Democrats, founded by the Labor movement” and “Meretz” — with 118 candidates; Merav Michaeli is not on it."
          ar: "قُدّمت قائمة «الديمقراطيون برئاسة يائير غولان» إلى لجنة الانتخابات (القائمة 17؛ الأحرف المطلوبة אמת) من قِبل حزبين — «الديمقراطيون، من تأسيس حركة العمل» و«ميرتس» — وتضم 118 مرشحًا؛ وميراف ميخائيلي ليست فيها."
          ru: "Список «Демократы во главе с Яиром Голаном» подан в ЦИК (список 17; запрошенные буквы אמת) двумя партиями — «Демократы, основанные рабочим движением» и «Мерец» — со 118 кандидатами; Мерав Михаэли в нём нет."
          es: "La lista «Los Demócratas encabezados por Yair Golan» fue presentada ante la Comisión Electoral (lista 17; letras solicitadas אמת) por dos partidos — «Los Demócratas, fundados por el movimiento laborista» y «Meretz» — con 118 candidatos; Merav Michaeli no figura en ella."
          fr: "La liste « Les Démocrates menés par Yaïr Golan » a été déposée auprès de la Commission électorale (liste 17 ; lettres demandées אמת) par deux partis — « Les Démocrates, fondés par le mouvement travailliste » et « Meretz » — avec 118 candidats ; Merav Michaeli n’y figure pas."
        sources:
          - { url: "https://www.gov.il/he/pages/hademokratim_list17", title: "הדמוקרטים בראשות יאיר גולן — רשימה 17 (2026-09-16)", publisher: "ועדת הבחירות המרכזית (gov.il)" }
          - { url: "https://www.timesofisrael.com/israels-election-takes-shape-as-38-parties-submit-slates-from-likud-to-joint-list/", title: "Israel's election takes shape as 38 parties submit slates, in battle between pro- and anti-Netanyahu blocs (2026-09-09)", publisher: "The Times of Israel" }
      - date: "2026-09-10"
        text:
          he: "הדמוקרטים ומפלגת ישר! בראשות גדי איזנקוט הודיעו על הסכם עודפים לבחירות 2026."
          en: "The Democrats and Gadi Eisenkot’s Yashar! announced a surplus-vote agreement for the 2026 election."
          ar: "أعلن الديمقراطيون وحزب ياشار! بزعامة غادي آيزنكوت اتفاقية فائض أصوات لانتخابات 2026."
          ru: "«Демократы» и партия Гади Айзенкота «Яшар!» объявили о соглашении об излишках голосов на выборах 2026 года."
          es: "Los Demócratas y ¡Yashar! de Gadi Eisenkot anunciaron un acuerdo de votos sobrantes para las elecciones de 2026."
          fr: "Les Démocrates et Yashar! de Gadi Eisenkot ont annoncé un accord de report des voix restantes pour les élections de 2026."
        sources:
          - { url: "https://www.timesofisrael.com/main-opposition-factions-ink-surplus-vote-deals-in-bid-to-maximize-knesset-representation/", title: "Main opposition factions ink surplus-vote deals in bid to maximize Knesset representation (2026-09-10)", publisher: "The Times of Israel" }
      - date: "2026-09-14"
        text:
          he: "הדמוקרטים הגישו לוועדת הבחירות המרכזית בקשה לפסול את עוצמה יהודית מהתמודדות, בטענה לפגיעה באופייה הדמוקרטי של המדינה; הבקשה מתייחסת גם להתנהלות בן גביר כשר וגם לגוטליב."
          en: "The Democrats asked the Central Elections Committee to bar Otzma Yehudit from running, alleging it undermines the state’s democratic character; the request also cites Ben Gvir’s conduct as minister and Gotliv."
          ar: "قدّم الديمقراطيون إلى لجنة الانتخابات المركزية طلبًا لمنع عوتسما يهوديت من خوض الانتخابات، بدعوى المساس بالطابع الديمقراطي للدولة؛ ويتناول الطلب أيضًا سلوك بن غفير وزيرًا وكذلك غوتليف."
          ru: "«Демократы» обратились в Центральную избирательную комиссию с просьбой отстранить «Оцма Иегудит» от выборов, утверждая, что она подрывает демократический характер государства; в обращении упоминаются также действия Бен-Гвира на посту министра и Готлив."
          es: "Los Demócratas pidieron a la Comisión Electoral Central que impida a Otzma Yehudit presentarse, alegando que socava el carácter democrático del Estado; la petición cita también la conducta de Ben Gvir como ministro y a Gotliv."
          fr: "Les Démocrates ont demandé à la Commission électorale centrale d’interdire à Otzma Yehoudit de se présenter, alléguant qu’il porte atteinte au caractère démocratique de l’État ; la demande cite aussi la conduite de Ben Gvir comme ministre et Gotliv."
        sources:
          - { url: "https://www.timesofisrael.com/democrats-seek-to-bar-otzma-yehudit-from-election-as-polls-show-continued-deadlock/", title: "Democrats seek to bar Otzma Yehudit from election as polls show continued deadlock (2026-09-15)", publisher: "The Times of Israel" }
      - date: "2026-09-24"
        text:
          he: "ב-24 בספטמבר 2026 דחתה ועדת הבחירות המרכזית את שלוש הבקשות שנדונו באותו יום: לפסול את רשימת עוצמה יהודית (10 בעד, 19 נגד, נמנע אחד; הגישו הדמוקרטים, ובנפרד עמותת זולת עם כמה אישי ציבור), את רשימת הציונות הדתית וזהות (3 בעד, 21 נגד; הגישו זולת ואותם אישי ציבור) ואת רשימת הדמוקרטים (2 בעד, 14 נגד; הגישו עוצמה יהודית ואיתמר בן גביר). המבקשים טענו לשלילת קיומה של ישראל כמדינה יהודית ודמוקרטית ולהסתה לגזענות; היועצת המשפטית לממשלה התנגדה לפסילת שלוש הרשימות. בקשות לפסול אישית מועמדים ברשימות אלה, ובהם בן גביר, טלי גוטליב, בצלאל סמוטריץ' ויאיר גולן, נמחקו כבר ב-14–15 בספטמבר, משום שלא צורפו להן חתימות של שליש מחברי הוועדה כנדרש בחוק."
          en: "On 24 September 2026 the Central Elections Committee rejected all three requests heard that day: to disqualify the Otzma Yehudit list (10 for, 19 against, one abstention; filed by the Democrats and, separately, by the Zulat institute with several public figures), the Religious Zionism–Zehut list (3 for, 21 against; filed by Zulat and the same public figures) and the Democrats list (2 for, 14 against; filed by Otzma Yehudit and Itamar Ben Gvir). The petitioners alleged rejection of Israel's existence as a Jewish and democratic state and incitement to racism; the Attorney General opposed disqualifying all three lists. Requests to bar individual candidates on these lists, among them Ben Gvir, Tally Gotliv, Bezalel Smotrich and Yair Golan, had been struck on 14–15 September because they lacked the signatures of a third of the committee's members, as the law requires."
          ar: "في 24 أيلول/سبتمبر 2026 رفضت لجنة الانتخابات المركزية الطلبات الثلاثة التي نظرت فيها ذلك اليوم: شطب قائمة عوتسما يهوديت (10 مع، 19 ضد، وامتناع واحد؛ قدّمه الديمقراطيون، وبشكل منفصل معهد «زولات» مع عدد من الشخصيات العامة)، وقائمة الصهيونية الدينية–زهوت (3 مع، 21 ضد؛ قدّمه «زولات» والشخصيات العامة نفسها)، وقائمة الديمقراطيين (2 مع، 14 ضد؛ قدّمته عوتسما يهوديت وإيتمار بن غفير). وادّعى مقدّمو الطلبات إنكار وجود إسرائيل دولةً يهودية وديمقراطية والتحريض على العنصرية؛ وعارضت المستشارة القضائية للحكومة شطب القوائم الثلاث. أما طلبات شطب مرشحين أفراد في هذه القوائم، ومنهم بن غفير وطالي غوتليف وبتسلئيل سموتريتش ويائير غولان، فقد أُسقطت منذ 14–15 أيلول/سبتمبر لعدم إرفاق تواقيع ثلث أعضاء اللجنة كما يشترط القانون."
          ru: "24 сентября 2026 года Центральная избирательная комиссия отклонила все три ходатайства, рассмотренные в тот день: об отстранении списка «Оцма Иегудит» (10 за, 19 против, 1 воздержался; подали «Демократы» и отдельно институт «Зулат» вместе с рядом общественных деятелей), списка «Религиозный сионизм — Зеут» (3 за, 21 против; подали «Зулат» и те же общественные деятели) и списка «Демократов» (2 за, 14 против; подали «Оцма Иегудит» и Итамар Бен-Гвир). Заявители ссылались на отрицание существования Израиля как еврейского и демократического государства и подстрекательство к расизму; юридический советник правительства выступила против отстранения всех трёх списков. Ходатайства об отстранении отдельных кандидатов этих списков, в том числе Бен-Гвира, Тали Готлив, Бецалеля Смотрича и Яира Голана, были оставлены без рассмотрения ещё 14–15 сентября, поскольку к ним не приложили подписи трети членов комиссии, как того требует закон."
          es: "El 24 de septiembre de 2026 la Comisión Electoral Central rechazó las tres solicitudes que examinó ese día: inhabilitar la lista de Otzma Yehudit (10 a favor, 19 en contra y una abstención; presentada por Los Demócratas y, por separado, por el instituto Zulat con varias figuras públicas), la de Sionismo Religioso–Zehut (3 a favor, 21 en contra; presentada por Zulat y las mismas figuras públicas) y la de Los Demócratas (2 a favor, 14 en contra; presentada por Otzma Yehudit e Itamar Ben Gvir). Los solicitantes alegaban negación de la existencia de Israel como Estado judío y democrático e incitación al racismo; la asesora jurídica del Gobierno se opuso a inhabilitar las tres listas. Las solicitudes para inhabilitar a candidatos concretos de esas listas, entre ellos Ben Gvir, Tally Gotliv, Bezalel Smotrich y Yair Golan, ya se habían archivado el 14 y 15 de septiembre por no llevar las firmas de un tercio de los miembros de la comisión, como exige la ley."
          fr: "Le 24 septembre 2026, la Commission électorale centrale a rejeté les trois demandes examinées ce jour-là : l’invalidation de la liste d’Otzma Yehoudit (10 pour, 19 contre, une abstention ; déposée par les Démocrates et, séparément, par l’institut Zulat avec plusieurs personnalités publiques), de celle du Sionisme religieux–Zehut (3 pour, 21 contre ; déposée par Zulat et les mêmes personnalités) et de celle des Démocrates (2 pour, 14 contre ; déposée par Otzma Yehoudit et Itamar Ben Gvir). Les requérants invoquaient le rejet de l’existence d’Israël en tant qu’État juif et démocratique et l’incitation au racisme ; la conseillère juridique du gouvernement s’est opposée à l’invalidation des trois listes. Les demandes visant personnellement des candidats de ces listes, dont Ben Gvir, Tally Gotliv, Bezalel Smotrich et Yair Golan, avaient été radiées dès les 14 et 15 septembre, faute des signatures d’un tiers des membres de la commission exigées par la loi."
        sources:
          - { url: "https://www.timesofisrael.com/liveblog_entry/election-panel-rejects-bid-to-disqualify-ben-gvirs-far-right-otzma-yehudit/", title: "Election panel vote on the Otzma Yehudit list (24 Sep 2026)", publisher: "The Times of Israel" }
          - { url: "https://www.timesofisrael.com/liveblog_entry/election-panel-rejects-bid-to-disqualify-smotrichs-religious-zionism-party", title: "Election panel vote on the Religious Zionism–Zehut list (24 Sep 2026)", publisher: "The Times of Israel" }
          - { url: "https://www.timesofisrael.com/liveblog_entry/election-panel-rejects-bid-to-disqualify-democrats-concluding-hearings-on-election-bans/", title: "Election panel vote on the Democrats list (24 Sep 2026)", publisher: "The Times of Israel" }
          - { url: "https://www.gov.il/BlobFolder/guide/candidates-lists-26/he/pr6_26_decision.pdf", title: "פ\"ר 6/26 — החלטה (14.9.2026)", publisher: "ועדת הבחירות המרכזית" }
          - { url: "https://www.gov.il/BlobFolder/guide/candidates-lists-26/he/pr9_26_decision.pdf", title: "פ\"ר 9/26 — החלטה (15.9.2026)", publisher: "ועדת הבחירות המרכזית" }
          - { url: "https://www.gov.il/BlobFolder/guide/candidates-lists-26/he/pm3_26_decision.pdf", title: "פ\"מ 3/26 — החלטה (14.9.2026)", publisher: "ועדת הבחירות המרכזית" }
    election2026:
      runsAs: own
      slug: democrats
      note:
        he: "הסיעה רשומה בכנסת כ\"העבודה\"; המפלגה רצה כ\"הדמוקרטים בראשות יאיר גולן\" (הוגשה על ידי \"הדמוקרטים מיסודה של תנועת העבודה\" ומרצ). מרב מיכאלי אינה ברשימה."
        en: "The Knesset faction is registered as “Labor”; the party runs as “The Democrats headed by Yair Golan” (submitted by “The Democrats, founded by the Labor movement” and Meretz). Merav Michaeli is not on the list."
        ar: "الكتلة مسجّلة في الكنيست باسم «العمل»؛ ويترشح الحزب باسم «الديمقراطيون برئاسة يائير غولان» (قدّمها «الديمقراطيون، من تأسيس حركة العمل» وميرتس). ميراف ميخائيلي ليست في القائمة."
        ru: "Фракция в Кнессете зарегистрирована как «Авода»; партия идёт как «Демократы во главе с Яиром Голаном» (подан «Демократами, основанными рабочим движением» и «Мерец»). Мерав Михаэли в списке нет."
        es: "La facción de la Knéset está registrada como «Laborista»; el partido se presenta como «Los Demócratas encabezados por Yair Golan» (presentada por «Los Demócratas, fundados por el movimiento laborista» y Meretz). Merav Michaeli no figura en la lista."
        fr: "La faction à la Knesset est enregistrée sous le nom « Travailliste » ; le parti se présente comme « Les Démocrates menés par Yaïr Golan » (déposée par « Les Démocrates, fondés par le mouvement travailliste » et Meretz). Merav Michaeli ne figure pas sur la liste."
      sources:
        - { url: "https://www.gov.il/he/pages/hademokratim_list17", title: "הדמוקרטים בראשות יאיר גולן — רשימת המועמדים", publisher: "ועדת הבחירות המרכזית לכנסת" }
