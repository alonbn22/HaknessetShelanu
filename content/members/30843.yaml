      he: "שובץ במקום השישי ברשימת רע\"ם לבחירות 2026"
      en: "Placed sixth on the Ra'am list for the 2026 election"
    description:
      he: "ברשימת רע\"ם - הרשימה הערבית המאוחדת שהוגשה לוועדת הבחירות המרכזית לקראת הבחירות לכנסת ה-26 ב-27 באוקטובר 2026 שובץ חוג'יראת במקום השישי, אחרי מנסור עבאס, יואב סגלוביץ, וליד טאהא, וליד אלהואשלה ואימאן ח'טיב יאסין."
      en: "On the Ra'am - United Arab List submitted to the Central Elections Committee for the 27 October 2026 election to the 26th Knesset, Hujeirat was placed sixth, after Mansour Abbas, Yoav Segalovitz, Walid Taha, Walid al-Hawashla and Iman Khatib-Yassin."
