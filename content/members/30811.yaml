    title:
      he: "המשרד לביטחון לאומי והמשטרה הורו לבכיריהם שלא להיפגש, על רקע העימות עם המפכ\"ל דני לוי"
      en: "The National Security Ministry and the police told their senior officials not to meet, amid his clash with Commissioner Danny Levy"
    description:
      he: "לפי הארץ, ב-18 בספטמבר 2026 הוציאו המשרד לביטחון לאומי והמשטרה הנחיות פנימיות האוסרות על בכיריהם להיפגש עם בכירי הגוף השני, על רקע החרפת המתיחות בין בן גביר למפכ\"ל דני לוי, בין השאר סביב עיכוב תקציבי משטרה. בדיווח לא הובאו תגובות רשמיות מלשכת השר או מהמשטרה."
      en: "According to Haaretz, on 18 September 2026 the National Security Ministry and the Israel Police issued internal guidelines barring their senior officials from meeting senior figures of the other body, amid deepening tensions between Ben-Gvir and Commissioner Danny Levy, including over held-up police budgets. The report carried no official responses from the minister's office or the police."
    sources:
