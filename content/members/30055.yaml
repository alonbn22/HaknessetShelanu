    title:
      he: "אמר כי \"המדינה צריכה למחוק את חווארה\" — ולאחר מכן אמר \"כשלתי\" והבהיר את דבריו"
      en: "Said \"the state should wipe out Huwara\" — later said \"I failed\" and clarified the remark"
    description:
      he: "ב-1 במרץ 2023, לאחר פיגוע ירי בחווארה ומהומות של מתנחלים בכפר, אמר סמוטריץ' בכנס דה-מרקר כי \"הכפר חווארה צריך להימחק\" וכי \"מדינת ישראל היא שצריכה למחוק את חווארה\". הדברים גררו גינויים בעולם, ובכללם ממחלקת המדינה האמריקאית. ב-8 במרץ 2023 אמר סמוטריץ' כי \"כשלתי\" באחריותו וכי הוא מזועזע מהמחשבה שדבריו הובנו כקריאה לפגיעה בנפש, והבהיר כי התכוון לפעולה של המדינה נגד טרור ולא לפגיעה באזרחים."
      en: "On 1 March 2023, after a shooting attack in Huwara and a settler rampage in the village, Smotrich said at a TheMarker conference that \"the village of Huwara needs to be wiped out\" and that \"the State of Israel should do it\". The remarks drew condemnation abroad, including from the US State Department. On 8 March 2023 Smotrich said he had \"failed\" in his responsibility and was shaken that his words could be understood as a call to harm people, clarifying that he meant state action against terror, not harm to civilians."
    sources:
