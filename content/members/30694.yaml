      he: "יצא נגד מסר הקמפיין של כחול לבן: \"קודם להזיז את נתניהו\""
      en: "Publicly disagreed with Blue and White's campaign message: \"first remove Netanyahu\""
    description:
      he: "ב-13 באוגוסט 2026 אמר שוסטר, ממקורביו של יו\"ר כחול לבן בני גנץ, כי המטרה הראשונה צריכה להיות סילוקו של בנימין נתניהו מראשות הממשלה, ורק לאחר מכן הקמת ממשלה יציבה – עמדה השונה ממסר \"ממשלת ההסכמות\" של גנץ, שאינו שולל ישיבה עם נתניהו."
      en: "On 13 August 2026 Schuster, a close associate of Blue and White leader Benny Gantz, said the first goal should be removing Benjamin Netanyahu from the premiership and only then forming a stable government — a stance differing from Gantz's \"government of agreements\" campaign message, which does not rule out sitting with Netanyahu."
    sources:
