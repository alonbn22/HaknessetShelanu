    title:
      he: ממשיך בכחול לבן ושובץ במקום השישי ברשימתה לכנסת ה-26
      en: Staying with Blue and White and placed sixth on its list for the 26th Knesset
    description:
      he: "ב-8 בספטמבר 2026, ערב סגירת הרשימות, הודיעה כחול לבן כי שוסטר ימשיך במפלגה וישובץ בצמרת רשימתה לבחירות לכנסת ה-26, לצד פנינה תמנו-שטה במקום השני ומופיד מרעי. ברשימה שהוגשה שובץ שוסטר במקום השישי, אחרי גנץ, תמנו-שטה, עליזה בלוך, רועי קונקול ורתם אבידר צאליק."
      en: "On 8 September 2026, on the eve of the deadline for submitting lists, Blue and White announced that Schuster would remain with the party and be placed in the top tier of its list for the 26th Knesset election, alongside Pnina Tamano-Shata in second place and Mufid Mar'i. On the list as submitted, Schuster is sixth, after Gantz, Tamano-Shata, Aliza Bloch, Roy Konkol and Rotem Avidar Tzalik."
