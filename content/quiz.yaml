  - id: lgbtq-partnership
    topic: society
    lean: left
    text:
      he: "יש להכיר בחוק בזוגיות של בני אותו המין — למשל באמצעות ברית זוגיות אזרחית."
      en: "Same-sex partnerships should be recognized in law — for example through a civil partnership registry."
      ar: "يجب الاعتراف قانونًا بالشراكة الزوجية بين شخصين من الجنس نفسه — مثلًا عبر سجل شراكة مدنية."
      ru: "Однополые партнёрства следует признать в законе — например через реестр гражданских союзов."
      es: "Las parejas del mismo sexo deberían reconocerse por ley — por ejemplo mediante un registro de unión civil."
      fr: "Les couples de même sexe devraient être reconnus par la loi — par exemple via un registre d’union civile."
    short:
      he: "הכרה בזוגיות חד-מינית"
      en: "Same-sex partnerships"
      ar: "الاعتراف بالشراكة المثلية"
      ru: "Однополые партнёрства"
      es: "Parejas del mismo sexo"
      fr: "Couples de même sexe"
    explainer:
      he: "בישראל אין נישואין אזרחיים, ובני זוג מאותו המין אינם יכולים להתחתן בארץ; נישואין שנערכו בחו\"ל נרשמים במרשם האוכלוסין, ולידועים בציבור יש זכויות רבות — אבל אין מסלול אזרחי בארץ. התומכים אומרים שזו שאלה של שוויון בסיסי; המתנגדים אומרים שהמשפחה היהודית המסורתית היא ערך שהמדינה צריכה לשמור עליו."
      en: "Israel has no civil marriage, and same-sex couples cannot marry in the country; a marriage abroad is entered in the population registry, and common-law partners have many rights — but there is no civil track at home. Supporters say it is a matter of basic equality; opponents say the traditional Jewish family is a value the state should protect."
      ar: "لا يوجد زواج مدني في إسرائيل، ولا يستطيع الأزواج من الجنس نفسه الزواج داخل البلاد؛ الزواج في الخارج يُسجَّل في سجل السكان، وللشريكين المعروفين علنًا حقوق كثيرة — لكن لا مسار مدنيًا داخل البلاد. يقول المؤيدون إنها مسألة مساواة أساسية؛ ويقول المعارضون إن العائلة اليهودية التقليدية قيمة يجب على الدولة حمايتها."
      ru: "В Израиле нет гражданского брака, и однополые пары не могут вступить в брак в стране; брак за границей вносится в реестр населения, а у признанных супругов много прав — но гражданского пути внутри страны нет. Сторонники говорят, что это вопрос базового равенства; противники — что традиционная еврейская семья — ценность, которую государство должно защищать."
      es: "En Israel no existe el matrimonio civil, y las parejas del mismo sexo no pueden casarse en el país; un matrimonio en el extranjero se inscribe en el registro de población, y las parejas de hecho tienen muchos derechos — pero no hay una vía civil en el país. Los partidarios dicen que es una cuestión de igualdad básica; los opositores dicen que la familia judía tradicional es un valor que el Estado debe proteger."
      fr: "Israël n’a pas de mariage civil, et les couples de même sexe ne peuvent pas se marier dans le pays ; un mariage à l’étranger est inscrit au registre de la population, et les concubins ont de nombreux droits — mais il n’existe pas de voie civile dans le pays. Les partisans disent que c’est une question d’égalité de base ; les opposants disent que la famille juive traditionnelle est une valeur que l’État doit protéger."
    stances:
      together:
        value: 2
        basis: platform
        source: { url: "https://be-yahad.org.il/plans/pride/", title: "ביחד נביא שוויון זכויות לקהילה הגאה — תכנית ביחד לקהילה הגאה", publisher: "ביחד" }
        quote:
          he: "\"נחוקק את חוק ברית הזוגיות האזרחית וניצור מסלול אזרחי מלא ונגיש לרישום זוגיות במרשם ממלכתי במשרד הפנים, עם מלוא הזכויות והחובות של זוגות נשואים וללא תלות בדת, מגדר או נטייה מינית.\""
          en: "\"We will legislate the Civil Partnership Act and create a full, accessible civil track for registering a partnership at the Interior Ministry, with all the rights and duties of married couples, regardless of religion, gender or sexual orientation.\""
          ar: "«سنشرّع قانون الشراكة المدنية وننشئ مسارًا مدنيًا كاملًا ومتاحًا لتسجيل الشراكة في سجل رسمي بوزارة الداخلية، بكامل حقوق وواجبات الأزواج المتزوجين ودون ارتباط بالدين أو الجنس أو الميول الجنسية.»"
          ru: "«Мы примем Закон о гражданском союзе и создадим полноценный и доступный гражданский путь регистрации партнёрства в государственном реестре МВД — со всеми правами и обязанностями супружеских пар и независимо от религии, пола или сексуальной ориентации»."
          es: "«Aprobaremos la Ley de Unión Civil y crearemos una vía civil completa y accesible para registrar la pareja en un registro estatal del Ministerio del Interior, con todos los derechos y deberes de los matrimonios y sin distinción de religión, género u orientación sexual.»"
          fr: "« Nous adopterons la loi sur l’union civile et créerons une voie civile complète et accessible pour enregistrer un couple dans un registre public au ministère de l’Intérieur, avec tous les droits et devoirs des couples mariés, sans distinction de religion, de genre ou d’orientation sexuelle. »"
      democrats:
        value: 2
        basis: platform
        source: { url: "https://yes.democrats.org.il/topics/lgbtq-equality", title: "הקהילה הגאה — תוכניות העבודה של הדמוקרטים", publisher: "הדמוקרטים" }
        quote:
          he: "\"נקדם שוויון זכויות מלא בחוק, כולל שוויון בזכות להורות, למשפחה ולנישואים.\""
          en: "\"We will advance full equal rights in law, including equality in the right to parenthood, to family and to marriage.\""
          ar: "«سنعمل على المساواة الكاملة في الحقوق في القانون، بما في ذلك المساواة في الحق في الأبوة والأمومة وفي العائلة وفي الزواج.»"
          ru: "«Мы добьёмся полного равенства прав в законе, включая равенство в праве на родительство, на семью и на брак»."
          es: "«Impulsaremos la plena igualdad de derechos en la ley, incluida la igualdad en el derecho a la parentalidad, a la familia y al matrimonio.»"
          fr: "« Nous ferons avancer la pleine égalité des droits dans la loi, y compris l’égalité dans le droit à la parentalité, à la famille et au mariage. »"
      yisrael-beiteinu:
        value: 1
        basis: platform
        source: { url: "https://beytenu.org.il/party-platform/", title: "המצע שלנו — ישראל ביתנו", publisher: "ישראל ביתנו" }
        quote:
          he: "\"הנהגת נישואין וגירושין אזרחיים לכל אזרח.\" (המצע אינו מזכיר זוגות בני אותו המין במפורש)"
          en: "\"Civil marriage and divorce for every citizen.\" (the platform does not name same-sex couples explicitly)"
          ar: "«الزواج والطلاق المدنيان لكل مواطن.» (لا يذكر البرنامج الأزواج من الجنس نفسه صراحةً)"
          ru: "«Гражданские браки и разводы для каждого гражданина». (однополые пары в программе прямо не названы)"
          es: "«Matrimonio y divorcio civiles para todos los ciudadanos.» (el programa no menciona expresamente a las parejas del mismo sexo)"
          fr: "« Le mariage et le divorce civils pour chaque citoyen. » (le programme ne mentionne pas explicitement les couples de même sexe)"
      blue-white:
        value: 1
        basis: statement
        recordOf:
          he: "תשובת המחנה הממלכתי לשאלון ynet לקראת בחירות 2022, לפני שהרשימה שבה לשם כחול לבן"
          en: "National Unity's answer to ynet's 2022 election questionnaire, before the list reverted to the Blue and White name"
          ar: "ردّ المعسكر الرسمي على استبيان ynet لانتخابات 2022، قبل أن تعود القائمة إلى اسم أزرق أبيض"
          ru: "ответ «Государственного лагеря» на анкету ynet к выборам 2022 года — до того, как список вернулся к названию «Кахоль-лаван»"
          es: "respuesta de Unidad Nacional al cuestionario electoral de ynet de 2022, antes de que la lista recuperara el nombre Azul y Blanco"
          fr: "réponse d’Unité nationale au questionnaire électoral d’ynet de 2022, avant que la liste ne reprenne le nom Bleu et Blanc"
        source: { url: "https://www.ynet.co.il/judaism/article/hkapng2vj", title: "המחנה הממלכתי: התשובות המלאות (2022-10-30)", publisher: "ynet" }
        quote:
          he: "\"לצד חתונה יהודית כדת משה וישראל, יש לאפשר את ברית הזוגיות, דבר שייתן אופציה לכל אזרחי ישראל למסד את הזכות לזוגיות ולתא משפחתי\" (נשאלו אם על המדינה להכיר בנישואים אזרחיים ובזוגות להט\"ב)."
          en: "\"Alongside a Jewish wedding under religious law, the civil partnership covenant should be allowed, giving every citizen of Israel an option to formalise the right to partnership and a family unit\" (asked about recognising civil marriage and LGBT couples)."
          ar: "«إلى جانب الزواج اليهودي وفق الشريعة، يجب السماح بعهد الشراكة المدنية، ما يمنح كل مواطني إسرائيل خيار ترسيخ الحق في الشراكة وفي تكوين أسرة» (سُئلوا عن الاعتراف بالزواج المدني وبالأزواج من مجتمع الميم)."
          ru: "«Наряду с еврейской свадьбой по закону Моисея и Израиля нужно разрешить гражданский союз, что даст каждому гражданину Израиля возможность оформить право на партнёрство и семью» (вопрос был о признании гражданского брака и ЛГБТ-пар)."
          es: "«Junto a una boda judía según la ley religiosa, debe permitirse la unión civil, que dé a todos los ciudadanos de Israel la opción de formalizar el derecho a la pareja y a una familia» (se les preguntó por el reconocimiento del matrimonio civil y de las parejas LGBT)."
          fr: "« À côté d’un mariage juif selon la loi religieuse, il faut permettre l’union civile, qui donnera à chaque citoyen d’Israël la possibilité de formaliser le droit au couple et à la famille » (la question portait sur la reconnaissance du mariage civil et des couples LGBT)."
      joint-list:
        value: 1
        basis: statement
        recordOf:
          he: "תשובת חד\"ש לשאלון ynet לקראת בחירות 2019 — תע\"ל ובל\"ד לא השיבו"
          en: "Hadash's answer to ynet's 2019 election questionnaire — Ta'al and Balad did not answer"
          ar: "ردّ الجبهة على استبيان ynet لانتخابات 2019 — العربية للتغيير والتجمع لم تردّا"
          ru: "ответ «Хадаш» на анкету ynet к выборам 2019 года — «Тааль» и «Балад» не ответили"
          es: "respuesta de Hadash al cuestionario electoral de ynet de 2019 — Ta’al y Balad no respondieron"
          fr: "réponse de Hadash au questionnaire électoral d’ynet de 2019 — Ta’al et Balad n’ont pas répondu"
        source: { url: "https://www.ynet.co.il/articles/0,7340,L-5490470,00.html", title: "צבא, שבת, גיור, נישואים, דת ומדינה: זה מה שענו המפלגות (2019-04-08)", publisher: "ynet" }
        quote:
          he: "\"מאמינים בהפרדת הדת מהמדינה, בביטול כל חוקי הכפייה הדתית, בהנהגת נישואים וגירושים אזרחיים – ובהכרה במסגרות משפחתיות אלטרנטיביות. מתנגדים לכל אפליה וחוסר שוויון מכל סוג ועל כל רקע.\""
          en: "\"We believe in separating religion from the state, abolishing all religious-coercion laws, instituting civil marriage and divorce – and recognising alternative family frameworks. We oppose all discrimination and inequality of any kind, on any grounds.\""
          ar: "«نؤمن بفصل الدين عن الدولة، وإلغاء جميع قوانين الإكراه الديني، واعتماد الزواج والطلاق المدنيين — والاعتراف بالأطر العائلية البديلة. نعارض كل تمييز وعدم مساواة من أي نوع وعلى أي خلفية.»"
          ru: "«Мы верим в отделение религии от государства, отмену всех законов о религиозном принуждении, введение гражданских браков и разводов — и в признание альтернативных форм семьи. Мы против любой дискриминации и неравенства любого рода и на любой почве»."
          es: "«Creemos en la separación entre religión y Estado, en abolir todas las leyes de coerción religiosa, en instaurar el matrimonio y el divorcio civiles y en reconocer los marcos familiares alternativos. Nos oponemos a toda discriminación y desigualdad de cualquier tipo y por cualquier motivo.»"
          fr: "« Nous croyons à la séparation de la religion et de l’État, à l’abolition de toutes les lois de coercition religieuse, à l’instauration du mariage et du divorce civils — et à la reconnaissance des cadres familiaux alternatifs. Nous nous opposons à toute discrimination et inégalité, de quelque nature et pour quelque motif que ce soit. »"
      shas:
        value: -2
        basis: statement
        source: { url: "https://www.ynet.co.il/judaism/article/skjsylheo", title: "ש\"ס: התשובות המלאות (2022-10-30)", publisher: "ynet" }
        quote:
          he: "\"נישואים אזרחיים נועדו לעקוף ולמחוק את זהותה היהודית של המדינה והמשפחה המסורתית. נמשיך לחתן את בנינו ובנותינו כדת משה וישראל\" (נשאלו אם על המדינה להכיר בנישואים אזרחיים ובזוגות להט\"ב)."
          en: "\"Civil marriage is meant to bypass and erase the Jewish identity of the state and the traditional family. We will keep marrying our sons and daughters under Jewish religious law\" (asked about recognising civil marriage and LGBT couples)."
          ar: "«الزواج المدني يهدف إلى الالتفاف على الهوية اليهودية للدولة وعلى العائلة التقليدية ومحوهما. سنواصل تزويج أبنائنا وبناتنا وفق الشريعة اليهودية» (سُئلوا عن الاعتراف بالزواج المدني وبالأزواج من مجتمع الميم)."
          ru: "«Гражданский брак призван обойти и стереть еврейскую идентичность государства и традиционную семью. Мы будем и дальше женить наших сыновей и выдавать замуж дочерей по закону Моисея и Израиля» (вопрос был о признании гражданского брака и ЛГБТ-пар)."
          es: "«El matrimonio civil pretende eludir y borrar la identidad judía del Estado y la familia tradicional. Seguiremos casando a nuestros hijos e hijas según la ley religiosa judía» (se les preguntó por el reconocimiento del matrimonio civil y de las parejas LGBT)."
          fr: "« Le mariage civil vise à contourner et effacer l’identité juive de l’État et la famille traditionnelle. Nous continuerons à marier nos fils et nos filles selon la loi religieuse juive » (la question portait sur la reconnaissance du mariage civil et des couples LGBT)."
      utj:
        value: -2
        basis: statement
        source: { url: "https://www.ynet.co.il/judaism/article/hyruplhvs", title: "יהדות התורה: התשובות המלאות (2022-10-30)", publisher: "ynet" }
        quote:
          he: "\"הסטטוס-קוו הלאומי חייב להישמר גם בנושא זה… אנו נהיה המזוזה של המדינה גם בנושא זה\" (נשאלו אם על המדינה להכיר בנישואים אזרחיים ובזוגות להט\"ב)."
          en: "\"The national status quo must be preserved on this issue too… we will be the state's mezuzah on this issue as well\" (asked about recognising civil marriage and LGBT couples)."
          ar: "«يجب الحفاظ على الوضع القائم الوطني في هذه المسألة أيضًا… سنكون ‹مزوزة› الدولة [لفافة الرَّقّ المثبّتة على باب البيت اليهودي] في هذه المسألة أيضًا» (سُئلوا عن الاعتراف بالزواج المدني وبالأزواج من مجتمع الميم)."
          ru: "«Национальный статус-кво должен сохраниться и в этом вопросе… мы будем мезузой государства и в этом вопросе» (вопрос был о признании гражданского брака и ЛГБТ-пар)."
          es: "«El statu quo nacional debe preservarse también en este asunto… seremos la mezuzá del Estado también en esto» (se les preguntó por el reconocimiento del matrimonio civil y de las parejas LGBT)."
          fr: "« Le statu quo national doit être préservé sur ce sujet aussi… nous serons la mezouza de l’État sur ce sujet également » (la question portait sur la reconnaissance du mariage civil et des couples LGBT)."
