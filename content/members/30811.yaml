  - kind: positive
    category: achievement
    title:
      he: "מנהיג עוצמה יהודית ושר לביטחון לאומי"
      en: "Leader of Otzma Yehudit and Minister of National Security"
    description:
      he: "הוביל את מפלגת עוצמה יהודית לכניסה משמעותית לכנסת ומונה לשר לביטחון לאומי בממשלה שהוקמה ב-2022. בינואר 2025 התפטר מהממשלה במחאה על הסכם הפסקת האש בעזה ושב לתפקידו במרץ 2025; הוא מכהן בתפקיד גם בממשלת המעבר."
      en: "Led the Otzma Yehudit party to a significant Knesset presence and was appointed Minister of National Security in the government formed in 2022. In January 2025 he resigned from the government in protest at the Gaza ceasefire deal and returned to the post in March 2025; he continues to hold it in the caretaker government."
