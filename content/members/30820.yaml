    description:
      he: לפני כניסתו לפוליטיקה עסק דוידסון בחינוך גופני ובשחייה כמורה ומאמן. ביוני
        2016 נבחר ליושב ראש איגוד השחייה בישראל, ומספטמבר אותה שנה החל לכהן כחבר
