      - kind: bad
        date: "2014-07-08"
        text: { he: "מבצע \"צוק איתן\" — מלחמה בת 50 יום מול חמאס בעזה.", en: "Operation Protective Edge — a 50-day war against Hamas in Gaza.", es: "La operación Margen Protector — una guerra de 50 días contra Hamás en Gaza.", fr: "L’opération Bordure protectrice — une guerre de 50 jours contre le Hamas à Gaza." }
    ended: { he: "התפרקה בדצמבר 2014 כשנתניהו פיטר את לפיד ולבני — לבחירות מוקדמות.", en: "Collapsed in December 2014 when Netanyahu dismissed Lapid and Livni — to early elections.", es: "Se derrumbó en diciembre de 2014 cuando Netanyahu destituyó a Lapid y Livni — hacia elecciones anticipadas.", fr: "Effondrement en décembre 2014 lorsque Netanyahou a limogé Lapid et Livni — vers des élections anticipées." }
  - knesset: 18
    date: "2009-02-10"
    turnout: 64.7
    winner: { he: "קדימה", en: "Kadima", es: "Kadima", fr: "Kadima" }
    winnerSeats: 28
    pm: { he: "בנימין נתניהו", en: "Benjamin Netanyahu", es: "Benjamín Netanyahu", fr: "Benyamin Netanyahou" }
    note: { he: "קדימה היתה הגדולה ביותר אך נתניהו (הליכוד) הרכיב את הממשלה.", en: "Kadima was largest, but Netanyahu (Likud) formed the government.", es: "Kadima fue el partido más grande, pero Netanyahu (Likud) formó el gobierno.", fr: "Kadima était le plus grand parti, mais Netanyahou (Likoud) a formé le gouvernement." }
    summary:
      he: "אף שקדימה (לבני) היתה הסיעה הגדולה ביותר, נתניהו הצליח להרכיב קואליציה ימנית והקים את ממשלתו השנייה, שכיהנה כמעט קדנציה מלאה."
