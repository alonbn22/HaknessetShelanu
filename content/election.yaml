disclaimer:
  he: "עמוד זה נערך על ידי האתר על בסיס המקורות המצוינים לצד כל פריט ומתעדכן ככל שהמערכה מתקדמת. הרכבי הרשימות אינם סופיים עד הגשתן לוועדת הבחירות המרכזית. מצאתם אי-דיוק? דווחו לנו ונתקן."
  en: "This page is edited by the site from the sources cited beside each item and is updated as the campaign develops. List line-ups are not final until submitted to the Central Elections Committee. Spotted an inaccuracy? Report it and we will fix it."
