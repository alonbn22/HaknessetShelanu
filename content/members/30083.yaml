      en: Cohen was questioned by police on suspicion that, while serving as foreign
        minister, he ordered the unlawful issuance of diplomatic passports to
        senior Likud members and to relatives of Prime Minister Netanyahu. On 17
        June 2026, Israel Police announced they had concluded the investigation
        and believe there is sufficient evidence to indict him on breach of
        trust. As of that date no indictment had been filed, and the decision on
        prosecution rests with the State Attorney. Cohen has denied the
        suspicions.
