      he: "לקראת הפריימריז אמר קלנר כי כל שריון ברשימת הליכוד מונע ממנו להתקדם. בפריימריז שנערכו ב-17 באוגוסט 2026 לא הגיע קלנר, לפי הדיווחים, למקום ריאלי ברשימת הליכוד לכנסת ה-26."
