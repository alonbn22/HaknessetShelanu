    title:
      he: הסיר את מועמדותו מהפריימריז בליכוד לקראת בחירות 2026
      en: Withdrew his candidacy from the Likud primary ahead of the 2026 election
    description:
      he: 'ב-13 באוגוסט 2026, ימים לפני הפריימריז בליכוד, הודיע רביבו כי לא יתמודד, בנימוק ש"שיטת הבחירות הנוכחית והשריונים מקשים מאוד על חברי הכנסת לחזור למקום ריאלי ברשימה", וכי "יכולתי לצאת למאבק פוליטי ומשפטי ארוך ויקר על המקום האישי שלי, אך בחרתי שלא לעשות זאת". הוא הוסיף: "אני מסיים את דרכי בכנסת, אך לא עוזב את הבית. אני נשאר איש ליכוד נאמן".'
      en: On 13 August 2026, days before the Likud primary, Revivo announced he would not run, explaining that "the current election system and the reserved slots make it very difficult for MKs to regain a realistic place on the list" and that "I could have embarked on a long and expensive political and legal battle for my personal spot, but I chose not to do so". He added, "I am ending my path in the Knesset, but I am not leaving the house. I remain a loyal Likud man."
