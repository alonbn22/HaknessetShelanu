  - kind: negative
    category: controversy
    title:
      he: שינוי מעמד התנין לצורך "כלא התנינים" בקציעות (2026)
      en: Reclassifying the crocodile to enable the Ktzi'ot "crocodile prison" plan (2026)
    description:
      he: ביולי 2026 חתמה סילמן, בעקבות פניית השר איתמר בן גביר, על שינוי מעמד תנין
        היאור מ"חיית בר מוגנת" ל"חיית בר מטופחת", כדי לאפשר החזקת תנינים במתחם כלא
        קציעות כאמצעי הרתעה נגד אסירים ביטחוניים — בניגוד לעמדת הלשכה המשפטית של
        משרדה ורשות הטבע והגנים, כפי שדווח. סילמן הסבירה כי "זה אמצעי הרתעה"
        וכי "אנחנו מדברים בשפה שהאויבים שלנו מבינים". ב-2 באוגוסט 2026 הוציא בית
        המשפט המחוזי בירושלים צו ארעי המקפיא את התוכנית בעקבות עתירת "תנו לחיות
        לחיות", וב-16 באוגוסט קראו עשרות אקולוגים ומומחי חיות בר לסילמן לבטל את
        ההחלטה לאלתר.
      en: In July 2026, at the request of Minister Itamar Ben Gvir, Silman signed a
        reclassification of the Nile crocodile from a "protected wild animal" to
        a "cultivated wild animal", to allow crocodiles to be kept at the Ktzi'ot
        prison compound as a deterrent against security prisoners — reportedly
        against the position of her ministry's legal adviser and the Nature and
        Parks Authority. Silman explained that "this is a deterrent measure" and
        that "we speak in a language our enemies understand". On 2 August 2026
        the Jerusalem District Court issued a temporary order freezing the plan
        following a petition by the group Let the Animals Live, and on 16 August
        dozens of ecologists and wildlife experts called on Silman to cancel the
        decision immediately.
    date: 2026-07-22
