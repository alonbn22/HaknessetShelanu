  - kind: negative
    category: controversy
    status: closed
    date: 2023-04-04
    title:
      he: "פרשת \"המימד החמישי\": חקירה בעניין התקשרות המשטרה עם חברה שבראשה עמד — גנץ לא היה חשוד, והתיק נסגר (2023)"
      en: "The \"Fifth Dimension\" affair: probe into a police contract with a company he chaired — Gantz was not a suspect, and the case was closed (2023)"
    description:
      he: "גנץ כיהן בשנים 2015–2018 כיו\"ר דירקטוריון חברת הסייבר \"המימד החמישי\". בפברואר 2019 דיווח \"הארץ\" כי משטרת ישראל התקשרה עם החברה בהיקף של מיליוני שקלים ללא מכרז, ובמרץ 2019 מצא מבקר המדינה ליקויים בהתקשרות. בפברואר 2020 הורה מ\"מ פרקליט המדינה על פתיחת חקירה פלילית, והיועץ המשפטי לממשלה אביחי מנדלבליט הבהיר כי גנץ אינו חשוד בפרשה. ב-4 באפריל 2023 הורה פרקליט המדינה עמית איסמן על סגירת התיק בהיעדר תשתית ראייתית מספקת נגד 15 החשודים; גנץ לא נמנה עמם."
      en: "From 2015 to 2018 Gantz chaired the board of the cyber company \"Fifth Dimension.\" In February 2019 Haaretz reported that the Israel Police had contracted with the company for millions of shekels without a tender, and in March 2019 the State Comptroller found flaws in the engagement. In February 2020 the acting State Attorney ordered a criminal investigation, and Attorney General Avichai Mandelblit clarified that Gantz was not a suspect in the affair. On 4 April 2023 State Attorney Amit Aisman ordered the case closed for insufficient evidence against the 15 suspects; Gantz was not among them."
