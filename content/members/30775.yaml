  - kind: neutral
    category: role
    date: 2026-06-23
    title:
      he: סגנית יושב ראש ועדת הבחירות המרכזית לכנסת ה-26
      en: Deputy chair of the Central Elections Committee for the 26th Knesset
    description:
      he: רון בן משה מכהנת כסגנית יו"ר ועדת הבחירות המרכזית מטעם כחול לבן. בדיון
        הוועדה ב-23 ביוני 2026, שבו הציג יו"ר הוועדה השופט נעם סולברג עקרונות
        לדחיית בחירות בשעת חירום, ביקשה מסולברג פירוט על ההיערכות מול איומים על
        טוהר הבחירות, ובהם התערבות זרה, קמפייני דיסאינפורמציה ושימוש מניפולטיבי
        בבינה מלאכותית.
      en: Ron Ben-Moshe serves as deputy chair of the Central Elections Committee on
        behalf of Blue and White. At the committee's session on 23 June 2026,
        in which its chair, Justice Noam Sohlberg, presented principles for
        postponing an election in an emergency, she asked Sohlberg for details
        on preparations against threats to election integrity, including foreign
        interference, disinformation campaigns and manipulative use of
        artificial intelligence.
    sources:
      - url: https://www.ynet.co.il/news/article/r1h7mu00zgg
        title: 'סולברג: "בשעת חירום, דחייה מוגבלת של הבחירות עשויה להיות מוצדקת"'
        publisher: Ynet
  - kind: neutral
    category: news
    date: "2026-08-25"
    title:
      he: הודיעה על פרישתה מכחול לבן
      en: Announced her departure from Blue and White
    description:
      he: >-
        ב-25 באוגוסט 2026 הודיעה רון בן משה, לשעבר מנכ"לית המפלגה, ליו"ר בני גנץ על
        פרישתה מכחול לבן, ואמרה כי לא תיקח חלק "במסגרת הפוליטית החדשה שהוא פועל
        להקים". לדבריה, "המאמץ לייצר אחדות הוא ראוי מאין כמוהו, אלא שלטעמי בדרך
        הנוכחית ובעת הזו, לא רק שהמאמץ עלול להיות לשווא - אלא אף עלול לגרום נזק",
        ותרחיש של אי-הצטרפות לממשלה בראשות גדי איזנקוט הוא בעיניה "קו אדום בוהק".
        הדיווחים לא ציינו אם תתמודד ברשימה אחרת.
      en: >-
        On 25 August 2026 Ron Ben-Moshe, formerly the party's director-general,
        informed chairman Benny Gantz that she was leaving Blue and White, saying
        she would not take part in "the new political framework he is working to
        establish". She said that "the effort to create unity is worthy beyond
        measure, but in my view, on the current path and at this time, the
        effort may not only be in vain but may even cause damage", and that a
        scenario of not joining a government headed by Gadi Eisenkot was for her
        "a bright red line". The reports did not say whether she would run on
        another list.
