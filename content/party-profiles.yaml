        - "Поддержка поселений и распространения суверенитета"
        - "Националистические позиции в вопросах еврейской идентичности"
      es:
        - Una política de seguridad interior y de aplicación de la ley de línea dura
        - Apoyo a los asentamientos y a la aplicación de la soberanía
        - Posiciones nacionalistas sobre la identidad judía
      fr:
