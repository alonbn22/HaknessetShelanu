      quote:
        he: "\"מפלגת עוצמה יהודית הוקמה בשנת 2004 מתוך הצורך לקדם אג'נדה יהודית ציונית ללא פשרות.\""
        en: "\"The Otzma Yehudit party was founded in 2004 out of the need to advance a Jewish, Zionist agenda without compromise.\""
        ar: "«تأسّس حزب عوتسما يهوديت عام 2004 انطلاقًا من الحاجة إلى دفع أجندة يهودية صهيونية بلا تنازلات.»"
        ru: "«Партия „Оцма Иегудит“ была основана в 2004 году из-за необходимости продвигать еврейскую сионистскую повестку без компромиссов»."
        es: "«El partido Otzma Yehudit se fundó en 2004 por la necesidad de impulsar una agenda judía y sionista sin concesiones.»"
