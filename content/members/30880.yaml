    title:
      he: הגיע למקום ה-20 בהצבעה לרשימה הארצית בפריימריז של הליכוד ושובץ במקום ה-35 ברשימה לכנסת ה-26
      en: Finished 20th in the national-list vote in the Likud primaries and was placed 35th on the list for the 26th Knesset
    description:
      he: בפריימריז של הליכוד שנערכו ב-17 באוגוסט 2026 הגיע בוארון, לפי דיווח מעריב על תוצאות הספירה, למקום ה-20 בהצבעה לרשימה הארצית. לאחר שיבוץ המקומות המשוריינים ונציגי המחוזות והמגזרים, הוצב במקום ה-35 ברשימת הליכוד שהוגשה לבחירות 27 באוקטובר 2026.
      en: In the Likud primaries held on 17 August 2026 Boaron finished, according to Maariv's report on the count, 20th in the vote for the national list. After the reserved, district and sectoral slots were interleaved, he was placed 35th on the Likud list submitted for the 27 October 2026 election.
