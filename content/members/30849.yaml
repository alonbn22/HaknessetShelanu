    date: "2026-07-02"
    title:
      he: יזמה עם ח"כ קרויזר דיון בוועדת הפנים בטענות על "ריסוס" ושליטה במזג האוויר
      en: Initiated with MK Kroizer an Interior Committee debate on claims of atmospheric "spraying" and weather control
    description:
      he: ב-2 ביולי 2026 קיימה ועדת הפנים והגנת הסביבה, לבקשת ח"כ סון הר מלך וח"כ יצחק קרויזר, דיון בטענות פעילים כי גורמים מרססים חומרים באטמוספירה כדי לשלוט במזג האוויר. כל נציגי הממשלה בדיון - ובהם משרד הבריאות, המשרד להגנת הסביבה והשירות המטאורולוגי - מסרו כי לא מתבצע ריסוס כזה בישראל; מנהל השירות המטאורולוגי ד"ר אמיר גבעתי אמר "איננו מודעים לפעילות כזו". ארגון גרינפיס ישראל מתח ביקורת על קיום הדיון.
      en: On 2 July 2026 the Knesset Interior and Environment Committee held, at the request of MK Son Har-Melech and MK Yitzhak Kroizer, a debate on activists' claims that parties spray substances into the atmosphere to control the weather. All government representatives at the debate - including the Health Ministry, the Environmental Protection Ministry and the Meteorological Service - said no such spraying takes place in Israel; Meteorological Service director Dr. Amir Givati said "we are not aware of any such activity". Greenpeace Israel criticized the holding of the debate.
    sources:
      - url: https://www.haaretz.com/science-and-health/2026-07-02/ty-article/knesset-debate-heats-up-over-climate-engineering-conspiracy-claims/0000019f-2303-d521-abdf-7f2fff810000
        title: Who Controls Israel's Weather? Knesset Debate Heats Up Over Climate-engineering Conspiracy Claims
        publisher: Haaretz
