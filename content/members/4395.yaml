    title:
      he: שר החקלאות וביטחון המזון (מ-2022)
      en: Minister of Agriculture and Food Security (since 2022)
    description:
      he: עם חזרת הליכוד לשלטון בסוף 2022 מונה אבי דיכטר לשר החקלאות וביטחון המזון,
        התפקיד שבו הוא מכהן גם בממשלת המעבר. קודם לכן כיהן כשר להגנת העורף (2012–2013), כיושב ראש ועדת החוץ והביטחון
        של הכנסת (2016–2019), ובאוקטובר 2019 מונה לסגן שר הביטחון.
      en: Following the Likud's return to power in late 2022, Avi Dichter was
        appointed Minister of Agriculture and Food Security, the office he
        continues to hold in the caretaker government. He had earlier served as Minister of Home Front Defence (2012–2013), chaired the Knesset's Foreign Affairs
        and Defense Committee (2016–2019), and in October 2019 was appointed deputy defense minister.
    date: 2022-12-29
