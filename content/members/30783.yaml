    title:
      he: חברת הכנסת מטעם יש עתיד
      en: Member of Knesset for Yesh Atid
    description:
      he: יסמין סאקס פרידמן (נולדה ב-12 ביוני 1973 בבאר שבע) מכהנת כחברת הכנסת מטעם
        מפלגת יש עתיד. היא נכנסה לכנסת ה-24 ב-15 ביוני 2021 מכוח 'החוק
        הנורווגי', לאחר שאורנה ברביבאי הפסיקה את חברותה בכנסת עם מינויה לממשלה,
        ונבחרה מחדש לכנסת ה-25.
      en: Yasmin Sacks Fridman (born 12 June 1973 in Beersheba) serves as a Member of
        Knesset for the Yesh Atid party. She entered the 24th Knesset on 15 June
        2021 under the 'Norwegian Law' after Orna Barbivai suspended her Knesset
        membership upon her appointment to the cabinet, and was subsequently
        re-elected to the 25th Knesset.
    date: 2021-06-15
