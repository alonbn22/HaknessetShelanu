  - kind: positive
    category: achievement
    title:
      he: יושב ראש ועדות בכנסת
      en: Chair of Knesset committees
    description:
      he: כחבר כנסת מטעם כחול לבן ולאחר מכן המחנה הממלכתי, כיהן ביטון כיושב ראש ועדת
        הכלכלה בכנסת ה-24, וכיושב ראש הוועדה המיוחדת לחיזוק ופיתוח הנגב והגליל
        בכנסת ה-25 עד 11 בפברואר 2025 (אז החליף אותו עודד פורר בהסכם רוטציה).
        ב-4 במרץ 2025 נבחר ליושב ראש הוועדה המיוחדת לפיקוח על תהליכי הסרת
        חסמים.
      en: As a member of Knesset for Blue and White and later the National Unity
        party, Biton served as chair of the Knesset's Economic Affairs Committee
        in the 24th Knesset and as chair of the Special Committee for the
        Strengthening and Development of the Negev and the Galilee in the 25th
        Knesset until 11 February 2025 (when Oded Forer replaced him under a
        rotation agreement). On 4 March 2025 he was elected chair of the new
        Special Committee for Oversight of Barrier-Removal Processes.
