    title:
      he: קריירה ניהולית בשירות הציבורי ובחינוך
      en: Management career in public service and education
    description:
      he: טרם כניסתו לכנסת ב-2014 צבר בן צור ניסיון ניהולי בשירות הציבורי, ובכלל זה
        כמנכ"ל החברה הממשלתית "המשקם" וכמנכ"ל רשת החינוך "מעיין החינוך התורני"
        בשנים 2007–2013. הוא בעל תואר שני במינהל ציבורי ומינהל עסקים מאוניברסיטת
        מנצ'סטר.
      en: Before entering the Knesset in 2014, Ben-Tzur held management roles in
        public service, including CEO of the government company HaMeshakem and
        Director-General of the Ma'ayan HaChinuch HaTorani education network
        (2007-2013). He holds a master's degree in public administration and
        business administration from the University of Manchester.
