  - knesset: 9
    date: "1977-05-17"
    turnout: 79.2
    winner: { he: "הליכוד", en: "Likud", ar: "الليكود", ru: "Ликуд", es: "Likud", fr: "Likoud" }
    winnerSeats: 43
    pm: { he: "מנחם בגין", en: "Menachem Begin", ar: "مناحيم بيغن", ru: "Менахем Бегин", es: "Menájem Beguin", fr: "Menahem Begin" }
    note: { he: "\"המהפך\" — הימין עלה לשלטון לראשונה אחרי שנים של שלטון מפא\"י/המערך.", en: "\"The Upheaval\" — the right took power for the first time after decades of Mapai/Alignment rule.", ar: "«الانقلاب» — وصل اليمين إلى الحكم لأول مرة بعد عقود من حكم مباي/المعراخ.", ru: "«Переворот» — правые впервые пришли к власти после десятилетий правления МАПАЙ/«Маараха».", es: "«El Vuelco» — la derecha llegó al poder por primera vez tras décadas de gobierno del Mapai/Alineamiento.", fr: "« Le Renversement » — la droite a pris le pouvoir pour la première fois après des décennies de domination du Mapaï/Alignement." }
    summary:
      he: "\"המהפך\" — הליכוד עלה לשלטון לראשונה. בגין חתם על הסכם השלום ההיסטורי עם מצרים."
      en: "\"The Upheaval\" — Likud rose to power for the first time. Begin signed the historic peace treaty with Egypt."
      ar: "«الانقلاب» — وصل الليكود إلى الحكم لأول مرة. ووقّع بيغن معاهدة السلام التاريخية مع مصر."
      ru: "«Переворот» — Ликуд впервые пришёл к власти. Бегин подписал исторический мирный договор с Египтом."
      es: "«El Vuelco» — el Likud llegó al poder por primera vez. Beguin firmó el histórico tratado de paz con Egipto."
      fr: "« Le Renversement » — le Likoud est arrivé au pouvoir pour la première fois. Begin a signé le traité de paix historique avec l’Égypte."
    events:
      - kind: good
        date: "1977-11-19"
        text: { he: "ביקור סאדאת בירושלים.", en: "Sadat's visit to Jerusalem.", ar: "زيارة السادات إلى القدس.", ru: "Визит Садата в Иерусалим.", es: "La visita de Sadat a Jerusalén.", fr: "La visite de Sadate à Jérusalem." }
      - kind: good
        date: "1979-03-26"
        text: { he: "הסכם השלום בין ישראל למצרים.", en: "The Egypt-Israel peace treaty.", ar: "معاهدة السلام بين إسرائيل ومصر.", ru: "Мирный договор между Израилем и Египтом.", es: "El tratado de paz entre Egipto e Israel.", fr: "Le traité de paix entre l’Égypte et Israël." }
      - kind: bad
        date: "1978-03-14"
        text: { he: "מבצע ליטני בדרום לבנון.", en: "Operation Litani in southern Lebanon.", ar: "عملية الليطاني في جنوب لبنان.", ru: "Операция «Литани» в Южном Ливане.", es: "La operación Litani en el sur del Líbano.", fr: "L’opération Litani au Sud-Liban." }
      - kind: good
        date: "1978-09-17"
        text: { he: "הסכמי קמפ דייוויד עם מצרים.", en: "The Camp David Accords with Egypt.", ar: "اتفاقيات كامب ديفيد مع مصر.", ru: "Кэмп-Дэвидские соглашения с Египтом.", es: "Los Acuerdos de Camp David con Egipto.", fr: "Les accords de Camp David avec l’Égypte." }
      - kind: neutral
        date: "1981-06-07"
        text: { he: "הפצצת הכור הגרעיני בעיראק (מבצע אופרה).", en: "The bombing of Iraq's nuclear reactor (Operation Opera).", ar: "قصف المفاعل النووي العراقي (عملية «أوبرا»).", ru: "Бомбардировка иракского ядерного реактора (операция «Опера»).", es: "El bombardeo del reactor nuclear iraquí (operación Ópera).", fr: "Le bombardement du réacteur nucléaire irakien (opération Opéra)." }
    ended: { he: "הכנסת פיזרה את עצמה בחוק — בחירות מוקדמות ביוני 1981.", en: "Dissolved itself by law — early elections in June 1981.", ar: "حلّ الكنيست نفسه بقانون — انتخابات مبكرة في حزيران/يونيو 1981.", ru: "Самораспустился законом — досрочные выборы в июне 1981 года.", es: "Se disolvió por ley — elecciones anticipadas en junio de 1981.", fr: "S’est dissoute par une loi — élections anticipées en juin 1981." }
    sources:
      - { url: "https://main.knesset.gov.il/en/about/history/Pages/KnessetHistory.aspx?kns=9", title: "9th Knesset: results of the elections (17 May 1977) and its governments", publisher: "הכנסת" }
      - { url: "https://www.gov.il/apps/elections/elections-knesset-19/heb/history/PercentVotes.html", title: "אחוז המצביעים בבחירות קודמות, הכנסת ה-1 עד ה-18 (אתר ועדת הבחירות המרכזית לכנסת ה-19)", publisher: "ועדת הבחירות המרכזית (gov.il)" }
      - { url: "https://en.idi.org.il/articles/38887", title: "Dissolving the Knesset: A Historical Survey (Chen Friedberg and Assaf Shapira, 18 May 2022)", publisher: "המכון הישראלי לדמוקרטיה" }
      - { url: "https://en.wikipedia.org/wiki/Operation_Opera", title: "Operation Opera", publisher: "Wikipedia" }
  - knesset: 8
    date: "1973-12-31"
    turnout: 78.6
    winner: { he: "המערך", en: "Alignment", ar: "المعراخ", ru: "«Маарах»", es: "Alineamiento (Maarach)", fr: "Alignement (Maarakh)" }
    winnerSeats: 51
    pm: { he: "גולדה מאיר ← יצחק רבין", en: "Golda Meir → Yitzhak Rabin", ar: "غولدا مئير ← يتسحاق رابين", ru: "Голда Меир → Ицхак Рабин", es: "Golda Meir → Isaac Rabin", fr: "Golda Meir → Yitzhak Rabin" }
    note: { he: "נדחו בשל מלחמת יום הכיפורים.", en: "Postponed due to the Yom Kippur War.", ar: "أُجّلت بسبب حرب يوم الغفران.", ru: "Перенесены из-за Войны Судного дня.", es: "Aplazadas por la guerra de Yom Kipur.", fr: "Reportées en raison de la guerre du Kippour." }
    summary:
      he: "הבחירות נדחו בשל מלחמת יום הכיפורים. ועדת אגרנט והביקורת הציבורית הפילו את גולדה מאיר, ורבין מונה לראש ממשלה."
      en: "The election was postponed by the Yom Kippur War. The Agranat Commission and public criticism brought down Golda Meir, and Rabin became prime minister."
      ar: "أُجّلت الانتخابات بسبب حرب يوم الغفران (تشرين الأول/أكتوبر 1973). وأطاحت لجنة أغرانات والانتقادات العامة بغولدا مئير، وعُيّن رابين رئيسًا للحكومة."
      ru: "Выборы были перенесены из-за Войны Судного дня. Комиссия Аграната и общественная критика привели к уходу Голды Меир, и премьер-министром стал Рабин."
      es: "Las elecciones se aplazaron por la guerra de Yom Kipur. La Comisión Agranat y las críticas públicas derribaron a Golda Meir, y Rabin pasó a ser primer ministro."
      fr: "L’élection a été reportée à cause de la guerre du Kippour. La commission Agranat et les critiques publiques ont fait chuter Golda Meir, et Rabin est devenu Premier ministre."
    events:
      - kind: bad
        date: "1973-10-06"
        text: { he: "מלחמת יום הכיפורים והמחדל שקדם לה.", en: "The Yom Kippur War and the failure that preceded it.", ar: "حرب يوم الغفران والإخفاق الذي سبقها.", ru: "Война Судного дня и предшествовавший ей провал.", es: "La guerra de Yom Kipur y el fallo que la precedió.", fr: "La guerre du Kippour et le fiasco (« mehdal ») qui l’a précédée." }
      - kind: neutral
        date: "1974-04-10"
        text: { he: "ועדת אגרנט; התפטרות גולדה מאיר ומינוי רבין.", en: "The Agranat Commission; Golda Meir's resignation and Rabin's appointment.", ar: "لجنة أغرانات؛ استقالة غولدا مئير وتعيين رابين.", ru: "Комиссия Аграната; отставка Голды Меир и назначение Рабина.", es: "La Comisión Agranat; la renuncia de Golda Meir y el nombramiento de Rabin.", fr: "La commission Agranat ; la démission de Golda Meir et la nomination de Rabin." }
      - kind: good
        date: "1976-07-04"
        text: { he: "מבצע אנטבה — חילוץ חטופי המטוס באוגנדה.", en: "Operation Entebbe — the rescue of hijacked-flight hostages in Uganda.", ar: "عملية عنتيبي — تحرير رهائن الطائرة المخطوفة في أوغندا.", ru: "Операция в Энтеббе — освобождение заложников угнанного самолёта в Уганде.", es: "La operación Entebbe — el rescate de los rehenes de un vuelo secuestrado en Uganda.", fr: "L’opération Entebbe — le sauvetage des otages d’un vol détourné en Ouganda." }
    ended: { he: "הכנסת פיזרה את עצמה בחוק והבחירות הוקדמו למאי 1977: בדצמבר 1976 התפטרה ממשלת רבין בעקבות משבר קואליציוני עם המפד\"ל, ובאפריל 1977 פרש רבין מראשות רשימת המערך על רקע פרשת חשבון הדולרים, ושמעון פרס החליף אותו.", en: "The Knesset dissolved itself by law, bringing the election forward to May 1977: in December 1976 Rabin's government resigned after a coalition crisis with the National Religious Party, and in April 1977 Rabin stepped down as head of the Alignment list over the dollar-account affair; Shimon Peres replaced him.", ar: "حلّ الكنيست نفسه بقانون فقُدّمت الانتخابات إلى أيار/مايو 1977: ففي كانون الأول/ديسمبر 1976 استقالت حكومة رابين إثر أزمة ائتلافية مع الحزب الوطني الديني، وفي نيسان/أبريل 1977 تنحّى رابين عن رئاسة قائمة «المعراخ» على خلفية قضية حساب الدولارات، وحلّ محلّه شمعون بيريس.", ru: "Кнессет самораспустился законом, и выборы перенесли на май 1977 года: в декабре 1976 года правительство Рабина ушло в отставку после коалиционного кризиса с Национально-религиозной партией, а в апреле 1977 года Рабин оставил пост главы списка «Маараха» из-за дела о долларовом счёте; его сменил Шимон Перес.", es: "La Knéset se disolvió por ley y adelantó las elecciones a mayo de 1977: en diciembre de 1976 dimitió el gobierno de Rabin tras una crisis de coalición con el Partido Nacional Religioso, y en abril de 1977 Rabin dejó la cabeza de la lista del Alineamiento por el asunto de la cuenta en dólares; lo sustituyó Shimon Peres.", fr: "La Knesset s’est dissoute par une loi, avançant l’élection à mai 1977 : en décembre 1976, le gouvernement Rabin a démissionné après une crise de coalition avec le Parti national religieux, et en avril 1977 Rabin a quitté la tête de la liste de l’Alignement à cause de l’affaire du compte en dollars ; Shimon Peres l’a remplacé." }
    sources:
      - { url: "https://main.knesset.gov.il/en/about/history/Pages/KnessetHistory.aspx?kns=8", title: "8th Knesset: results of the elections (31 December 1973) and its governments", publisher: "הכנסת" }
      - { url: "https://www.gov.il/apps/elections/elections-knesset-19/heb/history/PercentVotes.html", title: "אחוז המצביעים בבחירות קודמות, הכנסת ה-1 עד ה-18 (אתר ועדת הבחירות המרכזית לכנסת ה-19)", publisher: "ועדת הבחירות המרכזית (gov.il)" }
      - { url: "https://en.idi.org.il/articles/38887", title: "Dissolving the Knesset: A Historical Survey (Chen Friedberg and Assaf Shapira, 18 May 2022)", publisher: "המכון הישראלי לדמוקרטיה" }
      - { url: "https://en.idi.org.il/israeli-elections-and-parties/elections/1977/", title: "The 1977 elections", publisher: "המכון הישראלי לדמוקרטיה" }
      - { url: "https://en.wikipedia.org/wiki/1977_Israeli_legislative_election", title: "1977 Israeli legislative election", publisher: "Wikipedia" }
  - knesset: 7
    date: "1969-10-28"
    turnout: 81.7
    winner: { he: "המערך", en: "Alignment", ar: "المعراخ", ru: "«Маарах»", es: "Alineamiento (Maarach)", fr: "Alignement (Maarakh)" }
    winnerSeats: 56
    pm: { he: "גולדה מאיר", en: "Golda Meir", ar: "غولدا مئير", ru: "Голда Меир", es: "Golda Meir", fr: "Golda Meir" }
    summary:
      he: "ממשלת גולדה מאיר עם רוב גדול. הקדנציה לוותה במלחמת ההתשה ובטרור בינלאומי נגד ישראלים."
      en: "Golda Meir's government with a large majority. The term was marked by the War of Attrition and international terrorism against Israelis."
      ar: "حكومة غولدا مئير بأغلبية كبيرة. وتخلّلت الولاية حرب الاستنزاف والإرهاب الدولي ضد إسرائيليين."
      ru: "Правительство Голды Меир с большим большинством. Каденция была отмечена Войной на истощение и международным терроризмом против израильтян."
      es: "El gobierno de Golda Meir con una amplia mayoría. La legislatura estuvo marcada por la Guerra de Desgaste y por el terrorismo internacional contra israelíes."
      fr: "Le gouvernement de Golda Meir avec une large majorité. La législature a été marquée par la guerre d’usure et le terrorisme international contre des Israéliens."
    events:
      - kind: bad
        date: "1969-03-08"
        text: { he: "מלחמת ההתשה מול מצרים בתעלת סואץ.", en: "The War of Attrition with Egypt along the Suez Canal.", ar: "حرب الاستنزاف مع مصر على طول قناة السويس.", ru: "Война на истощение с Египтом вдоль Суэцкого канала.", es: "La Guerra de Desgaste con Egipto a lo largo del canal de Suez.", fr: "La guerre d’usure avec l’Égypte le long du canal de Suez." }
      - kind: bad
        date: "1972-09-05"
        text: { he: "הטבח בספורטאי ישראל באולימפיאדת מינכן.", en: "The massacre of Israeli athletes at the Munich Olympics.", ar: "مجزرة الرياضيين الإسرائيليين في أولمبياد ميونيخ.", ru: "Убийство израильских спортсменов на Олимпийских играх в Мюнхене.", es: "La masacre de los atletas israelíes en los Juegos Olímpicos de Múnich.", fr: "Le massacre des athlètes israéliens aux Jeux olympiques de Munich." }
    ended: { he: "השלימה כהונה מלאה; הבחירות, שנקבעו לאוקטובר 1973, נדחו בחודשיים, ל-31 בדצמבר, בשל מלחמת יום הכיפורים.", en: "Served its full term; the election, due in October 1973, was postponed by two months, to 31 December, because of the Yom Kippur War.", ar: "أتمّ ولايته كاملة؛ وأُجّلت الانتخابات، التي كانت مقرّرة في تشرين الأول/أكتوبر 1973، شهرين إلى 31 كانون الأول/ديسمبر بسبب حرب يوم الغفران.", ru: "Проработал полный срок; выборы, назначенные на октябрь 1973 года, перенесли на два месяца, на 31 декабря, из-за Войны Судного дня.", es: "Cumplió su legislatura entera; las elecciones, previstas para octubre de 1973, se aplazaron dos meses, al 31 de diciembre, por la guerra de Yom Kipur.", fr: "A accompli sa législature complète ; l’élection, prévue en octobre 1973, a été reportée de deux mois, au 31 décembre, à cause de la guerre du Kippour." }
    sources:
      - { url: "https://main.knesset.gov.il/en/about/history/Pages/KnessetHistory.aspx?kns=7", title: "7th Knesset: results of the elections (28 October 1969) and its governments", publisher: "הכנסת" }
      - { url: "https://www.gov.il/apps/elections/elections-knesset-19/heb/history/PercentVotes.html", title: "אחוז המצביעים בבחירות קודמות, הכנסת ה-1 עד ה-18 (אתר ועדת הבחירות המרכזית לכנסת ה-19)", publisher: "ועדת הבחירות המרכזית (gov.il)" }
      - { url: "https://en.idi.org.il/articles/38887", title: "Dissolving the Knesset: A Historical Survey (Chen Friedberg and Assaf Shapira, 18 May 2022)", publisher: "המכון הישראלי לדמוקרטיה" }
      - { url: "https://main.knesset.gov.il/EN/Documents/2022-10-24%20Fact%20sheet%2002%20-%2025th%20Knesset%20elections%20-%20updated.pdf", title: "Fact sheet: The 25th Knesset elections (October 2022)", publisher: "מרכז המחקר והמידע של הכנסת" }
  - knesset: 6
    date: "1965-11-02"
    turnout: 83.0
    winner: { he: "המערך", en: "Alignment", ar: "المعراخ", ru: "«Маарах»", es: "Alineamiento (Maarach)", fr: "Alignement (Maarakh)" }
    winnerSeats: 45
    pm: { he: "לוי אשכול", en: "Levi Eshkol", ar: "ليفي أشكول", ru: "Леви Эшколь", es: "Levi Eshkol", fr: "Levi Eshkol" }
    summary:
      he: "ממשלת אשכול. הניצחון המהיר במלחמת ששת הימים שינה את גבולות המדינה ואת המזרח התיכון."
      en: "Eshkol's government. The swift victory in the Six-Day War reshaped the country's borders and the Middle East."
      ar: "حكومة أشكول. غيّر الانتصار السريع في حرب الأيام الستة حدود الدولة والشرق الأوسط."
      ru: "Правительство Эшколя. Быстрая победа в Шестидневной войне изменила границы страны и Ближний Восток."
      es: "El gobierno de Eshkol. La rápida victoria en la Guerra de los Seis Días redibujó las fronteras del país y Oriente Medio."
      fr: "Le gouvernement Eshkol. La victoire rapide de la guerre des Six Jours a redessiné les frontières du pays et le Moyen-Orient."
    events:
      - kind: neutral
        date: "1967-06-05"
        text: { he: "מלחמת ששת הימים — תפיסת יו\"ש, עזה, סיני והגולן.", en: "The Six-Day War — capture of the West Bank, Gaza, Sinai and the Golan.", ar: "حرب الأيام الستة — السيطرة على الضفة الغربية وغزة وسيناء والجولان.", ru: "Шестидневная война — взятие под контроль Иудеи и Самарии (Западного берега), Газы, Синая и Голан.", es: "La Guerra de los Seis Días — la toma de Cisjordania, Gaza, el Sinaí y el Golán.", fr: "La guerre des Six Jours — la prise de la Cisjordanie, de Gaza, du Sinaï et du Golan." }
    ended: { he: "השלימה כהונה מלאה — בחירות אוקטובר 1969. אשכול נפטר בפברואר 1969, וגולדה מאיר החליפה אותו.", en: "Served its full term — October 1969 election. Eshkol died in February 1969, and Golda Meir succeeded him.", ar: "أتمّ ولايته كاملة — انتخابات تشرين الأول/أكتوبر 1969. توفي أشكول في شباط/فبراير 1969، وخلفته غولدا مئير.", ru: "Проработал полный срок — выборы в октябре 1969 года. Эшколь умер в феврале 1969 года, и его сменила Голда Меир.", es: "Cumplió su legislatura entera — elecciones de octubre de 1969. Eshkol murió en febrero de 1969 y lo sucedió Golda Meir.", fr: "A accompli sa législature complète — élection d’octobre 1969. Eshkol est mort en février 1969, et Golda Meir lui a succédé." }
    sources:
      - { url: "https://main.knesset.gov.il/en/about/history/Pages/KnessetHistory.aspx?kns=6", title: "6th Knesset: results of the elections (2 November 1965) and its governments", publisher: "הכנסת" }
      - { url: "https://www.gov.il/apps/elections/elections-knesset-19/heb/history/PercentVotes.html", title: "אחוז המצביעים בבחירות קודמות, הכנסת ה-1 עד ה-18 (אתר ועדת הבחירות המרכזית לכנסת ה-19)", publisher: "ועדת הבחירות המרכזית (gov.il)" }
      - { url: "https://en.idi.org.il/articles/38887", title: "Dissolving the Knesset: A Historical Survey (Chen Friedberg and Assaf Shapira, 18 May 2022)", publisher: "המכון הישראלי לדמוקרטיה" }
      - { url: "https://en.idi.org.il/israeli-elections-and-parties/elections/1965/", title: "About the 1965 Elections", publisher: "המכון הישראלי לדמוקרטיה" }
  - knesset: 5
    date: "1961-08-15"
    # IDI: 1,037,030 votes of 1,271,285 eligible, 81.6%. The CEC's table prints 83.0,
    # the same figure as 1965's, which its own eligible count doesn't support.
    turnout: 81.6
    winner: { he: "מפא\"י", en: "Mapai", ar: "مباي", ru: "МАПАЙ", es: "Mapai", fr: "Mapaï" }
    winnerSeats: 42
    pm: { he: "דוד בן־גוריון", en: "David Ben-Gurion", ar: "دافيد بن غوريون", ru: "Давид Бен-Гурион", es: "David Ben-Gurión", fr: "David Ben Gourion" }
    summary:
      he: "ממשלתו האחרונה של בן-גוריון. ב-1963 התפטר מראשות הממשלה בנימוקים אישיים, על רקע פרשת לבון והקרע במפא\"י. משפט אייכמן התקיים בתקופה זו."
      en: "Ben-Gurion's last government. He resigned as prime minister in 1963, citing personal reasons, amid the Lavon affair and a rift in Mapai. The Eichmann trial took place during this period."
      ar: "حكومة بن غوريون الأخيرة. استقال من رئاسة الحكومة عام 1963 معلّلًا ذلك بأسباب شخصية، على خلفية قضية لافون والشرخ داخل مباي. وجرت محاكمة أيخمان في هذه الفترة."
      ru: "Последнее правительство Бен-Гуриона. В 1963 году он ушёл с поста премьер-министра, сославшись на личные причины, на фоне дела Лавона и раскола в МАПАЙ. В этот период прошёл суд над Эйхманом."
      es: "El último gobierno de Ben-Gurión. Dimitió como primer ministro en 1963, alegando motivos personales, en medio del asunto Lavon y de una división en el Mapai. El juicio a Eichmann tuvo lugar en este período."
      fr: "Le dernier gouvernement de Ben Gourion. Il a quitté la tête du gouvernement en 1963, invoquant des raisons personnelles, sur fond d’affaire Lavon et de divisions au sein du Mapaï. Le procès Eichmann a eu lieu durant cette période."
    events:
      - kind: neutral
        date: "1961-04-11"
        text: { he: "משפט אדולף אייכמן בירושלים.", en: "The trial of Adolf Eichmann in Jerusalem.", ar: "محاكمة أدولف أيخمان في القدس.", ru: "Суд над Адольфом Эйхманом в Иерусалиме.", es: "El juicio a Adolf Eichmann en Jerusalén.", fr: "Le procès d’Adolf Eichmann à Jérusalem." }
      - kind: neutral
        date: "1963-06-16"
        text: { he: "בן-גוריון התפטר מראשות הממשלה בנימוקים אישיים, על רקע פרשת לבון; אשכול מונה לראש ממשלה.", en: "Ben-Gurion resigned as prime minister, citing personal reasons, amid the Lavon affair; Eshkol became prime minister.", ar: "استقال بن غوريون من رئاسة الحكومة معلّلًا ذلك بأسباب شخصية، على خلفية قضية لافون؛ وأصبح أشكول رئيسًا للحكومة.", ru: "Бен-Гурион ушёл с поста премьер-министра, сославшись на личные причины, на фоне дела Лавона; премьер-министром стал Эшколь.", es: "Ben-Gurión dimitió como primer ministro, alegando motivos personales, en medio del asunto Lavon; Eshkol pasó a ser primer ministro.", fr: "Ben Gourion a quitté la tête du gouvernement, invoquant des raisons personnelles, sur fond d’affaire Lavon ; Eshkol est devenu Premier ministre." }
    ended: { he: "השלימה כהונה מלאה — בחירות נובמבר 1965. לפניהן פרש בן-גוריון ממפא\"י והקים את רפ\"י.", en: "Served its full term — November 1965 election. Before it, Ben-Gurion left Mapai and founded Rafi.", ar: "أتمّ ولايته كاملة — انتخابات تشرين الثاني/نوفمبر 1965. وقبلها انشقّ بن غوريون عن مباي وأسّس رافي.", ru: "Проработал полный срок — выборы в ноябре 1965 года. Перед ними Бен-Гурион вышел из МАПАЙ и основал РАФИ.", es: "Cumplió su legislatura entera — elecciones de noviembre de 1965. Antes, Ben-Gurión rompió con el Mapai y fundó Rafi.", fr: "A accompli sa législature complète — élection de novembre 1965. Auparavant, Ben Gourion avait rompu avec le Mapaï et fondé le Rafi." }
    sources:
      - { url: "https://main.knesset.gov.il/en/about/history/Pages/KnessetHistory.aspx?kns=5", title: "5th Knesset: results of the elections (15 August 1961) and its governments", publisher: "הכנסת" }
      - { url: "https://en.idi.org.il/israeli-elections-and-parties/elections/1961/", title: "Elections for the 5th Knesset (15.8.1961): results and voter turnout", publisher: "המכון הישראלי לדמוקרטיה" }
      - { url: "https://en.idi.org.il/articles/38887", title: "Dissolving the Knesset: A Historical Survey (Chen Friedberg and Assaf Shapira, 18 May 2022)", publisher: "המכון הישראלי לדמוקרטיה" }
      - { url: "https://en.idi.org.il/israeli-elections-and-parties/elections/1965/", title: "About the 1965 Elections", publisher: "המכון הישראלי לדמוקרטיה" }
      - { url: "https://www.walla.co.il/news/israel/2651048", title: "כשבן גוריון הודיע לשריו: \"אינני יכול להמשיך\"", publisher: "וואלה" }
  - knesset: 4
    date: "1959-11-03"
    turnout: 81.6
    winner: { he: "מפא\"י", en: "Mapai", ar: "مباي", ru: "МАПАЙ", es: "Mapai", fr: "Mapaï" }
    winnerSeats: 47
    pm: { he: "דוד בן־גוריון", en: "David Ben-Gurion", ar: "دافيد بن غوريون", ru: "Давид Бен-Гурион", es: "David Ben-Gurión", fr: "David Ben Gourion" }
    summary:
      he: "מפא\"י בשיא כוחה תחת בן-גוריון, אך הקדנציה היתה קצרה והופלה בשל \"פרשת לבון\"."
      en: "Mapai at its peak under Ben-Gurion, but the term was short and brought down by the \"Lavon Affair.\""
      ar: "مباي في ذروة قوته بقيادة بن غوريون، لكن الولاية كانت قصيرة وأسقطتها «قضية لافون»."
      ru: "МАПАЙ на пике силы под руководством Бен-Гуриона, но каденция была короткой и прервалась из-за «дела Лавона»."
      es: "El Mapai en su apogeo con Ben-Gurión, pero la legislatura fue corta y cayó por el «asunto Lavon»."
      fr: "Le Mapaï à son apogée sous Ben Gourion, mais la législature a été courte et emportée par l’« affaire Lavon »."
    events:
      - kind: neutral
        date: "1960-12-01"
        text: { he: "התפרצות מחודשת של \"פרשת לבון\" שזעזעה את הקואליציה.", en: "A renewed eruption of the \"Lavon Affair\" that shook the coalition.", ar: "تجدّد «قضية لافون» التي هزّت الائتلاف.", ru: "Новое обострение «дела Лавона», потрясшее коалицию.", es: "Un nuevo estallido del «asunto Lavon» que sacudió la coalición.", fr: "Une nouvelle flambée de l’« affaire Lavon » qui a ébranlé la coalition." }
    ended: { he: "פוזרה ב-1961 על רקע פרשת לבון — בחירות מוקדמות.", en: "Dissolved in 1961 over the Lavon Affair — early elections.", ar: "حُلّ في 1961 على خلفية قضية لافون — انتخابات مبكرة.", ru: "Распущен в 1961 году из-за дела Лавона — досрочные выборы.", es: "Disuelta en 1961 por el asunto Lavon — elecciones anticipadas.", fr: "Dissoute en 1961 à cause de l’affaire Lavon — élections anticipées." }
    sources:
      - { url: "https://main.knesset.gov.il/en/about/history/Pages/KnessetHistory.aspx?kns=4", title: "4th Knesset: results of the elections (3 November 1959) and its governments", publisher: "הכנסת" }
      - { url: "https://www.gov.il/apps/elections/elections-knesset-19/heb/history/PercentVotes.html", title: "אחוז המצביעים בבחירות קודמות, הכנסת ה-1 עד ה-18 (אתר ועדת הבחירות המרכזית לכנסת ה-19)", publisher: "ועדת הבחירות המרכזית (gov.il)" }
  - knesset: 3
    date: "1955-07-26"
    turnout: 82.8
    winner: { he: "מפא\"י", en: "Mapai", ar: "مباي", ru: "МАПАЙ", es: "Mapai", fr: "Mapaï" }
    winnerSeats: 40
    pm: { he: "דוד בן־גוריון", en: "David Ben-Gurion", ar: "دافيد بن غوريون", ru: "Давид Бен-Гурион", es: "David Ben-Gurión", fr: "David Ben Gourion" }
    summary:
      he: "בן-גוריון שב לראשות הממשלה. הקדנציה כללה את מבצע סיני (מלחמת קדש) ב-1956."
      en: "Ben-Gurion returned to the premiership. The term included the Sinai Campaign (Suez War) of 1956."
      ar: "عاد بن غوريون إلى رئاسة الحكومة. وشملت الولاية حملة سيناء (حرب السويس) عام 1956."
      ru: "Бен-Гурион вернулся на пост премьер-министра. На эту каденцию пришлась Синайская кампания (Суэцкий кризис) 1956 года."
      es: "Ben-Gurión volvió a la jefatura del gobierno. La legislatura incluyó la Campaña del Sinaí (guerra de Suez) de 1956."
      fr: "Ben Gourion est revenu à la tête du gouvernement. La législature a inclus la campagne du Sinaï (guerre de Suez) de 1956."
    events:
      - kind: neutral
        date: "1956-10-29"
        text: { he: "מבצע קדש — מלחמת סיני.", en: "The Sinai Campaign (Suez War).", ar: "حملة سيناء (حرب السويس).", ru: "Синайская кампания (Суэцкий кризис).", es: "La Campaña del Sinaí (guerra de Suez).", fr: "La campagne du Sinaï (guerre de Suez)." }
    ended: { he: "השלימה כהונה — בחירות 1959.", en: "Served its term — 1959 election.", ar: "أتمّ ولايته — انتخابات 1959.", ru: "Проработал полный срок — выборы 1959 года.", es: "Cumplió su legislatura — elecciones de 1959.", fr: "A accompli sa législature — élection de 1959." }
    sources:
      - { url: "https://main.knesset.gov.il/en/about/history/Pages/KnessetHistory.aspx?kns=3", title: "3rd Knesset: results of the elections (26 July 1955) and its governments", publisher: "הכנסת" }
      - { url: "https://www.gov.il/apps/elections/elections-knesset-19/heb/history/PercentVotes.html", title: "אחוז המצביעים בבחירות קודמות, הכנסת ה-1 עד ה-18 (אתר ועדת הבחירות המרכזית לכנסת ה-19)", publisher: "ועדת הבחירות המרכזית (gov.il)" }
  - knesset: 2
    date: "1951-07-30"
    turnout: 75.1
    winner: { he: "מפא\"י", en: "Mapai", ar: "مباي", ru: "МАПАЙ", es: "Mapai", fr: "Mapaï" }
    winnerSeats: 45
    pm: { he: "דוד בן־גוריון", en: "David Ben-Gurion", ar: "دافيد بن غوريون", ru: "Давид Бен-Гурион", es: "David Ben-Gurión", fr: "David Ben Gourion" }
    summary:
      he: "שנות העיצוב של המדינה הצעירה. הסכם השילומים מגרמניה עורר מחאות סוערות."
      en: "The formative years of the young state. The reparations agreement with Germany sparked stormy protests."
      ar: "سنوات التأسيس للدولة الفتية. وأثارت اتفاقية التعويضات مع ألمانيا احتجاجات عاصفة."
      ru: "Годы становления молодого государства. Соглашение о репарациях с Германией вызвало бурные протесты."
      es: "Los años formativos del joven Estado. El acuerdo de reparaciones con Alemania desató protestas tormentosas."
      fr: "Les années fondatrices du jeune État. L’accord de réparations avec l’Allemagne a déclenché des manifestations houleuses."
    events:
      - kind: neutral
        date: "1952-01-07"
        text: { he: "הסכם השילומים מגרמניה ומחאות סוערות נגדו.", en: "The reparations agreement with Germany and fierce protests against it.", ar: "اتفاقية التعويضات مع ألمانيا والاحتجاجات العاصفة ضدها.", ru: "Соглашение о репарациях с Германией и бурные протесты против него.", es: "El acuerdo de reparaciones con Alemania y las duras protestas en su contra.", fr: "L’accord de réparations avec l’Allemagne et les vives protestations contre lui." }
    ended: { he: "השלימה כהונה — בחירות 1955.", en: "Served its term — 1955 election.", ar: "أتمّ ولايته — انتخابات 1955.", ru: "Проработал полный срок — выборы 1955 года.", es: "Cumplió su legislatura — elecciones de 1955.", fr: "A accompli sa législature — élection de 1955." }
    sources:
      - { url: "https://main.knesset.gov.il/en/about/history/Pages/KnessetHistory.aspx?kns=2", title: "2nd Knesset: results of the elections (30 July 1951) and its governments", publisher: "הכנסת" }
      - { url: "https://www.gov.il/apps/elections/elections-knesset-19/heb/history/PercentVotes.html", title: "אחוז המצביעים בבחירות קודמות, הכנסת ה-1 עד ה-18 (אתר ועדת הבחירות המרכזית לכנסת ה-19)", publisher: "ועדת הבחירות המרכזית (gov.il)" }
  - knesset: 1
    date: "1949-01-25"
    turnout: 86.9
    winner: { he: "מפא\"י", en: "Mapai", ar: "مباي", ru: "МАПАЙ", es: "Mapai", fr: "Mapaï" }
    winnerSeats: 46
    pm: { he: "דוד בן־גוריון", en: "David Ben-Gurion", ar: "دافيد بن غوريون", ru: "Давид Бен-Гурион", es: "David Ben-Gurión", fr: "David Ben Gourion" }
    note: { he: "הבחירות הראשונות למדינת ישראל (לאספה המכוננת).", en: "The first elections of the State of Israel (to the Constituent Assembly).", ar: "أول انتخابات في دولة إسرائيل (للجمعية التأسيسية).", ru: "Первые выборы в Государстве Израиль (в Учредительное собрание).", es: "Las primeras elecciones del Estado de Israel (a la Asamblea Constituyente).", fr: "Les premières élections de l’État d’Israël (à l’Assemblée constituante)." }
    summary:
      he: "הכנסת הראשונה (שכונתה תחילה האספה המכוננת) הניחה את יסודות המדינה בתקופת קליטת עלייה המונית וצנע."
      en: "The first Knesset (initially the Constituent Assembly) laid the state's foundations during mass immigration and austerity."
      ar: "وضع الكنيست الأول (الذي سُمّي في البداية الجمعية التأسيسية) أسس الدولة في فترة استيعاب الهجرة الجماعية والتقشف."
      ru: "Кнессет 1-го созыва (первоначально — Учредительное собрание) заложил основы государства в период массовой алии и режима жёсткой экономии."
      es: "La primera Knéset (inicialmente la Asamblea Constituyente) sentó las bases del Estado en plena inmigración masiva y austeridad."
      fr: "La première Knesset (d’abord l’Assemblée constituante) a posé les fondations de l’État en pleine immigration massive et austérité."
    events:
      - kind: neutral
        date: "1950-07-05"
        text: { he: "חקיקת חוק השבות.", en: "The enactment of the Law of Return.", ar: "سنّ قانون العودة.", ru: "Принятие Закона о возвращении.", es: "La promulgación de la Ley del Retorno.", fr: "L’adoption de la loi du retour." }
      - kind: neutral
        date: "1949-04-01"
        text: { he: "תקופת הצנע וקליטת עלייה המונית.", en: "The austerity (tzena) period and mass-immigration absorption.", ar: "فترة التقشف («تسينع») واستيعاب الهجرة الجماعية.", ru: "Период жёсткой экономии («цена») и абсорбция массовой алии.", es: "El período de austeridad (tzena) y la absorción de la inmigración masiva.", fr: "La période d’austérité (tzena) et l’absorption de l’immigration massive." }
      - kind: neutral
        date: "1949-02-24"
        text: { he: "הסכמי שביתת הנשק שסיימו את מלחמת העצמאות.", en: "The Armistice Agreements that ended the War of Independence.", ar: "اتفاقيات الهدنة التي أنهت حرب 1948.", ru: "Соглашения о перемирии, завершившие Войну за независимость.", es: "Los Acuerdos de Armisticio que pusieron fin a la Guerra de la Independencia.", fr: "Les accords d’armistice qui ont mis fin à la guerre d’Indépendance." }
    ended: { he: "פוזרה ב-1951 על רקע משבר החינוך הדתי — בחירות מוקדמות.", en: "Dissolved in 1951 over the religious-education crisis — early elections.", ar: "حُلّ في 1951 على خلفية أزمة التعليم الديني — انتخابات مبكرة.", ru: "Распущен в 1951 году из-за кризиса вокруг религиозного образования — досрочные выборы.", es: "Disuelta en 1951 por la crisis de la educación religiosa — elecciones anticipadas.", fr: "Dissoute en 1951 à cause de la crise de l’éducation religieuse — élections anticipées." }
    sources:
      - { url: "https://main.knesset.gov.il/en/about/history/Pages/KnessetHistory.aspx?kns=1", title: "1st Knesset: results of the elections (25 January 1949) and its governments", publisher: "הכנסת" }
