        title: "Avi Maoz"
        publisher: "Wikipedia"
      - url: "https://he.wikipedia.org/wiki/%D7%90%D7%91%D7%99_%D7%9E%D7%A2%D7%95%D7%96"
        title: "אבי מעוז"
        publisher: "Wikipedia (Hebrew)"
  - kind: positive
    category: achievement
    date: "2022-11-27"
    title:
      he: "סגן שר במשרד ראש הממשלה וראש הרשות לזהות יהודית לאומית (2023–2025)"
      en: "Deputy minister in the Prime Minister's Office and head of the National Jewish Identity Authority (2023–2025)"
    description:
      he: "בהסכם הקואליציוני שנחתם ב-27 בנובמבר 2022 מונה מעוז לסגן שר במשרד ראש הממשלה, האחראי על רשות חדשה לזהות יהודית לאומית ועל נתיב. הוא התפטר בפברואר 2023 (בתוקף מ-1 במרץ) בטענה שההסכם אינו מכובד, וב-28 במאי 2023 אישרה הממשלה את שובו לתפקיד עם תקציב של כ-285 מיליון ש\"ח לרשות. ב-24 במרץ 2025 התפטר שוב."
      en: "Under the coalition agreement signed on 27 November 2022, Maoz was appointed a deputy minister in the Prime Minister's Office, responsible for a new National Jewish Identity Authority and for Nativ. He resigned in February 2023 (effective 1 March), saying the agreement was not being honoured, and on 28 May 2023 the cabinet approved his return with a budget of about NIS 285 million for the authority. He resigned again on 24 March 2025."
    sources:
