      he: כינס בוועדת הפנים דיון בטענות על "ריסוס" ושליטה במזג האוויר
      en: Convened an Interior Committee debate on claims of atmospheric "spraying" and weather control
    description:
      he: ב-2 ביולי 2026 קיימה ועדת הפנים והגנת הסביבה בראשות קרויזר, לבקשתו ולבקשת ח"כ לימור סון הר מלך, דיון בטענות פעילים כי גורמים מרססים חומרים באטמוספירה כדי לשלוט במזג האוויר. כל נציגי הממשלה בדיון - ובהם משרד הבריאות, המשרד להגנת הסביבה והשירות המטאורולוגי - מסרו כי לא מתבצע ריסוס כזה בישראל; מנהל השירות המטאורולוגי ד"ר אמיר גבעתי אמר "איננו מודעים לפעילות כזו". ארגון גרינפיס ישראל מתח ביקורת על קיום הדיון.
      en: On 2 July 2026 the Knesset Interior and Environment Committee, chaired by Kroizer, held at his request and that of MK Limor Son Har-Melech a debate on activists' claims that parties spray substances into the atmosphere to control the weather. All government representatives at the debate - including the Health Ministry, the Environmental Protection Ministry and the Meteorological Service - said no such spraying takes place in Israel; Meteorological Service director Dr. Amir Givati said "we are not aware of any such activity". Greenpeace Israel criticized the holding of the debate.
    sources:
