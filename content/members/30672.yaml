    title:
      he: נכלל ברשימת יהדות התורה לכנסת ה-26
      en: Included on the United Torah Judaism list for the 26th Knesset
    description:
      he: לקראת בחירות 27 באוקטובר 2026 נכלל פינדרוס ברשימה המשותפת של יהדות התורה
        (דגל התורה ואגודת ישראל) בראשות יעקב אשר, לאחר שהוחלט כי ח"כים משה גפני
        ואורי מקלב לא ימשיכו לכהן. ברשימה שהוגשה לוועדת הבחירות הוא מוצב במקום
        השלישי.
      en: Ahead of the 27 October 2026 election, Pindrus was included on the joint
        United Torah Judaism list (Degel HaTorah and Agudat Yisrael) headed by
        Yaakov Asher, after it was decided that MKs Moshe Gafni and Uri Maklev
        would not continue. On the list submitted to the Central Elections
        Committee he is placed third.
