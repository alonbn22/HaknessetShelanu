        publisher: "N12 / Mako"
  - kind: neutral
    category: role
    date: "2025-03-24"
    title:
      he: "התפטר מתפקיד סגן השר; מכהן כחבר כנסת וכיושב ראש סיעת נועם"
      en: "Resigned as deputy minister; serves as a member of Knesset and chair of the Noam faction"
    description:
      he: "ב-24 במרץ 2025 הודיע מעוז לראש הממשלה על התפטרותו מתפקיד סגן השר במשרד ראש הממשלה, בטענה כי \"מדינה עמוקה\" במשרדי המשפטים והחינוך מסכלת את עבודתו וכי אף סעיף בהסכם הקואליציוני לא קוים, כך שהיה \"סגן שר על הנייר בלבד\". הוא נותר חבר כנסת ויושב ראש סיעת נועם."
      en: "On 24 March 2025 Maoz informed the prime minister that he was resigning as deputy minister in the Prime Minister's Office, alleging that a \"deep state\" in the Justice and Education ministries was thwarting his work and that no clause of his coalition agreement had been fulfilled, leaving him \"a deputy minister in name only\". He remains a member of Knesset and chair of the Noam faction."
    sources:
