    date: "2026-09-06"
    title:
      he: "הצטרף לרשימת \"ישר\" בראשות גדי איזנקוט במקום השישי"
      en: "Joined Gadi Eisenkot's Yashar list in sixth place"
    description:
      he: "ב-6 בספטמבר 2026, ערב סגירת הרשימות, חתם טרופר על הסכם לריצה משותפת עם מפלגת \"ישר\" בראשות גדי איזנקוט והוצב במקום השישי ברשימה; יועז הנדל בחר שלא להצטרף. על פי ההסכם, טרופר יהיה הראשון לבחור משרד אם איזנקוט ירכיב ממשלה, וההסכם אינו כולל בלוק טכני."
      en: "On 6 September 2026, on the eve of the list-filing deadline, Tropper signed an agreement to run jointly with Gadi Eisenkot's Yashar party and was placed sixth on its list; Yoaz Hendel chose not to join. Under the agreement, Tropper would be the first to choose a ministry should Eisenkot form a government, and the arrangement does not include a technical bloc."
    sources:
