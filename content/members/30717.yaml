      he: צל"ש על פעולתו בקרב ונכה צה"ל
      en: Military commendation for combat conduct and recognition as a disabled IDF
        veteran
    description:
      he: סופר שירת כקצין בחטיבת הצנחנים (גדוד חרוב). בשנת 1996, במהלך מהומות מנהרת
        הכותל, חילץ פצועים מקבר יוסף בשכם ונפצע קשה, והוכר כנכה צה"ל. על פועלו
        ואומץ הלב שהפגין באירוע זכה בצל"ש אלוף.
      en: Sofer served as an officer in the IDF Paratroopers Brigade (Harov
        Battalion). In 1996, during the Western Wall Tunnel riots, he helped
        evacuate casualties from Joseph's Tomb in Nablus and was severely
        wounded, and was recognized as a disabled IDF veteran. For his conduct
        and courage during the event he received a divisional-level (Aluf)
        commendation.
