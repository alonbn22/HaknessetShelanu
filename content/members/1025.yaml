      he: קריירה שרותית ענפה בליכוד; כיום שרת החדשנות, המדע והטכנולוגיה
      en: Extensive ministerial career in Likud; currently Minister of Innovation,
        Science and Technology
    description:
      he: "גמליאל, חברת כנסת מטעם הליכוד, כיהנה במגוון תפקידי שר: השרה לשוויון חברתי
        (2015–2020), השרה להגנת הסביבה (2020–2021) והשרה למודיעין (2023–2024).
        מאז 18 במרץ 2024 היא מכהנת כשרת החדשנות, המדע והטכנולוגיה (בממשלת מעבר
        מאז פיזור הכנסת ה-25 ביולי 2026)."
      en: "A Likud member of the Knesset, Gamliel has held multiple cabinet posts:
        Minister for Social Equality (2015–2020), Minister of Environmental
        Protection (2020–2021), and Minister of Intelligence (2023–2024). Since
        18 March 2024 she has served as Minister of Innovation, Science and
        Technology (in a caretaker government since the 25th Knesset dispersed
        in July 2026)."
