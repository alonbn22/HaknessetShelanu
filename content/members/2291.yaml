      en: "In 1999 the Jerusalem District Court convicted Deri of accepting bribes while serving as interior minister and in April 1999 sentenced him to four years in prison and a fine; the sentence was reduced on appeal. He served 22 months in prison between 2000 and 2002 and returned to politics in 2013."
