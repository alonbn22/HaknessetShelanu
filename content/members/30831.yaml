    title:
      he: יושב ראש הוועדה המיוחדת לזכויות הילד בכנסת ה-25
      en: Chair of the Knesset Special Committee on the Rights of the Child
      ar: رئيس اللجنة الخاصة لحقوق الطفل في الكنيست الخامس والعشرين
      ru: Председатель специальной комиссии Кнессета по правам ребёнка
    description:
      he: ב-31 בינואר 2023 נבחר ח"כ אלי דלל פה אחד ליושב ראש הוועדה המיוחדת לזכויות הילד של הכנסת ה-25. לצד תפקיד זה הוא חבר בוועדת הכספים ובוועדה לקידום מעמד האישה ולשוויון מגדרי.
      en: On 31 January 2023, MK Eli Dallal was elected unanimously as chair of the 25th Knesset's Special Committee on the Rights of the Child. He also serves as a member of the Finance Committee and the Committee on the Status of Women and Gender Equality.
      ru: 31 января 2023 года депутат Эли Далаль был единогласно избран председателем специальной комиссии Кнессета 25-го созыва по правам ребёнка. Он также является членом финансовой комиссии и комиссии по улучшению статуса женщин и гендерному равенству.
    sources:
