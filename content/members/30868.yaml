    title:
      he: חבר הכנסת ה-25 מטעם ש"ס
      en: Member of the 25th Knesset for Shas
    description:
      he: >-
        יונתן (יוני) מישרקי, יליד ירושלים (17 באוגוסט 1984), נכנס לכנסת העשרים וחמש
        ב-3 בינואר 2023 מטעם מפלגת ש"ס במסגרת החוק הנורווגי, בעקבות התפטרותו של
        השר יואב בן צור. לפני כניסתו לכנסת מילא תפקידי ייעוץ וניהול בזירה
        המוניציפלית בירושלים ושימש יועץ בכיר לאריה דרעי.
      en: >-
        Yonatan (Yoni) Mishriki, born in Jerusalem on 17 August 1984, entered the
        25th Knesset on 3 January 2023 as a Shas representative under the
        Norwegian Law, replacing Minister Yoav Ben-Tzur. Before the Knesset he
        held advisory and administrative posts in Jerusalem municipal politics
        and served as a senior adviser to Aryeh Deri.
    date: "2023-01-03"
