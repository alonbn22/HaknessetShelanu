      en: Chair of the Knesset Constitution, Law and Justice Committee
    description:
      he: בעקבות הקמת הממשלה ה-37 של ישראל מונה רוטמן ליושב ראש ועדת החוקה, חוק
        ומשפט של הכנסת (על פי הוויקיפדיה העברית, מ-4 בינואר 2023), אחד מתפקידי
        המפתח בעבודת החקיקה של הכנסת, והוא מכהן בתפקיד גם נכון לספטמבר 2026. לפי
