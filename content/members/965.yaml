    title:
      he: משפט פלילי בעניין שחיתות (תיקים 1000, 2000, 4000)
      en: Ongoing corruption trial (Cases 1000, 2000, 4000)
      ar: محاكمة فساد جارية (القضايا 1000، 2000، 4000)
      ru: Продолжающийся коррупционный судебный процесс (дела 1000, 2000, 4000)
    description:
      he: נתניהו עומד למשפט באשמות שוחד, מרמה והפרת אמונים בשלושה תיקים (1000, 2000, 4000). ביולי 2020 הואשם רשמית, וב-24 ביוני 2026 השלים את עדותו לאחר 98 דיונים; המשפט נמשך לעבר שלב הסיכומים, וטרם ניתן פסק דין. נתניהו מכחיש את כל האשמות ומתאר את ההליך כמונע פוליטית.
      en: Netanyahu is on trial on charges of bribery, fraud and breach of trust across three cases (1000, 2000, 4000). He was formally indicted in 2020, and on 24 June 2026 concluded his testimony after 98 hearings; the trial is moving toward the closing-arguments phase and no verdict has been reached. Netanyahu denies all charges and calls the proceedings politically motivated.
      ar: يمثل نتنياهو أمام المحكمة بتهم الرشوة والاحتيال وخيانة الأمانة في ثلاث قضايا (1000، 2000، 4000). وجهت له الاتهامات رسميًا عام 2020، وفي 24 يونيو 2026 أنهى شهادته بعد 98 جلسة؛ والمحاكمة تتجه إلى مرحلة المرافعات الختامية دون صدور حكم. ينفي نتنياهو جميع التهم ويصف الإجراءات بأنها ذات دوافع سياسية.
      ru: Нетаньяху предстал перед судом по обвинениям в взяточничестве, мошенничестве и злоупотреблении доверием по трём делам (1000, 2000, 4000). Официальное обвинение было предъявлено в 2020 году, а 24 июня 2026 года он завершил дачу показаний после 98 заседаний; процесс переходит к стадии заключительных прений, приговор ещё не вынесен. Нетаньяху отрицает все обвинения и называет процесс политически мотивированным.
