    - dimension: religion
      value: religious-zionist
      quote:
        he: "\"מפלגת הציונות הדתית בראשות ח\"כ בצלאל סמוטריץ' היא מפלגה דתית לאומית, המהווה בית לציבור המאמין על כל גווניו.\""
        en: "\"The Religious Zionism party, led by MK Bezalel Smotrich, is a religious-national party, a home for the believing public in all its shades.\""
        ar: "«حزب الصهيونية الدينية برئاسة عضو الكنيست بتسلئيل سموتريتش هو حزب ديني قومي، يشكّل بيتًا للجمهور المؤمن بكل أطيافه.»"
        ru: "«Партия „Религиозный сионизм“ во главе с депутатом Кнессета Бецалелем Смотричем — религиозно-национальная партия, дом для верующей общественности во всём её многообразии»."
        es: "«El partido Sionismo Religioso, encabezado por el diputado Bezalel Smotrich, es un partido religioso nacional, un hogar para el público creyente en todos sus matices.»"
        fr: "« Le parti Sionisme religieux, dirigé par le député Bezalel Smotrich, est un parti religieux national, un foyer pour le public croyant dans toutes ses nuances. »"
      source: &rz-about { url: "https://zionutdatit.org.il/%D7%A2%D7%9C-%D7%94%D7%9E%D7%A4%D7%9C%D7%92%D7%94/", title: "על המפלגה - מפלגת הציונות הדתית", publisher: "הציונות הדתית" }
    - dimension: national
      value: zionist
      quote:
        he: "\"מפלגת הציונות הדתית מאמינה בציונות, בלאומיות, באחדות ושלמות העם והארץ\""
        en: "\"The Religious Zionism party believes in Zionism, in nationhood, in the unity and wholeness of the people and the land\""
        ar: "«حزب الصهيونية الدينية يؤمن بالصهيونية، وبالقومية، وبوحدة الشعب والأرض وكمالهما»"
        ru: "«Партия „Религиозный сионизм“ верит в сионизм, в национальную идею, в единство и целостность народа и земли»"
        es: "«El partido Sionismo Religioso cree en el sionismo, en la nación, en la unidad y la integridad del pueblo y de la tierra»"
        fr: "« Le parti Sionisme religieux croit au sionisme, à la nation, à l’unité et à l’intégrité du peuple et de la terre »"
      source: { url: "https://zionutdatit.org.il/%D7%9E%D7%A6%D7%A2-%D7%94%D7%9E%D7%A4%D7%9C%D7%92%D7%94/", title: "מצע המפלגה - מפלגת הציונות הדתית", publisher: "הציונות הדתית" }
    - dimension: national
      value: national
      quote:
        he: "\"הוכיחה מפלגת הציונות הדתית כי היא המפלגה הלאומית שעקרונותיה וערכיה חשובים הרבה יותר משררה\""
        en: "\"The Religious Zionism party has proven that it is the national party whose principles and values matter far more than power\""
        ar: "«أثبت حزب الصهيونية الدينية أنه الحزب القومي الذي تهمّه مبادئه وقيمه أكثر بكثير من السلطة»"
        ru: "«Партия „Религиозный сионизм“ доказала, что она — национальная партия, для которой принципы и ценности намного важнее власти»"
        es: "«El partido Sionismo Religioso ha demostrado que es el partido nacional cuyos principios y valores importan mucho más que el poder»"
        fr: "« Le parti Sionisme religieux a prouvé qu’il est le parti national dont les principes et les valeurs comptent bien plus que le pouvoir »"
      source: *rz-about

  otzma:
    - dimension: national
