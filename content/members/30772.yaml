      he: סגן יושב ראש הכנסת
      en: Deputy Speaker of the Knesset
    description:
      he: ניסים ואטורי, חבר כנסת מטעם הליכוד, מכהן כסגן יושב ראש הכנסת ה-25 מ-18 בינואר 2023. הוא נכנס לראשונה לכנסת בדצמבר 2020 (במקומו של גדעון סער), נבחר שוב בבחירות 2022, ומכהן גם כחבר ועדת החוץ והביטחון.
      en: Nissim Vaturi, a member of the Knesset for Likud, has served as a Deputy Speaker of the 25th Knesset since 18 January 2023. He first entered the Knesset in December 2020 (replacing Gideon Sa'ar), was re-elected in the 2022 election, and is also a member of the Knesset's Foreign Affairs and Defense Committee.
