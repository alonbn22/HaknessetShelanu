# Keeps the site's data fresh by pulling the latest Knesset open data on a
# schedule. Vote sync is incremental (cursor stored in sync_state inside the
# committed DB), so each run only fetches what changed since the last sync.
#
# For this to stay incremental, data/knesset.db must be committed to the repo.
# If the DB is missing on checkout the first run performs a full backfill
# (slower, but still works). After syncing, the workflow commits the updated DB
# so a git-based host (Vercel, Netlify, etc.) redeploys with fresh data.
name: Sync Knesset data

on:
  schedule:
    # Every 6 hours (UTC). Adjust as needed.
    - cron: "0 */6 * * *"
  workflow_dispatch: {} # allow manual runs from the Actions tab

# Prevent overlapping runs from racing on the DB / the commit.
concurrency:
  group: sync-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to commit the refreshed DB
    steps:
      # Actions pinned to a commit SHA (not a mutable tag): this job holds a
      # contents:write token, so a hijacked tag must not be able to run code here.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      # `npm ci` only — the lockfile is authoritative. The old `|| npm install`
      # fallback silently installed whatever latest in-range versions the registry
      # served (and ran their build scripts) with a contents:write token on any
      # lockfile drift. If `npm ci` fails, fix the lockfile rather than bypass it.
      - run: npm ci

      - name: Run incremental sync
        run: npm run sync
        # A hung OData pagination would otherwise run until the job's 6h cap,
        # blocking the concurrency slot for the next scheduled sync.
        timeout-minutes: 45

      # Never commit a damaged DB: removes stale WAL sidecars and runs
      # PRAGMA integrity_check, exiting non-zero if the file is corrupt.
      - name: Verify database integrity
        run: node scripts/db-clean.mjs

      - name: Commit refreshed database
        run: |
          git config user.name "knesset-data-bot"
          git config user.email "actions@github.com"
          if [ -n "$(git status --porcelain data/knesset.db)" ]; then
            git add data/knesset.db
            git commit -m "chore(data): scheduled sync $(date -u +%Y-%m-%dT%H:%MZ)"
            # A manual push may have landed while the sync ran — rebase our
            # single data commit on top of it instead of failing the push.
            git pull --rebase --autostash origin master
            git push
          else
            echo "No data changes to commit."
          fi
