      en: "A weighted average of every published seat poll, including those from before the lists closed, as computed by HaMadad."
      ar: "متوسط مرجّح لكل استطلاعات المقاعد المنشورة، بما فيها ما سبق إغلاق القوائم، كما يحسبه موقع هامداد."
      ru: "Взвешенное среднее всех опубликованных опросов о мандатах, включая опросы до закрытия списков, по расчёту сайта ХаМадад."
