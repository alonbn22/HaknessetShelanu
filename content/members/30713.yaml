    title:
      he: "ראש מפלגה ערבית עצמאית ראשון שהצטרף לקואליציה שלטת (2021)"
      en: "First leader of an independent Arab party to join a governing coalition (2021)"
    description:
      he: "כיו\"ר הרשימה הערבית המאוחדת (רע\"מ) חתם עבאס ב-2 ביוני 2021 על הסכם קואליציוני להקמת הממשלה ה-36 — הפעם הראשונה זה כחמישה עשורים שמפלגה ערבית עצמאית הייתה שותפה בקואליציה שלטת בישראל. \"זו הפעם הראשונה שמפלגה ערבית שותפה בתהליך הרכבת ממשלה\", אמר."
      en: "As chairman of the United Arab List (Ra'am), Abbas signed a coalition agreement on 2 June 2021 to form Israel's 36th government — the first time in roughly five decades that an independent Arab party was a partner in a governing coalition in Israel. \"This is the first time that an Arab party is part of the process of forming a government,\" he said."
    sources:
