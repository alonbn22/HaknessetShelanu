    title:
      he: כיהנה כשרת האנרגיה של ישראל (2021–2022)
      en: Served as Israel's Minister of Energy (2021–2022)
    description:
      he: קארין אלהרר מונתה לשרת התשתיות הלאומיות, האנרגיה והמים בממשלת בנט–לפיד
        שהושבעה ביוני 2021, וכיהנה בתפקיד עד שנת 2022. אלהרר, עורכת דין מסיעת יש
        עתיד, משתמשת בכיסא גלגלים בשל ניוון שרירים.
      en: Karine Elharrar was appointed Minister of National Infrastructures, Energy
        and Water Resources in the Bennett–Lapid government sworn in in June
        2021, serving until 2022. A lawyer from the Yesh Atid party, Elharrar
        uses a wheelchair due to muscular dystrophy.
    date: 2021-06-13
