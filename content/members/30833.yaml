      he: רקע בשירות צבאי ובמשטרת ישראל
      en: Background in military and police service
    description:
      he: טרם כניסתו לפוליטיקה שירת אלמוג כהן בצה"ל ביחידת מודיעין מטרות, ולאחר מכן
        שירת במשטרת ישראל במשך כ-11 שנים, בין היתר ביחידות מבצעיות.
      en: Before entering politics, Almog Cohen served in the IDF's Target
        Intelligence Unit and subsequently served in the Israel Police for
        approximately 11 years, including in operational units.
