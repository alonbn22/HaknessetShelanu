    title:
      he: ממייסדי השדולה לקידום הסדר ביטחוני אזורי בכנסת
      en: Co-founder of the Knesset caucus for a regional security agreement
    description:
      he: ביולי 2025 הקים בן ברק יחד עם חברי הכנסת גלעד קריב ואלון שוסטר את השדולה לקידום הסדר ביטחוני אזורי, הקוראת להרחבת הסכמי אברהם ולתרגום ההישגים הצבאיים להסדר מדיני. בישיבת הפתיחה השתתפו יו"ר האופוזיציה יאיר לפיד ופעילים סורים וסעודים.
      en: In July 2025 Ben-Barak, together with MKs Gilad Kariv and Alon Schuster, founded the Knesset caucus for the advancement of a regional security agreement, which calls for extending the Abraham Accords and turning military achievements into a diplomatic settlement. Opposition leader Yair Lapid and Syrian and Saudi activists took part in its inaugural session.
    sources:
