    title:
      he: דורג במקום ה-16 בפריימריז הליכוד לכנסת ה-26
      en: Placed 16th in the Likud primary for the 26th Knesset
    description:
      he: בפריימריז הליכוד ב-17 באוגוסט 2026 דורג ברקת במקום ה-16 מבין המתמודדים (23,281 קולות), בהפרש קטן מזאב אלקין, מה שמתורגם למקום ה-24 ברשימה לאחר שיבוץ המקומות השמורים - מקום שהוגדר בתקשורת כגבולי. ברקת מסר כי "השריונים הרבים של ראש הממשלה צמצמו את הרשימה הארצית ל-17 מקומות ריאליים בלבד ליותר מ-40 שרים, חברי כנסת ומועמדים חדשים".
      en: In the Likud primary on 17 August 2026 Barkat placed 16th among the candidates (23,281 votes), narrowly ahead of Ze'ev Elkin, which translates to the 24th slot on the list once reserved places are inserted - a position described in the press as borderline. Barkat said that "the prime minister's numerous reserved slots shrank the national list to only 17 realistic places for more than 40 ministers, MKs and new candidates".
