    title:
      he: חקירת משטרה בחשד לאונס, מעשים מגונים והדחת עדה — מכחיש את החשדות; דווח כי התיק צפוי להיסגר
      en: Police investigation on suspicion of rape, indecent acts and witness tampering — he denies the allegations; the case was reported to be heading for closure
      ar: تحقيق للشرطة للاشتباه بالاغتصاب وأفعال مخلة وتحريض شاهدة على شهادة زور — وهو ينفي الشبهات؛ وأفيد بأن الملف يتجه نحو الإغلاق
      ru: Полицейское расследование по подозрению в изнасиловании, непристойных действиях и склонении свидетельницы к лжесвидетельству — он отрицает подозрения; сообщалось, что дело будет закрыто
    description:
      he: ביולי 2025 נחקר מילביצקי באזהרה בלהב 433 בחשד לאונס, מעשים מגונים, הדחת עדה לעדות שקר ושיבוש הליכי משפט, בפרשה הקשורה לתקופתו כיועץ משפטי של עמותת "בני ברוך – קבלה לעם", בטרם נבחר לכנסת. לפי חשדות המשטרה, אישה שלטענת החוקרים שודלה למסור עדות שקר מסרה כי מילביצקי אנס אותה בבית מלון. מילביצקי הכחיש את כל החשדות, טען כי מדובר ב"רדיפה פוליטית" ודרש לסגור את התיק. ב-24 בנובמבר 2025 דווח (לראשונה ב-i24NEWS) כי התיק צפוי להיסגר משום שהמתלוננת, שעדותה היא הראיה המרכזית, עזבה את הארץ ולא אותרה; באו כוחו לא הגיבו לדיווח. נכון לספטמבר 2026 לא פורסמה החלטה רשמית של הפרקליטות ולא הוגש כתב אישום.
      en: In July 2025, Milwidsky was questioned under caution by the Lahav 433 police unit on suspicion of rape, indecent acts, suborning false testimony and obstruction of justice, in a case relating to his pre-Knesset role as legal adviser to the Bnei Baruch – Kabbalah La'Am association. According to the police suspicions, a woman whom investigators say he coached to give false testimony told them that Milwidsky raped her in a hotel. Milwidsky has denied all the allegations, calling the investigation "political persecution" and demanding the case be closed. On 24 November 2025 it was reported (first by i24NEWS) that the case was expected to be closed because the complainant, whose testimony is the central evidence, had left the country and could not be located; his lawyers did not comment on the report. As of September 2026 no official prosecution decision has been published and no indictment has been filed.
