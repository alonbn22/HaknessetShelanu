      en: Michael Malchieli serves as a member of the Knesset for the Sephardi
        ultra-Orthodox Shas party. He first entered the Knesset on 2 November
        2016 as a replacement for Shas leader Aryeh Deri, who had resigned from
        the Knesset, and has since served continuously from the 20th through the
        25th Knesset.
