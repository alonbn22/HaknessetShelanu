    title:
      he: חבר הכנסת מטעם יהדות התורה
      en: Member of the Knesset for United Torah Judaism
    description:
      he: יעקב טסלר נבחר לראשונה לכנסת באפריל 2019 ברשימת יהדות התורה (אגודת ישראל, נציג חסידות ויז'ניץ), ומכהן כחבר כנסת על פני מספר כהונות. קודם לכן כיהן כחבר מועצת העיר אשדוד מטעם אגודת ישראל וכעוזר לשר הבריאות יעקב ליצמן.
      en: Ya'akov Tessler was first elected to the Knesset in April 2019 on the United Torah Judaism (Agudat Yisrael) list, representing the Vizhnitz Hasidic community, and has served across multiple Knesset terms. He previously served on the Ashdod city council for Agudat Yisrael and as an assistant to Health Minister Ya'akov Litzman.
    date: 2019-04-30
    sources:
      - url: https://en.wikipedia.org/wiki/Ya'akov_Tessler
        title: Ya'akov Tessler
        publisher: Wikipedia
