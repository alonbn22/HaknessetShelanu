# Upcoming Knesset election (EDITORIAL). Every claim below was researched and
# re-verified against its cited sources on lastReviewed; statuses are honest:
#   confirmed        = an official source states it
#   scheduled-by-law = the statutory default
#   reported         = media reports (may change)
# Party line-ups are NOT final until lists are submitted to the Central
# Elections Committee (~47 days before election day) — keep the "expected"
# framing. he/en authored; ar/ru fall back to en. UPDATE as the campaign moves:
# re-verify each item, bump lastReviewed, and prune anything that changed.
knesset: 26
expectedDate: "2026-10-27"
dateStatus: set
lastReviewed: "2026-07-17"

headline:
  he: "הבחירות לכנסת ה-26 יתקיימו ביום שלישי, 27 באוקטובר 2026."
  en: "The 26th Knesset election is set for Tuesday, October 27, 2026."

intro:
  he: "הכנסת ה-25 השלימה קדנציה מלאה והתפזרה ב-17 ביולי 2026, והבחירות יתקיימו במועד הקבוע בחוק. בעמוד זה: המועדים, מי צפוי להתמודד, כללי הבחירות והנתונים — כל פריט עם מקור."
  en: "The 25th Knesset completed a full term and dispersed on July 17, 2026; the election will be held on its statutory date. This page covers the timeline, who is expected to run, the rules, and the numbers — every item with a source."

# The road to the 26th Knesset — when each thing becomes known/final.
keyDates:
  - key: kd-lists
