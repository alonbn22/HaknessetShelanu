    title:
      he: בג"ץ הקפיא מינויים במח"ש המחודשת שבסמכות שר המשפטים
      en: High Court froze appointments to the restructured Police Internal Investigations Department under the justice minister
    description:
      he: ב-23 באוגוסט 2026 הורה בג"ץ, בצו ביניים, שלא לקדם מינויים בכירים במחלקה לחקירות שוטרים במתכונתה החדשה - לפי חוק שאישרה הכנסת היוצאת, המוציא את המחלקה מפרקליטות המדינה וקובע מנגנון מינויים חדש בו מעורב שר המשפטים - עד להכרעה בבקשות לצווי ביניים נגד יישום החוק. היועצת המשפטית לממשלה ביקשה למנוע את המינויים בתקופת הבחירות; לוין טען כי המינויים נעשים על ידי ועדה עצמאית וכי "הבחירות המתקרבות אינן מצדיקות עצירת יישומו של חוק שחוקקה הכנסת".
      en: On 23 August 2026 the High Court of Justice issued an interim order barring any advancement of senior appointments to the restructured Police Internal Investigations Department - under a law passed by the outgoing Knesset that removes the department from the State Attorney's Office and creates a new appointments mechanism involving the justice minister - pending a ruling on requests for interim injunctions against implementing the law. The Attorney General had asked to block the appointments during the election period; Levin argued the appointments are made by an independent committee and that "the approaching election does not justify stopping implementation of a law enacted by the Knesset".
    sources:
