    date: 2016-05-22
    title:
      he: יושב ראש הקואליציה בכנסת ה-20
      en: Chairman of the Coalition in the 20th Knesset
    description:
      he: דוד ביטן, חבר כנסת מטעם הליכוד, מונה במאי 2016 לתפקיד יושב ראש הקואליציה בכנסת ה-20, תפקיד מרכזי בניהול הרוב הפרלמנטרי של הממשלה, וכיהן בו עד סוף 2017.
      en: David Bitan, a Likud Member of Knesset, was appointed Chairman of the Coalition in the 20th Knesset in May 2016, a central role in managing the government's parliamentary majority, and held it until the end of 2017.
    sources:
      - url: https://en.wikipedia.org/wiki/David_Bitan
        title: David Bitan
        publisher: Wikipedia
      - url: https://main.knesset.gov.il/mk/apps/mk/mk-personal-details/914
        title: דוד ביטן - אתר הכנסת
        publisher: The Knesset
  - kind: positive
    category: achievement
    title:
      he: יושב ראש ועדת העלייה והקליטה
      en: Chairman of the Immigration and Absorption Committee
    description:
      he: ביטן מונה במאי 2020 ליושב ראש ועדת העלייה והקליטה בכנסת ה-23, ועדה העוסקת במדיניות העלייה לישראל ובקליטת עולים.
      en: Bitan was appointed in May 2020 as Chairman of the Immigration and Absorption Committee in the 23rd Knesset, a committee dealing with immigration to Israel and the integration of new immigrants.
    sources:
