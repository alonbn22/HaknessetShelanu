    title:
      he: "רקע בהתאגדות עובדים בתעשייה האווירית לפני הקריירה הפוליטית"
      en: "Labor-organizing background at Israel Aerospace Industries before entering politics"
    description:
      he: "לפני כניסתו לכנסת היה לחיים כץ רקע בולט בהתאגדות עובדים. הוא הצטרף לוועד עובדי התעשייה האווירית לישראל בשנת 1983, כיהן כיושב ראש ועד הטכנאים והמהנדסים, ובשנת 1996 מונה ליושב ראש צוות מדיניות קרנות הפנסיה של ההסתדרות."
      en: "Before entering the Knesset, Haim Katz had a prominent labor-organizing background. He joined the Israel Aerospace Industries workers' council in 1983, served as chairman of its technicians and engineers' union, and in 1996 was appointed chairman of the Histadrut's pension funds policy team."
