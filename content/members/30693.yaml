      en: "Announced his departure from Benny Gantz's Blue and White party"
    description:
      he: "ב-5 במאי 2026 הודיע גינזבורג לבני גנץ על פרישתו מהמפלגה, לאחר שגנץ דרש ממנו להבהיר את עתידו הפוליטי. גינזבורג אמר כי יכולתה של המסגרת הפוליטית להמשיך ולחולל את השינוי הנדרש פחתה, והודיע כי יישאר חבר כנסת ולא יפנה את מקומו."
      en: "On 5 May 2026 Ginzburg informed Benny Gantz that he was leaving the party, after Gantz demanded that he clarify his political future. Ginzburg said the political framework's ability to keep bringing about the necessary change had diminished, and said he would remain a Knesset member rather than vacate his seat."
