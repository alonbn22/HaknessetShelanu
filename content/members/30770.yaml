  - kind: positive
    category: achievement
    title:
      he: יו"ר ועדת החינוך, התרבות והספורט של הכנסת ה-25 (2023–2025)
      en: Chair of the Knesset Education, Culture and Sports Committee (2023–2025)
    description:
      he: עם הקמת הממשלה ה-37 נבחר טייב לכהן כיו"ר ועדת החינוך, התרבות והספורט של
        הכנסת ה-25. ב-23 באוקטובר 2025 ויתר על התפקיד במסגרת החלטת ש"ס לפרוש
        מתפקידיה בקואליציה במחאה על אי-חקיקת חוק הגיוס; בדצמבר 2025 דווח כי ח"כ צבי
        סוכות (הציונות הדתית) ימונה במקומו לאחר כחודשיים שבהם לא התכנסה הוועדה.
      en: Following the formation of the 37th government, Taieb was chosen to chair
        the 25th Knesset's Education, Culture and Sports Committee. On 23
        October 2025 he gave up the post as part of Shas's decision to quit its
        coalition positions in protest at the failure to legislate a draft law;
        in December 2025 it was reported that MK Zvi Sukkot (Religious Zionism)
        would be appointed in his place after about two months in which the
        committee did not convene.
    date: 2023-01-01
    sources:
