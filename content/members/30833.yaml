  - kind: negative
    category: controversy
    status: ongoing
    title:
      he: תביעות לשון הרע של "אחים לנשק" ומייסד הארגון; חשיפת שם בניגוד לצו בית משפט
      en: Defamation suits by Brothers in Arms and a founder; naming a person despite a court order
    description:
      he: >-
        בנובמבר 2024 הגיש ארגון "אחים לנשק" נגד כהן תביעת לשון הרע בסך כ-1.1 מיליון
        ש"ח, בטענה שקישר את הארגון ומייסדיו לפרשת "הקצין המתחזה" ללא בסיס; כהן
        השיב כי "אמת דיברתי" וטען לחסינות פרלמנטרית. ב-8 ביולי 2026 חשף כהן מעל
        דוכן הכנסת את שמו של קצין מילואים ממייסדי הארגון, למרות צו איסור פרסום של
        בית המשפט המחוזי, ואמר: "אם אתם חושבים שאתם מפחידים אותי עם צו איסור
        פרסום... אז אני אומר את זה שוב". ב-12 ביולי 2026 דווח כי אותו קצין הגיש
        נגדו תביעה בסך 2.6 מיליון ש"ח. ההליכים תלויים ועומדים; לא ניתן פסק דין.
      en: >-
        In November 2024 the Brothers in Arms organization filed a defamation suit
        of about NIS 1.1 million against Cohen, alleging he had baselessly linked
        the group and its founders to the "impostor officer" affair; Cohen
        replied that he "spoke the truth" and claimed parliamentary immunity. On
        8 July 2026 Cohen named a reserve officer who co-founded the group from
        the Knesset podium despite a district-court publication ban, saying "if
        you think you are frightening me with a publication ban... then I am
        saying it again". On 12 July 2026 it was reported that the officer had
        filed a NIS 2.6 million suit against him. The proceedings are pending;
        no judgment has been given.
    date: 2026-07-12
