    title:
      he: יו"ר פורום דבורה בהתנדבות (2020–2022)
      en: Volunteer chair of Forum Dvorah (2020–2022)
    description:
      he: לאחר שחרורה מצה"ל כיהנה ניר בהתנדבות, בשנים 2020–2022, כיו"ר פורום דבורה — ארגון הפועל לייצוג שוויוני של נשים במוקדי קבלת ההחלטות בתחומי הביטחון והמדיניות ובשיח הציבורי.
      en: After leaving the IDF, Nir served on a voluntary basis from 2020 to 2022 as chair of Forum Dvorah, an organization working for equal representation of women in security and foreign-policy decision-making and in public discourse.
