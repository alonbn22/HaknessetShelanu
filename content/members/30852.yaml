  - kind: negative
    category: controversy
    title:
      he: "הודח מתפקידיו בוועדות הכנסת לאחר שהצביע נגד חוק יסוד: לימוד תורה"
      en: "Removed from Knesset committee roles after voting against the Torah Study Basic Law"
    description:
      he: "ב-10 ביוני 2026 הצביע סולומון נגד הקריאה הטרומית של הצעת חוק יסוד: לימוד תורה, בניגוד לעמדת סיעתו; ההצעה עברה ברוב של 56 מול 43. סולומון אמר כי אינו יכול \"להביט בעיני המשפחות השכולות\" מהציבור הדתי-לאומי ולתמוך בחוק שלדבריו קובע שאין צורך לשלב תורה ושירות צבאי. בעקבות זאת הודיע יו\"ר הציונות הדתית בצלאל סמוטריץ' על הדחתו מכל תפקידיו בוועדות הכנסת מטעם הסיעה — צעד משמעתי מפלגתי ולא הליך משפטי. ב-13 ביולי 2026, בקריאה השנייה והשלישית, הצביע סולומון בעד החוק, ואמר: \"אני לא משנה את העקרונות שלי, החוק הוא שהשתנה\"."
      en: "On 10 June 2026 Solomon voted against the preliminary reading of the Basic Law: Torah Study bill, against his faction's position; the bill passed 56-43. Solomon said he could not \"look into the eyes of bereaved families\" from the religious-Zionist community and back a law that in his words said there was no need to combine Torah study with military service. Religious Zionism chair Bezalel Smotrich then announced his removal from all his committee roles on behalf of the faction — a party disciplinary step, not a legal proceeding. On 13 July 2026, in the second and third readings, Solomon voted in favour of the law, saying: \"I am not changing my principles; it is the law that has changed.\""
    date: "2026-06-10"
