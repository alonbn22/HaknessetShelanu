  - id: 1099 # Ra'am
    verified: "2026-09-19"
    updates:
      - date: "2025-12-06"
        text:
          he: "יו\"ר רע\"ם מנסור עבאס הודיע בריאיון לחדשות 12 כי המפלגה תפריד את מוסדותיה ממועצת השורא ומהתנועה האסלאמית ותהפוך ל\"מפלגה אזרחית לחלוטין\"."
          en: "Ra’am chair Mansour Abbas said in a Channel 12 interview that the party would separate its institutions from the Shura Council and the Islamic Movement and become “a completely civic party”."
        sources:
          - { url: "https://www.timesofisrael.com/raam-leader-says-party-will-cut-ties-with-religious-council-become-completely-civic/", title: "Ra'am leader says party will cut ties with religious council, become 'completely civic' (2025-12-07)", publisher: "The Times of Israel" }
          - { url: "https://www.haaretz.co.il/0000019a-fa1c-d193-a1be-fbbd36a30000", title: "בהתנתקות מהתנועה האסלאמית, מנסור עבאס מהמר על עתיד רע\"מ (2025-12-08)", publisher: "הארץ" }
      - date: "2026-01-05"
        text:
          he: "עבאס הודיע כי רע\"ם פתוחה לחברים ולמועמדים יהודים לכנסת, ושלל הצטרפות לממשלה הנוכחית."
          en: "Abbas said Ra’am is open to Jewish members and Knesset candidates, and ruled out joining the current government."
        sources:
          - { url: "https://www.timesofisrael.com/liveblog_entry/abbas-says-raam-party-will-be-open-to-jewish-candidates-in-major-shift/", title: "Abbas says Ra'am party will be open to Jewish candidates, in major shift (2026-01-05)", publisher: "The Times of Israel" }
      - date: "2026-01-22"
        text:
          he: "ראשי רע\"ם, חד\"ש, תע\"ל ובל\"ד חתמו בסח'נין על התחייבות לפעול להקמת הרשימה המשותפת מחדש, ביום השביתה הכללית בחברה הערבית נגד הפשיעה."
          en: "The heads of Ra’am, Hadash, Ta’al and Balad signed in Sakhnin a commitment to work toward re-establishing the Joint List, on the day of the Arab community’s general strike over violent crime."
        sources:
          - { url: "https://www.timesofisrael.com/under-pressure-arab-knesset-parties-sign-agreement-to-work-toward-reviving-joint-list/", title: "Under pressure, Arab Knesset parties sign agreement to work toward reviving Joint List (2026-01-22)", publisher: "The Times of Israel" }
          - { url: "https://www.ynet.co.il/news/article/bye65yguwl", title: "ראשי המפלגות הערביות הסכימו: נפעל להקמת הרשימה המשותפת מחדש (2026-01-22)", publisher: "ynet" }
      - date: "2026-07-26"
        text:
          he: "רע\"ם הודיעה כי תרוץ לבד (\"אנחנו רצים לבד\") ותקיים בחירות מקדימות בוועידתה ב-22 באוגוסט, לראשונה ללא מועצת השורא; עבאס הודיע על השלמת ההיפרדות מהתנועה האסלאמית בבחירת המועמדים."
          en: "Ra’am said it would run on its own (“we are running alone”) and hold primaries at its convention on 22 August, for the first time without the Shura Council; Abbas said the separation from the Islamic Movement in choosing candidates was complete."
        sources:
          - { url: "https://www.ynet.co.il/news/article/hjn9ijvbzl", title: "פריימריז ברע\"ם לראשונה מאז ההיפרדות ממועצת השורא, עבאס: \"אנחנו רצים לבד\" (2026-07-26)", publisher: "ynet" }
          - { url: "https://www.haaretz.co.il/0000019f-a257-df92-a7ff-a6d7e0fd0000", title: "רע\"מ מתנתקת מהתנועה האסלאמית ותבחר את מועמדיה לכנסת באופן עצמאי (2026-07-27)", publisher: "הארץ" }
      - date: "2026-08-22"
        text:
          he: "ועידת רע\"ם בטייבה בחרה את הרשימה: מנסור עבאס, ווליד טאהא, ואליד אלהואשלה, אימאן ח'טיב יאסין (מקום שמור לאישה) ויאסר חוג'יראת; עבאס אמר כי רע\"ם מתכוונת להיות חלק מ\"גוש השינוי\"."
          en: "Ra’am’s convention in Tayibe elected its slate: Mansour Abbas, Walid Taha, Walid Alhwashla, Iman Khatib Yasin (reserved women’s slot) and Yasser Hujirat; Abbas said Ra’am intends to be part of the opposition “change bloc”."
        sources:
          - { url: "https://www.timesofisrael.com/raams-abbas-says-palestinian-state-a-reality-drawing-outrage-from-zionist-parties/", title: "Ra'am's Abbas says Palestinian state 'a reality,' drawing outrage from Zionist parties (2026-08-22)", publisher: "The Times of Israel" }
          - { url: "https://www.ynetnews.com/article/mnpvs6cf0", title: "Ra'am Selects Candidate List for Upcoming Elections (2026-08-22)", publisher: "Ynetnews" }
      - date: "2026-08-31"
        text:
          he: "עבאס ויואב סגלוביץ', חבר כנסת לשעבר מיש עתיד שפרש מהמפלגה ב-6 באוגוסט והתפטר מהכנסת (חילופין ב-11 באוגוסט), הודיעו בנצרת כי סגלוביץ' יוצב במקום השני ברשימת רע\"ם — מועמד יהודי ראשון ברשימה."
          en: "Abbas and Yoav Segalovitz — a former Yesh Atid MK who left the party on 6 August and resigned from the Knesset (replaced on 11 August) — announced in Nazareth that Segalovitz will run second on Ra’am’s list, the first Jewish candidate on it."
        sources:
          - { url: "https://www.timesofisrael.com/jewish-former-mk-yoav-segalovitz-announces-unprecedented-run-with-arab-raam-party/", title: "In unprecedented move, Abbas and Segalovitz announce joint run, bringing Jewish lawmaker to Arab party's slate (2026-08-31)", publisher: "The Times of Israel" }
          - { url: "https://www.ynet.co.il/news/article/sjamoqq00ge", title: "סגלוביץ': אי אפשר לקיים שותפות עם מפלגות ערביות אחרי 7/10? זה מופרך ושקרי (2026-08-31)", publisher: "ynet" }
          - { url: "https://www.timesofisrael.com/segalovitz-departs-yesh-atid-amid-his-reported-talks-to-join-mansour-abbass-raam/", title: "Segalovitz departs Yesh Atid amid his reported talks to join Mansour Abbas's Ra'am (2026-08-07)", publisher: "The Times of Israel" }
          - { url: "https://www.timesofisrael.com/raams-abbas-former-yesh-atid-mk-segalovitz-confirm-ongoing-talks-on-knesset-run/", title: "Ra'am's Abbas, former Yesh Atid MK Segalovitz confirm ongoing talks on Knesset run (2026-08-13)", publisher: "The Times of Israel" }
          - { url: "https://main.knesset.gov.il/mk/apps/faction/faction-lobby?KnessetID=25&FactionID=1102", title: "סיעת יש עתיד — חילופי גברי: 11/08/2026 מיכל סלבני כבביה נכנסה במקום יואב סגלוביץ (2026-09-19)", publisher: "הכנסת" }
      - date: "2026-09-07"
        text:
          he: "רע\"ם הגישה לוועדת הבחירות את רשימתה לכנסת ה-26 (\"רע\"ם - הרשימה הערבית המאוחדת\", אותיות מבוקשות עם): 1 מנסור עבאס, 2 יואב סגלוביץ, 3 ווליד טאהא, 4 ואליד אל הואשלה, 5 אימאן ח'טיב יאסין, 6 יאסר חוג'יראת, 7 איברהים אל טורי. ב-12 בספטמבר נחתם הסכם עודפים עם הרשימה המשותפת."
          en: "Ra’am submitted its list for the 26th Knesset to the CEC (“Ra’am – United Arab List”, requested letters עם): 1 Mansour Abbas, 2 Yoav Segalovitz, 3 Walid Taha, 4 Walid Alhwashla, 5 Iman Khatib Yasin, 6 Yasser Hujirat, 7 Ibrahim al-Turi. On 12 September it signed a surplus-vote agreement with the Joint List."
        sources:
          - { url: "https://www.gov.il/he/pages/raam_list18", title: "רע\"ם - הרשימה הערבית המאוחדת — רשימת המועמדים לכנסת ה-26 (ועדת הבחירות המרכזית) (2026-09-09)", publisher: "gov.il / ועדת הבחירות המרכזית" }
          - { url: "https://www.timesofisrael.com/israels-election-takes-shape-as-38-parties-submit-slates-from-likud-to-joint-list/", title: "Israel's election takes shape as 38 parties submit slates, in battle between pro- and anti-Netanyahu blocs (2026-09-09)", publisher: "The Times of Israel" }
          - { url: "https://www.timesofisrael.com/liveblog_entry/joint-list-and-raam-sign-surplus-vote-deal-ahead-of-oct-27-elections/", title: "Joint List and Ra'am sign surplus-vote deal ahead of Oct. 27 elections (2026-09-12)", publisher: "The Times of Israel" }
      - date: "2026-09-13"
        text:
          he: "הליכוד הודיע כי יגיש לוועדת הבחירות המרכזית בקשה לפסול את רע\"ם ואת הרשימה המשותפת; שבוע קודם לכן הגישה עוצמה יהודית בקשה לפסילת רע\"ם. ההכרעה בוועדה נתונה לביקורת בית המשפט העליון."
          en: "Likud said it would petition the Central Elections Committee to disqualify Ra’am and the Joint List; Otzma Yehudit had filed a petition against Ra’am the week before. CEC decisions are subject to Supreme Court review."
        sources:
          - { url: "https://www.timesofisrael.com/netanyahus-party-says-it-will-petition-election-panel-to-ban-arab-majority-parties/", title: "Netanyahu's Likud says it will petition election panel to ban Arab-majority parties (2026-09-14)", publisher: "The Times of Israel" }
