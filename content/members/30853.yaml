    title:
      he: ביקורת בית המשפט על תפקודו כחוקר בפרשת רונאל פישר
      en: Court criticism of his conduct as an investigator in the Ronel Fisher case
      ar: انتقاد المحكمة لأدائه كمحقق في قضية رونإل فيشر
      ru: Критика суда в адрес его действий как следователя по делу Ронэля Фишера
    description:
      he: "בגזר הדין של רונאל פישר בינואר 2026, מתח בית המשפט המחוזי בירושלים ביקורת על התנהלותו של משה סעדה, שכיהן כסגן ראש מחלקת החקירות במח״ש, וקבע כי הסתיר חומר חקירה והטעה את בית המשפט; הכשלים תרמו למחיקת 11 מתוך 14 אישומים. במאי 2026 דחה נציב הקבילות השופט בדימוס מנחם פינקלשטיין את תלונת סעדה נגד הפרקליטות וקבע כי הכשל נבע מהתנהלות מח״ש בתקופתו. סעדה דוחה את הביקורת, וכינה את הסדר הטיעון ״מכירת חיסול״ וטען כי הפרקליטות והשופט פעלו ״יד אחת״."
      en: "In Ronel Fisher's January 2026 sentencing, the Jerusalem District Court criticized the conduct of Moshe Saada, who had served as deputy head of the Police Internal Investigations Department (MACSH), finding that he concealed investigation material and misled the court; these failures contributed to 11 of 14 charges being dropped. In May 2026 the Ombudsman for Complaints, retired Judge Menachem Finkelstein, rejected Saada's complaint against the prosecution and found the failure stemmed from MACSH's conduct during Saada's tenure. Saada rejects the criticism, calling the plea deal a 'liquidation sale' and asserting the prosecution and judge acted 'as one hand.'"
      ar: "في إصدار الحكم على رونإل فيشر في يناير 2026، انتقدت محكمة القدس المركزية أداء موشيه سعدة، الذي شغل منصب نائب رئيس قسم التحقيقات، ووجدت أنه أخفى مواد التحقيق وضلل المحكمة. في مايو 2026 رفض المفوض القاضي المتقاعد مناحيم فينكلشتاين شكوى سعدة ضد النيابة. يرفض سعدة الانتقادات."
      ru: "При вынесении приговора Ронэлю Фишеру в январе 2026 года Окружной суд Иерусалима критиковал действия Моше Саады, занимавшего пост заместителя главы следственного отдела, установив, что он скрыл следственные материалы и ввел суд в заблуждение. В мае 2026 года омбудсмен отклонил жалобу Саады. Саада отвергает критику."
      es: "En la sentencia de Ronel Fisher, en enero de 2026, el Tribunal de Distrito de Jerusalén criticó la actuación de Moshe Saada, que había sido subjefe del Departamento de Investigaciones Policiales Internas (Mahash), y determinó que ocultó material de la investigación e indujo a error al tribunal; esos fallos contribuyeron a que se retiraran 11 de los 14 cargos. En mayo de 2026 el comisionado de quejas contra la Fiscalía, el juez retirado Menachem Finkelstein, rechazó la queja de Saada contra la Fiscalía y concluyó que el fallo se debió a la actuación de Mahash durante su gestión. Saada rechaza las críticas: calificó el acuerdo de culpabilidad de «liquidación total» y afirmó que la Fiscalía y el juez actuaron «como una sola mano»."
      fr: "Lors de la condamnation de Ronel Fisher, en janvier 2026, le tribunal de district de Jérusalem a critiqué la conduite de Moshe Saada, qui avait été directeur adjoint du département des enquêtes sur les policiers (Mahash), estimant qu’il avait dissimulé des éléments d’enquête et induit le tribunal en erreur ; ces défaillances ont contribué à l’abandon de 11 des 14 chefs d’accusation. En mai 2026, le commissaire aux plaintes contre le parquet, le juge à la retraite Menachem Finkelstein, a rejeté la plainte de Saada contre le parquet et conclu que la défaillance tenait à la conduite du Mahash pendant son mandat. Saada rejette ces critiques : il a qualifié l’accord de plaider-coupable de « liquidation totale » et affirmé que le parquet et le juge avaient agi « d’une seule main »."
