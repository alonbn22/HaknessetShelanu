  - knesset: 13
    date: "1992-06-23"
    turnout: 77.4
    winner: { he: "העבודה", en: "Labor", ar: "العمل", ru: "«Авода»", es: "Partido Laborista", fr: "Parti travailliste" }
    winnerSeats: 44
    pm: { he: "יצחק רבין", en: "Yitzhak Rabin", ar: "يتسحاق رابين", ru: "Ицхак Рабин", es: "Isaac Rabin", fr: "Yitzhak Rabin" }
    summary:
      he: "ממשלת רבין הובילה את תהליך אוסלו וחתמה על הסכם שלום עם ירדן. רבין נרצח בנובמבר 1995, ושמעון פרס עמד בראש הממשלה עד הבחירות ב-1996."
      en: "Rabin's government led the Oslo process and signed a peace treaty with Jordan. Rabin was assassinated in November 1995, and Shimon Peres led the government until the 1996 election."
      ar: "قادت حكومة رابين مسار أوسلو ووقّعت معاهدة سلام مع الأردن. اغتيل رابين في تشرين الثاني/نوفمبر 1995، وترأّس شمعون بيرس الحكومة حتى انتخابات 1996."
      ru: "Правительство Рабина возглавило процесс Осло и подписало мирный договор с Иорданией. В ноябре 1995 года Рабин был убит, и до выборов 1996 года правительство возглавлял Шимон Перес."
      es: "El gobierno de Rabin dirigió el proceso de Oslo y firmó un tratado de paz con Jordania. Rabin fue asesinado en noviembre de 1995, y Shimon Peres encabezó el gobierno hasta las elecciones de 1996."
      fr: "Le gouvernement Rabin a mené le processus d’Oslo et signé un traité de paix avec la Jordanie. Rabin a été assassiné en novembre 1995, et Shimon Peres a dirigé le gouvernement jusqu’à l’élection de 1996."
    events:
      - kind: neutral
        date: "1993-09-13"
        text: { he: "הסכמי אוסלו — הסכם הביניים עם אש\"ף.", en: "The Oslo Accords — the interim agreement with the PLO.", ar: "اتفاقيات أوسلو — الاتفاق المرحلي مع منظمة التحرير الفلسطينية.", ru: "Соглашения в Осло — промежуточное соглашение с ООП.", es: "Los Acuerdos de Oslo — el acuerdo interino con la OLP.", fr: "Les accords d’Oslo — l’accord intérimaire avec l’OLP." }
      - kind: good
        date: "1994-10-26"
        text: { he: "הסכם השלום עם ירדן.", en: "The peace treaty with Jordan.", ar: "معاهدة السلام مع الأردن.", ru: "Мирный договор с Иорданией.", es: "El tratado de paz con Jordania.", fr: "Le traité de paix avec la Jordanie." }
      - kind: bad
        date: "1995-11-04"
        text: { he: "רצח ראש הממשלה יצחק רבין; פרס החליפו.", en: "The assassination of PM Yitzhak Rabin; Peres succeeded him.", ar: "اغتيال رئيس الحكومة يتسحاق رابين؛ وخلفه بيرس.", ru: "Убийство премьер-министра Ицхака Рабина; его сменил Перес.", es: "El asesinato del primer ministro Isaac Rabin; Peres lo sucedió.", fr: "L’assassinat du Premier ministre Yitzhak Rabin ; Peres lui a succédé." }
      - kind: bad
        date: "1994-02-25"
        text: { he: "הטבח במערת המכפלה בחברון.", en: "The Cave of the Patriarchs massacre in Hebron.", ar: "المجزرة في الحرم الإبراهيمي (مغارة المكفيلا) في الخليل.", ru: "Бойня в Пещере Праотцев в Хевроне.", es: "La masacre de la Tumba de los Patriarcas en Hebrón.", fr: "Le massacre du Caveau des Patriarches à Hébron." }
      - kind: bad
        date: "1996-04-11"
        text: { he: "מבצע \"ענבי זעם\" בלבנון.", en: "Operation Grapes of Wrath in Lebanon.", ar: "عملية «عناقيد الغضب» في لبنان.", ru: "Операция «Гроздья гнева» в Ливане.", es: "La operación Uvas de la Ira en el Líbano.", fr: "L’opération Raisins de la colère au Liban." }
    ended: { he: "הכנסת פיזרה את עצמה בחוק — בחירות מוקדמות במאי 1996.", en: "Dissolved itself by law — early elections in May 1996.", ar: "حلّ الكنيست نفسه بقانون — انتخابات مبكرة في أيار/مايو 1996.", ru: "Самораспустился законом — досрочные выборы в мае 1996 года.", es: "Se disolvió por ley — elecciones anticipadas en mayo de 1996.", fr: "S’est dissoute par une loi — élections anticipées en mai 1996." }
