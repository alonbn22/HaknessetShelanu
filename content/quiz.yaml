        quote:
          he: "\"התוכנית הזאת תואמת את האג'נדה של הכהניזם… לבוא ולהפוך את זה לתוכנית מדינית זה לא נכון ולא ראוי ומעמיד את ישראל בעמדה מאוד בעייתית גם ביחס לחוק הבינלאומי.\""
          en: "\"This plan matches the agenda of Kahanism… To come and turn this into a policy plan is wrong and improper, and puts Israel in a very problematic position, also with respect to international law.\""
