    date: 2025-10-20
    title:
      he: כינה את נשיא בית המשפט העליון יצחק עמית "שופט" ולא "נשיא" בפתיחת מושב החורף; הנשיא הרצוג נזף
      en: Addressed Chief Justice Isaac Amit as "justice" rather than "president" at the winter session opening; President Herzog rebuked him
    description:
      he: 'בטקס פתיחת מושב החורף של הכנסת ב-20 באוקטובר 2025 פנה אוחנה אל נשיא בית המשפט העליון יצחק עמית בתואר "שופט" בלבד, על רקע מחלוקת הקואליציה על הליך בחירתו. נשיא המדינה יצחק הרצוג סטה מנאומו ואמר: "לא אסבול חוסר כבוד בסיסי", וראש הממשלה נתניהו אמר כי "יצחק עמית הוא נשיא בית המשפט העליון – זו עובדה". בפברואר 2025 הודיע אוחנה כי ייעדר מטקס השבעתו של עמית, במחאה על ביטול חוק יסוד על ידי בג"ץ ועל הליך הבחירה.'
      en: 'At the opening of the Knesset winter session on 20 October 2025, Ohana addressed Supreme Court President Isaac Amit only as "justice", amid the coalition''s dispute over how Amit was chosen. President Isaac Herzog departed from his prepared speech to say "I will not tolerate basic disrespect", and Prime Minister Netanyahu said "Isaac Amit is the president of the Supreme Court – that is a fact". In February 2025 Ohana had announced he would skip Amit''s swearing-in ceremony, in protest at the High Court''s striking down of a Basic Law and at the selection process.'
    sources:
