    description:
      he: "מיכאלי, חברת סיעת העבודה באופוזיציה, עומדת בראש ועדת המשנה למוכנות ולביטחון שוטף של ועדת החוץ והביטחון, שהחלה לפעול רשמית ב-22 בדצמבר 2024. הוועדה עוסקת בפיקוח על מוכנות כוחות הביטחון ועל ניהול הביטחון השוטף."
      en: "Michaeli, a member of the opposition Labor faction, chairs the Foreign Affairs and Defense Committee's Subcommittee for Preparedness and Routine Security, which formally began operating on 22 December 2024. The subcommittee oversees the readiness of the security forces and the management of routine security."
