          - { url: "https://www.timesofisrael.com/hadash-to-pick-new-leadership-as-arab-party-hopes-to-energize-bid-for-joint-list-revival/", title: "Arab party Hadash to pick new leaders, hopes to energize efforts for Joint List revival (2026-05-14)", publisher: "The Times of Israel" }
      - date: "2026-06-10"
        text:
          he: "חד\"ש הודיעה כי תתקדם להקמת רשימה משותפת עם תע\"ל ובל\"ד, תוך השארת הדלת פתוחה לרע\"ם; המגעים עם רע\"ם נתקעו על דרישתה שהרשימה תהיה טכנית בלבד כדי לשמור על חופש הצטרפות לקואליציה."
          en: "Hadash announced it would move ahead with a joint list with Ta’al and Balad, leaving the door open to Ra’am; talks with Ra’am stalled over its demand that the list be technical only, preserving its freedom to join a coalition."
          ar: "أعلنت الجبهة أنها ستمضي في تشكيل قائمة مشتركة مع العربية للتغيير والتجمع، مع إبقاء الباب مفتوحًا أمام القائمة الموحدة؛ وتعثّرت الاتصالات مع الموحدة بسبب مطلبها أن تكون القائمة تقنية فقط للحفاظ على حريتها في الانضمام إلى ائتلاف."
          ru: "Партия «Хадаш» объявила, что продолжит формировать совместный список с «Тааль» и «Балад», оставив дверь открытой для РААМ; переговоры с РААМ застопорились из-за её требования, чтобы список был лишь техническим — ради сохранения свободы войти в коалицию."
          es: "Hadash anunció que seguiría adelante con una lista conjunta con Ta’al y Balad, dejando la puerta abierta a Ra’am; las conversaciones con Ra’am se estancaron por su exigencia de que la lista fuera solo técnica, conservando su libertad de unirse a una coalición."
          fr: "Hadash a annoncé qu’il irait de l’avant avec une liste commune avec Ta’al et Balad, en laissant la porte ouverte à Ra’am ; les pourparlers avec Ra’am ont achoppé sur son exigence d’une liste purement technique, préservant sa liberté de rejoindre une coalition."
        sources:
          - { url: "https://www.timesofisrael.com/arab-parties-hadash-taal-balad-announce-joint-electoral-slate-without-raam/", title: "Arab parties Hadash, Ta'al, Balad announce joint electoral slate — without Ra'am (2026-06-10)", publisher: "The Times of Israel" }
          - { url: "https://zoha.org.il/145989/", title: "חד״ש: החלטנו להתקדם בהקמת הרשימה המשותפת – רע\"מ טרם הצטרפה (2026-06-10)", publisher: "זו הדרך" }
      - date: "2026-08-19"
        text:
          he: "חד\"ש, תע\"ל ובל\"ד חתמו על הסכם לריצה משותפת כ\"רשימה המשותפת\" — בלי רע\"ם: יוסף ג'בארין (חד\"ש) בראש, אחמד טיבי (תע\"ל) שני ויו\"ר הסיעה המיועד, סאמי אבו שחאדה (בל\"ד) שלישי; תע\"ל קיבלה רוטציה בין המקום השישי לתשיעי, לאחר שדחתה ב-9 באוגוסט את מתווה ועדת הפיוס."
          en: "Hadash, Ta’al and Balad signed an agreement to run together as the Joint List — without Ra’am: Yousef Jabareen (Hadash) first, Ahmad Tibi (Ta’al) second and designated faction chair, Sami Abu Shehadeh (Balad) third; Ta’al received a rotation between the sixth and ninth slots after rejecting the reconciliation committee’s proposal on 9 August."
          ar: "وقّعت الجبهة والعربية للتغيير والتجمع اتفاقًا للترشح معًا باسم «القائمة المشتركة» — من دون القائمة الموحدة: يوسف جبارين (الجبهة) على رأسها، وأحمد الطيبي (العربية للتغيير) ثانيًا ورئيس الكتلة المرتقب، وسامي أبو شحادة (التجمع) ثالثًا؛ وحصلت العربية للتغيير على تناوب بين الموقعين السادس والتاسع، بعدما رفضت في 9 آب/أغسطس مقترح لجنة المصالحة."
          ru: "«Хадаш», «Тааль» и «Балад» подписали соглашение о совместном участии в выборах как «Объединённый список» — без РААМ: во главе Юсеф Джабарин («Хадаш»), второй — Ахмад Тиби («Тааль»), намеченный председатель фракции, третий — Сами Абу Шехаде («Балад»); «Тааль» получила ротацию между шестым и девятым местами, отклонив 9 августа предложение комиссии по примирению."
          es: "Hadash, Ta’al y Balad firmaron un acuerdo para presentarse juntos como la Lista Conjunta — sin Ra’am: Yousef Jabareen (Hadash) primero, Ahmad Tibi (Ta’al) segundo y presidente designado de la facción, Sami Abu Shehadeh (Balad) tercero; Ta’al recibió una rotación entre los puestos sexto y noveno tras rechazar la propuesta del comité de reconciliación el 9 de agosto."
          fr: "Hadash, Ta’al et Balad ont signé un accord pour se présenter ensemble sous le nom de Liste commune — sans Ra’am : Yousef Jabareen (Hadash) premier, Ahmad Tibi (Ta’al) deuxième et président de faction désigné, Sami Abu Shehadeh (Balad) troisième ; Ta’al a obtenu une rotation entre les sixième et neuvième places après avoir rejeté la proposition du comité de réconciliation le 9 août."
        sources:
          - { url: "https://www.timesofisrael.com/arab-majority-hadash-taal-and-balad-parties-agree-on-joint-run-after-striking-deal/", title: "Arab-majority Hadash, Ta'al and Balad parties agree on joint run after striking deal (2026-08-19)", publisher: "The Times of Israel" }
          - { url: "https://www.ynet.co.il/news/article/syoll7qdgl", title: "הרשימה המשותפת חוזרת - בלי עבאס: חד\"ש, תע\"ל ובל\"ד מתאחדות (2026-08-19)", publisher: "ynet" }
          - { url: "https://www.timesofisrael.com/negotiations-over-arab-joint-list-hit-snag-as-ahmad-tibi-rejects-proposed-slate/", title: "Negotiations over Arab joint list hit snag as Ahmad Tibi rejects proposed slate (2026-08-09)", publisher: "The Times of Israel" }
      - date: "2026-09-08"
        text:
          he: "הרשימה המשותפת הוגשה לוועדת הבחירות (אותיות מבוקשות ודם): 1 יוסף גבארין (חד\"ש), 2 אחמד טיבי (תע\"ל), 3 סאמי אבו שחאדה (בל\"ד), 4 פאתן ג'טאס (חד\"ש), 5 בכר עואודה (בל\"ד), 6 עופר כסיף (חד\"ש), 7 יוסף עטאונה (חד\"ש), 8 מהא כרכבי סבאח (בל\"ד), 9 אחמד דראושה (תע\"ל). איימן עודה אינו ברשימה. ב-12 בספטמבר נחתם הסכם עודפים עם רע\"ם."
          en: "The Joint List was submitted to the CEC (requested letters ודם): 1 Yousef Jabareen (Hadash), 2 Ahmad Tibi (Ta’al), 3 Sami Abu Shehadeh (Balad), 4 Faten Ghattas (Hadash), 5 Bakr Awawdeh (Balad), 6 Ofer Cassif (Hadash), 7 Yousef Atauna (Hadash), 8 Maha Karkabi Sabbah (Balad), 9 Ahmad Darawshe (Ta’al). Ayman Odeh is not on the list. On 12 September the list signed a surplus-vote agreement with Ra’am."
          ar: "قُدّمت القائمة المشتركة إلى لجنة الانتخابات (الأحرف المطلوبة ודם): 1 يوسف جبارين (الجبهة)، 2 أحمد الطيبي (العربية للتغيير)، 3 سامي أبو شحادة (التجمع)، 4 فاتن غطاس (الجبهة)، 5 بكر عواودة (التجمع)، 6 عوفر كسيف (الجبهة)، 7 يوسف عطاونة (الجبهة)، 8 مها كركبي صباح (التجمع)، 9 أحمد دراوشة (العربية للتغيير). أيمن عودة ليس في القائمة. وفي 12 أيلول/سبتمبر وُقّعت اتفاقية فائض أصوات مع القائمة الموحدة."
          ru: "«Объединённый список» подан в ЦИК (запрошенные буквы ודם): 1 Юсеф Джабарин («Хадаш»), 2 Ахмад Тиби («Тааль»), 3 Сами Абу Шехаде («Балад»), 4 Фатен Гаттас («Хадаш»), 5 Бакр Ававде («Балад»), 6 Офер Касиф («Хадаш»), 7 Юсеф Атауна («Хадаш»), 8 Маха Каркаби-Саббах («Балад»), 9 Ахмад Дарауше («Тааль»). Аймана Оде в списке нет. 12 сентября подписано соглашение об излишках голосов с РААМ."
          es: "La Lista Conjunta fue presentada ante la Comisión Electoral (letras solicitadas ודם): 1 Yousef Jabareen (Hadash), 2 Ahmad Tibi (Ta’al), 3 Sami Abu Shehadeh (Balad), 4 Faten Ghattas (Hadash), 5 Bakr Awawdeh (Balad), 6 Ofer Cassif (Hadash), 7 Yousef Atauna (Hadash), 8 Maha Karkabi Sabbah (Balad), 9 Ahmad Darawshe (Ta’al). Ayman Odeh no está en la lista. El 12 de septiembre la lista firmó un acuerdo de votos sobrantes con Ra’am."
          fr: "La Liste commune a été déposée auprès de la Commission électorale (lettres demandées ודם) : 1 Yousef Jabareen (Hadash), 2 Ahmad Tibi (Ta’al), 3 Sami Abu Shehadeh (Balad), 4 Faten Ghattas (Hadash), 5 Bakr Awawdeh (Balad), 6 Ofer Cassif (Hadash), 7 Yousef Atauna (Hadash), 8 Maha Karkabi Sabbah (Balad), 9 Ahmad Darawshe (Ta’al). Ayman Odeh n’y figure pas. Le 12 septembre, la liste a signé un accord de report des voix restantes avec Ra’am."
        sources:
          - { url: "https://www.gov.il/he/pages/hareshima-hameshutefet_list35", title: "הרשימה המשותפת — רשימת המועמדים לכנסת ה-26 (ועדת הבחירות המרכזית) (2026-09-18)", publisher: "gov.il / ועדת הבחירות המרכזית" }
          - { url: "https://www.timesofisrael.com/israels-election-takes-shape-as-38-parties-submit-slates-from-likud-to-joint-list/", title: "Israel's election takes shape as 38 parties submit slates, in battle between pro- and anti-Netanyahu blocs (2026-09-09)", publisher: "The Times of Israel" }
          - { url: "https://www.timesofisrael.com/liveblog_entry/joint-list-and-raam-sign-surplus-vote-deal-ahead-of-oct-27-elections/", title: "Joint List and Ra'am sign surplus-vote deal ahead of Oct. 27 elections (2026-09-12)", publisher: "The Times of Israel" }
      - date: "2026-09-13"
        text:
          he: "הליכוד הודיע כי יגיש לוועדת הבחירות המרכזית בקשה לפסול את הרשימה המשותפת ואת רע\"ם. הכרעות הוועדה נתונות לביקורת בית המשפט העליון."
          en: "Likud said it would petition the Central Elections Committee to disqualify the Joint List and Ra’am. CEC decisions are subject to Supreme Court review."
          ar: "أعلن الليكود أنه سيقدّم إلى لجنة الانتخابات المركزية طلبًا لشطب القائمة المشتركة والقائمة الموحدة. قرارات اللجنة خاضعة لرقابة المحكمة العليا."
          ru: "Ликуд заявил, что подаст в Центральную избирательную комиссию ходатайство об отстранении «Объединённого списка» и РААМ. Решения комиссии подлежат рассмотрению Верховным судом."
          es: "El Likud dijo que pediría a la Comisión Electoral Central la inhabilitación de la Lista Conjunta y de Ra’am. Las decisiones de la Comisión están sujetas a revisión del Tribunal Supremo."
          fr: "Le Likoud a déclaré qu’il demanderait à la Commission électorale centrale d’invalider la Liste commune et Ra’am. Les décisions de la Commission sont soumises au contrôle de la Cour suprême."
        sources:
          - { url: "https://www.timesofisrael.com/netanyahus-party-says-it-will-petition-election-panel-to-ban-arab-majority-parties/", title: "Netanyahu's Likud says it will petition election panel to ban Arab-majority parties (2026-09-14)", publisher: "The Times of Israel" }
      - date: "2026-10-01"
        text:
          he: "ב-1 באוקטובר 2026 דן הרכב של תשעה שופטי בית המשפט העליון בערעורי רע\"ם והרשימה המשותפת ובפסילת המועמדים עופר כסיף וסאמי אבו שחאדה. בעניין אבו שחאדה אמר נשיא בית המשפט העליון יצחק עמית כי בקרב השופטים יש רוב לאישור הפסילה, וכל השופטים המליצו לו לשקול להסיר את מועמדותו – דבר שיפטור ממתן פסק דין מנומק; השר בן גביר התנגד להמלצה וביקש פסק דין. באותו ערב הודיעה בל\"ד כי אבו שחאדה לא יתמודד; הרשימה המשותפת כינתה את ההמלצה \"פסילה בפועל\". פסקי הדין בעניין רע\"ם, הרשימה המשותפת וכסיף צפויים עד 4 באוקטובר."
          en: "On 1 October 2026 a panel of nine Supreme Court justices heard the appeals of Ra’am and the Joint List and the disqualifications of the candidates Ofer Cassif and Sami Abu Shehadeh. On Abu Shehadeh, Supreme Court President Yitzhak Amit said a majority of the justices favoured approving the disqualification, and all nine recommended that he consider withdrawing – which would make a reasoned judgment unnecessary; Minister Ben Gvir opposed the recommendation and asked for a ruling. That evening Balad announced that Abu Shehadeh would not run; the Joint List called the recommendation “disqualification in practice”. The rulings on Ra’am, the Joint List and Cassif are due by 4 October."
          ar: "في 1 تشرين الأول/أكتوبر 2026 نظرت هيئة من تسعة قضاة في المحكمة العليا في استئنافَي القائمة الموحدة والقائمة المشتركة وفي شطب المرشحَين عوفر كسيف وسامي أبو شحادة. وبشأن أبو شحادة قال رئيس المحكمة العليا يتسحاق عميت إن أغلبية القضاة تميل إلى المصادقة على الشطب، وأوصاه القضاة التسعة جميعًا بأن يدرس سحب ترشحه – ما يُغني عن إصدار حكم مُعلَّل؛ وعارض الوزير بن غفير التوصية وطلب إصدار حكم. وفي المساء نفسه أعلن التجمع أن أبو شحادة لن يترشح؛ ووصفت القائمة المشتركة التوصية بأنها «شطب فعلي». ويُتوقع صدور الأحكام بشأن القائمة الموحدة والقائمة المشتركة وكسيف حتى 4 تشرين الأول/أكتوبر."
          ru: "1 октября 2026 года коллегия из девяти судей Верховного суда рассмотрела апелляции РААМ и «Объединённого списка» и отстранение кандидатов Офера Касифа и Сами Абу Шехаде. По делу Абу Шехаде председатель Верховного суда Ицхак Амит сказал, что большинство судей склоняется к утверждению отстранения, и все девять рекомендовали ему рассмотреть снятие кандидатуры — тогда мотивированное решение не понадобится; министр Бен-Гвир выступил против рекомендации и потребовал решения. В тот же вечер «Балад» объявил, что Абу Шехаде не будет баллотироваться; «Объединённый список» назвал рекомендацию «фактическим отстранением». Решения по РААМ, «Объединённому списку» и Касифу ожидаются до 4 октября."
          es: "El 1 de octubre de 2026 un tribunal de nueve jueces del Tribunal Supremo examinó los recursos de Ra’am y de la Lista Conjunta y la inhabilitación de los candidatos Ofer Cassif y Sami Abu Shehadeh. Sobre Abu Shehadeh, el presidente del Tribunal Supremo, Yitzhak Amit, dijo que una mayoría de los jueces se inclinaba por aprobar la inhabilitación, y los nueve le recomendaron que considerara retirar su candidatura, lo que haría innecesaria una sentencia motivada; el ministro Ben Gvir se opuso a la recomendación y pidió un fallo. Esa misma noche Balad anunció que Abu Shehadeh no se presentaría; la Lista Conjunta calificó la recomendación de «inhabilitación de facto». Los fallos sobre Ra’am, la Lista Conjunta y Cassif se esperan antes del 4 de octubre."
          fr: "Le 1er octobre 2026, une formation de neuf juges de la Cour suprême a examiné les appels de Ra’am et de la Liste commune et l’invalidation des candidats Ofer Cassif et Sami Abu Shehadeh. Concernant Abu Shehadeh, le président de la Cour suprême, Yitzhak Amit, a déclaré qu’une majorité des juges penchait pour approuver l’invalidation, et les neuf juges lui ont recommandé d’envisager de retirer sa candidature, ce qui rendrait inutile un jugement motivé ; le ministre Ben Gvir s’est opposé à cette recommandation et a demandé une décision. Le soir même, Balad a annoncé qu’Abu Shehadeh ne se présenterait pas ; la Liste commune a qualifié la recommandation d’« invalidation de fait ». Les décisions sur Ra’am, la Liste commune et Cassif sont attendues au plus tard le 4 octobre."
        sources:
          - { url: "https://www.jpost.com/israel-news/politics-and-diplomacy/article-910271", title: "Abu Shehadeh to withdraw election bid on Supreme Court recommendation (1 Oct 2026)", publisher: "The Jerusalem Post" }
