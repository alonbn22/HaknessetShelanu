  - kind: neutral
    category: news
    date: 2026-05-16
    title:
      he: סיים את כהונתו כיו"ר חד"ש; יוסף ג'בארין נבחר במקומו ועודה לא יתמודד בבחירות 2026
      en: Ended his tenure as Hadash chair; Yousef Jabareen elected in his place and Odeh will not run in 2026
    description:
      he: "עודה הודיע עוד במאי 2023 כי לא יתמודד בבחירות הבאות לכנסת אך ישלים את כהונתו. ב-16 במאי 2026 נבחר ד\"ר יוסף ג'בארין, חבר כנסת לשעבר, ליו\"ר חד\"ש ולראש רשימתה כבר בסיבוב הראשון של הבחירות הפנימיות, ועודה בירך על התוצאה: \"חד\"ש לא מפרה הבטחות. מי שינצח בפריימריז ייצג את כולנו\". במהלך 2025–2026 פעל עודה לאיחוד המפלגות הערביות לרשימה משותפת לקראת בחירות אוקטובר 2026."
      en: "Odeh had announced in May 2023 that he would not run in the next Knesset election but would complete his term. On 16 May 2026 Dr. Yousef Jabareen, a former MK, was elected Hadash chair and head of its list in the first round of the party's internal election, and Odeh welcomed the result: \"Hadash does not break promises. Whoever wins the primaries will represent all of us.\" During 2025–2026 Odeh worked to reunite the Arab parties into a joint list ahead of the October 2026 election."
    sources:
