    title:
      he: מקריירה של שחקנית ושדרנית טלוויזיה לעריכת דין
      en: Career path from actress and TV presenter to practicing lawyer
    description:
      he: אפרת רייטן עבדה תחילה כשחקנית ומגישת טלוויזיה, בין היתר בערוץ הילדים ובערוץ
        10, ולאחר מכן עברה לתחום המשפט. היא סיימה תואר ראשון במשפטים בשנת 2004,
        הוסמכה כעורכת דין ומשנת 2012 עבדה במשרד עורכי הדין גולדפרב זליגמן ושות'.
      en: Efrat Rayten began her career as an actress and television presenter,
        including on the Children's Channel and Channel 10, before moving into
        law. She completed her law degree in 2004, was called to the bar, and
        from 2012 worked at the law firm Goldfarb Seligman & Co.
