      - date: "2026-07-28"
        text:
          he: "שני חברי כנסת של יש עתיד עזבו את הכנסת באמצע 2026: בועז טופורובסקי (הודיע ב-27 במאי; עוז חיים נכנס במקומו ב-7 ביוני 2026) ורון כץ (הודיע ב-26 ביולי; מוחמד אבו אל היג'א נכנס במקומו ב-28 ביולי 2026)."
          en: "Two Yesh Atid MKs left the Knesset in mid-2026: Boaz Toporovsky (announced 27 May; Oz Haim took his seat on 7 June 2026) and Ron Katz (announced 26 July; Mohammad Abu al-Hija took his seat on 28 July 2026)."
        sources:
          - { url: "https://www.timesofisrael.com/yesh-atid-co-founder-and-mk-boaz-toporovsky-steps-away-from-knesset/", title: "Yesh Atid co-founder and MK Boaz Toporovsky steps away from Knesset (2026-05-27)", publisher: "The Times of Israel" }
          - { url: "https://13tv.co.il/item/news/politics/politics/ta232-905178276/", title: "עוזב את מפלגת יש עתיד: ח\"כ בועז טופורובסקי פורש (2026-05-27)", publisher: "חדשות 13" }
          - { url: "https://www.mako.co.il/news-israel-elections/2026/Article-3468d77390d9f91027.htm", title: "עוד עזיבה ביש עתיד: חה\"כ רון כץ הודיע על פרישה (2026-07-26)", publisher: "N12 (mako)" }
          - { url: "https://main.knesset.gov.il/mk/apps/faction/faction-lobby?KnessetID=25&FactionID=1102", title: "סיעת יש עתיד — חילופי גברי: 07/06/2026 עוז חיים במקום בועז טופורובסקי; 28/07/2026 מוחמד אבו אל היג'א במקום רון כץ (2026-09-19)", publisher: "הכנסת" }
      - date: "2026-08-11"
        text:
          he: "יואב סגלוביץ הודיע על פרישה מיש עתיד (7 באוגוסט) והתפטר מהכנסת; מיכל סלבני כבביה נכנסה במקומו ב-11 באוגוסט 2026. ב-31 באוגוסט הודיעו מנסור עבאס וסגלוביץ על ריצה משותפת, וסגלוביץ הוצב במקום השני ברשימת רע\"ם."
          en: "Yoav Segalovitz announced he was leaving Yesh Atid (7 August) and resigned from the Knesset; Michal Salbani-Kababia took his seat on 11 August 2026. On 31 August Mansour Abbas and Segalovitz announced a joint run, and Segalovitz was placed second on the Ra’am list."
        sources:
          - { url: "https://www.timesofisrael.com/segalovitz-departs-yesh-atid-amid-his-reported-talks-to-join-mansour-abbass-raam/", title: "Segalovitz departs Yesh Atid amid his reported talks to join Mansour Abbas's Ra'am (2026-08-07)", publisher: "The Times of Israel" }
          - { url: "https://www.timesofisrael.com/raams-abbas-former-yesh-atid-mk-segalovitz-confirm-ongoing-talks-on-knesset-run/", title: "Ra'am's Abbas, former Yesh Atid MK Segalovitz confirm ongoing talks on Knesset run (2026-08-13)", publisher: "The Times of Israel" }
          - { url: "https://www.timesofisrael.com/jewish-former-mk-yoav-segalovitz-announces-unprecedented-run-with-arab-raam-party/", title: "In unprecedented move, Abbas and Segalovitz announce joint run, bringing Jewish lawmaker to Arab party's slate (2026-08-31)", publisher: "The Times of Israel" }
          - { url: "https://www.gov.il/he/pages/raam_list18", title: "רע\"ם - הרשימה הערבית המאוחדת — רשימה 18: 2 יואב סגלוביץ (2026-09-09)", publisher: "ועדת הבחירות המרכזית (gov.il)" }
          - { url: "https://main.knesset.gov.il/mk/apps/faction/faction-lobby?KnessetID=25&FactionID=1102", title: "סיעת יש עתיד — חילופי גברי: 11/08/2026 מיכל סלבני כבביה במקום יואב סגלוביץ (2026-09-19)", publisher: "הכנסת" }
      - date: "2026-09-04"
        text:
          he: "שישה חברי כנסת של יש עתיד הודיעו שלא יתמודדו בבחירות 2026 ונשארו חברי מפלגה: מאיר כהן ומיקי לוי (31 באוגוסט–1 בספטמבר), דבי ביטון וטטיאנה מזרסקי (1 בספטמבר), קארין אלהרר (3 בספטמבר) ומיכל שיר סגמן (4 בספטמבר)."
          en: "Six Yesh Atid MKs announced they would not run in the 2026 election while remaining party members: Meir Cohen and Mickey Levy (31 August–1 September), Debbie Biton and Tatiana Mazarsky (1 September), Karin Elharar (3 September) and Michal Shir Segman (4 September)."
        sources:
          - { url: "https://www.timesofisrael.com/wave-of-yesh-atid-mks-quit-election-run-as-joint-slate-with-bennett-falters-in-polls/", title: "Wave of Yesh Atid MKs quit election run as joint slate with Bennett falters in polls (2026-09-02)", publisher: "The Times of Israel" }
          - { url: "https://www.davar1.co.il/695658/", title: "עוד שתיים בחוץ: דבי ביטון וטטיאנה מזרסקי לא יתמודדו ברשימת יש עתיד לכנסת הבאה (2026-09-01)", publisher: "דבר" }
          - { url: "https://www.zman.co.il/719843/", title: "חברת הכנסת דבי ביטון לא תתמודד ברשימת יש עתיד בבחירות הקרובות (2026-09-01)", publisher: "זמן ישראל" }
          - { url: "https://13tv.co.il/item/news/politics/politics/zr1kb-905343971/", title: "עוד פרישה ביש עתיד: ח\"כ מיכל שיר הודיעה שלא תתמודד בבחירות (2026-09-04)", publisher: "חדשות 13" }
      - date: "2026-09-07"
        text:
          he: "הרשימה המשותפת \"ביחד בראשות נפתלי בנט\" הוגשה לוועדת הבחירות (רשימה 1; האותיות המבוקשות ב או רק) על ידי שתי מפלגות — \"ביחד בראשות בנט\" ו\"יש עתיד - בראשות יאיר לפיד\"; מועמדי יש עתיד: לפיד (2), מירב בן ארי (4), נעם תיבון (6), מירב כהן (9), רם בן ברק (12), נאור שירי (14), ולדימיר בליאק (16)."
          en: "The joint list “Together headed by Naftali Bennett” was submitted to the CEC (list 1; requested letters ב or רק) by two parties — “Together headed by Bennett” and “Yesh Atid headed by Yair Lapid”; Yesh Atid’s candidates: Lapid (2), Merav Ben-Ari (4), Noam Tibon (6), Meirav Cohen (9), Ram Ben Barak (12), Naor Shiri (14), Vladimir Beliak (16)."
        sources:
          - { url: "https://www.gov.il/he/pages/beyahad_list1", title: "ביחד בראשות נפתלי בנט — רשימה 1 (2026-09-07)", publisher: "ועדת הבחירות המרכזית (gov.il)" }
          - { url: "https://www.timesofisrael.com/lapid-unveils-yesh-atid-lineup-for-byachad-electoral-slate/", title: "Lapid unveils Yesh Atid lineup for B'Yachad electoral slate (2026-09-05)", publisher: "The Times of Israel" }
          - { url: "https://www.timesofisrael.com/israels-election-takes-shape-as-38-parties-submit-slates-from-likud-to-joint-list/", title: "Israel's election takes shape as 38 parties submit slates, in battle between pro- and anti-Netanyahu blocs (2026-09-09)", publisher: "The Times of Israel" }
      - date: "2026-09-09"
        text:
          he: "אלעזר שטרן הודיע על פרישה מיש עתיד (14 באוגוסט), הצטרף למפלגת ישר! של גדי איזנקוט (24 באוגוסט) והוצב במקום ה-12 ברשימתה; רוני מלכאי נכנסה לכנסת במקומו ב-9 בספטמבר 2026."
          en: "Elazar Stern announced he was leaving Yesh Atid (14 August), joined Gadi Eisenkot’s Yashar! (24 August) and was placed 12th on its list; Roni Malkai entered the Knesset in his place on 9 September 2026."
        sources:
          - { url: "https://www.timesofisrael.com/mk-elazar-stern-announces-yesh-atid-exit-ahead-of-likely-run-with-eisenkot/", title: "MK Elazar Stern announces Yesh Atid exit ahead of likely run with Eisenkot (2026-08-14)", publisher: "The Times of Israel" }
          - { url: "https://www.timesofisrael.com/former-yesh-atid-mk-elazar-stern-makes-widely-expected-jump-to-eisenkots-yashar/", title: "Former Yesh Atid MK Elazar Stern makes widely expected jump to Eisenkot's Yashar (2026-08-24)", publisher: "The Times of Israel" }
          - { url: "https://www.haaretz.co.il/news/politics/2026-08-24/ty-article/000001a0-3285-ddec-a7a5-36f7e9120000", title: "אחרי שפרש מיש עתיד, אלעזר שטרן מצטרף למפלגה של איזנקוט (2026-08-24)", publisher: "הארץ" }
          - { url: "https://www.gov.il/he/pages/yashar_list_2", title: "ישר! עם איזנקוט — רשימה 2: 12 אלעזר שטרן (2026-09-10)", publisher: "ועדת הבחירות המרכזית (gov.il)" }
          - { url: "https://main.knesset.gov.il/mk/apps/faction/faction-lobby?KnessetID=25&FactionID=1102", title: "סיעת יש עתיד — חילופי גברי: 09/09/2026 רוני מלכאי במקום אלעזר שטרן (2026-09-19)", publisher: "הכנסת" }
      - date: "2026-09-10"
        text:
          he: "רשימת \"ביחד\" (בנט–לפיד) וישראל ביתנו הודיעו על הסכם עודפים לבחירות 2026."
          en: "The “Together” list (Bennett–Lapid) and Yisrael Beytenu announced a surplus-vote agreement for the 2026 election."
        sources:
          - { url: "https://www.timesofisrael.com/main-opposition-factions-ink-surplus-vote-deals-in-bid-to-maximize-knesset-representation/", title: "Main opposition factions ink surplus-vote deals in bid to maximize Knesset representation (2026-09-10)", publisher: "The Times of Israel" }
