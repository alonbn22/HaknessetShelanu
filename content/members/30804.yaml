claims:
  - kind: positive
    category: achievement
    title:
      he: כיהן כשר במשרד החינוך בממשלה ה-37
      en: Served as a minister in the Ministry of Education
    description:
      he: חיים ביטון, מטעם ש"ס, מונה לשר במשרד החינוך בממשלה ה-37 בראשות בנימין נתניהו ב-29 בדצמבר 2022, ובמסגרת תפקידו היה ממונה בין היתר על החינוך החרדי והחברה למתנ"סים. הוא התפטר מתפקידו כשר ביולי 2025, במסגרת התפטרות שרי ש"ס על רקע משבר חוק הגיוס.
      en: Chaim Biton of Shas was appointed a minister in the Ministry of Education in the 37th government led by Benjamin Netanyahu on 29 December 2022, with responsibilities that included the Haredi education sector and the community-centers authority. He resigned from the ministerial post in July 2025, as part of the resignation of Shas ministers amid the dispute over the military-conscription (draft) law.
    date: 2022-12-29
    sources:
      - url: https://en.wikipedia.org/wiki/Haim_Biton
        title: Haim Biton
        publisher: Wikipedia
      - url: https://he.wikipedia.org/wiki/%D7%97%D7%99%D7%99%D7%9D_%D7%91%D7%99%D7%98%D7%95%D7%9F
        title: חיים ביטון
        publisher: Wikipedia (Hebrew)
  - kind: positive
    category: achievement
    title:
      he: מנכ"ל תנועת ש"ס וראש רשת החינוך התורני של התנועה
      en: Director-general of Shas and head of the party's Torah education network
    description:
      he: 'טרם כניסתו לכנסת בנה ביטון קריירה ארוכה בניהול חינוכי וארגוני: כיהן כמנכ"ל רשת מוסדות מגדל אור, מונה למנכ"ל תנועת ש"ס ב-2014, ועמד בראש רשת החינוך התורני של ש"ס (מעיין החינוך התורני / בני יוסף). לפי הדיווחים גדל מספר התלמידים ברשת בעשרת אלפים בתוך שנתיים בתקופת ניהולו.'
      en: "Before entering the Knesset, Biton built a long career in educational and organizational management: he served as CEO of the Migdal Or institutions network, was appointed director-general (CEO) of the Shas party in 2014, and headed the party's Torah education network (Ma'ayan HaChinuch HaTorani / Bnei Yosef), whose enrollment reportedly grew by 10,000 pupils within two years during his tenure."
    date: "2014"
    sources:
      - url: https://en.wikipedia.org/wiki/Haim_Biton
