    label: { he: "כינוס הכנסת ה-26", en: "The 26th Knesset convenes", ar: "انعقاد الكنيست الـ26", ru: "Первое заседание Кнессета 26-го созыва", es: "Se constituye la 26.ª Knéset", fr: "La 26e Knesset se réunit" }
    detail:
      he: "ישיבתה הראשונה של הכנסת ה-26 צפויה ב-10 בנובמבר 2026; לאחר מכן מתחיל תהליך הרכבת הממשלה."
      en: "The 26th Knesset's first sitting is expected on November 10, 2026; government formation begins thereafter."
      ar: "يُتوقّع أن تُعقد الجلسة الأولى للكنيست الـ26 في 10 تشرين الثاني/نوفمبر 2026؛ وبعدها يبدأ تشكيل الحكومة."
      ru: "Первое заседание Кнессета 26-го созыва ожидается 10 ноября 2026 года; после этого начинается формирование правительства."
      es: "La primera sesión de la 26.ª Knéset está prevista para el 10 de noviembre de 2026; después comienza la formación del Gobierno."
      fr: "La première séance de la 26e Knesset est attendue le 10 novembre 2026 ; la formation du gouvernement commence ensuite."
    status: reported
    sources:
      - url: "https://www.zman.co.il/live/705042/"
        title: "לוח הזמנים לבחירות לכנסת"
        publisher: "Zman Yisrael"

facts:
  - key: surplus-agreements
    label: { he: "הסכמי עודפים — מה זה ומי חתם", en: "Surplus-vote agreements — what they are and who signed", ar: "اتفاقيات فائض الأصوات — ما هي ومن وقّعها", ru: "Соглашения об излишках голосов — что это и кто их подписал", es: "Acuerdos de votos sobrantes — qué son y quién los firmó", fr: "Accords de report des voix restantes — de quoi il s’agit et qui a signé" }
    detail:
      he: "אחרי חלוקת המנדטים לפי שיטת בדר-עופר נשארים לכל רשימה קולות \"עודפים\" שלא הספיקו למנדט נוסף. שתי רשימות רשאיות להסכים מראש לאחד את עודפיהן, וכך אחת מהן עשויה לזכות במנדט הנוסף במקום שיאבד. ההסכמים מוגשים לוועדת הבחירות המרכזית עד 16 באוקטובר 2026. עד כה דווח על שלושה זוגות: ישר! והדמוקרטים, ישראל ביתנו וביחד, והרשימה המשותפת ורע\"ם — מוצג על כרטיס כל רשימה."
      en: "After seats are allocated by the Bader-Ofer method, each list is left with \"surplus\" votes that fell short of another seat. Two lists may agree in advance to pool their surpluses, so that one of them can win the extra seat instead of losing it. Agreements are filed with the Central Elections Committee by October 16, 2026. Three pairs have been reported so far: Yashar! and the Democrats, Yisrael Beiteinu and Together, and the Joint List and Ra'am — shown on each list's card."
      ar: "بعد توزيع المقاعد بطريقة بادر-عوفر، يبقى لكل قائمة «فائض» من الأصوات لم يكفِ لمقعد إضافي. يمكن لقائمتين الاتفاق مسبقًا على ضمّ فائضيهما، كي تفوز إحداهما بالمقعد الإضافي بدل أن يضيع. تُقدَّم الاتفاقيات إلى لجنة الانتخابات المركزية حتى 16 تشرين الأول/أكتوبر 2026. حتى الآن أُفيد عن ثلاثة أزواج: ياشار! والديمقراطيون، إسرائيل بيتنا و«معًا»، والقائمة المشتركة والقائمة الموحدة — وهي معروضة في بطاقة كل قائمة."
      ru: "После распределения мандатов по методу Бадера — Офера у каждого списка остаются «излишки» голосов, которых не хватило на ещё один мандат. Два списка могут заранее договориться объединить излишки, чтобы один из них получил дополнительный мандат, а не потерял его. Соглашения подаются в ЦИК до 16 октября 2026 года. Пока сообщалось о трёх парах: «Яшар!» и «Демократы», «Наш дом Израиль» и «Вместе», Объединённый список и РААМ — это указано в карточке каждого списка."
      es: "Tras repartir los escaños por el método Bader-Ofer, a cada lista le quedan votos «sobrantes» que no alcanzaron para otro escaño. Dos listas pueden acordar de antemano sumar sus sobrantes, de modo que una de ellas gane el escaño extra en lugar de perderlo. Los acuerdos se presentan ante la Comisión Electoral Central hasta el 16 de octubre de 2026. Hasta ahora se ha informado de tres pares de listas: ¡Yashar! y los Demócratas, Yisrael Beiteinu y Juntos, y la Lista Conjunta y Ra'am — se muestran en la ficha de cada lista."
      fr: "Après la répartition des sièges selon la méthode Bader-Ofer, chaque liste garde des voix « restantes » insuffisantes pour un siège de plus. Deux listes peuvent convenir à l’avance de mettre leurs restes en commun, afin que l’une d’elles remporte le siège supplémentaire au lieu de le perdre. Les accords sont déposés auprès de la Commission électorale centrale jusqu’au 16 octobre 2026. Trois paires ont été rapportées à ce jour : Yashar! et les Démocrates, Israël Beiteinou et Ensemble, la Liste commune et Ra'am — affichées sur la fiche de chaque liste."
    status: reported
    sources:
      - url: "https://www.bechirot.gov.il/home/"
        title: "ציר הזמן לבחירות לכנסת ה-26 — מועד אחרון להודעה בדבר התקשרויות (הסכמי עודפים), סעיף 67(ב)"
        publisher: "ועדת הבחירות המרכזית"
      - url: "https://m.knesset.gov.il/en/about/lexicon/pages/electoralsystem.aspx"
        title: "Electoral System in Israel (Knesset Lexicon)"
        publisher: "The Knesset"
      - url: "https://www.timesofisrael.com/liveblog_entry/joint-list-and-raam-sign-surplus-vote-deal-ahead-of-oct-27-elections/"
        title: "Joint List and Ra'am sign surplus-vote deal ahead of Oct. 27 elections"
        publisher: "The Times of Israel"
  - key: election-date
    label: { he: "מועד הבחירות", en: "Election date", ar: "موعد الانتخابات", ru: "Дата выборов", es: "Fecha de las elecciones", fr: "Date des élections" }
    value: { he: "יום שלישי, ט\"ז בחשוון התשפ\"ז — 27 באוקטובר 2026", en: "Tuesday, 16 Cheshvan 5787 — October 27, 2026", ar: "الثلاثاء، 16 حشفان 5787 — 27 تشرين الأول/أكتوبر 2026", ru: "вторник, 16 хешвана 5787 года — 27 октября 2026 года", es: "Martes 16 de jeshván de 5787 — 27 de octubre de 2026", fr: "Mardi 16 hechvan 5787 — 27 octobre 2026" }
    detail:
      he: "המועד נקבע על ידי יו\"ר ועדת הבחירות המרכזית, שופט בית המשפט העליון נעם סולברג, ועוגן גם בחקיקה במליאת הכנסת ביולי 2026."
      en: "The date was set by Central Elections Committee chair Justice Noam Sohlberg and was also anchored in legislation by the Knesset plenum in July 2026."
      ar: "حدّد الموعدَ رئيسُ لجنة الانتخابات المركزية القاضي نوعم سولبرغ، كما رسّخته الهيئة العامة للكنيست في التشريع في تموز/يوليو 2026."
      ru: "Дату назначил председатель ЦИК судья Ноам Сольберг, а в июле 2026 года пленум Кнессета закрепил её и в законе."
      es: "La fecha la fijó el presidente de la Comisión Electoral Central, el juez Noam Sohlberg, y el pleno de la Knéset la consagró también en la ley en julio de 2026."
      fr: "La date a été fixée par le président de la Commission électorale centrale, le juge Noam Sohlberg, et également inscrite dans la loi par la plénière de la Knesset en juillet 2026."
    status: confirmed
    sources:
      - url: "https://www.gov.il/he/departments/central-elections-committee/govil-landing-page"
        title: "ועדת הבחירות המרכזית לכנסת — הבחירות לכנסת ה-26"
        publisher: "gov.il / ועדת הבחירות"
      - url: "https://www.timesofisrael.com/judge-sets-date-for-next-scheduled-elections-for-october-2026/"
        title: "October 27, 2026: Judge sets date for next scheduled elections"
        publisher: "The Times of Israel"
      - url: "https://www.zman.co.il/live/705042/"
        title: "לוח הזמנים לבחירות לכנסת"
        publisher: "Zman Yisrael"
  - key: full-term
    label: { he: "קדנציה מלאה", en: "A full term", ar: "ولاية كاملة", ru: "Полный срок", es: "Una legislatura completa", fr: "Une législature complète" }
    detail:
      he: "הכנסת ה-25 (נבחרה ב-1.11.2022, הושבעה ב-15.11.2022) השלימה קדנציה מלאה והתפזרה ב-17 ביולי 2026 — על פי דיווחים, הפעם הראשונה מאז 1988 שהבחירות מתקיימות במועדן החוקי המלא."
      en: "The 25th Knesset (elected Nov 1, 2022, sworn in Nov 15, 2022) completed a full term and dispersed on July 17, 2026 — per reports, the first time since 1988 that elections are held on their full statutory date."
      ar: "أكمل الكنيست الـ25 (انتُخب في 1 تشرين الثاني/نوفمبر 2022 وأدّى اليمين في 15 تشرين الثاني/نوفمبر 2022) ولاية كاملة وحُلّ في 17 تموز/يوليو 2026 — ووفق التقارير، هذه أول مرة منذ 1988 تُجرى فيها الانتخابات في موعدها القانوني الكامل."
      ru: "Кнессет 25-го созыва (избран 1 ноября 2022 года, приведён к присяге 15 ноября 2022 года) отработал полный срок и был распущен 17 июля 2026 года — по сообщениям СМИ, впервые с 1988 года выборы проходят в полный установленный законом срок."
      es: "La 25.ª Knéset (elegida el 1 de noviembre de 2022, constituida el 15 de noviembre de 2022) completó una legislatura entera y se disolvió el 17 de julio de 2026 — según informaciones, la primera vez desde 1988 que las elecciones se celebran en la fecha que marca la ley al término de una legislatura completa."
      fr: "La 25e Knesset (élue le 1er novembre 2022, installée le 15 novembre 2022) a achevé une législature complète et s’est dissoute le 17 juillet 2026 — selon la presse, la première fois depuis 1988 que des élections se tiennent à leur date légale."
    status: reported
    sources:
      - url: "https://www.aljazeera.com/news/2026/7/17/knesset-dissolves-how-will-israel-vote-in-octobers-general-election"
        title: "Knesset dissolves: How will Israel vote in October's general election?"
        publisher: "Al Jazeera"
      - url: "https://www.timesofisrael.com/knesset-expected-to-dissolve-july-17-paving-way-for-october-27-election/"
        title: "Knesset expected to dissolve July 17, paving way for October 27 election"
        publisher: "The Times of Israel"
  - key: statutory-basis
    label: { he: "הבסיס החוקי למועד", en: "Statutory basis for the date", ar: "الأساس القانوني للموعد", ru: "Правовое основание даты", es: "Base legal de la fecha", fr: "Base légale de la date" }
    detail:
      he: "לפי חוק-יסוד: הכנסת (סעיפים 8–9), בתום כהונה מלאה הבחירות מתקיימות ביום שלישי השלישי בחודש חשוון; מכאן נגזר המועד 27 באוקטובר 2026 (ט\"ז בחשוון התשפ\"ז)."
      en: "Under Basic Law: The Knesset (sections 8–9), after a full term elections are held on the third Tuesday of the Hebrew month of Cheshvan; this yields October 27, 2026 (16 Cheshvan 5787)."
      ar: "بموجب قانون أساس: الكنيست (المادتان 8–9)، تُجرى الانتخابات بعد ولاية كاملة في يوم الثلاثاء الثالث من الشهر العبري حشفان؛ وهذا يوافق 27 تشرين الأول/أكتوبر 2026 (16 حشفان 5787)."
      ru: "По Основному закону о Кнессете (статьи 8–9) после полного срока выборы проводятся в третий вторник еврейского месяца хешван; это 27 октября 2026 года (16 хешвана 5787 года)."
      es: "Según la Ley Fundamental: la Knéset (artículos 8–9), tras una legislatura completa las elecciones se celebran el tercer martes del mes hebreo de jeshván; de ahí el 27 de octubre de 2026 (16 de jeshván de 5787)."
      fr: "Selon la Loi fondamentale : la Knesset (articles 8–9), après une législature complète, les élections ont lieu le troisième mardi du mois hébraïque de hechvan ; d’où le 27 octobre 2026 (16 hechvan 5787)."
    status: scheduled-by-law
    sources:
      - url: "https://m.knesset.gov.il/EN/activity/documents/BasicLawsPDF/BasicLawTheKnesset.pdf"
        title: "Basic Law: The Knesset (arts. 8–9)"
        publisher: "The Knesset"
      - url: "https://www.timesofisrael.com/judge-sets-date-for-next-scheduled-elections-for-october-2026/"
        title: "October 27, 2026: Judge sets date for next scheduled elections"
        publisher: "The Times of Israel"
  - key: list-deadline
    label: { he: "הגשת רשימות המועמדים", en: "Candidate-list submission", ar: "تقديم قوائم المرشحين", ru: "Подача списков кандидатов", es: "Presentación de las listas de candidatos", fr: "Dépôt des listes de candidats" }
    value: { he: "הוגשו ב-7–8 בספטמבר 2026", en: "Submitted September 7–8, 2026", ar: "قُدّمت في 7–8 أيلول/سبتمبر 2026", ru: "Поданы 7–8 сентября 2026 года", es: "Presentadas el 7 y 8 de septiembre de 2026", fr: "Déposées les 7 et 8 septembre 2026" }
    detail:
      he: "38 רשימות הוגשו ליו\"ר ועדת הבחירות המרכזית, השופט נעם סולברג, במשכן הכנסת. ההגשה אינה אישור: הרשימות, הכינויים והאותיות נבדקים, והאישור הסופי דווח ל-27 בספטמבר."
      en: "38 lists were submitted to the chair of the Central Elections Committee, Justice Noam Sohlberg, at the Knesset. Submission is not approval: the lists, names and ballot letters are under review, with final approval reported for September 27."
      ar: "قُدّمت 38 قائمة إلى رئيس لجنة الانتخابات المركزية، القاضي نوعم سولبرغ، في الكنيست. التقديم ليس مصادقة: القوائم والأسماء وأحرف بطاقات الاقتراع قيد الفحص، ووفق التقارير فإن المصادقة النهائية في 27 أيلول/سبتمبر."
      ru: "38 списков были поданы председателю ЦИК судье Ноаму Сольбергу в Кнессете. Подача — ещё не утверждение: списки, их названия и буквы бюллетеней проверяются; по сообщениям СМИ, окончательное утверждение — 27 сентября."
      es: "Se presentaron 38 listas ante el presidente de la Comisión Electoral Central, el juez Noam Sohlberg, en la Knéset. Presentar no es aprobar: las listas, los nombres y las letras de papeleta están en revisión, y la aprobación definitiva está prevista, según informaciones, para el 27 de septiembre."
      fr: "38 listes ont été déposées auprès du président de la Commission électorale centrale, le juge Noam Sohlberg, à la Knesset. Le dépôt ne vaut pas approbation : les listes, les noms et les lettres de bulletin sont en cours d’examen, l’approbation définitive étant annoncée pour le 27 septembre."
    status: confirmed
    sources:
      - url: "https://ch10.co.il/news/1100694/"
        title: "הרשימות נסגרו: מי יהיו 120 הח\"כים? אלו המתמודדים בבחירות לכנסת ה-26"
        publisher: "חרדים10"
      - url: "https://www.mako.co.il/news-israel-elections/2026/liveblog-5bc9483b18b70a1026.htm"
        title: "כל העדכונים מסגירת הרשימות לכנסת ה-26"
        publisher: "N12"
      - url: "https://www.i24news.tv/he/news/israel-elections-2026/artc-8c8f593a"
        title: "הלו\"ז המלא לבחירות 2026"
        publisher: "i24NEWS"
  - key: cec-chair
    label: { he: "יו\"ר ועדת הבחירות", en: "Elections Committee chair", ar: "رئيس لجنة الانتخابات", ru: "Председатель избирательной комиссии", es: "Presidente de la Comisión Electoral", fr: "Président de la Commission électorale" }
    value: { he: "השופט נעם סולברג", en: "Justice Noam Sohlberg", ar: "القاضي نوعم سولبرغ", ru: "судья Ноам Сольберг", es: "El juez Noam Sohlberg", fr: "Le juge Noam Sohlberg" }
    detail:
      he: "שופט בית המשפט העליון נעם סולברג עומד בראש ועדת הבחירות המרכזית לכנסת ה-26."
      en: "Supreme Court Justice Noam Sohlberg chairs the Central Elections Committee for the 26th Knesset."
      ar: "قاضي المحكمة العليا نوعم سولبرغ يرأس لجنة الانتخابات المركزية للكنيست الـ26."
      ru: "Судья Верховного суда Ноам Сольберг возглавляет Центральную избирательную комиссию по выборам в Кнессет 26-го созыва."
      es: "El juez del Tribunal Supremo Noam Sohlberg preside la Comisión Electoral Central para la 26.ª Knéset."
      fr: "Le juge de la Cour suprême Noam Sohlberg préside la Commission électorale centrale pour la 26e Knesset."
    status: reported
    sources:
      - url: "https://www.timesofisrael.com/judge-sets-date-for-next-scheduled-elections-for-october-2026/"
        title: "October 27, 2026: Judge sets date for next scheduled elections"
        publisher: "The Times of Israel"
      - url: "https://www.gov.il/he/departments/central-elections-committee/govil-landing-page"
        title: "ועדת הבחירות המרכזית לכנסת"
        publisher: "gov.il"
  - key: results-timeline
    label: { he: "תוצאות וכינוס הכנסת", en: "Results & convening", ar: "النتائج والانعقاد", ru: "Результаты и первое заседание Кнессета", es: "Resultados y constitución", fr: "Résultats et installation" }
    detail:
      he: "לפי דיווחים, התוצאות הרשמיות צפויות עד 4 בנובמבר 2026 (שמונה ימים אחרי הבחירות), ערעורים עד 18 בנובמבר, וישיבתה הראשונה של הכנסת ה-26 צפויה ב-10 בנובמבר 2026."
      en: "Per reports, official results are expected by November 4, 2026 (eight days after the election), appeals by November 18, and the 26th Knesset's first sitting is expected on November 10, 2026."
      ar: "وفق التقارير، يُتوقّع صدور النتائج الرسمية حتى 4 تشرين الثاني/نوفمبر 2026 (بعد ثمانية أيام من الانتخابات)، والطعون حتى 18 تشرين الثاني/نوفمبر، وانعقاد الجلسة الأولى للكنيست الـ26 في 10 تشرين الثاني/نوفمبر 2026."
      ru: "По сообщениям СМИ, официальные результаты ожидаются до 4 ноября 2026 года (через восемь дней после выборов), обжалование — до 18 ноября, а первое заседание Кнессета 26-го созыва — 10 ноября 2026 года."
      es: "Según informaciones, los resultados oficiales se esperan para el 4 de noviembre de 2026 (ocho días después de las elecciones), los recursos hasta el 18 de noviembre, y la primera sesión de la 26.ª Knéset está prevista para el 10 de noviembre de 2026."
      fr: "Selon la presse, les résultats officiels sont attendus le 4 novembre 2026 (huit jours après les élections), les recours jusqu’au 18 novembre, et la première séance de la 26e Knesset est prévue le 10 novembre 2026."
    status: reported
    sources:
      - url: "https://www.i24news.tv/he/news/israel-elections-2026/artc-8c8f593a"
        title: "הלו\"ז המלא לבחירות 2026"
        publisher: "i24NEWS"
      - url: "https://www.zman.co.il/live/705042/"
        title: "לוח הזמנים לבחירות לכנסת"
        publisher: "Zman Yisrael"

