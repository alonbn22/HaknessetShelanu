    date: 2026-08-17
    title:
      he: מקום חמישי בפריימריז הליכוד; שמיני ברשימה לכנסת ה-26
      en: Fifth in the Likud primary; eighth on the list for the 26th Knesset
    description:
      he: בפריימריז הליכוד שנערכו ב-17 באוגוסט 2026 דורג כץ במקום החמישי (אחרי אלי כהן,
        אמיר אוחנה, יריב לוין ומירי רגב). ברשימת הליכוד שהוגשה לוועדת הבחירות
        ב-8 בספטמבר 2026, לאחר שילוב המשוריינים, הוא מוצב במקום השמיני.
      en: In the Likud primary held on 17 August 2026 Katz was ranked fifth (after Eli
        Cohen, Amir Ohana, Yariv Levin and Miri Regev). On the Likud list
        submitted to the Central Elections Committee on 8 September 2026, after
        the reserved slots were added, he is placed eighth.
