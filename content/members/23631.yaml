  - kind: positive
    category: achievement
    title:
      he: קיבלה התנצלות מראש ממשלת בריטניה בעקבות אי-הנגישות בוועידת האקלים COP26
      en: Received an apology from the UK Prime Minister over inaccessibility at the
        COP26 climate summit
    description:
      he: בנובמבר 2021, בעת כהונתה כשרת האנרגיה, נמנע מאלהרר להיכנס לוועידת האקלים
        COP26 בגלזגו משום שהאתר לא היה נגיש לכיסא גלגלים. ראש ממשלת בריטניה דאז
        בוריס ג'ונסון התנצל בפניה אישית, אלהרר קיבלה את ההתנצלות, והשתתפה
        בוועידה למחרת לצד ראש הממשלה נפתלי בנט. האירוע עורר דיון בינלאומי בנושא
        נגישות.
      en: In November 2021, while serving as energy minister, Elharrar was unable to
        enter the COP26 climate summit in Glasgow because the venue was not
        wheelchair-accessible. Then-UK Prime Minister Boris Johnson personally
        apologized to her, Elharrar accepted the apology, and she attended the
        summit the following day alongside Prime Minister Naftali Bennett. The
        episode sparked an international discussion about accessibility.
    date: 2021-11-02
