  - id: settlements-sovereignty
    topic: security
    lean: right
    text:
      he: "יש להרחיב את ההתיישבות ביהודה ושומרון (הגדה המערבית) ולהחיל שם ריבונות ישראלית."
      en: "Settlement in Judea and Samaria (the West Bank) should be expanded and Israeli sovereignty applied there."
      ar: "يجب توسيع الاستيطان في يهودا والسامرة (الضفة الغربية) وفرض السيادة الإسرائيلية هناك."
      ru: "Следует расширять поселения в Иудее и Самарии (на Западном берегу) и распространить там израильский суверенитет."
      es: "Los asentamientos en Judea y Samaria (Cisjordania) deberían ampliarse y aplicarse allí la soberanía israelí."
      fr: "Les implantations en Judée-Samarie (Cisjordanie) devraient être étendues et la souveraineté israélienne y être appliquée."
    short:
      he: "התיישבות וריבונות"
      en: "Settlement and sovereignty"
      ar: "الاستيطان والسيادة"
      ru: "Поселения и суверенитет"
      es: "Asentamientos y soberanía"
      fr: "Implantations et souveraineté"
    explainer:
      he: "יהודה ושומרון (הגדה המערבית) בשליטה ישראלית מ-1967, בלי שהחוק הישראלי הוחל שם. התומכים רואים בהן את לב ארץ ישראל ורוצים לבנות שם ולהחיל ריבונות; המתנגדים אומרים שהרחבת ההתיישבות סוגרת את הדלת להסדר עתידי ופוגעת במעמדה של ישראל בעולם. יש מי שתומך בבנייה אך לא בהחלת ריבונות — במקרה כזה בחרו \"מסכים/ה\" ולא \"מסכים/ה מאוד\"."
      en: "Judea and Samaria (the West Bank) have been under Israeli control since 1967 without Israel applying its law to the territory. Supporters see the heart of the Land of Israel and want to build and apply sovereignty; opponents say expanding settlement closes the door to a future agreement and harms Israel's standing in the world. Some support building but not sovereignty — if that is you, choose \"agree\" rather than \"strongly agree\"."
      ar: "يهودا والسامرة (الضفة الغربية) تحت سيطرة إسرائيلية منذ 1967 من دون تطبيق القانون الإسرائيلي هناك. يرى المؤيدون فيها قلب أرض إسرائيل ويريدون البناء فيها وفرض السيادة؛ ويقول المعارضون إن توسيع الاستيطان يغلق الباب أمام تسوية مستقبلية ويضرّ بمكانة إسرائيل في العالم. بعضهم يؤيد البناء لا السيادة — إن كنتم كذلك فاختاروا «أوافق» لا «أوافق بشدة»."
      ru: "Иудея и Самария (Западный берег) находятся под израильским контролем с 1967 года, но Израиль не распространил на них своё право. Сторонники видят в них сердце Земли Израиля и хотят строить и распространить суверенитет; противники говорят, что расширение поселений закрывает дверь будущему соглашению и вредит положению Израиля в мире. Некоторые поддерживают строительство, но не суверенитет — в таком случае выберите «согласен», а не «полностью согласен»."
      es: "Judea y Samaria (Cisjordania) están bajo control israelí desde 1967 sin que se aplique allí la ley israelí. Los partidarios ven en ellas el corazón de la Tierra de Israel y quieren construir y aplicar la soberanía; los opositores dicen que ampliar los asentamientos cierra la puerta a un acuerdo futuro y daña la posición de Israel en el mundo. Algunos apoyan construir pero no la soberanía — en ese caso elija «de acuerdo» y no «muy de acuerdo»."
      fr: "La Judée-Samarie (la Cisjordanie) est sous contrôle israélien depuis 1967 sans qu’Israël y ait étendu son droit. Les partisans y voient le cœur de la Terre d’Israël et veulent y construire et y appliquer la souveraineté ; les opposants disent que l’extension des implantations ferme la porte à un accord futur et nuit à la position d’Israël dans le monde. Certains soutiennent la construction mais pas la souveraineté — dans ce cas, choisissez « d’accord » plutôt que « tout à fait d’accord »."
    explainerSources:
      - { url: "https://en.idi.org.il/articles/39012", title: "The Judea and Samaria Regulations Law: An Explainer", publisher: "המכון הישראלי לדמוקרטיה" }
