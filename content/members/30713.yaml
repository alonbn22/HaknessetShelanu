        title: "History made as Arab Israeli Ra'am party joins Bennett-Lapid coalition"
        publisher: "The Times of Israel"
      - url: "https://en.wikipedia.org/wiki/Mansour_Abbas"
        title: "Mansour Abbas"
        publisher: "Wikipedia"
  - kind: positive
