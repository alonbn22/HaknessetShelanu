    title:
      he: "כיהן כסגן יושב ראש הכנסת"
      en: "Served as Deputy Speaker of the Knesset"
    description:
      he: "טיבי מונה לסגן יושב ראש הכנסת במאי 2006, לאחר שוועדת הכנסת הרחיבה את מספר הסגנים לשמונה כדי לאפשר ייצוג לסיעות הערביות, וכיהן בתפקיד בכנסות שונות עד 2022 – אחד התפקידים הבולטים שמילא חבר כנסת ערבי בבית המחוקקים."
      en: "Tibi was appointed a Deputy Speaker of the Knesset in May 2006, after the House Committee expanded the number of deputies to eight to allow representation for the Arab factions, and held the post across several Knessets until 2022 — one of the prominent parliamentary offices held by an Arab member of the legislature."
    date: "2006-05-17"
