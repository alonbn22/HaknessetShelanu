    title:
      he: "הורשע בעבר בהסתה לגזענות ובתמיכה בארגון טרור"
      en: "Convicted of incitement to racism and supporting a terrorist organization"
    date: "2007-06-25"
    description:
      he: "ביוני 2007 הורשע בן גביר בהסתה לגזענות, לאחר שנשא שלטים ובהם הכיתובים \"לגרש את האויב הערבי\" ו\"הרב כהנא צדק\"; לפי הדיווחים הורשע גם בתמיכה בתנועת כ\"ך שהוכרזה בישראל כארגון טרור. לפי הדיווחים הוגשו נגדו לאורך השנים עשרות כתבי אישום, שרובם הסתיימו בזיכוי או בדחייה."
      en: "In June 2007 Ben-Gvir was convicted of incitement to racism after carrying signs reading \"Expel the Arab enemy\" and \"Rabbi Kahane was right\"; he is also reported to have been convicted of supporting the Kach movement, which Israel has designated a terrorist organization. He is reported to have faced dozens of indictments over the years, most of which ended in acquittal or dismissal."
