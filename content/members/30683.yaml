  - kind: positive
    category: achievement
    title:
      he: "חוקים שהתקבלו ביוזמתו: הכרה בשפת הסימנים, זכות נפגעי עבירה בוועדת שחרורים ויום הוקרה לפצועים"
      en: "Laws passed on his initiative: Sign Language recognition, crime victims' say at parole hearings, and a Recognition Day for the wounded"
    description:
      he: "כחבר כנסת מן האופוזיציה נמנה טרופר עם יוזמי כמה חוקים שהתקבלו בקריאה שלישית בכנסת ה-25: חוק הבעת עמדה של נפגע עבירה בנוגע לשחרור על-תנאי (2025), שבו היה היוזם הראשון והמרחיב את זכותם של נפגעי עבירות מין ואלימות להביע עמדה בפני ועדת השחרורים; חוק יום הוקרה ממלכתי לפצועי מערכות ישראל ונפגעי פעולות איבה (2026); וחוק הכרה בשפת הסימנים הישראלית (2026), המסמיך את האקדמיה ללשון העברית לשמר ולפתח את שפת הסימנים."
      en: "As an opposition MK, Tropper was among the initiators of several laws passed in their third reading in the 25th Knesset: the Crime Victim's Position on Parole Law (2025), of which he was the lead sponsor, expanding the right of victims of sexual and violent offenses to address the parole board; the State Recognition Day for Israel's Wounded Veterans and Victims of Hostile Acts Law (2026); and the Recognition of Israeli Sign Language Law (2026), which charges the Academy of the Hebrew Language with preserving and developing Israeli Sign Language."
    date: "2026-06-09"
