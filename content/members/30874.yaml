    title:
      he: ניפץ אנדרטה לפלסטינים שנהרגו בכפר מאדמא במהלך סיור באבטחת צה"ל; לשכת ראש הממשלה וצה"ל גינו
      en: Smashed a memorial to Palestinians killed, in the village of Madama, during an IDF-escorted tour; the Prime Minister's Office and the IDF condemned the act
    description:
      he: ב-25 באוגוסט 2026 ניפצו סוכות וכמה מעוזריו אנדרטה בכפר מאדמא שליד שכם,
        שהנציחה פלסטינים שנהרגו, ובהם מעורבים בפיגועים, במהלך סיור מתואם באבטחת
        צה"ל. צה"ל מסר כי המשתתפים פעלו בהטעיה ובמניפולציה ובניגוד למתווה הסיור
        המאושר, ולשכת ראש הממשלה הודיעה כי לקיחת החוק לידיים, בפרט בידי נבחרי
        ציבור, אינה מקובלת; שר החוץ סער אמר כי סוכות אינו הריבון בשטחים. סוכות
        השיב כי פעל לאחר פניות חוזרות להסרת אנדרטאות טרור שלא נענו, וכי לא ייתן
        יד להנצחת מי שפגעו ביהודים ובחיילי צה"ל כגיבורים.
      en: On 25 August 2026 Sukkot and several aides smashed a memorial in the village
        of Madama near Nablus commemorating Palestinians who were killed,
        including people involved in attacks, during a coordinated IDF-escorted
        tour. The IDF said the participants acted "deceptively and
        manipulatively" and in violation of the approved tour outline, and the
        Prime Minister's Office said that "taking the law into one's own hands,
        particularly by public officials, is unacceptable"; Foreign Minister
        Sa'ar said Sukkot "is not the sovereign in the territories". Sukkot
        replied that he acted after repeated requests to remove "terror
        monuments" went unanswered and that "we will not lend a hand to a
        situation in which those who harmed Jews and IDF soldiers are
        commemorated as heroes".
