claims:
  - kind: positive
    category: achievement
    date: "2021-04-06"
    title:
      he: "מייסד ומנהיג מפלגת נועם וחבר הכנסת מטעמה"
      en: "Founder and leader of the Noam party and its member of Knesset"
    description:
      he: "מעוז הוא ממייסדי מפלגת נועם, מפלגה ציונית-דתית שמרנית שהוקמה ב-2019, ועומד בראשה. הוא נכנס לכנסת לראשונה באפריל 2021 (הכנסת ה-24) מהמקום השישי ברשימת הציונות הדתית, ונבחר שוב ב-2022 מהמקום ה-11 ברשימה המשותפת. מאז נובמבר 2022 מכהן כנציגהּ היחיד של נועם וכיושב ראש הסיעה."
      en: "Maoz co-founded Noam, a conservative religious-Zionist party established in 2019, and leads it. He first entered the Knesset in April 2021 (24th Knesset) from sixth place on the Religious Zionist list, and was re-elected in 2022 from 11th place on the joint list. Since November 2022 he has been Noam's sole representative and faction chair."
    sources:
