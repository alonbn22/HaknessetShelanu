      en: A religious-nationalist party led by Itamar Ben Gvir, emphasizing personal security, tough enforcement and sovereignty.
      ar: حزب ديني-قومي بقيادة إيتمار بن غفير، يركّز على الأمن الشخصي والإنفاذ الصارم والسيادة.
      ru: Религиозно-националистическая партия во главе с Итамаром Бен-Гвиром с упором на личную безопасность, жёсткое правоприменение и суверенитет.
      es: "Un partido religioso-nacionalista encabezado por Itamar Ben Gvir, que pone el acento en la seguridad personal, la aplicación estricta de la ley y la soberanía."
      fr: "Un parti religieux-nationaliste dirigé par Itamar Ben Gvir, mettant l’accent sur la sécurité personnelle, une application stricte de la loi et la souveraineté."
