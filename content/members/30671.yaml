    title:
      he: שובץ במקום השמיני ברשימת יהדות התורה לכנסת ה-26
      en: Placed eighth on the United Torah Judaism list for the 26th Knesset
    description:
      he: ברשימת "יהדות התורה והשבת אגודת ישראל" (האות ג) שהוגשה לוועדת הבחירות ב-8 בספטמבר 2026 לקראת הבחירות ב-27 באוקטובר 2026, שובץ טסלר במקום השמיני, כנציג אגודת ישראל; בראש הרשימה עומד יעקב אשר.
      en: On the "United Torah Judaism and Shabbat - Agudat Yisrael" list (ballot letter Gimel) submitted to the Central Elections Committee on 8 September 2026 ahead of the 27 October 2026 election, Tessler was placed eighth, representing Agudat Yisrael; the list is headed by Yaakov Asher.
