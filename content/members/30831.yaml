    title:
      he: נבחר ליושב ראש הוועדה המיוחדת לזכויות הילד בכנסת ה-25
      en: Elected chair of the Knesset Special Committee on the Rights of the Child
      ar: انتُخب رئيسًا للجنة الخاصة لحقوق الطفل في الكنيست الخامس والعشرين
      ru: Избран председателем специальной комиссии Кнессета по правам ребёнка
    description:
      he: ב-31 בינואר 2023 נבחר ח"כ אלי דלל פה אחד ליושב ראש הוועדה המיוחדת לזכויות הילד של הכנסת ה-25, כמתועד בפרוטוקול הוועדה. לצד תפקיד זה היה חבר בוועדת הכספים ובוועדה לקידום מעמד האישה ולשוויון מגדרי. נכון ל-2026 הוא מתואר כיו"ר הוועדה לשעבר, לאחר שכיהן בתפקיד למעלה משנתיים.
      en: On 31 January 2023, MK Eli Dallal was elected unanimously as chair of the 25th Knesset's Special Committee on the Rights of the Child, as recorded in the committee's protocol. Alongside that post he sat on the Finance Committee and the Committee on the Status of Women and Gender Equality. As of 2026 he is described as the committee's former chair, having held the post for more than two years.
