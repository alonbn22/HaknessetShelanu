claims:
  - kind: positive
    category: achievement
    title:
      he: נבחר למנהיג חד"ש ועמד בראש הרשימה המשותפת
      en: Elected leader of Hadash and head of the Joint List
    description:
      he: "בשנת 2015, לאחר פרישתו של מוחמד ברכה, נבחר איימן עודה לעמוד בראש רשימת חד״ש ובראש הרשימה המשותפת של המפלגות הערביות, ונכנס לכנסת ה-20. קודם לכן כיהן כחבר מועצת העיר חיפה בשנים 1998–2003 וכמזכ״ל חד״ש מ-2006."
      en: "In 2015, following Mohammed Barakeh's resignation, Ayman Odeh was placed at the head of Hadash and of the Joint List, an alliance of Arab parties, entering the 20th Knesset. He had previously served on Haifa City Council (1998–2003) and became Hadash secretary-general in 2006."
      ar: "في عام 2015، بعد تنحّي محمد بركة، اختير أيمن عودة لرئاسة قائمة الجبهة (حداش) ورئاسة القائمة المشتركة للأحزاب العربية، ودخل الكنيست الـ20. وقبل ذلك كان عضوًا في مجلس بلدية حيفا بين عامَي 1998 و2003، وأصبح سكرتيرًا عامًا للجبهة عام 2006."
      ru: "В 2015 году, после ухода Мухаммада Бараке, Айман Уде был поставлен во главе партии Хадаш и Объединённого списка арабских партий и вошёл в Кнессет 20-го созыва. Ранее он был членом городского совета Хайфы (1998–2003), а в 2006 году стал генеральным секретарём Хадаш."
      es: "En 2015, tras la retirada de Mohammed Barakeh, Ayman Odeh fue elegido para encabezar Hadash y la Lista Conjunta de los partidos árabes, y entró en la 20.ª Knéset. Antes había sido concejal de Haifa (1998–2003) y en 2006 pasó a ser secretario general de Hadash."
      fr: "En 2015, après le retrait de Mohammed Barakeh, Ayman Odeh a été placé à la tête du Hadash et de la Liste commune des partis arabes, et est entré à la 20e Knesset. Il avait auparavant été conseiller municipal de Haïfa (1998-2003) et était devenu secrétaire général du Hadash en 2006."
    date: 2015-03-17
