    title:
      he: "ועדת הכנסת קראה לשיקלי להתנצל בעקבות הזמנת טומי רובינסון"
      en: "Knesset committee called on Chikli to apologize over Tommy Robinson invitation"
    description:
      he: "באוקטובר 2025 הזמין שיקלי את הפעיל הימני-קיצוני הבריטי טומי רובינסון לביקור רשמי בישראל, מבלי להיוועץ בקהילה היהודית בבריטניה; ארגוני הגג של יהדות בריטניה גינו את ההזמנה. ב-21 באוקטובר 2025 קראה ועדת הכנסת לקשרים עם יהדות התפוצות לשיקלי להתנצל בפני מנהיגי הקהילה. שיקלי הגן על ההזמנה ותיאר את רובינסון כמנהיג אמיץ במאבק באסלאם הרדיקלי."
      en: "In October 2025 Chikli invited British far-right activist Tommy Robinson on an official visit to Israel without consulting the UK Jewish community; British Jewry's umbrella bodies condemned the invitation. On 21 October 2025 the Knesset committee for relations with Diaspora Jewry called on Chikli to apologize to community leaders. Chikli defended the invitation and described Robinson as a courageous leader in the fight against radical Islam."
