    title:
      he: התפטרה מתפקיד סגנית שר החוץ במכתב חריף לגדעון סער
      en: Resigned as Deputy Foreign Minister in a sharply worded letter to Gideon Sa'ar
    description:
      he: 'ב-15 ביולי 2026 התפטרה השכל מתפקיד סגנית שר החוץ במכתב ליו"ר סיעתה גדעון סער, שבו כתבה: "שיקרת לי, שיקרת לעם ישראל, אני מתפטרת מתפקידי כסגנית שלך". במקביל ביקשה מוועדת הכנסת להכיר בה כסיעת יחיד לקראת הבחירות. מסיעת הימין הממלכתי נמסר בתגובה כי מדובר ב"התקף זעם" על רקע סחיטה כושלת בענייני מימון מפלגות.'
      en: 'On 15 July 2026 Haskel resigned as Deputy Foreign Minister in a letter to her faction chairman Gideon Sa''ar, writing: "You lied to me, you lied to the people of Israel, I am resigning from my position as your deputy". She also asked the Knesset House Committee to recognize her as a single-member faction ahead of the election. The National Right faction responded that this was a "tantrum" stemming from a failed attempt at extortion over party funding.'
