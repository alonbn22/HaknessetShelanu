    title:
      he: "חבר הכנסת ה-25 מטעם הליכוד"
      en: "Member of the 25th Knesset for Likud"
    description:
      he: "בועז ביסמוט, יליד רחובות (1964), נבחר לכנסת ה-25 בבחירות נובמבר 2022 מטעם הליכוד, לאחר שזכה במקום ה-19 בפריימריז המפלגה ושובץ במקום ה-27 ברשימה. בכנסת עמד בראש הוועדה המיוחדת למאבק בשימוש בסמים ובאלכוהול (עד ינואר 2025) ובראש הוועדה לביטחון לאומי (4 בפברואר – 5 במאי 2025)."
      en: "Boaz Bismuth, born in Rehovot (1964), was elected to the 25th Knesset in the November 2022 election for Likud, having won 19th place in the party primary and been placed 27th on the list. In the Knesset he chaired the Special Committee on Drug and Alcohol Abuse (until January 2025) and the National Security Committee (4 February – 5 May 2025)."
    date: "2022-11-15"
