  - kind: positive
    category: achievement
    title:
      he: חבר הכנסת מטעם יהדות התורה
      en: Member of Knesset for United Torah Judaism
    description:
      he: פינדרוס נבחר לראשונה לכנסת בבחירות אפריל 2019, כשהוצב במקום השמיני ברשימת
        יהדות התורה, וכיהן בכנסת במספר תקופות בשנים שלאחר מכן. לכנסת ה-25 נכנס
        ב-6 בינואר 2023 במסגרת "החוק הנורווגי", ומונה ליו"ר הוועדה המיוחדת לפניות
        הציבור. ב-17 ביולי 2025 עזב את הכנסת עם התפטרות שרי יהדות התורה מהממשלה
        ושובם לכנסת, וב-21 בינואר 2026 שב לכנסת לאחר התפטרותו של ח"כ ישראל
        אייכלר במסגרת החוק הנורווגי.
      en: Pindrus was first elected to the Knesset in the April 2019 election, placed
        eighth on the United Torah Judaism list, and served across several terms
        in the years that followed. He entered the 25th Knesset on 6 January
        2023 under the "Norwegian Law" and was appointed chair of the Special
        Committee for Public Petitions. On 17 July 2025 he left the Knesset when
        UTJ's ministers resigned from the government and returned to their
        seats, and on 21 January 2026 he re-entered the Knesset following MK
        Israel Eichler's resignation under the Norwegian Law.
    date: 2026-01-21
