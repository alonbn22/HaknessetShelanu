  - kind: neutral
    category: news
    date: 2025-07-14
    title:
      he: יזם את הליך ההדחה של ח"כ איימן עודה מהכנסת; ההצעה נכשלה במליאה
      en: Initiated the proceedings to expel MK Ayman Odeh from the Knesset; the motion failed in the plenum
    description:
      he: 'בוארון אסף את 70 החתימות הנדרשות לפתיחת הליך הדחה נגד ח"כ איימן עודה בעקבות ציוץ של עודה על עסקת החטופים (ינואר 2025) והתבטאויות נוספות, בטענה שדבריו מהווים "לגיטימציה וקריאה לאלימות"; עודה השיב כי הציוץ "דיבר על זכותם של שני העמים לחיות בחופש, בכבוד ובשוויון". ב-14 ביולי 2025 תמכו 73 חברי כנסת בהדחה ו-15 התנגדו — פחות מ-90 הקולות הנדרשים, ועודה נותר חבר כנסת.'
      en: 'Boaron collected the 70 signatures required to open expulsion proceedings against MK Ayman Odeh following Odeh''s tweet about the hostage deal (January 2025) and further statements, arguing they amounted to "legitimization and a call for violence"; Odeh replied that the tweet "spoke about the right of both peoples to live in freedom, dignity and equality." On 14 July 2025, 73 MKs supported expulsion and 15 opposed — short of the 90 votes required — and Odeh remained a Knesset member.'
    sources:
      - url: https://www.jpost.com/israel-news/politics-and-diplomacy/article-858799
        title: Likud's Avichay Boaron holds impeachment hearing for Ayman Odeh
        publisher: The Jerusalem Post
