    title:
      he: 'החלטת הממשלה לסגור את גלי צה"ל, שיזם, נפסלה בבג"ץ'
      en: The government decision to close Army Radio, which he initiated, was struck down by the High Court of Justice
    description:
      he: 'כץ הורה בנובמבר 2025 על סגירת תחנת הרדיו הצבאית גלי צה"ל עד מרץ 2026, והממשלה אישרה את המהלך בדצמבר 2025. ב-20 באוגוסט 2026 פסל בג"ץ פה אחד את ההחלטה וקבע כי היא התקבלה משיקולים זרים ופסולים - אי-שביעות רצון של מקבלי ההחלטות משידורי התחנה - אף שלממשלה יש סמכות עקרונית לסגור את התחנה. כץ הודיע כי הוא דוחה את פסק הדין וכי "כשננצח בבחירות" יושלם הטיפול בנושא.'
      en: 'In November 2025 Katz ordered the closure of the IDF radio station Army Radio (Galei Tzahal) by March 2026, and the government approved the move in December 2025. On 20 August 2026 the High Court of Justice unanimously annulled the decision, ruling that it was based on extraneous and improper considerations - the decision-makers'' displeasure with the station''s broadcasts - although the government has the authority in principle to close the station. Katz said he rejected the ruling and that the matter would be completed "when we win the elections".'
    sources:
