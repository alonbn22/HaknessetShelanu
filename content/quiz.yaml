          es: "la votación de la declaración de la Knéset que «se opone firmemente al establecimiento de un Estado palestino al oeste del Jordán» (aprobada 68–9); un voto a favor de la declaración = desacuerdo con la afirmación: 5 a favor, 0 en contra, 3 ausentes"
          fr: "le vote sur la déclaration de la Knesset qui « s’oppose fermement à l’établissement d’un État palestinien à l’ouest du Jourdain » (adoptée 68–9) ; un vote pour la déclaration = désaccord avec l’affirmation : 5 pour, 0 contre, 3 absents"
      raam:
        value: 2
        basis: statement
        source: { url: "https://www.timesofisrael.com/raams-abbas-says-palestinian-state-a-reality-drawing-outrage-from-zionist-parties/", title: "Ra'am's Abbas says Palestinian state 'a reality,' drawing outrage from Zionist parties (22 Aug 2026)", publisher: "The Times of Israel" }
        quote:
          he: "עבאס בוועידת רע\"ם (22.8.2026): מדינה פלסטינית עצמאית היא \"מציאות שרוב העולם מכיר בה\"; \"אנחנו רוצים שיכירו בה, ונפעל להשגת שלום, התקרבות וסיום הכיבוש והסכסוך\"."
          en: "Abbas at Ra'am's convention (22 Aug 2026): an independent Palestinian state is \"a reality, which most of the world recognizes\"; \"We want them to recognize it, and we'll work to achieve peace, rapprochement and an end to the occupation and conflict.\""
          ar: "عباس في مؤتمر القائمة الموحدة (22 آب/أغسطس 2026): الدولة الفلسطينية المستقلة «واقع يعترف به معظم العالم»؛ «نريدهم أن يعترفوا بها، وسنعمل من أجل السلام والتقارب وإنهاء الاحتلال والصراع»."
          ru: "Аббас на съезде РААМ (22.08.2026): независимое палестинское государство — «реальность, которую признаёт большая часть мира»; «Мы хотим, чтобы его признали, и будем добиваться мира, сближения и прекращения оккупации и конфликта»."
          es: "Abbas en la convención de Ra’am (22 de agosto de 2026): un Estado palestino independiente es «una realidad, que la mayor parte del mundo reconoce»; «Queremos que lo reconozcan, y trabajaremos por la paz, el acercamiento y el fin de la ocupación y del conflicto»."
          fr: "Abbas au congrès de Ra’am (22 août 2026) : un État palestinien indépendant est « une réalité, que la majeure partie du monde reconnaît » ; « Nous voulons qu’ils le reconnaissent, et nous œuvrerons pour la paix, le rapprochement et la fin de l’occupation et du conflit »."
      joint-list:
        value: 2
        basis: statement
        source: { url: "https://www.jpost.com/israel-election-2026/article-907154", title: "What do Yousef Jabareen's Joint Arab List and Mansour Abbas' Ra'am stand for? (Sep 2026)", publisher: "The Jerusalem Post" }
        quote:
          he: "ג'בארין: הרשימה המשותפת תפעל לחידוש המשא ומתן עם ההנהגה הפלסטינית כדי לקדם הקמת מדינה פלסטינית לצד ישראל."
          en: "\"Jabareen has stated that the Joint List would push for renewed negotiations with Palestinian leadership to advance the establishment of a Palestinian state alongside Israel.\""
          ar: "«صرّح جبارين بأن القائمة المشتركة ستدفع نحو استئناف المفاوضات مع القيادة الفلسطينية من أجل إقامة دولة فلسطينية إلى جانب إسرائيل.»"
          ru: "«Джабарин заявил, что Объединённый список будет добиваться возобновления переговоров с палестинским руководством ради создания палестинского государства рядом с Израилем»."
          es: "«Jabareen ha declarado que la Lista Conjunta impulsaría la reanudación de las negociaciones con los dirigentes palestinos para avanzar hacia el establecimiento de un Estado palestino junto a Israel.»"
          fr: "« Jabareen a déclaré que la Liste commune pousserait à la reprise des négociations avec les dirigeants palestiniens pour faire avancer l’établissement d’un État palestinien aux côtés d’Israël. »"
      together:
        value: -2
        basis: statement
        recordOf:
          he: "דברי בנט, ראש הרשימה; מצע הרשימה המשותפת אינו עוסק בכך, ועמדת יש עתיד לאורך השנים הייתה שונה"
          en: "Bennett's words as list head; the joint list's platform does not address it, and Yesh Atid's own position over the years has differed"
          ar: "كلام بينيت بصفته رئيس القائمة؛ برنامج قائمة «معًا» لا يتناول ذلك، وموقف يش عتيد نفسه على مرّ السنين كان مختلفًا"
          ru: "слова Беннета как главы списка; в программе совместного списка этого нет, а позиция самой партии «Еш Атид» на протяжении лет была иной"
          es: "palabras de Bennett como cabeza de lista; el programa de la lista conjunta no lo aborda, y la postura de Yesh Atid a lo largo de los años ha sido distinta"
          fr: "propos de Bennett en tant que tête de liste ; le programme de la liste commune ne l’aborde pas, et la position de Yesh Atid elle-même a été différente au fil des ans"
        source: { url: "https://www.ynet.co.il/news/120andone/article/s100tqclqmg", title: "בנט: \"אני עם לפיד עד הסוף, לא אשב עם נתניהו\" (3.7.2026)", publisher: "ynet" }
        quote:
          he: "בנט: \"אני נגד מדינה פלסטינית נקודה. זה קו אדום.\""
          en: "Bennett: \"I am against a Palestinian state, period. It is a red line.\""
          ar: "بينيت: «أنا ضد دولة فلسطينية، نقطة. هذا خط أحمر.»"
          ru: "Беннет: «Я против палестинского государства, точка. Это красная линия»."
          es: "Bennett: «Estoy en contra de un Estado palestino, punto. Es una línea roja.»"
          fr: "Bennett : « Je suis contre un État palestinien, point. C’est une ligne rouge. »"
      yashar:
        value: -2
        basis: statement
        source: { url: "https://www.timesofisrael.com/raams-abbas-says-palestinian-state-a-reality-drawing-outrage-from-zionist-parties/", title: "Ra'am's Abbas says Palestinian state 'a reality,' drawing outrage from Zionist parties (22 Aug 2026)", publisher: "The Times of Israel" }
        quote:
          he: "תגובת ישר! להצהרת עבאס: \"אין מדינה פלסטינית, ובממשלה שנקים לא תקום מדינה פלסטינית.\""
          en: "Yashar's response to Abbas: \"there is no Palestinian state, and in the government we form, a Palestinian state will not be established.\""
          ar: "ردّ ياشار! على عباس: «لا توجد دولة فلسطينية، وفي الحكومة التي سنشكّلها لن تقوم دولة فلسطينية.»"
          ru: "Ответ «Яшар!» Аббасу: «Палестинского государства нет, и при правительстве, которое мы сформируем, палестинское государство создано не будет»."
          es: "Respuesta de ¡Yashar! a Abbas: «no hay Estado palestino, y en el Gobierno que formemos no se establecerá un Estado palestino»."
