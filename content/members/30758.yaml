      he: השעיה על ידי ועדת האתיקה של הכנסת בעקבות התבטאות על מתקפת 7 באוקטובר
      en: Suspended by the Knesset Ethics Committee over remarks on the October 7
        attack
    description:
      he: בנובמבר 2023 השעתה ועדת האתיקה של הכנסת את ח'טיב יאסין לחודש, מתוכו שבועיים
        ללא שכר, לאחר שאמרה כי לא נשחטו תינוקות ולא נאנסו נשים, לפחות לא בתיעוד
        שהוצג לחברי הכנסת, במתקפת חמאס ב-7 באוקטובר 2023. הוועדה קבעה כי בדבריה
        הכחישה את הזוועות. ח'טיב יאסין התנצלה בפני הוועדה ובמליאת הכנסת ואמרה כי
        לא התכוונה להמעיט בחומרת הטבח.
      en: In November 2023 the Knesset Ethics Committee suspended Khatib-Yassin for
        one month, including two weeks without pay, after she said that babies
        were not slaughtered and women were not raped, at least not in the
        footage shown to members, during the October 7, 2023 Hamas attack. The
        committee found that her comments denied the atrocities. Khatib-Yassin
        apologised to the committee and the Knesset plenum, saying she had not
        intended to belittle the massacre.
