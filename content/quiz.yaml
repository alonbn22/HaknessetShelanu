          ru: "слова Гилада Карива, № 3 в списке «Демократов»; в программе «Демократов» палестинское государство не упоминается, а глава списка Яир Голан в сентябре 2025 года сказал, что «сейчас… говорить о палестинском государстве — разрушительно»"
          es: "palabras de Gilad Kariv, n.º 3 de la lista de Los Demócratas; el programa de Los Demócratas no menciona un Estado palestino, y el cabeza de lista, Yair Golan, dijo en septiembre de 2025 que «en este momento… hablar de un Estado palestino es destructivo»"
          fr: "propos de Gilad Kariv, n° 3 sur la liste des Démocrates ; le programme des Démocrates ne mentionne pas d’État palestinien, et la tête de liste, Yaïr Golan, a déclaré en septembre 2025 qu’« en ce moment… parler d’un État palestinien est destructeur »"
        source: { url: "https://103fm.maariv.co.il/programs/media.aspx?ZrqvnVq=KGJLIJ&c41t4nzVQ=EF", title: "\"הארץ תתחלק ותהיה מדינה פלסטינית מפורזת\" — גלעד קריב בתוכנית חמש בערב (21.7.2026)", publisher: "103FM" }
        moreSources:
          - { url: "https://www.walla.co.il/news/israel/3782425", title: "יאיר גולן: \"לדבר בעת הזו על מדינה פלסטינית זה הרסני לישראל\" — ריאיון ל-103FM (21.9.2025)", publisher: "וואלה" }
        quote:
          he: "קריב: \"בסוף התהליך המדיני, וזה ייקח זמן, הארץ תתחלק בין שני העמים ותהיה לצידה של מדינת ישראל מדינה פלסטינית מפורזת בתוך הסדר אזורי\""
          en: "Kariv: \"At the end of the diplomatic process — and it will take time — the land will be divided between the two peoples, and alongside the State of Israel there will be a demilitarized Palestinian state within a regional arrangement\""
          ar: "كاريف: «في نهاية المسار السياسي، وسيستغرق ذلك وقتًا، ستُقسَّم البلاد بين الشعبين وستقوم إلى جانب دولة إسرائيل دولة فلسطينية منزوعة السلاح ضمن تسوية إقليمية»"
          ru: "Карив: «В конце дипломатического процесса — а это займёт время — страна будет разделена между двумя народами, и рядом с Государством Израиль будет демилитаризованное палестинское государство в рамках регионального урегулирования»"
          es: "Kariv: «Al final del proceso diplomático —y llevará tiempo— la tierra se dividirá entre los dos pueblos y junto al Estado de Israel habrá un Estado palestino desmilitarizado dentro de un acuerdo regional»"
          fr: "Kariv : « Au terme du processus diplomatique — et cela prendra du temps —, la terre sera partagée entre les deux peuples et, à côté de l’État d’Israël, il y aura un État palestinien démilitarisé dans le cadre d’un arrangement régional »"
  - id: settlements-sovereignty
    topic: security
    lean: right
    text:
      he: "יש להרחיב את ההתיישבות ביהודה ושומרון (הגדה המערבית) ולהחיל שם ריבונות ישראלית."
      en: "Settlement in Judea and Samaria (the West Bank) should be expanded and Israeli sovereignty applied there."
      ar: "يجب توسيع الاستيطان في يهودا والسامرة (الضفة الغربية) وفرض السيادة الإسرائيلية هناك."
      ru: "Следует расширять поселения в Иудее и Самарии (на Западном берегу) и распространить там израильский суверенитет."
      es: "Los asentamientos en Judea y Samaria (Cisjordania) deberían ampliarse y aplicarse allí la soberanía israelí."
      fr: "Les implantations en Judée-Samarie (Cisjordanie) devraient être étendues et la souveraineté israélienne y être appliquée."
    short:
      he: "התיישבות וריבונות"
      en: "Settlement and sovereignty"
      ar: "الاستيطان والسيادة"
      ru: "Поселения и суверенитет"
      es: "Asentamientos y soberanía"
      fr: "Implantations et souveraineté"
    explainer:
      he: "יהודה ושומרון (הגדה המערבית) בשליטה ישראלית מ-1967, בלי שהחוק הישראלי הוחל שם. התומכים רואים בהן את לב ארץ ישראל ורוצים לבנות שם ולהחיל ריבונות; המתנגדים אומרים שהרחבת ההתיישבות סוגרת את הדלת להסדר עתידי ופוגעת במעמדה של ישראל בעולם. יש מי שתומך בבנייה אך לא בהחלת ריבונות — במקרה כזה בחרו \"מסכים/ה\" ולא \"מסכים/ה מאוד\"."
      en: "Judea and Samaria (the West Bank) have been under Israeli control since 1967 without Israeli law applying there. Supporters see the heart of the Land of Israel and want to build and apply sovereignty; opponents say expanding settlement closes the door to a future agreement and harms Israel's standing in the world. Some support building but not sovereignty — if that is you, choose \"agree\" rather than \"strongly agree\"."
      ar: "يهودا والسامرة (الضفة الغربية) تحت سيطرة إسرائيلية منذ 1967 من دون تطبيق القانون الإسرائيلي هناك. يرى المؤيدون فيها قلب أرض إسرائيل ويريدون البناء فيها وفرض السيادة؛ ويقول المعارضون إن توسيع الاستيطان يغلق الباب أمام تسوية مستقبلية ويضرّ بمكانة إسرائيل في العالم. بعضهم يؤيد البناء لا السيادة — إن كنتم كذلك فاختاروا «أوافق» لا «أوافق بشدة»."
      ru: "Иудея и Самария (Западный берег) находятся под израильским контролем с 1967 года, но израильское право там не действует. Сторонники видят в них сердце Земли Израиля и хотят строить и распространить суверенитет; противники говорят, что расширение поселений закрывает дверь будущему соглашению и вредит положению Израиля в мире. Некоторые поддерживают строительство, но не суверенитет — в таком случае выберите «согласен», а не «полностью согласен»."
      es: "Judea y Samaria (Cisjordania) están bajo control israelí desde 1967 sin que se aplique allí la ley israelí. Los partidarios ven en ellas el corazón de la Tierra de Israel y quieren construir y aplicar la soberanía; los opositores dicen que ampliar los asentamientos cierra la puerta a un acuerdo futuro y daña la posición de Israel en el mundo. Algunos apoyan construir pero no la soberanía — en ese caso elija «de acuerdo» y no «muy de acuerdo»."
      fr: "La Judée-Samarie (la Cisjordanie) est sous contrôle israélien depuis 1967 sans que le droit israélien s’y applique. Les partisans y voient le cœur de la Terre d’Israël et veulent y construire et y appliquer la souveraineté ; les opposants disent que l’extension des implantations ferme la porte à un accord futur et nuit à la position d’Israël dans le monde. Certains soutiennent la construction mais pas la souveraineté — dans ce cas, choisissez « d’accord » plutôt que « tout à fait d’accord »."
