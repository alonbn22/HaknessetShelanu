  - kind: positive
    category: achievement
    title:
      he: הוביל את הרשימה המשותפת למפלגה השלישית בגודלה בכנסת
      en: Led the Joint List to become the third-largest party in the Knesset
    description:
      he: בבחירות מרץ 2020 זכתה הרשימה המשותפת ב-15 מנדטים (כ-12.67% מהקולות) ונותרה
        המפלגה השלישית בגודלה בכנסת — מספר מנדטים שיא עבור מפלגה ערבית בישראל.
      en: In the March 2020 election the Joint List won 15 seats (about 12.67% of the
        vote), remaining the third-largest party in the Knesset — a record number
        of seats for an Arab party in Israel.
      ar: في انتخابات آذار/مارس 2020 فازت القائمة المشتركة بـ15 مقعدًا (نحو 12.67%
        من الأصوات) وبقيت ثالث أكبر حزب في الكنيست — وهو عدد قياسي من المقاعد لحزب
        عربي في إسرائيل.
      ru: На выборах в марте 2020 года Объединённый список получил 15 мандатов (около
        12,67% голосов) и остался третьей по величине партией в Кнессете —
        рекордное число мандатов для арабской партии в Израиле.
      es: En las elecciones de marzo de 2020 la Lista Conjunta obtuvo 15 escaños
        (alrededor del 12,67 % de los votos) y siguió siendo el tercer partido más
        grande de la Knéset, un número récord de escaños para un partido árabe en
        Israel.
      fr: Aux élections de mars 2020, la Liste commune a obtenu 15 sièges (environ
        12,67 % des voix) et est restée le troisième parti de la Knesset, un
        nombre record de sièges pour un parti arabe en Israël.
    date: 2020-03-02
