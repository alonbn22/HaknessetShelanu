        publisher: "The Knesset"
  - key: lists-2022
    label: { he: "רשימות בבחירות הקודמות", en: "Lists in the last election", ar: "القوائم في الانتخابات الأخيرة", ru: "Списки на прошлых выборах", es: "Listas en las últimas elecciones", fr: "Listes aux dernières élections" }
    value: { he: "40 התמודדו, 10 עברו", en: "40 ran, 10 passed", ar: "40 ترشحت، 10 اجتازت", ru: "40 участвовали, 10 прошли", es: "40 se presentaron, 10 entraron", fr: "40 en lice, 10 au-dessus du seuil" }
    detail:
      he: "בבחירות 2022 התמודדו 40 רשימות ו-10 עברו את אחוז החסימה; מרצ ובל\"ד לא עברו, וכ-300 אלף קולות ירדו לטמיון."
      en: "In 2022, 40 lists ran and 10 passed the threshold; Meretz and Balad fell short, and some 300,000 votes were wasted."
      ar: "في 2022 ترشحت 40 قائمة واجتازت 10 منها نسبة الحسم؛ لم تجتزها ميرتس والتجمع، وضاع نحو 300,000 صوت."
      ru: "В 2022 году участвовали 40 списков, барьер преодолели 10; «Мерец» и «Балад» не прошли, и около 300 000 голосов пропали."
      es: "En 2022 se presentaron 40 listas y 10 superaron el umbral; Meretz y Balad no superaron el umbral, y unos 300 000 votos se perdieron."
      fr: "En 2022, 40 listes se sont présentées et 10 ont franchi le seuil ; Meretz et Balad ont échoué, et quelque 300 000 voix ont été perdues."
    status: confirmed
    sources:
      - url: "https://main.knesset.gov.il/EN/Documents/2022-10-24%20Fact%20sheet%2002%20-%2025th%20Knesset%20elections%20-%20updated.pdf"
        title: "Fact sheet: The 25th Knesset elections (Knesset RIC)"
        publisher: "The Knesset"
      - url: "https://en.idi.org.il/articles/46229"
        title: "The 2022 Elections: Results Analysis"
        publisher: "Israel Democracy Institute"
  - key: election-cost
    label: { he: "כמה עולות בחירות", en: "What an election costs", ar: "كم تكلّف الانتخابات", ru: "Сколько стоят выборы", es: "Cuánto cuestan unas elecciones", fr: "Ce que coûte une élection" }
    value: { he: "כ-2.7 מיליארד ש\"ח (2022, אומדן)", en: "~NIS 2.7 billion (2022, est.)", ar: "نحو 2.7 مليار شيكل (2022، تقدير)", ru: "около 2,7 млрд шекелей (2022, оценка)", es: "≈ 2700 millones de shékels (2022, estimación)", fr: "≈ 2,7 milliards de shekels (2022, estimation)" }
    detail:
      he: "מתוכם כ-1.5 מיליארד ש\"ח עלות יום השבתון; תקציב ועדת הבחירות שאושר בוועדת הכספים עמד על כ-538 מיליון ש\"ח — כ-79 ש\"ח לבוחר."
      en: "Of which ~NIS 1.5 billion was the election-day holiday; the CEC budget approved by the Finance Committee was ~NIS 538 million — roughly NIS 79 per voter."
      ar: "منها نحو 1.5 مليار شيكل كلفة عطلة يوم الانتخابات؛ وبلغت ميزانية لجنة الانتخابات التي أقرّتها لجنة المالية نحو 538 مليون شيكل — أي قرابة 79 شيكلًا للناخب."
      ru: "Из них около 1,5 млрд шекелей — выходной в день выборов; бюджет ЦИК, утверждённый финансовой комиссией, составил около 538 млн шекелей — примерно 79 шекелей на избирателя."
      es: "De ellos, unos 1500 millones de shékels correspondieron al día festivo electoral; el presupuesto de la Comisión Electoral aprobado por la Comisión de Finanzas fue de unos 538 millones de NIS — unos 79 NIS por votante."
      fr: "Dont environ 1,5 milliard de shekels pour le jour férié électoral ; le budget de la Commission électorale approuvé par la Commission des Finances était d’environ 538 millions de NIS — soit environ 79 NIS par électeur."
    status: reported
    sources:
      - url: "https://www.calcalist.co.il/local_news/article/bj4w2taf9"
        title: "עלות הבחירות — לפחות 2.7 מיליארד שקל"
        publisher: "Calcalist"
      - url: "https://www.ynet.co.il/economy/article/syqde5zno"
        title: "אושר תקציב ועדת הבחירות בסך 538 מיליון שקל"
        publisher: "Ynet"

# How to vote — from the Central Elections Committee's voter information and
# timeline (gov.il / bechirot.gov.il) and Basic Law: The Knesset.
howToVote:
  - key: htv-when
    label: { he: "מתי ואיפה", en: "When and where", ar: "متى وأين", ru: "Когда и где", es: "Cuándo y dónde", fr: "Quand et où" }
    detail:
      he: "יום שלישי, 27 באוקטובר 2026 — יום שבתון. הקלפיות פתוחות 7:00–22:00 (ביישובים קטנים 8:00–20:00), ומי שבתור בשעת הסגירה מצביע. מ-6 באוקטובר נשלחת לכל בוחר הודעה עם מקום הקלפי שלו; רשימת מקומות הקלפי מתפרסמת ב-20 באוקטובר."
      en: "Tuesday, 27 October 2026 — a public day of rest. Polls are open 7:00–22:00 (8:00–20:00 in small communities), and anyone in line at closing still votes. From 6 October every voter is sent a notice with their polling station; the list of stations is published on 20 October."
      ar: "الثلاثاء، 27 تشرين الأول/أكتوبر 2026 — يوم عطلة رسمية. تفتح صناديق الاقتراع بين 7:00 و22:00 (بين 8:00 و20:00 في البلدات الصغيرة)، ومن يكون في الطابور عند الإغلاق يصوّت. ابتداءً من 6 تشرين الأول/أكتوبر تُرسَل إلى كل ناخب بطاقة إعلام بمكان صندوق الاقتراع؛ وتُنشر قائمة الصناديق في 20 تشرين الأول/أكتوبر."
      ru: "Вторник, 27 октября 2026 года — официальный выходной. Участки открыты с 7:00 до 22:00 (в небольших населённых пунктах — с 8:00 до 20:00), и все, кто стоит в очереди на момент закрытия, голосуют. С 6 октября каждому избирателю отправляют уведомление с его участком; список участков публикуется 20 октября."
      es: "Martes 27 de octubre de 2026 — día festivo. Los centros de votación abren de 7:00 a 22:00 (de 8:00 a 20:00 en localidades pequeñas), y quien esté en la fila al cierre vota igualmente. Desde el 6 de octubre cada votante recibe un aviso con su centro de votación; la lista de colegios se publica el 20 de octubre."
      fr: "Mardi 27 octobre 2026 — jour férié. Les bureaux sont ouverts de 7 h à 22 h (de 8 h à 20 h dans les petites localités), et quiconque fait la queue à la fermeture peut encore voter. À partir du 6 octobre, chaque électeur reçoit un avis indiquant son bureau de vote ; la liste des bureaux est publiée le 20 octobre."
    status: confirmed
    sources:
      - url: "https://www.bechirot.gov.il/home/"
        title: "ציר הזמן לבחירות לכנסת ה-26 — אתר ועדת הבחירות המרכזית"
        publisher: "ועדת הבחירות המרכזית"
      - url: "https://m.knesset.gov.il/EN/activity/documents/BasicLawsPDF/BasicLawTheKnesset.pdf"
        title: "Basic Law: The Knesset (art. 10)"
        publisher: "The Knesset"
  - key: htv-who
    label: { he: "מי רשאי להצביע", en: "Who may vote", ar: "من يحق له التصويت", ru: "Кто может голосовать", es: "Quién puede votar", fr: "Qui peut voter" }
    detail:
      he: "כל אזרח ישראלי בן 18 ומעלה הרשום במרשם האוכלוסין. ההצבעה אישית ובישראל בלבד; אין הצבעה בדואר ואין הצבעה כללית מחו\"ל."
      en: "Every Israeli citizen aged 18 or over who is in the Population Register. Voting is in person and in Israel only; there is no postal voting and no general voting from abroad."
      ar: "كل مواطن إسرائيلي بلغ 18 عامًا فأكثر ومسجّل في سجل السكان. التصويت شخصي وفي إسرائيل فقط؛ لا يوجد تصويت بالبريد ولا تصويت عام من الخارج."
      ru: "Каждый гражданин Израиля, достигший 18 лет и внесённый в Реестр населения. Голосуют лично и только в Израиле; голосования по почте и общего голосования из-за рубежа нет."
      es: "Todo ciudadano israelí de 18 años o más inscrito en el Registro de Población. Se vota en persona y solo en Israel; no hay voto por correo ni voto general desde el extranjero."
      fr: "Tout citoyen israélien de 18 ans et plus inscrit au registre de la population. Le vote se fait en personne et uniquement en Israël ; il n’y a ni vote par correspondance ni vote général depuis l’étranger."
    status: confirmed
    sources:
      - url: "https://m.knesset.gov.il/EN/activity/documents/BasicLawsPDF/BasicLawTheKnesset.pdf"
        title: "Basic Law: The Knesset (art. 5)"
        publisher: "The Knesset"
      - url: "https://www.gov.il/he/pages/26elections-info"
        title: "מידע לבוחר — הבחירות לכנסת ה-26 (עודכן 16.9.2026)"
        publisher: "ועדת הבחירות המרכזית / gov.il"
  - key: htv-id
    label: { he: "מה מביאים", en: "What to bring", ar: "ماذا تُحضِر", ru: "Что взять с собой", es: "Qué llevar", fr: "Ce qu’il faut apporter" }
    detail:
      he: "אחד מאלה: תעודת זהות תקינה, דרכון ישראלי תקף, רישיון נהיגה תקף, או תעודה צבאית בתוקף (חוגר, קצין או נגד); גם תעודת שוטר או תעודת חבר כנסת."
      en: "One of: a valid ID card, a valid Israeli passport, a valid driving licence, or a valid military ID (enlisted, officer or NCO); a police ID or Knesset-member ID also counts."
      ar: "واحد مما يلي: بطاقة هوية سارية، أو جواز سفر إسرائيلي ساري المفعول، أو رخصة قيادة سارية، أو بطاقة عسكرية سارية (جندي نظامي أو ضابط أو ضابط صف)؛ وتُقبل أيضًا بطاقة الشرطة أو بطاقة عضو الكنيست."
      ru: "Одно из: действующее удостоверение личности, действующий израильский паспорт, действующие водительские права или действующее военное удостоверение (срочника, офицера или сержанта); подходит и удостоверение полицейского или депутата Кнессета."
      es: "Uno de estos: un documento de identidad válido, un pasaporte israelí válido, una licencia de conducir válida o una identificación militar válida (soldado, oficial o suboficial); también sirven una identificación policial o de miembro de la Knéset."
      fr: "L’un des documents suivants : une carte d’identité valide, un passeport israélien valide, un permis de conduire valide ou une carte militaire valide (soldat, officier ou sous-officier) ; une carte de police ou de député à la Knesset est également acceptée."
    status: confirmed
    sources:
      - url: "https://www.gov.il/he/pages/26elections-info"
        title: "מידע לבוחר — הבחירות לכנסת ה-26 (עודכן 16.9.2026)"
        publisher: "ועדת הבחירות המרכזית / gov.il"
  - key: htv-access
    label: { he: "נגישות", en: "Accessibility", ar: "الإتاحة", ru: "Доступность", es: "Accesibilidad", fr: "Accessibilité" }
    detail:
      he: "6,208 קלפיות נגישות לאנשים המוגבלים בניידות (לפי מפת הקלפיות הסופית, 6.9.2026), ו-3,620 קלפיות נגישות מיוחדות שבהן רשאי להצביע מי שמוגבל בניידות והקלפי שלו אינה נגישה — עם הצהרה בפני מזכיר הקלפי, במעטפה כפולה. רשימת הקלפיות הנגישות מתפרסמת סמוך לבחירות."
      en: "6,208 stations accessible to people with limited mobility (per the final station map, 6 Sep 2026), and 3,620 special accessible stations where anyone with limited mobility whose own station is not accessible may vote — with a declaration to the station secretary, by double envelope. The list is published close to election day."
      ar: "6,208 صناديق متاحة لذوي محدودية الحركة (وفق خريطة الصناديق النهائية، 6 أيلول/سبتمبر 2026)، و3,620 صندوقًا متاحًا خاصًا يمكن فيه لكل من يعاني محدودية في الحركة ولا يكون صندوقه متاحًا أن يصوّت — بتصريح أمام سكرتير الصندوق، بالمغلّف المزدوج. تُنشر القائمة قرب يوم الانتخابات."
      ru: "6 208 участков доступны для людей с ограниченной подвижностью (по окончательной карте участков, 6 сентября 2026 года), и 3 620 специальных доступных участков, где может проголосовать любой человек с ограниченной подвижностью, чей собственный участок недоступен, — сделав заявление секретарю участка, двойным конвертом. Список публикуется незадолго до дня выборов."
      es: "6 208 centros de votación accesibles para personas con movilidad reducida (según el mapa definitivo, 6 de septiembre de 2026), y 3 620 colegios de accesibilidad especial donde puede votar cualquier persona con movilidad reducida cuyo colegio no sea accesible — con una declaración ante el secretario de mesa, en sobre doble. La lista se publica cerca del día de las elecciones."
      fr: "6 208 bureaux accessibles aux personnes à mobilité réduite (selon la carte définitive du 6 septembre 2026), et 3 620 bureaux à accessibilité spéciale où toute personne à mobilité réduite dont le bureau n’est pas accessible peut voter — sur déclaration au secrétaire du bureau, sous double enveloppe. La liste est publiée peu avant le jour des élections."
    status: confirmed
    sources:
      - url: "https://www.gov.il/he/pages/26elections-info"
        title: "מידע לבוחר — נתונים כלליים על הבחירות (מפת הקלפיות הסופית, 6.9.2026)"
        publisher: "ועדת הבחירות המרכזית / gov.il"
      - url: "https://www.gov.il/he/pages/26elections-info?chapterIndex=7"
        title: "הצבעת אנשים המוגבלים בניידות — מידע לבוחר"
        publisher: "ועדת הבחירות המרכזית / gov.il"
  - key: htv-hospital
    label: { he: "מאושפזים ומוסדות", en: "Hospital patients and care homes", ar: "المرضى في المستشفيات ودور الرعاية", ru: "Пациенты больниц и дома ухода", es: "Pacientes hospitalizados y residencias", fr: "Patients hospitalisés et établissements de soins" }
    detail:
      he: "מי שמאושפז ביום הבחירות (למעט אשפוז יום) מצביע בקלפי למאושפזים בבית החולים, עם אישור בכתב מבית החולים ותעודה מזהה; גם שוהים במוסד מוכר לאנשים המוגבלים בניידות (50 דיירים לפחות) מצביעים בקלפי במוסד."
      en: "Anyone hospitalised on election day (other than day admissions) votes at the hospital's station, with a written confirmation from the hospital and an ID; residents of recognised care institutions for people with limited mobility (50 residents or more) vote at a station in the institution."
      ar: "كل من يرقد في المستشفى يوم الانتخابات (باستثناء الإدخال ليوم واحد) يصوّت في صندوق المستشفى، مع تصديق خطي من المستشفى وبطاقة هوية؛ ونزلاء مؤسسات الرعاية المعترف بها لذوي محدودية الحركة (50 نزيلًا فأكثر) يصوّتون في صندوق داخل المؤسسة."
      ru: "Все, кто находится в больнице в день выборов (кроме дневного стационара), голосуют на участке в больнице с письменным подтверждением от больницы и удостоверением личности; жители признанных учреждений для людей с ограниченной подвижностью (50 жителей и больше) голосуют на участке в учреждении."
      es: "Quien esté hospitalizado el día de las elecciones (salvo hospitalización de día) vota en el centro de votación del hospital, con una confirmación escrita del hospital y un documento de identidad; los residentes de instituciones reconocidas para personas con movilidad reducida (50 residentes o más) votan en un centro de votación dentro de la institución."
      fr: "Toute personne hospitalisée le jour des élections (hors admissions de jour) vote au bureau de l’hôpital, avec une attestation écrite de l’hôpital et une pièce d’identité ; les résidents d’établissements reconnus pour personnes à mobilité réduite (50 résidents ou plus) votent dans un bureau situé dans l’établissement."
    status: confirmed
    sources:
      - url: "https://www.gov.il/he/pages/26elections-info?chapterIndex=3"
        title: "הצבעה בבתי חולים ובמוסדות — מידע לבוחר"
        publisher: "ועדת הבחירות המרכזית / gov.il"
  - key: htv-abroad
    label: { he: "בחו\"ל", en: "Abroad", ar: "في الخارج", ru: "За рубежом", es: "En el extranjero", fr: "À l’étranger" }
    detail:
      he: "רק דיפלומטים, שליחי המדינה ובני משפחותיהם מצביעים בנציגויות ישראל (102 קלפיות ב-100 נציגויות), וכן צוותי כלי שיט ישראליים — ב-15 באוקטובר 2026. אזרח שנמצא בחו\"ל ביום הבחירות אינו יכול להצביע."
      en: "Only diplomats, state emissaries and their families vote at Israeli missions (102 stations at 100 missions), plus crews of Israeli ships — on 15 October 2026. A citizen who is abroad on election day cannot vote."
      ar: "يصوّت في الممثليات الإسرائيلية الدبلوماسيون ومبعوثو الدولة وعائلاتهم فقط (102 صندوق في 100 ممثلية)، إضافة إلى طواقم السفن الإسرائيلية — في 15 تشرين الأول/أكتوبر 2026. المواطن الذي يكون في الخارج يوم الانتخابات لا يستطيع التصويت."
      ru: "В израильских представительствах голосуют только дипломаты, государственные посланники и их семьи (102 участка в 100 представительствах), а также экипажи израильских судов — 15 октября 2026 года. Гражданин, находящийся за границей в день выборов, проголосовать не может."
      es: "Solo diplomáticos, enviados del Estado y sus familias votan en las misiones israelíes (102 centros de votación en 100 misiones), además de las tripulaciones de barcos israelíes — el 15 de octubre de 2026. Un ciudadano que esté en el extranjero el día de las elecciones no puede votar."
      fr: "Seuls les diplomates, les émissaires de l’État et leurs familles votent dans les missions israéliennes (102 bureaux dans 100 missions), ainsi que les équipages des navires israéliens — le 15 octobre 2026. Un citoyen se trouvant à l’étranger le jour des élections ne peut pas voter."
    status: confirmed
    sources:
      - url: "https://www.bechirot.gov.il/home/"
        title: "ציר הזמן לבחירות לכנסת ה-26 — יום ההצבעה בכלי שיט ובנציגויות (15.10.2026)"
        publisher: "ועדת הבחירות המרכזית"
      - url: "https://www.gov.il/he/pages/26elections-info"
        title: "מידע לבוחר — הבחירות לכנסת ה-26 (עודכן 16.9.2026)"
        publisher: "ועדת הבחירות המרכזית / gov.il"

