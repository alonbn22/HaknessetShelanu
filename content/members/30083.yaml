    title:
      he: המקום הראשון בפריימריז הליכוד לקראת בחירות 2026
      en: First place in the Likud primary ahead of the 2026 election
    description:
      he: בפריימריז הליכוד לרשימה לכנסת ה-26, שתוצאותיו פורסמו ב-17 באוגוסט 2026, דורג כהן במקום הראשון (כ-46 אלף קולות), לפני אמיר אוחנה ויריב לוין — כלומר במקום השני ברשימת הליכוד, אחרי בנימין נתניהו.
      en: In the Likud primary for the 26th Knesset list, whose results were published on 17 August 2026, Cohen was ranked first (about 46,000 votes), ahead of Amir Ohana and Yariv Levin — the second slot on the Likud list after Benjamin Netanyahu.
    sources:
