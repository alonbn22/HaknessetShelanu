# Political dictionary — plain-language explanations of political terms.
# Editorial content written by the site. Hebrew is the source; every entry is in
# all six languages (he, en, ar, ru, es, fr). category: spectrum | ideology | economy | government | electoral | israel
# Add freely — every term should have an easy, neutral explanation.
terms:
  # ---------- spectrum ----------
  - category: spectrum
    term: { he: "שמאל", en: "Left", ar: "اليسار", ru: "Левые", es: Izquierda, fr: Gauche }
    def:
      he: "צד במפה הפוליטית שמדגיש שוויון חברתי, מעורבות ממשלתית בכלכלה וזכויות פרט, ובישראל לרוב גם נכונות לפשרה מדינית."
      en: "The side of politics that emphasizes social equality, an active government role in the economy, and individual rights — in Israel, usually also openness to territorial compromise."
      ar: "الجانب من الخريطة السياسية الذي يشدّد على المساواة الاجتماعية وعلى دور فاعل للحكومة في الاقتصاد وعلى حقوق الفرد — وفي إسرائيل عادةً أيضًا على الاستعداد لتسوية سياسية وإقليمية."
      ru: "Часть политического спектра, делающая упор на социальное равенство, активную роль государства в экономике и права личности, — в Израиле обычно также на готовность к территориальному компромиссу."
      es: El lado de la política que pone el acento en la igualdad social, un papel activo del Estado en la economía y los derechos individuales — en Israel, por lo general también en la apertura a un compromiso territorial.
      fr: Le camp politique qui met l’accent sur l’égalité sociale, un rôle actif de l’État dans l’économie et les droits individuels — en Israël, généralement aussi l’ouverture à un compromis territorial.
    sourceUrl: "https://www.britannica.com/topic/left"
  - category: spectrum
    term: { he: "מרכז", en: "Center", ar: "الوسط", ru: "Центр", es: Centro, fr: Centre }
    def:
      he: "עמדה ממוצעת בין ימין לשמאל, שמשלבת רעיונות משני הצדדים ונמנעת מקיצוניות."
      en: "A middle position between left and right that mixes ideas from both sides and avoids extremes."
      ar: "موقف وسط بين اليمين واليسار، يجمع أفكارًا من الجانبين ويتجنّب التطرف."
      ru: "Промежуточная позиция между левыми и правыми, сочетающая идеи обеих сторон и избегающая крайностей."
      es: Una posición intermedia entre izquierda y derecha que mezcla ideas de ambos lados y evita los extremos.
      fr: Une position intermédiaire entre la gauche et la droite qui mêle des idées des deux camps et évite les extrêmes.
    sourceUrl: "https://www.britannica.com/dictionary/center"
  - category: spectrum
    term: { he: "ימין", en: "Right", ar: "اليمين", ru: "Правые", es: Derecha, fr: Droite }
    def:
      he: "צד במפה הפוליטית שמדגיש שוק חופשי, מסורת וזהות לאומית, ובישראל לרוב גם עמדה ביטחונית תקיפה."
      en: "The side of politics that emphasizes free markets, tradition and national identity — in Israel, usually also a tough security stance."
      ar: "الجانب من الخريطة السياسية الذي يشدّد على السوق الحرة والتقاليد والهوية القومية — وفي إسرائيل عادةً أيضًا على موقف أمني متشدد."
      ru: "Часть политического спектра, делающая упор на свободный рынок, традиции и национальную идентичность, — в Израиле обычно также на жёсткую позицию в вопросах безопасности."
      es: El lado de la política que pone el acento en el libre mercado, la tradición y la identidad nacional — en Israel, por lo general también en una postura de seguridad firme.
      fr: Le camp politique qui met l’accent sur le marché libre, la tradition et l’identité nationale — en Israël, généralement aussi une position sécuritaire ferme.
    sourceUrl: "https://www.britannica.com/topic/right"
  - category: spectrum
    term: { he: "מרכז־שמאל / מרכז־ימין", en: "Center-left / Center-right", ar: "يسار الوسط / يمين الوسط", ru: "Левоцентристы / правоцентристы", es: Centroizquierda / Centroderecha, fr: Centre gauche / Centre droit }
    def:
      he: "עמדות מתונות הנוטות מעט לשמאל או לימין — קרובות למרכז אך עם הטיה ברורה."
      en: "Moderate positions leaning slightly toward the left or the right — close to the center but with a clear tilt."
      ar: "مواقف معتدلة تميل قليلًا إلى اليسار أو إلى اليمين — قريبة من الوسط لكن مع ميل واضح."
      ru: "Умеренные позиции с небольшим уклоном влево или вправо — близкие к центру, но с явным наклоном."
      es: Posiciones moderadas ligeramente inclinadas a la izquierda o a la derecha — cercanas al centro pero con una tendencia clara.
      fr: Des positions modérées légèrement inclinées vers la gauche ou la droite — proches du centre mais avec un penchant net.
    sourceUrl: "https://www.britannica.com/dictionary/center"
  - category: spectrum
    term: { he: "ימין קיצוני", en: "Far-right", ar: "اليمين المتطرف", ru: "Ультраправые", es: Extrema derecha, fr: Extrême droite }
    def:
      he: "עמדות לאומיות נוקשות מאוד, לעיתים עם יחס שלילי למיעוטים או למוסדות. \"קיצוני\" מציין מרחק רב מהמרכז, לא בהכרח אלימות."
      en: "Very hardline nationalist positions, sometimes hostile to minorities or institutions. \"Far\" means far from the center — not necessarily violent."
      ar: "مواقف قومية متشددة جدًا، وأحيانًا مع موقف عدائي من الأقليات أو من المؤسسات. «متطرف» يعني بعيدًا جدًا عن الوسط، وليس بالضرورة عنيفًا."
      ru: "Очень жёсткие националистические позиции, иногда с враждебным отношением к меньшинствам или институтам. «Ультра» означает большую удалённость от центра, а не обязательно насилие."
      es: Posiciones nacionalistas muy duras, a veces hostiles a las minorías o a las instituciones. «Extrema» indica lejanía del centro — no necesariamente violencia.
      fr: Des positions nationalistes très dures, parfois hostiles aux minorités ou aux institutions. « Extrême » signifie loin du centre — pas nécessairement violent.
    sourceUrl: "https://www.idi.org.il/articles/4580"

  # ---------- ideology ----------
  - category: ideology
    term: { he: "ליברליזם", en: "Liberalism", ar: "الليبرالية", ru: "Либерализм", es: Liberalismo, fr: Libéralisme }
    def:
      he: "תפיסה שמעמידה במרכז את חירות הפרט, זכויות אדם, שוק חופשי ושלטון החוק, והגבלת כוחה של הממשלה על חיי הפרט."
      en: "A worldview centered on individual freedom, human rights, free markets and the rule of law, limiting the government's power over private life."
      ar: "رؤية تضع في المركز حرية الفرد وحقوق الإنسان والسوق الحرة وسيادة القانون، وتحدّ من سلطة الحكومة على حياة الفرد."
      ru: "Мировоззрение, в центре которого — свобода личности, права человека, свободный рынок и верховенство закона, с ограничением власти государства над частной жизнью."
      es: Una visión centrada en la libertad individual, los derechos humanos, el libre mercado y el Estado de derecho, que limita el poder del Estado sobre la vida privada.
      fr: Une vision centrée sur la liberté individuelle, les droits humains, le marché libre et l’État de droit, qui limite le pouvoir de l’État sur la vie privée.
    sourceUrl: "https://www.britannica.com/topic/liberalism"
  - category: ideology
    term: { he: "שמרנות", en: "Conservatism", ar: "المحافظة", ru: "Консерватизм", es: Conservadurismo, fr: Conservatisme }
    def:
      he: "תפיסה שמעדיפה לשמר מסורת, דת ומוסדות קיימים, ונזהרת משינויים מהירים."
      en: "A worldview that prefers to preserve tradition, religion and existing institutions, and is wary of rapid change."
      ar: "رؤية تفضّل الحفاظ على التقاليد والدين والمؤسسات القائمة، وتتحفّظ من التغييرات السريعة."
      ru: "Мировоззрение, предпочитающее сохранять традиции, религию и существующие институты и настороженно относящееся к быстрым переменам."
      es: Una visión que prefiere preservar la tradición, la religión y las instituciones existentes, y desconfía de los cambios rápidos.
      fr: Une vision qui préfère préserver la tradition, la religion et les institutions existantes, et se méfie des changements rapides.
    sourceUrl: "https://www.britannica.com/topic/conservatism"
  - category: ideology
    term: { he: "סוציאליזם", en: "Socialism", ar: "الاشتراكية", ru: "Социализм", es: Socialismo, fr: Socialisme }
    def:
      he: "תפיסה ששואפת לצמצם פערים כלכליים באמצעות בעלות ציבורית או פיקוח על משאבים ושירותים."
      en: "A worldview that seeks to reduce economic gaps through public ownership or control of resources and services."
      ar: "رؤية تسعى إلى تقليص الفجوات الاقتصادية عبر الملكية العامة أو الرقابة على الموارد والخدمات."
      ru: "Мировоззрение, стремящееся сократить экономическое неравенство через общественную собственность или контроль над ресурсами и услугами."
      es: Una visión que busca reducir las desigualdades económicas mediante la propiedad o el control públicos de recursos y servicios.
      fr: Une vision qui cherche à réduire les écarts économiques par la propriété ou le contrôle publics des ressources et des services.
    sourceUrl: "https://www.britannica.com/money/socialism"
  - category: ideology
    term: { he: "קומוניזם", en: "Communism", ar: "الشيوعية", ru: "Коммунизм", es: Comunismo, fr: Communisme }
    def:
      he: "אידאולוגיה שמבקשת חברה ללא מעמדות שבה אמצעי הייצור בבעלות משותפת. גרסה רדיקלית של סוציאליזם."
      en: "An ideology aiming for a classless society in which the means of production are commonly owned — a radical form of socialism."
      ar: "أيديولوجيا تسعى إلى مجتمع بلا طبقات تكون فيه وسائل الإنتاج ملكية مشتركة — وهي صيغة راديكالية من الاشتراكية."
      ru: "Идеология, стремящаяся к бесклассовому обществу, в котором средства производства находятся в общей собственности, — радикальная форма социализма."
      es: Una ideología que aspira a una sociedad sin clases en la que los medios de producción son de propiedad común — una forma radical de socialismo.
      fr: Une idéologie visant une société sans classes où les moyens de production sont possédés en commun — une forme radicale de socialisme.
    sourceUrl: "https://www.britannica.com/topic/communism"
  - category: ideology
    term: { he: "ליברטריאניזם", en: "Libertarianism", ar: "الليبرتارية", ru: "Либертарианство", es: Libertarismo, fr: Libertarianisme }
    def:
      he: "תפיסה הדוגלת בממשלה קטנה ככל האפשר, חירות אישית וכלכלית מרבית ומעט מאוד התערבות מדינתית."
      en: "A view favoring the smallest possible government, maximum personal and economic freedom, and minimal state intervention."
      ar: "رؤية تدعو إلى أصغر حكومة ممكنة، وأقصى حرية شخصية واقتصادية، وأقل قدر من تدخل الدولة."
      ru: "Взгляд, выступающий за минимально возможное государство, максимальную личную и экономическую свободу и минимальное государственное вмешательство."
      es: Una visión que prefiere el Estado más pequeño posible, la máxima libertad personal y económica y una intervención estatal mínima.
      fr: Une vision qui préfère un État aussi réduit que possible, une liberté personnelle et économique maximale et une intervention minimale de l’État.
    sourceUrl: "https://www.britannica.com/topic/libertarianism-politics"
  - category: ideology
    term: { he: "לאומיות", en: "Nationalism", ar: "القومية", ru: "Национализм", es: Nacionalismo, fr: Nationalisme }
    def:
      he: "תפיסה שמעמידה את האומה ואת האינטרס הלאומי במרכז, ולעיתים מדגישה ריבונות וזהות תרבותית."
      en: "A view that places the nation and the national interest at the center, often stressing sovereignty and cultural identity."
      ar: "رؤية تضع الأمة والمصلحة القومية في المركز، وكثيرًا ما تشدّد على السيادة والهوية الثقافية."
      ru: "Взгляд, ставящий в центр нацию и национальные интересы, часто с упором на суверенитет и культурную идентичность."
      es: Una visión que sitúa a la nación y el interés nacional en el centro, y suele subrayar la soberanía y la identidad cultural.
      fr: Une vision qui place la nation et l’intérêt national au centre, en insistant souvent sur la souveraineté et l’identité culturelle.
    sourceUrl: "https://www.britannica.com/topic/nationalism"
  - category: ideology
    term: { he: "פופוליזם", en: "Populism", ar: "الشعبوية", ru: "Популизм", es: Populismo, fr: Populisme }
    def:
      he: "סגנון פוליטי שמציג מאבק בין \"העם\" לבין \"האליטות\", לרוב במסרים פשוטים ורגשיים."
      en: "A political style that frames a struggle between \"the people\" and \"the elites\", usually with simple, emotional messaging."
      ar: "أسلوب سياسي يصوّر صراعًا بين «الشعب» و«النخب»، غالبًا برسائل بسيطة وعاطفية."
      ru: "Политический стиль, представляющий борьбу между «народом» и «элитами», обычно с простыми эмоциональными посылами."
      es: Un estilo político que presenta una lucha entre «el pueblo» y «las élites», normalmente con mensajes simples y emocionales.
      fr: Un style politique qui met en scène une lutte entre « le peuple » et « les élites », généralement avec des messages simples et émotionnels.
    sourceUrl: "https://www.britannica.com/topic/populism"
  - category: ideology
    term: { he: "חילוניות", en: "Secularism", ar: "العلمانية", ru: "Секуляризм", es: Laicismo, fr: Laïcité }
    def:
      he: "הפרדה בין דת למדינה — מדיניות שאינה נשענת על כללים דתיים ומכבדת חופש דת ומצפון."
      en: "Separation of religion and state — policy not based on religious rules, respecting freedom of religion and conscience."
      ar: "الفصل بين الدين والدولة — سياسة لا تستند إلى قواعد دينية وتحترم حرية الدين والضمير."
      ru: "Отделение религии от государства — политика, не основанная на религиозных правилах и уважающая свободу вероисповедания и совести."
      es: Separación de religión y Estado — una política no basada en reglas religiosas, que respeta la libertad de religión y de conciencia.
      fr: Séparation de la religion et de l’État — une politique qui ne repose pas sur des règles religieuses et respecte la liberté de religion et de conscience.
    sourceUrl: "https://www.britannica.com/topic/secularism"
  - category: ideology
    term: { he: "תאוקרטיה", en: "Theocracy", ar: "الثيوقراطية", ru: "Теократия", es: Teocracia, fr: Théocratie }
    def:
      he: "שלטון שמבוסס על חוק דתי, שבו מנהיגים או כללים דתיים קובעים את המדיניות."
      en: "Rule based on religious law, where religious leaders or rules determine policy."
      ar: "حكم يستند إلى القانون الديني، يحدّد فيه القادة الدينيون أو القواعد الدينية السياسات."
      ru: "Правление, основанное на религиозном законе, при котором политику определяют религиозные лидеры или предписания."
      es: Un gobierno basado en la ley religiosa, donde los líderes o las normas religiosas determinan la política.
      fr: Un régime fondé sur la loi religieuse, où les chefs ou les règles religieux déterminent la politique.
    sourceUrl: "https://www.britannica.com/topic/theocracy"

  # ---------- economy ----------
  - category: economy
    term: { he: "קפיטליזם", en: "Capitalism", ar: "الرأسمالية", ru: "Капитализм", es: Capitalismo, fr: Capitalisme }
    def:
      he: "שיטה כלכלית של שוק חופשי שבה עסקים ונכסים בבעלות פרטית, והמחירים נקבעים לפי היצע וביקוש."
      en: "A free-market economic system where businesses and assets are privately owned and prices are set by supply and demand."
      ar: "نظام اقتصادي قائم على السوق الحرة تكون فيه الأعمال والأصول ملكية خاصة، وتُحدَّد الأسعار وفق العرض والطلب."
      ru: "Рыночная экономическая система, в которой предприятия и имущество находятся в частной собственности, а цены определяются спросом и предложением."
      es: Un sistema económico de libre mercado en el que las empresas y los bienes son de propiedad privada y los precios los fija la oferta y la demanda.
      fr: Un système économique de marché libre où les entreprises et les biens sont privés et où les prix sont fixés par l’offre et la demande.
    sourceUrl: "https://www.imf.org/en/publications/fandd/issues/series/back-to-basics/capitalism"
  - category: economy
    term: { he: "כלכלת שוק חופשי", en: "Free-market economy", ar: "اقتصاد السوق الحرة", ru: "Свободная рыночная экономика", es: Economía de libre mercado, fr: Économie de libre marché }
    def:
      he: "כלכלה שבה הממשלה מתערבת מעט, והשוק (קונים ומוכרים) קובע מחירים וייצור."
      en: "An economy where the government intervenes little and the market (buyers and sellers) sets prices and production."
      ar: "اقتصاد تتدخل فيه الحكومة قليلًا، ويحدّد السوق (المشترون والبائعون) الأسعار والإنتاج."
      ru: "Экономика, в которую государство вмешивается мало, а цены и производство определяет рынок (покупатели и продавцы)."
      es: Una economía en la que el Estado interviene poco y el mercado (compradores y vendedores) fija los precios y la producción.
      fr: Une économie où l’État intervient peu et où le marché (acheteurs et vendeurs) fixe les prix et la production.
    sourceUrl: "https://www.imf.org/en/publications/fandd/issues/series/back-to-basics/capitalism"
  - category: economy
    term: { he: "מדינת רווחה", en: "Welfare state", ar: "دولة الرفاه", ru: "Социальное государство", es: Estado del bienestar, fr: État-providence }
    def:
      he: "מדינה שמספקת שירותים חברתיים נרחבים — בריאות, חינוך, קצבאות — הממומנים ממסים."
      en: "A state that provides broad social services — health, education, benefits — funded by taxes."
      ar: "دولة تقدّم خدمات اجتماعية واسعة — الصحة والتعليم والمخصصات — تُموَّل من الضرائب."
      ru: "Государство, предоставляющее широкие социальные услуги — здравоохранение, образование, пособия, — финансируемые из налогов."
      es: Un Estado que presta amplios servicios sociales — salud, educación, prestaciones — financiados con impuestos.
      fr: Un État qui fournit des services sociaux étendus — santé, éducation, allocations — financés par l’impôt.
    sourceUrl: "https://www.britannica.com/money/welfare-state"
  - category: economy
    term: { he: "רגולציה", en: "Regulation", ar: "التنظيم الحكومي (الرقابة التنظيمية)", ru: "Регулирование", es: Regulación, fr: Réglementation }
    def:
      he: "כללים שהממשלה קובעת כדי לפקח על שווקים, עסקים או מקצועות (למשל בטיחות, מחירים)."
      en: "Rules the government sets to oversee markets, businesses or professions (e.g. safety, pricing)."
      ar: "قواعد تضعها الحكومة للرقابة على الأسواق أو الشركات أو المهن (مثل السلامة والأسعار)."
      ru: "Правила, которые устанавливает государство для надзора за рынками, предприятиями или профессиями (например, безопасность, цены)."
      es: Normas que fija el Estado para supervisar mercados, empresas o profesiones (por ejemplo, seguridad, precios).
      fr: Des règles fixées par l’État pour encadrer des marchés, des entreprises ou des professions (par exemple sécurité, prix).
    sourceUrl: "https://www.idi.org.il/articles/36432"
  - category: economy
    term: { he: "תקציב המדינה", en: "State budget", ar: "ميزانية الدولة", ru: "Государственный бюджет", es: Presupuesto del Estado, fr: Budget de l’État }
    def:
      he: "תוכנית ההוצאות וההכנסות של הממשלה לשנה (ולעיתים לשנתיים), המתקבלת בחוק. קובעת כמה כסף יקבל כל משרד ולמה."
      en: "The government's plan of spending and revenue for the year (sometimes two years), enacted in law. It sets how much money each ministry gets and for what."
      ar: "خطة نفقات الحكومة وإيراداتها لسنة (وأحيانًا لسنتين)، تُقَرّ بقانون. وتحدّد كم من المال تحصل عليه كل وزارة ولأي غرض."
      ru: "План расходов и доходов правительства на год (иногда на два), утверждаемый законом. Он определяет, сколько денег получает каждое министерство и на что."
      es: El plan de gastos e ingresos del Gobierno para el año (a veces dos años), aprobado por ley. Fija cuánto dinero recibe cada ministerio y para qué.
      fr: Le plan de dépenses et de recettes du gouvernement pour l’année (parfois deux ans), adopté par une loi. Il fixe combien reçoit chaque ministère et pour quoi.
    sourceUrl: "https://main.knesset.gov.il/About/Lexicon/Pages/budget.aspx"
  - category: economy
    term: { he: "חוק התקציב", en: "Budget Law", ar: "قانون الميزانية", ru: "Закон о бюджете", es: Ley de Presupuesto, fr: Loi de finances }
    def:
      he: "החוק שמאשר את תקציב המדינה. אם לא מאושר במועד, הכנסת מתפזרת ונקבעות בחירות. עובר שלוש קריאות במליאה."
      en: "The law that approves the state budget. If it isn't passed on time, the Knesset is dissolved and elections are called. It passes three plenum readings."
      ar: "القانون الذي يصادق على ميزانية الدولة. إذا لم يُقَرّ في موعده يُحلّ الكنيست وتُحدَّد انتخابات. ويمرّ بثلاث قراءات في الهيئة العامة."
      ru: "Закон, утверждающий государственный бюджет. Если он не принят вовремя, Кнессет распускается и назначаются выборы. Проходит три чтения в пленуме."
      es: La ley que aprueba el presupuesto del Estado. Si no se aprueba a tiempo, la Knéset se disuelve y se convocan elecciones. Pasa tres lecturas en el pleno.
      fr: La loi qui approuve le budget de l’État. Si elle n’est pas adoptée à temps, la Knesset est dissoute et des élections sont convoquées. Elle est adoptée en trois lectures en plénière.
    sourceUrl: "https://main.knesset.gov.il/About/Lexicon/Pages/budget.aspx"
  - category: economy
    term: { he: "גירעון תקציבי", en: "Budget deficit", ar: "العجز في الميزانية", ru: "Дефицит бюджета", es: Déficit presupuestario, fr: Déficit budgétaire }
    def:
      he: "מצב שבו הוצאות הממשלה גדולות מהכנסותיה בשנה נתונה; הפער מכוסה בדרך כלל בהלוואות (חוב)."
      en: "When the government spends more than it takes in during a year; the gap is usually covered by borrowing (debt)."
      ar: "حالة تكون فيها نفقات الحكومة أكبر من إيراداتها في سنة معيّنة؛ وتُغطّى الفجوة عادةً بالاقتراض (الدَّين)."
      ru: "Ситуация, когда расходы правительства за год превышают его доходы; разница обычно покрывается займами (долгом)."
      es: Cuando el Gobierno gasta más de lo que ingresa en un año; la diferencia suele cubrirse con préstamos (deuda).
      fr: Quand le gouvernement dépense plus qu’il n’encaisse dans l’année ; l’écart est généralement couvert par l’emprunt (dette).
    sourceUrl: "https://fs.knesset.gov.il/globaldocs/MMM/ff526b58-e9f7-e411-80c8-00155d010977/2_ff526b58-e9f7-e411-80c8-00155d010977_11_10372.pdf"
  - category: economy
    term: { he: "תקציב נטו וברוטו", en: "Net vs gross budget", ar: "الميزانية الصافية والإجمالية", ru: "Бюджет нетто и брутто", es: Presupuesto neto y bruto, fr: Budget net et brut }
    def:
      he: "תקציב ברוטו הוא סך ההוצאה כולל הוצאות הממומנות מהכנסות מיועדות; תקציב נטו הוא ההוצאה ללא אותן הכנסות. הברוטו תמיד גבוה יותר."
      en: "The gross budget is total spending including spending funded by designated income; the net budget excludes that income. Gross is always higher."
      ar: "الميزانية الإجمالية هي مجموع الإنفاق بما يشمل الإنفاق المموَّل من إيرادات مخصّصة؛ والميزانية الصافية هي الإنفاق من دون تلك الإيرادات. والإجمالية أعلى دائمًا."
      ru: "Бюджет брутто — это все расходы, включая расходы, финансируемые из целевых доходов; бюджет нетто — расходы без этих доходов. Брутто всегда больше."
      es: El presupuesto bruto es el gasto total, incluido el financiado con ingresos afectados; el neto excluye esos ingresos. El bruto siempre es mayor.
      fr: Le budget brut est la dépense totale, y compris celle financée par des recettes affectées ; le net exclut ces recettes. Le brut est toujours plus élevé.
    sourceUrl: "https://fs.knesset.gov.il/globaldocs/MMM/2ea0559c-53fb-f011-a13e-005056aa7c52/2_2ea0559c-53fb-f011-a13e-005056aa7c52_11_21418.pdf"
  - category: economy
    term: { he: "סעיף תקציבי", en: "Budget section / line", ar: "بند الميزانية", ru: "Статья бюджета", es: Sección / partida presupuestaria, fr: Section / ligne budgétaire }
    def:
      he: "יחידת התקציב. התקציב בנוי בהיררכיה: סעיף (בדרך כלל משרד) → תחום → תוכנית → תקנה (הסעיף הקטן ביותר)."
      en: "A unit of the budget. The budget is hierarchical: section (usually a ministry) → area → program → line item (the smallest unit)."
      ar: "وحدة من وحدات الميزانية. الميزانية مبنية بتسلسل هرمي: بند (عادةً وزارة) ← مجال ← برنامج ← بند فرعي (أصغر وحدة)."
      ru: "Единица бюджета. Бюджет устроен иерархически: раздел (обычно министерство) → область → программа → статья (наименьшая единица)."
      es: "Una unidad del presupuesto. El presupuesto es jerárquico: sección (normalmente un ministerio) → área → programa → partida (la unidad más pequeña)."
      fr: "Une unité du budget. Le budget est hiérarchique : section (généralement un ministère) → domaine → programme → ligne (la plus petite unité)."
    sourceUrl: "https://fs.knesset.gov.il/globaldocs/MMM/ff526b58-e9f7-e411-80c8-00155d010977/2_ff526b58-e9f7-e411-80c8-00155d010977_11_10372.pdf"
  - category: economy
    term: { he: "תקציב דו-שנתי", en: "Biennial budget", ar: "ميزانية لسنتين", ru: "Двухлетний бюджет", es: Presupuesto bienal, fr: Budget biennal }
    def:
      he: "תקציב הנקבע לשנתיים במקום לשנה אחת. בישראל נעשה בו שימוש בכמה ממשלות, בכל פעם באמצעות הוראת שעה בחוק היסוד."
      en: "A budget set for two years instead of one. Israel has used it under several governments, each time through a temporary amendment to the Basic Law."
      ar: "ميزانية تُحدَّد لسنتين بدلًا من سنة واحدة. استخدمتها عدة حكومات في إسرائيل، في كل مرة عبر تعديل مؤقت لقانون الأساس."
      ru: "Бюджет, принимаемый на два года вместо одного. В Израиле к нему прибегали несколько правительств, каждый раз через временную поправку к Основному закону."
      es: "Un presupuesto fijado para dos años en lugar de uno. Israel lo ha usado con varios gobiernos, cada vez mediante una enmienda temporal a la Ley Básica."
      fr: "Un budget fixé pour deux ans au lieu d’un. Israël y a eu recours sous plusieurs gouvernements, chaque fois par un amendement temporaire à la Loi fondamentale."
    sourceUrl: "https://fs.knesset.gov.il/globaldocs/MMM/ff526b58-e9f7-e411-80c8-00155d010977/2_ff526b58-e9f7-e411-80c8-00155d010977_11_10372.pdf"

  # ---------- government ----------
  - category: government
    term: { he: "דמוקרטיה", en: "Democracy", ar: "الديمقراطية", ru: "Демократия", es: Democracia, fr: Démocratie }
    def:
      he: "שיטת ממשל שבה הכוח נובע מהעם — בעיקר באמצעות בחירות חופשיות והוגנות."
      en: "A system of government in which power comes from the people — mainly through free and fair elections."
      ar: "نظام حكم تنبع فيه السلطة من الشعب — أساسًا عبر انتخابات حرة ونزيهة."
      ru: "Система правления, при которой власть исходит от народа — прежде всего через свободные и честные выборы."
      es: Un sistema de gobierno en el que el poder emana del pueblo — sobre todo mediante elecciones libres y justas.
      fr: Un système de gouvernement où le pouvoir vient du peuple — principalement par des élections libres et équitables.
    sourceUrl: "https://www.un.org/en/global-issues/democracy"
  - category: government
    term: { he: "הפרדת רשויות", en: "Separation of powers", ar: "الفصل بين السلطات", ru: "Разделение властей", es: Separación de poderes, fr: Séparation des pouvoirs }
    def:
      he: "חלוקת הכוח בין שלוש רשויות — מחוקקת (הכנסת), מבצעת (הממשלה) ושופטת (בתי המשפט) — כדי לאזן ביניהן."
      en: "Dividing power between three branches — legislative (Knesset), executive (government) and judicial (courts) — to balance them."
      ar: "توزيع السلطة بين ثلاث سلطات — التشريعية (الكنيست) والتنفيذية (الحكومة) والقضائية (المحاكم) — لتحقيق التوازن بينها."
      ru: "Распределение власти между тремя ветвями — законодательной (Кнессет), исполнительной (правительство) и судебной (суды) — для баланса между ними."
      es: Dividir el poder entre tres ramas — legislativa (Knéset), ejecutiva (Gobierno) y judicial (tribunales) — para equilibrarlas.
      fr: Répartir le pouvoir entre trois branches — législative (Knesset), exécutive (gouvernement) et judiciaire (tribunaux) — pour les équilibrer.
    sourceUrl: "https://main.knesset.gov.il/About/Lexicon/Pages/separation-powers.aspx"
  - category: government
    term: { he: "שלטון החוק", en: "Rule of law", ar: "سيادة القانون", ru: "Верховенство закона", es: Estado de derecho, fr: État de droit }
    def:
      he: "העיקרון שהכול — כולל הממשלה ונבחרי הציבור — כפופים לחוק באופן שווה."
      en: "The principle that everyone — including the government and elected officials — is equally subject to the law."
      ar: "المبدأ القائل إن الجميع — بمن فيهم الحكومة ومنتخَبو الجمهور — خاضعون للقانون بالتساوي."
      ru: "Принцип, согласно которому все — включая правительство и избранных представителей — в равной мере подчиняются закону."
      es: El principio de que todos — incluidos el Gobierno y los cargos electos — están igualmente sometidos a la ley.
      fr: Le principe selon lequel tous — y compris le gouvernement et les élus — sont également soumis à la loi.
    sourceUrl: "https://www.un.org/ruleoflaw/en/what-is-the-rule-of-law"
  - category: government
    term: { he: "ביקורת שיפוטית", en: "Judicial review", ar: "الرقابة القضائية", ru: "Судебный контроль", es: Control judicial, fr: Contrôle juridictionnel }
    def:
      he: "סמכות בית המשפט לבחון אם חוקים או החלטות ממשלה עומדים בחוקי היסוד, ולפסול אותם אם לא."
      en: "The court's power to check whether laws or government decisions comply with the Basic Laws, and to strike them down if not."
      ar: "صلاحية المحكمة في فحص ما إذا كانت القوانين أو قرارات الحكومة تتوافق مع قوانين الأساس، وإبطالها إن لم تكن كذلك."
      ru: "Полномочие суда проверять, соответствуют ли законы или решения правительства Основным законам, и отменять их, если нет."
      es: La facultad de los tribunales de comprobar si las leyes o las decisiones del Gobierno respetan las Leyes Fundamentales, y de anularlas si no lo hacen.
      fr: Le pouvoir des tribunaux de vérifier si les lois ou les décisions du gouvernement respectent les Lois fondamentales et, dans le cas contraire, de les annuler.
    sourceUrl: "https://www.britannica.com/topic/judicial-review"
  - category: government
    term: { he: "קואליציה", en: "Coalition", ar: "الائتلاف", ru: "Коалиция", es: Coalición, fr: Coalition }
    def:
      he: "הסיעות שחתמו על הסכמים המחייבים אותן לתמוך בממשלה בכנסת. בדרך כלל יש להן יחד רוב — 61 חברי כנסת או יותר מתוך 120."
      en: "The factions that have signed agreements obliging them to support the government in the Knesset. Usually together they hold a majority — 61 or more of the 120 MKs."
      ar: "الكتل التي وقّعت اتفاقات تُلزمها بدعم الحكومة في الكنيست. وعادةً ما تملك معًا أغلبية — 61 عضو كنيست أو أكثر من أصل 120."
      ru: "Фракции, подписавшие соглашения, которые обязывают их поддерживать правительство в Кнессете. Обычно вместе у них большинство — 61 депутат или больше из 120."
      es: "Las facciones que han firmado acuerdos que las obligan a apoyar al Gobierno en la Knéset. Normalmente suman juntas una mayoría: 61 o más de los 120 diputados."
      fr: "Les factions qui ont signé des accords les obligeant à soutenir le gouvernement à la Knesset. En général, elles détiennent ensemble une majorité — 61 députés ou plus sur 120."
    sourceUrl: "https://main.knesset.gov.il/About/Lexicon/Pages/coalition.aspx"
  - category: government
    term: { he: "אופוזיציה", en: "Opposition", ar: "المعارضة", ru: "Оппозиция", es: Oposición, fr: Opposition }
    def:
      he: "הסיעות שאינן בקואליציה ואינן חלק מהממשלה; תפקידן לבקר ולפקח על הממשלה."
      en: "The factions not in the coalition and not part of the government; their role is to criticize and oversee it."
      ar: "الكتل التي ليست في الائتلاف وليست جزءًا من الحكومة؛ ودورها انتقاد الحكومة والرقابة عليها."
      ru: "Фракции, не входящие в коалицию и в правительство; их роль — критиковать правительство и контролировать его."
      es: Las facciones que no están en la coalición ni forman parte del Gobierno; su papel es criticarlo y controlarlo.
      fr: Les factions qui ne sont pas dans la coalition ni au gouvernement ; leur rôle est de le critiquer et de le contrôler.
    sourceUrl: "https://main.knesset.gov.il/About/Lexicon/Pages/opposition.aspx"
  - category: government
    term: { he: "אי־אמון", en: "No confidence", ar: "حجب الثقة", ru: "Вотум недоверия", es: Moción de censura, fr: Motion de censure }
    def:
      he: "הצבעה שמטרתה להפיל את הממשלה. בישראל נדרש \"אי־אמון קונסטרוקטיבי\" — רוב של 61 שתומך בממשלה חלופית."
      en: "A vote aimed at toppling the government. In Israel a \"constructive\" no-confidence is required — 61 MKs backing an alternative government."
      ar: "تصويت يهدف إلى إسقاط الحكومة. في إسرائيل يُشترط «حجب ثقة بنّاء» — 61 عضو كنيست يؤيدون حكومة بديلة."
      ru: "Голосование с целью отправить правительство в отставку. В Израиле требуется «конструктивный» вотум недоверия — 61 депутат должен поддержать альтернативное правительство."
      es: Una votación destinada a derribar al Gobierno. En Israel se exige una censura «constructiva» — 61 diputados que respalden un gobierno alternativo.
      fr: Un vote visant à renverser le gouvernement. En Israël, une censure « constructive » est requise — 61 députés soutenant un gouvernement alternatif.
    sourceUrl: "https://main.knesset.gov.il/About/Lexicon/Pages/NoConfidence.aspx"
  - category: government
    term: { he: "החוק הנורווגי", en: "The Norwegian Law", ar: "القانون النرويجي", ru: "Норвежский закон", es: La Ley Noruega, fr: La « loi norvégienne » }
    def:
      he: "חוק שמאפשר לשר או לסגן שר להתפטר ממושבו בכנסת ולהתפנות לעבודת הממשלה, והמועמד הבא ברשימת מפלגתו נכנס לכנסת במקומו. אם השר מסיים את כהונתו הוא יכול לחזור למושבו. לכן יכולים לכהן בכנסת יותר מ-120 אנשים לאורך הקדנציה, אף שבכל רגע יש 120 חברי כנסת מכהנים."
      en: "A law that lets a minister or deputy minister resign their Knesset seat to focus on government work, with the next candidate on their party list entering the Knesset in their place. If the minister later leaves office they can reclaim their seat. This is why more than 120 people can serve over a term, even though there are always exactly 120 sitting members at any moment."
      ar: "قانون يتيح للوزير أو نائب الوزير الاستقالة من مقعده في الكنيست للتفرّغ لعمل الحكومة، فيدخل المرشح التالي في قائمة حزبه إلى الكنيست مكانه. وإذا أنهى الوزير منصبه لاحقًا يمكنه استعادة مقعده. لذلك يمكن أن يخدم في الكنيست أكثر من 120 شخصًا خلال الولاية، رغم أن عدد الأعضاء في كل لحظة هو 120 بالضبط."
      ru: "Закон, позволяющий министру или заместителю министра сложить мандат в Кнессете, чтобы сосредоточиться на работе в правительстве; его место занимает следующий кандидат из списка партии. Если министр потом покидает должность, он может вернуть себе мандат. Поэтому за каденцию в Кнессете может побывать больше 120 человек, хотя в каждый момент депутатов ровно 120."
      es: Una ley que permite a un ministro o viceministro renunciar a su escaño en la Knéset para dedicarse al Gobierno, y el siguiente candidato de su lista entra en su lugar. Si el ministro deja luego el cargo, puede recuperar el escaño. Por eso más de 120 personas pueden ser diputados en una legislatura, aunque siempre haya exactamente 120 miembros en funciones.
      fr: Une loi qui permet à un ministre ou vice-ministre de démissionner de son siège à la Knesset pour se consacrer au gouvernement, le candidat suivant de sa liste entrant à sa place. Si le ministre quitte ensuite ses fonctions, il peut reprendre son siège. C’est pourquoi plus de 120 personnes peuvent siéger au cours d’une législature, alors qu’il y a toujours exactement 120 députés en exercice.
    sourceUrl: "https://www.idi.org.il/articles/38757"
  - category: government
    term: { he: "לובי / שדלן", en: "Lobby / lobbyist", ar: "لوبي (جماعة ضغط) / لوبيست", ru: "Лобби / лоббист", es: Lobby / lobista, fr: Lobby / lobbyiste }
    def:
      he: "לובי הוא קבוצת אינטרס שמנסה להשפיע על מחוקקים. שדלן (לוביסט) הוא אדם שמקבל תשלום מלקוח — חברה, ארגון או קבוצה — כדי לקדם את האינטרסים שלו מול חברי הכנסת והוועדות. בישראל שדלנים חייבים להירשם ולהצהיר את לקוחותיהם."
      en: "A lobby is an interest group that tries to influence lawmakers. A lobbyist is a person paid by a client — a company, organization or group — to advance its interests with MKs and committees. In Israel lobbyists must register and disclose their clients."
      ar: "اللوبي مجموعة مصالح تحاول التأثير في المشرّعين. واللوبيست شخص يتقاضى أجرًا من زبون — شركة أو منظمة أو مجموعة — لتعزيز مصالحه لدى أعضاء الكنيست واللجان. وفي إسرائيل يجب على اللوبيين التسجيل والإفصاح عن زبائنهم."
      ru: "Лобби — группа интересов, пытающаяся влиять на законодателей. Лоббист — человек, которому клиент (компания, организация или группа) платит за продвижение своих интересов перед депутатами и комиссиями. В Израиле лоббисты обязаны регистрироваться и раскрывать своих клиентов."
      es: Un lobby es un grupo de interés que intenta influir en los legisladores. Un lobista es una persona pagada por un cliente — una empresa, organización o grupo — para promover sus intereses ante los diputados y las comisiones. En Israel los lobistas deben registrarse y declarar a sus clientes.
      fr: Un lobby est un groupe d’intérêt qui tente d’influencer les législateurs. Un lobbyiste est une personne payée par un client — entreprise, organisation ou groupe — pour défendre ses intérêts auprès des députés et des commissions. En Israël, les lobbyistes doivent s’inscrire et déclarer leurs clients.
    sourceUrl: "https://main.knesset.gov.il/About/Lexicon/Pages/lobbyist.aspx"
  - category: government
    term: { he: "תרומה מישות מדינית זרה", en: "Foreign (state) donation", ar: "تبرّع من كيان سياسي أجنبي", ru: "Пожертвование от иностранного государственного образования", es: Donación extranjera (de un Estado), fr: Don étranger (d’un État) }
    def:
      he: "תרומה לעמותה או לארגון בישראל ממדינה זרה או מגוף ציבורי זר. החוק מחייב ארגונים לדווח על תרומות כאלה, כדי שהציבור יידע מי מממן פעילות פוליטית או ציבורית ולמה. הדיווחים מתפרסמים אצל רשם העמותות."
      en: "A donation to an Israeli NGO or organization from a foreign state or foreign public body. The law requires organizations to report such donations so the public can see who funds political or public activity and for what. The reports are published by the Registrar of Non-Profits."
      ar: "تبرّع لجمعية أو منظمة في إسرائيل من دولة أجنبية أو هيئة عامة أجنبية. ويُلزم القانون المنظمات بالإبلاغ عن مثل هذه التبرعات، ليعرف الجمهور من يموّل النشاط السياسي أو العام ولأي غرض. وتُنشر التقارير لدى مسجّل الجمعيات."
      ru: "Пожертвование израильской НКО или организации от иностранного государства или иностранного государственного органа. Закон обязывает организации сообщать о таких пожертвованиях, чтобы общество знало, кто финансирует политическую или общественную деятельность и зачем. Отчёты публикует регистратор некоммерческих организаций."
      es: Una donación a una ONG u organización israelí procedente de un Estado extranjero o de un organismo público extranjero. La ley obliga a las organizaciones a declarar esas donaciones para que el público sepa quién financia la actividad política o pública y para qué. Los informes los publica el Registro de Asociaciones.
      fr: Un don à une ONG ou organisation israélienne provenant d’un État étranger ou d’un organisme public étranger. La loi oblige les organisations à déclarer ces dons afin que le public sache qui finance l’activité politique ou publique et dans quel but. Les rapports sont publiés par le Registre des associations.
    sourceUrl: "https://www.gov.il/he/service/quarterly_report_about_foreign_entity_donation"

  # ---------- electoral ----------
  - category: electoral
    term: { he: "סיעה / רשימה", en: "Faction / list", ar: "كتلة / قائمة", ru: "Фракция / список", es: Facción / lista, fr: Faction / liste }
    def:
      he: "קבוצת חברי כנסת מאותה מפלגה או ברית מפלגות. \"רשימה\" היא מי שמתמודדת בבחירות."
      en: "A group of MKs from the same party or alliance. A \"list\" is what runs in the election."
      ar: "مجموعة أعضاء كنيست من الحزب نفسه أو من تحالف أحزاب. و«القائمة» هي ما يخوض الانتخابات."
      ru: "Группа депутатов от одной партии или союза партий. «Список» — это то, что идёт на выборы."
      es: Un grupo de diputados del mismo partido o alianza. La «lista» es lo que se presenta a las elecciones.
      fr: Un groupe de députés du même parti ou de la même alliance. La « liste » est ce qui se présente aux élections.
    sourceUrl: "https://main.knesset.gov.il/About/Lexicon/Pages/FactionIntroduction.aspx"
  - category: electoral
    term: { he: "ייצוג יחסי", en: "Proportional representation", ar: "التمثيل النسبي", ru: "Пропорциональное представительство", es: Representación proporcional, fr: Représentation proportionnelle }
    def:
      he: "שיטת בחירות שבה כל רשימה מקבלת מנדטים ביחס לאחוז הקולות שקיבלה. כל הארץ היא מחוז בחירה אחד."
      en: "An electoral system where each list gets seats in proportion to its share of the vote. The whole country is one constituency."
      ar: "نظام انتخابي تحصل فيه كل قائمة على مقاعد بنسبة حصتها من الأصوات. والبلاد كلها دائرة انتخابية واحدة."
      ru: "Избирательная система, при которой каждый список получает мандаты пропорционально своей доле голосов. Вся страна — один избирательный округ."
      es: Un sistema electoral en el que cada lista obtiene escaños en proporción a su parte de los votos. Todo el país es una sola circunscripción.
      fr: Un système électoral où chaque liste obtient des sièges en proportion de sa part des voix. Le pays entier forme une seule circonscription.
    sourceUrl: "https://main.knesset.gov.il/About/Lexicon/Pages/heb_mimshal_beh.aspx"
  - category: electoral
    term: { he: "אחוז החסימה", en: "Electoral threshold", ar: "نسبة الحسم", ru: "Электоральный барьер", es: Umbral electoral, fr: Seuil électoral }
    def:
      he: "אחוז הקולות המינימלי שרשימה חייבת לעבור כדי להיכנס לכנסת. בישראל הוא 3.25%."
      en: "The minimum share of the vote a list must pass to enter the Knesset. In Israel it is 3.25%."
      ar: "الحد الأدنى من نسبة الأصوات الذي يجب أن تتجاوزه القائمة كي تدخل الكنيست. وهو في إسرائيل 3.25%."
      ru: "Минимальная доля голосов, которую список должен преодолеть, чтобы пройти в Кнессет. В Израиле — 3,25%."
      es: El porcentaje mínimo de votos que una lista debe superar para entrar en la Knéset. En Israel es del 3,25 %.
      fr: La part minimale des voix qu’une liste doit franchir pour entrer à la Knesset. En Israël, elle est de 3,25 %.
    sourceUrl: "https://main.knesset.gov.il/About/Lexicon/Pages/qualifying-threshold.aspx"
  - category: electoral
    term: { he: "אות הפתק", en: "Ballot letters", ar: "أحرف ورقة الاقتراع", ru: "Буквы бюллетеня", es: Letras de la papeleta, fr: Lettres du bulletin }
    def:
      he: "האותיות שעל פתק ההצבעה המזהות כל רשימה (למשל מחל לליכוד). מטילים את הפתק במעטפה."
      en: "The letters on the ballot slip that identify each list (e.g. מחל for Likud). You place the slip in the envelope."
      ar: "الأحرف المطبوعة على ورقة الاقتراع التي تميّز كل قائمة (مثل מחל لليكود). وتُوضع الورقة في المغلّف."
      ru: "Буквы на избирательном бюллетене, обозначающие каждый список (например, מחל у Ликуда). Бюллетень кладут в конверт."
      es: Las letras de la papeleta que identifican a cada lista (por ejemplo, מחל para el Likud). La papeleta se introduce en el sobre.
      fr: Les lettres du bulletin qui identifient chaque liste (par exemple מחל pour le Likoud). On glisse le bulletin dans l’enveloppe.
    sourceUrl: "https://www.gov.il/he/pages/elections_faq"
  # ---------- israel-specific ----------
  - category: israel
    term: { he: "ציונות", en: "Zionism", ar: "الصهيونية", ru: "Сионизм", es: Sionismo, fr: Sionisme }
    def:
      he: "התנועה הלאומית של העם היהודי, ששאפה להקים ולקיים מדינה יהודית בארץ ישראל."
      en: "The national movement of the Jewish people that sought to establish and sustain a Jewish state in the Land of Israel."
      ar: "الحركة القومية للشعب اليهودي، التي سعت إلى إقامة دولة يهودية في أرض إسرائيل والحفاظ عليها."
      ru: "Национальное движение еврейского народа, стремившееся создать и сохранить еврейское государство в Земле Израиля."
      es: El movimiento nacional del pueblo judío que buscó establecer y mantener un Estado judío en la Tierra de Israel.
      fr: Le mouvement national du peuple juif qui a cherché à établir et à maintenir un État juif en Terre d’Israël.
    sourceUrl: "https://www.britannica.com/topic/Zionism"
  - category: israel
    term: { he: "ציונות דתית", en: "Religious Zionism", ar: "الصهيونية الدينية", ru: "Религиозный сионизм", es: Sionismo religioso, fr: Sionisme religieux }
    def:
      he: "זרם המשלב ציונות עם אורח חיים דתי־יהודי, ורואה במדינה ערך דתי ולאומי כאחד."
      en: "A stream combining Zionism with a religious Jewish lifestyle, seeing the state as both a religious and national value."
      ar: "تيار يجمع بين الصهيونية ونمط حياة يهودي ديني، ويرى في الدولة قيمة دينية وقومية في آن."
      ru: "Течение, соединяющее сионизм с религиозным еврейским образом жизни и видящее в государстве одновременно религиозную и национальную ценность."
      es: Una corriente que combina el sionismo con un modo de vida judío religioso, y ve el Estado como un valor a la vez religioso y nacional.
      fr: Un courant qui combine le sionisme et un mode de vie juif religieux, voyant dans l’État une valeur à la fois religieuse et nationale.
    sourceUrl: "https://catalog.archives.gov.il/site/chapter/religious-zionism/"
  - category: israel
    term: { he: "חרדים", en: "Haredim (ultra-Orthodox)", ar: "الحريديم (اليهود المتشددون دينيًا)", ru: "Харедим (ультраортодоксы)", es: Jaredíes (ultraortodoxos), fr: Haredim (ultra-orthodoxes) }
    def:
      he: "ציבור יהודי שומר מצוות באדיקות, השומר על אורח חיים מסורתי ומופרד ברובו מהחברה החילונית."
      en: "Strictly observant Jews who maintain a traditional lifestyle, largely separate from secular society."
      ar: "يهود ملتزمون بالفرائض الدينية بصرامة، يحافظون على نمط حياة تقليدي منفصل في معظمه عن المجتمع العلماني."
      ru: "Строго соблюдающие заповеди евреи, сохраняющие традиционный образ жизни, во многом обособленный от светского общества."
      es: Judíos estrictamente observantes que mantienen un modo de vida tradicional, en gran medida separado de la sociedad laica.
      fr: Des Juifs strictement pratiquants qui conservent un mode de vie traditionnel, largement séparé de la société laïque.
    sourceUrl: "https://www.idi.org.il/books/17580"
  - category: israel
    term: { he: "סטטוס קוו", en: "Status quo (religion & state)", ar: "الوضع القائم (الستاتوس كفو) في الدين والدولة", ru: "Статус-кво (религия и государство)", es: Statu quo (religión y Estado), fr: Statu quo (religion et État) }
    def:
      he: "ההסדר בנושאי דת ומדינה בישראל (שבת, כשרות, נישואין, גיור ועוד). ראשיתו במכתב של בן-גוריון מ-1947, והיום הוא שילוב של חוקים ושל נוהג שהשתרש."
      en: "The arrangement governing religion-and-state matters in Israel (Sabbath, kashrut, marriage, conversion and more). It goes back to a 1947 letter from Ben-Gurion and today mixes laws with long-standing practice."
      ar: "الترتيب الذي ينظّم شؤون الدين والدولة في إسرائيل (السبت، الكشروت، الزواج، التهويد وغيرها). تعود بدايته إلى رسالة من بن غوريون عام 1947، وهو اليوم مزيج من القوانين والممارسة الراسخة."
      ru: "Порядок, регулирующий вопросы религии и государства в Израиле (шаббат, кашрут, браки, гиюр и др.). Он восходит к письму Бен-Гуриона 1947 года и сегодня сочетает законы и устоявшуюся практику."
      es: "El arreglo que regula los asuntos de religión y Estado en Israel (Shabat, kashrut, matrimonio, conversión y más). Se remonta a una carta de Ben-Gurión de 1947 y hoy combina leyes y práctica consolidada."
      fr: "L’arrangement qui régit les questions de religion et d’État en Israël (shabbat, cacherout, mariage, conversion, etc.). Il remonte à une lettre de Ben Gourion de 1947 et mêle aujourd’hui lois et pratique établie."
    sourceUrl: "https://www.idi.org.il/articles/12264"
  - category: ideology
    term:
      he: סוציאל-דמוקרטיה
      en: Social democracy
      ar: "الديمقراطية الاجتماعية"
      ru: "Социал-демократия"
      es: Socialdemocracia
      fr: Social-démocratie
    def:
      he: גישה פוליטית המשלבת כלכלת שוק עם מדינת רווחה רחבה ושירותים ציבוריים, במטרה לצמצם אי-שוויון במסגרת המשטר הדמוקרטי.
      en: A political approach that combines a market economy with a broad welfare state and public services, aiming to reduce inequality within a democratic framework.
      ar: "نهج سياسي يجمع بين اقتصاد السوق ودولة رفاه واسعة وخدمات عامة، بهدف تقليص عدم المساواة ضمن إطار ديمقراطي."
      ru: "Политический подход, сочетающий рыночную экономику с широким социальным государством и общественными услугами ради сокращения неравенства в демократических рамках."
      es: Un enfoque político que combina la economía de mercado con un amplio Estado del bienestar y servicios públicos, con el objetivo de reducir la desigualdad dentro del marco democrático.
      fr: Une approche politique qui combine l’économie de marché avec un large État-providence et des services publics, afin de réduire les inégalités dans un cadre démocratique.
    sourceUrl: "https://www.britannica.com/topic/social-democracy"
  - category: ideology
    term:
      he: פשיזם
      en: Fascism
      ar: "الفاشية"
      ru: "Фашизм"
      es: Fascismo
      fr: Fascisme
    def:
      he: אידאולוגיה לאומנית סמכותנית מהמאה ה-20, המאדירה את המדינה והמנהיג, מדכאת התנגדות ושוללת דמוקרטיה ופלורליזם.
      en: An authoritarian, ultranationalist 20th-century ideology that glorifies the state and a single leader, suppresses opposition, and rejects democracy and pluralism.
      ar: "أيديولوجيا قومية متطرفة سلطوية من القرن العشرين، تمجّد الدولة والزعيم الواحد، وتقمع المعارضة، وترفض الديمقراطية والتعددية."
      ru: "Авторитарная ультранационалистическая идеология XX века, возвеличивающая государство и единоличного вождя, подавляющая оппозицию и отвергающая демократию и плюрализм."
      es: Una ideología autoritaria y ultranacionalista del siglo XX que glorifica al Estado y a un líder único, reprime a la oposición y rechaza la democracia y el pluralismo.
      fr: Une idéologie autoritaire et ultranationaliste du XXe siècle qui glorifie l’État et un chef unique, réprime l’opposition et rejette la démocratie et le pluralisme.
    sourceUrl: "https://www.britannica.com/topic/fascism"
  - category: ideology
    term:
      he: אנרכיזם
      en: Anarchism
      ar: "الأناركية (اللاسلطوية)"
      ru: "Анархизм"
      es: Anarquismo
      fr: Anarchisme
    def:
      he: אידאולוגיה השוללת שלטון כפוי והיררכיה, ודוגלת בארגון חברתי וולונטרי המבוסס על שיתוף פעולה חופשי בין בני אדם.
      en: An ideology that rejects coercive rule and hierarchy, advocating voluntary social organization based on free cooperation among people.
      ar: "أيديولوجيا ترفض الحكم القسري والتراتبية، وتدعو إلى تنظيم اجتماعي طوعي قائم على التعاون الحر بين الناس."
      ru: "Идеология, отвергающая принудительную власть и иерархию и выступающая за добровольную общественную организацию на основе свободного сотрудничества людей."
      es: Una ideología que rechaza el poder coercitivo y la jerarquía, y defiende una organización social voluntaria basada en la libre cooperación entre las personas.
      fr: Une idéologie qui rejette le pouvoir coercitif et la hiérarchie, et prône une organisation sociale volontaire fondée sur la libre coopération entre les personnes.
    sourceUrl: "https://plato.stanford.edu/entries/anarchism/"
  - category: ideology
    term:
      he: פמיניזם
      en: Feminism
      ar: "النسوية"
      ru: "Феминизм"
      es: Feminismo
      fr: Féminisme
    def:
      he: תנועה חברתית ופוליטית הפועלת לשוויון זכויות והזדמנויות בין נשים לגברים בכל תחומי החיים.
      en: A social and political movement that works for equal rights and opportunities between women and men in all areas of life.
      ar: "حركة اجتماعية وسياسية تعمل من أجل المساواة في الحقوق والفرص بين النساء والرجال في جميع مجالات الحياة."
      ru: "Общественное и политическое движение за равные права и возможности женщин и мужчин во всех сферах жизни."
      es: Un movimiento social y político que trabaja por la igualdad de derechos y oportunidades entre mujeres y hombres en todos los ámbitos de la vida.
      fr: Un mouvement social et politique qui œuvre pour l’égalité des droits et des chances entre femmes et hommes dans tous les domaines de la vie.
    sourceUrl: "https://www.britannica.com/topic/feminism"
  - category: spectrum
    term:
      he: ימין ושמאל פוליטיים
      en: Left–Right Political Spectrum
      ar: "الطيف السياسي بين اليسار واليمين"
      ru: "Политический спектр «левые — правые»"
      es: Espectro político izquierda–derecha
      fr: Échiquier politique gauche–droite
    def:
      he: 'דרך נפוצה למקם דעות פוליטיות על ציר אחד: ה"שמאל" נוטה לתמוך בשוויון חברתי ובמעורבות ממשלתית רחבה, וה"ימין" נוטה להדגיש מסורת, סדר ושוק חופשי. זהו כלי כללי לתיאור עמדות, ולא חלוקה מדויקת.'
      en: 'A common way to place political views along a single line: the "left" tends to favor social equality and a larger role for government, while the "right" tends to emphasize tradition, order, and free markets. It is a broad descriptive tool rather than a precise classification.'
      ar: "طريقة شائعة لوضع الآراء السياسية على خط واحد: «اليسار» يميل إلى دعم المساواة الاجتماعية ودور أكبر للحكومة، و«اليمين» يميل إلى التشديد على التقاليد والنظام والسوق الحرة. إنها أداة وصفية عامة وليست تصنيفًا دقيقًا."
      ru: "Распространённый способ расположить политические взгляды на одной оси: «левые» склонны поддерживать социальное равенство и большую роль государства, а «правые» — подчёркивать традиции, порядок и свободный рынок. Это общий описательный инструмент, а не точная классификация."
      es: "Una forma habitual de situar las opiniones políticas en una sola línea: la «izquierda» tiende a favorecer la igualdad social y un mayor papel del Estado, mientras la «derecha» tiende a subrayar la tradición, el orden y el libre mercado. Es una herramienta descriptiva amplia, no una clasificación precisa."
      fr: "Une façon courante de placer les opinions politiques sur une seule ligne : la « gauche » tend à privilégier l’égalité sociale et un rôle plus grand de l’État, tandis que la « droite » tend à insister sur la tradition, l’ordre et le marché libre. C’est un outil descriptif général, pas une classification précise."
    sourceUrl: "https://www.britannica.com/topic/political-spectrum"
  - category: spectrum
    term:
      he: מרכז פוליטי
      en: Centrism
      ar: "الوسطية"
      ru: "Центризм"
      es: Centrismo
      fr: Centrisme
    def:
      he: עמדה פוליטית הממוקמת בין הימין לשמאל, המעדיפה לרוב פשרה, מתינות ושינוי הדרגתי על פני שינויים קיצוניים לכל כיוון.
      en: A political position located between the left and the right, generally favoring compromise, moderation, and gradual change over sweeping shifts in either direction.
      ar: "موقف سياسي يقع بين اليسار واليمين، يفضّل عادةً التسوية والاعتدال والتغيير التدريجي على التحولات الجذرية في أي اتجاه."
      ru: "Политическая позиция между левыми и правыми, обычно предпочитающая компромисс, умеренность и постепенные перемены резким сдвигам в любую сторону."
      es: Una posición política situada entre la izquierda y la derecha, que en general prefiere el compromiso, la moderación y el cambio gradual a los giros bruscos en cualquier dirección.
      fr: Une position politique située entre la gauche et la droite, qui privilégie généralement le compromis, la modération et le changement progressif plutôt que des virages brusques dans un sens ou l’autre.
    sourceUrl: "https://www.britannica.com/dictionary/centrist"
  - category: spectrum
    term:
      he: מתינות פוליטית
      en: Moderate
      ar: "الاعتدال السياسي"
      ru: "Политическая умеренность"
      es: Moderado
      fr: Modéré
    def:
      he: אדם או עמדה הנמנעים מדעות קיצוניות ופתוחים לפשרה ולגישות מתונות, גם כאשר הם משתייכים לימין או לשמאל.
      en: A person or stance that avoids extreme positions and is open to compromise and tempered approaches, even when broadly aligned with the right or the left.
      ar: "شخص أو موقف يتجنّب الآراء المتطرفة ومنفتح على التسوية والمقاربات المعتدلة، حتى حين ينتمي بشكل عام إلى اليمين أو إلى اليسار."
      ru: "Человек или позиция, избегающие крайних взглядов и открытые к компромиссу и сдержанным подходам, даже если в целом тяготеют к правым или левым."
      es: Una persona o postura que evita las posiciones extremas y está abierta al compromiso y a enfoques mesurados, aunque se alinee en general con la derecha o la izquierda.
      fr: Une personne ou une position qui évite les extrêmes et reste ouverte au compromis et aux approches mesurées, même si elle se rattache globalement à la droite ou à la gauche.
    sourceUrl: "https://www.britannica.com/dictionary/moderate"
  - category: spectrum
    term:
      he: רדיקליזם פוליטי
      en: Political Radicalism
      ar: "الراديكالية السياسية"
      ru: "Политический радикализм"
      es: Radicalismo político
      fr: Radicalisme politique
    def:
      he: תמיכה בשינוי מהותי ועמוק של החברה או של השלטון מן היסוד, ולא רק בתיקונים קטנים. רדיקליות יכולה להופיע בכל קצה של המפה הפוליטית.
      en: Support for deep, fundamental change to society or government from the roots up, rather than small adjustments. Radicalism can appear at either end of the political map.
      ar: "تأييد تغيير جوهري وعميق في المجتمع أو في الحكم من الجذور، لا مجرد تعديلات صغيرة. ويمكن أن تظهر الراديكالية في أي من طرفي الخريطة السياسية."
      ru: "Поддержка глубоких, коренных изменений общества или власти, а не мелких поправок. Радикализм может встречаться на обоих краях политической карты."
      es: Apoyo a un cambio profundo y de raíz de la sociedad o del gobierno, en lugar de pequeños ajustes. El radicalismo puede aparecer en cualquiera de los dos extremos del mapa político.
      fr: Le soutien à un changement profond et fondamental de la société ou du gouvernement, depuis les racines, plutôt qu’à de petits ajustements. Le radicalisme peut apparaître aux deux extrémités de l’échiquier.
    sourceUrl: "https://www.britannica.com/dictionary/radicalism"
  - category: spectrum
    term:
      he: אקסטרמיזם (קיצוניות)
      en: Extremism
      ar: "التطرّف"
      ru: "Экстремизм"
      es: Extremismo
      fr: Extrémisme
    def:
      he: החזקה בעמדות רחוקות מאוד מן ההסכמה המקובלת בחברה, ולעיתים נכונות להשתמש באמצעים קיצוניים כדי לקדם אותן. המונח חל על קיצוניות בימין ובשמאל כאחד.
      en: Holding views that are far removed from a society's mainstream consensus, and sometimes a willingness to use extreme means to advance them. The term applies to extremes on both the right and the left.
      ar: "التمسّك بآراء بعيدة جدًا عن التوافق السائد في المجتمع، وأحيانًا الاستعداد لاستخدام وسائل متطرفة لتعزيزها. وينطبق المصطلح على التطرف في اليمين واليسار على حدّ سواء."
      ru: "Приверженность взглядам, очень далёким от общепринятого в обществе консенсуса, а иногда и готовность применять крайние средства для их продвижения. Термин относится к крайностям как справа, так и слева."
      es: Sostener opiniones muy alejadas del consenso mayoritario de una sociedad, y a veces la disposición a usar medios extremos para promoverlas. El término se aplica a los extremos tanto de la derecha como de la izquierda.
      fr: Le fait de défendre des opinions très éloignées du consensus dominant d’une société, parfois avec la volonté d’employer des moyens extrêmes pour les faire avancer. Le terme s’applique aux extrêmes de droite comme de gauche.
    sourceUrl: "https://www.britannica.com/dictionary/extremism"
  - category: spectrum
    term:
      he: פרוגרסיביות (קדמה)
      en: Progressivism
      ar: "التقدّمية"
      ru: "Прогрессивизм"
      es: Progresismo
      fr: Progressisme
    def:
      he: גישה פוליטית הדוגלת בקידום שינויים חברתיים ורפורמות במטרה לשפר את מצב החברה, לעיתים תוך הרחבת זכויות ושוויון.
      en: A political outlook that favors advancing social change and reforms in order to improve society, often by expanding rights and equality.
      ar: "نهج سياسي يدعو إلى دفع تغييرات وإصلاحات اجتماعية لتحسين أوضاع المجتمع، غالبًا عبر توسيع الحقوق والمساواة."
      ru: "Политический подход, выступающий за социальные перемены и реформы ради улучшения общества, часто через расширение прав и равенства."
      es: Una visión política que favorece el avance del cambio social y las reformas para mejorar la sociedad, a menudo ampliando los derechos y la igualdad.
      fr: Une vision politique qui favorise le changement social et les réformes pour améliorer la société, souvent en élargissant les droits et l’égalité.
    sourceUrl: "https://www.britannica.com/dictionary/progressive"
  - category: spectrum
    term:
      he: ריאקציה (שמרנות מחזירה)
      en: Reactionary
      ar: "الرجعية"
      ru: "Реакционность"
      es: Reaccionario
      fr: Réactionnaire
    def:
      he: עמדה השואפת לחזור למצב חברתי או פוליטי קודם שנתפס בעיני מצדדיה כעדיף, ומתנגדת לשינויים מתקדמים שהתרחשו.
      en: A position that seeks to return to an earlier social or political order seen by its supporters as preferable, opposing progressive changes that have already taken place.
      ar: "موقف يسعى إلى العودة إلى نظام اجتماعي أو سياسي سابق يراه مؤيدوه أفضل، ويعارض التغييرات التقدمية التي حدثت."
      ru: "Позиция, стремящаяся вернуться к прежнему общественному или политическому порядку, который её сторонники считают лучшим, и выступающая против уже произошедших прогрессивных изменений."
      es: Una posición que busca volver a un orden social o político anterior, que sus partidarios consideran preferible, oponiéndose a cambios progresistas ya producidos.
      fr: Une position qui cherche à revenir à un ordre social ou politique antérieur jugé préférable par ses partisans, en s’opposant aux changements progressistes déjà survenus.
    sourceUrl: "https://www.britannica.com/topic/conservatism"
  - category: government
    term:
      he: שיטה פרלמנטרית
      en: Parliamentary System
      ar: "النظام البرلماني"
      ru: "Парламентская система"
      es: Sistema parlamentario
      fr: Système parlementaire
    def:
      he: שיטת ממשל שבה הרשות המבצעת (הממשלה) נשענת על אמון הפרלמנט ויכולה לכהן רק כל עוד יש לה רוב התומך בה. ראש הממשלה מוביל את הממשלה ומגיע בדרך כלל מתוך הסיעה הגדולה בפרלמנט.
      en: A system of government in which the executive (the government) draws its authority from, and remains accountable to, the parliament, staying in office only as long as it holds the parliament's confidence. The head of government usually comes from the largest group in parliament.
      ar: "نظام حكم تستمدّ فيه السلطة التنفيذية (الحكومة) سلطتها من البرلمان وتبقى مسؤولة أمامه، ولا تبقى في الحكم إلا ما دامت تحظى بثقته. ويأتي رئيس الحكومة عادةً من الكتلة الأكبر في البرلمان."
      ru: "Система правления, при которой исполнительная власть (правительство) опирается на доверие парламента и подотчётна ему, оставаясь у власти лишь до тех пор, пока пользуется этим доверием. Глава правительства обычно представляет крупнейшую группу в парламенте."
      es: Un sistema de gobierno en el que el ejecutivo (el Gobierno) obtiene su autoridad del parlamento y responde ante él, y se mantiene en el cargo solo mientras conserva su confianza. El jefe de Gobierno suele proceder del grupo más grande del parlamento.
      fr: Un système de gouvernement où l’exécutif (le gouvernement) tire son autorité du parlement et lui rend des comptes, ne restant en fonction que tant qu’il conserve la confiance de celui-ci. Le chef du gouvernement vient généralement du groupe le plus nombreux au parlement.
    sourceUrl: "https://main.knesset.gov.il/About/Lexicon/Pages/GovernmentReform.aspx"
  - category: government
    term:
      he: שיטה נשיאותית
      en: Presidential System
      ar: "النظام الرئاسي"
      ru: "Президентская система"
      es: Sistema presidencial
      fr: Système présidentiel
    def:
      he: שיטת ממשל שבה הנשיא נבחר בנפרד מהפרלמנט ומשמש גם כראש המדינה וגם כראש הרשות המבצעת, ואינו תלוי באמון הפרלמנט כדי לכהן.
      en: A system of government in which the president is elected separately from the legislature and serves as both head of state and head of the executive branch, without depending on the legislature's confidence to stay in office.
      ar: "نظام حكم يُنتخب فيه الرئيس بشكل منفصل عن البرلمان، ويشغل منصبي رئيس الدولة ورئيس السلطة التنفيذية معًا، ولا يعتمد على ثقة البرلمان للبقاء في منصبه."
      ru: "Система правления, при которой президент избирается отдельно от парламента, является одновременно главой государства и главой исполнительной власти и не зависит от доверия парламента, чтобы оставаться в должности."
      es: Un sistema de gobierno en el que el presidente se elige por separado del poder legislativo y es a la vez jefe de Estado y jefe del ejecutivo, sin depender de la confianza del legislativo para seguir en el cargo.
      fr: Un système de gouvernement où le président est élu séparément du pouvoir législatif et cumule les fonctions de chef de l’État et de chef de l’exécutif, sans dépendre de la confiance du parlement pour rester en fonction.
    sourceUrl: "https://main.knesset.gov.il/About/Lexicon/Pages/GovernmentReform.aspx"
  - category: government
    term:
      he: איזונים ובלמים
      en: Checks and Balances
      ar: "الضوابط والتوازنات"
      ru: "Система сдержек и противовесов"
      es: Frenos y contrapesos
      fr: Freins et contrepoids
    def:
      he: מנגנונים שבהם כל רשות שלטונית מסוגלת לפקח על הרשויות האחרות ולהגביל אותן, כדי למנוע ריכוז כוח וניצול לרעה של סמכויות.
      en: Mechanisms by which each branch of government can monitor and limit the others, in order to prevent the concentration of power and abuse of authority.
      ar: "آليات تستطيع بها كل سلطة من سلطات الحكم مراقبة السلطات الأخرى والحدّ منها، لمنع تركّز القوة وإساءة استخدام الصلاحيات."
      ru: "Механизмы, с помощью которых каждая ветвь власти может контролировать и ограничивать другие, чтобы не допустить концентрации власти и злоупотребления полномочиями."
      es: Mecanismos por los que cada poder del Estado puede vigilar y limitar a los demás, para evitar la concentración de poder y los abusos de autoridad.
      fr: Des mécanismes par lesquels chaque branche du pouvoir peut surveiller et limiter les autres, afin d’éviter la concentration du pouvoir et les abus d’autorité.
    sourceUrl: "https://www.britannica.com/topic/checks-and-balances"
  - category: government
    term:
      he: ריבונות
      en: Sovereignty
      ar: "السيادة"
      ru: "Суверенитет"
      es: Soberanía
      fr: Souveraineté
    def:
      he: הסמכות העליונה והעצמאית של מדינה לשלוט בשטחה ובאזרחיה ולקבל החלטות ללא כפיפות לגורם חיצוני.
      en: The supreme and independent authority of a state to govern its territory and people and to make decisions free from outside control.
      ar: "السلطة العليا والمستقلة للدولة في حكم أراضيها وسكانها واتخاذ القرارات من دون خضوع لجهة خارجية."
      ru: "Верховная и независимая власть государства управлять своей территорией и населением и принимать решения без внешнего контроля."
      es: La autoridad suprema e independiente de un Estado para gobernar su territorio y su población y tomar decisiones sin control exterior.
      fr: L’autorité suprême et indépendante d’un État pour gouverner son territoire et sa population et prendre des décisions sans contrôle extérieur.
    sourceUrl: "https://www.britannica.com/topic/sovereignty"
  - category: government
    term:
      he: פדרליזם
      en: Federalism
      ar: "الفيدرالية"
      ru: "Федерализм"
      es: Federalismo
      fr: Fédéralisme
    def:
      he: שיטת ממשל שבה הכוח השלטוני מחולק בין שלטון מרכזי לבין יחידות אזוריות (כמו מדינות או מחוזות), שלכל אחת מהן סמכויות משלה המעוגנות בחוקה.
      en: A system of government in which power is divided between a central authority and regional units (such as states or provinces), each holding its own powers anchored in the constitution.
      ar: "نظام حكم تُقسَّم فيه السلطة بين حكومة مركزية ووحدات إقليمية (كالولايات أو المقاطعات)، لكل منها صلاحيات خاصة بها مكرّسة في الدستور."
      ru: "Система правления, при которой власть разделена между центральным правительством и региональными единицами (штатами, провинциями), каждая из которых обладает собственными полномочиями, закреплёнными в конституции."
      es: Un sistema de gobierno en el que el poder se divide entre una autoridad central y unidades regionales (como estados o provincias), cada una con competencias propias fijadas en la constitución.
      fr: Un système de gouvernement où le pouvoir est partagé entre une autorité centrale et des entités régionales (États, provinces), chacune disposant de compétences propres inscrites dans la constitution.
    sourceUrl: "https://www.britannica.com/topic/federalism"
  - category: government
    term:
      he: מדינה ריכוזית (אוניטרית)
      en: Unitary State
      ar: "الدولة المركزية (الموحّدة)"
      ru: "Унитарное государство"
      es: Estado unitario
      fr: État unitaire
    def:
      he: מדינה שבה הסמכות השלטונית מרוכזת בידי השלטון המרכזי, שיכול להאציל סמכויות ליחידות מקומיות אך גם לבטלן או לשנותן.
      en: A state in which governing authority is concentrated in the central government, which may delegate powers to local units but can also revoke or change them.
      ar: "دولة تتركّز فيها سلطة الحكم في يد الحكومة المركزية، التي يمكنها تفويض صلاحيات لوحدات محلية لكنها تستطيع أيضًا إلغاءها أو تغييرها."
      ru: "Государство, в котором власть сосредоточена у центрального правительства; оно может передавать полномочия местным единицам, но может и отменять или изменять их."
      es: Un Estado en el que la autoridad de gobierno se concentra en el gobierno central, que puede delegar competencias en entidades locales pero también revocarlas o modificarlas.
      fr: Un État où l’autorité de gouvernement est concentrée dans le gouvernement central, qui peut déléguer des compétences à des entités locales mais aussi les retirer ou les modifier.
    sourceUrl: "https://www.britannica.com/topic/unitary-state"
  - category: government
    term:
      he: ביורוקרטיה (מנהל ציבורי)
      en: Bureaucracy
      ar: "البيروقراطية (الإدارة العامة)"
      ru: "Бюрократия (государственное управление)"
      es: Burocracia
      fr: Bureaucratie
    def:
      he: מערך הפקידות והמשרדים הקבועים שמנהלים את עבודת המדינה בפועל ומיישמים את מדיניות הממשלה לפי כללים ונהלים אחידים.
      en: The system of permanent officials and offices that carry out the day-to-day work of the state and implement government policy according to uniform rules and procedures.
      ar: "منظومة الموظفين والمكاتب الدائمة التي تدير العمل اليومي للدولة وتنفّذ سياسات الحكومة وفق قواعد وإجراءات موحّدة."
      ru: "Система постоянных чиновников и учреждений, выполняющих повседневную работу государства и проводящих политику правительства по единым правилам и процедурам."
      es: El sistema de funcionarios y oficinas permanentes que realizan el trabajo diario del Estado y aplican la política del Gobierno según reglas y procedimientos uniformes.
      fr: Le système de fonctionnaires et d’administrations permanents qui assurent le travail quotidien de l’État et appliquent la politique du gouvernement selon des règles et procédures uniformes.
    sourceUrl: "https://www.britannica.com/topic/bureaucracy"
  - category: government
    term:
      he: ממשלת מעבר
      en: Caretaker Government
      ar: "حكومة انتقالية"
      ru: "Переходное правительство"
      es: Gobierno en funciones
      fr: Gouvernement de transition
    def:
      he: ממשלה זמנית המכהנת בתקופת ביניים — בדרך כלל לאחר פיזור הפרלמנט ועד הקמת ממשלה חדשה — ופעולותיה מוגבלות לרוב לניהול שוטף בלבד.
      en: A temporary government that serves during an interim period — usually after a parliament is dissolved and until a new government is formed — and whose actions are generally limited to routine administration.
      ar: "حكومة مؤقتة تعمل خلال فترة انتقالية — عادةً بعد حلّ البرلمان وحتى تشكيل حكومة جديدة — وتقتصر أعمالها في الغالب على تسيير الأمور الجارية."
      ru: "Временное правительство, действующее в переходный период — обычно после роспуска парламента и до формирования нового правительства; его действия, как правило, ограничены текущим управлением."
      es: Un gobierno temporal que ejerce durante un período de transición — normalmente tras la disolución del parlamento y hasta la formación de un nuevo gobierno — y cuya actuación se limita en general a la administración ordinaria.
      fr: Un gouvernement temporaire qui exerce pendant une période intérimaire — généralement après la dissolution du parlement et jusqu’à la formation d’un nouveau gouvernement — et dont l’action se limite en principe à la gestion courante.
    sourceUrl: "https://www.idi.org.il/articles/27002"
  - category: government
    term:
      he: פיזור הפרלמנט
      en: Dissolution of Parliament
      ar: "حلّ البرلمان"
      ru: "Роспуск парламента"
      es: Disolución del parlamento
      fr: Dissolution du parlement
    def:
      he: "סיום כהונתו של הפרלמנט הקיים לפני תום תקופתו או בסיומה, צעד שמוביל בדרך כלל לקיום בחירות חדשות. בישראל הכנסת שהתפזרה ממשיכה לכהן עד הישיבה הראשונה של הכנסת החדשה."
      en: "The termination of the current parliament's term, either before or at its end, a step that typically leads to the holding of new elections. In Israel, the dissolved Knesset keeps serving until the new Knesset first meets."
      ar: "إنهاء ولاية البرلمان القائم قبل انقضاء مدته أو عند انقضائها، وهي خطوة تؤدي عادةً إلى إجراء انتخابات جديدة. وفي إسرائيل يواصل الكنيست المنحلّ عمله حتى الجلسة الأولى للكنيست الجديد."
      ru: "Прекращение полномочий действующего парламента до окончания или по окончании его срока — шаг, который обычно ведёт к новым выборам. В Израиле распущенный Кнессет продолжает работу до первого заседания нового Кнессета."
      es: "El fin del mandato del parlamento en curso, antes o al término de su plazo, un paso que normalmente conduce a la celebración de nuevas elecciones. En Israel, la Knéset disuelta sigue en funciones hasta la primera sesión de la nueva Knéset."
      fr: "La fin du mandat du parlement en cours, avant ou à son terme, une étape qui conduit généralement à de nouvelles élections. En Israël, la Knesset dissoute continue de siéger jusqu’à la première séance de la nouvelle Knesset."
    sourceUrl: "https://www.idi.org.il/articles/39151"
  - category: electoral
    term:
      he: שיטת בחירות רובנית
      en: Majoritarian System
      ar: "النظام الانتخابي الأكثري"
      ru: "Мажоритарная система"
      es: Sistema mayoritario
      fr: Système majoritaire
    def:
      he: שיטת בחירות שבה הזוכה הוא המועמד או הרשימה שקיבלו את מרב הקולות, לרוב באזורי בחירה נפרדים. קולות שלא הביאו לניצחון אינם מתורגמים לייצוג.
      en: An electoral system in which the candidate or party with the most votes wins, usually within separate districts, so votes that do not produce a winner are not translated into representation.
      ar: "نظام انتخابي يفوز فيه المرشح أو الحزب الحاصل على أكبر عدد من الأصوات، عادةً ضمن دوائر منفصلة، فلا تُترجم الأصوات التي لم تُفضِ إلى فوز إلى تمثيل."
      ru: "Избирательная система, при которой побеждает кандидат или партия, набравшие больше всего голосов, обычно в отдельных округах, поэтому голоса, не принёсшие победы, не превращаются в представительство."
      es: Un sistema electoral en el que gana el candidato o partido con más votos, normalmente en distritos separados, de modo que los votos que no producen un ganador no se traducen en representación.
      fr: Un système électoral où le candidat ou le parti qui obtient le plus de voix l’emporte, généralement dans des circonscriptions distinctes, de sorte que les voix qui ne désignent pas un vainqueur ne se traduisent pas en représentation.
    sourceUrl: "https://main.knesset.gov.il/About/Lexicon/Pages/ElectoralReform.aspx"
  - category: electoral
    term:
      he: אזור בחירה
      en: Electoral District
      ar: "الدائرة الانتخابية"
      ru: "Избирательный округ"
      es: Distrito electoral
      fr: Circonscription électorale
    def:
      he: יחידה גאוגרפית שבה נבחר נציג אחד או יותר לפרלמנט. גבולות האזור קובעים אילו בוחרים מיוצגים על ידי אילו נבחרים.
      en: A geographic area that elects one or more representatives to a legislature. The district's boundaries determine which voters are represented by which elected officials.
      ar: "منطقة جغرافية تنتخب ممثلًا واحدًا أو أكثر للبرلمان. وتحدّد حدود الدائرة أيّ الناخبين يمثّلهم أيّ المنتخَبين."
      ru: "Географическая единица, избирающая одного или нескольких представителей в парламент. Границы округа определяют, каких избирателей представляют какие избранники."
      es: Un área geográfica que elige a uno o más representantes a un parlamento. Los límites del distrito determinan qué votantes son representados por qué cargos electos.
      fr: Une zone géographique qui élit un ou plusieurs représentants à un parlement. Les limites de la circonscription déterminent quels électeurs sont représentés par quels élus.
    sourceUrl: "https://main.knesset.gov.il/About/Lexicon/Pages/ElectoralReform.aspx"
  - category: electoral
    term:
      he: מנדט (מושב)
      en: Seat (Mandate)
      ar: "المقعد (المنداط)"
      ru: "Мандат (место)"
      es: Escaño (mandato)
      fr: Siège (mandat)
    def:
      he: מקום אחד בפרלמנט שמקבל נבחר ציבור. מספר המנדטים שזכתה בהם מפלגה משקף את כוחה היחסי בבית המחוקקים.
      en: A single place in parliament held by an elected representative. The number of seats a party wins reflects its relative strength in the legislature.
      ar: "مكان واحد في البرلمان يشغله ممثل منتخب. ويعكس عدد المقاعد التي يفوز بها حزب قوته النسبية في الهيئة التشريعية."
      ru: "Одно место в парламенте, которое занимает избранный представитель. Число мандатов, полученных партией, отражает её относительную силу в законодательном органе."
      es: Un puesto en el parlamento ocupado por un representante electo. El número de escaños que obtiene un partido refleja su fuerza relativa en el legislativo.
      fr: Une place au parlement occupée par un représentant élu. Le nombre de sièges qu’un parti remporte reflète sa force relative au sein du parlement.
    sourceUrl: "https://main.knesset.gov.il/About/Lexicon/Pages/heb_mimshal_beh.aspx"
  - category: electoral
    term:
      he: הסכם עודפי קולות (בדר-עופר)
      en: Surplus-Vote (Apparentment) Agreement
      ar: "اتفاقية فائض الأصوات (بدر-عوفر)"
      ru: "Соглашение об излишках голосов (метод Бадера — Офера)"
      es: Acuerdo de votos sobrantes (apparentement)
      fr: Accord de report des voix restantes (apparentement)
    def:
      he: הסכם בין שתי רשימות לחלק ביניהן את הקולות העודפים שלא הספיקו למנדט שלם, כדי למצותם בצורה טובה יותר. בישראל הוא מיושם בשיטת בדר-עופר.
      en: An agreement between two electoral lists to pool the leftover votes that did not add up to a full seat, so those votes are used more efficiently. In Israel it is applied through the Bader-Ofer method.
      ar: "اتفاق بين قائمتين انتخابيتين على تجميع الأصوات الفائضة التي لم تبلغ مقعدًا كاملًا، كي تُستغلّ على نحو أفضل. وفي إسرائيل يُطبّق بطريقة بدر-عوفر."
      ru: "Соглашение между двумя избирательными списками об объединении оставшихся голосов, которых не хватило на целый мандат, чтобы использовать их эффективнее. В Израиле оно применяется по методу Бадера — Офера."
      es: Un acuerdo entre dos listas electorales para sumar los votos restantes que no completaron un escaño entero, de modo que se aprovechen mejor. En Israel se aplica mediante el método Bader-Ofer.
      fr: Un accord entre deux listes électorales pour mettre en commun les voix restantes qui n’ont pas suffi à un siège entier, afin de mieux les utiliser. En Israël, il s’applique par la méthode Bader-Ofer.
    sourceUrl: "https://main.knesset.gov.il/About/Lexicon/Pages/seats.aspx"
  - category: electoral
    term:
      he: בחירות מקדימות (פריימריז)
      en: Primary Election
      ar: "الانتخابات التمهيدية (البرايمريز)"
      ru: "Праймериз"
      es: Primarias
      fr: Primaires
    def:
      he: הליך פנימי שבו חברי מפלגה בוחרים את מועמדיה לקראת הבחירות הכלליות, כגון רשימת מועמדיה לפרלמנט. כך נקבעת זהות הנציגים שתציע המפלגה.
      en: An internal process in which a party's members select its candidates ahead of the general election, such as its list of candidates for parliament. It determines who the party will field as its representatives.
      ar: "إجراء داخلي يختار فيه أعضاء الحزب مرشحيه قبل الانتخابات العامة، مثل قائمة مرشحيه للبرلمان. وهكذا تتحدّد هوية الممثلين الذين سيقدّمهم الحزب."
      ru: "Внутренняя процедура, в ходе которой члены партии выбирают её кандидатов перед всеобщими выборами, например её список в парламент. Так определяется, кого партия выдвинет своими представителями."
      es: Un proceso interno en el que los miembros de un partido eligen a sus candidatos antes de las elecciones generales, por ejemplo su lista de candidatos al parlamento. Determina a quién presentará el partido como representantes.
      fr: Un processus interne par lequel les membres d’un parti choisissent ses candidats avant les élections générales, par exemple sa liste de candidats au parlement. Il détermine qui le parti présentera comme représentants.
    sourceUrl: "https://main.knesset.gov.il/About/Lexicon/Pages/heb_mimshal_beh.aspx"
  - category: electoral
    term:
      he: מדגם בקלפי (אקזיט פול)
      en: Exit Poll
      ar: "استطلاع الخروج من الصناديق (إكزيت بول)"
      ru: "Экзитпол"
      es: Encuesta a boca de urna (exit poll)
      fr: Sondage à la sortie des urnes
    def:
      he: סקר הנערך ביום הבחירות בקרב מצביעים מיד לאחר שהצביעו, כדי לאמוד את התוצאות לפני הספירה הרשמית. זוהי הערכה בלבד ולא התוצאה הסופית.
      en: A survey conducted on election day among voters right after they cast their ballots, used to estimate the results before the official count. It is only an estimate, not the final outcome.
      ar: "استطلاع يُجرى يوم الانتخابات بين المقترعين فور إدلائهم بأصواتهم، لتقدير النتائج قبل الفرز الرسمي. وهو تقدير فقط وليس النتيجة النهائية."
      ru: "Опрос, проводимый в день выборов среди избирателей сразу после голосования, чтобы оценить результаты до официального подсчёта. Это лишь оценка, а не окончательный итог."
      es: Un sondeo realizado el día de las elecciones entre votantes justo después de votar, usado para estimar los resultados antes del recuento oficial. Es solo una estimación, no el resultado final.
      fr: Un sondage réalisé le jour des élections auprès des électeurs juste après leur vote, pour estimer les résultats avant le dépouillement officiel. Ce n’est qu’une estimation, pas le résultat définitif.
    sourceUrl: "https://www.britannica.com/dictionary/exit-poll"
  - category: electoral
    term:
      he: אחוז הצבעה
      en: Voter Turnout
      ar: "نسبة التصويت"
      ru: "Явка избирателей"
      es: Participación electoral
      fr: Taux de participation
    def:
      he: שיעור בעלי זכות הבחירה שאכן הצביעו בבחירות, מתוך כלל הזכאים להצביע. זהו מדד מרכזי למידת ההשתתפות הציבורית בבחירות.
      en: The share of eligible voters who actually cast a ballot in an election, out of all those entitled to vote. It is a key measure of public participation in the vote.
      ar: "نسبة أصحاب حق الاقتراع الذين صوّتوا فعلًا في الانتخابات من بين جميع المستحقين. وهي مقياس أساسي لمدى المشاركة الشعبية في الانتخابات."
      ru: "Доля имеющих право голоса, которые действительно проголосовали, от общего числа избирателей. Ключевой показатель участия общества в выборах."
      es: La proporción de electores con derecho a voto que efectivamente votan en unas elecciones, sobre el total de personas con derecho a voto. Es una medida clave de la participación pública en la votación.
      fr: La part des électeurs inscrits qui votent effectivement lors d’une élection, sur l’ensemble des personnes ayant le droit de vote. C’est une mesure clé de la participation du public au scrutin.
    sourceUrl: "https://www.cbs.gov.il/he/publications/doclib/2022/1873_well_being_2021/prt06_2_h.pdf"
  - category: electoral
    term:
      he: זכות בחירה
      en: Suffrage
      ar: "حق الاقتراع"
      ru: "Избирательное право"
      es: Sufragio
      fr: Suffrage
    def:
      he: הזכות החוקית של אדם להצביע בבחירות. הרחבת זכות הבחירה לכלל האוכלוסייה הבוגרת היא עיקרון יסוד בדמוקרטיה מודרנית.
      en: The legal right of a person to vote in elections. Extending the right to vote to all adults is a foundational principle of modern democracy.
      ar: "الحق القانوني للإنسان في التصويت في الانتخابات. وتوسيع حق الاقتراع ليشمل جميع البالغين مبدأ أساسي في الديمقراطية الحديثة."
      ru: "Законное право человека голосовать на выборах. Распространение избирательного права на всё взрослое население — основополагающий принцип современной демократии."
      es: El derecho legal de una persona a votar en las elecciones. Extender el derecho de voto a todos los adultos es un principio fundamental de la democracia moderna.
      fr: Le droit légal d’une personne de voter aux élections. L’extension du droit de vote à tous les adultes est un principe fondateur de la démocratie moderne.
    sourceUrl: "https://www.britannica.com/topic/suffrage"
  - category: electoral
    term:
      he: ניפוח גבולות בחירה (ג'רימנדרינג)
      en: Gerrymandering
      ar: "التلاعب بحدود الدوائر (الجيريماندرينغ)"
      ru: "Джерримендеринг"
      es: Gerrymandering
      fr: Gerrymandering (charcutage électoral)
    def:
      he: התווייה מכוונת של גבולות אזורי בחירה כדי להיטיב עם צד פוליטי מסוים. השיטה עשויה לעוות את היחס בין הקולות לבין מספר הנבחרים.
      en: Deliberately drawing the boundaries of electoral districts to favor a particular political side. The practice can distort the relationship between votes cast and the number of representatives elected.
      ar: "رسم متعمّد لحدود الدوائر الانتخابية لصالح طرف سياسي معيّن. وقد يشوّه ذلك العلاقة بين الأصوات وعدد المنتخَبين."
      ru: "Намеренная нарезка границ избирательных округов в пользу определённой политической стороны. Это может искажать соотношение между поданными голосами и числом избранных представителей."
      es: Trazar deliberadamente los límites de los distritos electorales para favorecer a un bando político. La práctica puede distorsionar la relación entre los votos emitidos y el número de representantes elegidos.
      fr: Le tracé délibéré des limites des circonscriptions pour favoriser un camp politique. Cette pratique peut fausser le rapport entre les voix exprimées et le nombre de représentants élus.
    sourceUrl: "https://www.britannica.com/topic/gerrymandering"
  - category: electoral
    term:
      he: בחירות חוזרות (בחירות ביניים)
      en: By-election
      ar: "انتخابات فرعية (تكميلية)"
      ru: "Дополнительные выборы"
      es: Elección parcial
      fr: Élection partielle
    def:
      he: בחירות נקודתיות הנערכות כדי לאייש מושב יחיד שהתפנה בין מערכות בחירות כלליות, למשל עקב התפטרות או מותו של נבחר. הן אינן בחירות לכלל הפרלמנט.
      en: A targeted election held to fill a single seat that became vacant between general elections, for example due to a representative's resignation or death. It is not an election for the entire parliament.
      ar: "انتخابات محدودة تُجرى لملء مقعد واحد شغر بين دورتي انتخابات عامة، مثلًا بسبب استقالة ممثل منتخب أو وفاته. وهي ليست انتخابات للبرلمان كله."
      ru: "Выборы, проводимые, чтобы заполнить одно место, освободившееся между всеобщими выборами, например из-за отставки или смерти избранного представителя. Это не выборы всего парламента."
      es: Una elección específica para cubrir un solo escaño que quedó vacante entre elecciones generales, por ejemplo por la renuncia o el fallecimiento de un representante. No es una elección para todo el parlamento.
      fr: Une élection ciblée organisée pour pourvoir un seul siège devenu vacant entre deux élections générales, par exemple à la suite de la démission ou du décès d’un représentant. Ce n’est pas une élection pour tout le parlement.
    sourceUrl: "https://www.britannica.com/dictionary/by-election"
  - category: economy
    term:
      he: תוצר מקומי גולמי (תמ"ג)
      en: Gross Domestic Product (GDP)
      ar: "الناتج المحلي الإجمالي"
      ru: "Валовой внутренний продукт (ВВП)"
      es: Producto interno bruto (PIB)
      fr: Produit intérieur brut (PIB)
    def:
      he: "הערך הכספי הכולל של כל הסחורות והשירותים הסופיים — אלה שנקנים בידי המשתמש הסופי — שמיוצרים במדינה בתקופה נתונה. מדד מרכזי לגודל הכלכלה ולקצב הצמיחה שלה."
      en: "The total monetary value of all final goods and services — those bought by their end user — produced within a country during a given period. It is a primary measure of the size of an economy and its growth."
      ar: "القيمة النقدية الإجمالية لجميع السلع والخدمات النهائية — أي التي يشتريها المستخدم النهائي — المنتجة في الدولة خلال فترة معيّنة. وهو مقياس أساسي لحجم الاقتصاد ووتيرة نموّه."
      ru: "Общая денежная стоимость всех конечных товаров и услуг — тех, что покупает конечный потребитель, — произведённых в стране за определённый период. Основной показатель размера экономики и темпов её роста."
      es: "El valor monetario total de todos los bienes y servicios finales —los que compra el usuario final— producidos en un país durante un período determinado. Es una medida fundamental del tamaño de una economía y de su crecimiento."
      fr: "La valeur monétaire totale de tous les biens et services finaux — ceux achetés par l’utilisateur final — produits dans un pays au cours d’une période donnée. C’est une mesure essentielle de la taille d’une économie et de sa croissance."
    sourceUrl: "https://www.imf.org/en/publications/fandd/issues/series/back-to-basics/gross-domestic-product-gdp"
  - category: economy
    term:
      he: חוב לאומי
      en: National Debt
      ar: "الدَّين العام"
      ru: "Государственный долг"
      es: Deuda pública
      fr: Dette publique
    def:
      he: סך הכסף שממשלת המדינה חייבת למלווים, שנצבר לאורך שנים של גירעונות תקציביים. החוב ממומן בדרך כלל בהנפקת אגרות חוב.
      en: The total amount of money a country's government owes to its lenders, accumulated over years of budget deficits. It is typically financed by issuing government bonds.
      ar: "مجموع المال الذي تدين به حكومة الدولة للمُقرضين، المتراكم على مدى سنوات من العجز في الميزانية. ويُموَّل عادةً بإصدار سندات حكومية."
      ru: "Общая сумма, которую правительство страны должно кредиторам, накопленная за годы бюджетных дефицитов. Обычно финансируется выпуском государственных облигаций."
      es: El importe total que el gobierno de un país debe a sus prestamistas, acumulado a lo largo de años de déficit presupuestario. Suele financiarse emitiendo bonos del Estado.
      fr: Le montant total que le gouvernement d’un pays doit à ses prêteurs, accumulé au fil des années de déficit budgétaire. Il est généralement financé par l’émission d’obligations d’État.
    sourceUrl: "https://www.britannica.com/money/public-debt"
  - category: economy
    term:
      he: אינפלציה
      en: Inflation
      ar: "التضخم"
      ru: "Инфляция"
      es: Inflación
      fr: Inflation
    def:
      he: עלייה כללית ומתמשכת במחירי הסחורות והשירותים במשק, שמפחיתה את כוח הקנייה של הכסף. כלומר, באותו סכום כסף ניתן לקנות פחות לאורך זמן.
      en: A general and sustained rise in the prices of goods and services in an economy, which reduces the purchasing power of money. In other words, the same amount of money buys less over time.
      ar: "ارتفاع عام ومستمر في أسعار السلع والخدمات في الاقتصاد يقلّل القوة الشرائية للمال. أي إن المبلغ نفسه يشتري أقل مع مرور الوقت."
      ru: "Общий и устойчивый рост цен на товары и услуги в экономике, снижающий покупательную способность денег. Иными словами, на ту же сумму со временем можно купить меньше."
      es: Una subida general y sostenida de los precios de bienes y servicios en una economía, que reduce el poder adquisitivo del dinero. Dicho de otro modo, con la misma cantidad de dinero se compra menos con el tiempo.
      fr: Une hausse générale et durable des prix des biens et services dans une économie, qui réduit le pouvoir d’achat de la monnaie. Autrement dit, la même somme d’argent achète moins avec le temps.
    sourceUrl: "https://www.imf.org/en/publications/fandd/issues/series/back-to-basics/inflation"
  - category: economy
    term:
      he: מיתון
      en: Recession
      ar: "الركود"
      ru: "Рецессия"
      es: Recesión
      fr: Récession
    def:
      he: תקופה של ירידה משמעותית בפעילות הכלכלית הנמשכת חודשים אחדים, המתבטאת בדרך כלל בירידה בתוצר ובעלייה באבטלה.
      en: A period of significant decline in economic activity lasting several months, usually marked by falling output and rising unemployment.
      ar: "فترة تراجع ملحوظ في النشاط الاقتصادي تستمر عدة أشهر، وتتجلّى عادةً في انخفاض الناتج وارتفاع البطالة."
      ru: "Период значительного спада экономической активности длительностью в несколько месяцев, обычно с падением производства и ростом безработицы."
      es: Un período de descenso significativo de la actividad económica que dura varios meses, normalmente marcado por una caída de la producción y un aumento del desempleo.
      fr: Une période de baisse marquée de l’activité économique durant plusieurs mois, généralement caractérisée par un recul de la production et une hausse du chômage.
    sourceUrl: "https://www.imf.org/en/publications/fandd/issues/series/back-to-basics/recession"
  - category: economy
    term:
      he: הפרטה
      en: Privatization
      ar: "الخصخصة"
      ru: "Приватизация"
      es: Privatización
      fr: Privatisation
    def:
      he: העברת בעלות או ניהול של נכסים ושירותים מהמדינה לידיים פרטיות, למשל מכירת חברה ממשלתית למשקיעים פרטיים.
      en: The transfer of ownership or management of assets and services from the state to private hands, for example selling a state-owned company to private investors.
      ar: "نقل ملكية أو إدارة أصول وخدمات من الدولة إلى أيدٍ خاصة، مثل بيع شركة حكومية لمستثمرين من القطاع الخاص."
      ru: "Передача собственности на активы и услуги или управления ими от государства в частные руки — например, продажа государственной компании частным инвесторам."
      es: La transferencia de la propiedad o la gestión de bienes y servicios del Estado a manos privadas, por ejemplo la venta de una empresa pública a inversores privados.
      fr: Le transfert de la propriété ou de la gestion de biens et de services de l’État vers des mains privées, par exemple la vente d’une entreprise publique à des investisseurs privés.
    sourceUrl: "https://www.britannica.com/money/privatization"
  - category: economy
    term:
      he: הלאמה
      en: Nationalization
      ar: "التأميم"
      ru: "Национализация"
      es: Nacionalización
      fr: Nationalisation
    def:
      he: העברת נכסים, תעשיות או חברות מבעלות פרטית לבעלות או לשליטת המדינה. זהו ההיפך מהפרטה.
      en: The transfer of assets, industries, or companies from private ownership into state ownership or control. It is the opposite of privatization.
      ar: "نقل أصول أو صناعات أو شركات من الملكية الخاصة إلى ملكية الدولة أو سيطرتها. وهو عكس الخصخصة."
      ru: "Передача активов, отраслей или компаний из частной собственности в собственность или под контроль государства. Это противоположность приватизации."
      es: La transferencia de bienes, industrias o empresas de la propiedad privada a la propiedad o el control del Estado. Es lo contrario de la privatización.
      fr: Le transfert de biens, d’industries ou d’entreprises de la propriété privée vers la propriété ou le contrôle de l’État. C’est l’inverse de la privatisation.
    sourceUrl: "https://www.britannica.com/money/nationalization"
  - category: economy
    term:
      he: שוק חופשי
      en: Free Market
      ar: "السوق الحرة"
      ru: "Свободный рынок"
      es: Libre mercado
      fr: Marché libre
    def:
      he: שיטה כלכלית שבה מחירים, ייצור והחלפת סחורות נקבעים בעיקר על ידי היצע וביקוש, עם התערבות ממשלתית מועטה.
      en: An economic system in which prices, production, and the exchange of goods are determined mainly by supply and demand, with little government intervention.
      ar: "نظام اقتصادي تُحدَّد فيه الأسعار والإنتاج وتبادل السلع أساسًا وفق العرض والطلب، مع قليل من تدخل الحكومة."
      ru: "Экономическая система, в которой цены, производство и обмен товарами определяются в основном спросом и предложением при незначительном вмешательстве государства."
      es: Un sistema económico en el que los precios, la producción y el intercambio de bienes se determinan sobre todo por la oferta y la demanda, con poca intervención del Estado.
      fr: Un système économique où les prix, la production et l’échange de biens sont déterminés principalement par l’offre et la demande, avec peu d’intervention de l’État.
    sourceUrl: "https://www.britannica.com/money/free-market"
  - category: economy
    term:
      he: מיסוי פרוגרסיבי
      en: Progressive Taxation
      ar: "الضريبة التصاعدية"
      ru: "Прогрессивное налогообложение"
      es: Impuestos progresivos
      fr: Impôt progressif
    def:
      he: שיטת מס שבה שיעור המס עולה ככל שההכנסה גדלה, כך שבעלי הכנסות גבוהות משלמים אחוז גבוה יותר מהכנסתם מאשר בעלי הכנסות נמוכות.
      en: A tax system in which the tax rate rises as income increases, so that higher earners pay a larger percentage of their income than lower earners.
      ar: "نظام ضريبي ترتفع فيه نسبة الضريبة كلما زاد الدخل، بحيث يدفع أصحاب الدخل المرتفع نسبة أكبر من دخلهم مقارنة بأصحاب الدخل المنخفض."
      ru: "Налоговая система, при которой ставка налога растёт вместе с доходом, так что люди с высоким доходом платят больший процент от него, чем люди с низким доходом."
      es: Un sistema fiscal en el que la tasa impositiva aumenta con los ingresos, de modo que quienes ganan más pagan un porcentaje mayor de sus ingresos que quienes ganan menos.
      fr: Un système fiscal où le taux d’imposition augmente avec le revenu, de sorte que les hauts revenus paient un pourcentage plus élevé de leurs revenus que les bas revenus.
    sourceUrl: "https://www.britannica.com/money/progressive-tax"
  - category: economy
    term:
      he: מדיניות מוניטרית מול מדיניות פיסקלית
      en: Monetary vs. Fiscal Policy
      ar: "السياسة النقدية مقابل السياسة المالية"
      ru: "Денежно-кредитная и бюджетно-налоговая политика"
      es: Política monetaria y política fiscal
      fr: Politique monétaire et politique budgétaire
    def:
      he: מדיניות מוניטרית מנוהלת בידי הבנק המרכזי באמצעות שליטה בריבית ובכמות הכסף, ואילו מדיניות פיסקלית מנוהלת בידי הממשלה באמצעות החלטות על מסים והוצאות ציבוריות.
      en: Monetary policy is run by the central bank through control of interest rates and the money supply, while fiscal policy is run by the government through decisions on taxes and public spending.
      ar: "يدير البنك المركزي السياسة النقدية عبر التحكّم في سعر الفائدة وكمية النقود، بينما تدير الحكومة السياسة المالية عبر قرارات بشأن الضرائب والإنفاق العام."
      ru: "Денежно-кредитную политику проводит центральный банк, управляя процентными ставками и денежной массой, а бюджетно-налоговую — правительство, принимая решения о налогах и государственных расходах."
      es: La política monetaria la lleva el banco central mediante el control de los tipos de interés y la masa monetaria, mientras que la política fiscal la lleva el Gobierno mediante decisiones sobre impuestos y gasto público.
      fr: La politique monétaire est menée par la banque centrale par le contrôle des taux d’intérêt et de la masse monétaire, tandis que la politique budgétaire est menée par le gouvernement par ses décisions sur les impôts et les dépenses publiques.
    sourceUrl: "https://www.imf.org/en/publications/fandd/issues/series/back-to-basics/fiscal-policy"
  - category: rights
    term:
      he: זכויות אדם
      en: Human Rights
      ar: "حقوق الإنسان"
      ru: "Права человека"
      es: Derechos humanos
      fr: Droits humains
    def:
      he: זכויות בסיסיות המגיעות לכל אדם באשר הוא אדם, ללא קשר למוצאו, מינו, דתו או אמונותיו, כגון הזכות לחיים, לחירות ולכבוד.
      en: Basic rights that belong to every person simply for being human, regardless of origin, sex, religion or beliefs, such as the right to life, liberty and dignity.
      ar: "حقوق أساسية تحق لكل إنسان لكونه إنسانًا، بغضّ النظر عن أصله أو جنسه أو دينه أو معتقداته، مثل الحق في الحياة والحرية والكرامة."
      ru: "Основные права, принадлежащие каждому человеку просто потому, что он человек, независимо от происхождения, пола, религии или убеждений, — например, право на жизнь, свободу и достоинство."
      es: Derechos básicos que corresponden a toda persona por el mero hecho de ser humana, sin importar su origen, sexo, religión o creencias, como el derecho a la vida, la libertad y la dignidad.
      fr: Des droits fondamentaux qui appartiennent à toute personne du simple fait d’être humaine, quels que soient son origine, son sexe, sa religion ou ses convictions, comme le droit à la vie, à la liberté et à la dignité.
    sourceUrl: "https://www.un.org/en/global-issues/human-rights"
  - category: rights
    term:
      he: זכויות אזרח
      en: Civil Rights
      ar: "الحقوق المدنية"
      ru: "Гражданские права"
      es: Derechos civiles
      fr: Droits civils
    def:
      he: זכויות המבטיחות לאדם השתתפות שווה בחיים האזרחיים והפוליטיים ללא אפליה, כגון הזכות להצביע, לקבל שירות ציבורי ולהיות מוגן מפני הפליה.
      en: Rights that guarantee a person equal participation in civic and political life without discrimination, such as the right to vote, to receive public services and to be protected from discrimination.
      ar: "حقوق تضمن للإنسان مشاركة متساوية في الحياة المدنية والسياسية دون تمييز، مثل الحق في التصويت، وفي الحصول على الخدمات العامة، وفي الحماية من التمييز."
      ru: "Права, гарантирующие человеку равное участие в гражданской и политической жизни без дискриминации, — например, право голосовать, получать государственные услуги и быть защищённым от дискриминации."
      es: Derechos que garantizan a una persona la participación igualitaria en la vida cívica y política sin discriminación, como el derecho a votar, a recibir servicios públicos y a estar protegida frente a la discriminación.
      fr: Des droits qui garantissent à une personne une participation égale à la vie civique et politique sans discrimination, comme le droit de vote, l’accès aux services publics et la protection contre la discrimination.
    sourceUrl: "https://www.britannica.com/topic/civil-rights"
  - category: rights
    term:
      he: הליך הוגן
      en: Due Process
      ar: "الإجراءات القانونية الواجبة"
      ru: "Надлежащая правовая процедура"
      es: Debido proceso
      fr: Procédure régulière
    def:
      he: הדרישה שהמדינה תנהג כלפי אדם לפי כללים הוגנים וברורים לפני שתפגע בזכויותיו, למשל הזכות לדעת על האשמה ולהשמיע טענות בפני גורם נייטרלי.
      en: The requirement that the state treat a person according to fair and clear procedures before affecting their rights, such as the right to know the charges and to be heard by a neutral body.
      ar: "وجوب أن تتعامل الدولة مع الإنسان وفق إجراءات عادلة وواضحة قبل المساس بحقوقه، مثل حقه في معرفة التهمة وفي إسماع حججه أمام جهة محايدة."
      ru: "Требование, чтобы государство обращалось с человеком по справедливым и ясным правилам, прежде чем затрагивать его права, — например, право знать обвинение и быть выслушанным нейтральным органом."
      es: La exigencia de que el Estado trate a una persona según procedimientos justos y claros antes de afectar a sus derechos, como el derecho a conocer los cargos y a ser oída por un órgano imparcial.
      fr: L’exigence que l’État traite une personne selon des procédures équitables et claires avant de toucher à ses droits, comme le droit de connaître les charges et d’être entendu par une instance impartiale.
    sourceUrl: "https://www.ohchr.org/en/instruments-mechanisms/instruments/international-covenant-civil-and-political-rights"
  - category: rights
    term:
      he: חוקה
      en: Constitution
      ar: "الدستور"
      ru: "Конституция"
      es: Constitución
      fr: Constitution
    def:
      he: מסמך יסוד או מערכת כללים עליונים הקובעים את מבנה השלטון, סמכויותיו וגבולותיו, ואת זכויות היסוד של האזרחים.
      en: A foundational document or set of supreme rules that defines the structure, powers and limits of government and the basic rights of citizens.
      ar: "وثيقة تأسيسية أو مجموعة قواعد عليا تحدّد بنية الحكم وصلاحياته وحدوده، والحقوق الأساسية للمواطنين."
      ru: "Основополагающий документ или свод высших правил, определяющий устройство власти, её полномочия и пределы, а также основные права граждан."
      es: Un documento fundacional o conjunto de normas supremas que define la estructura, los poderes y los límites del gobierno y los derechos básicos de los ciudadanos.
      fr: Un texte fondateur ou un ensemble de règles suprêmes qui définit la structure, les pouvoirs et les limites du gouvernement ainsi que les droits fondamentaux des citoyens.
    sourceUrl: "https://main.knesset.gov.il/About/Lexicon/Pages/heb_mimshal_hoka.aspx"
  - category: rights
    term:
      he: חוקי יסוד
      en: Basic Laws
      ar: "قوانين الأساس"
      ru: "Основные законы"
      es: Leyes Fundamentales
      fr: Lois fondamentales
    def:
      he: בישראל, חוקים בעלי מעמד מיוחד שנועדו לשמש פרקים של חוקה עתידית ולעגן את מבנה השלטון וזכויות היסוד, בהיעדר חוקה כתובה אחת.
      en: In Israel, laws with special status meant to serve as chapters of a future constitution, anchoring the structure of government and basic rights in the absence of a single written constitution.
      ar: "في إسرائيل، قوانين ذات مكانة خاصة يُراد لها أن تكون فصولًا في دستور مستقبلي، وترسّخ بنية الحكم والحقوق الأساسية في غياب دستور مكتوب واحد."
      ru: "В Израиле — законы особого статуса, задуманные как главы будущей конституции и закрепляющие устройство власти и основные права в отсутствие единой писаной конституции."
      es: En Israel, leyes con un estatus especial destinadas a servir como capítulos de una futura constitución, que fijan la estructura del gobierno y los derechos básicos a falta de una constitución escrita única.
      fr: En Israël, des lois à statut spécial destinées à servir de chapitres d’une future constitution, fixant la structure du gouvernement et les droits fondamentaux en l’absence d’une constitution écrite unique.
    sourceUrl: "https://main.knesset.gov.il/About/Lexicon/Pages/heb_mimshal_hoka.aspx"
  - category: rights
    term:
      he: חופש הביטוי
      en: Freedom of Expression
      ar: "حرية التعبير"
      ru: "Свобода слова"
      es: Libertad de expresión
      fr: Liberté d’expression
    def:
      he: הזכות להביע דעות, רעיונות ומידע בכתב, בעל פה או בכל דרך אחרת, ללא צנזורה או ענישה מצד השלטון, בכפוף למגבלות מסוימות שנקבעות בחוק.
      en: The right to express opinions, ideas and information in writing, speech or any other form without government censorship or punishment, subject to certain limits set by law.
      ar: "الحق في التعبير عن الآراء والأفكار والمعلومات كتابةً أو شفاهةً أو بأي شكل آخر، من دون رقابة أو عقاب من السلطة، مع مراعاة قيود معيّنة يحدّدها القانون."
      ru: "Право выражать мнения, идеи и информацию письменно, устно или в любой иной форме без цензуры и наказания со стороны власти — с некоторыми ограничениями, установленными законом."
      es: El derecho a expresar opiniones, ideas e información por escrito, de palabra o de cualquier otra forma sin censura ni castigo del Estado, con ciertos límites fijados por la ley.
      fr: Le droit d’exprimer des opinions, des idées et des informations par écrit, oralement ou sous toute autre forme sans censure ni sanction de l’État, sous réserve de certaines limites fixées par la loi.
    sourceUrl: "https://www.ohchr.org/en/instruments-mechanisms/instruments/international-covenant-civil-and-political-rights"
  - category: rights
    term:
      he: חופש הדת
      en: Freedom of Religion
      ar: "حرية الدين"
      ru: "Свобода вероисповедания"
      es: Libertad de religión
      fr: Liberté de religion
    def:
      he: הזכות של כל אדם להאמין, לקיים פולחן או להימנע מדת לפי בחירתו, ללא כפייה או הפליה מצד המדינה.
      en: The right of every person to hold beliefs, practice worship, or refrain from religion according to their own choice, free from state coercion or discrimination.
      ar: "حق كل إنسان في أن يؤمن ويمارس العبادة أو يمتنع عن الدين وفق اختياره، من دون إكراه أو تمييز من الدولة."
      ru: "Право каждого человека верить, отправлять культ или не исповедовать никакой религии по собственному выбору, без принуждения и дискриминации со стороны государства."
      es: El derecho de toda persona a tener creencias, practicar un culto o abstenerse de la religión según su propia elección, sin coacción ni discriminación del Estado.
      fr: Le droit de toute personne d’avoir des convictions, de pratiquer un culte ou de s’abstenir de religion selon son propre choix, sans contrainte ni discrimination de l’État.
    sourceUrl: "https://www.ohchr.org/en/instruments-mechanisms/instruments/international-covenant-civil-and-political-rights"
  - category: rights
    term:
      he: שוויון בפני החוק
      en: Equality Before the Law
      ar: "المساواة أمام القانون"
      ru: "Равенство перед законом"
      es: Igualdad ante la ley
      fr: Égalité devant la loi
    def:
      he: העיקרון שלפיו החוק חל על כל בני האדם באופן שווה והם זכאים להגנה שווה שלו, ללא העדפה או אפליה.
      en: The principle that the law applies equally to all people and that everyone is entitled to its equal protection, without favor or discrimination.
      ar: "المبدأ القائل إن القانون يسري على جميع الناس بالتساوي، ولكلٍّ الحق في حمايته المتساوية، من دون تفضيل أو تمييز."
      ru: "Принцип, согласно которому закон одинаково применяется ко всем людям и каждый имеет право на равную защиту закона, без предпочтений и дискриминации."
      es: El principio de que la ley se aplica por igual a todas las personas y que todos tienen derecho a su misma protección, sin favoritismos ni discriminación.
      fr: Le principe selon lequel la loi s’applique également à toutes les personnes et que chacun a droit à la même protection, sans faveur ni discrimination.
    sourceUrl: "https://www.un.org/en/about-us/universal-declaration-of-human-rights"
  - category: rights
    term:
      he: חזקת החפות
      en: Presumption of Innocence
      ar: "قرينة البراءة"
      ru: "Презумпция невиновности"
      es: Presunción de inocencia
      fr: Présomption d’innocence
    def:
      he: הכלל שלפיו אדם נחשב חף מפשע עד שהוכחה אשמתו, והנטל להוכיח את האשמה מוטל על התביעה ולא על הנאשם.
      en: The rule that a person is considered innocent until proven guilty, with the burden of proving guilt resting on the prosecution rather than the accused.
      ar: "القاعدة التي تعتبر الإنسان بريئًا حتى تثبت إدانته، ويقع عبء إثبات الإدانة على النيابة لا على المتهم."
      ru: "Правило, согласно которому человек считается невиновным, пока его вина не доказана, а бремя доказывания вины лежит на обвинении, а не на обвиняемом."
      es: La regla según la cual una persona se considera inocente hasta que se demuestre su culpabilidad, y la carga de probarla recae en la acusación, no en el acusado.
      fr: La règle selon laquelle une personne est considérée comme innocente tant que sa culpabilité n’est pas prouvée, la charge de la preuve incombant à l’accusation et non à l’accusé.
    sourceUrl: "https://fs.knesset.gov.il/24/Committees/24_cs_bg_625740.pdf"
  - category: international
    term:
      he: דיפלומטיה
      en: Diplomacy
      ar: "الدبلوماسية"
      ru: "Дипломатия"
      es: Diplomacia
      fr: Diplomatie
    def:
      he: ניהול היחסים בין מדינות באמצעות משא ומתן ושיחות, במטרה לקדם אינטרסים ולפתור מחלוקות בלי שימוש בכוח.
      en: The practice of managing relations between countries through negotiation and dialogue, aiming to advance interests and resolve disputes without the use of force.
      ar: "إدارة العلاقات بين الدول عبر التفاوض والحوار، بهدف تعزيز المصالح وحلّ الخلافات من دون استخدام القوة."
      ru: "Ведение отношений между государствами путём переговоров и диалога ради продвижения интересов и разрешения споров без применения силы."
      es: La práctica de gestionar las relaciones entre países mediante la negociación y el diálogo, con el fin de promover intereses y resolver disputas sin recurrir a la fuerza.
      fr: La pratique consistant à gérer les relations entre pays par la négociation et le dialogue, afin de promouvoir des intérêts et de régler des différends sans recours à la force.
    sourceUrl: "https://www.britannica.com/topic/diplomacy"
  - category: international
    term:
      he: אמנה (הסכם בין-לאומי)
      en: Treaty
      ar: "المعاهدة (اتفاق دولي)"
      ru: "Договор (международный)"
      es: Tratado
      fr: Traité
    def:
      he: הסכם רשמי ומחייב מבחינה משפטית בין שתי מדינות או יותר, הקובע זכויות וחובות בנושאים כגון שלום, סחר או ביטחון.
      en: A formal, legally binding agreement between two or more countries that sets out rights and obligations on matters such as peace, trade, or security.
      ar: "اتفاق رسمي ملزم قانونيًا بين دولتين أو أكثر، يحدّد حقوقًا والتزامات في مسائل مثل السلام أو التجارة أو الأمن."
      ru: "Официальное юридически обязывающее соглашение между двумя или более государствами, устанавливающее права и обязанности в таких вопросах, как мир, торговля или безопасность."
      es: Un acuerdo formal y jurídicamente vinculante entre dos o más países que establece derechos y obligaciones en materias como la paz, el comercio o la seguridad.
      fr: Un accord formel et juridiquement contraignant entre deux ou plusieurs pays qui fixe des droits et des obligations dans des domaines comme la paix, le commerce ou la sécurité.
    sourceUrl: "https://www.britannica.com/topic/treaty"
  - category: international
    term:
      he: יחסים רב-צדדיים
      en: Multilateral relations
      ar: "العلاقات متعددة الأطراف"
      ru: "Многосторонние отношения"
      es: Relaciones multilaterales
      fr: Relations multilatérales
    def:
      he: שיתוף פעולה מתואם בין שלוש מדינות או יותר, לרוב במסגרת ארגונים בין-לאומיים, לקידום מטרות משותפות.
      en: Coordinated cooperation among three or more countries, often through international organizations, to pursue shared goals.
      ar: "تعاون منسّق بين ثلاث دول أو أكثر، غالبًا في إطار منظمات دولية، لتحقيق أهداف مشتركة."
      ru: "Согласованное сотрудничество трёх или более государств, часто в рамках международных организаций, ради общих целей."
      es: Cooperación coordinada entre tres o más países, a menudo a través de organizaciones internacionales, para perseguir objetivos comunes.
      fr: Une coopération coordonnée entre trois pays ou plus, souvent au sein d’organisations internationales, pour poursuivre des objectifs communs.
    sourceUrl: "https://www.un.org/en/observances/multilateralism-for-peace-day"
  - category: international
    term:
      he: סנקציות
      en: Sanctions
      ar: "العقوبات"
      ru: "Санкции"
      es: Sanciones
      fr: Sanctions
    def:
      he: אמצעי לחץ שמדינה או ארגון בין-לאומי מטילים על גורם אחר, כגון הגבלות סחר או כספים, כדי להניעו לשנות התנהגות.
      en: Pressure measures imposed by a country or international body on another actor, such as trade or financial restrictions, intended to change its behavior.
      ar: "وسائل ضغط تفرضها دولة أو هيئة دولية على طرف آخر، مثل قيود تجارية أو مالية، بهدف دفعه إلى تغيير سلوكه."
      ru: "Меры давления, которые государство или международная организация применяет к другой стороне, — например, торговые или финансовые ограничения, — чтобы побудить её изменить поведение."
      es: Medidas de presión impuestas por un país o un organismo internacional a otro actor, como restricciones comerciales o financieras, destinadas a cambiar su comportamiento.
      fr: Des mesures de pression imposées par un pays ou un organisme international à un autre acteur, comme des restrictions commerciales ou financières, destinées à modifier son comportement.
    sourceUrl: "https://main.un.org/securitycouncil/en/sanctions/information"
  - category: international
    term:
      he: שגרירות וקונסוליה
      en: Embassy and consulate
      ar: "السفارة والقنصلية"
      ru: "Посольство и консульство"
      es: Embajada y consulado
      fr: Ambassade et consulat
    def:
      he: נציגויות רשמיות של מדינה בשטח מדינה אחרת; השגרירות מנהלת את היחסים המדיניים, והקונסוליה מטפלת בעיקר בשירותים לאזרחים ובאשרות.
      en: Official offices of one country located in another; an embassy handles political relations, while a consulate mainly provides services to citizens and issues visas.
      ar: "ممثليات رسمية لدولة في أراضي دولة أخرى؛ تدير السفارة العلاقات السياسية، وتُعنى القنصلية أساسًا بخدمات المواطنين وإصدار التأشيرات."
      ru: "Официальные представительства одного государства на территории другого; посольство ведёт политические отношения, а консульство в основном обслуживает граждан и выдаёт визы."
      es: Oficinas oficiales de un país situadas en otro; la embajada se ocupa de las relaciones políticas, mientras que el consulado presta sobre todo servicios a los ciudadanos y expide visados.
      fr: Des bureaux officiels d’un pays situés dans un autre ; l’ambassade s’occupe des relations politiques, tandis que le consulat fournit surtout des services aux citoyens et délivre des visas.
    sourceUrl: "https://legal.un.org/ilc/texts/instruments/english/conventions/9_1_1961.pdf"
  - category: international
    term:
      he: האו"ם (ארגון האומות המאוחדות)
      en: United Nations
      ar: "الأمم المتحدة"
      ru: "Организация Объединённых Наций (ООН)"
      es: Naciones Unidas
      fr: Nations unies
    def:
      he: ארגון בין-לאומי שרוב מדינות העולם חברות בו, שנועד לשמור על השלום והביטחון העולמיים ולקדם שיתוף פעולה בין מדינות.
      en: An international organization with most of the world's countries as members, created to maintain global peace and security and promote cooperation among nations.
      ar: "منظمة دولية تضم معظم دول العالم، أُنشئت للحفاظ على السلام والأمن العالميين وتعزيز التعاون بين الدول."
      ru: "Международная организация, в которую входит большинство стран мира, созданная для поддержания мира и безопасности и развития сотрудничества между государствами."
      es: Una organización internacional de la que son miembros la mayoría de los países del mundo, creada para mantener la paz y la seguridad mundiales y promover la cooperación entre naciones.
      fr: Une organisation internationale dont la plupart des pays du monde sont membres, créée pour maintenir la paix et la sécurité mondiales et promouvoir la coopération entre les nations.
    sourceUrl: "https://www.un.org/en/about-us"
  - category: international
    term:
      he: פתרון שתי המדינות
      en: Two-state solution
      ar: "حل الدولتين"
      ru: "Решение «два государства»"
      es: Solución de dos Estados
      fr: Solution à deux États
    def:
      he: מתווה מוצע ליישוב הסכסוך הישראלי-פלסטיני, שלפיו תקום מדינה פלסטינית עצמאית לצד מדינת ישראל.
      en: A proposed framework for resolving the Israeli-Palestinian conflict, in which an independent Palestinian state would exist alongside the State of Israel.
      ar: "إطار مقترح لحل الصراع الإسرائيلي-الفلسطيني تقوم بموجبه دولة فلسطينية مستقلة إلى جانب دولة إسرائيل."
      ru: "Предлагаемая схема урегулирования израильско-палестинского конфликта, при которой рядом с Государством Израиль существовало бы независимое палестинское государство."
      es: Un marco propuesto para resolver el conflicto israelí-palestino, en el que un Estado palestino independiente existiría junto al Estado de Israel.
      fr: Un cadre proposé pour résoudre le conflit israélo-palestinien, dans lequel un État palestinien indépendant existerait aux côtés de l’État d’Israël.
    sourceUrl: "https://news.un.org/en/story/2025/09/1165835"
  - category: international
    term:
      he: סיפוח
      en: Annexation
      ar: "الضمّ"
      ru: "Аннексия"
      es: Anexión
      fr: Annexion
    def:
      he: החלת ריבונות של מדינה על שטח שלא היה בעבר חלק ממנה, לעיתים תוך מחלוקת לגבי תוקפו המשפטי הבין-לאומי.
      en: The act of a state extending its sovereignty over territory that was not previously part of it, sometimes amid dispute over its validity under international law.
      ar: "قيام دولة بفرض سيادتها على أرض لم تكن جزءًا منها من قبل، وأحيانًا مع خلاف حول صحّة ذلك وفق القانون الدولي."
      ru: "Распространение государством своего суверенитета на территорию, которая прежде не была его частью, иногда при споре о законности этого с точки зрения международного права."
      es: El acto por el que un Estado extiende su soberanía a un territorio que antes no formaba parte de él, a veces en medio de disputas sobre su validez según el derecho internacional.
      fr: L’acte par lequel un État étend sa souveraineté à un territoire qui n’en faisait pas partie auparavant, parfois au milieu de contestations sur sa validité en droit international.
    sourceUrl: "https://www.britannica.com/topic/annexation"
  - category: international
    term:
      he: כיבוש (במשפט הבין-לאומי)
      en: Military occupation
      ar: "الاحتلال العسكري (في القانون الدولي)"
      ru: "Военная оккупация (в международном праве)"
      es: Ocupación militar
      fr: Occupation militaire
    def:
      he: מצב שבו צבא של מדינה שולט בפועל בשטח שאינו בריבונותה; המשפט הבין-לאומי קובע כללים לזכויות התושבים ולחובות הצד השולט.
      en: A situation in which a state's military exercises effective control over territory that is not under its sovereignty; international law sets rules for residents' rights and the controlling party's duties.
      ar: "وضع يسيطر فيه جيش دولة فعليًا على أرض ليست تحت سيادتها؛ ويحدّد القانون الدولي قواعد لحقوق السكان وواجبات الطرف المسيطر."
      ru: "Ситуация, когда армия государства фактически контролирует территорию, не находящуюся под его суверенитетом; международное право устанавливает правила о правах жителей и обязанностях контролирующей стороны."
      es: Una situación en la que el ejército de un Estado ejerce un control efectivo sobre un territorio que no está bajo su soberanía; el derecho internacional fija reglas sobre los derechos de los residentes y los deberes de la parte que controla.
      fr: Une situation où l’armée d’un État exerce un contrôle effectif sur un territoire qui n’est pas sous sa souveraineté ; le droit international fixe des règles sur les droits des habitants et les obligations de la partie qui contrôle.
    sourceUrl: "https://www.icrc.org/en/article/occupation-international-humanitarian-law-questions"
  - category: international
    term:
      he: הפסקת אש והסכם שביתת נשק
      en: Ceasefire and armistice
      ar: "وقف إطلاق النار واتفاقية الهدنة"
      ru: "Прекращение огня и перемирие"
      es: Alto el fuego y armisticio
      fr: Cessez-le-feu et armistice
    def:
      he: "הסכמה להפסקת הלחימה. הפסקת אש יכולה להיות זמנית או קבועה, מקומית או כללית; \"הפוגה\" ו\"שביתת נשק\" מתארות הסדרים דומים, שבהם הצדדים מסכימים, באופן רשמי או לא רשמי, לעצור את הפעולות הצבאיות."
      en: "An agreement to stop fighting. A ceasefire can be temporary or permanent, local or general; a truce or an armistice describes a similar arrangement in which the sides formally or informally agree to halt military operations."
      ar: "اتفاق على وقف القتال. يمكن أن يكون وقف إطلاق النار مؤقتًا أو دائمًا، محليًا أو شاملًا؛ وتصف «الهدنة المؤقتة» و«اتفاقية الهدنة» ترتيبات مشابهة يتفق فيها الطرفان، رسميًا أو غير رسمي، على وقف العمليات العسكرية."
      ru: "Договорённость о прекращении боевых действий. Прекращение огня может быть временным или постоянным, местным или общим; «пауза в боевых действиях» и «перемирие» описывают похожие договорённости, когда стороны формально или неформально соглашаются остановить военные операции."
      es: "Un acuerdo para dejar de combatir. Un alto el fuego puede ser temporal o permanente, local o general; «tregua» y «armisticio» describen arreglos similares en los que las partes acuerdan, formal o informalmente, detener las operaciones militares."
      fr: "Un accord pour cesser les combats. Un cessez-le-feu peut être temporaire ou permanent, local ou général ; « trêve » et « armistice » désignent des arrangements semblables, par lesquels les parties conviennent, formellement ou non, d’arrêter les opérations militaires."
    sourceUrl: "https://peacemaker.un.org/sites/default/files/document/files/2022/11/ceasefire-guidance-2022-0.pdf"
  - category: international
    term:
      he: נורמליזציה (כינון יחסים)
      en: Normalization
      ar: "التطبيع (إقامة العلاقات)"
      ru: "Нормализация (установление отношений)"
      es: Normalización
      fr: Normalisation
    def:
      he: תהליך שבו שתי מדינות שלא קיימו ביניהן יחסים תקינים יוצרות קשרים דיפלומטיים וכלכליים רשמיים.
      en: The process by which two countries that previously lacked normal relations establish formal diplomatic and economic ties.
      ar: "عملية تقيم فيها دولتان لم تكن بينهما علاقات طبيعية روابط دبلوماسية واقتصادية رسمية."
      ru: "Процесс, в ходе которого два государства, ранее не имевшие нормальных отношений, устанавливают официальные дипломатические и экономические связи."
      es: El proceso por el que dos países que antes carecían de relaciones normales establecen vínculos diplomáticos y económicos formales.
      fr: Le processus par lequel deux pays qui n’avaient pas de relations normales établissent des liens diplomatiques et économiques officiels.
    sourceUrl: "https://www.britannica.com/dictionary/normalize"
  - category: israel
    term:
      he: בית המשפט הגבוה לצדק (בג"ץ)
      en: High Court of Justice (Bagatz)
      ar: "محكمة العدل العليا (بَغاتس)"
      ru: "Высший суд справедливости (БАГАЦ)"
      es: Tribunal Superior de Justicia (Bagatz)
      fr: Haute Cour de justice (Bagatz)
    def:
      he: כינוי לבית המשפט העליון בישראל כשהוא דן כערכאה ראשונה בעתירות נגד רשויות השלטון. אזרחים יכולים לפנות אליו ישירות כדי לבקש סעד נגד החלטות של גופים ציבוריים.
      en: The name for Israel's Supreme Court when it sits as a court of first instance hearing petitions against government authorities. Citizens can turn to it directly to seek relief against decisions of public bodies.
      ar: "اسم المحكمة العليا في إسرائيل حين تنظر كهيئة ابتدائية في الالتماسات ضد السلطات الحكومية. ويمكن للمواطنين التوجه إليها مباشرة لطلب الإنصاف من قرارات الهيئات العامة."
      ru: "Так называют Верховный суд Израиля, когда он рассматривает в первой инстанции петиции против органов власти. Граждане могут обращаться к нему напрямую, чтобы оспорить решения государственных органов."
      es: El nombre del Tribunal Supremo de Israel cuando actúa como tribunal de primera instancia para recursos contra las autoridades del Estado. Los ciudadanos pueden acudir directamente a él para pedir amparo frente a decisiones de organismos públicos.
      fr: Le nom de la Cour suprême d’Israël lorsqu’elle siège en première instance pour des recours contre les autorités publiques. Les citoyens peuvent s’y adresser directement pour contester des décisions d’organismes publics.
    sourceUrl: "https://main.knesset.gov.il/About/Lexicon/Pages/upper_crt.aspx"
  - category: israel
    term:
      he: היועץ המשפטי לממשלה
      en: Attorney General of Israel
      ar: "المستشار القضائي للحكومة"
      ru: "Юридический советник правительства"
      es: Fiscal General de Israel
      fr: Conseiller juridique du gouvernement (procureur général)
    def:
      he: ראש מערך הייעוץ המשפטי של הרשות המבצעת והתובע הכללי של המדינה. תפקידו לייעץ לממשלה, לייצג אותה בבתי המשפט ולפקח על שמירת החוק בפעולות השלטון.
      en: The head of the legal advisory system for the executive branch and the state's chief public prosecutor. The role is to advise the government, represent it in court, and oversee that government actions comply with the law.
      ar: "رئيس منظومة الاستشارة القانونية للسلطة التنفيذية والمدّعي العام الأعلى للدولة. ودوره تقديم المشورة للحكومة وتمثيلها في المحاكم والرقابة على التزام أعمال الحكم بالقانون."
      ru: "Глава системы юридических советников исполнительной власти и главный государственный обвинитель. Задача этой должности — консультировать правительство, представлять его в суде и следить за соответствием действий власти закону."
      es: El jefe del sistema de asesoría jurídica del poder ejecutivo y principal fiscal del Estado. Su función es asesorar al Gobierno, representarlo ante los tribunales y velar por que la actuación del Gobierno respete la ley.
      fr: Le chef du système de conseil juridique de l’exécutif et principal procureur de l’État. Son rôle est de conseiller le gouvernement, de le représenter devant les tribunaux et de veiller à ce que l’action du gouvernement respecte la loi.
    sourceUrl: "https://www.idi.org.il/articles/47330"
  - category: israel
    term:
      he: מבקר המדינה
      en: State Comptroller
      ar: "مراقب الدولة"
      ru: "Государственный контролёр"
      es: Contralor del Estado
      fr: Contrôleur de l’État
    def:
      he: גוף ביקורת עצמאי הבודק את חוקיות, היעילות והתקינות של פעילות הגופים הציבוריים, ומפרסם דוחות לציבור. המבקר משמש גם כנציב תלונות הציבור.
      en: An independent oversight body that examines the legality, efficiency, and integrity of public bodies' activities and publishes reports to the public. The Comptroller also serves as the national Ombudsman for public complaints.
      ar: "هيئة رقابة مستقلة تفحص قانونية أعمال الهيئات العامة ونجاعتها ونزاهتها، وتنشر تقارير للجمهور. ويشغل المراقب أيضًا منصب مفوّض شكاوى الجمهور."
      ru: "Независимый надзорный орган, проверяющий законность, эффективность и добросовестность деятельности государственных органов и публикующий отчёты. Контролёр также исполняет обязанности омбудсмена по жалобам граждан."
      es: Un órgano de control independiente que examina la legalidad, la eficiencia y la integridad de la actuación de los organismos públicos y publica informes para el público. El Contralor también ejerce como Defensor del Pueblo para las quejas del público.
      fr: Un organe de contrôle indépendant qui examine la légalité, l’efficacité et l’intégrité de l’action des organismes publics et publie des rapports destinés au public. Le Contrôleur fait aussi office de médiateur pour les plaintes du public.
    sourceUrl: "https://main.knesset.gov.il/About/Lexicon/Pages/critic.aspx"
  - category: israel
    term:
      he: ועדות הכנסת
      en: Knesset Committees
      ar: "لجان الكنيست"
      ru: "Комиссии Кнессета"
      es: Comisiones de la Knéset
      fr: Commissions de la Knesset
    def:
      he: צוותי עבודה קבועים של חברי כנסת המתמחים בתחומים מסוימים, כמו כספים, חוץ וביטחון או חוקה. הוועדות דנות בהצעות חוק, מפקחות על הממשלה ומכינות חקיקה לקראת ההצבעה במליאה.
      en: Standing working groups of members of Knesset that specialize in specific areas, such as finance, foreign affairs and defense, or constitution. The committees debate bills, oversee the government, and prepare legislation before votes in the plenum.
      ar: "فرق عمل دائمة من أعضاء الكنيست تتخصّص في مجالات محددة، مثل المالية أو الخارجية والأمن أو الدستور. تناقش اللجان مشاريع القوانين، وتراقب الحكومة، وتُعدّ التشريعات قبل التصويت في الهيئة العامة."
      ru: "Постоянные рабочие группы депутатов, специализирующиеся на определённых областях — финансах, иностранных делах и обороне, конституции и др. Комиссии обсуждают законопроекты, контролируют правительство и готовят законы к голосованию в пленуме."
      es: Grupos de trabajo permanentes de diputados especializados en ámbitos concretos, como finanzas, asuntos exteriores y defensa o constitución. Las comisiones debaten proyectos de ley, controlan al Gobierno y preparan la legislación antes de las votaciones en el pleno.
      fr: Des groupes de travail permanents de députés spécialisés dans des domaines précis, comme les finances, les affaires étrangères et la défense ou la constitution. Les commissions examinent les projets de loi, contrôlent le gouvernement et préparent la législation avant les votes en plénière.
    sourceUrl: "https://main.knesset.gov.il/About/Lexicon/Pages/vaadot_kevuot.aspx"
  - category: israel
    term:
      he: הקו הירוק
      en: Green Line
      ar: "الخط الأخضر"
      ru: "Зелёная черта"
      es: Línea Verde
      fr: Ligne verte
    def:
      he: קו שביתת הנשק שנקבע בהסכמים בשנת 1949 בין ישראל למדינות שכנותיה, לאחר מלחמת העצמאות. הוא משמש כקו ייחוס נפוץ בין שטח ישראל לבין השטחים שנכבשו במלחמת 1967.
      en: The armistice line set in the 1949 agreements between Israel and its neighboring states after the War of Independence. It serves as a common reference line between Israel's territory and the areas captured in the 1967 war.
      ar: "خط الهدنة الذي حُدّد في اتفاقيات عام 1949 بين إسرائيل والدول المجاورة بعد حرب 1948. ويُستخدم خطًّا مرجعيًا شائعًا بين أراضي إسرائيل والمناطق التي سيطرت عليها في حرب 1967."
      ru: "Линия перемирия, установленная соглашениями 1949 года между Израилем и соседними государствами после Войны за независимость. Служит распространённой линией отсчёта между территорией Израиля и районами, занятыми в войне 1967 года."
      es: La línea de armisticio fijada en los acuerdos de 1949 entre Israel y sus Estados vecinos tras la Guerra de la Independencia. Sirve como línea de referencia común entre el territorio de Israel y las zonas capturadas en la guerra de 1967.
      fr: La ligne d’armistice fixée par les accords de 1949 entre Israël et les États voisins après la guerre d’Indépendance. Elle sert de ligne de référence commune entre le territoire d’Israël et les zones conquises lors de la guerre de 1967.
    sourceUrl: "https://pop.education.gov.il/tchumey_daat/geography_adam_sviva/chativa-elyona/noseem_nilmadim/gvolot-israel-new/"
  - category: israel
    term:
      he: חוק השבות
      en: Law of Return
      ar: "قانون العودة"
      ru: "Закон о возвращении"
      es: Ley del Retorno
      fr: Loi du retour
    def:
      he: חוק ישראלי משנת 1950 המעניק לכל יהודי את הזכות לעלות לישראל ולקבל אזרחות. החוק הורחב מאוחר יותר לבני זוג, ילדים ונכדים של יהודים.
      en: A 1950 Israeli law granting every Jew the right to immigrate to Israel and obtain citizenship. The law was later extended to spouses, children, and grandchildren of Jews.
      ar: "قانون إسرائيلي من عام 1950 يمنح كل يهودي حق الهجرة إلى إسرائيل والحصول على الجنسية. ووُسّع لاحقًا ليشمل أزواج اليهود وأبناءهم وأحفادهم."
      ru: "Израильский закон 1950 года, дающий каждому еврею право репатриироваться в Израиль и получить гражданство. Позднее его действие распространили на супругов, детей и внуков евреев."
      es: Una ley israelí de 1950 que concede a todo judío el derecho a inmigrar a Israel y obtener la ciudadanía. La ley se amplió después a los cónyuges, hijos y nietos de judíos.
      fr: Une loi israélienne de 1950 accordant à tout Juif le droit d’immigrer en Israël et d’obtenir la citoyenneté. La loi a ensuite été étendue aux conjoints, enfants et petits-enfants de Juifs.
    sourceUrl: "https://main.knesset.gov.il/apps/legislation/main/laws/2000587"
  - category: israel
    term:
      he: חוק הלאום
      en: Nation-State Law
      ar: "قانون القومية"
      ru: "Закон о национальном государстве"
      es: Ley del Estado-Nación
      fr: Loi sur l’État-nation
    def:
      he: חוק יסוד שהתקבל ב-2018 המגדיר את ישראל כמדינת הלאום של העם היהודי וקובע סמלים, שפה ועקרונות לאומיים. החוק עורר ויכוח ציבורי לגבי מעמדם של אזרחים שאינם יהודים.
      en: A Basic Law passed in 2018 that defines Israel as the nation-state of the Jewish people and sets out national symbols, language, and principles. The law sparked public debate over the status of non-Jewish citizens.
      ar: "قانون أساس أُقرّ عام 2018 يعرّف إسرائيل بوصفها الدولة القومية للشعب اليهودي، ويحدّد الرموز واللغة والمبادئ القومية. وأثار القانون نقاشًا عامًا حول مكانة المواطنين غير اليهود."
      ru: "Основной закон 2018 года, определяющий Израиль как национальное государство еврейского народа и устанавливающий национальные символы, язык и принципы. Закон вызвал общественную дискуссию о статусе граждан-неевреев."
      es: Una Ley Fundamental aprobada en 2018 que define a Israel como el Estado-nación del pueblo judío y establece los símbolos nacionales, la lengua y los principios. La ley suscitó un debate público sobre el estatus de los ciudadanos no judíos.
      fr: Une Loi fondamentale adoptée en 2018 qui définit Israël comme l’État-nation du peuple juif et fixe les symboles nationaux, la langue et les principes. La loi a suscité un débat public sur le statut des citoyens non juifs.
    sourceUrl: "https://main.knesset.gov.il/News/PressReleases/pages/press19.07.18.aspx"
  - category: israel
    term:
      he: הוועדה לבחירת שופטים
      en: Judicial Selection Committee
      ar: "لجنة تعيين القضاة"
      ru: "Комиссия по назначению судей"
      es: Comité de Selección Judicial
      fr: Comité de sélection des juges
    def:
      he: "ועדה המוסמכת למנות שופטים בישראל, המורכבת מנציגי הרשות השופטת, הממשלה, הכנסת ולשכת עורכי הדין. תיקון לחוק-יסוד: השפיטה שאישרה הכנסת ב-27 במרץ 2025 מחליף, החל מהכנסת ה-26, את שני נציגי לשכת עורכי הדין בשני נציגי ציבור — אחד שתבחר הקואליציה ואחד שתבחר האופוזיציה; נגד התיקון הוגשו עתירות לבג\"ץ. הרכב הוועדה ואופן עבודתה נמצאים במוקד דיונים ציבוריים על האיזון בין הרשויות."
      en: "The committee authorized to appoint judges in Israel, made up of representatives of the judiciary, the government, the Knesset and the Israel Bar Association. An amendment to Basic Law: The Judiciary, passed by the Knesset on 27 March 2025, replaces the two Bar Association representatives with two public representatives — one chosen by the coalition and one by the opposition — from the 26th Knesset on; petitions against it were filed with the High Court of Justice. Its composition and procedures are at the center of public debate over the balance between the branches of government."
      ar: "اللجنة المخوّلة تعيين القضاة في إسرائيل، وتتألف من ممثلين عن السلطة القضائية والحكومة والكنيست ونقابة المحامين. وتعديلٌ لقانون أساس: القضاء أقرّه الكنيست في 27 آذار/مارس 2025 يستبدل، ابتداءً من الكنيست الـ26، ممثلَي نقابة المحامين بممثلَين اثنين عن الجمهور — أحدهما يختاره الائتلاف والآخر تختاره المعارضة؛ وقُدّمت ضد التعديل التماسات إلى محكمة العدل العليا. وتركيبة اللجنة وطريقة عملها في صلب نقاش عام حول التوازن بين السلطات."
      ru: "Комиссия, уполномоченная назначать судей в Израиле; в неё входят представители судебной власти, правительства, Кнессета и коллегии адвокатов. Поправка к Основному закону о судебной власти, принятая Кнессетом 27 марта 2025 года, начиная с Кнессета 26-го созыва заменяет двух представителей коллегии адвокатов двумя представителями общественности — одного выбирает коалиция, другого оппозиция; против поправки поданы петиции в БАГАЦ. Состав комиссии и порядок её работы — в центре общественной дискуссии о балансе ветвей власти."
      es: "El comité facultado para nombrar a los jueces en Israel, formado por representantes del poder judicial, el Gobierno, la Knéset y el Colegio de Abogados. Una enmienda a la Ley Básica: El Poder Judicial, aprobada por la Knéset el 27 de marzo de 2025, sustituye a partir de la 26.ª Knéset a los dos representantes del Colegio de Abogados por dos representantes públicos —uno elegido por la coalición y otro por la oposición—; contra ella se presentaron recursos ante el Tribunal Superior de Justicia. Su composición y sus procedimientos están en el centro del debate público sobre el equilibrio entre los poderes del Estado."
      fr: "Le comité habilité à nommer les juges en Israël, composé de représentants du pouvoir judiciaire, du gouvernement, de la Knesset et du barreau. Un amendement à la Loi fondamentale : le pouvoir judiciaire, adopté par la Knesset le 27 mars 2025, remplace à partir de la 26e Knesset les deux représentants du barreau par deux représentants du public — l’un choisi par la coalition, l’autre par l’opposition ; des recours ont été déposés contre lui devant la Haute Cour de justice. Sa composition et ses procédures sont au cœur du débat public sur l’équilibre entre les pouvoirs."
    sourceUrl: "https://www.jpost.com/israel-news/article-847639"
  - category: israel
    term:
      he: פסקת ההתגברות
      en: Override Clause
      ar: "فقرة التغلّب"
      ru: "Положение о преодолении"
      es: Cláusula de anulación
      fr: Clause de dérogation
    def:
      he: הצעה משפטית המאפשרת לכנסת לחוקק מחדש חוק שבית המשפט פסל, או לחסן חוק מפני ביקורת שיפוטית, ברוב מסוים. ההצעה נמצאת במחלוקת משום שהיא משנה את היחס בין הכנסת לבית המשפט.
      en: A proposed legal mechanism allowing the Knesset to re-enact a law that the court struck down, or to shield a law from judicial review, by a certain majority. The proposal is contested because it changes the relationship between the Knesset and the courts.
      ar: "آلية قانونية مقترحة تتيح للكنيست إعادة سنّ قانون ألغته المحكمة، أو تحصين قانون من الرقابة القضائية، بأغلبية معيّنة. والاقتراح موضع خلاف لأنه يغيّر العلاقة بين الكنيست والمحاكم."
      ru: "Предлагаемый правовой механизм, позволяющий Кнессету определённым большинством повторно принять закон, отменённый судом, или защитить закон от судебного контроля. Предложение спорно, поскольку меняет отношения между Кнессетом и судами."
      es: Un mecanismo legal propuesto que permitiría a la Knéset volver a aprobar una ley anulada por el tribunal, o proteger una ley del control judicial, por una mayoría determinada. La propuesta es polémica porque cambia la relación entre la Knéset y los tribunales.
      fr: Un mécanisme juridique proposé qui permettrait à la Knesset de réadopter une loi annulée par la cour, ou de soustraire une loi au contrôle juridictionnel, à une certaine majorité. La proposition est contestée parce qu’elle modifie le rapport entre la Knesset et les tribunaux.
    sourceUrl: "https://www.idi.org.il/articles/46267"
  - category: israel
    term:
      he: עילת הסבירות
      en: Reasonableness Standard
      ar: "ذريعة المعقولية"
      ru: "Критерий разумности"
      es: Criterio de razonabilidad
      fr: Critère du caractère raisonnable
    def:
      he: כלל משפטי שלפיו בית המשפט יכול לבטל החלטה של רשות שלטונית אם היא חורגת באופן קיצוני ממתחם ההחלטות הסבירות. הכלי נועד לבדוק אם הרשות שקלה כראוי את כלל השיקולים הרלוונטיים.
      en: A legal principle under which a court can annul a decision by a government authority if it falls extremely outside the range of reasonable decisions. The tool is meant to check whether the authority properly weighed all relevant considerations.
      ar: "مبدأ قانوني يمكن بموجبه للمحكمة إلغاء قرار سلطة حكومية إذا خرج خروجًا متطرفًا عن نطاق القرارات المعقولة. والأداة مخصّصة لفحص ما إذا كانت السلطة قد وازنت كما يجب بين جميع الاعتبارات ذات الصلة."
      ru: "Правовой принцип, согласно которому суд может отменить решение органа власти, если оно крайне выходит за рамки разумных решений. Инструмент позволяет проверить, должным образом ли орган взвесил все относящиеся к делу соображения."
      es: Un principio jurídico según el cual un tribunal puede anular la decisión de una autoridad pública si queda extremadamente fuera del abanico de decisiones razonables. La herramienta sirve para comprobar si la autoridad ponderó debidamente todas las consideraciones pertinentes.
      fr: Un principe juridique selon lequel un tribunal peut annuler la décision d’une autorité publique si elle s’écarte de manière extrême de l’éventail des décisions raisonnables. L’outil sert à vérifier si l’autorité a bien pesé toutes les considérations pertinentes.
    sourceUrl: "https://www.idi.org.il/articles/49979"
  - category: israel
    term:
      he: חסינות חברי הכנסת
      en: Parliamentary Immunity (MK Immunity)
      ar: "حصانة أعضاء الكنيست"
      ru: "Депутатская неприкосновенность"
      es: Inmunidad parlamentaria (de los diputados)
      fr: Immunité parlementaire (des députés)
    def:
      he: הגנה משפטית המעניקה לחברי הכנסת חופש פעולה במילוי תפקידם, כדי שלא ייחשפו לתביעות בשל דעותיהם והצבעותיהם. חסינות מסוימת ניתנת להסרה על ידי הכנסת בנסיבות מוגדרות.
      en: A legal protection that gives members of Knesset freedom to perform their duties without facing lawsuits over their opinions and votes. Certain types of immunity can be lifted by the Knesset under defined circumstances.
      ar: "حماية قانونية تمنح أعضاء الكنيست حرية أداء مهامهم دون التعرّض لدعاوى بسبب آرائهم وتصويتهم. ويمكن للكنيست رفع أنواع معيّنة من الحصانة في ظروف محددة."
      ru: "Правовая защита, позволяющая депутатам Кнессета выполнять свои обязанности, не опасаясь исков из-за своих мнений и голосований. Некоторые виды неприкосновенности Кнессет может снять при определённых обстоятельствах."
      es: Una protección legal que da a los diputados libertad para ejercer sus funciones sin enfrentarse a demandas por sus opiniones y votos. Ciertos tipos de inmunidad pueden ser levantados por la Knéset en circunstancias definidas.
      fr: Une protection juridique qui donne aux députés la liberté d’exercer leurs fonctions sans s’exposer à des poursuites pour leurs opinions et leurs votes. Certains types d’immunité peuvent être levés par la Knesset dans des circonstances définies.
    sourceUrl: "https://www.idi.org.il/articles/38871"
  - category: israel
    term:
      he: אי-אמון בונה (קונסטרוקטיבי)
      en: Constructive Vote of No Confidence
      ar: "حجب الثقة البنّاء"
      ru: "Конструктивный вотум недоверия"
      es: Moción de censura constructiva
      fr: Motion de censure constructive
    def:
      he: הליך שבו הכנסת יכולה להפיל ממשלה רק אם רוב חבריה תומכים בו-זמנית בהקמת ממשלה חלופית. הכלל נועד למנוע משברים ולהבטיח יציבות שלטונית.
      en: A procedure in which the Knesset can remove a government only if a majority of its members simultaneously support forming an alternative government. The rule is designed to prevent crises and ensure governmental stability.
      ar: "إجراء لا يستطيع فيه الكنيست إسقاط الحكومة إلا إذا أيّدت أغلبية أعضائه في الوقت نفسه تشكيل حكومة بديلة. وتهدف القاعدة إلى منع الأزمات وضمان استقرار الحكم."
      ru: "Процедура, при которой Кнессет может отправить правительство в отставку, только если большинство депутатов одновременно поддерживает формирование альтернативного правительства. Правило призвано предотвращать кризисы и обеспечивать устойчивость власти."
      es: Un procedimiento por el que la Knéset solo puede destituir a un gobierno si una mayoría de sus miembros apoya al mismo tiempo la formación de un gobierno alternativo. La regla busca evitar crisis y garantizar la estabilidad gubernamental.
      fr: Une procédure par laquelle la Knesset ne peut renverser un gouvernement que si une majorité de ses membres soutient simultanément la formation d’un gouvernement alternatif. La règle vise à prévenir les crises et à assurer la stabilité gouvernementale.
