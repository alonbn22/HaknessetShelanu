      he: נטלה אחריות על הצבעה בטעות של האופוזיציה בעד העברת כ-800 מיליון ש"ח למוסדות חרדיים
      en: Took responsibility for the opposition mistakenly voting for a NIS 800 million allocation to Haredi institutions
    description:
      he: "בהצבעות על תקציב 2026 בלילה שבין 29 ל-30 במרץ 2026 הצביעו חברי האופוזיציה בטעות בעד הסתייגות שהעבירה כ-800 מיליון ש\"ח לתוכניות ולישיבות חרדיות, שעברה ברוב של 107 מול 4. בן ארי, מרכזת האופוזיציה, נטלה אחריות והתנצלה בפני עמיתיה: \"הפעם לא הייתי ערנית וטעיתי\". היועצת המשפטית לממשלה הקפיאה את ההעברות."
      en: "During the votes on the 2026 budget on the night of 29–30 March 2026, opposition MKs mistakenly voted for a reservation transferring about NIS 800 million to Haredi programmes and yeshivas, which passed 107-4. Ben-Ari, the opposition coordinator, took responsibility and apologised to colleagues: \"This time I was not vigilant and I was wrong.\" The Attorney General froze the transfers."
