      he: עימות עם חיילים בכניסה לכפר קוסרא
      en: Confrontation with soldiers at the entrance to the village of Kusra
    description:
      he: ב-25 באוגוסט 2026 ניסה כסיף להיכנס לכפר קוסרא שבשומרון, שהוכרז שטח צבאי
        סגור לאחר עימותים בין מתנחלים לפלסטינים, וטען כי חיילים תקפו אותו
