      he: "התפטר מהממשלה עם פרישת ש\"ס; ממשיך כחבר כנסת"
      en: "Resigned from the government when Shas withdrew; continues as an MK"
    description:
      he: "ב-16 ביולי 2025 הקריא מלכיאלי את הודעת מועצת חכמי התורה על פרישת ש\"ס מהממשלה על רקע המחלוקת על חוק הגיוס, ושרי ש\"ס, ובהם מלכיאלי, הגישו את התפטרותם. הוא ממשיך לכהן כחבר כנסת מטעם ש\"ס, שנותרה חלק מהקואליציה."
      en: "On 16 July 2025 Malchieli read out the Council of Torah Sages' statement on Shas leaving the government over the dispute on the conscription law, and the Shas ministers, including Malchieli, submitted their resignations. He continues to serve as a Knesset member for Shas, which remained part of the coalition."
