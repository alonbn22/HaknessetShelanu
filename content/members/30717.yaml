    title:
      he: הודיע על פרישה מהחיים הפוליטיים ולא יתמודד לכנסת ה-26
      en: Announced his retirement from politics; will not run for the 26th Knesset
    description:
      he: ב-15 ביולי 2026, כשבוע וחצי לפני הפריימריז בציונות הדתית, הודיע סופר כי "החלטתי שלא להיות מועמד לכנסת הבאה" וכי ימשיך לכהן כשר העלייה והקליטה "במסירות עד תום הקדנציה". לפי הדיווחים, ההודעה באה על רקע מחלוקות בינו לבין יו"ר המפלגה בצלאל סמוטריץ', בעיקר סביב חקיקת חוק הגיוס; סמוטריץ' מסר כי הוא מכבד את ההחלטה והודה לו על שנות העבודה המשותפת.
      en: On 15 July 2026, about a week and a half before the Religious Zionism party primary, Sofer announced that "I have decided not to be a candidate for the next Knesset" and that he would continue to serve as Minister of Aliyah and Integration "with dedication until the end of the term". According to the reports, the announcement followed disagreements between him and party chairman Bezalel Smotrich, mainly over the draft-law legislation; Smotrich said he respected the decision and thanked him for their years of joint work.
