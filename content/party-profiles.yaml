  - id: 1103 # Hadash-Ta'al
    verified: "2026-09-19"
    updates:
      - date: "2025-06-20"
        text:
          he: "ח\"כ יוסף עטאונה (חד\"ש) התפטר מהכנסת במסגרת הסכם רוטציה בתוך הסיעה; במקומו נכנס סמיר בן סעיד (תע\"ל)."
          en: "MK Yousef Atauna (Hadash) resigned from the Knesset under a rotation agreement within the faction; Samir Ben Said (Ta’al) took his seat."
          ar: "استقال عضو الكنيست يوسف عطاونة (الجبهة) من الكنيست في إطار اتفاق تناوب داخل الكتلة؛ ودخل مكانه سمير بن سعيد (العربية للتغيير)."
          ru: "Депутат Юсеф Атауна («Хадаш») сложил мандат в рамках соглашения о ротации внутри фракции; его место занял Самир Бен Саид («Тааль»)."
          es: "El diputado Yousef Atauna (Hadash) renunció a la Knéset en virtud de un acuerdo de rotación dentro de la facción; Samir Ben Said (Ta’al) ocupó su escaño."
          fr: "Le député Yousef Atauna (Hadash) a démissionné de la Knesset en vertu d’un accord de rotation au sein de la faction ; Samir Ben Said (Ta’al) a pris son siège."
        sources:
          - { url: "https://zoha.org.il/138082/", title: "ח\"כ עטאונה הגיש את מכתב התפטרותו מהכנסת במסגרת הסכם הרוטציה בסיעת חד\"ש-תע\"ל (2025-06-18)", publisher: "זו הדרך" }
          - { url: "https://main.knesset.gov.il/mk/apps/faction/faction-lobby?KnessetID=25&FactionID=1103", title: "סיעת חד\"ש-תע\"ל — חילופי גברי: 20/06/2025 סמיר בן סעיד נכנס במקום יוסף עטאונה (2026-09-19)", publisher: "הכנסת" }
          - { url: "https://knesset.gov.il/OdataV4/ParliamentInfo/KNS_PersonToPosition?$filter=KnessetNum%20eq%2025%20and%20FactionID%20eq%201103%20and%20PositionID%20eq%2054", title: "KNS_PersonToPosition — faction 1103 members (Atauna FinishDate 2025-06-20; Ben Said StartDate 2025-06-20) (2026-09-19)", publisher: "Knesset OData" }
      - date: "2025-07-14"
        text:
          he: "הצעה להדיח את ח\"כ איימן עודה מהכנסת (על רקע התבטאויות מינואר וממאי 2025 על שחרור חטופים ואסירים) זכתה ל-73 תומכים מול 15 מתנגדים במליאה, פחות מ-90 הקולות הנדרשים, ונדחתה. ועדת הכנסת אישרה את הבקשה ביוני 2025."
          en: "A motion to remove MK Ayman Odeh from the Knesset (over statements in January and May 2025 about the release of hostages and prisoners) received 73 votes in favour and 15 against in the plenum, short of the 90 required, and failed. The House Committee had approved the request in June 2025."
          ar: "حصل اقتراح إقصاء عضو الكنيست أيمن عودة من الكنيست (على خلفية تصريحات في كانون الثاني/يناير وأيار/مايو 2025 بشأن الإفراج عن الرهائن والأسرى) على تأييد 73 عضوًا مقابل معارضة 15 في الهيئة العامة، أي أقل من الأصوات الـ90 المطلوبة، فسقط. وكانت لجنة الكنيست قد صادقت على الطلب في حزيران/يونيو 2025."
          ru: "Предложение об исключении депутата Аймана Оде из Кнессета (из-за его высказываний в январе и мае 2025 года об освобождении заложников и заключённых) получило в пленуме 73 голоса «за» при 15 «против» — меньше необходимых 90 — и было отклонено. Комиссия Кнессета одобрила запрос в июне 2025 года."
          es: "Una moción para expulsar de la Knéset al diputado Ayman Odeh (por declaraciones de enero y mayo de 2025 sobre la liberación de rehenes y presos) obtuvo 73 votos a favor y 15 en contra en el pleno, por debajo de los 90 requeridos, y fracasó. La Comisión de la Knéset (House Committee) había aprobado la solicitud en junio de 2025."
          fr: "Une motion visant à révoquer le député Ayman Odeh de la Knesset (pour des déclarations de janvier et de mai 2025 sur la libération d’otages et de prisonniers) a recueilli 73 voix pour et 15 contre en plénière, moins que les 90 requises, et a échoué. La Commission de la Knesset avait approuvé la demande en juin 2025."
        sources:
          - { url: "https://www.timesofisrael.com/motion-to-expel-odeh-from-knesset-fails-to-pass-amid-heckling-by-coalition-members/", title: "Motion to expel Arab party head Odeh from Knesset fails; coalition MKs heckle him (2025-07-15)", publisher: "The Times of Israel" }
      - date: "2026-01-22"
        text:
          he: "ראשי חד\"ש, תע\"ל, בל\"ד ורע\"ם חתמו בסח'נין על התחייבות לפעול להקמת הרשימה המשותפת מחדש, ביום השביתה הכללית בחברה הערבית נגד הפשיעה."
          en: "The heads of Hadash, Ta’al, Balad and Ra’am signed in Sakhnin a commitment to work toward re-establishing the Joint List, on the day of the Arab community’s general strike over violent crime."
          ar: "وقّع رؤساء الجبهة والعربية للتغيير والتجمع والقائمة الموحدة في سخنين تعهّدًا بالعمل على إعادة تشكيل القائمة المشتركة، في يوم الإضراب العام في المجتمع العربي احتجاجًا على الجريمة."
          ru: "Лидеры «Хадаш», «Тааль», «Балад» и РААМ подписали в Сахнине обязательство добиваться воссоздания «Объединённого списка» — в день всеобщей забастовки арабского общества против преступности."
          es: "Los dirigentes de Hadash, Ta’al, Balad y Ra’am firmaron en Sajnin un compromiso de trabajar por el restablecimiento de la Lista Conjunta, el día de la huelga general de la comunidad árabe contra la violencia criminal."
          fr: "Les dirigeants de Hadash, Ta’al, Balad et Ra’am ont signé à Sakhnin un engagement à œuvrer au rétablissement de la Liste commune, le jour de la grève générale de la communauté arabe contre la criminalité violente."
        sources:
          - { url: "https://www.timesofisrael.com/under-pressure-arab-knesset-parties-sign-agreement-to-work-toward-reviving-joint-list/", title: "Under pressure, Arab Knesset parties sign agreement to work toward reviving Joint List (2026-01-22)", publisher: "The Times of Israel" }
          - { url: "https://www.ynet.co.il/news/article/bye65yguwl", title: "ראשי המפלגות הערביות הסכימו: נפעל להקמת הרשימה המשותפת מחדש (2026-01-22)", publisher: "ynet" }
      - date: "2026-05-16"
        text:
          he: "מועצת חד\"ש (966 צירים) בדיר חנא בחרה בד\"ר יוסף ג'בארין, ח\"כ לשעבר (2015–2021), ליו\"ר המפלגה במקום איימן עודה, שלא התמודד שוב ופורש מהכנסת בתום הקדנציה; אחריו נבחרו, בין השאר, עופר כסיף, יוסף עטאונה, נהאיה ושאחי ואיאס נאטור."
          en: "Hadash’s 966-delegate council in Deir Hanna elected Dr. Yousef Jabareen, a former MK (2015–2021), as party chair in place of Ayman Odeh, who did not run again and leaves the Knesset at the end of the term; Ofer Cassif, Yousef Atauna, Nihaya Wishahi and Ayas Natur were among those elected to the next slots."
          ar: "انتخب مجلس الجبهة (966 مندوبًا) في دير حنا د. يوسف جبارين، عضو الكنيست السابق (2015–2021)، رئيسًا للحزب خلفًا لأيمن عودة، الذي لم يترشح مجددًا ويعتزل الكنيست في نهاية الدورة؛ وانتُخب بعده، من بين آخرين، عوفر كسيف ويوسف عطاونة ونهاية وشاحي وإياس ناطور."
          ru: "Совет «Хадаш» (966 делегатов) в Дейр-Ханне избрал председателем партии д-ра Юсефа Джабарина, бывшего депутата (2015–2021), вместо Аймана Оде, который не баллотировался снова и уходит из Кнессета по окончании каденции; на следующие места избраны, в частности, Офер Касиф, Юсеф Атауна, Нихая Вишахи и Аяс Натур."
          es: "El consejo de Hadash, con 966 delegados, reunido en Deir Hanna, eligió al Dr. Yousef Jabareen, exdiputado (2015–2021), como presidente del partido en lugar de Ayman Odeh, que no se presentó de nuevo y deja la Knéset al final de la legislatura; Ofer Cassif, Yousef Atauna, Nihaya Wishahi y Ayas Natur estuvieron entre los elegidos para los siguientes puestos."
          fr: "Le conseil de Hadash, fort de 966 délégués, réuni à Deir Hanna, a élu le Dr Yousef Jabareen, ancien député (2015–2021), à la présidence du parti à la place d’Ayman Odeh, qui ne s’est pas représenté et quitte la Knesset à la fin de la législature ; Ofer Cassif, Yousef Atauna, Nihaya Wishahi et Ayas Natur figuraient parmi les élus aux places suivantes."
        sources:
          - { url: "https://www.timesofisrael.com/former-mk-yousef-jabareen-elected-leader-of-arab-majority-party-hadash/", title: "Former MK Yousef Jabareen elected leader of Arab-majority party Hadash (2026-05-16)", publisher: "The Times of Israel" }
