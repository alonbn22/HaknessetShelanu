    tags: [liberal, secular, centrist]
    summary:
      he: מפלגת מרכז ליברלית-חילונית המייצגת בעיקר את מעמד הביניים.
      en: A liberal, secular centrist party representing mainly the middle class.
      ar: حزب وسطي ليبرالي علماني يمثّل أساسًا الطبقة الوسطى.
      ru: Либеральная светская центристская партия, представляющая в основном средний класс.
      es: "Un partido centrista, liberal y laico que representa sobre todo a la clase media."
      fr: "Un parti centriste, libéral et laïc représentant surtout la classe moyenne."
    positions:
      he:
        - הפרדת דת ומדינה ושוויון בנטל (גיוס חרדים)
        - חיזוק החינוך הממלכתי ומעמד הביניים
        - תמיכה בפתרון מדיני מול הפלסטינים
      en:
        - Separation of religion and state and equal sharing of the draft burden
        - Strengthening public education and the middle class
        - Support for a negotiated settlement with the Palestinians
      ar:
        - "فصل الدين عن الدولة والمساواة في عبء الخدمة العسكرية"
        - "تعزيز التعليم الرسمي والطبقة الوسطى"
        - "دعم تسوية تفاوضية مع الفلسطينيين"
      ru:
        - "Отделение религии от государства и равное бремя призыва"
        - "Укрепление государственного образования и среднего класса"
        - "Поддержка урегулирования с палестинцами путём переговоров"
      es:
        - Separación de religión y Estado y reparto igualitario de la carga del servicio militar
        - Fortalecer la educación pública y la clase media
        - Apoyo a un acuerdo negociado con los palestinos
      fr:
        - Séparation de la religion et de l’État et partage égal du fardeau du service militaire
        - Renforcer l’éducation publique et la classe moyenne
        - Soutien à un règlement négocié avec les Palestiniens
  - id: 1095 # Shas
    verified: "2026-09-19"
    updates:
      - date: "2025-07-16"
        text:
          he: "מועצת חכמי התורה של ש\"ס הורתה לשרי המפלגה להתפטר מהממשלה בשל אי-חקיקת חוק הפטור מגיוס לבני ישיבות; ש\"ס נשארה בקואליציה והודיעה שלא תצטרף לאופוזיציה כדי להפיל את הממשלה."
          en: "Shas’s Council of Torah Sages ordered the party’s ministers to resign from the government over the failure to pass a draft-exemption law for yeshiva students; Shas stayed in the coalition and said it would not join the opposition to topple the government."
          ar: "أمر مجلس حكماء التوراة في شاس وزراءَ الحزب بالاستقالة من الحكومة بسبب عدم سنّ قانون إعفاء طلاب المعاهد الدينية من التجنيد؛ وبقي شاس في الائتلاف وأعلن أنه لن ينضم إلى المعارضة لإسقاط الحكومة."
          ru: "Совет мудрецов Торы ШАС поручил министрам партии уйти из правительства из-за того, что закон об освобождении учащихся ешив от призыва так и не был принят; ШАС осталась в коалиции и заявила, что не присоединится к оппозиции, чтобы свалить правительство."
          es: "El Consejo de Sabios de la Torá de Shas ordenó a los ministros del partido renunciar del Gobierno por la no aprobación de una ley de exención del servicio militar para los estudiantes de yeshivá; Shas siguió en la coalición y dijo que no se uniría a la oposición para derribar al Gobierno."
          fr: "Le Conseil des sages de la Torah de Shas a ordonné aux ministres du parti de démissionner du gouvernement en raison de l’échec de l’adoption d’une loi d’exemption de service militaire pour les étudiants de yeshiva ; Shas est resté dans la coalition et a déclaré qu’il ne rejoindrait pas l’opposition pour renverser le gouvernement."
        sources:
          - { url: "https://www.ynet.co.il/news/article/rknlxehlgg", title: "המשבר הפוליטי: ש\"ס פורשת מהממשלה (2025-07-16)", publisher: "Ynet" }
          - { url: "https://www.jpost.com/israel-news/article-861246", title: "Shas spiritual leaders order party members to quit government (2025-07-16)", publisher: "The Jerusalem Post" }
      - date: "2025-07-17"
        text:
          he: "שרי ש\"ס הגישו את התפטרותם: משה ארבל (פנים), יעקב מרגי (רווחה), מיכאל מלכיאלי (שירותי דת), אוריאל בוסו (בריאות) ויואב בן צור (עבודה), וכן סגני השרים חיים ביטון ומשה אבוטבול; כהונת ארבל כשר הפנים הסתיימה ב-22 ביולי 2025."
          en: "Shas’s ministers filed their resignations: Moshe Arbel (Interior), Yaakov Margi (Welfare), Michael Malkieli (Religious Services), Uriel Busso (Health) and Yoav Ben Tzur (Labor), plus deputy ministers Haim Biton and Moshe Abutbul; Arbel’s term as interior minister ended on 22 July 2025."
          ar: "قدّم وزراء شاس استقالاتهم: موشيه أربيل (الداخلية)، ويعقوب مرغي (الرفاه)، وميخائيل ملكيئيلي (الخدمات الدينية)، وأوريئيل بوسو (الصحة)، ويوآف بن تسور (العمل)، وكذلك نائبا الوزير حاييم بيتون وموشيه أبوطبول؛ وانتهت ولاية أربيل وزيرًا للداخلية في 22 تموز/يوليو 2025."
          ru: "Министры ШАС подали в отставку: Моше Арбель (внутренних дел), Яаков Марги (социального обеспечения), Михаэль Малькиэли (по делам религий), Уриэль Бусо (здравоохранения) и Йоав Бен-Цур (труда), а также заместители министров Хаим Битон и Моше Абутбуль; полномочия Арбеля как министра внутренних дел прекратились 22 июля 2025 года."
          es: "Los ministros de Shas presentaron sus renuncias: Moshe Arbel (Interior), Yaakov Margi (Bienestar), Michael Malkieli (Servicios Religiosos), Uriel Busso (Salud) y Yoav Ben Tzur (Trabajo), además de los viceministros Haim Biton y Moshe Abutbul; el mandato de Arbel como ministro del Interior terminó el 22 de julio de 2025."
          fr: "Les ministres de Shas ont remis leurs démissions : Moshe Arbel (Intérieur), Yaakov Margi (Affaires sociales), Michael Malkieli (Services religieux), Uriel Busso (Santé) et Yoav Ben Tzur (Travail), ainsi que les vice-ministres Haim Biton et Moshe Abutbul ; le mandat d’Arbel comme ministre de l’Intérieur a pris fin le 22 juillet 2025."
        sources:
          - { url: "https://www.timesofisrael.com/liveblog_entry/shas-ministers-file-resignations-as-party-withdraws-from-government/", title: "Shas ministers file resignations as party withdraws from government (2025-07-17)", publisher: "The Times of Israel" }
          - { url: "https://www.ynet.co.il/news/article/rknlxehlgg", title: "המשבר הפוליטי: ש\"ס פורשת מהממשלה (2025-07-16)", publisher: "Ynet" }
          - { url: "https://knesset.gov.il/OdataV4/ParliamentInfo/KNS_PersonToPosition?$filter=PersonID%20eq%2030660%20and%20KnessetNum%20eq%2025", title: "KNS_PersonToPosition — Moshe Arbel (PersonID 30660), Knesset 25 (2026-09-19)", publisher: "Knesset OData" }
      - date: "2025-07-20"
        text:
          he: "בעקבות ההתפטרות מהממשלה שבו לכנסת לפי החוק הנורבגי יעקב מרגי, יואב בן צור וחיים ביטון; חדלו לכהן אברהם בצלאל, סימיון מושיאשוילי וארז מלול."
          en: "Following the ministers’ resignations, Yaakov Margi, Yoav Ben Tzur and Haim Biton returned to the Knesset under the Norwegian law; Avraham Betzalel, Simion Mushiashvili and Erez Malul ceased to serve."
          ar: "في أعقاب الاستقالة من الحكومة عاد إلى الكنيست بموجب «القانون النرويجي» يعقوب مرغي ويوآف بن تسور وحاييم بيتون؛ وانتهت عضوية أفراهام بتسلئيل وسيميون موشياشفيلي وإيرز ملول."
          ru: "После ухода из правительства по «норвежскому закону» в Кнессет вернулись Яаков Марги, Йоав Бен-Цур и Хаим Битон; Авраам Бецалель, Симион Мушиашвили и Эрез Малуль перестали быть депутатами."
          es: "Tras las renuncias de los ministros, Yaakov Margi, Yoav Ben Tzur y Haim Biton volvieron a la Knéset según la Ley Noruega; Avraham Betzalel, Simion Mushiashvili y Erez Malul cesaron en el cargo."
          fr: "À la suite des démissions des ministres, Yaakov Margi, Yoav Ben Tzur et Haim Biton sont revenus à la Knesset en vertu de la « loi norvégienne » ; Avraham Betzalel, Simion Mushiashvili et Erez Malul ont cessé de siéger."
        sources:
          - { url: "https://knesset.gov.il/OdataV4/ParliamentInfo/KNS_PersonToPosition?$filter=FactionID%20eq%201095%20and%20KnessetNum%20eq%2025", title: "KNS_PersonToPosition — FactionID 1095, Knesset 25 (member records with start/finish dates) (2026-09-19)", publisher: "Knesset OData" }
      - date: "2025-07-29"
        text:
          he: "הממשלה העבירה את תיקי ש\"ס לשני שרי ליכוד כממלאי מקום: יריב לוין — פנים, שירותי דת ועבודה; חיים כץ — רווחה ובריאות. ב-24 בנובמבר 2025 נרשמו לוין כשר העבודה, שירותי הדת וירושלים ומסורת ישראל וכץ כשר הבריאות והרווחה; משרד הפנים נותר ללא שר."
          en: "The cabinet transferred the Shas-held portfolios to two Likud ministers in an acting capacity: Yariv Levin — Interior, Religious Services and Labor; Haim Katz — Welfare and Health. On 24 November 2025 Levin was recorded as Minister of Labor, Religious Services, and Jerusalem and Jewish Heritage, and Katz as Minister of Health and of Welfare; the Interior Ministry was left without a minister."
          ar: "نقلت الحكومة حقائب شاس إلى وزيرين من الليكود بالوكالة: ياريف ليفين — الداخلية والخدمات الدينية والعمل؛ وحاييم كاتس — الرفاه والصحة. وفي 24 تشرين الثاني/نوفمبر 2025 سُجّل ليفين وزيرًا للعمل والخدمات الدينية والقدس والتراث اليهودي، وكاتس وزيرًا للصحة والرفاه؛ وبقيت وزارة الداخلية بلا وزير."
          ru: "Правительство передало портфели ШАС двум министрам от Ликуда как исполняющим обязанности: Ярив Левин — внутренние дела, дела религий и труд; Хаим Кац — социальное обеспечение и здравоохранение. 24 ноября 2025 года Левин был записан министром труда, по делам религий и по делам Иерусалима и еврейского наследия, а Кац — министром здравоохранения и социального обеспечения; министерство внутренних дел осталось без министра."
          es: "El Gobierno transfirió las carteras de Shas a dos ministros del Likud con carácter interino: Yariv Levin — Interior, Servicios Religiosos y Trabajo; Haim Katz — Bienestar y Salud. El 24 de noviembre de 2025 Levin quedó registrado como ministro de Trabajo, de Servicios Religiosos y de Jerusalén y Patrimonio Judío, y Katz como ministro de Salud y de Bienestar; el Ministerio del Interior quedó sin ministro."
          fr: "Le gouvernement a confié les portefeuilles détenus par Shas à deux ministres du Likoud par intérim : Yariv Levin — Intérieur, Services religieux et Travail ; Haim Katz — Affaires sociales et Santé. Le 24 novembre 2025, Levin a été enregistré comme ministre du Travail, des Services religieux et de Jérusalem et du Patrimoine juif, et Katz comme ministre de la Santé et des Affaires sociales ; le ministère de l’Intérieur est resté sans ministre."
        sources:
          - { url: "https://www.timesofisrael.com/ministries-previously-held-by-shas-transferred-to-pair-of-likud-ministers/", title: "Ministries previously held by Shas transferred to pair of Likud ministers (2025-07-29)", publisher: "The Times of Israel" }
          - { url: "https://knesset.gov.il/OdataV4/ParliamentInfo/KNS_PersonToPosition?$filter=KnessetNum%20eq%2025%20and%20GovMinistryID%20ne%20null%20and%20IsCurrent%20eq%20true", title: "KNS_PersonToPosition — current government positions, Knesset 25 (Levin: Labor, Religious Services, Jerusalem & Heritage from 2025-11-24; Katz: Health, Welfare from 2025-11-24) (2026-09-19)", publisher: "Knesset OData" }
          - { url: "https://main.knesset.gov.il/mk/government/pages/governments.aspx?govId=37", title: "הממשלה ה-37 — הרכב הממשלה (2026-09-19)", publisher: "Knesset" }
          - { url: "https://www.timesofisrael.com/netanyahu-under-legal-duress-agrees-to-tap-interior-minister-after-year-long-vacancy/", title: "Netanyahu, under legal duress, agrees to tap interior minister after year-long vacancy (Interior vacant since Arbel’s resignation; Levin’s acting role expired October 2025) (2026-08-03)", publisher: "The Times of Israel" }
      - date: "2026-05-17"
        text:
          he: "משה ארבל, שר הפנים לשעבר, הגיש את התפטרותו מהכנסת; במכתבו לדרעי כתב שימשיך לפעול לאור ערכי תנועת ש\"ס. ב-19 במאי 2026 נכנס במקומו ארז מלול."
          en: "Former interior minister Moshe Arbel submitted his resignation from the Knesset; in his letter to Deri he wrote that he would carry on in the light of the Shas movement’s values. Erez Malul took his seat on 19 May 2026."
          ar: "قدّم وزير الداخلية السابق موشيه أربيل استقالته من الكنيست؛ وكتب في رسالته إلى درعي أنه سيواصل العمل في ضوء قيم حركة شاس. وفي 19 أيار/مايو 2026 دخل إيرز ملول مكانه."
          ru: "Бывший министр внутренних дел Моше Арбель подал в отставку из Кнессета; в письме Дери он написал, что продолжит действовать в духе ценностей движения ШАС. 19 мая 2026 года его место занял Эрез Малуль."
          es: "El exministro del Interior Moshe Arbel presentó su renuncia a la Knéset; en su carta a Deri escribió que seguiría actuando a la luz de los valores del movimiento Shas. Erez Malul ocupó su escaño el 19 de mayo de 2026."
          fr: "L’ancien ministre de l’Intérieur Moshe Arbel a remis sa démission de la Knesset ; dans sa lettre à Deri, il a écrit qu’il continuerait d’agir à la lumière des valeurs du mouvement Shas. Erez Malul a pris son siège le 19 mai 2026."
        sources:
          - { url: "https://www.timesofisrael.com/former-shas-minister-moshe-arbel-resigns-from-knesset-ahead-of-election/", title: "Former Shas minister Moshe Arbel resigns from Knesset; defied party line on key issues (2026-05-17)", publisher: "The Times of Israel" }
          - { url: "https://main.knesset.gov.il/mk/apps/faction/faction-lobby?KnessetID=25&FactionID=1095", title: "סיעת התאחדות הספרדים שומרי תורה — חילופי גברי: 19/05/2026 ארז מלול נכנס במקום משה ארבל (2026-09-19)", publisher: "Knesset" }
      - date: "2026-06-16"
        text:
          he: "ש\"ס ויהדות התורה החרימו יום שני ברציפות את ההצבעות במליאה בדרישה להעביר את \"חוק המעונות\" (החזרת סבסוד מעונות היום לילדי אברכים)."
          en: "Shas and United Torah Judaism boycotted Knesset votes for a second consecutive day, demanding passage of the ‘Daycare Law’ restoring daycare subsidies for the children of yeshiva students."
          ar: "قاطع شاس ويهدوت هتوراة التصويتات في الهيئة العامة لليوم الثاني على التوالي، مطالبين بإقرار «قانون الحضانات» (إعادة دعم الحضانات النهارية لأطفال طلاب المعاهد الدينية)."
          ru: "ШАС и «Яхадут ха-Тора» второй день подряд бойкотировали голосования в пленуме, требуя принять «закон о яслях» (восстановление субсидий на ясли для детей учащихся ешив)."
          es: "Shas y Judaísmo Unido de la Torá boicotearon las votaciones de la Knéset por segundo día consecutivo, exigiendo la aprobación de la «Ley de Guarderías», que restablece las subvenciones de guardería para los hijos de estudiantes de yeshivá."
          fr: "Shas et le Judaïsme unifié de la Torah ont boycotté les votes de la Knesset pour le deuxième jour consécutif, exigeant l’adoption de la « loi sur les crèches », qui rétablit les subventions de garde pour les enfants des étudiants de yeshiva."
        sources:
          - { url: "https://www.timesofisrael.com/haredi-knesset-boycott-continues-putting-coalitions-legislative-blitz-at-risk/", title: "Haredi Knesset boycott continues, putting coalition's legislative blitz at risk (2026-06-16)", publisher: "The Times of Israel" }
      - date: "2026-07-17"
        text:
          he: "הכנסת ה-25 התפזרה בהצבעה 62–0; הבחירות נקבעו ל-27 באוקטובר 2026. דרעי איים תחילה לעכב את חוק הפיזור ולאחר מכן חזר בו."
          en: "The 25th Knesset dissolved itself by a 62–0 vote; the election was set for 27 October 2026. Deri initially threatened to hold up the dissolution bill and then backed down."
          ar: "حلّ الكنيست الـ25 نفسه بتصويت 62 مقابل 0؛ وحُدّد موعد الانتخابات في 27 تشرين الأول/أكتوبر 2026. وهدّد درعي في البداية بعرقلة قانون الحل ثم تراجع."
          ru: "Кнессет 25-го созыва проголосовал за самороспуск 62 голосами против 0; выборы назначены на 27 октября 2026 года. Дери сначала пригрозил задержать законопроект о роспуске, а затем отступил."
          es: "La 25.ª Knéset se disolvió a sí misma por 62 votos a 0; las elecciones se fijaron para el 27 de octubre de 2026. Deri amenazó al principio con retrasar la ley de disolución y luego dio marcha atrás."
          fr: "La 25e Knesset s’est dissoute elle-même par 62 voix contre 0 ; les élections ont été fixées au 27 octobre 2026. Deri a d’abord menacé de retarder la loi de dissolution, puis a reculé."
        sources:
          - { url: "https://www.timesofisrael.com/knesset-votes-on-official-dispersal-of-parliament-wrapping-up-final-legislative-blitz/", title: "Knesset officially disperses, after coalition completes its drastic legislative blitz (2026-07-17)", publisher: "The Times of Israel" }
      - date: "2026-09-08"
        text:
          he: "ש\"ס הגישה את רשימתה לכנסת ה-26 (רשימה 19, אותיות מבוקשות שס): אריה דרעי, ינון אזולאי, מיכאל מלכיאלי, יואב בן צור, חיים ביטון, דרור עמוס (יו\"ר המועצה הדתית חיפה), משה אבוטבול, אוריאל בוסו, יוסף טייב, יונתן מישרקי, יוסי אילנתנוב, ארז מלול, סימיון מושיאשוילי; משה ארבל אינו ברשימה."
          en: "Shas submitted its list for the 26th Knesset (list 19, requested letters שס): Aryeh Deri, Yinon Azulai, Michael Malkieli, Yoav Ben Tzur, Haim Biton, Dror Amos (chair of the Haifa religious council), Moshe Abutbul, Uriel Busso, Yosef Taieb, Yonatan Mishriki, Yossi Ilantanov, Erez Malul, Simion Mushiashvili; Moshe Arbel is not on the list."
          ar: "قدّم شاس قائمته للكنيست الـ26 (القائمة 19، الأحرف المطلوبة שס): أرييه درعي، ينون أزولاي، ميخائيل ملكيئيلي، يوآف بن تسور، حاييم بيتون، درور عاموس (رئيس المجلس الديني في حيفا)، موشيه أبوطبول، أوريئيل بوسو، يوسف طيب، يوناتان مشريكي، يوسي إيلانتانوف، إيرز ملول، سيميون موشياشفيلي؛ موشيه أربيل ليس في القائمة."
          ru: "ШАС подала список в Кнессет 26-го созыва (список 19, запрошенные буквы שס): Арье Дери, Инон Азулай, Михаэль Малькиэли, Йоав Бен-Цур, Хаим Битон, Дрор Амос (председатель религиозного совета Хайфы), Моше Абутбуль, Уриэль Бусо, Йосеф Таиб, Йонатан Мишрики, Йоси Илантанов, Эрез Малуль, Симион Мушиашвили; Моше Арбеля в списке нет."
          es: "Shas presentó su lista para la 26.ª Knéset (lista 19, letras solicitadas שס): Aryeh Deri, Yinon Azulai, Michael Malkieli, Yoav Ben Tzur, Haim Biton, Dror Amos (presidente del consejo religioso de Haifa), Moshe Abutbul, Uriel Busso, Yosef Taieb, Yonatan Mishriki, Yossi Ilantanov, Erez Malul, Simion Mushiashvili; Moshe Arbel no está en la lista."
          fr: "Shas a déposé sa liste pour la 26e Knesset (liste 19, lettres demandées שס) : Aryeh Deri, Yinon Azulai, Michael Malkieli, Yoav Ben Tzur, Haim Biton, Dror Amos (président du conseil religieux de Haïfa), Moshe Abutbul, Uriel Busso, Yosef Taieb, Yonatan Mishriki, Yossi Ilantanov, Erez Malul, Simion Mushiashvili ; Moshe Arbel n’y figure pas."
        sources:
          - { url: "https://www.gov.il/he/pages/shas_list19", title: "רשימת המועמדים — התאחדות הספרדים שומרי תורה (רשימה 19) (2026-09-16)", publisher: "ועדת הבחירות המרכזית / gov.il" }
          - { url: "https://www.timesofisrael.com/israels-election-takes-shape-as-38-parties-submit-slates-from-likud-to-joint-list/", title: "Israel's election takes shape as 38 parties submit slates, in battle between pro- and anti-Netanyahu blocs (2026-09-09)", publisher: "The Times of Israel" }
    election2026:
      runsAs: own
      slug: shas
      note:
        he: "הרשימה הוגשה על ידי ש\"ס; אריה דרעי בראשה, ינון אזולאי ומיכאל מלכיאלי אחריו."
        en: "The list was submitted by Shas; Aryeh Deri heads it, followed by Yinon Azulai and Michael Malkieli."
        ar: "قدّم شاس القائمة؛ يرأسها أرييه درعي، يليه ينون أزولاي وميخائيل ملكيئيلي."
        ru: "Список подан ШАС; его возглавляет Арье Дери, за ним Инон Азулай и Михаэль Малькиэли."
        es: "La lista fue presentada por Shas; Aryeh Deri la encabeza, seguido de Yinon Azulai y Michael Malkieli."
        fr: "La liste a été déposée par Shas ; Aryeh Deri la mène, suivi de Yinon Azulai et Michael Malkieli."
      sources:
        - { url: "https://www.gov.il/he/pages/shas_list19", title: "התאחדות הספרדים שומרי תורה — רשימת המועמדים", publisher: "ועדת הבחירות המרכזית לכנסת" }
    spectrum: right
