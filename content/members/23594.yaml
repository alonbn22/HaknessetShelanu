    title:
      he: "במקום השני ברשימת \"ביחד\" המשותפת עם נפתלי בנט לבחירות 2026"
      en: "Second on the joint \"B'Yachad\" list with Naftali Bennett for the 2026 election"
    description:
      he: "ב-26 באפריל 2026 הודיעו לפיד ונפתלי בנט על איחוד יש עתיד עם מפלגתו של בנט לרשימה משותפת בראשות בנט. ב-6 בספטמבר 2026 הושקה רשימת \"ביחד\" לבחירות 27 באוקטובר, ולפיד הוצב בה במקום השני; בהשקה אמר על בנט: \"ראיתי אותו מקרוב יותר מכל אדם אחר... הוא הכי מתאים\"."
      en: "On 26 April 2026 Lapid and Naftali Bennett announced the merger of Yesh Atid with Bennett's party into a joint list led by Bennett. On 6 September 2026 the \"B'Yachad\" list for the 27 October election was launched, with Lapid in second place; at the launch he said of Bennett: \"I saw him up close more than any other person... he is the most suitable.\""
    sources:
