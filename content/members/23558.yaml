        ראש העיר, לפני שהושבע כחבר כנסת בשנת 2015.
      en: Bitan, born in Morocco and immigrating to Israel at age five, earned a law
        degree (LL.B) from Tel Aviv University in 1987. He served as a member of
        the Rishon LeZion City Council from 1988 and later as Deputy Mayor,
        before being sworn in as a Member of Knesset in 2015.
