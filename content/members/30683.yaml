      en: "Minister of Culture and Sport (2020–2022)"
    description:
      he: "חילי טרופר כיהן כשר התרבות והספורט בממשלות ה-35 וה-36, ממאי 2020 ועד דצמבר 2022. בתקופת מגפת הקורונה פעל לתמיכה במוסדות התרבות והספורט שנפגעו מהמגבלות."
      en: "Hili Tropper served as Israel's Minister of Culture and Sport in the 35th and 36th governments, from May 2020 until December 2022. During the COVID-19 pandemic he worked to support cultural and sports institutions affected by lockdown restrictions."
