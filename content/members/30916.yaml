    title:
      he: מנכ"ל המועצה הציונית בישראל
      en: Director-General of the Zionist Council in Israel
      ar: مدير عام المجلس الصهيوني في إسرائيل
      ru: Генеральный директор Сионистского совета в Израиле
    description:
      he: לפני כניסתו לכנסת כיהן חיים למעלה מארבע שנים כמנכ"ל המועצה הציונית בישראל, זרוע של ההסתדרות הציונית העולמית העוסקת בחינוך ובזהות יהודית-ציונית. במסגרת תפקידו הוביל מיזמים חינוכיים וחברתיים, בהם תערוכת הצילומים "חיבוק אחרון" שהוצגה בערים בישראל ובעולם. קודם לכן עבד כעורך דין.
      en: Before entering the Knesset, Haim served for over four years as director-general of the Zionist Council in Israel, a branch of the World Zionist Organization focused on Jewish-Zionist identity and education. In this role he led educational and social projects, including the "Last Hug" photography exhibition shown in cities in Israel and abroad. He previously worked as a lawyer.
      ar: قبل دخوله الكنيست، شغل حاييم لأكثر من أربع سنوات منصب المدير العام للمجلس الصهيوني في إسرائيل، وهو ذراع للمنظمة الصهيونية العالمية يُعنى بالتربية والهوية اليهودية-الصهيونية. وفي إطار منصبه قاد مشاريع تربوية واجتماعية، منها معرض الصور «العناق الأخير» الذي عُرض في مدن في إسرائيل والخارج. وقبل ذلك عمل محامياً.
      ru: До прихода в Кнессет Хаим более четырёх лет занимал пост генерального директора Сионистского совета в Израиле — подразделения Всемирной сионистской организации, занимающегося образованием и еврейско-сионистской идентичностью. На этом посту он руководил образовательными и социальными проектами, включая фотовыставку «Последнее объятие», показанную в городах Израиля и за рубежом. Ранее работал адвокатом.
