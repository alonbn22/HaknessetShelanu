      he: דורג במקום השביעי בפריימריז הליכוד לקראת בחירות 2026
      en: Ranked seventh in the Likud primary ahead of the 2026 election
    description:
      he: בפריימריז הליכוד שנערכו ב-17 באוגוסט 2026 דורג זוהר במקום השביעי בהצבעת חברי המפלגה (לפני שיבוץ המקומות המשוריינים), אחרי אלי כהן, אמיר אוחנה, יריב לוין, מירי רגב, אופיר כץ ויואב קיש. ברשימת הליכוד הסופית לכנסת ה-26, שפורסמה ב-8 בספטמבר 2026 לאחר שיבוץ המשוריינים, הוא במקום ה-12.
      en: In the Likud primary held on 17 August 2026, Zohar was ranked seventh in the members' vote (before reserved slots were inserted), after Eli Cohen, Amir Ohana, Yariv Levin, Miri Regev, Ofir Katz and Yoav Kisch. On the final Likud list for the 26th Knesset, published on 8 September 2026 after the reserved slots were inserted, he is 12th.
