      en: "On 4 July 2025 Ginzburg returned to the 25th Knesset for the Blue and White - National Unity faction, after Gadi Eisenkot resigned from the Knesset following his split from Benny Gantz's party. He serves on the Constitution, Law and Justice Committee and other committees."
