      he: הגיע למקום ה-22 בפריימריז הליכוד — מקום שאינו ריאלי ברשימה לכנסת ה-26
      en: Finished 22nd in the Likud primary — an unrealistic slot on the list for the 26th Knesset
    description:
      he: בפריימריז הליכוד ב-17 באוגוסט 2026 הגיע מילביצקי למקום ה-22 בהצבעה הארצית. לפי גלובס ו-ynet, מדובר במקום שאינו ריאלי ברשימת הליכוד לבחירות 27 באוקטובר, לצד שרים וחברי כנסת נוספים שנדחקו מחוץ למקומות הריאליים.
      en: In the Likud primary on 17 August 2026 Milwidsky finished 22nd in the national vote. According to Globes and Ynet this is an unrealistic slot on the Likud list for the 27 October election, alongside other ministers and MKs pushed out of realistic places.
