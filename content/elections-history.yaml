# History of Israeli Knesset elections. Editorial/curated (not from the Knesset
# API). Figures are widely-documented results; review before publishing.
# turnout = % of eligible voters; winnerSeats = seats won by the largest list.
# date is ISO. "pm" = who ultimately formed/led the government after the election.
elections:
  - knesset: 25
    date: "2022-11-01"
    turnout: 70.6
    winner: { he: "הליכוד", en: "Likud" }
    winnerSeats: 32
    pm: { he: "בנימין נתניהו", en: "Benjamin Netanyahu" }
    note: { he: "הקואליציה הימנית-דתית בראשות נתניהו זכתה ב-64 מושבים.", en: "The right-religious bloc led by Netanyahu won 64 seats." }
    summary:
      he: "הכנסת ה-25 נבחרה לאחר חמש מערכות בחירות בארבע שנים, והקימה קואליציה ימנית-דתית בת 64 מושבים. כהונתה התאפיינה ברפורמה המשפטית השנויה במחלוקת ובמלחמת חרבות ברזל שפרצה ב-7 באוקטובר 2023."
      en: "The 25th Knesset was elected after five elections in four years and formed a right-religious coalition of 64 seats. Its term has been shaped by the contested judicial reform and the Swords of Iron war that began on 7 October 2023."
    events:
      - kind: bad
        date: "2023-01-04"
        text: { he: "השקת הרפורמה המשפטית עוררה גל מחאות המוני שנמשך חודשים.", en: "The launch of the judicial overhaul triggered months of mass protests." }
      - kind: bad
        date: "2023-10-07"
        text: { he: "מתקפת הפתע של חמאס וגרירת המדינה למלחמת חרבות ברזל.", en: "Hamas's surprise attack and the start of the Swords of Iron war." }
      - kind: neutral
        date: "2023-03-27"
        text: { he: "השעיית חקיקת הרפורמה והקמת ממשלת חירום בעת המלחמה.", en: "Suspension of the reform legislation and formation of an emergency wartime government." }
      - kind: bad
        date: "2024-09-17"
        text: { he: "הסלמה בחזית הצפון מול חיזבאללה, מבצע הביפרים והתקיפות בלבנון.", en: "Escalation on the northern front with Hezbollah, the pager operation and strikes in Lebanon." }
      - kind: good
        date: "2025-01-19"
        text: { he: "עסקאות לשחרור חטופים והפסקות אש לסירוגין בעזה.", en: "Hostage-release deals and intermittent ceasefires in Gaza." }
    ended: { he: "הכנסת מכהנת (נכון ל-2026).", en: "Currently in session (as of 2026)." }
  - knesset: 24
    date: "2021-03-23"
    turnout: 67.4
    winner: { he: "הליכוד", en: "Likud" }
    winnerSeats: 30
    pm: { he: "נפתלי בנט ← יאיר לפיד", en: "Naftali Bennett → Yair Lapid" }
    note: { he: "ממשלת השינוי (בנט-לפיד) קמה למרות שהליכוד היה הגדול ביותר.", en: "The \"change government\" (Bennett-Lapid) formed despite Likud being largest." }
    summary:
      he: "ממשלת השינוי איחדה שמונה מפלגות מימין, ממרכז ומשמאל כדי להחליף את נתניהו, עם רוטציה מתוכננת בין בנט ללפיד."
      en: "The \"change government\" united eight parties from right, centre and left to replace Netanyahu, with a planned rotation between Bennett and Lapid."
    events:
      - kind: good
        date: "2021-06-13"
        text: { he: "לראשונה מפלגה ערבית (רע\"ם) הצטרפה לקואליציה שלטת.", en: "For the first time an Arab party (Ra'am) joined a governing coalition." }
      - kind: good
        date: "2021-11-04"
        text: { he: "אישור תקציב מדינה ראשון מזה למעלה משלוש שנים.", en: "Passage of the first state budget in over three years." }
      - kind: bad
        date: "2022-04-06"
        text: { he: "איבוד הרוב בכנסת לאחר פרישת חברי קואליציה.", en: "Loss of the Knesset majority after coalition members defected." }
      - kind: bad
        date: "2021-05-10"
        text: { he: "מבצע \"שומר החומות\" מול חמאס בעזה ומהומות בערים מעורבות.", en: "Operation Guardian of the Walls against Hamas in Gaza and unrest in mixed cities." }
    ended: { he: "הכנסת התפזרה ביוני 2022 לאחר שאיבדה את הרוב; לפיד הפך לראש ממשלה מעבר.", en: "Dissolved in June 2022 after losing its majority; Lapid became caretaker PM." }
  - knesset: 23
    date: "2020-03-02"
    turnout: 71.5
    winner: { he: "הליכוד", en: "Likud" }
    winnerSeats: 36
    pm: { he: "בנימין נתניהו", en: "Benjamin Netanyahu" }
    note: { he: "הבחירות השלישיות בתוך שנה; ממשלת אחדות נתניהו-גנץ.", en: "The third election within a year; a Netanyahu-Gantz unity government." }
    summary:
      he: "לאחר שלוש מערכות בחירות הוקמה ממשלת אחדות-חירום בצל מגפת הקורונה, עם הסכם רוטציה בין נתניהו לגנץ שלא מומש."
      en: "After three elections, a unity emergency government formed amid the COVID-19 pandemic, with a Netanyahu-Gantz rotation deal that was never fulfilled."
    events:
      - kind: bad
        date: "2020-03-19"
        text: { he: "ניהול משבר מגפת הקורונה וסגרים חוזרים ונשנים.", en: "Managing the COVID-19 crisis and repeated lockdowns." }
      - kind: bad
        date: "2020-12-22"
        text: { he: "אי-העברת תקציב מדינה הביאה לפיזור אוטומטי של הכנסת.", en: "Failure to pass a state budget triggered the Knesset's automatic dissolution." }
      - kind: good
        date: "2020-09-15"
        text: { he: "הסכמי אברהם — נורמליזציה עם איחוד האמירויות, בחריין, מרוקו וסודאן.", en: "The Abraham Accords — normalization with the UAE, Bahrain, Morocco and Sudan." }
    ended: { he: "פוזרה בדצמבר 2020 כי לא אושר תקציב מדינה במועד.", en: "Dissolved in December 2020 because no state budget was passed in time." }
  - knesset: 22
    date: "2019-09-17"
    turnout: 69.8
    winner: { he: "כחול לבן", en: "Blue & White" }
    winnerSeats: 33
    pm: { he: "לא הוקמה ממשלה", en: "No government formed" }
    note: { he: "אף גוש לא הצליח להרכיב ממשלה — הובלה לבחירות חוזרות.", en: "Neither bloc could form a government — led to another election." }
    summary:
      he: "בבחירות החוזרות כחול לבן הפכה לסיעה הגדולה ביותר, אך שוב אף מחנה לא הגיע לרוב של 61 ולא הצליח להרכיב ממשלה."
      en: "In the repeat election Blue & White became the largest party, but again neither camp reached a 61-seat majority or managed to form a government."
    events:
      - kind: bad
        date: "2019-11-21"
        text: { he: "גם גנץ וגם נתניהו נכשלו בהרכבת ממשלה.", en: "Both Gantz and Netanyahu failed to form a government." }
    ended: { he: "פוזרה בדצמבר 2019 לאחר שלא הורכבה ממשלה — בחירות שלישיות.", en: "Dissolved in December 2019 after no government formed — a third election." }
  - knesset: 21
    date: "2019-04-09"
    turnout: 68.5
    winner: { he: "הליכוד", en: "Likud" }
    winnerSeats: 35
    pm: { he: "לא הוקמה ממשלה", en: "No government formed" }
    note: { he: "הכנסת פיזרה את עצמה לראשונה בהיסטוריה במקום להקים ממשלה.", en: "The Knesset dissolved itself for the first time ever instead of forming a government." }
    summary:
      he: "אף שהליכוד והגוש הימני זכו ברוב, המשא ומתן הקואליציוני נכשל סביב חוק הגיוס, והכנסת בחרה להתפזר במקום לאפשר למישהו אחר להרכיב ממשלה."
      en: "Although Likud and the right won a majority, coalition talks collapsed over the conscription law, and the Knesset chose to dissolve itself rather than let anyone else try to form a government."
    events:
      - kind: bad
        date: "2019-05-30"
        text: { he: "כישלון המו\"מ הקואליציוני בעיקר סביב חוק הגיוס.", en: "Collapse of coalition talks, chiefly over the conscription law." }
    ended: { he: "פוזרה במאי 2019 — לראשונה בהיסטוריה הכנסת פיזרה את עצמה במקום להקים ממשלה.", en: "Dissolved in May 2019 — the first time the Knesset dissolved itself instead of forming a government." }
  - knesset: 20
    date: "2015-03-17"
    turnout: 72.3
    winner: { he: "הליכוד", en: "Likud" }
    winnerSeats: 30
    pm: { he: "בנימין נתניהו", en: "Benjamin Netanyahu" }
    summary:
      he: "נתניהו הקים תחילה קואליציה ימנית-דתית צרה של 61 מושבים בלבד, שהורחבה מאוחר יותר. בכהונה זו התחילו חקירות פליליות נגד ראש הממשלה."
      en: "Netanyahu first formed a narrow right-religious coalition of just 61 seats, later broadened. Criminal investigations into the prime minister opened during this term."
    events:
      - kind: bad
        date: "2016-12-01"
        text: { he: "פתיחת חקירות פליליות נגד נתניהו (תיקים 1000, 2000, 4000).", en: "Criminal investigations into Netanyahu opened (Cases 1000, 2000, 4000)." }
      - kind: neutral
        date: "2017-01-01"
        text: { he: "יציבות כלכלית והמשך צמיחה.", en: "Economic stability and continued growth." }
      - kind: neutral
        date: "2018-07-19"
        text: { he: "חקיקת חוק יסוד: ישראל — מדינת הלאום של העם היהודי.", en: "Passage of Basic Law: Israel as the Nation-State of the Jewish People." }
    ended: { he: "פוזרה בדצמבר 2018 על רקע המחלוקת על חוק הגיוס — לבחירות מוקדמות.", en: "Dissolved in December 2018 amid the conscription-law dispute — to early elections." }
  - knesset: 19
    date: "2013-01-22"
    turnout: 67.8
    winner: { he: "הליכוד ישראל ביתנו", en: "Likud Yisrael Beiteinu" }
    winnerSeats: 31
    pm: { he: "בנימין נתניהו", en: "Benjamin Netanyahu" }
    summary:
      he: "לראשונה מזה שנים הוקמה קואליציה ללא המפלגות החרדיות, עם דגש על \"שוויון בנטל\" (גיוס חרדים) ויוקר המחיה."
      en: "For the first time in years a coalition formed without the Haredi parties, focused on \"sharing the burden\" (Haredi conscription) and the cost of living."
    events:
      - kind: good
        date: "2014-03-12"
        text: { he: "חקיקת חוק השוויון בנטל לגיוס בני ישיבות.", en: "Passage of the 'equal burden' law on yeshiva-student conscription." }
      - kind: bad
        date: "2014-07-08"
        text: { he: "מבצע \"צוק איתן\" — מלחמה בת 50 יום מול חמאס בעזה.", en: "Operation Protective Edge — a 50-day war against Hamas in Gaza." }
    ended: { he: "התפרקה בדצמבר 2014 כשנתניהו פיטר את לפיד ולבני — לבחירות מוקדמות.", en: "Collapsed in December 2014 when Netanyahu dismissed Lapid and Livni — to early elections." }
  - knesset: 18
    date: "2009-02-10"
    turnout: 64.7
    winner: { he: "קדימה", en: "Kadima" }
    winnerSeats: 28
    pm: { he: "בנימין נתניהו", en: "Benjamin Netanyahu" }
    note: { he: "קדימה היתה הגדולה ביותר אך נתניהו (הליכוד) הרכיב את הממשלה.", en: "Kadima was largest, but Netanyahu (Likud) formed the government." }
    summary:
      he: "אף שקדימה (לבני) היתה הסיעה הגדולה ביותר, נתניהו הצליח להרכיב קואליציה ימנית והקים את ממשלתו השנייה, שכיהנה כמעט קדנציה מלאה."
      en: "Although Kadima (Livni) was the largest party, Netanyahu assembled a right-wing coalition and formed his second government, which served nearly a full term."
    events:
      - kind: bad
        date: "2011-07-14"
        text: { he: "מחאת קיץ 2011 (\"מחאת האוהלים\") על יוקר המחיה.", en: "The summer 2011 social-justice (\"tent\") protests over the cost of living." }
      - kind: neutral
        date: "2011-10-18"
        text: { he: "עסקת שליט — שחרור גלעד שליט תמורת אסירים.", en: "The Shalit deal — Gilad Shalit released in a prisoner exchange." }
      - kind: bad
        date: "2012-11-14"
        text: { he: "מבצע \"עמוד ענן\" מול חמאס בעזה.", en: "Operation Pillar of Defense against Hamas in Gaza." }
    ended: { he: "הוקדמו הבחירות; הכנסת פוזרה ב-2012 על רקע אי-הסכמה על התקציב.", en: "Elections were brought forward; the Knesset dissolved in 2012 over a budget disagreement." }
  - knesset: 17
    date: "2006-03-28"
    turnout: 63.5
    winner: { he: "קדימה", en: "Kadima" }
    winnerSeats: 29
    pm: { he: "אהוד אולמרט", en: "Ehud Olmert" }
    summary:
      he: "קדימה, שהוקמה בידי שרון, הובילה את הממשלה בראשות אולמרט לאחר שבץ שעבר שרון. הקדנציה לוותה בשתי מלחמות ובחקירות שהפילו את ראש הממשלה."
      en: "Kadima, founded by Sharon, led the government under Olmert after Sharon's stroke. The term was marked by two wars and the investigations that brought down the prime minister."
    events:
      - kind: bad
        date: "2006-07-12"
        text: { he: "מלחמת לבנון השנייה.", en: "The Second Lebanon War." }
      - kind: neutral
        date: "2008-12-27"
        text: { he: "מבצע \"עופרת יצוקה\" ברצועת עזה.", en: "Operation Cast Lead in the Gaza Strip." }
      - kind: bad
        date: "2008-07-30"
        text: { he: "חקירות שחיתות הביאו להתפטרות אולמרט.", en: "Corruption investigations led to Olmert's resignation." }
    ended: { he: "אולמרט התפטר על רקע חקירות שחיתות — לבחירות 2009.", en: "Olmert resigned amid corruption probes — to the 2009 election." }
  - knesset: 16
    date: "2003-01-28"
    turnout: 67.8
    winner: { he: "הליכוד", en: "Likud" }
    winnerSeats: 38
    pm: { he: "אריאל שרון", en: "Ariel Sharon" }
    summary:
      he: "ממשלת שרון החזקה ביצעה את תוכנית ההתנתקות מרצועת עזה ב-2005, צעד שפילג את הליכוד והוביל להקמת קדימה."
      en: "Sharon's strong government carried out the 2005 Disengagement from the Gaza Strip, a move that split Likud and led to the founding of Kadima."
    events:
      - kind: neutral
        date: "2005-08-15"
        text: { he: "תוכנית ההתנתקות — פינוי כל היישובים מרצועת עזה.", en: "The Disengagement — evacuation of all settlements from the Gaza Strip." }
      - kind: bad
        date: "2003-09-01"
        text: { he: "שיא פיגועי האינתיפאדה השנייה והקמת גדר ההפרדה.", en: "The peak of Second Intifada attacks and construction of the separation barrier." }
    ended: { he: "שרון פיזר את הכנסת ועזב להקים את קדימה; לאחר מכן לקה בשבץ — בחירות 2006.", en: "Sharon dissolved the Knesset and left to found Kadima; he then suffered a stroke — 2006 election." }
  - knesset: 15
    date: "1999-05-17"
    turnout: 78.7
    winner: { he: "ישראל אחת (העבודה)", en: "One Israel (Labor)" }
    winnerSeats: 26
    pm: { he: "אהוד ברק", en: "Ehud Barak" }
    summary:
      he: "ברק נבחר בבחירה ישירה והוביל מהלך מדיני נרחב, אך שיחות השלום קרסו ופרצה האינתיפאדה השנייה."
      en: "Barak was elected directly and pursued an ambitious peace push, but the talks collapsed and the Second Intifada erupted."
    events:
      - kind: neutral
        date: "2000-05-24"
        text: { he: "נסיגת צה\"ל מדרום לבנון.", en: "The IDF's withdrawal from southern Lebanon." }
      - kind: bad
        date: "2000-07-25"
        text: { he: "כישלון שיחות קמפ דייוויד.", en: "The collapse of the Camp David talks." }
      - kind: bad
        date: "2000-09-28"
        text: { he: "פרוץ האינתיפאדה השנייה.", en: "The outbreak of the Second Intifada." }
    ended: { he: "ברק התפטר; בבחירה ישירה מיוחדת ב-2001 ניצח שרון, אך הכנסת המשיכה עד 2003.", en: "Barak resigned; Sharon won a special direct PM election in 2001, but the Knesset continued until 2003." }
  - knesset: 14
    date: "1996-05-29"
    turnout: 79.3
    winner: { he: "העבודה", en: "Labor" }
    winnerSeats: 34
    pm: { he: "בנימין נתניהו", en: "Benjamin Netanyahu" }
    note: { he: "הבחירה הישירה הראשונה לראש ממשלה; נתניהו ניצח את פרס.", en: "First direct election for PM; Netanyahu narrowly beat Peres." }
    summary:
      he: "הבחירות הראשונות בשיטת הבחירה הישירה לראש ממשלה. נתניהו ניצח את פרס בהפרש זעום, חודשים לאחר רצח רבין."
      en: "The first elections under the direct-election-for-PM system. Netanyahu narrowly beat Peres, months after Rabin's assassination."
    events:
      - kind: neutral
        date: "1997-01-15"
        text: { he: "פרוטוקול חברון והסכם וואי — המשך תהליך אוסלו.", en: "The Hebron Protocol and Wye River Memorandum — continuing the Oslo process." }
    ended: { he: "הכנסת הצביעה על פיזור עצמי ב-1998 על רקע התפרקות הקואליציה — בחירות 1999.", en: "The Knesset voted to dissolve in 1998 as the coalition fell apart — 1999 election." }
  - knesset: 13
    date: "1992-06-23"
    turnout: 77.4
    winner: { he: "העבודה", en: "Labor" }
    winnerSeats: 44
    pm: { he: "יצחק רבין", en: "Yitzhak Rabin" }
    summary:
      he: "ממשלת רבין הובילה את תהליך אוסלו וחתמה על הסכם שלום עם ירדן. הקדנציה הסתיימה בטרגדיה עם רצח רבין."
      en: "Rabin's government led the Oslo process and signed a peace treaty with Jordan. The term ended in tragedy with Rabin's assassination."
    events:
      - kind: good
        date: "1993-09-13"
        text: { he: "הסכמי אוסלו — הסכם הביניים עם אש\"ף.", en: "The Oslo Accords — the interim agreement with the PLO." }
      - kind: good
        date: "1994-10-26"
        text: { he: "הסכם השלום עם ירדן.", en: "The peace treaty with Jordan." }
      - kind: bad
        date: "1995-11-04"
        text: { he: "רצח ראש הממשלה יצחק רבין; פרס החליפו.", en: "The assassination of PM Yitzhak Rabin; Peres succeeded him." }
      - kind: bad
        date: "1994-02-25"
        text: { he: "הטבח במערת המכפלה בחברון.", en: "The Cave of the Patriarchs massacre in Hebron." }
      - kind: bad
        date: "1996-04-11"
        text: { he: "מבצע \"ענבי זעם\" בלבנון.", en: "Operation Grapes of Wrath in Lebanon." }
    ended: { he: "השלימה כהונה כמעט מלאה — בחירות 1996.", en: "Served a nearly full term — 1996 election." }
  - knesset: 12
    date: "1988-11-01"
    turnout: 79.7
    winner: { he: "הליכוד", en: "Likud" }
    winnerSeats: 40
    pm: { he: "יצחק שמיר", en: "Yitzhak Shamir" }
    summary:
      he: "תחילה ממשלת אחדות ואז ממשלה צרה בראשות שמיר. הקדנציה כללה את מלחמת המפרץ הראשונה ותחילת גל העלייה הגדול מברית המועצות."
      en: "First a unity government, then a narrow government under Shamir. The term spanned the First Gulf War and the start of the great wave of Soviet immigration."
    events:
