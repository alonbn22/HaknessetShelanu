    title:
      he: שאלות על ניגוד עניינים בין עסקיו לבין כהונתו כשר הכלכלה
      en: Conflict-of-interest questions over his business holdings as Economy Minister
    description:
      he: תחקיר "שומרים" (יולי 2023) דיווח כי חצי שנה לאחר כניסתו לתפקיד שר הכלכלה החזיק ברקת באחזקות בחברות רבות וטען כי הן מנוהלות בנאמנות עיוורת בידי אחיו, בעוד שהכללים אינם מתירים לשרים למנות קרוב מדרגה ראשונה כנאמן; לשכתו מסרה כי "השר עושה את הנדרש ממנו לפי החוק". בפברואר 2026 דיווח N12 כי אחיו, איש העסקים אלי ברקת, הוא שגיבש בפגישות עם ראשי התעשייה את מיזם "הסל של המדינה" להוזלת מזון, בעוד הסדר ניגוד העניינים של השר מחייב הפרדה מלאה מעסקי אחיו; ברקת השיב כי "אנשי מקצוע סייעו למיזם" וכי המשרד גיבש את התוכנית עם אנשי המקצוע שלו ובליווי משפטי. בינואר 2026 הגיש ברקת נגד חדשות 12 והכתב עמרי מניב תביעת לשון הרע על 12 מיליון שקלים בגין תחקיר על עסקיו, שאותו כינה "כוזב, רשלני ומשמיץ".
      en: A Shomrim investigation (July 2023) reported that six months into his term as Economy Minister Barkat still held stakes in many companies and said they were in a blind trust managed by his brother, whereas the rules do not allow ministers to use a first-degree relative as trustee; his office said "the minister does what is required of him by law". In February 2026 N12 reported that his brother, businessman Eli Barkat, had shaped the "State Basket" food-price initiative in meetings with industry leaders, while the minister's conflict-of-interest arrangement requires complete separation from his brother's business affairs; Barkat responded that "expert professionals assisted the initiative" and that the ministry developed the plan with its professional staff under legal guidance. In January 2026 Barkat filed a NIS 12 million libel suit against Channel 12 News and reporter Omri Maniv over an investigative report on his business ties, which he called "false, negligent and defamatory".
