    title:
      he: חבר הכנסת ה-25 מטעם הליכוד
      en: Member of the 25th Knesset for Likud
    description:
      he: אביחי בוארון מכהן כחבר הכנסת ה-25 מטעם מפלגת הליכוד. לפי רישומי הכנסת כיהן לראשונה
        מ-31 במרץ 2023 (הושבע ב-3 באפריל) עד 14 באוקטובר 2023, לאחר שנכנס לכנסת
        במסגרת החוק הנורבגי במקום דודי אמסלם, ושב לכהן ב-30 ביוני 2024 לאחר
        התפטרותו של דני דנון מהכנסת עם מינויו לשגריר באו"ם.
      en: Avichai Boaron serves as a member of the 25th Knesset for the Likud party.
        According to Knesset records he first served from 31 March 2023 (sworn
        in on 3 April) until 14 October 2023, entering under the "Norwegian
        Law" in place of Dudi Amsalem, and returned to the Knesset on 30 June
        2024 following Danny Danon's resignation upon his appointment as
        ambassador to the UN.
    date: 2024-06-30
