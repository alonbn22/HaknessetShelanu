    title:
      he: 'תצהיר לבג"ץ: נדרשנו להצביע לראבילו למבקר המדינה ולהציג תיעוד לנתניהו'
      en: 'Affidavit to the High Court: faction members were required to vote for Rabilo as State Comptroller and show documentation to Netanyahu'
    description:
      he: 'ב-23 ביולי 2026 דווח כי השכל הגישה תצהיר לבג"ץ, במסגרת עתירה נגד הליכוד בטענה שעיכב את מיזוג הימין הממלכתי לתוכו, ובו טענה כי חברי הסיעה נדרשו להצביע למועמד הליכוד מתי (מיכאל) ראבילו לתפקיד מבקר המדינה ולתעד את הצבעתם עבור נתניהו. הליכוד השיב לבית המשפט כי לא ניתנה הנחיה לתעד את ההצבעות.'
      en: 'On 23 July 2026 it was reported that Haskel filed an affidavit with the High Court of Justice, in a petition against Likud alleging it delayed the merger of the National Right into the party, stating that faction members were required to vote for Likud''s candidate Michael Rabilo for State Comptroller and to document their votes for Netanyahu. Likud replied to the court that no instruction was given to document the votes.'
