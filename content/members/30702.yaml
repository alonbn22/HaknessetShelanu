      en: "Chair of the Special Committee on Foreign Workers"
    description:
      he: "מפברואר 2025 מכהנת עטייה כיושבת ראש הוועדה המיוחדת של הכנסת לעובדים זרים. ביוני 2026 דנה הוועדה בראשותה בעלייה במספר העובדים הזרים השוהים בישראל ללא היתר."
      en: "Since February 2025 Atia has chaired the Knesset's Special Committee on Foreign Workers. In June 2026 the committee, under her chairmanship, held a hearing on the rise in the number of foreign workers staying in Israel without a permit."
