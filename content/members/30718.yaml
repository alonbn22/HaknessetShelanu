    title:
      he: ביקורת שיפוטית על גרסתה בפרשת "התקיפה בקניון" (2025)
      en: Judicial criticism of her account in the 2024 shopping-mall incident (2025)
    description:
      he: >-
        בינואר 2024 נעצרה תושבת רחובות, ירדן מן, לאחר שסילמן התלוננה כי תקפה אותה
        במרכז קניות, וכתב אישום הוגש נגדה בתוך 24 שעות. ב-17 בספטמבר 2025 זיכה
        בית משפט השלום את מן מכל האישומים; השופטת קרן וקסלר ציינה כי סילמן
        "התקשתה לספק גרסה סבירה" וכי גרסתה השתנתה, ומתחה ביקורת גם על התנהלות
        המשטרה. סילמן הגיבה ברשת X: "הלוואי והייתי שופטת שזרקו עליה נעל".
      en: >-
        In January 2024 a Rehovot resident, Yarden Man, was arrested after Silman
        complained that she had assaulted her at a shopping centre, and was
        charged within 24 hours. On 17 September 2025 a magistrate's court
        acquitted Man of all charges; Judge Keren Waksler noted that Silman "had
        difficulty providing a plausible account" and that her version had
        shifted, and also criticized the police's handling of the case. Silman
        responded on X: "If only I were a judge who had a shoe thrown at her".
    date: 2025-09-17
