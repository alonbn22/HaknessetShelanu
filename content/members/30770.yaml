  - kind: negative
    category: controversy
    date: 2025-01-28
    title:
      he: סערה סביב דבריו כי בנו לא יתייצב לצו גיוס וקריאה להדיחו מראשות ועדת החינוך (2025)
      en: Controversy over saying his son would not report for a draft order, and a call to remove him as Education Committee chair (2025)
    description:
      he: 'ב-28 בינואר 2025 אמר טייב, אז יו"ר ועדת החינוך, בראיון ברדיו "קול ברמה" כי בנו קיבל צו גיוס וכי הפנה אותו לראש הישיבה ולמועצת חכמי התורה, והוסיף: "אם הוא ייעצר, אז הוא ילמד תורה מתוך כותלי הכלא". תנועת "אימהות בחזית" פנתה ליו"ר ועדת האתיקה בדרישה להדיחו מראשות הוועדה בטענה שדבריו מהווים זלזול בצה"ל ובמערכות החוק; יו"ר ש"ס אריה דרעי הגן עליו ואמר כי "הוא אומר את האמת". בדיווחים שצוטטו לא פורסמה החלטה של ועדת האתיקה בעניין, ולא היה בכך הליך משפטי.'
      en: 'On 28 January 2025 Taieb, then chair of the Education Committee, said in an interview on the Kol Barama radio station that his son had received a draft order and that he had referred him to his yeshiva head and the Council of Torah Sages, adding: "If he is arrested, then he will study Torah from within the prison walls." The "Mothers at the Front" movement wrote to the chair of the Ethics Committee demanding his removal as committee chair, arguing the remarks showed disrespect for the IDF and the legal system; Shas chairman Aryeh Deri defended him, saying "he is telling the truth." The cited reports did not carry an Ethics Committee decision on the matter, and no legal proceeding was involved.'
    sources:
