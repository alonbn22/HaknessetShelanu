    title:
      he: יושבת ראש ועדות בכנסת ה-23 וה-24
      en: Committee chair in the 23rd and 24th Knesset
    description:
      he: בכנסת ה-23 כיהנה רון בן משה כיושבת ראש ועדת המדע והטכנולוגיה, ובכנסת ה-24
        כיהנה כיושבת ראש הוועדה המיוחדת לפניות הציבור.
      en: In the 23rd Knesset, Ron Ben-Moshe chaired the Science and Technology
        Committee, and in the 24th Knesset she chaired the Special Committee for
        Public Petitions.
