    description:
      he: "לפני כניסתו לפוליטיקה הארצית הצטרף גולדקנופ בראשית שנות ה-80 לאביו בניהול רשת גני הילדים והמעונות בית יעקב, ולאחר מות אביו ב-1988 עמד בראש הרשת. בשנת 1990 ייסד את מוסדות פתחיה, רשת לחינוך מיוחד."
      en: "Before entering national politics, Goldknopf joined his father in the early 1980s in managing the Beit Yaakov network of kindergartens and daycare centers, and took it over after his father's death in 1988. In 1990 he founded the Petachya special-education network."
      ar: "قبل دخوله السياسة القطرية انضمّ غولدكنوبف في مطلع الثمانينيات إلى والده في إدارة شبكة رياض الأطفال ودور الحضانة «بيت يعقوب»، وتولّى إدارتها بعد وفاة والده عام 1988. وفي عام 1990 أسّس مؤسسات «بتاحيا»، وهي شبكة للتعليم الخاص."
      ru: "До прихода в общенациональную политику Гольдкнопф в начале 1980-х годов вместе с отцом руководил сетью детских садов и яслей «Бейт-Яаков», а после смерти отца в 1988 году возглавил её. В 1990 году он основал сеть специального образования «Птахия»."
      es: "Antes de entrar en la política nacional, Goldknopf se unió a su padre a principios de los años ochenta en la gestión de la red de jardines de infancia y guarderías Beit Yaakov, y la asumió tras la muerte de su padre en 1988. En 1990 fundó la red de educación especial Petachya."
      fr: "Avant d’entrer en politique nationale, Goldknopf a rejoint son père au début des années 1980 à la tête du réseau de jardins d’enfants et de crèches Beit Yaakov, qu’il a repris après la mort de son père en 1988. En 1990, il a fondé le réseau d’éducation spécialisée Petachya."
