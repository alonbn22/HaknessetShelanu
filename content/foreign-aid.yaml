      ar: "تعويضات ومدفوعات رفاه للناجين من المحرقة (تُدار أساسًا عبر مؤتمر المطالبات)، إضافة إلى التعويضات التاريخية للدولة."
      ru: "Компенсации и социальные выплаты пережившим Холокост (в основном через «Клеймс конференс»), помимо исторических репараций государству."
      es: "Indemnizaciones y pagos asistenciales a supervivientes del Holocausto (sobre todo a través de la Claims Conference), además de las reparaciones históricas al Estado."
      fr: "Indemnisations et prestations sociales aux survivants de la Shoah (surtout via la Claims Conference), en plus des réparations historiques versées à l’État."
    source:
