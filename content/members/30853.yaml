        title: List of members of the twenty-fifth Knesset
        publisher: Wikipedia
  - kind: positive
    category: achievement
    title:
      he: יוזם חוק הכפפת מח"ש למשרד המשפטים
      en: Initiated law placing police investigations unit under the Justice Ministry
    description:
      he: ביוני 2026 אישרה הכנסת תיקון חקיקה שיזם סעדה, המעביר את המחלקה לחקירות שוטרים (מח"ש) מאחריות פרקליטות המדינה לאחריות משרד המשפטים. החוק היה שנוי במחלוקת ועבר ברוב של 43 תומכים מול 39 מתנגדים.
      en: In June 2026 the Knesset approved a legislative amendment initiated by Saada that transfers the Police Internal Investigations Department (Mahash) from the authority of the State Attorney's Office to that of the Justice Ministry. The law was controversial and passed by a vote of 43 in favor to 39 against.
    date: 2026-06-11
    sources:
      - url: https://www.jpost.com/israel-news/article-899033
        title: Knesset passes law placing internal police investigations under Justice Ministry's authority
        publisher: The Jerusalem Post
  - kind: negative
    category: controversy
    status: settled
    title:
      he: ניגוד עניינים בקידום חוק מח"ש - קביעת ועדת האתיקה
      en: Conflict of interest in advancing the Mahash bill - Ethics Committee finding
    description:
      he: ביולי 2023 קבעה ועדת האתיקה של הכנסת, בעקבות פנייה, כי קידום הצעת חוק על ידי חבר כנסת המנהל הליך משפטי נגד גורם הקשור להצעה מהווה ניגוד עניינים - בהתייחס לכך שסעדה קידם את חוק מח"ש בעודו מנהל תביעה נגד אותה מחלקה בטענת התעמרות. בעקבות הקביעה הודיע סעדה כי לא ימשיך לקדם את ההצעה וכי חבר כנסת אחר יקדם אותה.
      en: In July 2023 the Knesset Ethics Committee, acting on a complaint, found that for an MK to advance a bill while pursuing legal proceedings against an entity connected to that bill constitutes a conflict of interest - referring to Saada advancing the Mahash bill while pursuing a lawsuit against that same department over a workplace-harassment claim. Following the finding, Saada announced he would no longer advance the bill and that another MK would do so instead.
    date: 2023-07-30
    sources:
      - url: https://www.haaretz.co.il/news/politi/2023-07-30/ty-article/00000189-a72d-d6a5-a3e9-f73d49e80000
        title: 'סעדה לא יקדם את חוק מח"ש בשל ניגוד עניינים, אך הבהיר: "ח"כ אחר יקדם אותו"'
        publisher: Haaretz
      - url: https://www.ynet.co.il/news/article/sygvcrxin
        title: '"מנוף לחץ פסול": ח"כ משה סעדה לא יוכל לקדם את חוק מח"ש'
        publisher: Ynet
  - kind: negative
    category: controversy
    status: settled
    date: 2026-05-07
    title:
      he: ביקורת בית המשפט על תפקודו כחוקר בפרשת רונאל פישר
      en: Court criticism of his conduct as an investigator in the Ronel Fisher case
      ar: انتقاد المحكمة لأدائه كمحقق في قضية رونإل فيشر
      ru: Критика суда в адрес его действий как следователя по делу Ронэля Фишера
    description:
      he: בגזר הדין של רונאל פישר בינואר 2026, מתח בית המשפט המחוזי בירושלים ביקורת על התנהלותו של משה סעדה, שכיהן כסגן ראש מחלקת החקירות במח״ש, וקבע כי הסתיר חומר חקירה והטעה את בית המשפט; הכשלים תרמו למחיקת 11 מתוך 14 אישומים. במאי 2026 דחה נציב הקבילות השופט בדימוס מנחם פינקלשטיין את תלונת סעדה נגד הפרקליטות וקבע כי הכשל נבע מהתנהלות מח״ש בתקופתו. לא נפתחה חקירה פלילית נגד סעדה ולא הוגש נגדו כתב אישום. סעדה דוחה את הביקורת, וכינה את הסדר הטיעון ״מכירת חיסול״ וטען כי הפרקליטות והשופט פעלו ״יד אחת״.
      en: In Ronel Fisher's January 2026 sentencing, the Jerusalem District Court criticized the conduct of Moshe Saada, who had served as deputy head of the Police Internal Investigations Department (MACSH), finding that he concealed investigation material and misled the court; these failures contributed to 11 of 14 charges being dropped. In May 2026 the Ombudsman for Complaints, retired Judge Menachem Finkelstein, rejected Saada's complaint against the prosecution and found the failure stemmed from MACSH's conduct during Saada's tenure. No criminal investigation was opened against Saada personally and no indictment was filed against him. Saada rejects the criticism, calling the plea deal a 'liquidation sale' and asserting the prosecution and judge acted 'as one hand.'
      ar: في إصدار الحكم على رونإل فيشر في يناير 2026، انتقدت محكمة القدس المركزية أداء موشيه سعدة، الذي شغل منصب نائب رئيس قسم التحقيقات، ووجدت أنه أخفى مواد التحقيق وضلل المحكمة. في مايو 2026 رفض المفوض القاضي المتقاعد مناحيم فينكلشتاين شكوى سعدة ضد النيابة. لم يُفتح تحقيق جنائي ضد سعدة ولم توجه إليه لائحة اتهام. يرفض سعدة الانتقادات.
      ru: При вынесении приговора Ронэлю Фишеру в январе 2026 года Окружной суд Иерусалима критиковал действия Моше Саады, занимавшего пост заместителя главы следственного отдела, установив, что он скрыл следственные материалы и ввел суд в заблуждение. В мае 2026 года омбудсмен отклонил жалобу Саады. Уголовное расследование против Саады не возбуждалось, обвинение не предъявлялось. Саада отвергает критику.
    sources:
