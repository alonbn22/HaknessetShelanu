    title:
      he: "שובץ במקום ה-11 בין נציגי יש עתיד ברשימת \"ביחד\" לכנסת ה-26"
      en: "Placed 11th among Yesh Atid's candidates on the \"Beyachad\" list for the 26th Knesset"
    description:
      he: "ברשימת נציגי יש עתיד שהציג יאיר לפיד ב-5 בספטמבר 2026 לקראת הריצה המשותפת עם נפתלי בנט ברשימת \"ביחד\", שובץ טור-פז במקום ה-11, אחרי נטע אטיאס. ברשימה המשותפת שהוצגה ב-6 בספטמבר והוגשה לוועדת הבחירות המרכזית, מקומו נמצא מחוץ לעשרים המקומות הראשונים."
      en: "On the slate of Yesh Atid representatives presented by Yair Lapid on 5 September 2026 for the joint run with Naftali Bennett on the \"Beyachad\" list, Tur-Paz was placed 11th, after Neta Atias. On the joint list unveiled on 6 September and submitted to the Central Elections Committee, his slot fell outside the top twenty."
