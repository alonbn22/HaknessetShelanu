    title:
      he: ביקורת בית המשפט על התנהלותו כחוקר בפרשת רונאל פישר
      en: Court criticism of his conduct as an investigator in the Ronel Fisher case
    description:
      he: בגזר הדין בעניין עו"ד רונאל פישר, שפורסם בינואר 2026, מתח בית המשפט ביקורת
        על התנהלות החקירה שהוביל סעדה במח"ש שנים קודם לכן, וקבע בין היתר כי
        הוסתר חומר חקירה מהנאשמים ומבית המשפט וכי בית המשפט הוטעה. הביקורת
        מתייחסת לתפקודו בעבר כחוקר במח"ש ואינה הליך פלילי נגדו אישית. סעדה דחה
        את הביקורת ומתח ביקורת נגדית על אופן ניהול ההליך.
      en: In the January 2026 sentencing ruling in the case of attorney Ronel Fisher,
        the court criticized the conduct of the investigation that Saada had led
        at Mahash years earlier, finding among other things that investigative
        material had been concealed from defendants and the court and that the
        court had been misled. The criticism relates to his past work as a
        Mahash investigator and is not a criminal proceeding against him
        personally. Saada rejected the criticism and in turn criticized the way
        the case was handled.
    date: 2026-01-20
