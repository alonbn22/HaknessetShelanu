  - kind: negative
    category: controversy
    date: "2026-09-15"
    title:
      he: "סרטון בחירות מבוסס בינה מלאכותית המציג את נשיא העליון והיועמ\"שית נגררים מהפגנה; לשכת עורכי הדין דרשה להסירו"
      en: "AI-generated campaign video showing Chief Justice Isaac Amit and the Attorney General being dragged from a protest; the Bar Association demanded its removal"
    description:
      he: "ב-15 בספטמבר 2026 פרסם סמוטריץ' סרטון בחירות של הציונות הדתית שנוצר בבינה מלאכותית ובו נראים אנשי ביטחון מפנים בכוח את נשיא בית המשפט העליון יצחק עמית, השופטת דפנה ברק-ארז והיועצת המשפטית לממשלה גלי בהרב-מיארה מהפגנה. הנשיא יצחק הרצוג אמר כי \"בחירות אינן מלחמת אזרחים\", וראשי אופוזיציה וראש לשכת עורכי הדין גינו את הסרטון. ב-17 בספטמבר דרשה לשכת עורכי הדין להסיר את הסרטון ואיימה בעתירה לוועדת הבחירות המרכזית. בדיווחים לא הובאה תגובה מסמוטריץ' או ממפלגתו."
      en: "On 15 September 2026 Smotrich released an AI-generated Religious Zionism campaign video depicting security personnel forcibly removing Supreme Court President Isaac Amit, Justice Daphne Barak-Erez and Attorney General Gali Baharav-Miara from a protest. President Isaac Herzog said \"elections are not a civil war\", and opposition leaders and the head of the Israel Bar Association condemned the video. On 17 September the Israel Bar Association demanded the video be taken down and threatened to petition the Central Elections Committee. The reports carried no response from Smotrich or his party."
