      he: "סגן יושב ראש הכנסת ה-25 (2022–2025)"
      en: "Deputy Speaker of the 25th Knesset (2022–2025)"
    description:
      he: "על פי רישומי הכנסת, טור-פז כיהן כסגן יושב ראש הכנסת ה-25 מ-13 בדצמבר 2022 עד 5 במרץ 2025. בכנסת ה-25 הוא חבר בוועדת החינוך, התרבות והספורט, בוועדת החוץ והביטחון ובוועדה המיוחדת לפניות הציבור."
      en: "According to Knesset records, Tur-Paz served as a Deputy Speaker of the 25th Knesset from 13 December 2022 until 5 March 2025. In the 25th Knesset he sits on the Education, Culture and Sports Committee, the Foreign Affairs and Defense Committee and the Special Committee for Public Petitions."
