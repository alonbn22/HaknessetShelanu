      he: "המגעים לאיחוד כחול לבן עם מפלגת \"האחדות\" של גלעד ארדן הסתיימו ללא הסכם"
      en: "Talks to merge Blue and White with Gilad Erdan's \"HaAchdut\" party ended without agreement"
    description:
      he: "ב-4 בספטמבר 2026 הסתיימו ללא הסכם המגעים לאיחוד בין כחול לבן לבין מפלגת \"האחדות\" בראשות גלעד ארדן, על רקע מחלוקת בשאלה מי יעמוד בראש רשימה משותפת. לפי הדיווח, שתי המפלגות לא עברו את אחוז החסימה בסקרים באותה עת."
      en: "On 4 September 2026 merger talks between Blue and White and Gilad Erdan's \"HaAchdut\" party ended without agreement, amid disagreement over who would head a joint list. According to the report, neither party was passing the electoral threshold in polls at the time."
