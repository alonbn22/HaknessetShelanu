  - id: 1102 # Yesh Atid — in 2026 runs inside the joint list "Together" (ביחד) headed by Naftali Bennett
    verified: "2026-09-19"
    logo: { src: "/assets/logos/yesh-atid.png", source: { url: "https://yeshatid.org.il/", title: "יש עתיד — הלוגו באתר המפלגה (2026)", publisher: "יש עתיד" } }
    updates:
      - date: "2025-08-13"
        text:
          he: "ח\"כ עידן רול, שפרש מסיעת יש עתיד בינואר 2025 וכיהן כסיעת יחיד, התפטר מהכנסת ב-10 באוגוסט 2025; עדי עזוז נכנסה במקומו ב-13 באוגוסט 2025."
          en: "MK Idan Roll, who left the Yesh Atid faction in January 2025 and sat as a one-member faction, resigned from the Knesset on 10 August 2025; Adi Azuz took his seat on 13 August 2025."
          ar: "استقال عضو الكنيست عيدان رول، الذي انسحب من كتلة يش عتيد في كانون الثاني/يناير 2025 وكان كتلة من عضو واحد، من الكنيست في 10 آب/أغسطس 2025؛ ودخلت عدي عزوز مكانه في 13 آب/أغسطس 2025."
          ru: "Депутат Идан Ролль, вышедший из фракции «Еш Атид» в январе 2025 года и составлявший фракцию из одного депутата, сложил мандат 10 августа 2025 года; 13 августа 2025 года его место заняла Ади Азуз."
          es: "El diputado Idan Roll, que dejó la facción Yesh Atid en enero de 2025 y formó una facción unipersonal, renunció a la Knéset el 10 de agosto de 2025; Adi Azuz ocupó su escaño el 13 de agosto de 2025."
          fr: "Le député Idan Roll, qui avait quitté la faction Yesh Atid en janvier 2025 et siégeait comme faction à un seul membre, a démissionné de la Knesset le 10 août 2025 ; Adi Azuz a pris son siège le 13 août 2025."
        sources:
          - { url: "https://www.timesofisrael.com/knesset-approves-mk-idan-rolls-request-to-leave-yesh-atid-party/", title: "Knesset approves MK Idan Roll's request to leave Yesh Atid party (2025-01-14)", publisher: "The Times of Israel" }
          - { url: "https://www.timesofisrael.com/mk-idan-roll-former-deputy-foreign-minister-quits-knesset-and-leaves-politics/", title: "MK Idan Roll, former deputy foreign minister, quits Knesset and leaves politics (2025-08-10)", publisher: "The Times of Israel" }
          - { url: "https://www.maariv.co.il/news/israel/Article-1222573", title: "עידן רול פורש מהכנסת: \"תמיד אמרתי את האמת\" (2025-08-10)", publisher: "מעריב" }
          - { url: "https://knesset.gov.il/OdataV4/ParliamentInfo/KNS_Faction?$filter=KnessetNum%20eq%2025", title: "KNS_Faction — FactionID 1109 'חה\"כ עידן רול', 2025-01-14 to 2025-08-13 (2026-09-19)", publisher: "Knesset OData" }
          - { url: "https://knesset.gov.il/OdataV4/ParliamentInfo/KNS_PersonToPosition?$filter=FactionID%20eq%201102%20and%20KnessetNum%20eq%2025%20and%20StartDate%20ge%202025-01-01T00:00:00Z", title: "KNS_PersonToPosition — PersonID 30895 (עדי עזוז) StartDate 2025-08-13 (2026-09-19)", publisher: "Knesset OData" }
      - date: "2026-04-26"
        text:
          he: "יאיר לפיד ונפתלי בנט הודיעו על ריצה משותפת בבחירות 2026 ברשימה אחת בשם \"ביחד\" בראשות בנט, כאשר לפיד במקום השני; המפלגות לא התמזגו."
          en: "Yair Lapid and Naftali Bennett announced a joint run in the 2026 election on a single list named “Together” (ביחד), headed by Bennett with Lapid second; the parties did not merge."
          ar: "أعلن يائير لبيد ونفتالي بينيت ترشحهما المشترك في انتخابات 2026 ضمن قائمة واحدة باسم «معًا» (ביחד) برئاسة بينيت، ولبيد في الموقع الثاني؛ ولم يندمج الحزبان."
          ru: "Яир Лапид и Нафтали Беннет объявили о совместном участии в выборах 2026 года единым списком «Вместе» (ביחד) во главе с Беннетом, Лапид — второй; партии не объединились."
          es: "Yair Lapid y Naftali Bennett anunciaron una candidatura conjunta en las elecciones de 2026 en una sola lista llamada «Juntos» (ביחד), encabezada por Bennett con Lapid en segundo lugar; los partidos no se fusionaron."
          fr: "Yaïr Lapid et Naftali Bennett ont annoncé une candidature commune aux élections de 2026 sur une seule liste nommée « Ensemble » (ביחד), menée par Bennett avec Lapid en deuxième position ; les partis n’ont pas fusionné."
        sources:
          - { url: "https://www.timesofisrael.com/naftali-bennett-and-yair-lapid-announce-united-run-under-bennett-in-2026-elections/", title: "Naftali Bennett and Yair Lapid announce united run under Bennett in 2026 elections (2026-04-26)", publisher: "The Times of Israel" }
          - { url: "https://www.timesofisrael.com/launching-joint-slate-bennett-and-lapid-promise-the-era-of-division-is-over/", title: "Launching joint slate, Bennett and Lapid promise 'the era of division is over' (2026-04-27)", publisher: "The Times of Israel" }
          - { url: "https://www.mako.co.il/news-israel-elections/2026/Article-5a85a0ff5d9cd91027.htm", title: "מפץ פוליטי: בנט ולפיד הודיעו על איחוד (2026-04-26)", publisher: "N12 (mako)" }
      - date: "2026-07-28"
        text:
          he: "שני חברי כנסת של יש עתיד עזבו את הכנסת באמצע 2026: בועז טופורובסקי (הודיע ב-27 במאי; עוז חיים נכנס במקומו ב-7 ביוני 2026) ורון כץ (הודיע ב-26 ביולי; מוחמד אבו אל היג'א נכנס במקומו ב-28 ביולי 2026)."
          en: "Two Yesh Atid MKs left the Knesset in mid-2026: Boaz Toporovsky (announced 27 May; Oz Haim took his seat on 7 June 2026) and Ron Katz (announced 26 July; Mohammad Abu al-Hija took his seat on 28 July 2026)."
          ar: "غادر عضوا كنيست من يش عتيد الكنيست في منتصف 2026: بوعز توبوروفسكي (أعلن في 27 أيار/مايو؛ ودخل عوز حاييم مكانه في 7 حزيران/يونيو 2026) ورون كاتس (أعلن في 26 تموز/يوليو؛ ودخل محمد أبو الهيجاء مكانه في 28 تموز/يوليو 2026)."
          ru: "Два депутата от «Еш Атид» покинули Кнессет в середине 2026 года: Боаз Топоровский (объявил 27 мая; 7 июня 2026 года его место занял Оз Хаим) и Рон Кац (объявил 26 июля; 28 июля 2026 года его место занял Мухаммад Абу аль-Хиджа)."
          es: "Dos diputados de Yesh Atid dejaron la Knéset a mediados de 2026: Boaz Toporovsky (anunciado el 27 de mayo; Oz Haim ocupó su escaño el 7 de junio de 2026) y Ron Katz (anunciado el 26 de julio; Mohammad Abu al-Hija ocupó su escaño el 28 de julio de 2026)."
          fr: "Deux députés de Yesh Atid ont quitté la Knesset à la mi-2026 : Boaz Toporovsky (annoncé le 27 mai ; Oz Haim a pris son siège le 7 juin 2026) et Ron Katz (annoncé le 26 juillet ; Mohammad Abu al-Hija a pris son siège le 28 juillet 2026)."
        sources:
          - { url: "https://www.timesofisrael.com/yesh-atid-co-founder-and-mk-boaz-toporovsky-steps-away-from-knesset/", title: "Yesh Atid co-founder and MK Boaz Toporovsky steps away from Knesset (2026-05-27)", publisher: "The Times of Israel" }
