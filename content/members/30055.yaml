      he: "שר האוצר ושר במשרד הביטחון; מנהיג מפלגת הציונות הדתית"
      en: "Minister of Finance and minister in the Defense Ministry; leader of the Religious Zionist Party"
    description:
      he: "עורך דין במקצועו, סמוטריץ' נכנס לכנסת ב-2015 ועומד בראש מפלגת הציונות הדתית. כיהן כשר התחבורה (2019–2020), ומאז 29 בדצמבר 2022 מכהן כשר האוצר ה-27 של ישראל וכשר במשרד הביטחון האחראי על מנהלת ההתיישבות ביהודה ושומרון, גם בממשלת המעבר."
      en: "A lawyer by profession, Smotrich entered the Knesset in 2015 and leads the Religious Zionist Party. He served as Minister of Transport (2019–2020) and since 29 December 2022 has been Israel's 27th Minister of Finance and a minister in the Defense Ministry responsible for the Settlement Administration in the West Bank, including in the caretaker government."
