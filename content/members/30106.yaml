  - kind: positive
    category: achievement
    title:
      he: "חוקים שהתקבלו ביוזמתה: דמי מחלה לחולים כרוניים, חניה לפי דקות, וסיוע למוקדי חירום"
      en: "Laws passed on her initiative: sick pay for chronically ill workers, per-minute parking, and support for emergency hotlines"
    description:
      he: "בין החוקים שהתקבלו בקריאה שלישית ולזימי נמנתה עם יוזמיהם: תיקון מס' 6 לחוק דמי מחלה (2022), המזכה עובדים החולים במחלה ממארת או הנזקקים לדיאליזה בדמי מחלה מהיום הראשון להיעדרות לטיפול; תיקון מס' 136 לפקודת התעבורה (2024), שלפיו דמי חניה בחניונים ייגבו לפי דקות כבר מהשעה הראשונה; תיקון מס' 81 לחוק התקשורת (2025), המאפשר למוקדי עזרה ראשונה נפשית ולמוקדי סיוע לנפגעי תקיפה מינית לקבל פרטי זיהוי חלקיים של פונים במקרה של חשש לשלומם; וחוק הרשות הלאומית למאבק בעוני (2025)."
      en: "Laws passed in their third reading with Lazimi among the initiators include: Amendment 6 to the Sick Pay Law (2022), entitling workers with cancer or those requiring dialysis to sick pay from the first day of absence for treatment; Amendment 136 to the Traffic Ordinance (2024), under which parking-lot fees are charged by the minute from the first hour; Amendment 81 to the Communications Law (2025), allowing mental-health first-aid and sexual-assault crisis hotlines to receive partial caller identification where a caller's safety is at risk; and the National Authority for Combating Poverty Law (2025)."
    date: "2025-04-03"
