    title:
      he: "הוועדה בראשותו הכינה את הוראת השעה להקפאת מעצרי תלמידי ישיבות, שאושרה סופית ערב פיזור הכנסת"
      en: "His committee prepared the temporary order freezing arrests of yeshiva students, passed on the eve of the Knesset's dissolution"
    description:
      he: "ב-28 ביוני 2026 קידמה ועדת החוץ והביטחון בראשות ביסמוט הוראת שעה להקפאת הליכי מעצר, חקירה ואכיפה נגד תלמידי ישיבות שתורתם אומנותם; ביסמוט טען כי \"המשך מדיניות המעצרים עלול לפגוע במאמצי הגיוס\". לפי רישומי הכנסת, חוק שירות ביטחון (תיקון מס' 28 – הוראת שעה) התקבל בקריאה שנייה ושלישית ב-13 ביולי 2026, ימים לפני סיום כהונת הכנסת ה-25."
      en: "On 28 June 2026 the Foreign Affairs and Defense Committee, chaired by Bismuth, advanced a temporary order freezing arrests, investigations and enforcement against full-time yeshiva students; Bismuth argued that \"continuing the policy of arrests is likely to harm conscription efforts\". Knesset records show the Defense Service Law (Amendment 28 – Temporary Order) passed its second and third readings on 13 July 2026, days before the 25th Knesset's term ended."
