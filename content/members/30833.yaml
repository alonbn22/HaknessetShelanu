claims:
  - kind: positive
    category: achievement
    title:
      he: סגן שר במשרד ראש הממשלה
      en: Deputy Minister in the Prime Minister's Office
    description:
      he: ב-2 באפריל 2025 מונה אלמוג כהן, אז מטעם מפלגת עוצמה יהודית, לסגן שר במשרד
        ראש הממשלה, והתפטר מהכנסת מכוח החוק הנורבגי; במסגרת תפקידו הופקד על קידום
        הקמתו של שדה תעופה משלים לנתב"ג בנגב. ב-29 ביוני 2025 הודיע על התפטרותו
        מהממשלה כדי לשוב לכנסת ולקדם הצעת חוק להקמת שדה תעופה בנבטים, אך בסופו
        של דבר חזר בו מההתפטרות, ולפי רישומי הכנסת הוא ממשיך לכהן כסגן שר (נכון
        לספטמבר 2026, בממשלת מעבר).
      en: On 2 April 2025, Almog Cohen, then of the Otzma Yehudit party, was appointed
        Deputy Minister in the Prime Minister's Office, resigning from the
        Knesset under the Norwegian Law; in this role he was tasked with
        advancing a supplementary airport to Ben Gurion Airport in the Negev. On
        29 June 2025 he announced his resignation from the government in order
        to return to the Knesset and promote a bill for an airport at Nevatim,
        but he ultimately reversed the resignation, and according to the
        Knesset's records he continues to serve as deputy minister (as of
        September 2026, in a caretaker government).
    date: 2025-04-02
