      en: Goldknopf served as Minister of Construction and Housing in Israel's 37th
        government under Benjamin Netanyahu, from 29 December 2022 until his
        resignation, announced on 12 June 2025 over the lack of progress on draft-exemption legislation; Knesset records date the end of his ministerial term to 15 June 2025, the day he returned to serve as an MK. He concurrently served as a minister in the Prime Minister's Office until 26 March 2025.
