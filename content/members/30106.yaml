    description:
      he: במהלך כהונתה בכנסת ה-25 כיהנה נעמה לזימי כיושבת ראש הוועדה המיוחדת לצעירים
        בישראל, ובמסגרתה עסקה בין היתר בחסמי השתלבות של צעירים.
      en: During the 25th Knesset, Naama Lazimi served as chair of the Knesset's
        Special Committee on Young Israelis, in which capacity she addressed
        issues including integration barriers facing young people.
