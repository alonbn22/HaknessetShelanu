        publisher: Arutz 7 / Israel National News
      - url: https://www.ynet.co.il/news/article/rjyxylkn11l
        title: 'הח"כ מעוצמה יהודית שוב לועג לטראמפ: "Don''t quack"'
        publisher: Ynet
  - kind: neutral
    category: news
    date: "2026-09-06"
    title:
      he: הודיע כי לא יתמודד לכנסת ה-26 מטעם עוצמה יהודית לאחר שנדחק לאחור ברשימה
      en: Announced he will not run for the 26th Knesset with Otzma Yehudit after being pushed down the list
    description:
      he: 'ב-6 בספטמבר 2026 הודיע פוגל כי לא יתמודד בבחירות 27 באוקטובר מטעם עוצמה יהודית, לאחר שטלי גוטליב, השר יצחק וסרלאוף ולימור סון הר-מלך שובצו לפניו ברשימת המפלגה. פוגל כתב: "לצערי, הדרך להמשך פעילותי בכנסת או בממשלה הבאה אינה אפשרית כפי שתכננתי". יו"ר המפלגה איתמר בן גביר הודה לו על "שנים של פעילות מסורה, נחושה ובלתי מתפשרת".'
      en: 'On 6 September 2026 Fogel announced that he would not run in the 27 October election for Otzma Yehudit, after Tali Gotliv, Minister Yitzhak Wasserlauf and Limor Son Har-Melech were placed ahead of him on the party list. Fogel wrote: "Unfortunately, the path to continuing my work in the Knesset or in the next government is not possible as I had planned." Party chairman Itamar Ben Gvir thanked him for "years of dedicated, determined and uncompromising action".'
    sources:
