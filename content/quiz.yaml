          es: "los objetivos del movimiento en la constitución del Likud (versión de julio de 2015); el sitio del Likud no publica un programa para 2026"
          fr: "les objectifs du mouvement dans la constitution du Likoud (version de juillet 2015) ; le site du Likoud ne publie aucun programme pour 2026"
        source: { url: "https://www.likud.org.il/about/%D7%97%D7%95%D7%A7%D7%AA-%D7%94%D7%9C%D7%99%D7%9B%D7%95%D7%93", title: "חוקת הליכוד (PDF להורדה), כפי תקפה ליום 1 ביולי 2015 — פרק ב׳: מטרות, סעיף 1(ז)", publisher: "הליכוד" }
        quote:
          he: "\"ביצורה הכלכלי של המדינה ויצירת תנאים נאותים לצמיחה כלכלית ולכינון משק חופשי-תחרותי הנושא את עצמו והמבוסס על יוזמה חפשית, והימנעות הממשלה, ככל הניתן ממעורבות במשק.\""
          en: "\"Strengthening the state's economy and creating proper conditions for economic growth and for establishing a free, competitive, self-sustaining economy based on free enterprise, and the government refraining, as far as possible, from involvement in the economy.\""
          ar: "«تعزيز اقتصاد الدولة وتهيئة الظروف الملائمة للنمو الاقتصادي ولإقامة اقتصاد حرّ تنافسي يعتمد على نفسه ويقوم على المبادرة الحرة، وامتناع الحكومة، قدر الإمكان، عن التدخل في الاقتصاد.»"
          ru: "«Укрепление экономики государства, создание надлежащих условий для экономического роста и для построения свободной конкурентной самоокупаемой экономики, основанной на свободном предпринимательстве, и невмешательство правительства в экономику, насколько это возможно»."
          es: "«Fortalecer la economía del Estado y crear condiciones adecuadas para el crecimiento económico y para establecer una economía libre y competitiva, autosuficiente y basada en la libre iniciativa, y que el Gobierno se abstenga, en la medida de lo posible, de intervenir en la economía.»"
          fr: "« Renforcer l’économie de l’État et créer les conditions propices à la croissance économique et à l’établissement d’une économie libre et concurrentielle, autosuffisante et fondée sur la libre entreprise, le gouvernement s’abstenant, autant que possible, d’intervenir dans l’économie. »"
      together:
        value: 1
        basis: platform
        source: { url: "https://be-yahad.org.il/plans/yokermichya/", title: "ביחד נוריד את יוקר המחיה — תוכנית ביחד", publisher: "ביחד" }
        quote:
          he: "\"הפתרון ברור ומעשי: תחרות, תחרות, תחרות… נפחית רגולציה, נסיר חסמי יבוא… נבטל מכסים ובמקומם נתמוך ישירות בחקלאים… השורה התחתונה: פחות מונופולים, פחות בירוקרטיה.\""
          en: "\"The solution is clear and practical: competition, competition, competition… we will cut regulation, remove import barriers… abolish tariffs and instead support farmers directly… the bottom line: fewer monopolies, less bureaucracy.\""
          ar: "«الحل واضح وعملي: منافسة، منافسة، منافسة… سنقلّص التنظيم ونزيل عوائق الاستيراد… ونلغي الجمارك وندعم المزارعين مباشرة بدلًا منها… الخلاصة: احتكارات أقل وبيروقراطية أقل.»"
          ru: "«Решение ясное и практичное: конкуренция, конкуренция, конкуренция… мы сократим регулирование, уберём барьеры для импорта… отменим пошлины и вместо них будем напрямую поддерживать фермеров… итог: меньше монополий, меньше бюрократии»."
          es: "«La solución es clara y práctica: competencia, competencia, competencia… reduciremos la regulación, eliminaremos las barreras a la importación… suprimiremos los aranceles y a cambio apoyaremos directamente a los agricultores… en resumen: menos monopolios, menos burocracia.»"
          fr: "« La solution est claire et pratique : concurrence, concurrence, concurrence… nous réduirons la réglementation, lèverons les barrières à l’importation… supprimerons les droits de douane et soutiendrons à la place directement les agriculteurs… en bref : moins de monopoles, moins de bureaucratie. »"
      yashar:
        value: 1
        basis: platform
        source: { url: "https://yasharwitheisenkot.com/principles/economics/", title: "ישר! להזנקת הכלכלה הישראלית והורדת יוקר המחיה (עודכן 19.7.2026)", publisher: "ישר!" }
        quote:
          he: "\"נבטל חסמי ייבוא ותקנים ייחודיים לישראל… נפעל לצמצום הנטל הבירוקרטי… נפחית את מס ההכנסה על ידי הטלת מסים על מוצרים בעלי השפעות שליליות… נסגור משרדים מיותרים ונייעל את מבנה הממשלה.\""
          en: "\"We will scrap import barriers and Israel-only standards… reduce the bureaucratic burden… cut income tax by taxing products with clear negative effects… close unnecessary ministries and streamline the government.\""
          ar: "«سنلغي عوائق الاستيراد والمعايير الخاصة بإسرائيل وحدها… ونقلّص العبء البيروقراطي… ونخفّض ضريبة الدخل عبر فرض ضرائب على منتجات ذات آثار سلبية واضحة… ونغلق الوزارات غير الضرورية ونحسّن بنية الحكومة.»"
          ru: "«Мы отменим импортные барьеры и стандарты, существующие только в Израиле… сократим бюрократическую нагрузку… снизим подоходный налог, обложив налогом товары с явно вредным воздействием… закроем лишние министерства и оптимизируем структуру правительства»."
          es: "«Eliminaremos las barreras a la importación y las normas exclusivas de Israel… reduciremos la carga burocrática… bajaremos el impuesto sobre la renta gravando productos con efectos negativos claros… cerraremos ministerios innecesarios y racionalizaremos el Gobierno.»"
          fr: "« Nous supprimerons les barrières à l’importation et les normes propres à Israël… allégerons le fardeau bureaucratique… baisserons l’impôt sur le revenu en taxant les produits aux effets négatifs avérés… fermerons les ministères inutiles et rationaliserons le gouvernement. »"
      shas:
        value: 0
        basis: statement
        source: { url: "https://www.ynet.co.il/economy/article/rkKE300fQ00", title: "מי רוצה למסות את העשירים, מי נגד דמי החל\"ת ומי לא טרח לענות? תשובות המפלגות (8.3.2021)", publisher: "ynet" }
        quote:
          he: "ש\"ס: \"נתנגד לביטול הפיקוח על מחירים… אנו לא מתנגדים להפרטת חברות ממשלתיות, אולם ראינו דוגמאות… של הפרטות כושלות… נבחן כל הצעה להפרטה לגופה.\""
          en: "Shas: \"We will oppose abolishing price controls… we do not object to privatizing government companies, but we have seen examples… of failed privatizations… we will examine each privatization proposal on its merits.\""
          ar: "شاس: «سنعارض إلغاء الرقابة على الأسعار… لا نعارض خصخصة الشركات الحكومية، لكننا رأينا أمثلة… على خصخصات فاشلة… وسندرس كل اقتراح خصخصة على حدة.»"
          ru: "ШАС: «Мы будем против отмены контроля над ценами… мы не возражаем против приватизации госкомпаний, но видели примеры… неудачных приватизаций… и будем рассматривать каждое предложение о приватизации по существу»."
          es: "Shas: «Nos opondremos a eliminar el control de precios… no nos oponemos a privatizar empresas públicas, pero hemos visto ejemplos… de privatizaciones fallidas… examinaremos cada propuesta de privatización por sus méritos.»"
          fr: "Shas : « Nous nous opposerons à la suppression du contrôle des prix… nous ne sommes pas opposés à la privatisation d’entreprises publiques, mais nous avons vu des exemples… de privatisations ratées… nous examinerons chaque projet de privatisation au cas par cas. »"
      blue-white:
        value: -1
        basis: statement
        source: { url: "https://www.israelhayom.co.il/news/geopolitics/article/21215389", title: "גנץ: \"צריך להקפיד על מחירים בפיקוח. ייבוא פתוח מייקר מחירים\" (17.8.2026)", publisher: "ישראל היום" }
        quote:
          he: "גנץ: \"אנחנו צריכים להקפיד על מחירים בפיקוח, לפתח את החקלאות. אני לא מאמין בייבוא הפתוח הזה – זה נחמד לדקה ואחרי זה מייקר את המחירים לכולם.\""
          en: "Gantz: \"We need to keep prices under supervision and develop agriculture. I don't believe in this open import – it's nice for a minute and then it raises prices for everyone.\""
          ar: "غانتس: «علينا أن نحافظ على الأسعار تحت الرقابة وأن نطوّر الزراعة. لا أؤمن بهذا الاستيراد المفتوح — إنه لطيف لدقيقة ثم يرفع الأسعار على الجميع.»"
          ru: "Ганц: «Нам нужно держать цены под контролем и развивать сельское хозяйство. Я не верю в этот открытый импорт — он хорош на минуту, а потом повышает цены для всех»."
          es: "Gantz: «Tenemos que mantener los precios bajo supervisión y desarrollar la agricultura. No creo en esta importación abierta: está bien un minuto y después encarece los precios para todos.»"
          fr: "Gantz : « Nous devons garder les prix sous contrôle et développer l’agriculture. Je ne crois pas à cette importation ouverte — c’est bien pendant une minute, puis cela fait monter les prix pour tout le monde. »"
      democrats:
        value: -1
        basis: platform
        source: { url: "https://democrats-media.s3.us-east-1.amazonaws.com/%D7%9B%D7%9C%D7%9B%D7%9C%D7%99+%D7%97%D7%91%D7%A8%D7%AA%D7%99.pdf", title: "התוכנית החברתית-כלכלית — מצע הדמוקרטים (PDF, מעמוד yes.democrats.org.il/topics/economy-society)", publisher: "הדמוקרטים" }
        quote:
          he: "\"נגדיל משמעותית את ההוצאה האזרחית… נפרק את הריכוזיות, נילחם בקרטלי המזון, התרופות והאנרגיה. נוריד בחזרה את מחירי התחבורה הציבורית ונרחיב את המוצרים בפיקוח.\""
          en: "\"We will significantly increase civilian spending… break up concentration, fight the food, drug and energy cartels, bring public-transport fares back down and expand the list of price-controlled products.\""
          ar: "«سنزيد الإنفاق المدني زيادة كبيرة… ونفكّك التركّز، ونحارب كارتلات الغذاء والأدوية والطاقة، ونعيد خفض أسعار المواصلات العامة، ونوسّع قائمة المنتجات الخاضعة للرقابة على الأسعار.»"
          ru: "«Мы значительно увеличим гражданские расходы… покончим с концентрацией рынка, будем бороться с картелями в сфере продуктов, лекарств и энергии, снова снизим цены на общественный транспорт и расширим список товаров с контролируемыми ценами»."
          es: "«Aumentaremos de forma significativa el gasto civil… desmontaremos la concentración, combatiremos los cárteles de los alimentos, los medicamentos y la energía, volveremos a bajar las tarifas del transporte público y ampliaremos la lista de productos con precio supervisado.»"
          fr: "« Nous augmenterons nettement les dépenses civiles… démantèlerons les concentrations, combattrons les cartels de l’alimentation, des médicaments et de l’énergie, ferons à nouveau baisser les tarifs des transports publics et élargirons la liste des produits à prix contrôlé. »"
      joint-list:
        value: -1
        basis: platform
        recordOf:
          he: "התוכנית הכלכלית של מק\"י, המרכיב הגדול בחד\"ש — לא מצע הרשימה המשותפת כולה"
          en: "Maki's economic programme — the largest component of Hadash — not the Joint List's platform"
          ar: "البرنامج الاقتصادي للحزب الشيوعي (ماكي)، المكوّن الأكبر في الجبهة — لا برنامج القائمة المشتركة كلها"
          ru: "экономическая программа МАКИ (компартии) — крупнейшей составляющей «Хадаш», — а не программа всего Объединённого списка"
          es: "programa económico de Maki —el componente principal de Hadash—, no el programa de la Lista Conjunta"
          fr: "programme économique du Maki — la principale composante de Hadash —, pas le programme de la Liste commune"
        source: { url: "https://zoha.org.il/143120/", title: "במה דנים הקומוניסטים לקראת הוועידה: התוכנית הכלכלית-חברתית של מק\"י (28.1.2026)", publisher: "זו הדרך (ביטאון חד\"ש)" }
        quote:
          he: "\"ביטול של כל תוכניות ההפרטה של החברות הממשלתיות והשירותים החברתיים; הלאמת החברות והשירותים שכבר הופרטו… רפורמה במיסוי שתאלץ את בעלי ההון… לשלם מס הכנסה אמיתי.\""
          en: "\"Cancelling all privatization plans for government companies and social services; nationalizing the companies and services already privatized… a tax reform that will force capital owners… to pay real income tax.\""
          ar: "«إلغاء جميع خطط خصخصة الشركات الحكومية والخدمات الاجتماعية؛ وتأميم الشركات والخدمات التي خُصخصت بالفعل… وإصلاح ضريبي يُلزم أصحاب رأس المال… بدفع ضريبة دخل حقيقية.»"
          ru: "«Отмена всех планов приватизации госкомпаний и социальных услуг; национализация уже приватизированных компаний и услуг… налоговая реформа, которая заставит владельцев капитала… платить реальный подоходный налог»."
          es: "«Cancelar todos los planes de privatización de empresas públicas y servicios sociales; nacionalizar las empresas y servicios ya privatizados… una reforma fiscal que obligue a los dueños del capital… a pagar un impuesto sobre la renta real.»"
          fr: "« Annuler tous les plans de privatisation des entreprises publiques et des services sociaux ; nationaliser les entreprises et services déjà privatisés… une réforme fiscale qui obligera les détenteurs de capital… à payer un véritable impôt sur le revenu. »"

      haredi-public:
        value: 2
        basis: platform
        source: { url: "https://hatzibur-haharedi.org/%D7%9E%D7%A6%D7%A2/%D7%9B%D7%9C%D7%9B%D7%9C%D7%94", title: "הכלכלה שלנו — המצע של הציבור החרדי (פרק ט׳)", publisher: "הציבור החרדי" }
        quote:
          he: "\"אנחנו ימין כלכלי: משק חופשי, תחרות ומיסים נמוכים… הפרטת נמל אשדוד… צמצום ופישוט הרגולציה… והעברת פעילויות שאין הכרח שהמדינה תבצע בעצמה לשוק הפרטי ולחברה האזרחית.\""
          en: "\"We are the economic right: a free economy, competition and low taxes… privatizing Ashdod Port… reducing and simplifying regulation… and transferring activities the state need not perform itself to the private market and civil society.\""
          ar: "«نحن اليمين الاقتصادي: اقتصاد حر ومنافسة وضرائب منخفضة… خصخصة ميناء أسدود… تقليص التنظيم وتبسيطه… ونقل الأنشطة التي لا ضرورة لأن تؤديها الدولة بنفسها إلى السوق الخاصة والمجتمع المدني.»"
          ru: "«Мы — экономические правые: свободная экономика, конкуренция и низкие налоги… приватизация Ашдодского порта… сокращение и упрощение регулирования… и передача частному рынку и гражданскому обществу функций, которые государству не обязательно выполнять самому»."
          es: "«Somos la derecha económica: economía libre, competencia e impuestos bajos… privatizar el puerto de Asdod… reducir y simplificar la regulación… y traspasar al mercado privado y a la sociedad civil las actividades que el Estado no necesita realizar por sí mismo.»"
          fr: "« Nous sommes la droite économique : économie libre, concurrence et impôts bas… privatisation du port d’Ashdod… réduction et simplification de la réglementation… et transfert au marché privé et à la société civile des activités que l’État n’a pas besoin d’assurer lui-même. »"
      amkha:
        value: 1
        basis: platform
        source: { url: "https://amchaisrael.co.il/foundations", title: "מסמך אבני היסוד של התנועה — עמך ישראל (כלכלה, יוקר המחיה ודיור; צעד 07)", publisher: "עמך ישראל" }
        quote:
          he: "\"נחתור לשוק חופשי ולשבירת מונופולים… נוביל מהלך להורדת יוקר המחיה באמצעות פירוק מוקדי ריכוזיות וכוח מונופוליסטיים, פתיחת השווקים לתחרות אמיתית, הסרת חסמי יבוא ורגולציה מיותרת.\""
          en: "\"We will strive for a free market and the breaking of monopolies… We will lead a move to lower the cost of living by dismantling concentrations of economic and monopolistic power, opening markets to real competition, and removing import barriers and unnecessary regulation.\""
          ar: "«سنسعى إلى سوق حرة وكسر الاحتكارات… سنقود خطوة لخفض غلاء المعيشة عبر تفكيك مراكز التركّز والقوة الاحتكارية، وفتح الأسواق لمنافسة حقيقية، وإزالة حواجز الاستيراد والتنظيم غير الضروري.»"
          ru: "«Мы будем стремиться к свободному рынку и разрушению монополий… Мы проведём шаг по снижению стоимости жизни путём ликвидации центров концентрации и монопольной власти, открытия рынков для настоящей конкуренции и устранения импортных барьеров и лишнего регулирования»."
          es: "«Aspiraremos a un mercado libre y a romper los monopolios… Impulsaremos una medida para bajar el coste de la vida desmantelando los focos de concentración y de poder monopolístico, abriendo los mercados a una competencia real y eliminando las barreras a la importación y la regulación innecesaria.»"
          fr: "« Nous viserons un marché libre et la fin des monopoles… Nous mènerons une démarche pour réduire le coût de la vie en démantelant les pôles de concentration et de pouvoir monopolistique, en ouvrant les marchés à une véritable concurrence et en supprimant les barrières à l’importation et la réglementation superflue. »"
  - id: religion-state
    topic: religion-state
    lean: left
    text:
      he: "יש להפריד יותר בין דת למדינה — למשל תחבורה ציבורית בשבת ונישואין אזרחיים."
      en: "Religion and state should be more separate — for example public transport on Shabbat and civil marriage."
      ar: "يجب الفصل أكثر بين الدين والدولة — مثلًا مواصلات عامة يوم السبت وزواج مدني."
      ru: "Религию и государство следует разделить сильнее — например, общественный транспорт в шаббат и гражданский брак."
      es: "Religión y Estado deberían estar más separados — por ejemplo, transporte público en Shabat y matrimonio civil."
      fr: "La religion et l’État devraient être plus séparés — par exemple des transports publics le Shabbat et le mariage civil."
    short:
      he: "דת ומדינה"
      en: "Religion and state"
      ar: "الدين والدولة"
      ru: "Религия и государство"
      es: "Religión y Estado"
      fr: "Religion et État"
    explainer:
      he: "ב-2022 פעלו בשבת כעשירית מקווי האוטובוס בישראל, ורוב הנסיעות בשבת היו ביישובים ערביים ומעורבים. בישראל אין נישואין אזרחיים: הסמכות הבלעדית בענייני נישואין וגירושין היא של בתי הדין הדתיים. תומכי ההפרדה רוצים שכל אחד יוכל להתחתן ולנסוע כרצונו; המתנגדים רואים בהסדר הקיים שמירה על הצביון היהודי של המדינה ועל הסטטוס-קוו."
      en: "In 2022 about a tenth of Israel's bus lines ran on Shabbat, and most Shabbat trips were in Arab and mixed towns. Israel has no civil marriage: the religious courts have sole jurisdiction over marriage and divorce. Supporters of more separation want everyone to marry and travel as they choose; opponents see the current arrangement as keeping the state's Jewish character and the status quo."
      ar: "في 2022 كان نحو عُشر خطوط الحافلات في إسرائيل يعمل يوم السبت، وكانت معظم رحلات السبت في بلدات عربية ومختلطة. ولا يوجد في إسرائيل زواج مدني: فالمحاكم الدينية وحدها صاحبة الصلاحية في شؤون الزواج والطلاق. يريد مؤيدو مزيد من الفصل أن يتزوج كل شخص ويتنقل كما يشاء؛ ويرى المعارضون في الترتيب القائم حفاظًا على الطابع اليهودي للدولة وعلى الوضع الراهن."
      ru: "В 2022 году в шаббат работала примерно десятая часть автобусных линий Израиля, и большинство субботних рейсов приходилось на арабские и смешанные города. Гражданского брака в Израиле нет: вопросы брака и развода находятся в исключительной компетенции религиозных судов. Сторонники большего разделения хотят, чтобы каждый мог жениться и ездить, как хочет; противники видят в нынешнем порядке сохранение еврейского характера государства и статус-кво."
      es: "En 2022 funcionaba en Shabat alrededor de una décima parte de las líneas de autobús de Israel, y la mayoría de los trayectos del Shabat eran en localidades árabes y mixtas. En Israel no existe el matrimonio civil: los tribunales religiosos tienen competencia exclusiva sobre el matrimonio y el divorcio. Quienes apoyan más separación quieren que cada persona pueda casarse y viajar como elija; los opositores ven en el arreglo actual la preservación del carácter judío del Estado y del statu quo."
      fr: "En 2022, environ un dixième des lignes de bus d’Israël circulaient le Shabbat, et la plupart des trajets du Shabbat avaient lieu dans des localités arabes et mixtes. Il n’y a pas de mariage civil en Israël : les tribunaux religieux ont une compétence exclusive en matière de mariage et de divorce. Les partisans d’une plus grande séparation veulent que chacun puisse se marier et se déplacer comme il l’entend ; les opposants voient dans l’arrangement actuel la préservation du caractère juif de l’État et du statu quo."
    explainerSources:
      - { url: "https://en.idi.org.il/articles/45933", title: "Inaugural Biennial Statistical Report on Religion and State in Israel", publisher: "המכון הישראלי לדמוקרטיה" }
