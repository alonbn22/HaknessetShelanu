    title:
      he: "שר התיירות, הבינוי והשיכון, הבריאות והרווחה; אינו חבר כנסת מכוח החוק הנורווגי"
      en: "Minister of Tourism, Housing, Health and Welfare; not a sitting MK under the Norwegian Law"
    description:
      he: "כץ מכהן כשר התיירות מאז 29 בדצמבר 2022 והתפטר מהכנסת בינואר 2023 מכוח החוק הנורווגי. לאחר פרישת המפלגות החרדיות מהממשלה ב-2025 אישרה הכנסת את מינויו לשר הבינוי והשיכון (17 בספטמבר 2025, 41 מול 28) ולשר הבריאות ולשר הרווחה והביטחון החברתי (24 בנובמבר 2025, 48 מול 42). הוא ממשיך בתפקידים אלה בממשלת המעבר."
      en: "Katz has served as Minister of Tourism since 29 December 2022 and resigned his Knesset seat in January 2023 under the Norwegian Law. After the Haredi parties left the government in 2025, the Knesset approved him as Minister of Construction and Housing (17 September 2025, 41-28) and as Minister of Health and Minister of Welfare and Social Security (24 November 2025, 48-42). He continues in these posts in the caretaker government."
