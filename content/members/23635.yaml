  - kind: positive
    category: achievement
    title:
      he: "חוקים שהתקבלו ביוזמתה בכנסת ה-25: מחיקת רישומים פליליים ליוצאי אתיופיה, מענק לנשים היוצאות ממקלט, ועוד"
      en: "Laws passed on her initiative in the 25th Knesset: erasing criminal records of Ethiopian Israelis, larger grants for women leaving shelters, and more"
    description:
      he: "תמנו-שטה נמנתה עם יוזמי כמה חוקים שהתקבלו בקריאה שלישית בכנסת ה-25, ובהם: תיקון מס' 4 לחוק שירותי רווחה (2024), שהעלה את מענק ההסתגלות לנשים היוצאות ממקלט לנשים מוכות מ-8,000 ל-11,000 ש\"ח והרחיב את התוספת עבור ילדיהן; חוק מחיקת רישומים פליליים ומשטרתיים של יוצאי אתיופיה (2024), המורה על מחיקת רישומים בעבירות סדר ציבורי שנעברו עד סוף 2020; תיקון מס' 27 לחוק הסיוע המשפטי (2024), המעניק סיוע משפטי ללא מבחן הכנסה בתביעות לפי חוק איסור הפליה במוצרים ובשירותים; ותיקון מס' 22 לחוק הכשרות המשפטית והאפוטרופסות (2025)."
      en: "Tamano-Shata was among the initiators of several laws passed in their third reading in the 25th Knesset, including: Amendment 4 to the Welfare Services Law (2024), raising the adjustment grant for women leaving domestic-violence shelters from NIS 8,000 to NIS 11,000 and extending the per-child supplement; the Erasure of Criminal and Police Records of Ethiopian Israelis Law (2024), ordering the deletion of records for public-order offenses committed up to the end of 2020; Amendment 27 to the Legal Aid Law (2024), granting legal aid without a means test in claims under the Prohibition of Discrimination in Products and Services Law; and Amendment 22 to the Legal Capacity and Guardianship Law (2025)."
    date: "2025-04-01"
