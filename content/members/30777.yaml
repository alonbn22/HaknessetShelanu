    title:
      he: "קצין בכיר במילואים ששירת 85 ימים בעזה לאחר ה-7 באוקטובר"
      en: "Senior IDF reserve officer who served 85 days in Gaza after October 7"
    description:
      he: "טור-פז, סגן-אלוף במילואים ומפקד גדוד לשעבר בחטיבת הצנחנים, חזר לשירות מילואים לאחר מתקפת ה-7 באוקטובר 2023 ושירת כ-85 ימים כאחד מראשי מדור המבצעים באוגדת עזה, במקביל לכהונתו כחבר כנסת. באוקטובר 2024 פרסם את ספרו \"ח\"כ במשמרת לילה: יומן מלחמה\"."
      en: "Tur-Paz, a lieutenant colonel in the IDF reserves and former battalion commander in the Paratroopers Brigade, returned to reserve duty after the 7 October 2023 attack and served about 85 days as a chief of operations in the IDF's Gaza Division, while simultaneously serving as a member of Knesset. In October 2024 he published his war diary, \"An MK on the Night Shift\"."
    date: "2023-10-08"
