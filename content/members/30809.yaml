  - kind: negative
    category: controversy
    title:
      he: "הוציאה את ח\"כ גלעד קריב מדיון ועדת משנה באמירה \"תוציאו את הרפורמי\""
      en: "Removed MK Gilad Kariv from a subcommittee hearing, saying \"remove the Reformist\""
    description:
      he: "ב-9 ביוני 2025, בדיון של ועדת המשנה למחשבת ישראל במערכת החינוך שבראשותה, הורתה דיסטל אטבריאן להוציא את ח\"כ גלעד קריב, רב רפורמי, לאחר שדיבר בעד מתן אפשרות לבנות להניח תפילין בבתי ספר ממלכתיים, ואמרה: \"תוציאו את הרפורמי, היהודים כאן רוצים להמשיך\". במליאה אמרה כי תמנע \"השתלטות של ארגונים רפורמיים על מערכת החינוך\"; קריב הגיב כי דבריה משקפים \"יהדות קנאית, מיזוגינית ומסתגרת\", והתנועה הרפורמית כינתה את הדברים \"פוגעניים ואכזריים\"."
      en: "On 9 June 2025, at a hearing of the subcommittee on Jewish thought in the education system that she chairs, Distel Atbaryan ordered the removal of MK Gilad Kariv, a Reform rabbi, after he spoke in favour of letting girls put on tefillin in state schools, saying: \"Remove the Reformist, the Jews here want to continue.\" In the plenum she said she would prevent \"a takeover of the education system by Reform organisations\"; Kariv responded that her words reflected \"a zealous, misogynistic, isolationist Judaism\", and the Reform movement called the remarks \"offensive and cruel\"."
    date: "2025-06-09"
    sources:
