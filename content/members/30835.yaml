  - kind: negative
    category: controversy
    title:
      he: "מחלוקת על חוק הגיוס שקידם: הכחשת צה\"ל לטענתו בדבר תמיכת הרמטכ\"ל, וביקורת הרמטכ\"ל על הקפאת המעצרים"
      en: "Dispute over the conscription bill he advanced: the IDF denied his claim of the chief of staff's support, and the chief of staff criticised the arrest freeze"
    description:
      he: "באוקטובר 2025 מתחו גורמים משפטיים בכירים ביקורת על עקרונות חוק הגיוס שגיבש ביסמוט כיו\"ר ועדת החוץ והביטחון, וטענו כי הוא מנציח את הפטור לחרדים ללא אכיפה של ממש. באפריל 2026 טען ביסמוט כי הרמטכ\"ל אייל זמיר תומך בנוסח החוק; צה\"ל הודיע כי \"הרמטכ\"ל לא הביע תמיכה בנוסח חוק גיוס ספציפי\", וביסמוט השיב בציטוט דברי הרמטכ\"ל שבלי חוק הגיוס, הארכת השירות וחוק המילואים \"צה\"ל יקרוס\". ביולי 2026 כינה הרמטכ\"ל \"בלתי נתפסת\" הוראת שעה שאישרה הוועדה בראשותו להקפאת מעצרי תלמידי ישיבות; ביסמוט השיב כי לצבא ניתנה הזדמנות מספקת לבחון את החוק, כי \"קשה לראות בעיתוי צירוף מקרים\" וכי המעצרים לא הובילו לגיוס בפועל."
      en: "In October 2025 senior legal officials criticised the conscription-bill principles Bismuth drew up as chair of the Foreign Affairs and Defense Committee, arguing it would entrench the Haredi exemption without real enforcement. In April 2026 Bismuth said Chief of Staff Eyal Zamir supported the bill's text; the IDF stated that \"the Chief of Staff did not express support for any specific draft law\", and Bismuth replied by quoting Zamir that without the draft law, longer service and the reserves law \"the IDF will collapse\". In July 2026 the chief of staff called a temporary order approved by Bismuth's committee freezing arrests of yeshiva students \"inconceivable\"; Bismuth responded that the army had had adequate opportunity to review it, that \"it's hard to see this timing as a coincidence\", and that arrests had not led to actual enlistment."
    date: "2026-07-13"
    sources:
