    title:
      he: שירות צבאי ורקע ציבורי
      en: Military service and public background
    # Re-sourced 2 Oct 2026. The Knesset gives his birth date and degrees,
    # Maariv his home town, parents and degrees, the Knesset Channel his army
    # unit and career. Cut as unsourced: born in Holon (the Knesset says
    # "Israel"), service in 1992–1995, and the artillery corps — the Knesset
    # Channel says anti-aircraft batteries.
    description:
      he: שקלים נולד ב-1974, מתגורר בחולון ובן להורים ילידי איראן. שירת בצה"ל בסוללות
        נ"מ. בעל תואר ראשון במדעי החברה (כלכלה, מדע המדינה וסוציולוגיה) ותואר שני
        בתקשורת פוליטית מאוניברסיטת בר-אילן. עסק בתחום הכושר, ובהמשך הקים משרד
        פרסום לניהול קמפיינים דיגיטליים.
      en: Shekalim was born in 1974, lives in Holon and is the son of parents born in
        Iran. He served in the IDF in anti-aircraft batteries. He holds a
        bachelor's degree in social sciences (economics, political science and
        sociology) and a master's degree in political communication from
        Bar-Ilan University. He worked in fitness and later founded an
        advertising agency that runs digital campaigns.
      ar: وُلد شكاليم عام 1974، ويقيم في حولون، وهو ابن لوالدين وُلدا في إيران. خدم في
        الجيش الإسرائيلي في بطاريات الدفاع الجوي. يحمل شهادة بكالوريوس في العلوم
        الاجتماعية (الاقتصاد والعلوم السياسية وعلم الاجتماع) وشهادة ماجستير في
        الاتصال السياسي من جامعة بار إيلان. عمل في مجال اللياقة البدنية، ثم أسّس
        مكتب إعلانات يدير حملات رقمية.
      ru: Шкалим родился в 1974 году, живёт в Холоне; его родители — уроженцы Ирана.
        Служил в ЦАХАЛе в батареях ПВО. Имеет степень бакалавра общественных наук
        (экономика, политология и социология) и степень магистра в области
        политической коммуникации Университета Бар-Илан. Работал в сфере фитнеса,
        а затем основал рекламное агентство, которое ведёт цифровые кампании.
      es: Shekalim nació en 1974, vive en Holón y es hijo de padres nacidos en Irán.
        Sirvió en el ejército israelí en baterías antiaéreas. Es licenciado en
        ciencias sociales (economía, ciencia política y sociología) y tiene una
        maestría en comunicación política por la Universidad Bar-Ilán. Trabajó en el
        ámbito del fitness y después fundó una agencia de publicidad que gestiona
        campañas digitales.
      fr: Shekalim est né en 1974, vit à Holon et est le fils de parents nés en Iran.
        Il a servi dans l’armée israélienne dans des batteries antiaériennes. Il est
        titulaire d’une licence en sciences sociales (économie, science politique et
        sociologie) et d’un master en communication politique de l’université
        Bar-Ilan. Il a travaillé dans le fitness, puis a fondé une agence de
        publicité qui gère des campagnes numériques.
