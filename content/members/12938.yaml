    title:
      he: חבר כנסת ותיק מטעם ישראל ביתנו
      en: Veteran Knesset member for Yisrael Beiteinu
    description:
      he: חמד עמאר, פוליטיקאי דרוזי יליד שפרעם (1964), משמש חבר הכנסת מטעם מפלגת ישראל
        ביתנו החל משנת 2009, לאחר שירות בצה"ל בשנים 1982-1986. הוא כיהן בכנסות
        ה-18 עד ה-20 וממשיך לכהן מאז.
      en: Hamad Amar, a Druze politician born in Shfaram (1964), has served as a
        Knesset member for the Yisrael Beiteinu party since 2009, following IDF
        service from 1982 to 1986. He served in the 18th through 20th Knessets
        and has continued to serve since.
    date: 2009-02-24
