    description:
      he: 'באוגוסט 2026 ביקש כץ מבית הדין של הליכוד שריון ברשימה בשל "מצב ביטחוני חריג", ובית הדין אישר לנתניהו למקמו ברשימה על פי שיקול דעתו; לפי ynet, ב-2022 התבטא כץ נגד שריונים. ברשימה הסופית שפורסמה ב-8 בספטמבר 2026 לאחר ספירת קולות הפריימריז, כץ מוצב במקום השישי.'
      en: 'In August 2026 Katz asked the Likud court for a reserved slot on the list, citing an "exceptional security situation", and the court allowed Netanyahu to place him wherever he saw fit; according to Ynet, Katz had spoken against reserved slots in 2022. In the final list published on 8 September 2026 after the primary count, Katz is in sixth place.'
