    description:
      he: פוגל מונה ליושב ראש ועדת הביטחון הלאומי של הכנסת בפברואר 2023. הוא הוחלף
        בתפקיד באופן זמני בפברואר 2025 כשעוצמה יהודית עזבה את הקואליציה, והושב
