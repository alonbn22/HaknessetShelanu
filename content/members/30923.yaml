    title:
      he: "נכנסה לכנסת ב-9 בספטמבר 2026 במקום אלעזר שטרן (יש עתיד)"
      en: "Entered the Knesset on 9 September 2026 in place of Elazar Stern (Yesh Atid)"
    description:
      he: "רוני מלכאי נכנסה לכנסת ה-25 מטעם יש עתיד ב-9 בספטמבר 2026, לאחר שאלעזר שטרן הודיע על פרישה מיש עתיד (14 באוגוסט 2026), הצטרף ל'ישר!' של גדי איזנקוט והוצב במקום ה-12 ברשימתה. לפי אתר הכנסת, פרטי הרקע של חברת הכנסת טרם נמסרו למערכת."
      en: "Roni Malkai entered the 25th Knesset for Yesh Atid on 9 September 2026, after Elazar Stern announced he was leaving Yesh Atid (14 August 2026), joined Gadi Eisenkot’s Yashar! and was placed 12th on its list. Per the Knesset site, the member’s background details have not yet been submitted."
