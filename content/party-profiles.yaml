  - id: 1110 # Blue & White – National Unity
    verified: "2026-09-19"
    updates:
      - date: "2025-06-30"
        text:
          he: "ח\"כ גדי איזנקוט, מספר 2 בסיעה, הודיע ליו\"ר בני גנץ על פרישתו מהמפלגה והתפטרותו מהכנסת; כהונתו הסתיימה ב-4 ביולי 2025 ואיתן גינזבורג נכנס במקומו באותו יום."
          en: "MK Gadi Eisenkot, the faction’s No. 2, told chairman Benny Gantz he was leaving the party and resigning from the Knesset; his term ended on 4 July 2025 and Eitan Ginzburg took his seat the same day."
        sources:
          - { url: "https://www.timesofisrael.com/in-political-shakeup-national-unity-no-2-eisenkot-set-to-leave-party-quit-knesset/", title: "In political shakeup, National Unity No. 2 Eisenkot to leave the party, quit Knesset (2025-06-30)", publisher: "The Times of Israel" }
          - { url: "https://www.ynet.co.il/news/article/hjzxfblrgx", title: "איזנקוט עוזב את המחנה הממלכתי - והודיע לגנץ: \"אתפטר מהכנסת\" (2025-06-30)", publisher: "ynet" }
          - { url: "https://www.timesofisrael.com/after-quitting-knesset-eisenkot-says-he-is-working-on-a-governing-alternative/", title: "After quitting Knesset, Eisenkot says he is working to build a 'governing alternative' (2025-07-01)", publisher: "The Times of Israel" }
          - { url: "https://knesset.gov.il/OdataV4/ParliamentInfo/KNS_PersonToPosition?$filter=FactionID%20eq%201098%20and%20KnessetNum%20eq%2025%20and%20(StartDate%20ge%202025-06-01T00:00:00Z%20or%20FinishDate%20ge%202025-06-25T00:00:00Z)", title: "KNS_PersonToPosition — PersonID 30836 (גדי איזנקוט) FinishDate 2025-07-04; PersonID 30693 (איתן גינזבורג) StartDate 2025-07-04 (2026-09-19)", publisher: "Knesset OData" }
      - date: "2025-07-01"
        text:
          he: "ח\"כ מתן כהנא הודיע על פרישה מהסיעה בעקבות איזנקוט; כהונתו בכנסת הסתיימה ב-8 ביולי 2025 ויעל רון בן משה נכנסה במקומו. באותו יום (1 ביולי) הודיע גנץ על החזרת השם \"כחול לבן\"."
          en: "MK Matan Kahana announced he was leaving the faction after Eisenkot; his Knesset term ended on 8 July 2025 and Yael Ron Ben-Moshe took his seat. The same day (1 July) Gantz announced the return to the name “Blue and White”."
        sources:
          - { url: "https://www.jpost.com/israel-news/article-859662", title: "'We are all Blue and White': Gantz reverts National Unity party name after Eisenkot departure (2025-07-01)", publisher: "The Jerusalem Post" }
          - { url: "https://www.timesofisrael.com/after-quitting-knesset-eisenkot-says-he-is-working-on-a-governing-alternative/", title: "After quitting Knesset, Eisenkot says he is working to build a 'governing alternative' (Eisenkot and Kahana to be replaced by Ginzburg and Ron Ben-Moshe) (2025-07-01)", publisher: "The Times of Israel" }
          - { url: "https://www.ynet.co.il/news/article/byoc00u11hle", title: "בצל הפרישות מהמפלגה: גנץ משיק קמפיין חדש - וחוזר ל\"כחול לבן\" (2025-07-01)", publisher: "ynet" }
          - { url: "https://knesset.gov.il/OdataV4/ParliamentInfo/KNS_PersonToPosition?$filter=FactionID%20eq%201098%20and%20KnessetNum%20eq%2025%20and%20(StartDate%20ge%202025-06-01T00:00:00Z%20or%20FinishDate%20ge%202025-06-25T00:00:00Z)", title: "KNS_PersonToPosition — PersonID 30662 (מתן כהנא) FinishDate 2025-07-08; PersonID 30775 (יעל רון בן משה) StartDate 2025-07-08 (2026-09-19)", publisher: "Knesset OData" }
      - date: "2025-07-08"
        text:
          he: "ועדת הכנסת אישרה (7 ביולי) את שינוי שם הסיעה ל\"כחול לבן - המחנה הממלכתי\"; ברישומי הכנסת סיעה 1098 (המחנה הממלכתי) הסתיימה וסיעה 1110 החלה ב-8 ביולי 2025, עם 8 חברים ובראשות פנינה תמנו."
          en: "The Knesset House Committee approved (7 July) renaming the faction “Blue and White–National Unity”; in the Knesset’s records faction 1098 (National Unity) ended and faction 1110 began on 8 July 2025, with 8 members and Pnina Tamano-Shata as faction chair."
        sources:
          - { url: "https://www.timesofisrael.com/liveblog_entry/knesset-panel-approves-changing-name-of-gantzs-party-to-blue-and-white-national-unity/", title: "Knesset panel approves changing name of Gantz's party to Blue and White-National Unity (2025-07-07)", publisher: "The Times of Israel" }
          - { url: "https://knesset.gov.il/OdataV4/ParliamentInfo/KNS_Faction?$filter=KnessetNum%20eq%2025", title: "KNS_Faction — 1098 FinishDate 2025-07-08; 1110 StartDate 2025-07-08 (2026-09-19)", publisher: "Knesset OData" }
          - { url: "https://main.knesset.gov.il/mk/apps/faction/faction-lobby?KnessetID=25&FactionID=1110", title: "סיעת כחול לבן - המחנה הממלכתי — 8 חברים, יו\"ר הסיעה פנינה תמנו (2026-09-19)", publisher: "הכנסת" }
      - date: "2025-07-24"
        text:
          he: "ח\"כ אורית פרקש הכהן הודיעה על פרישה ממפלגת כחול לבן תוך שמירה על מושבה בכנסת, וציינה כוונה לסייע למהלך של גדי איזנקוט; ב-2026 היא במקום השלישי ברשימת ישר!."
          en: "MK Orit Farkash-Hacohen announced she was leaving the Blue and White party while keeping her Knesset seat, saying she intended to help Gadi Eisenkot’s initiative; in 2026 she is third on the Yashar! list."
        sources:
          - { url: "https://www.timesofisrael.com/in-latest-blow-to-gantz-mk-farkash-hacohen-resigns-from-blue-and-white/", title: "In latest blow to Gantz, MK Farkash-Hacohen resigns from Blue and White (2025-07-24)", publisher: "The Times of Israel" }
          - { url: "https://www.gov.il/he/pages/yashar_list_2", title: "ישר! עם איזנקוט — רשימה 2: 3 אורית פרקש הכהן, 5 מתן כהנא, 6 חילי טרופר (2026-09-10)", publisher: "ועדת הבחירות המרכזית (gov.il)" }
      - date: "2025-09-16"
        text:
          he: "גדי איזנקוט הקים את מפלגת \"ישר!\"; מתן כהנא נמנה עם מייסדיה, וב-2026 הוא במקום החמישי ברשימתה."
          en: "Gadi Eisenkot founded the party “Yashar!”; Matan Kahana was among its founders and in 2026 is fifth on its list."
        sources:
          - { url: "https://www.timesofisrael.com/gadi-eisenkot-founds-new-party-two-months-after-resigning-from-knesset/", title: "Gadi Eisenkot founds new party, two months after resigning from Knesset (2025-09-16)", publisher: "The Times of Israel" }
          - { url: "https://www.gov.il/he/pages/yashar_list_2", title: "ישר! עם איזנקוט — רשימה 2: 1 גדי איזנקוט, 5 מתן כהנא (2026-09-10)", publisher: "ועדת הבחירות המרכזית (gov.il)" }
      - date: "2026-05-03"
        text:
          he: "ח\"כ חילי טרופר הודיע על פרישה ממפלגת כחול לבן; ב-6 בספטמבר 2026 מיזג את מפלגתו (הרשומה בוועדת הבחירות כ\"יסודות ישראל\"; \"Zionist Home\" בתקשורת באנגלית) לתוך ישר! והוא במקום השישי ברשימתה. ח\"כ איתן גינזבורג הצטרף לרשימת \"ביחד\" של בנט (מקום 8)."
          en: "MK Chili Tropper announced he was leaving the Blue and White party; on 6 September 2026 he merged his party (registered with the CEC as “יסודות ישראל”; “Zionist Home” in the English press) into Yashar! and is sixth on its list. MK Eitan Ginzburg joined Bennett’s “Together” list (8th)."
        sources:
          - { url: "https://www.timesofisrael.com/blue-and-white-mk-chili-tropper-quits-party-raising-speculation-about-his-future/", title: "Blue and White MK Chili Tropper quits party, raising speculation about his future… and Gantz's (2026-05-03)", publisher: "The Times of Israel" }
          - { url: "https://www.timesofisrael.com/ditching-hendel-zionist-home-chair-chili-tropper-merges-party-into-eisenkots-yashar/", title: "Ditching Hendel, Zionist Home chair Chili Tropper merges party into Eisenkot's Yashar (2026-09-06)", publisher: "The Times of Israel" }
          - { url: "https://www.timesofisrael.com/liveblog_entry/gantz-submits-19-member-blue-and-white-slate-despite-months-of-polling-below-electoral-threshold/", title: "Gantz submits 19-member Blue and White slate despite months of polling below electoral threshold (Ginzburg joined B'Yachad) (2026-09-08)", publisher: "The Times of Israel" }
          - { url: "https://www.gov.il/he/pages/beyahad_list1", title: "ביחד בראשות נפתלי בנט — רשימה 1: 8 איתן גינזבורג (2026-09-07)", publisher: "ועדת הבחירות המרכזית (gov.il)" }
      - date: "2026-09-08"
        text:
          he: "בני גנץ הגיש לוועדת הבחירות רשימה עצמאית בשם \"כחול לבן\" (רשימה 30, האותיות המבוקשות כן): גנץ, פנינה תמנו, גאולה עליזה בלוך, רועי קונקול, צאליק רתם אבידר, אלון שוסטר…; רק שלושה מ-8 חברי הסיעה המכהנים ברשימה, והמפלגה מופיעה בסקרים מתחת לאחוז החסימה."
          en: "Benny Gantz submitted an independent list named “Blue and White” to the CEC (list 30, requested letters כן): Gantz, Pnina Tamano-Shata, Aliza Bloch, Roi Konkol, Tzalik Rotem Avidar, Alon Schuster…; only three of the faction’s 8 sitting MKs are on it, and the party has polled below the electoral threshold."
        sources:
          - { url: "https://www.gov.il/he/pages/kachol-lavan_list30", title: "כחול לבן — רשימה 30 (מגישה: כחול לבן חוסן לישראל) (2026-09-16)", publisher: "ועדת הבחירות המרכזית (gov.il)" }
          - { url: "https://www.timesofisrael.com/liveblog_entry/gantz-submits-19-member-blue-and-white-slate-despite-months-of-polling-below-electoral-threshold/", title: "Gantz submits 19-member Blue and White slate despite months of polling below electoral threshold (2026-09-08)", publisher: "The Times of Israel" }
          - { url: "https://www.timesofisrael.com/israels-election-takes-shape-as-38-parties-submit-slates-from-likud-to-joint-list/", title: "Israel's election takes shape as 38 parties submit slates, in battle between pro- and anti-Netanyahu blocs (2026-09-09)", publisher: "The Times of Israel" }
