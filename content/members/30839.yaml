      en: On 11 July 2026 it was reported that Illouz announced he would not run in
        the Likud primary and would leave the party, after consistently opposing
        its positions on religion-and-state issues, including the draft
        exemption bill. Coalition chairman Ofir Katz told him in a committee
        debate that "everything you say is against Likud and against Netanyahu".
