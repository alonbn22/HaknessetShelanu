          en: "Golan: the mission is \"saving Israel and replacing the disaster government\"; rejecting Ra'am \"plays into the hands of Netanyahu and his partners\"."
      blue-white:
        value: -1
        basis: statement
        source: { url: "https://www.bhol.co.il/news/1738747", title: "מי עם נתניהו, מי פוסל אותו ומי פתוח לכולם? המדריך למפלגות בבחירות 2026 (9.9.2026)", publisher: "בחדרי חרדים" }
        quote:
