  - kind: positive
    category: achievement
    title:
      he: שר במשרד האוצר ומשנה ליושב ראש הכנסת
      en: Minister in the Finance Ministry and Deputy Speaker of the Knesset
    description:
      he: ב-13 ביוני 2021 הושבע חמד עמאר כשר במשרד האוצר, אחד משני שרים לא-יהודים
        בממשלה דאז, וכיהן בתפקיד עד 29 בדצמבר 2022. כן כיהן כמשנה ליושב ראש הכנסת
        בכנסת ה-20 ובכנסת ה-23.
      en: On 13 June 2021, Hamad Amar was sworn in as a minister in the Finance
        Ministry, one of two non-Jewish ministers in the government at the time,
        serving until 29 December 2022. He also served as a Deputy Speaker of the
        Knesset in the 20th and 23rd Knessets.
    date: 2021-06-13
