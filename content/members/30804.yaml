      - url: https://he.wikipedia.org/wiki/%D7%97%D7%99%D7%99%D7%9D_%D7%91%D7%99%D7%98%D7%95%D7%9F
        title: חיים ביטון
        publisher: Wikipedia (Hebrew)
  - kind: negative
    category: investigation
    status: ongoing
    date: 2025-03
    title:
      he: נחקר בחשד להסטת כספי חינוך ציבוריים למימון עיתון 'הדרך'
      en: Under criminal investigation over alleged diversion of public education funds to the 'HaDerech' newspaper
      ar: قيد التحقيق الجنائي بشبهة تحويل أموال تعليم عامة لتمويل صحيفة 'هادرَّخ'
      ru: Под уголовным расследованием по подозрению в перенаправлении государственных средств на образование для финансирования газеты «Га-Дерех»
    description:
      he: משטרת ישראל פתחה באוקטובר 2024 בחקירה נגד חיים ביטון ואחרים בחשד שכספי ציבור שיועדו לחינוך ברשת 'מעיין החינוך התורני' של ש"ס הופנו למימון מוסף ילדים בעיתון המפלגתי 'הדרך', בתקופה שבה כיהן כמנכ"ל הרשת. במרץ 2025 עברה החקירה לשלב גלוי, ביטון זומן לחקירה וארבעה חשודים עוכבו. המשטרה מייחסת למעורבים עבירות קבלת דבר במרמה, מרמה והפרת אמונים, רישום כוזב במסמכי תאגיד והלבנת הון. נכון ליולי 2026 לא הוגש כתב אישום והחקירה לא נסגרה; חלה חזקת החפות.
      en: "In October 2024, Israel Police opened an investigation into Haim Biton and others on suspicion that public funds earmarked for education in the Shas-affiliated 'Ma'ayan HaChinuch HaTorani' school network were diverted to finance a children's supplement in the party newspaper 'HaDerech' during the period he headed the network. In March 2025 the probe moved to an overt phase: Biton was summoned for questioning and four suspects were detained. Police attribute to those involved suspected offenses of obtaining by fraud, fraud and breach of trust, false corporate records, and money laundering. As of July 2026 no indictment had been filed and the case had not closed; the presumption of innocence applies."
      ar: في تشرين الأول 2024 فتحت الشرطة الإسرائيلية تحقيقًا مع حاييم بيتون وآخرين بشبهة تحويل أموال عامة مخصصة للتعليم في شبكة 'معيان هاتوراني' التابعة لحركة شاس لتمويل ملحق للأطفال في صحيفة الحزب 'هادرَّخ'، خلال فترة ترؤسه للشبكة. وفي آذار 2025 انتقل التحقيق إلى مرحلة علنية واستُدعي بيتون للتحقيق. تنسب الشرطة للمتورطين شبهة ارتكاب جرائم احتيال وخيانة أمانة وتزوير وغسيل أموال. حتى تموز 2026 لم تُقدّم لائحة اتهام ولم يُغلَق الملف؛ وتسري قرينة البراءة.
      ru: В октябре 2024 года полиция Израиля начала расследование в отношении Хаима Битона и других по подозрению в том, что государственные средства, предназначенные на образование в сети «Мааян а-Хинух а-Торани», связанной с ПАС, были направлены на финансирование детского приложения партийной газеты «Га-Дерех» в период, когда он возглавлял эту сеть. В марте 2025 года расследование перешло в открытую фазу, Битон был вызван на допрос. Полиция вменяет подозреваемым мошенничество, злоупотребление доверием, подлог и отмывание денег. По состоянию на июль 2026 года обвинительное заключение не предъявлено и дело не закрыто; действует презумпция невиновности.
