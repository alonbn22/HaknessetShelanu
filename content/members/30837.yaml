    title:
      he: חברת הכנסת ה-25 מטעם יש עתיד
      en: Member of the 25th Knesset for Yesh Atid
    description:
      he: דבורה (דבי) ביטון, ילידת שדרות 1965, נבחרה לכנסת ה-25 ברשימת יש עתיד והושבעה
        כחברת כנסת ב-15 בנובמבר 2022, לאחר שהוצבה במקום ה-21 ברשימה. לפני כן
        עמדה בראש סניף יש עתיד בשדרות החל משנת 2013.
      en: Dvora (Debbie) Biton, born in Sderot in 1965, was elected to the 25th
        Knesset on the Yesh Atid list and sworn in as a Member of Knesset on 15
        November 2022, after being placed 21st on the list. She had previously
        led Yesh Atid's local branch in Sderot from 2013.
