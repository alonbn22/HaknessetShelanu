    title:
      he: "זכתה במשבצת האישה השלישית בפריימריז הליכוד לאחר ספירה חוזרת"
      en: "Won the third women's slot in the Likud primary after a recount"
    description:
      he: "בפריימריז הליכוד לקראת בחירות 2026 התמודדה עטייה, בתמיכת השר חיים כץ, מול השרה גילה גמליאל על משבצת האישה השלישית. בתוצאות הראשוניות שפורסמו ב-17 באוגוסט 2026 דווח כי גמליאל זכתה במשבצת; לאחר ספירה חוזרת של קלפיות בבאר יעקב, שתוצאותיה פורסמו ב-31 באוגוסט 2026, דורגה עטייה במקום ריאלי וגמליאל נדחקה למקום ה-35. גמליאל טענה לאי-סדרים בספירה, הגישה תלונה במשטרה ועתרה לבית המשפט; כץ דחה את טענותיה, והליכוד מסר כי הוא פועל לפי הנחיות ועדת הבחירות של המפלגה."
      en: "In the Likud primary ahead of the 2026 election, Atia, backed by Minister Haim Katz, competed with Minister Gila Gamliel for the third women's slot. Initial results published on 17 August 2026 reported Gamliel as the winner of the slot; after a recount of polling stations in Be'er Ya'akov, whose results were published on 31 August 2026, Atia was ranked in a realistic slot and Gamliel dropped to 35th place. Gamliel alleged irregularities in the count, filed a police complaint and petitioned the court; Katz rejected her claims, and Likud said it was following the party election committee's directives."
    sources:
