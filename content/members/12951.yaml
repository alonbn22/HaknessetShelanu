    title:
      he: קרא שלא לקיים בחירות חוזרות למבקר המדינה בניגוד לפסיקת בג"ץ
      en: Called for not holding a repeat State Comptroller election despite a High Court ruling
    description:
      he: לאחר שבג"ץ פסל את בחירת עו"ד מיכאל ראבילו למבקר המדינה בשל פגם בהליך ההצבעה בכנסת והורה על בחירות חוזרות, אמר לוין ב-8 ביולי 2026 בריאיון רדיו כי "אי אפשר לקיים בחירות חוזרות לתפקיד מבקר המדינה" וכי ראבילו "צריך פשוט להיכנס לתפקידו". מקורבי ראבילו מסרו כי הוא תומך בקיום פסק הדין ולא ישתף פעולה עם הפרתו.
      en: After the High Court of Justice invalidated the Knesset's election of attorney Michael Rabello as State Comptroller over a flaw in the voting process and ordered a repeat election, Levin said in a radio interview on 8 July 2026 that "a repeat election for State Comptroller cannot be held" and that Rabello "should simply take office". Associates of Rabello said he supports implementing the ruling and would not cooperate with defying it.
