  - kind: positive
    category: achievement
    title:
      he: פעיל התיישבות והקמת היישוב עמיחי
      en: Settlement activist and founding of Amichai
    description:
      he: בוארון פעל למען ההתיישבות ביהודה ושומרון, עמד בראש מטה המאבק נגד הריסת
        ופינוי עמונה והיה ממנסחי חוק ההסדרה. בשנת 2017 סיכם עם ראש הממשלה בנימין
        נתניהו על הקמת היישוב עמיחי למפוני עמונה — הקמה שאושרה בקבינט ב-30 במרץ 2017 —
        ובפברואר 2018 עלו התושבים לבתיהם הזמניים ביישוב החדש.
      en: Boaron was an activist for settlement in Judea and Samaria, led the campaign
        headquarters against the demolition and evacuation of Amona, and was
        among the drafters of the Regularization Law. In 2017 he reached an
        agreement with Prime Minister Benjamin Netanyahu to establish the
        settlement of Amichai for Amona's evacuees — approved by the cabinet on
        30 March 2017 — and in February 2018 residents moved into temporary homes
        in the new community.
    date: 2017-03-30
