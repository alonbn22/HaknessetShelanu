  - kind: positive
    category: achievement
    title:
      he: חבר הכנסת ויושב ראש סיעת עוצמה יהודית
      en: Member of Knesset and chair of the Otzma Yehudit faction
    description:
      he: פוגל נבחר לכנסת בבחירות 2022 מטעם מפלגת עוצמה יהודית, לאחר שהצטרף למפלגה
        בספטמבר 2022 ושובץ במקום העשירי ברשימה המשותפת של הציונות הדתית ועוצמה
        יהודית. בכנסת ה-25 כיהן כיושב ראש סיעת עוצמה יהודית.
      en: Fogel was elected to the Knesset in the 2022 legislative election on behalf
        of the Otzma Yehudit party, after joining the party in September 2022
        and being placed tenth on the joint Religious Zionist Party–Otzma
        Yehudit list. In the 25th Knesset he served as chair of the Otzma Yehudit faction.
    date: 2022-11
    sources:
