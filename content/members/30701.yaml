        publisher: Ynet
  - kind: positive
    category: achievement
    title:
      he: נציג הכנסת בוועדה לבחירת נציב תלונות הציבור על שופטים
      en: Knesset representative on the panel selecting the judicial ombudsman
    description:
      he: באפריל 2025 הצביעה ועדת הכנסת למנות את אופיר כץ לשמש כנציג הכנסת בוועדה
        האחראית על בחירת נציב תלונות הציבור על שופטים, מינוי שהקנה לקואליציה רוב
        של 4 מול 3 בוועדה זו.
      en: In April 2025 the Knesset House Committee voted to appoint Ofir Katz to
        serve as the Knesset's representative on the committee responsible for
        selecting the judicial ombudsman (the official who handles public
        complaints against judges), giving the coalition a 4-3 majority on that
        panel.
    date: 2025-04-08
