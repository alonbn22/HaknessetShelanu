          - { url: "https://www.mako.co.il/news-israel-elections/2026/Article-3468d77390d9f91027.htm", title: "עוד עזיבה ביש עתיד: חה\"כ רון כץ הודיע על פרישה (2026-07-26)", publisher: "N12 (mako)" }
          - { url: "https://main.knesset.gov.il/mk/apps/faction/faction-lobby?KnessetID=25&FactionID=1102", title: "סיעת יש עתיד — חילופי גברי: 07/06/2026 עוז חיים במקום בועז טופורובסקי; 28/07/2026 מוחמד אבו אל היג'א במקום רון כץ (2026-09-19)", publisher: "הכנסת" }
      - date: "2026-08-11"
        text:
          he: "יואב סגלוביץ הודיע על פרישה מיש עתיד (6 באוגוסט) והתפטר מהכנסת; מיכל סלבני כבביה נכנסה במקומו ב-11 באוגוסט 2026. ב-31 באוגוסט הודיעו מנסור עבאס וסגלוביץ על ריצה משותפת, וסגלוביץ הוצב במקום השני ברשימת רע\"ם."
          en: "Yoav Segalovitz announced he was leaving Yesh Atid (6 August) and resigned from the Knesset; Michal Salbani-Kababia took his seat on 11 August 2026. On 31 August Mansour Abbas and Segalovitz announced a joint run, and Segalovitz was placed second on the Ra’am list."
          ar: "أعلن يوآف سيغالوفيتش انسحابه من يش عتيد (6 آب/أغسطس) واستقال من الكنيست؛ ودخلت ميخال سلباني-كبابيا مكانه في 11 آب/أغسطس 2026. وفي 31 آب/أغسطس أعلن منصور عباس وسيغالوفيتش ترشحًا مشتركًا، ووُضع سيغالوفيتش في الموقع الثاني في قائمة الموحدة."
          ru: "Йоав Сегалович объявил о выходе из «Еш Атид» (6 августа) и сложил депутатский мандат; 11 августа 2026 года его место заняла Михаль Сальбани-Кабабия. 31 августа Мансур Аббас и Сегалович объявили о совместном участии в выборах, и Сегалович получил второе место в списке РААМ."
          es: "Yoav Segalovitz anunció que dejaba Yesh Atid (6 de agosto) y renunció a la Knéset; Michal Salbani-Kababia ocupó su escaño el 11 de agosto de 2026. El 31 de agosto Mansour Abbas y Segalovitz anunciaron una candidatura conjunta, y Segalovitz quedó segundo en la lista de Ra’am."
          fr: "Yoav Segalovitz a annoncé qu’il quittait Yesh Atid (6 août) et a démissionné de la Knesset ; Michal Salbani-Kababia a pris son siège le 11 août 2026. Le 31 août, Mansour Abbas et Segalovitz ont annoncé une candidature commune, et Segalovitz a été placé deuxième sur la liste de Ra’am."
        sources:
          - { url: "https://www.timesofisrael.com/segalovitz-departs-yesh-atid-amid-his-reported-talks-to-join-mansour-abbass-raam/", title: "Segalovitz departs Yesh Atid amid his reported talks to join Mansour Abbas's Ra'am (2026-08-07)", publisher: "The Times of Israel" }
