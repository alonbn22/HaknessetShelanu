      he: חקירת משטרה בחשד לאונס, מעשים מגונים והדחת עדה — מכחיש את החשדות
      en: Police investigation on suspicion of rape, indecent acts and witness tampering — he denies the allegations
      ar: تحقيق للشرطة للاشتباه بالاغتصاب وأفعال مخلة وتحريض شاهدة على شهادة زور — وهو ينفي الشبهات
      ru: Полицейское расследование по подозрению в изнасиловании, непристойных действиях и склонении свидетельницы к лжесвидетельству — он отрицает подозрения
    description:
      he: ביולי 2025 נחקר מילביצקי באזהרה בלהב 433 בחשד לאונס, מעשים מגונים, הדחת עדה לעדות שקר ושיבוש הליכי משפט, בפרשה הקשורה לתקופתו כיועץ משפטי של עמותת "בני ברוך – קבלה לעם", בטרם נבחר לכנסת. לפי חשדות המשטרה, אישה שלטענת החוקרים שודלה למסור עדות שקר מסרה כי מילביצקי אנס אותה בבית מלון. מילביצקי הכחיש את כל החשדות, טען כי מדובר ב"רדיפה פוליטית" ודרש לסגור את התיק; נכון לאמצע 2026 החקירה הסתיימה אך טרם התקבלה החלטה של הפרקליטות, לא הוגש כתב אישום, המתלוננת אינה משתפת פעולה עם החוקרים ובדיווחים צוינו קשיים ראייתיים בתיק.
      en: In July 2025, Milwidsky was questioned under caution by the Lahav 433 police unit on suspicion of rape, indecent acts, suborning false testimony and obstruction of justice, in a case relating to his pre-Knesset role as legal adviser to the Bnei Baruch – Kabbalah La'Am association. According to the police suspicions, a woman whom investigators say he coached to give false testimony told them that Milwidsky raped her in a hotel. Milwidsky has denied all the allegations, calling the investigation "political persecution" and demanding the case be closed. As of mid-2026 questioning has concluded but the state prosecution has not announced a decision and no indictment has been filed; the complainant is not cooperating with investigators and reports cite significant evidentiary difficulties in the case.
