      en: "Eligible voters for the 26th Knesset per the final voter roll (as of 6 Sep 2026) — 547,749 more than in the 25th-Knesset election (6,788,804 in 2022)."
      ar: "أصحاب حق الاقتراع للكنيست الـ26 وفق سجل الناخبين النهائي (حتى 6 أيلول/سبتمبر 2026) — بزيادة 547,749 عن انتخابات الكنيست الـ25 (6,788,804 في 2022)."
      ru: "Избиратели, имеющие право голоса на выборах в Кнессет 26-го созыва, по окончательному списку избирателей (на 6 сентября 2026 года) — на 547 749 больше, чем на выборах в Кнессет 25-го созыва (6 788 804 в 2022 году)."
      es: "Personas con derecho a voto para la 26.ª Knéset según el censo definitivo (a 6 de septiembre de 2026) — 547 749 más que en las elecciones a la 25.ª Knéset (6 788 804 en 2022)."
      fr: "Électeurs inscrits pour la 26e Knesset selon la liste électorale définitive (au 6 septembre 2026) — 547 749 de plus qu’aux élections de la 25e Knesset (6 788 804 en 2022)."
