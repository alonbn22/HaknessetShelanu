      en: "Served as Russian-language interpreter and adviser to Israeli prime ministers in talks with Russia's president"
    description:
      he: "אלקין, יליד חרקוב שבברית המועצות, דובר רוסית שפת אם. שימש מתורגמן ויועץ לראשי הממשלה בנימין נתניהו ונפתלי בנט בפגישותיהם עם נשיא רוסיה ולדימיר פוטין."
      en: "Elkin, who was born in Kharkiv in the Soviet Union and is a native Russian speaker, served as an interpreter and adviser to Prime Ministers Benjamin Netanyahu and Naftali Bennett in their meetings with Russian President Vladimir Putin."
