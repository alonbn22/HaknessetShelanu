      he: סגן ראש עיריית פתח תקווה, חבר הכנסת ה-25 וסגן יו"ר הכנסת
      en: Deputy Mayor of Petah Tikva, Member of the 25th Knesset and Deputy Knesset Speaker
      ar: نائب رئيس بلدية بيتح تكفا وعضو الكنيست الـ25 ونائب رئيس الكنيست
      ru: Заместитель мэра Петах-Тиквы, депутат Кнессета 25-го созыва и заместитель спикера Кнессета
    description:
      he: מילביצקי, עורך דין בהשכלתו, נבחר ב-2013 למועצת עיריית פתח תקווה ומ-2018 כיהן כסגן ראש העירייה. בנובמבר 2022 נכנס לכנסת ה-25 מטעם הליכוד, וכיהן בה כסגן יושב ראש הכנסת וכחבר בוועדות הכספים, הפנים והחוקה, חוק ומשפט.
      en: Milwidsky, a lawyer by training, was elected to the Petah Tikva city council in 2013 and served as deputy mayor from 2018. In November 2022 he entered the 25th Knesset for the Likud party, serving as a Deputy Speaker of the Knesset and as a member of the Finance, Interior, and Constitution, Law and Justice committees.
