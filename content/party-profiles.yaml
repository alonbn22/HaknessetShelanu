profiles:
  - id: 1096 # Likud
    verified: "2026-09-19"
    updates:
      - date: "2025-03-13"
        text:
          he: "סיעות הליכוד והימין הממלכתי (תקווה חדשה) חתמו על הסכם פוליטי הכולל מיזוג עתידי וריצה ברשימה משותפת מטעם הליכוד בבחירות הבאות; במרכז הליכוד אושר ההסכם ב-13 באוגוסט 2025."
          en: "The Likud and National Right (New Hope) factions signed a political agreement providing for a future merger and a joint Likud list at the next election; the Likud Central Committee approved the agreement on 13 August 2025."
          ar: "وقّعت كتلتا الليكود و«اليمين الرسمي» (أمل جديد) اتفاقًا سياسيًا يشمل اندماجًا مستقبليًا والترشح في قائمة مشتركة باسم الليكود في الانتخابات المقبلة؛ وصادقت اللجنة المركزية لليكود على الاتفاق في 13 آب/أغسطس 2025."
          ru: "Фракции Ликуда и «Государственных правых» («Новая надежда») подписали политическое соглашение о будущем слиянии и совместном участии в следующих выборах в списке Ликуда; ЦК Ликуда утвердил соглашение 13 августа 2025 года."
          es: "El Likud y la facción Nueva Esperanza – Derecha Nacional de Gideon Sa’ar firmaron un acuerdo que preveía una futura fusión y una lista conjunta del Likud en las próximas elecciones; el Comité Central del Likud aprobó el acuerdo el 13 de agosto de 2025."
          fr: "Les factions du Likoud et de Nouvel Espoir – Droite étatique de Gideon Sa’ar ont signé un accord prévoyant une fusion future et une liste commune du Likoud aux prochaines élections ; le Comité central du Likoud a approuvé l’accord le 13 août 2025."
