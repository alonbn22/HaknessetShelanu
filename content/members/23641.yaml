      he: 'ב-5 בספטמבר 2026 החליטה הנהגת דגל התורה להדיח את משה גפני ואורי מקלב מהרשימה לכנסת ולמנות את אשר ליושב ראש הסיעה במקומו של גפני. ברשימת יהדות התורה שהוגשה ב-8 בספטמבר 2026 אשר מוצב במקום הראשון. עם הגשת הרשימה אמר: "אנו יוצאים היום לדרך חדשה בברכת רבותינו, זו שליחות גדולה ואחריות כבדה".'
      en: 'On 5 September 2026 the Degel HaTorah leadership decided to drop Moshe Gafni and Uri Maklev from the Knesset list and to appoint Asher as faction chairman in Gafni''s place. On the United Torah Judaism list submitted on 8 September 2026, Asher is in first place. On submitting the list he said: "We set out today on a new path with the blessing of our rabbis; this is a great mission and a heavy responsibility".'
