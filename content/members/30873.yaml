    description:
      he: "ברשימת ש\"ס לכנסת ה-26, שאישרה מועצת חכמי התורה ב-8 בספטמבר 2026 והוגשה לוועדת הבחירות המרכזית, הוצב מלול במקום ה-12, אחרי יוסף אלנתנוב ולפני סימון מושיאשוילי."
      en: "On the Shas list for the 26th Knesset, approved by the Council of Torah Sages on 8 September 2026 and submitted to the Central Elections Committee, Malul was placed 12th, after Yosef Elnatanov and ahead of Simon Moshiashvili."
