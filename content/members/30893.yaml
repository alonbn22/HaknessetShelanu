    title:
      he: חבר הכנסת הדרוזי היחיד בקואליציה של נתניהו
      en: Only Druze MK in Netanyahu's governing coalition
    description:
      he: >-
        עפיף עבד, פוליטיקאי דרוזי מהליכוד, נכנס לכנסת ה-25 ב-5 בינואר 2025 במסגרת
        החוק הנורווגי במקומו של יואב גלנט שהתפטר. כלי תקשורת מובילים תיארו אותו
        כחבר הכנסת הדרוזי היחיד בקואליציה של ראש הממשלה בנימין נתניהו.
      en: >-
        Afif (Afef) Abed, a Druze politician from Likud, entered the 25th Knesset
        on 5 January 2025 under the Norwegian Law in place of Yoav Gallant, who
        had resigned. Leading outlets described him as the only Druze member of
        Prime Minister Benjamin Netanyahu's governing coalition.
    date: "2025-01-05"
    sources:
