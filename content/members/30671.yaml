    title:
      he: נחקר בחשד למעורבות בהשתקת תלונות נגד אביו
      en: Under investigation over alleged role in silencing complaints against his father
    description:
      he: על פי דיווחי "הארץ", טסלר נחקר בחשד למעורבות בהסכם להשתקת מתלוננים שטענו כי אביו, הרב אפרים טסלר, תקף אותם מינית בעת שעמד בראש ישיבה בירושלים. ב-18 באוגוסט 2024 הורה פרקליט המדינה עמית איסמן על חידוש החקירה, לאחר שהמשטרה המליצה שלא לחקור אותו בחשד לשיבוש הליכים. טסלר הכחיש וטען כי "לדברים אין שחר". נכון לספטמבר 2026 לא פורסם על הגשת כתב אישום או על החלטה בתיק, ההליך פתוח וחלה חזקת החפות.
      en: According to reporting by Haaretz, Tessler is under investigation over alleged involvement in an agreement to silence complainants who said his father, Rabbi Efraim Tessler, sexually assaulted them while heading a Jerusalem yeshiva. On 18 August 2024, State Prosecutor Amit Aisman ordered the investigation reopened after police had recommended against investigating him for obstruction. Tessler denied the allegations, saying they "have no basis." As of September 2026 no indictment or decision in the case has been reported; the proceeding is open and the presumption of innocence applies.
    sources:
