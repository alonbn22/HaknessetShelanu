    title:
      he: הוצב במקום השלישי ברשימת עוצמה יהודית לכנסת ה-26, לאחר שפינה את המקום השני לטלי גוטליב
      en: Placed third on the Otzma Yehudit list for the 26th Knesset, after ceding second place to Tali Gotliv
    description:
      he: ב-4 בספטמבר 2026 הודיע יו"ר עוצמה יהודית איתמר בן גביר במסיבת עיתונאים כי ח"כ טלי גוטליב, שעברה מהליכוד למפלגה, תוצב במקום השני ברשימה לבחירות 27 באוקטובר 2026, וכי השר וסרלאוף ויתר על המקום השני ויוצב במקום השלישי.
      en: On 4 September 2026 Otzma Yehudit chairman Itamar Ben Gvir announced at a press conference that MK Tali Gotliv, who moved to the party from Likud, would be placed second on the list for the 27 October 2026 election, and that Minister Wasserlauf had given up the second spot and would be placed third.
