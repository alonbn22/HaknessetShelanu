    title:
      he: נחקר באזהרה בחשד למעורבות בפריצה לבסיס שדה תימן ביולי 2024
      en: Questioned under caution on suspicion of involvement in the July 2024 break-in at the Sde Teiman base
    description:
      he: ב-29 ביולי 2024 פרצו מפגינים וכמה חברי כנסת לבסיס שדה תימן, לאחר מעצרם של
        חיילי מילואים בחשד להתעללות בעצור מעזה; סוכות תועד נדחק דרך שערי הבסיס
        למרות ניסיונות צה"ל לחסום את כניסתו. באוקטובר 2025 זומן לחקירה, וב-11
        בנובמבר 2025 נחקר באזהרה בידי מחלקת ההונאה של משטרת מחוז דרום. לפי דיווח
        ממרץ 2026 החקירה טרם הושלמה ולא הוגש כתב אישום נגד איש מהמעורבים. סוכות
        כינה את החקירה הסחת דעת פוליטית, אמר כי הגיע לשדה תימן כדי להגן על
        החיילים וכי לא היה עושה זאת לו ידע שאזרחים ייכנסו לבסיס, וטען כי לחברי
        כנסת זכות להיכנס למתקנים צבאיים לצורכי פיקוח.
      en: On 29 July 2024 protesters and several MKs broke into the Sde Teiman base
        after reservists were arrested on suspicion of abusing a Gazan detainee;
        Sukkot was filmed pushing through the base's gates despite IDF attempts
        to block him. He was summoned in October 2025 and on 11 November 2025 was
        questioned under caution by the Southern District police fraud unit. As of
        a March 2026 report the investigation had not been completed and no one
        involved had been indicted. Sukkot called the probe a political
        distraction, said "I came to Sde Teiman to defend our soldiers" and that
        he "would not have done so had I known civilians would enter the base",
        and argued that MKs have the right to enter military facilities for
        oversight.
    sources:
