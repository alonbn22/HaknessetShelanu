      he: שרדה פיגוע ירי שבו נרצח בעלה (2003)
      en: Survived a 2003 terror attack in which her husband was killed
    description:
      he: ב-28 באוגוסט 2003, בהיותה בחודש השביעי להריונה, נפצעה לימור הר מלך באורח
        אנוש בפיגוע ירי בשומרון שבו נרצח בעלה הראשון, שלום (שולי) הר מלך; בתה
        נולדה בלידת חירום בניתוח קיסרי שעות לאחר מכן.
      en: On 28 August 2003, while seven months pregnant, Limor Har-Melech was
        critically wounded in a shooting attack in Samaria in which her first
        husband, Shalom (Shuli) Har-Melech, was killed; her daughter was
        delivered by emergency caesarean section hours later.
