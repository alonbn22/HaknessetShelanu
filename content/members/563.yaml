    title:
      he: קריירה פרלמנטרית ארוכה ותפקידי שר וסגן שר
      en: Long parliamentary career and ministerial offices
    description:
      he: מאיר פרוש מכהן כחבר הכנסת מטעם סיעת אגודת ישראל (יהדות התורה) במספר קדנציות
        מאז 1996. במהלך השנים שימש בתפקידים בכירים, ובהם סגן שר השיכון, סגן שר
        החינוך, ושר ירושלים ומסורת ישראל בממשלה ה-37 (מ-23 בינואר 2023 עד 17 ביולי
        2025, אז חזר לכהן כחבר כנסת מן המניין).
      en: Meir Porush has served as a member of the Knesset for the Agudat Yisrael
        faction of United Torah Judaism across several terms since 1996. Over
        the years he has held senior posts, including Deputy Minister of
        Housing, Deputy Minister of Education, and Minister of Jerusalem Affairs
        and Jewish Tradition in the 37th government (from 23 January 2023 until
        17 July 2025, when he returned to serve as a regular Knesset member).
