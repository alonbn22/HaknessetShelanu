    title:
      he: "הצעת חוק לפיזור הכנסת מטעמה אושרה בקריאה טרומית"
      en: "Her bill to dissolve the Knesset passed a preliminary reading"
    description:
      he: "ב-20 במאי 2026 אישרה מליאת הכנסת בקריאה טרומית, ברוב של 53 ללא מתנגדים, הצעת חוק אופוזיציונית לפיזור הכנסת שיזמו תמנו-שטה, יו\"ר המפלגה בני גנץ וחברי כנסת נוספים. לפי ההצעה, הבחירות ייערכו 90 יום לאחר אישור החוק."
      en: "On 20 May 2026 the Knesset plenum approved, in a preliminary reading by 53 votes to none, an opposition bill to dissolve the Knesset sponsored by Tamano-Shata, party chair Benny Gantz and other MKs. Under the bill, elections would be held 90 days after the law's passage."
    sources:
      - url: "https://www.timesofisrael.com/liveblog_entry/lawmakers-also-advance-opposition-bill-to-disperse-knesset/"
        title: "Lawmakers also advance opposition bill to disperse Knesset"
        publisher: "The Times of Israel"
