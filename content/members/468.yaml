    title:
      he: 'ביקורת היועצת המשפטית לממשלה על עיכוב חתימתו על תעודת חיסיון בפרשת גוטליב'
      en: Attorney General criticized his delay in signing a confidentiality certificate in the Gotliv case
    description:
      he: 'לפי הדיווחים, היועצת המשפטית לממשלה גלי בהרב-מיארה כתבה לכץ באוקטובר 2025 ושוב במרץ 2026 כי אי-חתימתו במשך חודשים על תעודת חיסיון שנדרשה להגשת כתב אישום נגד ח"כ טלי גוטליב (הליכוד), החשודה בחשיפת זהותו של איש שב"כ, "מעוררת חשש כבד לשימוש לרעה בסמכותך במטרה להיטיב עם חברת מפלגתך". ב-7 במאי 2026 חתם כץ על התעודה, לאחר שהשב"כ הודיע כי טעמי ביטחון מחייבים זאת; בדיווחים שצוטטו כאן לא הובאה תגובה מלשכת השר לביקורת.'
      en: 'According to reports, Attorney General Gali Baharav-Miara wrote to Katz in October 2025 and again in March 2026 that his months-long failure to sign a confidentiality certificate needed to indict MK Tally Gotliv (Likud), suspected of exposing the identity of a Shin Bet officer, "raises serious concern of abusing your authority in order to benefit your party colleague". On 7 May 2026 Katz signed the certificate after the Shin Bet stated that security reasons required it; the reports cited here carried no response from the minister''s office to the criticism.'
    sources:
