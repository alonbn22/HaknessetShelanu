    title:
      he: רקע מקצועי בעבודה סוציאלית ובמנהיגות קהילתית
      en: Career in social work and community leadership
    description:
      he: לפני כניסתה לפוליטיקה עבדה ח'טיב יאסין כעובדת סוציאלית וניהלה מרכז קהילתי
        ביפיע שבגליל התחתון. היא בעלת תואר ראשון בעבודה סוציאלית מאוניברסיטת
        חיפה ותואר שני בלימודי נשים מאוניברסיטת תל אביב, ובוגרת מכללת מנדל
        למנהיגות.
      en: Before entering politics, Khatib-Yassin worked as a social worker and
        directed a community centre in Yafa an-Naseriyye in the Lower Galilee.
        She holds a bachelor's degree in social work from the University of
        Haifa, a master's degree in women's studies from Tel Aviv University,
        and is a graduate of the Mandel College for Leadership.
