  - kind: negative
    category: controversy
    title:
      he: "היועצת המשפטית לכנסת מתחה ביקורת על הליך החקיקה בוועדה שבראשותה וקראה להעביר את הדיונים לוועדת הכלכלה"
      en: "The Knesset legal adviser criticised the legislative process in her committee and urged moving the bill to the Economic Affairs Committee"
    description:
      he: "ב-15 באפריל 2026 קבעה היועצת המשפטית לכנסת, שגית אפיק, כי בדיוני הוועדה המיוחדת לחוק התקשורת \"אף התנאים הבסיסיים של הליך חקיקה תקין אינם מתקיימים\", וקראה להעביר את הדיונים לוועדת הכלכלה. דיסטל אטבריאן דחתה את ההמלצה: \"המלצת היועצת המשפטית אינה מקובלת עליי, אמשיך להוביל את הוועדה\", וטענה כי הייעוץ המשפטי מעכב את הדיונים משום שדחתה את המלצותיו."
      en: "On 15 April 2026 the Knesset's legal adviser, Sagit Afik, said that in the special committee's deliberations on the communications bill \"even the basic conditions of a proper legislative process are not being met\", and urged that the bill be moved to the Economic Affairs Committee. Distel Atbaryan rejected the recommendation: \"The legal adviser's recommendation is not acceptable to me. I will continue to lead this committee\", and accused the legal staff of obstructing the proceedings because she had rejected their advice."
    date: "2026-04-15"
