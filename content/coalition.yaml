  1095:
    status: coalition
    since: "2022-12-29"
    note:
      he: "שרי ש\"ס התפטרו מהממשלה ב-16–17 ביולי 2025 בעקבות אי-חקיקת חוק הגיוס; המפלגה הודיעה שהיא נשארת בקואליציה."
      en: "Shas ministers resigned from the government on 16–17 July 2025 over the draft law; the party announced it remains in the coalition."
      es: "Los ministros de Shas dimitieron del Gobierno el 16 y 17 de julio de 2025 por la ley del servicio militar; el partido anunció que sigue en la coalición."
      fr: "Les ministres de Shas ont démissionné du gouvernement les 16 et 17 juillet 2025 à cause de la loi sur la conscription ; le parti a annoncé rester dans la coalition."
    sources:
      - { url: "https://www.jpost.com/israel-news/article-861246", title: "Shas spiritual leaders order party members to quit government (16 Jul 2025)", publisher: "The Jerusalem Post" }
      - { url: "https://www.timesofisrael.com/haredi-factions-back-dissolving-knesset-increasing-chance-for-early-elections/", title: "Haredi factions push to dissolve Knesset… (12 May 2026): Shas “has continued to support the coalition in the Knesset”", publisher: "The Times of Israel" }
  1105:
    status: coalition
    since: "2022-12-29"
    sources:
      - { url: "https://main.knesset.gov.il/mk/government/pages/governments.aspx?govId=37", title: "הממשלה ה-37 — הרכב הממשלה הנוכחי", publisher: "הכנסת" }
  1106:
    status: coalition
    since: "2025-03-20"
    note:
      he: "עוצמה יהודית פרשה מהממשלה ב-19–21 בינואר 2025 בעקבות עסקת החטופים והפסקת האש, ושבה אליה ב-19–20 במרץ 2025."
      en: "Otzma Yehudit left the government on 19–21 January 2025 over the hostage deal and ceasefire, and returned on 19–20 March 2025."
      es: "Otzma Yehudit dejó el Gobierno el 19–21 de enero de 2025 por el acuerdo de rehenes y el alto el fuego, y regresó el 19–20 de marzo de 2025."
      fr: "Otzma Yehoudit a quitté le gouvernement les 19–21 janvier 2025 à cause de l’accord sur les otages et du cessez-le-feu, et y est revenu les 19–20 mars 2025."
    sources:
      - { url: "https://www.timesofisrael.com/with-otzma-yehudit-out-of-government-netanyahu-set-to-appoint-replacement-ministers/", title: "With Otzma Yehudit out of government, Netanyahu set to appoint replacement ministers (19 Jan 2025)", publisher: "The Times of Israel" }
      - { url: "https://www.timesofisrael.com/ben-gvir-reappointed-police-minister-as-knesset-okays-his-partys-return-to-government/", title: "Ben Gvir reappointed police minister as Knesset okays his party’s return to government (20 Mar 2025)", publisher: "The Times of Israel" }
  1108:
    status: coalition
    since: "2024-09-30"
    note:
      he: "הימין הממלכתי (תקווה חדשה) הצטרף לממשלה ב-30 בספטמבר 2024, לאחר שפרש ממנה עם המחנה הממלכתי ביוני 2024."
      en: "New Hope (הימין הממלכתי) joined the government on 30 September 2024, after leaving it with National Unity in June 2024."
      es: "Nueva Esperanza (הימין הממלכתי) se unió al Gobierno el 30 de septiembre de 2024, tras haberlo dejado con Unidad Nacional en junio de 2024."
      fr: "Nouvel Espoir (הימין הממלכתי) a rejoint le gouvernement le 30 septembre 2024, après l’avoir quitté avec Unité nationale en juin 2024."
    sources:
      - { url: "https://www.timesofisrael.com/as-he-officially-rejoins-government-saar-blasts-opposition-for-living-in-oct-6/", title: "As he officially rejoins government, Sa’ar blasts opposition for ‘living in Oct. 6’ (30 Sep 2024)", publisher: "The Times of Israel" }
  1101:
    status: opposition
    since: "2025-07-14"
    note:
      he: "דגל התורה ואגודת ישראל הודיעו ב-14 ביולי 2025 על פרישה מהממשלה ומהקואליציה בשל אי-חקיקת חוק הגיוס; נכון למאי 2026 הסיעה עדיין מחוץ לקואליציה. חבריה נספרים בסקרים עם גוש נתניהו — אך מעמדה בכנסת הוא אופוזיציה. ב-19 בינואר 2026 מונה ישראל אייכלר (אגודת ישראל) לסגן שר התקשורת במסגרת חילופי מושבים לפי החוק הנורווגי, שאפשרו ליצחק פינדרוס (דגל התורה) לשוב לכנסת; המינוי לא דווח כחזרה של הסיעה לקואליציה."
      en: "Degel HaTorah and Agudat Yisrael announced on 14 July 2025 that they were leaving the government and the coalition over the draft law; as of May 2026 the faction was still outside the coalition. Pollsters count it with the Netanyahu bloc, but its Knesset status is opposition. On 19 January 2026 Yisrael Eichler (Agudat Yisrael) was appointed deputy communications minister in a Norwegian-law seat swap that let Yitzhak Pindrus (Degel HaTorah) return to the Knesset; the appointment was not reported as the faction rejoining the coalition."
      es: "Degel HaTorá y Agudat Yisrael anunciaron el 14 de julio de 2025 que dejaban el Gobierno y la coalición por la ley del servicio militar; en mayo de 2026 la facción seguía fuera de la coalición. Los encuestadores la cuentan con el bloque de Netanyahu, pero su estatus en la Knéset es de oposición. El 19 de enero de 2026 Yisrael Eichler (Agudat Yisrael) fue nombrado viceministro de Comunicaciones en un intercambio de escaños según la Ley Noruega que permitió a Yitzhak Pindrus (Degel HaTorá) volver a la Knéset; el nombramiento no se informó como un regreso de la facción a la coalición."
      fr: "Degel HaTorah et Agoudat Israël ont annoncé le 14 juillet 2025 quitter le gouvernement et la coalition à cause de la loi sur la conscription ; en mai 2026, la faction était toujours hors de la coalition. Les sondeurs la comptent avec le bloc Netanyahou, mais son statut à la Knesset est celui de l’opposition. Le 19 janvier 2026, Yisrael Eichler (Agoudat Israël) a été nommé vice-ministre des Communications dans un échange de sièges selon la « loi norvégienne » qui a permis à Yitzhak Pindrus (Degel HaTorah) de revenir à la Knesset ; cette nomination n’a pas été présentée comme un retour de la faction dans la coalition."
    sources:
      - { url: "https://www.ynetnews.com/article/hki11u1mlgx", title: "Degel HaTorah faction says leaving government over draft exemption law (14 Jul 2025)", publisher: "Ynetnews" }
      - { url: "https://www.timesofisrael.com/haredi-factions-back-dissolving-knesset-increasing-chance-for-early-elections/", title: "Haredi factions push to dissolve Knesset… (12 May 2026): UTJ “formally pulled out of the government and the coalition last year”", publisher: "The Times of Israel" }
      - { url: "https://www.timesofisrael.com/utjs-eichler-to-be-appointed-deputy-minister-preventing-him-voting-against-draft-bill/", title: "UTJ’s Eichler to be appointed deputy minister, preventing him voting against draft bill (15 Jan 2026)", publisher: "The Times of Israel" }
      - { url: "https://main.knesset.gov.il/mk/government/pages/governments.aspx?govId=37", title: "הממשלה ה-37 — הרכב הממשלה הנוכחי: סגן שר התקשורת ישראל אייכלר, 19.1.2026", publisher: "הכנסת" }
  1107:
    status: opposition
    since: "2025-07-16"
    note:
      he: "אבי מעוז פרש מהממשלה במרץ 2025, וב-16 ביולי 2025 הודיע: \"אני לא חבר בקואליציה. לפי חישובי, יש רק 60 ח\"כים בקואליציה\"."
      en: "Avi Maoz left the government in March 2025 and announced on 16 July 2025: “I am not a member of the coalition. According to my calculation, there are only 60 MKs in the coalition.”"
      es: "Avi Maoz dejó el Gobierno en marzo de 2025 y anunció el 16 de julio de 2025: «No soy miembro de la coalición. Según mis cálculos, solo hay 60 diputados en la coalición»."
      fr: "Avi Maoz a quitté le gouvernement en mars 2025 et a annoncé le 16 juillet 2025 : « Je ne suis pas membre de la coalition. D’après mon calcul, il n’y a que 60 députés dans la coalition. »"
    sources:
      - { url: "https://www.timesofisrael.com/far-right-lawmaker-avi-maoz-quits-coalition-leaving-pm-with-a-minority-government/", title: "Far-right MK Avi Maoz quits coalition, leaving Netanyahu without Knesset majority (17 Jul 2025)", publisher: "The Times of Israel" }
  1102: { status: opposition, since: "2022-12-29" }
  1110:
    status: opposition
    since: "2024-06-09"
    note:
      he: "כמחנה הממלכתי הייתה בממשלת החירום מ-11 באוקטובר 2023 עד 9 ביוני 2024, אז פרשה ממנה. הסיעה כחול לבן - המחנה הממלכתי נוצרה ב-8 ביולי 2025 מפיצול המחנה הממלכתי."
      en: "As National Unity it sat in the emergency government from 11 October 2023 until 9 June 2024, when it left. The Blue and White–National Unity faction was formed on 8 July 2025 when National Unity split."
      es: "Como Unidad Nacional formó parte del gobierno de emergencia desde el 11 de octubre de 2023 hasta el 9 de junio de 2024, cuando lo abandonó. La facción Azul y Blanco–Unidad Nacional se formó el 8 de julio de 2025 al dividirse Unidad Nacional."
      fr: "En tant qu’Unité nationale, il a siégé dans le gouvernement d’urgence du 11 octobre 2023 au 9 juin 2024, date de son départ. La faction Bleu et Blanc–Unité nationale a été formée le 8 juillet 2025 lors de la scission d’Unité nationale."
    sources:
