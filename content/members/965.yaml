      en: Heads the Likud list for the 26th Knesset after the party primary
    description:
      he: בפריימריז הליכוד שנערכו ב-17 באוגוסט 2026 (כ-76 אלף מצביעים, 53% הצבעה) הוצב נתניהו אוטומטית בראש הרשימה כיו"ר המפלגה; אלי כהן, אמיר אוחנה ויריב לוין דורגו אחריו. נתניהו אמר כי הוא "מרוצה מאוד" מהתוצאות.
      en: In the Likud primary held on 17 August 2026 (about 76,000 voters, 53% turnout) Netanyahu was placed automatically at the top of the list as party chairman; Eli Cohen, Amir Ohana and Yariv Levin followed. Netanyahu said he was "very pleased" with the results.
