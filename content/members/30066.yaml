    title:
      he: יושב ראש ועדת המדע והטכנולוגיה של הכנסת ה-25
      en: Chair of the Knesset Science and Technology Committee in the 25th Knesset
    description:
      he: בכנסת ה-25 מכהן עודה כיושב ראש ועדת המדע והטכנולוגיה — אחת הוועדות שהוקצו לאופוזיציה — כפי שמתועד בפרוטוקולי הוועדה (למשל ישיבת מעקב על מצב לימודי מדעי הרוח, 17 ביולי 2023).
      en: In the 25th Knesset Odeh chairs the Science and Technology Committee — one of the committees allotted to the opposition — as recorded in the committee's protocols (for example a follow-up session on the state of humanities studies, 17 July 2023).
