    date: "2026-10-06"
    label: { he: "משלוח הודעה לבוחר", en: "Voter notices are sent", ar: "إرسال بطاقات الإعلام للناخبين", ru: "Рассылка уведомлений избирателям", es: "Envío de los avisos a los votantes", fr: "Envoi des avis aux électeurs" }
    detail:
      he: "ועדת הבחירות שולחת לכל בוחר הודעה עם מקום הקלפי שלו (סעיף 55ב לחוק הבחירות)."
      en: "The Elections Committee sends every voter a notice with their polling station (section 55B of the Elections Law)."
      ar: "ترسل لجنة الانتخابات إلى كل ناخب بطاقة إعلام بمكان صندوق الاقتراع الخاص به (المادة 55ب من قانون الانتخابات)."
      ru: "Избирательная комиссия отправляет каждому избирателю уведомление с его избирательным участком (статья 55Б Закона о выборах)."
      es: "La Comisión Electoral envía a cada votante un aviso con su centro de votación (artículo 55B de la Ley Electoral)."
      fr: "La Commission électorale envoie à chaque électeur un avis indiquant son bureau de vote (article 55B de la loi électorale)."
    status: confirmed
    sources:
