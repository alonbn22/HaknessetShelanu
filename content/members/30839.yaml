    title:
      he: התפטר מהכנסת לאחר שהצטרף לישראל ביתנו; הוחלף על ידי שבתאי קטש
      en: Resigned from the Knesset after joining Yisrael Beytenu; replaced by Shabtai Katash
    description:
      he: ב-11 באוגוסט 2026 הגיש אילוז את התפטרותו מהכנסת לאחר שהודיע על הצטרפותו
        לישראל ביתנו בראשות אביגדור ליברמן; ההתפטרות נכנסה לתוקף ב-13 באוגוסט
        2026 ובמקומו נכנס לכנסת שבתאי קטש, הבא ברשימת הליכוד. אילוז אמר כי
        נתניהו נכשל ולא לקח אחריות וכי עליו ללכת הביתה. הוא אינו מכהן עוד
        כחבר הכנסת.
      en: On 11 August 2026 Illouz submitted his resignation from the Knesset after
        announcing he had joined Avigdor Liberman's Yisrael Beytenu; the
        resignation took effect on 13 August 2026 and Shabtai Katash, next on
        the Likud list, entered the Knesset in his place. Illouz said that
        "Netanyahu failed and did not take responsibility. He must go home". He
        no longer serves as a Member of Knesset.
