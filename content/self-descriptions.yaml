      source: { url: "https://www.gov.il/he/pages/yahadut-degel_list37", title: "יהדות התורה והשבת אגודת ישראל - דגל התורה — רשימת המועמדים", publisher: "ועדת הבחירות המרכזית לכנסת" }

  rz-zehut:
