    status: convicted
    title:
      he: "הורשע בעבירה פלילית במסגרת הסדר טיעון"
      en: "Convicted of a criminal offense under a plea bargain"
    description:
      he: "ב-27 בדצמבר 2021 הורשע חיים כץ, במסגרת הסדר טיעון, בעבירה של קשירת קשר להשגת מטרה כשרה באמצעים פסולים, בקשר לשימוש בסמכותו כיושב ראש ועדת העבודה והרווחה של הכנסת. כתב האישום המקורי (אוגוסט 2019) כלל עבירות של מרמה והפרת אמונים, וכץ התפטר מתפקידו כשר הרווחה באוגוסט 2019 לאחר שהיועץ המשפטי לממשלה הודיע על כוונתו להעמידו לדין. במסגרת ההסדר ביקשו הצדדים מאסר על תנאי וקנס, ובג\"ץ דחה עתירה להטיל על העבירה קלון."
      en: "On 27 December 2021, Haim Katz was convicted, under a plea bargain, of conspiracy to achieve a goal that was in itself legal but by improper means, in connection with the use of his authority as chairman of the Knesset Labor and Welfare Committee. The original indictment (August 2019) had included fraud and breach of trust, and Katz resigned as Welfare Minister in August 2019 after the Attorney General announced his intention to indict him. Under the plea deal both sides asked for a suspended sentence and a fine, and the High Court rejected a petition to attach moral turpitude to the offense."
    date: "2021-12-27"
