    title:
      he: עולה מאתיופיה וקצין בכיר בצנחנים שנבחר לכנסת ה-25
      en: Ethiopian-born immigrant and senior IDF paratrooper officer elected to the
        25th Knesset
    description:
      he: משה סולומון נולד ב-1975 בעיר שירה שבאזור תיגראי באתיופיה, ועלה לישראל כילד
        לאחר מסע רגלי ארוך מאתיופיה לסודאן. הוא שירת בחטיבת הצנחנים של צה"ל
        ומחזיק בדרגת סגן-אלוף (מיל'). סולומון נבחר לכנסת ה-25 ברשימת הציונות
        הדתית לאחר בחירות נובמבר 2022.
      en: Moshe Solomon was born in 1975 in Shire, in Ethiopia's Tigray region, and
        immigrated to Israel as a child after a long overland journey from
        Ethiopia to Sudan. He served in the IDF Paratroopers Brigade and holds
        the reserve rank of lieutenant colonel (sgan aluf). Solomon was elected
        to the 25th Knesset on the Religious Zionism list following the November
        2022 election.
    date: 2022-11-15
