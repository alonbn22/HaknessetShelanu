          ru: "Аббас на съезде РААМ (22.08.2026): независимое палестинское государство — «реальность, которую признаёт большая часть мира»; «Мы хотим, чтобы его признали, и будем добиваться мира, сближения и прекращения оккупации и конфликта»."
