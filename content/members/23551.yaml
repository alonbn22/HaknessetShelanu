    date: "2024-05-01"
    title:
      he: "ביקורת ציבורית על התבטאויותיה בנושא החטופים (2024–2025)"
      en: "Public criticism over her statements on the hostages (2024–2025)"
    description:
      he: "ב-1 במאי 2024 דווח כי סטרוק אמרה על עסקת חטופים שנדונה אז כי החיילים יצאו להילחם למען מטרות שהממשלה הגדירה \"ואנחנו זורקים את זה לפח כדי להציל 22 אנשים או 33\"; יו\"ר האופוזיציה יאיר לפיד, השר חילי טרופר ומשפחות חטופים מתחו עליה ביקורת חריפה. בפברואר 2025 אמרה בריאיון כי ניצחון במלחמה חשוב יותר מהשבת כל החטופים, וביולי 2025 דווח כי אמרה שלא ניתן לנצח כל עוד צה\"ל נמנע מלסכן את חיי החטופים; מטה משפחות החטופים גינה את הדברים. על פי הדיווחים, סטרוק לא חזרה בה מדבריה."
      en: "On 1 May 2024 Strock was reported as saying of a hostage deal then under negotiation that soldiers had gone to fight for goals the government defined \"and we throw it in the trash to save 22 people or 33\"; Opposition Leader Yair Lapid, Minister Hili Tropper and hostages' families sharply criticized her. In February 2025 she said in an interview that winning the war was more important than returning every hostage, and in July 2025 she was reported as saying that victory was impossible as long as the IDF refrained from risking the hostages' lives; the Hostages Families Forum condemned the remarks. According to the reports, Strock did not retract her statements."
