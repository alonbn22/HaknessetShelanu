    title:
      he: השעיה על ידי ועדת האתיקה של הכנסת (נובמבר 2023)
      en: Suspended by the Knesset Ethics Committee (November 2023)
    description:
      he: בנובמבר 2023 השעתה ועדת האתיקה של הכנסת את חברת הכנסת עאידה תומא-סלימאן למשך
        חודשיים מהשתתפות במליאה ובוועדות, והטילה עליה ניכוי שכר של שבועיים,
        בעקבות פרסום שבו האשימה את צה"ל בביצוע "פשע מלחמה" במהלך המלחמה ברצועת
        עזה. הוועדה ציינה כי לא חזרה בה מדבריה. מפלגתה דחתה את ההחלטה ותיארה
        אותה כפוליטית.
      en: In November 2023 the Knesset Ethics Committee suspended MK Aida Touma-Sliman
        for two months from plenum and committee sessions and imposed a two-week
        pay deduction, following a post in which she accused the IDF of
        committing a "war crime" during the war in the Gaza Strip. The committee
        said she had not retracted the statements. Her party rejected the
        decision, calling it politically motivated.
