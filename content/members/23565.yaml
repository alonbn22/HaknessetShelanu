    title:
      he: "הנהיגה את מפלגת העבודה וכיהנה כשרת התחבורה"
      en: "Led the Labor party and served as Minister of Transport"
    description:
      he: "עיתונאית ופעילה לזכויות נשים, חברת הכנסת מאז 2013. נבחרה לראשות מפלגת העבודה ב-24 בינואר 2021 והובילה אותה עד 28 במאי 2024, וכיהנה כשרת התחבורה והבטיחות בדרכים בממשלת בנט-לפיד מ-13 ביוני 2021 עד 29 בדצמבר 2022."
      en: "A journalist and women's-rights advocate, a member of the Knesset since 2013. She was elected leader of the Labor party on 24 January 2021 and led it until 28 May 2024, and served as Minister of Transport and Road Safety in the Bennett-Lapid government from 13 June 2021 to 29 December 2022."
