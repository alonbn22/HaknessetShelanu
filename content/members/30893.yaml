    title:
      he: כניסה לכנסת ה-25 כחבר כנסת מטעם הליכוד
      en: Sworn in as a Member of the 25th Knesset for Likud
    description:
      he: >-
        עבד, יליד 1974 ותושב הכפר ירכא בגליל, הושבע כחבר הכנסת ב-6 בינואר 2025
        לאחר התפטרותו של יואב גלנט. בבחירות 2022 הוצב במקום ה-44 ברשימת הליכוד,
        וממנו נכנס לכנסת ה-25.
      en: >-
        Abed, born in 1974 and a resident of the Galilee village of Yarka, was
        sworn in as a Member of the Knesset on 6 January 2025 following Yoav
        Gallant's resignation. He had been placed 44th on the Likud list in the
        2022 election, from which he entered the 25th Knesset.
    date: "2025-01-06"
