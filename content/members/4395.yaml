    date: 2026-08-17
    title:
      he: בפריימריז הליכוד לא זכה במקום ריאלי ואינו ברשימת הליכוד לכנסת ה-26
      en: Did not win a realistic slot in the Likud primary and is not on Likud's slate for the 26th Knesset
    description:
      he: בפריימריז הליכוד שנערכו ב-17 באוגוסט 2026 דורג דיכטר במקום ה-27 בהצבעה, מחוץ לטווח הריאלי. לפי ג'רוזלם פוסט, בכירים בליכוד לחצו על נתניהו להשתמש במנגנון ה"החלפה" כדי לקדם אותו למקום ריאלי בשל הרקע הביטחוני שלו. ברשימת הליכוד שהוגשה לוועדת הבחירות ב-9 בספטמבר 2026, כפי שפורסמה ב-JNS, דיכטר אינו נמנה עם 35 המקומות הראשונים.
      en: In the Likud primary held on 17 August 2026 Dichter finished 27th in the vote, outside the realistic range. According to The Jerusalem Post, senior Likud figures pressed Netanyahu to use the "swap" mechanism to move him into a realistic slot because of his security background. In the Likud slate filed with the elections committee on 9 September 2026, as published by JNS, Dichter is not among the first 35 places.
    sources:
