claims:
  - kind: positive
    category: achievement
    title:
      he: סגן ראש המחלקה לחקירות שוטרים (מח"ש)
      en: Deputy head of the Police Internal Investigations Department
    description:
      he: "לפני כניסתו לפוליטיקה עבד משה סעדה, עורך דין בהכשרתו, בשנים 1999–2022 כפרקליט במחלקה לחקירות שוטרים (מח״ש) שבמשרד המשפטים; כשבע שנים מהן כיהן כסגן ראש המחלקה, ובמשך כשנה מילא את מקום ראש המחלקה."
      en: "Before entering politics, Moshe Saada, a lawyer by training, worked from 1999 to 2022 as an attorney in the Justice Ministry's Police Internal Investigations Department (Mahash); for about seven of those years he was the department's deputy head, and for about a year he filled in for its head."
      ar: "قبل دخوله السياسة عمل موشيه سعدة، وهو محامٍ بتأهيله، بين عامَي 1999 و2022 محاميًا في قسم التحقيق مع أفراد الشرطة (ماحاش) في وزارة القضاء؛ وشغل نحو سبع سنوات منها منصب نائب رئيس القسم، وقام لمدة سنة تقريبًا بمهام رئيس القسم."
      ru: "До прихода в политику Моше Саада, юрист по образованию, в 1999–2022 годах работал адвокатом в Отделе расследований в отношении полицейских (Махаш) Министерства юстиции; около семи лет из них он был заместителем главы отдела, а около года исполнял обязанности его главы."
      es: "Antes de entrar en política, Moshe Saada, abogado de formación, trabajó de 1999 a 2022 como fiscal en el Departamento de Investigaciones Policiales Internas (Mahash) del Ministerio de Justicia; durante unos siete de esos años fue subjefe del departamento, y durante aproximadamente un año ocupó interinamente su jefatura."
      fr: "Avant d’entrer en politique, Moshe Saada, juriste de formation, a travaillé de 1999 à 2022 comme avocat au département des enquêtes sur les policiers (Mahash) du ministère de la Justice ; pendant environ sept de ces années, il en a été le chef adjoint, et pendant un an environ, il en a assuré la direction par intérim."
