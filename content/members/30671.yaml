        publisher: Wikidata
  - kind: positive
    category: achievement
    title:
      he: סגן שר התרבות והספורט
      en: Deputy Minister of Culture and Sport
    description:
      he: טסלר כיהן כסגן שר התרבות והספורט בממשלה השלושים ושבע. הוא פרש מתפקידו ומהכנסת באמצע 2025 במסגרת פרישת סיעת יהדות התורה מהקואליציה על רקע המחלוקת בעניין חוק גיוס תלמידי הישיבות.
      en: Tessler served as Deputy Minister of Culture and Sport in Israel's thirty-seventh government. He resigned from the post and from the Knesset in mid-2025 as part of United Torah Judaism's withdrawal from the coalition over the dispute on the Haredi military draft exemption legislation.
    date: 2022-12-29
    sources:
