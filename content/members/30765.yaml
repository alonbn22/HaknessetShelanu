      he: חקירת שוחד מ-2011 בפתח תקווה שנסגרה ללא כתב אישום בהיעדר ראיות מספיקות
      en: 2011 Petah Tikva bribery investigation closed without indictment for insufficient evidence
    description:
      he: בפברואר 2011, בעת כהונתו כסגן ראש עיריית פתח תקווה, נעצר בוסו לצד ראש העיר
        בחשד לשוחד הקשור לבחירות המוניציפליות של 2008, והמשטרה המליצה להעמידו
        לדין. ב-15 באוקטובר 2013 הודיעה פרקליטות המדינה על סגירת התיק נגדו, לאחר שנקבע כי אין די ראיות להוכחת אשמתו מעבר לספק סביר; בוסו לא הואשם ולא הורשע, ולא התקיים כל הליך משפטי נגדו.
      en: In February 2011, while serving as deputy mayor of Petah Tikva, Buso was
        arrested alongside the mayor on suspicion of bribery connected to the
        2008 municipal elections, and police recommended prosecution. On 15 October
        2013 the State Prosecutor's Office announced the case against him was
        closed, having found insufficient evidence to prove guilt beyond reasonable doubt; Buso was never indicted or convicted, and no court proceeding took place.
