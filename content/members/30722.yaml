    title:
      he: 'בוועדת העלייה והקליטה: כ-50 אלף יוצאי רוסיה אינם מקבלים את הפנסיה שלהם'
      en: 'At the Aliyah and Absorption Committee: some 50,000 immigrants from Russia are not receiving their pensions'
    description:
      he: 'בדיון בוועדת העלייה, הקליטה והתפוצות ב-29 ביוני 2026 אמר סובה כי למעלה מ-50 אלף יוצאי רוסיה בישראל אינם מקבלים את הפנסיה שלהם מרוסיה כבר יותר מארבע שנים בשל הסנקציות על ערוצי הבנקאות, וקרא לממשלה לתת עדיפות לפתרון הסוגיה במשא ומתן על בסיס הסכם 2016.'
      en: 'At a hearing of the Committee on Aliyah, Absorption and Diaspora on 29 June 2026, Sova said that more than 50,000 immigrants from Russia in Israel have not received their Russian pensions for over four years because of sanctions affecting banking channels, and called on the government to prioritize resolving the issue through negotiations based on the 2016 agreement.'
    sources:
