    title:
      he: הודיעה כי לא תתמודד בבחירות 2026 ותישאר חברה ביש עתיד
      en: Announced she will not run in the 2026 election but will remain in Yesh Atid
    description:
      he: ב-1 בספטמבר 2026 הודיעה מזרסקי ברשת X כי לא תתמודד בבחירות לכנסת ה-26 אך
        תישאר חברה ביש עתיד, ואמרה כי "זה הבית הפוליטי שלי" וכי היא מאמינה במנהיגותו
        של יאיר לפיד. ההודעה באה במסגרת גל פרישות של חברי כנסת מיש עתיד מהמרוץ,
        על רקע ירידה בסקרים של הרשימה המשותפת "ביחד" עם מפלגתו של נפתלי בנט.
      en: On 1 September 2026 Mazarsky announced on X that she would not compete in
        the election to the 26th Knesset but would remain a member of Yesh Atid,
        saying "this is my political home" and that she believes in Yair Lapid's
        leadership. The announcement came amid a wave of Yesh Atid MKs quitting
        the race as the joint "B'Yachad" slate with Naftali Bennett's party
        slipped in the polls.
