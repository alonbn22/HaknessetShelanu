        והקליטה בפועל, ומאז 2022 מכהן כסגן ראש הממשלה ושר המשפטים.
      en: Yariv Levin has served as a Likud member of the Knesset since 2009. He held
        the office of Speaker of the Knesset (2020-2021 and again in December
        2022), and served as Minister of Tourism, Minister of Public Security
        and acting Minister of Aliyah and Integration. Since 2022 he has served
        as Deputy Prime Minister and Minister of Justice.
