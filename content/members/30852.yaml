    description:
      he: "ב-16 ביולי 2026 הודיע סולומון כי לא יתמודד בבחירות המקדימות של הציונות הדתית, בנימוק של מחלוקות עקרוניות עם הנהגת המפלגה בסוגיות תורה, שירות צבאי ותעסוקה. \"הפוליטיקה היא כלי, לא מטרה\", אמר. ברשימת הציונות הדתית לכנסת ה-26 הוא אינו מופיע."
      en: "On 16 July 2026 Solomon announced he would not run in the Religious Zionism primary, citing fundamental disagreements with the party leadership on Torah study, military service and employment. \"Politics is a tool, not a goal,\" he said. He does not appear on the Religious Zionism list for the 26th Knesset."
