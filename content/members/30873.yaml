  - kind: positive
    category: achievement
    title:
      he: "חבר הכנסת ה-25 מטעם ש\"ס"
      en: "Member of the 25th Knesset for Shas"
    description:
      he: "ארז מלול נכנס לכנסת ה-25 ב-2 בפברואר 2023 מטעם סיעת ש\"ס במסגרת 'החוק הנורווגי', לאחר התפטרותו של השר יעקב מרגי. כהונתו הסתיימה ב-20 ביולי 2025 עם פרישת שרי ש\"ס מהממשלה ושובם לכנסת, והוא שב לכנסת ב-19 במאי 2026 כמחליפו של משה ארבל, שהתפטר."
      en: "Erez Malul entered the 25th Knesset on 2 February 2023 as a member of the Shas faction under the so-called Norwegian Law, succeeding Minister Yaakov Margi. His term ended on 20 July 2025 when Shas ministers resigned from the government and returned to the Knesset, and he re-entered the Knesset on 19 May 2026 as the replacement for Moshe Arbel, who resigned."
    date: "2023-02-02"
