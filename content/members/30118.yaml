    title:
      he: 'זומנה למסור עדות בלהב 433 בבדיקה האם הליכוד או היא הגישו תצהיר שקר לבג"ץ על הבחירות למבקר המדינה'
      en: 'Summoned to give testimony at Lahav 433 in an examination of whether Likud or she filed a false affidavit with the High Court on the State Comptroller election'
    description:
      he: 'לאחר שתצהירה של השכל לבג"ץ סתר את עמדת הליכוד, שלפיה חברי הכנסת שצילמו את הצבעתם למבקר המדינה עשו זאת מיוזמתם, הורו היועצת המשפטית לממשלה ופרקליט המדינה למשטרה לבדוק אם הליכוד או השכל הגישו תצהיר שקר לבית המשפט. ב-30 ביולי 2026 זומנה השכל למסור עדות, כעדה, ביחידת להב 433, ומסרה עדות; היא אמרה כי הגישה את התצהיר אף שהוזהרה כי הדבר חושף אותה לסנקציות. בג"ץ ביטל את תוצאות הבחירה למבקר המדינה בשל "פגם מהותי" בהליך והורה על הצבעה חוזרת. מטעם הליכוד נמסר כי גרסתה של השכל מציגה תמונה הפוכה לחלוטין.'
      en: 'After Haskel''s affidavit to the High Court contradicted Likud''s position that MKs who filmed their vote for State Comptroller did so on their own initiative, the Attorney General and the State Attorney ordered the police to examine whether Likud or Haskel had filed a false affidavit with the court. On 30 July 2026 Haskel was summoned to give testimony, as a witness, at the Lahav 433 unit, and testified; she said she had filed the affidavit despite being warned it would expose her to sanctions. The High Court annulled the State Comptroller election result over a "substantial flaw" in the procedure and ordered a new vote. Likud''s representative said Haskel''s account presented "a completely reversed picture".'
