          - { url: "https://www.timesofisrael.com/raams-abbas-former-yesh-atid-mk-segalovitz-confirm-ongoing-talks-on-knesset-run/", title: "Ra'am's Abbas, former Yesh Atid MK Segalovitz confirm ongoing talks on Knesset run (2026-08-13)", publisher: "The Times of Israel" }
