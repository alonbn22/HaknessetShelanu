    title:
      he: 'בריאיון ערב הפריימריז: "היינו עדינים מדי ברפורמה, אחרי הבחירות נלך עד הסוף"'
      en: 'Pre-primary interview: "We were too gentle in the reform; after the election we will go all the way"'
    description:
      he: בריאיון ל-ynet ב-16 באוגוסט 2026 אמר כץ כי הקואליציה "הייתה עדינה מדי" ברפורמה
        המשפטית וכי לאחר הבחירות "נמשיך את כל מה שהפסקנו". הוא הגן על בקשת נתניהו
        לשריונים ברשימת הליכוד וכינה את הניסיון להדיח את נתניהו לאחר 7 באוקטובר
        "בושה וחרפה".
      en: In an interview with Ynet on 16 August 2026 Katz said the coalition had been
        "too gentle" in the judicial overhaul and that after the election "we
        will continue everything we stopped". He defended Netanyahu's request
        for reserved slots on the Likud list and called the attempt to oust
        Netanyahu after 7 October "a shame and a disgrace".
    sources:
      - url: https://www.ynet.co.il/news/120andone/article/sjolijf8fe
        title: 'יו"ר הקואליציה אופיר כץ: "היינו עדינים מדי ברפורמה. אחרי הבחירות נלך עד הסוף"'
        publisher: Ynet
  - kind: neutral
