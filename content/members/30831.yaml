    title:
      he: התמודד בפריימריז של הליכוד לכנסת ה-26 ולא שובץ במקום ריאלי
      en: Ran in the Likud primaries for the 26th Knesset and was not placed in a realistic spot
    description:
      he: דלל התמודד ברשימה הארצית בפריימריז של הליכוד שנערכו ב-17 באוגוסט 2026. לפי דיווח מעריב על תוצאות הספירה (18 באוגוסט), הוא לא נמנה עם 27 המועמדים הראשונים ברשימה הארצית, ושמו אינו מופיע ברשימת הליכוד שהוגשה לוועדת הבחירות לקראת בחירות 27 באוקטובר 2026.
      en: Dallal ran on the national list in the Likud primaries held on 17 August 2026. According to Maariv's report on the count (18 August), he was not among the top 27 national-list finishers, and his name does not appear on the Likud list submitted for the 27 October 2026 election.
