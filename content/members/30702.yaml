    title:
      he: "חוקים שהתקבלו ביוזמתה: דיווח על פערי שכר מגדריים, תגמול מילואים ליוצאי קבע ומכשירי החייאה ברכבות"
      en: "Laws passed as sponsor: gender pay-gap reporting, reserve pay for ex-career soldiers and defibrillators on trains"
    description:
      he: "לפי רישומי הכנסת, עטייה הייתה היוזמת הראשונה של כמה הצעות חוק שהתקבלו בקריאה שלישית: תיקון מס' 6 לחוק שכר שווה לעובדת ולעובד (אוגוסט 2020), המחייב מעסיקים גדולים לדווח מדי שנה על פערי השכר בין נשים לגברים; תיקון מס' 255 לחוק הביטוח הלאומי (5 במרץ 2025, 17 בעד ללא מתנגדים), המשווה את תגמול המילואים של משוחררי קבע לזה של עובדים שכירים; ותיקון מס' 3 לחוק הצבת מכשירי החייאה במקומות ציבוריים (31 במרץ 2025), המחייב הצבת דפיברילטור בכל רכבת."
      en: "Knesset records list Atia as the first initiator of several bills that passed their third reading: Amendment 6 to the Equal Pay Law (August 2020), requiring large employers to report annually on pay gaps between women and men; Amendment 255 to the National Insurance Law (5 March 2025, 17 in favour with none opposed), which equalises the reserve-duty pay of discharged career soldiers with that of salaried employees; and Amendment 3 to the Defibrillators in Public Places Law (31 March 2025), requiring a defibrillator on every train."
    date: "2025-03-05"
