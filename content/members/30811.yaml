  - kind: negative
    category: controversy
    date: "2026-05-20"
    title:
      he: "סרטון שבו לעג לפעילי המשט העצורים עורר גינוי בישראל ובעולם, כולל מראש הממשלה"
      en: "A video in which he taunted detained flotilla activists drew condemnation in Israel and abroad, including from the Prime Minister"
    description:
      he: "ב-20 במאי 2026 פרסם בן גביר סרטון מנמל אשדוד שבו נראים מאות פעילי משט לעזה עצורים, כורעים וידיהם קשורות, בעוד הוא מנופף בדגל ישראל ואומר לעברם, לפי הדיווחים, כי הם הגיעו לישראל וכי ישראל היא בעלת הבית. ראש הממשלה נתניהו אמר כי האופן שבו טיפל השר בן גביר בפעילי המשט אינו עולה בקנה אחד עם ערכי ישראל ונורמותיה, שר החוץ סער אמר כי בן גביר גרם במכוון נזק למדינה, וממשלות בהן צרפת, איטליה, ספרד וארה\"ב גינו את הסרטון. בדיווחים שצוטטו כאן לא הובאה תגובה של בן גביר לביקורת."
      en: "On 20 May 2026 Ben-Gvir posted a video from Ashdod port showing hundreds of detained Gaza-flotilla activists kneeling with their hands bound while he waved an Israeli flag and called out \"Welcome to Israel, we are in charge here\". Prime Minister Netanyahu said that \"the way that Minister Ben Gvir dealt with the flotilla activists is not in line with Israel's values and norms\", Foreign Minister Sa'ar said \"you deliberately caused damage to the state\", and governments including France, Italy, Spain and the United States condemned the video. The reports cited here carried no response from Ben-Gvir to the criticism."
