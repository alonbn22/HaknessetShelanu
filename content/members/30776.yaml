    title:
      he: "שותף ליוזמת התיקון לחוק תשלומים לפדויי שבי (2024)"
      en: "Co-sponsored the amendment to the Payments to Released Captives Law (2024)"
    description:
      he: "ביוני 2024 אישרה הכנסת את תיקון מס' 6 לחוק תשלומים לפדויי שבי, שמיזג הצעת חוק ממשלתית עם הצעת חוק פרטית של חברי הכנסת קארין אלהרר, ולדימיר בליאק, גלעד קריב ויצחק קרויזר. התיקון קבע מענק הסתגלות חד-פעמי של 50 אלף ש\"ח ותשלום חודשי של 3,300 ש\"ח לפדויי שבי (לעומת 1,395 ש\"ח קודם לכן)."
      en: "In June 2024 the Knesset passed Amendment 6 to the Payments to Released Captives Law, which merged a government bill with a private bill by MKs Karine Elharrar, Vladimir Beliak, Gilad Kariv and Yitzhak Kroizer. The amendment set a one-time adjustment grant of NIS 50,000 and a monthly payment of NIS 3,300 for released captives (up from NIS 1,395)."
    date: "2024-06-05"
    sources:
      - url: "https://www.davar1.co.il/515934/"
        title: "מענק של 50 אלף ש\"ח ותשלום חודשי של 3,300 ש\"ח: התיקון לחוק תשלומים לפדויי שבי אושר בכנסת"
        publisher: "Davar"
      - url: "https://fs.knesset.gov.il/25/law/25_lsr_4546317.pdf"
        title: "חוק תשלומים לפדויי שבי (תיקון מס' 6) — ספר החוקים"
        publisher: "The Knesset"
