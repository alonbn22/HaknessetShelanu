    title:
      he: "יושבת-ראש ועדת העבודה והרווחה של הכנסת (מאוגוסט 2025)"
      en: "Chair of the Knesset Labor and Welfare Committee (since August 2025)"
    description:
      he: "ב-4 באוגוסט 2025 אישרה ועדת הכנסת פה אחד את מינויה של וולדיגר ליושבת-ראש ועדת העבודה והרווחה, במקומו של ח\"כ ישראל אייכלר שפרש מהתפקיד עם יציאת יהדות התורה מהקואליציה. מתפקיד זה הציבה כמשימה מרכזית את שיפור מערכות בריאות הנפש והשיקום, ובכלל זה הסיוע לנפגעי טראומה בעקבות המלחמה."
      en: "On 4 August 2025 the Knesset House Committee unanimously approved Waldiger's appointment as chair of the Labor and Welfare Committee, replacing MK Yisrael Eichler, who stepped down when United Torah Judaism left the coalition. From this post she has made overhauling the mental-health and rehabilitation systems, including support for those traumatized by the war, a central focus of her work."
    date: "2025-08-04"
