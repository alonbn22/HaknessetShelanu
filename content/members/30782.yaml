    description:
      he: בשנת 2016 נכללה מזרסקי ברשימת "50 הפעילים החברתיים של 2016" של 'ידיעות
        אחרונות'. ברשימה צוין כי הקימה בכרמיאל מערך מתנדבים לסיוע לניצולי שואה
        ולקשישים בודדים.
      en: In 2016 Mazarsky was included in Yedioth Ahronoth's list of "50 social
        activists of 2016". The list noted that she had set up a volunteer
        network in Karmiel assisting Holocaust survivors and elderly people
        living alone.
      ar: في عام 2016 أُدرجت مازارسكي في قائمة «50 ناشطًا اجتماعيًا لعام 2016»
        لصحيفة يديعوت أحرونوت. وذكرت القائمة أنها أسست في كرميئيل شبكة متطوعين
        لمساعدة الناجين من المحرقة والمسنين الذين يعيشون بمفردهم.
      ru: В 2016 году Мазарская была включена в список «50 общественных активистов
        2016 года» газеты «Едиот Ахронот». В списке отмечалось, что она создала
        в Кармиэле сеть волонтёров, помогающих пережившим Холокост и одиноким
        пожилым людям.
      es: En 2016 Mazarsky fue incluida en la lista «50 activistas sociales de 2016»
        de Yedioth Ahronoth. La lista señalaba que había creado en Karmiel una red
        de voluntarios que asiste a sobrevivientes del Holocausto y a personas
        mayores que viven solas.
      fr: En 2016, Mazarsky figurait sur la liste « 50 militants sociaux de 2016 » du
        Yedioth Ahronoth. La liste indiquait qu’elle avait mis sur pied à Karmiel
        un réseau de bénévoles venant en aide aux rescapés de la Shoah et aux
        personnes âgées isolées.
