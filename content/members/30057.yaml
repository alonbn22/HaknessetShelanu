      en: Kisch enlisted in the Israeli Air Force in 1985, completed fighter pilot
        training in 1988 and served on F-16 aircraft. He reached the rank of
        Lieutenant Colonel and ended his reserve service in 2016. Before his
        election to the Knesset he worked for several years as a civil airline
        pilot for El Al.
