    title:
      he: כיהן כשר וכסגן שר בממשלת ישראל
      en: Served as a government minister and deputy minister in Israel
    description:
      he: יואב בן צור, חבר כנסת מטעם ש"ס שנכנס לכנסת ביוני 2014, כיהן בממשלה ה-37 כשר
        הרווחה והביטחון החברתי (29 בדצמבר 2022 – 30 בינואר 2023) ולאחר מכן כשר
        העבודה (30 בינואר 2023 – 20 ביולי 2025), וכן כממלא מקום שר הבריאות בין
        ינואר לאפריל 2023. ביולי 2025 התפטר מהממשלה יחד עם שרי ש"ס על רקע משבר
        חוק הגיוס. במאי 2020 מונה לסגן השר לפיתוח הפריפריה, הנגב והגליל ולסגן שר
        הפנים.
      en: Yoav Ben-Tzur, a Knesset member for the Shas party who entered the Knesset
        in June 2014, served in the 37th government as Minister of Welfare and
        Social Security (29 December 2022 - 30 January 2023) and then as
        Minister of Labor (30 January 2023 - 20 July 2025), and as acting
        Minister of Health between January and April 2023. In July 2025 he
        resigned from the government together with the other Shas ministers
        amid the military-draft law crisis. In May 2020 he was appointed Deputy
        Minister for the Development of the Periphery, Negev and Galilee and
        Deputy Minister of the Interior.
    date: "2022-12-29"
