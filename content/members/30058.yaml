      en: Miki Zohar, a member of the Likud party, was appointed Minister of Culture and Sport in Israel's 37th government on 29 December 2022, and continues in the post in the caretaker government following the dissolution of the 25th Knesset. He previously served as a Likud member of the Knesset from 2015, including roles as Deputy Speaker of the Knesset and coalition whip.
