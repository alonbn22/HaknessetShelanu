  - kind: neutral
    category: news
    date: "2026-08-25"
    title:
      he: "תוצאת הפריימריז בליכוד ומינוי לראש מטה העולים של המפלגה"
      en: "Likud primary result and appointment to head the party's immigrant outreach"
    description:
      he: "בפריימריז של הליכוד ב-17 באוגוסט 2026 התמודד אלקין עם ניר ברקת על המקום ה-16 בהצבעה, שנחשב למקום הריאלי האחרון, ודורג במקום ה-32 ברשימה המשולבת - מקום שאינו נחשב מובטח. ב-25 באוגוסט 2026 מינה אותו נתניהו לעמוד בראש מטה הליכוד לציבור העולים ודוברי הרוסית, ואמר כי אלקין יהיה בכנסת הבאה."
      en: "In the Likud primaries of 17 August 2026 Elkin contested the 16th slot in the vote, considered the last realistic one, against Nir Barkat, and ended up 32nd on the combined list - a placement not considered secure. On 25 August 2026 Netanyahu appointed him to head Likud's campaign among immigrant and Russian-speaking voters and said Elkin would be in the next Knesset."
