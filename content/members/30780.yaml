    title:
      he: התפטר מהכנסת ופרש מהחיים הפוליטיים; אינו מכהן עוד כחבר כנסת
      en: Resigned from the Knesset and retired from political life; no longer a serving MK
    description:
      he: 'ב-26 ביולי 2026 הודיע כץ על התפטרותו מהכנסת ועל פרישה מהפוליטיקה, ואמר כי "הגיע הזמן לקחת הפסקה מהחיים הציבוריים ולפתוח פרק חדש" וכי אינו רוצה להמשיך לקבל שכר מהציבור לאחר שהחליט לעזוב. לפי אתר הכנסת, כהונתו הסתיימה ב-28 ביולי 2026, ובמקומו נכנס לכנסת מוחמד אבו אל-היג''א מיש עתיד. הוא לא יתמודד בבחירות 2026.'
      en: 'On 26 July 2026 Katz announced his resignation from the Knesset and his retirement from politics, saying "it is time to take a break from public life and open a new chapter" and that he did not want to keep drawing a public salary after deciding to leave. According to the Knesset website his term ended on 28 July 2026, and Muhammad Abu al-Hija of Yesh Atid entered the Knesset in his place. He is not running in the 2026 election.'
