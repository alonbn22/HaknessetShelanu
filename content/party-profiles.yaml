      - date: "2026-08-28"
        text:
          he: "בן גביר שלל ריצה משותפת עם הציונות הדתית (27 ביולי: 'אחד ועוד אחד לא תמיד שווה שניים') ודחה את דרישת נתניהו להתאחד עם סמוטריץ': 'ההחלטה סופית ומוחלטת'."
          en: "Ben Gvir ruled out a joint run with Religious Zionism (27 July: ‘one plus one does not always equal two’) and rejected Netanyahu’s demand to merge with Smotrich, calling the decision ‘final and complete’."
          ar: "استبعد بن غفير الترشح المشترك مع الصهيونية الدينية (27 تموز/يوليو: «واحد زائد واحد لا يساوي دائمًا اثنين») ورفض مطلب نتنياهو بالاتحاد مع سموتريتش: «القرار نهائي وقاطع»."
          ru: "Бен-Гвир исключил совместное участие с «Религиозным сионизмом» (27 июля: «один плюс один не всегда равно двум») и отверг требование Нетаньяху объединиться со Смотричем: «Решение окончательное и бесповоротное»."
          es: "Ben Gvir descartó una candidatura conjunta con Sionismo Religioso (27 de julio: «uno más uno no siempre son dos») y rechazó la exigencia de Netanyahu de fusionarse con Smotrich, calificando la decisión de «definitiva y completa»."
          fr: "Ben Gvir a exclu une candidature commune avec le Sionisme religieux (27 juillet : « un plus un ne font pas toujours deux ») et a rejeté l’exigence de Netanyahou de fusionner avec Smotrich, qualifiant la décision de « définitive et complète » ."
        sources:
          - { url: "https://www.jpost.com/israel-news/politics-and-diplomacy/article-903791", title: "Ben-Gvir rules out running with Smotrich for elections, says parties are 'fundamentally different' (2026-07-27)", publisher: "The Jerusalem Post" }
          - { url: "https://www.timesofisrael.com/ben-gvir-rejects-pms-demand-to-merge-with-smotrich-drawing-scathing-response-from-likud/", title: "Ben Gvir refuses Netanyahu's demand to merge with Smotrich; Likud: He's crowning Eisenkot (2026-08-28)", publisher: "The Times of Israel" }
      - date: "2026-09-03"
        text:
          he: "הליכוד הודיע על הסכמה שח\"כ טלי גוטליב (הליכוד) תתמודד ברשימת עוצמה יהודית — במקום השני — בלי שתוכרז כפורשת; היא כפופה למשמעת הליכוד בהצבעות עד כינוס הכנסת ה-26. גוטליב סיימה במקום ה-12 בפריימריז של הליכוד ונדחקה למקום ה-20 ברשימה."
          en: "Likud announced an agreement under which MK Tally Gotliv (Likud) runs on the Otzma Yehudit list — in second place — without being declared a departing lawmaker; she remains bound by Likud voting discipline until the 26th Knesset convenes. Gotliv had placed 12th in Likud’s primary and was pushed to 20th on its slate."
          ar: "أعلن الليكود عن اتفاق تترشح بموجبه عضوة الكنيست طالي غوتليف (الليكود) في قائمة عوتسما يهوديت — في الموقع الثاني — دون أن تُعلَن منشقة؛ وتبقى ملزمة بانضباط الليكود في التصويت حتى انعقاد الكنيست الـ26. وكانت غوتليف قد حلّت في الموقع الـ12 في الانتخابات التمهيدية لليكود ودُفعت إلى الموقع الـ20 في القائمة."
          ru: "Ликуд объявил о договорённости, по которой депутат Тали Готлив (Ликуд) пойдёт в списке «Оцма Иегудит» — на втором месте, — не объявляясь вышедшей из фракции; до первого заседания Кнессета 26-го созыва она подчиняется дисциплине Ликуда при голосованиях. На праймериз Ликуда Готлив заняла 12-е место и была оттеснена на 20-е место в списке."
          es: "El Likud anunció un acuerdo por el que la diputada Tally Gotliv (Likud) se presenta en la lista de Otzma Yehudit — en segundo lugar — sin que se la considere una diputada que abandona su facción (a efectos de la ley); sigue sujeta a la disciplina de voto del Likud hasta que se constituya la 26.ª Knéset. Gotliv había quedado 12.ª en las primarias del Likud y fue relegada al puesto 20 de su lista."
          fr: "Le Likoud a annoncé un accord selon lequel la députée Tally Gotliv (Likoud) se présente sur la liste d’Otzma Yehoudit — en deuxième position — sans être considérée comme ayant quitté sa faction (« députée dissidente » au sens de la loi) ; elle reste soumise à la discipline de vote du Likoud jusqu’à l’installation de la 26e Knesset. Gotliv était arrivée 12e à la primaire du Likoud et avait été reléguée à la 20e place de sa liste."
        sources:
          - { url: "https://www.ynet.co.il/news/article/h1uerzwozl", title: "המעבר אושר: טלי גוטליב תתמודד ברשימת עוצמה יהודית לכנסת (2026-09-03)", publisher: "Ynet" }
          - { url: "https://www.timesofisrael.com/likud-arranges-to-have-firebrand-mk-tally-gotliv-run-with-ben-gvirs-otzma-yehudit/", title: "Likud arranges to have firebrand MK Tally Gotliv run with Ben Gvir's Otzma Yehudit (2026-09-04)", publisher: "The Times of Israel" }
      - date: "2026-09-07"
        text:
          he: "רשימת עוצמה יהודית הוגשה (רשימה 14) בידי 'חזית יהודית לאומית' ו'ארץ ישראל שלנו': 1 איתמר בן גביר, 2 טלי גוטליב, 3 יצחק וסרלאוף, 4 עמיחי אליהו, 5 לימור סון הר-מלך, 6 יצחק קרויזר, 7 חנמאל דורפמן, 8 צחי אליהו. האות המבוקשת: ב — אות שביקשה גם רשימה 1 ('ביחד בראשות נפתלי בנט', ב/רק); האות ט שמורה לסיעות הממשיכות של רשימת 2022 (הציונות הדתית, עוצמה יהודית ונעם) לפי טבלת ועדת הבחירות; רשימת הציונות הדתית–זהות ביקשה אותה. האותיות ייקבעו באישור הרשימות ב-27 בספטמבר 2026."
          en: "The Otzma Yehudit list was submitted (list 14) by ‘Jewish National Front’ and ‘Eretz Yisrael Shelanu’: 1 Itamar Ben Gvir, 2 Tally Gotliv, 3 Yitzhak Wasserlauf, 4 Amichai Eliyahu, 5 Limor Son Har-Melech, 6 Yitzhak Kroizer, 7 Hanamel Dorfman, 8 Tzachi Eliyahu. Requested letter: ב — also requested by list 1 (‘Together headed by Naftali Bennett’, ב/רק); under the CEC table, ט is reserved for the successor factions of the 2022 list (Religious Zionism, Otzma Yehudit and Noam); the Religious Zionism–Zehut list requested it. Letters are set when the lists are approved on 27 September 2026."
          ar: "قُدّمت قائمة عوتسما يهوديت (القائمة 14) من قِبل «الجبهة القومية اليهودية» و«أرض إسرائيل لنا»: 1 إيتمار بن غفير، 2 طالي غوتليف، 3 يتسحاق فاسرلاوف، 4 عميحاي إلياهو، 5 ليمور سون هار-ميلخ، 6 يتسحاق كرويزر، 7 حنمئيل دورفمان، 8 تساحي إلياهو. الحرف المطلوب: ב — وهو حرف طلبته أيضًا القائمة 1 («معًا برئاسة نفتالي بينيت»، ב/רק)؛ والحرف ט محجوز للكتل الوارثة لقائمة 2022 (الصهيونية الدينية وعوتسما يهوديت ونوعم) بحسب جدول لجنة الانتخابات، وقد طلبته قائمة الصهيونية الدينية–زهوت. وتُحدَّد الأحرف عند المصادقة على القوائم في 27 أيلول/سبتمبر 2026."
          ru: "Список «Оцма Иегудит» подан (список 14) партиями «Еврейский национальный фронт» и «Наша Земля Израиля»: 1 Итамар Бен-Гвир, 2 Тали Готлив, 3 Ицхак Вассерлауф, 4 Амихай Элияху, 5 Лимор Сон Хар-Мелех, 6 Ицхак Кройзер, 7 Ханамель Дорфман, 8 Цахи Элияху. Запрошенная буква: ב — её запросил и список 1 («Вместе во главе с Нафтали Беннетом», ב/רק); буква ט по таблице ЦИК зарезервирована за фракциями-преемницами списка 2022 года («Религиозный сионизм», «Оцма Иегудит» и «Ноам»), и её запросил список «Религиозный сионизм — Зеут». Буквы будут определены при утверждении списков 27 сентября 2026 года."
          es: "La lista de Otzma Yehudit fue presentada (lista 14) por «Frente Nacional Judío» y Eretz Yisrael Shelanu («Nuestra Tierra de Israel»): 1 Itamar Ben Gvir, 2 Tally Gotliv, 3 Yitzhak Wasserlauf, 4 Amichai Eliyahu, 5 Limor Son Har-Melech, 6 Yitzhak Kroizer, 7 Hanamel Dorfman, 8 Tzachi Eliyahu. Letra solicitada: ב — también solicitada por la lista 1 («Juntos, con Naftali Bennett a la cabeza», ב/רק); según la tabla de la Comisión Electoral, la ט está reservada a las facciones sucesoras de la lista de 2022 (Sionismo Religioso, Otzma Yehudit y Noam); la lista Sionismo Religioso–Zehut la solicitó. Las letras se fijan al aprobarse las listas el 27 de septiembre de 2026."
          fr: "La liste d’Otzma Yehoudit a été déposée (liste 14) par « Front national juif » et « Notre Terre d’Israël » (Eretz Israël Shelanu) : 1 Itamar Ben Gvir, 2 Tally Gotliv, 3 Yitzhak Wasserlauf, 4 Amichai Eliyahu, 5 Limor Son Har-Melech, 6 Yitzhak Kroizer, 7 Hanamel Dorfman, 8 Tzachi Eliyahu. Lettre demandée : ב — également demandée par la liste 1 (« Ensemble menée par Naftali Bennett », ב/רק) ; selon le tableau de la Commission électorale, ט est réservée aux factions issues de la liste de 2022 (Sionisme religieux, Otzma Yehoudit et Noam) ; la liste Sionisme religieux–Zehut l’a demandée. Les lettres sont fixées à l’approbation des listes le 27 septembre 2026."
        sources:
          - { url: "https://www.gov.il/he/pages/yehudit-meuhedet_list14", title: "רשימת המועמדים — עוצמה יהודית (רשימה 14) (2026-09-09)", publisher: "ועדת הבחירות המרכזית / gov.il" }
          - { url: "https://www.gov.il/he/pages/candidates-lists-26", title: "רשימות המועמדים לכנסת ה-26 — טבלת האותיות התפוסות/הפנויות (2026-09-18)", publisher: "ועדת הבחירות המרכזית / gov.il" }
          - { url: "https://www.timesofisrael.com/no-last-minute-mergers-as-parties-submit-final-knesset-slates-for-election/", title: "No last-minute mergers as most parties submit final Knesset slates for election (2026-09-07)", publisher: "The Times of Israel" }
      - date: "2026-09-14"
        text:
          he: "הדמוקרטים הגישו לוועדת הבחירות המרכזית בקשה לפסול את עוצמה יהודית מהתמודדות, בטענה לפגיעה באופייה הדמוקרטי של המדינה; הבקשה מתייחסת גם להתנהלות בן גביר כשר וגם לגוטליב."
          en: "The Democrats asked the Central Elections Committee to bar Otzma Yehudit from running, alleging it undermines the state’s democratic character; the request also cites Ben Gvir’s conduct as minister and Gotliv."
          ar: "قدّم الديمقراطيون إلى لجنة الانتخابات المركزية طلبًا لمنع عوتسما يهوديت من خوض الانتخابات، بدعوى المساس بالطابع الديمقراطي للدولة؛ ويتناول الطلب أيضًا سلوك بن غفير وزيرًا وكذلك غوتليف."
          ru: "«Демократы» обратились в Центральную избирательную комиссию с просьбой отстранить «Оцма Иегудит» от выборов, утверждая, что она подрывает демократический характер государства; в обращении упоминаются также действия Бен-Гвира на посту министра и Готлив."
          es: "Los Demócratas pidieron a la Comisión Electoral Central que impida a Otzma Yehudit presentarse, alegando que socava el carácter democrático del Estado; la petición cita también la conducta de Ben Gvir como ministro y a Gotliv."
          fr: "Les Démocrates ont demandé à la Commission électorale centrale d’interdire à Otzma Yehoudit de se présenter, alléguant qu’il porte atteinte au caractère démocratique de l’État ; la demande cite aussi la conduite de Ben Gvir comme ministre et Gotliv."
        sources:
          - { url: "https://www.timesofisrael.com/democrats-seek-to-bar-otzma-yehudit-from-election-as-polls-show-continued-deadlock/", title: "Democrats seek to bar Otzma Yehudit from election as polls show continued deadlock (2026-09-15)", publisher: "The Times of Israel" }
      - date: "2026-09-13"
        text:
          he: "עוצמה יהודית הגישה לוועדת הבחירות המרכזית בקשה לפסול את רע\"ם; שבוע לאחר מכן הודיע הליכוד כי יגיש בקשה לפסול את רע\"ם ואת הרשימה המשותפת. ההכרעה בוועדה נתונה לביקורת בית המשפט העליון."
          en: "Otzma Yehudit filed a petition with the Central Elections Committee to disqualify Ra’am; a week later Likud said it would petition to disqualify Ra’am and the Joint List. CEC decisions are subject to Supreme Court review."
          ar: "قدّمت عوتسما يهوديت إلى لجنة الانتخابات المركزية طلبًا لشطب القائمة الموحدة (راعم)؛ وبعد أسبوع أعلن الليكود أنه سيقدّم طلبًا لشطب القائمة الموحدة والقائمة المشتركة. قرارات اللجنة خاضعة لرقابة المحكمة العليا."
          ru: "«Оцма Иегудит» подала в Центральную избирательную комиссию ходатайство об отстранении РААМ; через неделю Ликуд заявил, что подаст ходатайство об отстранении РААМ и «Объединённого списка». Решения комиссии подлежат рассмотрению Верховным судом."
          es: "Otzma Yehudit presentó ante la Comisión Electoral Central una petición para inhabilitar a Ra’am; una semana después el Likud dijo que pediría la inhabilitación de Ra’am y de la Lista Conjunta. Las decisiones de la Comisión están sujetas a revisión del Tribunal Supremo."
          fr: "Otzma Yehoudit a déposé auprès de la Commission électorale centrale une requête visant à invalider Ra’am ; une semaine plus tard, le Likoud a déclaré qu’il demanderait l’invalidation de Ra’am et de la Liste commune. Les décisions de la Commission sont soumises au contrôle de la Cour suprême."
        sources:
          - { url: "https://www.timesofisrael.com/netanyahus-party-says-it-will-petition-election-panel-to-ban-arab-majority-parties/", title: "Netanyahu's Likud says it will petition election panel to ban Arab-majority parties (2026-09-14)", publisher: "The Times of Israel" }
      - date: "2026-10-01"
        text:
          he: "ב-1 באוקטובר 2026 דן הרכב של תשעה שופטי בית המשפט העליון בערעורי רע\"ם והרשימה המשותפת ובפסילת המועמדים עופר כסיף וסאמי אבו שחאדה. בעניין אבו שחאדה אמר נשיא בית המשפט העליון יצחק עמית כי בקרב השופטים יש רוב לאישור הפסילה, וכל השופטים המליצו לו לשקול להסיר את מועמדותו – דבר שיפטור ממתן פסק דין מנומק; השר בן גביר התנגד להמלצה וביקש פסק דין. באותו ערב הודיעה בל\"ד כי אבו שחאדה לא יתמודד; הרשימה המשותפת כינתה את ההמלצה \"פסילה בפועל\". פסקי הדין בעניין רע\"ם, הרשימה המשותפת וכסיף צפויים עד 4 באוקטובר."
          en: "On 1 October 2026 a panel of nine Supreme Court justices heard the appeals of Ra’am and the Joint List and the disqualifications of the candidates Ofer Cassif and Sami Abu Shehadeh. On Abu Shehadeh, Supreme Court President Yitzhak Amit said a majority of the justices favoured approving the disqualification, and all nine recommended that he consider withdrawing – which would make a reasoned judgment unnecessary; Minister Ben Gvir opposed the recommendation and asked for a ruling. That evening Balad announced that Abu Shehadeh would not run; the Joint List called the recommendation “disqualification in practice”. The rulings on Ra’am, the Joint List and Cassif are due by 4 October."
          ar: "في 1 تشرين الأول/أكتوبر 2026 نظرت هيئة من تسعة قضاة في المحكمة العليا في استئنافَي القائمة الموحدة والقائمة المشتركة وفي شطب المرشحَين عوفر كسيف وسامي أبو شحادة. وبشأن أبو شحادة قال رئيس المحكمة العليا يتسحاق عميت إن أغلبية القضاة تميل إلى المصادقة على الشطب، وأوصاه القضاة التسعة جميعًا بأن يدرس سحب ترشحه – ما يُغني عن إصدار حكم مُعلَّل؛ وعارض الوزير بن غفير التوصية وطلب إصدار حكم. وفي المساء نفسه أعلن التجمع أن أبو شحادة لن يترشح؛ ووصفت القائمة المشتركة التوصية بأنها «شطب فعلي». ويُتوقع صدور الأحكام بشأن القائمة الموحدة والقائمة المشتركة وكسيف حتى 4 تشرين الأول/أكتوبر."
          ru: "1 октября 2026 года коллегия из девяти судей Верховного суда рассмотрела апелляции РААМ и «Объединённого списка» и отстранение кандидатов Офера Касифа и Сами Абу Шехаде. По делу Абу Шехаде председатель Верховного суда Ицхак Амит сказал, что большинство судей склоняется к утверждению отстранения, и все девять рекомендовали ему рассмотреть снятие кандидатуры — тогда мотивированное решение не понадобится; министр Бен-Гвир выступил против рекомендации и потребовал решения. В тот же вечер «Балад» объявил, что Абу Шехаде не будет баллотироваться; «Объединённый список» назвал рекомендацию «фактическим отстранением». Решения по РААМ, «Объединённому списку» и Касифу ожидаются до 4 октября."
          es: "El 1 de octubre de 2026 un tribunal de nueve jueces del Tribunal Supremo examinó los recursos de Ra’am y de la Lista Conjunta y la inhabilitación de los candidatos Ofer Cassif y Sami Abu Shehadeh. Sobre Abu Shehadeh, el presidente del Tribunal Supremo, Yitzhak Amit, dijo que una mayoría de los jueces se inclinaba por aprobar la inhabilitación, y los nueve le recomendaron que considerara retirar su candidatura, lo que haría innecesaria una sentencia motivada; el ministro Ben Gvir se opuso a la recomendación y pidió un fallo. Esa misma noche Balad anunció que Abu Shehadeh no se presentaría; la Lista Conjunta calificó la recomendación de «inhabilitación de facto». Los fallos sobre Ra’am, la Lista Conjunta y Cassif se esperan antes del 4 de octubre."
          fr: "Le 1er octobre 2026, une formation de neuf juges de la Cour suprême a examiné les appels de Ra’am et de la Liste commune et l’invalidation des candidats Ofer Cassif et Sami Abu Shehadeh. Concernant Abu Shehadeh, le président de la Cour suprême, Yitzhak Amit, a déclaré qu’une majorité des juges penchait pour approuver l’invalidation, et les neuf juges lui ont recommandé d’envisager de retirer sa candidature, ce qui rendrait inutile un jugement motivé ; le ministre Ben Gvir s’est opposé à cette recommandation et a demandé une décision. Le soir même, Balad a annoncé qu’Abu Shehadeh ne se présenterait pas ; la Liste commune a qualifié la recommandation d’« invalidation de fait ». Les décisions sur Ra’am, la Liste commune et Cassif sont attendues au plus tard le 4 octobre."
        sources:
          - { url: "https://www.jpost.com/israel-news/politics-and-diplomacy/article-910271", title: "Abu Shehadeh to withdraw election bid on Supreme Court recommendation (1 Oct 2026)", publisher: "The Jerusalem Post" }
