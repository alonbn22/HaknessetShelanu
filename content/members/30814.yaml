    description:
      he: לפני כניסתו לפוליטיקה צבר מעוז ניסיון רב בשירות הציבורי. בשנת 1999 מונה
        למנהל משרד הפנים על ידי השר נתן שרנסקי, ולאחר מכן שימש כמנהל משרד הבינוי
