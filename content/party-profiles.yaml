    spectrum: center
    ballotLetters: "עם"
    leaderHe: מנסור עבאס
    leaderEn: Mansour Abbas
    founded: 1996
    wikipediaEn: https://en.wikipedia.org/wiki/United_Arab_List
    tags: [arab, conservative]
    summary:
      he: מפלגה ערבית שמרנית, שצמחה מהתנועה האסלאמית ובדצמבר 2025 הודיעה על הפרדת מוסדותיה ממנה; הראשונה שהצטרפה לקואליציה ציונית (2021).
      en: An Arab conservative party that grew out of the Islamic Movement and announced in December 2025 that it was separating its institutions from it; the first Arab party to join a Zionist-led coalition (2021).
      ar: حزب عربي محافظ نشأ من الحركة الإسلامية وأعلن في كانون الأول/ديسمبر 2025 فصل مؤسساته عنها؛ أول حزب عربي ينضم إلى ائتلاف بقيادة صهيونية (2021).
      ru: Арабская консервативная партия, выросшая из Исламского движения и в декабре 2025 года объявившая об отделении своих институтов от него; первая вошедшая в коалицию под сионистским руководством (2021).
    positions:
      he:
        - קידום זכויות ותקציבים לאוכלוסייה הערבית
        - מאבק בפשיעה ובאלימות בחברה הערבית
        - שמירה על ערכים דתיים-שמרניים
      en:
        - Advancing rights and budgets for the Arab population
        - Fighting crime and violence in Arab society
        - Upholding conservative religious values
  - id: 1103 # Hadash-Ta'al
    verified: "2026-09-19"
    updates:
      - date: "2025-06-20"
        text:
          he: "ח\"כ יוסף עטאונה (חד\"ש) התפטר מהכנסת במסגרת הסכם רוטציה בתוך הסיעה; במקומו נכנס סמיר בן סעיד (תע\"ל)."
          en: "MK Yousef Atauna (Hadash) resigned from the Knesset under a rotation agreement within the faction; Samir Ben Said (Ta’al) took his seat."
        sources:
          - { url: "https://zoha.org.il/138082/", title: "ח\"כ עטאונה הגיש את מכתב התפטרותו מהכנסת במסגרת הסכם הרוטציה בסיעת חד\"ש-תע\"ל (2025-06-18)", publisher: "זו הדרך" }
          - { url: "https://main.knesset.gov.il/mk/apps/faction/faction-lobby?KnessetID=25&FactionID=1103", title: "סיעת חד\"ש-תע\"ל — חילופי גברי: 20/06/2025 סמיר בן סעיד נכנס במקום יוסף עטאונה (2026-09-19)", publisher: "הכנסת" }
          - { url: "https://knesset.gov.il/OdataV4/ParliamentInfo/KNS_PersonToPosition?$filter=KnessetNum%20eq%2025%20and%20FactionID%20eq%201103%20and%20PositionID%20eq%2054", title: "KNS_PersonToPosition — faction 1103 members (Atauna FinishDate 2025-06-20; Ben Said StartDate 2025-06-20) (2026-09-19)", publisher: "Knesset OData" }
      - date: "2025-07-14"
        text:
          he: "הצעה להדיח את ח\"כ איימן עודה מהכנסת (על רקע התבטאות מינואר 2025 על שחרור חטופים ואסירים) זכתה ל-73 תומכים מול 15 מתנגדים במליאה, פחות מ-90 הקולות הנדרשים, ונדחתה. ועדת הכנסת אישרה את הבקשה ביוני 2025."
          en: "A motion to remove MK Ayman Odeh from the Knesset (over a January 2025 statement about the release of hostages and prisoners) received 73 votes in favour and 15 against in the plenum, short of the 90 required, and failed. The House Committee had approved the request in June 2025."
        sources:
          - { url: "https://www.timesofisrael.com/motion-to-expel-odeh-from-knesset-fails-to-pass-amid-heckling-by-coalition-members/", title: "Motion to expel Arab party head Odeh from Knesset fails; coalition MKs heckle him (2025-07-15)", publisher: "The Times of Israel" }
      - date: "2026-01-22"
        text:
          he: "ראשי חד\"ש, תע\"ל, בל\"ד ורע\"ם חתמו בסח'נין על התחייבות לפעול להקמת הרשימה המשותפת מחדש, ביום השביתה הכללית בחברה הערבית נגד הפשיעה."
          en: "The heads of Hadash, Ta’al, Balad and Ra’am signed in Sakhnin a commitment to work toward re-establishing the Joint List, on the day of the Arab community’s general strike over violent crime."
        sources:
          - { url: "https://www.timesofisrael.com/under-pressure-arab-knesset-parties-sign-agreement-to-work-toward-reviving-joint-list/", title: "Under pressure, Arab Knesset parties sign agreement to work toward reviving Joint List (2026-01-22)", publisher: "The Times of Israel" }
          - { url: "https://www.ynet.co.il/news/article/bye65yguwl", title: "ראשי המפלגות הערביות הסכימו: נפעל להקמת הרשימה המשותפת מחדש (2026-01-22)", publisher: "ynet" }
      - date: "2026-05-16"
        text:
          he: "מועצת חד\"ש (966 צירים) בדיר חנא בחרה בד\"ר יוסף ג'בארין, ח\"כ לשעבר (2015–2021), ליו\"ר המפלגה במקום איימן עודה, שלא התמודד שוב ופורש מהכנסת בתום הקדנציה; אחריו נבחרו, בין השאר, עופר כסיף, יוסף עטאונה, נהאיה ושאחי ואיאס נאטור."
          en: "Hadash’s 966-delegate council in Deir Hanna elected Dr. Yousef Jabareen, a former MK (2015–2021), as party chair in place of Ayman Odeh, who did not run again and leaves the Knesset at the end of the term; Ofer Cassif, Yousef Atauna, Nihaya Wishahi and Ayas Natur were among those elected to the next slots."
        sources:
          - { url: "https://www.timesofisrael.com/former-mk-yousef-jabareen-elected-leader-of-arab-majority-party-hadash/", title: "Former MK Yousef Jabareen elected leader of Arab-majority party Hadash (2026-05-16)", publisher: "The Times of Israel" }
          - { url: "https://www.ynet.co.il/news/article/rjofrtsjfl", title: "יחליף את איימן עודה: ד\"ר יוסף ג'בארין נבחר ליו\"ר חד\"ש (2026-05-16)", publisher: "ynet" }
          - { url: "https://zoha.org.il/145496/", title: "חד\"ש בחרה את מועמדיה לכנסת; ד\"ר יוסף ג'בארין יעמוד בראש הרשימה (2026-05-17)", publisher: "זו הדרך" }
          - { url: "https://www.timesofisrael.com/hadash-to-pick-new-leadership-as-arab-party-hopes-to-energize-bid-for-joint-list-revival/", title: "Arab party Hadash to pick new leaders, hopes to energize efforts for Joint List revival (2026-05-14)", publisher: "The Times of Israel" }
      - date: "2026-06-10"
        text:
          he: "חד\"ש הודיעה כי תתקדם להקמת רשימה משותפת עם תע\"ל ובל\"ד, תוך השארת הדלת פתוחה לרע\"ם; המגעים עם רע\"ם נתקעו על דרישתה שהרשימה תהיה טכנית בלבד כדי לשמור על חופש הצטרפות לקואליציה."
          en: "Hadash announced it would move ahead with a joint list with Ta’al and Balad, leaving the door open to Ra’am; talks with Ra’am stalled over its demand that the list be technical only, preserving its freedom to join a coalition."
        sources:
          - { url: "https://www.timesofisrael.com/arab-parties-hadash-taal-balad-announce-joint-electoral-slate-without-raam/", title: "Arab parties Hadash, Ta'al, Balad announce joint electoral slate — without Ra'am (2026-06-10)", publisher: "The Times of Israel" }
          - { url: "https://zoha.org.il/145989/", title: "חד״ש: החלטנו להתקדם בהקמת הרשימה המשותפת – רע\"מ טרם הצטרפה (2026-06-10)", publisher: "זו הדרך" }
      - date: "2026-08-19"
        text:
          he: "חד\"ש, תע\"ל ובל\"ד חתמו על הסכם לריצה משותפת כ\"רשימה המשותפת\" — בלי רע\"ם: יוסף ג'בארין (חד\"ש) בראש, אחמד טיבי (תע\"ל) שני ויו\"ר הסיעה המיועד, סאמי אבו שחאדה (בל\"ד) שלישי; תע\"ל קיבלה רוטציה בין המקום השישי לתשיעי, לאחר שדחתה ב-9 באוגוסט את מתווה ועדת הפיוס."
          en: "Hadash, Ta’al and Balad signed an agreement to run together as the Joint List — without Ra’am: Yousef Jabareen (Hadash) first, Ahmad Tibi (Ta’al) second and designated faction chair, Sami Abu Shahadeh (Balad) third; Ta’al received a rotation between the sixth and ninth slots after rejecting the reconciliation committee’s proposal on 9 August."
        sources:
          - { url: "https://www.timesofisrael.com/arab-majority-hadash-taal-and-balad-parties-agree-on-joint-run-after-striking-deal/", title: "Arab-majority Hadash, Ta'al and Balad parties agree on joint run after striking deal (2026-08-19)", publisher: "The Times of Israel" }
          - { url: "https://www.ynet.co.il/news/article/syoll7qdgl", title: "הרשימה המשותפת חוזרת - בלי עבאס: חד\"ש, תע\"ל ובל\"ד מתאחדות (2026-08-19)", publisher: "ynet" }
          - { url: "https://www.timesofisrael.com/negotiations-over-arab-joint-list-hit-snag-as-ahmad-tibi-rejects-proposed-slate/", title: "Negotiations over Arab joint list hit snag as Ahmad Tibi rejects proposed slate (2026-08-09)", publisher: "The Times of Israel" }
      - date: "2026-09-08"
        text:
          he: "הרשימה המשותפת הוגשה לוועדת הבחירות (אותיות מבוקשות ודם): 1 יוסף גבארין (חד\"ש), 2 אחמד טיבי (תע\"ל), 3 סאמי אבו שחאדה (בל\"ד), 4 פאתן ג'טאס (חד\"ש), 5 בכר עואודה (בל\"ד), 6 עופר כסיף (חד\"ש), 7 יוסף עטאונה (חד\"ש), 8 מהא כרכבי סבאח (בל\"ד), 9 אחמד דראושה (תע\"ל). איימן עודה אינו ברשימה. ב-12 בספטמבר נחתם הסכם עודפים עם רע\"ם."
          en: "The Joint List was submitted to the CEC (requested letters ודם): 1 Yousef Jabareen (Hadash), 2 Ahmad Tibi (Ta’al), 3 Sami Abu Shahadeh (Balad), 4 Faten Ghattas (Hadash), 5 Bakr Awawdeh (Balad), 6 Ofer Cassif (Hadash), 7 Yousef Atauna (Hadash), 8 Maha Karkabi Sabbah (Balad), 9 Ahmad Darawshe (Ta’al). Ayman Odeh is not on the list. On 12 September the list signed a surplus-vote agreement with Ra’am."
        sources:
          - { url: "https://www.gov.il/he/pages/hareshima-hameshutefet_list35", title: "הרשימה המשותפת — רשימת המועמדים לכנסת ה-26 (ועדת הבחירות המרכזית) (2026-09-18)", publisher: "gov.il / ועדת הבחירות המרכזית" }
          - { url: "https://www.timesofisrael.com/israels-election-takes-shape-as-38-parties-submit-slates-from-likud-to-joint-list/", title: "Israel's election takes shape as 38 parties submit slates, in battle between pro- and anti-Netanyahu blocs (2026-09-09)", publisher: "The Times of Israel" }
          - { url: "https://www.timesofisrael.com/arab-party-candidate-under-pressure-to-withdraw-over-sexual-harassment-allegations/", title: "Arab party candidate under pressure to withdraw over sexual harassment allegations (2026-09-03)", publisher: "The Times of Israel" }
          - { url: "https://www.timesofisrael.com/liveblog_entry/joint-list-and-raam-sign-surplus-vote-deal-ahead-of-oct-27-elections/", title: "Joint List and Ra'am sign surplus-vote deal ahead of Oct. 27 elections (2026-09-12)", publisher: "The Times of Israel" }
      - date: "2026-09-13"
        text:
          he: "הליכוד הודיע כי יגיש לוועדת הבחירות המרכזית בקשה לפסול את הרשימה המשותפת ואת רע\"ם. הכרעות הוועדה נתונות לביקורת בית המשפט העליון."
          en: "Likud said it would petition the Central Elections Committee to disqualify the Joint List and Ra’am. CEC decisions are subject to Supreme Court review."
        sources:
          - { url: "https://www.timesofisrael.com/netanyahus-party-says-it-will-petition-election-panel-to-ban-arab-majority-parties/", title: "Netanyahu's Likud says it will petition election panel to ban Arab-majority parties (2026-09-14)", publisher: "The Times of Israel" }
