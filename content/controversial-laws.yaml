# Editorial — a curated, neutral, sourced list of especially controversial laws
# and legislative episodes in Israel. Each entry links a reputable source.
# Describe factually what the law does AND why it was contested (both sides),
# without taking a position. REVIEW before launch.
laws:
  - year: 2023
    title:
      he: "הרפורמה המשפטית והצעת חוק הסבירות (2023)"
      en: "The judicial reform and the reasonableness bill (2023)"
      es: "La reforma judicial y la ley de razonabilidad (2023)"
      fr: "La réforme judiciaire et la loi sur le caractère raisonnable (2023)"
    summary:
      he: "חבילת שינויים שנועדה לצמצם את כוחו של בית המשפט העליון ולשנות את מאזן הכוחות בין הרשויות. תיקון 'עילת הסבירות' אושר ביולי 2023 ועורר את גל המחאות הגדול בתולדות המדינה; תומכים ראו בו חיזוק נבחרי הציבור, מתנגדים ראו בו פגיעה באיזונים ובבלמים. בג\"ץ ביטל את התיקון בינואר 2024."
      en: "A package meant to curb the Supreme Court's power and shift the balance among the branches of government. The 'reasonableness' amendment passed in July 2023 and triggered the largest protest wave in the country's history; supporters saw it as strengthening elected officials, opponents as weakening checks and balances. The High Court struck the amendment down in January 2024."
      es: "Un paquete destinado a limitar el poder del Tribunal Supremo y cambiar el equilibrio entre los poderes del Estado. La enmienda de la «razonabilidad» se aprobó en julio de 2023 y desató la mayor ola de protestas de la historia del país; sus partidarios la veían como un refuerzo de los cargos electos, sus detractores como un debilitamiento de los contrapesos. El Tribunal Supremo la anuló en enero de 2024."
      fr: "Un ensemble de mesures visant à limiter le pouvoir de la Cour suprême et à déplacer l’équilibre entre les pouvoirs. L’amendement sur le « caractère raisonnable » a été adopté en juillet 2023 et a déclenché la plus grande vague de manifestations de l’histoire du pays ; ses partisans y voyaient un renforcement des élus, ses opposants un affaiblissement des contre-pouvoirs. La Haute Cour l’a annulé en janvier 2024."
    sourceUrl: "https://en.wikipedia.org/wiki/2023_Israeli_judicial_reform"
    # The roll-call behind the law, from the Knesset record (vote 39803 in the
    # site's own record and in the Knesset's OData). The second reading is the
    # one where every faction voted; in the third reading (vote 39785, 64–0)
    # the opposition factions did not take part, so it shows no "against".
    votes:
      - id: 39803
        stage: { he: "קריאה שנייה, 24 ביולי 2023", en: "second reading, 24 July 2023", es: "segunda lectura, 24 de julio de 2023", fr: "deuxième lecture, 24 juillet 2023" }
        note:
          he: "בקריאה השלישית (64–0) סיעות האופוזיציה לא השתתפו בהצבעה; לכן מוצגת הקריאה השנייה, שבה הצביעו כולם."
          en: "In the third reading (64–0) the opposition factions did not take part; the second reading, in which everyone voted, is shown."
          es: "En la tercera lectura (64–0) las facciones de la oposición no participaron; se muestra la segunda lectura, en la que votaron todos."
          fr: "Lors de la troisième lecture (64–0), les factions de l’opposition n’ont pas pris part au vote ; la deuxième lecture, où tout le monde a voté, est affichée."
        source: { url: "https://knesset.gov.il/OdataV4/ParliamentInfo/KNS_PlenumVote(39803)", title: "חוק-יסוד: השפיטה (תיקון מס' 3) — לקבל בקריאה שנייה, 24.7.2023", publisher: "הכנסת" }
  - year: 2018
    title:
      he: "חוק הלאום (2018)"
      en: "The Nation-State Law (2018)"
      es: "La Ley del Estado-Nación (2018)"
      fr: "La loi sur l’État-nation (2018)"
    summary:
      he: "חוק יסוד המגדיר את ישראל כמדינת הלאום של העם היהודי. תומכים ראו בו עיגון אופייה היהודי של המדינה; מבקרים, ובהם בני העדה הדרוזית ואזרחים ערבים, טענו שהוא פוגע במעמד המיעוטים ואינו מזכיר שוויון. בג\"ץ דחה ב-2021 עתירות לביטולו."
      en: "A Basic Law defining Israel as the nation-state of the Jewish people. Supporters saw it as anchoring the state's Jewish character; critics — including Druze and Arab citizens — argued it downgrades minorities and omits any mention of equality. The High Court rejected petitions against it in 2021."
      es: "Una Ley Fundamental que define a Israel como el Estado-nación del pueblo judío. Sus partidarios la veían como un anclaje del carácter judío del Estado; sus críticos — incluidos ciudadanos drusos y árabes — sostenían que rebaja a las minorías y omite toda mención a la igualdad. El Tribunal Supremo rechazó los recursos contra ella en 2021."
      fr: "Une Loi fondamentale définissant Israël comme l’État-nation du peuple juif. Ses partisans y voyaient l’ancrage du caractère juif de l’État ; ses détracteurs — dont des citoyens druzes et arabes — estimaient qu’elle rabaisse les minorités et omet toute mention de l’égalité. La Haute Cour a rejeté les recours en 2021."
    sourceUrl: "https://en.wikipedia.org/wiki/Basic_Law:_Israel_as_the_Nation-State_of_the_Jewish_People"
  - year: 2011
    title:
      he: "חוק הנכבה (2011)"
      en: "The Nakba Law (2011)"
      es: "La Ley de la Nakba (2011)"
      fr: "La loi sur la Nakba (2011)"
    summary:
      he: "תיקון המסמיך את שר האוצר לשלול מימון ממוסדות הממומנים על ידי המדינה המציינים את יום העצמאות כיום אֵבל או שוללים את היות ישראל מדינה יהודית ודמוקרטית. מבקרים טענו שהוא מגביל את חופש הביטוי של אזרחים ערבים; תומכים טענו שאין לממן פעולות נגד המדינה."
      en: "An amendment authorizing the Finance Minister to withhold funding from state-funded bodies that mark Independence Day as a day of mourning or deny Israel's status as a Jewish and democratic state. Critics said it curbs Arab citizens' freedom of expression; supporters argued state funds should not support delegitimization."
      es: "Una enmienda que autoriza al ministro de Finanzas a retirar fondos a entidades financiadas por el Estado que conmemoren el Día de la Independencia como día de duelo o nieguen el carácter de Israel como Estado judío y democrático. Sus críticos dijeron que limita la libertad de expresión de los ciudadanos árabes; sus partidarios sostenían que los fondos públicos no deben financiar la deslegitimación."
      fr: "Un amendement autorisant le ministre des Finances à retirer des fonds aux organismes financés par l’État qui marquent le jour de l’Indépendance comme un jour de deuil ou nient le statut d’Israël comme État juif et démocratique. Ses détracteurs y voyaient une restriction de la liberté d’expression des citoyens arabes ; ses partisans estimaient que l’argent public ne doit pas financer la délégitimation."
    sourceUrl: "https://en.wikipedia.org/wiki/Nakba_Law"
  - year: 2005
    title:
      he: "חוק יישום ההתנתקות (2005)"
      en: "The Gaza Disengagement Law (2005)"
      es: "La Ley de Desconexión de Gaza (2005)"
      fr: "La loi sur le désengagement de Gaza (2005)"
    summary:
      he: "החוק שהסדיר את פינוי כל היישובים הישראליים ואת נסיגת הצבא מרצועת עזה (ומארבעה יישובים בצפון השומרון). מהלך שחילק עמוקות את החברה: תומכים ראו בו צמצום חיכוך, ומתנגדים — בעיקר תושבי היישובים — התנגדו לעקירת קהילות."
      en: "The law that implemented the evacuation of all Israeli settlements and the military withdrawal from the Gaza Strip (and four communities in the northern West Bank). It deeply split Israeli society: supporters saw it as reducing friction, while opponents — chiefly the settlers — objected to uprooting communities."
      es: "La ley que ejecutó la evacuación de todos los asentamientos israelíes y la retirada militar de la Franja de Gaza (y de cuatro comunidades del norte de Cisjordania). Dividió profundamente a la sociedad israelí: sus partidarios la veían como una reducción de la fricción, mientras sus opositores — sobre todo los colonos — rechazaban el desarraigo de comunidades."
      fr: "La loi qui a mis en œuvre l’évacuation de toutes les implantations israéliennes et le retrait militaire de la bande de Gaza (et de quatre localités du nord de la Cisjordanie). Elle a profondément divisé la société israélienne : ses partisans y voyaient une réduction des frictions, ses opposants — surtout les colons — refusaient le déracinement de communautés."
    sourceUrl: "https://en.wikipedia.org/wiki/Israeli_disengagement_from_the_Gaza_Strip"
  - year: 2003
    title:
      he: "חוק האזרחות והכניסה לישראל (2003)"
      en: "The Citizenship and Entry into Israel Law (2003)"
      es: "La Ley de Ciudadanía y Entrada en Israel (2003)"
      fr: "La loi sur la citoyenneté et l’entrée en Israël (2003)"
    summary:
      he: "הוראת שעה המגבילה איחוד משפחות והענקת מעמד לפלסטינים מהגדה ומעזה הנשואים לאזרחי ישראל. תומכים נימקו אותה בשיקולי ביטחון; מבקרים, ובהם ארגוני זכויות אדם, טענו שהיא פוגעת בזכות לחיי משפחה ובעיקר במשפחות ערביות."
      en: "A temporary order restricting family reunification and the granting of status to Palestinians from the West Bank and Gaza who are married to Israeli citizens. Supporters justified it on security grounds; critics, including human-rights groups, argued it harms the right to family life, mainly for Arab families."
      es: "Una disposición temporal que restringe la reunificación familiar y la concesión de estatus a palestinos de Cisjordania y Gaza casados con ciudadanos israelíes. Sus partidarios la justificaron por motivos de seguridad; sus críticos, incluidas organizaciones de derechos humanos, sostenían que vulnera el derecho a la vida familiar, sobre todo de las familias árabes."
      fr: "Une disposition temporaire restreignant le regroupement familial et l’octroi d’un statut aux Palestiniens de Cisjordanie et de Gaza mariés à des citoyens israéliens. Ses partisans l’ont justifiée par des motifs de sécurité ; ses détracteurs, dont des organisations de défense des droits humains, estimaient qu’elle porte atteinte au droit à la vie familiale, surtout pour les familles arabes."
    sourceUrl: "https://en.wikipedia.org/wiki/Citizenship_and_Entry_into_Israel_Law"
