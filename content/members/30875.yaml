  - kind: positive
    category: achievement
    title:
      he: חברת הכנסת ה-25 מטעם הליכוד
      en: Member of the 25th Knesset for Likud
    description:
      he: >-
        בספטמבר 2022 שריין יו"ר הליכוד בנימין נתניהו את מלקו במקום ה-37 ברשימת
        הליכוד לכנסת ה-25. היא נכנסה לכנסת בפברואר 2023 (לפי רישומי הכנסת, מ-10
        בפברואר 2023) כמחליפה של אופיר אקוניס שהתפטר מכוח החוק הנורווגי, ומאז
        מכהנת כחברת כנסת מטעם סיעת הליכוד.
      en: >-
        In September 2022 Likud chairman Benjamin Netanyahu placed Melaku in a
        reserved 37th slot on the Likud list for the 25th Knesset. She entered the
        Knesset in February 2023 (from 10 February 2023 according to the Knesset
        record), replacing Ofir Akunis, who resigned under the Norwegian Law, and
        has since served as a Likud MK.
    date: "2023-02-10"
    sources:
      - url: https://main.knesset.gov.il/mk/apps/mk/mk-personal-details/30875
        title: Tsega Melaku - personal details (Knesset website)
        publisher: Knesset
      - url: https://www.israelhayom.co.il/news/politics/article/13066288
        title: הירש בחוץ, שיקלי שוריין במקום ה-14 - זו רשימת הליכוד המלאה
        publisher: Israel Hayom
      - url: https://en.wikipedia.org/wiki/Tsega_Melaku
        title: Tsega Melaku
        publisher: Wikipedia
  - kind: positive
    category: volunteering
    title:
      he: פעילות ציבורית למען יוצאי אתיופיה; יו"ר צוות "הנכחה חיובית" בצוות פלמור (2016)
      en: Public activism for Ethiopian-Israelis; chaired the "positive presence" sub-team of the Palmor task force (2016)
    description:
      he: >-
        מלקו פעילה רבת שנים למען שוויון ליוצאי אתיופיה, בין היתר במחאות 1996 בעקבות
        פרשת תרומות הדם. ב-2016 כיהנה כיו"ר צוות "הנכחה חיובית" בצוות הבין-משרדי
        למיגור הגזענות נגד יוצאי אתיופיה בראשות מנכ"לית משרד המשפטים אמי פלמור,
        שדוחו המסכם הוגש ביולי 2016. ספרה האוטוביוגרפי "לא בבית ספרנו" ראה אור
        ב-2014.
      en: >-
        Melaku has long campaigned for equality for Ethiopian-Israelis, including in
        the 1996 protests over the blood-donation affair. In 2016 she chaired the
        "positive presence" sub-team of the inter-ministerial task force against
        racism toward Ethiopian-Israelis, headed by Justice Ministry
        director-general Emi Palmor, whose final report was submitted in July 2016.
        Her autobiographical book "Not in Our School" was published in 2014.
    date: "2016-07"
    sources:
