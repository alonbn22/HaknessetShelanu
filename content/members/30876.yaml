  - kind: neutral
    category: news
    date: "2026-05-11"
    title:
      he: הגיש הצעת חוק להארכת ההקלות לערוצים הייעודיים, ובהם ערוץ 14, עד פברואר 2027
      en: Submitted a bill to extend the regulatory relief for designated channels, including Channel 14, until February 2027
    description:
      he: ב-11 במאי 2026 הגיש שקלים הצעת חוק להארכה בשנה, עד פברואר 2027, של ההקלות לערוצים הייעודיים — ובהם ערוץ 14 — הפוטרות אותם מדמי הפצה במערך "עידן פלוס" ומחייבות מופחתות של הפקה. לפי כלכליסט, ההקלות הוארכו כבר כמה פעמים מאז פברואר 2023 בציפייה לחוק השידורים של השר שלמה קרעי, והמבקרים טוענים כי הן מעניקות לערוץ 14 יתרון כלכלי מול ערוצים 12 ו-13.
      en: On 11 May 2026 Shekalim submitted a bill to extend by one year, until February 2027, the regulatory relief for designated channels — including Channel 14 — which exempts them from distribution fees on the "Idan Plus" platform and imposes reduced production obligations. According to Calcalist, the relief has been extended several times since February 2023 pending Minister Shlomo Karhi's broadcasting law, and critics argue it gives Channel 14 an economic advantage over Channels 12 and 13.
    sources:
      - url: https://www.calcalist.co.il/local_news/article/s1q1siyyzx
        title: 'בצל הבחירות: בליכוד רוצים להגן על ערוץ 14 לפני פיזור הכנסת'
        publisher: Calcalist
  - kind: neutral
