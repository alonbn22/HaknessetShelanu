      he: דורג במקום ה-33 בפריימריז הליכוד, מחוץ למקומות הריאליים
      en: Placed 33rd in the Likud primary, outside the realistic slots
    description:
      he: בפריימריז הליכוד לכנסת ה-26 שנערכו ב-17 באוגוסט 2026 דורג ואטורי במקום ה-33 ברשימה הארצית, מחוץ למקומות שהוגדרו בתקשורת כריאליים לקראת הבחירות ב-27 באוקטובר 2026.
      en: In the Likud primary for the 26th Knesset held on 17 August 2026, Vaturi placed 33rd on the national list, outside the slots described in the press as realistic ahead of the 27 October 2026 election.
