    title:
      he: "עולה מאתיופיה, רב וקצין בכיר בצנחנים שנבחר לכנסת ה-25"
      en: "Ethiopian-born immigrant, rabbi and senior paratrooper officer elected to the 25th Knesset"
    description:
      he: "משה סולומון נולד ב-1975 בשירה שבאזור תיגראי באתיופיה, ועלה לישראל ב-1983 כילד לאחר מסע רגלי ארוך לסודאן. הוא שירת בגדוד 890 של חטיבת הצנחנים, שימש במילואים מג\"ד והוא בדרגת סגן-אלוף (מיל'); הוא בוגר ישיבת הר עציון ומוסמך לרבנות. סולומון נבחר לכנסת ה-25 במקום ה-14 ברשימת הציונות הדתית בבחירות נובמבר 2022."
      en: "Moshe Solomon was born in 1975 in Shire, in Ethiopia's Tigray region, and immigrated to Israel in 1983 as a child after a long overland journey to Sudan. He served in Battalion 890 of the Paratroopers Brigade, commanded a battalion in the reserves and holds the rank of lieutenant colonel (res.); he studied at Yeshivat Har Etzion and was ordained as a rabbi. Solomon was elected to the 25th Knesset in 14th place on the Religious Zionism list in the November 2022 election."
    date: "2022-11-15"
