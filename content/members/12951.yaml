claims:
  - kind: positive
    category: achievement
    title:
      he: כהונה ארוכת שנים בכנסת, יו"ר הכנסת ושורת תפקידי שר
      en: Long parliamentary career, Knesset Speaker and multiple ministerial posts
    description:
      he: יריב לוין מכהן כחבר הכנסת מטעם הליכוד מאז 2009. הוא שימש יושב ראש הכנסת (2020-2021 ושוב בדצמבר 2022), שר התיירות, השר לביטחון פנים ושר העלייה והקליטה בפועל, ומאז 2022 מכהן כסגן ראש הממשלה ושר המשפטים.
      en: Yariv Levin has served as a Likud member of the Knesset since 2009. He held the office of Speaker of the Knesset (2020-2021 and again in December 2022), and served as Minister of Tourism, Minister of Public Security and acting Minister of Aliyah and Integration. Since 2022 he has served as Deputy Prime Minister and Minister of Justice.
    date: 2009-02-24
    sources:
      - url: https://en.wikipedia.org/wiki/Yariv_Levin
        title: Yariv Levin
        publisher: Wikipedia
      - url: https://www.jewishvirtuallibrary.org/yariv-levin
        title: Yariv Levin
        publisher: Jewish Virtual Library
  - kind: positive
    category: achievement
    title:
      he: שירות צבאי בחיל המודיעין כמתרגם ערבית
      en: Military service in the Intelligence Corps as an Arabic translator
    description:
      he: לוין שירת בצבא ההגנה לישראל בחיל המודיעין כמתרגם מערבית ובהמשך כמפקד קורס תרגום ערבית. בשנת 1995 פרסם מילון מונחים כלכליים בעברית, ערבית ואנגלית.
      en: Levin served in the Israel Defense Forces' Intelligence Corps as an Arabic translator and later as commander of an Arabic translation course. In 1995 he published a dictionary of economic terms in Hebrew, Arabic and English.
    sources:
      - url: https://en.wikipedia.org/wiki/Yariv_Levin
        title: Yariv Levin
        publisher: Wikipedia
