      he: יוזם הרפורמה המשפטית השנויה במחלוקת של 2023
      en: Architect of the controversial 2023 judicial reform
    description:
      he: ב-4 בינואר 2023, בתפקידו כשר המשפטים, הציג לוין תכנית לשינוי מערכת המשפט
        בישראל, שכללה בין היתר שינוי הרכב הוועדה לבחירת שופטים, הגבלת הביקורת
        השיפוטית של בית המשפט העליון וסעיף התגברות. התכנית עוררה מחלוקת ציבורית
        נרחבת והפגנות המוניות ברחבי הארץ. מדובר בפעולת מדיניות פומבית ולא בהליך
        פלילי; לא הוגש נגד לוין כתב אישום ולא הורשע בפלילים בהקשר זה.
      en: On 4 January 2023, in his capacity as Minister of Justice, Levin presented a
        plan to overhaul Israel's judicial system, including changing the
        composition of the Judicial Selection Committee, limiting the Supreme
        Court's judicial review, and an override clause. The plan sparked
        widespread public controversy and large-scale nationwide protests. This
        refers to a public policy action, not a criminal proceeding; Levin has
        not been indicted or convicted in connection with it.
