    title:
      he: "אסיר ציון לשעבר: נכלא בברית המועצות על הוראת עברית"
      en: "Former Prisoner of Zion, jailed in the Soviet Union for teaching Hebrew"
    description:
      he: "אדלשטיין, מסורבי העלייה הבולטים במוסקבה, נעצר ב-1984 באשמת החזקת סמים שלפי הדיווחים בוימה על ידי הק.ג.ב בשל הוראת עברית, ונידון לשלוש שנות עבודת פרך. הוא ריצה כשנתיים ושמונה חודשים במחנות עבודה בסיביר, שוחרר במאי 1987 ועלה לישראל כחודשיים לאחר מכן."
      en: "Edelstein, a prominent Moscow refusenik, was arrested in 1984 on a drug-possession charge that reports describe as fabricated by the KGB because he taught Hebrew, and was sentenced to three years of hard labour. He served about two years and eight months in Siberian labour camps, was released in May 1987 and immigrated to Israel roughly two months later."
