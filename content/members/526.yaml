    title:
      he: סגן שר הדתות וחבר כנסת ותיק
      en: Deputy Minister of Religious Affairs and veteran legislator
    description:
      he: משה גפני נבחר לראשונה לכנסת ברשימת דגל התורה בשנת 1988. בשנת 1990 התמנה לסגן
        שר הדתות בממשלתו של יצחק שמיר. לאחר שהפסיד את מושבו, שב לכנסת בשנת 1994
        במסגרת הסכם רוטציה, ומאז הוא מהדמויות הוותיקות בפוליטיקה החרדית בישראל.
      en: Moshe Gafni was first elected to the Knesset on the Degel HaTorah list in
        1988. In 1990 he was appointed Deputy Minister of Religious Affairs in
        Yitzhak Shamir's government. After losing his seat he returned to the
        Knesset in 1994 under a rotation agreement, and has since been one of
        the most veteran figures in Israeli Haredi politics.
