      he: דורגה במקום ה-24 בפריימריז של הליכוד; לא במקום ריאלי ברשימה הסופית לבחירות 2026
      en: Ranked 24th in the Likud primary; not in a realistic slot on the final list for the 2026 election
    description:
      he: בפריימריז של הליכוד שנערכו ב-17 באוגוסט 2026 (שיעור הצבעה של כ-53%) דורגה
        שטרית במקום ה-24 ברשימה הארצית; בראש הדירוג אלי כהן, אמיר אוחנה ויריב
        לוין. ברשימה הסופית בת 35 המועמדים שהגיש הליכוד ב-8 בספטמבר 2026, לאחר
        שיבוץ המקומות השמורים, שטרית אינה נמנית עם 30 המקומות הראשונים, וג'רוזלם
        פוסט תיאר אותה כמי שלא הגיעה למקום ריאלי.
      en: In the Likud primary held on 17 August 2026 (about 53% turnout) Shitrit was
        ranked 24th on the national list; Eli Cohen, Amir Ohana and Yariv Levin
        topped the ranking. On the final 35-candidate slate Likud submitted on 8
        September 2026, after reserved slots were filled, Shitrit is not among
        the first 30 places, and The Jerusalem Post described her as not having
        reached a realistic slot.
