  - kind: negative
    category: controversy
    title:
      he: נפסלה ממועמדות לבחירות 2015 בשל אי-השלמת תקופת צינון
      en: Disqualified from 2015 candidacy over the cooling-off period
    description:
      he: >-
        ב-26 בינואר 2015 פסל יו"ר ועדת הבחירות המרכזית, השופט סלים ג'ובראן, את
        מועמדותה של מלקו במקום השלישי ברשימת "כולנו" לכנסת ה-20, בקביעה שכעובדת
        בכירה ברשות השידור לא השלימה את תקופת הצינון בת 100 הימים הנדרשת בחוק
        לפני מועד הבחירות. השופט ציין כי הוא מודע לפגיעה בזכותה להיבחר וכי הציבור,
        ובפרט יוצאי אתיופיה, היה מרוויח מבחירתה. "כולנו" הביעה צער על ההחלטה
        ומסרה כי הסתמכה על חוות דעת שלפיה מותר לה להתמודד. מדובר בהחלטה מנהלית
        של ועדת הבחירות ולא בהליך פלילי.
      en: >-
        On 26 January 2015 the chairman of the Central Elections Committee, Justice
        Salim Joubran, disqualified Melaku's candidacy in the third slot on the
        Kulanu list for the 20th Knesset, ruling that as a senior employee of the
        Israel Broadcasting Authority she had not completed the 100-day cooling-off
        period the law requires before an election. The judge noted that he was
        aware the decision harmed her right to run and that the public, especially
        the Ethiopian community, would have benefited from her election. Kulanu said
        it regretted the decision and had relied on advice that she was allowed to
        run. This was an administrative elections-committee ruling, not a criminal
        proceeding.
    date: "2015-01-26"
