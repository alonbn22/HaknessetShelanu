    title:
      he: משיכת הצעת החוק לפיצול סמכויות היועץ המשפטי לממשלה
      en: Withdrawal of bill to split the attorney general's powers
      ar: سحب مشروع قانون لتقسيم صلاحيات المستشار القضائي للحكومة
      ru: Отзыв законопроекта о разделении полномочий юридического советника правительства
    description:
      he: ביולי 2023 הגיש דלל הצעת חוק להעברת סמכויות האכיפה הפלילית כלפי חברי ממשלה מהיועץ המשפטי לממשלה לפרקליט המדינה. לאחר ביקורת ציבורית, ולאחר שהליכוד הבהיר כי ההצעה לא תואמה עם ראשות הקואליציה ולא תקודם ללא אישורה, הודיע דלל על משיכת ההצעה, ומסר כי הדבר נעשה בהיעדר כוונה לקדם את החוק בכנסת הנוכחית ו"מתוך רצון אמיתי וכן לשיח, פשרות והסכמות" עם חברי האופוזיציה.
      en: In July 2023, Dallal submitted a bill to transfer criminal-enforcement powers over government members from the attorney general to the state prosecutor. Following public criticism, and after Likud stated the bill had not been coordinated with the coalition leadership and would not advance without its approval, Dallal announced he was withdrawing it, saying he did not intend to advance the law in the current Knesset and citing "a genuine desire for dialogue, compromises and agreements" with opposition colleagues.
      ru: В июле 2023 года Далаль внёс законопроект о передаче полномочий уголовного преследования членов правительства от юридического советника правительства государственному прокурору. После публичной критики и заявления «Ликуда», что законопроект не был согласован с руководством коалиции, Далаль объявил об отзыве инициативы, сославшись на стремление к диалогу и договорённостям с оппозицией.
