  - kind: positive
    category: achievement
    title:
      he: פורצת דרך לנשים בחיל התקשוב
      en: Trailblazer for women in the IDF's C4I Corps
    description:
      he: במהלך שירותה הצבאי הייתה ניר פורצת דרך לנשים בתפקידי הדרכה ושטח בחיל הקשר והתקשוב, ובהם מפקדת צוות בהשלמה החילית, ראש מדור הדרכה בבה"ד 7, קצינת קשר חטיבתית באוגדת עזה ומג"דית קשר בפיקוד המרכז. ב-2015 הייתה לאישה הראשונה שפיקדה על בית הספר הלאומי לתקשוב (בה"ד 7).
      en: During her military service Nir was a trailblazer for women in training and field roles in the Signal/C4I Corps, among them team commander in the corps' officer completion course, head of the training section at Bahad 7, brigade signal officer in the Gaza Division and commander of the Central Command signal battalion. In 2015 she became the first woman to command the C4I national training base (Bahad 7).
      ar: خلال خدمتها العسكرية كانت نير رائدة للنساء في مناصب التدريب والمناصب الميدانية في سلاح الإشارة والاتصالات والحوسبة، ومن بينها قائدة فريق في دورة الاستكمال للضباط التابعة للسلاح، ورئيسة قسم التدريب في بهاد 7، وضابطة إشارة لواء في فرقة غزة، وقائدة كتيبة الإشارة في قيادة المنطقة الوسطى. وفي عام 2015 أصبحت أول امرأة تقود المدرسة الوطنية للاتصالات والحوسبة (بهاد 7).
      ru: Во время военной службы Нир была первопроходцем для женщин на учебных и полевых должностях в войсках связи и C4I, в том числе командиром группы на офицерском курсе доподготовки рода войск, начальником учебного отделения в Бахад 7, офицером связи бригады в дивизии «Газа» и командиром батальона связи Центрального военного округа. В 2015 году она стала первой женщиной, командовавшей национальной школой связи и C4I (Бахад 7).
      es: Durante su servicio militar, Nir fue pionera para las mujeres en puestos de instrucción y de campo del Cuerpo de Transmisiones y C4I, entre ellos jefa de equipo en el curso de perfeccionamiento de oficiales del cuerpo, jefa de la sección de instrucción en Bahad 7, oficial de transmisiones de brigada en la División de Gaza y comandante del batallón de transmisiones del Comando Central. En 2015 se convirtió en la primera mujer al mando de la escuela nacional de C4I (Bahad 7).
      fr: Pendant son service militaire, Nir a été une pionnière pour les femmes dans des postes d'instruction et de terrain du corps des transmissions et C4I, notamment cheffe d'équipe au cours de perfectionnement des officiers du corps, cheffe de la section d'instruction de Bahad 7, officière des transmissions de brigade dans la division de Gaza et commandante du bataillon des transmissions du commandement Centre. En 2015, elle est devenue la première femme à commander l'école nationale C4I (Bahad 7).
