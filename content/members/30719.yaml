    title:
      he: חבר הכנסת היהודי היחיד בסיעת חד"ש
      en: The sole Jewish member of the Hadash faction in the Knesset
    description:
      he: עופר כסיף נבחר לכנסת לראשונה באפריל 2019 ברשימת חד"ש (במסגרת חד"ש-תע"ל) והוא
        חבר הכנסת היהודי היחיד במפלגה הערבית-יהודית. כסיף, חבר המפלגה
        הקומוניסטית הישראלית, נבחר מחדש בבחירות ספטמבר 2019, 2020 ו-2021.
      en: Ofer Cassif was first elected to the Knesset in April 2019 on the Hadash
        list (within the Hadash-Ta'al alliance) and is the only Jewish member of
        the Arab-Jewish party. A member of the Communist Party of Israel, he was
        re-elected in the September 2019, 2020 and 2021 elections.
    date: 2019-04-09
