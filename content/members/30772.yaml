    title:
      he: חקירת משטרה בפרשת הפריצה לבסיס שדה תימן
      en: Police investigation over the Sde Teiman base break-in
      ar: تحقيق شرطي في قضية اقتحام قاعدة سديه تيمان
      ru: Полицейское расследование по делу о проникновении на базу Сде-Тейман
    description:
      he: ב-26 במרץ 2025 אישרו היועצת המשפטית לממשלה ופרקליט המדינה לזמן לחקירה באזהרה את השר אמיחי אליהו ואת חברי הכנסת ניסים ואטורי וצבי סוכות בחשד למעורבות בפריצה לבסיס שדה תימן ביולי 2024. ואטורי הודיע שלא יתייצב לחקירה וטען שמדובר במהלך פוליטי סלקטיבי. נכון למרץ 2026 החקירה המשטרתית הסתיימה והתיק הועבר להכרעת הפרקליטות; לא הוגש כתב אישום.
      en: On 26 March 2025 the Attorney General and State Prosecutor authorized questioning under caution of Minister Amichai Eliyahu and MKs Nissim Vaturi and Zvi Sukkot over suspected involvement in the July 2024 break-in to the Sde Teiman military base. Vaturi announced he would not appear for questioning, calling it politically selective. As of March 2026 the police investigation had concluded and the file was transferred to the State Prosecutor for a decision; no indictment has been filed.
      ar: في 26 مارس 2025، أذنت المستشارة القضائية للحكومة ونائب المدعي العام باستدعاء الوزير أميحاي إلياهو وعضوي الكنيست نيسيم فاتوري وتسفي سوكوت للتحقيق معهم تحت طائلة الاشتباه في تورطهم في اقتحام قاعدة سديه تيمان العسكرية في يوليو 2024. أعلن فاتوري أنه لن يمثل للتحقيق واعتبره خطوة سياسية انتقائية. وحتى مارس 2026، كان التحقيق الشرطي قد انتهى وأُحيل الملف إلى النيابة لاتخاذ قرار؛ ولم تُقدَّم لائحة اتهام.
      ru: 26 марта 2025 года юридический советник правительства и государственный прокурор санкционировали допрос под предупреждением министра Амихая Элияху и депутатов Кнессета Нисима Ватури и Цви Суккота по подозрению в причастности к проникновению на военную базу Сде-Тейман в июле 2024 года. Ватури заявил, что не явится на допрос, назвав это политически избирательным шагом. По состоянию на март 2026 года полицейское расследование завершено, а материалы дела переданы государственному прокурору для принятия решения; обвинительное заключение не предъявлено.
