      he: "נאום השואה בכנסת שזכה לשבחים רחבים"
      en: "Widely praised Holocaust Remembrance Day speech in the Knesset"
    description:
      he: "בנאום ביום הזיכרון לשואה במליאת הכנסת בינואר 2010 גינה טיבי בחריפות את הכחשת השואה והביע הזדהות עם כאב הניצולים. הנאום זכה לשבחים מצד חברי כנסת, ויו\"ר הכנסת דאז ראובן ריבלין תיאר אותו כאחד הנאומים הטובים שנישאו בנושא במליאה."
      en: "In a speech on Holocaust Remembrance Day in the Knesset plenum in January 2010, Tibi sharply condemned Holocaust denial and expressed empathy for the survivors' pain. The speech won praise from fellow members of Knesset, and then-Knesset Speaker Reuven Rivlin described it as one of the best speeches given on the subject in the plenum."
