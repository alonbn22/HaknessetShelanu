    title:
      he: ייסד את פרויקט הגיור 'נתיב' ואת בדיקות ההתאמה לתרומת מח עצם בצה"ל
      en: Established the IDF 'Nativ' conversion program and IDF bone-marrow donor
        matching
    description:
      he: "שטרן, ששימש קצין חינוך ראשי ולאחר מכן ראש אגף כוח האדם, יזם את פרויקט הגיור 'נתיב' בצה״ל (הקורס הראשון נפתח ב-2001). כן יזם את הכנסת בדיקות ההתאמה לתרומת מח עצם להליך הגיוס לצה״ל."
      en: "Stern, who served as the IDF's Chief Education Officer and then head of the Manpower Directorate, created the IDF's 'Nativ' conversion program (its first course opened in 2001). He also initiated bone-marrow donor sampling as part of IDF enlistment."
      ar: "بادر شتيرن، الذي شغل منصب ضابط التربية الرئيسي ثم رئيس شعبة القوى البشرية، إلى إنشاء مشروع التهويد «نتيف» في الجيش الإسرائيلي (افتُتحت الدورة الأولى عام 2001). كما بادر إلى إدخال فحوص التطابق للتبرع بنخاع العظم في إجراءات التجنيد."
      ru: "Штерн, служивший главным офицером по воспитательной работе, а затем начальником Управления личного состава, создал в ЦАХАЛе программу гиюра «Натив» (первый курс открылся в 2001 году). Он также инициировал взятие проб для донорства костного мозга при призыве в армию."
      es: "Stern, que fue oficial jefe de Educación y después jefe de la Dirección de Personal del ejército israelí, creó el programa de conversión «Nativ» en el ejército (su primer curso se abrió en 2001). También impulsó la toma de muestras para la donación de médula ósea como parte del alistamiento."
      fr: "Stern, qui a été officier en chef de l’éducation puis chef de la direction des ressources humaines de Tsahal, a créé le programme de conversion « Nativ » de l’armée (son premier cours a ouvert en 2001). Il a aussi lancé le prélèvement pour le don de moelle osseuse lors de l’incorporation."
