    title:
      he: "התמודד פעמיים לראשות המועצה המקומית שגב שלום וכיהן כראש האופוזיציה"
      en: "Twice ran for head of the Segev Shalom local council and led its opposition"
    description:
      he: "בבחירות המקומיות ב-2018 התמודד בן סעיד לראשות המועצה המקומית שגב שלום וזכה בכ-41% מהקולות; רשימתו זכתה בשני מושבים מתוך 11 והוא כיהן כראש האופוזיציה במועצה. בבחירות 2024 התמודד שנית וזכה בכ-45% מהקולות, אך לא נבחר."
      en: "In the 2018 local elections Bin Said ran for head of the Segev Shalom local council and won about 41% of the vote; his list won two of the council's 11 seats and he served as leader of the opposition. In the 2024 elections he ran again and won about 45% of the vote, but was not elected."
