    title:
      he: שירות צבאי כקצין בחטיבת גולני
      en: Military service as an officer in the Golani Brigade
    description:
      he: לפני כניסתו לפוליטיקה שירת ביטון בגדוד 13 של חטיבת גולני, סיים קורס קצינים
        והדריך מחזור בבית הספר לקצינים. בשירות המילואים שימש כקצין בדרגת רב-סרן.
      en: Before entering politics, Biton served in Battalion 13 of the IDF's Golani
        Brigade, completed officer training, and instructed a cohort at the
        officers' school. In reserve service he held the rank of major.
