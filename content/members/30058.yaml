        publisher: Wikipedia
  - kind: negative
    category: investigation
    status: ongoing
    date: 2026-04-19
    title:
      he: נחקר באזהרה בפרשת השחיתות בהסתדרות
      en: Questioned under caution in the Histadrut corruption probe
      ar: استُجوب تحت طائلة المسؤولية في قضية الفساد في الهستدروت
      ru: Допрошен под предупреждением по делу о коррупции в Гистадруте
    description:
      he: באפריל 2026 נחקר מיקי זוהר באזהרה בלהב 433 בחשד לשוחד, מרמה והפרת אמונים במסגרת פרשת השחיתות בהסתדרות ("יד רוחצת יד"), בקשר לזיקתו לסוכן הביטוח עזרא גבאי. זוהר הכחיש כל קשר לפרשה ואמר כי "אין לי כל קשר לעניין". נכון ליולי 2026 מדובר בחקירה בלבד ולא הוגש כתב אישום; חלה חזקת החפות.
      en: In April 2026 Miki Zohar was questioned under caution by the Lahav 433 unit on suspicion of bribery, fraud and breach of trust as part of the Histadrut corruption probe ("One Hand Washes the Other"), over his ties to insurance agent Ezra Gabay. Zohar denied any connection, stating he has "no connection whatsoever to the case." As of July 2026 the matter remains at the investigation stage with no indictment filed; the presumption of innocence applies.
      ar: في أبريل 2026 استُجوب ميكي زوهر تحت طائلة المسؤولية من قبل وحدة لاهف 433 للاشتباه بالرشوة والاحتيال وخيانة الأمانة ضمن قضية الفساد في الهستدروت، على خلفية علاقته بوكيل التأمين عزرا غباي. نفى زوهر أي صلة بالقضية. حتى يوليو 2026 لا تزال القضية في مرحلة التحقيق دون توجيه لائحة اتهام، وتُطبَّق قرينة البراءة.
      ru: В апреле 2026 года Мики Зохар был допрошен под предупреждением подразделением «Лахав 433» по подозрению во взяточничестве, мошенничестве и злоупотреблении доверием в рамках дела о коррупции в Гистадруте, в связи с его связями со страховым агентом Эзрой Габаем. Зохар отрицает какую-либо причастность. По состоянию на июль 2026 года дело находится на стадии расследования, обвинительное заключение не предъявлено; действует презумпция невиновности.
    sources:
