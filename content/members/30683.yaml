    title:
      he: "הודיע על פרישה ממפלגת כחול לבן"
      en: "Announced his departure from the Blue and White party"
    description:
      he: "ב-3 במאי 2026 הודיע טרופר ליו\"ר כחול לבן בני גנץ על פרישתו מהמפלגה, וכתב כי \"השפעה משמעותית כבר אינה אפשרית במפלגת כחול לבן\". ב-5 במאי נמסר כי טרופר יישאר חבר כנסת ויפעל בתיאום עם גנץ בעניינים פרלמנטריים, כדי שלא להוסיף מנדט לקואליציה."
      en: "On 3 May 2026 Tropper informed Blue and White chairman Benny Gantz that he was leaving the party, writing that \"significant influence is no longer possible in the Blue and White party.\" On 5 May it was announced that Tropper would remain a Knesset member and coordinate with Gantz on parliamentary matters, so as not to add a seat to the coalition."
