  - kind: positive
    category: achievement
    title:
      he: יו"ר ועדת הפנים והגנת הסביבה של הכנסת (2021–2022)
      en: Chairman of the Knesset Internal Affairs and Environment Committee (2021–2022)
    description:
      he: בספטמבר 2021 נבחר טאהא ליו"ר ועדת הפנים והגנת הסביבה של הכנסת, לאחר שמינויו
        אושר ברוב של 6 מול 4. הוא החליף בתפקיד את חברו לסיעה סעיד אלחרומי שנפטר.
      en: In September 2021 Taha was selected as chairman of the Knesset Internal
        Affairs and Environment Committee, with his nomination approved by a 6-4
        vote. He took over the role following the death of his faction colleague
        Said al-Harumi, and held the post until the end of the 24th Knesset in November 2022.
    date: 2021-09-12
