# How each running list describes itself, in its own words: the "How they
# describe themselves" filters of the party finder (/elections/find).
#
# The rule (the owner's standing rule): a list gets a label ONLY where the list
# itself uses those words: its own site, its platform or charter, its
# registered name at the Central Elections Committee (or the registered name of
# the party its head is filed under), or its leader quoted in a major outlet.
# Never a reporter's description, another candidate's words, a co-submitting
# party's words, or an inference from policy. A list with no such words on a
# dimension has no tag there and the finder shows it as "didn't say". The site
# never assigns labels. One exception, for one value: liberal-on-religion is a
# stance by nature, so an explicit religion-and-state principle ("no religious
# coercion", "freedom from religion", "separation of religion and state")
# counts for it; the finder labels it "against religious coercion".
#
# Researched 27 Sep 2026: every page cited here was read live that day, and the
# quotes were re-checked on the live pages on 28 Sep, all but Likud's (its
# constitution is a PDF with a garbled text layer; the research read it
# rendered). Research notes, with what was tried for every list and the
# borderline items left out: scratchpad self-descriptions.yaml. Editorial
# decisions, 27 Sep 2026:
# - Included from the research, with their quotes and sources; the notes are
#   rewritten for readers (who said it, or which document it is).
# - Excluded: Amkha's zionist and free-market tags (from an unlisted, noindex
#   platform page, which the site already holds back); every borderline item
#   (the #2's or a co-submitter's words, a reporter's wording, a value the
#   words only imply); Blue and White has no tag at all.
# - Likud has no camp tag: its constitution says "national-liberal", not "right".
# - Religious Zionism–Zehut's right rests on a 2022 campaign page still on the
#   party's site; its quote is trimmed to the words about the government,
#   dropping the part about other parties.
# - The Joint List's left, socialist, communist and liberal-on-religion tags
#   are the words of Maki (the Israeli Communist Party), the party the list's
#   head is filed under, and each note says so; jewish-arab is the head's own.
# - No list calls itself "center" in its own words, so there is no such value.
# - Likud's constitution is cited on its landing page. The address the compass
#   cites (/על-הליכוד/חוקת-הליכוד) answered 404 on 28 Sep; the site's own menu
#   now links /about/חוקת-הליכוד.
#
# Dimensions and values (src/lib/content.ts rejects any other pair):
#   camp: right | left
#   religion: religious | religious-zionist | haredi | liberal-on-religion
#   community: arab | jewish-arab | sephardi
#   economy: free-market | social-democratic | socialist | communist
#   national: zionist | national
# quote.he is verbatim, 25 words or fewer ("…" marks an omission; " / " joins
# two elements of the same page); en/ar/ru/es/fr are faithful translations.
# `note` is shown in parentheses after the quote; `&name` / `*name` reuse one
# quote, note or source where the same words carry two labels. Only right and
# left are opposites: in the finder, a list tagged "national" is not counted
# as differing from "zionist", it just didn't say it.
lastReviewed: "2026-09-27"
