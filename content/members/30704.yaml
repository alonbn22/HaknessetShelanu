    title:
      he: "בג\"ץ ביטל מינויים למועצת הרשות השנייה; קרעי תקף את ההחלטה"
      en: "High Court annulled appointments to the Second Authority council; Karhi attacked the ruling"
    description:
      he: "ב-8 בספטמבר 2026 ביטל בג\"ץ פה אחד שלושה מינויים למועצת הרשות השנייה לטלוויזיה ורדיו, ובהם מינוי היו\"ר, בין היתר בשל ניגוד עניינים ובדיקה לקויה של התבטאויות המועמדים. קרעי טען כי לבית המשפט אין סמכות לבטל את המינויים והצהיר כי הקואליציה תשלים את הרפורמה במערכת המשפט."
      en: "On 8 September 2026 the High Court unanimously annulled three appointments to the council of the Second Authority for Television and Radio, including its chair, citing among other things a conflict of interest and inadequate vetting of the candidates' statements. Karhi asserted that the court had no authority to annul the appointments and declared that the coalition would complete the judicial overhaul."
    sources:
