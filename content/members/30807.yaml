      he: 'רקע מקצועי: עורך דין, רב ומנכ"ל התנועה הרפורמית'
      en: "Professional background: attorney, rabbi and head of the Reform movement"
    description:
      he: קריב הוא עורך דין ורב רפורמי, בעל תואר במשפטים ובמדעי היהדות מהאוניברסיטה העברית והסמכה לרבנות מהיברו יוניון קולג'. בין 2009 ל-2021 כיהן כמנכ"ל התנועה ליהדות מתקדמת בישראל, ושירת בעבר בחיל המודיעין של צה"ל.
      en: Kariv is an attorney and Reform rabbi with a degree in law and Jewish studies from the Hebrew University and rabbinic ordination from Hebrew Union College. From 2009 to 2021 he served as executive director of the Israel Movement for Reform and Progressive Judaism, and earlier served in the IDF Intelligence Corps.
