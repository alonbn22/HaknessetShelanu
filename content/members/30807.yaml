    title:
      he: שובץ במקום השלישי ברשימת הדמוקרטים לכנסת ה-26
      en: Placed third on The Democrats' list for the 26th Knesset
    description:
      he: בפריימריז מפלגת הדמוקרטים שנערכו ב-20 ביולי 2026 (יותר מ-97 אלף מצביעים, 86% הצבעה) דורג קריב במקום השני מבין המתמודדים, אחרי נעמה לזימי, ושובץ במקום השלישי ברשימה לבחירות ב-27 באוקטובר 2026, אחרי יו"ר המפלגה יאיר גולן ולזימי.
      en: In The Democrats' primary held on 20 July 2026 (over 97,000 voters, 86% turnout) Kariv placed second among the candidates, after Naama Lazimi, and was placed third on the list for the 27 October 2026 election, after party chairman Yair Golan and Lazimi.
