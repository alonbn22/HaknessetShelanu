  - id: law-of-return
    topic: society
    lean: right
    text:
      he: "יש לבטל את 'סעיף הנכד' בחוק השבות, כך שנכדים של יהודים לא יהיו עוד זכאים לעלות מכוחו."
      en: "The 'grandchild clause' of the Law of Return should be cancelled, so that grandchildren of Jews would no longer be eligible to immigrate under it."
      ar: "يجب إلغاء «بند الحفيد» في قانون العودة، بحيث لا يعود أحفاد اليهود مؤهلين للهجرة بموجبه."
      ru: "«Пункт о внуках» в Законе о возвращении следует отменить, чтобы внуки евреев больше не имели права репатриироваться по нему."
      es: "Debería eliminarse la «cláusula del nieto» de la Ley del Retorno, de modo que los nietos de judíos ya no puedan inmigrar bajo ella."
      fr: "La « clause du petit-enfant » de la Loi du retour devrait être supprimée, afin que les petits-enfants de Juifs ne puissent plus immigrer à ce titre."
    short:
      he: "סעיף הנכד בחוק השבות"
      en: "The grandchild clause"
      ar: "بند الحفيد في قانون العودة"
      ru: "Пункт о внуках в Законе о возвращении"
      es: "La cláusula del nieto"
      fr: "La clause du petit-enfant"
    explainer:
      he: "חוק השבות מאפשר לכל יהודי לעלות לישראל, וגם לילדיו ולנכדיו ולבני הזוג של כל אלה — גם אם אינם יהודים לפי ההלכה. התומכים בביטול אומרים שכך מגיעים עולים רבים שאינם יהודים ושהחוק סטה מכוונתו; המתנגדים אומרים שהחוק הוא הבטחה לכל מי שנרדף בגלל יהדותו, ושהביטול יפגע בעלייה מברית המועצות לשעבר ובקשר עם יהודי התפוצות."
      en: "The Law of Return lets every Jew immigrate to Israel, and also their children and grandchildren, and the spouses of all of these — even if they are not Jewish under religious law. Supporters of cancelling the clause say it brings many non-Jewish immigrants and has strayed from the law's purpose; opponents say the law is a promise to anyone persecuted for being Jewish, and that cancelling it would hurt immigration from the former Soviet Union and ties with Diaspora Jews."
      ar: "يتيح قانون العودة لكل يهودي الهجرة إلى إسرائيل، وكذلك لأبنائه وأحفاده، ولأزواج كل هؤلاء — حتى لو لم يكونوا يهودًا وفق الشريعة اليهودية. يقول مؤيدو الإلغاء إن البند يجلب كثيرًا من المهاجرين غير اليهود وإنه انحرف عن غاية القانون؛ ويقول المعارضون إن القانون وعد لكل من اضطُهد بسبب يهوديته، وإن إلغاءه سيضرّ بالهجرة من الاتحاد السوفياتي السابق وبالعلاقة مع يهود الشتات."
      ru: "Закон о возвращении позволяет каждому еврею репатриироваться в Израиль, а также его детям и внукам и супругам их всех — даже если они не евреи по религиозному закону. Сторонники отмены пункта говорят, что он приводит много нееврейских репатриантов и отклонился от цели закона; противники — что закон — обещание каждому, кого преследовали за еврейство, и что отмена ударит по репатриации из бывшего СССР и по связям с евреями диаспоры."
      es: "La Ley del Retorno permite a todo judío inmigrar a Israel, y también a sus hijos y nietos, y a los cónyuges de todos ellos — aunque no sean judíos según la ley religiosa. Quienes apoyan eliminar la cláusula dicen que trae a muchos inmigrantes no judíos y que se ha desviado del propósito de la ley; los opositores dicen que la ley es una promesa a cualquiera perseguido por ser judío, y que eliminarla dañaría la inmigración desde la antigua Unión Soviética y los lazos con los judíos de la diáspora."
      fr: "La Loi du retour permet à tout Juif d’immigrer en Israël, ainsi qu’à ses enfants et petits-enfants, et aux conjoints de tous — même s’ils ne sont pas juifs au regard de la loi religieuse. Les partisans de la suppression de la clause disent qu’elle fait venir de nombreux immigrants non juifs et s’est éloignée du but de la loi ; les opposants disent que la loi est une promesse à quiconque est persécuté pour sa judéité, et que sa suppression nuirait à l’immigration depuis l’ex-URSS et aux liens avec les Juifs de la diaspora."
    explainerSources:
      - { url: "https://www.nevo.co.il/law_html/law00/72231.htm", title: "חוק השבות, תש\"י-1950 — סעיפים 1 ו-4א", publisher: "Nevo" }
      - { url: "https://en.idi.org.il/articles/47418", title: "Coalition Agreements of the 37th Government | Amending the Grandchild Clause of the Law of Return", publisher: "המכון הישראלי לדמוקרטיה" }
    stances:
      rz-zehut:
        value: 2
        basis: statement
        source: { url: "https://news.walla.co.il/item/3544290", title: "סמוטריץ' סותר את נתניהו: נעמוד על ביטול סעיף הנכד בחוק השבות — ריאיון לקול ברמה (2022-12-05)", publisher: "וואלה" }
        quote:
          he: "\"נעמוד על זה, זה אחד האיומים הכי גדולים על הדמוגרפיה הישראלית, על זהות היהודית של המדינה וההתבוללות… אנחנו מתעקשים על זה ונמשיך להתעקש על זה.\""
          en: "\"We will insist on it; it is one of the greatest threats to Israel's demography, to the Jewish identity of the state, and [it drives] assimilation… We insist on it and will keep insisting on it.\""
          ar: "«سنصرّ على ذلك، فهذا من أكبر التهديدات للديموغرافيا الإسرائيلية وللهوية اليهودية للدولة و[يدفع إلى] الانصهار… نحن نصرّ على ذلك وسنواصل الإصرار عليه.»"
          ru: "«Мы будем на этом настаивать: это одна из самых больших угроз израильской демографии, еврейской идентичности государства и [ведёт к] ассимиляции… Мы настаиваем и будем настаивать на этом»."
          es: "«Insistiremos en ello; es una de las mayores amenazas para la demografía israelí, para la identidad judía del Estado y [fomenta] la asimilación… Insistimos en ello y seguiremos insistiendo.»"
          fr: "« Nous y tiendrons ; c’est l’une des plus grandes menaces pour la démographie israélienne, pour l’identité juive de l’État et [cela favorise] l’assimilation… Nous y tenons et continuerons d’y tenir. »"
