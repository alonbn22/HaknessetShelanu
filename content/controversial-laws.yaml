  - year: 2003
    title:
      he: "חוק האזרחות והכניסה לישראל (2003)"
      en: "The Citizenship and Entry into Israel Law (2003)"
      ar: "قانون المواطنة والدخول إلى إسرائيل (2003)"
      ru: "Закон о гражданстве и въезде в Израиль (2003)"
      es: "La Ley de Ciudadanía y Entrada en Israel (2003)"
      fr: "La loi sur la citoyenneté et l’entrée en Israël (2003)"
    summary:
      he: "הוראת שעה האוסרת להעניק אזרחות או רישיון לישיבה בישראל לתושבי יהודה, השומרון ועזה (למעט תושבי יישובים ישראליים שם), גם כשהם בני זוג של אזרחי ישראל; עיקר השפעתה היה על איחוד משפחות. תומכים נימקו אותה בשיקולי ביטחון; מבקרים, ובהם ארגוני זכויות אדם, טענו שהיא פוגעת בזכות לחיי משפחה, בעיקר של משפחות ערביות. בג\"ץ אישר אותה ברוב של 6 מול 5 ב-2006 ושוב ב-2012; תוקפה פקע ביולי 2021, וב-2022 נחקקה גרסה חדשה שלה."
      en: "A temporary order barring the grant of citizenship or of a permit to live in Israel to residents of the West Bank and Gaza (other than residents of Israeli settlements there), including when they are the spouses of Israeli citizens; its main effect was on family reunification. Supporters justified it on security grounds; critics, including human-rights groups, argued it harms the right to family life, mainly of Arab families. The High Court upheld it 6–5 in 2006 and again in 2012; it lapsed in July 2021, and a new version was enacted in 2022."
      ar: "أمر مؤقت يحظر منح الجنسية أو تصريح الإقامة في إسرائيل لسكان الضفة الغربية وغزة (باستثناء سكان المستوطنات الإسرائيلية هناك)، حتى حين يكونون أزواجًا لمواطنين إسرائيليين؛ وكان أثره الأساسي على لمّ شمل العائلات. برّره المؤيدون باعتبارات أمنية؛ وقال المنتقدون، ومنهم منظمات حقوق إنسان، إنه يمسّ بالحق في الحياة العائلية، ولا سيما لدى العائلات العربية. وأقرّته محكمة العدل العليا بأغلبية 6 مقابل 5 في 2006 ومجددًا في 2012؛ وانتهى سريانه في تموز/يوليو 2021، ثم سُنّت صيغة جديدة منه في 2022."
      ru: "Временное распоряжение, запрещающее предоставлять гражданство или разрешение на проживание в Израиле жителям Западного берега и Газы (кроме жителей израильских поселений там), в том числе когда они состоят в браке с гражданами Израиля; прежде всего оно затронуло воссоединение семей. Сторонники обосновывали его соображениями безопасности; критики, в том числе правозащитные организации, утверждали, что оно нарушает право на семейную жизнь — прежде всего арабских семей. БАГАЦ оставил его в силе большинством 6 против 5 в 2006 году и снова в 2012 году; в июле 2021 года срок его действия истёк, а в 2022 году была принята его новая редакция."
      es: "Una disposición temporal que prohíbe conceder la ciudadanía o un permiso de residencia en Israel a residentes de Cisjordania y Gaza (salvo los residentes de los asentamientos israelíes allí), también cuando son cónyuges de ciudadanos israelíes; su efecto principal recayó en la reunificación familiar. Sus partidarios la justificaron por motivos de seguridad; sus críticos, incluidas organizaciones de derechos humanos, sostenían que vulnera el derecho a la vida familiar, sobre todo de las familias árabes. El Tribunal Supremo la avaló por 6 votos contra 5 en 2006 y de nuevo en 2012; caducó en julio de 2021 y en 2022 se aprobó una nueva versión."
      fr: "Une disposition temporaire interdisant d’accorder la citoyenneté ou un permis de séjour en Israël aux résidents de Cisjordanie et de Gaza (hors habitants des implantations israéliennes), y compris lorsqu’ils sont conjoints de citoyens israéliens ; son effet principal a porté sur le regroupement familial. Ses partisans l’ont justifiée par des motifs de sécurité ; ses détracteurs, dont des organisations de défense des droits humains, estimaient qu’elle porte atteinte au droit à la vie familiale, surtout pour les familles arabes. La Haute Cour l’a validée par 6 voix contre 5 en 2006, puis de nouveau en 2012 ; elle a expiré en juillet 2021, et une nouvelle version a été adoptée en 2022."
