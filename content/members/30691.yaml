    title:
      he: סגן ראש המוסד (2009–2011)
      en: Deputy Director of the Mossad (2009–2011)
    description:
      he: רם בן ברק שירת כסגן ראש המוסד בין השנים 2009 ל-2011, לאחר קריירה של כ-27 שנים
        בשירות החשאי הישראלי. בהמשך הושאל לצה"ל ושימש כמתאם פעולות מיוחדות.
      en: Ram Ben-Barak served as deputy director of the Mossad from 2009 to 2011,
        following a roughly 27-year career in Israel's intelligence service. He was
        subsequently loaned to the IDF as coordinator of special operations.
