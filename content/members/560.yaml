  - kind: positive
    category: achievement
    title:
      he: רקע מקצועי כרופא ויועץ מדיני בכיר
      en: Professional background as a physician and senior political adviser
    description:
      he: לפני כניסתו לפוליטיקה הוסמך טיבי כרופא נשים, בוגר בית הספר לרפואה של
        האוניברסיטה העברית בירושלים. בין השנים 1993 ל-1999 שימש יועץ מדיני ליו"ר
        הרשות הפלסטינית יאסר ערפאת, וייצג את הצד הפלסטיני במשא ומתן בוויי ריבר
        ב-1998.
      en: Before entering politics, Tibi qualified as a gynecologist, a graduate of
        the Hebrew University of Jerusalem medical school. Between 1993 and 1999
        he served as a political adviser to Palestinian Authority leader Yasser
        Arafat, and represented the Palestinian side at the 1998 Wye River
        negotiations.
