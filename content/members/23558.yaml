  - kind: positive
    category: achievement
    title:
      he: "עורך דין ופעיל ציבור בראשון לציון"
      en: "Lawyer and local public servant in Rishon LeZion"
      ar: "محامٍ وناشط في الخدمة العامة في ريشون لتسيون"
      ru: "Юрист и общественный деятель в Ришон-ле-Ционе"
      es: "Abogado y servidor público local en Rishon LeZion"
      fr: "Avocat et élu local à Rishon LeZion"
    description:
      he: "ביטן, יליד מרוקו שעלה לישראל בגיל חמש, סיים תואר במשפטים באוניברסיטת תל אביב בשנת 1987. בשנים 1987–2005 כיהן כחבר מועצת העיר ראשון לציון, ולאחר מכן כסגן ראש העיר, לפני שהושבע כחבר כנסת בשנת 2015."
      en: "Bitan, born in Morocco and immigrating to Israel at age five, earned a law degree (LL.B) from Tel Aviv University in 1987. He was a member of the Rishon LeZion City Council from 1987 to 2005 and later deputy mayor, before being sworn in as a Member of Knesset in 2015."
      ar: "بيطان، المولود في المغرب والذي هاجر إلى إسرائيل في الخامسة من عمره، حصل على شهادة في الحقوق من جامعة تل أبيب عام 1987. كان عضوًا في مجلس بلدية ريشون لتسيون بين عامَي 1987 و2005، ثم نائبًا لرئيس البلدية، قبل أن يؤدي اليمين عضوًا في الكنيست عام 2015."
      ru: "Битан, уроженец Марокко, репатриировавшийся в Израиль в пятилетнем возрасте, в 1987 году получил степень бакалавра права в Тель-Авивском университете. В 1987–2005 годах он был членом городского совета Ришон-ле-Циона, затем заместителем мэра, а в 2015 году был приведён к присяге как депутат Кнессета."
      es: "Bitan, nacido en Marruecos e inmigrado a Israel a los cinco años, se licenció en Derecho (LL.B.) por la Universidad de Tel Aviv en 1987. Fue concejal de Rishon LeZion de 1987 a 2005 y después teniente de alcalde, antes de jurar como diputado de la Knéset en 2015."
      fr: "Bitan, né au Maroc et immigré en Israël à l’âge de cinq ans, a obtenu une licence en droit (LL.B.) à l’université de Tel-Aviv en 1987. Il a été conseiller municipal de Rishon LeZion de 1987 à 2005, puis adjoint au maire, avant de prêter serment comme député en 2015."
