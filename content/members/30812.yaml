        בנובמבר 2024.
      en: Following the formation of Israel's 37th government, Rothman was appointed
        chairman of the Knesset's Constitution, Law and Justice Committee
        (according to Hebrew Wikipedia, from 4 January 2023), one of the key
        positions in the Knesset's legislative work, a post he still holds as of
        September 2026. Per Knesset data he also chaired the Religious Zionism
        faction from 15 December 2022 to 11 November 2024.
