      he: "חברת הכנסת ה-25 מטעם יש עתיד"
      en: "Member of the 25th Knesset for Yesh Atid"
    description:
      he: "עדי עזוז, עורכת דין ופעילה חברתית, הוצבה במקום ה-27 ברשימת יש עתיד לכנסת ה-25 ונכנסה לכנסת ב-13 באוגוסט 2025 במקומו של חבר הכנסת עידן רול, שהודיע על פרישתו מהחיים הפוליטיים. היא חברה בוועדת החינוך, התרבות והספורט."
      en: "Adi Azuz, a lawyer and social activist, was placed 27th on the Yesh Atid list for the 25th Knesset and entered the Knesset on 13 August 2025 in place of MK Idan Roll, who announced his retirement from politics. She sits on the Education, Culture and Sports Committee."
