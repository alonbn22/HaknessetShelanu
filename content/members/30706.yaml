      he: חברת הכנסת מטעם הליכוד
      en: Member of Knesset for Likud
    description:
      he: קטי (קטרין) שטרית מכהנת כחברת הכנסת מטעם מפלגת הליכוד. היא נבחרה לראשונה
        לכנסת ה-21 בשנת 2019 וכיהנה ברציפות עד 2022, וחזרה לכנסת ה-25 ב-15
        בפברואר 2023 במסגרת החוק הנורווגי לאחר התפטרותה של מירי רגב.
      en: Keti (Katrin) Shitrit serves as a member of the Knesset for the Likud party.
        She was first elected to the 21st Knesset in 2019 and served through
        2022, returning to the 25th Knesset on 15 February 2023 under the
        Norwegian Law following the resignation of Miri Regev.
