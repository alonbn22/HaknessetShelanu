    title:
      he: הוצבה במקום ה-33 ברשימת "ביחד" של בנט ולפיד לכנסת ה-26
      en: Placed 33rd on the joint Bennett–Lapid "Yachad" list for the 26th Knesset
    description:
      he: >-
        לקראת הבחירות ב-27 באוקטובר 2026 התמזגה יש עתיד לרשימה משותפת עם מפלגתו
        של נפתלי בנט ("ביחד בראשות נפתלי בנט"), שהוגשה לוועדת הבחירות המרכזית.
        ברשימה כפי שהוגשה מופיעה צרפתי הרכבי במקום ה-33.
      en: >-
        Ahead of the election on 27 October 2026, Yesh Atid merged into a joint
        list with Naftali Bennett's party ("Yachad, headed by Naftali Bennett"),
        which was submitted to the Central Elections Committee. On the list as
        submitted, Sarfatti Harcavi appears in 33rd place.
