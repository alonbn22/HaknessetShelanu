    title:
      he: דורג במקום החמישי ברשימת הציונות הדתית בפריימריז לקראת בחירות 2026
      en: Ranked fifth on the Religious Zionism list in the party primary ahead of the 2026 election
    description:
      he: "בפריימריז של מפלגת הציונות הדתית, שנערכו ב-26 ביולי 2026 בהצבעת 170 מתוך 173 חברי מרכז המפלגה, דורג טל במקום החמישי ברשימה – אחרי יו\"ר המפלגה בצלאל סמוטריץ', אורית סטרוק, שמחה רוטמן וצבי סוכות. ב-1 בספטמבר 2026 סיכמו הציונות הדתית ומפלגת זהות בראשות משה פייגלין על ריצה משותפת, כשזהות מקבלת את המקומות 2, 8, 10 ו-11 ברשימה המשותפת; ברשימה המשותפת שהוגשה שובץ טל במקום ה-12."
      en: "In the Religious Zionism party primary held on 26 July 2026, in which 170 of the 173 central committee members voted, Tal was ranked fifth on the list — after party chairman Bezalel Smotrich, Orit Strook, Simcha Rothman and Zvi Sukkot. On 1 September 2026 Religious Zionism and Moshe Feiglin's Zehut party agreed to run together, with Zehut receiving slots 2, 8, 10 and 11 on the joint list; on the joint list as submitted, Tal is placed 12th."
