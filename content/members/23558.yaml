        publisher: The Knesset
  - kind: positive
    category: achievement
    title:
      he: יושב ראש ועדת העלייה והקליטה
      en: Chairman of the Immigration and Absorption Committee
    description:
      he: "ביטן מונה ביוני 2020 ליושב ראש ועדת העלייה, הקליטה והתפוצות בכנסת ה-23, ועדה העוסקת במדיניות העלייה לישראל ובקליטת עולים."
      en: "Bitan was appointed in June 2020 as chairman of the Immigration, Absorption and Diaspora Affairs Committee in the 23rd Knesset, a committee dealing with immigration to Israel and the integration of new immigrants."
      ar: "عُيّن بيطان في حزيران/يونيو 2020 رئيسًا للجنة الهجرة والاستيعاب وشؤون الشتات في الكنيست الـ23، وهي لجنة تُعنى بسياسة الهجرة إلى إسرائيل واستيعاب المهاجرين الجدد."
      ru: "В июне 2020 года Битан был назначен председателем Комиссии по алие, абсорбции и делам диаспоры Кнессета 23-го созыва, которая занимается политикой репатриации в Израиль и абсорбцией новых репатриантов."
      es: "En junio de 2020 Bitan fue nombrado presidente de la Comisión de Inmigración, Absorción y Asuntos de la Diáspora de la 23.ª Knéset, que se ocupa de la inmigración a Israel y de la integración de los nuevos inmigrantes."
      fr: "En juin 2020, Bitan a été nommé président de la commission de l’Immigration, de l’Intégration et de la Diaspora de la 23e Knesset, qui traite de l’immigration en Israël et de l’intégration des nouveaux immigrants."
