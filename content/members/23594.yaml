    status: settled
    date: 2016-06-20
    title:
      he: "קנס מוועדת האתיקה של הכנסת על היעדרויות ממליאת הכנסת (2016)"
      en: "Fined by the Knesset Ethics Committee over absences from plenum sessions (2016)"
    description:
      he: "ב-20 ביוני 2016 קנסה ועדת האתיקה של הכנסת את לפיד בכ-6,000 ש\"ח (שלילת שכר של ארבעה ימים) לאחר שנעדר מ-32 מתוך 75 ישיבות המליאה במושב החורף — מעבר למכסה המותרת בחוק. לפיד טען כי נעדר בשל פעילות בינלאומית נגד הדה-לגיטימציה של ישראל; הוועדה קבעה כי מכסת ההיעדרויות שבחוק נועדה ממילא לאפשר פעילות כזו וכי היעדרות מעבר לה אינה מוצדקת. מדובר בסנקציה אתית פרלמנטרית ולא בהליך פלילי."
      en: "On 20 June 2016 the Knesset Ethics Committee fined Lapid about NIS 6,000 (four days' pay) after he missed 32 of 75 plenum sessions in the winter session — beyond the quota allowed by law. Lapid said the absences were due to international activity against the delegitimization of Israel; the committee ruled that the statutory absence quota already allows for such activity and that absences beyond it were not justified. This was a parliamentary ethics sanction, not a criminal proceeding."
