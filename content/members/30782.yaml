    title:
      he: חברת הכנסת מטעם יש עתיד
      en: Member of Knesset for Yesh Atid
    description:
      he: טטיאנה מזרסקי נכנסה לכנסת ה-24 ב-15 ביוני 2021 מטעם סיעת יש עתיד, כמחליפה של
        יואל רזבוזוב במסגרת 'החוק הנורווגי', והמשיכה לכהן גם בכנסת ה-25. מזרסקי
        עלתה לישראל מברית המועצות בגיל 17 במסגרת עליית הנוער, ובעלת תואר ראשון
        ושני בהיסטוריה מאוניברסיטת חיפה.
      en: Tania Mazarsky entered the 24th Knesset on 15 June 2021 as a member of the
        Yesh Atid faction, replacing Yoel Razvozov under the 'Norwegian Law,'
        and has continued to serve in the 25th Knesset. Mazarsky immigrated to
        Israel from the Soviet Union at age 17 through the Youth Aliyah program
        and holds bachelor's and master's degrees in history from the University
        of Haifa.
    date: 2021-06-15
