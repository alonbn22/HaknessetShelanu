    title:
      he: קצין משטרה בכיר ומפקד מחוז ירושלים
      en: Senior police officer and Jerusalem District commander
    description:
      he: "לפני כניסתו לפוליטיקה שירת מיקי לוי שנים רבות במשטרת ישראל ופרש בדרגת ניצב. בשנים 2000–2004 עמד בראש מחוז ירושלים, ובשנים 2004–2007 כיהן כנספח המשטרה בארצות הברית."
      en: "Before entering politics, Mickey Levy served for many years in the Israel Police, retiring with the rank of Nitzav (major general). He headed the Jerusalem District from 2000 to 2004 and was the Israel Police attaché in the United States from 2004 to 2007."
      ar: "قبل دخوله السياسة خدم ميكي ليفي سنوات طويلة في شرطة إسرائيل وتقاعد برتبة نيتساف (لواء). ترأّس لواء القدس بين عامَي 2000 و2004، وشغل منصب ملحق الشرطة الإسرائيلية في الولايات المتحدة بين عامَي 2004 و2007."
      ru: "До прихода в политику Мики Леви много лет служил в полиции Израиля и вышел в отставку в звании ницав (генерал-майор). В 2000–2004 годах он возглавлял Иерусалимский округ, а в 2004–2007 годах был атташе израильской полиции в США."
      es: "Antes de entrar en política, Mickey Levy sirvió muchos años en la Policía de Israel y se retiró con el rango de nitzav (general de división). Dirigió el Distrito de Jerusalén de 2000 a 2004 y fue agregado de la Policía de Israel en Estados Unidos de 2004 a 2007."
      fr: "Avant d’entrer en politique, Mickey Levy a servi de nombreuses années dans la police israélienne et a pris sa retraite avec le grade de nitzav (général de division). Il a dirigé le district de Jérusalem de 2000 à 2004 et a été l’attaché de la police israélienne aux États-Unis de 2004 à 2007."
