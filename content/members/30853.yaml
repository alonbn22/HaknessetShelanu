    title:
      he: יוזם חוק הכפפת מח"ש למשרד המשפטים
      en: Initiated law placing police investigations unit under the Justice Ministry
    description:
      he: ביוני 2026 אישרה הכנסת תיקון חקיקה שיזם סעדה, המעביר את המחלקה לחקירות
        שוטרים (מח"ש) מאחריות פרקליטות המדינה לאחריות משרד המשפטים. החוק היה
        שנוי במחלוקת ועבר ברוב של 43 תומכים מול 39 מתנגדים.
      en: In June 2026 the Knesset approved a legislative amendment initiated by Saada
        that transfers the Police Internal Investigations Department (Mahash)
        from the authority of the State Attorney's Office to that of the Justice
        Ministry. The law was controversial and passed by a vote of 43 in favor
        to 39 against.
    date: 2026-06-11
