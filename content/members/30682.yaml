      en: Government minister of Israel (2020–2021)
    description:
      he: ביטון כיהן כשר בממשלה ה-35 מטעם מפלגת כחול לבן. ממאי 2020 שימש שר במשרד
        הביטחון (אחראי על ענייני אזרח-צבא), ובהמשך מונה לשר לעניינים אסטרטגיים.
        הוא כיהן בתפקידי השרים בשנים 2020–2021.
      en: Biton served as a government minister in Israel's 35th government on behalf
        of the Blue and White party. From May 2020 he was a minister in the
        Ministry of Defense (responsible for civic-military affairs), and was
        later appointed Minister of Strategic Affairs, serving in these
        ministerial roles in 2020–2021.
    date: 2020-05
