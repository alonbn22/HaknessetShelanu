        title: Likud pressuring Benjamin Netanyahu to 'swap' Avi Dichter into realistic slate position
        publisher: The Jerusalem Post
      - url: https://www.jns.org/news/israel-news/likud-files-26th-knesset-election-slate
        title: Likud files 26th Knesset election slate
        publisher: JNS
