    title:
      he: "חבר כנסת ותיק החל משנת 2003"
      en: "Veteran Knesset member since 2003"
    description:
      he: "מרגי נבחר לראשונה לכנסת ה-16 בשנת 2003 וכיהן מאז לאורך מספר כהונות מטעם ש\"ס, ובהן שימש בין היתר כיושב ראש ועדת הכנסת. בפברואר 2023 התפטר מהכנסת במסגרת 'החוק הנורווגי' כדי להתמקד בתפקידו כשר, ושב לכהן כחבר כנסת ביולי 2025."
      en: "Margi was first elected to the 16th Knesset in 2003 and has since served across multiple terms for Shas, including a period chairing the House Committee. In February 2023 he resigned his seat under the Norwegian Law to focus on his ministerial post, returning to the Knesset in July 2025."
