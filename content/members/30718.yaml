      he: מונתה לשרה להגנת הסביבה
      en: Appointed Minister of Environmental Protection
    description:
      he: ב-29 בדצמבר 2022 מונתה עידית סילמן לשרה להגנת הסביבה בממשלה השלושים ושבע
        בראשות בנימין נתניהו, תפקיד שבו היא מכהנת מטעם הליכוד (ממשלת מעבר מאז
        פיזור הכנסת ה-25 ביולי 2026).
      en: On 29 December 2022, Idit Silman was appointed Minister of Environmental
        Protection in the thirty-seventh government of Israel led by Benjamin
        Netanyahu, a post she holds on behalf of Likud (a caretaker government
        since the 25th Knesset dispersed in July 2026).
