  - id: 1101 # United Torah Judaism
    verified: "2026-09-19"
    updates:
      - date: "2025-06-12"
        text:
          he: "יצחק גולדקנופ התפטר מתפקידו כשר הבינוי והשיכון לאחר שהכנסת דחתה הצעת חוק לפיזורה; יהדות התורה נשארה בקואליציה. ב-15 ביוני 2025 שב גולדקנופ לכנסת לפי החוק הנורבגי ואליהו ברוכי חדל לכהן."
          en: "Yitzhak Goldknopf resigned as housing minister after the Knesset rejected a bill to dissolve itself; UTJ remained in the coalition. On 15 June 2025 Goldknopf returned to the Knesset under the Norwegian law and Eliyahu Baruchi ceased to serve."
          ar: "استقال يتسحاق غولدكنوبف من منصب وزير البناء والإسكان بعد أن رفض الكنيست مشروع قانون لحلّه؛ وبقيت يهدوت هتوراة في الائتلاف. وفي 15 حزيران/يونيو 2025 عاد غولدكنوبف إلى الكنيست بموجب «القانون النرويجي» وانتهت عضوية إلياهو باروخي."
          ru: "Ицхак Гольдкнопф ушёл с поста министра строительства и жилищного хозяйства после того, как Кнессет отклонил законопроект о самороспуске; «Яхадут ха-Тора» осталась в коалиции. 15 июня 2025 года Гольдкнопф вернулся в Кнессет по «норвежскому закону», а Элияху Барухи перестал быть депутатом."
          es: "Yitzhak Goldknopf renunció como ministro de Vivienda después de que la Knéset rechazara un proyecto de ley para disolverse; Judaísmo Unido de la Torá siguió en la coalición. El 15 de junio de 2025 Goldknopf volvió a la Knéset según la Ley Noruega y Eliyahu Baruchi cesó en el cargo."
          fr: "Yitzhak Goldknopf a démissionné de son poste de ministre du Logement après le rejet par la Knesset d’un projet de loi de dissolution ; le Judaïsme unifié de la Torah est resté dans la coalition. Le 15 juin 2025, Goldknopf est revenu à la Knesset en vertu de la « loi norvégienne » et Eliyahu Baruchi a cessé de siéger."
        sources:
          - { url: "https://www.timesofisrael.com/utjs-goldknopf-resigns-from-cabinet-after-knesset-fails-to-pass-dissolution-bill/", title: "UTJ's Goldknopf resigns from cabinet after Knesset fails to pass dissolution bill (2025-06-12)", publisher: "The Times of Israel" }
          - { url: "https://knesset.gov.il/OdataV4/ParliamentInfo/KNS_PersonToPosition?$filter=FactionID%20eq%201101%20and%20KnessetNum%20eq%2025", title: "KNS_PersonToPosition — FactionID 1101, Knesset 25 (Goldknopf member from 2025-06-15; Baruchi to 2025-06-15; Goldknopf housing minister 2022-12-29 → 2025-06-15) (2026-09-19)", publisher: "Knesset OData" }
      - date: "2025-07-14"
        text:
          he: "דגל התורה הודיעה על פרישה מהממשלה ומהקואליציה בשל נוסח חוק הגיוס; באותו יום התפטרו משה גפני מראשות ועדת הכספים ויעקב אשר מראשות ועדת הפנים. למחרת הודיעה אגודת ישראל על פרישה אף היא, וישראל אייכלר התפטר מראשות ועדת העבודה והרווחה."
          en: "Degel HaTorah announced it was leaving the government and the coalition over the draft bill; the same day Moshe Gafni resigned as chair of the Finance Committee and Yaakov Asher as chair of the Interior Committee. The next day Agudat Yisrael announced it was leaving as well, and Israel Eichler resigned as chair of the Labor and Welfare Committee."
          ar: "أعلن ديغل هتوراه انسحابه من الحكومة ومن الائتلاف بسبب صيغة قانون التجنيد؛ وفي اليوم نفسه استقال موشيه غافني من رئاسة لجنة المالية ويعقوب آشر من رئاسة لجنة الداخلية. وفي اليوم التالي أعلنت أغودات يسرائيل انسحابها أيضًا، واستقال يسرائيل آيخلر من رئاسة لجنة العمل والرفاه."
          ru: "«Дегель ха-Тора» объявила о выходе из правительства и коалиции из-за формулировки закона о призыве; в тот же день Моше Гафни ушёл с поста председателя финансовой комиссии, а Яаков Ашер — с поста председателя комиссии по внутренним делам. На следующий день о выходе объявила и «Агудат Исраэль», а Исраэль Эйхлер ушёл с поста председателя комиссии по труду и социальному обеспечению."
          es: "Degel HaTorá anunció que dejaba el Gobierno y la coalición por el proyecto de ley del servicio militar; el mismo día Moshe Gafni renunció como presidente de la Comisión de Finanzas y Yaakov Asher como presidente de la Comisión de Interior. Al día siguiente Agudat Yisrael anunció que también se iba, e Israel Eichler renunció como presidente de la Comisión de Trabajo y Bienestar."
          fr: "Degel HaTorah a annoncé qu’il quittait le gouvernement et la coalition à cause du projet de loi sur la conscription ; le même jour, Moshe Gafni a démissionné de la présidence de la Commission des Finances et Yaakov Asher de celle de la Commission de l’Intérieur. Le lendemain, Agoudat Israël a annoncé son départ à son tour, et Israel Eichler a démissionné de la présidence de la Commission du Travail et des Affaires sociales."
        sources:
          - { url: "https://www.ynetnews.com/article/hki11u1mlgx", title: "United Torah Judaism says leaving government over draft exemption law (2025-07-14)", publisher: "Ynetnews" }
          - { url: "https://www.timesofisrael.com/liveblog_entry/agudat-yisrael-announces-resignation-from-government-following-degel-hatorahs-lead/", title: "Agudat Yisrael announces resignation from government, following Degel HaTorah's lead (2025-07-15)", publisher: "The Times of Israel" }
          - { url: "https://www.ynet.co.il/news/article/ry8jahmigl", title: "ח\"כ אייכלר מיהדות התורה התפטר מתפקידו כיו\"ר ועדת העבודה והרווחה (2025-07-15)", publisher: "Ynet" }
          - { url: "https://knesset.gov.il/OdataV4/ParliamentInfo/KNS_PersonToPosition?$filter=PersonID%20eq%20526%20and%20KnessetNum%20eq%2025", title: "KNS_PersonToPosition — Moshe Gafni (Finance Committee chair 2022-11-21 → 2025-07-14); same query with PersonID 23641 (Asher, Interior Committee chair 2023-01-04 → 2025-07-14) and 1057 (Eichler, Labor & Welfare chair 2023-01-04 → 2025-07-15) (2026-09-19)", publisher: "Knesset OData" }
      - date: "2025-07-17"
        text:
          he: "סגן השר אורי מקלב והשר מאיר פרוש סיימו את כהונתם בממשלה ושבו לכנסת (16–17 ביולי 2025); משה רוט ויצחק פינדרוס חדלו לכהן לפי החוק הנורבגי. עם עזיבת פינדרוס נותרה הסיעה ללא יו\"ר סיעה."
          en: "Deputy minister Uri Maklev and minister Meir Porush left the government and returned to the Knesset (16–17 July 2025); Moshe Roth and Yitzhak Pindrus ceased to serve under the Norwegian law. With Pindrus’s departure the faction was left without a faction chair."
          ar: "أنهى نائب الوزير أوري مكليف والوزير مئير بوروش ولايتيهما في الحكومة وعادا إلى الكنيست (16–17 تموز/يوليو 2025)؛ وانتهت عضوية موشيه روت ويتسحاق بيندروس بموجب «القانون النرويجي». ومع مغادرة بيندروس بقيت الكتلة بلا رئيس."
          ru: "Заместитель министра Ури Маклев и министр Меир Поруш покинули правительство и вернулись в Кнессет (16–17 июля 2025 года); Моше Рот и Ицхак Пиндрус перестали быть депутатами по «норвежскому закону». С уходом Пиндруса фракция осталась без председателя."
          es: "El viceministro Uri Maklev y el ministro Meir Porush dejaron el Gobierno y volvieron a la Knéset (16–17 de julio de 2025); Moshe Roth e Yitzhak Pindrus cesaron en el cargo en virtud de la Ley Noruega. Con la salida de Pindrus la facción se quedó sin presidente de facción."
          fr: "Le vice-ministre Uri Maklev et le ministre Meir Porush ont quitté le gouvernement et sont revenus à la Knesset (16–17 juillet 2025) ; Moshe Roth et Yitzhak Pindrus ont cessé de siéger en vertu de la « loi norvégienne ». Avec le départ de Pindrus, la faction s’est retrouvée sans président de faction."
        sources:
          - { url: "https://knesset.gov.il/OdataV4/ParliamentInfo/KNS_PersonToPosition?$filter=FactionID%20eq%201101%20and%20KnessetNum%20eq%2025", title: "KNS_PersonToPosition — FactionID 1101, Knesset 25 (Maklev deputy minister 2023-01-03 → 2025-07-16, MK from 2025-07-16; Porush minister 2023-01-23 → 2025-07-17, MK from 2025-07-17; Roth and Pindrus to 2025-07-17; Pindrus faction chair 2023-01-23 → 2025-07-17) (2026-09-19)", publisher: "Knesset OData" }
          - { url: "https://www.timesofisrael.com/utjs-eichler-to-be-appointed-deputy-minister-preventing-him-voting-against-draft-bill/", title: "UTJ's Eichler to be appointed deputy minister, preventing him voting against draft bill (2026-01-15)", publisher: "The Times of Israel" }
      - date: "2026-01-19"
        text:
          he: "ישראל אייכלר (אגודת ישראל) מונה לסגן שר התקשורת והתפטר מהכנסת לפי החוק הנורבגי; לפי 'טיימס אוף ישראל' המינוי נועד למנוע ממנו להצביע נגד חוק הגיוס ולאפשר את חזרתו של יצחק פינדרוס (דגל התורה). פינדרוס נכנס לכנסת ב-21 בינואר 2026."
          en: "Israel Eichler (Agudat Yisrael) was appointed deputy communications minister and resigned from the Knesset under the Norwegian law; according to The Times of Israel the appointment was meant to prevent him from voting against the draft bill and to allow Yitzhak Pindrus (Degel HaTorah) to return. Pindrus entered the Knesset on 21 January 2026."
          ar: "عُيّن يسرائيل آيخلر (أغودات يسرائيل) نائبًا لوزير الاتصالات واستقال من الكنيست بموجب «القانون النرويجي»؛ وبحسب «تايمز أوف إسرائيل» كان الهدف من التعيين منعه من التصويت ضد قانون التجنيد وإتاحة عودة يتسحاق بيندروس (ديغل هتوراه). ودخل بيندروس الكنيست في 21 كانون الثاني/يناير 2026."
          ru: "Исраэль Эйхлер («Агудат Исраэль») был назначен заместителем министра связи и сложил мандат по «норвежскому закону»; по данным The Times of Israel, назначение должно было помешать ему голосовать против закона о призыве и позволить вернуться Ицхаку Пиндрусу («Дегель ха-Тора»). Пиндрус вошёл в Кнессет 21 января 2026 года."
          es: "Israel Eichler (Agudat Yisrael) fue nombrado viceministro de Comunicaciones y renunció a la Knéset según la Ley Noruega; según The Times of Israel, el nombramiento buscaba impedir que votara contra el proyecto de ley del servicio militar y permitir el regreso de Yitzhak Pindrus (Degel HaTorá). Pindrus entró en la Knéset el 21 de enero de 2026."
          fr: "Israël Eichler (Agoudat Israël) a été nommé vice-ministre des Communications et a démissionné de la Knesset en vertu de la « loi norvégienne » ; selon The Times of Israel, la nomination visait à l’empêcher de voter contre le projet de loi sur la conscription et à permettre le retour de Yitzhak Pindrus (Degel HaTorah). Pindrus est entré à la Knesset le 21 janvier 2026."
        sources:
          - { url: "https://www.timesofisrael.com/utjs-eichler-to-be-appointed-deputy-minister-preventing-him-voting-against-draft-bill/", title: "UTJ's Eichler to be appointed deputy minister, preventing him voting against draft bill (2026-01-15)", publisher: "The Times of Israel" }
          - { url: "https://www.ynet.co.il/news/article/bk5tdy3hzl", title: "אייכלר שמונה לסגן שר התפטר מהכנסת, פינדרוס יחליפו בכנסת (2026-01-19)", publisher: "Ynet" }
          - { url: "https://main.knesset.gov.il/mk/apps/faction/faction-lobby?KnessetID=25&FactionID=1101", title: "סיעת יהדות התורה — חילופי גברי: 21/01/2026 יצחק זאב פינדרוס נכנס במקום ישראל אייכלר (2026-09-19)", publisher: "Knesset" }
          - { url: "https://knesset.gov.il/OdataV4/ParliamentInfo/KNS_PersonToPosition?$filter=PersonID%20eq%201057%20and%20KnessetNum%20eq%2025", title: "KNS_PersonToPosition — Israel Eichler (deputy minister, Ministry of Communications, from 2026-01-19; MK to 2026-01-21) (2026-09-19)", publisher: "Knesset OData" }
      - date: "2026-05-12"
        text:
          he: "דגל התורה הודיעה על תמיכה בפיזור הכנסת; אגודת ישראל הודיעה שתתמוך אף היא. הרב דב לנדו: 'אין לנו עוד אמון בנתניהו'. יהדות התורה פרשה רשמית מהממשלה ומהקואליציה ב-2025."
          en: "Degel HaTorah announced support for dissolving the Knesset; Agudat Yisrael indicated it would back the move as well. Rabbi Dov Lando: ‘We no longer have any trust in Netanyahu.’ UTJ had formally withdrawn from the government and the coalition in 2025."
          ar: "أعلن ديغل هتوراه دعمه لحلّ الكنيست؛ وأعلنت أغودات يسرائيل أنها ستدعمه أيضًا. وقال الحاخام دوف لاندو: «لم تعد لدينا أي ثقة بنتنياهو». وكانت يهدوت هتوراة قد انسحبت رسميًا من الحكومة ومن الائتلاف في 2025."
          ru: "«Дегель ха-Тора» объявила о поддержке роспуска Кнессета; «Агудат Исраэль» заявила, что тоже поддержит его. Раввин Дов Ландо: «У нас больше нет никакого доверия к Нетаньяху». «Яхадут ха-Тора» официально вышла из правительства и коалиции в 2025 году."
          es: "Degel HaTorá anunció su apoyo a la disolución de la Knéset; Agudat Yisrael indicó que también respaldaría la medida. El rabino Dov Lando: «Ya no tenemos ninguna confianza en Netanyahu». Judaísmo Unido de la Torá se había retirado formalmente del Gobierno y de la coalición en 2025."
          fr: "Degel HaTorah a annoncé son soutien à la dissolution de la Knesset ; Agoudat Israël a indiqué qu’il soutiendrait aussi la démarche. Le rabbin Dov Lando : « Nous n’avons plus aucune confiance en Netanyahou. » Le Judaïsme unifié de la Torah s’était formellement retiré du gouvernement et de la coalition en 2025."
        sources:
          - { url: "https://www.timesofisrael.com/haredi-factions-back-dissolving-knesset-increasing-chance-for-early-elections/", title: "Haredi factions push to dissolve Knesset, increasing likelihood of slightly earlier elections (2026-05-12)", publisher: "The Times of Israel" }
      - date: "2026-06-16"
        text:
          he: "יהדות התורה וש\"ס החרימו יום שני ברציפות את ההצבעות במליאה בדרישה להעביר את 'חוק המעונות'; אגודת ישראל הודיעה שהיא 'עומדת מאוחדת עם דגל התורה' בדרישה."
          en: "UTJ and Shas boycotted Knesset votes for a second consecutive day demanding passage of the ‘Daycare Law’; Agudat Yisrael said it ‘stands united with Degel HaTorah’ in the demand."
          ar: "قاطعت يهدوت هتوراة وشاس التصويتات في الهيئة العامة لليوم الثاني على التوالي مطالبتين بإقرار «قانون الحضانات»؛ وأعلنت أغودات يسرائيل أنها «تقف موحّدة مع ديغل هتوراه» في هذا المطلب."
          ru: "«Яхадут ха-Тора» и ШАС второй день подряд бойкотировали голосования в пленуме, требуя принять «закон о яслях»; «Агудат Исраэль» заявила, что в этом требовании она «едина с „Дегель ха-Тора“»."
          es: "Judaísmo Unido de la Torá y Shas boicotearon las votaciones de la Knéset por segundo día consecutivo exigiendo la aprobación de la «Ley de Guarderías»; Agudat Yisrael dijo que «se mantiene unida con Degel HaTorá» en la exigencia."
          fr: "Le Judaïsme unifié de la Torah et Shas ont boycotté les votes de la Knesset pour le deuxième jour consécutif en exigeant l’adoption de la « loi sur les crèches » ; Agoudat Israël a déclaré « faire bloc avec Degel HaTorah » dans cette exigence."
        sources:
          - { url: "https://www.timesofisrael.com/haredi-knesset-boycott-continues-putting-coalitions-legislative-blitz-at-risk/", title: "Haredi Knesset boycott continues, putting coalition's legislative blitz at risk (2026-06-16)", publisher: "The Times of Israel" }
      - date: "2026-09-05"
        text:
          he: "רבני דגל התורה החליטו שמשה גפני, יו\"ר המפלגה ויו\"ר ועדת הכספים לשעבר, לא ייכלל ברשימה לכנסת ה-26; גם אורי מקלב לא ייכלל. יעקב אשר יעמוד בראש דגל התורה ובראש רשימת יהדות התורה."
          en: "Degel HaTorah’s rabbis decided that Moshe Gafni, the party’s chairman and former Finance Committee chair, would not be on the list for the 26th Knesset; Uri Maklev was also left off. Yaakov Asher is to head Degel HaTorah and the UTJ list."
          ar: "قرّر حاخامات ديغل هتوراه ألّا يُدرج موشيه غافني، رئيس الحزب والرئيس السابق للجنة المالية، في القائمة للكنيست الـ26؛ ولن يُدرج أوري مكليف أيضًا. وسيرأس يعقوب آشر ديغل هتوراه وقائمة يهدوت هتوراة."
          ru: "Раввины «Дегель ха-Тора» решили, что Моше Гафни, председатель партии и бывший председатель финансовой комиссии, не войдёт в список в Кнессет 26-го созыва; не войдёт в него и Ури Маклев. «Дегель ха-Тора» и список «Яхадут ха-Тора» возглавит Яаков Ашер."
          es: "Los rabinos de Degel HaTorá decidieron que Moshe Gafni, presidente del partido y expresidente de la Comisión de Finanzas, no estaría en la lista para la 26.ª Knéset; Uri Maklev también quedó fuera. Yaakov Asher encabezará Degel HaTorá y la lista de Judaísmo Unido de la Torá."
          fr: "Les rabbins de Degel HaTorah ont décidé que Moshe Gafni, président du parti et ancien président de la Commission des Finances, ne figurerait pas sur la liste pour la 26e Knesset ; Uri Maklev a également été écarté. Yaakov Asher doit prendre la tête de Degel HaTorah et de la liste du Judaïsme unifié de la Torah."
        sources:
          - { url: "https://www.ynetnews.com/article/b1e7ngq00gg", title: "United Torah Judaism ousts Moshe Gafni after 38 years in major Haredi leadership shake-up (2026-09-05)", publisher: "Ynetnews" }
          - { url: "https://www.timesofisrael.com/israels-election-takes-shape-as-38-parties-submit-slates-from-likud-to-joint-list/", title: "Israel's election takes shape as 38 parties submit slates, in battle between pro- and anti-Netanyahu blocs (2026-09-09)", publisher: "The Times of Israel" }
      - date: "2026-09-08"
        text:
          he: "רשימת יהדות התורה (רשימה 37, אות מבוקשת ג) הוגשה על ידי שלוש מפלגות — דגל התורה, אגודת ישראל ומפלגה חדשה, 'חומת תורת ישראל' (נציגי בעלז ושלומי אמונים), שמאיר פרוש ואלי שטארק רצים במסגרתה (מקומות 4 ו-6). בראש: יעקב אשר, יצחק גולדקנופ, יצחק פינדרוס."
          en: "The UTJ list (list 37, requested letter ג) was submitted by three parties — Degel HaTorah, Agudat Yisrael and a new party, ‘Homat Torat Yisrael’ (representing Belz and Shlomei Emunim), under which Meir Porush and Eli Stark run (slots 4 and 6). Top of the list: Yaakov Asher, Yitzhak Goldknopf, Yitzhak Pindrus."
          ar: "قُدّمت قائمة يهدوت هتوراة (القائمة 37، الحرف المطلوب ג) من قِبل ثلاثة أحزاب — ديغل هتوراه وأغودات يسرائيل وحزب جديد هو «حومات توراة يسرائيل» (ممثلو بلز وشلومي إيمونيم)، ويترشح في إطاره مئير بوروش وإيلي شتارك (الموقعان 4 و6). وعلى رأسها: يعقوب آشر، يتسحاق غولدكنوبف، يتسحاق بيندروس."
          ru: "Список «Яхадут ха-Тора» (список 37, запрошенная буква ג) подан тремя партиями — «Дегель ха-Тора», «Агудат Исраэль» и новой партией «Хомат Торат Исраэль» (представители Белза и «Шломей Эмуним»), от которой идут Меир Поруш и Эли Штарк (4-е и 6-е места). Во главе: Яаков Ашер, Ицхак Гольдкнопф, Ицхак Пиндрус."
          es: "La lista de Judaísmo Unido de la Torá (lista 37, letra solicitada ג) fue presentada por tres partidos — Degel HaTorá, Agudat Yisrael y un nuevo partido, «Homat Torat Yisrael» (que representa a Belz y Shlomei Emunim), por el que se presentan Meir Porush y Eli Stark (puestos 4 y 6). Primeros puestos: Yaakov Asher, Yitzhak Goldknopf, Yitzhak Pindrus."
          fr: "La liste du Judaïsme unifié de la Torah (liste 37, lettre demandée ג) a été déposée par trois partis — Degel HaTorah, Agoudat Israël et un nouveau parti, « Homat Torat Yisrael » (représentant Belz et Shlomei Emunim), sous lequel se présentent Meir Porush et Eli Stark (places 4 et 6). En tête de liste : Yaakov Asher, Yitzhak Goldknopf, Yitzhak Pindrus."
        sources:
          - { url: "https://www.gov.il/he/pages/yahadut-degel_list37", title: "רשימת המועמדים — יהדות התורה והשבת אגודת ישראל - דגל התורה (רשימה 37) (2026-09-09)", publisher: "ועדת הבחירות המרכזית / gov.il" }
          - { url: "https://www.israelnationalnews.com/news/432906", title: "Last minute drama in United Torah Judaism party (2026-09-08)", publisher: "Israel National News (Arutz Sheva)" }
    election2026:
      runsAs: own
      slug: utj
      note:
        he: "בראש הרשימה יעקב אשר (דגל התורה); יצחק גולדקנופף (אגודת ישראל) שני ומאיר פרוש רביעי. משה גפני ואורי מקלב, חברי הסיעה בכנסת ה-25, אינם ברשימה. הוגשה על ידי דגל התורה, אגודת ישראל ו\"חומת תורת ישראל\"."
        en: "Yaakov Asher (Degel HaTorah) heads the list; Yitzhak Goldknopf (Agudat Yisrael) is second and Meir Porush fourth. Moshe Gafni and Uri Maklev, members of the 25th-Knesset faction, are not on it. Submitted by Degel HaTorah, Agudat Yisrael and “Homat Torat Yisrael”."
        ar: "يرأس القائمة يعقوب آشر (ديغل هتوراه)؛ يتسحاق غولدكنوبف (أغودات يسرائيل) في الموقع الثاني ومئير بوروش في الرابع. موشيه غافني وأوري مكليف، عضوا الكتلة في الكنيست الـ25، ليسا فيها. قدّمتها ديغل هتوراه وأغودات يسرائيل و«حومات توراة يسرائيل»."
        ru: "Список возглавляет Яаков Ашер («Дегель ха-Тора»); Ицхак Гольдкнопф («Агудат Исраэль») — второй, Меир Поруш — четвёртый. Моше Гафни и Ури Маклева, членов фракции в Кнессете 25-го созыва, в нём нет. Подан «Дегель ха-Тора», «Агудат Исраэль» и «Хомат Торат Исраэль»."
        es: "Yaakov Asher (Degel HaTorá) encabeza la lista; Yitzhak Goldknopf (Agudat Yisrael) es segundo y Meir Porush cuarto. Moshe Gafni y Uri Maklev, miembros de la facción en la 25.ª Knéset, no figuran en ella. Presentada por Degel HaTorá, Agudat Yisrael y «Homat Torat Yisrael»."
        fr: "Yaakov Asher (Degel HaTorah) mène la liste ; Yitzhak Goldknopf (Agoudat Israël) est deuxième et Meir Porush quatrième. Moshe Gafni et Uri Maklev, membres de la faction dans la 25e Knesset, n’y figurent pas. Déposée par Degel HaTorah, Agoudat Israël et « Homat Torat Yisrael »."
      sources:
