  - kind: neutral
    category: news
    date: "2026-09-18"
    title:
      he: "אמר כי נתניהו אינו עונה לשיחותיו וכי הוא מבקש להישאר בממשלה בראשות נתניהו לאחר הבחירות"
      en: "Said Netanyahu is not answering his calls and that he wants to remain in a Netanyahu-led government after the election"
    description:
      he: "לקראת בחירות 2026 אמר בן גביר כי נתניהו לא בדיוק ענה לשיחות הטלפון שלו בשבועות האחרונים, והביע חשש שנתניהו יקים לאחר הבחירות ממשלה רחבה שתותיר את עוצמה יהודית מחוץ לקואליציה. עם זאת אמר כי הוא מבקש להישאר בממשלה בראשות נתניהו ולהתמקד בנושאי מדיניות, ובהם מינוי שופטים. בדיווח לא הובאה תגובה מהליכוד."
      en: "Ahead of the 2026 election Ben-Gvir said Netanyahu \"hasn't exactly answered my phone calls in recent weeks\" and voiced concern that Netanyahu would form a broad government after the election leaving Otzma Yehudit outside the coalition. He nonetheless said he wants to remain in a Netanyahu-led government and to focus on policy issues, including judicial appointments. The report carried no response from Likud."
