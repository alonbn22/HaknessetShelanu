    title:
      he: יזם את תיקון 35 לחוק מימון מפלגות
      en: Initiated Amendment 35 to the Party Financing Law
    description:
      he: במרץ 2017 יזם קיש, יחד עם חברי כנסת נוספים, את תיקון 35 לחוק מימון מפלגות
        (המכונה 'חוק V15'), המחייב ארגונים ויחידים הפועלים בבחירות כדי לשכנע
        מצביעים שלא להצביע לרשימה מסוימת להירשם אצל מבקר המדינה.
      en: In March 2017 Kisch, together with other Knesset members, initiated
        Amendment 35 to the Party Financing Law (known as the 'V15 law'), which
        requires organizations and individuals campaigning during elections to
        persuade voters not to vote for a particular list to register with the
        State Comptroller.
    date: 2017-03-01
    sources:
