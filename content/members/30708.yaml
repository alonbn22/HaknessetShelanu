      en: Finished 23rd in the Likud primary, outside the realistic range, and is not on Likud's slate for the 26th Knesset
    description:
      he: בפריימריז הליכוד ב-17 באוגוסט 2026 דורגה גולן במקום ה-23 בהצבעה, מחוץ לטווח הריאלי. ברשימת הליכוד שהוגשה לוועדת הבחירות ב-9 בספטמבר 2026, כפי שפורסמה ב-JNS, היא אינה נמנית עם 35 המקומות הראשונים.
      en: In the Likud primary on 17 August 2026 Golan finished 23rd in the vote, outside the realistic range. On the Likud slate filed with the elections committee on 9 September 2026, as published by JNS, she is not among the first 35 places.
