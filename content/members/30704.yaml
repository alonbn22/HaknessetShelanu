    description:
      he: "בפברואר 2024, כשר התקשורת, העניק קרעי רישיון להפעלת שירות האינטרנט הלווייני Starlink של חברת SpaceX בישראל, לאחר שהחברה הסכימה לסדרת אמצעים ביטחוניים; השירות הוגבל בתחילה לרשימת לקוחות מוגדרת."
      en: "In February 2024, as Communications Minister, Karhi granted a license for SpaceX's Starlink satellite internet service to operate in Israel, after the company agreed to a set of security measures; the service was initially limited to a defined list of customers."
