    title:
      he: שובץ במקום הרביעי ברשימת עוצמה יהודית לכנסת ה-26
      en: Placed fourth on the Otzma Yehudit list for the 26th Knesset
    description:
      he: >-
        ב-7 בספטמבר 2026 פרסמה עוצמה יהודית את רשימתה לבחירות 27 באוקטובר 2026:
        איתמר בן גביר בראש, טלי גוטליב שנייה, יצחק וסרלאוף שלישי ואליהו במקום
        הרביעי.
      en: >-
        On 7 September 2026 Otzma Yehudit published its list for the 27 October 2026
