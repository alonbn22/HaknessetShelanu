    title:
      he: "תועד נוזף בעובד הקונסוליה הצרפתית בירושלים; צרפת דרשה הגברת אבטחה"
      en: "Recorded berating a French Consulate employee in Jerusalem; France demanded heightened security"
    description:
      he: "בנובמבר 2025, במהלך סיור של חברי כנסת מהימין בקונסוליה הצרפתית בירושלים, תועד טל נוזף בעובד הקונסוליה ואומר לו, לפי הדיווח, כי \"נדאג שלא תוכל לעבוד כאן\". משרד החוץ הצרפתי גינה את האירוע ודרש מישראל להבטיח את ביטחון נציגויותיו. בריאיון ל-JNS בתחילת דצמבר 2025 טען טל מנגד כי נציגויות זרות בירושלים, ובהן הקונסוליה הצרפתית, מלבות הסתה נגד ישראל ומפרות נורמות דיפלומטיות. לא נפתח הליך משפטי בעניין."
      en: "In November 2025, during a tour of the French Consulate in Jerusalem by right-wing MKs, Tal was recorded berating a consulate employee and, according to the report, telling him they would \"make sure you can't work here\". France's foreign ministry condemned the incident and demanded that Israel guarantee the security of its diplomatic missions. In an interview with JNS in early December 2025, Tal countered that foreign missions in Jerusalem, including the French Consulate, fuel anti-Israel incitement and violate diplomatic norms. No legal proceeding was opened over the matter."
    sources:
