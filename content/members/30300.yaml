      he: יושב ראש הכנסת הגלוי הראשון כהומו בתולדות ישראל
      en: First openly gay Speaker of the Knesset
    description:
      he: ב-29 בדצמבר 2022 נבחר אמיר אוחנה ליושב ראש הכנסת, ובכך הפך ליושב הראש הגלוי
        הראשון כהומו בתולדות הכנסת. הוא נבחר עם השבעת הממשלה ה-37 בראשות בנימין
