  - key: kd-results
    date: "2026-11-04"
    label: { he: "תוצאות רשמיות", en: "Official results", ar: "النتائج الرسمية", ru: "Официальные результаты", es: "Resultados oficiales", fr: "Résultats officiels" }
    detail:
      he: "לפי ציר הזמן של ועדת הבחירות המרכזית: פרסום תוצאות הבחירות ב-4 בנובמבר 2026 (שמונה ימים אחרי הבחירות, לפי סעיף 11 לחוק-יסוד: הכנסת); לפי דיווחים, ערעורים עד 18 בנובמבר."
      en: "Per the Central Elections Committee's timeline: the election results are published on November 4, 2026 (eight days after the election, under section 11 of Basic Law: The Knesset); per reports, appeals by November 18."
      ar: "وفق الجدول الزمني للجنة الانتخابات المركزية: تُنشر نتائج الانتخابات في 4 تشرين الثاني/نوفمبر 2026 (بعد ثمانية أيام من الانتخابات، بموجب المادة 11 من قانون أساس: الكنيست)؛ ووفق التقارير، الطعون حتى 18 تشرين الثاني/نوفمبر."
      ru: "По графику Центральной избирательной комиссии: результаты выборов публикуются 4 ноября 2026 года (через восемь дней после выборов, по статье 11 Основного закона о Кнессете); по сообщениям СМИ, обжаловать их можно до 18 ноября."
      es: "Según el calendario de la Comisión Electoral Central: los resultados se publican el 4 de noviembre de 2026 (ocho días después de las elecciones, según el artículo 11 de la Ley Fundamental: la Knéset); según informaciones, recursos hasta el 18 de noviembre."
      fr: "Selon le calendrier de la Commission électorale centrale : les résultats sont publiés le 4 novembre 2026 (huit jours après les élections, article 11 de la Loi fondamentale : la Knesset) ; selon la presse, recours jusqu’au 18 novembre."
