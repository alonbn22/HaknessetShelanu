      en: A State Comptroller report published in May 2008 criticized the conduct of
        the government company HaMeshakem during Ben-Tzur's tenure as CEO,
        including irregular compensation and benefits for senior staff,
        conflicts of interest and favoritism toward associates. A criminal
        investigation opened against him in 2007 was closed by the prosecution
        for lack of sufficient evidence, and no indictment was filed.
