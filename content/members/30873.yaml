      en: "Served as Deputy Speaker of the 25th Knesset (2023–2025)"
    description:
      he: "על פי רישומי הכנסת, כיהן ארז מלול כסגן יושב ראש הכנסת ה-25 מ-23 באוקטובר 2023 עד סיום כהונתו הראשונה ב-20 ביולי 2025."
      en: "According to Knesset records, Erez Malul served as a Deputy Speaker of the 25th Knesset from 23 October 2023 until the end of his first term on 20 July 2025."
