      - date: "2026-08-22"
        text:
          he: "ועידת רע\"ם בטייבה בחרה את הרשימה: מנסור עבאס, ווליד טאהא, ואליד אלהואשלה, אימאן ח'טיב יאסין (מקום שמור לאישה) ויאסר חוג'יראת; עבאס אמר כי רע\"ם מתכוונת להיות חלק מ\"גוש השינוי\"."
          en: "Ra’am’s convention in Tayibe elected its slate: Mansour Abbas, Walid Taha, Walid Alhwashla, Iman Khatib Yasin (reserved women’s slot) and Yasser Hujirat; Abbas said Ra’am intends to be part of the opposition “change bloc”."
          ar: "انتخب مؤتمر القائمة الموحدة في الطيبة قائمتها: منصور عباس، وليد طه، وليد الهواشلة، إيمان خطيب ياسين (موقع محجوز لامرأة) وياسر حجيرات؛ وقال عباس إن القائمة الموحدة تعتزم أن تكون جزءًا من «كتلة التغيير» المعارِضة."
          ru: "Съезд РААМ в Тайбе избрал её список: Мансур Аббас, Валид Таха, Валид аль-Хавашла, Иман Хатиб-Ясин (место, зарезервированное для женщины) и Ясер Худжейрат; Аббас заявил, что РААМ намерена войти в оппозиционный «блок перемен»."
          es: "La convención de Ra’am en Tayibe eligió su lista: Mansour Abbas, Walid Taha, Walid Alhwashla, Iman Khatib Yasin (puesto reservado a mujeres) y Yasser Hujirat; Abbas dijo que Ra’am pretende formar parte del «bloque del cambio» de la oposición."
          fr: "La convention de Ra’am à Tayibe a élu sa liste : Mansour Abbas, Walid Taha, Walid Alhwashla, Iman Khatib Yasin (place réservée aux femmes) et Yasser Hujirat ; Abbas a déclaré que Ra’am entend faire partie du « bloc du changement » de l’opposition."
        sources:
          - { url: "https://www.timesofisrael.com/raams-abbas-says-palestinian-state-a-reality-drawing-outrage-from-zionist-parties/", title: "Ra'am's Abbas says Palestinian state 'a reality,' drawing outrage from Zionist parties (2026-08-22)", publisher: "The Times of Israel" }
