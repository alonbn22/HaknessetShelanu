claims:
  - kind: positive
    category: achievement
    title:
      he: חבר הכנסת מטעם רע"ם (נבחר לראשונה ב-2019)
      en: Member of Knesset for the United Arab List (Ra'am), first elected 2019
    description:
      he: "וליד טאהא, פוליטיקאי ערבי-ישראלי, תושב כפר קאסם (יליד 1968) וחבר התנועה האסלאמית, נבחר לראשונה לכנסת בבחירות ספטמבר 2019 ושב ונבחר בבחירות 2020, 2021 ו-2022. הוא מכהן כיו״ר סיעת רע״ם בכנסת."
      en: "Walid Taha, an Arab-Israeli politician who lives in Kafr Qasim (born 1968) and a member of the Islamic Movement, was first elected to the Knesset in the September 2019 election and was re-elected in 2020, 2021 and 2022. He serves as chairman of the Ra'am Knesset faction."
      ar: "وليد طه، سياسي عربي من مواطني إسرائيل، من سكان كفر قاسم (مواليد 1968) وعضو في الحركة الإسلامية، انتُخب لأول مرة إلى الكنيست في انتخابات أيلول/سبتمبر 2019، وأُعيد انتخابه في 2020 و2021 و2022. ويشغل منصب رئيس كتلة القائمة العربية الموحّدة في الكنيست."
      ru: "Валид Таха, арабо-израильский политик, житель Кафр-Касема (1968 года рождения) и член Исламского движения, впервые был избран в Кнессет на выборах в сентябре 2019 года и переизбирался в 2020, 2021 и 2022 годах. Он возглавляет фракцию РААМ в Кнессете."
      es: "Walid Taha, político árabe-israelí residente en Kafr Qasim (nacido en 1968) y miembro del Movimiento Islámico, fue elegido por primera vez a la Knéset en las elecciones de septiembre de 2019 y reelegido en 2020, 2021 y 2022. Preside la facción de Ra'am en la Knéset."
      fr: "Walid Taha, homme politique arabe israélien habitant Kafr Qasim (né en 1968) et membre du Mouvement islamique, a été élu pour la première fois à la Knesset lors du scrutin de septembre 2019, puis réélu en 2020, 2021 et 2022. Il préside le groupe de Ra'am à la Knesset."
