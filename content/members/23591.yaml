    title:
      he: אלוף בצה"ל וראש אגף כוח האדם
      en: IDF Major General and Head of the Manpower Directorate
    description:
      he: "אלעזר שטרן התגייס לצה״ל ב-1974 והגיע לדרגת אלוף. בין תפקידיו הבכירים: ראש אגף כוח האדם, מפקד בית הספר לקצינים (בה״ד 1), קצין חינוך ראשי ותפקידי פיקוד בחטיבת הצנחנים. הוא השתחרר מצה״ל ב-2009."
      en: "Elazar Stern enlisted in the IDF in 1974 and reached the rank of major general (aluf). His senior posts included Head of the Manpower Directorate, commander of the IDF Officers Training School (Bahad 1), Chief Education Officer, and command roles in the Paratroopers Brigade. He left the IDF in 2009."
      ar: "تجنّد إلعازار شتيرن في الجيش الإسرائيلي عام 1974 ووصل إلى رتبة لواء. ومن مناصبه الرفيعة: رئيس شعبة القوى البشرية، وقائد مدرسة الضباط (باهاد 1)، وضابط التربية الرئيسي، ومناصب قيادية في لواء المظليين. وسُرّح من الجيش عام 2009."
      ru: "Элазар Штерн призвался в ЦАХАЛ в 1974 году и дослужился до звания генерал-майора (алуф). Среди его высших должностей — начальник Управления личного состава, командир офицерской школы (Бахад 1), главный офицер по воспитательной работе, а также командные должности в бригаде десантников. Он уволился из армии в 2009 году."
      es: "Elazar Stern se alistó en el ejército israelí en 1974 y alcanzó el rango de general de división (aluf). Entre sus cargos principales estuvieron jefe de la Dirección de Personal, comandante de la Escuela de Oficiales (Bahad 1), oficial jefe de Educación y puestos de mando en la Brigada de Paracaidistas. Dejó el ejército en 2009."
      fr: "Elazar Stern s’est engagé dans l’armée israélienne en 1974 et a atteint le grade de général de division (aluf). Parmi ses postes principaux figurent ceux de chef de la direction des ressources humaines, de commandant de l’école des officiers (Bahad 1), d’officier en chef de l’éducation, ainsi que des postes de commandement dans la brigade parachutiste. Il a quitté l’armée en 2009."
