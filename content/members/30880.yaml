    title:
      he: התקבל חוק שיזם לקיזוז כספי הרשות הפלסטינית בגין נזקי טרור (2026)
      en: A law he initiated on offsetting Palestinian Authority funds for terror damages was passed (2026)
    description:
      he: לפי מאגר החקיקה של הכנסת, הצעת חוק פרטית שבוארון היה היוזם הראשון שלה — חוק להקפאת כספים ששילמה הרשות הפלסטינית בזיקה לטרור מהכספים המועברים אליה מממשלת ישראל (תיקון), התשפ"ו–2026 — התקבלה בקריאה שלישית ופורסמה בספר החוקים ב-10 ביוני 2026.
      en: According to the Knesset's legislation database, a private bill of which Boaron was the first initiator — the Freezing of Funds Paid by the Palestinian Authority in Connection with Terrorism out of the Funds Transferred to It by the Government of Israel (Amendment) Law, 5786-2026 — passed its third reading and was published in the official law gazette on 10 June 2026.
