    title:
      he: נזיפה חמורה והרחקה מישיבות הכנסת בהחלטת ועדת האתיקה (מאי 2026)
      en: Severe reprimand and suspension from Knesset sittings by the Ethics Committee (May 2026)
    description:
      he: בהחלטה מס' 25/65 מ-12 במאי 2026 קבעה ועדת האתיקה של הכנסת כי ואטורי הפר את כללי האתיקה בשלושה עניינים - שימוש שלא כדין ברישיון קבלנות (לאחר שרשם הקבלנים קבע ב-4 בינואר 2024 כי פעל בניגוד לחוק רישום קבלנים והתלה את רישיונו ל-3 שנים לצד קנס מרבי), הענקת תעודת הוקרה לזמר אייל גולן "בשם הכנסת" על נייר הנושא את סמל הכנסת, וקידום אירוע ספורט מסחרי ברשתות החברתיות - וכן כי הכינויים "מטומטמת" ו"אפס מאופסת" שהטיח בח"כ נעמה לזימי מהווים ככלל הפרה, תוך התחשבות בנסיבות. הוועדה הטילה עליו נזיפה חמורה והרחקה מישיבות המליאה והוועדות ל-5 ימי ישיבות (18-26 במאי 2026). בתגובתו לוועדה מסר ואטורי כי עניין רישיון הקבלנות "נדון בעבר על ידי ועדת האתיקה" וכי התעודה לגולן ניתנה "על תרומתו הרבה לחיילי צה"ל".
      en: In decision 25/65 of 12 May 2026 the Knesset Ethics Committee found that Vaturi had breached the ethics rules in three matters - unlawful use of a contractor's license (after the Registrar of Contractors ruled on 4 January 2024 that he had acted contrary to the Contractors Registration Law and suspended his license for three years with a maximum fine), awarding singer Eyal Golan a certificate of appreciation "in the name of the Knesset" on paper bearing the Knesset emblem, and promoting a commercial sports event on social media - and that the epithets he directed at MK Naama Lazimi ("idiot", "a total zero") constitute, as a rule, a breach, while taking the circumstances into account. The committee imposed a severe reprimand and removal from plenum and committee sittings for five sitting days (18-26 May 2026). In his response to the committee Vaturi said the contractor-license matter "was discussed in the past by the Ethics Committee" and that the certificate to Golan was given "for his great contribution to IDF soldiers".
    sources:
      - url: https://main.knesset.gov.il/Activity/committees/Ethics/Decisions25/Decisions25-56.pdf
        title: "החלטה מס' 25/65 - החלטת ועדת האתיקה בקובלנות נגד חבר הכנסת ניסים ואטורי מיום 12 במאי 2026"
        publisher: The Knesset (Ethics Committee)
      - url: https://www.mako.co.il/news-politics/2026_q2/Article-c04ce82d89c1e91027.htm
        title: ועדת האתיקה הטילה עונשים על ואטורי, סעדה ולזימי
        publisher: N12
