      en: Pushed to an unrealistic slot in the Likud primary ahead of the 2026 election
    description:
      he: בפריימריז הליכוד ב-17 באוגוסט 2026 קיבלה סילמן 17,850 קולות ודורגה במקום ה-25
        ברשימה הארצית — מקום שמציב אותה, לאחר שילוב המשוריינים, במקום ה-46 ברשימת
