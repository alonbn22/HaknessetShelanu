    title:
      he: חקירת חשד למינוי פוליטי ואי-סדרים במשרד החינוך
      en: Investigation into suspected political favoritism at the Education Ministry
    description:
      he: במרץ 2025 פנתה התנועה לאיכות השלטון לרשויות אכיפת החוק בדרישה לפתוח בחקירה
        פלילית נגד קיש, בעקבות פרסומים לפיהם נחשד כי הקצה משאבים תקציביים של
        משרד החינוך לרשויות מקומיות בעלות ראשי ערים מהליכוד באופן שעשוי לסייע
        למעמדו הפוליטי. דווח כי המשטרה בוחנת את החשדות. קיש הכחיש את הטענות.
        נכון למועד הדיווחים, מדובר בבדיקה ראשונית וקיש לא הואשם בכל עבירה.
      en: In March 2025 the Movement for Quality Government in Israel asked
        law-enforcement authorities to open a criminal investigation against
        Kisch, following reports alleging he directed Education Ministry
        budgetary resources to local authorities with Likud mayors in a manner
        that could benefit his political standing. Police were reported to be
        examining the allegations. Kisch denied the allegations. As reported,
        the matter is at a preliminary stage and Kisch has not been charged with
        any offense.
