      en: In December 2021, Haim Katz was convicted, under a plea bargain, of
        conspiracy to achieve a goal that was in itself legal but by improper
        means, in connection with the use of his authority as chairman of the
        Knesset Labor and Welfare Committee. The original indictment had
        included fraud and breach of trust. Under the plea deal a suspended
        prison term and a fine were recommended. Katz resigned as Welfare
        Minister in August 2019 after the Attorney General announced his
        intention to indict him.
