      he: "חתימה על צו לסגירת פעילות אל-ג'זירה בישראל"
      en: "Signed order shutting down Al Jazeera's operations in Israel"
    description:
      he: "ב-5 במאי 2024, לאחר החלטת ממשלה פה אחד, חתם שר התקשורת קרעי על צווים לסגירת פעילות רשת אל-ג'זירה בישראל ולהחרמת ציוד השידור שלה, מכוח חוק שאושר בכנסת באפריל 2024 המאפשר סגירה זמנית של כלי תקשורת זרים מטעמי ביטחון; פקחי משרד התקשורת והמשטרה פשטו על משרדי הרשת בירושלים. אל-ג'זירה וארגוני חופש העיתונות מתחו ביקורת על המהלך. מדובר בפעולה מנהלית-שלטונית ולא בהליך פלילי הנוגע לקרעי עצמו."
      en: "On 5 May 2024, following a unanimous government decision, Communications Minister Karhi signed orders to shut down Al Jazeera's operations in Israel and seize its broadcasting equipment, under a law passed by the Knesset in April 2024 permitting the temporary closure of foreign media outlets on security grounds; ministry inspectors and police raided the network's Jerusalem offices. Al Jazeera and press-freedom organizations criticized the move. This is an official administrative ministerial action and not a criminal matter concerning Karhi personally."
    date: "2024-05-05"
