      he: "שר הדתות בממשלה ה-37"
      en: "Minister of Religious Affairs in the 37th government"
    description:
      he: "מלכיאלי מונה לשר לשירותי דת בממשלה ה-37 בראשות בנימין נתניהו ב-29 בדצמבר 2022 וכיהן בתפקיד עד יולי 2025. במהלך כהונתו עסק משרדו בין היתר בהסדרת מינוי רבני ערים; במרץ 2025, בעקבות עתירה לבג\"ץ, חזר בו מתקנות שהיו מעניקות למשרדו שליטה בוועדות הבחירה של רבני ערים."
      en: "Malchieli was appointed Minister of Religious Services in Benjamin Netanyahu's 37th government on 29 December 2022 and served until July 2025. During his tenure his ministry addressed matters such as the appointment of city rabbis; in March 2025, following a High Court petition, he backed down from regulations that would have given his ministry control over the selection committees for city rabbis."
    date: "2022-12-29"
