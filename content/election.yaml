# Upcoming Knesset election (EDITORIAL). Every claim below was researched and
# re-verified against its cited sources on lastReviewed; statuses are honest:
#   confirmed        = an official source states it
#   scheduled-by-law = the statutory default
#   reported         = media reports (may change)
# Party line-ups are NOT final until lists are submitted to the Central
# Elections Committee (~47 days before election day) — keep the "expected"
# framing. he/en authored; ar/ru fall back to en. UPDATE as the campaign moves:
# re-verify each item, bump lastReviewed, and prune anything that changed.
knesset: 26
expectedDate: "2026-10-27"
dateStatus: set
lastReviewed: "2026-09-13"

headline:
  he: "הבחירות לכנסת ה-26 יתקיימו ביום שלישי, 27 באוקטובר 2026."
  en: "The 26th Knesset election is set for Tuesday, October 27, 2026."

intro:
  he: "הכנסת ה-25 השלימה קדנציה מלאה והתפזרה ב-17 ביולי 2026, והבחירות יתקיימו במועד הקבוע בחוק. הרשימות הוגשו ב-7–8 בספטמבר 2026. בעמוד זה: המועדים, מי מתמודד ועם מי, כללי הבחירות והנתונים — כל פריט עם מקור."
  en: "The 25th Knesset completed a full term and dispersed on July 17, 2026; the election will be held on its statutory date. The lists were submitted on September 7–8, 2026. This page covers the timeline, who is running and with whom, the rules, and the numbers — every item with a source."

# The road to the 26th Knesset — when each thing becomes known/final.
keyDates:
  - key: kd-lists
    date: "2026-09-08"
    label: { he: "הגשת רשימות המועמדים — ההרכבים סופיים", en: "Candidate lists submitted — line-ups are final" }
    detail:
      he: "38 רשימות הוגשו ליו\"ר ועדת הבחירות המרכזית, השופט נעם סולברג, במשכן הכנסת ב-7–8 בספטמבר 2026. ההגשה אינה אישור: הרשימות, הכינויים והאותיות נבדקים כעת."
      en: "38 lists were submitted to the chair of the Central Elections Committee, Justice Noam Sohlberg, at the Knesset on September 7–8, 2026. Submission is not approval: the lists, names and ballot letters are now under review."
    status: confirmed
    sources:
      - url: "https://ch10.co.il/news/1100694/"
        title: "הרשימות נסגרו: מי יהיו 120 הח\"כים? אלו המתמודדים בבחירות לכנסת ה-26"
        publisher: "חרדים10"
      - url: "https://www.emess.co.il/radio/1927478"
        title: "תם המרוץ: 38 רשימות הגישו מועמדות לכנסת ה-26"
        publisher: "אמס"
      - url: "https://www.mako.co.il/news-israel-elections/2026/liveblog-5bc9483b18b70a1026.htm"
        title: "כל העדכונים מסגירת הרשימות לכנסת ה-26"
        publisher: "N12"
  - key: kd-approval
    date: "2026-09-27"
    label: { he: "אישור הרשימות הסופי", en: "Final approval of the lists" }
    detail:
      he: "לפי הדיווח, ועדת הבחירות המרכזית צפויה לאשר סופית את הרשימות עד 27 בספטמבר 2026."
      en: "Per reporting, the Central Elections Committee is expected to give final approval to the lists by September 27, 2026."
    status: reported
    sources:
      - url: "https://ch10.co.il/news/1100694/"
        title: "הרשימות נסגרו: מי יהיו 120 הח\"כים?"
        publisher: "חרדים10"
  - key: kd-election
    date: "2026-10-27"
    label: { he: "יום הבחירות", en: "Election day" }
    detail: { he: "יום שלישי, ט\"ז בחשוון התשפ\"ז. יום שבתון.", en: "Tuesday, 16 Cheshvan 5787. A public day of rest." }
    status: confirmed
    sources:
      - url: "https://www.gov.il/he/departments/central-elections-committee/govil-landing-page"
        title: "ועדת הבחירות המרכזית לכנסת — הבחירות לכנסת ה-26"
        publisher: "gov.il / ועדת הבחירות"
  - key: kd-results
    date: "2026-11-04"
    label: { he: "תוצאות רשמיות", en: "Official results" }
    detail:
      he: "לפי דיווחים, התוצאות הסופיות צפויות עד 4 בנובמבר (שמונה ימים אחרי הבחירות); ערעורים עד 18 בנובמבר."
      en: "Per reports, final results are expected by November 4 (eight days after the election); appeals by November 18."
    status: reported
    sources:
      - url: "https://www.i24news.tv/he/news/israel-elections-2026/artc-8c8f593a"
        title: "הלו\"ז המלא לבחירות 2026"
        publisher: "i24NEWS"
  - key: kd-convene
    date: "2026-11-10"
    label: { he: "כינוס הכנסת ה-26", en: "The 26th Knesset convenes" }
    detail:
      he: "ישיבתה הראשונה של הכנסת ה-26 צפויה ב-10 בנובמבר 2026; לאחר מכן מתחיל תהליך הרכבת הממשלה."
      en: "The 26th Knesset's first sitting is expected on November 10, 2026; government formation begins thereafter."
    status: reported
    sources:
      - url: "https://www.zman.co.il/live/705042/"
        title: "לוח הזמנים לבחירות לכנסת"
        publisher: "Zman Yisrael"

facts:
  - key: election-date
    label: { he: "מועד הבחירות", en: "Election date" }
    value: { he: "יום שלישי, ט\"ז בחשוון התשפ\"ז — 27 באוקטובר 2026", en: "Tuesday, 16 Cheshvan 5787 — October 27, 2026" }
    detail:
      he: "המועד נקבע על ידי יו\"ר ועדת הבחירות המרכזית, שופט בית המשפט העליון נעם סולברג, ועוגן גם בחקיקה במליאת הכנסת ביולי 2026."
      en: "The date was set by Central Elections Committee chair Justice Noam Sohlberg and was also anchored in legislation by the Knesset plenum in July 2026."
    status: confirmed
    sources:
      - url: "https://www.gov.il/he/departments/central-elections-committee/govil-landing-page"
        title: "ועדת הבחירות המרכזית לכנסת — הבחירות לכנסת ה-26"
        publisher: "gov.il / ועדת הבחירות"
      - url: "https://www.timesofisrael.com/judge-sets-date-for-next-scheduled-elections-for-october-2026/"
        title: "October 27, 2026: Judge sets date for next scheduled elections"
        publisher: "The Times of Israel"
      - url: "https://www.zman.co.il/live/705042/"
        title: "לוח הזמנים לבחירות לכנסת"
        publisher: "Zman Yisrael"
  - key: full-term
    label: { he: "קדנציה מלאה", en: "A full term" }
    detail:
      he: "הכנסת ה-25 (נבחרה ב-1.11.2022, הושבעה ב-15.11.2022) השלימה קדנציה מלאה והתפזרה ב-17 ביולי 2026 — על פי דיווחים, הפעם הראשונה מאז 1988 שהבחירות מתקיימות במועדן החוקי המלא."
      en: "The 25th Knesset (elected Nov 1, 2022, sworn in Nov 15, 2022) completed a full term and dispersed on July 17, 2026 — per reports, the first time since 1988 that elections are held on their full statutory date."
    status: reported
    sources:
      - url: "https://www.aljazeera.com/news/2026/7/17/knesset-dissolves-how-will-israel-vote-in-octobers-general-election"
        title: "Knesset dissolves: How will Israel vote in October's general election?"
        publisher: "Al Jazeera"
      - url: "https://www.timesofisrael.com/knesset-expected-to-dissolve-july-17-paving-way-for-october-27-election/"
        title: "Knesset expected to dissolve July 17, paving way for October 27 election"
        publisher: "The Times of Israel"
  - key: statutory-basis
    label: { he: "הבסיס החוקי למועד", en: "Statutory basis for the date" }
    detail:
      he: "לפי חוק-יסוד: הכנסת (סעיפים 8–9), בתום כהונה מלאה הבחירות מתקיימות ביום שלישי בחודש חשוון; מכאן נגזר המועד 27 באוקטובר 2026 — המועד המאוחר ביותר המותר בחוק."
      en: "Under Basic Law: The Knesset (sections 8–9), after a full term elections are held on a Tuesday in the Hebrew month of Cheshvan; this yields October 27, 2026 — the latest date permitted by law."
    status: scheduled-by-law
    sources:
      - url: "https://en.wikipedia.org/wiki/2026_Israeli_legislative_election"
        title: "2026 Israeli legislative election"
        publisher: "Wikipedia"
      - url: "https://www.timesofisrael.com/judge-sets-date-for-next-scheduled-elections-for-october-2026/"
        title: "October 27, 2026: Judge sets date for next scheduled elections"
        publisher: "The Times of Israel"
  - key: list-deadline
    label: { he: "הגשת רשימות המועמדים", en: "Candidate-list submission" }
    value: { he: "צפוי בסביבות 9-10 בספטמבר 2026", en: "Expected around September 9–10, 2026" }
    detail:
      he: "הרשימות מוגשות לוועדת הבחירות המרכזית בסביבות היום ה-47 שלפני הבחירות; יש דיווח אחד (i24NEWS) על 7 בספטמבר — המועד המדויק טעון פרסום רשמי של ועדת הבחירות."
      en: "Lists are submitted to the Central Elections Committee around the 47th day before election day; one report (i24NEWS) says September 7 — the exact date awaits the CEC's official timetable."
    status: reported
    sources:
      - url: "https://www.zman.co.il/live/705042/"
        title: "לוח הזמנים לבחירות לכנסת: המועד האחרון להגשת מועמדות"
        publisher: "Zman Yisrael"
      - url: "https://www.i24news.tv/he/news/israel-elections-2026/artc-8c8f593a"
        title: "הלו\"ז המלא לבחירות 2026"
        publisher: "i24NEWS"
  - key: cec-chair
    label: { he: "יו\"ר ועדת הבחירות", en: "Elections Committee chair" }
    value: { he: "השופט נעם סולברג", en: "Justice Noam Sohlberg" }
    detail:
      he: "שופט בית המשפט העליון נעם סולברג עומד בראש ועדת הבחירות המרכזית לכנסת ה-26."
      en: "Supreme Court Justice Noam Sohlberg chairs the Central Elections Committee for the 26th Knesset."
    status: reported
    sources:
      - url: "https://www.timesofisrael.com/judge-sets-date-for-next-scheduled-elections-for-october-2026/"
        title: "October 27, 2026: Judge sets date for next scheduled elections"
        publisher: "The Times of Israel"
      - url: "https://www.gov.il/he/departments/central-elections-committee/govil-landing-page"
        title: "ועדת הבחירות המרכזית לכנסת"
        publisher: "gov.il"
  - key: results-timeline
    label: { he: "תוצאות וכינוס הכנסת", en: "Results & convening" }
    detail:
      he: "לפי דיווחים, התוצאות הרשמיות צפויות עד 4 בנובמבר 2026 (שמונה ימים אחרי הבחירות), ערעורים עד 18 בנובמבר, וישיבתה הראשונה של הכנסת ה-26 צפויה ב-10 בנובמבר 2026."
      en: "Per reports, official results are expected by November 4, 2026 (eight days after the election), appeals by November 18, and the 26th Knesset's first sitting is expected on November 10, 2026."
    status: reported
    sources:
      - url: "https://www.i24news.tv/he/news/israel-elections-2026/artc-8c8f593a"
        title: "הלו\"ז המלא לבחירות 2026"
        publisher: "i24NEWS"
      - url: "https://www.zman.co.il/live/705042/"
        title: "לוח הזמנים לבחירות לכנסת"
        publisher: "Zman Yisrael"

