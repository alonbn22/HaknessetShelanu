    title:
      he: "הוביל מאבק נגד פיטורי רכזי הלהט\"ב ברשויות המקומיות; המשרד לשוויון חברתי הודיע על הארכת העסקתם"
      en: "Led a campaign against dismissal of LGBTQ+ coordinators in local authorities; the Social Equality Ministry extended their employment"
    description:
      he: "ביוני 2026 הוביל להב-הרצנו, יחד עם האגודה למען הלהט\"ב, מאבק נגד הכוונה להפסיק את העסקתם של כ-52 רכזי ורכזות להט\"ב ברשויות המקומיות, לאחר שבתחילת החודש נמסרה להם הודעה על סיום עבודתם. ב-22 ביוני 2026 הודיע המשרד לשוויון חברתי על הארכת העסקתם; להב-הרצנו אמר כי לא ניתן להמשיך \"מהארכה להארכה\" וקרא לעגן את התקציב בבסיס התקציב."
      en: "In June 2026 Lahav-Hertzanu, together with the Aguda (Israel's LGBTQ+ association), led a campaign against the planned termination of about 52 LGBTQ+ coordinators employed by local authorities, after they were notified earlier that month that their jobs would end. On 22 June 2026 the Ministry of Social Equality announced that their employment would be extended; Lahav-Hertzanu said the community could not keep living \"from extension to extension\" and called for the budget to be anchored in the base budget."
    sources:
