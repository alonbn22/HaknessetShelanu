    title:
      he: שר הנגב, הגליל והחוסן הלאומי בממשלה ה-37 (מכהן; מונה מחדש במרץ 2025)
      en: Minister of the Negev, the Galilee and National Resilience in the 37th government (serving; reappointed March 2025)
    description:
      he: לפי רישומי הכנסת כיהן וסרלאוף כשר הנגב, הגליל והחוסן הלאומי מ-29 בדצמבר 2022 עד 21 בינואר 2025, אז נכנסה לתוקף התפטרות שרי עוצמה יהודית מהממשלה במחאה על אישור עסקת החטופים והפסקת האש בעזה. ב-19 במרץ 2025, לאחר חידוש הלחימה, אישרה הכנסת את שובה של עוצמה יהודית לממשלה ווסרלאוף מונה מחדש לשר הנגב והגליל — תפקיד שבו הוא ממשיך לכהן גם בממשלת המעבר לאחר פיזור הכנסת ב-17 ביולי 2026.
      en: According to Knesset records, Wasserlauf served as Minister of the Negev, the Galilee and National Resilience from 29 December 2022 until 21 January 2025, when the resignation of Otzma Yehudit's ministers from the government — in protest at the approval of the Gaza hostage and ceasefire deal — took effect. On 19 March 2025, after fighting resumed, the Knesset approved Otzma Yehudit's return to the government and Wasserlauf was reappointed Minister of the Negev and the Galilee, a post he continues to hold in the caretaker government following the Knesset's dissolution on 17 July 2026.
