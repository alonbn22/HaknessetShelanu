    date: 2026-05-20
    title:
      he: 'התבטאות במליאה נגד ח"כ גלעד קריב: "מחתן כלבים בבתי הכנסת ההזויים שלך"; שגריר ישראל בארה"ב גינה'
      en: 'Plenum remark against MK Gilad Kariv – "marrying dogs in your delusional synagogues"; Israel''s ambassador to the US condemned it'
    description:
      he: 'ב-20 במאי 2026, לאחר שקריב ביקר את הדיווח על העסקת קבלן הקולות רפי קדושים כיועץ במשרדה, אמרה גולן מעל בימת הכנסת: "מה שרפי קדושים עושה, אתה לא תעשה עוד מאתיים גלגולים כשאתה הולך עם נשות הכותל או מחתן כלבים בבתי הכנסת ההזויים שלך". קריב כינה את הדברים השמצה אנטישמית נגד מיליוני יהודים רפורמים, ושגריר ישראל בארה"ב יחיאל לייטר כתב כי הדברים "מגעילים ומבישים" והתחייב להתנצל בשם ישראל בפני ראשי התנועה הרפורמית. בדיווחים לא הובאה תגובה מגולן.'
      en: 'On 20 May 2026, after Kariv criticized reports that she had hired the Likud vote contractor Rafi Kedoshim as an adviser in her ministry, Golan said from the Knesset podium: "What Rafi Kedoshim has been doing, you won''t do in another 200 incarnations – while you walk with the Women of the Wall or marry dogs in your delusional synagogues." Kariv called the remarks antisemitic slander against millions of Reform Jews, and Israel''s ambassador to the US, Yechiel Leiter, wrote that the words were "disgusting and reprehensible" and pledged to apologize on Israel''s behalf to Reform movement leaders. The reports carried no response from Golan.'
    sources:
