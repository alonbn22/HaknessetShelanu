    title:
      he: עבר מעוצמה יהודית לליכוד וזכה במקום השמיני בפריימריז
      en: Moved from Otzma Yehudit to Likud and placed eighth in the primary
    description:
      he: ב-12 באוגוסט 2026 הודיע כהן כי יתמודד בפריימריז הליכוד, לאחר שעבר מעוצמה
        יהודית לליכוד. בפריימריז שנערכו ב-17 באוגוסט 2026 דורג במקום השמיני
        ברשימה הארצית, וברשימת הליכוד שהוגשה לוועדת הבחירות ב-8 בספטמבר 2026 הוא
        מוצב במקום ה-13.
      en: On 12 August 2026 Cohen announced he would run in the Likud primary, having
        moved from Otzma Yehudit to Likud. In the primary held on 17 August 2026
        he was ranked eighth in the national ranking, and on the Likud list
        submitted to the Central Elections Committee on 8 September 2026 he is
        placed 13th.
