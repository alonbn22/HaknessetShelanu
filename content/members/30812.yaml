    title:
      he: בית משפט השלום דחה את תביעת הדיבה שהגיש נגד גיא פלג וחדשות 12
      en: Magistrate's court dismissed his defamation suit against Guy Peleg and Channel 12 News
    description:
      he: בנובמבר 2023 תבע רוטמן את העיתונאי גיא פלג, חדשות 12 ונתבעים נוספים בסך כ-1.1
        מיליון ש"ח, בטענה שדיווח שייחס לו אמירה בדיון סגור שלפיה "דמם של האחים
        הלל ויגל יניב שנרצחו בחווארה אדום יותר מדם הנרצחים ב-7 באוקטובר" סילף את
        דבריו. ב-29 ביולי 2026 דחה השופט אורן זילברמן מבית משפט השלום בירושלים את
        התביעה וקיבל את הגנת "אמת דיברתי", לאחר שעדים העידו כי רוטמן אמר את הדברים
        וחזר בו מיד; בית המשפט לא חייב את רוטמן בהוצאות. רוטמן הכחיש שאמר את
        הדברים וכינה את הדיווח "שקר".
      en: In November 2023 Rothman sued journalist Guy Peleg, Channel 12 News and
        other defendants for about NIS 1.1 million, claiming a report attributing
        to him a remark in a closed hearing that "the blood of the brothers
        Hallel and Yagel Yaniv murdered in Huwara is redder than the blood of
        those murdered on October 7" had distorted his words. On 29 July 2026
        Judge Oren Silberman of the Jerusalem Magistrate's Court dismissed the
        suit and accepted the truth defense, after witnesses testified that
        Rothman had made the remark and immediately retracted it; the court did
        not order Rothman to pay costs. Rothman denied making the statement and
        called the report "a lie".
