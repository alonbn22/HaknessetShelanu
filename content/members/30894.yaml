    title:
      he: "רקע מקצועי בחינוך: מורה, מרצה ומנהל אגף החינוך בשגב שלום"
      en: "Career in education: teacher, lecturer and head of the Segev Shalom education department"
    description:
      he: "טרם כניסתו לכנסת עסק בן סעיד בחינוך: בשנים 2003–2014 שימש מורה במספר בתי ספר, ובהם התיכון המקיף בשגב שלום, והרצה באוניברסיטאות ובמכללות; בשנים 2014–2018 ניהל את אגף החינוך במועצה המקומית שגב שלום. הוא בעל תואר ראשון ושני בשפה ובספרות ערבית מאוניברסיטת מואתה ותואר דוקטור בתחום ההוראה מאוניברסיטת אל-ירמוכ שבירדן."
      en: "Before entering the Knesset, Bin Said worked in education: from 2003 to 2014 he taught at several schools, including the Segev Shalom comprehensive high school, and lectured at universities and colleges; from 2014 to 2018 he headed the education department of the Segev Shalom local council. He holds bachelor's and master's degrees in Arabic language and literature from Mu'tah University and a doctorate in teaching methodology from Yarmouk University in Jordan."
