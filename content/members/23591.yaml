      he: התפטר מהכנסת ה-25; כהונתו הסתיימה ב-9 בספטמבר 2026
      en: Resigned from the 25th Knesset; his term ended on 9 September 2026
    description:
      he: "שטרן הגיש את מכתב התפטרותו מהכנסת ליו\"ר הכנסת אמיר אוחנה בתחילת ספטמבר 2026, במכתב שבו מתח ביקורת חריפה על תפקודו של היו\"ר. לפי נתוני הכנסת, כהונתו כחבר כנסת וחברותו בוועדת החוץ והביטחון ובוועדות המשנה שלה הסתיימו ב-9 בספטמבר 2026; הוא אינו מכהן עוד כחבר כנסת."
      en: "Stern submitted his letter of resignation from the Knesset to Speaker Amir Ohana in early September 2026, in a letter sharply critical of the Speaker's conduct. According to Knesset records, his term as an MK and his membership of the Foreign Affairs and Defense Committee and its subcommittees ended on 9 September 2026; he no longer serves in the Knesset."
