    date: 2026-09-09
    title:
      he: "עומד בראש רשימת כחול לבן לכנסת ה-26 ודוחה לחצים לפרוש מהמירוץ"
      en: "Heads the Blue and White list for the 26th Knesset and rejects pressure to quit the race"
    description:
      he: "ב-8 בספטמבר 2026 הגישה כחול לבן את רשימתה לבחירות 27 באוקטובר, ובראשה גנץ. הדבר בא לאחר פרישת חברי כנסת מהמפלגה (ובהם יעל רון בן משה באוגוסט), ועל רקע סקרים שבהם המפלגה מתקשה לעבור את אחוז החסימה. ב-9 בספטמבר דווח כי בכירים ב\"גוש השינוי\" לוחצים על גנץ לפרוש; גנץ הצהיר קודם לכן: \"אני מתחייב שלא אשרוף קולות... אני רץ עד הסוף\", ואמר כי יפעל להקמת ממשלת אחדות רחבה."
      en: "On 8 September 2026 Blue and White submitted its list for the 27 October election with Gantz at its head. This followed departures of MKs from the party (including Yael Ron Ben-Moshe in August) and polls in which the party struggled to pass the electoral threshold. On 9 September it was reported that senior figures in the \"change bloc\" were pressing Gantz to withdraw; Gantz had earlier declared: \"I commit that I will not burn votes... I am running to the end,\" and said he would work for a broad unity government."
