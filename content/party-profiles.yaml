      - date: "2025-04-06"
        text:
          he: "אלמוג כהן מונה לסגן שר במשרד ראש הממשלה (2 באפריל 2025) והתפטר מהכנסת לפי החוק הנורבגי; במקומו נכנס צבי סוכות (הציונות הדתית), הבא בתור ברשימה המשותפת של 2022, והסיעה ירדה ל-6 חברים. באוגוסט 2026 התמודד כהן בפריימריז של הליכוד והוא במקום ה-13 ברשימת הליכוד."
          en: "Almog Cohen was appointed deputy minister in the Prime Minister’s Office (2 April 2025) and resigned from the Knesset under the Norwegian law; Zvi Sukkot (Religious Zionism), next on the 2022 joint list, took the seat and the faction fell to 6 members. In August 2026 Cohen ran in the Likud primary and is 13th on the Likud list."
          ar: "عُيّن ألموغ كوهين نائبًا للوزير في مكتب رئيس الحكومة (2 نيسان/أبريل 2025) واستقال من الكنيست بموجب «القانون النرويجي»؛ ودخل مكانه تسفي سوكوت (الصهيونية الدينية)، التالي في قائمة «الصهيونية الدينية» المشتركة لعام 2022، فانخفضت الكتلة إلى 6 أعضاء. وفي آب/أغسطس 2026 خاض كوهين الانتخابات التمهيدية لليكود وهو في الموقع الـ13 في قائمة الليكود."
          ru: "Альмог Коэн был назначен заместителем министра в канцелярии премьер-министра (2 апреля 2025 года) и сложил мандат по «норвежскому закону»; его место занял Цви Суккот («Религиозный сионизм»), следующий по совместному списку 2022 года, и во фракции осталось 6 депутатов. В августе 2026 года Коэн участвовал в праймериз Ликуда и идёт 13-м в списке Ликуда."
          es: "Almog Cohen fue nombrado viceministro en la Oficina del Primer Ministro (2 de abril de 2025) y renunció a la Knéset según la Ley Noruega; Zvi Sukkot (Sionismo Religioso), siguiente en la lista conjunta de 2022, ocupó el escaño y la facción bajó a 6 miembros. En agosto de 2026 Cohen se presentó a las primarias del Likud y es 13.º en la lista del Likud."
          fr: "Almog Cohen a été nommé vice-ministre au bureau du Premier ministre (2 avril 2025) et a démissionné de la Knesset en vertu de la « loi norvégienne » ; Zvi Sukkot (Sionisme religieux), suivant sur la liste commune de 2022, a pris le siège et la faction est passée à 6 membres. En août 2026, Cohen s’est présenté à la primaire du Likoud et il est 13e sur la liste du Likoud."
        sources:
          - { url: "https://www.timesofisrael.com/former-otzma-yehudit-mk-to-run-in-likud-primary-after-netanyahu-opens-door/", title: "Former Otzma Yehudit MK to run in Likud primary after Netanyahu opens door (2026-08-12)", publisher: "The Times of Israel" }
