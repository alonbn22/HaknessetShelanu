      en: "Bismuth served as Israel's ambassador to Mauritania from July 2004 to August 2008, appointed on the initiative of Foreign Minister Silvan Shalom. In February 2008 the embassy in Nouakchott was the target of a failed shooting attack claimed by al-Qaeda."
