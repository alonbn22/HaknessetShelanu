    description:
      he: "ב-6 בספטמבר 2026 הציג ליברמן את רשימת ישראל ביתנו לכנסת ה-26, ובראשה הוא עצמו. רפי בן שטרית, ראש עיריית בית שאן לשעבר, הוצב במקום השני, אל\"מ (מיל') טליה לנקרי במקום השלישי, וחברי הכנסת עודד פורר ויוליה מלינובסקי במקומות הרביעי והחמישי."
      en: "On 6 September 2026 Lieberman presented the Yisrael Beiteinu list for the 26th Knesset, headed by himself. Former Beit Shean mayor Rafi Ben Shitrit was placed second, Col. (res.) Talya Lankri third, and MKs Oded Forer and Yulia Malinovsky fourth and fifth."
