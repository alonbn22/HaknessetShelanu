    description:
      he: בפריימריז של הציונות הדתית, שנערכו במרכז המפלגה ב-26 ביולי 2026, דורג רוטמן
        במקום השלישי ברשימה לכנסת ה-26, אחרי בצלאל סמוטריץ' ואורית סטרוק.
