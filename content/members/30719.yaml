      en: On 25 August 2026 Cassif tried to enter the West Bank village of Kusra,
        declared a closed military zone after clashes between settlers and
        Palestinians, and alleged that soldiers assaulted him at a checkpoint.
        The IDF said the dispute concerned accompanying individuals who were
        not Knesset members seeking entry to the closed area, and that the
        soldiers' conduct was being examined.
