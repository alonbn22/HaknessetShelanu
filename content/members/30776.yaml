    title:
      he: "עתירה לבג\"ץ שהובילה להקפאת העברה של כמיליארד ש\"ח לרשתות חינוך חרדיות"
      en: "High Court petition that led to a freeze on a NIS 1 billion transfer to Haredi education networks"
    description:
      he: "ב-31 בדצמבר 2025 הוציא בג\"ץ צו ביניים המונע העברה של יותר מ-1.09 מיליארד ש\"ח לרשתות חינוך חרדיות עד לדיון בעתירה, שהגישו יו\"ר יש עתיד יאיר לפיד וחברי הכנסת ולדימיר בליאק, נאור שירי ומשה טור-פז בטענה שההעברה נעשתה שלא כדין למוסדות שאינם מפוקחים. חברי כנסת חרדים תקפו את ההחלטה בחריפות."
      en: "On 31 December 2025 the High Court of Justice issued an interim order blocking the transfer of more than NIS 1.09 billion to Haredi education networks pending a hearing on a petition filed by Yesh Atid chair Yair Lapid and MKs Vladimir Beliak, Naor Shiri and Moshe Tur-Paz, who argued the transfer to unsupervised institutions was unlawful. Haredi lawmakers sharply attacked the ruling."
    date: "2025-12-31"
    sources:
      - url: "https://www.ynet.co.il/news/article/bk9smagvbg"
        title: "בג\"ץ הקפיא מיליארד שקלים לחינוך לחרדים, שתקפו: \"פירומנים, הכרזתם מלחמה\""
        publisher: "ynet"
      - url: "https://he.wikipedia.org/wiki/%D7%95%D7%9C%D7%93%D7%99%D7%9E%D7%99%D7%A8_%D7%91%D7%9C%D7%99%D7%90%D7%A7"
        title: "ולדימיר בליאק"
        publisher: "Wikipedia (Hebrew)"
  - kind: negative
    category: controversy
    status: settled
    title:
      he: "נזיפה חמורה והגבלת כלים פרלמנטריים מוועדת האתיקה (מרץ 2023)"
      en: "Severe reprimand and restriction of parliamentary tools by the Ethics Committee (March 2023)"
    description:
      he: "ב-5 במרץ 2023 קבעה ועדת האתיקה של הכנסת פה אחד כי בליאק, יוראי להב הרצנו ושלי טל מירון הפרו את כללי האתיקה כשקפצו מעל שולחן ועדת החוקה ב-13 בפברואר 2023, במהלך הצבעות על חקיקת הרפורמה המשפטית, והתקדמו לעבר יו\"ר הוועדה. על בליאק ולהב הרצנו הוטלו נזיפה חמורה והגבלת השימוש בכלים פרלמנטריים (הגשת הצעות חוק ושאילתות) עד סוף הכנס, בין היתר משום שסירבו להתנצל. בליאק טען בפני הוועדה כי לא נהג באלימות וכי הוא מייצג ציבור רחב החרד מהרפורמה."
      en: "On 5 March 2023 the Knesset Ethics Committee unanimously found that Beliak, Yorai Lahav-Hertzanu and Shelly Tal Meron had breached the ethics rules by jumping over the Constitution Committee's table on 13 February 2023, during votes on the judicial-overhaul legislation, and advancing towards the committee chair. Beliak and Lahav-Hertzanu received a severe reprimand and were barred from using parliamentary tools (submitting bills and queries) until the end of the Knesset session, in part because they declined to apologise. Beliak told the committee he had not acted violently and that he represented a broad public alarmed by the overhaul."
    date: "2023-03-05"
    sources:
      - url: "https://main.knesset.gov.il/Activity/committees/Ethics/Decisions25/Decisions25-3.pdf"
        title: "החלטה מס' 3/25 — החלטת ועדת האתיקה בקובלנות נגד חברי הכנסת יוראי להב הרצנו, ולדימיר בליאק ושלי מירון"
        publisher: "The Knesset (Ethics Committee)"
      - url: "https://www.haaretz.com/israel-news/2023-03-06/ty-article/.premium/knesset-ethics-committee-imposes-sanctions-on-three-lawmakers/00000186-b623-d9eb-abce-beef7f2c0000"
        title: "Knesset Ethics Committee Imposes Sanctions on Three Lawmakers"
        publisher: "Haaretz"
  - kind: negative
    category: controversy
    status: settled
    title:
      he: "נזיפה מוועדת האתיקה על התבטאויות כלפי חברי כנסת (יוני 2025)"
      en: "Ethics Committee reprimand over remarks about fellow MKs (June 2025)"
    description:
      he: "ב-23 ביוני 2025 החליטה ועדת האתיקה פה אחד להטיל על בליאק נזיפה, לאחר שקבעה כי הפר את כללי האתיקה כשכינה את סיעת עוצמה יהודית \"מפלגה ניאו-נאצית\" בדיון בוועדת הכספים (17 בספטמבר 2024) וכשאמר על ח\"כ שמחה רוטמן כי הוא \"אחד האנשים שהביאו עלינו את אסון השבת השחורה\" (12 בדצמבר 2023). בליאק עמד על ההשוואה לעוצמה יהודית; על הערה שהפנה לח\"כ אלמוג כהן הוא התנצל, והוועדה קבעה כי ההתנצלות, שהתקבלה, מרפאת את הפגם. הוועדה הזהירה כי שימוש חוזר בדימויים מהשואה יגרור סנקציה חמורה יותר."
      en: "On 23 June 2025 the Knesset Ethics Committee unanimously reprimanded Beliak after finding he had breached the ethics rules by calling the Otzma Yehudit faction a \"neo-Nazi party\" at a Finance Committee hearing (17 September 2024) and by saying of MK Simcha Rothman that he was \"one of the people who brought the Black Sabbath disaster upon us\" (12 December 2023). Beliak stood by the Otzma Yehudit comparison; he apologised for a remark aimed at MK Almog Cohen, and the committee found the accepted apology cured that lapse. The committee warned that further use of Holocaust imagery would draw a harsher sanction."
    date: "2025-06-23"
    sources:
      - url: "https://main.knesset.gov.il/Activity/committees/Ethics/Decisions25/Decisions25-39.pdf"
        title: "החלטה מס' 39/25 — החלטת ועדת האתיקה בקובלנות נגד חבר הכנסת ולדימיר בליאק"
        publisher: "The Knesset (Ethics Committee)"
      - url: "https://www.mako.co.il/news-politics/2025_q2/Article-81caa1d53fc9791027.htm"
        title: "שורת הצעדים נגד חברי הכנסת שהתבטאו בצורה חריגה"
        publisher: "N12"
  - kind: neutral
    category: news
    date: "2026-06-15"
    title:
      he: "פנה ליועצת המשפטית לממשלה לבחון תוכנית קצבאות לנוער הגבעות"
      en: "Asked the Attorney General to examine a stipend programme for hilltop youth"
    description:
      he: "ביוני 2026 דווח כי הממשלה מתכננת לשלם קצבה יומית של 50 ש\"ח לכ-657 בני נוער במאחזים ביהודה ושומרון, בהיקף של כ-5.5 מיליון ש\"ח, במסגרת תוכנית של משרד ההתיישבות והמשימות הלאומיות. בליאק פנה ליועצת המשפטית לממשלה גלי בהרב-מיארה בבקשה לבחון אם הכספים עומדים בעקרון השוויון ובקריטריונים שקופים, בפרט סמוך לבחירות."
      en: "In June 2026 it was reported that the government planned to pay a NIS 50 daily stipend to about 657 youths at West Bank outposts, some NIS 5.5 million in total, under a programme of the Ministry of Settlement and National Missions. Beliak asked Attorney General Gali Baharav-Miara to examine whether the funds meet the principle of equality and transparent criteria, particularly so close to an election."
    sources:
      - url: "https://www.timesofisrael.com/government-to-provide-50-nis-daily-stipends-for-hundreds-of-hilltop-youth-report/"
        title: "Government to provide 50-shekel daily stipends for hundreds of hilltop youth – report"
        publisher: "The Times of Israel"
