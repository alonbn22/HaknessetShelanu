  - kind: positive
    category: achievement
    title:
      he: יוזם חוק יסוד "ישראל – מדינת הלאום של העם היהודי" (התקבל ב-2018)
      en: Initiator of Basic Law "Israel as the Nation-State of the Jewish People" (passed 2018)
    description:
      he: דיכטר הניח לראשונה את הצעת חוק הלאום על שולחן הכנסת ב-2011, כחבר כנסת מסיעת קדימה באופוזיציה. לאחר גלגולים רבים אושר החוק כחוק יסוד ב-19 ביולי 2018 ברוב של 62 מול 55, כשדיכטר, אז ח"כ מהליכוד, בין מקדמיו העיקריים. החוק שנוי במחלוקת ציבורית וזכה לביקורת מצד האופוזיציה ומהציבור הערבי.
      en: Dichter first tabled the nation-state bill in 2011 as an opposition Knesset member for Kadima. After many rewrites it was enacted as a Basic Law on 19 July 2018 by a vote of 62–55, with Dichter, by then a Likud MK, among its main sponsors. The law is publicly contested and drew criticism from the opposition and from Arab citizens.
    date: 2018-07-19
    sources:
