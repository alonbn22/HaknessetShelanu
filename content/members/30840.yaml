    title:
      he: נבחר לכנסת ה-25 מטעם רע"מ במקום השלישי ברשימה
      en: Elected to the 25th Knesset for Ra'am, third on the list
    description:
      he: וליד אלהואשלה נבחר לכנסת ה-25 בבחירות נובמבר 2022 מטעם רשימת רע"מ (הרשימה
        הערבית המאוחדת), במקום השלישי ברשימה לאחר הפריימריז של אוגוסט 2022. הוא
        יליד הנגב, חבר התנועה האסלאמית, וקודם לכן שימש כיועצו של ח"כ סעיד
        אלחרומי.
      en: Walid al-Huashla was elected to the 25th Knesset in the November 2022
        elections on the United Arab List (Ra'am), placed third on the party's
        list following the August 2022 primaries. A native of the Negev and a
        member of the Islamic Movement in Israel, he had previously served as an
        advisor to MK Sa'id al-Khurumi.
