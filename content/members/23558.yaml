claims:
  - kind: positive
    category: achievement
    title:
      he: יושב ראש הקואליציה בכנסת ה-20
      en: Chairman of the Coalition in the 20th Knesset
    description:
      he: דוד ביטן, חבר כנסת מטעם הליכוד, מונה ביוני 2016 לתפקיד יושב ראש הקואליציה בכנסת ה-20, תפקיד מרכזי בניהול הרוב הפרלמנטרי של הממשלה.
      en: David Bitan, a Likud Member of Knesset, was appointed Chairman of the Coalition in the 20th Knesset in May 2016, a central role in managing the government's parliamentary majority.
    sources:
      - url: https://en.wikipedia.org/wiki/David_Bitan
        title: David Bitan
        publisher: Wikipedia
  - kind: positive
    category: achievement
    title:
      he: יושב ראש ועדת העלייה והקליטה
      en: Chairman of the Immigration and Absorption Committee
    description:
      he: ביטן מונה במאי 2020 ליושב ראש ועדת העלייה והקליטה בכנסת ה-23, ועדה העוסקת במדיניות העלייה לישראל ובקליטת עולים.
      en: Bitan was appointed in May 2020 as Chairman of the Immigration and Absorption Committee in the 23rd Knesset, a committee dealing with immigration to Israel and the integration of new immigrants.
    sources:
      - url: https://en.wikipedia.org/wiki/David_Bitan
        title: David Bitan
        publisher: Wikipedia
      - url: https://www.wikidata.org/wiki/Q18755548
        title: David Bitan (Q18755548)
        publisher: Wikidata
  - kind: positive
    category: achievement
    title:
      he: עורך דין ופעיל ציבור ברישון לציון
      en: Lawyer and local public servant in Rishon LeZion
    description:
      he: ביטן, יליד מרוקו שעלה לישראל בגיל חמש, סיים תואר במשפטים באוניברסיטת תל אביב בשנת 1987. הוא כיהן כחבר מועצת העיר רישון לציון משנת 1988 ולאחר מכן כסגן ראש העיר, לפני שהושבע כחבר כנסת בשנת 2015.
      en: Bitan, born in Morocco and immigrating to Israel at age five, earned a law degree (LL.B) from Tel Aviv University in 1987. He served as a member of the Rishon LeZion City Council from 1988 and later as Deputy Mayor, before being sworn in as a Member of Knesset in 2015.
    sources:
      - url: https://en.wikipedia.org/wiki/David_Bitan
        title: David Bitan
        publisher: Wikipedia
