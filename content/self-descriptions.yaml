  joint-list:
    - dimension: camp
      value: left
      quote:
        he: "\"מק\"י פועלת לכינונה של חזית שמאל יהודית-ערבית רחבה\""
        en: "\"Maki works to build a broad Jewish-Arab front of the left\""
        ar: "«يعمل ماكي على إقامة جبهة يسار يهودية-عربية واسعة»"
        ru: "«МАКИ добивается создания широкого еврейско-арабского левого фронта»"
        es: "«Maki trabaja por la creación de un amplio frente de izquierda judeoárabe»"
        fr: "« Le Maki œuvre à la création d’un large front de gauche judéo-arabe »"
      note: &maki
        he: "דברי מק\"י, המפלגה הקומוניסטית הישראלית, שמטעמה מתמודד העומד בראש הרשימה — לא הצהרה של הרשימה המשותפת כולה"
        en: "the words of Maki, the Israeli Communist Party, which the list's head is filed under — not a statement of the whole Joint List"
        ar: "كلمات ماكي، الحزب الشيوعي الإسرائيلي، الذي يترشّح رئيس القائمة باسمه — وليست بيانًا للقائمة المشتركة كلها"
        ru: "слова МАКИ, Коммунистической партии Израиля, от которой выдвинут глава списка, — не заявление всего Объединённого списка"
        es: "palabras de Maki, el Partido Comunista Israelí, por el que se presenta el cabeza de lista; no es una declaración de toda la Lista Conjunta"
        fr: "les mots du Maki, le Parti communiste israélien, au nom duquel se présente la tête de liste — pas une déclaration de toute la Liste commune"
      source: &maki-principles { url: "https://maki.org.il/%D7%A2%D7%A7%D7%A8%D7%95%D7%A0%D7%95%D7%AA-%D7%99%D7%A1%D7%95%D7%93/", title: "עקרונות יסוד | המפלגה הקומוניסטית הישראלית", publisher: "מק\"י" }
    - dimension: religion
      value: liberal-on-religion
      quote:
        he: "\"(ח) להפרדת הדת מהמדינה, להבטחת חופש המצפון, לביטול כל צורות הכפייה הדתית\""
        en: "\"(h) for the separation of religion from the state, for guaranteeing freedom of conscience, for abolishing all forms of religious coercion\""
        ar: "«(ح) فصل الدين عن الدولة، وضمان حرية الضمير، وإلغاء جميع أشكال الإكراه الديني»"
        ru: "«(з) за отделение религии от государства, за гарантию свободы совести, за отмену всех форм религиозного принуждения»"
        es: "«(h) por la separación de la religión y el Estado, por garantizar la libertad de conciencia, por abolir toda forma de coerción religiosa»"
        fr: "« (h) pour la séparation de la religion et de l’État, pour garantir la liberté de conscience, pour abolir toute forme de coercition religieuse »"
      note: *maki
      source: *maki-principles
    - dimension: community
      value: jewish-arab
      quote:
        he: "\"אנחנו מאמינים בשותפות יהודית-ערבית, בערכים דמוקרטיים, בשוויון ובקידום משא ומתן עם ההנהגה הפלסטינית.\""
        en: "\"We believe in Jewish-Arab partnership, in democratic values, in equality and in advancing negotiations with the Palestinian leadership.\""
        ar: "«نحن نؤمن بالشراكة اليهودية-العربية، وبالقيم الديمقراطية، وبالمساواة، وبدفع المفاوضات مع القيادة الفلسطينية.»"
        ru: "«Мы верим в еврейско-арабское партнёрство, в демократические ценности, в равенство и в продвижение переговоров с палестинским руководством»."
        es: "«Creemos en la alianza judeoárabe, en los valores democráticos, en la igualdad y en impulsar negociaciones con el liderazgo palestino.»"
        fr: "« Nous croyons au partenariat judéo-arabe, aux valeurs démocratiques, à l’égalité et à l’avancée des négociations avec la direction palestinienne. »"
      note:
        he: "ד\"ר יוסף ג'בארין, העומד בראש הרשימה, כיו\"ר חד\"ש, מאי 2026"
        en: "Dr. Yousef Jabareen, the list's head, as Hadash chair, May 2026"
        ar: "د. يوسف جبارين، رئيس القائمة، بصفته رئيس الجبهة، أيار/مايو 2026"
        ru: "д-р Юсеф Джабарин, глава списка, как председатель Хадаш, май 2026 года"
        es: "Dr. Yousef Jabareen, cabeza de lista, como presidente de Hadash, mayo de 2026"
        fr: "Dr Yousef Jabareen, tête de liste, en tant que président du Hadash, mai 2026"
      source: { url: "https://www.mako.co.il/news-israel-elections/2026/Article-e81970c300e5e91027.htm", title: "\"נוח להם שהציבור הערבי שוקע בדם\": יו\"ר חד\"ש בריאיון", publisher: "N12" }
    - dimension: economy
      value: socialist
      quote:
        he: "\"המפלגה הקומוניסטית הישראלית נאבקת למען סוציאליזם – חברה הומנית ודמוקרטית של צדק חברתי.\""
        en: "\"The Israeli Communist Party fights for socialism – a humane and democratic society of social justice.\""
        ar: "«يناضل الحزب الشيوعي الإسرائيلي من أجل الاشتراكية – مجتمع إنساني وديمقراطي قائم على العدالة الاجتماعية.»"
        ru: "«Коммунистическая партия Израиля борется за социализм — гуманное и демократическое общество социальной справедливости»."
        es: "«El Partido Comunista Israelí lucha por el socialismo – una sociedad humana y democrática de justicia social.»"
        fr: "« Le Parti communiste israélien lutte pour le socialisme – une société humaine et démocratique de justice sociale. »"
      note: *maki
      source: *maki-principles
    - dimension: economy
      value: communist
      quote:
        he: "\"1. גבארין יוסף / מטעם מפלגת המפלגה הקומוניסטית הישראלית\""
        en: "\"1. Jabareen Yousef / on behalf of the party 'The Israeli Communist Party'\""
        ar: "«1. جبارين يوسف / باسم حزب \"الحزب الشيوعي الإسرائيلي\"»"
        ru: "«1. Джабарин Юсеф / от партии „Коммунистическая партия Израиля“»"
        es: "«1. Jabareen Yousef / en nombre del partido “Partido Comunista Israelí”»"
        fr: "« 1. Jabareen Yousef / au nom du parti “Parti communiste israélien” »"
      note: *maki
      source: { url: "https://www.gov.il/he/pages/hareshima-hameshutefet_list35", title: "הרשימה המשותפת — רשימת המועמדים", publisher: "ועדת הבחירות המרכזית לכנסת" }

  amkha:
