    title:
      he: חבר הכנסת ה-25 (מיולי 2025) וסגן יושב-ראש הכנסת (מיולי 2026)
      en: Member of the 25th Knesset (from July 2025) and Deputy Speaker (from July 2026)
    description:
      he: חסון נכנס לכנסת ה-25 ב-10 ביולי 2025, לאחר שהשר גדעון סער התפטר מהכנסת לפי
        החוק הנורבגי, והושבע במליאה ב-14 ביולי 2025. לפי רישומי הכנסת הוא מכהן
        כסגן יושב-ראש הכנסת מ-17 ביולי 2026, ולפי ערוץ הכנסת הוא עומד בראש
        ועדת המשנה להשכלה גבוהה. לפי ויקיפדיה העברית הוא מכהן גם כיושב ראש
        סיעת הימין הממלכתי מ-16 ביולי 2026, לאחר מישל בוסקילה.
      en: Hasson entered the 25th Knesset on 10 July 2025, after Minister Gideon Sa'ar
        resigned his seat under the Norwegian Law, and was sworn in at the
        plenum on 14 July 2025. Knesset records list him as a Deputy Speaker
        of the Knesset from 17 July 2026, and the Knesset Channel lists him
        as chair of the subcommittee on higher education. According to
        Hebrew Wikipedia he has also chaired the National Right faction
        since 16 July 2026, succeeding Michel Buskila.
