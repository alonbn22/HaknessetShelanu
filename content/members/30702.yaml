      he: רקע מקצועי בשירות הציבורי ובתחום הרווחה
      en: Professional background in public service and welfare
    description:
      he: טרם כניסתה לפוליטיקה צברה עטייה ניסיון בשירות הציבורי ובתחום הרווחה. היא
