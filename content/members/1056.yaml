    title:
      he: "הודיע כי לא יתמודד לכנסת ה-26"
      en: "Announced he will not run for the 26th Knesset"
    description:
      he: "ב-24 במאי 2026 הודיע מרגי, סגן יושב ראש הכנסת, כי לאחר 23 שנים כחבר כנסת, מנכ\"ל התנועה ושר, ביקש מיו\"ר ש\"ס אריה דרעי שלא להיכלל ברשימה לכנסת הבאה. הוא הדגיש כי אינו פורש מתנועת ש\"ס."
      en: "On 24 May 2026 Margi, a Deputy Speaker of the Knesset, announced that after 23 years as an MK, movement director general and minister, he had asked Shas chairman Aryeh Deri not to be placed on the party's list for the next Knesset. He stressed that he was not leaving the Shas movement."
