claims:
  - kind: positive
    category: achievement
    title:
      he: חבר הכנסת מטעם הליכוד (2015–2023)
      en: Member of Knesset for Likud (2015–2023)
    description:
      he: דודי אמסלם נבחר לראשונה לכנסת ה-20 בשנת 2015 ברשימת הליכוד וכיהן כחבר כנסת
        ברציפות עד מרץ 2023. לפני כניסתו לפוליטיקה הארצית עבד שנים רבות בשירות הציבורי,
        בין היתר כלכלן באגף התקציבים במשרד האוצר, בביטוח הלאומי וברשות המסים,
        וכן בעיריית ירושלים, וכיהן כיושב ראש סניף הליכוד בירושלים.
      en: Dudi Amsalem was first elected to the 20th Knesset in 2015 on the Likud list
        and served continuously as a member of Knesset until March 2023. Before
        entering national politics he spent many years in public service,
        including economist roles in the Finance Ministry budget department, the
        National Insurance Institute and the Tax Authority, as well as in the
        Jerusalem Municipality, and chaired Likud's Jerusalem branch.
    date: 2015-03-17
    sources:
