    title:
      he: הוחלף בשתי ועדות כנסת בעקבות הפרת משמעת קואליציונית
      en: Replaced on two Knesset committees following a breach of coalition
        discipline
    description:
      he: בנובמבר 2024 הודיע יו"ר הקואליציה אופיר כץ כי אילוז יוחלף בוועדת הכלכלה
        ובוועדת החוץ והביטחון ולא יוכל להגיש הצעות חוק פרטיות למשך כחודש וחצי,
        בעקבות התבטאויותיו הפומביות נגד חקיקה הנוגעת לפטור מגיוס לחרדים והפרת
        המשמעת הקואליציונית. מדובר בסנקציה מפלגתית-קואליציונית פנימית, ולא בהליך
        משפטי.
      en: In November 2024 coalition chairman Ofir Katz announced that Illouz would be
        replaced on the Knesset's Economic Affairs Committee and Foreign Affairs
        and Defense Committee and barred from submitting private member's bills
        for about a month and a half, following his public statements against
        legislation related to military-service exemptions for Haredim and a
        breach of coalition discipline. This was an internal party/coalition
        sanction, not a legal proceeding.
