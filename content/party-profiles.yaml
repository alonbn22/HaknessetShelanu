      - date: "2026-07-15"
        text:
          he: "ח\"כ דן אילוז הודיע על פרישה מהליכוד ועל כך שלא יתמודד בפריימריז; ב-5 באוגוסט 2026 הצטרף לישראל ביתנו, ב-11 באוגוסט הגיש את התפטרותו מהכנסת, וב-13 באוגוסט נכנס במקומו שבתאי קטש."
          en: "MK Dan Illouz announced he was leaving Likud and would not run in its primary; on 5 August 2026 he joined Yisrael Beiteinu, on 11 August he submitted his resignation from the Knesset, and on 13 August Shabtai Katash took his seat."
          ar: "أعلن عضو الكنيست دان إيلوز انسحابه من الليكود وأنه لن يخوض انتخاباته التمهيدية؛ وفي 5 آب/أغسطس 2026 انضم إلى إسرائيل بيتنا، وفي 11 آب/أغسطس قدّم استقالته من الكنيست، وفي 13 آب/أغسطس دخل شبتاي كتاش مكانه."
          ru: "Депутат Дан Иллуз объявил о выходе из Ликуда и о том, что не будет участвовать в праймериз; 5 августа 2026 года он присоединился к партии «Наш дом Израиль», 11 августа подал в отставку из Кнессета, а 13 августа его место занял Шабтай Каташ."
          es: "El diputado Dan Illouz anunció que dejaba el Likud y que no se presentaría a sus primarias; el 5 de agosto de 2026 se unió a Yisrael Beiteinu, el 11 de agosto presentó su renuncia a la Knéset y el 13 de agosto Shabtai Katash ocupó su escaño."
          fr: "Le député Dan Illouz a annoncé qu’il quittait le Likoud et ne se présenterait pas à sa primaire ; le 5 août 2026, il a rejoint Israël Beiteinou, le 11 août il a remis sa démission de la Knesset et le 13 août Shabtai Katash a pris son siège."
