        publisher: The Jerusalem Post
      - url: https://www.israelnationalnews.com/news/410555
        title: "Ethics Committee sanctions: MK Odeh suspended for two weeks without pay"
        publisher: Arutz 7 / Israel National News
  - kind: negative
    category: controversy
    title:
      he: הצעה להדחתו מהכנסת נכשלה (2025)
      en: Motion to expel him from the Knesset failed (2025)
    description:
      he: 'בינואר 2025, לאחר שעודה כתב כי הוא "שמח על שחרור החטופים והאסירים" במסגרת עסקת הפסקת האש בעזה, החל ח"כ אביחי בוארון (הליכוד) באיסוף 70 חתימות לפתיחת הליך הדחה נגדו. ב-30 ביוני 2025 אישרה ועדת הכנסת ברוב של 14 מול 2 להעביר את ההצעה למליאה, וב-14 ביולי 2025 הצביעה המליאה: 73 ח"כים תמכו ו-15 התנגדו — מתחת לרוב המיוחד של 90 קולות הנדרש להדחה. עודה נותר חבר כנסת; בדיון בוועדת הכנסת אמר כי הציוץ "דיבר על זכותם של שני העמים לחיות בחופש, בכבוד ובשוויון".'
      en: "In January 2025, after Odeh wrote that he was \"happy about the release of the hostages and prisoners\" under the Gaza ceasefire deal, MK Avichai Boaron (Likud) began collecting the 70 signatures needed to open expulsion proceedings against him. On 30 June 2025 the Knesset House Committee voted 14-2 to send the motion to the plenum, and on 14 July 2025 the plenum voted: 73 MKs in favor and 15 against — short of the 90-vote supermajority required for expulsion. Odeh remained a member of the Knesset; at the House Committee hearing he said the tweet \"spoke about the right of both peoples to live in freedom, dignity, and equality.\""
    date: 2025-07-14
    sources:
