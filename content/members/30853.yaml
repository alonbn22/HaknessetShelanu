        title: משה סעדה
        publisher: Wikipedia
  - kind: positive
    category: achievement
    title:
      he: חבר הכנסת ה-25 מטעם הליכוד
      en: Member of the 25th Knesset for Likud
    description:
      he: סעדה נבחר לכנסת ה-25 בנובמבר 2022 מטעם מפלגת הליכוד, לאחר שהוצב במקום ה-28 ברשימת המפלגה.
      en: Saada was elected to the 25th Knesset in November 2022 on behalf of the Likud party, after being placed 28th on the party's list.
    date: 2022-11-15
    sources:
