    title:
      he: "אבירת איכות השלטון לשנת 2023"
      en: "Knight of Quality Government for 2023"
    description:
      he: "התנועה למען איכות השלטון בישראל העניקה ללזימי את אות אבירת איכות השלטון לשנת 2023 בקטגוריית מאבק חברתי, בטקס שנערך ב-8 בספטמבר 2024 במרכז יצחק רבין בתל אביב, בהוקרה על עשייה פוליטית ועל פעילותה במחאות נגד הרפורמה במערכת המשפט ולצד מטה משפחות החטופים."
      en: "The Movement for Quality Government in Israel awarded Lazimi its Knight of Quality Government award for 2023 in the social-struggle category, at a ceremony held on 8 September 2024 at the Yitzhak Rabin Center in Tel Aviv, in recognition of her political work and her activity in the protests against the judicial overhaul and alongside the Hostages Families Forum."
    date: "2024-09-08"
