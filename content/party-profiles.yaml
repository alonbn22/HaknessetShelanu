    wikipediaEn: https://en.wikipedia.org/wiki/Shas
    tags: [ultra-orthodox, sephardic, religious]
    summary:
      he: מפלגה חרדית-ספרדית המייצגת יהדות המזרח ושומרי מסורת.
      en: A Sephardic ultra-Orthodox party representing Mizrahi Jews and the traditionally observant.
      ar: حزب حريدي شرقي يمثّل اليهود الشرقيين والمحافظين على التقاليد.
      ru: Сефардская ультраортодоксальная партия, представляющая восточных евреев и соблюдающих традиции.
      es: "Un partido ultraortodoxo sefardí que representa a los judíos mizrajíes y al público tradicional (masortí)."
      fr: "Un parti ultra-orthodoxe séfarade représentant les Juifs orientaux et les traditionalistes."
    positions:
      he:
        - שמירה על מעמד הדת היהודית במרחב הציבורי
        - תקצוב מוסדות חינוך תורניים ורווחה לאוכלוסיות חלשות
        - הגנה על מעמד החינוך החרדי ופטור מגיוס לבני ישיבות
      en:
        - Preserving the status of Jewish religion in the public sphere
        - Funding for Torah education and welfare for weaker populations
        - Protecting Haredi education and yeshiva students' draft exemptions
      ar:
        - "الحفاظ على مكانة الدين اليهودي في الحيّز العام"
        - "تمويل دراسة التوراة والرفاه للفئات الضعيفة"
        - "حماية التعليم الحريدي وإعفاء طلاب المعاهد الدينية من التجنيد"
      ru:
        - "Сохранение статуса иудаизма в общественной сфере"
        - "Финансирование изучения Торы и социальная помощь слабым слоям"
        - "Защита харедимного образования и освобождения учащихся ешив от призыва"
      es:
        - Preservar el lugar de la religión judía en el espacio público
        - Financiación de la educación de la Torá y bienestar para los sectores más débiles
        - Proteger la educación jaredí y la exención del servicio militar para los estudiantes de yeshivá
      fr:
        - Préserver la place de la religion juive dans l’espace public
        - Financement des études de Torah et aide sociale aux populations défavorisées
        - Protéger l’éducation haredi et l’exemption de service militaire des étudiants de yeshiva
  - id: 1110 # Blue & White – National Unity
    verified: "2026-09-19"
    updates:
      - date: "2025-06-30"
        text:
          he: "ח\"כ גדי איזנקוט, מספר 2 בסיעה, הודיע ליו\"ר בני גנץ על פרישתו מהמפלגה והתפטרותו מהכנסת; כהונתו הסתיימה ב-4 ביולי 2025 ואיתן גינזבורג נכנס במקומו באותו יום."
          en: "MK Gadi Eisenkot, the faction’s No. 2, told chairman Benny Gantz he was leaving the party and resigning from the Knesset; his term ended on 4 July 2025 and Eitan Ginzburg took his seat the same day."
          ar: "أبلغ عضو الكنيست غادي آيزنكوت، الرجل الثاني في الكتلة، رئيسَها بيني غانتس بانسحابه من الحزب واستقالته من الكنيست؛ وانتهت ولايته في 4 تموز/يوليو 2025 ودخل إيتان غينزبورغ مكانه في اليوم نفسه."
          ru: "Депутат Гади Айзенкот, второй номер фракции, сообщил её председателю Бени Ганцу о выходе из партии и сложении депутатского мандата; его полномочия прекратились 4 июля 2025 года, и в тот же день его место занял Эйтан Гинзбург."
          es: "El diputado Gadi Eisenkot, número 2 de la facción, comunicó al presidente Benny Gantz que dejaba el partido y renunciaba a la Knéset; su mandato terminó el 4 de julio de 2025 y Eitan Ginzburg ocupó su escaño el mismo día."
          fr: "Le député Gadi Eisenkot, numéro 2 de la faction, a informé le président Benny Gantz qu’il quittait le parti et démissionnait de la Knesset ; son mandat a pris fin le 4 juillet 2025 et Eitan Ginzburg a pris son siège le même jour."
        sources:
          - { url: "https://www.timesofisrael.com/in-political-shakeup-national-unity-no-2-eisenkot-set-to-leave-party-quit-knesset/", title: "In political shakeup, National Unity No. 2 Eisenkot to leave the party, quit Knesset (2025-06-30)", publisher: "The Times of Israel" }
          - { url: "https://www.ynet.co.il/news/article/hjzxfblrgx", title: "איזנקוט עוזב את המחנה הממלכתי - והודיע לגנץ: \"אתפטר מהכנסת\" (2025-06-30)", publisher: "ynet" }
          - { url: "https://www.timesofisrael.com/after-quitting-knesset-eisenkot-says-he-is-working-on-a-governing-alternative/", title: "After quitting Knesset, Eisenkot says he is working to build a 'governing alternative' (2025-07-01)", publisher: "The Times of Israel" }
          - { url: "https://knesset.gov.il/OdataV4/ParliamentInfo/KNS_PersonToPosition?$filter=FactionID%20eq%201098%20and%20KnessetNum%20eq%2025%20and%20(StartDate%20ge%202025-06-01T00:00:00Z%20or%20FinishDate%20ge%202025-06-25T00:00:00Z)", title: "KNS_PersonToPosition — PersonID 30836 (גדי איזנקוט) FinishDate 2025-07-04; PersonID 30693 (איתן גינזבורג) StartDate 2025-07-04 (2026-09-19)", publisher: "Knesset OData" }
      - date: "2025-07-01"
        text:
          he: "ח\"כ מתן כהנא הודיע על פרישה מהסיעה בעקבות איזנקוט; כהונתו בכנסת הסתיימה ב-8 ביולי 2025 ויעל רון בן משה נכנסה במקומו. באותו יום (1 ביולי) הודיע גנץ על החזרת השם \"כחול לבן\"."
          en: "MK Matan Kahana announced he was leaving the faction after Eisenkot; his Knesset term ended on 8 July 2025 and Yael Ron Ben-Moshe took his seat. The same day (1 July) Gantz announced the return to the name “Blue and White”."
          ar: "أعلن عضو الكنيست متان كهانا انسحابه من الكتلة في أعقاب آيزنكوت؛ وانتهت ولايته في الكنيست في 8 تموز/يوليو 2025 ودخلت ياعيل رون بن موشيه مكانه. وفي اليوم نفسه (1 تموز/يوليو) أعلن غانتس العودة إلى اسم «أزرق أبيض»."
          ru: "Депутат Матан Кахана объявил о выходе из фракции вслед за Айзенкотом; его полномочия в Кнессете прекратились 8 июля 2025 года, и его место заняла Яэль Рон Бен-Моше. В тот же день (1 июля) Ганц объявил о возвращении названия «Кахоль-лаван»."
          es: "El diputado Matan Kahana anunció que dejaba la facción tras Eisenkot; su mandato en la Knéset terminó el 8 de julio de 2025 y Yael Ron Ben-Moshe ocupó su escaño. El mismo día (1 de julio) Gantz anunció la vuelta al nombre «Azul y Blanco»."
          fr: "Le député Matan Kahana a annoncé qu’il quittait la faction après Eisenkot ; son mandat à la Knesset a pris fin le 8 juillet 2025 et Yael Ron Ben-Moshe a pris son siège. Le même jour (1er juillet), Gantz a annoncé le retour au nom « Bleu et Blanc »."
        sources:
          - { url: "https://www.jpost.com/israel-news/article-859662", title: "'We are all Blue and White': Gantz reverts National Unity party name after Eisenkot departure (2025-07-01)", publisher: "The Jerusalem Post" }
          - { url: "https://www.timesofisrael.com/after-quitting-knesset-eisenkot-says-he-is-working-on-a-governing-alternative/", title: "After quitting Knesset, Eisenkot says he is working to build a 'governing alternative' (Eisenkot and Kahana to be replaced by Ginzburg and Ron Ben-Moshe) (2025-07-01)", publisher: "The Times of Israel" }
          - { url: "https://www.ynet.co.il/news/article/byoc00u11hle", title: "בצל הפרישות מהמפלגה: גנץ משיק קמפיין חדש - וחוזר ל\"כחול לבן\" (2025-07-01)", publisher: "ynet" }
          - { url: "https://knesset.gov.il/OdataV4/ParliamentInfo/KNS_PersonToPosition?$filter=FactionID%20eq%201098%20and%20KnessetNum%20eq%2025%20and%20(StartDate%20ge%202025-06-01T00:00:00Z%20or%20FinishDate%20ge%202025-06-25T00:00:00Z)", title: "KNS_PersonToPosition — PersonID 30662 (מתן כהנא) FinishDate 2025-07-08; PersonID 30775 (יעל רון בן משה) StartDate 2025-07-08 (2026-09-19)", publisher: "Knesset OData" }
      - date: "2025-07-08"
        text:
          he: "ועדת הכנסת אישרה (7 ביולי) את שינוי שם הסיעה ל\"כחול לבן - המחנה הממלכתי\"; ברישומי הכנסת סיעה 1098 (המחנה הממלכתי) הסתיימה וסיעה 1110 החלה ב-8 ביולי 2025, עם 8 חברים ובראשות פנינה תמנו."
          en: "The Knesset House Committee approved (7 July) renaming the faction “Blue and White–National Unity”; in the Knesset’s records faction 1098 (National Unity) ended and faction 1110 began on 8 July 2025, with 8 members and Pnina Tamano-Shata as faction chair."
          ar: "صادقت لجنة الكنيست (7 تموز/يوليو) على تغيير اسم الكتلة إلى «أزرق أبيض – المعسكر الرسمي»؛ وفي سجلات الكنيست انتهت الكتلة 1098 (المعسكر الرسمي) وبدأت الكتلة 1110 في 8 تموز/يوليو 2025، بـ8 أعضاء وبرئاسة بنينا تامانو-شاتا للكتلة."
          ru: "Комиссия Кнессета (7 июля) утвердила переименование фракции в «Кахоль-лаван — Государственный лагерь»; в документах Кнессета фракция 1098 («Государственный лагерь») прекратила существование, а фракция 1110 начала работу 8 июля 2025 года: 8 депутатов, председатель фракции — Пнина Тамано-Шата."
          es: "La Comisión de la Knéset (House Committee) aprobó (7 de julio) renombrar la facción «Azul y Blanco–Unidad Nacional»; en los registros de la Knéset la facción 1098 (Unidad Nacional) terminó y la facción 1110 comenzó el 8 de julio de 2025, con 8 miembros y Pnina Tamano-Shata como presidenta de la facción."
          fr: "La Commission de la Knesset a approuvé (7 juillet) le changement de nom de la faction en « Bleu et Blanc–Unité nationale » ; dans les registres de la Knesset, la faction 1098 (Unité nationale) a pris fin et la faction 1110 a commencé le 8 juillet 2025, avec 8 membres et Pnina Tamano-Shata comme présidente de faction."
        sources:
          - { url: "https://www.timesofisrael.com/liveblog_entry/knesset-panel-approves-changing-name-of-gantzs-party-to-blue-and-white-national-unity/", title: "Knesset panel approves changing name of Gantz's party to Blue and White-National Unity (2025-07-07)", publisher: "The Times of Israel" }
          - { url: "https://knesset.gov.il/OdataV4/ParliamentInfo/KNS_Faction?$filter=KnessetNum%20eq%2025", title: "KNS_Faction — 1098 FinishDate 2025-07-08; 1110 StartDate 2025-07-08 (2026-09-19)", publisher: "Knesset OData" }
          - { url: "https://main.knesset.gov.il/mk/apps/faction/faction-lobby?KnessetID=25&FactionID=1110", title: "סיעת כחול לבן - המחנה הממלכתי — 8 חברים, יו\"ר הסיעה פנינה תמנו (2026-09-19)", publisher: "הכנסת" }
      - date: "2025-07-24"
        text:
          he: "ח\"כ אורית פרקש הכהן הודיעה על פרישה ממפלגת כחול לבן תוך שמירה על מושבה בכנסת, וציינה כוונה לסייע למהלך של גדי איזנקוט; ב-2026 היא במקום השלישי ברשימת ישר!."
          en: "MK Orit Farkash-Hacohen announced she was leaving the Blue and White party while keeping her Knesset seat, saying she intended to help Gadi Eisenkot’s initiative; in 2026 she is third on the Yashar! list."
          ar: "أعلنت عضوة الكنيست أوريت فركاش-هكوهين انسحابها من حزب أزرق أبيض مع احتفاظها بمقعدها في الكنيست، وذكرت أنها تنوي مساعدة مبادرة غادي آيزنكوت؛ وفي 2026 هي في الموقع الثالث في قائمة ياشار!."
          ru: "Депутат Орит Фаркаш-Ха-Коэн объявила о выходе из партии «Кахоль-лаван» с сохранением мандата, сообщив о намерении помочь инициативе Гади Айзенкота; в 2026 году она третья в списке «Яшар!»."
          es: "La diputada Orit Farkash-Hacohen anunció que dejaba el partido Azul y Blanco conservando su escaño en la Knéset, y dijo que pretendía ayudar a la iniciativa de Gadi Eisenkot; en 2026 es tercera en la lista de ¡Yashar!."
          fr: "La députée Orit Farkash-Hacohen a annoncé qu’elle quittait le parti Bleu et Blanc tout en conservant son siège à la Knesset, disant vouloir aider l’initiative de Gadi Eisenkot ; en 2026, elle est troisième sur la liste Yashar!."
        sources:
          - { url: "https://www.timesofisrael.com/in-latest-blow-to-gantz-mk-farkash-hacohen-resigns-from-blue-and-white/", title: "In latest blow to Gantz, MK Farkash-Hacohen resigns from Blue and White (2025-07-24)", publisher: "The Times of Israel" }
          - { url: "https://www.gov.il/he/pages/yashar_list_2", title: "ישר! עם איזנקוט — רשימה 2: 3 אורית פרקש הכהן, 5 מתן כהנא, 6 חילי טרופר (2026-09-10)", publisher: "ועדת הבחירות המרכזית (gov.il)" }
      - date: "2025-09-16"
        text:
          he: "גדי איזנקוט הקים את מפלגת \"ישר!\"; מתן כהנא נמנה עם מייסדיה, וב-2026 הוא במקום החמישי ברשימתה."
          en: "Gadi Eisenkot founded the party “Yashar!”; Matan Kahana was among its founders and in 2026 is fifth on its list."
          ar: "أسّس غادي آيزنكوت حزب «ياشار!»؛ وكان متان كهانا من مؤسسيه، وهو في 2026 في الموقع الخامس في قائمته."
          ru: "Гади Айзенкот основал партию «Яшар!»; Матан Кахана был в числе её основателей и в 2026 году идёт пятым в её списке."
          es: "Gadi Eisenkot fundó el partido «¡Yashar!»; Matan Kahana estuvo entre sus fundadores y en 2026 es quinto en su lista."
          fr: "Gadi Eisenkot a fondé le parti « Yashar! » ; Matan Kahana figurait parmi ses fondateurs et, en 2026, il est cinquième sur sa liste."
        sources:
          - { url: "https://www.timesofisrael.com/gadi-eisenkot-founds-new-party-two-months-after-resigning-from-knesset/", title: "Gadi Eisenkot founds new party, two months after resigning from Knesset (2025-09-16)", publisher: "The Times of Israel" }
          - { url: "https://www.gov.il/he/pages/yashar_list_2", title: "ישר! עם איזנקוט — רשימה 2: 1 גדי איזנקוט, 5 מתן כהנא (2026-09-10)", publisher: "ועדת הבחירות המרכזית (gov.il)" }
      - date: "2026-05-03"
        text:
          he: "ח\"כ חילי טרופר הודיע על פרישה ממפלגת כחול לבן; ב-6 בספטמבר 2026 מיזג את מפלגתו (הרשומה בוועדת הבחירות כ\"יסודות ישראל\"; \"Zionist Home\" בתקשורת באנגלית) לתוך ישר! והוא במקום השישי ברשימתה. ח\"כ איתן גינזבורג הצטרף לרשימת \"ביחד\" של בנט (מקום 8)."
          en: "MK Chili Tropper announced he was leaving the Blue and White party; on 6 September 2026 he merged his party (registered with the CEC as “יסודות ישראל”; “Zionist Home” in the English press) into Yashar! and is sixth on its list. MK Eitan Ginzburg joined Bennett’s “Together” list (8th)."
          ar: "أعلن عضو الكنيست حيلي تروبر انسحابه من حزب أزرق أبيض؛ وفي 6 أيلول/سبتمبر 2026 دمج حزبه (المسجّل في لجنة الانتخابات باسم «يسودوت يسرائيل»؛ و«Zionist Home» في الصحافة الإنجليزية) في ياشار!، وهو في الموقع السادس في قائمته. وانضم عضو الكنيست إيتان غينزبورغ إلى قائمة «معًا» بزعامة بينيت (الموقع 8)."
          ru: "Депутат Хили Тропер объявил о выходе из партии «Кахоль-лаван»; 6 сентября 2026 года он влил свою партию (зарегистрированную в ЦИК как «Йесодот Исраэль»; в англоязычной прессе — «Zionist Home») в «Яшар!» и идёт шестым в её списке. Депутат Эйтан Гинзбург присоединился к списку Беннета «Вместе» (8-е место)."
          es: "El diputado Hili Tropper anunció que dejaba el partido Azul y Blanco; el 6 de septiembre de 2026 fusionó su partido (registrado ante la Comisión Electoral como «יסודות ישראל»; «Hogar Sionista» en la prensa en inglés) en ¡Yashar! y es sexto en su lista. El diputado Eitan Ginzburg se unió a la lista «Juntos» de Bennett (8.º)."
          fr: "Le député Hili Tropper a annoncé qu’il quittait le parti Bleu et Blanc ; le 6 septembre 2026, il a intégré son parti (enregistré auprès de la Commission électorale sous le nom « יסודות ישראל » ; « Foyer sioniste » dans la presse anglophone) à Yashar! et il est sixième sur sa liste. Le député Eitan Ginzburg a rejoint la liste « Ensemble » de Bennett (8e)."
        sources:
          - { url: "https://www.timesofisrael.com/blue-and-white-mk-chili-tropper-quits-party-raising-speculation-about-his-future/", title: "Blue and White MK Chili Tropper quits party, raising speculation about his future… and Gantz's (2026-05-03)", publisher: "The Times of Israel" }
          - { url: "https://www.timesofisrael.com/ditching-hendel-zionist-home-chair-chili-tropper-merges-party-into-eisenkots-yashar/", title: "Ditching Hendel, Zionist Home chair Chili Tropper merges party into Eisenkot's Yashar (2026-09-06)", publisher: "The Times of Israel" }
          - { url: "https://www.timesofisrael.com/liveblog_entry/gantz-submits-19-member-blue-and-white-slate-despite-months-of-polling-below-electoral-threshold/", title: "Gantz submits 19-member Blue and White slate despite months of polling below electoral threshold (Ginzburg joined B'Yachad) (2026-09-08)", publisher: "The Times of Israel" }
          - { url: "https://www.gov.il/he/pages/beyahad_list1", title: "ביחד בראשות נפתלי בנט — רשימה 1: 8 איתן גינזבורג (2026-09-07)", publisher: "ועדת הבחירות המרכזית (gov.il)" }
      - date: "2026-09-08"
        text:
          he: "בני גנץ הגיש לוועדת הבחירות רשימה עצמאית בשם \"כחול לבן\" (רשימה 30, האותיות המבוקשות כן): גנץ, פנינה תמנו, גאולה עליזה בלוך, רועי קונקול, צאליק רתם אבידר, אלון שוסטר…; רק שלושה מ-8 חברי הסיעה המכהנים ברשימה."
          en: "Benny Gantz submitted an independent list named “Blue and White” to the CEC (list 30, requested letters כן): Gantz, Pnina Tamano-Shata, Aliza Bloch, Roi Konkol, Tzalik Rotem Avidar, Alon Schuster…; only three of the faction’s 8 sitting MKs are on it."
          ar: "قدّم بيني غانتس إلى لجنة الانتخابات قائمة مستقلة باسم «أزرق أبيض» (القائمة 30، الأحرف المطلوبة כן): غانتس، بنينا تامانو-شاتا، عليزا بلوخ، روعي كونكول، تساليك روتيم أفيدار، ألون شوستر…؛ وثلاثة فقط من أعضاء الكتلة الثمانية الحاليين في القائمة."
          ru: "Бени Ганц подал в ЦИК самостоятельный список «Кахоль-лаван» (список 30, запрошенные буквы כן): Ганц, Пнина Тамано-Шата, Ализа Блох, Рои Конкол, Цалик Ротем Авидар, Алон Шустер…; в нём лишь трое из 8 действующих депутатов фракции."
          es: "Benny Gantz presentó ante la Comisión Electoral una lista independiente llamada «Azul y Blanco» (lista 30, letras solicitadas כן): Gantz, Pnina Tamano-Shata, Aliza Bloch, Roi Konkol, Tzalik Rotem Avidar, Alon Schuster…; solo tres de los 8 diputados en funciones de la facción figuran en ella."
          fr: "Benny Gantz a déposé auprès de la Commission électorale une liste indépendante nommée « Bleu et Blanc » (liste 30, lettres demandées כן) : Gantz, Pnina Tamano-Shata, Aliza Bloch, Roi Konkol, Tzalik Rotem Avidar, Alon Schuster… ; seuls trois des 8 députés en exercice de la faction y figurent."
        sources:
          - { url: "https://www.gov.il/he/pages/kachol-lavan_list30", title: "כחול לבן — רשימה 30 (מגישה: כחול לבן חוסן לישראל) (2026-09-16)", publisher: "ועדת הבחירות המרכזית (gov.il)" }
          - { url: "https://www.timesofisrael.com/liveblog_entry/gantz-submits-19-member-blue-and-white-slate-despite-months-of-polling-below-electoral-threshold/", title: "Gantz submits 19-member Blue and White slate despite months of polling below electoral threshold (2026-09-08)", publisher: "The Times of Israel" }
          - { url: "https://www.timesofisrael.com/israels-election-takes-shape-as-38-parties-submit-slates-from-likud-to-joint-list/", title: "Israel's election takes shape as 38 parties submit slates, in battle between pro- and anti-Netanyahu blocs (2026-09-09)", publisher: "The Times of Israel" }
