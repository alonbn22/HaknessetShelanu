claims:
  - kind: positive
    category: achievement
    title:
      he: חבר הכנסת הישראלי הראשון שנולד בצרפת
      en: First Israeli Knesset member born in France
    description:
      he: יוסף (יוסי) טייב, נציג מפלגת ש"ס, נולד ב-15 בפברואר 1981 ברובע ה-15 של פריז
        למשפחה ממוצא יהודי-תוניסאי. הוא עלה לישראל בנעוריו ללימודים בישיבת מיר
        בירושלים. עם כניסתו לכנסת ב-1 ביולי 2020 (במסגרת החוק הנורבגי) צוין כחבר
        הכנסת הישראלי הראשון שנולד בצרפת.
      en: Joseph (Yossi) Taieb, a representative of the Shas party, was born on 15
        February 1981 in the 15th arrondissement of Paris to a family of
        Tunisian-Jewish descent. He immigrated to Israel in his youth to study
        at the Mir Yeshiva in Jerusalem. Upon entering the Knesset on 1 July
        2020 (under the "Norwegian Law") he was noted as the first Israeli
        member of Knesset born in France.
    date: 2020-07-01
    sources:
