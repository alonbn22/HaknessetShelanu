      he: הודיע שלא יתמודד בבחירות לכנסת ה-26; ימונה ליו"ר ונשיא ועידת יש עתיד
      en: Announced he will not run in the 26th Knesset election; to chair the Yesh Atid conference
    description:
      he: ב-31 באוגוסט 2026 הודיע כהן כי לא יתמודד ברשימת "ביחד" (הרשימה המשותפת של יש עתיד ונפתלי בנט) לבחירות ב-27 באוקטובר 2026, ואמר כי "אחרי 25 שנים בחינוך ו-23 שנים בפוליטיקה אני מפנה את מקומי בשמחה ובגאווה לדור הבא". יאיר לפיד מסר כי כהן אינו עוזב את המפלגה, וכי ימונה ליו"ר ולנשיא ועידת יש עתיד.
      en: On 31 August 2026 Cohen announced he would not run on the "Beyachad" list (the joint list of Yesh Atid and Naftali Bennett) in the 27 October 2026 election, saying that "after 25 years in education and 23 years in politics I am passing my place with joy and pride to the next generation". Yair Lapid said Cohen is not leaving the party and will be appointed chairman and president of the Yesh Atid conference.
