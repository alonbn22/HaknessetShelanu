    title:
      he: בית המשפט העליון לא אישר את פסילתו מהתמודדות בבחירות 2026
      en: Supreme Court declined to approve his disqualification from the 2026 election
    description:
      he: ב-23 בספטמבר 2026 החליטה ועדת הבחירות המרכזית (19 נגד 5) לפסול את
        מועמדותו של כסיף, לבקשת הליכוד; היועצת המשפטית לממשלה התנגדה לפסילה,
        וכסיף דחה את הטענות. פסילת מועמד טעונה את אישור בית המשפט העליון, וב-2
        באוקטובר 2026 החליט בית המשפט, בדעת רוב של שבעה שופטים נגד שניים (דוד
        מינץ ואלכס שטיין), שלא לאשר את הפסילה. כסיף מתמודד בבחירות.
      en: On 23 September 2026 the Central Elections Committee voted 19–5 to
        disqualify Cassif's candidacy, at Likud's request; the Attorney General
        opposed the disqualification and Cassif rejected the allegations. A
        candidate's disqualification needs the Supreme Court's approval, and on
        2 October 2026 the court, by a 7–2 majority (Justices David Mintz and
        Alex Stein dissenting), declined to approve it. Cassif is running.
