    title:
      he: הציג עם סמוטריץ' תוכנית להמשך הרפורמה במערכת המשפט אחרי הבחירות
      en: Presented with Smotrich a plan to extend the judicial overhaul after the election
    description:
      he: ב-15 בספטמבר 2026 הציגו רוטמן ושר האוצר בצלאל סמוטריץ' את תוכנית הציונות
        הדתית להרחבת הרפורמה במערכת המשפט בכנסת הבאה, ובה בין היתר מתן אפשרות
        לכנסת לחוקק מחדש חוקים שנפסלו בבג"ץ, שימועים פומביים למועמדים לעליון
        ופיצול תפקיד היועץ המשפטי לממשלה; רוטמן כינה אותה "תוכנית יסוד להחזרת
        הדמוקרטיה הישראלית למסלול". באוגוסט 2026, בעימות בחירות מול ח"כ גלעד
        קריב, הגן רוטמן על הרפורמה ואמר כי הקואליציה "הייתה עדינה מאוד".
      en: On 15 September 2026 Rothman and Finance Minister Bezalel Smotrich presented
        Religious Zionism's plan to expand the judicial overhaul in the next
        Knesset, including letting the Knesset re-enact laws struck down by the
        High Court, public hearings for Supreme Court candidates and splitting
        the attorney general's role; Rothman called it "a foundational plan to
        bring Israeli democracy back on track". In an August 2026 election debate
        with MK Gilad Kariv, Rothman defended the overhaul, saying the coalition
        "was very restrained".
