      en: "Professional background as a lawyer and in religious public service"
    description:
      he: "מלול הוא עורך דין בעל תארי בוגר ומוסמך במשפטים מהקריה האקדמית אונו. משנת 2015 שימש כיועץ לחקיקה לשר לשירותי דת דוד אזולאי, וב-2016 כראש מטה מנכ\"ל המשרד לשירותי דת. כן שימש כמנהל מכון 'יחוה דעת'."
      en: "Malul is a licensed attorney who earned bachelor's and master's degrees in law from Ono Academic College. From 2015 he served as a legislative adviser to Minister of Religious Services David Azulai, and in 2016 as head of the director-general's bureau in the Ministry of Religious Services. He also directed the Yechaveh Da'at institute."
