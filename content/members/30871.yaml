      en: Member of the 25th Knesset for Yesh Atid
    description:
      he: שלי טל מירון נכנסה לכנסת ב-1 בפברואר 2023 כחברת הכנסת ה-25 מטעם מפלגת יש
        עתיד, לאחר התפטרותו של יואל רזבוזוב. לפני כן שירתה כשש שנים בחיל האוויר
        הישראלי בתפקידי דוברות, הדרכת טיס וקצונה, ולאחר מכן עבדה בחברת
