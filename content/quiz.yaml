        source: { url: "https://knesset.gov.il/OdataV4/ParliamentInfo/KNS_PlenumVote(41304)", title: "\"הצהרות ופרסומים בעולם בנושא הכרה במדינה פלסטינית והצורך בהערכות ישראלית לאתגר מדיני אפשרי\" — הצבעה במליאה, 2024-07-18 — הצעה לסדר היום — סיכום הדיון", publisher: "הכנסת" }
        quote:
          he: "ההצבעה על הצהרת הכנסת \"הכנסת מתנגדת בתוקף להקמת מדינה פלסטינית ממערב לירדן\" (התקבלה 68–9); הצבעה בעד ההצהרה = התנגדות למשפט: 5 בעד, 0 נגד, 3 נעדרו"
          en: "the vote on the Knesset declaration \"firmly opposes the establishment of a Palestinian state west of the Jordan\" (passed 68–9); a vote for the declaration = disagreement with the statement: 5 for, 0 against, 3 absent"
          ar: "التصويت على إعلان الكنيست الذي «يعارض بشدة إقامة دولة فلسطينية غربي نهر الأردن» (أُقرّ 68–9)؛ التصويت مع الإعلان = عدم الموافقة على العبارة: مع: 5، ضد: 0، غائبون: 3"
          ru: "голосование по декларации Кнессета о том, что он «решительно выступает против создания палестинского государства к западу от Иордана» (принята 68–9); голос «за» декларацию = несогласие с утверждением: за: 5, против: 0, отсутствовали: 3"
          es: "la votación de la declaración de la Knéset que «se opone firmemente al establecimiento de un Estado palestino al oeste del Jordán» (aprobada 68–9); un voto a favor de la declaración = desacuerdo con la afirmación: 5 a favor, 0 en contra, 3 ausentes"
          fr: "le vote sur la déclaration de la Knesset qui « s’oppose fermement à l’établissement d’un État palestinien à l’ouest du Jourdain » (adoptée 68–9) ; un vote pour la déclaration = désaccord avec l’affirmation : 5 pour, 0 contre, 3 absents"
      raam:
