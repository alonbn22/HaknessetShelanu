        title: "Avi Maoz"
        publisher: "Wikipedia"
  - kind: negative
    category: controversy
    date: "2023-01-29"
    title:
      he: "הסמכות שהובטחה לו על התוכניות החיצוניות בבתי הספר עוררה שביתת תלמידים והתנגדות רשויות מקומיות"
      en: "His promised authority over external school programs drew a student strike and opposition from municipalities"
    description:
      he: "ההסכם הקואליציוני העניק למעוז אחריות על היחידה לתוכניות חיצוניות במשרד החינוך, המאשרת ומתקצבת ספקי תוכן חיצוניים לבתי הספר. ב-29 בינואר 2023 שבתו אלפי תלמידי תיכון מעשרות בתי ספר וצעדו בתל אביב, בתמיכת מנהלים וועדי הורים, במחאה על המהלך ועל הרפורמה המשפטית; כמה רשויות מקומיות הודיעו כי יתנגדו למהלך או יממנו תוכניות בעצמן. מעוז אמר כי \"לא ביטלתי שום תוכנית\" והתחייב להנהיג \"שקיפות\" להורים לגבי תוכן הספקים ומקורות מימונם."
      en: "The coalition agreement gave Maoz responsibility for the Education Ministry unit that approves and funds external content providers in public schools. On 29 January 2023 thousands of high-school students from dozens of schools went on strike and marched in Tel Aviv, backed by principals and parent committees, protesting the move and the judicial overhaul; several municipalities said they would oppose the move or fund programs themselves. Maoz said \"I haven't canceled any plan\" and pledged to introduce \"transparency\" for parents about vendors' content and funding sources."
    sources:
      - url: "https://www.jpost.com/breaking-news/article-729964"
        title: "Thousands of Israeli high schoolers protest judicial reform, Avi Maoz"
        publisher: "The Jerusalem Post"
      - url: "https://www.timesofisrael.com/despite-delays-far-right-maoz-pledges-to-take-over-external-educational-programming/"
        title: "Despite delays, far-right Maoz pledges to take over external educational programming"
        publisher: "The Times of Israel"
  - kind: negative
    category: controversy
    date: "2023-04-28"
    title:
      he: "כתב כי \"התמלאתי בושה וכאב\" מהצגת יו\"ר הכנסת אוחנה ובן זוגו בטקסים ממלכתיים"
      en: "Wrote that he was \"filled with shame and pain\" at the presentation of Speaker Ohana and his partner at state ceremonies"
    description:
      he: "ב-28 באפריל 2023 פרסם מעוז מכתב לפעילי מפלגתו ובו כתב כי \"התמלאתי בושה וכאב\" כאשר בטקסי יום השואה, יום הזיכרון ויום העצמאות הוכרז על \"יושב ראש הכנסת ובן זוגו\" \"כאילו הייתה זו נורמה יהודית אותנטית ומקובלת\". הוא הוסיף כי הצביע בעד מינוי אוחנה במסגרת ההסכמים הקואליציוניים, כי \"טעה\" בכך שלא מחה, וכי באופן אישי \"אין לו דבר נגדו\"."
      en: "On 28 April 2023 Maoz published a letter to his party's activists saying he was \"filled with shame and pain\" that at the Holocaust Remembrance Day, Memorial Day and Independence Day ceremonies \"the Knesset Speaker and his partner\" were announced \"as if this were an authentic and accepted Jewish norm\". He added that he had voted for Ohana's appointment under the coalition agreements, that he had \"made a mistake\" by not protesting, and that on a personal level he had \"nothing against him\"."
    sources:
