    title:
      he: שירות צבאי בחיל האוויר
      en: Military service in the Air Force
    description:
      he: במהלך שירותו הצבאי בצה"ל פיקד ואטורי על צוות חילוץ מטוסים בחיל האוויר הישראלי.
      en: During his national service in the Israel Defense Forces, Vaturi commanded an Israeli Air Force aircraft recovery team.
