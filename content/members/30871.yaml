      en: "13th on the Yesh Atid slate for the joint run with Bennett"
    description:
      he: "ב-5 בספטמבר 2026 הציג יאיר לפיד את רשימת יש עתיד לקראת הריצה המשותפת עם נפתלי בנט ברשימת \"ביחד\", וטל מירון שובצה בה במקום ה-13. ב-24 המקומות הראשונים של הרשימה המאוחדת שהוצגה ב-6 בספטמבר 2026 היא אינה מופיעה."
      en: "On 5 September 2026 Yair Lapid unveiled the Yesh Atid slate for the joint run with Naftali Bennett on the \"Beyachad\" list, with Tal Meron placed 13th. She does not appear among the first 24 slots of the merged list presented on 6 September 2026."
