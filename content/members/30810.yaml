      en: In 2014 Waldiger founded and now heads Emunatech, an organization for
        families of people coping with dual diagnosis (mental-health challenges
        alongside addiction). In 2017 she was appointed head of Bat Ami, a
        national-service organization for religious-Zionist young women, which
        she left in 2021 ahead of her Knesset candidacy.
