    title:
      he: הכנסת אישרה חוק שיזם עם עמית הלוי האוסר על בעלי תואר ממוסדות ברשות הפלסטינית ללמד בישראל
      en: The Knesset passed a law he initiated with Amit Halevi barring holders of degrees from Palestinian Authority institutions from teaching in Israel
    description:
      he: ב-21 בינואר 2026 אישרה מליאת הכנסת בקריאה שנייה ושלישית חוק שיזמו בוארון וח"כ עמית הלוי, הקובע כי מי שמחזיק בתואר ממוסד להשכלה גבוהה ברשות הפלסטינית לא יוכל ללמד במערכת החינוך הישראלית.
      en: On 21 January 2026 the Knesset plenum passed in its second and third readings a law initiated by Boaron and MK Amit Halevi, under which a person holding a degree from a higher-education institution in the Palestinian Authority may not teach in the Israeli education system.
