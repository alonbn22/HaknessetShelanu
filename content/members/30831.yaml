    title:
      he: ביקורת על הצעת חוק לסגן ראש עיר נוסף בשכר
      en: Criticism over bill enabling an additional salaried deputy mayor
      ar: انتقادات لمشروع قانون يتيح نائب رئيس بلدية إضافي بأجر
      ru: Критика законопроекта о дополнительном оплачиваемом заместителе мэра
    description:
      he: דלל קידם הצעת חוק פרטית שתאפשר לרשויות מקומיות שבהן 100–150 אלף תושבים למנות סגן ראש עיר נוסף בשכר; בדצמבר 2024 אישרה ועדת הפנים של הכנסת את ההצעה לקריאה שנייה. דה-מרקר דיווח כי ההצעה תיטיב בפועל עם נתניה, עירו של דלל — שהצהיר על כוונתו להתמודד על ראשות העיר — בעלות של מאות אלפי שקלים בשנה, והעלה טענות לניגוד עניינים. בכתבה לא הובאה תגובה מטעם דלל.
      en: Dallal advanced a private bill allowing municipalities with 100,000–150,000 residents to appoint an additional salaried deputy mayor; in December 2024 the Knesset Interior Committee approved it for its second reading. TheMarker reported that the bill would in practice benefit Netanya — Dallal's home city, where he had declared his intention to run for mayor — at a cost of hundreds of thousands of shekels a year, and raised conflict-of-interest concerns. The report did not include a response from Dallal.
      ru: Далаль продвигал частный законопроект, позволяющий городам со 100–150 тыс. жителей назначать дополнительного оплачиваемого заместителя мэра; в декабре 2024 года комиссия Кнессета по внутренним делам одобрила его ко второму чтению. Газета TheMarker сообщила, что закон фактически выгоден Нетании — родному городу Далаля, где он заявил о намерении баллотироваться в мэры, — и указала на вопросы конфликта интересов. Ответ Далаля в публикации не приводился.
    sources:
      - url: https://www.themarker.com/allnews/2024-12-10/ty-article/.premium/00000193-afc7-d7c9-afdf-ffcff2130000
        title: 'הצעת החוק של ח"כ אלי דלל: סגן נוסף בשכר לראשי עיריות — דווקא בנתניה, שממנה הוא מגיע'
        publisher: TheMarker
