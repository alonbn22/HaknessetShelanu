      he: "אביר איכות השלטון לשנת 2024"
      en: "Knight of Quality Government for 2024"
    description:
      he: "התנועה למען איכות השלטון בישראל כללה את טור-פז ברשימת אבירי איכות השלטון לשנת 2024 (שפורסמה ביולי 2025), בהוקרה על מאבק עקבי נגד תקציבים בלתי שקופים ובלתי מפוקחים למוסדות חינוך, חשיפת מנגנוני תקצוב פסולים והובלת השדולה למשרתי המילואים. האות הוענק בטקס ב-6 בנובמבר 2025."
      en: "The Movement for Quality Government in Israel included Tur-Paz in its list of Knights of Quality Government for 2024 (published in July 2025), in recognition of his consistent fight against non-transparent and unsupervised budgets for educational institutions, exposure of flawed funding mechanisms and leadership of the reservists' caucus. The award was presented at a ceremony on 6 November 2025."
    date: "2025-11-06"
