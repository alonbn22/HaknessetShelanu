        quote:
          he: "בנט, לשאלה אם ישב תחת נתניהו: \"ברור שלא. אני הולך להחליף אותו.\""
          en: "Bennett, asked whether he would sit under Netanyahu: \"Obviously not. I am going to replace him.\""
