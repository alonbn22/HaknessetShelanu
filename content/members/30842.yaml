    title:
      he: עיכב העברה של 1.1 מיליארד ש"ח לשיקום עוטף עזה כמנוף למענקים לעסקים בצפון — ההעברה אושרה פה אחד לאחר כשבוע
      en: Held up a NIS 1.1 billion transfer for Gaza-border rehabilitation as leverage for grants to northern businesses — the transfer was approved unanimously about a week later
    description:
      he: 'ביולי 2026 דיווחו ynet וכלכליסט כי מילביצקי, כיו"ר ועדת הכספים, מעכב העברה של כ-1.1 מיליארד ש"ח למנהלת תקומה לשיקום יישובי העוטף — ובהם סלי קליטה לתושבים החוזרים ל-13 יישובים שנפגעו — עד שיוקצו כ-500 מיליון ש"ח למענקים לעסקים בצפון, שבועות ספורים לפני הפריימריז בליכוד. תנועת "עתיד לעוטף" אמרה כי "לא ייתכן ששיקום העוטף יהיה ערובה או מנוף תקציבי". ב-13 ביולי אישרה הוועדה את ההעברה פה אחד; מילביצקי אמר כי עיכב את ההעברה "כצעד טקטי" כדי לקבל דוחות ביצוע מהמנהלת, וכי עסקי הצפון סובלים מנזק מתמשך.'
      en: 'In July 2026 Ynet and Calcalist reported that Milwidsky, as Finance Committee chair, was holding up a transfer of about NIS 1.1 billion to the Tekuma authority for rehabilitating the Gaza-border communities — including absorption packages for residents returning to 13 damaged communities — until about NIS 500 million was allocated for grants to northern businesses, weeks before the Likud primary. The "Future for the Otef" movement said "the Otef''s rehabilitation cannot be collateral or budgetary leverage". On 13 July the committee approved the transfer unanimously; Milwidsky said he had held it up "as a tactical step" to obtain performance reports from the authority, and that northern businesses were suffering ongoing damage.'
