  - kind: negative
    category: controversy
    status: settled
    title:
      he: "נזיפה חמורה והגבלת כלים פרלמנטריים מטעם ועדת האתיקה של הכנסת (2023)"
      en: "Severe reprimand and restriction of parliamentary tools by the Knesset Ethics Committee (2023)"
    description:
      he: "ב-5 במרץ 2023 החליטה ועדת האתיקה של הכנסת פה אחד כי להב-הרצנו, יחד עם חברי הכנסת ולדימיר בליאק ושלי מירון מיש עתיד, הפר את כללי האתיקה בכך שקפץ מעל שולחן ועדת החוקה, חוק ומשפט ב-13 בפברואר 2023, במהלך הצבעות על הצעות החוק של הרפורמה במערכת המשפט. הוועדה הטילה עליו ועל בליאק נזיפה חמורה והגבלה על השימוש בכלים פרלמנטריים (הגשת הצעות חוק, שאילתות וכדומה) עד סוף כנס החורף, לאחר שסירבו להתנצל. להב-הרצנו טען בפני הוועדה כי יו\"ר ועדת החוקה פגע בחופש הביטוי שלו וכי הוא מייצג ציבור רחב החושש מהרפורמה. מדובר בהליך אתי פנים-פרלמנטרי ולא בהליך פלילי."
      en: "On 5 March 2023 the Knesset Ethics Committee unanimously found that Lahav-Hertzanu, together with fellow Yesh Atid MKs Vladimir Beliak and Shelly Miron, had breached the ethics rules by jumping over the table of the Constitution, Law and Justice Committee on 13 February 2023, during votes on the judicial-overhaul bills. The committee imposed on him and Beliak a severe reprimand and a restriction on the use of parliamentary tools (submitting bills, queries and the like) until the end of the winter session, after they declined to apologize. Lahav-Hertzanu told the committee that the Constitution Committee chair had infringed his freedom of speech and that he represented a broad public worried about the overhaul. This was an internal parliamentary ethics matter, not a criminal proceeding."
    date: "2023-03-05"
