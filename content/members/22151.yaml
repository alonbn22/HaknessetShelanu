    title:
      he: ראש עיריית הכרמל (2003–2008)
      en: Mayor of Carmel City (2003–2008)
    description:
      he: "אכרם חסון כיהן כראש עיריית עיר הכרמל בין השנים 2003 ל-2008, וכיהן גם כחבר ועדת התכנון והבנייה של מחוז חיפה. קודם לכן, בשנים 1989–1998, שימש ממלא מקום ראש מועצת דאלית אל-כרמל."
      en: "Akram Hasson served as mayor of Carmel City from 2003 to 2008, and was also a member of the Haifa District Planning and Building Committee. He had earlier served as deputy head of the Daliyat al-Karmel local council (1989–1998)."
      ar: "شغل أكرم حسون منصب رئيس بلدية مدينة الكرمل بين عامي 2003 و2008، وكان أيضًا عضوًا في اللجنة اللوائية للتنظيم والبناء في لواء حيفا. وقبل ذلك، بين عامي 1989 و1998، شغل منصب نائب رئيس المجلس المحلي في دالية الكرمل."
      ru: "Акрам Хасон был мэром города Кармель (Ир-ха-Кармель) с 2003 по 2008 год, а также входил в окружную комиссию по планированию и строительству Хайфского округа. Ранее, в 1989–1998 годах, он был заместителем главы местного совета Далият-эль-Кармель."
      es: "Akram Hasson fue alcalde de Carmel City (Ir HaCarmel) de 2003 a 2008 y fue también miembro de la Comisión de Planificación y Construcción del Distrito de Haifa. Anteriormente, entre 1989 y 1998, fue jefe adjunto del consejo local de Daliyat al-Karmel."
      fr: "Akram Hasson a été maire de Carmel City (Ir HaCarmel) de 2003 à 2008 et a également siégé à la commission de planification et de construction du district de Haïfa. Auparavant, de 1989 à 1998, il avait été chef adjoint du conseil local de Daliyat al-Karmel."
    date: "2003"
