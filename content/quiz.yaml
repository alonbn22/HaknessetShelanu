  - id: lgbtq-partnership
    topic: society
    lean: left
    text:
      he: "יש להכיר בחוק בזוגיות של בני אותו המין — למשל באמצעות ברית זוגיות אזרחית."
      en: "Same-sex partnerships should be recognized in law — for example through a civil partnership registry."
      ar: "يجب الاعتراف قانونًا بالشراكة الزوجية بين شخصين من الجنس نفسه — مثلًا عبر سجل شراكة مدنية."
      ru: "Однополые партнёрства следует признать в законе — например через реестр гражданских союзов."
      es: "Las parejas del mismo sexo deberían reconocerse por ley — por ejemplo mediante un registro de unión civil."
      fr: "Les couples de même sexe devraient être reconnus par la loi — par exemple via un registre d’union civile."
    short:
      he: "הכרה בזוגיות חד-מינית"
      en: "Same-sex partnerships"
      ar: "الاعتراف بالشراكة المثلية"
      ru: "Однополые партнёрства"
      es: "Parejas del mismo sexo"
      fr: "Couples de même sexe"
    explainer:
      he: "בישראל אין נישואין אזרחיים, ובני זוג מאותו המין אינם יכולים להתחתן בארץ; נישואין שנערכו בחו\"ל נרשמים במרשם האוכלוסין, ולידועים בציבור יש זכויות רבות — אבל אין מסלול אזרחי בארץ. התומכים אומרים שזו שאלה של שוויון בסיסי; המתנגדים אומרים שהמשפחה היהודית המסורתית היא ערך שהמדינה צריכה לשמור עליו."
      en: "Israel has no civil marriage, and same-sex couples cannot marry in the country; a marriage abroad is entered in the population registry, and common-law partners have many rights — but there is no civil track at home. Supporters say it is a matter of basic equality; opponents say the traditional Jewish family is a value the state should protect."
      ar: "لا يوجد زواج مدني في إسرائيل، ولا يستطيع الأزواج من الجنس نفسه الزواج داخل البلاد؛ الزواج في الخارج يُسجَّل في سجل السكان، وللشريكين المعروفين علنًا حقوق كثيرة — لكن لا مسار مدنيًا داخل البلاد. يقول المؤيدون إنها مسألة مساواة أساسية؛ ويقول المعارضون إن العائلة اليهودية التقليدية قيمة يجب على الدولة حمايتها."
      ru: "В Израиле нет гражданского брака, и однополые пары не могут вступить в брак в стране; брак за границей вносится в реестр населения, а у гражданских партнёров много прав — но гражданского пути внутри страны нет. Сторонники говорят, что это вопрос базового равенства; противники — что традиционная еврейская семья — ценность, которую государство должно защищать."
      es: "En Israel no existe el matrimonio civil, y las parejas del mismo sexo no pueden casarse en el país; un matrimonio en el extranjero se inscribe en el registro de población, y las parejas de hecho tienen muchos derechos — pero no hay una vía civil en el país. Los partidarios dicen que es una cuestión de igualdad básica; los opositores dicen que la familia judía tradicional es un valor que el Estado debe proteger."
      fr: "Israël n’a pas de mariage civil, et les couples de même sexe ne peuvent pas se marier dans le pays ; un mariage à l’étranger est inscrit au registre de la population, et les concubins ont de nombreux droits — mais il n’existe pas de voie civile dans le pays. Les partisans disent que c’est une question d’égalité de base ; les opposants disent que la famille juive traditionnelle est une valeur que l’État doit protéger."
    stances:
      together:
        value: 2
        basis: platform
        source: { url: "https://be-yahad.org.il/plans/pride/", title: "ביחד נביא שוויון זכויות לקהילה הגאה — תכנית ביחד לקהילה הגאה", publisher: "ביחד" }
        quote:
          he: "\"נחוקק את חוק ברית הזוגיות האזרחית וניצור מסלול אזרחי מלא ונגיש לרישום זוגיות במרשם ממלכתי במשרד הפנים, עם מלוא הזכויות והחובות של זוגות נשואים וללא תלות בדת, מגדר או נטייה מינית.\""
          en: "\"We will legislate the Civil Partnership Act and create a full, accessible civil track for registering a partnership at the Interior Ministry, with all the rights and duties of married couples, regardless of religion, gender or sexual orientation.\""
      democrats:
        value: 2
        basis: platform
        source: { url: "https://yes.democrats.org.il/topics/lgbtq-equality", title: "הקהילה הגאה — תוכניות העבודה של הדמוקרטים", publisher: "הדמוקרטים" }
        quote:
          he: "\"נקדם שוויון זכויות מלא בחוק, כולל שוויון בזכות להורות, למשפחה ולנישואים.\""
          en: "\"We will advance full equal rights in law, including equality in the right to parenthood, to family and to marriage.\""
      yisrael-beiteinu:
        value: 1
        basis: platform
        source: { url: "https://beytenu.org.il/party-platform/", title: "המצע שלנו — ישראל ביתנו", publisher: "ישראל ביתנו" }
        quote:
          he: "\"הנהגת נישואין וגירושין אזרחיים לכל אזרח.\" (המצע אינו מזכיר זוגות בני אותו המין במפורש)"
          en: "\"Civil marriage and divorce for every citizen.\" (the platform does not name same-sex couples explicitly)"
      blue-white:
        value: 1
        basis: statement
        recordOf:
          he: "תשובת המחנה הממלכתי לשאלון ynet לקראת בחירות 2022, לפני שהרשימה שבה לשם כחול לבן"
          en: "National Unity's answer to ynet's 2022 election questionnaire, before the list reverted to the Blue and White name"
        source: { url: "https://www.ynet.co.il/judaism/article/hkapng2vj", title: "המחנה הממלכתי: התשובות המלאות (2022-10-30)", publisher: "ynet" }
        quote:
          he: "\"לצד חתונה יהודית כדת משה וישראל, יש לאפשר את ברית הזוגיות, דבר שייתן אופציה לכל אזרחי ישראל למסד את הזכות לזוגיות ולתא משפחתי\" (נשאלו אם על המדינה להכיר בנישואים אזרחיים ובזוגות להט\"ב)."
          en: "\"Alongside a Jewish wedding under religious law, the civil partnership covenant should be allowed, giving every citizen of Israel an option to formalise the right to partnership and a family unit\" (asked about recognising civil marriage and LGBT couples)."
      joint-list:
        value: 1
        basis: statement
        recordOf:
          he: "תשובת חד\"ש לשאלון ynet לקראת בחירות 2019 — תע\"ל ובל\"ד לא השיבו"
          en: "Hadash's answer to ynet's 2019 election questionnaire — Ta'al and Balad did not answer"
        source: { url: "https://www.ynet.co.il/articles/0,7340,L-5490470,00.html", title: "צבא, שבת, גיור, נישואים, דת ומדינה: זה מה שענו המפלגות (2019-04-08)", publisher: "ynet" }
        quote:
          he: "\"מאמינים בהפרדת הדת מהמדינה, בביטול כל חוקי הכפייה הדתית, בהנהגת נישואים וגירושים אזרחיים – ובהכרה במסגרות משפחתיות אלטרנטיביות. מתנגדים לכל אפליה וחוסר שוויון מכל סוג ועל כל רקע.\""
          en: "\"We believe in separating religion from the state, abolishing all religious-coercion laws, instituting civil marriage and divorce – and recognising alternative family frameworks. We oppose all discrimination and inequality of any kind, on any grounds.\""
      shas:
        value: -2
        basis: statement
        source: { url: "https://www.ynet.co.il/judaism/article/skjsylheo", title: "ש\"ס: התשובות המלאות (2022-10-30)", publisher: "ynet" }
        quote:
          he: "\"נישואים אזרחיים נועדו לעקוף ולמחוק את זהותה היהודית של המדינה והמשפחה המסורתית. נמשיך לחתן את בנינו ובנותינו כדת משה וישראל\" (נשאלו אם על המדינה להכיר בנישואים אזרחיים ובזוגות להט\"ב)."
          en: "\"Civil marriage is meant to bypass and erase the Jewish identity of the state and the traditional family. We will keep marrying our sons and daughters under Jewish religious law\" (asked about recognising civil marriage and LGBT couples)."
      utj:
        value: -2
        basis: statement
        source: { url: "https://www.ynet.co.il/judaism/article/hyruplhvs", title: "יהדות התורה: התשובות המלאות (2022-10-30)", publisher: "ynet" }
        quote:
          he: "\"הסטטוס-קוו הלאומי חייב להישמר גם בנושא זה… אנו נהיה המזוזה של המדינה גם בנושא זה\" (נשאלו אם על המדינה להכיר בנישואים אזרחיים ובזוגות להט\"ב)."
          en: "\"The national status quo must be preserved on this issue too… we will be the state's mezuzah on this issue as well\" (asked about recognising civil marriage and LGBT couples)."
      rz-zehut:
        value: -2
        basis: statement
        recordOf:
          he: "תשובת הרשימה המשותפת של הציונות הדתית ועוצמה יהודית לשאלון ynet לקראת בחירות 2022; זהות לא הייתה חלק מהרשימה"
          en: "the joint Religious Zionism–Otzma Yehudit list's answer to ynet's 2022 election questionnaire; Zehut was not part of that list"
        source: { url: "https://www.ynet.co.il/judaism/article/h1yc5lh4i", title: "הציונות הדתית ועוצמה יהודית: התשובות המלאות (2022-10-30)", publisher: "ynet" }
        quote:
          he: "\"כחלק משימור הסטטוס-קוו, על מדינת ישראל להכיר אך ורק בנישואין וגירושין כדת משה וישראל\" (נשאלו אם על המדינה להכיר בנישואים אזרחיים ובזוגות להט\"ב)."
          en: "\"As part of preserving the status quo, the State of Israel should recognise only marriage and divorce under Jewish religious law\" (asked about recognising civil marriage and LGBT couples)."
      otzma:
        value: -2
        basis: statement
        recordOf:
          he: "תשובת הרשימה המשותפת של הציונות הדתית ועוצמה יהודית לשאלון ynet לקראת בחירות 2022"
          en: "the joint Religious Zionism–Otzma Yehudit list's answer to ynet's 2022 election questionnaire"
        source: { url: "https://www.ynet.co.il/judaism/article/h1yc5lh4i", title: "הציונות הדתית ועוצמה יהודית: התשובות המלאות (2022-10-30)", publisher: "ynet" }
        quote:
          he: "\"כחלק משימור הסטטוס-קוו, על מדינת ישראל להכיר אך ורק בנישואין וגירושין כדת משה וישראל\" (נשאלו אם על המדינה להכיר בנישואים אזרחיים ובזוגות להט\"ב)."
          en: "\"As part of preserving the status quo, the State of Israel should recognise only marriage and divorce under Jewish religious law\" (asked about recognising civil marriage and LGBT couples)."
  - id: judicial-reform
    topic: institutions
    lean: right
    text:
      he: "יש להגביל בחקיקה את סמכויות בית המשפט העליון."
      en: "The Supreme Court's powers should be limited by legislation."
      ar: "يجب الحدّ من صلاحيات المحكمة العليا عبر التشريع."
      ru: "Полномочия Верховного суда следует ограничить законодательно."
      es: "Los poderes del Tribunal Supremo deberían limitarse por ley."
      fr: "Les pouvoirs de la Cour suprême devraient être limités par la loi."
    short:
      he: "סמכויות בית המשפט העליון"
      en: "Supreme Court powers"
      ar: "صلاحيات المحكمة العليا"
      ru: "Полномочия Верховного суда"
      es: "Poderes del Tribunal Supremo"
      fr: "Pouvoirs de la Cour suprême"
    explainer:
      he: "בית המשפט העליון יכול לפסול חוקים והחלטות ממשלה. תומכי ההגבלה אומרים שהכנסת הנבחרת צריכה להיות בעלת המילה האחרונה ושבית המשפט מתערב יותר מדי; המתנגדים אומרים שבלי בית משפט חזק אין מי שיגן על זכויות הפרט והמיעוט מפני הרוב. ב-2023 נחקק תיקון שאסר על בתי המשפט להפעיל את עילת הסבירות על החלטות הממשלה והשרים, ובית המשפט ביטל אותו."
      en: "The Supreme Court can strike down laws and government decisions. Supporters of limiting it say the elected Knesset should have the last word and that the court intervenes too much; opponents say that without a strong court nobody protects individual and minority rights from the majority. In 2023 an amendment barring the courts from applying the 'reasonableness' test to decisions of the government and ministers was passed, and the court struck it down."
      ar: "تستطيع المحكمة العليا إلغاء قوانين وقرارات حكومية. يقول مؤيدو تقييدها إن الكنيست المنتخب يجب أن تكون له الكلمة الأخيرة وإن المحكمة تتدخل أكثر من اللازم؛ ويقول المعارضون إنه من دون محكمة قوية لا أحد يحمي حقوق الفرد والأقلية من الأغلبية. في 2023 أُقرّ تعديل يمنع المحاكم من تطبيق معيار «المعقولية» على قرارات الحكومة والوزراء، فألغته المحكمة."
      ru: "Верховный суд может отменять законы и решения правительства. Сторонники ограничения говорят, что последнее слово должно быть за избранным Кнессетом и что суд вмешивается слишком часто; противники — что без сильного суда некому защитить права личности и меньшинства от большинства. В 2023 году была принята поправка, запретившая судам применять критерий «разумности» к решениям правительства и министров, и суд её отменил."
      es: "El Tribunal Supremo puede anular leyes y decisiones del Gobierno. Quienes apoyan limitarlo dicen que la Knéset electa debe tener la última palabra y que el tribunal interviene demasiado; los opositores dicen que sin un tribunal fuerte nadie protege los derechos individuales y de las minorías frente a la mayoría. En 2023 se aprobó una enmienda que prohibía a los tribunales aplicar el criterio de «razonabilidad» a las decisiones del Gobierno y de los ministros, y el tribunal la invalidó."
      fr: "La Cour suprême peut annuler des lois et des décisions du gouvernement. Les partisans de sa limitation disent que la Knesset élue doit avoir le dernier mot et que la Cour intervient trop ; les opposants disent que sans une Cour forte, personne ne protège les droits de l’individu et des minorités face à la majorité. En 2023, un amendement interdisant aux tribunaux d’appliquer le critère de « raisonnabilité » aux décisions du gouvernement et des ministres a été adopté, et la Cour l’a annulé."
    stances:
      likud:
        value: 2
        basis: vote
