      he: "מחלוקת עם ראש הממשלה על שימוע לממלא מקום מנהל רשות מקרקעי ישראל"
      en: "Dispute with the prime minister over a hearing for the acting head of the Israel Land Authority"
    description:
      he: "בספטמבר 2026 זימן כץ, כשר הבינוי והשיכון, את יהודה אליהו, ממלא מקום מנהל רשות מקרקעי ישראל, לשימוע לפני פיטורים, בנימוק של טענות על ליקויים בניהול הרשות. ראש הממשלה נתניהו הודיע ב-9 בספטמבר כי אליהו לא יפוטר, ושרים בליכוד מתחו ביקורת על המהלך; כץ אמר כי יקיים את השימוע בלב פתוח."
      en: "In September 2026 Katz, as Minister of Construction and Housing, summoned Yehuda Eliahu, acting director of the Israel Land Authority, to a pre-dismissal hearing, citing allegations of mismanagement at the authority. Prime Minister Netanyahu announced on 9 September that Eliahu would not be dismissed and Likud ministers criticized the move; Katz said he would hold the hearing with an open mind."
