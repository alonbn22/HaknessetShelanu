    description:
      he: ביוני 2021 נבחר קריב לעמוד בראש ועדת החוקה, חוק ומשפט של הכנסת, אחת הוועדות המרכזיות בכנסת, בתקופת הממשלה ה-36. בכנסת ה-25 הוא עומד בראש ועדת העלייה, הקליטה והתפוצות.
