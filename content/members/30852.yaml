      he: "\"עכשיו כולם מבינים שצדקתי\": ביקורת על מדיניות הגיוס"
      en: "\"Now everyone understands I was right\": criticism over conscription policy"
    description:
      he: "ב-2 באוגוסט 2026 מתח סולומון ביקורת על שינוי עמדותיו של ראש הממשלה בנוגע לאכיפת הגיוס על תלמידי ישיבות, ואמר כי ראש הממשלה אומר עתה \"בקולו שמי שלא לומד בישיבה יצטרך להתגייס\" — דברים שלטענתו הוא עצמו אמר פעמים רבות ולא התקבלו בזמן אמת."
      en: "On 2 August 2026 Solomon criticised the prime minister's shifting positions on enforcing conscription for yeshiva students, saying the prime minister was now saying \"in his own voice that whoever doesn't study in yeshiva will need to enlist\" — things Solomon said he himself had said many times without being heeded at the time."
