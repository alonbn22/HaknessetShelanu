    title:
      he: חבר הכנסת מטעם יש עתיד (2021–2026)
      en: Member of Knesset for Yesh Atid (2021–2026)
    description:
      he: רון כץ, עורך דין יליד 1985 מעפולה, נבחר לכנסת ה-24 בשנת 2021 מטעם מפלגת יש
        עתיד ונבחר מחדש לכנסת ה-25, שבה כיהן עד התפטרותו ביולי 2026. במהלך כהונתו
        קידם הצעות חוק בתחומים שונים, ובהם הגנה על בני נוער עובדים ורגולציה על
        מעונות יום.
      en: Ron Katz, a lawyer born in 1985 in Afula, was elected to the 24th Knesset in
        2021 on the Yesh Atid list and re-elected to the 25th Knesset, where he
        served until his resignation in July 2026. During his term he advanced
        bills in several areas, including protection of working youth and
        regulation of daycare centers.
