    title:
      he: יו"ר ועדת החוץ והביטחון של הכנסת (הכנסת ה-24)
      en: Chair of the Knesset Foreign Affairs and Defense Committee (24th Knesset)
    description:
      he: בן ברק, חבר כנסת מטעם יש עתיד מאז אפריל 2019, כיהן בכנסת ה-24 כיו"ר ועדת החוץ והביטחון
        של הכנסת, אחת הוועדות החזקות בבית המחוקקים, ובכנסת ה-25 המשיך לכהן כחבר בוועדה.
      en: Ben-Barak, a member of the Knesset for Yesh Atid since April 2019, chaired
        the Knesset Foreign Affairs and Defense Committee in the 24th Knesset, one of the
        parliament's most powerful committees, and continued as a member of the committee in the 25th Knesset.
    date: 2021-06-13
