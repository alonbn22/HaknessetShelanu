  - kind: positive
    category: achievement
    date: 2011-02-14
    title:
      he: "הרמטכ\"ל ה-20 של צה\"ל ולימים שר הביטחון"
      en: "20th Chief of the General Staff of the IDF, later Defense Minister"
    description:
      he: "כיהן כרמטכ\"ל בין פברואר 2011 לפברואר 2015. נכנס לפוליטיקה בראש מפלגת כחול לבן (2019), כיהן כשר הביטחון וכראש ממשלה חלופי (2020–2022), וב-12 באוקטובר 2023, לאחר מתקפת 7 באוקטובר, הצטרף לממשלת החירום כשר בקבינט המלחמה — תפקיד שממנו התפטר ביוני 2024."
      en: "Served as IDF Chief of Staff from February 2011 to February 2015. Entered politics leading the Blue and White party (2019), served as Defense Minister and Alternate Prime Minister (2020–2022), and on 12 October 2023, after the 7 October attack, joined the emergency government as a minister in the war cabinet — a post he resigned from in June 2024."
    sources:
