    title:
      he: הגישה תלונה במשטרה על הספירה החוזרת בפריימריז הליכוד
      en: Filed a police complaint over the Likud primary recount
    description:
      he: בפריימריז הליכוד לקראת בחירות 2026 שובצה גמליאל תחילה במקום ה-25 (מקום שמור
        לאישה). לאחר ספירה חוזרת בקלפיות בבאר יעקב הודיע הליכוד כי ח"כ אתי עטיה
        עקפה אותה, וגמליאל נדחקה למקום ה-35. ב-26 באוגוסט 2026 הגישה גמליאל
        תלונה במשטרה בטענה לאי-סדרים בספירה החוזרת, שלדבריה נערכה בלי שנציגה
        הורשה להיות נוכח; השר חיים כץ דחה את הטענות וכינה אותן "שקרים והכפשות".
      en: In the Likud primary ahead of the 2026 election Gamliel was initially placed
        25th (a slot reserved for a woman). After a recount of ballot boxes in
        Be'er Ya'akov, Likud announced that MK Eti Atia had overtaken her and
        Gamliel was moved to the 35th slot. On 26 August 2026 Gamliel filed a
        police complaint alleging irregularities in the recount, which she said
        was held without her representative being allowed to attend; Minister
        Haim Katz rejected the allegations as "lies and slander".
    sources:
