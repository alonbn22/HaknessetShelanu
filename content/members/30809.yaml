  - kind: negative
    category: controversy
    title:
      he: "ביקורת על תפקוד משרד ההסברה בימי המלחמה הראשונים ועל התבטאויות בתקופת כהונתה כשרה"
      en: "Criticism of the Public Diplomacy Ministry's performance in the first days of the war and of remarks made during her ministerial term"
    description:
      he: "בפברואר 2023 אמרה דיסטל אטבריאן כי המפגינים נגד הרפורמה המשפטית פועלים \"שלא במודע במימון איראני או גרמני\"; שגריר גרמניה שטפן זייברט הגיב כי \"מאכזב\" שבחרה להזכיר את גרמניה, ידידה ושותפה דמוקרטית של ישראל, לצד איראן הטוטליטרית. באוקטובר 2023 דווח כי בשלושת ימי המלחמה הראשונים לא התראיינה השרה לרשתות טלוויזיה זרות וכי לא נכללה בפורום המסבירים שהקים ראש הממשלה; לשכתה מסרה כי המשרד הקים חמ\"ל הסברה ותכניו הגיעו לעשרות מיליוני צפיות. בנובמבר 2023 אמרה כי לשכת ראש הממשלה אסרה עליה להתראיין וכי יש בה \"כעס בוער\" על נתניהו, ובדצמבר 2023 אמרה כי גם היא \"יצרה שסע ופילוג\" שתרם לחולשה שקדמה לטבח."
      en: "In February 2023 Distel Atbaryan said protesters against the judicial overhaul were \"acting unwittingly under Iranian or German funding\"; German ambassador Steffen Seibert responded that it was \"disappointing\" she chose to mention Germany, a friend and democratic partner of Israel, alongside totalitarian Iran. In October 2023 it was reported that in the first three days of the war the minister gave no interviews to foreign television networks and was not included in the spokespersons' forum set up by the prime minister; her office said the ministry had set up a public-diplomacy war room whose content reached tens of millions of views. In November 2023 she said the Prime Minister's Office had barred her from giving interviews and that she felt \"burning anger\" toward Netanyahu, and in December 2023 she said she too had \"created a rift and division\" that contributed to the weakness preceding the massacre."
    date: "2023-10-10"
