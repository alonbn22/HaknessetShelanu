      he: חקירת משטרה בעניין משרד התחבורה ("פרשת הרמזור")
      en: Police investigation into the Transport Ministry ("Traffic Light" affair)
    description:
      he: ביוני 2024, בהנחיית היועצת המשפטית לממשלה, פתחה יחידת להב 433 בחקירה פלילית
