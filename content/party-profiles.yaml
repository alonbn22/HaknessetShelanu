  - id: 1099 # Ra'am
    verified: "2026-09-19"
    updates:
      - date: "2025-12-06"
        text:
          he: "יו\"ר רע\"ם מנסור עבאס הודיע בריאיון לחדשות 12 כי המפלגה תפריד את מוסדותיה ממועצת השורא ומהתנועה האסלאמית ותהפוך ל\"מפלגה אזרחית לחלוטין\"."
          en: "Ra’am chair Mansour Abbas said in a Channel 12 interview that the party would separate its institutions from the Shura Council and the Islamic Movement and become “a completely civic party”."
          ar: "قال رئيس القائمة الموحدة منصور عباس في مقابلة مع «القناة 12» إن الحزب سيفصل مؤسساته عن مجلس الشورى والحركة الإسلامية وسيصبح «حزبًا مدنيًا بالكامل»."
          ru: "Председатель РААМ Мансур Аббас в интервью 12-му каналу заявил, что партия отделит свои институты от Совета шуры и Исламского движения и станет «полностью гражданской партией»."
          es: "El presidente de Ra’am, Mansour Abbas, dijo en una entrevista en el Canal 12 que el partido separaría sus instituciones del Consejo de la Shura y del Movimiento Islámico y se convertiría en «un partido plenamente civil»."
          fr: "Le président de Ra’am, Mansour Abbas, a déclaré dans un entretien sur la Chaîne 12 que le parti séparerait ses institutions du Conseil de la Choura et du Mouvement islamique et deviendrait « un parti entièrement civique »."
        sources:
          - { url: "https://www.timesofisrael.com/raam-leader-says-party-will-cut-ties-with-religious-council-become-completely-civic/", title: "Ra'am leader says party will cut ties with religious council, become 'completely civic' (2025-12-07)", publisher: "The Times of Israel" }
          - { url: "https://www.haaretz.co.il/0000019a-fa1c-d193-a1be-fbbd36a30000", title: "בהתנתקות מהתנועה האסלאמית, מנסור עבאס מהמר על עתיד רע\"מ (2025-12-08)", publisher: "הארץ" }
      - date: "2026-01-05"
        text:
          he: "עבאס הודיע כי רע\"ם פתוחה לחברים ולמועמדים יהודים לכנסת, ושלל הצטרפות לממשלה הנוכחית."
          en: "Abbas said Ra’am is open to Jewish members and Knesset candidates, and ruled out joining the current government."
          ar: "قال عباس إن القائمة الموحدة منفتحة على أعضاء ومرشحين يهود للكنيست، واستبعد الانضمام إلى الحكومة الحالية."
          ru: "Аббас заявил, что РААМ открыта для членов и кандидатов в Кнессет из числа евреев, и исключил вхождение в нынешнее правительство."
          es: "Abbas dijo que Ra’am está abierto a miembros y candidatos judíos a la Knéset, y descartó unirse al Gobierno actual."
          fr: "Abbas a déclaré que Ra’am est ouvert aux membres et candidats juifs à la Knesset, et a exclu de rejoindre le gouvernement actuel."
        sources:
          - { url: "https://www.timesofisrael.com/liveblog_entry/abbas-says-raam-party-will-be-open-to-jewish-candidates-in-major-shift/", title: "Abbas says Ra'am party will be open to Jewish candidates, in major shift (2026-01-05)", publisher: "The Times of Israel" }
      - date: "2026-01-22"
        text:
          he: "ראשי רע\"ם, חד\"ש, תע\"ל ובל\"ד חתמו בסח'נין על התחייבות לפעול להקמת הרשימה המשותפת מחדש, ביום השביתה הכללית בחברה הערבית נגד הפשיעה."
          en: "The heads of Ra’am, Hadash, Ta’al and Balad signed in Sakhnin a commitment to work toward re-establishing the Joint List, on the day of the Arab community’s general strike over violent crime."
          ar: "وقّع رؤساء القائمة الموحدة والجبهة والعربية للتغيير والتجمع في سخنين تعهّدًا بالعمل على إعادة تشكيل القائمة المشتركة، في يوم الإضراب العام في المجتمع العربي احتجاجًا على الجريمة."
          ru: "Лидеры РААМ, «Хадаш», «Тааль» и «Балад» подписали в Сахнине обязательство добиваться воссоздания «Объединённого списка» — в день всеобщей забастовки арабского общества против преступности."
          es: "Los dirigentes de Ra’am, Hadash, Ta’al y Balad firmaron en Sajnin un compromiso de trabajar por el restablecimiento de la Lista Conjunta, el día de la huelga general de la comunidad árabe contra la violencia criminal."
          fr: "Les dirigeants de Ra’am, Hadash, Ta’al et Balad ont signé à Sakhnin un engagement à œuvrer au rétablissement de la Liste commune, le jour de la grève générale de la communauté arabe contre la criminalité violente."
        sources:
          - { url: "https://www.timesofisrael.com/under-pressure-arab-knesset-parties-sign-agreement-to-work-toward-reviving-joint-list/", title: "Under pressure, Arab Knesset parties sign agreement to work toward reviving Joint List (2026-01-22)", publisher: "The Times of Israel" }
          - { url: "https://www.ynet.co.il/news/article/bye65yguwl", title: "ראשי המפלגות הערביות הסכימו: נפעל להקמת הרשימה המשותפת מחדש (2026-01-22)", publisher: "ynet" }
      - date: "2026-07-26"
        text:
          he: "רע\"ם הודיעה כי תרוץ לבד (\"אנחנו רצים לבד\") ותקיים בחירות מקדימות בוועידתה ב-22 באוגוסט, לראשונה ללא מועצת השורא; עבאס הודיע על השלמת ההיפרדות מהתנועה האסלאמית בבחירת המועמדים."
          en: "Ra’am said it would run on its own (“we are running alone”) and hold primaries at its convention on 22 August, for the first time without the Shura Council; Abbas said the separation from the Islamic Movement in choosing candidates was complete."
          ar: "أعلنت القائمة الموحدة أنها ستترشح منفردة («نحن نترشح وحدنا») وستُجري انتخابات تمهيدية في مؤتمرها في 22 آب/أغسطس، لأول مرة من دون مجلس الشورى؛ وأعلن عباس اكتمال الانفصال عن الحركة الإسلامية في اختيار المرشحين."
          ru: "РААМ объявила, что пойдёт на выборы самостоятельно («мы идём одни») и проведёт праймериз на съезде 22 августа — впервые без Совета шуры; Аббас объявил о завершении отделения от Исламского движения при отборе кандидатов."
          es: "Ra’am dijo que se presentaría en solitario («vamos solos») y que celebraría primarias en su convención del 22 de agosto, por primera vez sin el Consejo de la Shura; Abbas dijo que la separación del Movimiento Islámico en la elección de candidatos era completa."
          fr: "Ra’am a déclaré qu’il se présenterait seul (« nous y allons seuls ») et tiendrait des primaires lors de sa convention du 22 août, pour la première fois sans le Conseil de la Choura ; Abbas a déclaré que la séparation d’avec le Mouvement islamique dans le choix des candidats était complète."
        sources:
