  - kind: positive
    category: achievement
    title:
      he: "ייסוד והובלת השדולה לנפגעות אלימות מינית במלחמה וקואליציה בינלאומית בנושא"
      en: "Founded and chairs the caucus for victims of wartime sexual violence and an international coalition on the issue"
    description:
      he: "טל מירון הקימה ועומדת בראש השדולה בכנסת לנפגעות אלימות מינית ומגדרית במלחמת חרבות ברזל (יחד עם ח\"כ צגה מלקו מהליכוד). היא פעלה להעלאת המודעות הבינלאומית לאלימות המינית באירועי 7 באוקטובר, התראיינה לתקשורת זרה באירופה, וב-20 במאי 2024 השיקה בכנסת קואליציה בינלאומית של נשים נגד אלימות מגדרית ככלי נשק במלחמה, בהשתתפות נציגות מצרפת, אירלנד, דנמרק, בריטניה ומדינות נוספות."
      en: "Tal Meron founded and chairs the Knesset caucus for victims of sexual and gender-based violence in the Swords of Iron War (together with Likud MK Tzega Melaku). She has worked to raise international awareness of the sexual violence of 7 October, giving interviews to foreign media in Europe, and on 20 May 2024 launched at the Knesset a global women's coalition against gender-based violence as a weapon of war, with delegates from France, Ireland, Denmark, the UK and other countries."
    date: "2024-05-20"
    sources:
      - url: "https://www.timesofisrael.com/seeking-to-end-silence-around-sexual-violence-in-war-an-mk-raises-her-voice-abroad/"
        title: "Seeking to end silence around sexual violence in war, an MK raises her voice abroad"
        publisher: "The Times of Israel"
