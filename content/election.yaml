    leader: { he: "ד\"ר יוסף ג'בארין", en: "Dr. Yousef Jabareen", ar: "د. يوسف جبارين", ru: "д-р Юсеф Джабарин", es: "Dr. Yousef Jabareen", fr: "Dr Yousef Jabareen" }
    leaderWiki: "https://en.wikipedia.org/wiki/Yousef_Jabareen"
    factionId: 1103
    note:
      he: "חד\"ש, תע\"ל ובל\"ד רצות שוב ברשימה אחת: ג'בארין בראשה, אחמד טיבי (תע\"ל) במקום השני וסאמי אבו שחאדה (בל\"ד) בשלישי. ב-23 בספטמבר 2026 החליטה ועדת הבחירות המרכזית (18 נגד 5) לפסול את הרשימה, ובנפרד את המועמדים סאמי אבו שחאדה ועופר כסיף; הם דוחים את הטענות. הרשימה רשאית לערער לבית המשפט העליון עד 29 בספטמבר, ופסילת מועמד טעונה את אישורו."
      en: "Hadash, Ta'al and Balad run again on one list: Jabareen leads, Ahmad Tibi (Ta'al) is second and Sami Abu Shehadeh (Balad) third. On September 23, 2026 the Central Elections Committee voted 18–5 to disqualify the list and, separately, the candidates Sami Abu Shehadeh and Ofer Cassif; they reject the allegations. The list may appeal to the Supreme Court until September 29, and a candidate's disqualification needs the court's approval."
      ar: "الجبهة والعربية للتغيير والتجمع تترشح مجددًا في قائمة واحدة: جبارين في رأسها، وأحمد الطيبي (العربية للتغيير) ثانيًا، وسامي أبو شحادة (التجمع) ثالثًا. في 23 أيلول/سبتمبر 2026 قرّرت لجنة الانتخابات المركزية (18 مقابل 5) شطب القائمة، وبشكل منفصل المرشحَين سامي أبو شحادة وعوفر كسيف؛ وهم يرفضون الادعاءات. ويحق للقائمة الاستئناف إلى المحكمة العليا حتى 29 أيلول/سبتمبر، ويتطلب شطب المرشح مصادقة المحكمة."
      ru: "«Хадаш», «Тааль» и «Балад» снова идут одним списком: во главе Джабарин, Ахмад Тиби («Тааль») — второй, Сами Абу Шехаде («Балад») — третий. 23 сентября 2026 года Центральная избирательная комиссия (18 против 5) отстранила список, а отдельно — кандидатов Сами Абу Шехаде и Офера Касифа; они отвергают обвинения. Список может обжаловать решение в Верховном суде до 29 сентября, а отстранение кандидата требует утверждения суда."
      es: "Hadash, Ta'al y Balad vuelven a presentarse en una sola lista: Jabareen la encabeza, Ahmad Tibi (Ta'al) es segundo y Sami Abu Shehadeh (Balad) tercero. El 23 de septiembre de 2026 la Comisión Electoral Central votó 18 a 5 inhabilitar la lista y, por separado, a los candidatos Sami Abu Shehadeh y Ofer Cassif, que rechazan las acusaciones. La lista puede recurrir ante el Tribunal Supremo hasta el 29 de septiembre, y la inhabilitación de un candidato requiere la aprobación del tribunal."
      fr: "Hadash, Ta'al et Balad se présentent de nouveau sur une seule liste : Jabareen en tête, Ahmad Tibi (Ta'al) deuxième et Sami Abu Shehadeh (Balad) troisième. Le 23 septembre 2026, la Commission électorale centrale a voté par 18 voix contre 5 l’invalidation de la liste et, séparément, celle des candidats Sami Abu Shehadeh et Ofer Cassif, qui rejettent les accusations. La liste peut faire appel devant la Cour suprême jusqu’au 29 septembre, et l’invalidation d’un candidat doit être approuvée par la Cour."
