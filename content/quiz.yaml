        quote:
          he: "\"נקדם יהדות מכילה ומכבדת, באחריות ובהדברות, תוך הרחבת העצמאות של רשויות מקומיות וקהילות לעצב את השבת במרחב הציבורי בהתאם לאופיין וערכיהן\"; \"נפעל למיסוד זוגיות אזרחית בישראל\""
          en: "\"We will promote an inclusive and respectful Judaism, responsibly and through dialogue, expanding the autonomy of local authorities and communities to shape Shabbat in the public space according to their character and values\"; \"We will act to institutionalize civil partnership in Israel\""
          ar: "«سنعزّز يهودية احتوائية ومحترِمة، بمسؤولية وبالحوار، مع توسيع استقلالية السلطات المحلية والمجتمعات في تشكيل السبت في الحيّز العام وفق طابعها وقيمها»؛ «سنعمل على مأسسة الشراكة المدنية في إسرائيل»"
          ru: "«Мы будем продвигать инклюзивный и уважительный иудаизм — ответственно и через диалог, расширяя самостоятельность местных властей и общин в том, каким быть шаббату в общественном пространстве, в соответствии с их характером и ценностями»; «Мы будем добиваться закрепления гражданского союза в Израиле»"
          es: "«Promoveremos un judaísmo inclusivo y respetuoso, con responsabilidad y diálogo, ampliando la autonomía de las autoridades locales y las comunidades para dar forma al Shabat en el espacio público según su carácter y sus valores»; «Actuaremos para institucionalizar la unión civil en Israel»"
          fr: "« Nous promouvrons un judaïsme inclusif et respectueux, avec responsabilité et par le dialogue, en élargissant l’autonomie des collectivités locales et des communautés pour façonner le shabbat dans l’espace public selon leur caractère et leurs valeurs » ; « Nous agirons pour institutionnaliser l’union civile en Israël »"
  - id: haredi-draft-law
    topic: religion-state
    lean: right
    text:
      he: "יש לעגן בחוק הסדר שמאפשר לבחורי ישיבות שלא להתגייס לצה\"ל."
      en: "The law should let yeshiva students not be drafted into the IDF."
      ar: "يجب أن يكرّس القانون ترتيبًا يسمح لطلاب المدارس الدينية بعدم التجنيد في الجيش."
      ru: "Закон должен закрепить порядок, позволяющий учащимся ешив не призываться в армию."
      es: "La ley debería permitir que los estudiantes de yeshivá no sean reclutados por el ejército."
      fr: "La loi devrait permettre aux étudiants de yeshiva de ne pas être enrôlés dans l’armée."
    short:
      he: "פטור מגיוס לבני ישיבות"
      en: "Yeshiva draft exemption"
      ar: "إعفاء طلاب المعاهد الدينية من التجنيد"
      ru: "Освобождение учащихся ешив от призыва"
      es: "Exención del servicio militar para estudiantes de yeshivá"
      fr: "Exemption de conscription des étudiants de yeshiva"
    explainer:
      he: "רוב הצעירים בישראל חייבים בגיוס; לומדי ישיבות חרדים קיבלו במשך שנים דחיית שירות, ובית המשפט העליון קבע ב-2024 שבלי חוק אין לכך בסיס. ביולי 2026 אישרה הכנסת הוראת שעה המקפיאה מעצרים של תלמידי ישיבות עד סוף נובמבר 2026; האופוזיציה הצביעה נגד. תומכי ההסדר אומרים שלימוד תורה הוא ערך שהמדינה צריכה לשמור עליו; המתנגדים אומרים שהנטל צריך להתחלק שווה, במיוחד אחרי המלחמה."
      en: "Most young Israelis must enlist; haredi yeshiva students had their service deferred for years, and in 2024 the Supreme Court ruled that without a law there is no basis for it. In July 2026 the Knesset passed a temporary order freezing arrests of yeshiva students until the end of November 2026; the opposition voted against. Supporters of an arrangement say Torah study is a value the state should protect; opponents say the burden must be shared equally, especially after the war."
      ar: "معظم الشباب في إسرائيل ملزمون بالتجنيد؛ وحصل طلاب المعاهد الدينية الحريدية لسنوات على تأجيل الخدمة، وقضت المحكمة العليا في 2024 بأنه من دون قانون لا أساس لذلك. في تموز/يوليو 2026 أقرّ الكنيست أمرًا مؤقتًا يجمّد اعتقال طلاب المعاهد الدينية حتى نهاية تشرين الثاني/نوفمبر 2026؛ وصوّتت المعارضة ضده. يقول مؤيدو الترتيب إن دراسة التوراة قيمة يجب على الدولة حمايتها؛ ويقول المعارضون إن العبء يجب أن يُقتسم بالتساوي، خصوصًا بعد الحرب."
      ru: "Большинство молодых израильтян обязаны служить; учащимся харедимных ешив годами отсрочивали службу, и в 2024 году Верховный суд постановил, что без закона для этого нет основания. В июле 2026 года Кнессет принял временное распоряжение, замораживающее аресты учащихся ешив до конца ноября 2026 года; оппозиция голосовала против. Сторонники такого порядка говорят, что изучение Торы — ценность, которую государство должно защищать; противники — что бремя должно делиться поровну, особенно после войны."
      es: "La mayoría de los jóvenes israelíes deben alistarse; los estudiantes de yeshivá jaredíes obtuvieron durante años un aplazamiento, y en 2024 el Tribunal Supremo dictaminó que sin una ley no hay base para ello. En julio de 2026 la Knéset aprobó una disposición temporal que congela las detenciones de estudiantes de yeshivá hasta finales de noviembre de 2026; la oposición votó en contra. Quienes apoyan un arreglo dicen que el estudio de la Torá es un valor que el Estado debe proteger; los opositores dicen que la carga debe repartirse por igual, sobre todo después de la guerra."
      fr: "La plupart des jeunes Israéliens doivent servir ; les étudiants des yeshivot haredi ont vu leur service reporté pendant des années, et en 2024 la Cour suprême a jugé que sans loi il n’y a pas de base à cela. En juillet 2026, la Knesset a adopté une disposition temporaire gelant les arrestations d’étudiants de yeshiva jusqu’à fin novembre 2026 ; l’opposition a voté contre. Les partisans d’un arrangement disent que l’étude de la Torah est une valeur que l’État doit protéger ; les opposants disent que le fardeau doit être partagé également, surtout après la guerre."
