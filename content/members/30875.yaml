      he: פעילות ציבורית למען הקהילה האתיופית בישראל
      en: Public activism for Israel's Ethiopian community
    description:
      he: מלקו פעילה רבת שנים למען הקהילה האתיופית בישראל, בין היתר במחאות 1996 נגד
        מדיניות מגן דוד אדום בנוגע לתרומות דם של יוצאי אתיופיה. בפברואר 2016
        מינה אותה משרד המשפטים להוביל צוות משנה להסברה במסגרת צוות בין-משרדי
        למאבק בגזענות כלפי יוצאי אתיופיה.
      en: Melaku has long been active on behalf of Israel's Ethiopian community,
        including participating in the 1996 protests over Magen David Adom's
        policy on Ethiopian-Israeli blood donations. In February 2016 the
        Justice Ministry appointed her to lead a public-awareness sub-team
        within an inter-ministerial task force against racism toward
        Ethiopian-Israelis.
    date: 2016-02
