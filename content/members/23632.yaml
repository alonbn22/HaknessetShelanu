  - kind: positive
    category: achievement
    title:
      he: יושב ראש הוועדה לענייני ביקורת המדינה (2023–2025)
      en: Chair of the State Control Committee (2023–2025)
    description:
      he: בכנסת ה-25 כיהן לוי כיושב ראש הוועדה לענייני ביקורת המדינה מינואר 2023 ועד
        5 בנובמבר 2025, אז החליף אותו אלון שוסטר במסגרת הסכם רוטציה. באוקטובר
        2025 הזהיר בדיון הוועדה כי בלי ועדת חקירה ממלכתית לאירועי 7 באוקטובר
        "אמון הציבור ימשיך להישחק".
      en: In the 25th Knesset Levy chaired the State Control Committee from January
        2023 until 5 November 2025, when Alon Schuster succeeded him under a
        rotation agreement. In October 2025 he warned at a committee session
        that without a state commission of inquiry into 7 October "public
        trust will continue to erode".
    date: 2023-01-04
    sources:
      - url: https://www.timesofisrael.com/knesset-panel-rejects-proposal-to-establish-october-7-state-commission-of-inquiry/
        title: Knesset panel rejects proposal to establish October 7 state commission of inquiry
        publisher: The Times of Israel
