    title:
      he: יושבת ראש הוועדה המיוחדת לטיפול בשורדי השואה
      en: Chair of the Special Committee for Holocaust Survivors
    description:
      he: ב-5 בנובמבר 2025 מונתה פרידמן ליושבת ראש הוועדה המיוחדת של הכנסת לטיפול
        בשורדי השואה. בכנסת כיהנה גם בוועדות נוספות, ובהן ועדת הכלכלה, ועדת החוץ
        והביטחון וועדת החינוך.
      en: On 5 November 2025, Fridman was appointed chair of the Knesset's Special
        Committee for Handling Holocaust Survivors. During her Knesset tenure
        she has also served on additional committees, including the Economy
        Committee, the Foreign Affairs and Defense Committee and the Education
        Committee.
