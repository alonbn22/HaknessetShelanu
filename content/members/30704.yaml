      he: "שלמה קרעי נבחר לכנסת לראשונה בבחירות אפריל 2019 מטעם מפלגת הליכוד. לאחר בחירות 2022 מונה לשר התקשורת בממשלה השלושים ושבע, תפקיד שבו הוא מכהן מדצמבר 2022, וגם בממשלת המעבר לאחר פיזור הכנסת ה-25."
      en: "Shlomo Karhi was first elected to the Knesset in the April 2019 elections as a member of the Likud party. Following the 2022 elections he was appointed Minister of Communications in Israel's thirty-seventh government, a post he has held since December 2022, including in the caretaker government after the dissolution of the 25th Knesset."
