        en: "\"…to the formation of a fully right-wing government…\""
        ar: "«…إلى تشكيل حكومة يمين كاملة…»"
        ru: "«…к созданию полностью правого правительства…»"
        es: "«…a la formación de un gobierno plenamente de derecha…»"
        fr: "« …à la formation d’un gouvernement entièrement de droite… »"
      note:
        he: "עמוד מקמפיין 2022, שעדיין נמצא באתר המפלגה"
        en: "a 2022 campaign page, still on the party's site"
        ar: "صفحة من حملة 2022، لا تزال على موقع الحزب"
        ru: "страница кампании 2022 года, которая всё ещё на сайте партии"
