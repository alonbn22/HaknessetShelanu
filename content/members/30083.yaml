claims:
  - kind: positive
    category: achievement
    title:
      he: כיהן כשר הכלכלה, שר החוץ ושר האנרגיה
      en: Served as Minister of Economy, Foreign Affairs, and Energy
    description:
      he: "אלי כהן, רואה חשבון ואיש עסקים מחולון שכיהן כקצין בחיל האוויר, נכנס לכנסת ב-2015 ומילא שורה של תפקידי שר בכירים: שר הכלכלה והתעשייה (2017–2020), שר המודיעין (2020–2021), שר החוץ (2022/2023 ועד ינואר 2024) ושר האנרגיה והתשתיות (מינואר 2024 ואילך)."
      en: "Eli Cohen, an accountant and businessman from Holon who served as an officer in the Israeli Air Force, entered the Knesset in 2015 and has held a series of senior cabinet posts: Minister of Economy and Industry (2017–2020), Minister of Intelligence (2020–2021), Minister of Foreign Affairs (2022/2023 to January 2024), and Minister of Energy and Infrastructure (since January 2024)."
    date: 2024-01-01
    sources:
      - url: https://en.wikipedia.org/wiki/Eli_Cohen_(politician,_born_1972)
        title: Eli Cohen (politician, born 1972)
        publisher: Wikipedia
      - url: https://www.timesofisrael.com/cabinet-okays-israel-katz-replacing-eli-cohen-as-foreign-minister-in-planned-move/
        title: Cabinet okays Israel Katz replacing Eli Cohen as foreign minister, in planned move
        publisher: The Times of Israel
  - kind: positive
    category: achievement
    title:
      he: הובלת כניסת ישראל לתוכנית הפטור מאשרה של ארה"ב
      en: Led Israel's entry into the US Visa Waiver Program
    description:
      he: במהלך כהונתו כשר החוץ, בספטמבר 2023, הכריז כהן על הצטרפות ישראל לתוכנית הפטור מאשרה של ארצות הברית, מהלך שישראל ביקשה להשיג במשך עשרות שנים. ישראל התקבלה רשמית לתוכנית באוקטובר 2023, ואפשרה לאזרחים ישראלים לנסוע לארה"ב ללא אשרה.
      en: During his tenure as foreign minister, in September 2023 Cohen announced Israel's entry into the United States Visa Waiver Program, a goal Israel had sought for decades. Israel was formally admitted to the program in October 2023, allowing Israeli citizens to travel to the US without a visa.
    date: 2023-10-01
    sources:
      - url: https://www.aljazeera.com/news/2023/9/25/israel-foreign-minister-says-us-will-allow-visa-free-travel-for-israelis
        title: Israel foreign minister says US will allow visa-free travel for Israelis
        publisher: Al Jazeera
