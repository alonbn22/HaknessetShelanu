# The election compass — statements and each running list's stance on them.
#
# Rules (the site's, and the user's standing rule): a stance exists only where a
# trusted source states it — a roll-call vote in the Knesset (the strongest
# record: the faction's own votes, cited to the Knesset's OData record), the
# list's published platform, or a leader's statement in a major outlet. Where a
# list has no sourced position the key is absent and the page shows "no stated
# position" — never a default, never an inference from ideology.
#
# `value` is on the same scale as the reader's answers: 2 strongly agree,
# 1 agree, 0 neither, -1 disagree, -2 strongly disagree. Vote-based values:
# ±2 when the faction's net vote (for minus against, over those who voted) is
# at least 0.8 — nine in ten or more one way; ±1 for any other split of at
# least 0.2; 0 for an even split; absent = no stance. When fewer than half the
# faction voted, the value is capped at ±1 and the quote says so. A vote cast
# by a predecessor faction (Yesh Atid for Together, National Unity for Blue and
# White, Labor for the Democrats) is disclosed in `recordOf`. "statement"
# means the leader's or the list's own words as reported by a major outlet —
# or a top-five candidate's, disclosed in `recordOf` — and a reporter's
# characterisation is never a stance. `moreSources` cite what a `recordOf`
# note says beyond the quote (e.g. the list head's own words when a candidate
# is quoted); the pages list them after the main source.
# `lean` says which side of the aisle agrees with the statement; the set is
# balanced 8/8 and alternates, so an "agree" bias cannot tilt results (a test
# asserts it). Together has no faction of its own in the 25th Knesset — where
# a vote is cited for it, it is Yesh Atid's, and `recordOf` says so. A vote
# on an opposition bill counts against a coalition faction only where the
# coalition did not advance its own version of the measure; where it did
# (the 2024 climate bill), the record is mixed and the value is 0. Every
# quote and note is in six languages (tests/qa/content-languages.test.ts). Each
# statement also carries a `short` label (for the result summaries) and a
# plain-words `explainer` (what it is about, what each side argues — no
# verdict), both in six languages. What an explainer states as fact (a law, a
# ruling, a vote, official figures) cites `explainerSources`, shown under it.
#
# A statement enters only with sourced stances for at least 8 of the 15 lists
# (tests/qa/quiz.test.ts). Dropped on 20 Sep 2026 for that reason: direct
# state intervention in housing and prices (5 of 15 — most platforms name
# competition as the tool and say nothing about supervision or public
# building, which is not a stance). Removed on 20 Sep 2026 at the user's
# request: "the next government should be led by Netanyahu" — the compass is
# about what the lists want, not whom they crown. Research notes for the
# 20 Sep statements: scratchpad review/compass/*.yaml (one file per statement,
# with what was tried for every list left out). 22 Sep 2026: a gaps search
# added seven cells; a fresh-context review on 24 Sep removed Yashar's
# civil-partnership cell (its platform line is about immigrants' personal
# status, not same-sex couples) and set Amkha's Arab-parties cell to -1 (the
# quote is about Mansour Abbas, not Arab parties in general). Kept: Yashar on
# settlements and on religion and state; the Democrats on a Palestinian state;
# Ra'am on civil partnership; the Joint List on a climate law. Three more for
# Yashar rested only on a candidate's votes cast while in another party and
# were left out (scratchpad compass/gaps.yaml). 26 Sep 2026: the party
# documents of the lists with gaps were re-read — Likud's economic aim added
# from its constitution (the only statement of aims the party publishes); the
# Haredi Public's full platform chapters and the Reservists' platform yield no
# further cells (the Reservists' inquiry section wants an inquiry but takes no
# side on the state-commission format). 28 Sep 2026, weekly review (sources of
# 24–28 Sep, plus ynet's 22 Sep questionnaire on the courts): Yashar on Arab
# parties 0 → -1 (Eisenkot: today no Arab or haredi party meets his rules, which
# apply to every party); Amkha on Arab parties -1 → -2 (its no. 2 on coalition
# partnership); Blue and White on the Supreme Court -2 → 0 (its 2026 answer
# backs limiting the court, its 2023 vote went the other way: a mixed record);
# the Democrats' Arab-parties cell and Yashar's settlements cell now quote the
# leader's and the list's own newer words; six new cells — Religious Zionism on
# Arab parties; Amkha on a Palestinian state, settlements, the draft law and
# the Supreme Court; Blue and White on settlements (+1: its answer does not
# address sovereignty). 30 Sep 2026: the explainers' facts sourced, and what
# the sources contradicted fixed — two executions, not one (1948 and 1962); the
# death-penalty and draft-law votes as tallies, not "the opposition voted
# against" (Yisrael Beytenu voted for the first, United Torah Judaism for the
# second); the draft-law temporary order was struck down on 3 Sep 2026; Kan is
# funded from vehicle licence fees, and privatization bills date from 2021;
# Ra'am was the first Arab party formally in a coalition; the Law of Return
# also covers the spouses of children and grandchildren; OECD figures on tax
# and spending; IDI figures on Shabbat buses. 3 Oct 2026, weekly review
# (sources of 28 Sep – 3 Oct): two lists published platforms — the Haredi
# Public's economy chapter (econ-market +2: free economy, Ashdod Port
# privatization, less regulation) and Amkha's foundations document
# (econ-market +1: free market and fewer barriers, nothing on privatization or
# tax cuts); Amkha's draft-law cell now cites that platform instead of its
# list head's interview (still -1: universal service with Torah-learner
# quotas). Not added: Amkha on an inquiry commission (it wants an
# "independent" commission and does not say who appoints it).
lastReviewed: "2026-10-03"
questions:
  - id: palestinian-state
    topic: security
    lean: left
    text:
      he: "ישראל צריכה לתמוך בהקמת מדינה פלסטינית במסגרת הסכם שלום."
      en: "Israel should support the establishment of a Palestinian state as part of a peace agreement."
      ar: "يجب أن تدعم إسرائيل إقامة دولة فلسطينية في إطار اتفاق سلام."
      ru: "Израиль должен поддержать создание палестинского государства в рамках мирного соглашения."
      es: "Israel debería apoyar la creación de un Estado palestino como parte de un acuerdo de paz."
      fr: "Israël devrait soutenir la création d’un État palestinien dans le cadre d’un accord de paix."
    short:
      he: "מדינה פלסטינית"
      en: "A Palestinian state"
      ar: "دولة فلسطينية"
      ru: "Палестинское государство"
      es: "Un Estado palestino"
      fr: "Un État palestinien"
    explainer:
      he: "השאלה היא אם הפתרון לסכסוך הוא שתי מדינות — ישראל ומדינה פלסטינית זו לצד זו — או לא. התומכים אומרים שזו הדרך היחידה לשלום ולשמירה על רוב יהודי ודמוקרטי; המתנגדים אומרים שמדינה פלסטינית תהיה סכנה ביטחונית, במיוחד אחרי 7 באוקטובר, ושאין שותף."
      en: "The question is whether the solution to the conflict is two states — Israel and a Palestinian state side by side — or not. Supporters say it is the only path to peace and to keeping a Jewish and democratic majority; opponents say a Palestinian state would be a security danger, especially after 7 October, and that there is no partner."
      ar: "السؤال هو ما إذا كان حل الصراع هو دولتان — إسرائيل ودولة فلسطينية جنبًا إلى جنب — أم لا. يقول المؤيدون إنه الطريق الوحيد إلى السلام وإلى الحفاظ على أغلبية يهودية وديمقراطية؛ ويقول المعارضون إن دولة فلسطينية ستكون خطرًا أمنيًا، خصوصًا بعد 7 تشرين الأول/أكتوبر، وإنه لا يوجد شريك."
      ru: "Вопрос в том, является ли решением конфликта два государства — Израиль и палестинское государство рядом — или нет. Сторонники говорят, что это единственный путь к миру и к сохранению еврейского демократического большинства; противники — что палестинское государство станет угрозой безопасности, особенно после 7 октября, и что партнёра нет."
      es: "La cuestión es si la solución al conflicto son dos Estados — Israel y un Estado palestino uno junto al otro — o no. Los partidarios dicen que es el único camino hacia la paz y para mantener una mayoría judía y democrática; los opositores dicen que un Estado palestino sería un peligro para la seguridad, sobre todo después del 7 de octubre, y que no hay socio."
      fr: "La question est de savoir si la solution du conflit est deux États — Israël et un État palestinien côte à côte — ou non. Les partisans disent que c’est la seule voie vers la paix et vers le maintien d’une majorité juive et démocratique ; les opposants disent qu’un État palestinien serait un danger pour la sécurité, surtout après le 7 octobre, et qu’il n’y a pas de partenaire."
    stances:
      likud:
        value: -2
        basis: vote
        voteId: 41304
        source: { url: "https://knesset.gov.il/OdataV4/ParliamentInfo/KNS_PlenumVote(41304)", title: "\"הצהרות ופרסומים בעולם בנושא הכרה במדינה פלסטינית והצורך בהערכות ישראלית לאתגר מדיני אפשרי\" — הצבעה במליאה, 2024-07-18 — הצעה לסדר היום — סיכום הדיון", publisher: "הכנסת" }
        quote:
          he: "ההצבעה על הצהרת הכנסת \"הכנסת מתנגדת בתוקף להקמת מדינה פלסטינית ממערב לירדן\" (התקבלה 68–9); הצבעה בעד ההצהרה = התנגדות למשפט: 27 בעד, 0 נגד, 5 נעדרו"
          en: "the vote on the Knesset declaration \"firmly opposes the establishment of a Palestinian state west of the Jordan\" (passed 68–9); a vote for the declaration = disagreement with the statement: 27 for, 0 against, 5 absent"
          ar: "التصويت على إعلان الكنيست الذي «يعارض بشدة إقامة دولة فلسطينية غربي نهر الأردن» (أُقرّ 68–9)؛ التصويت مع الإعلان = عدم الموافقة على العبارة: مع: 27، ضد: 0، غائبون: 5"
          ru: "голосование по декларации Кнессета о том, что он «решительно выступает против создания палестинского государства к западу от Иордана» (принята 68–9); голос «за» декларацию = несогласие с утверждением: за: 27, против: 0, отсутствовали: 5"
          es: "la votación de la declaración de la Knéset que «se opone firmemente al establecimiento de un Estado palestino al oeste del Jordán» (aprobada 68–9); un voto a favor de la declaración = desacuerdo con la afirmación: 27 a favor, 0 en contra, 5 ausentes"
          fr: "le vote sur la déclaration de la Knesset qui « s’oppose fermement à l’établissement d’un État palestinien à l’ouest du Jourdain » (adoptée 68–9) ; un vote pour la déclaration = désaccord avec l’affirmation : 27 pour, 0 contre, 5 absents"
