    title:
      he: סגן שר התרבות והספורט (2023–2025)
      en: Deputy Minister of Culture and Sport (2023–2025)
    description:
      he: טסלר כיהן כסגן שר התרבות והספורט בממשלה ה-37 מ-3 בינואר 2023. ב-30 ביוני 2025 התפטר מהכנסת במסגרת "החוק הנורבגי" (במקומו נכנס אליהו ברוכי), וביולי 2025 התפטר מתפקיד סגן השר במסגרת פרישת יהדות התורה מהקואליציה על רקע המחלוקת בעניין חוק גיוס תלמידי הישיבות; לפי רישומי הכנסת, כהונתו כסגן שר הסתיימה ב-17 ביולי 2025 ובאותו יום שב לכהן כחבר הכנסת.
      en: Tessler served as Deputy Minister of Culture and Sport in Israel's 37th government from 3 January 2023. On 30 June 2025 he resigned from the Knesset under the "Norwegian Law" (Eliyahu Baruchi entered in his place), and in July 2025 he resigned as deputy minister as part of United Torah Judaism's withdrawal from the coalition over the dispute on the yeshiva-students draft law; according to Knesset records his deputy-minister term ended on 17 July 2025 and he returned to the Knesset the same day.
    date: "2023-01-03"
