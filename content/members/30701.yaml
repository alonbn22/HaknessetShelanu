  - kind: positive
    category: achievement
    title:
      he: חבר הכנסת מטעם הליכוד מאז 2019
      en: Member of Knesset for Likud since 2019
    description:
      he: אופיר כץ, יליד עפולה (19 במאי 1980), נבחר לכנסת ברשימת הליכוד בבחירות אפריל
        2019 ומכהן כחבר כנסת ברציפות מאז (הכנסת ה-21 ואילך). בעבר עבד במשרדו של
        בנימין נתניהו וכיועץ לשרים מטעם הליכוד.
      en: Ofir Katz, born in Afula on 19 May 1980, was elected to the Knesset on the
        Likud list in the April 2019 election and has served continuously since
        (21st Knesset onward). He previously worked in Benjamin Netanyahu's
        office and as an adviser to Likud ministers.
    date: 2019-04-30
    sources:
