          ru: "«Сионистское правительство: мы усвоили, что правительство, опирающееся на несионистские партии (харедимные или арабские), шантажом вынуждают принимать несионистские решения»."
          es: "«Un Gobierno sionista: aprendimos que un Gobierno que depende de partidos no sionistas (jaredíes o árabes) es extorsionado hacia decisiones no sionistas.»"
          fr: "« Un gouvernement sioniste : nous avons appris qu’un gouvernement qui dépend de partis non sionistes (haredim ou arabes) est contraint à des décisions non sionistes. »"
      together:
        value: -2
        basis: statement
        source: { url: "https://www.ynet.co.il/news/120andone/article/s100tqclqmg", title: "בנט: \"אני עם לפיד עד הסוף, לא אשב עם נתניהו\" — ריאיון (3.7.2026)", publisher: "ynet" }
        quote:
          he: "בנט, על כך שרע\"ם הייתה חלק מהקואליציה שלו: \"לא היה שום דבר שרציתי לעשות ולא עשיתי בגלל זה. אבל זה בוודאי לא המצב הנכון למדינת ישראל פוסט 7 באוקטובר.\""
          en: "Bennett, on Ra'am having been part of his coalition: \"There was nothing I wanted to do and did not do because of it. But it is certainly not the right situation for the State of Israel post-7 October.\""
          ar: "بينيت، عن كون القائمة الموحدة جزءًا من ائتلافه: «لم يكن هناك أي شيء أردت فعله ولم أفعله بسبب ذلك. لكن هذا بالتأكيد ليس الوضع الصحيح لدولة إسرائيل بعد 7 تشرين الأول/أكتوبر.»"
          ru: "Беннет о том, что РААМ входила в его коалицию: «Не было ничего, что я хотел сделать и не сделал из-за этого. Но это точно не правильная ситуация для Государства Израиль после 7 октября»."
          es: "Bennett, sobre el hecho de que Ra’am formara parte de su coalición: «No hubo nada que quisiera hacer y no hiciera por eso. Pero sin duda no es la situación adecuada para el Estado de Israel después del 7 de octubre.»"
          fr: "Bennett, sur le fait que Ra’am ait fait partie de sa coalition : « Il n’y a rien que je voulais faire et que je n’ai pas fait à cause de cela. Mais ce n’est certainement pas la bonne situation pour l’État d’Israël après le 7 octobre. »"
      blue-white:
        value: -1
        basis: statement
        source: { url: "https://www.mako.co.il/news-israel-elections/2026/liveblog-5bc9483b18b70a1026.htm", title: "כל העדכונים מסגירת הרשימות לכנסת ה-26 — תגובת כחול לבן (7.9.2026)", publisher: "N12" }
        quote:
          he: "\"כל מי שמצביע לישר מצביע לממשלת מיעוט שנשענת על המפלגות הערביות… רק הצבעה לכחול לבן תאפשר להקים ממשלה ציונית חוצה גושים.\""
          en: "\"Whoever votes Yashar votes for a minority government leaning on the Arab parties… only a vote for Blue and White will allow a Zionist government that crosses the blocs.\""
          ar: "«كل من يصوّت لياشار يصوّت لحكومة أقلية تستند إلى الأحزاب العربية… فقط التصويت لأزرق أبيض سيتيح إقامة حكومة صهيونية عابرة للكتل.»"
          ru: "«Кто голосует за „Яшар!“, голосует за правительство меньшинства, опирающееся на арабские партии… только голос за „Кахоль-лаван“ позволит создать сионистское правительство из партий обоих блоков»."
          es: "«Quien vota a ¡Yashar! vota por un Gobierno en minoría apoyado en los partidos árabes… solo el voto a Azul y Blanco permitirá formar un Gobierno sionista que cruce los bloques.»"
          fr: "« Quiconque vote Yashar! vote pour un gouvernement minoritaire s’appuyant sur les partis arabes… seul un vote pour Bleu et Blanc permettra un gouvernement sioniste qui dépasse les blocs. »"
      likud:
        value: -2
        basis: statement
        source: { url: "https://www.timesofisrael.com/netanyahus-party-says-it-will-petition-election-panel-to-ban-arab-majority-parties/", title: "Netanyahu's Likud says it will petition election panel to ban Arab-majority parties (14 Sep 2026)", publisher: "The Times of Israel" }
        quote:
          he: "הליכוד עתר לוועדת הבחירות לפסול את רע\"ם ואת הרשימה המשותפת: \"אין מקום בכנסת למי שפוגעים בחיילי צה\"ל ואינם מסוגלים לומר שחמאס וחיזבאללה הם ארגוני טרור.\""
          en: "Likud petitioned the Elections Committee to ban Ra'am and the Joint List: \"There is no room in the Knesset for those who harm IDF soldiers and are unable to say that Hamas and Hezbollah are terrorist organizations.\""
          ar: "قدّم الليكود طلبًا إلى لجنة الانتخابات لشطب القائمة الموحدة والقائمة المشتركة: «لا مكان في الكنيست لمن يمسّون بجنود الجيش الإسرائيلي ولا يستطيعون القول إن حماس وحزب الله منظمتان إرهابيتان.»"
          ru: "Ликуд обратился в Центризбирком с требованием отстранить РААМ и Объединённый список: «Нет места в Кнессете тем, кто вредит солдатам ЦАХАЛа и не может сказать, что ХАМАС и „Хизбалла“ — террористические организации»."
          es: "El Likud pidió a la Comisión Electoral que inhabilite a Ra’am y a la Lista Conjunta: «No hay lugar en la Knéset para quienes dañan a los soldados de las FDI y son incapaces de decir que Hamás y Hezbolá son organizaciones terroristas.»"
          fr: "Le Likoud a demandé à la Commission électorale d’interdire Ra’am et la Liste commune : « Il n’y a pas de place à la Knesset pour ceux qui nuisent aux soldats de Tsahal et sont incapables de dire que le Hamas et le Hezbollah sont des organisations terroristes. »"
      otzma:
        value: -2
        basis: statement
        source: { url: "https://www.timesofisrael.com/netanyahus-party-says-it-will-petition-election-panel-to-ban-arab-majority-parties/", title: "Netanyahu's Likud says it will petition election panel to ban Arab-majority parties (14 Sep 2026)", publisher: "The Times of Israel" }
        quote:
          he: "עוצמה יהודית עתרה קודם לכן לפסילת רע\"ם, בטענה שהמפלגה תומכת במאבק מזוין נגד ישראל."
          en: "Otzma Yehudit previously petitioned to disqualify Ra'am, alleging the party supported armed struggle against Israel."
          ar: "قدّمت عوتسما يهوديت قبل ذلك طلبًا لشطب القائمة الموحدة، بادعاء أن الحزب يدعم الكفاح المسلح ضد إسرائيل."
          ru: "«Оцма Иегудит» ранее потребовала отстранить РААМ, утверждая, что партия поддерживает вооружённую борьбу против Израиля."
          es: "Otzma Yehudit ya había pedido la inhabilitación de Ra’am, alegando que el partido apoyó la lucha armada contra Israel."
          fr: "Otzma Yehoudit avait déjà demandé l’invalidation de Ra’am, alléguant que le parti avait soutenu la lutte armée contre Israël."
      yashar:
        value: 0
        basis: statement
        source: { url: "https://www.timesofisrael.com/eisenkot-denies-claim-he-promised-bedouin-leaders-hed-bring-raam-into-government/", title: "Eisenkot denies claim he promised Bedouin leaders he'd bring Ra'am into government — Yashar statement (16 Sep 2026)", publisher: "The Times of Israel" }
        quote:
          he: "ישר!: שותפים לקואליציה יצטרכו לעמוד ב\"שלושת עקרונות היסוד המוכרים לציבור\" — \"הכרה בישראל כמדינה יהודית ודמוקרטית\", \"קבלת ערכי מגילת העצמאות\", \"שירות צבאי או אזרחי לכולם\" ו\"הכרה בחמאס כארגון טרור\" — בלי לומר אם מפלגות ערביות עומדות בהם"
          en: "Yashar: coalition partners must meet \"the three fundamental principles that are well known to the public\" — \"recognition of Israel as a Jewish and democratic state\", \"acceptance of the values of the Declaration of Independence\", \"universal military or civil national service\" and \"recognition of Hamas as a terrorist organization\" — without saying whether Arab parties qualify"
          ar: "ياشار!: على شركاء الائتلاف أن يستوفوا «المبادئ الأساسية الثلاثة المعروفة للجمهور» — «الاعتراف بإسرائيل دولة يهودية وديمقراطية»، «قبول قيم وثيقة الاستقلال»، «خدمة عسكرية أو مدنية للجميع» و«الاعتراف بحماس منظمة إرهابية» — دون أن تقول إن كانت الأحزاب العربية تستوفيها"
          ru: "«Яшар!»: партнёры по коалиции должны соответствовать «трём основным принципам, хорошо известным общественности» — «признание Израиля еврейским и демократическим государством», «принятие ценностей Декларации независимости», «всеобщая военная или гражданская служба» и «признание ХАМАС террористической организацией» — не уточняя, соответствуют ли им арабские партии"
          es: "¡Yashar!: los socios de coalición deben cumplir «los tres principios fundamentales bien conocidos por el público» — «el reconocimiento de Israel como Estado judío y democrático», «la aceptación de los valores de la Declaración de Independencia», «el servicio militar o civil para todos» y «el reconocimiento de Hamás como organización terrorista» — sin decir si los partidos árabes los cumplen"
          fr: "Yashar! : les partenaires de coalition doivent respecter « les trois principes fondamentaux bien connus du public » — « la reconnaissance d’Israël comme État juif et démocratique », « l’acceptation des valeurs de la Déclaration d’indépendance », « un service militaire ou civil pour tous » et « la reconnaissance du Hamas comme organisation terroriste » — sans dire si les partis arabes y satisfont"
      amkha:
        value: -1
        basis: statement
        source: { url: "https://www.israelhayom.co.il/israelnow/article/21282312", title: "עופר וינטר נגד מנסור עבאס: \"אסור שיוכל להיבחר לכנסת\" (26.8.2026)", publisher: "ישראל היום" }
        quote:
          he: "וינטר על מנסור עבאס: \"מי שלא מכיר במדינת ישראל כמדינה יהודית - יכול ללכת לאיזו מדינה ערבית שהוא רוצה\"; אדם כזה \"אסור שיוכל להיבחר לכנסת ישראל\" (הדברים נאמרו על מנסור עבאס; וינטר לא דיבר על מפלגות ערביות בכלל או על שותפות בקואליציה)"
          en: "Winter on Mansour Abbas: \"Whoever does not recognize the State of Israel as a Jewish state can go to whatever Arab country he wants\"; such a person \"must not be able to be elected to the Knesset of Israel\" (said about Mansour Abbas; Winter did not speak about Arab parties in general or about coalition partnership)"
          ar: "فينتر عن منصور عباس: «من لا يعترف بدولة إسرائيل دولةً يهودية يمكنه أن يذهب إلى أي دولة عربية يريدها»؛ ومثل هذا الشخص «يجب ألّا يكون بإمكانه أن يُنتخب لكنيست إسرائيل» (قيلت هذه الكلمات عن منصور عباس؛ ولم يتحدث فينتر عن الأحزاب العربية عمومًا ولا عن الشراكة في ائتلاف)"
          ru: "Винтер о Мансуре Аббасе: «Тот, кто не признаёт Государство Израиль еврейским государством, может отправляться в любую арабскую страну, какую пожелает»; такой человек «не должен иметь возможности быть избранным в Кнессет Израиля» (сказано о Мансуре Аббасе; об арабских партиях в целом и об участии в коалиции Винтер не говорил)"
          es: "Winter sobre Mansour Abbas: «Quien no reconozca al Estado de Israel como Estado judío puede irse al país árabe que quiera»; una persona así «no debe poder ser elegida para la Knéset de Israel» (dicho sobre Mansour Abbas; Winter no habló de los partidos árabes en general ni de su participación en una coalición)"
          fr: "Winter à propos de Mansour Abbas : « Celui qui ne reconnaît pas l’État d’Israël comme État juif peut aller dans le pays arabe de son choix » ; une telle personne « ne doit pas pouvoir être élue à la Knesset d’Israël » (propos tenus sur Mansour Abbas ; Winter n’a pas parlé des partis arabes en général ni d’une participation à une coalition)"

  - id: gaza-emigration
    topic: security
    lean: right
    text:
      he: "ישראל צריכה לעודד הגירה מרצון של תושבי רצועת עזה למדינות אחרות."
      en: "Israel should encourage voluntary emigration of Gaza's residents to other countries."
      ar: "على إسرائيل أن تشجّع الهجرة الطوعية لسكان قطاع غزة إلى دول أخرى."
      ru: "Израилю следует поощрять добровольную эмиграцию жителей сектора Газа в другие страны."
      es: "Israel debería fomentar la emigración voluntaria de los habitantes de la Franja de Gaza a otros países."
      fr: "Israël devrait encourager l’émigration volontaire des habitants de la bande de Gaza vers d’autres pays."
    short:
      he: "הגירה מרצון מעזה"
      en: "Voluntary emigration from Gaza"
      ar: "الهجرة الطوعية من غزة"
      ru: "Добровольная эмиграция из Газы"
      es: "Emigración voluntaria de Gaza"
      fr: "Émigration volontaire de Gaza"
    explainer:
      he: "מאז המלחמה עלתה תוכנית לעודד תושבי עזה לעבור למדינות אחרות, ובממשלה הוקם גוף לטיפול בכך. התומכים אומרים שזה פתרון הומניטרי לרצועה הרוסה ושמי שרוצה לעזוב צריך לקבל אפשרות; המתנגדים אומרים שאין 'מרצון' תחת מלחמה ומצור, שזה נוגד את המשפט הבינלאומי ושזה יבודד את ישראל בעולם."
      en: "Since the war, a plan to encourage Gaza's residents to move to other countries has been raised, and the government set up a body to handle it. Supporters say it is a humanitarian answer for a destroyed strip and that whoever wants to leave should be able to; opponents say there is no 'voluntary' under war and siege, that it violates international law and would isolate Israel in the world."
      ar: "منذ الحرب طُرحت خطة لتشجيع سكان غزة على الانتقال إلى دول أخرى، وأنشأت الحكومة هيئة لمعالجة ذلك. يقول المؤيدون إنه حل إنساني لقطاع مدمَّر وإن من يريد المغادرة يجب أن يُتاح له ذلك؛ ويقول المعارضون إنه لا «طوعية» في ظل الحرب والحصار، وإن ذلك يخالف القانون الدولي وسيعزل إسرائيل في العالم."
      ru: "После начала войны был выдвинут план поощрять жителей Газы переселяться в другие страны, и правительство создало орган для этого. Сторонники говорят, что это гуманитарный ответ для разрушенного сектора и что желающие уехать должны иметь такую возможность; противники — что в условиях войны и блокады нет ничего «добровольного», что это нарушает международное право и изолирует Израиль в мире."
      es: "Desde la guerra se ha planteado un plan para fomentar que los habitantes de Gaza se trasladen a otros países, y el Gobierno creó un organismo para gestionarlo. Los partidarios dicen que es una respuesta humanitaria para una franja destruida y que quien quiera irse debería poder hacerlo; los opositores dicen que no hay nada «voluntario» bajo guerra y asedio, que viola el derecho internacional y aislaría a Israel en el mundo."
      fr: "Depuis la guerre, un plan visant à encourager les habitants de Gaza à partir vers d’autres pays a été avancé, et le gouvernement a créé un organisme pour s’en occuper. Les partisans disent que c’est une réponse humanitaire pour une bande détruite et que quiconque veut partir devrait le pouvoir ; les opposants disent qu’il n’y a rien de « volontaire » sous la guerre et le siège, que cela viole le droit international et isolerait Israël dans le monde."
    stances:
      otzma:
        value: 2
        basis: platform
        source: { url: "https://ozma-yeudit.co.il/%d7%99%d7%95%d7%b4%d7%a8-%d7%a2%d7%95%d7%a6%d7%9e%d7%94-%d7%99%d7%94%d7%95%d7%93%d7%99%d7%aa-%d7%94%d7%a9%d7%a8-%d7%91%d7%9f-%d7%92%d7%91%d7%99%d7%a8-%d7%9e%d7%a6%d7%99%d7%92-%d7%90%d7%aa-%d7%aa%d7%95/", title: "בן גביר מציג את תוכנית הדגל של עוצמה יהודית לקראת הבחירות ״התנתקות 710״ (2026-09-04)", publisher: "עוצמה יהודית" }
        quote:
          he: "\"תוכנית מדיניות להגירה מרצון של תושבי רצועת עזה למדינות שיסכימו לקלוט אותם… בממשלה הבאה, הקמת משרד הגירה, עם שר בראשו, תקציבים וסמכויות, תהיה בראש הדרישות הקואליציוניות שלנו.\""
          en: "\"A policy plan for the voluntary emigration of Gaza Strip residents to countries that agree to absorb them… In the next government, establishing an Emigration Ministry, with a minister, budgets and powers, will top our coalition demands.\""
          ar: "«خطة سياسات للهجرة الطوعية لسكان قطاع غزة إلى دول توافق على استيعابهم… في الحكومة القادمة، سيكون إنشاء وزارة للهجرة، برئاسة وزير وبميزانيات وصلاحيات، على رأس مطالبنا الائتلافية.»"
          ru: "«План политики добровольной эмиграции жителей сектора Газа в страны, согласные их принять… В следующем правительстве создание министерства эмиграции — с министром, бюджетами и полномочиями — будет главным из наших коалиционных требований»."
          es: "«Un plan de política para la emigración voluntaria de los habitantes de la Franja de Gaza a países que acepten acogerlos… En el próximo Gobierno, crear un Ministerio de Emigración, con un ministro, presupuestos y competencias, encabezará nuestras exigencias de coalición.»"
          fr: "« Un plan d’action pour l’émigration volontaire des habitants de la bande de Gaza vers des pays qui acceptent de les accueillir… Dans le prochain gouvernement, la création d’un ministère de l’Émigration, avec un ministre, des budgets et des pouvoirs, sera en tête de nos exigences de coalition. »"
      rz-zehut:
        value: 2
        basis: statement
        source: { url: "https://www.timesofisrael.com/smotrich-and-ben-gvir-rally-behind-trumps-gaza-emigration-idea/", title: "Smotrich and Ben Gvir rally behind Trump's Gaza emigration idea — Bezalel Smotrich (2025-01-27)", publisher: "The Times of Israel" }
        quote:
          he: "\"אין ספק שבטווח הארוך עידוד הגירה הוא הפתרון היחיד שיביא שלום וביטחון לתושבי ישראל ויקל גם על סבלם של תושבי עזה הערבים.\""
          en: "\"There is no doubt that, in the long term, encouraging emigration is the only solution that will bring peace and security to the residents of Israel and also ease the suffering of the Arab residents of Gaza.\""
          ar: "«لا شك في أن تشجيع الهجرة هو، على المدى البعيد، الحل الوحيد الذي سيجلب السلام والأمن لسكان إسرائيل ويخفّف أيضًا من معاناة السكان العرب في غزة.»"
          ru: "«Нет сомнений, что в долгосрочной перспективе поощрение эмиграции — единственное решение, которое принесёт мир и безопасность жителям Израиля и облегчит страдания арабских жителей Газы»."
          es: "«No cabe duda de que, a largo plazo, fomentar la emigración es la única solución que traerá paz y seguridad a los habitantes de Israel y aliviará también el sufrimiento de los habitantes árabes de Gaza.»"
          fr: "« Il ne fait aucun doute qu’à long terme, encourager l’émigration est la seule solution qui apportera la paix et la sécurité aux habitants d’Israël et soulagera aussi la souffrance des habitants arabes de Gaza. »"
