      he: "חבר כנסת מאז 1999 ומנהיג מפלגת תע\"ל"
      en: "Member of Knesset since 1999 and leader of the Ta'al party"
    description:
      he: "אחמד טיבי, יליד 19 בדצמבר 1958 בטייבה, נבחר לראשונה לכנסת בבחירות 1999 ומכהן כחבר כנסת ברציפות מאז. הוא מייסד ומנהיג מפלגת תע\"ל (התנועה הערבית להתחדשות), שרצה במסגרת רשימות משותפות שונות לאורך השנים, ובהן הרשימה המשותפת וחד\"ש-תע\"ל."
      en: "Ahmad Tibi, born 19 December 1958 in Tayibe, was first elected to the Knesset in the 1999 elections and has served continuously since. He is the founder and leader of the Ta'al party (Arab Movement for Renewal), which has run within various joint lists over the years, including the Joint List and Hadash-Ta'al."
    date: "1999-05-17"
