  - kind: neutral
    category: news
    date: 2026-08-29
    title:
      he: הודיעה כי לא תתמודד בבחירות לכנסת ה-26
      en: Announced she will not run in the election to the 26th Knesset
    description:
      he: ב-29 באוגוסט 2026 הודיעה ניר ליו"ר ישראל ביתנו אביגדור ליברמן כי לא תתמודד בבחירות 27 באוקטובר 2026 וכי היא פונה לדרך חדשה; היא הודתה לליברמן, תיארה את הבחירות הקרובות כ"היסטוריות לעתיד מדינת ישראל" והבטיחה להמשיך לתמוך במפלגה. ישראל ביתנו הודתה לה על "ארבע שנים של עשייה ציבורית משמעותית".
      en: On 29 August 2026 Nir informed Yisrael Beiteinu chairman Avigdor Liberman that she would not run in the 27 October 2026 election and was turning to a new path; she thanked Liberman, described the coming election as "historic for the future of the State of Israel" and pledged to keep supporting the party. Yisrael Beiteinu thanked her for "four years of significant public service."
    sources:
