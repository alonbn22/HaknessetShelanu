    title:
      he: ההתבטאות "לשרוף את עזה" (2023) - ועדת האתיקה דחתה את הקובלנה
      en: The "burn Gaza" remark (2023) - Ethics Committee rejected the complaint
    description:
      he: בנובמבר 2023 פרסם ואטורי ברשת X קריאה "לשרוף את עזה", שעוררה ביקורת ציבורית וקובלנה לוועדת האתיקה מטעם ח"כ עופר כסיף. בריאיון רדיו בינואר 2024 הבהיר ואטורי כי התכוון "לשרוף את המחבלים שם" ולא לאזרחים. במאי 2025 דחתה ועדת האתיקה את הקובלנה וקבעה כי מדובר בהתבטאות פוליטית בעלת אופי אידאולוגי שאינה מהווה הפרה של כללי האתיקה, אף שציינה כי "הדברים אינם מוסיפים כבוד לכנסת כמוסד".
      en: In November 2023 Vaturi posted on X a call to "burn Gaza", drawing public criticism and an Ethics Committee complaint by MK Ofer Cassif. In a January 2024 radio interview Vaturi clarified he meant "burn the terrorists there", not civilians. In May 2025 the Ethics Committee rejected the complaint, ruling that the statement was political and ideological in nature and did not breach the ethics rules, while noting that "the statements do not add honor to the Knesset as an institution".
    sources:
