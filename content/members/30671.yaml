    title:
      he: חבר הכנסת מטעם יהדות התורה
      en: Member of the Knesset for United Torah Judaism
    description:
      he: יעקב טסלר נבחר לראשונה לכנסת באפריל 2019 ברשימת יהדות התורה (אגודת ישראל, נציג חסידות ויז'ניץ), ומכהן כחבר כנסת על פני מספר כהונות. קודם לכן כיהן כחבר מועצת העיר אשדוד מטעם אגודת ישראל וכעוזר לשר הבריאות יעקב ליצמן. בכנסת ה-25 הוא עומד בראש הוועדה המיוחדת לפניות הציבור.
      en: Ya'akov Tessler was first elected to the Knesset in April 2019 on the United Torah Judaism (Agudat Yisrael) list, representing the Vizhnitz Hasidic community, and has served across multiple Knesset terms. He previously served on the Ashdod city council for Agudat Yisrael and as an assistant to Health Minister Ya'akov Litzman. In the 25th Knesset he chairs the Special Committee for Public Petitions.
    date: "2019-04-30"
