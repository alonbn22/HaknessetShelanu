        source: { url: "https://www.themiluimnikim.org.il/platform/", title: "עיקרי המצע — המילואימניקים והכלכלית", publisher: "המילואימניקים" }
        quote:
          he: "\"נפעל כדי למנוע מדינה פלסטינית בצירים הדיפלומטיים והמדיניים, לצד יצירת מציאות של הכרעה בשטח.\""
          en: "\"We will act to prevent a Palestinian state on the diplomatic and political tracks, alongside creating a decisive reality on the ground.\""
