      he: חבר ועדת החוץ והביטחון ויושב ראש ועדות משנה וועדות משותפות
      en: Member of the Foreign Affairs and Defense Committee and chair of subcommittees and joint committees
    description:
      he: "לפי נתוני הכנסת, דנינו חבר בוועדת החוץ והביטחון ובוועדת הכלכלה מינואר 2023, ומכהן כיושב ראש ועדת המשנה לקידום עסקים קטנים ובינוניים (מ-23 בינואר 2023), כיו\"ר הוועדה המשותפת לפי חוק האזרחות והכניסה לישראל (מ-20 בפברואר 2023) וכיו\"ר הוועדה המשותפת לפי חוק שירות הקבע בצה\"ל (גמלאות) (מ-6 בינואר 2026); בין 2023 ל-2024 עמד בראש ועדת המשנה למוכנות ובט\"ש. ב-15 באוקטובר 2025 ניהל, כממלא מקום יו\"ר ועדת החוץ והביטחון, דיון בוועדה על הברחות אמל\"ח באמצעות רחפנים מגבול מצרים."
      en: "According to Knesset records, Danino has been a member of the Foreign Affairs and Defense Committee and the Economic Affairs Committee since January 2023, and chairs the Subcommittee for the Advancement of Small and Medium Businesses (since 23 January 2023), the joint committee under the Citizenship and Entry into Israel Law (since 20 February 2023) and the joint committee under the IDF Career Service (Pensions) Law (since 6 January 2026); from 2023 to 2024 he chaired the Subcommittee for Readiness and Routine Security. On 15 October 2025 he presided, as acting chair of the Foreign Affairs and Defense Committee, over a committee session on weapons smuggling by drone from the Egyptian border."
