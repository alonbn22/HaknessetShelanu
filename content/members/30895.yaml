      he: "לא נכללה בין 15 נציגי יש עתיד ברשימת \"ביחד\" לכנסת ה-26"
      en: "Not among the 15 Yesh Atid candidates named on the \"Beyachad\" list for the 26th Knesset"
    description:
      he: "ברשימת 15 נציגי יש עתיד שהציג יאיר לפיד ב-5 בספטמבר 2026 לקראת הריצה המשותפת עם נפתלי בנט ברשימת \"ביחד\", לא נכלל שמה של עזוז. ברשימת \"ביחד\" שהוגשה לוועדת הבחירות המרכזית, 20 המקומות הראשונים אינם כוללים אותה."
      en: "Azuz's name was not among the 15 Yesh Atid representatives presented by Yair Lapid on 5 September 2026 for the joint run with Naftali Bennett on the \"Beyachad\" list. The top 20 places of the \"Beyachad\" list submitted to the Central Elections Committee do not include her."
