    title:
      he: התפטר מהכנסת ופרש מיש עתיד (אוגוסט 2026)
      en: Resigned from the Knesset and left Yesh Atid (August 2026)
    description:
      he: "ב-6 באוגוסט 2026 הודיע סגלוביץ' ליאיר לפיד על פרישתו מיש עתיד ועל התפטרותו מהכנסת, שבה כיהן מטעם המפלגה מאז 2019, והסביר כי אין זה ראוי בעיניו להמשיך להחזיק במנדט של יש עתיד בעת שהוא בוחן דרך פוליטית חדשה. לפי נתוני הכנסת, כהונתו הסתיימה ב-11 באוגוסט 2026, ובמקומו נכנסה לכנסת מיכל סלבני כבביה מיש עתיד. לפיד הודה לו על שירותו ואמר כי פעל \"ביושרה ובמקצועיות למען אזרחי ישראל ושלטון החוק\"."
      en: "On 6 August 2026 Segalovich informed Yair Lapid that he was leaving Yesh Atid and resigning from the Knesset, where he had served for the party since 2019, explaining that he did not consider it appropriate to keep holding a Yesh Atid mandate while exploring a new political path. According to Knesset records his term ended on 11 August 2026, and Michal Salvani Kababia of Yesh Atid entered the Knesset in his place. Lapid thanked him for his service, saying he had acted \"with integrity and professionalism for Israel's citizens and the rule of law.\""
