      - date: "2026-09-03"
        text:
          he: "הליכוד ועוצמה יהודית סיכמו כי ח\"כ טלי גוטליב תתמודד ברשימת עוצמה יהודית (במקום השני); על פי ההסכם היא כפופה למשמעת סיעת הליכוד עד הבחירות ואינה מוגדרת פורשת."
          en: "Likud and Otzma Yehudit agreed that MK Tally Gotliv will run on the Otzma Yehudit list (second place); under the agreement she remains bound by Likud faction discipline until the election and is not declared a departing MK."
          ar: "اتفق الليكود وعوتسما يهوديت على أن تترشح عضوة الكنيست طالي غوتليف في قائمة عوتسما يهوديت (في الموقع الثاني)؛ وبموجب الاتفاق تبقى ملزمة بانضباط كتلة الليكود حتى الانتخابات ولا تُعلَن عضوة منشقة."
          ru: "Ликуд и «Оцма Иегудит» договорились, что депутат Тали Готлив пойдёт в списке «Оцма Иегудит» (на втором месте); по соглашению она до выборов подчиняется дисциплине фракции Ликуда и не объявляется вышедшей из неё."
          es: "El Likud y Otzma Yehudit acordaron que la diputada Tally Gotliv se presente en la lista de Otzma Yehudit (segundo puesto); según el acuerdo, sigue sujeta a la disciplina de la facción del Likud hasta las elecciones, sin que se la considere una diputada que abandona su facción (a efectos de la ley)."
          fr: "Le Likoud et Otzma Yehoudit ont convenu que la députée Tally Gotliv se présente sur la liste d’Otzma Yehoudit (deuxième place) ; selon l’accord, elle reste soumise à la discipline de la faction du Likoud jusqu’aux élections, sans être considérée comme ayant quitté sa faction (« députée dissidente » au sens de la loi)."
        sources:
