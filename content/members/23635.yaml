    title:
      he: "הוצבה במקום השני ברשימת כחול לבן לכנסת ה-26"
      en: "Placed second on the Blue and White list for the 26th Knesset"
    description:
      he: "ברשימת כחול לבן שהגיש בני גנץ לבחירות 2026 הוצבה תמנו-שטה במקום השני, אחרי גנץ ולפני ראשת עיריית בית שמש לשעבר עליזה בלוך. על פי הדיווחים, המפלגה אינה עוברת את אחוז החסימה בסקרים שפורסמו לקראת הבחירות."
      en: "On the Blue and White list submitted by Benny Gantz for the 2026 election, Tamano-Shata was placed second, after Gantz and ahead of former Beit Shemesh mayor Aliza Bloch. According to reports, the party was not clearing the electoral threshold in polls published ahead of the election."
