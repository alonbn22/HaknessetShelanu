  - id: 1104 # Yisrael Beiteinu
    verified: "2026-09-19"
    updates:
      - date: "2026-08-05"
        text:
          he: "ח\"כ דן אילוז, שפרש מהליכוד ביולי 2026, הודיע על הצטרפותו לישראל ביתנו והובטח לו מקום ריאלי ברשימה."
          en: "MK Dan Illouz, who left Likud in July 2026, announced he was joining Yisrael Beiteinu and was promised a realistic slot on its list."
          ar: "أعلن عضو الكنيست دان إيلوز، الذي انسحب من الليكود في تموز/يوليو 2026، انضمامه إلى إسرائيل بيتنا، ووُعد بموقع واقعي (قابل للفوز) في القائمة."
          ru: "Депутат Дан Иллуз, покинувший Ликуд в июле 2026 года, объявил о присоединении к партии «Наш дом Израиль»; ему обещали проходное место в списке."
          es: "El diputado Dan Illouz, que dejó el Likud en julio de 2026, anunció que se unía a Yisrael Beiteinu y que se le había prometido un puesto con opciones reales de entrar en su lista."
          fr: "Le député Dan Illouz, qui a quitté le Likoud en juillet 2026, a annoncé qu’il rejoignait Israël Beiteinou et qu’une place éligible sur sa liste lui avait été promise."
        sources:
          - { url: "https://www.timesofisrael.com/rebel-likud-mk-dan-illouz-joins-yisrael-beytenu-touts-its-national-and-liberal-values/", title: "Rebel Likud MK Dan Illouz joins Yisrael Beytenu, touts its ‘national and liberal values’ (2026-08-05)", publisher: "The Times of Israel" }
          - { url: "https://www.ynet.co.il/news/article/rk6i1lblml", title: "דן אילוז מצטרף לליברמן: \"מייצג את הערכים שאני מאמין בהם\" (2026-08-05)", publisher: "ynet" }
      - date: "2026-08-11"
        text:
          he: "אילוז הגיש את התפטרותו מהכנסת והחזיר את המנדט לליכוד (במקומו נכנס ב-13 באוגוסט שבתאי קטש); סיעת ישראל ביתנו נותרה בת 6 חברים."
          en: "Illouz submitted his resignation from the Knesset, returning the seat to Likud (Shabtai Katash entered on 13 August); the Yisrael Beiteinu faction remains at 6 members."
          ar: "قدّم إيلوز استقالته من الكنيست وأعاد المقعد إلى الليكود (دخل شبتاي كتاش مكانه في 13 آب/أغسطس)؛ وبقيت كتلة إسرائيل بيتنا بـ6 أعضاء."
          ru: "Иллуз сложил депутатский мандат, вернув место Ликуду (13 августа его место занял Шабтай Каташ); во фракции «Наш дом Израиль» по-прежнему 6 депутатов."
          es: "Illouz presentó su renuncia a la Knéset, devolviendo el escaño al Likud (Shabtai Katash entró el 13 de agosto); la facción de Yisrael Beiteinu sigue con 6 miembros."
          fr: "Illouz a remis sa démission de la Knesset, rendant le siège au Likoud (Shabtai Katash est entré le 13 août) ; la faction d’Israël Beiteinou reste à 6 membres."
        sources:
          - { url: "https://www.inn.co.il/news/703704", title: "ראיון עם דן אילוז לאחר פרישתו מהליכוד (2026-08-11)", publisher: "ערוץ 7" }
          - { url: "https://main.knesset.gov.il/mk/apps/faction/faction-lobby?KnessetID=25&FactionID=1096", title: "סיעת הליכוד — חילופי גברי: 13/08/2026 שבתאי קטש נכנס במקום דן אילוז (2026-09-19)", publisher: "הכנסת" }
      - date: "2026-09-06"
        text:
          he: "המפלגה הציגה את רשימתה לכנסת ה-26 (25 מועמדים): ליברמן, רפי בן שטרית (ראש עיריית בית שאן לשעבר, לשעבר בליכוד) במקום השני, טליה לנקרי, עודד פורר, יוליה מלינובסקי, שרון שרעבי, חמד עמאר, יבגני סובה, אלוירה קוליחמן, ודן אילוז במקום העשירי; ח\"כ שרון ניר אינה ברשימה. הרשימה הוגשה לוועדת הבחירות כרשימה מס' 11 (אות מבוקשת ל)."
          en: "The party unveiled its 26th-Knesset list (25 candidates): Liberman, Rafi Ben Shitrit (former Beit She’an mayor, ex-Likud) second, Talia Lankri, Oded Forer, Yulia Malinovsky, Sharon Sharabi, Hamad Amar, Evgeny Sova, Elvira Kulikhman, and Dan Illouz tenth; MK Sharon Nir is not on the list. It was submitted to the CEC as list no. 11 (requested letter ל)."
          ar: "قدّم الحزب قائمته للكنيست الـ26 (25 مرشحًا): ليبرمان، ورافي بن شطريت (رئيس بلدية بيت شآن السابق، وسابقًا في الليكود) في الموقع الثاني، وتاليا لنكري، وعوديد فورير، ويوليا مالينوفسكي، وشارون شرعبي، وحمد عمار، ويفغيني سوفا، وإلفيرا كوليخمان، ودان إيلوز في الموقع العاشر؛ وعضوة الكنيست شارون نير ليست في القائمة. وقُدّمت القائمة إلى لجنة الانتخابات بوصفها القائمة رقم 11 (الحرف المطلوب ל)."
          ru: "Партия представила список в Кнессет 26-го созыва (25 кандидатов): Либерман, Рафи Бен-Шитрит (бывший мэр Бейт-Шеана, ранее в Ликуде) — второй, Талия Ланкри, Одед Форер, Юлия Малиновская, Шарон Шараби, Хамад Амар, Евгений Сова, Эльвира Кулихман и Дан Иллуз — десятый; депутата Шарон Нир в списке нет. Список подан в ЦИК под номером 11 (запрошенная буква ל)."
          es: "El partido presentó su lista para la 26.ª Knéset (25 candidatos): Liberman, Rafi Ben Shitrit (exalcalde de Beit She’an, ex-Likud) segundo, Talia Lankri, Oded Forer, Yulia Malinovsky, Sharon Sharabi, Hamad Amar, Evgeny Sova, Elvira Kulikhman, y Dan Illouz décimo; la diputada Sharon Nir no está en la lista. Se presentó ante la Comisión Electoral como lista n.º 11 (letra solicitada ל)."
          fr: "Le parti a dévoilé sa liste pour la 26e Knesset (25 candidats) : Liberman, Rafi Ben Shitrit (ancien maire de Beit She’an, ex-Likoud) deuxième, Talia Lankri, Oded Forer, Yulia Malinovsky, Sharon Sharabi, Hamad Amar, Evgeny Sova, Elvira Kulikhman, et Dan Illouz dixième ; la députée Sharon Nir n’y figure pas. Elle a été déposée auprès de la Commission électorale comme liste n° 11 (lettre demandée ל)."
        sources:
          - { url: "https://www.timesofisrael.com/bennett-liberman-unveil-byachad-yisrael-beytenu-knesset-slates-for-upcoming-election/", title: "Anti-Netanyahu leaders Bennett and Liberman unveil their parties’ Knesset election slates (2026-09-06)", publisher: "The Times of Israel" }
          - { url: "https://www.israelhayom.co.il/news/politics/article/21366291", title: "הפתעה במקום השני: נחשפה רשימת ישראל ביתנו; ליברמן עקץ את איזנקוט (2026-09-06)", publisher: "ישראל היום" }
          - { url: "https://beytenu.org.il/%D7%A8%D7%A9%D7%99%D7%9E%D7%AA-%D7%9E%D7%A4%D7%9C%D7%92%D7%AA-%D7%99%D7%A9%D7%A8%D7%90%D7%9C-%D7%91%D7%99%D7%AA%D7%A0%D7%95-%D7%9C%D7%9B%D7%A0%D7%A1%D7%AA-%D7%94%D7%91%D7%90%D7%94/", title: "רשימת מפלגת ישראל ביתנו לכנסת הבאה (2026-09-06)", publisher: "ישראל ביתנו (אתר המפלגה)" }
          - { url: "https://www.gov.il/he/pages/israel-beitenu_list11", title: "רשימה 11 — ישראל ביתנו בראשות אביגדור ליברמן (2026-09-07)", publisher: "ועדת הבחירות המרכזית לכנסת (gov.il)" }
      - date: "2026-09-10"
        text:
          he: "ישראל ביתנו חתמה על הסכם עודפים עם רשימת \"ביחד\" בראשות נפתלי בנט (באותו יום נחתם הסכם דומה בין ישר! לדמוקרטים)."
          en: "Yisrael Beiteinu signed a surplus-vote agreement with Naftali Bennett’s “Together” list (the same day Yashar and The Democrats signed a parallel agreement)."
          ar: "وقّع إسرائيل بيتنا اتفاقية فائض أصوات مع قائمة «معًا» برئاسة نفتالي بينيت (وفي اليوم نفسه وُقّعت اتفاقية مماثلة بين ياشار! والديمقراطيين)."
          ru: "«Наш дом Израиль» подписал соглашение об излишках голосов со списком Нафтали Беннета «Вместе» (в тот же день аналогичное соглашение подписали «Яшар!» и «Демократы»)."
          es: "Yisrael Beiteinu firmó un acuerdo de votos sobrantes con la lista «Juntos» de Naftali Bennett (el mismo día en que ¡Yashar! y Los Demócratas firmaron un acuerdo paralelo)."
          fr: "Israël Beiteinou a signé un accord de report des voix restantes avec la liste « Ensemble » de Naftali Bennett (le jour même où Yashar! et les Démocrates signaient un accord parallèle)."
        sources:
          - { url: "https://www.jpost.com/israel-election-2026/article-908296", title: "Bennett-Liberman, Eisenkot-Golan: Opposition parties sign surplus vote-sharing agreement (2026-09-10)", publisher: "The Jerusalem Post" }
