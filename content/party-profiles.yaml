      - date: "2026-08-12"
        text:
          he: "אלמוג כהן, שנבחר לכנסת ב-2022 מטעם עוצמה יהודית ומכהן כסגן שר במשרד ראש הממשלה, הצטרף לליכוד והתמודד בפריימריז לאחר שנתניהו ויתר על דרישת הוותק; שובץ במקום ה-13 ברשימת הליכוד."
          en: "Almog Cohen, elected in 2022 on the Otzma Yehudit list and serving as a deputy minister in the Prime Minister’s Office, joined Likud and ran in its primary after Netanyahu waived the tenure requirement; he was placed 13th on the Likud list."
          ar: "انضم ألموغ كوهين، الذي انتُخب للكنيست عام 2022 عن عوتسما يهوديت ويشغل منصب نائب وزير في مكتب رئيس الحكومة، إلى الليكود وخاض انتخاباته التمهيدية بعدما تنازل نتنياهو عن شرط الأقدمية؛ ووُضع في الموقع الـ13 في قائمة الليكود."
          ru: "Альмог Коэн, избранный в Кнессет в 2022 году от «Оцма Иегудит» и занимающий пост заместителя министра в канцелярии премьер-министра, вступил в Ликуд и участвовал в праймериз после того, как Нетаньяху отменил для него требование о партийном стаже; он получил 13-е место в списке Ликуда."
          es: "Almog Cohen, elegido en 2022 en la lista de Otzma Yehudit y viceministro en la Oficina del Primer Ministro, se afilió al Likud y se presentó a sus primarias después de que Netanyahu le dispensara el requisito de antigüedad; quedó en el puesto 13 de la lista del Likud."
          fr: "Almog Cohen, élu en 2022 sur la liste d’Otzma Yehoudit et vice-ministre au bureau du Premier ministre, a rejoint le Likoud et s’est présenté à sa primaire après que Netanyahou l’a dispensé de la condition d’ancienneté ; il a été placé 13e sur la liste du Likoud."
