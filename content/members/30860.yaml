    date: "2026-09-04"
    title:
      he: "מתמודדת בבחירות 2026 ברשימת עוצמה יהודית במקום השני, בהסכמת הליכוד"
      en: "Running in the 2026 election second on the Otzma Yehudit list, with Likud's consent"
    description:
      he: "בפריימריז של הליכוד ב-17 באוגוסט 2026 הגיעה גוטליב למקום ה-12 בהצבעה, נמוך מהציפיות, ומיקומה ברשימה נדחק בעקבות השריונים. ב-3 בספטמבר 2026 הודיעו הליכוד ויו\"ר עוצמה יהודית איתמר בן גביר על הסכם שלפיו תתמודד גוטליב ברשימת עוצמה יהודית מבלי להיחשב פורשת, תוך התחייבות למשמעת סיעתית של הליכוד עד תום כהונת הכנסת ה-25; ב-4 בספטמבר הודיע בן גביר כי תשובץ במקום השני. גוטליב אמרה כי המהלך נועד לשמור על גוש הימין."
      en: "In the Likud primaries of 17 August 2026 Gotliv came 12th in the vote, below expectations, and her list placement was pushed down by the reserved spots. On 3 September 2026 Likud and Otzma Yehudit chairman Itamar Ben Gvir announced an agreement under which Gotliv would run on the Otzma Yehudit list without being deemed a defector, while committing to Likud's faction discipline until the end of the 25th Knesset; on 4 September Ben Gvir announced she would be placed second. Gotliv said the move was meant to preserve the right-wing bloc."
