  - kind: positive
    category: achievement
    title:
      he: חברת כנסת מטעם יש עתיד מאז 2013
      en: Member of Knesset for Yesh Atid since 2013
    description:
      he: אלהרר נבחרה לראשונה לכנסת בשנת 2013 ברשימת יש עתיד ושבה ונבחרה במערכות
        בחירות שלאחר מכן. בכנסת כיהנה בתפקידי מפתח, ובהם יושבת ראש ועדת הכנסת,
        והיא מזוהה עם קידום זכויות אנשים עם מוגבלות. לפני כניסתה לפוליטיקה ניהלה
        את הקליניקה המשפטית באוניברסיטת בר-אילן.
      en: Elharrar was first elected to the Knesset in 2013 on the Yesh Atid list and
        has been re-elected in subsequent elections. In the Knesset she has held
        senior roles, including chairing the Knesset Arrangements Committee, and
        is associated with advancing the rights of people with disabilities.
        Before entering politics she headed the legal clinic at Bar-Ilan
        University.
    date: 2013-01-22
