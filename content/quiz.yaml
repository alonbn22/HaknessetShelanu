      es: "Debería aplicarse la pena de muerte a los terroristas."
      fr: "Les terroristes devraient encourir la peine de mort."
    short:
      he: "עונש מוות למחבלים"
      en: "Death penalty for terrorists"
      ar: "عقوبة الإعدام للمخرّبين"
      ru: "Смертная казнь для террористов"
      es: "Pena de muerte para terroristas"
      fr: "Peine de mort pour les terroristes"
    explainer:
      he: "עד 2026 עונש מוות היה אפשרי בישראל רק בעבירות נדירות, והוצא לפועל פעם אחת (אייכמן, 1962). במרץ 2026 אישרה הכנסת בקריאה שלישית חוק הקובע עונש מוות למחבלים שרצחו בפיגוע; האופוזיציה הצביעה נגד. התומכים אומרים שהעונש ירתיע וימנע עסקאות שחרור; המתנגדים אומרים שהוא לא מרתיע, פוגע במעמדה של ישראל, ושטעות אי אפשר לתקן."
      en: "Until 2026 the death penalty was possible in Israel only for rare offences, and it was carried out once (Eichmann, 1962). In March 2026 the Knesset passed, in its third reading, a law setting the death penalty for terrorists who murdered in an attack; the opposition voted against. Supporters say it will deter and prevent release deals; opponents say it does not deter, damages Israel's standing, and a mistake cannot be corrected."
      ar: "حتى 2026 كانت عقوبة الإعدام ممكنة في إسرائيل في جرائم نادرة فقط، ونُفّذت مرة واحدة (آيخمان، 1962). في آذار/مارس 2026 أقرّ الكنيست بالقراءة الثالثة قانونًا يفرض الإعدام على المخرّبين الذين قتلوا في عملية؛ وصوّتت المعارضة ضده. يقول المؤيدون إن العقوبة ستردع وتمنع صفقات الإفراج؛ ويقول المعارضون إنها لا تردع، وتضرّ بمكانة إسرائيل، وإن الخطأ لا يمكن تصحيحه."
      ru: "До 2026 года смертная казнь в Израиле была возможна лишь за редкие преступления и приводилась в исполнение один раз (Эйхман, 1962). В марте 2026 года Кнессет принял в третьем чтении закон о смертной казни для террористов, совершивших убийство в теракте; оппозиция голосовала против. Сторонники говорят, что наказание будет сдерживать и предотвратит сделки об освобождении; противники — что оно не сдерживает, вредит положению Израиля и что ошибку нельзя исправить."
      es: "Hasta 2026 la pena de muerte era posible en Israel solo para delitos raros, y se aplicó una vez (Eichmann, 1962). En marzo de 2026 la Knéset aprobó en tercera lectura una ley que fija la pena de muerte para terroristas que asesinaron en un atentado; la oposición votó en contra. Los partidarios dicen que disuadirá y evitará acuerdos de liberación; los opositores dicen que no disuade, daña la posición de Israel y un error no puede corregirse."
      fr: "Jusqu’en 2026, la peine de mort n’était possible en Israël que pour de rares infractions, et elle a été appliquée une fois (Eichmann, 1962). En mars 2026, la Knesset a adopté en troisième lecture une loi instaurant la peine de mort pour les terroristes ayant tué lors d’un attentat ; l’opposition a voté contre. Les partisans disent qu’elle dissuadera et empêchera les accords de libération ; les opposants disent qu’elle ne dissuade pas, nuit à la position d’Israël et qu’une erreur ne peut être corrigée."
