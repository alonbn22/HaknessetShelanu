      en: "Minister of Diaspora Affairs and Combating Antisemitism; not a sitting MK under the Norwegian Law"
    description:
      he: "שיקלי התפטר מהכנסת ב-17 בינואר 2023 מכוח החוק הנורווגי וממשיך לכהן כשר התפוצות והמאבק באנטישמיות, גם בממשלת המעבר. בינואר 2024 סיים את כהונתו הנוספת כשר לשוויון חברתי, במסגרת צמצום הוצאות הממשלה בזמן המלחמה."
      en: "Chikli resigned his Knesset seat on 17 January 2023 under the Norwegian Law and continues to serve as Minister of Diaspora Affairs and Combating Antisemitism, including in the caretaker government. In January 2024 he ended his additional post as Minister for Social Equality as part of cuts to government spending during the war."
