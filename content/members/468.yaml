      en: Ordered the removal of Omri Ronen from reserve service over a call for refusal
    description:
      he: 'ב-19 ביולי 2026 הודיע כץ כי הנחה את הרמטכ"ל להדיח את סרן (מיל.) עמרי רונן, פעיל "אחים לנשק" ומועמד בפריימריז של המפלגה הדמוקרטית, מכל מסגרת שירות בצה"ל, בטענה שקרא לסרבנות מטעמים פוליטיים. רונן הגיב כי "השר שמקדם את חוק ההשתמטות חושש שנבוא להחליף אותו".'
      en: 'On 19 July 2026 Katz announced he had instructed the IDF Chief of Staff to remove reserve Captain Omri Ronen, a "Brothers in Arms" activist and candidate in the Democrats party primary, from all IDF service frameworks, claiming he had called for refusal for political reasons. Ronen responded that "the minister promoting the draft-evasion law fears we will come to replace him".'
