  - kind: negative
    category: controversy
    status: ongoing
    date: "2026-07-20"
    title:
      he: "בג\"ץ הגביל את מעורבותו בפעילות המבצעית של המשטרה; היועצת המשפטית לממשלה דיווחה כי ההסדר לא קוים"
      en: "The High Court limited his involvement in operational policing; the Attorney General reported that the arrangement was not honored"
    description:
      he: "ב-16 באפריל 2026 דחה בג\"ץ עתירות להורות על פיטוריו, אך הפך למחייב מסמך עקרונות המבחין בין קביעת מדיניות (מותרת) לבין מעורבות בפעילות מבצעית (אסורה): מינויים בכירים במשטרה מחייבים המלצת המפכ\"ל והודעה מראש ליועצת המשפטית לממשלה, והשר נדרש להימנע מהתבטאויות על שימוש בכוח נגד אזרחים ומכל מעורבות בשיטור הפגנות ובחקירות ספציפיות. ב-20 ביולי 2026 עדכנה היועצת המשפטית לממשלה את בית המשפט כי בן גביר סירב לאשר את הנוסח הסופי של המסמך וכי המאמצים למנוע פגיעה בעצמאות המשטרה נכשלו. בן גביר כינה את הניסיון להדיחו אבסורדי, הצהיר כי ימשיך למנות לפי מי שמיישם את המדיניות, וכתב כי היועצת תמשיך לנסות להפיל את ממשלת הימין."
      en: "On 16 April 2026 the High Court of Justice declined to order his dismissal but made binding a principles document distinguishing policy-setting (permitted) from involvement in operational policing (prohibited): senior police appointments require the commissioner's recommendation and advance notice to the Attorney General, and the minister must refrain from statements on police use of force against civilians and from any involvement in protest policing or specific investigations. On 20 July 2026 the Attorney General updated the court that Ben-Gvir had refused to approve the final version of the document and that efforts to prevent harm to police independence had failed. Ben-Gvir called the attempt to remove him \"absurd\", said he would continue to make appointments \"according to who implements the policy\", and wrote that the Attorney General would \"keep trying to bring down the right-wing government\"."
