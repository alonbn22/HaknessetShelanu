    title:
      he: "סופרת; ספרה נכלל ברשימה הקצרה של פרס ספיר"
      en: "Novelist; her book was shortlisted for the Sapir Prize"
    description:
      he: "לפני כניסתה לפוליטיקה הייתה גלית דיסטל אטבריאן סופרת ופובליציסטית. ספרה הראשון, \"ואם היו אומרים לך\" (2009), זכה לתמיכת מועצת הפיס לתרבות ולאמנות, וספרה השני, \"טווס בחדר מדרגות\" (2014), נכלל ברשימה הקצרה של המועמדים לפרס ספיר לספרות."
      en: "Before entering politics, Galit Distel Atbaryan was a novelist and columnist. Her first novel, \"And If They Told You\" (2009), was supported by the Pais Council for Culture and the Arts, and her second, \"Peacock in the Stairwell\" (2014), was shortlisted for the Sapir Prize for literature."
    date: "2014"
