      he: כניסה לכנסת ה-25 כחבר כנסת מטעם יש עתיד
      en: Entered the 25th Knesset as a Yesh Atid MK
      ar: دخول الكنيست الخامسة والعشرين نائباً عن حزب يوجد مستقبل
      ru: Вступление в Кнессет 25-го созыва от партии «Еш Атид»
    description:
      he: עוז חיים נכנס לכנסת ה-25 ב-7 ביוני 2026 מטעם סיעת יש עתיד, במקומו של ח"כ בועז טופורובסקי שהתפטר מהכנסת. מינויו הוכרז בסוף מאי 2026.
      en: Oz Haim entered the 25th Knesset on 7 June 2026 for the Yesh Atid faction, replacing MK Boaz Toporovsky, who resigned from the Knesset. His appointment was announced in late May 2026.
      ar: دخل عوز حاييم الكنيست الخامسة والعشرين في 7 يونيو 2026 عن كتلة يوجد مستقبل، خلفاً لعضو الكنيست بوعز توبوروفسكي الذي استقال من الكنيست. وأُعلن عن تعيينه في أواخر مايو 2026.
      ru: Оз Хаим вошёл в Кнессет 25-го созыва 7 июня 2026 года от фракции «Еш Атид», заменив депутата Боаза Топоровского, ушедшего в отставку. О его назначении было объявлено в конце мая 2026 года.
