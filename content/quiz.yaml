  - id: oct7-commission
    topic: institutions
    lean: left
    text:
      he: "החקירה של 7 באוקטובר צריכה להיות ועדת חקירה ממלכתית (שאת חבריה ממנה נשיא בית המשפט העליון), ולא ועדה שהממשלה או הכנסת ממנות."
      en: "The inquiry into 7 October should be a state commission of inquiry (whose members the Chief Justice appoints), not a commission the government or the Knesset appoints."
      ar: "يجب أن يكون التحقيق في 7 أكتوبر لجنة تحقيق رسمية (يعيّن أعضاءها رئيس المحكمة العليا)، لا لجنة تعيّنها الحكومة أو الكنيست."
      ru: "Расследование 7 октября должна вести государственная следственная комиссия (членов которой назначает председатель Верховного суда), а не комиссия, назначаемая правительством или Кнессетом."
      es: "La investigación del 7 de octubre debería encargarse a una comisión estatal (cuyos miembros nombra el presidente del Tribunal Supremo), no a una comisión nombrada por el Gobierno o la Knéset."
      fr: "L’enquête sur le 7 octobre devrait être confiée à une commission d’enquête d’État (dont les membres sont nommés par le président de la Cour suprême), et non à une commission nommée par le gouvernement ou la Knesset."
    short:
      he: "ועדת חקירה ל-7 באוקטובר"
      en: "7 October inquiry"
      ar: "لجنة تحقيق في 7 أكتوبر"
      ru: "Расследование 7 октября"
      es: "Investigación del 7 de octubre"
      fr: "Enquête sur le 7 octobre"
    explainer:
      he: "ועדת חקירה ממלכתית מוקמת לפי חוק, חבריה ממונים בידי נשיא בית המשפט העליון ויש לה סמכויות רחבות. התומכים אומרים שרק כך החקירה תהיה עצמאית ואמינה; המתנגדים אומרים שבתי המשפט אינם ניטרליים ומעדיפים ועדה שהממשלה או הכנסת מקימות."
      en: "A state commission of inquiry is set up under law, its members appointed by the Chief Justice, with broad powers. Supporters say only that makes the inquiry independent and credible; opponents say the courts are not neutral and prefer a commission set up by the government or the Knesset."
      ar: "تُشكَّل لجنة التحقيق الرسمية بموجب القانون، ويعيّن أعضاءها رئيس المحكمة العليا، ولها صلاحيات واسعة. يقول المؤيدون إن هذا وحده يجعل التحقيق مستقلًا وموثوقًا؛ ويقول المعارضون إن المحاكم ليست محايدة ويفضّلون لجنة تشكّلها الحكومة أو الكنيست."
      ru: "Государственная следственная комиссия создаётся по закону, её членов назначает председатель Верховного суда, и у неё широкие полномочия. Сторонники говорят, что только так расследование будет независимым и заслуживающим доверия; противники — что суды не нейтральны, и предпочитают комиссию, созданную правительством или Кнессетом."
      es: "Una comisión estatal de investigación se crea por ley, sus miembros los nombra el presidente del Tribunal Supremo y tiene amplios poderes. Los partidarios dicen que solo así la investigación será independiente y creíble; los opositores dicen que los tribunales no son neutrales y prefieren una comisión creada por el Gobierno o la Knéset."
      fr: "Une commission d’enquête d’État est créée en vertu de la loi, ses membres sont nommés par le président de la Cour suprême et elle dispose de larges pouvoirs. Les partisans disent que c’est la seule façon de rendre l’enquête indépendante et crédible ; les opposants disent que les tribunaux ne sont pas neutres et préfèrent une commission créée par le gouvernement ou la Knesset."
