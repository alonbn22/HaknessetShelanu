      en: Chairwoman of the Committee for the Rights of the Child
    description:
      he: ב-4 באוגוסט 2025 נבחרה שטרית ליושבת ראש הוועדה המיוחדת לזכויות הילד של
        הכנסת (במקום ח"כ אליהו רביבו, על פי הוויקיפדיה העברית), והיא מכהנת בתפקיד
        זה גם נכון לספטמבר 2026. במסגרת תפקידה היא מובילה דיונים בנושאי רווחת
        ילדים, ובהם פיקוח על מעונות יום, אלימות נוער ובטיחות ילדים ברשת.
      en: On 4 August 2025 Shitrit was elected chair of the Knesset's Special
        Committee for the Rights of the Child (succeeding MK Eliyahu Revivo,
        according to Hebrew Wikipedia), a post she still holds as of September
        2026. In this role she leads hearings on child welfare issues, including
        daycare supervision, youth violence and children's online safety.
