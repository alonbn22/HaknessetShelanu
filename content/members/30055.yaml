    title:
      he: "סנקציות אישיות של בריטניה, קנדה, אוסטרליה, ניו זילנד ונורווגיה; איסורי כניסה במדינות אירופה נוספות"
      en: "Personal sanctions by the UK, Canada, Australia, New Zealand and Norway; entry bans by additional European states"
    description:
      he: "ב-10 ביוני 2025 הודיעו בריטניה, קנדה, אוסטרליה, ניו זילנד ונורווגיה על הקפאת נכסים ואיסור כניסה נגד סמוטריץ' ונגד השר איתמר בן גביר, בטענה שהם \"הסיתו לאלימות קיצונית\" נגד פלסטינים בגדה המערבית. סמוטריץ' כינה את הצעדים \"ספר לבן\" ואמר כי בריטניה החליטה להטיל עליו סנקציות \"כי סיכלתי הקמת מדינה פלסטינית\". ביולי 2025 אסרה הולנד על כניסתו לשטחה ובספטמבר 2025 הודיעה ספרד על איסור דומה."
      en: "On 10 June 2025 the UK, Canada, Australia, New Zealand and Norway announced asset freezes and travel bans on Smotrich and on Minister Itamar Ben Gvir, saying they had \"incited extremist violence\" against Palestinians in the West Bank. Smotrich likened the measures to a \"White Paper\" and said Britain sanctioned him \"because I've thwarted the establishment of a Palestinian state\". In July 2025 the Netherlands barred him from entering its territory and in September 2025 Spain announced a similar ban."
    sources:
