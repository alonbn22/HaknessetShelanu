    title:
      he: במקום ה-19 ברשימת הליכוד לכנסת ה-26 לאחר שדורג עשירי בפריימריז
      en: Placed 19th on Likud's slate for the 26th Knesset after finishing tenth in the primary
    description:
      he: בפריימריז הליכוד ב-17 באוגוסט 2026 דורג אמסלם במקום העשירי בהצבעה. ברשימת הליכוד שהוגשה לוועדת הבחירות ב-9 בספטמבר 2026, לאחר שיבוץ המקומות השמורים של יו"ר המפלגה, הוא ניצב במקום ה-19.
      en: In the Likud primary on 17 August 2026 Amsalem finished tenth in the vote. On the Likud slate filed with the elections committee on 9 September 2026, after the party chairman's reserved slots were inserted, he stands in 19th place.
