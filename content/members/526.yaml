    title:
      he: יושב ראש ועדת הכספים של הכנסת במשך יותר מעשור
      en: Chaired the Knesset Finance Committee for more than a decade
    description:
      he: משה גפני כיהן כיושב ראש ועדת הכספים של הכנסת, אחת הוועדות רבות ההשפעה בבית
        המחוקקים, בכמה תקופות לא רצופות החל מאפריל 2009 ובמצטבר יותר מעשור. ביולי
        2025, לאחר שיהדות התורה פרשה מהקואליציה על רקע המחלוקת על חוק הגיוס, התפטר
        מתפקיד היו"ר, וב-16 ביולי 2025 מונה במקומו ח"כ אופיר כץ.
      en: Moshe Gafni chaired the Knesset Finance Committee, one of the parliament's
        most influential committees, across several non-consecutive periods
        beginning in April 2009, for more than a decade in total. In July 2025,
        after United Torah Judaism left the coalition over the dispute on the
        military-draft law, he resigned the chairmanship, and on 16 July 2025 MK
        Ofir Katz was appointed in his place.
    date: "2009-04-01"
