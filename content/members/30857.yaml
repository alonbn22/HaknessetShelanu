    title:
      he: בפאנל בחירות אמר כי אינו רוצה לגייס "מישהו מקפלן" לקרבי
      en: At an election panel said he does not want to draft "someone from Kaplan" into combat
    description:
      he: >-
        בפאנל בחירות בבית ספר בתל אביב, ב-15 בספטמבר 2026, אמר אליהו בהקשר של שאלת
        הגיוס: "אני לא רוצה לגייס מישהו מקפלן, שיתגייס לקרבי, ובסוף הוא לא יקום
        להסתער", והוסיף כי הוא רוצה "לשנות את מערכת החינוך כדי שאנשים ייתנו את
        רוחם ואת נפשם".
      en: >-
        At an election panel at a Tel Aviv school on 15 September 2026, speaking about
        the draft, Eliyahu said "I don't want to draft someone from Kaplan, who
        enlists in a combat unit and in the end won't get up and charge", adding that
        he wants to "change the education system so that people give their spirit
        and soul".
    sources:
      - url: https://www.ynet.co.il/news/elections2026/article/sk7fbklkgg
        title: 'השר מעוצמה יהודית: "לא רוצה לגייס מקפלן לקרבי, בסוף הוא לא יקום להסתער"'
        publisher: Ynet
