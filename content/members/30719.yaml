      en: On 11 November 2024 the Knesset Ethics Committee voted unanimously to
        suspend MK Ofer Cassif for six months from participating in plenary and
        committee sessions (except to vote), and to withhold two weeks' salary.
        The decision followed complaints over his remarks concerning the IDF and
        the Gaza war. Separately, a February 2024 motion to expel him from the
        Knesset failed, securing only 85 of the 90 votes required.
