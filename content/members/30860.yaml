    date: "2026-06-17"
    title:
      he: "כתב אישום על חשיפת זהות איש שב\"כ; הכנסת העניקה חסינות ועתירה לבג\"ץ תלויה ועומדת"
      en: "Indicted over exposing a Shin Bet officer's identity; Knesset granted immunity and a High Court petition is pending"
      ar: "لائحة اتهام بكشف هوية ضابط في الشاباك؛ الكنيست منحها الحصانة والتماس أمام محكمة العدل العليا قيد النظر"
      ru: "Обвинение в раскрытии личности сотрудника ШАБАКа; Кнессет предоставил иммунитет, петиция в Высший суд рассматривается"
    description:
      he: "ב-19 במאי 2026 החליטה היועצת המשפטית לממשלה להגיש כתב אישום נגד גוטליב בגין גילוי ופרסום מידע חסוי בניגוד לחוק שירות הביטחון הכללי, לאחר פרסום ברשתות החברתיות שחשף את זהותו של איש שב\"כ, בן זוגה של הפעילה שקמה ברסלר; חוות דעת שב\"כ קבעה כי הפרסום סיכן את חייו ואת משפחתו. ב-17 ביוני 2026 העניקה מליאת הכנסת לגוטליב חסינות מפני העמדה לדין (ברוב של 61-48 ו-62-48), ואיש השב\"כ עתר לבג\"ץ לביטול ההחלטה; נכון לספטמבר 2026 לא דווח על הכרעה בעתירה. גוטליב מכחישה ביצוע עבירה, אומרת כי פעלה במסגרת תפקידה הפרלמנטרי ורק שיתפה פרסום שכבר היה גלוי, וטוענת כי ההליך נגדה הוא רדיפה. חזקת החפות עומדת לה."
      en: "On 19 May 2026 the Attorney General decided to indict Gotliv for disclosing and publishing classified information in violation of the General Security Service (Shin Bet) law, over a social-media post that exposed the identity of a Shin Bet officer, the partner of activist Shikma Bressler; a Shin Bet assessment found the post endangered him and his family. On 17 June 2026 the Knesset plenum granted Gotliv immunity from prosecution (by votes of 61-48 and 62-48), and the officer petitioned the High Court of Justice to overturn the decision; as of September 2026 no ruling on the petition has been reported. Gotliv denies wrongdoing, says she acted within her parliamentary role and only reshared an already-public post, and calls the proceedings persecution. The presumption of innocence applies."
      ar: "في 19 مايو 2026 قررت المستشارة القضائية للحكومة تقديم لائحة اتهام ضد غوتليب بتهمة كشف ونشر معلومات سرية بالمخالفة لقانون الشاباك، على خلفية منشور كشف هوية ضابط في الشاباك. وفي 17 يونيو 2026 منحت الهيئة العامة للكنيست غوتليب حصانة من المحاكمة (61-48 و62-48)، وقدّم الضابط التماسًا إلى محكمة العدل العليا لإلغاء القرار؛ وحتى سبتمبر 2026 لم يُعلن عن قرار. تنفي غوتليب ارتكاب أي مخالفة وتقول إنها تصرفت ضمن دورها البرلماني. وتُطبَّق قرينة البراءة."
      ru: "19 мая 2026 года юридический советник правительства решила предъявить Готлив обвинение в раскрытии и публикации секретной информации в нарушение закона о ШАБАКе из-за поста, раскрывшего личность сотрудника ШАБАКа. 17 июня 2026 года пленум Кнессета предоставил Готлив иммунитет от преследования (61-48 и 62-48), а сотрудник подал петицию в Высший суд справедливости об отмене решения; по состоянию на сентябрь 2026 года решение не сообщалось. Готлив отрицает вину и заявляет, что действовала в рамках депутатских полномочий. Действует презумпция невиновности."
