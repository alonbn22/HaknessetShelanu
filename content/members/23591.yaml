    description:
      he: "ב-24 באוגוסט 2026, עשרה ימים לאחר פרישתו מיש עתיד, הודיע שטרן על הצטרפותו למפלגת 'ישר' בראשות גדי איזנקוט לקראת הבחירות לכנסת ה-26. שטרן אמר כי \"ישראל זקוקה להנהגה אמינה, ממלכתית ומנוסה\"; מקומו ברשימה לא פורסם."
