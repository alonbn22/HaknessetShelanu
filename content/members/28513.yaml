      en: Served as a government minister and deputy minister in Israel
    description:
      he: יואב בן צור, חבר כנסת מטעם ש"ס שנכנס לכנסת ביוני 2014, כיהן בממשלה ה-37 כשר
        העבודה, הרווחה והשירותים החברתיים (החל מדצמבר 2022 ועד התפטרותו ביולי
        2025) וכן כממלא מקום שר הבריאות בין ינואר לאפריל 2023. במאי 2020 מונה
        לסגן השר לפיתוח הפריפריה, הנגב והגליל ולסגן שר הפנים.
      en: Yoav Ben-Tzur, a Knesset member for the Shas party who entered the Knesset
        in June 2014, served in the 37th government as Minister of Labor, Social
        Affairs and Social Services (from December 2022 until his resignation in
        July 2025) and as acting Minister of Health between January and April
        2023. In May 2020 he was appointed Deputy Minister for the Development
        of the Periphery, Negev and Galilee and Deputy Minister of the Interior.
