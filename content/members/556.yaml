      he: "שוריין ברשימת הליכוד לבחירות 2026"
      en: "Given a reserved spot on the Likud list for the 2026 election"
    description:
      he: "ב-11 באוגוסט 2026 הודיע הליכוד כי מזכירות המפלגה תתבקש לאשר שריון לכץ, יו\"ר מרכז הליכוד, באחד משמונת המקומות השמורים ליו\"ר המפלגה. בית הדין של הליכוד הוציא צו ביניים שעיכב את ההצבעה, אך ב-12 באוגוסט אישר את השריון, והמזכירות אישרה אותו ברוב של 76 מול 7."
      en: "On 11 August 2026 Likud announced that the party secretariat would be asked to approve a reserved slot for Katz, chairman of the Likud Central Committee, in one of the eight spots reserved for the party leader. The Likud party court issued an interim order delaying the vote, then approved the placement on 12 August, and the secretariat ratified it 76-7."
