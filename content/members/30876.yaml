    title:
      he: יושב ראש הוועדה המיוחדת לפניות הציבור
      en: Chair of the Special Committee for Public Petitions
    description:
      he: ב-28 בינואר 2026 מונה אושר שקלים פה אחד ליושב ראש הוועדה המיוחדת לפניות
        הציבור של הכנסת, במקומו של יצחק פינדרוס (יהדות התורה), שסיעתו פרשה
        מהקואליציה חודשים קודם לכן. הוועדה עוסקת בסיוע לאזרחים מול רשויות
        המדינה; שקלים מכהן בתפקיד גם לאחר פיזור הכנסת ביולי 2026.
      en: On 28 January 2026, Osher Shekalim was appointed unanimously as chair of the
        Knesset's Special Committee for Public Petitions, replacing Yitzhak
        Pindrus (UTJ), whose faction had left the coalition months earlier. The
        committee handles assisting citizens in their dealings with state
        authorities; Shekalim continues in the post after the Knesset's
        dissolution in July 2026.
    date: 2026-01-28
