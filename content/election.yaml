    note:
      he: "יולי אדלשטיין, שפרש מהליכוד בתחילת יולי 2026, מנהל לפי דיווחים מגעים עם איילת שקד להקמת מפלגת ימין חדשה; טרם הוכרזה רשמית."
      en: "Yuli Edelstein, who left Likud in early July 2026, is reportedly in talks with Ayelet Shaked on a new right-wing party; not yet formally announced."
    sources:
