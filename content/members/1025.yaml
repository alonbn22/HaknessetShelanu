    title:
      he: בית הדין של הליכוד דחה את עתירותיה; שובצה במקום ה-25 ברשימה לכנסת ה-26
      en: Likud court rejected her petitions; placed 25th on the list for the 26th
        Knesset
    description:
      he: ב-7 בספטמבר 2026 דחה בית הדין של הליכוד, ברוב של ארבעה מול אחד, את עתירותיה
        של גמליאל נגד תוצאות הספירה החוזרת, וקבע כי ח"כ אתי עטיה תשובץ במקום
        ה-20 וגמליאל במקום ה-25 ברשימת הליכוד לבחירות 27 באוקטובר 2026.
      en: On 7 September 2026 the Likud party court rejected, by a 4–1 majority,
        Gamliel's petitions against the recount results, ruling that MK Eti Atia
        would be placed 20th and Gamliel 25th on the Likud list for the 27
        October 2026 election.
