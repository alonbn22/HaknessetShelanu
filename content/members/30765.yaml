      he: חקירת שוחד מ-2011 בפתח תקווה שנסגרה בהיעדר ראיות
      en: 2011 Petah Tikva bribery investigation closed for lack of evidence
    description:
      he: בפברואר 2011, בעת כהונתו כסגן ראש עיריית פתח תקווה, נעצר בוסו לצד ראש העיר
        בחשד לשוחד הקשור לבחירות המוניציפליות של 2008, והמשטרה המליצה להעמידו
        לדין. באוקטובר 2013 הודיעה פרקליטות המדינה על סגירת התיק נגדו מחמת היעדר
        ראיות מספיקות; בוסו לא הואשם ולא הורשע.
      en: In February 2011, while serving as deputy mayor of Petah Tikva, Buso was
        arrested alongside the mayor on suspicion of bribery connected to the
        2008 municipal elections, and police recommended prosecution. In October
        2013 the State Prosecutor's Office announced the case against him was
        closed for insufficient evidence; Buso was never indicted or convicted.
