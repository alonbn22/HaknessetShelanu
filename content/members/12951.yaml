    status: ongoing
    date: "2023-01-04"
    title:
      he: אדריכל הרפורמה המשפטית של 2023
      en: Architect of the 2023 judicial reform
      ar: مهندس الإصلاح القضائي لعام 2023
      ru: Архитектор судебной реформы 2023 года
    description:
      he: בינואר 2023, כשר המשפטים, הציג לוין תוכנית מקיפה לשינוי מערכת המשפט שעוררה מחאות נרחבות; בינואר 2024 פסל בית המשפט העליון את תיקון עילת הסבירות שנחקק במסגרתה. במרץ 2025 אישרה הכנסת את התיקון שקידם לשינוי הרכב הוועדה לבחירת שופטים, שייכנס לתוקף עם כינון הכנסת הבאה. ביוני 2026 הורה בג"ץ ללוין לכנס את הוועדה לבחירת שופטים וקבע פה אחד כי עליו לשתף פעולה עם נשיא בית המשפט העליון יצחק עמית, שבמינויו סירב לוין להכיר; בהמשך אותו חודש התכנסה הוועדה ובחרה 68 בעלי תפקידים שיפוטיים לאחר הקפאה של כשנה וחצי.
      en: In January 2023, as Justice Minister, Levin announced a sweeping program to change Israel's judicial system, prompting widespread protests; in January 2024 the Supreme Court struck down the reasonableness amendment enacted under it. In March 2025 the Knesset passed his amendment changing the composition of the Judicial Selection Committee, set to take effect when the next Knesset convenes. In June 2026 the High Court of Justice ordered Levin to convene the Judicial Selection Committee and ruled unanimously that he must cooperate with Supreme Court President Isaac Amit, whose appointment Levin had declined to recognize; later that month the committee convened and selected 68 judicial officials after a freeze of about a year and a half.
      ar: في يناير 2023، وبصفته وزيرًا للعدل، أعلن ليفين عن برنامج شامل لتغيير النظام القضائي في إسرائيل، ما أثار احتجاجات واسعة؛ وفي يناير 2024 ألغت المحكمة العليا تعديل "المعقولية" الذي سُنّ في إطاره. في مارس 2025 أقرّ الكنيست تعديله لتغيير تركيبة لجنة اختيار القضاة، على أن يدخل حيز التنفيذ مع انعقاد الكنيست المقبل. في يونيو 2026 أمرت محكمة العدل العليا ليفين بعقد لجنة اختيار القضاة وقضت بالإجماع بأن عليه التعاون مع رئيس المحكمة العليا يتسحاق عميت، الذي رفض ليفين الاعتراف بتعيينه؛ وفي وقت لاحق من الشهر نفسه انعقدت اللجنة واختارت 68 من أصحاب المناصب القضائية بعد تجميد دام نحو عام ونصف.
      ru: В январе 2023 года, будучи министром юстиции, Левин представил масштабную программу изменения судебной системы Израиля, вызвавшую широкие протесты; в январе 2024 года Верховный суд отменил принятую в её рамках поправку о «разумности». В марте 2025 года Кнессет принял продвигаемую им поправку об изменении состава комиссии по назначению судей, которая вступит в силу с созывом следующего Кнессета. В июне 2026 года Высший суд справедливости обязал Левина созвать комиссию по назначению судей и единогласно постановил, что он должен сотрудничать с председателем Верховного суда Ицхаком Амитом, назначение которого Левин отказывался признавать; позднее в том же месяце комиссия собралась и избрала 68 судейских должностных лиц после заморозки, длившейся около полутора лет.
