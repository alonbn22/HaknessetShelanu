    title:
      he: "ביקורת על הליך חקיקת חוק התקשורת בוועדה המיוחדת"
      en: "Criticism of the legislative process on the communications bill in the special committee"
    description:
      he: "לאחר שהשתתפה בסדרת דיוני מרתון של הוועדה המיוחדת לחוק התקשורת בראשות גלית דיסטל אטבריאן, אמרה טל מירון בראיון ל-TheMarker (24 במאי 2026) כי השר שלמה קרעי \"פוגש שחקנים בשוק התקשורת, ואז מגיעים פתאום שינויים בסעיפים בחוק\", וכינתה את ההצעה \"הרס ערך לעיתונות\"."
      en: "After taking part in a series of marathon hearings of the special committee on the communications bill chaired by Galit Distel Atbaryan, Tal Meron told TheMarker (24 May 2026) that Minister Shlomo Karhi \"meets players in the media market, and then suddenly changes appear in the bill's clauses\", calling the proposal \"a destruction of value for journalism\"."
    sources:
      - url: "https://www.themarker.com/news/2026-05-24/ty-article/0000019e-5575-df61-a3ff-d5f7bd950000"
        title: "ח\"כ שלי טל מירון: \"קרעי פוגש שחקנים בשוק התקשורת, ואז מגיעים פתאום שינויים בסעיפים בחוק\""
        publisher: "TheMarker"
