    date: "2026-09-05"
    title:
      he: הנהגת דגל התורה הודיעה כי גפני לא ייכלל ברשימה לבחירות 2026
      en: Degel HaTorah leadership announced Gafni will not be on the 2026 election slate
    description:
      he: במוצאי שבת, 5 בספטמבר 2026, הודיעה לשכת הרב דב לנדו לגפני ולח"כ אורי מקלב כי
        לא ירוצו ברשימת יהדות התורה לבחירות ב-27 באוקטובר 2026, בנימוק של "ריענון"
        הנציגות; על פי הדיווחים ההחלטה באה לאחר שהמפלגה לא הצליחה להעביר חוק
        המסדיר את פטור בני הישיבות מגיוס. ח"כ יעקב אשר צפוי להחליף את גפני כיו"ר
        דגל התורה ולעמוד בראש הרשימה המשותפת, וגפני התבקש להמשיך כיו"ר התנועה
        הארצית של דגל התורה. גפני כיהן בכנסת מאז 1988.
      en: On Saturday night, 5 September 2026, the office of Rabbi Dov Lando informed
        Gafni and MK Uri Maklev that they would not run on the United Torah
        Judaism slate in the 27 October 2026 election, citing a need to
        "refresh" the party's representatives; reports tied the decision to the
        party's failure to pass a law regulating yeshiva students' exemption from
        military service. MK Yaakov Asher is expected to replace Gafni as
        chairman of Degel HaTorah and head the joint slate, and Gafni was asked
        to continue as chairman of Degel HaTorah's national movement. Gafni has
        served in the Knesset since 1988.
