  - kind: negative
    category: controversy
    title:
      he: אמירה כלפי ח"כ נעמה לזימי בדיון בוועדת החינוך (יוני 2026)
      en: Remark toward MK Naama Lazimi during an Education Committee debate (June 2026)
    description:
      he: ב-29 ביוני 2026, בדיון בוועדת החינוך, כשנשאל על עמדתו בעניין ירי לעבר רגליהם
        של חוסמי כבישים, אמר פינדרוס "אבל להתחיל עם נעמה לזימי". ח"כ לזימי
        (הדמוקרטים) הגיבה כי מדובר בהסתה, קראה לו "מסית ובריון", והגישה נגדו
        תלונה במשטרה. ח"כ טלי גוטליב (הליכוד) אמרה כי דבריו הוצאו מהקשרם; בדיווחים
        המצוטטים לא נכללה תגובה של פינדרוס עצמו.
      en: On 29 June 2026, during an Education Committee debate, when asked about his
        stance on firing at the legs of road-blocking protesters, Pindrus said
        "but start with Naama Lazimi". MK Lazimi (The Democrats) called the
        remark incitement, described him as "an inciter and a bully", and filed
        a police complaint against him. MK Tali Gotliv (Likud) said his words
        were taken out of context; the cited reports did not include a response
        from Pindrus himself.
    date: 2026-06-29
