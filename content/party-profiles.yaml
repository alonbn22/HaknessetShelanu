  - id: 1100 # The Democrats (Labor–Meretz); the Knesset faction is still registered as Labor
    verified: "2026-09-19"
    updates:
      - date: "2024-07-12"
        text:
          he: "יאיר גולן נבחר ליו\"ר העבודה (28 במאי 2024); ב-30 ביוני 2024 חתמו העבודה ומרצ על הסכם איחוד למפלגה בשם \"הדמוקרטים\", וועידה משותפת אישרה אותו ב-12 ביולי 2024."
          en: "Yair Golan was elected Labor chairman (28 May 2024); on 30 June 2024 Labor and Meretz signed a merger agreement creating “The Democrats”, approved by a joint convention on 12 July 2024."
        sources:
          - { url: "https://www.timesofisrael.com/yair-golan-wins-landslide-victory-in-labor-primary-with-promise-to-unite-the-left/", title: "Yair Golan wins landslide victory in Labor primary with promise to unite the left (2024-05-28)", publisher: "The Times of Israel" }
          - { url: "https://www.timesofisrael.com/labor-and-meretz-merge-into-united-liberal-democratic-zionist-party-the-democrats/", title: "Labor and Meretz merge into united 'liberal-democratic Zionist party': The Democrats (2024-06-30)", publisher: "The Times of Israel" }
          - { url: "https://www.jpost.com/israel-news/politics-and-diplomacy/article-810075", title: "With an overwhelming majority, Meretz and Labor approve merge, becoming the Democrats (2024-07-12)", publisher: "The Jerusalem Post" }
      - date: "2025-02-25"
        text:
          he: "ועדת הכנסת, בראשות יו\"ר הקואליציה אופיר כץ, לא אישרה את בקשת סיעת העבודה לשנות את שמה ל\"הדמוקרטים\"; יו\"ר הסיעה אפרת רייטן מרום משכה את הבקשה, והסיעה נותרה רשומה בכנסת כ\"העבודה\"."
          en: "The Knesset House Committee, chaired by coalition whip Ofir Katz, did not approve the Labor faction’s request to rename itself “The Democrats”; faction chair Efrat Rayten Marom withdrew the request and the faction remains registered in the Knesset as “Labor”."
        sources:
          - { url: "https://www.jpost.com/israel-news/article-843691", title: "Coalition denies Labor Party's bid to change name to The Democrats (2025-02-25)", publisher: "The Jerusalem Post" }
          - { url: "https://main.knesset.gov.il/mk/apps/faction/faction-lobby?KnessetID=25&FactionID=1100", title: "סיעת העבודה — 4 חברים, יו\"ר הסיעה אפרת רייטן מרום (2026-09-19)", publisher: "הכנסת" }
      - date: "2026-05-31"
        text:
          he: "ועידת הדמוקרטים בתל אביב אשררה את איחוד העבודה ומרצ לקראת הבחירות; למרצ הובטחו המקומות 6, 8 ו-14 ברשימה המשותפת."
          en: "The Democrats’ conference in Tel Aviv ratified the Labor–Meretz merger ahead of the election; Meretz was guaranteed slots 6, 8 and 14 on the joint list."
        sources:
          - { url: "https://www.timesofisrael.com/liveblog_entry/left-wing-democrats-party-ratifies-merger-of-labor-and-meretz-factions-at-party-conference/", title: "Left-wing Democrats party ratifies merger of Labor and Meretz factions at party conference (2026-05-31)", publisher: "The Times of Israel" }
          - { url: "https://www.haaretz.com/israel-news/elections/2026-05-31/ty-article/.premium/democrats-party-approves-left-wing-merger-of-meretz-labor-ahead-of-elections/0000019e-7ec8-d813-a9be-ffcfd71b0000", title: "Democrats Party Approves Left-wing Merger of Meretz, Labor Ahead of Elections (2026-05-31)", publisher: "Haaretz" }
      - date: "2026-06-28"
        text:
          he: "המפלגה פרסמה 51 מועמדים לפריימריז; שלושה מארבעת חברי הכנסת של הסיעה (נעמה לזימי, גלעד קריב, אפרת רייטן מרום) התמודדו, ואילו מרב מיכאלי, שעמדה בראש העבודה בבחירות 2022, לא התמודדה."
          en: "The party published 51 primary candidates; three of the faction’s four MKs (Naama Lazimi, Gilad Kariv, Efrat Rayten Marom) ran, while Merav Michaeli, who led Labor in the 2022 election, did not run."
        sources:
          - { url: "https://www.timesofisrael.com/golans-democrats-party-unveils-51-primary-candidates-touts-85000-members/", title: "Golan's Democrats party unveils 51 primary candidates, touts 85,000 members (2026-06-28)", publisher: "The Times of Israel" }
      - date: "2026-07-20"
        text:
          he: "בפריימריז מקוונים של הדמוקרטים נבחרה רשימת המועמדים: אחרי גולן — נעמה לזימי (2), גלעד קריב (3), אפרת רייטן מרום (4), יאיר פינק (5), גבי לסקי (מרצ, 6), עמרי רונן (7), מיכל רוזין (מרצ, 8), משה רדמן (9), סומייה בשיר (10), נמרוד שפר (11)."
          en: "In an online Democrats primary the list was chosen: after Golan — Naama Lazimi (2), Gilad Kariv (3), Efrat Rayten Marom (4), Yair Fink (5), Gaby Lasky (Meretz, 6), Omri Ronen (7), Michal Rozin (Meretz, 8), Moshe Radman (9), Somaya Bashir (10), Nimrod Sheffer (11)."
        sources:
          - { url: "https://www.timesofisrael.com/naama-lazimi-wins-no-2-spot-after-yair-golan-in-left-wing-democrats-primary/", title: "MK Naama Lazimi wins No. 2 spot after Yair Golan in left-wing Democrats' primary (2026-07-20)", publisher: "The Times of Israel" }
          - { url: "https://www.jpost.com/israel-news/politics-and-diplomacy/article-903068", title: "Democrats announce Knesset slate ahead of elections, MK Lazimi takes second spot after Golan (2026-07-20)", publisher: "The Jerusalem Post" }
      - date: "2026-09-07"
        text:
          he: "הרשימה \"הדמוקרטים בראשות יאיר גולן\" הוגשה לוועדת הבחירות (רשימה 17; האותיות המבוקשות אמת) על ידי שתי מפלגות — \"הדמוקרטים מיסודה של תנועת העבודה\" ו\"מרצ\" — עם 118 מועמדים; מרב מיכאלי אינה ברשימה."
