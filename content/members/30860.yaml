    title:
      he: "נזיפה וסנקציה של ועדת האתיקה של הכנסת (2023)"
      en: "Knesset Ethics Committee reprimand and sanction (2023)"
    description:
      he: "במרץ 2023 הטילה ועדת האתיקה של הכנסת על גוטליב סנקציה בעקבות פרסומים ברשתות החברתיות שבהם תלתה את האחריות לפיגוע טרור בירושלים בנשיאת בית המשפט העליון אסתר חיות. הוועדה נזפה בה נזיפה חמורה ואסרה עליה לנאום במליאה במשך שתי ישיבות ובוועדות במשך שלושה ימי פעילות."
      en: "In March 2023 the Knesset Ethics Committee sanctioned Gotliv over social-media posts in which she blamed Supreme Court President Esther Hayut for a deadly terror attack in Jerusalem. The committee issued a severe reprimand and barred her from speaking in the plenum for two sessions and in committees for three days of parliamentary activity."
    date: "2023-03-21"
