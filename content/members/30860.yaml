    title:
      he: "בית המשפט המחוזי דחה את טענת החסינות שלה בתביעת הדיבה של שקמה ברסלר"
      en: "District Court rejected her immunity claim in Shikma Bressler's defamation suit"
    description:
      he: "ביוני 2026 דחה בית המשפט המחוזי מרכז-לוד את בקשתה של גוטליב לסלק על הסף תביעת לשון הרע בסך 2.6 מיליון שקל שהגישה נגדה הפעילה שקמה ברסלר, בגין טענות שייחסו לברסלר קשר לחמאס. השופט קבע כי החסינות המהותית מגינה על הבעת דעה אך לא על הפצת עובדות שח\"כ ידעה שאינן נכונות, וכי חבר כנסת אינו יכול להפר את החוק במודע. התביעה תתברר לגופה; גוטליב סירבה לחשוף את מקורותיה ואמרה כי תמשיך לעמוד על דבריה."
      en: "In June 2026 the Central District Court in Lod rejected Gotliv's motion to dismiss a NIS 2.6 million defamation suit filed against her by activist Shikma Bressler over claims linking Bressler to Hamas. The judge ruled that substantive immunity protects the expression of opinions but not the dissemination of facts an MK knew to be untrue, and that a Knesset member cannot knowingly break the law. The suit will proceed to trial; Gotliv declined to reveal her sources and said she stands by her statements."
