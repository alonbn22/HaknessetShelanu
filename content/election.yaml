    value: { he: "כ-70.6% (2022)", en: "~70.6% (2022)", ar: "نحو 70.6% (2022)", ru: "около 70,6% (2022)", es: "~70,6 % (2022)", fr: "~70,6 % (2022)" }
    detail:
      he: "לשם השוואה: 67.4% ב-2021 (הנמוך במחזור 2019–2021), 71.5% ב-2020, 69.8% בספטמבר 2019 ו-68.5% באפריל 2019. שיעורי ההצבעה לכל מערכות הבחירות — בהיסטוריית הבחירות שבהמשך העמוד."
      en: "For comparison: 67.4% in 2021 (the lowest of the 2019–2021 cycle), 71.5% in 2020, 69.8% in September 2019 and 68.5% in April 2019. Turnout for every election appears in the history below."
      ar: "للمقارنة: 67.4% في 2021 (الأدنى في جولات 2019–2021)، و71.5% في 2020، و69.8% في أيلول/سبتمبر 2019، و68.5% في نيسان/أبريل 2019. نسب التصويت لكل الانتخابات تظهر في التاريخ أدناه."
      ru: "Для сравнения: 67,4% в 2021 году (самая низкая в цикле 2019–2021), 71,5% в 2020-м, 69,8% в сентябре 2019-го и 68,5% в апреле 2019-го. Явка на всех выборах — в истории ниже."
      es: "Como comparación: 67,4 % en 2021 (la más baja del ciclo 2019–2021), 71,5 % en 2020, 69,8 % en septiembre de 2019 y 68,5 % en abril de 2019. La participación de todas las elecciones figura en el historial de abajo."
      fr: "À titre de comparaison : 67,4 % en 2021 (le plus bas du cycle 2019–2021), 71,5 % en 2020, 69,8 % en septembre 2019 et 68,5 % en avril 2019. La participation à chaque élection figure dans l’historique ci-dessous."
