  - kind: negative
    category: controversy
    status: ethics
    title:
      he: "השעיה על ידי ועדת האתיקה של הכנסת בעקבות התבטאות על מתקפת 7 באוקטובר"
      en: "Suspended by the Knesset Ethics Committee over remarks on the October 7 attack"
    description:
      he: "ב-15 בנובמבר 2023 השעתה ועדת האתיקה של הכנסת את ח'טיב יאסין לחודש, מתוכו שבועיים ללא שכר, לאחר שאמרה בריאיון ב-5 בנובמבר 2023 כי לא נשחטו תינוקות ולא נאנסו נשים, לפחות לא בתיעוד שהוצג לחברי הכנסת, במתקפת חמאס ב-7 באוקטובר 2023. הוועדה קבעה כי בדבריה הכחישה את הזוועות. ח'טיב יאסין התנצלה בפני הוועדה ובמליאת הכנסת, אמרה כי דבריה בעברית הובנו שלא כהלכה וכי לא התכוונה להמעיט בחומרת הטבח, וכי מעשי 7 באוקטובר מנוגדים לערכיה כאישה מוסלמית דתייה."
      en: "On 15 November 2023 the Knesset Ethics Committee suspended Khatib-Yassin for one month, including two weeks without pay, after she said in a 5 November 2023 interview that babies were not slaughtered and women were not raped, at least not in the footage shown to members, during the 7 October 2023 Hamas attack. The committee found that her comments denied the atrocities. Khatib-Yassin apologised to the committee and the Knesset plenum, said her Hebrew remarks had been misunderstood and that she had not intended to belittle the massacre, and that the acts of 7 October were contrary to her values as a religious Muslim woman."
    date: "2023-11-15"
