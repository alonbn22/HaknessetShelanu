      he: חברת הכנסת הראשונה החובשת חיג'אב
      en: First hijab-wearing woman elected to the Knesset
    description:
      he: בבחירות מרץ 2020 נבחרה אימאן ח'טיב יאסין לכנסת מטעם הרשימה המשותפת, והפכה
        לאישה הראשונה החובשת חיג'אב שנבחרה לכנסת, וכן לאישה הראשונה מטעם הרשימה
        הערבית המאוחדת (רע"ם) שנבחרה לפרלמנט.
      en: In the March 2020 election, Iman Khatib-Yassin was elected to the Knesset on
        the Joint List, becoming the first hijab-wearing woman elected to the
        Knesset and the first woman from the United Arab List (Ra'am) to serve
        in parliament.
