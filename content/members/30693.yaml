      en: "Israel's first openly gay mayor"
    description:
      he: "ב-16 במרץ 2018 נבחר איתן גינזבורג על ידי מועצת העיר רעננה לכהן כראש העיר, ובכך הפך לראש העיר הגלוי (הומוסקסואל) הראשון בישראל. הוא החליף את זאב בילסקי שעזב את התפקיד."
      en: "On 16 March 2018, Eitan Ginzburg was elected by the Ra'anana city council to serve as mayor, becoming Israel's first openly gay mayor. He succeeded Ze'ev Bielski, who had left the post."
