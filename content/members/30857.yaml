claims:
  - kind: positive
    category: achievement
    title:
      he: שר המורשת בממשלה ה-37 (מכהן; ממשלת מעבר)
      en: Minister of Heritage in the 37th government (serving; caretaker government)
    description:
      he: >-
        עמיחי אליהו, חבר הכנסת מטעם עוצמה יהודית, מונה ב-29 בדצמבר 2022 לשר ירושלים
        ומורשת, ומ-22 בינואר 2023 מכהן כשר המורשת. ב-19 בינואר 2025 התפטר יחד עם
        שרי עוצמה יהודית במחאה על הסכם הפסקת האש בעזה, וב-19 במרץ 2025 שב לתפקיד
        עם חזרת המפלגה לממשלה. לפי אתר הכנסת הוא מכהן כשר המורשת גם בממשלת המעבר
        שלאחר פיזור הכנסת ה-25.
      en: >-
        Amichai Eliyahu, a Knesset member for Otzma Yehudit, was appointed Minister of
        Jerusalem Affairs and Heritage on 29 December 2022 and has served as Minister
        of Heritage since 22 January 2023. On 19 January 2025 he resigned together
        with the other Otzma Yehudit ministers in protest at the Gaza ceasefire
        agreement, and on 19 March 2025 he returned to the post when the party
        rejoined the government. According to the Knesset website he continues to
        serve as Minister of Heritage in the caretaker government that followed the
        dissolution of the 25th Knesset.
    date: "2025-03-19"
    sources:
