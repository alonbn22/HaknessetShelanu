    title:
      he: נכנס לאזור החיץ בסוריה כדי להשיב צעירים דרוזים ישראלים שחצו את הגבול
      en: Entered the Syrian buffer zone to bring back Israeli Druze youths who had crossed the border
    description:
      he: ב-16 ביולי 2025, על רקע האלימות נגד הדרוזים בסוריה ולאחר שכאלף צעירים דרוזים מישראל חצו את הגבול, נכנס עמאר — יחד עם ח"כ עפיף עבד ובליווי כוחות הביטחון ובאישורם — לאזור החיץ בצד הסורי כדי לשכנע את הצעירים לשוב לישראל. לשכתו מסרה כי פעל "מתוך אחריות לאומית ודאגה עמוקה לשלומם של הצעירים הדרוזים".
      en: On 16 July 2025, amid violence against the Druze in Syria and after about a thousand young Israeli Druze had crossed the border, Amar — together with MK Afif Abed, accompanied by security forces and with their permission — entered the buffer zone on the Syrian side to persuade the youths to return to Israel. His office said he acted "out of national responsibility and deep concern for the safety of the Druze youth."
    sources:
