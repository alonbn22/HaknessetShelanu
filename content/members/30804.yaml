    title:
      he: מנכ"ל תנועת ש"ס וראש רשת החינוך התורני של התנועה
      en: Director-general of Shas and head of the party's Torah education network
    description:
      he: 'טרם כניסתו לכנסת בנה ביטון קריירה ארוכה בניהול חינוכי וארגוני: כיהן כמנכ"ל
        רשת מוסדות מגדל אור, מונה למנכ"ל תנועת ש"ס ב-2014, ועמד בראש רשת החינוך
        התורני של ש"ס (מעיין החינוך התורני / בני יוסף). לפי הדיווחים גדל מספר
        התלמידים ברשת בעשרת אלפים בתוך שנתיים בתקופת ניהולו.'
      en: "Before entering the Knesset, Biton built a long career in educational and
        organizational management: he served as CEO of the Migdal Or
        institutions network, was appointed director-general (CEO) of the Shas
        party in 2014, and headed the party's Torah education network (Ma'ayan
        HaChinuch HaTorani / Bnei Yosef), whose enrollment reportedly grew by
        10,000 pupils within two years during his tenure."
    date: "2014"
