  - kind: neutral
    category: news
    date: "2026-07-26"
    title:
      he: "לא זכתה במקום ריאלי בפריימריז של הציונות הדתית"
      en: "Did not win a realistic slot in the Religious Zionism primary"
    description:
      he: "בבחירות הפנימיות של הציונות הדתית שנערכו ב-26 ביולי 2026 בקרב כ-170 חברי מרכז המפלגה, הגיעה וולדיגר למקום שהוגדר בדיווחים כלא ריאלי, לאחר שעומר רחמים, יועצו של סמוטריץ', עקף אותה. ברשימה הסופית של הציונות הדתית–זהות לכנסת ה-26, שהוגשה בספטמבר 2026 לאחר השריונים והחיבור עם משה פייגלין, הוצבה במקום ה-16."
      en: "In the Religious Zionism party's internal election on 26 July 2026, held among about 170 party-center members, Waldiger finished in a slot described in reports as unrealistic, after Omer Rahamim, an adviser to Smotrich, overtook her. On the final Religious Zionism–Zehut list for the 26th Knesset, submitted in September 2026 after the reserved slots and the merger with Moshe Feiglin, she was placed 16th."
