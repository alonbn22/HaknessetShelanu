  - kind: negative
    category: controversy
    status: ethics
    date: 2025-06-23
    title:
      he: השעיה לשבועיים ללא שכר על ידי ועדת האתיקה בגין התבטאויות על המלחמה בעזה (2025)
      en: Two-week unpaid suspension by the Knesset Ethics Committee over remarks on the Gaza war (2025)
    description:
      he: ב-23 ביוני 2025 החליטה ועדת האתיקה של הכנסת להרחיק את עודה מדיוני המליאה והוועדות לשבועיים ללא שכר, בגין שורת התבטאויות מ-2024 שבהן כינה את פעולות צה"ל בעזה "רצח" ו"טבח" וטען כי הממשלה "ביצעה פשעים נגד האנושות". הוועדה קבעה כי מדובר ב"דפוס חמור של התבטאויות" הפוגע בכבוד הכנסת ובחיילים. מדובר בסנקציה אתית פרלמנטרית ולא בהליך פלילי; בדיווחים שצוטטו לא הובאה תגובה של עודה להחלטה.
      en: On 23 June 2025 the Knesset Ethics Committee decided to bar Odeh from plenum and committee sessions for two weeks without pay over a series of 2024 remarks in which he called IDF operations in Gaza "murder" and a "massacre" and said the government had "committed crimes against humanity." The committee found this a "severe pattern of remarks" that harmed the dignity of the Knesset and defamed soldiers. This was a parliamentary ethics sanction, not a criminal proceeding; the cited reports did not carry a response from Odeh to the decision.
    sources:
