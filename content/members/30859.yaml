  - kind: negative
    category: investigation
    status: acquitted
    title:
      he: חקירת הסתה בעקבות התבטאויות על חווארה (נסגרה ללא כתב אישום)
      en: Incitement investigation over Huwara remarks (closed without charges)
    description:
      he: ב-1 במרץ 2023 הורה היועץ המשפטי לממשלה על פתיחת חקירה בחשד להסתה נגד ח"כ
        צביקה פוגל, בעקבות התבטאויות ברדיו לאחר מהומות מתנחלים בחווארה, בהן אמר
        כי הוא רוצה לראות את "חווארה סגורה ושרופה". פוגל טען כי דבריו "סולפו" וכי
        קרא לפעולה של הצבא ולא של אזרחים, ונחקר על ידי המשטרה. ב-11 באפריל 2024
        הודיעה הפרקליטות על סגירת התיק ללא הגשת כתב אישום; פוגל כתב כי מדובר
        ב"חקירה מיותרת וחסרת בסיס". פוגל מעולם לא הואשם או הורשע בעבירה כלשהי
        בעניין זה.
      en: On 1 March 2023 the Attorney General authorized an incitement investigation
        into MK Zvika Fogel over remarks he made on radio following settler
        riots in the West Bank town of Huwara, in which he said he wanted to see
        Huwara 'closed and burnt.' Fogel said his words had been 'distorted' and
        that he was calling on the military, not civilians, to act; he was
        questioned by police. On 11 April 2024 prosecutors announced the case
        had been closed without any charges being filed; Fogel called it 'an
        unnecessary and baseless investigation.' Fogel was never charged with
        or convicted of any offense in the matter.
    date: 2023-03-01
