    title:
      he: "קידום הארכת תוכנית \"דרך חדשה\" לקליטת יוצאי אתיופיה"
      en: "Helped advance the extension of the \"New Way\" plan for the integration of Ethiopian-Israelis"
    description:
      he: "ב-15 ביולי 2025 אישרה ממשלת ישראל הארכה בשנתיים של תוכנית \"דרך חדשה\" לקליטת יוצאי אתיופיה בהיקף של כ-214 מיליון ש\"ח, בתחומי חינוך, תרבות, רווחה, תעסוקה, ביטחון ובריאות. לפי הדיווח, את המהלך הובילו משרד ראש הממשלה ושר האוצר בצלאל סמוטריץ' לצד סולומון, שאמר כי הקהילה האתיופית היא \"חלק משמעותי משליחותי בכנסת\"."
      en: "On 15 July 2025 the Israeli government approved a two-year extension of the \"New Way\" plan for the integration of Ethiopian immigrants, worth about NIS 214 million, covering education, culture, welfare, employment, security and health. According to the report, the move was led by the Prime Minister's Office and Finance Minister Bezalel Smotrich alongside Solomon, who said the Ethiopian community was \"a significant part of my mission in the Knesset\"."
    date: "2025-07-15"
