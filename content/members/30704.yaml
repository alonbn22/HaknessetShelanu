    description:
      he: "קרעי שירת בשירותו הצבאי בגדוד נצח יהודה (הנח\"ל החרדי) בצה\"ל. לאחר מכן השלים תואר ראשון בראיית חשבון ניהולית ומערכות מידע במרכז האקדמי לב, ותואר שני ודוקטורט בהנדסת תעשייה וניהול באוניברסיטת בן-גוריון בנגב."
      en: "Karhi served in the IDF's Netzah Yehuda Battalion (the Haredi Nahal track) during his national military service. He went on to earn a BA in managerial accounting and information systems at the Lev Academic Center (Jerusalem College of Technology), and a master's degree and a PhD in industrial engineering and management at Ben-Gurion University of the Negev."
