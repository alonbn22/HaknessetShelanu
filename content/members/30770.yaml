      en: "Community rabbi in Toulouse and manager of projects for immigrants from France"
      ar: "حاخام جالية في تولوز ومدير مشاريع للمهاجرين من فرنسا"
      ru: "Общинный раввин в Тулузе и руководитель проектов для репатриантов из Франции"
      es: "Rabino comunitario en Toulouse y gestor de proyectos para inmigrantes de Francia"
