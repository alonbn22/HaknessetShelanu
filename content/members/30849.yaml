    title:
      he: שובצה במקום החמישי ברשימת עוצמה יהודית לכנסת ה-26
      en: Placed fifth on the Otzma Yehudit list for the 26th Knesset
    description:
      he: ב-6 בספטמבר 2026 הודיע יו"ר עוצמה יהודית איתמר בן גביר, הקובע את הרכב הרשימה, כי סון הר מלך תשובץ במקום החמישי ברשימת המפלגה לבחירות ב-27 באוקטובר 2026, אחרי בן גביר, טלי גוטליב, יצחק וסרלאוף ועמיחי אליהו, ולפני יצחק קרויזר.
      en: On 6 September 2026 Otzma Yehudit chairman Itamar Ben Gvir, who sets the list's composition, announced that Son Har-Melech would be placed fifth on the party's list for the 27 October 2026 election, after Ben Gvir, Tally Gotliv, Yitzhak Wasserlauf and Amichai Eliyahu, and ahead of Yitzhak Kroizer.
