    title:
      he: התפטר מהכנסת במסגרת "החוק הנורווגי" וממשיך לכהן כשר בלבד
      en: Resigned his Knesset seat under the "Norwegian Law" and serves as a minister only
    description:
      he: ב-29 במרץ 2023 התפטר אמסלם מחברותו בכנסת במסגרת "החוק הנורווגי", ובמקומו נכנס לכנסת אביחי בוארון. מאז הוא מכהן כשר בממשלה (שר שיתוף הפעולה האזורי, שר במשרד המשפטים והשר המקשר לכנסת) מבלי להיות חבר כנסת.
      en: On 29 March 2023 Amsalem resigned his Knesset seat under the "Norwegian Law", and Avichai Boaron entered the Knesset in his place. Since then he has served as a cabinet minister (Regional Cooperation, minister in the Justice Ministry and liaison to the Knesset) without being a member of Knesset.
    sources:
