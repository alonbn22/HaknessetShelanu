    title:
      he: "חברת כנסת מטעם הציונות הדתית (משנת 2021)"
      en: "Member of Knesset for the Religious Zionist Party (since 2021)"
    description:
      he: "מיכל מרים וולדיגר, עורכת דין בהשכלתה (בוגרת משפטים מאוניברסיטת בר-אילן), נבחרה לכנסת ה-24 בשנת 2021 ברשימת הציונות הדתית ונבחרה שוב לכנסת ה-25 בשנת 2022. לפני כן כיהנה כחברת מועצת העיר גבעת שמואל מטעם הבית היהודי החל מ-2013."
      en: "Michal Miriam Waldiger, a lawyer by training (law degree from Bar-Ilan University), was elected to the 24th Knesset in 2021 on the Religious Zionist Party list and re-elected to the 25th Knesset in 2022. She previously served on the Givat Shmuel municipal council for The Jewish Home from 2013."
    date: "2021-04-06"
