        basis: statement
        source: { url: "https://www.timesofisrael.com/bid-to-scrap-law-of-return-grandchild-clause-likely-to-fail-but-part-of-wider-fight/", title: "Bid to scrap Law of Return grandchild clause likely to fail, but part of wider fight — Avigdor Liberman statement (2022-11-11)", publisher: "The Times of Israel" }
        quote:
          he: "\"נתמקד במאבק נגד שינוי חוק השבות, מאבני היסוד של הציונות. לתפיסתנו, שינוי חוק השבות כמוהו כשינוי ההמנון, הדגל וכל שאר סמלי המדינה.\""
          en: "\"We will focus on fighting a change to the Law of Return, one of the bedrocks of Zionism. In our view, changing the Law of Return is like changing the anthem, the flag and all other symbols of the state.\""
          ar: "«سنركّز على النضال ضد تغيير قانون العودة، أحد الأسس التي تقوم عليها الصهيونية. في نظرنا، تغيير قانون العودة يشبه تغيير النشيد الوطني والعلم وسائر رموز الدولة.»"
          ru: "«Мы сосредоточимся на борьбе против изменения Закона о возвращении — одного из краеугольных камней сионизма. По нашему мнению, изменить Закон о возвращении — всё равно что изменить гимн, флаг и все остальные символы государства»."
          es: "«Nos centraremos en luchar contra el cambio de la Ley del Retorno, uno de los pilares del sionismo. A nuestro juicio, cambiar la Ley del Retorno es como cambiar el himno, la bandera y todos los demás símbolos del Estado.»"
          fr: "« Nous nous concentrerons sur la lutte contre la modification de la Loi du retour, l’un des fondements du sionisme. À nos yeux, changer la Loi du retour, c’est comme changer l’hymne, le drapeau et tous les autres symboles de l’État. »"
