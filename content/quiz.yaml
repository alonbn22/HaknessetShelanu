        recordOf:
          he: "דברי יוסף חדאד, מס׳ 2 ברשימת עמך ישראל; ב-27.9 מתחה המפלגה ביקורת על דברי יאיר גולן שמפלגה ערבית יכולה להיות חלק מהממשלה"
          en: "the words of Yoseph Haddad, no. 2 on the Amkha Yisrael list; on 27 Sep the party criticised Yair Golan's statement that an Arab party can be part of the government"
          ar: "كلام يوسف حداد، رقم 2 في قائمة عمخا يسرائيل؛ وفي 27 أيلول/سبتمبر انتقد الحزب قول يائير غولان إن حزبًا عربيًا يمكن أن يكون جزءًا من الحكومة"
          ru: "слова Йосефа Хаддада, № 2 в списке «Амха Исраэль»; 27 сентября партия раскритиковала слова Яира Голана о том, что арабская партия может быть частью правительства"
          es: "palabras de Yoseph Haddad, n.º 2 de la lista Amkha Yisrael; el 27 de septiembre el partido criticó la afirmación de Yair Golan de que un partido árabe puede formar parte del Gobierno"
          fr: "propos de Yoseph Haddad, n° 2 sur la liste Amkha Israël ; le 27 septembre, le parti a critiqué la déclaration de Yaïr Golan selon laquelle un parti arabe peut faire partie du gouvernement"
        source: { url: "https://www.walla.co.il/news/israel/383955211", title: "יוסף חדאד על עבאס: \"הפך להיות המאמי הלאומי\" (24.9.2026)", publisher: "וואלה" }
        moreSources:
          - { url: "https://www.israelhayom.co.il/israelnow/article/21494792", title: "עמך ישראל נגד גולן — תגובה לדבריו על מפלגה ערבית בממשלה (27.9.2026)", publisher: "ישראל היום" }
        quote:
          he: "חדאד: \"מבחינת קואליציה אם מנסור עבאס שם זה פשוט אסון גדול מאוד לחברה הערבית הישראלית, לחברה הערבית כולה ולנציגי החברות הערביות\""
          en: "Haddad: \"As far as a coalition goes, if Mansour Abbas is there, it is simply a very great disaster for Israeli Arab society, for Arab society as a whole and for the representatives of the Arab communities\""
          ar: "حداد: «من ناحية الائتلاف، إذا كان منصور عباس هناك فهذه ببساطة كارثة كبيرة جدًا للمجتمع العربي الإسرائيلي، وللمجتمع العربي كله ولممثلي المجتمعات العربية»"
          ru: "Хаддад: «Что касается коалиции, если там будет Мансур Аббас, это просто огромная беда для израильского арабского общества, для всего арабского общества и для представителей арабских общин»"
          es: "Haddad: «En cuanto a la coalición, si Mansour Abbas está ahí, es sencillamente un desastre muy grande para la sociedad árabe israelí, para toda la sociedad árabe y para los representantes de las comunidades árabes»"
          fr: "Haddad : « Pour ce qui est de la coalition, si Mansour Abbas y est, c’est tout simplement un très grand désastre pour la société arabe israélienne, pour toute la société arabe et pour les représentants des communautés arabes »"

  - id: gaza-emigration
    topic: security
    lean: right
    text:
      he: "ישראל צריכה לעודד הגירה מרצון של תושבי רצועת עזה למדינות אחרות."
      en: "Israel should encourage voluntary emigration of Gaza's residents to other countries."
      ar: "على إسرائيل أن تشجّع الهجرة الطوعية لسكان قطاع غزة إلى دول أخرى."
      ru: "Израилю следует поощрять добровольную эмиграцию жителей сектора Газа в другие страны."
      es: "Israel debería fomentar la emigración voluntaria de los habitantes de la Franja de Gaza a otros países."
      fr: "Israël devrait encourager l’émigration volontaire des habitants de la bande de Gaza vers d’autres pays."
    short:
      he: "הגירה מרצון מעזה"
      en: "Voluntary emigration from Gaza"
      ar: "الهجرة الطوعية من غزة"
      ru: "Добровольная эмиграция из Газы"
      es: "Emigración voluntaria de Gaza"
      fr: "Émigration volontaire de Gaza"
    explainer:
      he: "מאז המלחמה עלתה תוכנית לעודד תושבי עזה לעבור למדינות אחרות, ובממשלה הוקם גוף לטיפול בכך. התומכים אומרים שזה פתרון הומניטרי לרצועה הרוסה ושמי שרוצה לעזוב צריך לקבל אפשרות; המתנגדים אומרים שאין 'מרצון' תחת מלחמה ומצור, שזה נוגד את המשפט הבינלאומי ושזה יבודד את ישראל בעולם."
      en: "Since the war, a plan to encourage Gaza's residents to move to other countries has been raised, and the government set up a body to handle it. Supporters say it is a humanitarian answer for a destroyed strip and that whoever wants to leave should be able to; opponents say there is no 'voluntary' under war and siege, that it violates international law and would isolate Israel in the world."
      ar: "منذ الحرب طُرحت خطة لتشجيع سكان غزة على الانتقال إلى دول أخرى، وأنشأت الحكومة هيئة لمعالجة ذلك. يقول المؤيدون إنه حل إنساني لقطاع مدمَّر وإن من يريد المغادرة يجب أن يُتاح له ذلك؛ ويقول المعارضون إنه لا «طوعية» في ظل الحرب والحصار، وإن ذلك يخالف القانون الدولي وسيعزل إسرائيل في العالم."
      ru: "После начала войны был выдвинут план поощрять жителей Газы переселяться в другие страны, и правительство создало орган для этого. Сторонники говорят, что это гуманитарный ответ для разрушенного сектора и что желающие уехать должны иметь такую возможность; противники — что в условиях войны и блокады нет ничего «добровольного», что это нарушает международное право и изолирует Израиль в мире."
      es: "Desde la guerra se ha planteado un plan para fomentar que los habitantes de Gaza se trasladen a otros países, y el Gobierno creó un organismo para gestionarlo. Los partidarios dicen que es una respuesta humanitaria para una franja destruida y que quien quiera irse debería poder hacerlo; los opositores dicen que no hay nada «voluntario» bajo guerra y asedio, que viola el derecho internacional y aislaría a Israel en el mundo."
      fr: "Depuis la guerre, un plan visant à encourager les habitants de Gaza à partir vers d’autres pays a été avancé, et le gouvernement a créé un organisme pour s’en occuper. Les partisans disent que c’est une réponse humanitaire pour une bande détruite et que quiconque veut partir devrait le pouvoir ; les opposants disent qu’il n’y a rien de « volontaire » sous la guerre et le siège, que cela viole le droit international et isolerait Israël dans le monde."
    explainerSources:
      - { url: "https://www.haaretz.com/israel-news/2025-03-23/ty-article/.premium/israeli-government-approves-bureau-for-voluntary-emigration-of-palestinians-from-gaza/00000195-c2ed-dcee-a7b7-fffdc83c0000", title: "Israeli Government Approves Bureau for 'Voluntary Emigration' of Palestinians From Gaza", publisher: "Haaretz" }
      - { url: "https://www.ynetnews.com/article/hja2h92wfx", title: "Trump moved on, foreign governments refused: why Israel's 'voluntary Gaza migration' plan failed", publisher: "Ynetnews" }
    stances:
      otzma:
        value: 2
        basis: platform
        source: { url: "https://ozma-yeudit.co.il/%d7%99%d7%95%d7%b4%d7%a8-%d7%a2%d7%95%d7%a6%d7%9e%d7%94-%d7%99%d7%94%d7%95%d7%93%d7%99%d7%aa-%d7%94%d7%a9%d7%a8-%d7%91%d7%9f-%d7%92%d7%91%d7%99%d7%a8-%d7%9e%d7%a6%d7%99%d7%92-%d7%90%d7%aa-%d7%aa%d7%95/", title: "בן גביר מציג את תוכנית הדגל של עוצמה יהודית לקראת הבחירות ״התנתקות 710״ (2026-09-04)", publisher: "עוצמה יהודית" }
        quote:
          he: "\"תוכנית מדיניות להגירה מרצון של תושבי רצועת עזה למדינות שיסכימו לקלוט אותם… בממשלה הבאה, הקמת משרד הגירה, עם שר בראשו, תקציבים וסמכויות, תהיה בראש הדרישות הקואליציוניות שלנו.\""
          en: "\"A policy plan for the voluntary emigration of Gaza Strip residents to countries that agree to absorb them… In the next government, establishing an Emigration Ministry, with a minister, budgets and powers, will top our coalition demands.\""
          ar: "«خطة سياسات للهجرة الطوعية لسكان قطاع غزة إلى دول توافق على استيعابهم… في الحكومة القادمة، سيكون إنشاء وزارة للهجرة، برئاسة وزير وبميزانيات وصلاحيات، على رأس مطالبنا الائتلافية.»"
          ru: "«План политики добровольной эмиграции жителей сектора Газа в страны, согласные их принять… В следующем правительстве создание министерства эмиграции — с министром, бюджетами и полномочиями — будет главным из наших коалиционных требований»."
          es: "«Un plan de política para la emigración voluntaria de los habitantes de la Franja de Gaza a países que acepten acogerlos… En el próximo Gobierno, crear un Ministerio de Emigración, con un ministro, presupuestos y competencias, encabezará nuestras exigencias de coalición.»"
          fr: "« Un plan d’action pour l’émigration volontaire des habitants de la bande de Gaza vers des pays qui acceptent de les accueillir… Dans le prochain gouvernement, la création d’un ministère de l’Émigration, avec un ministre, des budgets et des pouvoirs, sera en tête de nos exigences de coalition. »"
      rz-zehut:
        value: 2
        basis: statement
        source: { url: "https://www.timesofisrael.com/smotrich-and-ben-gvir-rally-behind-trumps-gaza-emigration-idea/", title: "Smotrich and Ben Gvir rally behind Trump's Gaza emigration idea — Bezalel Smotrich (2025-01-27)", publisher: "The Times of Israel" }
        quote:
          he: "\"אין ספק שבטווח הארוך עידוד הגירה הוא הפתרון היחיד שיביא שלום וביטחון לתושבי ישראל ויקל גם על סבלם של תושבי עזה הערבים.\""
          en: "\"There is no doubt that, in the long term, encouraging emigration is the only solution that will bring peace and security to the residents of Israel and also ease the suffering of the Arab residents of Gaza.\""
          ar: "«لا شك في أن تشجيع الهجرة هو، على المدى البعيد، الحل الوحيد الذي سيجلب السلام والأمن لسكان إسرائيل ويخفّف أيضًا من معاناة السكان العرب في غزة.»"
          ru: "«Нет сомнений, что в долгосрочной перспективе поощрение эмиграции — единственное решение, которое принесёт мир и безопасность жителям Израиля и облегчит страдания арабских жителей Газы»."
          es: "«No cabe duda de que, a largo plazo, fomentar la emigración es la única solución que traerá paz y seguridad a los habitantes de Israel y aliviará también el sufrimiento de los habitantes árabes de Gaza.»"
          fr: "« Il ne fait aucun doute qu’à long terme, encourager l’émigration est la seule solution qui apportera la paix et la sécurité aux habitants d’Israël et soulagera aussi la souffrance des habitants arabes de Gaza. »"
      yisrael-beiteinu:
        value: 2
        basis: statement
        source: { url: "https://www.timesofisrael.com/liveblog_entry/liberman-welcomes-trump-proposal-to-relocate-gazans-backs-saudi-normalization-but-not-at-the-price-they-are-demanding/", title: "Liberman welcomes Trump proposal to relocate Gazans, backs Saudi normalization 'but not at the price they are demanding' (2025-02-03)", publisher: "The Times of Israel" }
        quote:
          he: "\"אני רוצה להודות לנשיא ארצות הברית על היוזמה שלו להעביר את אוכלוסיית עזה לחצי האי סיני.\""
          en: "\"I want to thank the US president for his initiative to transfer the population of Gaza to the Sinai Peninsula.\""
          ar: "«أريد أن أشكر رئيس الولايات المتحدة على مبادرته لنقل سكان غزة إلى شبه جزيرة سيناء.»"
          ru: "«Я хочу поблагодарить президента США за его инициативу переселить население Газы на Синайский полуостров»."
          es: "«Quiero agradecer al presidente de Estados Unidos su iniciativa de trasladar a la población de Gaza a la península del Sinaí.»"
          fr: "« Je veux remercier le président des États-Unis pour son initiative de transférer la population de Gaza dans la péninsule du Sinaï. »"
      amkha:
        value: 2
        basis: statement
        source: { url: "https://www.ynet.co.il/news/article/b13ajnsvml", title: "עופר וינטר: הפתרון בעזה הוא אחד - הגירה — נאום השקת עמך ישראל (2026-08-25)", publisher: "ynet" }
        quote:
          he: "\"הפיתרון בעזה הוא אחד: הגירה. אויב שיפתח נגדנו במלחמה ישלם מחיר טריטוריאלי כבד.\""
          en: "\"The solution in Gaza is one: emigration. An enemy that opens a war against us will pay a heavy territorial price.\""
          ar: "«الحل في غزة واحد: الهجرة. العدو الذي يفتح علينا حربًا سيدفع ثمنًا باهظًا من أرضه.»"
          ru: "«Решение в Газе одно: эмиграция. Враг, который начнёт против нас войну, заплатит тяжёлую территориальную цену»."
          es: "«La solución en Gaza es una: la emigración. Un enemigo que nos abra una guerra pagará un alto precio territorial.»"
          fr: "« La solution à Gaza est une seule : l’émigration. Un ennemi qui nous fait la guerre paiera un lourd prix territorial. »"
      reservists:
        value: 1
        basis: platform
        source: { url: "https://www.themiluimnikim.org.il/platform/", title: "עקרונות — המילואימניקים (עיקרי המצע, פרק ביטחון ומשילות: עזה)", publisher: "המילואימניקים" }
        quote:
          he: "\"הקמת מנהלת הגירה מרצון – לאפשר לתושבי עזה המעוניינים בכך להגר למדינות אחרות.\""
          en: "\"Establishing a voluntary-emigration directorate – to allow Gaza residents who wish to do so to emigrate to other countries.\""
          ar: "«إنشاء إدارة للهجرة الطوعية — لتمكين سكان غزة الراغبين في ذلك من الهجرة إلى دول أخرى.»"
          ru: "«Создание управления по добровольной эмиграции — чтобы дать жителям Газы, которые этого хотят, эмигрировать в другие страны»."
          es: "«Crear una dirección de emigración voluntaria para permitir a los habitantes de Gaza que lo deseen emigrar a otros países.»"
          fr: "« Créer une direction de l’émigration volontaire — pour permettre aux habitants de Gaza qui le souhaitent d’émigrer vers d’autres pays. »"
      likud:
        value: 1
        basis: statement
        source: { url: "https://www.timesofisrael.com/liveblog_entry/netanyahu-says-several-countries-close-to-agreeing-to-take-in-gazans-trump-something-good-will-happen/", title: "Netanyahu says several countries close to agreeing to take in Gazans; Trump: 'Something good will happen' — Benjamin Netanyahu at the White House (2025-07-08)", publisher: "The Times of Israel" }
        quote:
          he: "\"…לנשיא טראמפ היה חזון מבריק. קוראים לזה בחירה חופשית. מי שרוצה להישאר יכול להישאר, אבל מי שרוצה לעזוב צריך שיוכל לעזוב… אנחנו עובדים עם ארצות הברית… כדי למצוא מדינות.\""
          en: "\"…President Trump had a brilliant vision. It's called free choice. If people want to stay, they can stay; but if they want to leave, they should be able to leave… We're working with the United States… [to] find countries.\""
          ar: "«…كانت لدى الرئيس ترامب رؤية رائعة. اسمها حرية الاختيار. من يريد البقاء يمكنه البقاء، لكن من يريد المغادرة يجب أن يتمكّن من المغادرة… نحن نعمل مع الولايات المتحدة… [لـ]إيجاد دول.»"
          ru: "«…У президента Трампа было блестящее видение. Это называется свободой выбора. Кто хочет остаться — может остаться, но кто хочет уехать — должен иметь возможность уехать… Мы работаем с США… [чтобы] найти страны»."
          es: "«…El presidente Trump tuvo una visión brillante. Se llama libre elección. Si la gente quiere quedarse, puede quedarse; pero si quiere irse, debe poder irse… Trabajamos con Estados Unidos… [para] encontrar países.»"
          fr: "« …Le président Trump a eu une vision brillante. Cela s’appelle le libre choix. Ceux qui veulent rester peuvent rester ; mais ceux qui veulent partir doivent pouvoir partir… Nous travaillons avec les États-Unis… [pour] trouver des pays. »"
      blue-white:
        value: 1
        basis: statement
        source: { url: "https://www.timesofisrael.com/liveblog_entry/gantz-israel-has-nothing-to-lose-from-trumps-gaza-plan/", title: "Gantz: 'Israel has nothing to lose' from Trump's Gaza plan — Benny Gantz (2025-02-05)", publisher: "The Times of Israel" }
        quote:
          he: "\"הרעיון להקים אזורים בטוחים ומשגשגים לתושבי עזה מחוץ לרצועה ולאפשר למי שמעוניין בכך לעבור אליהם הוא ראוי להערכה… לישראל אין מה להפסיד מזה.\""
          en: "\"The idea of building safe and prosperous areas for the residents of Gaza outside the Strip and allowing those who wish to do so to move to them is admirable… Israel has nothing to lose from it.\""
          ar: "«فكرة إقامة مناطق آمنة ومزدهرة لسكان غزة خارج القطاع والسماح لمن يرغب بالانتقال إليها جديرة بالتقدير… ليس لدى إسرائيل ما تخسره من ذلك.»"
          ru: "«Идея создать для жителей Газы безопасные и процветающие районы за пределами сектора и позволить желающим туда переехать заслуживает уважения… Израилю нечего от этого терять»."
