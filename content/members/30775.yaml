    title:
      he: חברת הכנסת מטעם המחנה הממלכתי (כחול לבן)
      en: Member of Knesset for the National Unity (Blue and White) party
    description:
      he: יעל רון בן משה מכהנת כחברת הכנסת מטעם כחול לבן (המחנה הממלכתי). היא נכנסה
        לראשונה לכנסת ה-23 בדצמבר 2020 (במקומו של עפר שלח), כיהנה בכנסת ה-24,
        ושבה לכהן בכנסת ה-25 ב-8 ביולי 2025 לאחר התפטרותו של ח"כ מתן כהנא.
      en: Yael Ron Ben-Moshe serves as a Member of Knesset for Blue and White
        (National Unity). She first entered the 23rd Knesset in December 2020
        (replacing Ofer Shelah), served in the 24th Knesset, and returned to the
        25th Knesset on 8 July 2025 following the resignation of MK Matan
        Kahana.
    date: 2025-07-08
