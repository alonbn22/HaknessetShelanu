    title:
      he: הוצב במקום השביעי ברשימת ישראל ביתנו לכנסת ה-26
      en: Placed seventh on the Yisrael Beiteinu list for the 26th Knesset
    description:
      he: ב-6 בספטמבר 2026 הציג אביגדור ליברמן את רשימת ישראל ביתנו לבחירות 27 באוקטובר 2026, ועמאר הוצב בה במקום השביעי. עוד קודם לכן, ב-27 במאי 2026, הודיעה המפלגה כי עמאר הוא מועמדה לתפקיד השר לביטחון לאומי (ביטחון פנים) בממשלה הבאה.
      en: On 6 September 2026 Avigdor Liberman presented the Yisrael Beiteinu list for the 27 October 2026 election, with Amar placed seventh. Earlier, on 27 May 2026, the party had announced Amar as its candidate for Minister of Public Security in the next government.
