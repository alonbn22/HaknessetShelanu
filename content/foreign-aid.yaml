      url: "https://www.claimscon.org/"
  - kind: ngo-donations
    donor: { he: "ממשלות וגופים זרים (האיחוד האירופי ומדינות שונות)", en: "Foreign governments & bodies (EU and various states)", ar: "حكومات وهيئات أجنبية (الاتحاد الأوروبي ودول مختلفة)", ru: "Иностранные правительства и организации (ЕС и различные государства)", es: "Gobiernos y organismos extranjeros (la UE y varios Estados)", fr: "Gouvernements et organismes étrangers (UE et divers États)" }
    recipient: { he: "עמותות וארגוני חברה אזרחית בישראל", en: "Israeli NGOs & civil-society organizations", ar: "جمعيات ومنظمات مجتمع مدني في إسرائيل", ru: "Некоммерческие организации и организации гражданского общества в Израиле", es: "ONG y organizaciones de la sociedad civil israelíes", fr: "ONG et organisations de la société civile israéliennes" }
    amount: { he: "מיליוני שקלים בשנה (מדווח לרשם)", en: "Millions of NIS per year (reported to the Registrar)", ar: "ملايين الشواكل سنويًا (يُبلَّغ عنها للمسجِّل)", ru: "Миллионы шекелей в год (по отчётам регистратору)", es: "Millones de shékels al año (declarados al Registro)", fr: "Des millions de shekels par an (déclarés au Registre)" }
    period: { he: "מתמשך; דיווח רבעוני לפי חוק העמותות", en: "Ongoing; reported quarterly under the NGO law", ar: "مستمر؛ تقارير ربع سنوية بموجب قانون الجمعيات", ru: "На постоянной основе; ежеквартальная отчётность по закону о некоммерческих организациях", es: "En curso; declarado trimestralmente según la ley de asociaciones", fr: "En cours ; déclaré chaque trimestre selon la loi sur les associations" }
    purpose:
      he: "מימון פעילות של ארגוני חברה אזרחית מכל קצוות המפה (זכויות אדם, התיישבות, סביבה ועוד). החוק מחייב דיווח על תרומות מישות מדינית זרה — הפירוט לפי תורם וסכום מתפרסם אצל רשם העמותות ובגיידסטאר."
      en: "Funding civil-society organizations across the spectrum (human rights, settlements, environment, etc.). The law requires reporting donations from foreign political entities — the per-donor, per-amount detail is published by the Registrar and on GuideStar."
      ar: "تمويل نشاط منظمات مجتمع مدني من مختلف أطراف الطيف (حقوق الإنسان، الاستيطان، البيئة وغيرها). يُلزم القانون بالإبلاغ عن التبرعات من كيان سياسي أجنبي — ويُنشر التفصيل حسب المتبرّع والمبلغ لدى مسجّل الجمعيات وفي «غايدستار»."
      ru: "Финансирование деятельности организаций гражданского общества всего политического спектра (права человека, поселения, экология и др.). Закон требует отчитываться о пожертвованиях от иностранных государственных образований — разбивка по донорам и суммам публикуется у регистратора некоммерческих организаций и на GuideStar."
      es: "Financiación de organizaciones de la sociedad civil de todo el espectro (derechos humanos, asentamientos, medio ambiente, etc.). La ley exige declarar las donaciones de entidades políticas extranjeras — el detalle por donante e importe lo publican el Registro y GuideStar."
      fr: "Financement d’organisations de la société civile de tous bords (droits humains, implantations, environnement, etc.). La loi impose de déclarer les dons d’entités politiques étrangères — le détail par donateur et par montant est publié par le Registre et sur GuideStar."
    source:
      label: { he: "רשם העמותות / גיידסטאר", en: "Registrar of Non-Profits / GuideStar", ar: "مسجّل الجمعيات / غايدستار", ru: "Регистратор некоммерческих организаций / GuideStar", es: "Registro de Asociaciones / GuideStar", fr: "Registre des associations / GuideStar" }
      url: "https://www.guidestar.org.il/"
