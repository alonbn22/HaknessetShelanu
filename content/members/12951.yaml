    title:
      he: מכהן גם כשר העבודה, השר לשירותי דת ושר ירושלים ומסורת ישראל
      en: Also serves as Minister of Labor, Minister of Religious Services and Minister of Jerusalem and Jewish Tradition
    description:
      he: לצד כהונתו כשר המשפטים וסגן ראש הממשלה, אישרה הכנסת ב-24 בנובמבר 2025 את מינויו של לוין לשר העבודה, לשר לשירותי דת ולשר ירושלים ומסורת ישראל, לאחר שמשרדים אלה נותרו ללא שר בעקבות פרישת שרי ש"ס מהממשלה ביולי 2025 (מ-29 ביולי 2025 שימש לוין ממלא מקום שר העבודה והשר לשירותי דת, וכן ממלא מקום שר הפנים עד 24 בדצמבר 2025).
      en: Alongside his posts as Minister of Justice and Deputy Prime Minister, on 24 November 2025 the Knesset approved Levin's appointment as Minister of Labor, Minister of Religious Services and Minister of Jerusalem and Jewish Tradition, after those ministries were left without a minister following the Shas ministers' resignation from the government in July 2025 (from 29 July 2025 Levin had served as acting Minister of Labor and of Religious Services, and as acting Minister of the Interior until 24 December 2025).
