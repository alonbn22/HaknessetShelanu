      runsAs: own
      slug: raam
      note:
        he: "הרשימה הוגשה על ידי רשימת האיחוד הערבי; יואב סגלוביץ', לשעבר ח\"כ יש עתיד, במקום השני."
        en: "The list was submitted by the United Arab List; Yoav Segalovitz, formerly a Yesh Atid MK, is second."
      sources:
