  - kind: neutral
    category: news
    date: 2026-09-07
    title:
      he: הודיע על פרישה מכחול לבן – המחנה הממלכתי ערב סגירת הרשימות
      en: Announced he was leaving Blue and White – National Unity on the eve of the list deadline
    description:
      he: ב-7 בספטמבר 2026, יום לפני סגירת הרשימות לכנסת ה-26, הודיע ביטון על פרישה
        ממפלגתו של בני גנץ, שאליה השתייך מראשית דרכו הפוליטית, ומסר כי הוא שוקל
        הקמת מפלגה חברתית וכי "בשעות הקרובות אקבל החלטה על המשך דרכי הפוליטית".
        גנץ אישר כי סוכם שביטון לא ייכלל ברשימת כחול לבן. ברשימת כחול לבן שהוגשה
        ב-8 בספטמבר 2026 לא נכלל ביטון.
      en: On 7 September 2026, a day before the deadline for filing lists for the
        26th Knesset, Biton announced he was leaving Benny Gantz's party, to
        which he had belonged since the start of his political career, saying
        he was considering founding a social party and that he would decide on
        his political future "in the coming hours". Gantz confirmed it had
        been agreed that Biton would not be on the Blue and White list; the
        slate Blue and White filed on 8 September 2026 did not include him.
