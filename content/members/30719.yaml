        ופילוסופיה פוליטית במוסדות אקדמיים בישראל לפני כניסתו לפוליטיקה.
      en: In March 2019 the Central Elections Committee disqualified Cassif's
        candidacy, but the Supreme Court of Israel overturned the decision and
        allowed him to run. Cassif holds a PhD in political philosophy from the
        London School of Economics and taught political science and political
        philosophy at Israeli academic institutions before entering politics.
