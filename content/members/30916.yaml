      he: ייסוד מיזם "מחברים את ילדי ישראל" לצמצום הפער הדיגיטלי
      en: Founded the "Connecting Israel's Children" digital-gap initiative
      ar: تأسيس مبادرة لتقليص الفجوة الرقمية لدى أطفال إسرائيل
      ru: Основал инициативу по сокращению цифрового разрыва среди детей Израиля
    description:
      he: בשנת 2020 ייסד חיים את מיזם "מחברים את ילדי ישראל", שבמסגרתו חולקו אלפי מחשבים לילדים בתקופת מגפת הקורונה ולאחריה, במטרה לצמצם פערים דיגיטליים.
      en: In 2020 Haim founded the "Connecting Israel's Children" initiative, through which thousands of computers were distributed to children during and after the COVID-19 pandemic, aiming to reduce digital gaps.
      ar: في عام 2020 أسس حاييم مبادرة وُزّعت في إطارها آلاف أجهزة الحاسوب على الأطفال خلال جائحة كورونا وبعدها، بهدف تقليص الفجوات الرقمية.
      ru: В 2020 году Хаим основал инициативу, в рамках которой тысячи компьютеров были переданы детям во время пандемии COVID-19 и после неё с целью сокращения цифрового неравенства.
