    title:
      he: "נאום פרידה בכנסת ועמדה בנושא הגיוס"
      en: "Farewell speech in the Knesset and a stance on conscription"
    description:
      he: "ב-14 ביולי 2026 נשא מרגי נאום פרידה במליאת הכנסת לסיכום כהונתו. באותו יום נמסר כי אמר שלדעתו לא היה צריך להיות חוק לימוד תורה וכי כל מי שאינו לומד בישיבה צריך להתגייס."
      en: "On 14 July 2026 Margi delivered a farewell address in the Knesset plenum marking the end of his tenure. The same day he was reported as saying that, in his view, there should be no Torah-study law and that everyone who is not studying in a yeshiva should be drafted."
