    title:
      he: "חבר כנסת מטעם הליכוד ושר החינוך"
      en: "Likud Knesset member and Minister of Education"
    description:
      he: "קיש נבחר לכנסת מטעם הליכוד ב-2015. הוא כיהן כשר שיתוף פעולה אזורי, וב-29 בדצמבר 2022 התמנה לשר החינוך, תפקיד בו הוא ממשיך לכהן בממשלת המעבר. במרץ 2023 התפטר מהכנסת מכוח החוק הנורווגי ואינו חבר כנסת מכהן."
      en: "Kisch was elected to the Knesset for the Likud party in 2015. He served as Minister of Regional Cooperation, and on 29 December 2022 was appointed Minister of Education, a post he continues to hold in the caretaker government. In March 2023 he resigned his Knesset seat under the Norwegian Law and is not a sitting MK."
