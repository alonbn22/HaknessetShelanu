      ar: 'تصريح في لجنة الكنيست: "أفضّل القتلة اليهود على القتلة العرب"'
      ru: "Высказывание в комиссии Кнессета: «Я предпочитаю еврейских убийц арабским убийцам»"
    description:
      he: 'בדיון בוועדת הכנסת ב-9 בינואר 2023 על הצעת חוק לשלילת אזרחות ממחבלים המקבלים תשלומים מהרשות הפלסטינית, אמר מילביצקי לח"כ אחמד טיבי: "אני לא מרגיש שום צורך להצטדק על כך שאני, במדינה היהודית, מעדיף יהודים. כן, אחמד טיבי, רוצחים יהודים על רוצחים ערבים". הדברים עוררו ביקורת מצד חברי אופוזיציה.'
      en: 'During a January 9, 2023 Knesset House Committee debate on a bill to revoke the citizenship of terrorists receiving payments from the Palestinian Authority, Milwidsky told MK Ahmad Tibi: "I do not feel any need to justify myself for the fact that I, in the Jewish state, prefer Jews. Yes, Ahmad Tibi, Jewish murderers over Arab murderers." The remarks drew criticism from opposition lawmakers.'
