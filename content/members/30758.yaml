      he: "שובצה במקום החמישי ברשימת רע\"ם לבחירות 2026"
      en: "Placed fifth on the Ra'am list for the 2026 election"
    description:
      he: "ברשימת רע\"ם - הרשימה הערבית המאוחדת שהוגשה לוועדת הבחירות המרכזית לקראת הבחירות לכנסת ה-26 ב-27 באוקטובר 2026 שובצה ח'טיב יאסין במקום החמישי, אחרי מנסור עבאס, יואב סגלוביץ, וליד טאהא ווליד אלהואשלה."
      en: "On the Ra'am - United Arab List submitted to the Central Elections Committee for the 27 October 2026 election to the 26th Knesset, Khatib-Yassin was placed fifth, after Mansour Abbas, Yoav Segalovitz, Walid Taha and Walid al-Hawashla."
