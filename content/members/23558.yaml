    title:
      he: מוקם במקום ה-22 ברשימת הליכוד לבחירות 2026 לאחר הפריימריז
      en: Placed 22nd on the Likud list for the 2026 election after the primary
    description:
      he: בפריימריז הליכוד שנערכו ב-17 באוגוסט 2026 נבחר ביטן למקום ריאלי ברשימה; ברשימה הסופית שפורסמה ב-8 בספטמבר 2026, לאחר שיבוץ השריונים, הוא מוצב במקום ה-22.
      en: In the Likud primary held on 17 August 2026 Bitan won a realistic slot; in the final list published on 8 September 2026, after the reserved slots were placed, he is in 22nd place.
