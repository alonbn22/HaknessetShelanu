    title:
      he: ירוץ במקום הרביעי ברשימת יהדות התורה תחת מפלגה חדשה, "חומת תורת ישראל"
      en: To run fourth on the United Torah Judaism list under a new party, "Chomat Torat Yisrael"
    description:
      he: לקראת הבחירות לכנסת ה-26 (27 באוקטובר 2026) הוצב פרוש במקום הרביעי ברשימת יהדות התורה, אך לא מטעם אגודת ישראל אלא מטעם מפלגה חדשה בשם "חומת תורת ישראל" שהקים יחד עם אליקים שטרק (המקום השישי). לפי הדיווחים, זו הפעם הראשונה מאז 1992 שרשימת יהדות התורה כוללת מפלגה שלישית, והמהלך נועד להעניק לשניים עצמאות פוליטית ותקציבית מהחלטות אגודת ישראל.
      en: Ahead of the election to the 26th Knesset (27 October 2026), Porush was placed fourth on the United Torah Judaism list — not for Agudat Yisrael but for a new party named "Chomat Torat Yisrael" that he formed together with Eliakim Shtark (sixth place). According to reports, this is the first time since 1992 that the UTJ list includes a third party, and the move was meant to give the two political and budgetary independence from Agudat Yisrael's decisions.
    sources:
