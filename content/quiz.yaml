        source: { url: "https://knesset.gov.il/OdataV4/ParliamentInfo/KNS_PlenumVote(40922)", title: "הצעת חוק האקלים, התשפ\"ד-2024 (הצעת חוק ממשלתית) — הצבעה במליאה (קריאה ראשונה), 2024-04-03; והצבעה 44605 על הצעת חוק האקלים של האופוזיציה (קריאה טרומית), 2025-10-29", publisher: "הכנסת" }
        quote:
          he: "בעד הצעת חוק האקלים הממשלתית, שיעדיה ניתנים לשינוי בידי הממשלה (קריאה ראשונה, 3.4.2024: 5 בעד, 0 נגד, 2 נעדרו); נגד הצעת חוק האקלים של האופוזיציה עם יעדים מחייבים (קריאה טרומית, 29.10.2025: 0 בעד, 3 נגד, 4 נעדרו) — עמדה מעורבת על יעדים מחייבים בחוק"
          en: "for the government's Climate Bill, whose targets the government may change (first reading, 3 Apr 2024: 5 for, 0 against, 2 absent); against the opposition's Climate Bill with binding targets (preliminary reading, 29 Oct 2025: 0 for, 3 against, 4 absent) — a mixed record on binding targets in law"
          ar: "مع مشروع قانون المناخ الحكومي، الذي يجوز للحكومة تغيير أهدافه (قراءة أولى، 3 نيسان/أبريل 2024: مع: 5، ضد: 0، غائبون: 2)؛ ضد مشروع قانون المناخ الذي قدّمته المعارضة بأهداف ملزمة (قراءة تمهيدية، 29 تشرين الأول/أكتوبر 2025: مع: 0، ضد: 3، غائبون: 4) — سجلّ مختلط بشأن الأهداف الملزمة في القانون"
          ru: "за правительственный законопроект о климате, цели которого правительство может менять (первое чтение, 3.4.2024: за: 5, против: 0, отсутствовали: 2); против оппозиционного законопроекта о климате с обязательными целями (предварительное чтение, 29.10.2025: за: 0, против: 3, отсутствовали: 4) — неоднозначная позиция по обязательным целям в законе"
          es: "a favor del proyecto de ley del clima del Gobierno, cuyos objetivos puede cambiar el Gobierno (primera lectura, 3/4/2024: 5 a favor, 0 en contra, 2 ausentes); en contra del proyecto de ley del clima de la oposición con objetivos vinculantes (lectura preliminar, 29/10/2025: 0 a favor, 3 en contra, 4 ausentes) — un historial mixto sobre objetivos vinculantes en la ley"
          fr: "pour le projet de loi climat du gouvernement, dont le gouvernement peut modifier les objectifs (première lecture, 3/4/2024 : 5 pour, 0 contre, 2 absents) ; contre le projet de loi climat de l’opposition aux objectifs contraignants (lecture préliminaire, 29/10/2025 : 0 pour, 3 contre, 4 absents) — un bilan mitigé sur des objectifs contraignants dans la loi"
