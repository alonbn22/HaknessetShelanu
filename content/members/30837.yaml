    title:
      he: "הודיעה כי לא תתמודד ברשימת יש עתיד לכנסת ה-26"
      en: "Announced she will not run on the Yesh Atid list for the 26th Knesset"
    description:
      he: "ב-1 בספטמבר 2026 הודיעה ביטון כי לא תתמודד ברשימת יש עתיד (במסגרת הרשימה המשותפת \"ביחד\" עם נפתלי בנט) בבחירות לכנסת ה-26, לאחר שעדכנה על כך את יו\"ר המפלגה יאיר לפיד. היא הדגישה כי היא נשארת חברה ביש עתיד ומחויבת לדרכה, וכי תמשיך לקדם את הנושאים שבהם עסקה בכנסת."
      en: "On 1 September 2026 Biton announced that she would not run on the Yesh Atid list (within the joint \"Beyachad\" list with Naftali Bennett) in the election for the 26th Knesset, having informed party chairman Yair Lapid of her decision. She stressed that she remains a member of Yesh Atid, committed to its path, and would continue promoting the issues she worked on in the Knesset."
