        חיפוש במשרדי המשרד בירושלים ותפסו מסמכים. רגב הכחישה כל עוול. ממצאי
        החקירה הועברו לפרקליטות המדינה להכרעה אם להגיש כתב אישום; על פי דיווחים
        בתקשורת הסיכוי להגשת כתב אישום נמוך. טרם הוגש כתב אישום, ויש לראות
        בעניין חשד בלבד שטרם הוכרע.
      en: In June 2024, at the direction of Israel's attorney general, the Lahav 433
        unit opened a criminal investigation on suspicion of fraud and breach of
        trust over budget allocations at the Transport Ministry, following a
        media report alleging that localities politically linked to Regev were
        favored. Investigators searched the ministry's Jerusalem offices and
        seized documents. Regev denied any wrongdoing. The investigation's
        findings were transferred to the State Attorney's Office for a decision
        on whether to file charges; media reports indicated an indictment was
        unlikely. No indictment has been filed, and the matter remains an
        unadjudicated suspicion.
