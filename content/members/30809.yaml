    date: "2025-12-08"
    title:
      he: "יושבת ראש הוועדה המיוחדת לדיון בהצעת חוק התקשורת"
      en: "Chair of the Special Committee on the Communications Bill"
    description:
      he: "בסוף נובמבר 2025 הקימה הקואליציה ועדה מיוחדת לקידום הצעת חוק התקשורת של השר שלמה קרעי, ודיסטל אטבריאן מונתה ליושבת הראש שלה; הישיבה הראשונה התקיימה ב-8 בדצמבר 2025. קודם לכן, ביוני 2025, עמדה בראש ועדת המשנה של ועדת החינוך למחשבת ישראל במערכת החינוך."
      en: "In late November 2025 the coalition set up a special committee to advance Communications Minister Shlomo Karhi's media bill, with Distel Atbaryan appointed as its chair; its first session was held on 8 December 2025. Earlier, in June 2025, she chaired the Education Committee's subcommittee on Jewish thought in the education system."
