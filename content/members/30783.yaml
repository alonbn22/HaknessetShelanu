  - kind: positive
    category: achievement
    title:
      he: פעילות למען רווחת בעלי חיים בכנסת
      en: Animal welfare advocacy in the Knesset
    description:
      he: פרידמן, פעילה ותיקה למען זכויות בעלי חיים, השיקה בכנסת שדולה לרווחת בעלי
        החיים שמטרתה לקדם נושאים מגוונים, מעיקור חתולי רחוב ועד הפסקת ייבוא בעלי
        חיים חיים לפיטום ולשחיטה. לפי דיווח 'טיימס אוף ישראל', היא פעלה להבטחת
        תקציב נוסף של כ-12 מיליון ש"ח לטיפול, עיקור וסירוס חתולי רחוב.
      en: Fridman, a longtime animal rights activist, launched a Knesset caucus for
        animal welfare aimed at advancing a range of issues, from spaying street
        cats to ending the live shipment of animals for fattening and slaughter.
        According to The Times of Israel, she secured an additional roughly NIS
        12 million to treat, neuter and spay street cats.
    sources:
