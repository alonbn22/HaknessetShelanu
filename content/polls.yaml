    reason:
      he: "רשום באינדקס הסקרים של 'המדד' (24.9.2026, סוקר: יצחק כץ), אך שודר בלבד; באתר הערוץ יש רק וידאו, ולא נמצא פרסום כתוב או גרפי שאפשר לקשר אליו — אותו כלל כמו לסקרים הקודמים של הערוץ. דיווח המכון לוועדה מ-29.9 (מס' 4173) חוזר על המנדטים שלו בטור השוואה, אך דיווח משלו — עם המדגם והמועדים — לא נמצא עד 30.9.2026."
      en: "Indexed by HaMadad's poll archive (24 Sep 2026, pollster: Yitzhak Katz) but broadcast only; the channel's site carries only video, and no linkable written or graphic publication was found — the same rule as for the channel's earlier polls. The institute's 29 Sep filing (no. 4173) repeats its seat figures in a comparison column, but no filing of its own, with its sample and dates, was found as of 30 Sep 2026."
      ar: "مُدرج في أرشيف استطلاعات «هامداد» (24 أيلول/سبتمبر 2026، جهة الاستطلاع: يتسحاق كاتس) لكنه بُثّ فقط؛ موقع القناة يعرض الفيديو فقط، ولم يُعثر على منشور مكتوب أو رسومي يمكن ربطه — القاعدة نفسها كما في استطلاعات القناة السابقة. يكرّر تقرير المعهد إلى اللجنة في 29 أيلول/سبتمبر (رقم 4173) أرقام مقاعده في عمود للمقارنة، لكن لم يُعثر حتى 30 أيلول/سبتمبر 2026 على تقرير خاص به يتضمن العيّنة والمواعيد."
      ru: "Указан в архиве опросов «ХаМадад» (24.09.2026, социолог: Ицхак Кац), но только показан в эфире; на сайте канала есть только видео, письменной или графической публикации, на которую можно сослаться, не найдено — то же правило, что и для прежних опросов канала. Отчёт института от 29 сентября (№ 4173) повторяет его цифры мандатов в столбце для сравнения, но собственного отчёта с выборкой и датами на 30.09.2026 не найдено."
      es: "Indexada en el archivo de encuestas de HaMadad (24 de septiembre de 2026, encuestador: Yitzhak Katz) pero solo emitida; el sitio del canal solo ofrece vídeo y no se encontró ninguna publicación escrita o gráfica enlazable — la misma regla que para las encuestas anteriores del canal. El informe del instituto del 29 de septiembre (n.º 4173) repite sus escaños en una columna de comparación, pero al 30 de septiembre de 2026 no se encontró un informe propio con su muestra y fechas."
      fr: "Indexé dans les archives de sondages de HaMadad (24 septembre 2026, sondeur : Yitzhak Katz) mais seulement diffusé ; le site de la chaîne ne propose que de la vidéo et aucune publication écrite ou graphique vers laquelle faire un lien n’a été trouvée — même règle que pour les sondages précédents de la chaîne. La déclaration de l’institut du 29 septembre (n° 4173) reprend ses sièges dans une colonne de comparaison, mais aucune déclaration propre, avec son échantillon et ses dates, n’avait été trouvée au 30 septembre 2026."
