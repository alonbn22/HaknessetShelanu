      en: Under the coalition agreement signed on 27 November 2022, Maoz was appointed
        a deputy minister in the Prime Minister's Office, heading a new National
        Jewish Identity Authority and overseeing Nativ. The appointment took
        effect in early 2023. He resigned from the role twice — in March 2023
        and again on 24 March 2025 — saying the coalition agreement had not been
        honored.
