      en: First woman to run for chair of the Israel Bar Association
    description:
      he: לפני כניסתה לפוליטיקה עסקה גוטליב בעריכת דין. בהתמודדות על ראשות לשכת עורכי
        הדין בישראל בשנת 2015 הייתה לאישה הראשונה שהציגה מועמדות לתפקיד, אם כי
