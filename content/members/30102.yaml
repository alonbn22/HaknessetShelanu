      en: Law requiring the security forces to report sexual harassment to the Knesset (2025)
    description:
      he: ב-10 בדצמבר 2025 אישרה מליאת הכנסת בקריאה שנייה ושלישית את הצעת החוק של בן
        ארי המחייבת את צה"ל, משטרת ישראל ושירות בתי הסוהר לדווח אחת לשנה
        לוועדות הכנסת על מספר ההטרדות המיניות בשורותיהם ועל דרכי הטיפול בהן.
      en: On 10 December 2025 the Knesset plenum passed, in its second and third
        readings, Ben-Ari's bill requiring the IDF, the Israel Police and the
        Prison Service to report annually to Knesset committees on the number
        of sexual-harassment cases in their ranks and how they were handled.
