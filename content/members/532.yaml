      he: "הודח מראשות ועדת החוץ והביטחון והוחלף בבועז ביסמוט"
      en: "Removed as chair of the Foreign Affairs and Defense Committee, replaced by Boaz Bismuth"
    description:
      he: "ב-23 ביולי 2025 בחרה סיעת הליכוד ברוב של 29 מול 4 בבועז ביסמוט ליו\"ר ועדת החוץ והביטחון במקום אדלשטיין, על רקע המחלוקת על חוק הגיוס לחרדים: אדלשטיין סירב לקדם נוסח שלפי הדיווחים היה פוטר את רוב הגברים החרדים משירות. ב-29 באוקטובר 2025 הודיע הליכוד כי הוא מוצא גם מחברות בוועדה בשל הצבעה בניגוד לעמדת הסיעה, וטלי גוטליב החליפה אותו."
      en: "On 23 July 2025 the Likud faction voted 29–4 to install Boaz Bismuth as chair of the Foreign Affairs and Defense Committee in place of Edelstein, amid the dispute over the Haredi conscription bill: Edelstein had refused to advance a version that reports said would exempt most Haredi men from service. On 29 October 2025 Likud announced he was also being removed from the committee's membership for voting against the faction line, and Tally Gotliv replaced him."
