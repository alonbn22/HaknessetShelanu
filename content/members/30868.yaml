  - kind: positive
    category: achievement
    title:
      he: יזם והעביר את חוק ניוד מידע רפואי ואת הרחבתו
      en: Initiated and passed the Medical Information Portability Law and its extension
    description:
      he: >-
        ב-22 ביולי 2024 אישרה מליאת הכנסת בקריאה שנייה ושלישית את חוק ניוד מידע
        רפואי, התשפ"ד-2024, שיזם מישרקי כיושב-ראש ועדת הבריאות, המאפשר לכל מטופל
        להעביר את המידע הרפואי שלו בין קופות החולים, בתי החולים ומשרד הבריאות
        בהסכמתו. ב-1 ביולי 2025 אושרה בקריאה שנייה ושלישית הרחבת החוק, שהוביל,
        המחברת למערכת גם את המוסד לביטוח לאומי, חיל הרפואה של צה"ל, שירות בתי
        הסוהר ומשרדי ממשלה נוספים; לפי הדיווח, ההרחבה אושרה פה אחד בוועדת
        הבריאות ללא הסתייגויות.
      en: >-
        On 22 July 2024 the Knesset plenum passed in second and third readings the
        Medical Information Portability Law, 5784-2024, initiated by Mishriki as
        Health Committee chairman, which lets every patient transfer their medical
        records between health funds, hospitals and the Health Ministry with their
        consent. On 1 July 2025 an extension he led passed its second and third
        readings, connecting the National Insurance Institute, the IDF Medical
        Corps, the Prison Service and other government bodies to the system; it
        was reported to have passed the Health Committee unanimously without
        reservations.
    date: "2025-07-01"
