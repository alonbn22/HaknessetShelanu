      he: "יהדות התורה (7) פרשה מהממשלה ומהקואליציה בשל חוק הגיוס; מאז — 60 מול 60, עד פיזור הכנסת ב-17 ביולי 2026."
      en: "UTJ (7) left the government and the coalition over the draft law; since then — 60 against 60, until the Knesset dispersed on 17 July 2026."
      es: "Judaísmo Unido de la Torá (7) dejó el Gobierno y la coalición por la ley del servicio militar; desde entonces — 60 frente a 60, hasta la disolución de la Knéset el 17 de julio de 2026."
      fr: "Le Judaïsme unifié de la Torah (7) a quitté le gouvernement et la coalition à cause de la loi sur la conscription ; depuis — 60 contre 60, jusqu’à la dissolution de la Knesset le 17 juillet 2026."
