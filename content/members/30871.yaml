      en: Shelly Tal Meron entered the Knesset on 1 February 2023 as a member of the
        25th Knesset for the Yesh Atid party, following the resignation of Yoel
        Razvozov. She previously served six years in the Israeli Air Force in
        roles including spokesperson, flight instructor and officer, and later
        worked for a technology company.
