    description:
      he: כיו"ר השדולה הגאה בכנסת, להב-הרצנו פעל לקידום חקיקה שמכירה רשמית בבני זוג
        מאותו מין של חיילי צה"ל שנפלו, ומעניקה להם מעמד של בן/בת זוג. החקיקה
        קודמה בעקבות נפילתו של סרן סגי גולן, שנהרג בקיבוץ בארי באוקטובר 2023.
      en: As chair of the Knesset's LGBTQ+ caucus, Lahav-Hertzanu helped advance
        legislation formally recognizing same-sex partners of fallen IDF
        soldiers, granting them spousal status. The measure followed the death
        of Capt. Sagi Golan, killed at Kibbutz Be'eri in October 2023.
