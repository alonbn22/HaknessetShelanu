    title:
      he: "הציג את נציגי יש עתיד ברשימה המשותפת; שישה ח\"כים מכהנים לא התמודדו"
      en: "Presented Yesh Atid's representatives on the joint slate; six sitting MKs did not run"
    description:
      he: "ב-5 בספטמבר 2026 הציג לפיד את נציגי יש עתיד שישתלבו ברשימת \"ביחד\", ובראשם מירב בן ארי, נעם תיבון ומירב כהן. בימים שקדמו לכך הודיעו שישה חברי כנסת מכהנים מהמפלגה — ובהם מאיר כהן, מיקי לוי וקארין אלהרר — כי לא יתמודדו, על רקע סקרים שהראו ירידה ברשימה המשותפת. לפיד אמר על כהן: \"זו לא פרידה... ביקשתי ממנו להתמודד במקום גבוה גם הפעם\"."
      en: "On 5 September 2026 Lapid presented the Yesh Atid representatives who would be integrated into the \"B'Yachad\" slate, led by Merav Ben-Ari, Noam Tibon and Meirav Cohen. In the preceding days six sitting Yesh Atid MKs — including Meir Cohen, Mickey Levy and Karine Elharrar — announced they would not run, amid polls showing the joint slate declining. Lapid said of Cohen: \"This is not a farewell... I asked him to run in a top spot this time as well.\""
