    title:
      he: מונתה לשרה לקידום מעמד האישה ולשרה לשוויון חברתי
      en: Appointed government minister (Women's Advancement, then Social Equality)
    description:
      he: מאי גולן, חברת הכנסת מטעם הליכוד שנבחרה בבחירות 2022, מונתה במאי 2023 לשרה לקידום מעמד האישה. בינואר 2024 אישרה מליאת הכנסת את מינויה לשרה לשוויון חברתי, לאחר שמשרד קידום מעמד האישה צורף למשרד השוויון החברתי.
      en: May Golan, a Likud Knesset member elected in the 2022 elections, was appointed Minister for the Advancement of Women's Status in May 2023. In January 2024 the Knesset plenum approved her appointment as Minister of Social Equality, after the Women's Advancement Ministry was folded into the Social Equality Ministry.
    date: 2024-01-21
