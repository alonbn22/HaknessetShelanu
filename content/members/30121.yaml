      he: עימות בחירות מול ח"כ מלכיאלי בנושא גיוס חרדים ויוקר המחיה
      en: Election debate with MK Malkieli on Haredi conscription and the cost of living
    description:
      he: ב-4 באוגוסט 2026, ב"זירת הבחירות" של ynet, התעמת פורר עם ח"כ מיכאל מלכיאלי
        מש"ס. פורר טען כי אי-גיוס החרדים אינו צודק, קרא לשירות חובה לכולם ומתח
        ביקורת על מה שכינה "חוק ההשתמטות" שקידמה הממשלה, וכן על עליית יוקר המחיה.
      en: On 4 August 2026, in ynet's "Election Arena", Forer debated Shas MK Michael
        Malkieli. Forer argued that the non-conscription of Haredim is unjust,
        called for mandatory service for all, and criticized what he called the
        government's "evasion law" as well as the rising cost of living.
