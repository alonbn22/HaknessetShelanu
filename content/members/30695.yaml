    title:
      he: הצטרף לרשימת רע"ם לבחירות 2026 במקום השני
      en: Joined the Ra'am list for the 2026 election in second place
    description:
      he: "ב-31 באוגוסט 2026 הודיע יו\"ר רע\"ם מנסור עבאס על צירופו של סגלוביץ' לרשימת המפלגה לבחירות 27 באוקטובר, במקום השני, כמועמד יחיד ולא כסיעה נפרדת. סגלוביץ' אמר כי הטענה שאחרי 7 באוקטובר לא ניתן לקיים שותפות עם מפלגות ערביות היא \"מופרכת ושקרית\", וכי \"אין דרך להוביל שינוי במדינה בלי חיבור\"."
      en: "On 31 August 2026 Ra'am chairman Mansour Abbas announced that Segalovich was joining the party's list for the 27 October election in second place, as an individual candidate rather than a separate faction. Segalovich said the claim that partnership with Arab parties is impossible after 7 October is \"absurd and false,\" and that \"there is no way to lead change in the country without connection.\""
