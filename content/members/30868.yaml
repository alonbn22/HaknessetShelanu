      en: Jonathan (Yoni) Misharki, born in Jerusalem on 17 August 1984, entered the
        25th Knesset on 3 January 2023 as a Shas party representative under the
        Norwegian Law, replacing Minister Yoav Ben-Tzur. Before the Knesset he
        held advisory and administrative posts in the Jerusalem municipal arena.
