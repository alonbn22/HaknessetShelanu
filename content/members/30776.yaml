    title:
      he: "רואה חשבון מוסמך ובעל תואר שני במשפטים"
      en: "Certified public accountant with a master's degree in law"
    description:
      he: "בליאק, יליד קמרובו שבסיביר (1973), עלה לישראל בדצמבר 1998. לפני כניסתו לפוליטיקה היה רואה חשבון מוסמך (משנת 2005), שותף במשרד רואי חשבון (משנת 2006) ויועץ ליזמות עסקית במשרד העלייה והקליטה (2010–2019). הוא בעל תואר ראשון בחשבונאות מאוניברסיטת תל אביב ותואר שני במשפטים מאוניברסיטת בר-אילן (2008)."
      en: "Beliak, born in Kemerovo, Siberia (1973), immigrated to Israel in December 1998. Before entering politics he was a certified public accountant (licensed 2005), a partner in an accounting firm (from 2006) and a business-entrepreneurship adviser at the Ministry of Immigrant Absorption (2010–2019). He holds a BA in accounting from Tel Aviv University and a master's degree in law from Bar-Ilan University (2008)."
