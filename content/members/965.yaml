      he: הכנסת ה-25 התפזרה; הבחירות נקבעו ל-27 באוקטובר 2026
      en: The 25th Knesset dissolved; election set for 27 October 2026
    description:
      he: בלילה שבין 16 ל-17 ביולי 2026 אישרה הכנסת ברוב של 62 ללא מתנגדים את פיזורה וקבעה את מועד הבחירות ל-27 באוקטובר 2026; נתניהו הצביע בעד. הממשלה בראשותו מכהנת מאז כממשלת מעבר.
      en: Overnight on 16-17 July 2026 the Knesset approved its dissolution 62-0 and set the election for 27 October 2026; Netanyahu voted in favor. His government has served as a caretaker government since.
