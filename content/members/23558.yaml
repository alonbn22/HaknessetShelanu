    title:
      he: כתב אישום בעבירות שוחד והליך משפטי מתמשך
      en: Indictment on bribery charges and ongoing trial
    description:
      he: ביולי 2021 אישר היועץ המשפטי לממשלה הגשת כתב אישום נגד ביטן בגין שבעה
        אישומים שכללו עבירות של שוחד, מרמה והפרת אמונים, הלבנת הון ועבירות מס,
        בהיקף של כ-715,000 ש"ח, מהתקופה בה כיהן כסגן ראש עיריית רישון לציון
        וכחבר כנסת. ביטן כופר בכל המיוחס לו. המשפט מתנהל בבית המשפט המחוזי בלוד,
        ובספטמבר 2025 העיד ביטן לראשונה והכחיש כי קיבל שוחד. ההליך טרם הוכרע
        וחזקת החפות עומדת לו.
      en: In July 2021 Israel's Attorney-General approved an indictment against Bitan
        on seven counts including bribery, fraud and breach of trust, money
        laundering and tax offenses, totaling roughly NIS 715,000, relating to
        his tenure as Deputy Mayor of Rishon LeZion and as a Member of Knesset.
        Bitan denies all charges. The trial is being heard at the Lod District
        Court, and in September 2025 he took the stand for the first time,
        denying that he received bribes. The case has not been adjudicated and
        he is presumed innocent.
