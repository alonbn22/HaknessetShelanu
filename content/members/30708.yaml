        חברתי, לאחר שמשרד קידום מעמד האישה צורף למשרד השוויון החברתי.
      en: May Golan, a Likud Knesset member elected in the 2022 elections, was
        appointed Minister for the Advancement of Women's Status in May 2023. In
        January 2024 the Knesset plenum approved her appointment as Minister of
        Social Equality, after the Women's Advancement Ministry was folded into
        the Social Equality Ministry.
