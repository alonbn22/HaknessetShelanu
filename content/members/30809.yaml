    title:
      he: "כיהנה כשרת ההסברה בממשלה ה-37"
      en: "Served as Minister of Public Diplomacy in the 37th government"
    description:
      he: "דיסטל אטבריאן מונתה בדצמבר 2022 לשרה במשרד ראש הממשלה, וב-17 בינואר 2023 קיבלה את משרד ההסברה. ב-12 באוקטובר 2023, בתחילת המלחמה, הודיעה על התפטרותה מהתפקיד בנימוק שכל יום נוסף של פעילות המשרד הוא \"בזבוז של כספי ציבור\". כעשרה ימים לאחר מכן החליטה הממשלה לסגור את המשרד ולהעביר את תקציבו, 23.8 מיליון ש\"ח, למנהלת השיקום של יישובי עוטף עזה."
      en: "Distel Atbaryan was appointed a minister in the Prime Minister's Office in December 2022 and took over the Public Diplomacy Ministry on 17 January 2023. On 12 October 2023, at the outset of the war, she announced her resignation from the post, saying that every further day of the ministry's operation was \"a waste of public funds\". About ten days later the government decided to close the ministry and transfer its NIS 23.8 million budget to the rehabilitation authority for the Gaza-border communities."
    date: "2023-01-17"
