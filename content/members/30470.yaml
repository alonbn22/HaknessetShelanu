      en: "Acting Minister of Interior and Jerusalem city councilman"
    description:
      he: "מלכיאלי כיהן כשר הפנים בפועל בין ינואר לאפריל 2023, בעקבות הדחתו של אריה דרעי. קודם לכניסתו לכנסת נבחר בשנת 2013 למועצת עיריית ירושלים, שם החזיק בתיק הספורט החרדי."
      en: "Malchieli served as acting Minister of Interior between January and April 2023, following the dismissal of Aryeh Deri. Before entering the Knesset, he was elected to the Jerusalem City Council in 2013, where he held the ultra-Orthodox sports portfolio."
