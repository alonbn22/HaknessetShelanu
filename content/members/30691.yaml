    title:
      he: מנכ"ל המשרד למודיעין והמשרד לעניינים אסטרטגיים
      en: Director-General of the Ministries of Intelligence and Strategic Affairs
    description:
      he: בן ברק כיהן כמנכ"ל המשרד לשירותי מודיעין וכמנכ"ל המשרד לעניינים אסטרטגיים,
        לאחר שירותו הבכיר במוסד. הוא החל את שירותו הצבאי ב-1976 ושירת כלוחם
        וכקצין ביחידת סיירת מטכ"ל.
      en: Ben-Barak served as director-general of both the Ministry of Intelligence
        Services and the Ministry of Strategic Affairs. He began his military
        career in 1976, serving as a combat soldier and officer in the elite
        Sayeret Matkal commando unit.
