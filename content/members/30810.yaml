  - kind: positive
    category: achievement
    title:
      he: "כיהנה כסגנית שר האוצר (2023)"
      en: "Served as Deputy Minister of Finance (2023)"
    description:
      he: "לאחר הבחירות לכנסת ה-25 מונתה וולדיגר לסגנית שר האוצר בממשלה ה-37, תחת שר האוצר בצלאל סמוטריץ' (על פי רישומי הכנסת, מ-3 בינואר 2023). ב-26 באוקטובר 2023 הודיעה על התפטרותה מהתפקיד ועל הפניית תקציב לשכתה וזמנה למאמץ המלחמתי ולסיוע לנפגעי מתקפת 7 באוקטובר."
      en: "Following the 2022 election, Waldiger was appointed Deputy Minister of Finance in the 37th government, under Finance Minister Bezalel Smotrich (per Knesset records, from 3 January 2023). On 26 October 2023 she announced her resignation from the post, redirecting her office's budget and her own time to the war effort and to aiding those affected by the 7 October attack."
    date: "2023-10-26"
