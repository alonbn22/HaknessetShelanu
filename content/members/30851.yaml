    title:
      he: דוקטורט בגנטיקה של צמחים וקריירה במחקר חקלאי
      en: PhD in plant genetics and career in agricultural research
    description:
      he: בעלת תואר ראשון ודוקטורט מהאוניברסיטה העברית בירושלים, עם דוקטורט בגנטיקה של
        צמחים (1992). עבדה כחוקרת ומפתחת זני צמחים, ולאחר מכן בשיווק מוצרים,
        בחברת הזרעים הזרע (Hazera) טרם כניסתה לחיים הציבוריים.
      en: Holds a bachelor's degree and a PhD from the Hebrew University of Jerusalem,
        with a doctorate in plant genetics (1992). She worked as a researcher
        and plant-variety developer, and later in product marketing, at the seed
        company Hazera before entering public life.
