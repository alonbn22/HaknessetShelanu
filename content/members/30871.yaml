    title:
      he: השקת שדולה בין-מפלגתית למען שחרור החטופים
      en: Co-launched a cross-party Knesset lobby for the release of hostages
    description:
      he: ביחד עם ח"כ בועז ביסמוט (הליכוד) השיקה טל מירון שדולה בין-מפלגתית בכנסת
        לקידום שחרורם של החטופים המוחזקים בידי חמאס ברצועת עזה. הישיבה הראשונה
        התקיימה ב-9 בינואר 2024 בהשתתפות כ-20 חברי כנסת ושרים ושגרירים, וכללה
        עדות של חטופה ששוחררה ושל בני משפחות חטופים.
      en: Together with MK Boaz Bismuth (Likud), Tal Meron co-launched a cross-party
        Knesset lobby to advance the release of hostages held by Hamas in the
        Gaza Strip. Its first hearing was held on 9 January 2024, attended by
        about 20 lawmakers and ministers as well as ambassadors, and featured
        testimony from a freed hostage and from hostage families.
