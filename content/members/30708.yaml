    date: 2026-06-10
    title:
      he: חקירה פלילית בחשד לשוחד, מרמה והפרת אמונים – המשטרה המליצה להעמיד לדין
      en: Criminal investigation over alleged bribery, fraud and breach of trust – police recommend indictment
      ar: تحقيق جنائي في شبهة رشوة واحتيال وخيانة الأمانة – الشرطة توصي بتقديم لائحة اتهام
      ru: Уголовное расследование по подозрению в взятках, мошенничестве и злоупотреблении доверием – полиция рекомендует предъявить обвинение
    description:
      he: ב-10 ביוני 2026 הודיעה משטרת ישראל (להב 433) כי סיימה את החקירה בעניינה של השרה מאי גולן וגיבשה תשתית ראייתית להמלצה על הגשת כתב אישום בעבירות שוחד, מרמה והפרת אמונים ועבירות נוספות, והתיק הועבר לפרקליטות. לפי הדיווחים האחרונים שאותרו (יוני 2026) טרם הוגש כתב אישום, וההחלטה בעניין נתונה ליועצת המשפטית לממשלה בכפוף לשימוע; לפי ynet, גולן לא התייצבה לחקירות באזהרה שאליהן זומנה. גולן דוחה את החשדות וטוענת כי מדובר ברדיפה פוליטית.
      en: On 10 June 2026 Israel Police's National Fraud Investigation Unit (Lahav 433) announced it had completed its investigation of Minister May Golan, concluding there was a sufficient evidentiary basis to recommend indicting her for bribery, fraud and breach of trust and additional offenses, and transferred the case to the State Attorney. According to the latest reports located (June 2026) no indictment has been filed; the decision rests with the Attorney General, subject to a hearing. According to Ynet, Golan did not appear for the questioning under caution to which she was summoned. Golan denies the allegations and has called the case political persecution.
