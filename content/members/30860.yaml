      he: "האישה הראשונה שהתמודדה על ראשות לשכת עורכי הדין"
      en: "First woman to run for chair of the Israel Bar Association"
    description:
      he: "לפני כניסתה לפוליטיקה עסקה גוטליב בעריכת דין. בהתמודדות על ראשות לשכת עורכי הדין בישראל בשנת 2015 הייתה לאישה הראשונה שהציגה מועמדות לתפקיד, אם כי לא נבחרה."
      en: "Before entering politics, Gotliv worked as a lawyer. In her 2015 bid for the chairmanship of the Israel Bar Association she became the first woman to run for the office, although she was not elected."
