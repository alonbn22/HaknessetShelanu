    title:
      he: "קריירה משפטית בסיוע המשפטי למען נוער בסיכון וקטינים"
      en: "Legal career in public legal aid for at-risk youth and minors"
    description:
      he: "ביטון, בעלת תואר שני במשפטים והוסמכה כעורכת דין ב-2008, עבדה החל מאותה שנה ועד היבחרה לכנסת בלשכת הסיוע המשפטי במחוז הדרום. במסגרת תפקידה ייצגה נוער בסיכון וקטינים, שימשה אפוטרופוס לדין בהליכי כשרות משפטית וייצגה הורים בהליכי הוצאת ילדים מהבית."
      en: "Biton, who holds a master's degree in law and was licensed as an attorney in 2008, worked from that year until her election to the Knesset at the Southern District Legal Aid Bureau. In that role she represented at-risk youth and minors, served as a court-appointed guardian ad litem in legal-capacity proceedings, and represented parents in child-removal proceedings."
