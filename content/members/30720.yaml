    title:
      he: מתנדב בצה"ל ובוגר תארים במשפטים והיסטוריה
      en: IDF volunteer and graduate in law and history
    description:
      he: לאחר שקיבל פטור מטעמי בריאות, התנדב להב-הרצנו לשירות בצה"ל ושירת כשש שנים.
        הוא בעל תואר ראשון משולב במשפטים ובהיסטוריה של המזרח התיכון ואפריקה
        מאוניברסיטת תל אביב, ותואר שני למנהלים במשפט ציבורי מאוניברסיטת תל אביב
        ונורת'ווסטרן.
      en: After receiving a medical exemption, Lahav-Hertzanu volunteered for the IDF
        and served about six years. He holds a combined LLB and BA in Middle
        Eastern and African history from Tel Aviv University and an executive
        master's of law in public law from Tel Aviv University and Northwestern
        University.
