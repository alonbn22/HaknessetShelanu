    title:
      he: ממנסחי החקיקה בכנסת בעניין אונר"א
      en: Among the sponsors of the Knesset's UNRWA legislation
    description:
      he: מלינובסקי נמנתה עם מנסחי ויוזמי החקיקה בכנסת בעניין אונר"א (סוכנות הסעד
        והתעסוקה של האו"ם לפליטים פלסטינים). ב-28 באוקטובר 2024 אישרה הכנסת ברוב
        של 92 מול 10 חוק האוסר על אונר"א לפעול בשטח הריבוני של מדינת ישראל, וכן
        חוק נוסף שמלינובסקי נמנתה עם מחבריו האוסר על רשויות המדינה לקיים מגע עם
        הסוכנות.
      en: Malinovsky was among the sponsors and co-authors of Knesset legislation
        concerning UNRWA (the UN Relief and Works Agency for Palestine
        Refugees). On 28 October 2024 the Knesset approved, by a vote of 92 to
        10, a law barring UNRWA from operating in sovereign Israeli territory,
        as well as an accompanying law she co-authored prohibiting state
        authorities from any contact with the agency.
    date: 2024-10-28
