  - kind: positive
    category: achievement
    title:
      he: שירת בחטיבת הצנחנים ובמלחמת לבנון השנייה
      en: Served in the IDF Paratroopers Brigade, including the 2006 Lebanon War
    description:
      he: >-
        אליהו שירת כלוחם בגדוד 202 של חטיבת הצנחנים, ובמילואים לחם במלחמת לבנון
        השנייה בשנת 2006. לאחר מכן לימד בישיבה התיכונית בחיספין (2009-2013).
      en: >-
        Eliyahu served as a combat soldier in the Paratroopers Brigade's 202nd
        Battalion and fought as a reservist in the 2006 Second Lebanon War. He later
        taught at the Hispin yeshiva high school (2009-2013).
