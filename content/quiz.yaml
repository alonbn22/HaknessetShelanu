        quote:
          he: "\"נחוקק חוק נישואין אזרחיים… נאבק על מרחב ציבורי חופשי ונקדם תחבורה ציבורית בשבת.\""
          en: "\"We will legislate civil marriage… fight for a free public space and advance public transport on Shabbat.\""
