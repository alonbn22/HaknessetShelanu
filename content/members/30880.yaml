    title:
      he: עתר לבג"ץ עם ארגון לביא נגד עיסוק היועמ"שית בפרשת הפצ"רית; בג"ץ הורה לה להשיב
      en: Petitioned the High Court with the Lavi organization over the Attorney General's involvement in the Military Advocate General affair; the court ordered her to respond
    description:
      he: בנובמבר 2025, עם התפוצצות פרשת הפצ"רית והדלפת סרטון שדה תימן, עתר בוארון יחד עם ארגון לביא לבג"ץ בדרישה שהיועצת המשפטית לממשלה תימנע מעיסוק בחקירה. בליל 4–5 בנובמבר 2025 הורה המשנה לנשיא בית המשפט העליון, השופט נעם סולברג, ליועמ"שית להשיב לעותרים בתוך 36 שעות מדוע לא תימנע מכל עיסוק בחקירה.
      en: In November 2025, as the Military Advocate General affair and the leak of the Sde Teiman video erupted, Boaron petitioned the High Court of Justice together with the Lavi organization, demanding that the Attorney General refrain from involvement in the investigation. On the night of 4–5 November 2025, Deputy Chief Justice Noam Sohlberg ordered the Attorney General to respond to the petitioners within 36 hours as to why she would not refrain from any involvement in the investigation.
    sources:
      - url: https://www.israelhayom.co.il/news/law/article/19170961
        title: 'בג"ץ ליועמ"שית: הסבירי למה את ממשיכה לעסוק בפרשת הפצ"רית'
        publisher: Israel Hayom
