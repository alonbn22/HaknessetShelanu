      he: סגן ראש המחלקה לחקירות שוטרים (מח"ש)
      en: Deputy head of the Police Internal Investigations Department
    description:
      he: לפני כניסתו לפוליטיקה שירת משה סעדה שנים רבות במחלקה לחקירות שוטרים (מח"ש) שבמשרד המשפטים, בהן כסגן ראש המחלקה, ובשנת 2016 אף מילא בפועל את מקום ראש המחלקה. סעדה הוא עורך דין בהכשרתו.
      en: Before entering politics, Moshe Saada served for years in the Justice Ministry's Police Internal Investigations Department (Mahash), including as deputy head of the department, and in 2016 also served as acting head. Saada is a lawyer by training.
