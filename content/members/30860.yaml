    title:
      he: כתב אישום על חשיפת זהות עובד שב"כ; הכנסת העניקה חסינות
      en: Charged with disclosing a Shin Bet officer's identity; Knesset granted
        immunity
    description:
      he: במאי 2026 הגישה היועצת המשפטית לממשלה כתב אישום נגד גוטליב בגין חשיפה ופרסום
        של מידע חסוי בניגוד לחוק השב"כ, לאחר שלפי כתב האישום פרסמה את זהותו של
        בן זוגה של מנהיגת המחאה שקמה ברסלר כעובד השב"כ. ב-17 ביוני 2026 העניקה
        מליאת הכנסת לגוטליב חסינות מהעמדה לדין (בהצבעות 61-48 ו-62-48). התיק טרם
        הוכרע לגופו וחלה חזקת החפות.
      en: In May 2026 the Attorney General filed an indictment against Gotliv for
        disclosing and publishing classified information in violation of the
        Shin Bet law, after she allegedly published the identity of protest
        leader Shikma Bressler's partner as a Shin Bet employee. On 17 June 2026
        the Knesset plenum granted Gotliv immunity from prosecution (by votes of
        61-48 and 62-48). The case has not been adjudicated on the merits and
        the presumption of innocence applies.
