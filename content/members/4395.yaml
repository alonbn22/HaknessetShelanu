  - kind: negative
    category: controversy
    date: 2023-11-11
    title:
      he: 'התבטאות "נכבה של עזה 2023" בראיון טלוויזיוני במהלך המלחמה'
      en: '"Gaza Nakba 2023" remark in a television interview during the war'
    description:
      he: 'בראיון לחדשות 12 ב-11 בנובמבר 2023, כשנשאל אם תמונות הפינוי מצפון רצועת עזה מזכירות את הנכבה, אמר דיכטר: "אנחנו עכשיו מגלגלים את נכבה עזה... נכבה עזה 2023, ככה זה ייגמר", והסביר זאת בצורך מבצעי לפנות אוכלוסייה אזרחית משטח הלחימה. למחרת אמר ראש הממשלה נתניהו בישיבת הממשלה כי "לכל מילה יש משמעות" וכי שרים צריכים להיזהר בדבריהם, על רקע התבטאויות שנתפסו כפוגעות בלגיטימציה הבינלאומית של ישראל.'
      en: 'In a Channel 12 interview on 11 November 2023, asked whether images of the evacuation of northern Gaza resembled the Nakba, Dichter said: "We are now rolling out the Gaza Nakba... Gaza Nakba 2023. That is how it will end," framing it as an operational need to move civilians out of the combat zone. The next day Prime Minister Netanyahu told the cabinet that "every word has meaning" and that ministers should speak with care, against the backdrop of remarks seen as damaging Israel''s international legitimacy.'
    sources:
