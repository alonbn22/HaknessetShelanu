      en: "On 4 September 2026 Erdan announced that Unity would not run in the 27 October election after polls showed it failing to cross the threshold, ending Edelstein's bid as well; he will not run for the next Knesset. Although on 7 August he said he would submit a resignation letter from the Knesset \"in the coming days\", Walla reported on 4 September that no letter had been submitted and he remains a serving MK."
