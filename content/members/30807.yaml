  - kind: negative
    category: investigation
    status: ongoing
    date: "2026-07-09"
    title:
      he: נחקר במשטרה בחשד להדלפת פרוטוקול חסוי מוועדת החוץ והביטחון; התיק ממתין להכרעת הפרקליטות
      en: Questioned by police over alleged leak of a classified Foreign Affairs and Defense Committee protocol; case awaiting a prosecution decision
    description:
      he: ב-7 באפריל 2025 נחקר ח"כ גלעד קריב תחת אזהרה ביחידת להב 433 בחשד להדלפת פרוטוקול מדיון חסוי של ועדת החוץ והביטחון מיוני 2023, בעקבות תלונה של יו"ר הכנסת אמיר אוחנה. קריב הכחיש כל עוולה, מסר כי "מעולם לא פגעתי בביטחון המדינה" וכי הציטוטים אושרו לפרסום בצנזורה, וטען שהתלונה פוליטית ופוגעת בחסינות הפרלמנטרית. ביולי 2025 הסתיימה החקירה והתיק הועבר לפרקליטות המדינה לבחינת הגשת כתב אישום. ב-9 ביולי 2026 עתר ארגון "לביא" לבג"ץ בדרישה שרשויות האכיפה יכריעו בתיק, בטענה לשיהוי; נכון לספטמבר 2026 לא הוגש כתב אישום ולא פורסמה החלטה סופית. חלה חזקת החפות.
      en: On 7 April 2025, MK Gilad Kariv was questioned under caution by the Lahav 433 unit on suspicion of leaking a protocol from a June 2023 classified session of the Knesset Foreign Affairs and Defense Committee, following a complaint by Knesset Speaker Amir Ohana. Kariv denied any wrongdoing, stating he "never harmed Israel's security" and that the quoted material had been cleared by military censors, and called the complaint political and a breach of parliamentary immunity. In July 2025 the investigation concluded and the file was transferred to the State Attorney's Office to decide on an indictment. On 9 July 2026 the Lavi organization petitioned the High Court of Justice to compel the enforcement authorities to decide the case, alleging undue delay; as of September 2026 no indictment has been filed and no final decision has been published. The presumption of innocence applies.
    sources:
